ages = { min = 15.0, max = 16.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Jgst. 10 (ISB) — acid-carbonate reactions in everyday contexts"

[[reaction.curriculum]]
system = "england-gcse-combined-science"
stage = "GCSE Combined Science: Trilogy (AQA 8464), 4.4.2 Reactions of acids"
ages = { min = 14.0, max = 16.0 }
source = "AQA GCSE Combined Science: Trilogy specification (8464), Section 4.4.2 — reactions of acids with metal carbonates"

[reaction.setup]
script = """
add v1 water 200mL
add v1 CaCO3 1g
add v1 HCl 0.03mol
"""

[reaction.expect]
events = ["dissolved:CaCO3", "gas_evolved:CO2"]
ph = { min = 1.2, max = 1.6 }

[reaction.expect.predict]
question = "A gram of chalk sits in water, barely dissolving. You pour in hydrochloric acid. What happens to the chalk?"
question_de = "Ein Gramm Kreide liegt in Wasser und löst sich kaum. Du gießt Salzsäure hinzu. Was passiert mit der Kreide?"
options = [
  "Nothing — insoluble is insoluble",
  "It fizzes away completely; the acid destroys the carbonate and the gas escapes",
  "It dissolves slowly but the solid stays; acid cannot dissolve a solid",
]
answer = 1
misconception = "\"Insoluble\" reads as an absolute property of a substance, when it is a statement about one particular equilibrium. Chalk is insoluble *in water*. Acid does not dissolve it — acid removes one of its ions from the equilibrium by turning carbonate into escaping carbon dioxide, and the solid follows. Le Chatelier, applied to a solid, is how limescale removers and how caves work."
misconception_de = "\"Unlöslich\" liest sich wie eine absolute Eigenschaft eines Stoffes, dabei ist es eine Aussage über ein bestimmtes Gleichgewicht. Kreide ist unlöslich *in Wasser*. Säure löst sie nicht auf — Säure entzieht dem Gleichgewicht eines ihrer Ionen, indem sie Carbonat in entweichendes Kohlendioxid umwandelt, und der Feststoff folgt. Le Chatelier, angewendet auf einen Feststoff, ist genau das, wie Entkalker und wie Höhlen funktionieren."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "'Insoluble' is an absolute property, like being made of stone: no liquid can move what water cannot."
reveals_de = "'Unlöslich' gilt als absolute Eigenschaft, so wie aus Stein zu sein: Keine Flüssigkeit kann bewegen, was Wasser nicht bewegen kann."
next = "Start with `chalk-in-water`: even plain water moves 0.24% of it, so the absolute was never absolute. The acid then removes carbonate from the equilibrium as escaping gas, and the solid follows its own ions — watch the whole gram fizz away on this bench."
next_de = "Beginne mit `chalk-in-water`: Sogar reines Wasser bewegt 0,24 % davon, das Absolute war also nie absolut. Die Säure entzieht dem Gleichgewicht dann Carbonat als entweichendes Gas, und der Feststoff folgt seinen eigenen Ionen — beobachte, wie das ganze Gramm an diesem Labor sprudelnd verschwindet."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Solids can shed ions but never disappear in this picture — dissolution nibbles at a permanent fixture, so the heap must survive whatever the liquid does."
reveals_de = "Feststoffe können Ionen abgeben, aber in diesem Bild nie verschwinden — Lösen knabbert nur an einem dauerhaften Bestandteil, also muss der Haufen überleben, was auch immer die Flüssigkeit tut."
next = "Weigh the vessel before and after (`measure v1 balance`): the CO₂'s mass has left through the open top, and pouring the result through filter paper catches nothing, because nothing solid is left to catch."
next_de = "Wiege das Gefäß vorher und nachher (`measure v1 balance`): Die Masse des CO₂ hat das Gefäß durch die offene Öffnung verlassen, und gießt man das Ergebnis durch Filterpapier, bleibt nichts hängen, weil kein Feststoff mehr übrig ist, den man auffangen könnte."

[reaction.registers]
lv1 = "The chalk that would not dissolve in water vanishes in seconds with a hiss when the acid goes in. This is how a limescale remover works, and how caves are carved out of limestone."
lv1_de = "Die Kreide, die sich in Wasser nicht auflösen wollte, verschwindet innerhalb von Sekunden zischend, sobald die Säure hinzukommt. So funktioniert ein Entkalker, und so werden Höhlen aus Kalkstein herausgeschnitzt."
lv2 = "CaCO₃ + 2 HCl → CaCl₂ + H₂O + CO₂↑. 0.01 mol of chalk needs 0.02 mol of acid; the 0.03 mol used leaves 0.01 mol spare, so the finished solution is strongly acidic at pH ≈ 1.4."
lv2_de = "CaCO₃ + 2 HCl → CaCl₂ + H₂O + CO₂↑. 0,01 mol Kreide benötigen 0,02 mol Säure; die eingesetzten 0,03 mol lassen 0,01 mol übrig, sodass die fertige Lösung mit pH ≈ 1,4 stark sauer ist."
lv3 = "The engine dissolves 0.00997 of the 0.00999 mol present and vents 0.00999 mol of CO₂ — the calcite saturation index has been driven far negative by the removal of carbonate, so the amount-limited phase runs out rather than reaching equilibrium. The residual dissolved CO₂ (1.3 × 10⁻⁵ mol/kgw) is fixed by Henry's law against the room, not by the reaction."
lv3_de = "Die Engine löst 0,00997 der vorhandenen 0,00999 mol und entgast 0,00999 mol CO₂ — der Sättigungsindex des Calcits wurde durch den Entzug von Carbonat weit ins Negative getrieben, sodass die mengenbegrenzte Phase ausgeht, statt ein Gleichgewicht zu erreichen. Das verbleibende gelöste CO₂ (1,3 × 10⁻⁵ mol/kgw) wird durch das Henry-Gesetz gegenüber dem Raum festgelegt, nicht durch die Reaktion."

[reaction.provenance]
source = "Standard curriculum acid–carbonate reaction; calcite and carbonate constants from PHREEQC wateq4f.dat (USGS). Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "PHREEQC via Kerotakis L2"

# -------------------------------------------------- how insoluble is insoluble

[[reaction]]
id = "chalk-in-water"
spine = ["chemisches-gleichgewicht"]
equation = "CaCO₃(s) ⇌ Ca²⁺ + CO₃²⁻   (K_sp ≈ 3.3 × 10⁻⁹)"
concepts = ["sparingly-soluble-salts", "saturation-index"]
requires = ["solubility-limit"]
apparatus = ["beaker", "balance", "ph-meter"]
calculations = ["concentration"]
models = ["equilibrium"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium NTG Jgst. 8, LB2 Stoffe und ihre Eigenschaften (23 Std.)"
ages = { min = 13.0, max = 14.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium NTG Jgst. 8 (ISB) — solubility as a substance property"

[reaction.setup]
script = """
add v1 water 200mL
add v1 CaCO3 1g
"""

[reaction.expect]
events = ["dissolved:CaCO3"]
ph = { min = 9.7, max = 10.1 }

[reaction.expect.predict]
question = "A gram of chalk is stirred into 200 mL of water and left. How much dissolves?"
question_de = "Ein Gramm Kreide wird in 200 mL Wasser eingerührt und stehen gelassen. Wie viel davon löst sich?"
options = [
  "None at all — chalk is insoluble",
  "About a quarter of a percent of it — a tiny but real amount, and it makes the water alkaline",
  "All of it, given long enough",
]
answer = 1
misconception = "\"Insoluble\" is taught as zero and is never zero. The engine dissolves 0.24% of the chalk here — 2.4 × 10⁻⁵ mol — and that trace is enough to lift the pH to almost 10, because carbonate is a base. Every \"insoluble\" salt has a solubility product, and treating it as zero makes the whole of qualitative analysis look like magic instead of arithmetic."
misconception_de = "\"Unlöslich\" wird als null gelehrt und ist nie null. Die Engine löst hier 0,24 % der Kreide — 2,4 × 10⁻⁵ mol —, und diese Spur reicht aus, um den pH-Wert auf fast 10 zu heben, weil Carbonat eine Base ist. Jedes \"unlösliche\" Salz hat ein Löslichkeitsprodukt, und es als null zu behandeln lässt die gesamte qualitative Analyse wie Magie statt wie Rechnung aussehen."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "'Insoluble' means zero, a category rather than a quantity — so the water above the chalk is just water."
reveals_de = "'Unlöslich' bedeutet null, eine Kategorie statt einer Größe — das Wasser über der Kreide ist also einfach nur Wasser."
next = "Put the meter in the 'just water': it reads almost 10. Zero dissolved cannot move a pH meter three units; the 2.4 × 10⁻⁵ mol that actually dissolved can, because carbonate is a base. The meter is the instrument that catches what the eye files as nothing."
next_de = "Halte das Messgerät ins 'nur Wasser': Es zeigt fast 10. Null Gelöstes kann ein pH-Meter nicht um drei Einheiten bewegen; die tatsächlich gelösten 2,4 × 10⁻⁵ mol können es, weil Carbonat eine Base ist. Das Messgerät ist das Instrument, das erfasst, was das Auge als nichts abtut."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Dissolution as patience: solubility is a speed, so anything dissolves eventually, given stirring and time. Saturation — an equilibrium ceiling — is not in the picture."
reveals_de = "Lösen als Geduldsspiel: Löslichkeit gilt als Geschwindigkeit, also löst sich alles irgendwann, bei genügend Rühren und Zeit. Sättigung — eine Gleichgewichtsobergrenze — kommt in diesem Bild nicht vor."
next = "`wait` as long as you like: the dissolved amount stops at the same ceiling and the heap stays. Then run `crystallising-salt-from-brine` — moving the boundary takes changing the *water*, not waiting longer, because the ceiling is an equilibrium, not a queue."
next_de = "`wait` so lange du willst: Die gelöste Menge bleibt bei derselben Obergrenze stehen, und der Haufen bleibt liegen. Führe dann `crystallising-salt-from-brine` aus — die Grenze zu verschieben erfordert, das *Wasser* zu ändern, nicht länger zu warten, denn die Obergrenze ist ein Gleichgewicht, keine Warteschlange."

[reaction.registers]
lv1 = "The chalk just sits there. It looks like nothing happened — but dip a pH strip in and the water has turned alkaline. A tiny bit did dissolve, too little to see."
lv1_de = "Die Kreide liegt einfach nur da. Es sieht so aus, als wäre nichts passiert — aber taucht man einen pH-Streifen hinein, hat sich das Wasser alkalisch gefärbt. Ein winziges bisschen hat sich tatsächlich gelöst, zu wenig, um es zu sehen."
lv2 = "Calcium carbonate is sparingly soluble: 2.4 × 10⁻⁵ mol dissolves in 200 mL, about 0.24% of what was added. The dissolved carbonate hydrolyses, so the water reaches pH ≈ 9.9."
lv2_de = "Calciumcarbonat ist schwer löslich: 2,4 × 10⁻⁵ mol lösen sich in 200 mL, etwa 0,24 % der zugegebenen Menge. Das gelöste Carbonat hydrolysiert, sodass das Wasser pH ≈ 9,9 erreicht."
lv3 = "Computed as a saturation-index problem, not from a memorised solubility: the calcite phase is amount-limited and dissolves until SI = 0. The pH of 9.91 is the carbonate hydrolysis of that trace, which is why hard-water streams running over limestone are alkaline while running almost clear."
lv3_de = "Berechnet als Sättigungsindex-Problem, nicht aus einer auswendig gelernten Löslichkeit: Die Calcit-Phase ist mengenbegrenzt und löst sich, bis SI = 0. Der pH-Wert von 9,91 ist die Carbonat-Hydrolyse dieser Spur, weshalb Bäche mit hartem Wasser, die über Kalkstein fließen, alkalisch sind, während sie fast klar bleiben."

