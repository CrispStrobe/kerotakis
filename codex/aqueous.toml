# --------------------------------------------------------------- hardness

[[reaction]]
id = "softening-with-washing-soda"
spine = ["wasser-trinkwasser-und-mehr"]
equation = "Ca²⁺ + CO₃²⁻ → CaCO₃(s)↓"
concepts = ["water-softening", "double-displacement"]
requires = ["hard-water", "precipitation"]
apparatus = ["beaker", "filter-funnel", "ph-meter"]
calculations = ["moles-from-mass", "titration-stoichiometry"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 10, LB4 Protonenübergänge/Säure-Base-Reaktionen (18 Std.)"
ages = { min = 15.0, max = 16.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Jgst. 10 (ISB) — water softening as a precipitation application"

[reaction.setup]
script = """
add v1 water 1000mL
add v1 Na2CO3 5.3g
add v1 CaCl2 5.5g
"""

[reaction.expect]
events = ["precipitated:CaCO3", "dissolved:CaCl2"]
ph = { min = 9.9, max = 10.3 }

[reaction.expect.predict]
question = "Hard water is water carrying dissolved calcium. Washing soda is added to soften it. Where does the calcium go?"
question_de = "Hartes Wasser ist Wasser, das gelöstes Calcium mit sich trägt. Waschsoda wird zugegeben, um es zu enthärten. Wohin geht das Calcium?"
options = [
  "It is destroyed by the soda",
  "It falls out of the water as solid chalk, which can be filtered or left behind in the machine",
  "It stays dissolved but is somehow 'deactivated'",
]
answer = 1
misconception = "Softening sounds like removing a property, so learners imagine the calcium being neutralised in place. Nothing is destroyed and nothing is deactivated: the calcium is moved from the solution to a solid. 99.8% of it here. That solid is the grey sludge in the washing machine — softening trades dissolved hardness for a precipitate you can separate."
misconception_de = "Enthärten klingt danach, eine Eigenschaft zu entfernen, sodass Lernende sich vorstellen, das Calcium werde an Ort und Stelle neutralisiert. Nichts wird zerstört und nichts wird deaktiviert: Das Calcium wird von der Lösung in einen Feststoff verschoben. Hier sind es 99,8 % davon. Dieser Feststoff ist der graue Schlamm in der Waschmaschine — Enthärten tauscht gelöste Härte gegen einen Niederschlag, den man abtrennen kann."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Matter vanishes when treated: the soda 'destroys' the calcium the way the acid and base 'destroyed' each other — conservation suspended wherever a problem is solved."
reveals_de = "Materie verschwindet bei Behandlung: Die Soda 'zerstört' das Calcium so, wie Säure und Base einander 'zerstörten' — die Erhaltung der Materie wird immer dann außer Kraft gesetzt, wenn ein Problem gelöst wird."
next = "Filter and weigh (`filtering-a-precipitate` is the move): the calcium is sitting in the funnel as chalk, 99.8% of it, and the ledger balances to the milligram. Destruction would leave the funnel empty and the books short."
next_de = "Filtriere und wiege (`filtering-a-precipitate` ist der richtige Schritt): Das Calcium liegt zu 99,8 % als Kreide im Trichter, und die Bilanz stimmt bis aufs Milligramm. Zerstörung würde den Trichter leer und die Bücher unausgeglichen lassen."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Chemistry by switch-off: the calcium stays where it was but its hardness property is toggled away — properties as flags on a substance rather than consequences of where it is."
reveals_de = "Chemie per Ausschalter: Das Calcium bleibt, wo es war, aber seine Härte-Eigenschaft wird weggeschaltet — Eigenschaften als Schalter an einem Stoff statt als Folge davon, wo er sich befindet."
next = "`inspect` the solution after softening: the dissolved calcium is genuinely gone from the inventory, and a solid appeared in the same step, mole for mole. Deactivation-in-place would show it still dissolved — the bench has nowhere to hide a flag."
next_de = "`inspect` die Lösung nach dem Enthärten: Das gelöste Calcium ist tatsächlich aus dem Bestand verschwunden, und im selben Schritt erschien ein Feststoff, Mol für Mol. Eine Deaktivierung an Ort und Stelle würde es weiterhin gelöst zeigen — das Labor hat nirgendwo einen Schalter zu verstecken."

[reaction.registers]
lv1 = "Hard water will not lather. Stir in washing soda and the water goes cloudy — the hardness has turned into a white powder you can filter away, and now the soap works."
lv1_de = "Hartes Wasser schäumt nicht. Rühre Waschsoda ein, und das Wasser wird trüb — die Härte hat sich in ein weißes Pulver verwandelt, das du herausfiltern kannst, und jetzt funktioniert die Seife."
lv2 = "Na₂CO₃ + CaCl₂ → CaCO₃↓ + 2 NaCl. 0.05 mol of each removes 0.0495 mol of calcium as solid carbonate, leaving 0.0001 mol dissolved — a 99.8% removal, with sodium chloride left behind in solution."
lv2_de = "Na₂CO₃ + CaCl₂ → CaCO₃↓ + 2 NaCl. Je 0,05 mol entfernen 0,0495 mol Calcium als festes Carbonat und lassen 0,0001 mol gelöst zurück — eine Entfernung von 99,8 %, wobei Natriumchlorid in Lösung zurückbleibt."
lv3 = "Computed as a saturation problem: calcite precipitates until SI = 0, and the residue is set by K_sp and the remaining carbonate, giving [Ca²⁺] = 1.0 × 10⁻⁴ mol/kgw at pH 10.13. The exchange of hardness for sodium is exactly why softened water is not recommended for drinking on a low-sodium diet."
lv3_de = "Berechnet als Sättigungsproblem: Calcit fällt aus, bis SI = 0, und der Rest wird durch K_sp und das verbleibende Carbonat festgelegt, was [Ca²⁺] = 1,0 × 10⁻⁴ mol/kgw bei pH 10,13 ergibt. Genau dieser Tausch von Härte gegen Natrium ist der Grund, warum enthärtetes Wasser bei natriumarmer Ernährung nicht zum Trinken empfohlen wird."

