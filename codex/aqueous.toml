[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 12, LB2 Protolysegleichgewichte"
ages = { min = 17.0, max = 18.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Oberstufe (ISB) — buffer systems are named content"

[reaction.setup]
script = """
add v1 water 1000mL
add v1 H3PO4 0.1mol
add v1 NaOH 0.15mol
"""

[reaction.expect]
ph = { min = 6.4, max = 6.9 }

[reaction.expect.predict]
question = "Half-way between the first and second equivalence points of phosphoric acid, the textbook rule says pH = pKa₂ ≈ 7.2. The engine computes 6.64. Why the gap?"
question_de = "Auf halbem Weg zwischen dem ersten und zweiten Äquivalenzpunkt der Phosphorsäure sagt die Lehrbuchregel pH = pKa₂ ≈ 7,2. Die Engine berechnet 6,64. Woher kommt die Lücke?"
options = [
  "The engine is wrong — the Henderson–Hasselbalch equation is exact",
  "The two phosphate species carry different charges, so ionic-strength effects do not cancel and the measured pH sits below the tabulated pKa",
  "The base was added too fast",
]
answer = 1
misconception = "Henderson–Hasselbalch is treated as a law rather than as an approximation that assumes activity equals concentration. Here the ratio is between a 1− and a 2− ion whose activity coefficients are 0.76 and 0.32 — they do not cancel, and the half-neutralisation pH falls about half a unit below pKa₂. This is why real buffer recipes are checked with a meter, not calculated and trusted."
misconception_de = "Henderson-Hasselbalch wird als Gesetz behandelt statt als Näherung, die Aktivität mit Konzentration gleichsetzt. Hier steht das Verhältnis zwischen einem 1−- und einem 2−-Ion, deren Aktivitätskoeffizienten 0,76 und 0,32 betragen — sie heben sich nicht auf, und der pH-Wert bei Halbneutralisation fällt etwa eine halbe Einheit unter pKa₂. Deshalb werden echte Pufferrezepte mit einem Messgerät geprüft und nicht einfach berechnet und geglaubt."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Henderson–Hasselbalch is held as exact — an equation that appears in every textbook must be a law, so a meter that disagrees with it must be broken."
reveals_de = "Henderson-Hasselbalch wird als exakt angesehen — eine Gleichung, die in jedem Lehrbuch steht, muss ein Gesetz sein, also muss ein Messgerät, das ihr widerspricht, defekt sein."
next = "Compute the correction the 'law' assumed away: log(0.32/0.76) ≈ −0.38, and it comes straight from the two activity coefficients the equation set equal to one. Then compare `half-neutralised-vinegar`, where the pair is 0 and 1− charged and the same rule nearly works — the error grows with the charges, which an exact law's error must not."
next_de = "Berechne die Korrektur, die das 'Gesetz' wegdefiniert hat: log(0,32/0,76) ≈ −0,38, und sie ergibt sich direkt aus den beiden Aktivitätskoeffizienten, die die Gleichung gleich eins setzt. Vergleiche dann mit `half-neutralised-vinegar`, wo das Paar 0- und 1−-fach geladen ist und dieselbe Regel fast stimmt — der Fehler wächst mit den Ladungen, was der Fehler eines exakten Gesetzes nicht dürfte."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "A reading that misses the expected value is blamed on technique — equilibrium imagined as something a hurried hand can outrun, so the number would relax to 7.2 given care."
reveals_de = "Eine Messung, die vom erwarteten Wert abweicht, wird der Technik angelastet — Gleichgewicht wird sich als etwas vorgestellt, das eine hastige Hand überholen kann, sodass sich die Zahl bei sorgfältigem Arbeiten auf 7,2 einpendeln würde."
next = "Stir, `wait`, and measure again: the reading does not drift toward 7.2, because nothing is out of equilibrium. The gap lives in the equation's assumption, not in the hands — which is what makes it chemistry rather than clumsiness."
next_de = "Rühre, `wait`, und miss erneut: Die Anzeige wandert nicht in Richtung 7,2, denn nichts befindet sich außerhalb des Gleichgewichts. Die Lücke steckt in der Annahme der Gleichung, nicht in den Händen — genau das macht sie zu Chemie und nicht zu Ungeschicklichkeit."

[reaction.registers]
lv1 = "This mixture sits stubbornly near the pH of your own blood. Push acid or base at it and it barely moves — the same trick as the vinegar buffer, done with a different pair of partners."
lv1_de = "Diese Mischung bleibt hartnäckig nahe dem pH-Wert deines eigenen Bluts. Gibst du Säure oder Base hinzu, bewegt sie sich kaum — derselbe Trick wie beim Essigpuffer, nur mit einem anderen Partnerpaar."
lv2 = "Adding 1.5 mol of base per mole of H₃PO₄ converts half the dihydrogen phosphate to hydrogen phosphate. That 1:1 pair is the buffer of blood, of cell interiors and of most biology bench work, working around pKa₂."
lv2_de = "Die Zugabe von 1,5 mol Base pro Mol H₃PO₄ wandelt die Hälfte des Dihydrogenphosphats in Hydrogenphosphat um. Dieses 1:1-Paar ist der Puffer des Bluts, des Zellinneren und der meisten biologischen Laborarbeit, arbeitend um pKa₂ herum."
lv3 = "Computed pH 6.64, against a naive pKa₂ of 7.2. The engine's speciation shows why: H₂PO₄⁻ 5.0 × 10⁻², HPO₄²⁻ 3.4 × 10⁻², and NaHPO₄⁻ 1.7 × 10⁻² — an ion pair holding a third of the divalent species out of play. Charge-asymmetric buffers are where the constant-activity shortcut fails first."
lv3_de = "Berechneter pH-Wert 6,64, gegenüber einem naiven pKa₂ von 7,2. Die Speziation der Engine zeigt warum: H₂PO₄⁻ 5,0 × 10⁻², HPO₄²⁻ 3,4 × 10⁻² und NaHPO₄⁻ 1,7 × 10⁻² — ein Ionenpaar, das ein Drittel der zweifach geladenen Spezies aus dem Spiel nimmt. Ladungsasymmetrische Puffer sind der Ort, an dem die Abkürzung konstanter Aktivität zuerst versagt."

