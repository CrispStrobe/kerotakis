ages = { min = 17.0, max = 18.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Oberstufe (ISB) — salt hydrolysis as a protolysis equilibrium"

[reaction.setup]
script = """
add v1 water 100mL
add v1 NaOAc 8.2g
"""

[reaction.expect]
events = ["dissolved:NaOAc"]
ph = { min = 9.0, max = 9.4 }
