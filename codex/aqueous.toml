# --------------------------------------------------------------- hydrates

[[reaction]]
id = "gypsum-carries-water-in-its-crystals"
spine = ["salze"]
equation = "CaSO₄·2H₂O(s) ⇌ Ca²⁺ + SO₄²⁻ + 2 H₂O"
concepts = ["waters-of-crystallisation", "hydrates"]
requires = ["solubility-limit"]
apparatus = ["beaker", "balance"]
calculations = ["moles-from-mass", "percentage-composition"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium NTG Jgst. 8, LB2 Stoffe und ihre Eigenschaften (23 Std.)"
ages = { min = 13.0, max = 14.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium NTG Jgst. 8 (ISB) — crystal water and hydrates"

[reaction.setup]
script = """
add v1 water 1000mL
add v1 gypsum 5g
"""

[reaction.expect]
events = ["dissolved:gypsum"]
ph = { min = 6.9, max = 7.2 }

[reaction.expect.predict]
question = "Gypsum has the formula CaSO₄·2H₂O. When 5 g of it dissolves, the liquid volume in the beaker goes UP by more than the crystals' own volume. Why?"
question_de = "Gips hat die Formel CaSO₄·2H₂O. Wenn sich 5 g davon lösen, steigt das Flüssigkeitsvolumen im Becherglas um mehr als das Volumen der Kristalle selbst. Warum?"
options = [
  "The crystals were holding water inside them, and it joins the solution when they dissolve",
  "Dissolving always makes liquid, so any solid would do this",
  "It is a rounding error in the simulation",
]
answer = 0
misconception = "Formula water reads like decoration in the formula — a dot and some water molecules that surely do not count. They count: 172 g of gypsum is 36 g of water, 21% by mass. That water is inside the crystal lattice in fixed proportion, and it is released on dissolution. Plaster of Paris is exactly this water driven off and then let back in, which is why plaster sets."
misconception_de = "Kristallwasser liest sich wie Dekoration in der Formel — ein Punkt und ein paar Wassermoleküle, die sicher nicht zählen. Sie zählen: 172 g Gips sind 36 g Wasser, 21 % der Masse. Dieses Wasser sitzt in festem Verhältnis im Kristallgitter und wird beim Lösen freigesetzt. Gips für Verbände ist genau dieses Wasser, das ausgetrieben und dann wieder hineingelassen wird — deshalb erhärtet Gips."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "Dissolving as liquefaction: solids 'turn into liquid' when they dissolve, so any dissolving solid would raise the level — the specific water in this crystal plays no role."
reveals_de = "Lösen als Verflüssigung: Feststoffe 'werden flüssig', wenn sie sich lösen, also müsste jeder sich lösende Feststoff den Pegel heben — das spezifische Wasser in diesem Kristall spielt keine Rolle."
next = "Do the arithmetic the formula invites: 21% of these 5 g is about a gram of actual water, and the level rise matches that gram — not the 5 g. A solid that carries no formula water has no such gram to give."
next_de = "Mach die Rechnung, die die Formel nahelegt: 21 % dieser 5 g sind etwa ein Gramm echtes Wasser, und der Pegelanstieg entspricht diesem Gramm — nicht den 5 g. Ein Feststoff ohne Kristallwasser hat kein solches Gramm zu geben."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "When the simulation surprises, the simulation is wrong — the number is filed as noise rather than treated as a claim that can be checked."
reveals_de = "Wenn die Simulation überrascht, ist die Simulation falsch — die Zahl wird als Rauschen abgetan statt als überprüfbare Behauptung behandelt."
next = "Size the claim before dismissing it: a gram of water is many orders above any rounding floor, and `explain` shows the ledger balancing exactly when the crystal's 2 H₂O is counted as water. The habit this entry rewards is auditing a surprising number, not voting it away."
next_de = "Bemiss die Behauptung, bevor du sie verwirfst: Ein Gramm Wasser liegt viele Größenordnungen über jeder Rundungsschwelle, und `explain` zeigt, dass die Bilanz genau dann aufgeht, wenn das 2 H₂O des Kristalls als Wasser gezählt wird. Die Gewohnheit, die dieser Eintrag belohnt, ist eine überraschende Zahl zu prüfen, nicht sie wegzustimmen."

[reaction.registers]
lv1 = "Gypsum is the powder plaster casts are made of. It has water hidden inside the crystals — real water, locked in the pattern — and when the crystals dissolve, that water is set free."
lv1_de = "Gips ist das Pulver, aus dem Gipsverbände gemacht werden. Er hat Wasser im Inneren der Kristalle versteckt — echtes Wasser, eingeschlossen im Muster — und wenn sich die Kristalle lösen, wird dieses Wasser freigesetzt."
lv2 = "5 g of gypsum is 0.029 mol; only 0.0156 mol dissolves before the solution is saturated, so about 46% stays solid. Each mole that goes releases 2 mol of crystal water into the solvent, so the vessel's liquid inventory grows measurably."
lv2_de = "5 g Gips sind 0,029 mol; nur 0,0156 mol lösen sich, bevor die Lösung gesättigt ist, sodass etwa 46 % fest bleiben. Jedes Mol, das sich löst, setzt 2 mol Kristallwasser ins Lösungsmittel frei, sodass der flüssige Bestand des Gefäßes messbar wächst."
lv3 = "The hydrate waters are not curated: the engine derives them by matching the registry solid's formula against the database phase CaSO₄:2H₂O and moves 2 mol of H₂O between crystal and solvent per mole reacted. Computed pH 7.07 at I = 0.042 mol/kgw, with a third of the dissolved calcium present as the neutral CaSO₄(aq) ion pair — which is why gypsum's apparent solubility exceeds a free-ion K_sp estimate."
lv3_de = "Die Kristallwasser sind nicht kuratiert: Die Engine leitet sie ab, indem sie die Formel des Registry-Feststoffs mit der Datenbankphase CaSO₄:2H₂O abgleicht und pro umgesetztem Mol 2 mol H₂O zwischen Kristall und Lösungsmittel verschiebt. Berechneter pH-Wert 7,07 bei I = 0,042 mol/kgw, wobei ein Drittel des gelösten Calciums als neutrales Ionenpaar CaSO₄(aq) vorliegt — weshalb die scheinbare Löslichkeit von Gips über einer Schätzung mit freien Ionen und K_sp liegt."

[reaction.provenance]
source = "Standard curriculum hydrates and water of crystallisation; gypsum phase, stoichiometry and hydrate waters derived from PHREEQC wateq4f.dat (USGS). Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
