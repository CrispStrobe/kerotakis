# The Kerotakis codex — solutions: what dissolves, what falls out, what
# fizzes, and what the pH meter says about it.
#
# Companion to inorganic.toml. Everything here is aqueous-solution
# chemistry the L2 engine genuinely computes: solubility limits, solubility
# products, common-ion and complexation effects, acid–base speciation
# including polyprotic ladders and buffers, carbonate systems venting to an
# open atmosphere, hardness, hydrates, and the physical operations
# (dilution, evaporation, filtration) that a bench actually performs.
#
# Every entry is replayed through the real solvers by `kero codex lint`:
# the setup script runs, and the claimed observations, pH and temperature
# must actually occur. Every number below was read off the engine, not
# recalled from a textbook — and several of them disagree with the textbook
# on purpose, which is noted at lv3 where it happens.
#
# Licence: the codex is CC BY-SA 4.0, separately from the AGPL code.

# ------------------------------------------------------------------- bases

[[reaction]]
id = "strong-base"
spine = ["herstellung-von-sauren-und-alkalischen-loesungen"]
equation = "NaOH(s) → Na⁺(aq) + OH⁻(aq)"
concepts = ["bases", "strong-bases"]
requires = ["ph"]
apparatus = ["beaker", "ph-meter"]
calculations = ["concentration"]
models = ["ionic-bonding"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 10, LB4 Protonenübergänge/Säure-Base-Reaktionen (18 Std.)"
ages = { min = 15.0, max = 16.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Jgst. 10 (ISB); the placement of alkaline-solution preparation inside LB4 is the same reading used for `strong-acid` in inorganic.toml"

[reaction.setup]
script = """
add v1 water 1000mL
add v1 NaOH 0.001mol
"""

[reaction.expect]
events = ["dissolved:NaOH"]
ph = { min = 10.8, max = 11.2 }

[reaction.expect.predict]
question = "One thousandth of a mole of sodium hydroxide goes into one litre of water. What will the pH meter read?"
options = ["3", "7 — hydroxide is not an acid, so the pH cannot move", "11"]
answer = 2
misconception = "Answering 3 is the mirror-image slip: the exponent is right but the direction is not. A base raises pH as far above 7 as the matching acid lowers it below. Answering 7 treats pH as an acid-only scale, when it is a scale of hydrogen-ion activity that hydroxide moves by consuming H⁺."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "The arithmetic landed and the direction did not: 0.001 mol gave the exponent 3, and every exponent is read as acidity — as if dissolving anything moves the pH downwards."
next = "Run the mirror first: 0.001 mol of HCl in the same litre (`strong-acid`) reads pH 3.0 on this bench. Swap the acid for NaOH and the same exponent lands the same distance from 7 — on the other side."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "pH is held as a property acids have and other substances lack, so a base cannot move the meter — rather than a scale of hydrogen-ion activity, which hydroxide moves by consuming H⁺."
next = "Measure plain water first (7.0), then add the hydroxide in tenths with a reading between each: the meter climbs from the first addition, which a scale only acids can touch has no way to do."

[reaction.registers]
lv1 = "This liquid is the opposite of an acid. It feels slippery — that is your own skin dissolving very slightly — and it turns a red cabbage indicator green. Never touch it."
lv2 = "Sodium hydroxide is a strong base: it dissociates completely, so 0.001 mol in a litre gives [OH⁻] = 10⁻³, pOH 3, and pH 14 − 3 = 11."
lv3 = "The engine does not apply pH = 14 − pOH; it solves the charge balance with Kw at the solution's own temperature and reports 10.99, marginally below 11 because the activity coefficient of OH⁻ at I = 10⁻³ is ≈0.965."

[reaction.provenance]
source = "Standard curriculum acid–base chemistry; Kw and activity model from PHREEQC wateq4f.dat (USGS). Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "PHREEQC via Kerotakis L2"

[[reaction]]
id = "lye-warms-the-beaker"
spine = ["kalorimetrie"]
equation = "NaOH(s) → Na⁺(aq) + OH⁻(aq)   ΔH_dis = −44.5 kJ/mol"
concepts = ["exothermic-dissolution", "concentrated-solutions"]
requires = ["strong-bases", "enthalpy-of-solution"]
apparatus = ["beaker", "thermometer", "ph-meter"]
calculations = ["enthalpy-change", "concentration"]

[reaction.setup]
script = """
add v1 water 100mL
add v1 NaOH 4g
"""

[reaction.expect]
events = ["dissolved:NaOH"]
ph = { min = 13.35, max = 13.7 }
temperature_c = { min = 33.5, max = 38.0 }

[reaction.expect.predict]
question = "Four grams of drain cleaner (sodium hydroxide) go into 100 mL of cold water. What does the thermometer do?"
options = [
  "It rises by about 10 °C",
  "Nothing — dissolving is not a chemical reaction, so no heat is involved",
  "It falls, because the solid has to be pulled apart",
]
answer = 0
misconception = "Both wrong answers come from the same picture: dissolving as pure disassembly. Breaking the lattice does cost energy — but hydrating the ions pays more back, and for NaOH it pays back 44.5 kJ per mole. Whether a solution warms or cools is the balance of those two, which is why potassium chloride goes cold and this goes hot."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "Heat is reserved for 'real' chemical reactions, and dissolving is filed as mere mixing — the energy bookkeeping only opens once new substances are officially made."
next = "Watch the thermometer from the first pellet: the rise begins before anything could be called a product. Then run `cold-pack` beside it — potassium chloride moves the same thermometer the other way, so dissolving itself carries the heat, in both directions."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Half of the energy story: pulling the lattice apart costs, and the account stops there — so every dissolution must cool. The paying half, water binding to the freed ions, is missing."
next = "The comparison that isolates the missing half is `cold-pack` against this beaker: KCl really does cool the water, NaOH warms it. One lattice-breaking story cannot produce two signs; a second term must be paying in."

[reaction.registers]
lv1 = "The jar gets hot enough to be uncomfortable to hold — and nothing was burning and nothing was heated. The heat came out of the powder as it disappeared."
lv2 = "0.1 mol of NaOH in 100 mL releases about 4.5 kJ. With only ~100 g of water to warm, that is a rise of roughly 10 °C, and the resulting 1 mol/L solution reads pH ≈ 13.5 — not the 14.0 the arithmetic promises."
lv3 = "The vessel is adiabatic, so the whole −44.5 kJ/mol appears as sensible heat. The pH is 13.51 rather than 14.0, and *two* separate corrections take it there. First, at I ≈ 1 mol/kgw the activity coefficient of OH⁻ has fallen to ≈0.68, and the engine reports activity, not concentration. Second, the beaker warmed itself to 35.7 °C, and K_w is strongly temperature-dependent — pK_w falls from 14.00 at 25 °C to about 13.7 here — so the neutral point itself has moved under the measurement. The solution is solved at the temperature it actually reached rather than at the one it started from, which is why this number is lower than the textbook 13.8: the textbook figure quietly holds the beaker at 25 °C while telling you it got hot."

[reaction.provenance]
source = "Enthalpy of solution of NaOH, standard reference value; speciation and the temperature-dependent K_w from PHREEQC wateq4f.dat (USGS), solved at the temperature the dissolution itself produces. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "Kerotakis energy balance over curated ΔH_dis; pH from PHREEQC via Kerotakis L2"

# ---------------------------------------------------------- neutralisation

[[reaction]]
id = "neutralisation"
spine = ["neutralisationsreaktionen"]
equation = "HCl(aq) + NaOH(aq) → NaCl(aq) + H₂O"
concepts = ["neutralisation", "spectator-ions"]
requires = ["acids", "bases"]
apparatus = ["beaker", "burette", "ph-meter"]
calculations = ["moles-from-mass", "titration-stoichiometry"]
models = ["ionic-bonding"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 10, LB4 Protonenübergänge/Säure-Base-Reaktionen (18 Std.)"
ages = { min = 15.0, max = 16.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Jgst. 10 (ISB) — neutralisation is named content of LB4"

[reaction.setup]
script = """
add v1 water 1000mL
add v1 HCl 0.01mol
add v1 NaOH 0.01mol
"""

[reaction.expect]
events = ["dissolved:NaOH"]
ph = { min = 6.9, max = 7.1 }

[reaction.expect.predict]
question = "A litre of pH 2 acid gets exactly enough sodium hydroxide to match it. What is in the beaker afterwards?"
options = [
  "Nothing — the acid and the base destroyed each other",
  "Salt water: sodium and chloride ions in water, at pH 7",
  "A weaker acid, around pH 5",
]
answer = 1
misconception = "\"They cancel out\" is the commonest neutralisation mistake, and it quietly breaks conservation. Nothing is destroyed: H⁺ and OH⁻ combine into water, and the sodium and chloride ions are still there, untouched, as spectators. Put the beaker on a balance — it is heavier than before, not empty."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Neutralisation as mutual destruction — 'they cancel out' taken literally, so the matter itself is gone. Conservation has been quietly suspended for chemistry that feels dramatic."
next = "Put it on the balance: `measure v1 balance` before and after the base goes in. The beaker is heavier by exactly what was added — and evaporating it (`crystallising-salt-from-brine`) recovers the solid salt that was supposedly destroyed."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Neutralisation as dilution: the base merely waters the acid down, so the pH drifts partway up and stalls. The stoichiometric point — the last H⁺ meeting the last OH⁻ — has no special status in this picture."
next = "Add the base in ten portions with a pH reading between each. Watering-down would drift smoothly and stall below 7; the real curve crawls, then leaps across four units where both reservoirs run out together (`past-the-equivalence-point` is the far side of that leap)."

[reaction.registers]
lv1 = "Add the sour liquid and the slippery liquid together in just the right amounts and you get… salty water. Both of the dangerous things have turned into something you could (in principle) drink."
lv2 = "H⁺ + OH⁻ → H₂O. Equal moles of a strong acid and a strong base leave only the spectator ions Na⁺ and Cl⁻, so the solution is 0.01 mol/L sodium chloride at pH 7."
lv3 = "The engine reports 7.00 and carries the spectators explicitly: 0.01 mol each of Na⁺ and Cl⁻ remain in the inventory, [H⁺] = [OH⁻] = 1.10 × 10⁻⁷ mol/kgw with γ ≈ 0.90. The reaction is never written into the engine — it emerges from minimising the solution's free energy."

[reaction.provenance]
source = "Standard curriculum neutralisation. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "PHREEQC via Kerotakis L2"

[[reaction]]
id = "past-the-equivalence-point"
spine = ["saeure-base-titration-ein-analytisches-verfahren"]
summary = "HCl + 1.1 NaOH → NaCl + H₂O + 0.1 NaOH(excess)"
equation = "HCl + NaOH → NaCl + H₂O"
concepts = ["equivalence-point", "titration-curve"]
requires = ["neutralisation"]
apparatus = ["burette", "conical-flask", "ph-meter"]
calculations = ["titration-stoichiometry", "concentration"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 10, LB4 Protonenübergänge/Säure-Base-Reaktionen (18 Std.)"
ages = { min = 15.0, max = 16.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Jgst. 10 (ISB) — titration is named content of LB4"

[reaction.setup]
script = """
add v1 water 1000mL
add v1 HCl 0.01mol
add v1 NaOH 0.011mol
"""

[reaction.expect]
ph = { min = 10.7, max = 11.2 }

[reaction.expect.predict]
question = "You have neutralised the acid exactly, and then add 10% too much base. What happens to the pH?"
options = [
  "It creeps up to about 7.5",
  "It jumps to about 11",
  "It cannot go above 7, because the acid has already been used up",
]
answer = 1
misconception = "Expecting a gentle creep treats the pH scale as linear when it is logarithmic. Near the equivalence point there is almost nothing left to absorb the added hydroxide, so a 10% overshoot moves the pH by nearly four units — which is exactly why an indicator can mark an endpoint at all, and why one drop too many ruins a titration."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "The pH axis is read linearly: ten percent more base should buy a ten-percent-sized nudge. That the scale is logarithmic — and that nothing is left to absorb the excess — has not landed."
next = "Let the bench count what is left: 0.001 mol of unmatched hydroxide in a litre. That beaker already exists in this codex — `strong-base` — and it reads 11, not 7.5."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "pH stops at 7 because it is the acid's own property: with the acid used up there is nothing left to measure, and the excess base's effect on the water itself is invisible."
next = "Delete the acid from the story: plain water plus the same 0.001 mol of NaOH (`strong-base`) reads 11 on this bench. The overshot titration is that beaker plus spectator ions."

[reaction.registers]
lv1 = "One drop too many and the colour flies past the shade you wanted. Right at the balance point the liquid is on a knife edge: the tiniest extra tips it a very long way."
lv2 = "After equivalence the excess base sets the pH directly: 0.001 mol of leftover NaOH in a litre gives pOH 3, pH ≈ 11. The titration curve is nearly vertical here — that steepness is what makes the endpoint detectable."
lv3 = "The computed value is 10.95, not 11.00: the excess hydroxide sits in a 0.011 mol/kgw ionic medium, and its activity is below its concentration. The steepness is a property of the charge balance near the point where the strong-acid and strong-base reservoirs are both exhausted, not a curve fitted for teaching."

[reaction.provenance]
source = "Standard curriculum titration behaviour. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "PHREEQC via Kerotakis L2"

# ------------------------------------------------------------- polyprotic

[[reaction]]
id = "phosphoric-acid-three-protons"
spine = ["ph-wert-berechnungen"]
equation = "H₃PO₄ ⇌ H⁺ + H₂PO₄⁻ ⇌ 2 H⁺ + HPO₄²⁻ ⇌ 3 H⁺ + PO₄³⁻"
concepts = ["polyprotic-acids"]
requires = ["acids", "weak-acids"]
apparatus = ["beaker", "ph-meter"]
calculations = ["concentration", "ph-calculation"]
models = ["equilibrium"]

[reaction.setup]
script = """
add v1 water 1000mL
add v1 H3PO4 0.1mol
"""

[reaction.expect]
ph = { min = 1.5, max = 1.8 }

[reaction.expect.predict]
question = "Phosphoric acid has three acidic hydrogens. A 0.1 mol/L solution therefore behaves like…"
options = [
  "0.3 mol/L of a strong acid — pH about 0.5, since all three come off",
  "0.1 mol/L of a weak acid — pH about 1.6, because essentially only the first proton comes off",
  "0.1 mol/L of a strong acid — pH 1.0 exactly",
]
answer = 1
misconception = "Counting protons on the formula and multiplying is the classic polyprotic error. The three ionisations are separated by about five powers of ten each; releasing the second proton means pulling a positive charge off an already-negative ion, which is far harder. At pH 1.6 the second stage has barely begun — the engine finds HPO₄²⁻ at 3 × 10⁻⁴ mol/kgw against H₂PO₄⁻ at 10⁻¹."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Protons are counted off the formula and multiplied: three written hydrogens means three delivered, as if ionisation were a property of the formula rather than an equilibrium that gets harder with every charge already removed."
next = "Ask for the ladder itself at lv3: at pH 1.64 the second rung holds 3 × 10⁻⁴ mol/kgw against 10⁻¹ on the first — a thousand to one. All three rungs are real; the solution is simply standing on the first."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "One proton conceded, but conceded completely: 'acid' still implies full dissociation, so 0.1 mol/L must read 1.0 exactly. That most H₃PO₄ molecules are holding their first proton at any instant is missing."
next = "Run the acid for which this answer is nearly right: 0.1 mol of HCl in the same litre reads 1.08 on this bench, this beaker 1.64. The gap between those two numbers is the fraction of phosphoric acid that never let go."

[reaction.registers]
lv1 = "This is the sour taste in cola. It has three sour parts in it, but only the first one lets go easily — the other two hold on tight."
lv2 = "Only the first ionisation matters at this concentration (pKa₁ ≈ 2.15 against pKa₂ ≈ 7.2 and pKa₃ ≈ 12.3), so the solution behaves as a single weak acid and lands near pH 1.6."
lv3 = "The engine solves all three equilibria simultaneously rather than choosing one. The resulting distribution at pH 1.64 is H₂PO₄⁻ 9.9 × 10⁻², H₃PO₄ 4.3 × 10⁻⁴, HPO₄²⁻ 3.4 × 10⁻⁴, PO₄³⁻ below 10⁻⁹ — the ladder is real, it is simply almost entirely on its first rung."

[reaction.provenance]
source = "Standard curriculum polyprotic acid chemistry; stepwise constants from PHREEQC wateq4f.dat (USGS). Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "PHREEQC via Kerotakis L2"

[[reaction]]
id = "phosphate-buffer"
spine = ["puffersysteme"]
summary = "H₂PO₄⁻ / HPO₄²⁻ buffer (1.5 equivalents of base per H₃PO₄)"
equation = "H₂PO₄⁻ ⇌ H⁺ + HPO₄²⁻"
concepts = ["phosphate-buffer", "amphiprotic-ions"]
requires = ["polyprotic-acids", "buffers"]
apparatus = ["beaker", "burette", "ph-meter"]
calculations = ["titration-stoichiometry", "ph-calculation"]
models = ["equilibrium"]

[reaction.setup]
script = """
add v1 water 1000mL
add v1 H3PO4 0.1mol
add v1 NaOH 0.15mol
"""

[reaction.expect]
ph = { min = 6.4, max = 6.9 }

[reaction.expect.predict]
question = "Half-way between the first and second equivalence points of phosphoric acid, the textbook rule says pH = pKa₂ ≈ 7.2. The engine computes 6.64. Why the gap?"
options = [
  "The engine is wrong — the Henderson–Hasselbalch equation is exact",
  "The two phosphate species carry different charges, so ionic-strength effects do not cancel and the measured pH sits below the tabulated pKa",
  "The base was added too fast",
]
answer = 1
misconception = "Henderson–Hasselbalch is treated as a law rather than as an approximation that assumes activity equals concentration. Here the ratio is between a 1− and a 2− ion whose activity coefficients are 0.76 and 0.32 — they do not cancel, and the half-neutralisation pH falls about half a unit below pKa₂. This is why real buffer recipes are checked with a meter, not calculated and trusted."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Henderson–Hasselbalch is held as exact — an equation that appears in every textbook must be a law, so a meter that disagrees with it must be broken."
next = "Compute the correction the 'law' assumed away: log(0.32/0.76) ≈ −0.38, and it comes straight from the two activity coefficients the equation set equal to one. Then compare `half-neutralised-vinegar`, where the pair is 0 and 1− charged and the same rule nearly works — the error grows with the charges, which an exact law's error must not."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "A reading that misses the expected value is blamed on technique — equilibrium imagined as something a hurried hand can outrun, so the number would relax to 7.2 given care."
next = "Stir, `wait`, and measure again: the reading does not drift toward 7.2, because nothing is out of equilibrium. The gap lives in the equation's assumption, not in the hands — which is what makes it chemistry rather than clumsiness."

[reaction.registers]
lv1 = "This mixture sits stubbornly near the pH of your own blood. Push acid or base at it and it barely moves — the same trick as the vinegar buffer, done with a different pair of partners."
lv2 = "Adding 1.5 mol of base per mole of H₃PO₄ converts half the dihydrogen phosphate to hydrogen phosphate. That 1:1 pair is the buffer of blood, of cell interiors and of most biology bench work, working around pKa₂."
lv3 = "Computed pH 6.64, against a naive pKa₂ of 7.2. The engine's speciation shows why: H₂PO₄⁻ 5.0 × 10⁻², HPO₄²⁻ 3.4 × 10⁻², and NaHPO₄⁻ 1.7 × 10⁻² — an ion pair holding a third of the divalent species out of play. Charge-asymmetric buffers are where the constant-activity shortcut fails first."

[reaction.provenance]
source = "Standard curriculum buffer chemistry; phosphate constants and ion pairing from PHREEQC wateq4f.dat (USGS). Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "PHREEQC via Kerotakis L2"

[[reaction]]
id = "half-neutralised-vinegar"
spine = ["saeure-base-titration-ein-analytisches-verfahren"]
equation = "CH₃COOH + 0.5 NaOH → 0.5 CH₃COOH + 0.5 CH₃COO⁻ + 0.5 Na⁺ + 0.5 H₂O   (pH ≈ pKa)"
concepts = ["half-equivalence-point", "pka-measurement"]
requires = ["weak-acids", "neutralisation"]
apparatus = ["burette", "conical-flask", "ph-meter"]
calculations = ["titration-stoichiometry", "ph-calculation"]

[reaction.setup]
script = """
add v1 water 1000mL
add v1 CH3COOH 0.1mol
add v1 NaOH 0.05mol
"""

[reaction.expect]
events = ["dissolved:NaOH"]
ph = { min = 4.5, max = 4.8 }

[reaction.expect.predict]
question = "You titrate vinegar and stop exactly half-way. What does the pH reading tell you?"
options = [
  "Half of the starting pH — about 1.4",
  "The pKa of the acid, because acid and conjugate base are now present in equal amounts",
  "Nothing useful; only the endpoint carries information",
]
answer = 1
misconception = "Halving the pH treats a logarithm as a linear quantity. The half-equivalence point is the single most information-rich place on a weak-acid curve: with [HA] = [A⁻] the log-ratio term vanishes and the meter reads the acid's own pKa directly. It is how pKa values were measured before computers."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "pH is being divided like a length: half the acid neutralised, half the number left. That each unit is a factor of ten — so halving the pH would mean the acidity *squared* — is not in the picture."
next = "Run `dilution-by-ten` first: a full factor of ten buys exactly one pH unit. Getting from 2.9 to 1.4 would need the hydrogen-ion activity to rise thirtyfold while the acid is being consumed."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "A titration is held as a race to the jump: the curve on the way there is decoration, and only the endpoint carries a number worth writing down."
next = "Read the meter exactly here, at half-way: it reports the acid's own pKa — the constant that identifies *which* acid this is, and the one number the endpoint alone can never give you. The endpoint tells you how much; the plateau tells you what."

[reaction.registers]
lv1 = "Stop half-way through neutralising the vinegar and the liquid sits at pH 4.7 — and it will stubbornly stay near there. Half-done is the most stubborn place of all."
lv2 = "With equal amounts of CH₃COOH and CH₃COO⁻ present, pH = pKa = 4.76. This is a buffer at maximum capacity, and it is the standard laboratory method for measuring an unknown acid's pKa."
lv3 = "The engine reports 4.66, about a tenth of a unit below the thermodynamic pKa. At I = 0.049 mol/kgw the acetate ion's activity coefficient is 0.82 while the neutral acid's is 1.00; the ratio of activities is therefore not the ratio of concentrations, and the meter reads the difference."

