[reaction.setup]
script = """
add v1 water 1000mL
add v1 NaCl 0.58g
add v1 AgCl 1g
"""

[reaction.expect]
events = ["dissolved:NaCl"]
absent = ["dissolved:AgCl"]
ph = { min = 6.9, max = 7.1 }

[reaction.expect.predict]
question = "Silver chloride dissolves slightly in pure water. Put it in 0.01 mol/L salt water instead. Does more or less of it dissolve?"
question_de = "Silberchlorid löst sich leicht in reinem Wasser. Gibst du es stattdessen in 0,01-mol/L-Salzwasser, löst sich mehr oder weniger davon?"
options = [
  "More — there is already stuff dissolved, so the water is 'better at dissolving'",
  "Less — the chloride already present pushes the equilibrium back toward the solid",
  "The same — the solubility of a substance is a fixed number",
]
answer = 1
misconception = "The third option is the deeper error: solubility is treated as a property of the solid alone, like its melting point. It is a property of the *system*. Here the added chloride is one of the products, so by Le Chatelier the dissolution is pushed back — the engine finds no measurable dissolution at all, where pure water dissolved 1.4 × 10⁻⁵ mol. This is why gravimetric analysis washes a precipitate with dilute salt solution rather than with pure water."
misconception_de = "Die dritte Option ist der tiefer liegende Fehler: Löslichkeit wird als Eigenschaft allein des Feststoffs behandelt, wie sein Schmelzpunkt. Sie ist eine Eigenschaft des *Systems*. Hier ist das zugegebene Chlorid eines der Produkte, sodass das Lösen nach Le Chatelier zurückgedrängt wird — die Engine findet überhaupt keine messbare Lösung, wo reines Wasser 1,4 × 10⁻⁵ mol gelöst hatte. Deshalb wäscht die gravimetrische Analyse einen Niederschlag mit verdünnter Salzlösung statt mit reinem Wasser."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Dissolving is a skill the water has, and salty water is water warmed up to its task — what is already dissolved makes the solvent stronger, whatever it is."
reveals_de = "Lösen gilt als Fähigkeit, die das Wasser besitzt, und salziges Wasser ist Wasser, das für seine Aufgabe 'aufgewärmt' ist — was bereits gelöst ist, macht das Lösungsmittel stärker, egal was es ist."
next = "Make the spectator swap: try the same AgCl in 0.01 mol/L sodium *nitrate* — as much 'stuff' dissolved, but no shared ion, and the suppression vanishes. It was never about how loaded the water is; it is about which ion the load shares with the solid."
next_de = "Tausche das Zuschauerion aus: Versuche dasselbe AgCl in 0,01-mol/L-Natrium*nitrat* — genauso viel 'Zeug' gelöst, aber kein gemeinsames Ion, und die Unterdrückung verschwindet. Es ging nie darum, wie beladen das Wasser ist; es geht darum, welches Ion die Beladung mit dem Feststoff teilt."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Solubility is the solid's own constant, like its melting point — one substance, one number, whatever is swimming around it."
reveals_de = "Löslichkeit gilt als eigene Konstante des Feststoffs, wie sein Schmelzpunkt — ein Stoff, eine Zahl, egal was drumherum schwimmt."
next = "Run the trilogy: pure water dissolves 1.4 × 10⁻⁵ mol, this salt water dissolves nothing measurable, and `chloride-complexes-redissolve-silver` dissolves ten times *more* than pure water. One solid, three waters, three answers — a property of the solid alone cannot do that."
next_de = "Führe die Trilogie durch: Reines Wasser löst 1,4 × 10⁻⁵ mol, dieses Salzwasser löst nichts Messbares, und `chloride-complexes-redissolve-silver` löst das Zehnfache *mehr* als reines Wasser. Ein Feststoff, drei Wässer, drei Antworten — eine Eigenschaft allein des Feststoffs kann das nicht leisten."

[reaction.registers]
lv1 = "The same white powder, in water that already has a little salt in it, dissolves even less than before — so little that the lab records none at all."
lv1_de = "Dasselbe weiße Pulver löst sich in Wasser, das bereits ein wenig Salz enthält, sogar noch weniger als vorher — so wenig, dass das Labor überhaupt nichts verzeichnet."
lv2 = "Adding 0.01 mol/L Cl⁻ raises the chloride side of AgCl ⇌ Ag⁺ + Cl⁻, so the equilibrium shifts left. Dissolved silver falls roughly by the factor by which chloride rose, to below the engine's observable threshold."
lv2_de = "Die Zugabe von 0,01 mol/L Cl⁻ erhöht die Chloridseite von AgCl ⇌ Ag⁺ + Cl⁻, sodass sich das Gleichgewicht nach links verschiebt. Gelöstes Silber fällt etwa um den Faktor, um den Chlorid gestiegen ist, unter die beobachtbare Schwelle der Engine."
lv3 = "The suppression is computed from the ion-activity product against K_sp, not asserted. It is worth stating the boundary now: this monotonic suppression holds only while chloride stays low. Push it to 1 mol/L and the trend reverses — see `chloride-complexes-redissolve-silver`."
lv3_de = "Die Unterdrückung wird aus dem Ionenaktivitätsprodukt gegen K_sp berechnet, nicht behauptet. Es lohnt sich, die Grenze schon jetzt zu nennen: Diese monotone Unterdrückung gilt nur, solange das Chlorid niedrig bleibt. Steigert man es auf 1 mol/L, kehrt sich der Trend um — siehe `chloride-complexes-redissolve-silver`."

[reaction.provenance]
source = "Standard curriculum common-ion effect; constants from PHREEQC wateq4f.dat (USGS). Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "PHREEQC via Kerotakis L2"

[[reaction]]
id = "chloride-complexes-redissolve-silver"
spine = ["chemisches-gleichgewicht"]
equation = "AgCl(s) + Cl⁻ ⇌ AgCl₂⁻   (complexation beats the common-ion effect)"
concepts = ["complex-ions", "model-boundaries"]
requires = ["common-ion-effect"]
apparatus = ["beaker", "balance"]
models = ["equilibrium"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 12, LB2 Protolysegleichgewichte"
ages = { min = 17.0, max = 18.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Oberstufe (ISB) — complexation equilibria dissolving a precipitate"

[reaction.setup]
script = """
add v1 water 1000mL
add v1 NaCl 58.4g
add v1 AgCl 1g
"""

[reaction.expect]
events = ["dissolved:NaCl", "dissolved:AgCl"]
ph = { min = 6.8, max = 7.1 }

[reaction.expect.predict]
question = "The common-ion effect says extra chloride suppresses silver chloride's solubility. So in 1 mol/L brine — a hundred times more chloride — how much AgCl dissolves?"
question_de = "Der gemeinsame-Ionen-Effekt besagt, dass zusätzliches Chlorid die Löslichkeit von Silberchlorid unterdrückt. Wie viel AgCl löst sich also in 1-mol/L-Salzlösung — hundertmal mehr Chlorid?"
options = [
  "A hundred times less than in salt water, essentially nothing",
  "About ten times MORE than in pure water",
  "Exactly the same as in 0.01 mol/L salt water",
]
answer = 1
misconception = "This is the entry where a correct rule is caught failing, and that is the point. Le Chatelier applied to AgCl ⇌ Ag⁺ + Cl⁻ predicts suppression, and it is right at low chloride. But that equation is not the whole chemistry: at high chloride a second reaction opens, AgCl(s) + Cl⁻ → AgCl₂⁻, and it consumes the solid. The engine dissolves 1.5 × 10⁻⁴ mol here against 1.4 × 10⁻⁵ mol in pure water. A rule without its domain of validity is a trap, and this is the trap."
misconception_de = "Das ist der Eintrag, in dem eine korrekte Regel dabei ertappt wird, wie sie versagt, und genau darum geht es. Le Chatelier, angewendet auf AgCl ⇌ Ag⁺ + Cl⁻, sagt Unterdrückung voraus, und das stimmt bei niedrigem Chloridgehalt. Aber diese Gleichung ist nicht die gesamte Chemie: Bei hohem Chloridgehalt öffnet sich eine zweite Reaktion, AgCl(s) + Cl⁻ → AgCl₂⁻, und sie verbraucht den Feststoff. Die Engine löst hier 1,5 × 10⁻⁴ mol gegenüber 1,4 × 10⁻⁵ mol in reinem Wasser. Eine Regel ohne ihren Gültigkeitsbereich ist eine Falle, und das ist die Falle."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "The freshly learned rule, extrapolated without a domain: more suppressor, more suppression, linearly forever — one equation mistaken for the whole chemistry."
reveals_de = "Die gerade gelernte Regel, ohne Gültigkeitsbereich extrapoliert: mehr Unterdrücker, mehr Unterdrückung, linear für immer — eine Gleichung, die für die gesamte Chemie gehalten wird."
next = "Walk the ladder on the bench: 0.01, 0.1, then 1 mol/L chloride. The solubility falls, bottoms out, and climbs back past pure water as AgCl₂⁻ opens for business. A monotone rule cannot draw a U — a second reaction can."
next_de = "Gehe die Stufenleiter im Labor durch: 0,01, 0,1, dann 1 mol/L Chlorid. Die Löslichkeit fällt, erreicht einen Tiefpunkt und steigt dann über den Wert von reinem Wasser hinaus, sobald AgCl₂⁻ ins Spiel kommt. Eine monotone Regel kann kein U zeichnen — eine zweite Reaktion schon."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "The last correction has become the new absolute: once suppressed, always suppressed. The same move as 'solubility is a fixed number', one lesson later — a rule adopted without asking where it holds."
reveals_de = "Die letzte Korrektur ist zum neuen Absolutum geworden: einmal unterdrückt, immer unterdrückt. Derselbe Fehler wie 'Löslichkeit ist eine feste Zahl', nur eine Lektion später — eine Regel übernommen, ohne zu fragen, wo sie gilt."
next = "This entry and `common-ion-effect` exist as a pair for exactly this: the first teaches the rule, the second teaches its edge. The measurement to hold onto is the U-turn — and the habit to hold onto is asking every rule where it stops."
next_de = "Dieser Eintrag und `common-ion-effect` existieren genau für diesen Zweck als Paar: der erste lehrt die Regel, der zweite lehrt ihre Grenze. Die Messung, an der man festhalten sollte, ist die Kehrtwende — und die Gewohnheit, an der man festhalten sollte, ist, bei jeder Regel zu fragen, wo sie aufhört zu gelten."

[reaction.registers]
lv1 = "Strange: adding a lot more salt makes the stubborn white powder dissolve better, not worse. A little salt held it back; a lot of salt helps it go."
lv1_de = "Merkwürdig: Deutlich mehr Salz zuzugeben lässt das widerspenstige weiße Pulver besser lösen, nicht schlechter. Wenig Salz hielt es zurück; viel Salz hilft ihm, sich zu lösen."
lv2 = "Above roughly 0.1 mol/L chloride, complexation takes over from the common-ion effect: AgCl(s) + Cl⁻ ⇌ AgCl₂⁻ (and AgCl₃²⁻ beyond that). Solubility passes through a minimum and then rises — the classic U-shaped solubility curve."
lv2_de = "Oberhalb von etwa 0,1 mol/L Chlorid übernimmt die Komplexbildung vom gemeinsamen-Ionen-Effekt: AgCl(s) + Cl⁻ ⇌ AgCl₂⁻ (und darüber hinaus AgCl₃²⁻). Die Löslichkeit durchläuft ein Minimum und steigt dann wieder an — die klassische U-förmige Löslichkeitskurve."
lv3 = "Computed: 1.47 × 10⁻⁴ mol dissolves at I = 1.00 mol/kgw, roughly ten times the pure-water figure and immeasurably more than in 0.01 mol/L NaCl. Nothing here is scripted; the chloro-complexes are in wateq4f.dat and the minimiser finds them. Two models — simple K_sp and full speciation — give opposite predictions, and the experiment decides. Show a learner this before telling them any solubility rule is a law."
lv3_de = "Berechnet: 1,47 × 10⁻⁴ mol lösen sich bei I = 1,00 mol/kgw, etwa das Zehnfache des Werts in reinem Wasser und unmessbar mehr als in 0,01-mol/L-NaCl. Nichts hier ist vorgeskriptet; die Chlorokomplexe stehen in wateq4f.dat, und der Minimierer findet sie. Zwei Modelle — einfaches K_sp und vollständige Speziation — liefern entgegengesetzte Vorhersagen, und das Experiment entscheidet. Zeig einem Lernenden dies, bevor du ihm erzählst, irgendeine Löslichkeitsregel sei ein Gesetz."

