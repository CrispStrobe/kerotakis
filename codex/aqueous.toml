[reaction.registers]
lv1 = "The salt of vinegar dissolves, warms the jar slightly, and leaves water that is soapy rather than sour. The sour has become its opposite."
lv1_de = "Das Salz des Essigs löst sich, erwärmt das Glas leicht und hinterlässt Wasser, das seifig statt sauer ist. Das Saure ist zu seinem Gegenteil geworden."
lv2 = "Sodium acetate is the salt of a weak acid and a strong base, so its solution is alkaline: 1 mol/L reads pH ≈ 9.2. Dissolution is exothermic (−17.3 kJ/mol), warming 100 mL of water by about 4 °C."
lv2_de = "Natriumacetat ist das Salz einer schwachen Säure und einer starken Base, daher ist seine Lösung alkalisch: 1 mol/L zeigt pH ≈ 9,2. Das Lösen ist exotherm (−17,3 kJ/mol) und erwärmt 100 mL Wasser um etwa 4 °C."
lv3 = "Computed pH 9.16 at 29.2 °C and I = 0.77 mol/kgw. At this concentration 23% of the acetate is present as the neutral Na(Acetate) ion pair rather than as free acetate — the hydrolysis is running on less base than the label suggests, which is part of why the pH is below the ideal-solution estimate."
lv3_de = "Berechneter pH-Wert 9,16 bei 29,2 °C und I = 0,77 mol/kgw. Bei dieser Konzentration liegen 23 % des Acetats als neutrales Ionenpaar Na(Acetat) vor statt als freies Acetat — die Hydrolyse läuft also mit weniger Base ab, als das Etikett vermuten lässt, was mit ein Grund ist, warum der pH-Wert unter der Schätzung für eine ideale Lösung liegt."

[reaction.provenance]
source = "Standard curriculum salt hydrolysis; enthalpy of solution of sodium acetate, standard reference value"
computed_by = "PHREEQC via Kerotakis L2; energy balance over curated ΔH_dis"

[[reaction]]
id = "copper-sulfate-is-blue-and-acidic"
spine = ["der-ph-wert-als-eigenschaften-von-loesungen"]
