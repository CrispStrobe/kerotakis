[[reaction]]
id = "acetates-stay-dissolved"
spine = ["salzbildung"]
summary = "Ca²⁺ + 2 CH₃COO⁻ → no precipitate (all acetates are soluble)"
summary_de = "Ca²⁺ + 2 CH₃COO⁻ → kein Niederschlag (alle Acetate sind löslich)"
concepts = ["solubility-rules"]
requires = ["precipitation", "net-ionic-reaction"]
apparatus = ["beaker", "ph-meter"]

[[reaction.curriculum]]
system = "nrw-kernlehrplan-g9"
stage = "Sek I, Zweite Stufe (Jg. 9/10), IF6 Salze und Ionen"
ages = { min = 14.0, max = 16.0 }
source = "Kernlehrplan Chemie Gymnasium G9 NRW, Heft 3415 (RdErl. 23.06.2019) — predicting whether a double-exchange reaction produces a precipitate"

[reaction.setup]
script = """
add v1 water 1000mL
add v1 CaCl2 1.1g
add v1 NaOAc 5g
look v1
"""

[reaction.expect]
events = ["dissolved:NaOAc", "observed"]
absent = ["precipitated"]
ph = { min = 8.4, max = 8.8 }

[reaction.expect.predict]
question = "Two clear salt solutions are poured together — calcium chloride and sodium acetate. What do you see?"
question_de = "Zwei klare Salzlösungen werden zusammengegossen — Calciumchlorid und Natriumacetat. Was siehst du?"
options = [
  "A white precipitate; mixing two salt solutions makes a new solid",
  "Nothing visible — it stays clear, because every possible product is soluble",
  "Fizzing, because acetate comes from an acid",
]
answer = 1
misconception = "After a few precipitation demonstrations, 'mix two salt solutions and something falls out' becomes the expected rule. Most mixtures do nothing at all. A precipitate appears only if some cation–anion pairing happens to be insoluble; here calcium acetate and sodium chloride are both freely soluble, so all four ions simply carry on. Learning when nothing happens is what makes the solubility rules predictive rather than decorative."
misconception_de = "Nach ein paar Fällungsvorführungen wird 'zwei Salzlösungen mischen und etwas fällt aus' zur erwarteten Regel. Die meisten Mischungen tun überhaupt nichts. Ein Niederschlag erscheint nur, wenn zufällig eine Kation-Anion-Paarung unlöslich ist; hier sind Calciumacetat und Natriumchlorid beide frei löslich, sodass alle vier Ionen einfach weiterbestehen. Zu lernen, wann nichts passiert, ist das, was die Löslichkeitsregeln vorhersagend statt dekorativ macht."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "The demonstration became the rule: mixing clear salt solutions is what you do to make a solid, so a solid must come — the lesson's examples were all hits, and the misses were never shown."
reveals_de = "Die Vorführung wurde zur Regel: Klare Salzlösungen zu mischen ist das, was man tut, um einen Feststoff herzustellen, also muss ein Feststoff entstehen — die Beispiele der Lektion waren alle Treffer, und die Fehlschläge wurden nie gezeigt."
next = "Predict before pouring, from the table: the two new pairings are calcium acetate and sodium chloride, both freely soluble, so the prediction is 'nothing'. Run it and `inspect`: all four ions still in the inventory. A rule earns the name predictive on the misses, not the hits."
next_de = "Sage voraus, bevor du gießt, anhand der Tabelle: Die beiden neuen Paarungen sind Calciumacetat und Natriumchlorid, beide frei löslich, also lautet die Vorhersage 'nichts'. Führe es aus und `inspect`: Alle vier Ionen sind noch im Bestand. Eine Regel verdient sich den Namen vorhersagend an den Fehlschlägen, nicht an den Treffern."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Provenance confused with behaviour: acetate 'comes from an acid', so it should act like one — and fizzing is the acid's signature."
reveals_de = "Herkunft mit Verhalten verwechselt: Acetat 'stammt von einer Säure', also müsste es sich wie eine verhalten — und Sprudeln ist das Markenzeichen der Säure."
next = "Ask what a fizz physically requires: a volatile product. List every pairing these four ions can make — none is a gas. The ion that came *from* an acid is that acid's conjugate base, which is why the mixture, if anything, leans the other way."
next_de = "Frag, was Sprudeln physikalisch voraussetzt: ein flüchtiges Produkt. Liste jede Paarung auf, die diese vier Ionen bilden können — keine ist ein Gas. Das Ion, das *von* einer Säure stammt, ist die konjugierte Base dieser Säure, weshalb die Mischung, wenn überhaupt, in die andere Richtung tendiert."

[reaction.registers]
lv1 = "Two clear liquids, poured together — and it stays clear. Sometimes mixing chemicals does nothing you can see. That is an answer too."
lv1_de = "Zwei klare Flüssigkeiten, zusammengegossen — und es bleibt klar. Manchmal bewirkt das Mischen von Chemikalien nichts Sichtbares. Auch das ist eine Antwort."
lv2 = "Calcium acetate and sodium chloride are both soluble, so no double displacement occurs. The four ions (Ca²⁺, Cl⁻, Na⁺, CH₃COO⁻) coexist. The pH of 8.6 comes from acetate hydrolysis, not from any reaction between the two salts."
lv2_de = "Calciumacetat und Natriumchlorid sind beide löslich, sodass keine doppelte Umsetzung stattfindet. Die vier Ionen (Ca²⁺, Cl⁻, Na⁺, CH₃COO⁻) bestehen nebeneinander. Der pH-Wert von 8,6 stammt aus der Hydrolyse des Acetats, nicht aus irgendeiner Reaktion zwischen den beiden Salzen."
lv3 = "The absence of a precipitate is computed, not assumed: the minimiser is offered every candidate phase whose formula matches a registry solid and finds none supersaturated. An `absent` claim is checked by lint exactly as a positive one is, which is what stops this entry from quietly becoming false if the phase set grows."
lv3_de = "Das Fehlen eines Niederschlags ist berechnet, nicht angenommen: Dem Minimierer wird jede Kandidatenphase angeboten, deren Formel zu einem Registry-Feststoff passt, und er findet keine übersättigt. Eine `absent`-Behauptung wird von lint genauso geprüft wie eine positive — das verhindert, dass dieser Eintrag stillschweigend falsch wird, sollte die Phasenmenge wachsen."

