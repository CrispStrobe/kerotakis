[[reaction]]
id = "half-neutralised-vinegar"
spine = ["saeure-base-titration-ein-analytisches-verfahren"]
equation = "CH₃COOH + 0.5 NaOH → 0.5 CH₃COOH + 0.5 CH₃COO⁻ + 0.5 Na⁺ + 0.5 H₂O   (pH ≈ pKa)"
concepts = ["half-equivalence-point", "pka-measurement"]
requires = ["weak-acids", "neutralisation"]
apparatus = ["burette", "conical-flask", "ph-meter"]
calculations = ["titration-stoichiometry", "ph-calculation"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 12, LB2 Protolysegleichgewichte"
ages = { min = 17.0, max = 18.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Oberstufe (ISB) — the Henderson-Hasselbalch relationship at the half-equivalence point"

[reaction.setup]
script = """
add v1 water 1000mL
add v1 CH3COOH 0.1mol
add v1 NaOH 0.05mol
"""

[reaction.expect]
events = ["dissolved:NaOH"]
ph = { min = 4.5, max = 4.8 }

[reaction.expect.predict]
question = "You titrate vinegar and stop exactly half-way. What does the pH reading tell you?"
question_de = "Du titrierst Essig und stoppst genau auf halbem Weg. Was verrät dir die pH-Messung?"
options = [
  "Half of the starting pH — about 1.4",
  "The pKa of the acid, because acid and conjugate base are now present in equal amounts",
  "Nothing useful; only the endpoint carries information",
]
answer = 1
misconception = "Halving the pH treats a logarithm as a linear quantity. The half-equivalence point is the single most information-rich place on a weak-acid curve: with [HA] = [A⁻] the log-ratio term vanishes and the meter reads the acid's own pKa directly. It is how pKa values were measured before computers."
misconception_de = "Den pH-Wert zu halbieren behandelt einen Logarithmus wie eine lineare Größe. Der Halbäquivalenzpunkt ist die informationsreichste Stelle auf der Kurve einer schwachen Säure überhaupt: Bei [HA] = [A⁻] verschwindet der Logarithmus-Term des Verhältnisses, und das Messgerät zeigt direkt den eigenen pKa-Wert der Säure an. So wurden pKa-Werte gemessen, bevor es Computer gab."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "pH is being divided like a length: half the acid neutralised, half the number left. That each unit is a factor of ten — so halving the pH would mean the acidity *squared* — is not in the picture."
reveals_de = "Der pH-Wert wird geteilt wie eine Länge: die Hälfte der Säure neutralisiert, die halbe Zahl übrig. Dass jede Einheit einen Faktor zehn bedeutet — sodass eine Halbierung des pH-Werts die Acidität *quadrieren* würde — kommt in diesem Bild nicht vor."
next = "Run `dilution-by-ten` first: a full factor of ten buys exactly one pH unit. Getting from 2.9 to 1.4 would need the hydrogen-ion activity to rise thirtyfold while the acid is being consumed."
next_de = "Führe zuerst `dilution-by-ten` aus: ein voller Faktor zehn bringt genau eine pH-Einheit. Von 2,9 auf 1,4 zu kommen würde bedeuten, dass die Wasserstoffionen-Aktivität um das Dreißigfache steigt, während die Säure gerade verbraucht wird."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "A titration is held as a race to the jump: the curve on the way there is decoration, and only the endpoint carries a number worth writing down."
reveals_de = "Eine Titration wird als ein Wettlauf zum Sprung angesehen: Die Kurve auf dem Weg dorthin ist Dekoration, und nur der Endpunkt liefert eine Zahl, die es wert ist, notiert zu werden."
next = "Read the meter exactly here, at half-way: it reports the acid's own pKa — the constant that identifies *which* acid this is, and the one number the endpoint alone can never give you. The endpoint tells you how much; the plateau tells you what."
next_de = "Lies das Messgerät genau hier, auf halbem Weg: Es zeigt den eigenen pKa-Wert der Säure — die Konstante, die verrät, *welche* Säure das ist, eine Zahl, die dir der Endpunkt allein nie liefern kann. Der Endpunkt sagt dir, wie viel; das Plateau sagt dir, was."

[reaction.registers]
lv1 = "Stop half-way through neutralising the vinegar and the liquid sits at pH 4.7 — and it will stubbornly stay near there. Half-done is the most stubborn place of all."
lv1_de = "Stoppe auf halbem Weg beim Neutralisieren des Essigs, und die Flüssigkeit liegt bei pH 4,7 — und bleibt hartnäckig in dieser Nähe. Halb fertig ist die hartnäckigste Stelle von allen."
lv2 = "With equal amounts of CH₃COOH and CH₃COO⁻ present, pH = pKa = 4.76. This is a buffer at maximum capacity, and it is the standard laboratory method for measuring an unknown acid's pKa."
lv2_de = "Bei gleichen Mengen von CH₃COOH und CH₃COO⁻ gilt pH = pKa = 4,76. Das ist ein Puffer bei maximaler Kapazität, und es ist die im Labor übliche Methode, um den pKa-Wert einer unbekannten Säure zu bestimmen."
lv3 = "The engine reports 4.66, about a tenth of a unit below the thermodynamic pKa. At I = 0.049 mol/kgw the acetate ion's activity coefficient is 0.82 while the neutral acid's is 1.00; the ratio of activities is therefore not the ratio of concentrations, and the meter reads the difference."
lv3_de = "Die Engine berichtet 4,66, etwa ein Zehntel einer Einheit unter dem thermodynamischen pKa. Bei I = 0,049 mol/kgw beträgt der Aktivitätskoeffizient des Acetat-Ions 0,82, während der der neutralen Säure 1,00 beträgt; das Verhältnis der Aktivitäten entspricht daher nicht dem Verhältnis der Konzentrationen, und das Messgerät zeigt diese Differenz an."

