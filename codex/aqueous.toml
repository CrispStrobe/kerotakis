"""

[reaction.expect]
events = ["dissolved:CuSO4", "observed"]
ph = { min = 4.3, max = 4.7 }
temperature_c = { min = 25.5, max = 28.0 }

[reaction.expect.predict]
question = "Copper sulfate dissolves to a beautiful blue. What does the pH meter read?"
question_de = "Kupfersulfat löst sich zu einem wunderschönen Blau. Was zeigt das pH-Meter an?"
options = [
  "7 — it is a salt of a strong acid and a metal, so neutral",
  "About 4.5 — the solution is distinctly acidic",
  "About 9 — metal ions are basic",
]
answer = 1
misconception = "The tempting answer treats \"metal\" as automatically basic and \"salt\" as automatically neutral. A small, doubly charged cation pulls hard enough on the water molecules bound to it to loosen their protons: [Cu(H₂O)₆]²⁺ ⇌ [Cu(H₂O)₅OH]⁺ + H⁺. Copper(II) sulfate solution is acidic enough to taste sharp, and this is a general property of small highly charged cations, not a quirk of copper."
misconception_de = "Die verlockende Antwort behandelt \"Metall\" als automatisch basisch und \"Salz\" als automatisch neutral. Ein kleines, zweifach geladenes Kation zieht so stark an den daran gebundenen Wassermolekülen, dass es deren Protonen lockert: [Cu(H₂O)₆]²⁺ ⇌ [Cu(H₂O)₅OH]⁺ + H⁺. Kupfer(II)-sulfat-Lösung ist sauer genug, um scharf zu schmecken, und das ist eine allgemeine Eigenschaft kleiner, hoch geladener Kationen, keine Eigenart des Kupfers."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Two category rules stacked: salts are neutral, and this one comes from a strong acid and a metal, so doubly neutral — the ions themselves were never consulted."
reveals_de = "Zwei Kategorieregeln übereinandergestapelt: Salze sind neutral, und dieses stammt von einer starken Säure und einem Metall, also doppelt neutral — die Ionen selbst wurden nie befragt."
next = "Run the mirror: `washing-soda-is-alkaline` is also 'a salt of a metal and an acid residue' and reads 11 where this reads 4.5. Categories that give opposite answers to the same rule are not the thing doing the deciding."
next_de = "Führe den Spiegel durch: `washing-soda-is-alkaline` ist ebenfalls 'ein Salz aus einem Metall und einem Säurerest' und zeigt 11, wo dieses hier 4,5 zeigt. Kategorien, die derselben Regel entgegengesetzte Antworten geben, sind nicht das, was tatsächlich entscheidet."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "'Metal' means basic — a rule true of metal oxides and hydroxides as solids, transferred whole to the dissolved cation."
reveals_de = "'Metall' bedeutet basisch — eine Regel, die für Metalloxide und -hydroxide als Feststoffe stimmt, unverändert auf das gelöste Kation übertragen."
next = "Compare cations at lv3: sodium — large, singly charged — leaves water alone, while [Cu(H₂O)₆]²⁺ visibly loosens the protons of its own bound water. Size and charge decide, not membership of the metals; the periodic table's left edge is not a pH prediction."
next_de = "Vergleiche Kationen bei lv3: Natrium — groß, einfach geladen — lässt Wasser in Ruhe, während [Cu(H₂O)₆]²⁺ sichtbar die Protonen seines eigenen gebundenen Wassers lockert. Größe und Ladung entscheiden, nicht die Zugehörigkeit zu den Metallen; der linke Rand des Periodensystems ist keine pH-Vorhersage."

[reaction.registers]
lv1 = "White-ish crystals go in and the water turns a deep blue you cannot look away from. The jar also gets slightly warm. And — surprisingly — the water has turned sour."
lv1_de = "Weißliche Kristalle kommen hinein, und das Wasser wird tiefblau — ein Blau, von dem man kaum wegschauen kann. Das Glas wird dabei auch leicht warm. Und — überraschend — das Wasser ist sauer geworden."
lv2 = "0.05 mol of CuSO₄ in 500 mL gives a 0.1 mol/L blue solution. Dissolution is exothermic (−73.1 kJ/mol), warming the beaker by about 1.8 °C. The hydrated Cu²⁺ ion is a weak acid, so the pH falls to about 4.5."
lv2_de = "0,05 mol CuSO₄ in 500 mL ergeben eine 0,1-mol/L blaue Lösung. Das Lösen ist exotherm (−73,1 kJ/mol) und erwärmt das Becherglas um etwa 1,8 °C. Das hydratisierte Cu²⁺-Ion ist eine schwache Säure, sodass der pH-Wert auf etwa 4,5 fällt."
lv3 = "Computed pH 4.52. The colour is curated — d–d transitions are not something a thermodynamic database can give honestly — but the acidity is computed, from CuOH⁺ at 7.8 × 10⁻⁶ and the dimer Cu₂(OH)₂²⁺ at 4.4 × 10⁻⁵ mol/kgw. Note also that half the copper is present as the neutral CuSO₄ ion pair, so \"0.1 M Cu²⁺\" is not what is in the beaker."
lv3_de = "Berechneter pH-Wert 4,52. Die Farbe ist kuratiert — d-d-Übergänge sind nichts, was eine thermodynamische Datenbank ehrlich liefern kann —, aber die Acidität ist berechnet, aus CuOH⁺ bei 7,8 × 10⁻⁶ und dem Dimer Cu₂(OH)₂²⁺ bei 4,4 × 10⁻⁵ mol/kgw. Beachte auch, dass die Hälfte des Kupfers als neutrales Ionenpaar CuSO₄ vorliegt, sodass \"0,1 M Cu²⁺\" nicht das ist, was tatsächlich im Becherglas ist."

