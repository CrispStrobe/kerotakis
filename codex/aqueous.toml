[[reaction]]
id = "bleach-and-acid"
spine = ["chemikalien-im-alltag", "sicherheitsregeln-in-chemieraeumen"]
equation = "NaOCl + 2 HCl → Cl₂↑ + NaCl + H₂O"
concepts = ["toxic-gas", "household-hazards"]
requires = ["gas-evolution", "acids"]
apparatus = ["fume-cupboard"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 10, LB4 Protonenübergänge/Säure-Base-Reaktionen (18 Std.)"
ages = { min = 15.0, max = 16.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Jgst. 10 (ISB) — hazardous gas evolution from mixing household chemicals"

[reaction.setup]
script = """
add v1 water 200mL
add v1 NaOCl 0.1mol
add v1 HCl 0.2mol
"""

[reaction.expect]
events = ["hazard_warning", "gas_evolved:Cl2"]
ph = { min = 6.8, max = 7.1 }

[reaction.expect.predict]
question = "Bleach and limescale remover are both ordinary cleaning products. What happens if they are used in the same toilet bowl?"
question_de = "Bleiche und Entkalker sind beides ganz normale Reinigungsmittel. Was passiert, wenn sie in derselben Toilettenschüssel verwendet werden?"
options = [
  "Nothing much — both are cleaners, so they help each other",
  "Chlorine gas is released, in quantities that send people to hospital every year",
  "They neutralise each other and stop working",
]
answer = 1
misconception = "\"Both are cleaning products\" is read as \"both are on the same side\", and the third option shows the near-miss version: something does get neutralised, but the product is a poison gas rather than a harmless dud. Household bleach is hypochlorite in alkali; descalers are acids. The acid protonates hypochlorite and drives out Cl₂ — the gas used as a weapon in 1915."
misconception_de = "\"Beide sind Reinigungsmittel\" wird gelesen als \"beide stehen auf derselben Seite\", und die dritte Option zeigt die knapp danebenliegende Version: Es wird tatsächlich etwas neutralisiert, aber das Produkt ist ein Giftgas statt eines harmlosen Nieten-Ergebnisses. Haushaltsbleiche ist Hypochlorit in Lauge; Entkalker sind Säuren. Die Säure protoniert Hypochlorit und treibt Cl₂ aus — das Gas, das 1915 als Waffe eingesetzt wurde."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Products are sorted by purpose, not by chemistry: two things sold for cleaning are teammates, so combining them can only clean harder."
reveals_de = "Produkte werden nach Zweck sortiert, nicht nach Chemie: Zwei Dinge, die zum Putzen verkauft werden, gelten als Mannschaftskollegen, also kann ihre Kombination nur noch stärker reinigen."
next = "Run it here, where the only casualty is a number: the warning names chlorine *before* the chemistry proceeds, and the balance then watches a gas leave that neither bottle contained. The label on the front says what it is for; the chemistry answers to the ingredients on the back."
next_de = "Führe es hier durch, wo das einzige Opfer eine Zahl ist: Die Warnung nennt Chlor bereits *bevor* die Chemie abläuft, und die Waage beobachtet dann, wie ein Gas entweicht, das keine der beiden Flaschen enthielt. Das Etikett auf der Vorderseite sagt, wofür es gedacht ist; die Chemie richtet sich nach den Zutaten auf der Rückseite."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "The acid–base half is genuinely seen — alkali meets acid, so they neutralise — but neutralisation is assumed to end in harmlessness, and the product's identity is never checked."
reveals_de = "Die Säure-Base-Hälfte wird tatsächlich erkannt — Lauge trifft Säure, also neutralisieren sie sich —, aber es wird angenommen, dass Neutralisation immer harmlos endet, und die Identität des Produkts wird nie geprüft."
next = "Finish the equation instead of stopping at 'neutralise': protonating hypochlorite yields chlorine gas, not salt water. The habit this entry exists to build is reading a reaction through to its products — `neutralisation` earns its harmless ending by producing water; this one does not."
next_de = "Führe die Gleichung zu Ende, statt bei 'neutralisieren' aufzuhören: Die Protonierung von Hypochlorit ergibt Chlorgas, nicht Salzwasser. Die Gewohnheit, die dieser Eintrag aufbauen soll, ist, eine Reaktion bis zu ihren Produkten zu Ende zu lesen — `neutralisation` verdient sich ihr harmloses Ende dadurch, dass Wasser entsteht; hier ist das nicht der Fall."

[reaction.registers]
lv1 = "Never mix bleach with anything else. Never. In the lab this is a picture on a screen; in a bathroom it is an ambulance. The lab will show you what happens and will not let you smell it."
lv1_de = "Niemals Bleiche mit irgendetwas anderem mischen. Niemals. Im Labor ist das ein Bild auf einem Bildschirm; in einem Badezimmer ist es ein Krankenwagen. Das Labor zeigt dir, was passiert, und lässt dich nicht daran riechen."
lv2 = "NaOCl + 2 HCl → Cl₂↑ + NaCl + H₂O. 0.1 mol of hypochlorite with 0.2 mol of acid releases 0.1 mol of chlorine — about 2.4 L at room temperature, in a room you are standing in. What remains in the beaker is only salt water, pH 6.96."
lv2_de = "NaOCl + 2 HCl → Cl₂↑ + NaCl + H₂O. 0,1 mol Hypochlorit mit 0,2 mol Säure setzt 0,1 mol Chlor frei — etwa 2,4 L bei Raumtemperatur, in einem Raum, in dem du stehst. Was im Becherglas bleibt, ist nur Salzwasser, pH 6,96."
lv3 = "The hazard is L0: the reactive-group screen assesses the prospective vessel state *before* the addition is applied and warns from the pairing itself, independently of whether any solver models the chemistry. The gas release is then curated stoichiometry, and the leftover brine is computed. Safety that depends on a solver having an opinion is safety that fails when the solver does not."
lv3_de = "Die Gefahr ist L0: Der Screen für reaktive Gruppen bewertet den voraussichtlichen Gefäßzustand *bevor* die Zugabe angewendet wird und warnt bereits aufgrund der Paarung selbst, unabhängig davon, ob irgendein Solver die Chemie modelliert. Die Gasfreisetzung ist dann kuratierte Stöchiometrie, und die übrig gebliebene Sole ist berechnet. Sicherheit, die davon abhängt, dass ein Solver eine Meinung hat, ist Sicherheit, die versagt, wenn der Solver keine hat."

[reaction.provenance]
source = "Standard household-chemical safety guidance (bleach + acid → chlorine); reaction stoichiometry curated in the Kerotakis safety layer. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "L0 reactive-group screen (Kerotakis safety); residual solution by PHREEQC via Kerotakis L2"

