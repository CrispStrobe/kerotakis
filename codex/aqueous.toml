lv3 = "The measured solubility slightly exceeds √K_sp because dissolved silver is not only free Ag⁺: the neutral AgCl(aq) complex is present too. This is the same effect that makes the marquee precipitation entry's residual silver larger than naive arithmetic predicts, and it is the seed of the next entry's surprise."
lv3_de = "Die gemessene Löslichkeit übersteigt √K_sp leicht, weil gelöstes Silber nicht nur als freies Ag⁺ vorliegt: Der neutrale Komplex AgCl(aq) ist ebenfalls vorhanden. Das ist derselbe Effekt, der das restliche Silber im großen Fällungs-Beispiel höher macht, als eine naive Rechnung vorhersagt, und er ist der Keim für die Überraschung des nächsten Eintrags."

