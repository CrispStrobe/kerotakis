add v1 NaCl 117g
evaporate v1 0.8
look v1
"""

[reaction.expect]
events = ["dissolved:NaCl", "evaporated", "precipitated:NaCl", "observed"]
ph = { min = 6.2, max = 6.6 }

[reaction.expect.predict]
question = "117 g of salt dissolves completely in a litre of water. You boil off four fifths of the water. What is in the basin?"
options = [
  "Nothing but very salty water; it all dissolved once, so it stays dissolved",
  "All 117 g back as crystals, since the water has mostly gone",
  "About 46 g of crystals, with the rest still dissolved in the remaining water",
]
answer = 2
misconception = "The first answer forgets that solubility is per unit of *solvent*, not a one-way door: take the water away and the salt has nowhere to stay. The second overshoots — 200 mL of water can still hold 1.22 mol of salt, so only the excess crystallises. Working out which fraction comes back is the whole of salt-pan chemistry, and it is a subtraction: what you put in, minus what the remaining water can still hold."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Dissolving is a one-way door: once a solid has 'become liquid' it stays that way, however much of the liquid leaves — solubility as an event in the salt's past rather than a ratio to the water's present."
next = "Watch the bench report the moment of return: crystals appear exactly when the shrinking water's ceiling crosses the load, not before. The salt never changed; its allowance per gram of water did."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "The right mechanism, overshot: less water means crystals, so almost no water means all the crystals — the remaining water's own carrying capacity drops out of the account."
next = "Do the salt-pan subtraction: the 200 mL that remain still hold 1.22 mol, about 71 g. 117 g in, 71 g still afloat, 46 g in the basin — the answer is a ledger, and the bench's balance agrees with it."

[reaction.registers]
lv1 = "Salty water, boiled down. As the water leaves, white crystals appear on the bottom — the sea's oldest trick, and how every salt pan in the world works."
lv2 = "2.00 mol of NaCl dissolves in 1 L. Removing 80% of the water leaves 200 mL, which can hold only 1.22 mol at saturation, so 0.78 mol (about 46 g) crystallises out."
lv3 = "The remaining solution sits at I = 6.12 mol/kgw, far outside the Debye–Hückel domain — this problem routes to the Pitzer ion-interaction model, and `explain` will show wateq4f and minteq.v4 giving materially different answers for the same beaker. Note also γ(Na⁺) = 1.65 here: an activity coefficient above one is normal in concentrated brine and is not an error."

[reaction.provenance]
source = "Standard curriculum evaporation and crystallisation; halite solubility from PHREEQC (pitzer.dat). Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
