[reaction.expect.predict]
question = "A beaker of (almost) pure water read pH 7.00 at 25 °C. You warm it to 50 °C and measure again. The meter shows 6.63. What happened?"
question_de = "Ein Becherglas mit (fast) reinem Wasser zeigte bei 25 °C pH 7,00. Du erwärmst es auf 50 °C und misst erneut. Das Messgerät zeigt 6,63. Was ist passiert?"
options = [
  "Nothing can have happened — pure water is neutral, and neutral is 7",
  "The water is still exactly neutral; the neutral point itself moved",
  "The heat made the water slightly acidic",
]
answer = 1
misconception = "Both wrong answers hold 'pH 7 = neutral' as a definition when it is the 25 °C value of a temperature-dependent equilibrium. Water splits itself — H₂O ⇌ H⁺ + OH⁻ — and heating pushes the split further, so [H⁺] and [OH⁻] rise together. Neutral means they are equal, and at 50 °C they are equal at pH 6.63. Acidic would need an excess of H⁺ over OH⁻, and nothing donated one."
misconception_de = "Beide falschen Antworten behandeln 'pH 7 = neutral' als Definition, dabei ist es der 25-°C-Wert eines temperaturabhängigen Gleichgewichts. Wasser spaltet sich selbst — H₂O ⇌ H⁺ + OH⁻ —, und Erwärmen treibt diese Spaltung weiter, sodass [H⁺] und [OH⁻] gemeinsam steigen. Neutral bedeutet, dass sie gleich groß sind, und bei 50 °C sind sie bei pH 6,63 gleich groß. Sauer würde einen Überschuss von H⁺ über OH⁻ erfordern, und nichts hat eines gespendet."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "pH 7 as the definition of neutral rather than as one temperature's reading of it — so a meter that says otherwise about plain water must be wrong."
reveals_de = "pH 7 wird als Definition von neutral behandelt statt als eine Messung bei nur einer Temperatur — also muss ein Messgerät, das bei reinem Wasser etwas anderes anzeigt, falsch sein."
next = "Trust the meter and move the temperature both ways: 6.63 at 50 °C, 7.00 at 25 °C, 7.47 near 0 °C — the reading moves while nothing is added or removed. A definition cannot do that; an equilibrium constant with a temperature dependence must."
next_de = "Vertrau dem Messgerät und ändere die Temperatur in beide Richtungen: 6,63 bei 50 °C, 7,00 bei 25 °C, 7,47 nahe 0 °C — die Anzeige bewegt sich, obwohl nichts zugegeben oder entfernt wird. Eine Definition kann das nicht; eine temperaturabhängige Gleichgewichtskonstante muss es."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Acidic means 'below 7', as an absolute — the real definition of neutrality, equal H⁺ and OH⁻, is not in the picture."
reveals_de = "Sauer bedeutet 'unter 7', als absolute Regel — die eigentliche Definition von Neutralität, gleich viel H⁺ und OH⁻, kommt in diesem Bild nicht vor."
next = "Ask where an excess of H⁺ would have come from: heating water makes more H⁺ and more OH⁻ in exactly equal numbers, because each split of a water molecule yields one of each. At 50 °C that equality sits at 6.63; the water is as neutral as it ever was."
next_de = "Frag, woher ein Überschuss an H⁺ hätte kommen sollen: Erwärmen von Wasser erzeugt mehr H⁺ und mehr OH⁻ in genau gleicher Zahl, weil jede Spaltung eines Wassermoleküls jeweils eines von beiden liefert. Bei 50 °C liegt diese Gleichheit bei 6,63; das Wasser ist so neutral wie eh und je."

[reaction.registers]
lv1 = "Warm water is still just water — nothing sour about it. But the meter's idea of 'the middle of the scale' moves when the water warms. The middle is only 7 in a room-temperature beaker."
lv1_de = "Warmes Wasser ist immer noch einfach Wasser — nichts Saures daran. Aber die Vorstellung des Messgeräts von der 'Mitte der Skala' verschiebt sich, wenn das Wasser wärmer wird. Die Mitte liegt nur bei einem Becherglas mit Raumtemperatur bei 7."
lv2 = "Water splits itself a little: H₂O ⇌ H⁺ + OH⁻, with K_w = 10⁻¹⁴ at 25 °C. The split is endothermic, so heating pushes it further: K_w grows, [H⁺] and [OH⁻] rise together, and the pH falls to 6.63 while pOH falls to match. Neutral is where they are equal — and that is no longer 7."
lv2_de = "Wasser spaltet sich ein kleines bisschen selbst: H₂O ⇌ H⁺ + OH⁻, mit K_w = 10⁻¹⁴ bei 25 °C. Die Spaltung ist endotherm, sodass Erwärmen sie weitertreibt: K_w wächst, [H⁺] und [OH⁻] steigen gemeinsam, und der pH-Wert fällt auf 6,63, während der pOH-Wert im Gleichschritt fällt. Neutral ist dort, wo sie gleich groß sind — und das ist nicht mehr 7."
lv3 = "The pinch of salt is scaffolding, stated as such: this bench declines to characterise pure water — no solutes, no solve, and the meter honestly reads nothing — so 0.01 mol/kgw of NaCl gives it a solution to stand in without touching the autoprotolysis (both ions are spectators to it). K_w comes from the database at the vessel's own temperature: the engine reads 7.00 at 25 °C, 6.63 at 50 °C and 7.47 near 0 °C — the classic table values, computed rather than quoted. 'pH 7 = neutral' is a 25 °C fact that is usually taught as a definition; the lye entry's pH 13.51 is this same lesson from the other end of the scale."
lv3_de = "Die Prise Salz ist ein Gerüst, und das wird auch so gesagt: Dieses Labor weigert sich, reines Wasser zu charakterisieren — keine gelösten Stoffe, keine Lösung, und das Messgerät zeigt ehrlich nichts an —, deshalb gibt 0,01 mol/kgw NaCl ihm eine Lösung, in der es stehen kann, ohne die Autoprotolyse zu berühren (beide Ionen sind dafür Zuschauerionen). K_w stammt aus der Datenbank bei der Eigentemperatur des Gefäßes: Die Engine liest 7,00 bei 25 °C, 6,63 bei 50 °C und 7,47 nahe 0 °C — die klassischen Tabellenwerte, berechnet statt zitiert. 'pH 7 = neutral' ist eine Tatsache bei 25 °C, die meist als Definition gelehrt wird; der pH-Wert 13,51 des Laugen-Eintrags ist dieselbe Lektion vom anderen Ende der Skala."

[reaction.provenance]
source = "Standard curriculum autoprotolysis; temperature-dependent K_w from PHREEQC wateq4f.dat (USGS), solved at the vessel's own temperature. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "PHREEQC via Kerotakis L2, solved at the temperature the heating produced"

[[reaction]]
id = "bicarbonate-plays-both-sides"
spine = ["saeure-basen-konzepte"]
equation = "HCO₃⁻ + OH⁻ → CO₃²⁻ + H₂O"
concepts = ["amphiprotic-ions", "proton-transfer"]
requires = ["conjugate-base"]
models = ["broensted-lowry"]
apparatus = ["beaker", "ph-meter"]
calculations = ["ph-calculation"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 10, LB4 Protonenübergänge/Säure-Base-Reaktionen (18 Std.)"
ages = { min = 15.0, max = 16.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Jgst. 10 (ISB) — amphoteric behaviour of hydrogen carbonate"

[reaction.setup]
script = """
add v1 water 100mL
add v1 NaHCO3 0.01mol
add v1 HCl 0.01mol
new
add v2 water 100mL
add v2 NaHCO3 0.01mol
add v2 NaOH 0.01mol
"""

[reaction.expect]
events = ["dissolved:NaHCO3", "gas_evolved:CO2", "dissolved:NaOH"]
ph = { min = 5.4, max = 5.8 }

[reaction.expect.predict]
question = "Baking soda fizzes furiously when acid is poured on it. Pour concentrated lye onto the same baking soda solution instead. What happens?"
question_de = "Natron sprudelt heftig, wenn Säure daraufgegossen wird. Gieße stattdessen konzentrierte Lauge auf dieselbe Natronlösung. Was passiert?"
options = [
  "It fizzes again — fizzing is what baking soda does",
  "Nothing at all — soda answers acids, and lye is not an acid",
  "No gas this time: the bicarbonate hands over its own proton and becomes carbonate",
]
answer = 2
misconception = "Both wrong answers treat acid and base as badges a substance wears rather than roles in a transaction. Bicarbonate is amphiprotic: against an acid it accepts a proton (and the resulting carbonic acid leaves as CO₂ — the fizz); against a base it donates its own proton and becomes carbonate, silently. Brønsted's whole move is that acid and base name the two ends of one proton handover — and this beaker is that idea as an experiment."
misconception_de = "Beide falschen Antworten behandeln Säure und Base als Abzeichen, die ein Stoff trägt, statt als Rollen in einer Transaktion. Hydrogencarbonat ist amphiprotisch: gegenüber einer Säure nimmt es ein Proton auf (und die entstehende Kohlensäure entweicht als CO₂ — das Sprudeln); gegenüber einer Base gibt es sein eigenes Proton ab und wird still zu Carbonat. Brønsteds ganzer Kniff ist, dass Säure und Base die zwei Enden einer einzigen Protonenübergabe benennen — und dieses Becherglas ist genau diese Idee als Experiment."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "The fizz as the substance's signature move — bicarbonate 'contains' the gas the way a balloon does, and any provocation releases it."
reveals_de = "Das Sprudeln als Markenzeichen des Stoffes — Hydrogencarbonat 'enthält' das Gas so, wie ein Luftballon es tut, und jede Provokation setzt es frei."
next = "Ask what the gas is made of: CO₂ only forms when the bicarbonate *receives* a proton. Lye offers none. Watch the event stream — the lye step evolves nothing — and the lv3 speciation shows the carbon still in the beaker, now sitting as carbonate."
next_de = "Frag, woraus das Gas besteht: CO₂ entsteht nur, wenn das Hydrogencarbonat ein Proton *erhält*. Lauge bietet keines an. Beobachte den Ereignisstrom — der Laugenschritt setzt nichts frei — und die lv3-Speziation zeigt den Kohlenstoff noch im Becherglas, jetzt als Carbonat."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "Acid and base as fixed identities: bicarbonate is 'a base', and one base has no business with another — so nothing can happen."
reveals_de = "Säure und Base als feste Identitäten: Hydrogencarbonat ist 'eine Base', und eine Base hat mit einer anderen nichts zu schaffen — also kann nichts passieren."
next = "Something did happen; it was just silent. The lv3 speciation shows the bicarbonate gone and carbonate in its place: a proton left the HCO₃⁻ ion itself. One substance, two roles depending on the partner — the Arrhenius → Brønsted step in `models.toml` is this beaker written as theory."
next_de = "Es ist tatsächlich etwas passiert; es war nur still. Die lv3-Speziation zeigt, dass das Hydrogencarbonat verschwunden ist und Carbonat an seiner Stelle steht: Ein Proton hat das HCO₃⁻-Ion selbst verlassen. Ein Stoff, zwei Rollen je nach Partner — der Schritt von Arrhenius zu Brønsted in `models.toml` ist dieses Becherglas, als Theorie niedergeschrieben."

[reaction.registers]
lv1 = "Against sour stuff, baking soda fights back with bubbles. Against the slippery stuff it does something sneakier: it hands over a tiny piece of itself, without a single bubble. The same powder plays both sides, depending on who it meets."
lv1_de = "Gegen Saures wehrt sich Natron mit Bläschen. Gegen das Seifige tut es etwas Heimtückischeres: Es gibt ein winziges Stück von sich selbst ab, ohne ein einziges Bläschen. Dasselbe Pulver spielt beide Seiten, je nachdem, wem es begegnet."
lv2 = "Amphiprotic behaviour: HCO₃⁻ + H⁺ → H₂O + CO₂↑ (base role — the fizz), but HCO₃⁻ + OH⁻ → CO₃²⁻ + H₂O (acid role — no gas). The acid beaker ends near pH 5.6 with all its carbon gone as gas; the lye beaker keeps its carbon as carbonate."
lv2_de = "Amphiprotisches Verhalten: HCO₃⁻ + H⁺ → H₂O + CO₂↑ (Base-Rolle — das Sprudeln), aber HCO₃⁻ + OH⁻ → CO₃²⁻ + H₂O (Säure-Rolle — kein Gas). Das Säure-Becherglas endet bei etwa pH 5,6, wobei aller Kohlenstoff als Gas entwichen ist; das Laugen-Becherglas behält seinen Kohlenstoff als Carbonat."
lv3 = "The bookkeeping, honestly: an open 0.1 mol/kgw bicarbonate solution self-vents about 0.003 mol of CO₂ on dissolution (its own carbonate equilibrium against the atmosphere — `baking-soda-vents-carbon-dioxide`), so 0.003 mol of the lye finds no bicarbonate partner and the second beaker's final pH carries that excess hydroxide. The acid beaker's pH 5.6 is not leftover acid: it is a sodium chloride solution equilibrated with atmospheric CO₂ — the same chemistry that makes clean rain slightly acidic. The Brønsted point is in the speciation: the same ion appears as proton acceptor in one vessel and proton donor in the other, which no fixed acid/base label can say."
lv3_de = "Die Buchhaltung, ehrlich: Eine offene 0,1-mol/kgw-Hydrogencarbonat-Lösung entgast beim Lösen von selbst etwa 0,003 mol CO₂ (ihr eigenes Carbonatgleichgewicht gegenüber der Atmosphäre — `baking-soda-vents-carbon-dioxide`), sodass 0,003 mol der Lauge keinen Hydrogencarbonat-Partner finden und der finale pH-Wert des zweiten Becherglases diesen Hydroxidüberschuss trägt. Der pH-Wert 5,6 des Säure-Becherglases ist keine übrig gebliebene Säure: Es ist eine Natriumchlorid-Lösung im Gleichgewicht mit atmosphärischem CO₂ — dieselbe Chemie, die sauberen Regen leicht sauer macht. Der Brønsted-Punkt steckt in der Speziation: Dasselbe Ion tritt in einem Gefäß als Protonenakzeptor und im anderen als Protonendonor auf — etwas, das kein festes Säure/Base-Etikett sagen kann."

[reaction.provenance]
source = "Standard curriculum acid–base concepts (amphiprotic species, Brønsted–Lowry); carbonate equilibria from PHREEQC wateq4f.dat (USGS). Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "PHREEQC via Kerotakis L2, open-vessel carbonate equilibria"

[[reaction]]
id = "the-antacid-runs-on-arithmetic"
spine = ["verwendung-von-saeuren-und-basen"]
equation = "NaHCO₃ + HCl → NaCl + H₂O + CO₂"
concepts = ["neutralisation", "buffer-capacity"]
requires = ["neutralisation"]
apparatus = ["beaker", "ph-meter", "balance"]
calculations = ["moles-from-mass", "concentration"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 10, LB4 Protonenübergänge/Säure-Base-Reaktionen (18 Std.)"
ages = { min = 15.0, max = 16.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Jgst. 10 (ISB) — neutralisation in an everyday context"

[[reaction.curriculum]]
system = "england-gcse-combined-science"
stage = "GCSE Combined Science: Trilogy (AQA 8464), 4.4.2 Reactions of acids"
ages = { min = 14.0, max = 16.0 }
source = "AQA GCSE Combined Science: Trilogy specification (8464), Section 4.4.2 — neutralisation reactions are required content"

[reaction.setup]
script = """
add v1 water 100mL
add v1 HCl 0.01mol
add v1 NaHCO3 1g
"""

[reaction.expect]
events = ["dissolved:NaHCO3", "gas_evolved:CO2"]
ph = { min = 9.0, max = 9.4 }

[reaction.expect.predict]
question = "Stomach acid is roughly 0.1 mol/L hydrochloric acid — this beaker of it reads pH 1.1. In goes a gram of baking soda, about what a heartburn tablet carries. What does the meter say when the fizzing stops?"
question_de = "Magensäure ist etwa 0,1-mol/L-Salzsäure — dieses Becherglas davon zeigt pH 1,1. Ein Gramm Natron kommt hinein, etwa das, was eine Sodbrennen-Tablette enthält. Was sagt das Messgerät, wenn das Sprudeln aufhört?"
options = [
  "Still about 1 — a kitchen powder cannot touch a strong acid",
  "About 9, with a burp of carbon dioxide on the way",
  "14 — soda is a base, and a base sends the scale to the top",
]
answer = 1
misconception = "Both wrong answers confuse what a substance IS with how much of it there is. 'Strong' describes how completely an acid gives up its protons, not how many it has: 0.01 mol of protons meets 0.012 mol of proton-acceptors and simply runs out. And a base does not teleport the scale to 14 — the leftover bicarbonate is a weak, gentle base that settles near 9, which is precisely why tablets are carbonates and not lye."
misconception_de = "Beide falschen Antworten verwechseln, WAS ein Stoff ist, mit WIE VIEL davon vorhanden ist. 'Stark' beschreibt, wie vollständig eine Säure ihre Protonen abgibt, nicht wie viele sie hat: 0,01 mol Protonen trifft auf 0,012 mol Protonenakzeptoren und geht einfach aus. Und eine Base teleportiert die Skala nicht zu 14 — das übrig gebliebene Hydrogencarbonat ist eine schwache, milde Base, die sich bei etwa 9 einpendelt, genau deshalb sind Tabletten Carbonate und keine Lauge."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "'Strong acid' as invincible — strength read as power over any opponent, rather than as the completeness of its own dissociation."
reveals_de = "'Starke Säure' als unbesiegbar — Stärke wird als Macht über jeden Gegner gelesen, statt als Vollständigkeit der eigenen Dissoziation."
next = "Count instead of ranking: 0.01 mol of protons against 0.012 mol of bicarbonate. Strength decided how the protons were offered (all at once, fully dissociated); the counting decides who runs out, and the acid does. The fizz is its protons leaving the beaker as gas."
next_de = "Zähle, statt zu bewerten: 0,01 mol Protonen gegen 0,012 mol Hydrogencarbonat. Die Stärke hat entschieden, wie die Protonen angeboten wurden (alle auf einmal, vollständig dissoziiert); das Zählen entscheidet, wer ausgeht, und das ist die Säure. Das Sprudeln sind ihre Protonen, die das Becherglas als Gas verlassen."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Bases as scale-flippers: adding 'a base' sends pH to the top of the scale, with the base's own strength and amount playing no part."
reveals_de = "Basen als Skalenkipper: Die Zugabe von 'einer Base' schickt den pH-Wert an die Spitze der Skala, wobei die eigene Stärke und Menge der Base keine Rolle spielt."
next = "Look at what is actually left over: excess bicarbonate, a weak proton-acceptor that settles the beaker near pH 9 — for the lye that really does reach the top of the scale, run `strong-base`. Your stomach lining is the reason the gentle landing is the design goal: an antacid that overshot to 14 would be a worse burn than the acid it cured."
next_de = "Schau dir an, was tatsächlich übrig bleibt: überschüssiges Hydrogencarbonat, ein schwacher Protonenakzeptor, der das Becherglas bei etwa pH 9 einpendeln lässt — für die Lauge, die wirklich an die Spitze der Skala kommt, führe `strong-base` aus. Deine Magenschleimhaut ist der Grund, warum die sanfte Landung das Entwurfsziel ist: ein Antazidum, das bis 14 überschösse, wäre eine schlimmere Verätzung als die Säure, die es heilen sollte."

[reaction.registers]
lv1 = "Pretend stomach acid: sour enough to sting. In goes the white powder — it fizzes hard, and when the bubbles stop, the sting is gone. The burp is the acid itself, leaving as gas."
lv1_de = "Nachgestellte Magensäure: sauer genug, um zu beißen. Das weiße Pulver kommt hinein — es sprudelt heftig, und wenn die Bläschen aufhören, ist das Beißen vorbei. Das Aufstoßen ist die Säure selbst, die als Gas entweicht."
lv2 = "HCO₃⁻ + H⁺ → H₂O + CO₂↑. One gram of NaHCO₃ is 0.0119 mol against 0.0100 mol of acid, so the acid is the limiting reagent: the pH climbs from 1.1 to about 9.2, the balance loses ~0.45 g of CO₂, and the ~0.002 mol of unspent bicarbonate is what holds the finish gentle."
lv2_de = "HCO₃⁻ + H⁺ → H₂O + CO₂↑. Ein Gramm NaHCO₃ sind 0,0119 mol gegenüber 0,0100 mol Säure, sodass die Säure der begrenzende Reaktionspartner ist: Der pH-Wert steigt von 1,1 auf etwa 9,2, die Waage verliert ~0,45 g CO₂, und die ~0,002 mol unverbrauchtes Hydrogencarbonat sind es, die das Ende sanft halten."
lv3 = "The tablet is dosed to outlast the acid it expects — `buffer-capacity-exceeded` run in reverse: there, the insult outlasted the reserve; here, the reserve outlasts the insult, by design and by arithmetic. Honesty about the model: a beaker is not a stomach — a stomach keeps secreting acid and regulating volume, so the real relief is a running battle rather than this one-shot titration; and the beaker's pH 9.2 endpoint is an open-vessel carbonate equilibrium, venting CO₂ until it matches the atmosphere. What the arithmetic does transfer to the pharmacy shelf: the dose works by moles, not by magic, which is why the packet specifies grams."
lv3_de = "Die Tablette ist so dosiert, dass sie die erwartete Säure überdauert — `buffer-capacity-exceeded` rückwärts abgespielt: Dort überdauerte der Angriff die Reserve; hier überdauert die Reserve den Angriff, nach Entwurf und nach Rechnung. Ehrlichkeit über das Modell: Ein Becherglas ist kein Magen — ein Magen scheidet weiterhin Säure aus und reguliert das Volumen, sodass die echte Linderung ein andauernder Kampf ist und keine einmalige Titration; und der Endpunkt des Becherglases bei pH 9,2 ist ein Carbonatgleichgewicht im offenen Gefäß, das CO₂ entgast, bis es der Atmosphäre entspricht. Was die Rechnung tatsächlich ins Apothekenregal überträgt: Die Dosis wirkt nach Molzahlen, nicht nach Magie, weshalb die Packung Gramm angibt."

[reaction.provenance]
source = "Standard curriculum application of neutralisation (antacids); carbonate equilibria from PHREEQC wateq4f.dat (USGS); stomach-acid concentration ~0.1 mol/L is a standard physiology figure. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "PHREEQC via Kerotakis L2, open-vessel carbonate equilibria; mass bookkeeping by the Kerotakis bench"

# ------------------------------------------------------------- indicators

[[reaction]]
id = "the-indicator-is-chosen-for-the-jump"
spine = ["saeure-base-titration-ein-analytisches-verfahren"]
summary = "Phenolphthalein turns at this titration's endpoint (pH 8.6); methyl orange fired long before, deep in the buffer — the indicator is chosen to sit on the jump, not for its looks"
summary_de = "Phenolphthalein schlägt am Endpunkt dieser Titration um (pH 8,6); Methylorange hat schon viel früher umgeschlagen, mitten im Pufferbereich — der Indikator wird für den Sprung gewählt, nicht für seine Optik"
concepts = ["indicators"]
requires = ["equivalence-point"]
apparatus = ["burette", "conical-flask"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 10, LB4 Protonenübergänge/Säure-Base-Reaktionen (18 Std.)"
ages = { min = 15.0, max = 16.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Jgst. 10 (ISB) — titration and indicator selection"

[reaction.setup]
script = """
add v1 water 100mL
add v1 CH3COOH 0.005mol
add v1 NaOH 0.005mol
add v1 phenolphthalein 0.000005mol
new
add v2 water 100mL
add v2 CH3COOH 0.005mol
add v2 NaOH 0.0025mol
add v2 methyl_orange 0.000002mol
"""

[reaction.expect]
events = ["added:phenolphthalein", "added:methyl_orange"]
ph = { min = 8.5, max = 8.75 }

[reaction.expect.predict]
question = "This vinegar titration's equivalence point sits at pH 8.6, not 7. Which indicator marks it — phenolphthalein (turns 8.2–10) or methyl orange (turns 3.1–4.4)?"
question_de = "Der Äquivalenzpunkt dieser Essigtitration liegt bei pH 8,6, nicht bei 7. Welcher Indikator markiert ihn — Phenolphthalein (Umschlag 8,2–10) oder Methylorange (Umschlag 3,1–4,4)?"
options = [
  "Either — an indicator is a colour signal, and any colour signal will do",
  "Phenolphthalein: its turn sits on the endpoint. Methyl orange fires long before, deep in the buffer region",
  "Methyl orange — orange is easier to see against white than pale pink",
]
answer = 1
misconception = "An indicator is not a bell that rings at 'done' — it is a weak acid that changes form at its own pKa, wherever that is. The choice is an alignment problem: the indicator's transition window must sit on the titration's pH jump. Phenolphthalein's window straddles this endpoint's 8.6; methyl orange's window was crossed back near pH 4, in the slow buffer climb, where its colour change marks nothing of analytical interest at all."
misconception_de = "Ein Indikator ist keine Glocke, die bei 'fertig' läutet — er ist eine schwache Säure, die bei ihrem eigenen pKa-Wert die Form wechselt, wo immer der liegt. Die Wahl ist ein Ausrichtungsproblem: Das Umschlagfenster des Indikators muss auf dem pH-Sprung der Titration liegen. Das Fenster von Phenolphthalein überspannt die 8,6 dieses Endpunkts; das Fenster von Methylorange wurde schon bei pH 4 durchlaufen, im langsamen Pufferanstieg, wo sein Farbwechsel überhaupt nichts von analytischem Interesse markiert."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "All indicators are interchangeable signals: the chemistry of the dye plays no role, so any colour change means 'stop'."
reveals_de = "Alle Indikatoren gelten als austauschbare Signale: Die Chemie des Farbstoffs spielt keine Rolle, also bedeutet jeder Farbwechsel 'stopp'."
next = "Run the half-titrated flask (v2): methyl orange already reads orange at pH 4.69, half the base still unspent. An analyst stopping at that signal would report half the true concentration — the wrong indicator does not merely inconvenience, it answers a different question."
next_de = "Führe den halbtitrierten Kolben aus (v2): Methylorange zeigt bereits bei pH 4,69 Orange, obwohl die Hälfte der Base noch nicht verbraucht ist. Ein Analytiker, der bei diesem Signal stoppt, würde die halbe echte Konzentration melden — der falsche Indikator verursacht nicht nur eine Unannehmlichkeit, er beantwortet eine andere Frage."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "The indicator is chosen for visibility — an aesthetic decision about colours, with the pH axis absent from the choice entirely."
reveals_de = "Der Indikator wird nach Sichtbarkeit gewählt — eine ästhetische Entscheidung über Farben, bei der die pH-Achse in der Wahl überhaupt keine Rolle spielt."
next = "Visibility is real but secondary: the question an indicator answers is WHERE it turns, not how prettily. `weak-acid-endpoint-is-alkaline` computed this endpoint at 8.8-adjacent rather than 7 — that number is the whole reason phenolphthalein is the standard choice for weak-acid titrations, and it looked arbitrary only until the endpoint was computed."
next_de = "Sichtbarkeit ist real, aber zweitrangig: Die Frage, die ein Indikator beantwortet, ist WO er umschlägt, nicht wie hübsch. `weak-acid-endpoint-is-alkaline` berechnete diesen Endpunkt bei etwa 8,8 statt bei 7 — diese Zahl ist der ganze Grund, warum Phenolphthalein die Standardwahl für Titrationen schwacher Säuren ist, und sie wirkte nur so lange willkürlich, bis der Endpunkt berechnet war."

[reaction.registers]
lv1 = "Two magic dyes. One stays invisible until the very moment the sour is used up — then the flask blushes pink. The other changed colour ages ago, while there was still plenty of sour left. Only one of them is telling you when to stop."
lv1_de = "Zwei magische Farbstoffe. Einer bleibt unsichtbar bis zu dem Moment, in dem das Saure aufgebraucht ist — dann errötet der Kolben rosa. Der andere hat schon vor langer Zeit die Farbe gewechselt, als noch reichlich Saures übrig war. Nur einer von beiden sagt dir, wann du aufhören sollst."
lv2 = "An indicator is a weak acid with differently coloured forms; it turns near its own pKa. Phenolphthalein (transition ≈8.2–10) straddles this titration's equivalence point — the bench reads pH 8.62 and renders the flask pink. Methyl orange (≈3.1–4.4) completed its change inside the buffer region: v2, only half-titrated, already shows orange at pH 4.69."
lv2_de = "Ein Indikator ist eine schwache Säure mit unterschiedlich gefärbten Formen; sie schlägt nahe ihrem eigenen pKa-Wert um. Phenolphthalein (Umschlag ≈8,2–10) überspannt den Äquivalenzpunkt dieser Titration — das Labor liest pH 8,62 und stellt den Kolben rosa dar. Methylorange (≈3,1–4,4) hat seinen Wechsel bereits mitten im Pufferbereich abgeschlossen: v2, nur halbtitriert, zeigt bereits bei pH 4,69 Orange."
lv3 = "The colours are computed, not curated per pH: each indicator carries two measured spectra (acid and base form), the engine populates the forms by the Henderson–Hasselbalch ratio at the solved pH, and Beer–Lambert over the CIE observer renders the mixture — the pink at 8.62 and the orange at 4.69 are the same arithmetic that makes permanganate purple. One dosing honesty: the bench doses pure substance, so the micromole amounts here play the role of the real lab's 'two drops of indicator solution' — drop-based doses of the pure dye would be a hundredfold overdose and saturate every hue toward black."
lv3_de = "Die Farben werden berechnet, nicht pro pH-Wert kuratiert: Jeder Indikator führt zwei gemessene Spektren (Säure- und Baseform), die Engine besetzt die Formen nach dem Henderson-Hasselbalch-Verhältnis beim gelösten pH-Wert, und Beer-Lambert über den CIE-Beobachter stellt die Mischung dar — das Rosa bei 8,62 und das Orange bei 4,69 sind dieselbe Rechnung, die Permanganat violett macht. Eine Ehrlichkeit bei der Dosierung: Das Labor dosiert reinen Stoff, sodass die Mikromol-Mengen hier die Rolle der 'zwei Tropfen Indikatorlösung' des echten Labors spielen — tropfenbasierte Dosen des reinen Farbstoffs wären eine hundertfache Überdosis und würden jeden Farbton bis hin zu Schwarz sättigen."

