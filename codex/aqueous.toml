[[reaction]]
id = "the-in-between-colour-is-a-mixture"
spine = ["eigenschaften-von-saeuren-und-basen"]
summary = "Bromothymol blue near neutral is green — not a third colour of the dye, but the computed mixture of its yellow and blue forms at the solved ratio"
summary_de = "Bromthymolblau ist nahe dem neutralen Punkt grün — keine dritte Farbe des Farbstoffs, sondern die berechnete Mischung seiner gelben und blauen Form im gelösten Verhältnis"
concepts = ["indicators", "colour-from-mixed-spectra"]
requires = ["indicators"]
apparatus = ["beaker"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 12, LB2 Protolysegleichgewichte"
ages = { min = 17.0, max = 18.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Oberstufe (ISB) — indicator equilibrium as a protolysis equilibrium"

[reaction.setup]
script = """
add v1 water 100mL
add v1 NaCl 0.001mol
add v1 bromothymol_blue 0.000002mol
add v1 HCl 0.0005mol
add v1 NaOH 0.001mol
"""

[reaction.expect]
events = ["added:bromothymol_blue"]
ph = { min = 11.4, max = 11.8 }

[reaction.expect.predict]
question = "Bromothymol blue is yellow in acid and blue in base. Near pH 7, what colour is the solution?"
question_de = "Bromthymolblau ist in Säure gelb und in Base blau. Welche Farbe hat die Lösung nahe pH 7?"
options = [
  "Yellow or blue, whichever it has flipped to — an indicator is a switch",
  "Green — both forms are present at once, and their colours mix",
  "Colourless — halfway between, the two colours cancel out",
]
answer = 1
misconception = "An indicator is not a switch but an equilibrium: at pH near its pKa, roughly half the molecules are in each form, simultaneously. Half the dye absorbing like the yellow form plus half absorbing like the blue form transmits green — the same way mixing paints does, because absorbances add. Cancellation is how opposing *lights* behave; absorbing dyes only ever subtract more."
misconception_de = "Ein Indikator ist kein Schalter, sondern ein Gleichgewicht: bei einem pH-Wert nahe seinem pKa liegen etwa die Hälfte der Moleküle in jeder Form vor, gleichzeitig. Die Hälfte des Farbstoffs, die wie die gelbe Form absorbiert, plus die Hälfte, die wie die blaue Form absorbiert, lässt Grün durch — genauso, wie Farben beim Mischen wirken, weil sich Absorptionen addieren. Auslöschung ist, wie sich entgegengesetzte *Lichter* verhalten; absorbierende Farbstoffe subtrahieren nur immer mehr."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "The indicator as a binary switch: each molecule — or the whole beaker — is in exactly one state, and 'transition range' just means uncertainty about which."
reveals_de = "Der Indikator als binärer Schalter: jedes Molekül — oder das ganze Becherglas — befindet sich in genau einem Zustand, und 'Übergangsbereich' bedeutet nur Unsicherheit darüber, in welchem."
next = "Walk the beaker through all three colours in this entry's script: yellow in acid, blue-green near neutral, blue in base. A switch has no stable middle; an equilibrium population does, and the green IS the population statement — you are seeing the ratio."
next_de = "Führe das Becherglas im Skript dieses Eintrags durch alle drei Farben: gelb in Säure, blaugrün nahe neutral, blau in Base. Ein Schalter hat keine stabile Mitte; eine Gleichgewichtspopulation schon, und das Grün IST die Aussage über diese Population — du siehst das Verhältnis."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Colours as opposites that annul: yellow plus blue equals nothing, the way positive and negative do."
reveals_de = "Farben als Gegensätze, die sich auslöschen: Gelb plus Blau ergibt nichts, so wie Plus und Minus."
next = "Sort out lights from dyes: complementary LIGHTS can cancel to white, but a dye works by absorbing, and two absorbers in one beaker absorb the union — red taken by one form, orange-red by the other, leaving green to pass. Absorbances add; they never subtract. The bench's colour engine literally adds the two spectra before rendering."
next_de = "Trenne Lichter von Farbstoffen: Komplementäre LICHTER können sich zu Weiß auslöschen, aber ein Farbstoff wirkt durch Absorption, und zwei Absorber in einem Becherglas absorbieren die Vereinigung — Rot wird von der einen Form aufgenommen, Orangerot von der anderen, sodass Grün durchgelassen wird. Absorptionen addieren sich; sie subtrahieren sich nie. Die Farbmaschine des Labors addiert die beiden Spektren buchstäblich, bevor sie darstellt."

[reaction.registers]
lv1 = "This dye is yellow in sour water and blue in soapy water. In plain water it is green — because it is half yellow-form and half blue-form at the same time, and your eye adds them up."
lv1_de = "Dieser Farbstoff ist in saurem Wasser gelb und in seifigem Wasser blau. In reinem Wasser ist er grün — weil er gleichzeitig zur Hälfte in der gelben und zur Hälfte in der blauen Form vorliegt, und dein Auge sie addiert."
lv2 = "The indicator equilibrium HInd ⇌ H⁺ + Ind⁻ sits at its pKa near 7: in acid the yellow HInd dominates, in base the blue Ind⁻, and near neutral both are populated — the bench renders yellow, then blue-green, then blue as this script swings the same beaker across the scale."
lv2_de = "Das Indikatorgleichgewicht HInd ⇌ H⁺ + Ind⁻ liegt bei seinem pKa nahe 7: in Säure dominiert das gelbe HInd, in Base das blaue Ind⁻, und nahe neutral sind beide besetzt — das Labor stellt gelb, dann blaugrün, dann blau dar, während dieses Skript dasselbe Becherglas über die Skala schwingt."
lv3 = "The green never exists as a curated colour anywhere in the data: the engine holds one measured spectrum per form, populates the forms by the computed ratio at the solved pH, sums the absorbances, and integrates over the CIE 1931 observer. The mid-colour is therefore a *prediction* that mixing works — the same additivity claim the README makes for permanganate's concentration-dependent hue, here testable by eye at every pH in between. Endpoint honesty: the script parks the beaker at pH 11.63 (fully blue) so the pH claim is checkable; the blue-green reading occurs mid-script, at the near-neutral stop."
lv3_de = "Das Grün existiert nirgendwo in den Daten als kuratierte Farbe: Die Engine führt ein gemessenes Spektrum pro Form, besetzt die Formen nach dem berechneten Verhältnis beim gelösten pH-Wert, summiert die Absorptionen und integriert über den CIE-1931-Beobachter. Die Zwischenfarbe ist also eine *Vorhersage*, dass Mischen funktioniert — dieselbe Additivitätsbehauptung, die das README für den konzentrationsabhängigen Farbton von Permanganat macht, hier bei jedem pH-Wert dazwischen mit bloßem Auge überprüfbar. Ehrlichkeit beim Endpunkt: Das Skript parkt das Becherglas bei pH 11,63 (vollständig blau), sodass die pH-Behauptung überprüfbar ist; die blaugrüne Messung erfolgt mitten im Skript, an der nahezu neutralen Station."

