[[reaction]]
id = "permanent-hardness-makes-gypsum"
spine = ["wasser-trinkwasser-und-mehr"]
equation = "Ca²⁺ + SO₄²⁻ + 2 H₂O → CaSO₄·2H₂O(s)↓"
concepts = ["permanent-hardness"]
requires = ["hard-water", "waters-of-crystallisation"]
apparatus = ["beaker", "ph-meter"]
calculations = ["moles-from-mass"]

[[reaction.curriculum]]
system = "nrw-kernlehrplan-g9"
stage = "Sek I, Zweite Stufe (Jg. 9/10), IF6 Salze und Ionen"
ages = { min = 14.0, max = 16.0 }
source = "Kernlehrplan Chemie Gymnasium G9 NRW, Heft 3415 (RdErl. 23.06.2019) — precipitation of salts from mixed solutions"

[reaction.setup]
script = """
add v1 water 1000mL
add v1 CaCl2 11.1g
add v1 MgSO4 12.0g
"""

[reaction.expect]
events = ["precipitated:gypsum", "dissolved:MgSO4"]
ph = { min = 6.3, max = 6.7 }

[reaction.registers]
lv1 = "Two clear liquids meet and a white solid grows — and this one is plaster. The same stuff a broken arm gets set in, made in a beaker out of two things that looked like water."
lv1_de = "Zwei klare Flüssigkeiten treffen aufeinander, und ein weißer Feststoff wächst heran — und dieser hier ist Gips. Derselbe Stoff, in dem ein gebrochener Arm eingegipst wird, hergestellt in einem Becherglas aus zwei Dingen, die wie Wasser aussahen."
lv2 = "Calcium from the chloride meets sulfate from the Epsom salts and precipitates gypsum, CaSO₄·2H₂O. 0.064 of the 0.1 mol of calcium comes out; the magnesium stays dissolved because magnesium sulfate is soluble."
lv2_de = "Calcium aus dem Chlorid trifft auf Sulfat aus dem Bittersalz und fällt als Gips aus, CaSO₄·2H₂O. 0,064 der 0,1 mol Calcium fallen aus; das Magnesium bleibt gelöst, weil Magnesiumsulfat löslich ist."
lv3 = "Temporary hardness (bicarbonate) is removed by boiling; permanent hardness (sulfate) is not — and this entry shows why the distinction is about which anion is present, not about how hard the water is. The engine also books 2 mol of water per mole of gypsum out of the solvent, so the free water in the vessel measurably falls: 55.34 mol to 55.21 mol."
lv3_de = "Temporäre Härte (Hydrogencarbonat) wird durch Kochen entfernt; permanente Härte (Sulfat) nicht — und dieser Eintrag zeigt, warum die Unterscheidung davon abhängt, welches Anion vorliegt, nicht davon, wie hart das Wasser ist. Die Engine bucht außerdem 2 mol Wasser pro Mol Gips aus dem Lösungsmittel ab, sodass das freie Wasser im Gefäß messbar sinkt: von 55,34 mol auf 55,21 mol."

