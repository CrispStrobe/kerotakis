calculations = ["moles-from-mass", "concentration"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 10, LB4 Protonenübergänge/Säure-Base-Reaktionen (18 Std.)"
ages = { min = 15.0, max = 16.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Jgst. 10 (ISB) — colour as a concentration indicator"

[reaction.setup]
script = """
add v1 water 1000mL
add v1 KMnO4 0.016g
look v1
"""

[reaction.expect]
events = ["dissolved:KMnO4", "observed"]
ph = { min = 6.9, max = 7.1 }

[reaction.expect.predict]
question = "Sixteen milligrams of potassium permanganate — a speck — go into a full litre of water. What do you see?"
question_de = "Sechzehn Milligramm Kaliumpermanganat — ein winziges Krümelchen — kommen in einen vollen Liter Wasser. Was siehst du?"
options = [
  "Clear water; sixteen milligrams in a litre is far too little to see",
  "Water that is clearly, obviously purple",
  "A faint purple only if you look through the whole length of the beaker",
]
answer = 1
misconception = "Amount and visibility get run together, so 'a tiny mass' is expected to mean 'a faint colour'. Visibility is set by molar absorptivity, and permanganate's is enormous — about 2400 L mol⁻¹ cm⁻¹. At 10⁻⁴ mol/L the solution is frankly purple. Copper sulfate at the same concentration would be invisible. The same reasoning is why a drop of food colouring tints a bath and a spoon of sugar does not."
misconception_de = "Menge und Sichtbarkeit werden hier vermengt, sodass 'eine winzige Masse' 'eine schwache Farbe' bedeuten soll. Sichtbarkeit wird durch den molaren Extinktionskoeffizienten bestimmt, und der von Permanganat ist gewaltig — etwa 2400 L mol⁻¹ cm⁻¹. Bei 10⁻⁴ mol/L ist die Lösung unverkennbar violett. Kupfersulfat bei derselben Konzentration wäre unsichtbar. Dieselbe Logik erklärt, warum ein Tropfen Lebensmittelfarbe ein ganzes Badewasser färbt und ein Löffel Zucker nicht."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Visibility is read straight off the mass: milligrams in a litre rounds to nothing, so the eye should see nothing — every substance carrying the same, feeble colour per gram."
reveals_de = "Sichtbarkeit wird direkt von der Masse abgelesen: Milligramm in einem Liter rundet sich auf nichts, also sollte das Auge nichts sehen — jeder Stoff trägt scheinbar dieselbe, schwache Farbe pro Gramm."
next = "`look v1`: the bench computes the colour from the absorption spectrum rather than asserting it, and the answer is frankly purple. Then dissolve the same few milligrams of copper sulfate — invisible. The mass was identical; the molar absorptivity was not, and that is the whole story."
next_de = "`look v1`: Das Labor berechnet die Farbe aus dem Absorptionsspektrum, statt sie einfach zu behaupten, und die Antwort lautet unverkennbar violett. Löse dann dieselben wenigen Milligramm Kupfersulfat — unsichtbar. Die Masse war identisch; der molare Extinktionskoeffizient nicht, und das ist die ganze Geschichte."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Colour conceded, but scaled to the speck: a tiny amount can only do tiny things, so the tint must need the beaker's full depth to accumulate."
reveals_de = "Farbe wird zugestanden, aber im Maßstab des Krümelchens: Eine winzige Menge kann nur Winziges bewirken, also muss sich der Farbton erst über die gesamte Tiefe des Becherglases aufbauen."
next = "The entry's own comparison is the discriminator: copper sulfate at the *same concentration* shows nothing through any depth, while permanganate is unmistakable in a centimetre. If amount set visibility they would match; ε ≈ 2400 against a few is what actually separates them."
next_de = "Der eigene Vergleich dieses Eintrags ist das entscheidende Kriterium: Kupfersulfat bei *derselben Konzentration* zeigt bei keiner Tiefe etwas, während Permanganat schon in einem Zentimeter unverkennbar ist. Würde die Menge die Sichtbarkeit bestimmen, wären sie gleich; ε ≈ 2400 gegenüber wenigen ist das, was sie tatsächlich unterscheidet."

[reaction.registers]
lv1 = "A speck of purple powder, less than a grain of rice, turns a whole litre of water purple. Some colours are astonishingly strong."
lv1_de = "Ein Krümelchen violettes Pulver, kleiner als ein Reiskorn, färbt einen ganzen Liter Wasser violett. Manche Farben sind erstaunlich stark."
lv2 = "0.016 g is 1.0 × 10⁻⁴ mol. In 1 L that is 10⁻⁴ mol/L, and with a molar absorptivity near 2400 the absorbance through a normal beaker is around 0.2 — plainly visible. The solution stays neutral at pH 7.00: neither K⁺ nor MnO₄⁻ reacts with water."
lv2_de = "0,016 g sind 1,0 × 10⁻⁴ mol. In 1 L sind das 10⁻⁴ mol/L, und bei einem molaren Extinktionskoeffizienten nahe 2400 liegt die Extinktion durch ein normales Becherglas bei etwa 0,2 — deutlich sichtbar. Die Lösung bleibt bei pH 7,00 neutral: Weder K⁺ noch MnO₄⁻ reagiert mit Wasser."
lv3 = "Two different kinds of claim sit in one beaker, and the lab keeps them apart. The pH 7.00 and the speciation are computed. The colour is curated — the registry carries permanganate's sRGB and a tinting strength of 12 000, because a real d–d and charge-transfer spectrum is not something a thermodynamic database or a cheap calculation can give honestly. The provenance says which is which."
lv3_de = "Zwei verschiedene Arten von Behauptung stecken in einem Becherglas, und das Labor hält sie auseinander. Der pH-Wert 7,00 und die Speziation sind berechnet. Die Farbe ist kuratiert — die Registry führt das sRGB von Permanganat und eine Färbestärke von 12.000, weil ein echtes d-d- und Ladungstransfer-Spektrum nichts ist, was eine thermodynamische Datenbank oder eine billige Rechnung ehrlich liefern kann. Die Provenienz sagt, was von beidem was ist."

[reaction.provenance]
source = "Molar absorptivity of permanganate, standard spectrophotometric reference value; colour curated in the Kerotakis species registry. Speciation and pH from PHREEQC wateq4f.dat (USGS). Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "PHREEQC via Kerotakis L2 for pH and speciation; colour is curated, not computed"

[[reaction]]
id = "ethanol-and-water-mix"
spine = ["weitere-stoffeigenschaften"]
summary = "C₂H₅OH(l) + H₂O(l) → one liquid phase (fully miscible)"
summary_de = "C₂H₅OH(l) + H₂O(l) → eine flüssige Phase (vollständig mischbar)"
concepts = ["miscibility", "mixtures"]
requires = ["solutions"]
apparatus = ["measuring-cylinder", "beaker"]
calculations = ["concentration"]
models = ["particle-model", "intermolecular-forces"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium NTG Jgst. 8, LB2 Stoffe und ihre Eigenschaften (23 Std.)"
ages = { min = 13.0, max = 14.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium NTG Jgst. 8 (ISB) — miscibility and hydrogen bonding"

[reaction.setup]
script = """
add v1 water 100mL
add v1 ethanol 50mL
look v1
"""

[reaction.expect]
events = ["added:ethanol", "observed"]

[reaction.expect.predict]
question = "100 mL of water and 50 mL of ethanol are poured into one cylinder. What does the level read?"
question_de = "100 mL Wasser und 50 mL Ethanol werden in einen Messzylinder gegossen. Was zeigt der Füllstand?"
options = [
  "150 mL — volumes add up",
  "A little under 150 mL, because the two kinds of molecule pack together more tightly than either does alone",
  "Two layers, like oil and water",
]
answer = 1
misconception = "Volume is treated as a conserved quantity like mass. It is not: mass adds exactly, volume does not, because volume is a statement about packing. Ethanol's small hydrophobic tail slots into the gaps in water's hydrogen-bonded network, and the real mixture comes out around 145 mL. Kerotakis reports 150.0 mL — the engine assumes additive volumes, and this is a stated limitation, not a claim about the world."
misconception_de = "Volumen wird als Erhaltungsgröße wie Masse behandelt. Das ist es nicht: Masse addiert sich exakt, Volumen nicht, weil Volumen eine Aussage über die Packung ist. Ethanols kleiner hydrophober Schwanz schlüpft in die Lücken im wasserstoffbrückengebundenen Netzwerk des Wassers, und die reale Mischung ergibt etwa 145 mL. Kerotakis berichtet 150,0 mL — die Engine geht von additiven Volumina aus, und das ist eine erklärte Einschränkung, keine Behauptung über die reale Welt."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Volume conserves the way mass does: what goes in is what reads on the cylinder, because 'amount of stuff' is one quantity rather than two. On this one, the bench itself keeps the learner company — it reports 150.0, a stated limitation."
reveals_de = "Volumen erhält sich so wie Masse: Was hineingeht, ist das, was auf dem Zylinder abzulesen ist, weil 'Menge an Stoff' eine einzige Größe ist und keine zwei. Hier leistet sogar das Labor selbst dem Lernenden Gesellschaft — es berichtet 150,0, eine erklärte Einschränkung."
next = "Separate the two quantities: `measure v1 balance` adds exactly, every time; a real measuring cylinder does not (≈145 mL). This is the rare entry where the honest check is the kitchen, not the simulation — the engine assumes additive volumes and says so, which is itself the lesson about trusting stated limitations."
next_de = "Trenne die beiden Größen: `measure v1 balance` addiert sich jedes Mal exakt; ein echter Messzylinder tut das nicht (≈145 mL). Das ist der seltene Eintrag, bei dem die ehrliche Kontrolle die Küche ist, nicht die Simulation — die Engine geht von additiven Volumina aus und sagt das auch, was selbst die Lektion über das Vertrauen in erklärte Einschränkungen ist."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Alcohol is filed with oil: organic, so it must float apart — miscibility as a binary read off the substance's family rather than off what its molecules can offer water."
reveals_de = "Alkohol wird mit Öl in eine Schublade gesteckt: organisch, also müsse er sich abscheiden — Mischbarkeit wird als binäre Eigenschaft der Stofffamilie gelesen statt davon, was seine Moleküle dem Wasser bieten können."
next = "Pour it at any ratio: no interface, ever. Ethanol's OH end hydrogen-bonds into the water network while the short tail tucks into the gaps; oil has no OH to offer and gets the layer this learner expected. The family was the wrong sorting key — the functional group is the right one."
next_de = "Gieße es in beliebigem Verhältnis: nie eine Grenzfläche. Ethanols OH-Ende bildet Wasserstoffbrücken in das Wassernetzwerk, während sich der kurze Schwanz in die Lücken schmiegt; Öl hat kein OH anzubieten und bekommt die Schicht, die dieser Lernende erwartet hat. Die Stofffamilie war das falsche Sortierkriterium — die funktionelle Gruppe ist das richtige."

[reaction.registers]
lv1 = "Alcohol and water mix into one single clear liquid — no layers, no line, no cloudiness. You cannot tell by looking that there are two things in there at all."
lv1_de = "Alkohol und Wasser mischen sich zu einer einzigen klaren Flüssigkeit — keine Schichten, keine Trennlinie, keine Trübung. Man kann durch bloßes Hinsehen nicht erkennen, dass überhaupt zwei Dinge darin sind."
lv2 = "Ethanol and water are miscible in all proportions: the OH group hydrogen-bonds to water while the small ethyl group is not big enough to force separation. Contrast oil, whose long hydrocarbon chains cannot pay the entropic cost of disrupting water's network."
lv2_de = "Ethanol und Wasser sind in jedem Verhältnis mischbar: Die OH-Gruppe bildet Wasserstoffbrücken zum Wasser, während die kleine Ethylgruppe nicht groß genug ist, um eine Trennung zu erzwingen. Im Gegensatz dazu können Öls lange Kohlenwasserstoffketten die entropischen Kosten einer Störung des Wassernetzwerks nicht aufbringen."
lv3 = "The honest boundary: the bench sums pure-component volumes (150.0 mL) where the real excess volume of mixing is about −3.5%, giving ≈145 mL. This is the volume of mixing, a real thermodynamic quantity that the current model does not carry. `evaporate` states a related gap out loud — separating ethanol from water needs vapour–liquid equilibrium, which is L3 and is not wired, so this vessel cannot be distilled."
lv3_de = "Die ehrliche Grenze: Das Labor summiert die Volumina der reinen Komponenten (150,0 mL), wo das reale Exzessvolumen der Mischung bei etwa −3,5 % liegt, was ≈145 mL ergibt. Das ist das Mischungsvolumen, eine echte thermodynamische Größe, die das aktuelle Modell nicht führt. `evaporate` benennt eine verwandte Lücke offen — Ethanol von Wasser zu trennen erfordert ein Dampf-Flüssig-Gleichgewicht, das ist L3 und nicht verdrahtet, sodass dieses Gefäß nicht destilliert werden kann."

[reaction.provenance]
source = "Standard curriculum miscibility and intermolecular forces. Editorial judgement (Kerotakis): this entry exists to expose the additive-volume assumption rather than to hide it, so the model boundary is taught alongside the phenomenon.. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "Kerotakis bench (volumes additive, stated as an approximation); no aqueous solver applies — neither component ionises"

