options = [
  "Nothing but very salty water; it all dissolved once, so it stays dissolved",
  "All 117 g back as crystals, since the water has mostly gone",
  "About 46 g of crystals, with the rest still dissolved in the remaining water",
]
answer = 2
misconception = "The first answer forgets that solubility is per unit of *solvent*, not a one-way door: take the water away and the salt has nowhere to stay. The second overshoots — 200 mL of water can still hold 1.22 mol of salt, so only the excess crystallises. Working out which fraction comes back is the whole of salt-pan chemistry, and it is a subtraction: what you put in, minus what the remaining water can still hold."
misconception_de = "Die erste Antwort vergisst, dass Löslichkeit pro Einheit *Lösungsmittel* gilt und keine Einbahnstraße ist: Nimmt man das Wasser weg, hat das Salz keinen Platz mehr zu bleiben. Die zweite schießt übers Ziel hinaus — 200 mL Wasser können immer noch 1,22 mol Salz halten, also kristallisiert nur der Überschuss aus. Herauszufinden, welcher Anteil zurückkommt, ist die gesamte Chemie der Salzgärten, und es ist eine Subtraktion: das, was hineingegeben wurde, minus das, was das verbliebene Wasser noch halten kann."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Dissolving is a one-way door: once a solid has 'become liquid' it stays that way, however much of the liquid leaves — solubility as an event in the salt's past rather than a ratio to the water's present."
reveals_de = "Lösen gilt als Einbahnstraße: Sobald ein Feststoff 'flüssig geworden' ist, bleibt er das, egal wie viel von der Flüssigkeit verschwindet — Löslichkeit als Ereignis in der Vergangenheit des Salzes statt als Verhältnis zur Gegenwart des Wassers."
next = "Watch the bench report the moment of return: crystals appear exactly when the shrinking water's ceiling crosses the load, not before. The salt never changed; its allowance per gram of water did."
next_de = "Beobachte, wie das Labor den Moment der Rückkehr meldet: Kristalle erscheinen genau dann, wenn die Obergrenze des schrumpfenden Wassers die Beladung unterschreitet, nicht vorher. Das Salz hat sich nie verändert; sein Kontingent pro Gramm Wasser schon."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "The right mechanism, overshot: less water means crystals, so almost no water means all the crystals — the remaining water's own carrying capacity drops out of the account."
reveals_de = "Der richtige Mechanismus, übertrieben: weniger Wasser bedeutet Kristalle, also müsste fast kein Wasser alle Kristalle bedeuten — die eigene Tragfähigkeit des verbleibenden Wassers fällt aus der Rechnung heraus."
next = "Do the salt-pan subtraction: the 200 mL that remain still hold 1.22 mol, about 71 g. 117 g in, 71 g still afloat, 46 g in the basin — the answer is a ledger, and the bench's balance agrees with it."
next_de = "Mach die Salzgarten-Subtraktion: Die verbliebenen 200 mL halten noch 1,22 mol, etwa 71 g. 117 g hinein, 71 g noch schwimmend, 46 g in der Schale — die Antwort ist eine Bilanz, und die Waage des Labors bestätigt sie."

[reaction.registers]
lv1 = "Salty water, boiled down. As the water leaves, white crystals appear on the bottom — the sea's oldest trick, and how every salt pan in the world works."
lv1_de = "Salzwasser, eingekocht. Während das Wasser entweicht, erscheinen weiße Kristalle am Boden — der älteste Trick des Meeres, und so funktioniert jeder Salzgarten der Welt."
lv2 = "2.00 mol of NaCl dissolves in 1 L. Removing 80% of the water leaves 200 mL, which can hold only 1.22 mol at saturation, so 0.78 mol (about 46 g) crystallises out."
lv2_de = "2,00 mol NaCl lösen sich in 1 L. Werden 80 % des Wassers entfernt, bleiben 200 mL übrig, die bei Sättigung nur 1,22 mol halten können, sodass 0,78 mol (etwa 46 g) auskristallisieren."
lv3 = "The remaining solution sits at I = 6.12 mol/kgw, far outside the Debye–Hückel domain — this problem routes to the Pitzer ion-interaction model, and `explain` will show wateq4f and minteq.v4 giving materially different answers for the same beaker. Note also γ(Na⁺) = 1.65 here: an activity coefficient above one is normal in concentrated brine and is not an error."
lv3_de = "Die verbleibende Lösung liegt bei I = 6,12 mol/kgw, weit außerhalb des Debye-Hückel-Bereichs — dieses Problem wird an das Pitzer-Ionenwechselwirkungsmodell weitergeleitet, und `explain` zeigt, dass wateq4f und minteq.v4 für dasselbe Becherglas deutlich unterschiedliche Antworten liefern. Beachte auch γ(Na⁺) = 1,65 hier: Ein Aktivitätskoeffizient über eins ist in konzentrierter Sole normal und kein Fehler."

[reaction.provenance]
source = "Standard curriculum evaporation and crystallisation; halite solubility from PHREEQC (pitzer.dat). Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "PHREEQC via Kerotakis L2"

# -------------------------------------------------------- colour and mixtures

[[reaction]]
id = "permanganate-is-visible-when-almost-absent"
spine = ["konzentrationsberechnungen"]
equation = "KMnO₄ → K⁺ + MnO₄⁻   (ε ≈ 2400 L mol⁻¹ cm⁻¹ at 525 nm)"
concepts = ["colour-intensity"]
