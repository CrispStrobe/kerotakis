stage = "GCSE Combined Science: Trilogy (AQA 8464), 4.1.1 Atoms, elements and compounds"
ages = { min = 14.0, max = 16.0 }
source = "AQA GCSE Combined Science: Trilogy specification (8464) — separation techniques including filtration"

[reaction.setup]
script = """
add v1 water 100mL
add v1 NaCl 0.58g
add v1 AgNO3 1.70g
new
filter v1 v2
look v1
look v2
"""

[reaction.expect]
events = ["precipitated:AgCl", "filtered", "observed"]

[reaction.expect.predict]
question = "A cloudy silver-chloride mixture is poured through filter paper. What is in the funnel, and what is in the flask underneath?"
question_de = "Eine trübe Silberchlorid-Mischung wird durch Filterpapier gegossen. Was ist im Trichter, und was ist im Kolben darunter?"
options = [
  "Solid silver chloride in the funnel; a clear solution of sodium and nitrate ions in the flask",
  "Everything in the flask — filter paper only stops big lumps, and dissolved things are small",
  "Solid in the funnel; pure water in the flask, since the filter removes the chemicals",
]
answer = 0
misconception = "The third option is the common one: filtration is imagined as purification. Filter paper separates by phase, not by cleanliness — anything dissolved goes straight through. The filtrate here is not water; it is a sodium nitrate solution, and it still contains 8 × 10⁻⁴ mol/kgw of dissolved silver. If you want the dissolved part back you must evaporate, not filter."
misconception_de = "Die dritte Option ist die häufige: Filtration wird sich als Reinigung vorgestellt. Filterpapier trennt nach Phase, nicht nach Sauberkeit — alles Gelöste geht direkt hindurch. Das Filtrat hier ist kein Wasser; es ist eine Natriumnitrat-Lösung, und sie enthält immer noch 8 × 10⁻⁴ mol/kgw gelöstes Silber. Willst du den gelösten Teil zurückgewinnen, musst du eindampfen, nicht filtrieren."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "The precipitate is filed as 'in the liquid', so it goes where the liquid goes — the difference between suspended solid and dissolved ions is a difference of size only, and everything chemical is small."
reveals_de = "Der Niederschlag wird als 'in der Flüssigkeit' eingeordnet, also geht er dorthin, wohin die Flüssigkeit geht — der Unterschied zwischen suspendiertem Feststoff und gelösten Ionen wird nur als Größenunterschied gesehen, und alles Chemische ist klein."
next = "Pour and `inspect` both vessels: the AgCl portion is in neither solution — it stayed a solid, and the paper holds phases, not sizes. The cloudiness that would not pass is the same cloudiness that settles if you simply wait."
next_de = "Gieße und `inspect` beide Gefäße: Der AgCl-Anteil ist in keiner der beiden Lösungen — er blieb ein Feststoff, und das Papier hält Phasen zurück, keine Größen. Die Trübung, die nicht durchgeht, ist dieselbe Trübung, die sich absetzt, wenn du einfach wartest."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Filtration as purification: the paper takes 'the chemicals' out, so what drips through is clean — separation imagined by cleanliness rather than by phase."
reveals_de = "Filtration als Reinigung: Das Papier nimmt 'die Chemikalien' heraus, also ist das, was durchtropft, sauber — Trennung wird sich als Sauberkeit vorgestellt, nicht als Phase."
next = "Evaporate the filtrate (`crystallising-salt-from-brine` is the move): crystals of sodium nitrate appear out of the 'pure water', and the lv3 readout still shows 8 × 10⁻⁴ mol/kgw of dissolved silver that no paper can hold back. What filtration removes is a phase; what purity needs is a different operation."
next_de = "Dampfe das Filtrat ein (`crystallising-salt-from-brine` ist der richtige Schritt): Kristalle von Natriumnitrat erscheinen aus dem 'reinen Wasser', und die lv3-Anzeige zeigt immer noch 8 × 10⁻⁴ mol/kgw gelöstes Silber, das kein Papier zurückhalten kann. Was Filtration entfernt, ist eine Phase; was Reinheit braucht, ist ein anderer Vorgang."

[reaction.registers]
lv1 = "Pour the cloudy mixture through the paper cone. The white solid stays behind in the paper, and what drips through is completely clear — but it is not pure water, and it is not safe to drink."
lv1_de = "Gieße die trübe Mischung durch den Papierkegel. Der weiße Feststoff bleibt im Papier zurück, und was durchtropft, ist völlig klar — aber es ist kein reines Wasser, und es ist nicht sicher zu trinken."
lv2 = "Filtration separates by phase: 0.0099 mol of solid AgCl is retained (1.4 g), while the whole aqueous phase — water, Na⁺, NO₃⁻ and the trace dissolved silver — passes into v2. Weighing the dried residue is how a precipitation is quantified."
lv2_de = "Filtration trennt nach Phase: 0,0099 mol festes AgCl werden zurückgehalten (1,4 g), während die gesamte wässrige Phase — Wasser, Na⁺, NO₃⁻ und die Spur gelöstes Silber — in v2 übergeht. Das Wiegen des getrockneten Rückstands ist die Methode, um eine Fällung zu quantifizieren."
lv3 = "The engine re-equilibrates both vessels after the transfer, which is why the filtrate is characterised separately: pH 7.23, I = 0.10 mol/kgw, with Ag⁺ at 8.1 × 10⁻⁴ mol/kgw. The residue vessel holds solid only and has no solution at all, so a pH meter in it reads nothing — the lab says so rather than inventing a number."
lv3_de = "Die Engine bringt beide Gefäße nach der Übertragung neu ins Gleichgewicht, weshalb das Filtrat gesondert charakterisiert wird: pH 7,23, I = 0,10 mol/kgw, mit Ag⁺ bei 8,1 × 10⁻⁴ mol/kgw. Das Rückstandsgefäß enthält nur Feststoff und überhaupt keine Lösung, sodass ein pH-Meter darin nichts anzeigt — das Labor sagt das ehrlich, statt eine Zahl zu erfinden."

