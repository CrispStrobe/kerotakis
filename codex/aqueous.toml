[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 10, LB4 Protonenübergänge/Säure-Base-Reaktionen (18 Std.)"
ages = { min = 15.0, max = 16.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Jgst. 10 (ISB) — titration endpoints and indicator choice"

[reaction.setup]
script = """
add v1 water 1000mL
add v1 CH3COOH 0.1mol
add v1 NaOH 0.1mol
"""

[reaction.expect]
events = ["dissolved:NaOH"]
ph = { min = 8.6, max = 8.9 }

[reaction.expect.predict]
question = "You neutralise vinegar with exactly the matching amount of sodium hydroxide. What is the pH at the endpoint?"
question_de = "Du neutralisierst Essig mit genau der passenden Menge Natriumhydroxid. Wie hoch ist der pH-Wert am Endpunkt?"
options = [
  "7 — that is what neutral means",
  "About 8.8 — the solution is alkaline",
  "About 5 — some acid always survives",
]
answer = 1
misconception = "\"Neutralised means pH 7\" is true only when both partners are strong. Here the acid is weak, so its conjugate base is strong enough to matter: acetate takes protons back off water and leaves hydroxide behind. This is exactly why phenolphthalein (colour change ≈ 8.2–10) is the right indicator for this titration and methyl orange is the wrong one — a choice that looks arbitrary until you know the endpoint is not at 7."
misconception_de = "\"Neutralisiert bedeutet pH 7\" stimmt nur, wenn beide Partner stark sind. Hier ist die Säure schwach, sodass ihre konjugierte Base stark genug ist, um mitzuspielen: Acetat nimmt Protonen vom Wasser zurück und lässt Hydroxid übrig. Genau deshalb ist Phenolphthalein (Farbumschlag ≈ 8,2–10) der richtige Indikator für diese Titration und Methylorange der falsche — eine Wahl, die willkürlich wirkt, bis man weiß, dass der Endpunkt nicht bei 7 liegt."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "'Neutralised' and 'neutral' are the same word, so they must be the same state — a rule learned where it is true (`neutralisation`, strong against strong) and carried to where it is not."
reveals_de = "'Neutralisiert' und 'neutral' sind dasselbe Wort, also müssen sie denselben Zustand bedeuten — eine Regel, die dort gelernt wurde, wo sie stimmt (`neutralisation`, stark gegen stark), und dorthin übertragen, wo sie es nicht tut."
next = "Run both titrations side by side: HCl against NaOH really does land on 7.00 (`neutralisation`); this one lands at 8.8. Same procedure, same 'exactly matching' amounts — the difference walked in with the conjugate base."
next_de = "Führe beide Titrationen nebeneinander aus: HCl gegen NaOH landet tatsächlich bei 7,00 (`neutralisation`); diese hier landet bei 8,8. Gleiches Verfahren, gleiche 'genau passende' Mengen — der Unterschied kam mit der konjugierten Base ins Spiel."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Reactions never quite finish in this picture, so some acid must survive and keep the solution sour — equilibrium as universal incompleteness, pinned on the wrong species."
reveals_de = "Reaktionen werden in diesem Bild nie ganz fertig, also muss etwas Säure übrig bleiben und die Lösung sauer halten — Gleichgewicht als universelle Unvollständigkeit, der falschen Spezies angeheftet."
next = "Ask for the speciation at the endpoint (lv3): the surviving actor is acetate, not acetic acid, and it is pushing the pH *up* by taking protons off water. The leftover this learner expects exists — but it is hydroxide."
next_de = "Frag nach der Speziation am Endpunkt (lv3): Der übrig gebliebene Akteur ist Acetat, nicht Essigsäure, und es treibt den pH-Wert *nach oben*, indem es dem Wasser Protonen entzieht. Der Rest, den dieser Lernende erwartet, existiert tatsächlich — aber es ist Hydroxid."

[reaction.registers]
lv1 = "The acid is exactly used up — and the liquid is not neutral. It is soapy-alkaline instead. The thing left behind is not innocent."
lv1_de = "Die Säure ist genau aufgebraucht — und die Flüssigkeit ist nicht neutral. Sie ist stattdessen seifig-alkalisch. Das, was übrig bleibt, ist nicht harmlos."
lv2 = "The product is 0.1 mol/L sodium acetate. Acetate is the conjugate base of a weak acid, so it hydrolyses: CH₃COO⁻ + H₂O ⇌ CH₃COOH + OH⁻, giving pH ≈ 8.8 at the equivalence point."
lv2_de = "Das Produkt ist 0,1 mol/L Natriumacetat. Acetat ist die konjugierte Base einer schwachen Säure und hydrolysiert daher: CH₃COO⁻ + H₂O ⇌ CH₃COOH + OH⁻, was am Äquivalenzpunkt pH ≈ 8,8 ergibt."
lv3 = "Computed 8.76. The speciation shows the mechanism directly: OH⁻ and undissociated H(Acetate) both at 7.5 × 10⁻⁶ mol/kgw, produced in exactly equal amounts by the hydrolysis, against 9.7 × 10⁻² of free acetate. Equivalence point and neutral point are different ideas that happen to coincide only for strong/strong pairs."
lv3_de = "Berechnet 8,76. Die Speziation zeigt den Mechanismus direkt: OH⁻ und undissoziiertes H(Acetat) liegen beide bei 7,5 × 10⁻⁶ mol/kgw, durch die Hydrolyse in genau gleicher Menge erzeugt, gegenüber 9,7 × 10⁻² freiem Acetat. Äquivalenzpunkt und Neutralpunkt sind unterschiedliche Konzepte, die nur bei stark/stark-Paaren zufällig zusammenfallen."

