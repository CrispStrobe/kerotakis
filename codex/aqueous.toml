[reaction.expect.predict]
question = "A buffer holds pH 4.6 when you add 0.01 mol of strong acid. Now you add 0.15 mol at once — more than the buffer's reserve. What happens?"
question_de = "Ein Puffer hält pH 4,6, wenn du 0,01 mol starke Säure zugibst. Jetzt gibst du 0,15 mol auf einmal zu — mehr als die Reserve des Puffers. Was passiert?"
options = [
  "It holds at about 4.6; that is what a buffer does",
  "It slips a little, to about 3.5",
  "It collapses to about 1.4 — once the reserve is spent the buffer is just salt water",
]
answer = 2
misconception = "Treating buffering as a property of the liquid rather than a stock that gets spent. The reserve here is 0.1 mol of acetate; 0.15 mol of protons consumes all of it and 0.05 mol is left over as free strong acid. A buffer does not resist pH change — it *pays* for resisting it, out of a finite account."
misconception_de = "Puffern wird als Eigenschaft der Flüssigkeit behandelt statt als Vorrat, der aufgebraucht werden kann. Die Reserve hier beträgt 0,1 mol Acetat; 0,15 mol Protonen verbrauchen sie vollständig, und 0,05 mol bleiben als freie starke Säure übrig. Ein Puffer widersteht der pH-Änderung nicht einfach — er *bezahlt* für diesen Widerstand, aus einem endlichen Konto."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Buffering is an identity, not a budget: this liquid is 'a buffer' the way steel is hard, so it holds whatever is poured in."
reveals_de = "Puffern wird als Identität angesehen, nicht als Budget: Diese Flüssigkeit ist 'ein Puffer', so wie Stahl hart ist, also hält sie, was auch immer man hineingießt."
next = "Split the insult: add 0.05 mol, then 0.05 more, then the last 0.05, measuring between each. The meter barely moves, moves a little, then falls off a cliff mid-addition — an identity cannot run out part-way through, but an account can."
next_de = "Teile den Angriff auf: Gib 0,05 mol zu, dann weitere 0,05, dann die letzten 0,05, und miss jeweils dazwischen. Das Messgerät bewegt sich kaum, dann etwas mehr, und stürzt dann mitten in der Zugabe ab — eine Identität kann nicht mittendrin ausgehen, ein Konto aber schon."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "The account is there but overdraft is not: buffering degrades in proportion to the load, so half again over the reserve should cost half a unit or so."
reveals_de = "Das Konto wird zwar anerkannt, aber die Überziehung nicht: Das Puffern verschlechtert sich proportional zur Belastung, also sollte ein weiteres halbes Mal über der Reserve etwa eine halbe Einheit kosten."
next = "Do the subtraction the beaker does: 0.15 mol in, 0.1 mol of acetate to pay with, 0.05 mol left over as free strong acid in the litre. Nothing between 4.6 and that acid's own pH is stable once the account reads zero — there is no species left to hold the middle ground."
next_de = "Mach die Subtraktion, die das Becherglas macht: 0,15 mol hinein, 0,1 mol Acetat zum Bezahlen, 0,05 mol bleiben als freie starke Säure im Liter übrig. Sobald das Konto bei null steht, ist nichts zwischen 4,6 und dem eigenen pH-Wert dieser Säure stabil — es gibt keine Spezies mehr, die den mittleren Bereich hält."

[reaction.registers]
lv1 = "The stubborn liquid stops being stubborn. Push hard enough and it gives way all at once — like a shopping bag that holds and holds and then tears."
lv1_de = "Die widerspenstige Flüssigkeit hört auf, widerspenstig zu sein. Drückst du stark genug, gibt sie auf einmal nach — wie eine Einkaufstüte, die hält und hält und dann reißt."
lv2 = "The buffer contains 0.1 mol of acetate reserve. 0.15 mol of HCl converts all of it to acetic acid and leaves 0.05 mol of strong acid free in the litre, giving pH ≈ 1.4."
lv2_de = "Der Puffer enthält eine Reserve von 0,1 mol Acetat. 0,15 mol HCl wandeln sie vollständig in Essigsäure um und lassen 0,05 mol starke Säure frei im Liter übrig, was pH ≈ 1,4 ergibt."
lv3 = "Computed 1.42. The engine's inventory now holds 0.2 mol of total acetate and 0.15 mol of chloride against only 0.1 mol of sodium; the charge balance has nowhere to go but free H⁺. Buffer capacity β = 2.303·C·(fraction ratio) is finite by construction, and this run stands on the far side of it."
lv3_de = "Berechnet 1,42. Der Bestand der Engine enthält jetzt insgesamt 0,2 mol Acetat und 0,15 mol Chlorid gegenüber nur 0,1 mol Natrium; die Ladungsbilanz kann nirgendwo anders hin als zu freiem H⁺. Die Pufferkapazität β = 2,303·C·(Bruchverhältnis) ist konstruktionsbedingt endlich, und dieser Durchlauf steht jenseits davon."

[reaction.provenance]
source = "Standard curriculum buffer capacity. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "PHREEQC via Kerotakis L2"

# ---------------------------------------------------------------- dilution

[[reaction]]
id = "dilution-by-ten"
spine = ["konzentrationsberechnungen"]
summary = "c₁V₁ = c₂V₂:  0.01 mol/L × 0.1 L → 0.001 mol/L × 1 L"
summary_de = "c₁V₁ = c₂V₂:  0.01 mol/L × 0.1 L → 0.001 mol/L × 1 L"
concepts = ["dilution", "concentration"]
requires = ["acids", "ph"]
apparatus = ["measuring-cylinder", "volumetric-flask", "ph-meter"]
calculations = ["concentration", "dilution-factor"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 10, LB4 Protonenübergänge/Säure-Base-Reaktionen (18 Std.)"
ages = { min = 15.0, max = 16.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Jgst. 10 (ISB) — the relationship between dilution and pH"

[reaction.setup]
script = """
add v1 water 100mL
add v1 HCl 0.001mol
add v1 water 900mL
"""

[reaction.expect]
ph = { min = 2.9, max = 3.1 }

[reaction.expect.predict]
question = "An acid at pH 2 is diluted with nine times its own volume of water. What is the new pH?"
question_de = "Eine Säure mit pH 2 wird mit dem neunfachen ihres eigenen Volumens an Wasser verdünnt. Wie hoch ist der neue pH-Wert?"
options = ["4", "1", "3"]
answer = 2
misconception = "Answering 4 comes from thinking \"ten times weaker\" means \"multiply the pH by ten\" or \"add ten's worth\"; answering 1 confuses dilution with concentration. Because pH is −log₁₀ of hydrogen-ion activity, dividing the concentration by ten adds exactly one to the pH. Ninety-nine times the volume would add two."
misconception_de = "Die Antwort 4 entsteht aus dem Gedanken, \"zehnmal schwächer\" bedeute \"den pH-Wert mit zehn multiplizieren\" oder \"zehn dazuzählen\"; die Antwort 1 verwechselt Verdünnung mit Konzentration. Da der pH-Wert −log₁₀ der Wasserstoffionen-Aktivität ist, addiert eine Verdünnung der Konzentration um den Faktor zehn genau eine Einheit zum pH-Wert. Das 99-fache Volumen würde zwei Einheiten addieren."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "The scale's base is missing: a factor of ten is imagined to buy two units or more, as if pH counted 'amounts of weaker' rather than powers of ten."
reveals_de = "Die Basis der Skala fehlt: Ein Faktor zehn wird sich als zwei oder mehr Einheiten wert vorgestellt, als würde der pH-Wert 'Grade der Schwäche' zählen statt Zehnerpotenzen."
next = "Keep going on the bench: another tenfold of water gives 4, another gives 5 — one unit per factor of ten, every time. Reaching 4 from 2 costs a hundredfold, and the meter will show every step of it."
next_de = "Mach im Labor weiter: eine weitere Verzehnfachung des Wassers ergibt 4, eine weitere ergibt 5 — jedes Mal eine Einheit pro Faktor zehn. Von 2 auf 4 zu kommen kostet das Hundertfache, und das Messgerät zeigt jeden einzelnen Schritt davon."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "The scale runs backwards in this picture: weaker acid, lower number. Direction, not arithmetic, is what has not settled."
reveals_de = "In diesem Bild läuft die Skala rückwärts: schwächere Säure, niedrigere Zahl. Nicht die Rechnung, sondern die Richtung hat sich noch nicht gesetzt."
next = "Measure the two beakers side by side, then keep diluting: the readings walk upward toward 7 and never past it. If lower meant weaker, pure water would read the lowest number of all."
next_de = "Miss die beiden Bechergläser nebeneinander und verdünne dann weiter: Die Messwerte wandern in Richtung 7 und nie darüber hinaus. Würde niedriger schwächer bedeuten, müsste reines Wasser die niedrigste Zahl von allen anzeigen."

[reaction.registers]
lv1 = "Take some acid and pour in nine glasses of water. It is still acid — just weaker. Nothing was taken out; it was spread thinner."
lv1_de = "Nimm etwas Säure und gieße neun Gläser Wasser dazu. Es ist immer noch Säure — nur schwächer. Es wurde nichts entfernt; sie wurde nur dünner verteilt."
lv2 = "The moles of HCl never change: 0.001 mol, first in 0.1 L (0.01 mol/L, pH 2) and then in 1 L (0.001 mol/L, pH 3). c₁V₁ = c₂V₂, and every factor of ten in concentration is one unit of pH."
lv2_de = "Die Stoffmenge an HCl ändert sich nie: 0,001 mol, zunächst in 0,1 L (0,01 mol/L, pH 2) und dann in 1 L (0,001 mol/L, pH 3). c₁V₁ = c₂V₂, und jeder Faktor zehn in der Konzentration entspricht einer pH-Einheit."
lv3 = "Computed 2.04 → 3.01. The slight offset from the round numbers is the activity coefficient: 0.90 at I = 0.01, 0.965 at I = 0.001. Dilution moves the answer toward the ideal-solution limit, which is why the more dilute value is the closer of the two to its textbook figure."
lv3_de = "Berechnet 2,04 → 3,01. Die leichte Abweichung von den runden Zahlen ist der Aktivitätskoeffizient: 0,90 bei I = 0,01, 0,965 bei I = 0,001. Verdünnung bewegt das Ergebnis in Richtung der idealen Lösung, weshalb der stärker verdünnte Wert näher am Lehrbuchwert liegt als der andere."

[reaction.provenance]
source = "Standard curriculum dilution calculation. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "PHREEQC via Kerotakis L2"

# ---------------------------------------------------- salts that are not neutral

[[reaction]]
id = "washing-soda-is-alkaline"
spine = ["der-ph-wert-als-eigenschaften-von-loesungen"]
equation = "CO₃²⁻ + H₂O ⇌ HCO₃⁻ + OH⁻"
concepts = ["salt-hydrolysis", "carbonate-equilibria"]
requires = ["dissolving", "ph"]
apparatus = ["beaker", "ph-meter"]
calculations = ["moles-from-mass", "concentration"]
models = ["equilibrium"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 10, LB4 Protonenübergänge/Säure-Base-Reaktionen (18 Std.)"
ages = { min = 15.0, max = 16.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Jgst. 10 (ISB) — alkaline salt solutions from hydrolysis"

[reaction.setup]
script = """
add v1 water 1000mL
add v1 Na2CO3 5.3g
"""

[reaction.expect]
events = ["dissolved:Na2CO3"]
ph = { min = 11.0, max = 11.4 }

[reaction.expect.predict]
question = "Washing soda is a salt, made from a metal and an acid residue. What pH does its solution have?"
question_de = "Waschsoda ist ein Salz, hergestellt aus einem Metall und einem Säurerest. Welchen pH-Wert hat ihre Lösung?"
options = [
  "7 — salts are neutral, that is what \"neutral salt\" means",
  "About 11 — strongly alkaline",
  "About 3 — it is a soda, and sodas are acidic",
]
answer = 1
misconception = "\"Salt solutions are neutral\" is a rule learned from sodium chloride and then over-applied. It holds only when both parent ions are indifferent to water. Carbonate is the conjugate base of a very weak acid, so it takes protons off water and leaves hydroxide behind — which is precisely why washing soda cuts grease, and why it burns skin."
misconception_de = "\"Salzlösungen sind neutral\" ist eine Regel, die von Natriumchlorid gelernt und dann übermäßig angewendet wird. Sie gilt nur, wenn beide Stammionen dem Wasser gegenüber gleichgültig sind. Carbonat ist die konjugierte Base einer sehr schwachen Säure und entzieht daher dem Wasser Protonen, wobei Hydroxid übrig bleibt — genau deshalb löst Waschsoda Fett, und genau deshalb verätzt sie die Haut."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "'Salt' carries the pH information in this picture: the category answers the question, so every salt reads 7 the way sodium chloride does."
reveals_de = "'Salz' trägt in diesem Bild die pH-Information in sich: Die Kategorie beantwortet die Frage, also zeigt jedes Salz 7 an, so wie Natriumchlorid."
next = "Run the mirror pair: this beaker reads 11 and `copper-sulfate-is-blue-and-acidic` reads 4.5. Two salts, two opposite directions — so the word 'salt' cannot be what decides. The parent ions do, one at a time."
next_de = "Führe das Spiegelpaar durch: Dieses Becherglas zeigt 11 und `copper-sulfate-is-blue-and-acidic` zeigt 4,5. Zwei Salze, zwei entgegengesetzte Richtungen — das Wort 'Salz' kann also nicht das Entscheidende sein. Die Stammionen entscheiden, jeweils für sich."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "The name is doing the chemistry: 'soda' is filed with fizzy drinks, and fizzy drinks are sour, so soda must be acidic."
reveals_de = "Der Name betreibt hier die Chemie: 'Soda' wird mit Brausegetränken assoziiert, und Brausegetränke sind sauer, also müsste Soda sauer sein."
next = "Put the meter in: 11. Then run `baking-soda-vents-carbon-dioxide` — the other kitchen soda is basic too. The fizzy drink's acidity was never the soda; it was the carbonic and phosphoric acid dissolved alongside it."
next_de = "Halte das Messgerät hinein: 11. Führe dann `baking-soda-vents-carbon-dioxide` aus — auch die andere Küchen-Soda ist basisch. Die Säure im Brausegetränk war nie die Soda; es waren die Kohlensäure und Phosphorsäure, die daneben gelöst waren."

[reaction.registers]
lv1 = "Washing soda dissolves and the water turns as alkaline as household cleaner — because that is what it is. It is a salt that is not neutral at all."
lv1_de = "Waschsoda löst sich, und das Wasser wird so alkalisch wie Haushaltsreiniger — weil es genau das ist. Es ist ein Salz, das überhaupt nicht neutral ist."
lv2 = "Na₂CO₃ dissolves to 2 Na⁺ and CO₃²⁻. Carbonate hydrolyses (CO₃²⁻ + H₂O ⇌ HCO₃⁻ + OH⁻, Kb ≈ 2 × 10⁻⁴), so a 0.05 mol/L solution reaches pH ≈ 11.2."
lv2_de = "Na₂CO₃ löst sich zu 2 Na⁺ und CO₃²⁻. Carbonat hydrolysiert (CO₃²⁻ + H₂O ⇌ HCO₃⁻ + OH⁻, Kb ≈ 2 × 10⁻⁴), sodass eine 0,05-mol/L-Lösung pH ≈ 11,2 erreicht."
lv3 = "Computed 11.19. The speciation is not a simple two-species picture: CO₃²⁻ 3.1 × 10⁻², NaCO₃⁻ 1.7 × 10⁻² — a third of the carbonate is tied up in a sodium ion pair — with OH⁻ and HCO₃⁻ each at 2 × 10⁻³, produced stoichiometrically by the hydrolysis."
lv3_de = "Berechnet 11,19. Die Speziation ist kein einfaches Bild aus zwei Spezies: CO₃²⁻ 3,1 × 10⁻², NaCO₃⁻ 1,7 × 10⁻² — ein Drittel des Carbonats ist in einem Natrium-Ionenpaar gebunden —, mit OH⁻ und HCO₃⁻ jeweils bei 2 × 10⁻³, stöchiometrisch durch die Hydrolyse erzeugt."

[reaction.provenance]
source = "Standard curriculum salt hydrolysis; carbonate constants and ion pairing from PHREEQC wateq4f.dat (USGS). Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "PHREEQC via Kerotakis L2"

[[reaction]]
id = "baking-soda-vents-carbon-dioxide"
equation = "2 HCO₃⁻ ⇌ CO₃²⁻ + H₂O + CO₂↑   (open to the atmosphere, log pCO₂ = −3.408)"
concepts = ["open-system", "carbonate-speciation"]
requires = ["carbonate-equilibria", "gas-evolution"]
apparatus = ["beaker", "ph-meter"]
calculations = ["moles-from-mass"]
models = ["equilibrium"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 10, LB4 Protonenübergänge/Säure-Base-Reaktionen (18 Std.)"
ages = { min = 15.0, max = 16.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Jgst. 10 (ISB) — acid-carbonate reactions producing CO2"

[[reaction.curriculum]]
system = "england-gcse-combined-science"
stage = "GCSE Combined Science: Trilogy (AQA 8464), 4.4.2 Reactions of acids"
ages = { min = 14.0, max = 16.0 }
source = "AQA GCSE Combined Science: Trilogy specification (8464), Section 4.4.2 — reactions of acids with metal carbonates are required content"

[reaction.setup]
script = """
add v1 water 1000mL
add v1 NaHCO3 8.4g
"""

[reaction.expect]
events = ["dissolved:NaHCO3", "gas_evolved:CO2"]
ph = { min = 9.5, max = 9.9 }

[reaction.expect.predict]
question = "Baking soda is stirred into water. No acid is added. What happens?"
question_de = "Natron wird in Wasser eingerührt. Es wird keine Säure zugegeben. Was passiert?"
options = [
  "Nothing but dissolving; you need an acid to get any gas",
  "It dissolves and slowly gives off carbon dioxide anyway, ending up around pH 9.7",
  "It dissolves and the solution ends at pH 8.3, the textbook value for bicarbonate",
]
answer = 1
misconception = "Two ideas get corrected at once. First, gas evolution is not the exclusive privilege of acids — bicarbonate disproportionates on its own, and an open beaker keeps pulling the product away. Second, the familiar \"bicarbonate is pH 8.3\" is a *closed-system* number; a beaker on a bench is open, it vents until it matches the atmosphere's own CO₂ pressure, and it lands well above 8.3."
misconception_de = "Zwei Vorstellungen werden hier gleichzeitig korrigiert. Erstens ist Gasentwicklung nicht das ausschließliche Vorrecht von Säuren — Hydrogencarbonat disproportioniert von selbst, und ein offenes Becherglas zieht das Produkt ständig ab. Zweitens ist die vertraute Zahl \"Hydrogencarbonat liegt bei pH 8,3\" ein Wert für ein *geschlossenes* System; ein Becherglas im Labor ist offen, es entgast, bis es dem CO₂-Druck der Atmosphäre entspricht, und landet deutlich über 8,3."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Gas evolution is an acid's signature move, so without an acid nothing can leave — fizzing filed as a reaction type rather than as any equilibrium with a volatile product and an open lid."
reveals_de = "Gasentwicklung gilt als das Markenzeichen einer Säure, also kann ohne Säure nichts entweichen — Sprudeln wird als eigener Reaktionstyp verstanden, nicht als irgendein Gleichgewicht mit einem flüchtigen Produkt und einem offenen Gefäß."
next = "Leave the beaker on the balance and `wait`: the mass drifts down with no acid anywhere in the vessel. The acid in the fizz experiment buys speed and violence, not permission."
next_de = "Lass das Becherglas auf der Waage stehen und `wait`: Die Masse sinkt langsam, obwohl nirgends im Gefäß eine Säure ist. Die Säure im Sprudel-Experiment kauft Geschwindigkeit und Heftigkeit, nicht Erlaubnis."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "A remembered constant outranks the actual setup: 8.3 is bicarbonate's number, so 8.3 is the answer, whatever the beaker is doing."
reveals_de = "Eine auswendig gelernte Konstante überstimmt den tatsächlichen Aufbau: 8,3 ist die Zahl des Hydrogencarbonats, also ist 8,3 die Antwort, egal was das Becherglas gerade tut."
next = "Ask what 8.3 assumes: a sealed system that keeps its CO₂. This beaker is open and vents until it matches the atmosphere, and the pH climbs as the gas leaves. The famous number is not wrong — it answers a different apparatus, and this codex keeps it precisely to be contradicted by an open one."
next_de = "Frag, was 8,3 voraussetzt: ein geschlossenes System, das sein CO₂ behält. Dieses Becherglas ist offen und entgast, bis es der Atmosphäre entspricht, und der pH-Wert steigt, während das Gas entweicht. Die berühmte Zahl ist nicht falsch — sie beantwortet einen anderen Aufbau, und dieser Kodex behält sie genau deshalb, um ihr mit einem offenen Gefäß zu widersprechen."

[reaction.registers]
lv1 = "Baking soda in plain water, with no vinegar anywhere: leave it a while and it still fizzes, very gently. The bubbles escape into the room and never come back."
lv1_de = "Natron in reinem Wasser, ohne Essig weit und breit: Lass es eine Weile stehen, und es sprudelt trotzdem, ganz sanft. Die Bläschen entweichen in den Raum und kommen nie zurück."
lv2 = "0.1 mol of NaHCO₃ per litre gives a solution that is supersaturated against the air's own carbon dioxide. About 30% of the carbonate leaves as CO₂, the remainder shifts toward CO₃²⁻, and the pH settles near 9.7."
lv2_de = "0,1 mol NaHCO₃ pro Liter ergeben eine Lösung, die gegenüber dem Kohlendioxid der Luft übersättigt ist. Etwa 30 % des Carbonats entweichen als CO₂, der Rest verschiebt sich in Richtung CO₃²⁻, und der pH-Wert pendelt sich bei etwa 9,7 ein."
lv3 = "This is the entry that most disagrees with a textbook, and the disagreement is the lesson. The classic pH 8.3 for NaHCO₃ assumes a sealed system. The engine equilibrates the vessel against atmospheric CO₂ at log p = −3.408, vents 0.030 mol, and computes 9.71. Neither number is wrong; they answer different questions, and only one of them describes a beaker on a bench."
lv3_de = "Dies ist der Eintrag, der am stärksten von einem Lehrbuch abweicht, und genau diese Abweichung ist die Lektion. Der klassische pH-Wert 8,3 für NaHCO₃ setzt ein geschlossenes System voraus. Die Engine gleicht das Gefäß gegen atmosphärisches CO₂ bei log p = −3,408 aus, entgast 0,030 mol und berechnet 9,71. Keine der beiden Zahlen ist falsch; sie beantworten unterschiedliche Fragen, und nur eine davon beschreibt ein Becherglas im Labor."

[reaction.provenance]
source = "Carbonate system in an open vessel; atmospheric pCO₂ and carbonate constants from PHREEQC wateq4f.dat (USGS). Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "PHREEQC via Kerotakis L2"

