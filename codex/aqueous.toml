[reaction.registers]
lv1 = "The white powder that appeared when silver met salt will not dissolve again in water. Almost none of it — but not quite none."
lv1_de = "Das weiße Pulver, das entstand, als Silber auf Salz traf, löst sich in Wasser nicht wieder auf. Fast nichts davon — aber eben nicht ganz nichts."
lv2 = "1.4 × 10⁻⁵ mol of AgCl dissolves per litre. That is the square root of K_sp: [Ag⁺] = [Cl⁻] = √(1.8 × 10⁻¹⁰) ≈ 1.3 × 10⁻⁵ mol/L."
