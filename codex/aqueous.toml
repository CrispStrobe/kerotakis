reveals = "The rule from gases, transplanted: warm lemonade goes flat, so heat drives dissolved things out — solids included."
next = "The transplanted rule is genuinely right where it came from: gases do leave warm water, because their dissolution releases heat. Whether heating helps or hurts follows the sign of that enthalpy in both cases — for NaCl it is barely positive, so the heap shrinks slightly instead of growing."

