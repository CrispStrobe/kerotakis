# ------------------------------------------ temperature and solubility

[[reaction]]
id = "heating-dissolves-more-salt"
equation = "NaCl(s) ⇌ Na⁺ + Cl⁻, solubility rising with temperature"
concepts = ["temperature-and-solubility"]
requires = ["saturation"]
apparatus = ["beaker", "bunsen", "thermometer"]
calculations = ["moles-from-mass", "concentration"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium NTG Jgst. 8, LB2 Stoffe und ihre Eigenschaften (23 Std.)"
ages = { min = 13.0, max = 14.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium NTG Jgst. 8 (ISB) — temperature dependence of solubility"

[reaction.setup]
script = """
add v1 water 1000mL
add v1 NaCl 400g
heat v1 100kJ
"""

[reaction.expect]
events = ["dissolved:NaCl"]
temperature_c = { min = 40.0, max = 46.0 }

[reaction.expect.predict]
question = "A litre of water is saturated with salt — a heap of undissolved crystals sits at the bottom. You heat it from 19 °C to 43 °C. What happens to the heap?"
question_de = "Ein Liter Wasser ist mit Salz gesättigt — ein Haufen ungelöster Kristalle liegt am Boden. Du erwärmst ihn von 19 °C auf 43 °C. Was passiert mit dem Haufen?"
options = [
  "It disappears entirely; hot water dissolves far more of everything",
  "It shrinks slightly — about 0.1 mol more dissolves",
  "It grows; heating drives solids out of solution",
]
answer = 1
misconception = "Sugar and potassium nitrate teach that heating dissolves dramatically more, and the lesson gets generalised. Salt is the counter-example every kitchen contains: its solubility rises by only a few percent from cold water to boiling. Whether heat helps depends on the sign of the enthalpy of solution, and for NaCl that enthalpy is nearly zero (+3.9 kJ/mol) — so temperature has almost nothing to push on."
misconception_de = "Zucker und Kaliumnitrat lehren, dass Erwärmen dramatisch mehr löst, und diese Lektion wird verallgemeinert. Salz ist das Gegenbeispiel, das jede Küche enthält: Seine Löslichkeit steigt von kaltem Wasser bis zum Sieden nur um wenige Prozent. Ob Wärme hilft, hängt vom Vorzeichen der Lösungsenthalpie ab, und bei NaCl ist diese Enthalpie fast null (+3,9 kJ/mol) — die Temperatur hat also fast nichts, worauf sie einwirken könnte."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "'Hot water dissolves more' as a universal lever: heat is imagined to act on dissolving as such, rather than through each substance's own enthalpy of solution."
reveals_de = "'Heißes Wasser löst mehr' als universeller Hebel: Wärme wird sich als Wirkung auf das Lösen an sich vorgestellt, statt über die eigene Lösungsenthalpie jedes Stoffes."
next = "Measure the heap at both temperatures on this bench: 24 degrees buy about 0.1 mol against a ceiling of six. Then ask what heat has to push on — for NaCl the enthalpy of solution is +3.9 kJ/mol, nearly nothing, and the lever moves nearly nothing."
next_de = "Miss den Haufen an diesem Labor bei beiden Temperaturen: 24 Grad bringen etwa 0,1 mol gegenüber einer Obergrenze von sechs. Frag dann, worauf die Wärme überhaupt einwirken kann — bei NaCl beträgt die Lösungsenthalpie +3,9 kJ/mol, fast nichts, und der Hebel bewegt fast nichts."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "The rule from gases, transplanted: warm lemonade goes flat, so heat drives dissolved things out — solids included."
reveals_de = "Die Regel aus der Welt der Gase, verpflanzt: warme Limonade wird schal, also treibt Wärme Gelöstes hinaus — Feststoffe eingeschlossen."
next = "The transplanted rule is genuinely right where it came from: gases do leave warm water, because their dissolution releases heat. Whether heating helps or hurts follows the sign of that enthalpy in both cases — for NaCl it is barely positive, so the heap shrinks slightly instead of growing."
next_de = "Die verpflanzte Regel stimmt tatsächlich dort, woher sie kommt: Gase verlassen warmes Wasser wirklich, weil ihr Lösen Wärme freisetzt. Ob Erwärmen hilft oder schadet, folgt in beiden Fällen dem Vorzeichen dieser Enthalpie — bei NaCl ist es knapp positiv, sodass der Haufen leicht schrumpft statt zu wachsen."

[reaction.registers]
lv1 = "The salty water already has salt sitting on the bottom that will not go in. Heat it up and only a very little more disappears. Hot water is not magic."
lv1_de = "Das Salzwasser hat bereits Salz am Boden liegen, das sich nicht lösen will. Erwärmst du es, verschwindet nur sehr wenig mehr. Heißes Wasser ist keine Magie."
lv2 = "Saturation rises from about 6.11 to 6.21 mol/kgw between 19 °C and 43 °C — roughly 1.7%. Compare potassium nitrate, which more than doubles over the same range: the difference is the enthalpy of solution, and NaCl's is nearly zero."
lv2_de = "Die Sättigung steigt zwischen 19 °C und 43 °C von etwa 6,11 auf 6,21 mol/kgw — etwa 1,7 %. Vergleiche Kaliumnitrat, das sich im gleichen Bereich mehr als verdoppelt: Der Unterschied ist die Lösungsenthalpie, und die von NaCl ist fast null."
lv3 = "Both the temperature and the new saturation are computed, not tabulated: the 100 kJ is distributed over the vessel's heat capacity to give 43.05 °C, and the halite phase is re-equilibrated at that temperature, dissolving a further 0.1025 mol. Note the temperature also fell 5.6 °C on the initial dissolution — this run is a cold pack and a solubility experiment at once."
lv3_de = "Sowohl die Temperatur als auch die neue Sättigung sind berechnet, nicht tabelliert: Die 100 kJ werden über die Wärmekapazität des Gefäßes verteilt und ergeben 43,05 °C, und die Halit-Phase wird bei dieser Temperatur neu ins Gleichgewicht gebracht, wobei weitere 0,1025 mol gelöst werden. Beachte, dass die Temperatur beim anfänglichen Lösen auch um 5,6 °C gefallen ist — dieser Durchlauf ist gleichzeitig eine Kühlpackung und ein Löslichkeitsexperiment."

[reaction.provenance]
source = "Temperature dependence of halite solubility; van 't Hoff behaviour from log K temperature data in PHREEQC wateq4f.dat (USGS). Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "PHREEQC via Kerotakis L2; energy balance by Kerotakis"

# ---------------------------------------------------------- precipitation

[[reaction]]
id = "any-chloride-precipitates-silver"
spine = ["qualitative-nachweisverfahren"]
equation = "Ag⁺ + Cl⁻ → AgCl(s)↓   (K⁺ and NO₃⁻ are spectators)"
concepts = ["net-ionic-reaction"]
requires = ["precipitation", "spectator-ions"]
apparatus = ["beaker", "ph-meter"]
calculations = ["moles-from-mass", "titration-stoichiometry"]
models = ["ionic-bonding"]

[[reaction.curriculum]]
system = "nrw-kernlehrplan-g9"
stage = "Sek I, Zweite Stufe (Jg. 9/10), IF6 Salze und Ionen"
ages = { min = 14.0, max = 16.0 }
source = "Kernlehrplan Chemie Gymnasium G9 NRW, Heft 3415 (RdErl. 23.06.2019, Amtsblatt 07-08/19) — the same IF6 placement cited for `silver-chloride-precipitation` in inorganic.toml; this entry varies the cation within that topic"

[reaction.setup]
script = """
add v1 water 500mL
add v1 KCl 0.75g
add v1 AgNO3 1.70g
"""

[reaction.expect]
events = ["precipitated:AgCl", "dissolved:AgNO3"]
ph = { min = 6.9, max = 7.3 }

[reaction.expect.predict]
question = "The silver test used sodium chloride. This time it is potassium chloride. What happens?"
question_de = "Der Silbertest verwendete Natriumchlorid. Diesmal ist es Kaliumchlorid. Was passiert?"
options = [
  "Nothing — the reaction was between silver nitrate and sodium chloride specifically",
  "The same white precipitate, in the same amount",
  "A different precipitate — potassium chloride is a different compound",
]
answer = 1
misconception = "Reactions get memorised as compound-plus-compound, so swapping the cation looks like changing the reaction. In solution there are no compounds — there are ions. The only thing that happens is Ag⁺ + Cl⁻ → AgCl↓; potassium and nitrate never take part and could be replaced again without changing anything. This is what a net ionic equation *means*, and it is why the silver test detects chloride rather than detecting sodium chloride."
misconception_de = "Reaktionen werden als Verbindung-plus-Verbindung auswendig gelernt, sodass das Austauschen des Kations wie eine andere Reaktion wirkt. In Lösung gibt es keine Verbindungen — es gibt Ionen. Das Einzige, was passiert, ist Ag⁺ + Cl⁻ → AgCl↓; Kalium und Nitrat nehmen nie teil und könnten erneut ausgetauscht werden, ohne dass sich etwas ändert. Das ist es, was eine Netto-Ionengleichung *bedeutet*, und deshalb weist der Silbertest Chlorid nach, nicht Natriumchlorid."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "The reaction is a memorised sentence — 'silver nitrate plus sodium chloride' — so changing any word breaks the spell, and the new pair has no sentence."
reveals_de = "Die Reaktion ist ein auswendig gelernter Satz — 'Silbernitrat plus Natriumchlorid' —, sodass das Ändern irgendeines Worts den Zauber bricht und das neue Paar keinen Satz hat."
next = "Run both on this bench and look at `particles`: the same precipitate in the same amount, with potassium floating exactly where sodium floated, glyph for glyph. The sentence that survives the swap is the net ionic one, and it never mentioned sodium."
next_de = "Führe beide an diesem Labor aus und schau dir `particles` an: derselbe Niederschlag in derselben Menge, mit Kalium genau dort schwebend, wo Natrium schwebte, Symbol für Symbol. Der Satz, der den Austausch übersteht, ist der Netto-Ionensatz, und der erwähnte nie Natrium."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "The solid inherits its identity from the reagent bottles: different starting compound, different precipitate — the product as a blend of its parents rather than a new pairing of ions."
reveals_de = "Der Feststoff erbt seine Identität von den Reagenzflaschen: unterschiedliche Ausgangsverbindung, unterschiedlicher Niederschlag — das Produkt als Mischung seiner Ausgangsstoffe statt als neue Paarung von Ionen."
next = "Filter both experiments and put the solids side by side: same colour, same mass per mole of chloride, same behaviour in light. Nothing of the potassium is in the funnel, because the only ions that met are Ag⁺ and Cl⁻ — the cation stays in the flask both times."
next_de = "Filtriere beide Experimente und stelle die Feststoffe nebeneinander: gleiche Farbe, gleiche Masse pro Mol Chlorid, gleiches Verhalten im Licht. Nichts vom Kalium ist im Trichter, denn die einzigen Ionen, die sich getroffen haben, sind Ag⁺ und Cl⁻ — das Kation bleibt beide Male im Kolben."

[reaction.registers]
lv1 = "Different salt, same result: the water goes milky white the instant the two are mixed. The important part was never the whole ingredient — it was one piece of it."
lv1_de = "Anderes Salz, gleiches Ergebnis: Das Wasser wird milchig weiß in dem Moment, in dem die beiden gemischt werden. Der wichtige Teil war nie die ganze Zutat — es war ein Teil davon."
lv2 = "Ag⁺ + Cl⁻ → AgCl↓. K⁺ and NO₃⁻ are spectators and stay dissolved. 0.01 mol of each reactant gives 0.01 mol of precipitate, exactly as with sodium chloride."
lv2_de = "Ag⁺ + Cl⁻ → AgCl↓. K⁺ und NO₃⁻ sind Zuschauerionen und bleiben gelöst. 0,01 mol jedes Reaktanten ergeben 0,01 mol Niederschlag, genau wie bei Natriumchlorid."
lv3 = "The engine never sees 'potassium chloride' as a reactant — it books the solid as element totals and lets the minimiser find the stable assemblage, which is cerargyrite plus a K–NO₃ solution. Residual dissolved silver is 2.2 × 10⁻⁶ mol/kgw as Ag⁺ plus 3.3 × 10⁻⁷ as AgCl(aq): the test is sensitive, not absolute."
lv3_de = "Die Engine sieht 'Kaliumchlorid' nie als Reaktanten — sie verbucht den Feststoff als Elementsummen und lässt den Minimierer die stabile Zusammensetzung finden, das ist Chlorargyrit plus eine K-NO₃-Lösung. Das restliche gelöste Silber beträgt 2,2 × 10⁻⁶ mol/kgw als Ag⁺ plus 3,3 × 10⁻⁷ als AgCl(aq): Der Test ist empfindlich, nicht absolut."

