# The Kerotakis codex — states of matter: where liquid ends, computed.
#
# These entries ride the state layer (P3s): the solvent's state is
# re-evaluated whenever temperature changes, the freezing point of a
# solution is depressed by what is dissolved in it (read off the solved
# speciation), and only as much water freezes as the withdrawn heat can
# pay for, latent heat counted. Pure ice leaves the dissolved species in
# the liquid compartment, which is re-solved until its concentration and
# liquidus agree. The model stops explicitly before salt crystallisation
# would require a solute-specific phase diagram.
#
# Licence: Kerotakis-authored codex text is CC BY 4.0, separately from the
# AGPL code. Third-party facts and data retain the terms named per entry.

[[reaction]]
id = "liquid-nitrogen-freezes-ethanol"
progress = "advanced"
spine = ["aggregatzustaende"]
summary = "In an open virtual vessel, liquid nitrogen boils while ethanol freezes; the two phase changes share one latent-heat balance"
concepts = ["phase-change", "latent-heat", "energy-conservation", "model-boundary"]
apparatus = ["open-dewar", "beaker", "thermometer"]
calculations = ["sensible-heat", "enthalpy-of-fusion", "enthalpy-of-vaporisation"]

[reaction.setup]
script = """
add v1 ethanol 0.17126484mol
add v1 liquid_nitrogen 2.88070251mol
measure v1 thermometer
look v1
"""

[reaction.expect]
events = ["hazard_warning", "froze:ethanol", "boiled:liquid_nitrogen", "gas_evolved:N2", "measured", "observed"]
temperature_c = { min = -196.0, max = -195.0 }

[reaction.registers]
lv1 = "The liquid nitrogen boils as it takes heat away. The ethanol freezes, and the cold bath stays near −196 °C while liquid nitrogen remains. This is a virtual investigation: real liquid nitrogen needs trained supervision, face and eye protection, cryogenic gloves, strong ventilation, and an open container."
lv2 = "The open vessel couples two phase changes: cooling and freezing 10 mL ethanol supplies energy that vaporises part of 100 mL liquid nitrogen. Nitrogen gas crosses the open boundary. Never seal a cryogen; boil-off can build dangerous pressure, and in a poorly ventilated room it displaces oxygen."
lv3 = "The engine conserves energy with ethanol sensible cooling plus ΔHfus feeding nitrogen ΔHvap, and conserves mass by emitting GasEvolved:N2 at the open boundary. It assumes instantaneous adiabatic equilibration and omits Leidenfrost-limited transfer, glass thermal shock, ethanol slush morphology, room heat leak and room oxygen concentration. The safety warning is handling metadata, not reactive-mixture chemistry."

[reaction.provenance]
source = "Liquid-nitrogen normal boiling point and enthalpy of vaporisation (5.6 kJ/mol at 77 K): NIST Chemistry WebBook, SRD 69, nitrogen phase-change data. Ethanol enthalpy of fusion: NIST Chemistry WebBook, SRD 69, ethanol phase-change data. Liquid-nitrogen heat capacity: NIST Journal of Research 96(6), thermophysical properties paper reporting 57.2 J mol−1 K−1. Liquid density: Particle Data Group/Lawrence Berkeley National Laboratory Atomic and Nuclear Properties table, NIST-derived liquid-nitrogen density near its normal boiling point. Safety boundaries: standard cryogenic handling principles; this software is not a real-laboratory procedure."
computed_by = "Kerotakis coupled phase-route energy ledger"

[[reaction]]
id = "salt-holds-the-water-liquid"
progress = "intermediate"
spine = ["aggregatzustaende"]
summary = "Dissolved particles depress the freezing point: under the same cooling, salt water starts freezing near −4 °C and forms less ice than pure water"
concepts = ["freezing-point-depression", "colligative-properties"]
requires = ["concentration"]
apparatus = ["beaker", "thermometer"]
calculations = ["molality", "freezing-point-depression"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 9, LB1 Molekülstruktur und Stoffeigenschaften"
ages = { min = 14.0, max = 15.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Jgst. 9 (ISB)"

[[reaction.curriculum]]
system = "nrw-kernlehrplan-g9"
stage = "Sek I, Zweite Stufe (Jg. 9/10), IF6 Salze und Ionen"
ages = { min = 14.0, max = 16.0 }
source = "Kernlehrplan Chemie Gymnasium G9 NRW, Heft 3415 (RdErl. 23.06.2019)"

[[reaction.curriculum]]
system = "england-national-curriculum"
stage = "KS3 Chemistry, The particulate nature of matter — changes of state and dissolving"
ages = { min = 11.0, max = 14.0 }
source = "Department for Education, National curriculum in England: science programmes of study, KS3 Chemistry (DfE-00182-2013, updated 2014)"

[reaction.setup]
script = """
add v1 water 100mL
add v1 NaCl 0.1mol
new
add v2 water 100mL
cool v1 15kJ
cool v2 15kJ
"""

[reaction.expect]
events = ["dissolved:NaCl"]
temperature_c = { min = -4.3, max = -3.8 }

[reaction.expect.predict]
question = "Two identical beakers lose the same heat side by side: one holds pure water, the other has a big spoon of salt dissolved in it. What differs?"
options = [
  "Both, at 0 °C — freezing at zero is what water does",
  "The salty one first — salty water is thicker, and thicker is closer to solid",
  "The pure one starts at 0 °C; the brine starts near −4 °C and therefore makes less ice from the same cooling",
]
answer = 2
misconception = "The first answer makes the freezing point a fixed property of the solvent, with the dissolved salt as cargo that changes nothing. It is a property of the solution: the ions get in the way of water ordering itself into an ice lattice, so the brine must be colder before freezing pays. The same removed energy consequently makes less ice in the brine. The 'thicker' answer runs viscosity and solidity together — how a liquid flows and whether its molecules can lock into a crystal are different questions with opposite answers here."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "The freezing point belongs to the solvent, full stop — what is dissolved is cargo, riding along without a vote."
next = "Count the cargo's votes: about 1.86 °C of hold-out per mole of dissolved particles per kilogram of water, and salt splits largely into two ions — 0.1 mol of NaCl in 100 g of water is roughly 2 mol/kg of particles. The bench reads the actual particle count off the solved speciation and starts freezing the brine near −4 °C, which is why road grit is dosed in degrees."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "Thickness as nearness to solid: a heavier, saltier liquid feels half-way frozen already, so it should finish freezing first."
next = "Separate the two ideas: flow is about how molecules slide past each other; freezing is about whether they can lock into a lattice. The dissolved ions obstruct the lattice, so more salt means the beaker holds out longer, not less — the saltier you make it, the colder it must get before ice pays."

[reaction.registers]
lv1 = "The plain water starts freezing at zero. The salty water holds out until about four degrees below zero, so the same cooling makes less ice there — the salt gets in the way of the ice forming. That is the secret of gritting icy roads."
lv2 = "Freezing-point depression: ΔT ≈ 1.86 K·kg/mol × molality of dissolved particles. 0.1 mol of NaCl in 100 g of water is 1.0 mol/kg of salt but roughly 2.0 mol/kg of dissolved particles, so the brine starts freezing about 4 K below pure water. As pure ice forms, the salt stays in the residual liquid; the bench re-solves that more concentrated brine and its lower liquidus."
lv3 = "The depression is computed from the solved speciation — the same particle census `particles` draws — rather than from an integer van 't Hoff factor. Only as much water freezes as the withdrawn 15 kJ can pay for, latent heat counted, and the inventory keeps liquid water and pure ice side by side. Each ice transfer invalidates the old molalities, so PHREEQC re-speciates the smaller liquid compartment and the phase pass iterates to a common temperature/liquidus. Below the declared 252 K model boundary, salt solids and a solute-specific eutectic phase diagram would be required; the bench stops rather than extrapolating the dilute colligative relation."

[reaction.provenance]
source = "Standard curriculum colligative properties; freezing-point depression computed from the solved speciation (PHREEQC via Kerotakis L2) by the Kerotakis state layer; cryoscopic constant of water 1.86 K·kg/mol is a standard reference value quoted for comparison. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "Kerotakis state layer (P3s) over PHREEQC speciation; energy balance pays the latent heat"

[[reaction]]
id = "chains-slide-networks-do-not"
progress = "advanced"
spine = ["kunststoffe-langkettige-organische-molekuele"]
summary = "At the same 150 °C, a polyethylene thermoplastic softens reversibly while a cured thermoset remains cross-linked and rigid"
concepts = ["polymer-structure", "material-structure", "cross-linking", "thermal-softening", "reversible-change", "model-boundary"]
requires = ["heat-capacity"]
apparatus = ["beaker", "hotplate", "thermometer"]
calculations = ["specific-heat"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 10, LB4 Kunststoffe"
ages = { min = 15.0, max = 16.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium — Struktur-Eigenschafts-Beziehungen und Kunststoffklassen"

[reaction.setup]
script = """
add v1 thermoplastic 2g
heat v1 455J
new
add v2 thermoset_resin 2g
heat v2 375J
look v1
look v2
"""

[reaction.expect]
events = ["polymer_heated:thermoplastic sheet", "polymer_heated:cured thermoset resin", "observed"]

[reaction.expect.predict]
question = "Two two-gram plastic objects are heated to about 150 °C. One is polyethylene thermoplastic; the other is cured thermoset resin. What differs?"
options = [
  "Both melt alike — plastic is one kind of substance once it is hot enough",
  "The thermoset softens first because its cross-links conduct heat between chains",
  "The thermoplastic softens as separate chains slide; the cross-linked thermoset stays rigid because it has no melting point",
]
answer = 2
misconception = "'Plastic' names a use-class, not one molecular architecture. A thermoplastic contains separate chains held together by attractions that heat can overcome. Curing a thermoset joins chains covalently into a network, removing the sliding motion that makes melting and reshaping possible. Its missing melting point is the answer, not an unfilled datum."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "All plastics are treated as one material whose only meaningful difference is how much heat it takes to melt."
next = "Compare the two engine verdicts at the same temperature. The thermoplastic reports a reversible softened state; the thermoset explicitly reports no softening point. Heat further and the network decomposes rather than crossing a hidden, higher melt threshold."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "Cross-linking is heard as stronger heat transport rather than a topological constraint that prevents whole chains from sliding."
next = "Ask what must move for an object to be reshaped. Heat need not travel differently: separate chains must pass one another. Cross-links fasten those chains into one network, so the required motion no longer exists."

[reaction.registers]
lv1 = "Warm both pieces equally. The thermoplastic goes soft and could be pressed into a new shape; the cured resin stays hard. Its chains are tied together into one net, so there are no loose chains left to slide."
lv2 = "At about 150 °C the polyethylene teaching sheet is above its curated 130 °C crystalline melt and reports Softened, reversible on cooling. The cured thermoset reports Rigid: its covalently cross-linked network has no softening point. Above its separate 300 °C decomposition threshold it chars instead of melting."
lv3 = "Material-owned heat-response rows contribute the unresolved objects' heat capacity and map current temperature to only three states: rigid, softened or charred. The thresholds are curated, not predicted, and remain in a pending-review provenance lane. The thermoplastic row stands only for moulded HDPE; amorphous PS, PVC and acrylic soften at glass transitions this model does not represent. No viscosity, flow rate, degree of cure, moulding geometry or shape change is computed. Charring is persistent state and narration only: no invented char or volatile products enter the ledger."

[reaction.provenance]
source = "The exact PolymerHeatResponse rows and boundaries curated in the thermoplastic-sheet and cured-thermoset-resin material recipes. Their tranche is PENDING REVIEW and does not claim paper-level provenance. The 130 °C polyethylene melt and 300/400 °C decomposition thresholds are teaching values, not predictions for arbitrary plastics. Virtual school-laboratory comparison only: heating real plastics can burn and release hazardous decomposition products, which this model deliberately does not formulate or render. Diagnoses: Editorial judgement (Kerotakis), 2026-09-06."
computed_by = "Kerotakis material-owned heat capacity and bounded PolymerHeatResponse projection"
