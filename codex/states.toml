# The Kerotakis codex — states of matter: where liquid ends, computed.
#
# These entries ride the state layer (P3s): the solvent's state is
# re-evaluated whenever temperature changes, the freezing point of a
# solution is depressed by what is dissolved in it (read off the solved
# speciation), and only as much water freezes as the withdrawn heat can
# pay for, latent heat counted. Pure ice leaves the dissolved species in
# the liquid compartment, which is re-solved until its concentration and
# liquidus agree. The model stops explicitly before salt crystallisation
# would require a solute-specific phase diagram.
#
# Licence: Kerotakis-authored codex text is CC BY 4.0, separately from the
# AGPL code. Third-party facts and data retain the terms named per entry.

[[reaction]]
id = "salt-holds-the-water-liquid"
spine = ["aggregatzustaende"]
summary = "Dissolved particles depress the freezing point: under the same cooling, salt water starts freezing near −4 °C and forms less ice than pure water"
concepts = ["freezing-point-depression", "colligative-properties"]
requires = ["concentration"]
apparatus = ["beaker", "thermometer"]
calculations = ["molality", "freezing-point-depression"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 9, LB1 Molekülstruktur und Stoffeigenschaften"
ages = { min = 14.0, max = 15.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Jgst. 9 (ISB)"

[[reaction.curriculum]]
system = "nrw-kernlehrplan-g9"
stage = "Sek I, Zweite Stufe (Jg. 9/10), IF6 Salze und Ionen"
ages = { min = 14.0, max = 16.0 }
source = "Kernlehrplan Chemie Gymnasium G9 NRW, Heft 3415 (RdErl. 23.06.2019)"

[[reaction.curriculum]]
system = "england-national-curriculum"
stage = "KS3 Chemistry, The particulate nature of matter — changes of state and dissolving"
ages = { min = 11.0, max = 14.0 }
source = "Department for Education, National curriculum in England: science programmes of study, KS3 Chemistry (DfE-00182-2013, updated 2014)"

[reaction.setup]
script = """
add v1 water 100mL
add v1 NaCl 0.1mol
new
add v2 water 100mL
cool v1 15kJ
cool v2 15kJ
"""

[reaction.expect]
events = ["dissolved:NaCl"]
temperature_c = { min = -4.3, max = -3.8 }

[reaction.expect.predict]
question = "Two identical beakers lose the same heat side by side: one holds pure water, the other has a big spoon of salt dissolved in it. What differs?"
options = [
  "Both, at 0 °C — freezing at zero is what water does",
  "The salty one first — salty water is thicker, and thicker is closer to solid",
  "The pure one starts at 0 °C; the brine starts near −4 °C and therefore makes less ice from the same cooling",
]
answer = 2
misconception = "The first answer makes the freezing point a fixed property of the solvent, with the dissolved salt as cargo that changes nothing. It is a property of the solution: the ions get in the way of water ordering itself into an ice lattice, so the brine must be colder before freezing pays. The same removed energy consequently makes less ice in the brine. The 'thicker' answer runs viscosity and solidity together — how a liquid flows and whether its molecules can lock into a crystal are different questions with opposite answers here."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "The freezing point belongs to the solvent, full stop — what is dissolved is cargo, riding along without a vote."
next = "Count the cargo's votes: about 1.86 °C of hold-out per mole of dissolved particles per kilogram of water, and salt splits largely into two ions — 0.1 mol of NaCl in 100 g of water is roughly 2 mol/kg of particles. The bench reads the actual particle count off the solved speciation and starts freezing the brine near −4 °C, which is why road grit is dosed in degrees."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "Thickness as nearness to solid: a heavier, saltier liquid feels half-way frozen already, so it should finish freezing first."
next = "Separate the two ideas: flow is about how molecules slide past each other; freezing is about whether they can lock into a lattice. The dissolved ions obstruct the lattice, so more salt means the beaker holds out longer, not less — the saltier you make it, the colder it must get before ice pays."

[reaction.registers]
lv1 = "The plain water starts freezing at zero. The salty water holds out until about four degrees below zero, so the same cooling makes less ice there — the salt gets in the way of the ice forming. That is the secret of gritting icy roads."
lv2 = "Freezing-point depression: ΔT ≈ 1.86 K·kg/mol × molality of dissolved particles. 0.1 mol of NaCl in 100 g of water is 1.0 mol/kg of salt but roughly 2.0 mol/kg of dissolved particles, so the brine starts freezing about 4 K below pure water. As pure ice forms, the salt stays in the residual liquid; the bench re-solves that more concentrated brine and its lower liquidus."
lv3 = "The depression is computed from the solved speciation — the same particle census `particles` draws — rather than from an integer van 't Hoff factor. Only as much water freezes as the withdrawn 15 kJ can pay for, latent heat counted, and the inventory keeps liquid water and pure ice side by side. Each ice transfer invalidates the old molalities, so PHREEQC re-speciates the smaller liquid compartment and the phase pass iterates to a common temperature/liquidus. Below the declared 252 K model boundary, salt solids and a solute-specific eutectic phase diagram would be required; the bench stops rather than extrapolating the dilute colligative relation."

[reaction.provenance]
source = "Standard curriculum colligative properties; freezing-point depression computed from the solved speciation (PHREEQC via Kerotakis L2) by the Kerotakis state layer; cryoscopic constant of water 1.86 K·kg/mol is a standard reference value quoted for comparison. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "Kerotakis state layer (P3s) over PHREEQC speciation; energy balance pays the latent heat"
