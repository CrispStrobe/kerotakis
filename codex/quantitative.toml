answer = 1
misconception = "The first option confuses energy with temperature — they are not the same quantity, and this pair of cups is the cheapest way to feel the difference. Exactly the same 8.28 kJ is released in both; the thermometer reads the energy per unit of stuff it has to warm, so doubling the water halves the rise."

[reaction.registers]
lv1 = "Change one thing and nothing else. Two cups, the same powder, the same starting temperature — only the amount of water is different. Then whatever the thermometers do differently, you know what caused it. Change two things at once and you have learned nothing, however carefully you measured."
lv2 = "Identical q = 8.28 kJ in both cups. ΔT = q/(n·Cp): 8280 ÷ 416.7 = 19.9 K in 100 mL, and 8280 ÷ 833.5 = 9.9 K in 200 mL. The bench gives 44.87 °C and 34.93 °C from 25.0 °C — 19.87 K and 9.93 K. The halving is exact because the only thing that changed was the denominator."
lv3 = "This is the controlled comparison in its cleanest form, and it is worth noticing what the engine holds constant for free that a real bench does not: identical starting temperature, identical heat loss (none), identical purity, identical stirring. A simulated fair test is trivially fair, which is precisely why the *habit* has to be taught here and the *difficulty* has to be met at a real bench. The virtual lab can teach the logic of control; it cannot teach the discipline of it."

