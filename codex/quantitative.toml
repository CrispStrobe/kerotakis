[reaction.setup]
script = """
add v1 Mg 1.2g
heat v1 0.25kJ
measure v1 thermometer
new
add v2 Mg 1.2g
ignite v2
measure v2 thermometer
"""

[reaction.expect]
events = ["consumed:Mg", "precipitated:MgO", "ignited"]
temperature_c = { min = 2100.0, max = 2250.0 }

[reaction.expect.predict]
question = "Two identical 1.2 g magnesium ribbons burn in identical air. One is barely warm when it catches (228 °C); the other is already glowing (927 °C). Do the two flames reach the same temperature?"
question_de = "Zwei identische 1,2-g-Magnesiumbänder brennen in identischer Luft. Das eine ist kaum warm, wenn es sich entzündet (228 °C); das andere glüht bereits (927 °C). Erreichen die beiden Flammen dieselbe Temperatur?"
options = [
  "Yes — the flame temperature is a property of magnesium",
  "No: 2177 °C and 2769 °C. The heat you put in first is still in the products",
  "No — the hotter one burns faster and so ends up cooler",
]
answer = 1
misconception = "'Adiabatic flame temperature of magnesium' gets memorised as a constant, like a melting point. It is not a property of the fuel; it is the answer to an enthalpy balance, and the enthalpy of the reactants is one of the inputs. Preheat the reactants and you get a hotter flame, which is exactly why industrial furnaces preheat their air."
misconception_de = "'Adiabatische Flammtemperatur von Magnesium' wird als Konstante auswendig gelernt, wie ein Schmelzpunkt. Sie ist keine Eigenschaft des Brennstoffs; sie ist die Antwort auf eine Enthalpiebilanz, und die Enthalpie der Edukte ist eine der Eingangsgrößen. Erwärmt man die Edukte vor, erhält man eine heißere Flamme, und genau deshalb erwärmen Industrieöfen ihre Luft vor."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Flame temperature as a substance constant, filed beside the melting point: one fuel, one number, whatever state it started in."
reveals_de = "Flammtemperatur als Stoffkonstante, eingeordnet neben dem Schmelzpunkt: ein Brennstoff, eine Zahl, unabhängig davon, in welchem Zustand er startete."
next = "Change only the starting enthalpy and read the answer: 700 degrees more preheat, roughly 600 degrees more flame. A constant cannot respond to how you began; a balance must — and furnaces preheat their air because engineers bill by that balance."
next_de = "Ändere nur die Startenthalpie und lies die Antwort ab: 700 Grad mehr Vorwärmung, rund 600 Grad mehr Flamme. Eine Konstante kann nicht darauf reagieren, wie du begonnen hast; eine Bilanz muss es — und Öfen erwärmen ihre Luft vor, weil Ingenieure nach dieser Bilanz rechnen."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Speed spends the heat: the hotter start burns faster, and faster somehow means the energy is used up sooner and ends cooler — rate entangled with the energy budget."
reveals_de = "Geschwindigkeit verbraucht die Wärme: der heißere Start brennt schneller, und schneller bedeutet irgendwie, dass die Energie früher aufgebraucht ist und kühler endet — Geschwindigkeit wird mit dem Energiebudget vermengt."
next = "Adiabatic means the ledger keeps everything regardless of pace: same fuel, same oxygen, more starting enthalpy — more ending enthalpy, full stop. Rate decides how soon the products arrive at their temperature, never what that temperature is."
next_de = "Adiabatisch bedeutet, dass das Konto alles behält, egal wie schnell es geht: derselbe Brennstoff, derselbe Sauerstoff, mehr Startenthalpie — mehr Endenthalpie, Punkt. Die Geschwindigkeit entscheidet, wie schnell die Produkte ihre Temperatur erreichen, niemals, welche Temperatur das ist."

[reaction.registers]
lv1 = "Two identical ribbons, both burned, both blindingly bright — and one flame is six hundred degrees hotter than the other. The only difference was how warm the metal was when it caught. Heat you put in beforehand does not disappear when the fire starts; it is still there, added on top."
lv1_de = "Zwei identische Bänder, beide verbrannt, beide blendend hell — und die eine Flamme ist sechshundert Grad heißer als die andere. Der einzige Unterschied war, wie warm das Metall war, als es sich entzündete. Wärme, die du vorher hineingegeben hast, verschwindet nicht, wenn das Feuer beginnt; sie ist immer noch da, obendrauf addiert."
lv2 = "Adiabatic means no heat leaves, so the products' enthalpy equals the reactants'. Starting at 228 °C the solve lands at 2176.97 °C; starting at 926.9 °C — the ignition temperature the bench uses — it lands at 2768.67 °C. Same ΔH of reaction, −601 kJ/mol; different starting enthalpy, different answer."
lv2_de = "Adiabatisch bedeutet, dass keine Wärme entweicht, sodass die Enthalpie der Produkte der der Edukte entspricht. Beginnt man bei 228 °C, landet die Lösung bei 2176,97 °C; beginnt man bei 926,9 °C — der Zündtemperatur, die das Labor verwendet — landet sie bei 2768,67 °C. Dieselbe Reaktionsenthalpie ΔH, −601 kJ/mol; andere Startenthalpie, andere Antwort."
lv3 = "The solver bisects on temperature until the products' enthalpy matches the reactants', evaluating both from the NASA-9 polynomials rather than assuming a constant heat capacity — which matters, because Cp rises substantially over two thousand kelvin. The vessel's share of the atmosphere is in the balance too, and it is the dominant heat sink: a gram of magnesium heats the air around it far more than it heats the speck of oxide it leaves."
lv3_de = "Der Löser halbiert das Intervall über der Temperatur, bis die Enthalpie der Produkte der der Edukte entspricht, wobei beide anhand der NASA-9-Polynome ausgewertet werden statt eine konstante Wärmekapazität anzunehmen — was wichtig ist, denn Cp steigt über zweitausend Kelvin hinweg erheblich an. Der Luftanteil des Gefäßes steckt ebenfalls in der Bilanz, und er ist die dominierende Wärmesenke: Ein Gramm Magnesium erwärmt die Luft um sich herum weit mehr, als es das winzige Oxidkorn erwärmt, das es hinterlässt."

