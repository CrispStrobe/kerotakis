source = "AQA GCSE Chemistry (8462) specification, examined from 2018"

[reaction.setup]
script = """
add v1 KCl 5g
measure v1 balance
ignite v1
measure v1 balance
measure v1 thermometer
"""

[reaction.expect]
events = ["flame_test:KCl"]
absent = ["ignited", "consumed:KCl", "gas_evolved:Cl2", "gas_evolved:CO2"]

[reaction.expect.predict]
question = "Hold a flame to 5.00 g of potassium chloride. The flame turns lilac. What does the balance read afterwards, and what is the temperature of the salt?"
question_de = "Halte 5,00 g Kaliumchlorid in eine Flamme. Die Flamme färbt sich lila. Was zeigt die Waage danach, und welche Temperatur hat das Salz?"
options = [
  "Lighter, and hot — some of it burned off to make the colour",
  "5.00 g and 25 °C. Nothing burned; the colour is light, not fire",
  "Heavier — it combined with oxygen like the magnesium did",
]
answer = 1
misconception = "A coloured flame looks like combustion, so the salt is assumed to be the fuel. It is not: the flame excites the potassium's outer electron and the colour is what that electron emits falling back. Nothing is consumed, and a flame test on a milligram will keep going as long as you hold it there. This is also the entry that shows what a negative result looks like — three things that did not happen, each of which is checked."
misconception_de = "Eine farbige Flamme sieht aus wie Verbrennung, also wird angenommen, das Salz sei der Brennstoff. Das ist es nicht: Die Flamme regt das äußere Elektron des Kaliums an, und die Farbe ist das, was dieses Elektron beim Zurückfallen aussendet. Nichts wird verbraucht, und ein Flammentest an einem Milligramm läuft weiter, solange du es hineinhältst. Dies ist auch der Eintrag, der zeigt, wie ein Nullergebnis aussieht — drei Dinge, die nicht geschehen sind, jedes davon überprüft."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Colour is combustion's receipt: if it glows, something is being spent — light without fuel is not in the picture."
reveals_de = "Farbe gilt als Quittung der Verbrennung: Wenn es leuchtet, wird etwas verbraucht — Licht ohne Brennstoff kommt im Bild nicht vor."
next = "Weigh and take the temperature afterwards: 5.00 g, 25 °C — a negative result with every negative checked. The lilac is an electron falling back to its shelf, not matter leaving; a milligram would colour the flame for as long as you cared to hold it there."
next_de = "Wiege es danach und miss die Temperatur: 5,00 g, 25 °C — ein Nullergebnis, bei dem jede Negation geprüft wurde. Das Lila ist ein Elektron, das in sein Regal zurückfällt, keine entweichende Materie; ein Milligramm würde die Flamme so lange färben, wie du es hineinhalten würdest."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "The magnesium template, pattern-matched onto any solid in a flame: metal-ish thing plus fire equals oxide plus mass gain."
reveals_de = "Die Magnesium-Vorlage, auf jeden Feststoff in einer Flamme angewendet: metallartiges Ding plus Feuer ergibt Oxid plus Massezuwachs."
next = "Ask what would have to change for the template to apply: potassium chloride's ions are already in their stable states, with nothing to offer oxygen. The flame test works *because* nothing reacts — which is what lets it identify an element without destroying the sample."
next_de = "Frage, was sich ändern müsste, damit die Vorlage passt: Die Ionen des Kaliumchlorids befinden sich bereits in ihren stabilen Zuständen und haben dem Sauerstoff nichts zu bieten. Der Flammentest funktioniert *weil* nichts reagiert — genau das erlaubt es ihm, ein Element zu identifizieren, ohne die Probe zu zerstören."

[reaction.registers]
lv1 = "Hold the salt in a flame and the flame turns lilac — a completely different colour from the same burner a moment earlier. Weigh the salt: unchanged. Touch it once it is out of the flame: cold. You have identified the metal without using any of it up, which is why this test is nearly two hundred years old and still in use."
lv1_de = "Halte das Salz in eine Flamme, und die Flamme färbt sich lila — eine völlig andere Farbe als bei demselben Brenner einen Moment zuvor. Wiege das Salz: unverändert. Fasse es an, sobald es aus der Flamme ist: kalt. Du hast das Metall identifiziert, ohne davon auch nur etwas zu verbrauchen, weshalb dieser Test fast zweihundert Jahre alt ist und immer noch verwendet wird."
lv2 = "The bench reports a flame test and nothing else: no ignition, no consumption, no gas. 5.00 g in, 5.00 g out, 25.00 °C before and after. Potassium gives lilac, sodium gives yellow, calcium orange-red — the colour identifies the cation, and the anion is invisible to the test."
lv2_de = "Das Labor meldet einen Flammentest und sonst nichts: keine Zündung, kein Verbrauch, kein Gas. 5,00 g hinein, 5,00 g heraus, 25,00 °C vorher und nachher. Kalium ergibt Lila, Natrium Gelb, Calcium Orangerot — die Farbe identifiziert das Kation, und das Anion bleibt für den Test unsichtbar."
lv3 = "Two separate things are being asserted, and they come from different places. That nothing burns is computed: the Gibbs minimiser finds no exothermic path and the bench restores the vessel exactly. That the flame is lilac is curated spectroscopy — potassium's 766.5/769.9 nm doublet plus the violet lines — because the thermodynamic databases hold no electronic-transition data and the lab does not invent any. Worth noticing too: the equilibrium composition contains traces of Cl₂ at the nanomole level, and the bench refuses to announce them, because a trace is not an observation."
lv3_de = "Hier werden zwei getrennte Dinge behauptet, und sie stammen aus unterschiedlichen Quellen. Dass nichts verbrennt, ist berechnet: Der Gibbs-Minimierer findet keinen exothermen Pfad, und das Labor stellt das Gefäß exakt wieder her. Dass die Flamme lila ist, ist kuratierte Spektroskopie — das Dublett des Kaliums bei 766,5/769,9 nm plus die violetten Linien —, weil die thermodynamischen Datenbanken keine Daten zu elektronischen Übergängen enthalten und das Labor keine erfindet. Bemerkenswert auch: Die Gleichgewichtszusammensetzung enthält Spuren von Cl₂ auf Nanomol-Niveau, und das Labor weigert sich, sie anzukündigen, weil eine Spur keine Beobachtung ist."

