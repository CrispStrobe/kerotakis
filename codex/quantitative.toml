[[reaction]]
id = "theoretical-yield-and-what-a-real-lab-loses"
spine = ["quantitative-analyseverfahren"]
summary = "0.0100 mol AgCl × 143.32 g/mol = 1.43 g theoretical; the filter recovers 1.43 g"
summary_de = "0,0100 mol AgCl × 143,32 g/mol = 1,43 g theoretisch; der Filter gewinnt 1,43 g zurück"
concepts = ["theoretical-yield", "percentage-yield"]
requires = ["limiting-reagent"]
calculations = ["limiting-reagent", "mass-from-moles", "percentage-yield"]
models = ["particle-model"]
apparatus = ["beaker", "filter-funnel", "filter-paper", "balance", "drying-oven"]

[[reaction.curriculum]]
system = "nrw-kernlehrplan-g9"
stage = "Sek I, Zweite Stufe (Jg. 9/10), IF6 Salze und Ionen — quantitative Auswertung"
ages = { min = 14.0, max = 16.0 }
source = "Kernlehrplan Chemie Gymnasium G9 NRW, Heft 3415 (RdErl. 23.06.2019)"

[reaction.setup]
script = """
add v1 water 500mL
add v1 NaCl 0.5844g
add v1 AgNO3 1.6987g
new
filter v1 v2
measure v1 balance
measure v2 balance
"""

[reaction.expect]
events = ["precipitated:AgCl", "filtered"]

[reaction.expect.predict]
question = "0.0100 mol of each reagent, filtered and dried. The theoretical yield is 1.43 g. A class of thirty does this and reports yields between 71% and 96%. Where did the missing silver chloride go?"
question_de = "0,0100 mol jedes Edukts, filtriert und getrocknet. Die theoretische Ausbeute beträgt 1,43 g. Eine Klasse von dreißig führt dies durch und meldet Ausbeuten zwischen 71 % und 96 %. Wo ist das fehlende Silberchlorid geblieben?"
options = [
  "The reaction did not finish — some silver stayed as Ag⁺",
  "Mostly onto the filter paper, the beaker wall and the wash water",
  "It decomposed while drying",
]
answer = 1
misconception = "A yield under 100% gets read as a statement about the chemistry, so learners go looking for an incomplete reaction. Here it is almost entirely mechanical loss. The engine makes that visible by reporting 1.43 g — the full theoretical yield — because it models the chemistry and nothing else: no filter paper, no splashes, no scraping. The residual dissolved silver is real but tiny, around 10⁻⁶ mol."
misconception_de = "Eine Ausbeute unter 100 % wird als Aussage über die Chemie gelesen, also suchen Lernende nach einer unvollständigen Reaktion. Hier handelt es sich fast ausschließlich um mechanischen Verlust. Das Labor macht das sichtbar, indem es 1,43 g meldet — die volle theoretische Ausbeute —, denn es modelliert nur die Chemie und sonst nichts: kein Filterpapier, keine Spritzer, kein Abkratzen. Das gelöst verbliebene Silber ist real, aber winzig, etwa 10⁻⁶ mol."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Every shortfall is chemistry's fault: a yield under 100% means the reaction stopped early, because the apparatus is invisible in the account."
reveals_de = "Jedes Defizit wird der Chemie angelastet: Eine Ausbeute unter 100 % bedeutet, dass die Reaktion vorzeitig endete, weil die Apparatur in der Rechnung unsichtbar ist."
next = "Compare the two worlds: this bench models chemistry with no filter paper, no beaker walls, no splashes — and reports the full 1.43 g, with the genuinely-unreacted silver near 10⁻⁶ mol, a thousandth of what the class lost. The missing grams are on the equipment, which is why careful gravimetric work weighs the filter paper too."
next_de = "Vergleiche die beiden Welten: Dieses Labor modelliert Chemie ohne Filterpapier, ohne Becherglaswände, ohne Spritzer — und meldet die vollen 1,43 g, wobei das tatsächlich unreagierte Silber bei etwa 10⁻⁶ mol liegt, einem Tausendstel dessen, was die Klasse verlor. Die fehlenden Gramm stecken in der Ausrüstung, weshalb bei sorgfältiger gravimetrischer Arbeit auch das Filterpapier gewogen wird."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "A reaction is invented to cover a bookkeeping gap: mass is missing, so a plausible-sounding process nobody observed — decomposition on drying — gets the blame."
reveals_de = "Eine Reaktion wird erfunden, um eine Lücke in der Buchführung zu füllen: Masse fehlt, also wird ein plausibel klingender, von niemandem beobachteter Vorgang — Zersetzung beim Trocknen — dafür verantwortlich gemacht."
next = "Look at the loss pattern before blaming chemistry: thirty students scattered from 71% to 96%. A decomposition at a shared drying temperature would take a similar bite from everyone; handling losses scatter exactly like this. The spread is the fingerprint."
next_de = "Sieh dir das Verlustmuster an, bevor du der Chemie die Schuld gibst: dreißig Schüler streuen zwischen 71 % und 96 %. Eine Zersetzung bei gemeinsamer Trocknungstemperatur würde bei allen einen ähnlichen Anteil kosten; Handhabungsverluste streuen genau so. Die Streuung ist der Fingerabdruck."

[reaction.registers]
lv1 = "Filter the cloudy mixture and a white paste stays on the paper. Dry it and weigh it. The number you get is almost never the number you calculated — and in a real lab, that gap is mostly stuff stuck to the glass, not chemistry going wrong."
lv1_de = "Filtriere die trübe Mischung, und eine weiße Paste bleibt auf dem Papier. Trockne sie und wiege sie. Die Zahl, die du bekommst, ist fast nie die berechnete Zahl — und in einem echten Labor liegt diese Lücke meist an Resten, die am Glas kleben, nicht an fehlgeschlagener Chemie."
lv2 = "The limiting reagent gives 0.0100 mol of AgCl, which at 143.32 g/mol is a theoretical yield of 1.43 g. The bench filters and weighs 1.43 g in v1, and the filtrate v2 weighs 499.35 g. Percentage yield = actual ÷ theoretical × 100; here it is essentially 100%, so any shortfall in a real experiment is loss, not incomplete reaction."
lv2_de = "Das limitierende Edukt ergibt 0,0100 mol AgCl, was bei 143,32 g/mol einer theoretischen Ausbeute von 1,43 g entspricht. Das Labor filtriert und wiegt 1,43 g in v1, und das Filtrat v2 wiegt 499,35 g. Prozentuale Ausbeute = tatsächlich ÷ theoretisch × 100; hier liegt sie im Wesentlichen bei 100 %, sodass jedes Defizit in einem echten Experiment Verlust ist, nicht unvollständige Reaktion."
lv3 = "The filtrate still holds silver and chloride at the level Ksp demands — the inspect view shows both at the fourth-decimal floor — so the 'complete' precipitation is complete only to within the solubility product, about 1.3 × 10⁻⁵ mol/L each in pure water. That residue is a real, calculable loss and is the reason gravimetric analysis washes with dilute nitric acid rather than water. What the engine cannot model is the paper, and it does not pretend to."
lv3_de = "Das Filtrat enthält weiterhin Silber und Chlorid in der Höhe, die das Löslichkeitsprodukt vorschreibt — die inspect-Ansicht zeigt beide an der vierten Dezimalstelle —, sodass die 'vollständige' Fällung nur im Rahmen des Löslichkeitsprodukts vollständig ist, etwa 1,3 × 10⁻⁵ mol/L von jedem in reinem Wasser. Dieser Rest ist ein realer, berechenbarer Verlust und der Grund, warum die gravimetrische Analyse mit verdünnter Salpetersäure statt mit Wasser gewaschen wird. Was das Labor nicht modellieren kann, ist das Papier, und es gibt auch nicht vor, es zu können."

[reaction.provenance]
source = "Standard gravimetric determination of chloride; Ksp and speciation from PHREEQC wateq4f.dat (USGS). The interpretation of where real-lab losses come from is Editorial judgement (Kerotakis).. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "PHREEQC via Kerotakis L2"

[[reaction]]
id = "the-carbon-came-from-the-baking-soda"
spine = ["chemisches-rechnen"]
equation = "NaHCO₃ + CH₃COOH → CH₃COONa + H₂O + CO₂↑   ·   0.0500 mol bicarbonate gives 0.0500 mol of gas, whatever the acid"
concepts = ["element-budget"]
requires = ["limiting-reagent", "acid-carbonate"]
calculations = ["moles-from-mass", "limiting-reagent"]
models = ["conservation-of-atoms"]
apparatus = ["beaker", "balance", "gas-syringe"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium NTG Jgst. 8, LB Chemische Reaktionen — Gesetz von der Erhaltung der Masse"
ages = { min = 13.0, max = 14.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium NTG Jgst. 8 (ISB)"

[[reaction.curriculum]]
system = "nrw-kernlehrplan-g9"
stage = "Sek I, Erste Stufe (Jg. 7/8), IF3 Verbrennung — quantitative Betrachtung"
ages = { min = 12.0, max = 14.0 }
source = "Kernlehrplan Chemie Gymnasium G9 NRW, Heft 3415 (RdErl. 23.06.2019)"

[reaction.setup]
script = """
add v1 water 250mL
add v1 NaHCO3 4.2g
add v1 CH3COOH 12g
"""

[reaction.expect]
events = ["gas_evolved:CO2", "dissolved:NaHCO3"]
ph = { min = 3.9, max = 4.4 }

[reaction.expect.predict]
question = "4.2 g of baking soda (0.0500 mol) is fizzed with a big excess of vinegar — four times more acid than needed. How much CO₂ comes off?"
question_de = "4,2 g Natron (0,0500 mol) werden mit einem großen Überschuss Essig zur Reaktion gebracht — vier Mal mehr Säure als nötig. Wie viel CO₂ entsteht?"
options = [
  "More than with the exact amount, because more acid means more reaction",
  "0.0500 mol — every carbon atom in the gas came from the bicarbonate",
  "0.2000 mol — one per molecule of acid",
]
answer = 1
misconception = "Pouring in more acid feels like it should give more fizz, and it does look more violent. But the carbon in the carbon dioxide can only have come from the carbonate, and there are 0.0500 mol of carbon atoms in the beaker. Excess acid changes the rate and the final pH; it cannot change the element budget."
misconception_de = "Mehr Säure hineinzugießen fühlt sich an, als müsse es mehr Aufschäumen geben, und es sieht auch heftiger aus. Aber der Kohlenstoff im Kohlenstoffdioxid kann nur aus dem Carbonat stammen, und es befinden sich 0,0500 mol Kohlenstoffatome im Becherglas. Überschüssige Säure verändert die Geschwindigkeit und den End-pH-Wert; sie kann das Elementbudget nicht verändern."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Reagents are a throttle: more in, more out — and the extra violence of the excess-acid fizz is read as extra yield rather than extra speed."
reveals_de = "Edukte werden als Drosselklappe behandelt: mehr rein, mehr raus — und die zusätzliche Heftigkeit des Aufschäumens bei Säureüberschuss wird als zusätzliche Ausbeute gelesen statt als zusätzliche Geschwindigkeit."
next = "Watch the balance instead of the froth: double the acid, then quadruple it — the mass lost as gas is the same every time, because the carbon count never changed. Violence is a rate; yield is a budget."
next_de = "Beobachte die Waage statt des Schaums: Verdopple die Säure, dann vervierfache sie — die als Gas verlorene Masse bleibt jedes Mal gleich, weil sich die Kohlenstoffanzahl nie verändert hat. Heftigkeit ist eine Geschwindigkeit; Ausbeute ist ein Budget."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "The gas is credited to the acid: carbon dioxide as something the vinegar makes, one per molecule, rather than something released from the carbonate."
reveals_de = "Das Gas wird der Säure gutgeschrieben: Kohlenstoffdioxid als etwas, das der Essig herstellt, eins pro Molekül, statt als etwas, das aus dem Carbonat freigesetzt wird."
next = "Trace the atoms: vinegar's own carbons stay in the beaker as acetate — `inspect` shows them still dissolved after the fizz — and the CO₂ count matches the bicarbonate's 0.0500 mol exactly. The gas carries the carbonate's carbon, and only that."
next_de = "Verfolge die Atome: Die eigenen Kohlenstoffatome des Essigs bleiben als Acetat im Becherglas — `inspect` zeigt sie nach dem Aufschäumen weiterhin gelöst —, und die CO₂-Menge stimmt exakt mit den 0,0500 mol des Hydrogencarbonats überein. Das Gas trägt den Kohlenstoff des Carbonats, und nur diesen."

[reaction.registers]
lv1 = "Baking soda plus vinegar fizzes. Use four times as much vinegar and it fizzes harder and faster — but exactly the same amount of gas comes out in the end. Every bubble is made of atoms that were sitting in the powder; when they have all left, there is nothing more to give."
lv1_de = "Natron plus Essig schäumt auf. Verwendest du die vierfache Menge Essig, schäumt es stärker und schneller — aber am Ende entsteht genau dieselbe Menge Gas. Jede Blase besteht aus Atomen, die im Pulver saßen; sind sie alle weg, gibt es nichts mehr zu geben."
lv2 = "0.0500 mol NaHCO₃ carries 0.0500 mol of carbon. The bench releases 0.0183 mol on dissolving alone (the solution outgasses towards atmospheric pCO₂) and a further 0.0317 mol on acidification — 0.0500 mol exactly. Run it with 0.0599 mol of acid instead of 0.1998 and you get the same 0.0500 mol; only the final pH differs, 5.30 against 4.13."
lv2_de = "0,0500 mol NaHCO₃ tragen 0,0500 mol Kohlenstoff. Das Labor setzt beim bloßen Lösen 0,0183 mol frei (die Lösung entgast Richtung des atmosphärischen pCO₂) und beim Ansäuern weitere 0,0317 mol — genau 0,0500 mol. Führst du es mit 0,0599 mol Säure statt mit 0,1998 durch, erhältst du dieselben 0,0500 mol; nur der End-pH-Wert unterscheidet sich, 5,30 gegenüber 4,13."
lv3 = "Total dissolved inorganic carbon is fixed by the addition; what the acid does is shift the carbonate speciation until the solution supersaturates against log p(CO₂) = −3.408 and the excess exsolves. The split between the two steps is therefore not a stoichiometric fact but a Henry's-law one, and it moves if the atmosphere does. The sum does not move: element budgets are the hardest constraint in the solve."
lv3_de = "Der gesamte gelöste anorganische Kohlenstoff ist durch die Zugabe festgelegt; was die Säure bewirkt, ist die Carbonat-Speziation so zu verschieben, bis die Lösung gegenüber log p(CO₂) = −3,408 übersättigt ist und der Überschuss entweicht. Die Aufteilung zwischen den beiden Schritten ist also keine stöchiometrische Tatsache, sondern eine des Henry-Gesetzes, und sie verschiebt sich, wenn sich die Atmosphäre verschiebt. Die Summe bewegt sich nicht: Elementbudgets sind die härteste Randbedingung in der Lösung."

[reaction.provenance]
