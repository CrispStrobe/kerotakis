answer = 2
misconception = "This is the classic, and most people get it wrong. Every fire anyone has watched leaves less than it started with — a log becomes a handful of ash — so 'burning destroys matter' is learned from the world before it is unlearned in a classroom. The ash is lighter because the carbon left as gas. Magnesium's oxide is a solid and stays in the crucible, so the oxygen it took from the air is on the balance too. Burning is combination, not destruction; the log is the misleading case."

[reaction.registers]
lv1 = "It burns with a white light so fierce it hurts to look at, and leaves a powder that is whiter than the ribbon was. Put it back on the scales: it is heavier. Something came out of the air and joined it — the air is not nothing, and this is one of the few experiments where you can weigh that fact."
lv2 = "0.0494 mol of Mg (1.20 g ÷ 24.305) becomes 0.0494 mol of MgO, which is 1.99 g. The gain of 0.79 g is 0.0247 mol of O₂ at 31.998 g/mol, taken from the atmosphere. Mass is conserved across the whole system; the crucible is not the whole system, and the missing accounting is the air."
lv3 = "The oxygen is drawn from a reservoir rather than the vessel inventory, which is why the vessel's mass rises — a deliberate modelling choice matching an open crucible. The adiabatic solve settles at 3042 K with the condensed oxide dominant; at that temperature MgO(g) and atomic Mg are thermodynamically present in the NASA data but negligible at 1 bar, so essentially all of the metal is recovered as weighable solid."

