[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 9, LB Energie bei chemischen Reaktionen"
ages = { min = 14.0, max = 15.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium (ISB)"

[reaction.setup]
script = """
add v1 water 100mL
add v1 CaCl2 11.098g
measure v1 thermometer
"""

[reaction.expect]
events = ["dissolved:CaCl2"]
temperature_c = { min = 43.0, max = 47.0 }

[reaction.expect.predict]
question = "0.1000 mol of calcium chloride (ΔH_dis = −82.8 kJ/mol) dissolves in 100 mL of water. Water's molar heat capacity is 75.3 J·mol⁻¹·K⁻¹ and 100 mL is 5.53 mol. How warm does it get, starting from 25.0 °C?"
options = [
  "About 27 °C — a couple of degrees",
  "About 45 °C",
  "About 108 °C — it would boil",
  "It stays at 25 °C; dissolving is a physical change, not a chemical one",
]
answer = 1
misconception = "The last option is the deep one: dissolving gets filed under 'physical change' and physical changes are assumed not to involve energy. Breaking an ionic lattice and hydrating the ions are both large energy terms, and their difference is what the thermometer reads. The 108 °C answer comes from dividing by the mass in grams while using a molar heat capacity."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "The energy is conceded but sized by feel: kilojoules sound small, so degrees must be few — the division that would settle it is never actually done."
next = "Do the division the question hands you: 8.28 kJ into 5.53 mol × 75.3 J·mol⁻¹·K⁻¹ is 416 J/K, so +19.9 K. Committing to the arithmetic before the thermometer settles it is the entire exercise."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Units crossed mid-formula: grams sat under a molar heat capacity, and the resulting large number felt like chemistry happening rather than like an error."
next = "Carry the units through: J ÷ (mol × J·mol⁻¹·K⁻¹) leaves kelvin; grams under a molar capacity leaves nonsense wearing a temperature's clothes. Units are not decoration — they are the check that catches this before the water conspicuously fails to boil."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "Taxonomy doing physics: 'physical change' is a no-energy category, so classifying the event answers the thermometer's question."
next = "The categories do not hold the energy — the lattice and the hydration shells do. Run `cold-from-baking-soda` beside this: the same 'physical change' with the opposite sign. A taxonomy that predicts zero cannot predict both +20 K and −4 K; an energy balance predicts both."

[reaction.registers]
lv1 = "The cup gets genuinely hot — too hot to hold comfortably — and nothing was burned and nothing was plugged in. Pulling a crystal apart and wrapping water round the pieces releases more energy than it costs, and the surplus has nowhere to go except into the water."
lv2 = "q = n × ΔH_dis = 0.1000 mol × 82.8 kJ/mol = 8.28 kJ released. The water is 100 mL, 5.5343 mol, at 75.3 J·mol⁻¹·K⁻¹, so ΔT = 8280 J ÷ 416.7 J/K = 19.9 K. From 25.0 °C that predicts 44.9 °C, and the thermometer reads 44.87 °C. The calculation is not an exercise — it is the reading."
lv3 = "The heat goes into the water alone: the dissolved Ca²⁺ and Cl⁻ carry no modelled heat capacity, since partial molar heat capacities of aqueous ions are small and often negative and are not curated at this stage. That is an approximation with a known sign, and it is why the computed 44.87 °C sits marginally above a full calorimetric treatment. The vessel is adiabatic, so nothing is lost to a cup or to the room — the real experiment always reads lower, and the gap is the calorimeter constant."

