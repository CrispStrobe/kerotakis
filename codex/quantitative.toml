# The Kerotakis codex — the quantitative and thermal half.
#
# This file exists because of one claim in PLAN.md: calculation should be
# LOAD-BEARING. Every number below was produced by running the engine, not
# recalled from a textbook, and `kero codex lint` replays every script here
# through the real solvers. If the arithmetic a learner is asked to do stops
# agreeing with what the beaker shows, the build breaks.
#
# The convention throughout: lv1 is the macroscopic level (what a person in
# the room sees and can say truthfully), lv2 the symbolic level (the equation
# and the number), lv3 the submicroscopic and computational level (what the
# solver actually did, including where it is on thin ice). lv1 is not lv2
# with short words — it is a different, complete, true account.
#
# Licence: the codex is CC BY-SA 4.0, separately from the AGPL code.

# ============================================================ counting stuff

[[reaction]]
id = "moles-from-mass"
spine = ["die-stoffmenge-und-das-mol"]
summary = "n = m / M   ·   5.844 g NaCl ÷ 58.443 g/mol = 0.1000 mol"
concepts = ["amount-of-substance", "molar-mass"]
requires = ["dissolving"]
calculations = ["moles-from-mass"]
models = ["particle-model"]
apparatus = ["beaker", "balance", "spatula"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 9, Quantitative Betrachtung chemischer Reaktionen"
ages = { min = 14.0, max = 15.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium (ISB; Lehrplantexte nicht urheberrechtlich geschützt)"

[reaction.setup]
script = """
add v1 water 1000mL
add v1 NaCl 5.844g
measure v1 balance
"""

[reaction.expect]
events = ["dissolved:NaCl"]
ph = { min = 6.8, max = 7.2 }

[reaction.expect.predict]
question = "You weigh out 5.844 g of table salt. The bench asks how many moles that is. Sodium chloride's molar mass is 58.443 g/mol. What does the engine report going in?"
options = [
  "5.844 mol — the number you weighed",
  "0.1000 mol",
  "58.443 mol — the molar mass",
  "It depends how much water you put it in",
]
answer = 1
misconception = "The last option is the common one: learners expect the amount of substance to change when the solution is diluted. It does not — n is a property of the sample you weighed, and only concentration depends on the volume. The first is the rawer error of using grams as if they were moles."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Grams and moles are two names for one 'amount', converting by relabelling — the balance said 5.844, so 5.844 it is, in whatever unit the question wants."
next = "Weigh out 58.443 g instead and ask again: one mole, exactly. A mole is a count, priced in grams by the molar mass — the balance reads the price, never the count."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "The molar mass is read as the answer: the biggest, most official-looking number on the page must be the quantity asked for, and the division's direction is lost."
next = "Sanity-check by size before dividing either way: 58 mol of salt would be three and a half kilograms, and the balance is holding six grams. When a formula's direction is uncertain, the absurd magnitude is the tell."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "Amount and concentration are welded: dilute it and there is 'less salt', so n must shrink with the water it sits in."
next = "Run `concentration-is-a-ratio`: the same 5.844 g into 100 mL and into 200 mL, and both vessels `inspect` to 0.1000 mol. Only the mol-per-litre moved — the count you weighed is not negotiable by water."

[reaction.registers]
lv1 = "Weighing tells you how heavy something is. Counting tells you how many pieces there are. Chemistry needs the count, because reactions pair pieces up — and the balance is how you get to the count, since every substance has a fixed weight per piece."
lv2 = "n = m / M. 5.844 g ÷ 58.443 g/mol = 0.1000 mol, and the bench confirms 0.1000 mol going in. In 1.000 L that is a 0.1 mol/L solution; the total mass on the balance, 1002.84 g, is the litre of water plus the salt, because nothing left."
lv3 = "The registry carries M = 58.443 g/mol from the IUPAC/CIAAW 2021 atomic weights, so the conversion is exact to the data's own precision rather than to a rounded 58.5. The 0.1000 mol then enters PHREEQC as a total-element constraint, and the pH of 6.98 rather than 7.00 is the ionic-strength correction on the water's own autoprotolysis, not an artefact."

[reaction.provenance]
source = "Standard curriculum stoichiometry; molar mass from IUPAC/CIAAW 2021 atomic weights via the Kerotakis species registry. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "Kerotakis bench; speciation via PHREEQC L2"

[[reaction]]
id = "concentration-is-a-ratio"
spine = ["konzentrationsberechnungen"]
summary = "c = n / V   ·   0.1000 mol in 0.100 L = 1.00 mol/L; the same 0.1000 mol in 0.200 L = 0.50 mol/L"
concepts = ["concentration", "ionic-strength"]
requires = ["amount-of-substance"]
calculations = ["concentration"]
models = ["particle-model"]
apparatus = ["beaker", "measuring-cylinder", "balance"]

[reaction.setup]
script = """
add v1 water 100mL
add v1 NaCl 5.844g
new
add v2 water 200mL
add v2 NaCl 5.844g
"""

[reaction.expect]
events = ["dissolved:NaCl"]
ph = { min = 6.7, max = 7.1 }

[reaction.expect.predict]
question = "The same 5.844 g of salt goes into 100 mL in one beaker and 200 mL in another. Which beaker holds more sodium chloride?"
options = [
  "The 100 mL beaker — it is more concentrated",
  "The 200 mL beaker — there is more liquid",
  "Neither: both hold 0.1000 mol; only the concentration differs",
]
answer = 2
misconception = "Concentration and amount get welded together. A strong cup of tea does not contain more tea than a weak bucket of it. The engine separates the two explicitly: both vessels report 0.1000 mol of chloride, and the ionic strengths differ by exactly a factor of two."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "'More concentrated' is read as 'containing more' — intensity mistaken for quantity, the strong cup of tea holding more tea than the weak bucket."
next = "Evaporate both to dryness: identical crystals, 5.84 g each, back on the same balance. Two solutions that differ in everything the tongue would notice return the same salt, because the salt never differed."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "Solute scales with solution: more liquid must hold more stuff, as if the water manufactured salt to fill itself."
next = "Follow the salt's paper trail: it entered once, on the balance, before any water was chosen. `measure` both vessels — they differ by exactly the extra water's mass, and by nothing else."

[reaction.registers]
lv1 = "Two beakers, the same spoonful of salt, different amounts of water. The small one tastes saltier — but there is not more salt in it. 'How much' and 'how strong' are two different questions, and mixing them up is one of the easiest mistakes to make."
lv2 = "c = n / V. 0.1000 mol in 0.100 L is 1.00 mol/L; in 0.200 L it is 0.50 mol/L. The bench reports the ionic strength of the two solutions as 1.0030 m and 0.5015 m — exactly the halving, because for a 1:1 salt like NaCl the ionic strength equals the molality."
lv3 = "Ionic strength I = ½ Σ cᵢ zᵢ², which for a 1:1 electrolyte collapses to the concentration itself; that identity is why the two numbers look like the concentrations. The small excess over 1.0000 (1.0030 m) is molality against molarity: the litre of solution is not a litre of water, and PHREEQC works in mol per kg of water throughout."

[reaction.provenance]
source = "Standard curriculum concentration calculations; ionic strength from PHREEQC (USGS) speciation. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "PHREEQC via Kerotakis L2"

[[reaction]]
id = "dilution-moves-ph-by-one"
spine = ["konzentrationsberechnungen"]
summary = "c₁V₁ = c₂V₂   ·   0.001 mol in 0.100 L → pH 2.04; the same acid in 1.000 L → pH 3.01"
concepts = ["dilution"]
requires = ["concentration", "ph"]
calculations = ["dilution", "ph-from-concentration"]
models = ["particle-model"]
apparatus = ["beaker", "pipette", "ph-meter"]

[reaction.setup]
script = """
add v1 water 100mL
add v1 HCl 0.001mol
measure v1 ph
add v1 water 900mL
measure v1 ph
"""

[reaction.expect]
ph = { min = 2.85, max = 3.15 }

[reaction.expect.predict]
question = "An acid reads pH 2.04. You add nine times as much water again, so the volume is ten times what it was. What does the meter read now?"
options = [
  "pH 3.0 — a tenfold dilution costs one pH unit",
  "pH 7.0 — water is neutral, so diluting makes it neutral",
  "pH 20.4 — ten times the pH",
  "pH 2.04 — the acid is still in there",
]
answer = 0
misconception = "Two errors are common and both are about the logarithm. 'Ten times the volume, ten times the pH' treats pH as if it were the concentration; and 'dilution neutralises' forgets that no amount of water reaches pH 7 — you approach it and never arrive, because the acid is still all there."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "Mixing averages the labels: water 'is pH 7', so enough of it drags the mixture to 7 the way white paint lightens red — neutrality as an ingredient rather than an absence."
next = "Keep diluting, tenfold at a time, and read the meter each round: 3, then 4, then 5 — one unit per decade, creeping toward 7 and never arriving, because every proton that came in is still in there."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "pH is proportional to 'how much': the logarithm is absent, so ten times the volume multiplies the reading by ten."
next = "Notice what 20.4 would even mean: the scale counts powers of ten of hydrogen-ion activity, which is why water's whole world fits between about 0 and 14. A tenfold change moves it by exactly one — to 3.0, as the meter shows."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "pH travels with the acid like a colour: as long as the acid exists, its label persists — crowding plays no role in the reading."
next = "Run it and hold both facts at once: `inspect` shows the same moles of acid, and the meter moves anyway. pH belongs to the solution, not to the substance — it prices how crowded the protons are, not whether they exist."

[reaction.registers]
lv1 = "Add water to an acid and it gets weaker — but it never turns into water. The acid you put in is still there; it just has more room. On the meter the number climbs, and it climbs by one step for every tenfold splash of water, not by ten."
lv2 = "c₁V₁ = c₂V₂. 0.001 mol in 100 mL is 0.01 mol/L; the meter reads pH 2.04. Take the volume to 1.000 L and the concentration is 0.001 mol/L — the meter reads pH 3.01. One pH unit per factor of ten, because pH is a logarithm."
lv3 = "The moles of H⁺ are conserved exactly across the dilution; what changes is the activity, and with it the measured pH. Note the reading is 2.04 rather than 2.00 and 3.01 rather than 3.00: at I ≈ 0.01 m the activity coefficient is ≈0.90, and PHREEQC reports pH as −log a(H⁺), not −log c(H⁺). Textbooks assume γ = 1 and quietly lose that hundredth."

[reaction.provenance]
source = "Standard curriculum dilution calculations; activity model from PHREEQC wateq4f.dat (USGS). Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "PHREEQC via Kerotakis L2"

# ================================================ ratios, limits and yields

[[reaction]]
id = "stoichiometric-ratio-from-the-equation"
spine = ["chemisches-rechnen"]
equation = "2 Mg + O₂ → 2 MgO   ·   2.40 g Mg → 3.98 g MgO, a ratio of 40.304 : 24.305"
concepts = ["stoichiometric-ratio", "balanced-equations"]
requires = ["amount-of-substance", "combustion"]
calculations = ["moles-from-mass", "stoichiometry", "mass-from-moles"]
models = ["particle-model", "conservation-of-atoms"]
apparatus = ["crucible", "balance", "tongs", "bunsen"]

[[reaction.curriculum]]
system = "nrw-kernlehrplan-g9"
stage = "Sek I, Erste Stufe (Jg. 7/8), IF3 Verbrennung — quantitative Betrachtung"
ages = { min = 12.0, max = 14.0 }
source = "Kernlehrplan Chemie Gymnasium G9 NRW, Heft 3415 (RdErl. 23.06.2019, Amtsblatt 07-08/19)"

[reaction.setup]
script = """
add v1 Mg 2.4g
measure v1 balance
ignite v1
measure v1 balance
"""

[reaction.expect]
events = ["ignited", "consumed:Mg", "precipitated:MgO"]
temperature_c = { min = 2600.0, max = 2900.0 }

[reaction.expect.predict]
question = "Burn 2.40 g of magnesium ribbon completely. The balanced equation is 2 Mg + O₂ → 2 MgO. M(Mg) = 24.305, M(MgO) = 40.304 g/mol. What mass of white powder is left?"
options = [
  "2.40 g — mass is conserved",
  "3.98 g",
  "1.44 g — some burns away",
  "4.80 g — one oxygen per magnesium doubles it",
]
answer = 1
misconception = "The first option is conservation of mass misapplied: mass is conserved in the universe, not in an open crucible that is drawing oxygen out of the room. The last comes from reading '2 Mg + O₂' as though each magnesium takes a whole O₂ rather than half of one."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Conservation applied to the crucible instead of the system: what the balance saw at the start is all there is, and the invisible reactant drawn from the room has no line in the ledger."
next = "`burning-makes-it-heavier` is this confrontation staged on a balance: the ash outweighs the ribbon by precisely the oxygen's mass. Conservation holds — over ribbon plus air, not over the crucible alone."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Burning is loss: fire consumes, so less remains — the campfire's log-to-ash prototype applied to a metal."
next = "Weigh it: 3.98 g from 2.40. The campfire was not lying — its loss left as gas. Magnesium's product is a solid, so the oxygen it took stays on the balance (`burning-makes-it-lighter` runs the prototype itself, for contrast)."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "The coefficients read pairwise: '2 Mg + O₂' as each magnesium taking a whole O₂, the 2:1 ratio collapsed into 1:1."
next = "Count atoms through the equation: two magnesiums share one O₂ — one oxygen atom each, 16 g per mole of metal, not 32. The molar masses in the question already contain the answer: 2.40 g × 40.304/24.305 = 3.98 g."

[reaction.registers]
lv1 = "Weigh the ribbon: 2.40 g. Burn it. Weigh the ash: 3.98 g. Do it again with twice as much ribbon and you get twice as much ash — the relationship between what you start with and what you end with is fixed, and once you know it for one piece you know it for every piece."
lv2 = "0.0987 mol of Mg (2.40 g ÷ 24.305 g/mol) gives 0.0987 mol of MgO by the 2:2 ratio in the equation, which is 3.98 g (× 40.304 g/mol). The bench reports exactly 0.0987 mol of MgO and a balance reading of 3.98 g. The equation is not decoration — it is the conversion factor."
lv3 = "The 1:1 mole ratio survives because the Gibbs minimiser conserves the magnesium element budget exactly; oxygen is drawn from the atmospheric reservoir rather than the vessel's inventory, which is what makes the mass ratio 40.304/24.305 = 1.658 appear on the balance. At the 3042 K the solve settles to, gaseous Mg and MgO are thermodynamically accessible; they do not appear in the products because the condensed oxide dominates at 1 bar."

[reaction.provenance]
source = "Standard curriculum combustion stoichiometry; thermochemistry from NASA CEA thermo.inp. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
licence = "NASA CEA data: Apache-2.0"
computed_by = "Kerotakis L2g Gibbs minimiser"

[[reaction]]
id = "limiting-reagent"
spine = ["chemisches-rechnen"]
equation = "Ag⁺ + Cl⁻ → AgCl↓   ·   0.0200 mol Ag⁺ + 0.0100 mol Cl⁻ → 0.0100 mol AgCl (and the reverse)"
concepts = ["limiting-reagent", "excess-reagent"]
requires = ["stoichiometric-ratio", "precipitation"]
calculations = ["moles-from-mass", "limiting-reagent"]
models = ["particle-model", "ionic-bonding"]
apparatus = ["beaker", "balance", "stirring-rod"]

[reaction.setup]
script = """
add v1 water 500mL
add v1 NaCl 0.5844g
add v1 AgNO3 3.3974g
new
add v2 water 500mL
add v2 NaCl 1.1689g
add v2 AgNO3 1.6987g
"""

[reaction.expect]
events = ["precipitated:AgCl", "dissolved:AgNO3"]

[reaction.expect.predict]
question = "Beaker 1: 0.0100 mol of chloride and 0.0200 mol of silver. Beaker 2: 0.0200 mol of chloride and 0.0100 mol of silver. Which makes more silver chloride?"
options = [
  "Beaker 1 — it has more silver, and silver is the heavy part",
  "Beaker 2 — it has more chloride",
  "Neither: both make 0.0100 mol, set by whichever ion runs out first",
]
answer = 2
misconception = "Learners reliably add the reagents up rather than pairing them off. The reaction is one silver to one chloride: the partner in short supply decides the answer and the surplus simply sits there. Both beakers hold 0.0300 mol of reactant in total and both give exactly 0.0100 mol of precipitate."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "The yield follows the 'important' reagent: silver is the heavy, expensive, name-giving part, so more silver means more silver chloride — pairing-off is not in the picture."
next = "Run both and filter: two identical 0.0100 mol cakes. Then `inspect` what remains dissolved — beaker 1 still holds its extra silver, doing nothing. Importance is not a stoichiometric quantity."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "The mirror of the same error: more of either ingredient means more product — amounts add, rather than pair."
next = "Pair them off like dance partners: each AgCl needs exactly one of each ion, so the shorter queue ends the dance — at 0.0100 mol in both rooms. The totals being equal (0.0300 mol each) is the trap the question sets."

[reaction.registers]
lv1 = "Two beakers get the same total amount of chemical, just split differently — one has extra silver, the other extra salt. Both go cloudy, and both produce exactly the same amount of white solid. Whatever runs out first is what stops the reaction; the leftovers do nothing but stay dissolved."
lv2 = "Ag⁺ + Cl⁻ → AgCl↓ is a 1:1 reaction. Beaker 1: 0.0100 mol Cl⁻ is limiting against 0.0200 mol Ag⁺. Beaker 2: 0.0100 mol Ag⁺ is limiting against 0.0200 mol Cl⁻. The bench reports 0.0100 mol of AgCl in both. Work out the moles of each, take the smaller, and you have predicted the answer before running it."
lv3 = "The solver does not apply a limiting-reagent rule — it minimises free energy subject to element balances, and the 1:1 stoichiometry falls out of the mass-action constraint on Ksp(AgCl) ≈ 1.8 × 10⁻¹⁰. The two beakers differ in what remains dissolved: excess Ag⁺ suppresses residual chloride and vice versa, the common-ion effect, and the final pH differs slightly (6.90 against 7.07) because nitrate and chloride do not affect the proton balance identically."

[reaction.provenance]
source = "Standard curriculum limiting-reagent problem; Ksp and speciation from PHREEQC wateq4f.dat (USGS). Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "PHREEQC via Kerotakis L2"

[[reaction]]
id = "theoretical-yield-and-what-a-real-lab-loses"
spine = ["quantitative-analyseverfahren"]
summary = "0.0100 mol AgCl × 143.32 g/mol = 1.43 g theoretical; the filter recovers 1.43 g"
concepts = ["theoretical-yield", "percentage-yield"]
requires = ["limiting-reagent"]
calculations = ["limiting-reagent", "mass-from-moles", "percentage-yield"]
models = ["particle-model"]
apparatus = ["beaker", "filter-funnel", "filter-paper", "balance", "drying-oven"]

[[reaction.curriculum]]
system = "nrw-kernlehrplan-g9"
stage = "Sek I, Zweite Stufe (Jg. 9/10), IF6 Salze und Ionen — quantitative Auswertung"
ages = { min = 14.0, max = 16.0 }
source = "Kernlehrplan Chemie Gymnasium G9 NRW, Heft 3415 (RdErl. 23.06.2019)"

[reaction.setup]
script = """
add v1 water 500mL
add v1 NaCl 0.5844g
add v1 AgNO3 1.6987g
new
filter v1 v2
measure v1 balance
measure v2 balance
"""

[reaction.expect]
events = ["precipitated:AgCl", "filtered"]

[reaction.expect.predict]
question = "0.0100 mol of each reagent, filtered and dried. The theoretical yield is 1.43 g. A class of thirty does this and reports yields between 71% and 96%. Where did the missing silver chloride go?"
options = [
  "The reaction did not finish — some silver stayed as Ag⁺",
  "Mostly onto the filter paper, the beaker wall and the wash water",
  "It decomposed while drying",
]
answer = 1
misconception = "A yield under 100% gets read as a statement about the chemistry, so learners go looking for an incomplete reaction. Here it is almost entirely mechanical loss. The engine makes that visible by reporting 1.43 g — the full theoretical yield — because it models the chemistry and nothing else: no filter paper, no splashes, no scraping. The residual dissolved silver is real but tiny, around 10⁻⁶ mol."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Every shortfall is chemistry's fault: a yield under 100% means the reaction stopped early, because the apparatus is invisible in the account."
next = "Compare the two worlds: this bench models chemistry with no filter paper, no beaker walls, no splashes — and reports the full 1.43 g, with the genuinely-unreacted silver near 10⁻⁶ mol, a thousandth of what the class lost. The missing grams are on the equipment, which is why careful gravimetric work weighs the filter paper too."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "A reaction is invented to cover a bookkeeping gap: mass is missing, so a plausible-sounding process nobody observed — decomposition on drying — gets the blame."
next = "Look at the loss pattern before blaming chemistry: thirty students scattered from 71% to 96%. A decomposition at a shared drying temperature would take a similar bite from everyone; handling losses scatter exactly like this. The spread is the fingerprint."

[reaction.registers]
lv1 = "Filter the cloudy mixture and a white paste stays on the paper. Dry it and weigh it. The number you get is almost never the number you calculated — and in a real lab, that gap is mostly stuff stuck to the glass, not chemistry going wrong."
lv2 = "The limiting reagent gives 0.0100 mol of AgCl, which at 143.32 g/mol is a theoretical yield of 1.43 g. The bench filters and weighs 1.43 g in v1, and the filtrate v2 weighs 499.35 g. Percentage yield = actual ÷ theoretical × 100; here it is essentially 100%, so any shortfall in a real experiment is loss, not incomplete reaction."
lv3 = "The filtrate still holds silver and chloride at the level Ksp demands — the inspect view shows both at the fourth-decimal floor — so the 'complete' precipitation is complete only to within the solubility product, about 1.3 × 10⁻⁵ mol/L each in pure water. That residue is a real, calculable loss and is the reason gravimetric analysis washes with dilute nitric acid rather than water. What the engine cannot model is the paper, and it does not pretend to."

[reaction.provenance]
source = "Standard gravimetric determination of chloride; Ksp and speciation from PHREEQC wateq4f.dat (USGS). The interpretation of where real-lab losses come from is Editorial judgement (Kerotakis).. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "PHREEQC via Kerotakis L2"

[[reaction]]
id = "the-carbon-came-from-the-baking-soda"
spine = ["chemisches-rechnen"]
equation = "NaHCO₃ + CH₃COOH → CH₃COONa + H₂O + CO₂↑   ·   0.0500 mol bicarbonate gives 0.0500 mol of gas, whatever the acid"
concepts = ["element-budget"]
requires = ["limiting-reagent", "acid-carbonate"]
calculations = ["moles-from-mass", "limiting-reagent"]
models = ["conservation-of-atoms"]
apparatus = ["beaker", "balance", "gas-syringe"]

[reaction.setup]
script = """
add v1 water 250mL
add v1 NaHCO3 4.2g
add v1 CH3COOH 12g
"""

[reaction.expect]
events = ["gas_evolved:CO2", "dissolved:NaHCO3"]
ph = { min = 3.9, max = 4.4 }

[reaction.expect.predict]
question = "4.2 g of baking soda (0.0500 mol) is fizzed with a big excess of vinegar — four times more acid than needed. How much CO₂ comes off?"
options = [
  "More than with the exact amount, because more acid means more reaction",
  "0.0500 mol — every carbon atom in the gas came from the bicarbonate",
  "0.2000 mol — one per molecule of acid",
]
answer = 1
misconception = "Pouring in more acid feels like it should give more fizz, and it does look more violent. But the carbon in the carbon dioxide can only have come from the carbonate, and there are 0.0500 mol of carbon atoms in the beaker. Excess acid changes the rate and the final pH; it cannot change the element budget."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Reagents are a throttle: more in, more out — and the extra violence of the excess-acid fizz is read as extra yield rather than extra speed."
next = "Watch the balance instead of the froth: double the acid, then quadruple it — the mass lost as gas is the same every time, because the carbon count never changed. Violence is a rate; yield is a budget."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "The gas is credited to the acid: carbon dioxide as something the vinegar makes, one per molecule, rather than something released from the carbonate."
next = "Trace the atoms: vinegar's own carbons stay in the beaker as acetate — `inspect` shows them still dissolved after the fizz — and the CO₂ count matches the bicarbonate's 0.0500 mol exactly. The gas carries the carbonate's carbon, and only that."

[reaction.registers]
lv1 = "Baking soda plus vinegar fizzes. Use four times as much vinegar and it fizzes harder and faster — but exactly the same amount of gas comes out in the end. Every bubble is made of atoms that were sitting in the powder; when they have all left, there is nothing more to give."
lv2 = "0.0500 mol NaHCO₃ carries 0.0500 mol of carbon. The bench releases 0.0183 mol on dissolving alone (the solution outgasses towards atmospheric pCO₂) and a further 0.0317 mol on acidification — 0.0500 mol exactly. Run it with 0.0599 mol of acid instead of 0.1998 and you get the same 0.0500 mol; only the final pH differs, 5.30 against 4.13."
lv3 = "Total dissolved inorganic carbon is fixed by the addition; what the acid does is shift the carbonate speciation until the solution supersaturates against log p(CO₂) = −3.408 and the excess exsolves. The split between the two steps is therefore not a stoichiometric fact but a Henry's-law one, and it moves if the atmosphere does. The sum does not move: element budgets are the hardest constraint in the solve."

[reaction.provenance]
source = "Standard curriculum acid–carbonate stoichiometry; carbonate speciation from PHREEQC (USGS). Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "PHREEQC via Kerotakis L2"

[[reaction]]
id = "mass-in-an-open-vessel"
spine = ["massenerhaltung"]
