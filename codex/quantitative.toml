# The Kerotakis codex — the quantitative and thermal half.
#
# This file exists because of one claim in PLAN.md: calculation should be
# LOAD-BEARING. Every number below was produced by running the engine, not
# recalled from a textbook, and `kero codex lint` replays every script here
# through the real solvers. If the arithmetic a learner is asked to do stops
# agreeing with what the beaker shows, the build breaks.
#
# The convention throughout: lv1 is the macroscopic level (what a person in
# the room sees and can say truthfully), lv2 the symbolic level (the equation
# and the number), lv3 the submicroscopic and computational level (what the
# solver actually did, including where it is on thin ice). lv1 is not lv2
# with short words — it is a different, complete, true account.
#
# Licence: the codex is CC BY-SA 4.0, separately from the AGPL code.

# ============================================================ counting stuff

[[reaction]]
id = "moles-from-mass"
spine = ["die-stoffmenge-und-das-mol"]
summary = "n = m / M   ·   5.844 g NaCl ÷ 58.443 g/mol = 0.1000 mol"
summary_de = "n = m / M   ·   5,844 g NaCl ÷ 58,443 g/mol = 0,1000 mol"
concepts = ["amount-of-substance", "molar-mass"]
requires = ["dissolving"]
calculations = ["moles-from-mass"]
models = ["particle-model"]
apparatus = ["beaker", "balance", "spatula"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 9, Quantitative Betrachtung chemischer Reaktionen"
ages = { min = 14.0, max = 15.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium (ISB; Lehrplantexte nicht urheberrechtlich geschützt)"

[reaction.setup]
script = """
add v1 water 1000mL
add v1 NaCl 5.844g
measure v1 balance
"""

[reaction.expect]
events = ["dissolved:NaCl"]
ph = { min = 6.8, max = 7.2 }

[reaction.expect.predict]
question = "You weigh out 5.844 g of table salt. The bench asks how many moles that is. Sodium chloride's molar mass is 58.443 g/mol. What does the engine report going in?"
question_de = "Du wiegst 5,844 g Kochsalz ab. Das Labor fragt, wie viele Mol das sind. Die molare Masse von Natriumchlorid beträgt 58,443 g/mol. Was meldet das Labor als Stoffmenge beim Einwiegen?"
options = [
  "5.844 mol — the number you weighed",
  "0.1000 mol",
  "58.443 mol — the molar mass",
  "It depends how much water you put it in",
]
answer = 1
misconception = "The last option is the common one: learners expect the amount of substance to change when the solution is diluted. It does not — n is a property of the sample you weighed, and only concentration depends on the volume. The first is the rawer error of using grams as if they were moles."
misconception_de = "Die letzte Option ist die häufigste: Lernende erwarten, dass sich die Stoffmenge ändert, wenn die Lösung verdünnt wird. Das tut sie nicht — n ist eine Eigenschaft der eingewogenen Probe, und nur die Konzentration hängt vom Volumen ab. Die erste Option ist der noch grundlegendere Fehler, Gramm wie Mol zu behandeln."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Grams and moles are two names for one 'amount', converting by relabelling — the balance said 5.844, so 5.844 it is, in whatever unit the question wants."
reveals_de = "Gramm und Mol werden als zwei Namen für dieselbe 'Menge' behandelt, die sich durch bloßes Umbenennen umrechnen lassen — die Waage zeigte 5,844, also sind es 5,844, in welcher Einheit auch immer gefragt ist."
next = "Weigh out 58.443 g instead and ask again: one mole, exactly. A mole is a count, priced in grams by the molar mass — the balance reads the price, never the count."
next_de = "Wiege stattdessen 58,443 g ab und frage erneut: genau ein Mol. Ein Mol ist eine Anzahl, die über die molare Masse in Gramm bepreist wird — die Waage liest den Preis ab, niemals die Anzahl."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "The molar mass is read as the answer: the biggest, most official-looking number on the page must be the quantity asked for, and the division's direction is lost."
reveals_de = "Die molare Masse wird als Antwort gelesen: Die größte, offiziell wirkende Zahl auf der Seite muss die gesuchte Größe sein, und die Richtung der Division geht dabei verloren."
next = "Sanity-check by size before dividing either way: 58 mol of salt would be three and a half kilograms, and the balance is holding six grams. When a formula's direction is uncertain, the absurd magnitude is the tell."
next_de = "Prüfe die Größenordnung, bevor du in irgendeine Richtung dividierst: 58 mol Salz wären dreieinhalb Kilogramm, und die Waage hält sechs Gramm. Wenn die Richtung einer Formel unklar ist, verrät die absurde Größenordnung den Fehler."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "Amount and concentration are welded: dilute it and there is 'less salt', so n must shrink with the water it sits in."
reveals_de = "Stoffmenge und Konzentration werden verschweißt: Verdünnt man, gibt es 'weniger Salz', also muss n mit dem Wasser schrumpfen, in dem es sitzt."
next = "Run `concentration-is-a-ratio`: the same 5.844 g into 100 mL and into 200 mL, and both vessels `inspect` to 0.1000 mol. Only the mol-per-litre moved — the count you weighed is not negotiable by water."
next_de = "Führe `concentration-is-a-ratio` aus: dieselben 5,844 g in 100 mL und in 200 mL, und beide Gefäße zeigen bei `inspect` 0,1000 mol. Nur der Wert in Mol pro Liter hat sich verändert — die abgewogene Anzahl lässt sich nicht durch Wasser verhandeln."

[reaction.registers]
lv1 = "Weighing tells you how heavy something is. Counting tells you how many pieces there are. Chemistry needs the count, because reactions pair pieces up — and the balance is how you get to the count, since every substance has a fixed weight per piece."
lv1_de = "Wiegen sagt dir, wie schwer etwas ist. Zählen sagt dir, wie viele Teilchen es sind. Die Chemie braucht die Anzahl, weil Reaktionen Teilchen einander zuordnen — und die Waage ist der Weg zur Anzahl, denn jeder Stoff hat ein festes Gewicht pro Teilchen."
lv2 = "n = m / M. 5.844 g ÷ 58.443 g/mol = 0.1000 mol, and the bench confirms 0.1000 mol going in. In 1.000 L that is a 0.1 mol/L solution; the total mass on the balance, 1002.84 g, is the litre of water plus the salt, because nothing left."
lv2_de = "n = m / M. 5,844 g ÷ 58,443 g/mol = 0,1000 mol, und das Labor bestätigt 0,1000 mol beim Einwiegen. In 1,000 L ergibt das eine Lösung mit 0,1 mol/L; die Gesamtmasse auf der Waage, 1002,84 g, ist der Liter Wasser plus das Salz, denn nichts ist verlorengegangen."
lv3 = "The registry carries M = 58.443 g/mol from the IUPAC/CIAAW 2021 atomic weights, so the conversion is exact to the data's own precision rather than to a rounded 58.5. The 0.1000 mol then enters PHREEQC as a total-element constraint, and the pH of 6.98 rather than 7.00 is the ionic-strength correction on the water's own autoprotolysis, not an artefact."
lv3_de = "Die Registry führt M = 58,443 g/mol aus den IUPAC/CIAAW-Atomgewichten von 2021, sodass die Umrechnung exakt bis zur Genauigkeit der Daten selbst ist und nicht bis zu einem gerundeten 58,5. Die 0,1000 mol gehen anschließend als Gesamtelement-Randbedingung in PHREEQC ein, und der pH-Wert von 6,98 statt 7,00 ist die Ionenstärke-Korrektur der Eigenprotolyse des Wassers, kein Artefakt."

[reaction.provenance]
source = "Standard curriculum stoichiometry; molar mass from IUPAC/CIAAW 2021 atomic weights via the Kerotakis species registry. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "Kerotakis bench; speciation via PHREEQC L2"

