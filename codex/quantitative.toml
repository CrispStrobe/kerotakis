[[reaction]]
id = "ph-is-not-quite-minus-log-c"
spine = ["ph-wert-berechnungen"]
summary = "0.100 mol/L HCl: −log c = 1.00, and the meter reads 1.08"
equation = "HCl → H⁺ + Cl⁻"
concepts = ["ph-calculation", "activity"]
requires = ["concentration", "acids"]
calculations = ["ph-from-concentration"]
models = ["ionic-bonding", "activity-model"]
apparatus = ["beaker", "ph-meter", "pipette"]

[reaction.setup]
script = """
add v1 water 1000mL
add v1 HCl 0.1mol
measure v1 ph
"""

[reaction.expect]
ph = { min = 1.0, max = 1.2 }

[reaction.expect.predict]
question = "0.100 mol of hydrochloric acid in a litre of water. The textbook formula pH = −log[H⁺] gives 1.00. What does the meter read?"
options = [
  "Exactly 1.00",
  "1.08 — a little above, because the meter responds to activity, not concentration",
  "0.92 — a little below",
]
answer = 1
misconception = "pH = −log c is taught as a definition when it is an approximation that holds when ions are far apart. At 0.1 mol/L they are not: each proton is surrounded by a cloud of counter-ions that shields it, and the electrode feels the shielded version. The gap is small here and grows with concentration — which is exactly why lv3 exists."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "The formula is the definition, so the meter must obey it — a disagreeing meter is broken, and 'activity' has no slot in the picture."
next = "Dilute and watch the gap close: at 0.001 mol/L (`strong-acid`) formula and meter agree to the second decimal; at 0.1 they part by 0.08. A definition's error does not shrink with dilution — an approximation's does, and that behaviour is the diagnosis."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "A correction is expected but its direction is guessed — the crowding is imagined to concentrate the acid's punch rather than damp it, so corrections land by coin-flip."
next = "Let the physics fix the sign: every proton drags a cloud of counter-ions that screens it, so the electrode always feels *less* than the count in solutions like this — the reading lands above the naive number, never below. A correction whose sign you can derive is chemistry; one you guess is decoration."

[reaction.registers]
lv1 = "A pH meter does not count acid particles. It responds to how strongly the acid is pushing, and in a crowded solution the particles get in each other's way, so the push is slightly weaker than the count suggests. The meter tells you what the solution does, which is the number that matters."
lv2 = "0.100 mol in 1.000 L is 0.100 mol/L. Complete dissociation gives [H⁺] = 0.100, so −log[H⁺] = 1.00. The meter reads 1.08. The formula is right about the count and slightly wrong about the reading, and the difference is not experimental error — it is reproducible."
lv3 = "pH is defined as −log a(H⁺), and a = γc. At I = 0.1 m the WATEQ Debye–Hückel extension gives γ(H⁺) ≈ 0.83, so pH = −log(0.83 × 0.100) = 1.08 — which is what PHREEQC computes and reports. Compare the same acid at 0.001 mol/L, where γ ≈ 0.96 and the correction is a hundredth: the approximation is not wrong, it has a validity range, and this is a place where the learner can watch it expire."

[reaction.provenance]
source = "Standard curriculum pH calculation; activity coefficients from PHREEQC wateq4f.dat (USGS). Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
