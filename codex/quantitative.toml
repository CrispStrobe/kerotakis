summary_de = "2 Mg + O₂ → 2 MgO von 228 °C → 2177 °C; dieselbe Reaktion von 927 °C → 2769 °C"
concepts = ["adiabatic-flame-temperature", "enthalpy-balance"]
requires = ["combustion", "calorimetry"]
