ph = { min = 5.0, max = 5.6 }

[reaction.expect.predict]
question = "The beaker reads 252.66 g. You add 3.60 g of vinegar and it fizzes. What does the balance read when the fizzing stops?"
question_de = "Das Becherglas zeigt 252,66 g. Du gibst 3,60 g Essig dazu, und es schäumt auf. Was zeigt die Waage, wenn das Aufschäumen aufhört?"
options = [
  "256.26 g — mass is always conserved",
  "254.84 g — about 1.4 g lighter than expected",
  "252.66 g — the acid is consumed",
]
answer = 1
misconception = "'Mass is conserved' is taught as a law and then applied to a container rather than to a system. It is the atoms that are conserved; they are simply not all in the beaker any more. Stopper the flask and the reading does become 256.26 g — which is why the closed-vessel version of this experiment is the one Lavoisier needed."
misconception_de = "'Masse bleibt erhalten' wird als Gesetz gelehrt und dann auf ein Gefäß angewendet statt auf ein System. Erhalten bleiben die Atome; sie befinden sich nur nicht mehr alle im Becherglas. Verschließt man den Kolben, wird der Messwert tatsächlich zu 256,26 g — weshalb die geschlossene Version dieses Experiments diejenige war, die Lavoisier brauchte."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "The beaker is the universe: the law says conserved, the balance holds the beaker, so the reading must add up — the possibility of mass leaving through the open top is not in the account."
reveals_de = "Das Becherglas ist das Universum: Das Gesetz sagt erhalten, die Waage hält das Becherglas, also muss der Messwert aufgehen — die Möglichkeit, dass Masse durch die offene Öffnung entweicht, kommt in der Rechnung nicht vor."
next = "Stopper it: the closed flask reads 256.26 g exactly, and the law is vindicated the moment the boundary is drawn honestly. Lavoisier's sealed vessels existed for precisely this reason — the law was only ever provable with the lid on."
next_de = "Verschließe es: Der geschlossene Kolben zeigt exakt 256,26 g, und das Gesetz wird bestätigt, sobald die Grenze ehrlich gezogen wird. Lavoisiers verschlossene Gefäße existierten genau aus diesem Grund — das Gesetz war nur mit Deckel überhaupt beweisbar."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "'Consumed' means 'gone': used-up reactants vanish, so the added vinegar should leave no trace on the balance at all."
reveals_de = "'Verbraucht' bedeutet 'weg': Aufgebrauchte Edukte verschwinden, also sollte der zugegebene Essig überhaupt keine Spur auf der Waage hinterlassen."
next = "Audit the vinegar's atoms: the acetate and the water it became are still in the beaker, weighing what they weigh; only the CO₂'s 1.4 g left. Adding 3.60 g and reading +2.18 g is a subtraction with a story — not a disappearance."
next_de = "Verfolge die Atome des Essigs: Das Acetat und das Wasser, zu denen er wurde, befinden sich noch im Becherglas und wiegen, was sie wiegen; nur die 1,4 g des CO₂ sind verschwunden. Dass man 3,60 g zugibt und +2,18 g abliest, ist eine Subtraktion mit einer Geschichte — kein Verschwinden."

[reaction.registers]
lv1 = "Put the beaker on the scales and write the number down. Add the vinegar. Watch the number fall as it fizzes. Nothing was destroyed — the bubbles left the beaker and took their weight with them, and if you had put a lid on, the number would not have moved at all."
lv1_de = "Stelle das Becherglas auf die Waage und schreibe die Zahl auf. Gib den Essig dazu. Beobachte, wie die Zahl fällt, während es aufschäumt. Nichts wurde zerstört — die Blasen haben das Becherglas verlassen und ihr Gewicht mitgenommen, und hättest du einen Deckel aufgesetzt, hätte sich die Zahl gar nicht bewegt."
lv2 = "252.66 g + 3.60 g = 256.26 g if nothing leaves. The balance reads 254.84 g, so 1.42 g went missing. The bench reports 0.0317 mol of CO₂ evolved; 0.0317 × 44.009 g/mol = 1.40 g. The missing mass is the gas, to within the accounting."
lv2_de = "252,66 g + 3,60 g = 256,26 g, wenn nichts entweicht. Die Waage zeigt 254,84 g, also fehlen 1,42 g. Das Labor meldet 0,0317 mol freigesetztes CO₂; 0,0317 × 44,009 g/mol = 1,40 g. Die fehlende Masse ist das Gas, im Rahmen der Buchführungsgenauigkeit."
lv3 = "The engine's element bookkeeping is exact; the vessel's mass is not conserved because the gas phase is modelled as escaping to the reservoir, exactly as an open beaker does. The small residual between 1.42 g measured and 1.40 g of CO₂ is water leaving with it and the rounding on the reported moles — worth stating rather than smoothing, because in a real experiment the same discrepancy is real and has the same cause."
lv3_de = "Die Elementbuchführung des Labors ist exakt; die Masse des Gefäßes bleibt nicht erhalten, weil die Gasphase so modelliert wird, dass sie ins Reservoir entweicht, genau wie ein offenes Becherglas es tut. Der kleine Restunterschied zwischen den gemessenen 1,42 g und den 1,40 g CO₂ ist Wasser, das mit entweicht, und die Rundung der gemeldeten Stoffmenge — es lohnt sich, das zu benennen statt zu glätten, denn in einem echten Experiment ist dieselbe Abweichung real und hat dieselbe Ursache."

