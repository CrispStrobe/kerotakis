[reaction.setup]
script = """
add v1 water 100mL
add v1 NaCl 5.844g
evaporate v1 0.95
new
add v2 Mg 1.2g
ignite v2
"""

[reaction.expect]
events = ["dissolved:NaCl", "evaporated", "consumed:Mg", "ignited"]
ph = { min = 6.0, max = 6.5 }

[reaction.expect.predict]
question = "Two things vanished on this bench: salt disappeared into water, and a magnesium ribbon disappeared into flame. Which of the two can you undo?"
question_de = "Zwei Dinge verschwanden auf diesem Labor: Salz verschwand in Wasser, und ein Magnesiumband verschwand in Flammen. Welches der beiden kannst du rückgängig machen?"
options = [
  "Both — chemistry can always be run backwards if you are clever enough",
  "Neither — once a substance is gone, it is gone",
  "Only the salt: boil the water away and the crystals return; no amount of heating or cooling un-burns the ribbon",
]
answer = 2
misconception = "The two disappearances are the same event to the eye and opposite events underneath. The salt is still sodium chloride, hiding as ions — remove the water and it must come back. The ribbon's atoms are all still there too, but in new company: magnesium oxide is a new substance, and temperature cannot dissolve a chemical bond that heat itself favours. Telling these two vanishings apart is the definition of a chemical reaction."
misconception_de = "Die beiden Verschwindensvorgänge sind für das Auge dasselbe Ereignis und darunter entgegengesetzte Ereignisse. Das Salz ist immer noch Natriumchlorid, versteckt als Ionen — entfernt man das Wasser, muss es zurückkommen. Auch die Atome des Bandes sind alle noch vorhanden, aber in neuer Gesellschaft: Magnesiumoxid ist ein neuer Stoff, und Temperatur kann keine chemische Bindung auflösen, die Wärme selbst begünstigt. Diese beiden Verschwindensvorgänge auseinanderzuhalten ist die Definition einer chemischen Reaktion."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Reversibility as cleverness rather than as a property of what happened — dissolving and reacting filed as the same kind of vanishing, undone by the same kind of trick."
reveals_de = "Umkehrbarkeit als Cleverness statt als Eigenschaft dessen, was geschah — Lösen und Reagieren werden als dieselbe Art von Verschwinden eingeordnet, rückgängig zu machen mit demselben Trick."
next = "Try both on this bench: evaporate the brine and the crystals return, mass ledger intact. Heat the ash, cool it, wait at it — magnesium oxide it stays. Undoing it takes a new chemical partner and a great deal of energy (industry does it by electrolysis of the molten salt), not a cleverer application of heat."
next_de = "Probiere beides auf diesem Labor aus: Dampfe die Sole ein, und die Kristalle kehren zurück, das Massekonto bleibt intakt. Erhitze die Asche, kühle sie ab, warte an ihr — Magnesiumoxid bleibt sie. Sie rückgängig zu machen braucht einen neuen chemischen Partner und sehr viel Energie (die Industrie macht es durch Elektrolyse des geschmolzenen Salzes), keine klügere Anwendung von Wärme."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "Dissolution as destruction — the young learner's default: the salt is gone the way the ribbon is gone, and gone is gone."
reveals_de = "Auflösung als Zerstörung — der Standardgedanke jüngerer Lernender: Das Salz sei genauso weg wie das Band, und weg sei weg."
next = "The balance never agreed: the brine weighs the salt the whole time (`weigh-before-and-after`), and evaporation hands it back as crystals you can count in grams. The two vanishings differ in what remains — the same substance hiding, or a new substance formed — and that difference is the whole content of the words 'chemical reaction'."
next_de = "Die Waage war nie einverstanden: Die Sole wiegt das Salz die ganze Zeit mit (`weigh-before-and-after`), und das Verdampfen gibt es als Kristalle zurück, die du in Gramm zählen kannst. Die beiden Verschwindensvorgänge unterscheiden sich darin, was übrig bleibt — derselbe Stoff, versteckt, oder ein neuer Stoff, entstanden — und dieser Unterschied ist der ganze Inhalt der Worte 'chemische Reaktion'."

[reaction.registers]
lv1 = "The salt hid in the water — boil the water away and there it is again, white and sharp-cornered. The ribbon did not hide: it *became* something new, and no amount of un-heating brings it back. That is the difference between mixing something and really changing it."
lv1_de = "Das Salz versteckte sich im Wasser — koche das Wasser weg, und da ist es wieder, weiß und scharfkantig. Das Band versteckte sich nicht: Es *wurde* etwas Neues, und kein noch so großes Entwärmen bringt es zurück. Das ist der Unterschied zwischen etwas mischen und es wirklich verändern."
lv2 = "Dissolving is a physical change: NaCl(s) → Na⁺(aq) + Cl⁻(aq), reversed by removing the solvent — evaporate 95% of the water and 0.069 mol of crystals return, the rest still dissolved in the last 5 mL. Burning is a chemical change: 2 Mg + O₂ → 2 MgO, a new substance with new properties, and no temperature reverses it."
lv2_de = "Lösen ist eine physikalische Veränderung: NaCl(s) → Na⁺(aq) + Cl⁻(aq), umkehrbar durch Entfernen des Lösungsmittels — verdampfe 95 % des Wassers, und 0,069 mol Kristalle kehren zurück, der Rest bleibt in den letzten 5 mL gelöst. Verbrennen ist eine chemische Veränderung: 2 Mg + O₂ → 2 MgO, ein neuer Stoff mit neuen Eigenschaften, und keine Temperatur kehrt sie um."
lv3 = "Both halves are computed, and both carry their fine print. The brine at 95% evaporated holds 0.0692 mol of solid salt beside 0.031 mol still in solution — solubility stays a ratio to the remaining water down to the last millilitre, which is `crystallising-salt-from-brine`'s subtraction taken nearly to its end. The ash side: the thermal solver answers 'magnesium oxide' at every temperature this bench can reach, because the oxide is downhill from the metal everywhere — reversing it is not a temperature question but an electron question, which is why industry electrolyses the molten chloride instead of heating the oxide. One boundary named: evaporating to *total* dryness currently leaves the final trace of ions labelled aqueous with no water to be aqueous in — a state the registry has no story for yet — which is why this entry stops at 95%."
lv3_de = "Beide Hälften sind berechnet, und beide tragen ihr Kleingedrucktes. Die zu 95 % verdampfte Sole enthält 0,0692 mol festes Salz neben 0,031 mol, das noch in Lösung ist — die Löslichkeit bleibt bis zum letzten Milliliter ein Verhältnis zum verbleibenden Wasser, was die Subtraktion von `crystallising-salt-from-brine` fast bis an ihr Ende getrieben ist. Die Asche-Seite: Der thermische Löser antwortet bei jeder Temperatur, die dieses Labor erreichen kann, mit 'Magnesiumoxid', weil das Oxid überall energetisch unterhalb des Metalls liegt — es umzukehren ist keine Temperaturfrage, sondern eine Elektronenfrage, weshalb die Industrie das geschmolzene Chlorid elektrolysiert, statt das Oxid zu erhitzen. Eine Grenze ausdrücklich benannt: Das Verdampfen bis zur *vollständigen* Trockne lässt derzeit die letzte Spur Ionen als wässrig markiert zurück, ohne Wasser, in dem sie wässrig sein könnten — ein Zustand, für den die Registry noch keine Geschichte hat —, weshalb dieser Eintrag bei 95 % stehen bleibt."

