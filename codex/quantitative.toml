options = [
  "Quicklime and carbon dioxide — it decomposed",
  "Hot chalk. Nothing else. The balance still reads 10.00 g",
  "Some of it decomposes; the rest does not",
]
answer = 1
misconception = "'Heating causes decomposition' becomes a rule with no threshold attached, so any heating is expected to do something. Decomposition has a temperature, and below it the reaction does not go slowly — it does not go. This entry exists to be the null result that gives the next one its meaning."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Heating causes decomposition, threshold-free: 147 °C is impressively hot by kitchen standards, so chemistry must be happening."
next = "Push it in stages and weigh between each: hotter, hotter, still 10.00 g — then past the threshold in `chalk-in-the-kiln`, where everything happens at once. The pair of entries is the lesson: thresholds are not gradual approaches to drama."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Reactions as dimmer switches: every temperature buys some fraction of the effect, so partial heat should give partial decomposition."
next = "Read the balance to its last digit: 10.00 g, not 9.9-something. Below the temperature where CO₂'s pressure over the carbonate reaches the room's, the gas cannot leave at all — the equilibrium is a door, and this side of the threshold it is shut, not ajar."

[reaction.registers]
lv1 = "Chalk in a crucible over a flame, hot enough to burn you badly, and when it cools down it is still chalk. Same white powder, same weight on the balance. Heating is not a magic ingredient: it has to be enough heat, and 'enough' is a specific number for every substance."
lv2 = "1 kJ into 0.0999 mol of CaCO₃ at 81.9 J·mol⁻¹·K⁻¹ raises it by 122 K: 25 °C → 147.2 °C, and the bench confirms 147.21 °C. No CO₂ is evolved, no CaO appears, and the balance still reads 10.00 g. Calcium carbonate needs roughly 900 °C before the decomposition runs."
lv3 = "The equilibrium partial pressure of CO₂ over calcite at 420 K is around 10⁻¹⁵ bar — vastly below the ambient 10⁻³·⁴ bar — so the thermodynamic driving force points the other way and the carbonate is the stable phase. The Gibbs minimiser is not switched off here; it is run and returns 'unchanged', which is a computed result and not an assumption. A learner can move the heat up and find the crossing themselves."

