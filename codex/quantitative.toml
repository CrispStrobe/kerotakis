[reaction.expect.predict]
question = "The same 0.1000 mol of calcium chloride goes into 100 mL in one cup and 200 mL in another. The first reaches 44.87 °C. What does the second reach?"
question_de = "Dieselben 0,1000 mol Calciumchlorid kommen in einen Becher mit 100 mL und in einen anderen mit 200 mL. Der erste erreicht 44,87 °C. Was erreicht der zweite?"
options = [
  "44.87 °C — the same energy was released",
  "34.93 °C — the same energy, spread through twice as much water",
  "89.7 °C — twice the water, twice the heating",
]
answer = 1
misconception = "The first option confuses energy with temperature — they are not the same quantity, and this pair of cups is the cheapest way to feel the difference. Exactly the same 8.28 kJ is released in both; the thermometer reads the energy per unit of stuff it has to warm, so doubling the water halves the rise."
misconception_de = "Die erste Option verwechselt Energie mit Temperatur — sie sind nicht dieselbe Größe, und dieses Becherpaar ist der billigste Weg, den Unterschied zu spüren. In beiden wird exakt dieselbe Menge, 8,28 kJ, freigesetzt; das Thermometer zeigt die Energie pro Menge des zu erwärmenden Stoffes an, also halbiert die Verdoppelung des Wassers den Anstieg."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Energy and temperature are one quantity: 'the heat' is what the thermometer reads, so the same salt must give the same reading anywhere."
reveals_de = "Energie und Temperatur werden als eine Größe behandelt: 'Die Wärme' ist das, was das Thermometer zeigt, also muss dasselbe Salz überall denselben Messwert ergeben."
next = "Hold both numbers at once: 8.28 kJ released in each cup — identical — and +19.9 K in one against +9.9 K in the other. The thermometer reads energy per amount of stuff to warm; this pair of cups is the cheapest instrument that can tell those two quantities apart."
next_de = "Halte beide Zahlen zugleich fest: 8,28 kJ freigesetzt in jedem Becher — identisch — und +19,9 K im einen gegenüber +9,9 K im anderen. Das Thermometer zeigt Energie pro zu erwärmender Stoffmenge an; dieses Becherpaar ist das billigste Instrument, das diese beiden Größen auseinanderhalten kann."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "More water is read as more reaction: the solvent is promoted to a reagent, so doubling it should double the heat."
reveals_de = "Mehr Wasser wird als mehr Reaktion gelesen: Das Lösungsmittel wird zum Edukt befördert, also sollte eine Verdoppelung die Wärme verdoppeln."
next = "`inspect` both cups: identical 0.1000 mol dissolved, identical energy released. The water only divides the heat — if it fed the reaction, the salt would somehow have to know how much water was watching it dissolve."
next_de = "Sieh dir beide Becher mit `inspect` an: identische 0,1000 mol gelöst, identische freigesetzte Energie. Das Wasser teilt die Wärme nur auf — würde es die Reaktion speisen, müsste das Salz irgendwie wissen, wie viel Wasser ihm beim Lösen zusah."

[reaction.registers]
lv1 = "Change one thing and nothing else. Two cups, the same powder, the same starting temperature — only the amount of water is different. Then whatever the thermometers do differently, you know what caused it. Change two things at once and you have learned nothing, however carefully you measured."
lv1_de = "Ändere eine Sache und sonst nichts. Zwei Becher, dasselbe Pulver, dieselbe Starttemperatur — nur die Menge Wasser unterscheidet sich. Was auch immer die Thermometer dann unterschiedlich anzeigen, du weißt, was es verursacht hat. Änderst du zwei Dinge gleichzeitig, hast du nichts gelernt, egal wie sorgfältig du gemessen hast."
lv2 = "Identical q = 8.28 kJ in both cups. ΔT = q/(n·Cp): 8280 ÷ 416.7 = 19.9 K in 100 mL, and 8280 ÷ 833.5 = 9.9 K in 200 mL. The bench gives 44.87 °C and 34.93 °C from 25.0 °C — 19.87 K and 9.93 K. The halving is exact because the only thing that changed was the denominator."
lv2_de = "Identisches q = 8,28 kJ in beiden Bechern. ΔT = q/(n·Cp): 8280 ÷ 416,7 = 19,9 K in 100 mL, und 8280 ÷ 833,5 = 9,9 K in 200 mL. Das Labor liefert ausgehend von 25,0 °C 44,87 °C und 34,93 °C — 19,87 K und 9,93 K. Die Halbierung ist exakt, weil sich nur der Nenner geändert hat."
lv3 = "This is the controlled comparison in its cleanest form, and it is worth noticing what the engine holds constant for free that a real bench does not: identical starting temperature, identical heat loss (none), identical purity, identical stirring. A simulated fair test is trivially fair, which is precisely why the *habit* has to be taught here and the *difficulty* has to be met at a real bench. The virtual lab can teach the logic of control; it cannot teach the discipline of it."
lv3_de = "Das ist der kontrollierte Vergleich in seiner reinsten Form, und es lohnt sich zu bemerken, was das Labor kostenlos konstant hält, was ein echter Labortisch nicht tut: identische Starttemperatur, identischer Wärmeverlust (keiner), identische Reinheit, identisches Rühren. Ein simulierter fairer Test ist trivial fair, und genau deshalb muss die *Gewohnheit* hier gelehrt werden, während die *Schwierigkeit* an einem echten Labortisch begegnet werden muss. Das virtuelle Labor kann die Logik der Kontrolle lehren; die Disziplin dafür kann es nicht lehren."

