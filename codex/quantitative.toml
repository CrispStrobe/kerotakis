"""

[reaction.expect]
events = ["dissolved:NaOH"]
ph = { min = 8.7, max = 9.1 }
temperature_c = { min = 48.5, max = 50.0 }

[reaction.expect.predict]
question = "Sodium hydroxide pellets can go straight into the acid — one violent step — or dissolve in water first and then meet the acid, two milder ones. Which route ends up hotter?"
question_de = "Natriumhydroxid-Plätzchen können direkt in die Säure gegeben werden — ein heftiger Schritt — oder sich zunächst in Wasser lösen und erst dann auf die Säure treffen, zwei mildere Schritte. Welcher Weg endet heißer?"
options = [
  "The one-step route — doing everything at once releases the energy together",
  "The two-step route — two separate heats add up to more",
  "Neither: both beakers end at exactly the same temperature",
]
answer = 2
misconception = "Enthalpy is a state function: the heat released between the same start and the same finish does not depend on the route taken between them. That is Hess's law, and both wrong answers imagine the route mattering — in opposite directions. The drama differs (one jump against two climbs); the destination cannot."
misconception_de = "Enthalpie ist eine Zustandsfunktion: Die zwischen demselben Start und demselben Ziel freigesetzte Wärme hängt nicht vom eingeschlagenen Weg ab. Das ist der Satz von Hess, und beide falschen Antworten stellen sich vor, dass der Weg eine Rolle spielt — in entgegengesetzte Richtungen. Die Dramatik unterscheidet sich (ein Sprung gegenüber zwei Anstiegen); das Ziel kann es nicht."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Intensity mistaken for total: one dramatic step 'releases more' than two mild ones, as if energy rewarded doing everything at once."
reveals_de = "Intensität wird mit Gesamtmenge verwechselt: ein dramatischer Schritt 'setzt mehr frei' als zwei milde, als würde Energie dafür belohnen, alles auf einmal zu tun."
next = "Watch both thermometers: 49.20 °C and 49.20 °C. The journeys differ — one beaker jumps in a single violent step, the other climbs twice, pausing at 35.7 °C as pH 13.51 lye water — but the destination is fixed by the two endpoints, not by the path drawn between them."
next_de = "Beobachte beide Thermometer: 49,20 °C und 49,20 °C. Die Wege unterscheiden sich — das eine Becherglas springt in einem einzigen heftigen Schritt, das andere steigt zweimal, mit einer Pause bei 35,7 °C als Natronlauge mit pH-Wert 13,51 — aber das Ziel ist durch die beiden Endpunkte festgelegt, nicht durch den zwischen ihnen gezeichneten Weg."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "Heats counted per event rather than per change of state: two warmings must surely sum to more than one."
reveals_de = "Wärmemengen werden pro Ereignis gezählt statt pro Zustandsänderung: zwei Erwärmungen müssen sich sicher zu mehr summieren als eine."
next = "Add the second route's two heats up: the dissolution's warmth plus the mixing's, and the sum is the one-step release exactly. Energy is bookkept between states, and both routes connect the same two states — that the parts sum to the whole is the entire content of the law."
next_de = "Addiere die beiden Wärmemengen des zweiten Wegs: die Wärme der Lösung plus die des Mischens, und die Summe entspricht exakt der Freisetzung des einstufigen Wegs. Energie wird zwischen Zuständen verbucht, und beide Wege verbinden dieselben zwei Zustände — dass die Teile sich zum Ganzen summieren, ist der gesamte Inhalt des Gesetzes."

[reaction.registers]
lv1 = "Straight into the acid, or dissolve first and mix after — take either road. The thermometer ends on the same mark both ways. The heat doesn't care which road you took; only where you started and where you stopped."
lv1_de = "Direkt in die Säure oder erst lösen und danach mischen — nimm einen der beiden Wege. Das Thermometer endet in beiden Fällen auf derselben Marke. Der Wärme ist es egal, welchen Weg du genommen hast; nur wo du gestartet und wo du aufgehört hast, zählt."
lv2 = "Hess's law: enthalpy is a state function, so the same reagents reaching the same final beaker release the same total heat, in any number of steps. Both routes read 49.20 °C — the dissolution's −44.5 kJ/mol and the neutralisation's ≈−56 kJ/mol are both paid, in different orders, into the same total — and the bench's energy balance conserves enthalpy through every intermediate state, so the agreement is exact rather than approximate."
lv2_de = "Der Satz von Hess: Enthalpie ist eine Zustandsfunktion, also setzen dieselben Edukte, die dasselbe Endbecherglas erreichen, dieselbe Gesamtwärme frei, in beliebig vielen Schritten. Beide Wege zeigen 49,20 °C — die −44,5 kJ/mol der Lösung und die ≈−56 kJ/mol der Neutralisation werden beide, in unterschiedlicher Reihenfolge, in dieselbe Summe eingezahlt —, und die Energiebilanz des Labors erhält die Enthalpie über jeden Zwischenzustand hinweg, sodass die Übereinstimmung exakt ist und nicht nur angenähert."
lv3 = "Both the law and the magnitude are computed, and the neutralisation enthalpy is read rather than curated: H⁺ + OH⁻ → H₂O is the reverse of the reaction that defines OH⁻ in every shipped database, so its ΔH comes from the data files themselves — wateq4f says −55.91 kJ/mol, minteq.v4 −55.81, pitzer −56.36, a half-kJ disagreement between datasets of exactly the kind `explain` exists to show. (The −57.3 kJ/mol that school tables quote is the strong–strong calorimetric figure with dilution effects included — a different measurement.) Two boundaries, stated: this counts only the water-forming step, so a weak acid's neutralisation would read about 2 kJ/mol too exothermic here, its dissociation enthalpy being folded into a real calorimeter's number but not into this one; and the final pH of 8.91 is the 8 × 10⁻⁶ mol excess of base (four grams of NaOH is 0.100008 mol) read at the 49.2 °C the beaker actually reached — K_w has moved with the temperature, which is `neutral-is-a-moving-target` arriving uninvited. The exactness of the path-agreement was expensive: enthalpy stopped being a state function three separate ways in this engine before it held (PLAN.md carries the chronicle), and this entry only became writable when the last of them was fixed."
lv3_de = "Sowohl das Gesetz als auch die Größenordnung sind berechnet, und die Neutralisationsenthalpie wird abgelesen statt kuratiert: H⁺ + OH⁻ → H₂O ist die Umkehrung der Reaktion, die OH⁻ in jeder mitgelieferten Datenbank definiert, also stammt ihr ΔH aus den Datendateien selbst — wateq4f nennt −55,91 kJ/mol, minteq.v4 −55,81, pitzer −56,36, eine Abweichung von einem halben Kilojoule zwischen Datensätzen, genau von der Art, die `explain` zeigen soll. (Die −57,3 kJ/mol, die Schultabellen nennen, sind der stark-stark-kalorimetrische Wert mit eingeschlossenen Verdünnungseffekten — eine andere Messung.) Zwei Grenzen, ausdrücklich benannt: Dies zählt nur den wasserbildenden Schritt, sodass die Neutralisation einer schwachen Säure hier um etwa 2 kJ/mol zu exotherm ausfiele, da ihre Dissoziationsenthalpie in die Zahl eines echten Kalorimeters einfließt, aber nicht in diese; und der End-pH-Wert von 8,91 ist der Überschuss von 8 × 10⁻⁶ mol Base (vier Gramm NaOH sind 0,100008 mol), abgelesen bei den 49,2 °C, die das Becherglas tatsächlich erreichte — K_w hat sich mit der Temperatur verschoben, was `neutral-is-a-moving-target` unangekündigt hereinbringt. Die Exaktheit der Weg-Übereinstimmung war teuer erkauft: Die Enthalpie hörte in diesem Labor auf drei verschiedene Arten auf, eine Zustandsfunktion zu sein, bevor sie es blieb (PLAN.md führt die Chronik), und dieser Eintrag wurde erst schreibbar, als der letzte dieser Fehler behoben war."

[reaction.provenance]
source = "Standard curriculum thermochemistry (Hess's law); NaOH dissolution enthalpy −44.5 kJ/mol curated (standard reference value); neutralisation enthalpy computed from the shipped databases' own OH⁻ formation reactions (−55.8 to −56.4 kJ/mol across datasets; literature −55.8 for the ionic reaction, −57.3 for the strong–strong calorimetric figure). Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "Kerotakis energy balance (enthalpy-conserving) over curated ΔH_dis and database-derived ΔH_neut; pH from PHREEQC via Kerotakis L2"

# ================================================================ hot enough

[[reaction]]
id = "chalk-below-the-kiln"
spine = ["der-energiebegriff"]
summary = "CaCO₃(s) + heat → CaCO₃(s)   ·   147 °C is hot, and nothing happens"
summary_de = "CaCO₃(s) + Wärme → CaCO₃(s)   ·   147 °C sind heiß, und es passiert nichts"
concepts = ["decomposition-threshold"]
requires = ["thermal-decomposition"]
calculations = ["temperature-rise", "enthalpy-change"]
models = ["equilibrium", "particle-model"]
apparatus = ["crucible", "thermometer", "balance", "bunsen"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium NTG Jgst. 8, LB Chemische Reaktionen"
ages = { min = 13.0, max = 14.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium NTG Jgst. 8 (ISB)"

[[reaction.curriculum]]
system = "nrw-kernlehrplan-g9"
stage = "Sek I, Zweite Stufe (Jg. 9/10), IF Chemische Reaktion — Zersetzung"
ages = { min = 14.0, max = 16.0 }
source = "Kernlehrplan Chemie Gymnasium G9 NRW, Heft 3415 (RdErl. 23.06.2019)"

[[reaction.curriculum]]
system = "england-gcse-combined-science"
stage = "GCSE Combined Science: Trilogy (AQA 8464), 4.1.2 The Periodic Table — Group 2"
ages = { min = 14.0, max = 16.0 }
source = "AQA GCSE Combined Science: Trilogy specification (8464) — thermal decomposition of carbonates"

[reaction.setup]
script = """
add v1 CaCO3 10g
measure v1 balance
heat v1 1kJ
measure v1 thermometer
measure v1 balance
"""

[reaction.expect]
events = ["added:CaCO3"]
absent = ["gas_evolved:CO2", "precipitated:CaO"]
temperature_c = { min = 140.0, max = 155.0 }

[reaction.expect.predict]
question = "10 g of chalk in a crucible. Put 1 kJ of heat in — enough to take it to 147 °C, hotter than boiling water. What comes out?"
question_de = "10 g Kreide in einem Tiegel. Füge 1 kJ Wärme zu — genug, um sie auf 147 °C zu bringen, heißer als kochendes Wasser. Was kommt heraus?"
options = [
  "Quicklime and carbon dioxide — it decomposed",
  "Hot chalk. Nothing else. The balance still reads 10.00 g",
  "Some of it decomposes; the rest does not",
]
answer = 1
misconception = "'Heating causes decomposition' becomes a rule with no threshold attached, so any heating is expected to do something. Decomposition has a temperature, and below it the reaction does not go slowly — it does not go. This entry exists to be the null result that gives the next one its meaning."
misconception_de = "'Erhitzen verursacht Zersetzung' wird zu einer Regel ohne angehängte Schwelle, sodass von jedem Erhitzen erwartet wird, dass etwas geschieht. Zersetzung hat eine Temperatur, und unterhalb davon läuft die Reaktion nicht langsam ab — sie läuft gar nicht ab. Dieser Eintrag existiert als das Nullergebnis, das dem nächsten seine Bedeutung gibt."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Heating causes decomposition, threshold-free: 147 °C is impressively hot by kitchen standards, so chemistry must be happening."
reveals_de = "Erhitzen verursacht Zersetzung, ohne Schwelle: 147 °C sind nach Küchenmaßstäben beeindruckend heiß, also muss Chemie im Gange sein."
next = "Push it in stages and weigh between each: hotter, hotter, still 10.00 g — then past the threshold in `chalk-in-the-kiln`, where everything happens at once. The pair of entries is the lesson: thresholds are not gradual approaches to drama."
next_de = "Treibe es in Stufen voran und wiege zwischen jeder Stufe: heißer, heißer, immer noch 10,00 g — dann über die Schwelle hinaus in `chalk-in-the-kiln`, wo alles auf einmal geschieht. Das Paar der Einträge ist die Lehre: Schwellen sind keine allmählichen Annäherungen an das Drama."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Reactions as dimmer switches: every temperature buys some fraction of the effect, so partial heat should give partial decomposition."
reveals_de = "Reaktionen als Dimmer-Schalter: Jede Temperatur kauft einen Bruchteil des Effekts, also sollte teilweise Wärme teilweise Zersetzung ergeben."
next = "Read the balance to its last digit: 10.00 g, not 9.9-something. Below the temperature where CO₂'s pressure over the carbonate reaches the room's, the gas cannot leave at all — the equilibrium is a door, and this side of the threshold it is shut, not ajar."
next_de = "Lies die Waage bis zur letzten Ziffer ab: 10,00 g, nicht 9,9-irgendwas. Unterhalb der Temperatur, bei der der CO₂-Druck über dem Carbonat den des Raumes erreicht, kann das Gas überhaupt nicht entweichen — das Gleichgewicht ist eine Tür, und auf dieser Seite der Schwelle ist sie verschlossen, nicht angelehnt."

[reaction.registers]
lv1 = "Chalk in a crucible over a flame, hot enough to burn you badly, and when it cools down it is still chalk. Same white powder, same weight on the balance. Heating is not a magic ingredient: it has to be enough heat, and 'enough' is a specific number for every substance."
lv1_de = "Kreide in einem Tiegel über einer Flamme, heiß genug, um dich schwer zu verbrennen, und wenn sie abkühlt, ist sie immer noch Kreide. Dasselbe weiße Pulver, dasselbe Gewicht auf der Waage. Erhitzen ist keine Zauberzutat: Es muss genug Wärme sein, und 'genug' ist für jeden Stoff eine bestimmte Zahl."
lv2 = "1 kJ into 0.0999 mol of CaCO₃ at 81.9 J·mol⁻¹·K⁻¹ raises it by 122 K: 25 °C → 147.2 °C, and the bench confirms 147.21 °C. No CO₂ is evolved, no CaO appears, and the balance still reads 10.00 g. Calcium carbonate needs roughly 900 °C before the decomposition runs."
lv2_de = "1 kJ auf 0,0999 mol CaCO₃ bei 81,9 J·mol⁻¹·K⁻¹ erhöht die Temperatur um 122 K: 25 °C → 147,2 °C, und das Labor bestätigt 147,21 °C. Es entsteht kein CO₂, es erscheint kein CaO, und die Waage zeigt weiterhin 10,00 g. Calciumcarbonat braucht etwa 900 °C, bevor die Zersetzung abläuft."
lv3 = "The equilibrium partial pressure of CO₂ over calcite at 420 K is around 10⁻¹⁵ bar — vastly below the ambient 10⁻³·⁴ bar — so the thermodynamic driving force points the other way and the carbonate is the stable phase. The Gibbs minimiser is not switched off here; it is run and returns 'unchanged', which is a computed result and not an assumption. A learner can move the heat up and find the crossing themselves."
lv3_de = "Der Gleichgewichts-Partialdruck von CO₂ über Calcit bei 420 K liegt bei etwa 10⁻¹⁵ bar — weit unter den atmosphärischen 10⁻³,⁴ bar —, sodass die thermodynamische Triebkraft in die andere Richtung zeigt und das Carbonat die stabile Phase ist. Der Gibbs-Minimierer ist hier nicht abgeschaltet; er wird ausgeführt und liefert 'unverändert', was ein berechnetes Ergebnis ist und keine Annahme. Ein Lernender kann die Wärme steigern und den Übergang selbst finden."

[reaction.provenance]
source = "Standard curriculum thermal decomposition; thermochemistry from NASA CEA thermo.inp. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
licence = "NASA CEA data: Apache-2.0"
computed_by = "Kerotakis L2g Gibbs minimiser"

[[reaction]]
id = "chalk-in-the-kiln"
spine = ["der-energiebegriff"]
equation = "CaCO₃(s) → CaO(s) + CO₂↑   ·   8 kJ takes 10 g of chalk past 1000 °C and it gives way"
concepts = ["computed-decomposition-temperature"]
requires = ["decomposition-threshold"]
calculations = ["temperature-rise", "enthalpy-change", "mass-from-moles"]
models = ["equilibrium", "gibbs-minimisation"]
apparatus = ["crucible", "thermometer", "balance", "furnace"]

[[reaction.curriculum]]
system = "nrw-kernlehrplan-g9"
stage = "Sek I, Zweite Stufe (Jg. 9/10), IF Chemische Reaktion — Zersetzung"
ages = { min = 14.0, max = 16.0 }
source = "Kernlehrplan Chemie Gymnasium G9 NRW, Heft 3415 (RdErl. 23.06.2019)"

[reaction.setup]
script = """
add v1 CaCO3 10g
measure v1 balance
heat v1 8kJ
measure v1 balance
"""

[reaction.expect]
events = ["gas_evolved:CO2", "precipitated:CaO", "consumed:CaCO3"]

[reaction.expect.predict]
question = "Same 10 g of chalk, but eight times the heat — past 1000 °C. The crucible gets lighter. Where is the temperature at which chalk decomposes written down in this program?"
question_de = "Dieselben 10 g Kreide, aber die achtfache Wärmemenge — über 1000 °C hinaus. Der Tiegel wird leichter. Wo steht die Temperatur, bei der sich Kreide zersetzt, in diesem Programm geschrieben?"
options = [
  "In a table of decomposition temperatures the engine looks up",
  "Nowhere — it is computed, from the point where the CO₂ pressure over the carbonate reaches the pressure in the room",
  "It is hard-coded as 900 °C",
]
answer = 1
misconception = "A simulator is assumed to be a lookup table with animation on top, so any number it produces is assumed to have been typed in by someone. This one was not: the same solve that says 147 °C changes nothing says 1000 °C changes everything, and neither answer was written down in advance. That is the difference between a model and a recording."
misconception_de = "Ein Simulator wird als Nachschlagetabelle mit Animation obendrauf angenommen, sodass jede Zahl, die er liefert, vermutlich von jemandem eingetippt wurde. Diese wurde es nicht: Dieselbe Lösung, die sagt, 147 °C ändere nichts, sagt, 1000 °C ändere alles, und keine der beiden Antworten wurde im Voraus aufgeschrieben. Das ist der Unterschied zwischen einem Modell und einer Aufzeichnung."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Simulation as recording: numbers come from tables someone typed, so somewhere in this program a decomposition-temperatures table is being consulted."
reveals_de = "Simulation als Aufzeichnung: Zahlen stammen aus Tabellen, die jemand eingetippt hat, also wird irgendwo in diesem Programm eine Tabelle mit Zersetzungstemperaturen konsultiert."
next = "`explain` the vessel: the provenance names NASA thermodynamic polynomials and a Gibbs minimisation — no decomposition table exists to consult. The same solve that refused at 147 °C calcines at 1000 °C, having looked nothing up in between."
next_de = "`explain` das Gefäß: Die Herkunftsangabe nennt NASA-Thermodynamikpolynome und eine Gibbs-Minimierung — es existiert keine Zersetzungstabelle zum Nachschlagen. Dieselbe Lösung, die bei 147 °C verweigerte, brennt bei 1000 °C, ohne dazwischen irgendetwas nachgeschlagen zu haben."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "The sharper form of the same idea: a specific constant, hard-coded — someone wrote 900 in the source the way textbooks print it."
reveals_de = "Die schärfere Form derselben Idee: eine bestimmte Konstante, fest einprogrammiert — jemand habe 900 in den Quellcode geschrieben, so wie Lehrbücher es abdrucken."
next = "Ask what the threshold depends on and a hard-coded number falls apart: it is the temperature where CO₂'s equilibrium pressure over the solid crosses the pressure of the room, which is why the answer belongs to the *conditions* and not to chalk alone. `explain` shows the data it fell out of; the source has no 900 to find."
next_de = "Frage, wovon die Schwelle abhängt, und eine fest einprogrammierte Zahl zerfällt: Es ist die Temperatur, bei der der Gleichgewichtsdruck des CO₂ über dem Feststoff den Druck des Raumes kreuzt, weshalb die Antwort zu den *Bedingungen* gehört und nicht allein zur Kreide. `explain` zeigt die Daten, aus denen sie sich ergab; im Quellcode gibt es keine 900 zu finden."

[reaction.registers]
lv1 = "Now the chalk really does change. It glows, then goes dull, and what is left is a different white powder that weighs much less — and if you drop water on it, it hisses and gets hot. This is how lime for mortar has been made for four thousand years, and the only thing you needed was a hot enough fire."
lv1_de = "Jetzt verändert sich die Kreide tatsächlich. Sie glüht, wird dann matt, und was übrig bleibt, ist ein anderes weißes Pulver, das viel weniger wiegt — und tropfst du Wasser darauf, zischt es und wird heiß. So wird seit viertausend Jahren Mörtelkalk hergestellt, und das Einzige, was du dafür brauchtest, war ein ausreichend heißes Feuer."
lv2 = "8 kJ takes 0.0999 mol of chalk to about 1000 °C, above the decomposition point. CaCO₃ → CaO + CO₂: the carbon dioxide escapes and the balance falls from 10.00 g towards the mass of the quicklime alone. Every mole of chalk that decomposes gives up 44.009 g of gas and keeps 56.077 g of oxide — a loss of 44%."
lv2_de = "8 kJ bringen 0,0999 mol Kreide auf etwa 1000 °C, über den Zersetzungspunkt hinaus. CaCO₃ → CaO + CO₂: Das Kohlenstoffdioxid entweicht, und die Waage fällt von 10,00 g auf die Masse des reinen Branntkalks. Jedes Mol Kreide, das sich zersetzt, gibt 44,009 g Gas ab und behält 56,077 g Oxid — ein Verlust von 44 %."
lv3 = "The threshold is not tabulated. The minimiser is handed the element budget of the vessel plus its share of the atmosphere and asked for the composition with the lowest Gibbs energy at the temperature the enthalpy balance settles at; calcite wins below the crossing and lime-plus-gas above it. Element balance is a hard constraint here rather than an aspiration: the solver refuses to return a composition whose atoms do not add up to the ones that went in, to within a part in a billion, and it will report a failure to converge rather than a composition that creates matter. That check is the reason this entry can quote amounts at all — an earlier version of the minimiser tested convergence on the size of its own correction step instead of on the residual, and quietly returned twice the carbon dioxide it started with."
lv3_de = "Die Schwelle ist nicht tabelliert. Dem Minimierer werden das Elementbudget des Gefäßes sowie sein Anteil an der Atmosphäre übergeben, und er wird nach der Zusammensetzung mit der niedrigsten Gibbs-Energie bei der Temperatur gefragt, auf die sich die Enthalpiebilanz einpendelt; unterhalb des Übergangs gewinnt Calcit, oberhalb Kalk-plus-Gas. Die Elementbilanz ist hier eine harte Randbedingung und kein Anspruch: Der Löser verweigert die Rückgabe einer Zusammensetzung, deren Atome nicht bis auf ein Milliardstel mit den eingesetzten übereinstimmen, und meldet lieber ein Nicht-Konvergieren als eine Zusammensetzung, die Materie erschafft. Diese Kontrolle ist der Grund, warum dieser Eintrag überhaupt Mengen nennen kann — eine frühere Version des Minimierers prüfte die Konvergenz anhand der Größe ihres eigenen Korrekturschritts statt anhand des Residuums und lieferte still und leise die doppelte Menge des Kohlenstoffdioxids, mit dem sie begonnen hatte."

[reaction.provenance]
source = "Standard curriculum calcination; thermochemistry from NASA CEA thermo.inp. The statement about condensed-phase balance drift is Editorial judgement (Kerotakis), from comparing solver output against the element budget.. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
licence = "NASA CEA data: Apache-2.0"
computed_by = "Kerotakis L2g Gibbs minimiser"

# ================================================================== the fire

[[reaction]]
id = "burning-makes-it-heavier"
spine = ["massenerhaltung"]
equation = "2 Mg + O₂ → 2 MgO   ·   1.20 g of ribbon → 1.99 g of ash"
concepts = ["mass-gain-on-oxidation"]
requires = ["combustion", "mass-accounting"]
calculations = ["moles-from-mass", "mass-from-moles", "conservation-of-mass"]
models = ["conservation-of-atoms", "particle-model"]
apparatus = ["crucible", "balance", "tongs", "bunsen", "eye-protection"]

[[reaction.curriculum]]
system = "nrw-kernlehrplan-g9"
stage = "Sek I, Erste Stufe (Jg. 7/8), IF3 Verbrennung"
ages = { min = 12.0, max = 14.0 }
source = "Kernlehrplan Chemie Gymnasium G9 NRW, Heft 3415 (RdErl. 23.06.2019)"

[reaction.setup]
script = """
add v1 Mg 1.2g
measure v1 balance
ignite v1
measure v1 balance
"""

[reaction.expect]
events = ["ignited", "consumed:Mg", "precipitated:MgO"]
temperature_c = { min = 2600.0, max = 2900.0 }

[reaction.expect.predict]
question = "Weigh a magnesium ribbon: 1.20 g. Burn it completely and weigh the white ash. Commit to a number before you look."
question_de = "Wiege ein Magnesiumband: 1,20 g. Verbrenne es vollständig und wiege die weiße Asche. Lege dich auf eine Zahl fest, bevor du nachsiehst."
options = [
  "Less than 1.20 g — burning uses things up",
  "Exactly 1.20 g — mass is conserved",
  "1.99 g — more than you started with",
  "Nothing left to weigh — it all went up in smoke",
]
answer = 2
misconception = "This is the classic, and most people get it wrong. Every fire anyone has watched leaves less than it started with — a log becomes a handful of ash — so 'burning destroys matter' is learned from the world before it is unlearned in a classroom. The ash is lighter because the carbon left as gas. Magnesium's oxide is a solid and stays in the crucible, so the oxygen it took from the air is on the balance too. Burning is combination, not destruction; the log is the misleading case."
misconception_de = "Das ist der Klassiker, und die meisten liegen falsch. Jedes Feuer, das je jemand beobachtet hat, hinterlässt weniger, als es begann — ein Holzscheit wird zu einer Handvoll Asche —, sodass 'Verbrennen zerstört Materie' aus der Welt gelernt wird, bevor es im Klassenzimmer wieder verlernt wird. Die Asche ist leichter, weil der Kohlenstoff als Gas entwich. Magnesiums Oxid ist ein Feststoff und bleibt im Tiegel, sodass auch der aus der Luft aufgenommene Sauerstoff auf der Waage liegt. Verbrennen ist Verbindung, nicht Zerstörung; der Holzscheit ist der irreführende Fall."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Fire consumes — learned at every campfire before any classroom: burning spends matter, and ash is the leftover."
reveals_de = "Feuer verzehrt — gelernt an jedem Lagerfeuer, bevor es ein Klassenzimmer gab: Verbrennen gibt Materie aus, und Asche ist der Rest."
next = "Burn it here and weigh: 1.99 g from 1.20. The campfire was not lying — its lost mass left as gas. This fire's product is a solid, so the oxygen it took stays to be weighed; `burning-makes-it-lighter` runs the campfire's own case for the comparison."
next_de = "Verbrenne es hier und wiege: 1,99 g aus 1,20. Das Lagerfeuer hat nicht gelogen — seine verlorene Masse verließ es als Gas. Das Produkt dieses Feuers ist ein Feststoff, sodass der aufgenommene Sauerstoff zum Wiegen bleibt; `burning-makes-it-lighter` führt zum Vergleich den Fall des Lagerfeuers selbst vor."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "Conservation applied to the ribbon alone: the air has no line in the books, so what was weighed must be what remains."
reveals_de = "Erhaltung wird nur auf das Band angewendet: Die Luft hat keine Zeile in den Büchern, also muss das, was gewogen wurde, auch das sein, was übrig bleibt."
next = "Redraw the boundary around ribbon *plus air* and the books balance perfectly: the extra 0.79 g is oxygen that crossed it. The law was never in danger — it was applied one boundary too small."
next_de = "Zeichne die Grenze neu um Band *plus Luft*, und die Bücher gehen exakt auf: Die zusätzlichen 0,79 g sind Sauerstoff, der die Grenze überquert hat. Das Gesetz war nie in Gefahr — es wurde nur an einer um eine Größe zu kleinen Grenze angewendet."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "The strongest form of the campfire lesson: burning is annihilation, and 'up in smoke' means matter genuinely ending."
reveals_de = "Die stärkste Form der Lagerfeuer-Lehre: Verbrennen ist Vernichtung, und 'in Rauch aufgehen' bedeutet, dass Materie tatsächlich endet."
next = "Put a balance under every fire in this codex: something always remains or leaves *as something* — a gas with mass, an ash with mass. `mass-in-an-open-vessel` catches the leaving mass mid-flight; no ledger in this lab ever books to zero."
next_de = "Stelle unter jedes Feuer in diesem Kodex eine Waage: Etwas bleibt immer übrig oder verlässt *als etwas* — ein Gas mit Masse, eine Asche mit Masse. `mass-in-an-open-vessel` fängt die entweichende Masse mitten im Flug ein; kein Konto in diesem Labor bucht je auf null."

[reaction.registers]
lv1 = "It burns with a white light so fierce it hurts to look at, and leaves a powder that is whiter than the ribbon was. Put it back on the scales: it is heavier. Something came out of the air and joined it — the air is not nothing, and this is one of the few experiments where you can weigh that fact."
lv1_de = "Es brennt mit einem weißen Licht, so grell, dass es beim Hinsehen schmerzt, und hinterlässt ein Pulver, das weißer ist als das Band war. Leg es zurück auf die Waage: Es ist schwerer. Etwas aus der Luft ist hinzugekommen — die Luft ist nicht nichts, und das ist eines der wenigen Experimente, bei denen du diese Tatsache wiegen kannst."
lv2 = "0.0494 mol of Mg (1.20 g ÷ 24.305) becomes 0.0494 mol of MgO, which is 1.99 g. The gain of 0.79 g is 0.0247 mol of O₂ at 31.998 g/mol, taken from the atmosphere. Mass is conserved across the whole system; the crucible is not the whole system, and the missing accounting is the air."
lv2_de = "0,0494 mol Mg (1,20 g ÷ 24,305) werden zu 0,0494 mol MgO, das sind 1,99 g. Der Zuwachs von 0,79 g entspricht 0,0247 mol O₂ bei 31,998 g/mol, aus der Atmosphäre entnommen. Masse bleibt über das gesamte System erhalten; der Tiegel ist nicht das gesamte System, und die fehlende Buchung ist die Luft."
lv3 = "The oxygen is drawn from a reservoir rather than the vessel inventory, which is why the vessel's mass rises — a deliberate modelling choice matching an open crucible. The adiabatic solve settles at 3042 K with the condensed oxide dominant; at that temperature MgO(g) and atomic Mg are thermodynamically present in the NASA data but negligible at 1 bar, so essentially all of the metal is recovered as weighable solid."
lv3_de = "Der Sauerstoff wird aus einem Reservoir gezogen statt aus dem Inventar des Gefäßes, weshalb die Masse des Gefäßes steigt — eine bewusste Modellierungsentscheidung, die einem offenen Tiegel entspricht. Die adiabatische Lösung pendelt sich bei 3042 K mit dominierendem kondensiertem Oxid ein; bei dieser Temperatur sind MgO(g) und atomares Mg in den NASA-Daten thermodynamisch vorhanden, aber bei 1 bar vernachlässigbar, sodass im Wesentlichen das gesamte Metall als wägbarer Feststoff zurückgewonnen wird."

