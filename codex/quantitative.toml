apparatus = ["crucible", "thermometer", "balance", "bunsen"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 11/12, Reaktionsgeschwindigkeit und Katalyse"
ages = { min = 16.0, max = 18.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Oberstufe (ISB)"

[reaction.setup]
script = """
add v1 Mg 1.2g
heat v1 0.245kJ
measure v1 thermometer
measure v1 balance
new
add v2 Mg 1.2g
heat v2 0.25kJ
measure v2 thermometer
measure v2 balance
"""

[reaction.expect]
events = ["precipitated:MgO", "consumed:Mg"]
temperature_c = { min = 220.0, max = 227.0 }

[reaction.expect.predict]
question = "Magnesium and oxygen release 601 kJ per mole — thermodynamics says the metal should not exist in air at all. Two ribbons are heated: one to 224.3 °C, one to 228.4 °C. What happens?"
question_de = "Magnesium und Sauerstoff setzen 601 kJ pro Mol frei — die Thermodynamik sagt, das Metall dürfte in Luft gar nicht existieren. Zwei Bänder werden erhitzt: eines auf 224,3 °C, eines auf 228,4 °C. Was geschieht?"
options = [
  "Both burn — the reaction is favourable at both temperatures",
  "Neither burns — 228 °C is nowhere near hot enough",
  "Only the second burns. Four degrees is the difference between nothing and everything",
  "The first burns slowly, the second quickly",
]
answer = 2
misconception = "'The reaction releases energy, so it happens' is the single most common conflation in chemistry, and the last option is its softer form — the belief that an unfavourable rate means a slow reaction rather than no reaction. Equilibrium says where a system would end up; it says nothing about whether it can get there. A magnesium ribbon in a drawer is thermodynamically desperate to become oxide and will sit there for a century, because an oxide skin stands in the way."
misconception_de = "'Die Reaktion setzt Energie frei, also läuft sie ab' ist die mit Abstand häufigste Vermischung in der Chemie, und die letzte Option ist ihre mildere Form — der Glaube, eine ungünstige Geschwindigkeit bedeute eine langsame Reaktion statt keine Reaktion. Das Gleichgewicht sagt, wo ein System enden würde; es sagt nichts darüber, ob es dorthin gelangen kann. Ein Magnesiumband in einer Schublade ist thermodynamisch verzweifelt darauf aus, zu Oxid zu werden, und wird trotzdem ein Jahrhundert lang dort liegen bleiben, weil eine Oxidhaut im Weg steht."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Thermodynamics as sufficiency: released energy means it happens — the barrier between here and the favourable end state has no place in the picture."
reveals_de = "Thermodynamik als hinreichende Bedingung: freigesetzte Energie bedeutet, es geschieht — die Barriere zwischen hier und dem begünstigten Endzustand hat im Bild keinen Platz."
next = "The four-degree experiment is the barrier made visible: 224.3 °C, nothing; 228.4 °C, everything. Favourability did not change by so much as a joule between those two readings — access did."
next_de = "Das Vier-Grad-Experiment macht die Barriere sichtbar: 224,3 °C, nichts; 228,4 °C, alles. Die Begünstigung hat sich zwischen diesen beiden Messwerten nicht um so viel wie ein Joule verändert — der Zugang schon."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "Ignition as extremity by definition: a couple of hundred degrees feels too tame for a metal to catch, so the threshold is imagined somewhere far away and dramatic."
reveals_de = "Zündung als Extremzustand per Definition: ein paar hundert Grad fühlen sich zu zahm an, als dass ein Metall sich entzünden würde, also wird die Schwelle irgendwo weit entfernt und dramatisch vermutet."
next = "Run it: 228 °C is past this ribbon's threshold, and from there it climbs to over 2000. Thresholds sit where the balance puts them, not where drama suggests — which is why this entry asks you to commit to a number first."
next_de = "Führe es aus: 228 °C liegt über der Schwelle dieses Bandes, und von dort steigt es auf über 2000. Schwellen liegen dort, wo die Bilanz sie hinlegt, nicht dort, wo Dramatik es nahelegt — weshalb dieser Eintrag dich bittet, dich zuerst auf eine Zahl festzulegen."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "Rate as a dial that never reads zero: everything happens at some speed, so 'unfavourable' can only mean slow — 'does not go' is not an available answer."
reveals_de = "Geschwindigkeit als Regler, der nie null anzeigt: alles geschieht mit irgendeiner Geschwindigkeit, also kann 'ungünstig' nur langsam bedeuten — 'läuft nicht ab' ist keine verfügbare Antwort."
next = "Watch the cooler ribbon for as long as you like: no smoulder, no creeping mass gain on the balance — nothing. The ribbon in a drawer for a century is the long version of the same run; the oxide skin is not slowing the reaction down, it is standing in its way."
next_de = "Beobachte das kühlere Band, so lange du willst: kein Schwelen, kein schleichender Massezuwachs auf der Waage — nichts. Das Band, das ein Jahrhundert in einer Schublade liegt, ist die lange Version desselben Vorgangs; die Oxidhaut verlangsamt die Reaktion nicht, sie steht ihr im Weg."

[reaction.registers]
lv1 = "Two identical ribbons. Heat one to 224 °C and it is just a hot ribbon. Heat the other four degrees further and it erupts into a two-thousand-degree fire. Nothing about the metal or the air changed — there is a line, and everything depends on which side of it you are."
lv1_de = "Zwei identische Bänder. Erhitze das eine auf 224 °C, und es ist nur ein heißes Band. Erhitze das andere vier Grad weiter, und es bricht in ein zweitausend Grad heißes Feuer aus. Weder am Metall noch an der Luft hat sich etwas verändert — es gibt eine Linie, und alles hängt davon ab, auf welcher Seite davon du dich befindest."
lv2 = "Equilibrium says magnesium in air should be magnesium oxide at every temperature: ΔH = −601 kJ/mol and ΔG is negative throughout. It is not, because a coherent oxide layer stops oxygen reaching the metal. The bench encodes that with an explicit threshold at 500 K (226.85 °C): below it the thermal solver stands down and leaves solids alone, and 224.29 °C leaves 1.20 g of metal while 228.4 °C gives 1.99 g of oxide."
lv2_de = "Das Gleichgewicht sagt, Magnesium in Luft sollte bei jeder Temperatur Magnesiumoxid sein: ΔH = −601 kJ/mol, und ΔG ist durchgehend negativ. Ist es nicht, weil eine geschlossene Oxidschicht den Sauerstoff daran hindert, das Metall zu erreichen. Das Labor kodiert das mit einer expliziten Schwelle bei 500 K (226,85 °C): darunter zieht sich der thermische Löser zurück und lässt Feststoffe unangetastet, und 224,29 °C hinterlassen 1,20 g Metall, während 228,4 °C 1,99 g Oxid ergeben."
lv3 = "This threshold is an admitted stand-in, not a kinetic model. The engine computes equilibrium and equilibrium would oxidise every metal on the bench instantly; a real treatment needs activation energies, an Arrhenius rate and a diffusion model for the passivating layer, which is an L5 concern and not wired. The honest move is to make the boundary a named constant a learner can read — KINETIC_THRESHOLD_K — rather than to let equilibrium quietly lie about the world. Do not read 226.85 °C as magnesium's ignition temperature; read it as the engine saying 'kinetics lives here and I do not model it'."
lv3_de = "Diese Schwelle ist ein eingestandener Behelf, kein kinetisches Modell. Das Labor berechnet das Gleichgewicht, und das Gleichgewicht würde jedes Metall im Labor augenblicklich oxidieren; eine echte Behandlung bräuchte Aktivierungsenergien, eine Arrhenius-Geschwindigkeit und ein Diffusionsmodell für die passivierende Schicht, was ein Anliegen von L5 ist und nicht verdrahtet ist. Der ehrliche Schritt ist, die Grenze zu einer benannten Konstante zu machen, die ein Lernender lesen kann — KINETIC_THRESHOLD_K —, statt das Gleichgewicht still über die Welt lügen zu lassen. Lies 226,85 °C nicht als Zündtemperatur von Magnesium; lies es als die Aussage des Labors 'hier lebt Kinetik, und ich modelliere sie nicht'."

[reaction.provenance]
source = "Standard treatment of thermodynamic versus kinetic control; the passivating-oxide explanation is textbook corrosion chemistry. That the engine's 500 K threshold is a placeholder for kinetics rather than a measured ignition temperature is Editorial judgement (Kerotakis), read from the solver's own documented constant.. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
licence = "NASA CEA data: Apache-2.0"
computed_by = "Kerotakis L2g Gibbs minimiser, gated by KINETIC_THRESHOLD_K"

