[reaction.expect.predict]
question = "Two beakers, both above the solubility product, so silver chloride forms in both. In the first the amount formed is 0.16 µmol; in the second it is 1.7 µmol. What does the bench report?"
question_de = "Zwei Bechergläser, beide über dem Löslichkeitsprodukt, sodass sich in beiden Silberchlorid bildet. Im ersten beträgt die gebildete Menge 0,16 µmol; im zweiten 1,7 µmol. Was meldet das Labor?"
options = [
  "A precipitate in both — the chemistry is the same",
  "A precipitate in neither — both are far too dilute to see",
  "A precipitate in the second only: the first is below the observation floor of 1 µmol",
]
answer = 2
misconception = "The unstated assumption is that whatever the chemistry does, the experiment shows. Every instrument has a floor, and below it a real change produces no signal — which is not the instrument lying, it is the instrument having a specification. Confusing 'I did not detect it' with 'it did not happen' is how a negative result gets over-read, and the fix is knowing your detection limit before you run."
misconception_de = "Die unausgesprochene Annahme ist, dass das Experiment zeigt, was auch immer die Chemie tut. Jedes Instrument hat eine Untergrenze, und darunter erzeugt eine reale Veränderung kein Signal — das ist nicht das Instrument, das lügt, sondern das Instrument, das eine Spezifikation hat. 'Ich habe es nicht erkannt' mit 'es ist nicht geschehen' zu verwechseln ist, wie ein Nullergebnis überinterpretiert wird, und die Lösung ist, die Nachweisgrenze zu kennen, bevor man misst."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "The experiment shows whatever the chemistry does — instruments as transparent windows, with no floor of their own."
reveals_de = "Das Experiment zeigt, was auch immer die Chemie tut — Instrumente als durchsichtige Fenster, ohne eigene Untergrenze."
next = "Read the specification this bench publishes about itself: the observation floor is one micromole. The first beaker's 0.16 µmol is real, in the ledger, and below the floor — 'not shown' and 'not there' are different sentences, and an honest instrument says which one it means."
next_de = "Lies die Spezifikation, die dieses Labor über sich selbst veröffentlicht: Die Beobachtungsgrenze liegt bei einem Mikromol. Die 0,16 µmol des ersten Becherglases sind real, im Konto, und unterhalb der Grenze — 'nicht gezeigt' und 'nicht vorhanden' sind unterschiedliche Aussagen, und ein ehrliches Instrument sagt, welche davon es meint."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "The right instinct, uncalibrated: detection limits exist, but they sit wherever caution imagines them — and both amounts 'feel' invisible."
reveals_de = "Der richtige Instinkt, aber unkalibriert: Nachweisgrenzen existieren, aber sie liegen dort, wo die Vorsicht sie sich vorstellt — und beide Mengen 'fühlen sich' unsichtbar an."
next = "The floor is a number, not a mood: 1 µmol here. 1.7 sits above it and is reported; 0.16 sits below and is named rather than shown. Knowing the limit *before* the run is what turns 'nothing seen' into information instead of a shrug."
next_de = "Die Grenze ist eine Zahl, keine Stimmung: hier 1 µmol. 1,7 liegt darüber und wird gemeldet; 0,16 liegt darunter und wird benannt statt gezeigt. Die Grenze *vor* dem Lauf zu kennen ist es, was aus 'nichts gesehen' Information macht statt eines Achselzuckens."

[reaction.registers]
lv1 = "Two beakers with almost unmeasurably small pinches of chemical. Something really does happen in both. Only one of them shows you anything. Every measuring device has a smallest thing it can notice, and below that it says nothing at all — which is not the same as there being nothing."
lv1_de = "Zwei Bechergläser mit fast unmessbar kleinen Prisen Chemikalie. In beiden geschieht wirklich etwas. Nur eines der beiden zeigt dir etwas. Jedes Messgerät hat eine kleinste Sache, die es bemerken kann, und darunter sagt es überhaupt nichts — was nicht dasselbe ist, wie wenn nichts da wäre."
lv2 = "Both mixtures exceed Ksp(AgCl) ≈ 1.8 × 10⁻¹⁰, so solid forms in both. In v1 only about 0.16 µmol can form, below the bench's 1 µmol observation floor, and no precipitation event is emitted; in v2 about 1.7 µmol forms and the event fires. Inspecting v1 still shows silver chloride in its inventory — the bookkeeping is exact and only the reporting is floored."
lv2_de = "Beide Mischungen überschreiten Ksp(AgCl) ≈ 1,8 × 10⁻¹⁰, sodass sich in beiden Feststoff bildet. In v1 können sich nur etwa 0,16 µmol bilden, unterhalb der Beobachtungsgrenze des Labors von 1 µmol, und es wird kein Fällungs-Ereignis ausgelöst; in v2 bilden sich etwa 1,7 µmol, und das Ereignis feuert. Ein `inspect` von v1 zeigt Silberchlorid weiterhin in seinem Inventar — die Buchführung ist exakt, und nur die Meldung ist begrenzt."
lv3 = "The floor is OBSERVABLE_MOLES = 10⁻⁶ mol, applied uniformly to precipitation, dissolution and gas evolution. It is a deliberate stand-in for an instrument specification: a real turbidimeter, a real nose and a real balance all have limits, and a simulation that announces every nanomole trains a learner to expect a sensitivity no bench possesses. The number is a modelling choice, not a measured constant, and it is worth saying out loud that a nephelometer would see AgCl well below it while an eye would not see it well above."
lv3_de = "Die Grenze ist OBSERVABLE_MOLES = 10⁻⁶ mol, einheitlich angewendet auf Fällung, Auflösung und Gasentwicklung. Sie ist ein bewusster Ersatz für eine Gerätespezifikation: Ein echter Trübungsmesser, eine echte Nase und eine echte Waage haben alle Grenzen, und eine Simulation, die jedes Nanomol ankündigt, trainiert einen Lernenden darauf, eine Empfindlichkeit zu erwarten, die kein Labor besitzt. Die Zahl ist eine Modellierungsentscheidung, keine gemessene Konstante, und es lohnt sich, ausdrücklich zu sagen, dass ein Nephelometer AgCl weit darunter sehen würde, während ein Auge es weit darüber nicht sehen würde."

[reaction.provenance]
source = "Ksp and speciation from PHREEQC wateq4f.dat (USGS). That a uniform 10⁻⁶ mol reporting floor is the right stand-in for an instrument's detection limit is Editorial judgement (Kerotakis), and the engine's own documented rationale.. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "PHREEQC via Kerotakis L2; reporting floor applied by the Kerotakis bench"

[[reaction]]
id = "when-the-lab-says-it-does-not-know"
spine = ["natur-der-naturwissenschaft-nature-of-science"]
summary = "gypsum(s) + propanone(l) → not modelled"
summary_de = "Gips(s) + Propanon(l) → nicht modelliert"
concepts = ["model-boundary", "stated-ignorance"]
requires = ["dissolving", "solutions"]
calculations = ["conservation-of-mass"]
models = ["model-boundaries"]
apparatus = ["beaker", "balance", "stirring-rod"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium NTG Jgst. 8, LB Chemische Reaktionen"
ages = { min = 13.0, max = 14.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium NTG Jgst. 8 (ISB)"

[[reaction.curriculum]]
system = "nrw-kernlehrplan-g9"
stage = "Sek I, Erste Stufe (Jg. 7/8), IF2 Stoffe — Modelle und ihre Grenzen"
ages = { min = 12.0, max = 14.0 }
source = "Kernlehrplan Chemie Gymnasium G9 NRW, Heft 3415 (RdErl. 23.06.2019)"

[reaction.setup]
script = """
add v1 propanone 50mL
add v1 gypsum 2g
measure v1 balance
"""

[reaction.expect]
events = ["not_yet_modelled", "added:gypsum"]
absent = ["dissolved:gypsum", "solver_failed"]

[reaction.expect.predict]
question = "Gypsum is stirred into acetone instead of water. What should a chemistry program do?"
question_de = "Gips wird statt in Wasser in Aceton eingerührt. Was sollte ein Chemieprogramm tun?"
options = [
  "Dissolve it — it dissolved in water, so it dissolves",
  "Say 'not yet modelled': no wired solver covers this salt in a non-aqueous solvent",
  "Crash with an error",
  "Silently leave the salt at the bottom, as if that were the computed answer",
]
answer = 1
misconception = "Software is expected to answer. The tempting failure is the last option — quietly doing nothing and letting silence be read as a result, which is indistinguishable from 'it is insoluble' and happens to be roughly right here, for entirely the wrong reason. A model that cannot tell you where it stops has told you nothing you can trust anywhere."
misconception_de = "Von Software wird erwartet, dass sie antwortet. Der verlockende Fehlschlag ist die letzte Option — still nichts zu tun und Schweigen als Ergebnis lesen zu lassen, was von 'es ist unlöslich' nicht zu unterscheiden ist und hier zufällig ungefähr richtig ist, aus völlig falschem Grund. Ein Modell, das dir nicht sagen kann, wo es aufhört, hat dir nirgendwo etwas gesagt, dem du vertrauen kannst."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Solubility belongs to the salt alone: it dissolves, full stop — the solvent is interchangeable scenery rather than half of every dissolution."
reveals_de = "Löslichkeit gehört allein dem Salz: Es löst sich, Punkt — das Lösungsmittel ist austauschbare Kulisse statt der halbe Beitrag zu jeder Auflösung."
next = "Name what the solver actually knows: water's behaviour, from a thermodynamic database about water. Gypsum in acetone is in fact essentially insoluble — but the bench refuses to claim even that without a curated row that knows it, which is the difference between being right and being lucky."
next_de = "Benenne, was der Löser tatsächlich weiß: das Verhalten von Wasser, aus einer thermodynamischen Datenbank über Wasser. Gips ist in Aceton tatsächlich im Wesentlichen unlöslich — aber das Labor verweigert selbst diese Aussage ohne eine kuratierte Zeile, die es weiß, und das ist der Unterschied zwischen Rechthaben und Glückhaben."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Software has exactly two states, answer or error: a stated 'I don't know' is not in the vocabulary, so the only alternative to answering is breaking."
reveals_de = "Software habe genau zwei Zustände, Antwort oder Fehler: Ein ausdrückliches 'Ich weiß es nicht' gehört nicht zum Vokabular, also sei die einzige Alternative zum Antworten das Abstürzen."
next = "Run it: `not_yet_modelled` arrives as a first-class result, with provenance, and the CI fails any lesson that goes silent instead of saying it. The third state is this program's entire premise — a model that can name its own edge."
next_de = "Führe es aus: `not_yet_modelled` erscheint als vollwertiges Ergebnis, mit Herkunftsangabe, und die CI lässt jede Lektion fehlschlagen, die schweigt, statt es zu sagen. Der dritte Zustand ist die gesamte Prämisse dieses Programms — ein Modell, das seinen eigenen Rand benennen kann."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "The subtlest one: silence read as an answer. A program that does nothing has 'said' the salt is insoluble — and being roughly right hides that nothing was computed at all."
reveals_de = "Die subtilste: Schweigen wird als Antwort gelesen. Ein Programm, das nichts tut, hat 'gesagt', das Salz sei unlöslich — und ungefähr richtig zu liegen verdeckt, dass überhaupt nichts berechnet wurde."
next = "This exact defect sits in the project's own history: 'nothing ignited' once meant 'no solver engaged', reported as if it were a fact about ethanol. The rule it forced — wherever the engine declines to model something, it says so — is in PLAN.md, and this entry is that rule in teaching form."
next_de = "Genau dieser Fehler steckt in der eigenen Geschichte des Projekts: 'nichts entzündet' bedeutete einst 'kein Löser beteiligt', gemeldet, als wäre es eine Tatsache über Ethanol. Die Regel, die das erzwang — wo auch immer das Labor ablehnt, etwas zu modellieren, sagt es das — steht in PLAN.md, und dieser Eintrag ist diese Regel in Lehrform."

[reaction.registers]
lv1 = "Ask the lab something it does not know and it tells you it does not know. It does not guess, and it does not pretend the silence was an answer. Knowing the edge of what you know is part of knowing anything at all — and a person who can say 'I have not got a method for that' is more useful than one who always has a number."
lv1_de = "Frage das Labor etwas, das es nicht weiß, und es sagt dir, dass es das nicht weiß. Es rät nicht, und es tut nicht so, als wäre das Schweigen eine Antwort gewesen. Den Rand dessen zu kennen, was man weiß, gehört dazu, überhaupt etwas zu wissen — und eine Person, die sagen kann 'Dafür habe ich keine Methode', ist nützlicher als eine, die immer eine Zahl parat hat."
lv2 = "The aqueous engine's databases are parameterised for water: activity models, solubility products and speciation are all built on aqueous standard states. Acetone is a liquid the bench can hold and pour, and for some solutes in some organic solvents a curated handbook row now answers (NaCl's near-insolubility in ethanol, CaCl2's high solubility in acetone, for two) — but for this salt in this solvent no row exists yet, so the honesty pass emits 'not yet modelled' rather than a number. The balance still works — the acetone plus the salt — because mass bookkeeping is not the thing in doubt."
lv2_de = "Die Datenbanken des wässrigen Labors sind für Wasser parametrisiert: Aktivitätsmodelle, Löslichkeitsprodukte und Speziation beruhen alle auf wässrigen Standardzuständen. Aceton ist eine Flüssigkeit, die das Labor halten und eingießen kann, und für manche gelösten Stoffe in manchen organischen Lösungsmitteln antwortet inzwischen eine kuratierte Handbuchzeile (die nahezu-Unlöslichkeit von NaCl in Ethanol, die hohe Löslichkeit von CaCl2 in Aceton, zum Beispiel) — aber für dieses Salz in diesem Lösungsmittel existiert noch keine Zeile, also gibt der Ehrlichkeitsdurchlauf 'noch nicht modelliert' aus statt einer Zahl. Die Waage funktioniert weiterhin — das Aceton plus das Salz —, denn die Massenbuchführung steht nicht in Zweifel."
lv3 = "The event is `NotYetModeled`, raised by the honesty pass when a solid coexists with a liquid and no solver — and no curated verdict — covers the pair. It is structurally different from `SolverFailed`, which means a wired solver tried and did not converge. This entry originally demonstrated the gap with NaCl in ethanol, then moved to CuSO4 in ethanol — both of which the curated organic-solubility rung (CAP-23) now covers with handbook data. As coverage grows, the demonstration moves to the next uncovered pair; model boundaries move, and an honest bench moves its examples with them. This paragraph is the record that it happened."
lv3_de = "Das Ereignis ist `NotYetModeled`, ausgelöst vom Ehrlichkeitsdurchlauf, wenn ein Feststoff mit einer Flüssigkeit koexistiert und kein Löser — und kein kuratiertes Urteil — das Paar abdeckt. Es unterscheidet sich strukturell von `SolverFailed`, was bedeutet, dass ein verdrahteter Löser es versucht hat und nicht konvergiert ist. Dieser Eintrag demonstrierte die Lücke ursprünglich mit NaCl in Ethanol, wechselte dann zu CuSO4 in Ethanol — beide werden inzwischen von der kuratierten Stufe organischer Löslichkeit (CAP-23) mit Handbuchdaten abgedeckt. Wächst die Abdeckung, wandert die Demonstration zum nächsten unabgedeckten Paar; Modellgrenzen verschieben sich, und ein ehrliches Labor verschiebt seine Beispiele mit ihnen. Dieser Absatz ist die Aufzeichnung, dass das geschehen ist."

[reaction.provenance]
source = "Editorial judgement (Kerotakis): the design decision to emit a stated gap rather than a guess, and the argument for teaching model boundaries as content, is ours. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20, updated 2026-08-24)"
computed_by = "Not computed — the honesty pass reports the gap, which is itself the checked claim"
