lv2 = "Equilibrium says magnesium in air should be magnesium oxide at every temperature: ΔH = −601 kJ/mol and ΔG is negative throughout. It is not, because a coherent oxide layer stops oxygen reaching the metal. The bench encodes that with an explicit threshold at 500 K (226.85 °C): below it the thermal solver stands down and leaves solids alone, and 224.29 °C leaves 1.20 g of metal while 228.4 °C gives 1.99 g of oxide."
lv3 = "This threshold is an admitted stand-in, not a kinetic model. The engine computes equilibrium and equilibrium would oxidise every metal on the bench instantly; a real treatment needs activation energies, an Arrhenius rate and a diffusion model for the passivating layer, which is an L5 concern and not wired. The honest move is to make the boundary a named constant a learner can read — KINETIC_THRESHOLD_K — rather than to let equilibrium quietly lie about the world. Do not read 226.85 °C as magnesium's ignition temperature; read it as the engine saying 'kinetics lives here and I do not model it'."

[reaction.provenance]
source = "Standard treatment of thermodynamic versus kinetic control; the passivating-oxide explanation is textbook corrosion chemistry. That the engine's 500 K threshold is a placeholder for kinetics rather than a measured ignition temperature is Editorial judgement (Kerotakis), read from the solver's own documented constant."
licence = "NASA CEA data: Apache-2.0"
computed_by = "Kerotakis L2g Gibbs minimiser, gated by KINETIC_THRESHOLD_K"

[[reaction]]
id = "a-spark-that-changes-nothing"
spine = ["spektroskopieverfahren"]
equation = "KCl + spark → KCl (lilac flame, 5.00 g in, 5.00 g out)"
concepts = ["negative-result", "flame-test-identification"]
requires = ["flame-tests"]
calculations = ["conservation-of-mass"]
models = ["atomic-emission"]
apparatus = ["nichrome-wire", "bunsen", "balance", "cobalt-glass"]

[reaction.setup]
script = """
add v1 KCl 5g
measure v1 balance
ignite v1
measure v1 balance
measure v1 thermometer
"""

[reaction.expect]
events = ["flame_test:KCl"]
absent = ["ignited", "consumed:KCl", "gas_evolved:Cl2", "gas_evolved:CO2"]

[reaction.expect.predict]
question = "Hold a flame to 5.00 g of potassium chloride. The flame turns lilac. What does the balance read afterwards, and what is the temperature of the salt?"
options = [
  "Lighter, and hot — some of it burned off to make the colour",
  "5.00 g and 25 °C. Nothing burned; the colour is light, not fire",
  "Heavier — it combined with oxygen like the magnesium did",
]
answer = 1
misconception = "A coloured flame looks like combustion, so the salt is assumed to be the fuel. It is not: the flame excites the potassium's outer electron and the colour is what that electron emits falling back. Nothing is consumed, and a flame test on a milligram will keep going as long as you hold it there. This is also the entry that shows what a negative result looks like — three things that did not happen, each of which is checked."

[reaction.registers]
lv1 = "Hold the salt in a flame and the flame turns lilac — a completely different colour from the same burner a moment earlier. Weigh the salt: unchanged. Touch it once it is out of the flame: cold. You have identified the metal without using any of it up, which is why this test is nearly two hundred years old and still in use."
lv2 = "The bench reports a flame test and nothing else: no ignition, no consumption, no gas. 5.00 g in, 5.00 g out, 25.00 °C before and after. Potassium gives lilac, sodium gives yellow, calcium orange-red — the colour identifies the cation, and the anion is invisible to the test."
lv3 = "Two separate things are being asserted, and they come from different places. That nothing burns is computed: the Gibbs minimiser finds no exothermic path and the bench restores the vessel exactly. That the flame is lilac is curated spectroscopy — potassium's 766.5/769.9 nm doublet plus the violet lines — because the thermodynamic databases hold no electronic-transition data and the lab does not invent any. Worth noticing too: the equilibrium composition contains traces of Cl₂ at the nanomole level, and the bench refuses to announce them, because a trace is not an observation."

[reaction.provenance]
source = "Curated: potassium flame emission, standard spectroscopic knowledge. The absence of combustion is computed by the Gibbs minimiser."
licence = "NASA CEA data: Apache-2.0"
computed_by = "Kerotakis L2g Gibbs minimiser (the null result); emission colours curated"

# ================================================== measurement and its edges

[[reaction]]
id = "weigh-before-and-after"
spine = ["eindampfen"]
equation = "5.844 g NaCl + 100 mL water = 105.54 g; evaporate the water and 5.84 g remains"
concepts = ["recovery", "before-and-after-measurement"]
requires = ["dissolving", "mass-accounting"]
calculations = ["moles-from-mass", "conservation-of-mass", "percentage-yield"]
models = ["particle-model"]
apparatus = ["evaporating-basin", "balance", "bunsen", "tripod"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium NTG Jgst. 8, LB2 Stoffe und ihre Eigenschaften — Trennverfahren"
ages = { min = 13.0, max = 14.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium NTG Jgst. 8 (ISB)"

[reaction.setup]
script = """
add v1 water 100mL
add v1 NaCl 5.844g
measure v1 balance
evaporate v1 1.0
measure v1 balance
"""

[reaction.expect]
events = ["dissolved:NaCl", "evaporated"]

[reaction.expect.predict]
question = "Dissolve 5.844 g of salt in 100 mL of water — the basin reads 105.54 g. Boil the water away. What does the basin read now?"
options = [
  "0 g — it all evaporated",
  "5.84 g — the salt is left behind",
  "105.54 g — mass is conserved",
  "Less than 5.84 g — some salt goes with the steam",
]
answer = 1
misconception = "Young learners often think dissolving destroys the salt, so nothing should remain; older ones, having learned conservation, apply it to the basin and expect the whole 105.54 g. The measurement that settles it is the pair — before and after, on the same balance — which is why you write the first number down before you start rather than after you see the second."

[reaction.registers]
lv1 = "The salt vanished into the water and you cannot see it any more. Boil the water off and there it is again, the same amount as you started with. It was never gone — and the way you know, rather than believe, is that you wrote down the weight beforehand and can compare."
lv2 = "105.54 g before, 5.84 g after: 99.70 g left as water vapour, which is the 100 mL of water at 0.997 g/mL. The salt recovered, 5.84 g, is the 5.844 g put in — a recovery of 99.9%. Amount of substance is conserved through the dissolving and the evaporating; only the water went anywhere."
lv3 = "Nothing about this is trivial in the engine: the aqueous solver held 0.1000 mol of Na⁺ and 0.1000 mol of Cl⁻ in solution, and evaporation to dryness has to hand them back as solid NaCl without losing a mole. A useful boundary to try afterwards: evaporate in two steps rather than one and the bench emits 'not yet modelled' — solid salt in contact with the last film of liquid is a regime no wired solver owns. The single-step path is clean; the two-step path is honest about not being."

[reaction.provenance]
source = "Standard curriculum separation technique (evaporation to dryness)"
computed_by = "PHREEQC via Kerotakis L2; mass bookkeeping by the Kerotakis bench"

[[reaction]]
id = "a-nanomole-is-not-a-cloud"
spine = ["quantitative-analyseverfahren"]
equation = "1.5 µmol Ag⁺ + 1.5 µmol Cl⁻ in 100 mL: silver chloride forms, and no precipitation is reported"
concepts = ["detection-limit", "instrument-floor"]
requires = ["precipitation", "concentration"]
calculations = ["moles-from-mass", "concentration", "solubility-product"]
models = ["equilibrium", "measurement-model"]
apparatus = ["beaker", "analytical-balance", "volumetric-flask"]

[reaction.setup]
script = """
add v1 water 100mL
add v1 NaCl 0.0000877g
add v1 AgNO3 0.0002549g
new
add v2 water 100mL
add v2 NaCl 0.000175g
add v2 AgNO3 0.0005087g
"""

[reaction.expect]
events = ["precipitated:AgCl"]
ph = { min = 6.9, max = 7.1 }

[reaction.expect.predict]
question = "Two beakers, both above the solubility product, so silver chloride forms in both. In the first the amount formed is 0.16 µmol; in the second it is 1.7 µmol. What does the bench report?"
options = [
  "A precipitate in both — the chemistry is the same",
  "A precipitate in neither — both are far too dilute to see",
  "A precipitate in the second only: the first is below the observation floor of 1 µmol",
]
answer = 2
misconception = "The unstated assumption is that whatever the chemistry does, the experiment shows. Every instrument has a floor, and below it a real change produces no signal — which is not the instrument lying, it is the instrument having a specification. Confusing 'I did not detect it' with 'it did not happen' is how a negative result gets over-read, and the fix is knowing your detection limit before you run."

[reaction.registers]
lv1 = "Two beakers with almost unmeasurably small pinches of chemical. Something really does happen in both. Only one of them shows you anything. Every measuring device has a smallest thing it can notice, and below that it says nothing at all — which is not the same as there being nothing."
lv2 = "Both mixtures exceed Ksp(AgCl) ≈ 1.8 × 10⁻¹⁰, so solid forms in both. In v1 only about 0.16 µmol can form, below the bench's 1 µmol observation floor, and no precipitation event is emitted; in v2 about 1.7 µmol forms and the event fires. Inspecting v1 still shows silver chloride in its inventory — the bookkeeping is exact and only the reporting is floored."
lv3 = "The floor is OBSERVABLE_MOLES = 10⁻⁶ mol, applied uniformly to precipitation, dissolution and gas evolution. It is a deliberate stand-in for an instrument specification: a real turbidimeter, a real nose and a real balance all have limits, and a simulation that announces every nanomole trains a learner to expect a sensitivity no bench possesses. The number is a modelling choice, not a measured constant, and it is worth saying out loud that a nephelometer would see AgCl well below it while an eye would not see it well above."

[reaction.provenance]
source = "Ksp and speciation from PHREEQC wateq4f.dat (USGS). That a uniform 10⁻⁶ mol reporting floor is the right stand-in for an instrument's detection limit is Editorial judgement (Kerotakis), and the engine's own documented rationale."
computed_by = "PHREEQC via Kerotakis L2; reporting floor applied by the Kerotakis bench"

[[reaction]]
id = "when-the-lab-says-it-does-not-know"
spine = ["natur-der-naturwissenschaft-nature-of-science"]
equation = "NaCl(s) + ethanol(l) → not modelled"
concepts = ["model-boundary", "stated-ignorance"]
requires = ["dissolving", "solutions"]
calculations = ["conservation-of-mass"]
models = ["model-boundaries"]
apparatus = ["beaker", "balance", "stirring-rod"]

[reaction.setup]
script = """
add v1 ethanol 50mL
add v1 NaCl 2g
measure v1 balance
"""

[reaction.expect]
events = ["not_yet_modelled", "added:NaCl"]
absent = ["dissolved:NaCl", "solver_failed"]

[reaction.expect.predict]
question = "Salt is stirred into alcohol instead of water. What should a chemistry program do?"
options = [
  "Dissolve it — it dissolved in water, so it dissolves",
  "Say 'not yet modelled': no wired solver covers salt in a non-aqueous solvent",
  "Crash with an error",
  "Silently leave the salt at the bottom, as if that were the computed answer",
]
answer = 1
misconception = "Software is expected to answer. The tempting failure is the last option — quietly doing nothing and letting silence be read as a result, which is indistinguishable from 'it is insoluble' and happens to be roughly right here, for entirely the wrong reason. A model that cannot tell you where it stops has told you nothing you can trust anywhere."

[reaction.registers]
lv1 = "Ask the lab something it does not know and it tells you it does not know. It does not guess, and it does not pretend the silence was an answer. Knowing the edge of what you know is part of knowing anything at all — and a person who can say 'I have not got a method for that' is more useful than one who always has a number."
lv2 = "The aqueous engine's databases are parameterised for water: activity models, solubility products and speciation are all built on aqueous standard states. Ethanol is a liquid the bench can hold and pour, but no wired solver models solute behaviour in it, so the honesty pass emits 'not yet modelled' rather than a number. The balance still works — 41.45 g, the ethanol plus the salt — because mass bookkeeping is not the thing in doubt."
lv3 = "The event is `NotYetModeled`, raised by the honesty pass when a solid coexists with a liquid and no solver has characterised the solution. It is structurally different from `SolverFailed`, which means a wired solver tried and did not converge; the codex lint treats the second as an error and the first as a legitimate observation. Note the real answer would be interesting — NaCl is sparingly soluble in ethanol, around 0.65 g/L, and Pitzer parameters for mixed solvents exist — so this is a gap with a known shape, which is the only kind worth advertising."

[reaction.provenance]
source = "Editorial judgement (Kerotakis): the design decision to emit a stated gap rather than a guess, and the argument for teaching model boundaries as content, is ours. The solubility of NaCl in ethanol quoted at lv3 is a standard reference value and is not computed by the engine."
computed_by = "Not computed — the honesty pass reports the gap, which is itself the checked claim"
