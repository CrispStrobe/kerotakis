next = "Make the condition true and the number becomes right: `half-neutralised-vinegar` neutralises half, [HA] equals [A⁻], and the meter reads the pKa on the nose. This beaker has almost no acetate, so the equality it needs fails by miles."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "Edible means mild means pH 7: the category 'food' is answering a chemistry question, with safety and neutrality fused into one scale."
next = "Measure what you already eat: this very beaker is vinegar at 2.88, and you sprinkle it on chips. Edibility is a fact about dose and biology; the meter is measuring something else entirely, and the two scales only look alike until one of them is read."

[reaction.registers]
lv1 = "Same amount of acid, same amount of water, two very different meter readings. The strong one gives all its acidity up at once; the weak one holds most of it back and only lets a little go. That is why vinegar is safe to eat and hydrochloric acid at the same strength is not."
lv2 = "The naive calculation, pH = −log(0.100) = 1.00, is right for HCl (to within the activity correction — 1.08) and badly wrong for acetic acid, where the meter reads 2.88. Acetic acid only partly dissociates: pH ≈ ½(pKa − log c) = ½(4.76 + 1.00) = 2.88. You must know the Ka before you can calculate the pH, and that is the whole difference between a strong acid and a weak one."
lv3 = "PHREEQC does not apply the weak-acid formula either; it solves the mass-action equation H⁺ + CH₃COO⁻ ⇌ CH₃COOH (pKa ≈ 4.76 from minteq.v4.dat) simultaneously with charge and mass balance, and the pH falls out. The agreement with the ½(pKa − log c) shortcut at 2.88 is a check on the shortcut's assumptions — that dissociation is small and water's own protons are negligible — both of which hold here and both of which fail at 10⁻⁵ mol/L."

