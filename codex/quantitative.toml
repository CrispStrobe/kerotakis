"""

[reaction.expect]
ph = { min = 2.7, max = 3.05 }

[reaction.expect.predict]
question = "Both beakers get 0.100 mol of acid in a litre. One is hydrochloric acid, one is vinegar's acetic acid. The hydrochloric reads pH 1.08. What does the acetic acid read?"
question_de = "Beide Bechergläser erhalten 0,100 mol Säure in einem Liter. Das eine ist Salzsäure, das andere die Essigsäure des Essigs. Die Salzsäure zeigt pH-Wert 1,08. Was zeigt die Essigsäure?"
options = [
  "1.08 as well — same concentration, same pH",
  "2.88 — about 60 times fewer free protons",
  "4.76 — the pKa",
  "7.00 — vinegar is food, so it must be neutral",
]
answer = 1
misconception = "The pH = −log c habit, freshly learned, is applied to the acetic acid and produces 1.00 — the first option. It fails because the formula silently assumed the acid was fully dissociated. Choosing the pKa is the next mistake along: pH equals pKa only in a buffer, where acid and conjugate base are equal, and this beaker has almost no acetate in it."
misconception_de = "Die frisch gelernte Gewohnheit pH = −log c wird auf die Essigsäure angewendet und ergibt 1,00 — die erste Option. Sie scheitert, weil die Formel stillschweigend annahm, die Säure sei vollständig dissoziiert. Die Wahl des pKa-Werts ist der nächste Fehler auf diesem Weg: Der pH-Wert entspricht dem pKa-Wert nur in einem Puffer, in dem Säure und korrespondierende Base gleich groß sind, und dieses Becherglas enthält fast kein Acetat."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "pH = −log c with c the label concentration: the formula's hidden assumption — that every molecule has dissociated — has never surfaced, so all acids of one concentration read alike."
reveals_de = "pH = −log c mit c als Etikettkonzentration: Die versteckte Annahme der Formel — dass jedes Molekül dissoziiert ist — ist nie ans Licht gekommen, sodass alle Säuren derselben Konzentration gleich erscheinen sollen."
next = "`inspect` the acetic beaker at lv3: nearly all of the 0.100 mol is still intact CH₃COOH, holding its proton. The meter prices only the free protons, and there are about sixty times fewer of them than the label promised."
next_de = "Sieh dir das Essigsäure-Becherglas mit `inspect` auf lv3 an: Fast die gesamten 0,100 mol sind noch intaktes CH₃COOH und halten ihr Proton fest. Das Messgerät bewertet nur die freien Protonen, und davon gibt es etwa sechzigmal weniger, als das Etikett versprach."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "The pKa is the acid's pH — the one number remembered about vinegar, deployed wherever vinegar appears, with the buffer condition that came attached to it lost in transit."
reveals_de = "Der pKa-Wert gilt als der pH-Wert der Säure — die eine Zahl, die man sich über Essig merkt, eingesetzt, wo immer Essig auftaucht, wobei die Pufferbedingung, die eigentlich daran hing, unterwegs verloren ging."
next = "Make the condition true and the number becomes right: `half-neutralised-vinegar` neutralises half, [HA] equals [A⁻], and the meter reads the pKa on the nose. This beaker has almost no acetate, so the equality it needs fails by miles."
next_de = "Erfülle die Bedingung, und die Zahl wird richtig: `half-neutralised-vinegar` neutralisiert die Hälfte, [HA] entspricht [A⁻], und das Messgerät zeigt den pKa-Wert exakt an. Dieses Becherglas enthält fast kein Acetat, sodass die dafür nötige Gleichheit himmelweit verfehlt wird."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "Edible means mild means pH 7: the category 'food' is answering a chemistry question, with safety and neutrality fused into one scale."
reveals_de = "Essbar bedeutet mild bedeutet pH-Wert 7: Die Kategorie 'Lebensmittel' beantwortet eine chemische Frage, wobei Sicherheit und Neutralität zu einer einzigen Skala verschmelzen."
next = "Measure what you already eat: this very beaker is vinegar at 2.88, and you sprinkle it on chips. Edibility is a fact about dose and biology; the meter is measuring something else entirely, and the two scales only look alike until one of them is read."
next_de = "Miss, was du bereits isst: Genau dieses Becherglas ist Essig bei 2,88, und du beträufelst damit Pommes. Essbarkeit ist eine Tatsache über Dosis und Biologie; das Messgerät misst etwas völlig anderes, und die beiden Skalen sehen nur so lange gleich aus, bis man eine von ihnen abliest."

[reaction.registers]
lv1 = "Same amount of acid, same amount of water, two very different meter readings. The strong one gives all its acidity up at once; the weak one holds most of it back and only lets a little go. That is why vinegar is safe to eat and hydrochloric acid at the same strength is not."
lv1_de = "Dieselbe Menge Säure, dieselbe Menge Wasser, zwei sehr unterschiedliche Messwerte. Die starke Säure gibt ihre gesamte Acidität auf einmal ab; die schwache hält das meiste zurück und lässt nur wenig los. Deshalb ist Essig zum Verzehr sicher und Salzsäure derselben Stärke nicht."
lv2 = "The naive calculation, pH = −log(0.100) = 1.00, is right for HCl (to within the activity correction — 1.08) and badly wrong for acetic acid, where the meter reads 2.88. Acetic acid only partly dissociates: pH ≈ ½(pKa − log c) = ½(4.76 + 1.00) = 2.88. You must know the Ka before you can calculate the pH, and that is the whole difference between a strong acid and a weak one."
lv2_de = "Die naive Berechnung, pH = −log(0,100) = 1,00, stimmt für HCl (bis auf die Aktivitätskorrektur — 1,08) und liegt bei Essigsäure deutlich daneben, wo das Messgerät 2,88 zeigt. Essigsäure dissoziiert nur teilweise: pH ≈ ½(pKa − log c) = ½(4,76 + 1,00) = 2,88. Man muss den Ka-Wert kennen, bevor man den pH-Wert berechnen kann, und das ist der ganze Unterschied zwischen einer starken und einer schwachen Säure."
lv3 = "PHREEQC does not apply the weak-acid formula either; it solves the mass-action equation H⁺ + CH₃COO⁻ ⇌ CH₃COOH (pKa ≈ 4.76 from minteq.v4.dat) simultaneously with charge and mass balance, and the pH falls out. The agreement with the ½(pKa − log c) shortcut at 2.88 is a check on the shortcut's assumptions — that dissociation is small and water's own protons are negligible — both of which hold here and both of which fail at 10⁻⁵ mol/L."
lv3_de = "Auch PHREEQC wendet die Formel für schwache Säuren nicht an; es löst die Massenwirkungsgleichung H⁺ + CH₃COO⁻ ⇌ CH₃COOH (pKa ≈ 4,76 aus minteq.v4.dat) gleichzeitig mit Ladungs- und Massenbilanz, und der pH-Wert ergibt sich daraus. Die Übereinstimmung mit der Abkürzung ½(pKa − log c) bei 2,88 ist eine Prüfung der Annahmen dieser Abkürzung — dass die Dissoziation gering ist und die eigenen Protonen des Wassers vernachlässigbar sind —, die beide hier gelten und beide bei 10⁻⁵ mol/L versagen."

