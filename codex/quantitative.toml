[reaction.expect.predict]
question = "0.1000 mol of calcium chloride (ΔH_dis = −82.8 kJ/mol) dissolves in 100 mL of water. Water's molar heat capacity is 75.3 J·mol⁻¹·K⁻¹ and 100 mL is 5.53 mol. How warm does it get, starting from 25.0 °C?"
question_de = "0,1000 mol Calciumchlorid (ΔH_Lös = −82,8 kJ/mol) löst sich in 100 mL Wasser. Die molare Wärmekapazität von Wasser beträgt 75,3 J·mol⁻¹·K⁻¹, und 100 mL entsprechen 5,53 mol. Wie warm wird es, ausgehend von 25,0 °C?"
options = [
  "About 27 °C — a couple of degrees",
  "About 45 °C",
  "About 108 °C — it would boil",
  "It stays at 25 °C; dissolving is a physical change, not a chemical one",
]
answer = 1
misconception = "The last option is the deep one: dissolving gets filed under 'physical change' and physical changes are assumed not to involve energy. Breaking an ionic lattice and hydrating the ions are both large energy terms, and their difference is what the thermometer reads. The 108 °C answer comes from dividing by the mass in grams while using a molar heat capacity."
misconception_de = "Die letzte Option ist die tiefgreifende: Lösen wird unter 'physikalische Veränderung' eingeordnet, und von physikalischen Veränderungen wird angenommen, dass sie keine Energie betreffen. Das Aufbrechen eines Ionengitters und die Hydratisierung der Ionen sind beides große Energiebeiträge, und ihre Differenz ist es, was das Thermometer zeigt. Die Antwort 108 °C entsteht dadurch, dass durch die Masse in Gramm geteilt wird, während eine molare Wärmekapazität verwendet wird."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "The energy is conceded but sized by feel: kilojoules sound small, so degrees must be few — the division that would settle it is never actually done."
reveals_de = "Die Energie wird zwar zugestanden, aber nach Gefühl bemessen: Kilojoule klingen klein, also müssen es wenige Grad sein — die Division, die das klären würde, wird nie tatsächlich durchgeführt."
next = "Do the division the question hands you: 8.28 kJ into 5.53 mol × 75.3 J·mol⁻¹·K⁻¹ is 416 J/K, so +19.9 K. Committing to the arithmetic before the thermometer settles it is the entire exercise."
next_de = "Führe die Division durch, die die Aufgabe vorgibt: 8,28 kJ auf 5,53 mol × 75,3 J·mol⁻¹·K⁻¹ ergibt 416 J/K, also +19,9 K. Sich auf die Rechnung festzulegen, bevor das Thermometer entscheidet, ist die ganze Übung."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Units crossed mid-formula: grams sat under a molar heat capacity, and the resulting large number felt like chemistry happening rather than like an error."
reveals_de = "Einheiten wurden mitten in der Formel vertauscht: Gramm standen unter einer molaren Wärmekapazität, und die daraus resultierende große Zahl fühlte sich an wie geschehende Chemie, nicht wie ein Fehler."
next = "Carry the units through: J ÷ (mol × J·mol⁻¹·K⁻¹) leaves kelvin; grams under a molar capacity leaves nonsense wearing a temperature's clothes. Units are not decoration — they are the check that catches this before the water conspicuously fails to boil."
next_de = "Führe die Einheiten konsequent mit: J ÷ (mol × J·mol⁻¹·K⁻¹) ergibt Kelvin; Gramm unter einer molaren Kapazität ergibt Unsinn im Gewand einer Temperatur. Einheiten sind keine Dekoration — sie sind die Kontrolle, die das auffängt, bevor das Wasser auffällig nicht kocht."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "Taxonomy doing physics: 'physical change' is a no-energy category, so classifying the event answers the thermometer's question."
reveals_de = "Taxonomie betreibt Physik: 'Physikalische Veränderung' gilt als energiefreie Kategorie, also beantwortet das Einordnen des Vorgangs die Frage des Thermometers."
next = "The categories do not hold the energy — the lattice and the hydration shells do. Run `cold-from-baking-soda` beside this: the same 'physical change' with the opposite sign. A taxonomy that predicts zero cannot predict both +20 K and −4 K; an energy balance predicts both."
next_de = "Die Kategorien enthalten nicht die Energie — das Gitter und die Hydrathüllen tun das. Führe `cold-from-baking-soda` neben diesem hier aus: dieselbe 'physikalische Veränderung' mit umgekehrtem Vorzeichen. Eine Taxonomie, die null vorhersagt, kann nicht sowohl +20 K als auch −4 K vorhersagen; eine Energiebilanz sagt beides vorher."

[reaction.registers]
lv1 = "The cup gets genuinely hot — too hot to hold comfortably — and nothing was burned and nothing was plugged in. Pulling a crystal apart and wrapping water round the pieces releases more energy than it costs, and the surplus has nowhere to go except into the water."
lv1_de = "Der Becher wird wirklich heiß — zu heiß, um ihn bequem zu halten —, und dabei wurde nichts verbrannt und nichts eingesteckt. Einen Kristall auseinanderzureißen und Wasser um die Bruchstücke zu legen setzt mehr Energie frei, als es kostet, und der Überschuss kann nirgendwohin außer ins Wasser."
lv2 = "q = n × ΔH_dis = 0.1000 mol × 82.8 kJ/mol = 8.28 kJ released. The water is 100 mL, 5.5343 mol, at 75.3 J·mol⁻¹·K⁻¹, so ΔT = 8280 J ÷ 416.7 J/K = 19.9 K. From 25.0 °C that predicts 44.9 °C, and the thermometer reads 44.87 °C. The calculation is not an exercise — it is the reading."
lv2_de = "q = n × ΔH_Lös = 0,1000 mol × 82,8 kJ/mol = 8,28 kJ freigesetzt. Das Wasser entspricht 100 mL, 5,5343 mol, bei 75,3 J·mol⁻¹·K⁻¹, also ΔT = 8280 J ÷ 416,7 J/K = 19,9 K. Ausgehend von 25,0 °C sagt das 44,9 °C voraus, und das Thermometer zeigt 44,87 °C. Die Berechnung ist keine Übung — sie ist der Messwert."
lv3 = "The heat goes into the water alone: the dissolved Ca²⁺ and Cl⁻ carry no modelled heat capacity, since partial molar heat capacities of aqueous ions are small and often negative and are not curated at this stage. That is an approximation with a known sign, and it is why the computed 44.87 °C sits marginally above a full calorimetric treatment. The vessel is adiabatic, so nothing is lost to a cup or to the room — the real experiment always reads lower, and the gap is the calorimeter constant."
lv3_de = "Die Wärme geht allein ins Wasser: Das gelöste Ca²⁺ und Cl⁻ tragen keine modellierte Wärmekapazität, da partielle molare Wärmekapazitäten wässriger Ionen klein und oft negativ sind und in diesem Stadium nicht kuratiert werden. Das ist eine Näherung mit bekanntem Vorzeichen, und deshalb liegt das berechnete 44,87 °C geringfügig über einer vollständigen kalorimetrischen Behandlung. Das Gefäß ist adiabatisch, sodass nichts an einen Becher oder an den Raum verloren geht — das reale Experiment zeigt immer weniger an, und die Lücke ist die Kalorimeterkonstante."

