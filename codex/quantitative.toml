  "Heavier — it combined with oxygen like the magnesium did",
]
answer = 1
misconception = "A coloured flame looks like combustion, so the salt is assumed to be the fuel. It is not: the flame excites the potassium's outer electron and the colour is what that electron emits falling back. Nothing is consumed, and a flame test on a milligram will keep going as long as you hold it there. This is also the entry that shows what a negative result looks like — three things that did not happen, each of which is checked."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Colour is combustion's receipt: if it glows, something is being spent — light without fuel is not in the picture."
next = "Weigh and take the temperature afterwards: 5.00 g, 25 °C — a negative result with every negative checked. The lilac is an electron falling back to its shelf, not matter leaving; a milligram would colour the flame for as long as you cared to hold it there."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "The magnesium template, pattern-matched onto any solid in a flame: metal-ish thing plus fire equals oxide plus mass gain."
next = "Ask what would have to change for the template to apply: potassium chloride's ions are already in their stable states, with nothing to offer oxygen. The flame test works *because* nothing reacts — which is what lets it identify an element without destroying the sample."

[reaction.registers]
lv1 = "Hold the salt in a flame and the flame turns lilac — a completely different colour from the same burner a moment earlier. Weigh the salt: unchanged. Touch it once it is out of the flame: cold. You have identified the metal without using any of it up, which is why this test is nearly two hundred years old and still in use."
lv2 = "The bench reports a flame test and nothing else: no ignition, no consumption, no gas. 5.00 g in, 5.00 g out, 25.00 °C before and after. Potassium gives lilac, sodium gives yellow, calcium orange-red — the colour identifies the cation, and the anion is invisible to the test."
lv3 = "Two separate things are being asserted, and they come from different places. That nothing burns is computed: the Gibbs minimiser finds no exothermic path and the bench restores the vessel exactly. That the flame is lilac is curated spectroscopy — potassium's 766.5/769.9 nm doublet plus the violet lines — because the thermodynamic databases hold no electronic-transition data and the lab does not invent any. Worth noticing too: the equilibrium composition contains traces of Cl₂ at the nanomole level, and the bench refuses to announce them, because a trace is not an observation."

[reaction.provenance]
source = "Curated: potassium flame emission, standard spectroscopic knowledge. The absence of combustion is computed by the Gibbs minimiser.. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
licence = "NASA CEA data: Apache-2.0"
computed_by = "Kerotakis L2g Gibbs minimiser (the null result); emission colours curated"

# ================================================== measurement and its edges

[[reaction]]
id = "weigh-before-and-after"
spine = ["eindampfen"]
summary = "5.844 g NaCl + 100 mL water = 105.54 g; evaporate the water and 5.84 g remains"
concepts = ["recovery", "before-and-after-measurement"]
requires = ["dissolving", "mass-accounting"]
calculations = ["moles-from-mass", "conservation-of-mass", "percentage-yield"]
models = ["particle-model"]
apparatus = ["evaporating-basin", "balance", "bunsen", "tripod"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium NTG Jgst. 8, LB2 Stoffe und ihre Eigenschaften — Trennverfahren"
ages = { min = 13.0, max = 14.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium NTG Jgst. 8 (ISB)"

[reaction.setup]
script = """
add v1 water 100mL
add v1 NaCl 5.844g
measure v1 balance
evaporate v1 1.0
measure v1 balance
"""

[reaction.expect]
events = ["dissolved:NaCl", "evaporated"]

[reaction.expect.predict]
question = "Dissolve 5.844 g of salt in 100 mL of water — the basin reads 105.54 g. Boil the water away. What does the basin read now?"
options = [
  "0 g — it all evaporated",
  "5.84 g — the salt is left behind",
  "105.54 g — mass is conserved",
  "Less than 5.84 g — some salt goes with the steam",
]
answer = 1
misconception = "Young learners often think dissolving destroys the salt, so nothing should remain; older ones, having learned conservation, apply it to the basin and expect the whole 105.54 g. The measurement that settles it is the pair — before and after, on the same balance — which is why you write the first number down before you start rather than after you see the second."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Dissolving destroyed the salt, so boiling merely finishes the disappearance — what vanished from sight vanished from existence."
next = "Boil it and look in the basin: 5.84 g of crystals, the mass that went in, back on the same balance. `particles` shows where the salt was the whole time — out of sight was never out of the ledger."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Conservation pinned to the basin: the reading is the system, so the whole 105.54 g must survive the boiling."
next = "Weigh what left: 99.7 g of water is now vapour in the room, carrying its mass with it. The before/after pair on one balance is precisely the instrument for catching a boundary drawn wrong — which is why the first number is written down first."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "Evaporation as a general carrier: whatever is in the liquid rides out with the vapour, brine and all."
next = "Check what the vapour can hold: at these temperatures the salt's ions have no route into the gas, which is why evaporating seawater is how salt is *made* — and why kettle scale stays stubbornly behind rather than steaming away."

[reaction.registers]
lv1 = "The salt vanished into the water and you cannot see it any more. Boil the water off and there it is again, the same amount as you started with. It was never gone — and the way you know, rather than believe, is that you wrote down the weight beforehand and can compare."
lv2 = "105.54 g before, 5.84 g after: 99.70 g left as water vapour, which is the 100 mL of water at 0.997 g/mL. The salt recovered, 5.84 g, is the 5.844 g put in — a recovery of 99.9%. Amount of substance is conserved through the dissolving and the evaporating; only the water went anywhere."
lv3 = "Nothing about this is trivial in the engine: the aqueous solver held 0.1000 mol of Na⁺ and 0.1000 mol of Cl⁻ in solution, and evaporation to dryness has to hand them back as solid NaCl without losing a mole. A useful boundary to try afterwards: evaporate in two steps rather than one and the bench emits 'not yet modelled' — solid salt in contact with the last film of liquid is a regime no wired solver owns. The single-step path is clean; the two-step path is honest about not being."

[reaction.provenance]
source = "Standard curriculum separation technique (evaporation to dryness). Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "PHREEQC via Kerotakis L2; mass bookkeeping by the Kerotakis bench"

[[reaction]]
id = "the-salt-comes-back-the-ribbon-does-not"
spine = ["die-chemische-reaktion", "stoffvernichtung-und-stoffneubildung"]
summary = "Dissolving reverses when the water leaves; burning does not reverse at any temperature — the difference is whether a new substance formed"
concepts = ["physical-vs-chemical-change", "reversibility"]
requires = ["crystallisation", "mass-gain-on-oxidation"]
apparatus = ["beaker", "crucible", "balance"]
calculations = ["mass-bookkeeping"]

[reaction.setup]
script = """
add v1 water 100mL
add v1 NaCl 5.844g
evaporate v1 0.95
new
add v2 Mg 1.2g
ignite v2
"""

[reaction.expect]
events = ["dissolved:NaCl", "evaporated", "consumed:Mg", "ignited"]
ph = { min = 6.0, max = 6.5 }

[reaction.expect.predict]
question = "Two things vanished on this bench: salt disappeared into water, and a magnesium ribbon disappeared into flame. Which of the two can you undo?"
options = [
  "Both — chemistry can always be run backwards if you are clever enough",
  "Neither — once a substance is gone, it is gone",
  "Only the salt: boil the water away and the crystals return; no amount of heating or cooling un-burns the ribbon",
]
answer = 2
misconception = "The two disappearances are the same event to the eye and opposite events underneath. The salt is still sodium chloride, hiding as ions — remove the water and it must come back. The ribbon's atoms are all still there too, but in new company: magnesium oxide is a new substance, and temperature cannot dissolve a chemical bond that heat itself favours. Telling these two vanishings apart is the definition of a chemical reaction."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Reversibility as cleverness rather than as a property of what happened — dissolving and reacting filed as the same kind of vanishing, undone by the same kind of trick."
next = "Try both on this bench: evaporate the brine and the crystals return, mass ledger intact. Heat the ash, cool it, wait at it — magnesium oxide it stays. Undoing it takes a new chemical partner and a great deal of energy (industry does it by electrolysis of the molten salt), not a cleverer application of heat."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "Dissolution as destruction — the young learner's default: the salt is gone the way the ribbon is gone, and gone is gone."
next = "The balance never agreed: the brine weighs the salt the whole time (`weigh-before-and-after`), and evaporation hands it back as crystals you can count in grams. The two vanishings differ in what remains — the same substance hiding, or a new substance formed — and that difference is the whole content of the words 'chemical reaction'."

[reaction.registers]
lv1 = "The salt hid in the water — boil the water away and there it is again, white and sharp-cornered. The ribbon did not hide: it *became* something new, and no amount of un-heating brings it back. That is the difference between mixing something and really changing it."
lv2 = "Dissolving is a physical change: NaCl(s) → Na⁺(aq) + Cl⁻(aq), reversed by removing the solvent — evaporate 95% of the water and 0.069 mol of crystals return, the rest still dissolved in the last 5 mL. Burning is a chemical change: 2 Mg + O₂ → 2 MgO, a new substance with new properties, and no temperature reverses it."
lv3 = "Both halves are computed, and both carry their fine print. The brine at 95% evaporated holds 0.0692 mol of solid salt beside 0.031 mol still in solution — solubility stays a ratio to the remaining water down to the last millilitre, which is `crystallising-salt-from-brine`'s subtraction taken nearly to its end. The ash side: the thermal solver answers 'magnesium oxide' at every temperature this bench can reach, because the oxide is downhill from the metal everywhere — reversing it is not a temperature question but an electron question, which is why industry electrolyses the molten chloride instead of heating the oxide. One boundary named: evaporating to *total* dryness currently leaves the final trace of ions labelled aqueous with no water to be aqueous in — a state the registry has no story for yet — which is why this entry stops at 95%."

[reaction.provenance]
source = "Standard curriculum introduction to chemical change (physical vs chemical); solubility and crystallisation from PHREEQC wateq4f.dat (USGS); combustion from NASA CEA thermodynamic data. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
