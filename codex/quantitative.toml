spine = ["konzentrationsberechnungen"]
summary = "c = n / V   ·   0.1000 mol in 0.100 L = 1.00 mol/L; the same 0.1000 mol in 0.200 L = 0.50 mol/L"
summary_de = "c = n / V   ·   0,1000 mol in 0,100 L = 1,00 mol/L; dieselben 0,1000 mol in 0,200 L = 0,50 mol/L"
concepts = ["concentration", "ionic-strength"]
requires = ["amount-of-substance"]
calculations = ["concentration"]
models = ["particle-model"]
apparatus = ["beaker", "measuring-cylinder", "balance"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 9, Quantitative Betrachtung chemischer Reaktionen"
ages = { min = 14.0, max = 15.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium (ISB)"

[[reaction.curriculum]]
system = "nrw-kernlehrplan-g9"
stage = "Sek I, Zweite Stufe (Jg. 9/10), IF6 Salze und Ionen"
ages = { min = 14.0, max = 16.0 }
source = "Kernlehrplan Chemie Gymnasium G9 NRW, Heft 3415 (RdErl. 23.06.2019)"

[[reaction.curriculum]]
system = "england-gcse-combined-science"
stage = "GCSE Combined Science: Trilogy (AQA 8464), 5.3 Quantitative chemistry"
ages = { min = 14.0, max = 16.0 }
source = "AQA GCSE Combined Science: Trilogy specification (8464) — calculating concentrations of solutions is required content"

[reaction.setup]
script = """
add v1 water 100mL
add v1 NaCl 5.844g
new
add v2 water 200mL
add v2 NaCl 5.844g
"""

[reaction.expect]
events = ["dissolved:NaCl"]
ph = { min = 6.7, max = 7.1 }

[reaction.expect.predict]
question = "The same 5.844 g of salt goes into 100 mL in one beaker and 200 mL in another. Which beaker holds more sodium chloride?"
question_de = "Dieselben 5,844 g Salz kommen in ein Becherglas mit 100 mL und in ein anderes mit 200 mL. Welches Becherglas enthält mehr Natriumchlorid?"
options = [
  "The 100 mL beaker — it is more concentrated",
  "The 200 mL beaker — there is more liquid",
  "Neither: both hold 0.1000 mol; only the concentration differs",
]
answer = 2
misconception = "Concentration and amount get welded together. A strong cup of tea does not contain more tea than a weak bucket of it. The engine separates the two explicitly: both vessels report 0.1000 mol of chloride, and the ionic strengths differ by exactly a factor of two."
misconception_de = "Konzentration und Stoffmenge werden miteinander verschweißt. Eine starke Tasse Tee enthält nicht mehr Tee als ein schwacher Eimer davon. Das Labor trennt die beiden explizit: Beide Gefäße melden 0,1000 mol Chlorid, und die Ionenstärken unterscheiden sich um genau den Faktor zwei."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "'More concentrated' is read as 'containing more' — intensity mistaken for quantity, the strong cup of tea holding more tea than the weak bucket."
reveals_de = "'Konzentrierter' wird als 'mehr enthaltend' gelesen — Intensität wird mit Menge verwechselt, die starke Tasse Tee scheint mehr Tee zu enthalten als der schwache Eimer."
next = "Evaporate both to dryness: identical crystals, 5.84 g each, back on the same balance. Two solutions that differ in everything the tongue would notice return the same salt, because the salt never differed."
next_de = "Dampfe beide zur Trockne ein: identische Kristalle, je 5,84 g, wieder auf derselben Waage. Zwei Lösungen, die sich in allem unterscheiden, was die Zunge bemerken würde, liefern dasselbe Salz zurück — weil sich das Salz nie unterschieden hat."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "Solute scales with solution: more liquid must hold more stuff, as if the water manufactured salt to fill itself."
reveals_de = "Der gelöste Stoff skaliert mit der Lösung: mehr Flüssigkeit muss mehr Stoff enthalten, als würde das Wasser Salz herstellen, um sich selbst zu füllen."
next = "Follow the salt's paper trail: it entered once, on the balance, before any water was chosen. `measure` both vessels — they differ by exactly the extra water's mass, and by nothing else."
next_de = "Verfolge die Papierspur des Salzes: Es kam genau einmal hinzu, auf der Waage, bevor überhaupt Wasser gewählt wurde. `measure` beide Gefäße — sie unterscheiden sich um genau die Masse des zusätzlichen Wassers, und um nichts sonst."

[reaction.registers]
lv1 = "Two beakers, the same spoonful of salt, different amounts of water. The small one tastes saltier — but there is not more salt in it. 'How much' and 'how strong' are two different questions, and mixing them up is one of the easiest mistakes to make."
lv1_de = "Zwei Bechergläser, derselbe Löffel Salz, unterschiedliche Mengen Wasser. Das kleinere schmeckt salziger — aber es enthält nicht mehr Salz. 'Wie viel' und 'wie stark' sind zwei verschiedene Fragen, und sie zu verwechseln ist einer der leichtesten Fehler überhaupt."
lv2 = "c = n / V. 0.1000 mol in 0.100 L is 1.00 mol/L; in 0.200 L it is 0.50 mol/L. The bench reports the ionic strength of the two solutions as 1.0030 m and 0.5015 m — exactly the halving, because for a 1:1 salt like NaCl the ionic strength equals the molality."
lv2_de = "c = n / V. 0,1000 mol in 0,100 L ergibt 1,00 mol/L; in 0,200 L ergibt es 0,50 mol/L. Das Labor meldet die Ionenstärke der beiden Lösungen mit 1,0030 m und 0,5015 m — genau die Halbierung, denn bei einem 1:1-Salz wie NaCl entspricht die Ionenstärke der Molalität."
lv3 = "Ionic strength I = ½ Σ cᵢ zᵢ², which for a 1:1 electrolyte collapses to the concentration itself; that identity is why the two numbers look like the concentrations. The small excess over 1.0000 (1.0030 m) is molality against molarity: the litre of solution is not a litre of water, and PHREEQC works in mol per kg of water throughout."
lv3_de = "Ionenstärke I = ½ Σ cᵢ zᵢ², was sich bei einem 1:1-Elektrolyten auf die Konzentration selbst reduziert; diese Identität ist der Grund, warum die beiden Zahlen wie die Konzentrationen aussehen. Der kleine Überschuss über 1,0000 (1,0030 m) ist Molalität gegen Molarität: Der Liter Lösung ist kein Liter Wasser, und PHREEQC rechnet durchgehend in Mol pro Kilogramm Wasser."

[reaction.provenance]
source = "Standard curriculum concentration calculations; ionic strength from PHREEQC (USGS) speciation. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "PHREEQC via Kerotakis L2"

[[reaction]]
id = "dilution-moves-ph-by-one"
spine = ["konzentrationsberechnungen"]
summary = "c₁V₁ = c₂V₂   ·   0.001 mol in 0.100 L → pH 2.04; the same acid in 1.000 L → pH 3.01"
summary_de = "c₁V₁ = c₂V₂   ·   0,001 mol in 0,100 L → pH-Wert 2,04; dieselbe Säure in 1,000 L → pH-Wert 3,01"
concepts = ["dilution"]
requires = ["concentration", "ph"]
calculations = ["dilution", "ph-from-concentration"]
models = ["particle-model"]
apparatus = ["beaker", "pipette", "ph-meter"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 10, LB4 Protonenübergänge/Säure-Base-Reaktionen"
ages = { min = 15.0, max = 16.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Jgst. 10 (ISB)"

[[reaction.curriculum]]
system = "nrw-kernlehrplan-g9"
stage = "Sek I, Zweite Stufe (Jg. 9/10), IF7 Säuren und Basen"
ages = { min = 14.0, max = 16.0 }
source = "Kernlehrplan Chemie Gymnasium G9 NRW, Heft 3415 (RdErl. 23.06.2019)"

[reaction.setup]
script = """
add v1 water 100mL
add v1 HCl 0.001mol
measure v1 ph
add v1 water 900mL
measure v1 ph
"""

[reaction.expect]
ph = { min = 2.85, max = 3.15 }

[reaction.expect.predict]
question = "An acid reads pH 2.04. You add nine times as much water again, so the volume is ten times what it was. What does the meter read now?"
question_de = "Eine Säure zeigt pH-Wert 2,04. Du gibst noch einmal die neunfache Menge Wasser dazu, sodass das Volumen jetzt zehnmal so groß ist. Was zeigt das Messgerät jetzt an?"
options = [
  "pH 3.0 — a tenfold dilution costs one pH unit",
  "pH 7.0 — water is neutral, so diluting makes it neutral",
  "pH 20.4 — ten times the pH",
  "pH 2.04 — the acid is still in there",
]
answer = 0
misconception = "Two errors are common and both are about the logarithm. 'Ten times the volume, ten times the pH' treats pH as if it were the concentration; and 'dilution neutralises' forgets that no amount of water reaches pH 7 — you approach it and never arrive, because the acid is still all there."
misconception_de = "Zwei Fehler sind verbreitet, und beide betreffen den Logarithmus. 'Zehnmal das Volumen, zehnmal der pH-Wert' behandelt den pH-Wert, als wäre er die Konzentration; und 'Verdünnen neutralisiert' vergisst, dass keine Menge Wasser den pH-Wert 7 erreicht — man nähert sich ihm an und kommt nie dort an, weil die Säure noch vollständig vorhanden ist."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "Mixing averages the labels: water 'is pH 7', so enough of it drags the mixture to 7 the way white paint lightens red — neutrality as an ingredient rather than an absence."
reveals_de = "Mischen mittelt die Etiketten: Wasser 'ist pH 7', also zieht genug davon die Mischung Richtung 7, so wie weiße Farbe Rot aufhellt — Neutralität als Zutat statt als Abwesenheit."
next = "Keep diluting, tenfold at a time, and read the meter each round: 3, then 4, then 5 — one unit per decade, creeping toward 7 and never arriving, because every proton that came in is still in there."
next_de = "Verdünne immer weiter, jeweils um den Faktor zehn, und lies das Messgerät bei jeder Runde ab: 3, dann 4, dann 5 — eine Einheit pro Zehnerschritt, langsam Richtung 7 kriechend und nie ankommend, weil jedes Proton, das hineinkam, immer noch dort ist."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "pH is proportional to 'how much': the logarithm is absent, so ten times the volume multiplies the reading by ten."
reveals_de = "Der pH-Wert wird als proportional zu 'wie viel' behandelt: Der Logarithmus fehlt, also multipliziert das Zehnfache des Volumens den Messwert mit zehn."
next = "Notice what 20.4 would even mean: the scale counts powers of ten of hydrogen-ion activity, which is why water's whole world fits between about 0 and 14. A tenfold change moves it by exactly one — to 3.0, as the meter shows."
next_de = "Überlege, was 20,4 überhaupt bedeuten würde: Die Skala zählt Zehnerpotenzen der Wasserstoffionen-Aktivität, weshalb die ganze Welt des Wassers zwischen etwa 0 und 14 liegt. Eine Verzehnfachung verschiebt sie um genau eine Einheit — auf 3,0, wie das Messgerät zeigt."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "pH travels with the acid like a colour: as long as the acid exists, its label persists — crowding plays no role in the reading."
reveals_de = "Der pH-Wert reist mit der Säure mit wie eine Farbe: Solange die Säure existiert, bleibt ihr Etikett bestehen — Gedränge spielt beim Messwert keine Rolle."
next = "Run it and hold both facts at once: `inspect` shows the same moles of acid, and the meter moves anyway. pH belongs to the solution, not to the substance — it prices how crowded the protons are, not whether they exist."
next_de = "Führe es aus und halte beide Tatsachen zugleich fest: `inspect` zeigt dieselbe Stoffmenge Säure, und trotzdem bewegt sich das Messgerät. Der pH-Wert gehört zur Lösung, nicht zum Stoff — er bewertet, wie gedrängt die Protonen sind, nicht ob sie existieren."

[reaction.registers]
lv1 = "Add water to an acid and it gets weaker — but it never turns into water. The acid you put in is still there; it just has more room. On the meter the number climbs, and it climbs by one step for every tenfold splash of water, not by ten."
lv1_de = "Gibst du Wasser zu einer Säure, wird sie schwächer — aber sie wird nie zu Wasser. Die Säure, die du hineingegeben hast, ist immer noch da; sie hat nur mehr Platz. Auf dem Messgerät steigt die Zahl, und sie steigt um einen Schritt pro zehnfachem Schwall Wasser, nicht um zehn."
lv2 = "c₁V₁ = c₂V₂. 0.001 mol in 100 mL is 0.01 mol/L; the meter reads pH 2.04. Take the volume to 1.000 L and the concentration is 0.001 mol/L — the meter reads pH 3.01. One pH unit per factor of ten, because pH is a logarithm."
lv2_de = "c₁V₁ = c₂V₂. 0,001 mol in 100 mL ergibt 0,01 mol/L; das Messgerät zeigt pH-Wert 2,04. Bringt man das Volumen auf 1,000 L, beträgt die Konzentration 0,001 mol/L — das Messgerät zeigt pH-Wert 3,01. Eine pH-Einheit pro Faktor zehn, weil der pH-Wert ein Logarithmus ist."
lv3 = "The moles of H⁺ are conserved exactly across the dilution; what changes is the activity, and with it the measured pH. Note the reading is 2.04 rather than 2.00 and 3.01 rather than 3.00: at I ≈ 0.01 m the activity coefficient is ≈0.90, and PHREEQC reports pH as −log a(H⁺), not −log c(H⁺). Textbooks assume γ = 1 and quietly lose that hundredth."
lv3_de = "Die Stoffmenge an H⁺ bleibt über die Verdünnung hinweg exakt erhalten; was sich ändert, ist die Aktivität, und mit ihr der gemessene pH-Wert. Beachte, dass der Messwert 2,04 statt 2,00 und 3,01 statt 3,00 lautet: Bei I ≈ 0,01 m liegt der Aktivitätskoeffizient bei ≈0,90, und PHREEQC gibt den pH-Wert als −log a(H⁺) an, nicht als −log c(H⁺). Lehrbücher nehmen γ = 1 an und verlieren dabei stillschweigend diese Hundertstel."

