spine = ["kinetik"]
summary = "Mg + ½O₂ → MgO is favourable at every temperature; at 224 °C the ribbon just sits there"
summary_de = "Mg + ½O₂ → MgO ist bei jeder Temperatur begünstigt; bei 224 °C liegt das Band einfach nur da"
concepts = ["kinetic-barrier", "thermodynamic-versus-kinetic"]
requires = ["adiabatic-flame-temperature"]
calculations = ["temperature-rise"]
