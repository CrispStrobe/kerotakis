ages = { min = 14.0, max = 16.0 }
source = "AQA GCSE Combined Science: Trilogy specification (8464) — calculating masses of reactants and products, excess and limiting reagents (Higher tier)"

[reaction.setup]
script = """
add v1 water 500mL
add v1 NaCl 0.5844g
add v1 AgNO3 3.3974g
new
add v2 water 500mL
add v2 NaCl 1.1689g
add v2 AgNO3 1.6987g
"""

[reaction.expect]
events = ["precipitated:AgCl", "dissolved:AgNO3"]

[reaction.expect.predict]
question = "Beaker 1: 0.0100 mol of chloride and 0.0200 mol of silver. Beaker 2: 0.0200 mol of chloride and 0.0100 mol of silver. Which makes more silver chloride?"
question_de = "Becherglas 1: 0,0100 mol Chlorid und 0,0200 mol Silber. Becherglas 2: 0,0200 mol Chlorid und 0,0100 mol Silber. Welches bildet mehr Silberchlorid?"
options = [
  "Beaker 1 — it has more silver, and silver is the heavy part",
  "Beaker 2 — it has more chloride",
  "Neither: both make 0.0100 mol, set by whichever ion runs out first",
]
answer = 2
misconception = "Learners reliably add the reagents up rather than pairing them off. The reaction is one silver to one chloride: the partner in short supply decides the answer and the surplus simply sits there. Both beakers hold 0.0300 mol of reactant in total and both give exactly 0.0100 mol of precipitate."
misconception_de = "Lernende addieren die Edukte zuverlässig, statt sie einander zuzuordnen. Die Reaktion verläuft im Verhältnis eins zu eins zwischen Silber und Chlorid: Der Partner, der knapper ist, entscheidet die Antwort, und der Überschuss sitzt einfach untätig herum. Beide Bechergläser enthalten insgesamt 0,0300 mol Edukt, und beide liefern genau 0,0100 mol Niederschlag."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "The yield follows the 'important' reagent: silver is the heavy, expensive, name-giving part, so more silver means more silver chloride — pairing-off is not in the picture."
reveals_de = "Die Ausbeute folgt dem 'wichtigen' Edukt: Silber ist der schwere, teure, namensgebende Teil, also bedeutet mehr Silber mehr Silberchlorid — die Zuordnung zueinander kommt im Bild nicht vor."
next = "Run both and filter: two identical 0.0100 mol cakes. Then `inspect` what remains dissolved — beaker 1 still holds its extra silver, doing nothing. Importance is not a stoichiometric quantity."
next_de = "Führe beide aus und filtriere: zwei identische Filterkuchen mit je 0,0100 mol. Prüfe dann mit `inspect`, was gelöst bleibt — Becherglas 1 enthält immer noch sein überschüssiges Silber, das nichts tut. Wichtigkeit ist keine stöchiometrische Größe."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "The mirror of the same error: more of either ingredient means more product — amounts add, rather than pair."
reveals_de = "Das Spiegelbild desselben Fehlers: mehr von einer der beiden Zutaten bedeutet mehr Produkt — Mengen addieren sich, statt sich zuzuordnen."
next = "Pair them off like dance partners: each AgCl needs exactly one of each ion, so the shorter queue ends the dance — at 0.0100 mol in both rooms. The totals being equal (0.0300 mol each) is the trap the question sets."
next_de = "Ordne sie wie Tanzpartner einander zu: Jedes AgCl braucht genau ein Ion von jeder Sorte, also beendet die kürzere Schlange den Tanz — bei 0,0100 mol in beiden Räumen. Dass die Summen gleich sind (je 0,0300 mol), ist die Falle, die die Aufgabe stellt."

[reaction.registers]
lv1 = "Two beakers get the same total amount of chemical, just split differently — one has extra silver, the other extra salt. Both go cloudy, and both produce exactly the same amount of white solid. Whatever runs out first is what stops the reaction; the leftovers do nothing but stay dissolved."
lv1_de = "Zwei Bechergläser erhalten dieselbe Gesamtmenge Chemikalie, nur unterschiedlich aufgeteilt — das eine hat überschüssiges Silber, das andere überschüssiges Salz. Beide trüben sich ein, und beide bilden genau dieselbe Menge weißen Feststoff. Was zuerst ausgeht, stoppt die Reaktion; die Reste tun nichts weiter, als gelöst zu bleiben."
lv2 = "Ag⁺ + Cl⁻ → AgCl↓ is a 1:1 reaction. Beaker 1: 0.0100 mol Cl⁻ is limiting against 0.0200 mol Ag⁺. Beaker 2: 0.0100 mol Ag⁺ is limiting against 0.0200 mol Cl⁻. The bench reports 0.0100 mol of AgCl in both. Work out the moles of each, take the smaller, and you have predicted the answer before running it."
lv2_de = "Ag⁺ + Cl⁻ → AgCl↓ ist eine 1:1-Reaktion. Becherglas 1: 0,0100 mol Cl⁻ ist limitierend gegenüber 0,0200 mol Ag⁺. Becherglas 2: 0,0100 mol Ag⁺ ist limitierend gegenüber 0,0200 mol Cl⁻. Das Labor meldet in beiden Fällen 0,0100 mol AgCl. Berechne die Stoffmenge jedes Edukts, nimm die kleinere, und du hast die Antwort vorhergesagt, bevor du sie ausführst."
lv3 = "The solver does not apply a limiting-reagent rule — it minimises free energy subject to element balances, and the 1:1 stoichiometry falls out of the mass-action constraint on Ksp(AgCl) ≈ 1.8 × 10⁻¹⁰. The two beakers differ in what remains dissolved: excess Ag⁺ suppresses residual chloride and vice versa, the common-ion effect, and the final pH differs slightly (6.90 against 7.07) because nitrate and chloride do not affect the proton balance identically."
lv3_de = "Der Löser wendet keine Regel für das limitierende Edukt an — er minimiert die freie Energie unter Einhaltung der Elementbilanzen, und die 1:1-Stöchiometrie ergibt sich aus der Massenwirkungs-Randbedingung für Ksp(AgCl) ≈ 1,8 × 10⁻¹⁰. Die beiden Bechergläser unterscheiden sich darin, was gelöst bleibt: überschüssiges Ag⁺ unterdrückt restliches Chlorid und umgekehrt, der gemeinsame-Ionen-Effekt, und der End-pH-Wert unterscheidet sich leicht (6,90 gegenüber 7,07), weil Nitrat und Chlorid die Protonenbilanz nicht identisch beeinflussen."

