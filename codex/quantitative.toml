# =================================================================== the pH

[[reaction]]
id = "ph-is-not-quite-minus-log-c"
spine = ["ph-wert-berechnungen"]
summary = "0.100 mol/L HCl: −log c = 1.00, and the meter reads 1.08"
summary_de = "0,100 mol/L HCl: −log c = 1,00, und das Messgerät zeigt 1,08"
equation = "HCl → H⁺ + Cl⁻"
concepts = ["ph-calculation", "activity"]
requires = ["concentration", "acids"]
calculations = ["ph-from-concentration"]
models = ["ionic-bonding", "activity-model"]
apparatus = ["beaker", "ph-meter", "pipette"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 10, LB4 Protonenübergänge/Säure-Base-Reaktionen"
ages = { min = 15.0, max = 16.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Jgst. 10 (ISB)"

[[reaction.curriculum]]
system = "nrw-kernlehrplan-g9"
stage = "Sek I, Zweite Stufe (Jg. 9/10), IF7 Säuren und Basen"
ages = { min = 14.0, max = 16.0 }
source = "Kernlehrplan Chemie Gymnasium G9 NRW, Heft 3415 (RdErl. 23.06.2019)"

[reaction.setup]
script = """
add v1 water 1000mL
add v1 HCl 0.1mol
measure v1 ph
"""

[reaction.expect]
ph = { min = 1.0, max = 1.2 }

[reaction.expect.predict]
question = "0.100 mol of hydrochloric acid in a litre of water. The textbook formula pH = −log[H⁺] gives 1.00. What does the meter read?"
question_de = "0,100 mol Salzsäure in einem Liter Wasser. Die Lehrbuchformel pH = −log[H⁺] ergibt 1,00. Was zeigt das Messgerät?"
options = [
  "Exactly 1.00",
  "1.08 — a little above, because the meter responds to activity, not concentration",
  "0.92 — a little below",
]
answer = 1
misconception = "pH = −log c is taught as a definition when it is an approximation that holds when ions are far apart. At 0.1 mol/L they are not: each proton is surrounded by a cloud of counter-ions that shields it, and the electrode feels the shielded version. The gap is small here and grows with concentration — which is exactly why lv3 exists."
misconception_de = "pH = −log c wird als Definition gelehrt, obwohl es eine Näherung ist, die gilt, wenn Ionen weit voneinander entfernt sind. Bei 0,1 mol/L sind sie das nicht: Jedes Proton ist von einer Wolke aus Gegenionen umgeben, die es abschirmt, und die Elektrode spürt die abgeschirmte Version. Der Unterschied ist hier klein und wächst mit der Konzentration — genau deshalb gibt es lv3."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "The formula is the definition, so the meter must obey it — a disagreeing meter is broken, and 'activity' has no slot in the picture."
reveals_de = "Die Formel gilt als Definition, also muss das Messgerät ihr gehorchen — ein abweichendes Messgerät ist defekt, und 'Aktivität' hat keinen Platz im Bild."
next = "Dilute and watch the gap close: at 0.001 mol/L (`strong-acid`) formula and meter agree to the second decimal; at 0.1 they part by 0.08. A definition's error does not shrink with dilution — an approximation's does, and that behaviour is the diagnosis."
next_de = "Verdünne und beobachte, wie sich der Unterschied schließt: Bei 0,001 mol/L (`strong-acid`) stimmen Formel und Messgerät bis zur zweiten Nachkommastelle überein; bei 0,1 weichen sie um 0,08 voneinander ab. Der Fehler einer Definition schrumpft nicht mit der Verdünnung — der einer Näherung schon, und dieses Verhalten ist die Diagnose."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "A correction is expected but its direction is guessed — the crowding is imagined to concentrate the acid's punch rather than damp it, so corrections land by coin-flip."
reveals_de = "Eine Korrektur wird erwartet, aber ihre Richtung wird geraten — das Gedränge wird sich so vorgestellt, dass es die Wirkung der Säure verstärkt statt dämpft, sodass Korrekturen per Münzwurf landen."
next = "Let the physics fix the sign: every proton drags a cloud of counter-ions that screens it, so the electrode always feels *less* than the count in solutions like this — the reading lands above the naive number, never below. A correction whose sign you can derive is chemistry; one you guess is decoration."
next_de = "Lass die Physik das Vorzeichen festlegen: Jedes Proton schleppt eine Wolke aus Gegenionen mit sich, die es abschirmt, sodass die Elektrode in Lösungen wie dieser immer *weniger* spürt als die reine Anzahl — der Messwert liegt über der naiven Zahl, nie darunter. Eine Korrektur, deren Vorzeichen du herleiten kannst, ist Chemie; eine, die du rätst, ist Dekoration."

[reaction.registers]
lv1 = "A pH meter does not count acid particles. It responds to how strongly the acid is pushing, and in a crowded solution the particles get in each other's way, so the push is slightly weaker than the count suggests. The meter tells you what the solution does, which is the number that matters."
lv1_de = "Ein pH-Messgerät zählt keine Säureteilchen. Es reagiert darauf, wie stark die Säure drückt, und in einer gedrängten Lösung kommen sich die Teilchen gegenseitig in die Quere, sodass der Druck etwas schwächer ist, als die Anzahl vermuten lässt. Das Messgerät sagt dir, was die Lösung tut, und das ist die Zahl, auf die es ankommt."
lv2 = "0.100 mol in 1.000 L is 0.100 mol/L. Complete dissociation gives [H⁺] = 0.100, so −log[H⁺] = 1.00. The meter reads 1.08. The formula is right about the count and slightly wrong about the reading, and the difference is not experimental error — it is reproducible."
lv2_de = "0,100 mol in 1,000 L ergibt 0,100 mol/L. Vollständige Dissoziation liefert [H⁺] = 0,100, also −log[H⁺] = 1,00. Das Messgerät zeigt 1,08. Die Formel hat recht mit der Anzahl und liegt beim Messwert leicht daneben, und der Unterschied ist kein Messfehler — er ist reproduzierbar."
lv3 = "pH is defined as −log a(H⁺), and a = γc. At I = 0.1 m the WATEQ Debye–Hückel extension gives γ(H⁺) ≈ 0.83, so pH = −log(0.83 × 0.100) = 1.08 — which is what PHREEQC computes and reports. Compare the same acid at 0.001 mol/L, where γ ≈ 0.96 and the correction is a hundredth: the approximation is not wrong, it has a validity range, and this is a place where the learner can watch it expire."
lv3_de = "Der pH-Wert ist definiert als −log a(H⁺), und a = γc. Bei I = 0,1 m liefert die WATEQ-Debye-Hückel-Erweiterung γ(H⁺) ≈ 0,83, also pH = −log(0,83 × 0,100) = 1,08 — genau das, was PHREEQC berechnet und meldet. Vergleiche dieselbe Säure bei 0,001 mol/L, wo γ ≈ 0,96 und die Korrektur nur eine Hundertstel beträgt: Die Näherung ist nicht falsch, sie hat einen Gültigkeitsbereich, und hier kann der Lernende beobachten, wie er endet."

