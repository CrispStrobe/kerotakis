[reaction.expect.predict]
question = "0.1000 mol of baking soda goes into 100 mL of water at 25.0 °C. ΔH_dis = +16.7 kJ/mol. What does the thermometer say?"
question_de = "0,1000 mol Natron kommen in 100 mL Wasser bei 25,0 °C. ΔH_Lös = +16,7 kJ/mol. Was zeigt das Thermometer?"
options = [
  "Warmer — dissolving always releases energy",
  "21.0 °C — about four degrees colder",
  "Unchanged — the water is what holds the temperature",
]
answer = 1
misconception = "Having just watched calcium chloride heat a cup, learners generalise: dissolving warms things. The sign of ΔH_dis is a property of the substance, not of dissolving. Baking soda, potassium chloride and ammonium nitrate all go the other way, and an instant cold pack is exactly this experiment."
misconception_de = "Nachdem Lernende gerade gesehen haben, wie Calciumchlorid einen Becher erwärmt, verallgemeinern sie: Lösen erwärmt Dinge. Das Vorzeichen von ΔH_Lös ist eine Eigenschaft des Stoffes, nicht des Lösens. Natron, Kaliumchlorid und Ammoniumnitrat gehen alle den anderen Weg, und eine Sofort-Kühlpackung ist genau dieses Experiment."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Last experiment's result, promoted to a law: dissolving warms things, because the memorable one did."
reveals_de = "Das Ergebnis des letzten Experiments wird zum Gesetz erhoben: Lösen erwärmt Dinge, weil das einprägsame Beispiel es tat."
next = "Run `hot-pack-arithmetic` and this beaker back to back: the sign travels with the substance, not with the operation. ΔH_dis here is +16.7 kJ/mol, and the thermometer obeys the sign, not the habit."
next_de = "Führe `hot-pack-arithmetic` und dieses Becherglas nacheinander aus: Das Vorzeichen reist mit dem Stoff, nicht mit dem Vorgang. ΔH_Lös beträgt hier +16,7 kJ/mol, und das Thermometer gehorcht dem Vorzeichen, nicht der Gewohnheit."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Water as a thermal anchor: a big steady liquid that a spoonful of powder cannot move — heat capacity mistaken for immunity."
reveals_de = "Wasser als thermischer Anker: eine große, stetige Flüssigkeit, die ein Löffel Pulver nicht bewegen kann — Wärmekapazität wird mit Unempfindlichkeit verwechselt."
next = "Heat capacity is a price, not a veto: withdrawing 1.67 kJ from 416 J/K of water costs 4.0 K, and the thermometer pays it. A large capacity makes moves smaller — `two-vessels-one-variable` prices exactly that — but never zero."
next_de = "Wärmekapazität ist ein Preis, kein Veto: 1,67 kJ aus 416 J/K Wasser zu entziehen kostet 4,0 K, und das Thermometer bezahlt sie. Eine große Kapazität macht Änderungen kleiner — `two-vessels-one-variable` bepreist genau das —, aber niemals null."

[reaction.registers]
lv1 = "Same cup, same water, different powder — and this one goes cold instead of hot. That is not a trick or a different kind of stirring; some substances have to borrow energy from the water to come apart, and the water is left colder for lending it."
lv1_de = "Derselbe Becher, dasselbe Wasser, ein anderes Pulver — und dieses wird kalt statt heiß. Das ist kein Trick und kein anderes Rühren; manche Stoffe müssen sich Energie vom Wasser leihen, um sich aufzulösen, und das Wasser bleibt kälter zurück, weil es sie verliehen hat."
lv2 = "q = 0.1000 mol × (+16.7 kJ/mol) = +1.67 kJ absorbed. ΔT = −1670 J ÷ 416.7 J/K = −4.0 K, so 25.0 °C → 21.0 °C, and the thermometer reads 21.02 °C. Potassium chloride at +17.2 kJ/mol gives 20.87 °C in the same cup — nearly the same, because the enthalpies are nearly the same."
lv2_de = "q = 0,1000 mol × (+16,7 kJ/mol) = +1,67 kJ aufgenommen. ΔT = −1670 J ÷ 416,7 J/K = −4,0 K, also 25,0 °C → 21,0 °C, und das Thermometer zeigt 21,02 °C. Kaliumchlorid mit +17,2 kJ/mol ergibt 20,87 °C im selben Becher — fast dasselbe, weil die Enthalpien fast gleich sind."
lv3 = "Endothermic dissolution means the lattice enthalpy exceeds the sum of the hydration enthalpies; the deficit comes out of the solution's sensible heat in an adiabatic vessel. Note the bench also reports 0.0424 mol of CO₂ leaving: a bicarbonate solution at pH 10.07 is supersaturated against atmospheric pCO₂ and outgasses. That carbonate chemistry is real and independent of the thermal effect, which is why both events appear."
lv3_de = "Endotherme Lösung bedeutet, dass die Gitterenthalpie die Summe der Hydratationsenthalpien übersteigt; das Defizit wird der fühlbaren Wärme der Lösung in einem adiabatischen Gefäß entnommen. Beachte, dass das Labor außerdem meldet, dass 0,0424 mol CO₂ entweichen: Eine Hydrogencarbonat-Lösung bei pH-Wert 10,07 ist gegenüber dem atmosphärischen pCO₂ übersättigt und entgast. Diese Carbonat-Chemie ist real und unabhängig vom thermischen Effekt, weshalb beide Ereignisse auftreten."

