[reaction.expect.predict]
question = "1.20 g of charcoal, burned completely in the same crucible that made magnesium heavier. What is on the balance afterwards?"
question_de = "1,20 g Holzkohle, vollständig verbrannt in demselben Tiegel, in dem Magnesium schwerer wurde. Was zeigt die Waage danach?"
options = [
  "1.20 g — mass is conserved",
  "More than 1.20 g, as with the magnesium",
  "Essentially nothing — the crucible is empty",
]
answer = 2
misconception = "Having just been taught that burning adds mass, learners over-correct and expect every fire to gain. Both fires gain oxygen; the difference is entirely whether the oxide is a solid or a gas. Magnesium oxide stays; carbon dioxide leaves. Nothing about conservation changed between the two experiments — only the phase of the product."
misconception_de = "Nachdem gerade gelehrt wurde, dass Verbrennen Masse hinzufügt, überkorrigieren Lernende und erwarten, dass jedes Feuer zunimmt. Beide Feuer nehmen Sauerstoff auf; der Unterschied liegt ganz darin, ob das Oxid ein Feststoff oder ein Gas ist. Magnesiumoxid bleibt; Kohlenstoffdioxid entweicht. An der Erhaltung hat sich zwischen den beiden Experimenten nichts geändert — nur die Phase des Produkts."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Conservation clamped to the crucible, from the other side this time: gases do not count as mass leaving, so the reading should hold."
reveals_de = "Die Erhaltung wird wieder auf den Tiegel festgeklammert, diesmal von der anderen Seite: Gase zählen nicht als entweichende Masse, also sollte der Messwert bestehen bleiben."
next = "Seal it and burn — Lavoisier's move: closed, the reading holds exactly; open, the CO₂ carries its mass out of the top. Same law both times, boundary drawn honestly once."
next_de = "Verschließe es und verbrenne — Lavoisiers Schachzug: geschlossen bleibt der Messwert exakt bestehen; offen trägt das CO₂ seine Masse nach oben davon. Dasselbe Gesetz beide Male, die Grenze einmal ehrlich gezogen."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "The previous lesson over-corrected into a new rule: burning adds oxygen, oxygen has mass, so every ash must be heavier — the product's phase has no place in the rule yet."
reveals_de = "Die vorherige Lehre überkorrigierte zu einer neuen Regel: Verbrennen fügt Sauerstoff hinzu, Sauerstoff hat Masse, also muss jede Asche schwerer sein — die Phase des Produkts hat in der Regel noch keinen Platz."
next = "Grant the premise, then ask where the oxide *is*: MgO sits in the crucible; CO₂ is in the room. Both fires gained oxygen — weigh the leaving gas instead (`mass-in-an-open-vessel`) and carbon's gain reappears, airborne."
next_de = "Gewähre die Prämisse und frage dann, wo das Oxid *ist*: MgO sitzt im Tiegel; CO₂ ist im Raum. Beide Feuer haben Sauerstoff aufgenommen — wiege stattdessen das entweichende Gas (`mass-in-an-open-vessel`), und der Zuwachs des Kohlenstoffs erscheint wieder, in der Luft."

[reaction.registers]
lv1 = "The charcoal glows orange and then there is nothing left to weigh. It did the same thing the magnesium did — it joined with the air — but what it made was invisible and floated off. That is why bonfires look like destruction and why people believed for centuries that burning destroyed things."
lv1_de = "Die Holzkohle glüht orange, und dann bleibt nichts mehr zu wiegen übrig. Sie tat dasselbe wie das Magnesium — sie verband sich mit der Luft —, aber was dabei entstand, war unsichtbar und schwebte davon. Deshalb sehen Lagerfeuer wie Zerstörung aus, und deshalb glaubten Menschen jahrhundertelang, dass Verbrennen Dinge zerstört."
lv2 = "0.0999 mol of C (1.20 g ÷ 12.011) becomes 0.0999 mol of CO₂ — 4.40 g of gas, all of it gone from the crucible, which reads 0.00 g. The system gained 3.20 g of oxygen and the vessel lost 1.20 g of carbon; the two experiments differ in the phase of the product and in nothing else."
lv2_de = "0,0999 mol C (1,20 g ÷ 12,011) werden zu 0,0999 mol CO₂ — 4,40 g Gas, vollständig aus dem Tiegel verschwunden, der 0,00 g zeigt. Das System nahm 3,20 g Sauerstoff auf, und das Gefäß verlor 1,20 g Kohlenstoff; die beiden Experimente unterscheiden sich in der Phase des Produkts und in nichts sonst."
lv3 = "The adiabatic flame settles at 2216 °C against magnesium's 2769 °C, and the gap is not about which reaction is 'stronger' — carbon's ΔH per mole of O₂ is comparable — but about where the energy goes: the product here is a gas that carries it away in translational and vibrational modes, while magnesia is a condensed phase with far less to absorb. Flame temperature is an enthalpy balance, not a ranking of fuels."
lv3_de = "Die adiabatische Flamme pendelt sich bei 2216 °C ein, gegenüber 2769 °C bei Magnesium, und der Unterschied liegt nicht daran, welche Reaktion 'stärker' ist — Kohlenstoffs ΔH pro Mol O₂ ist vergleichbar —, sondern daran, wohin die Energie geht: Das Produkt hier ist ein Gas, das sie in Translations- und Schwingungsmoden mit sich forträgt, während Magnesiumoxid eine kondensierte Phase mit weit weniger Aufnahmefähigkeit ist. Flammtemperatur ist eine Enthalpiebilanz, keine Rangliste von Brennstoffen."

