# ================================================ ratios, limits and yields

[[reaction]]
id = "stoichiometric-ratio-from-the-equation"
spine = ["chemisches-rechnen"]
equation = "2 Mg + O₂ → 2 MgO   ·   2.40 g Mg → 3.98 g MgO, a ratio of 40.304 : 24.305"
concepts = ["stoichiometric-ratio", "balanced-equations"]
requires = ["amount-of-substance", "combustion"]
calculations = ["moles-from-mass", "stoichiometry", "mass-from-moles"]
models = ["particle-model", "conservation-of-atoms"]
apparatus = ["crucible", "balance", "tongs", "bunsen"]

[[reaction.curriculum]]
system = "nrw-kernlehrplan-g9"
stage = "Sek I, Erste Stufe (Jg. 7/8), IF3 Verbrennung — quantitative Betrachtung"
ages = { min = 12.0, max = 14.0 }
source = "Kernlehrplan Chemie Gymnasium G9 NRW, Heft 3415 (RdErl. 23.06.2019, Amtsblatt 07-08/19)"

[reaction.setup]
script = """
add v1 Mg 2.4g
measure v1 balance
ignite v1
measure v1 balance
"""

[reaction.expect]
events = ["ignited", "consumed:Mg", "precipitated:MgO"]
temperature_c = { min = 2600.0, max = 2900.0 }

[reaction.expect.predict]
question = "Burn 2.40 g of magnesium ribbon completely. The balanced equation is 2 Mg + O₂ → 2 MgO. M(Mg) = 24.305, M(MgO) = 40.304 g/mol. What mass of white powder is left?"
question_de = "Verbrenne 2,40 g Magnesiumband vollständig. Die ausgeglichene Reaktionsgleichung lautet 2 Mg + O₂ → 2 MgO. M(Mg) = 24,305, M(MgO) = 40,304 g/mol. Welche Masse weißes Pulver bleibt zurück?"
options = [
  "2.40 g — mass is conserved",
  "3.98 g",
  "1.44 g — some burns away",
  "4.80 g — one oxygen per magnesium doubles it",
]
answer = 1
misconception = "The first option is conservation of mass misapplied: mass is conserved in the universe, not in an open crucible that is drawing oxygen out of the room. The last comes from reading '2 Mg + O₂' as though each magnesium takes a whole O₂ rather than half of one."
misconception_de = "Die erste Option ist die falsch angewendete Massenerhaltung: Masse bleibt im Universum erhalten, nicht in einem offenen Tiegel, der Sauerstoff aus dem Raum zieht. Die letzte entsteht dadurch, dass '2 Mg + O₂' so gelesen wird, als würde jedes Magnesium ein ganzes O₂ aufnehmen statt eines halben."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Conservation applied to the crucible instead of the system: what the balance saw at the start is all there is, and the invisible reactant drawn from the room has no line in the ledger."
reveals_de = "Die Erhaltung wird auf den Tiegel angewendet statt auf das System: Was die Waage zu Beginn sah, ist alles, was es gibt, und das unsichtbare Edukt, das aus dem Raum gezogen wird, hat keine Zeile im Buch."
next = "`burning-makes-it-heavier` is this confrontation staged on a balance: the ash outweighs the ribbon by precisely the oxygen's mass. Conservation holds — over ribbon plus air, not over the crucible alone."
next_de = "`burning-makes-it-heavier` inszeniert genau diese Konfrontation auf einer Waage: Die Asche wiegt mehr als das Band, um genau die Masse des Sauerstoffs. Die Erhaltung gilt — für Band plus Luft, nicht für den Tiegel allein."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Burning is loss: fire consumes, so less remains — the campfire's log-to-ash prototype applied to a metal."
reveals_de = "Verbrennen ist Verlust: Feuer verzehrt, also bleibt weniger übrig — der Lagerfeuer-Prototyp 'Holzscheit wird zu Asche' wird auf ein Metall übertragen."
next = "Weigh it: 3.98 g from 2.40. The campfire was not lying — its loss left as gas. Magnesium's product is a solid, so the oxygen it took stays on the balance (`burning-makes-it-lighter` runs the prototype itself, for contrast)."
next_de = "Wiege es: 3,98 g aus 2,40. Das Lagerfeuer hat nicht gelogen — sein Verlust verließ es als Gas. Magnesiums Produkt ist ein Feststoff, also bleibt der aufgenommene Sauerstoff auf der Waage (`burning-makes-it-lighter` führt den Prototyp selbst vor, zum Vergleich)."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "The coefficients read pairwise: '2 Mg + O₂' as each magnesium taking a whole O₂, the 2:1 ratio collapsed into 1:1."
reveals_de = "Die Koeffizienten werden paarweise gelesen: '2 Mg + O₂', als nähme jedes Magnesium ein ganzes O₂ auf, das Verhältnis 2:1 wird zu 1:1 zusammengefasst."
next = "Count atoms through the equation: two magnesiums share one O₂ — one oxygen atom each, 16 g per mole of metal, not 32. The molar masses in the question already contain the answer: 2.40 g × 40.304/24.305 = 3.98 g."
next_de = "Zähle die Atome anhand der Gleichung: zwei Magnesiumatome teilen sich ein O₂ — je ein Sauerstoffatom, 16 g pro Mol Metall, nicht 32. Die molaren Massen in der Aufgabe enthalten die Antwort bereits: 2,40 g × 40,304/24,305 = 3,98 g."

[reaction.registers]
lv1 = "Weigh the ribbon: 2.40 g. Burn it. Weigh the ash: 3.98 g. Do it again with twice as much ribbon and you get twice as much ash — the relationship between what you start with and what you end with is fixed, and once you know it for one piece you know it for every piece."
lv1_de = "Wiege das Band: 2,40 g. Verbrenne es. Wiege die Asche: 3,98 g. Wiederhole es mit doppelt so viel Band, und du bekommst doppelt so viel Asche — die Beziehung zwischen dem, womit du beginnst, und dem, womit du endest, ist fest, und kennst du sie für ein Stück, kennst du sie für jedes."
lv2 = "0.0987 mol of Mg (2.40 g ÷ 24.305 g/mol) gives 0.0987 mol of MgO by the 2:2 ratio in the equation, which is 3.98 g (× 40.304 g/mol). The bench reports exactly 0.0987 mol of MgO and a balance reading of 3.98 g. The equation is not decoration — it is the conversion factor."
lv2_de = "0,0987 mol Mg (2,40 g ÷ 24,305 g/mol) ergeben nach dem Verhältnis 2:2 in der Gleichung 0,0987 mol MgO, das sind 3,98 g (× 40,304 g/mol). Das Labor meldet exakt 0,0987 mol MgO und einen Waagenwert von 3,98 g. Die Reaktionsgleichung ist keine Dekoration — sie ist der Umrechnungsfaktor."
lv3 = "The 1:1 mole ratio survives because the Gibbs minimiser conserves the magnesium element budget exactly; oxygen is drawn from the atmospheric reservoir rather than the vessel's inventory, which is what makes the mass ratio 40.304/24.305 = 1.658 appear on the balance. At the 3042 K the solve settles to, gaseous Mg and MgO are thermodynamically accessible; they do not appear in the products because the condensed oxide dominates at 1 bar."
lv3_de = "Das Molverhältnis 1:1 bleibt erhalten, weil der Gibbs-Minimierer das Elementbudget des Magnesiums exakt einhält; Sauerstoff wird aus dem atmosphärischen Reservoir gezogen statt aus dem Inventar des Gefäßes, wodurch das Massenverhältnis 40,304/24,305 = 1,658 auf der Waage erscheint. Bei den 3042 K, auf die sich die Lösung einpendelt, sind gasförmiges Mg und MgO thermodynamisch zugänglich; sie erscheinen nicht in den Produkten, weil das kondensierte Oxid bei 1 bar dominiert."

