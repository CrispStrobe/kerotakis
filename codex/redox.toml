[[reaction]]
id = "silver-does-not-stoop"
spine = ["die-spannungsreihe-der-metalle"]
summary = "The series is an order: metallic silver in copper sulfate does nothing, and the nothing is a computed result"
summary_de = "Die Spannungsreihe ist eine Ordnung: Metallisches Silber in Kupfersulfat tut nichts, und dieses Nichts ist ein berechnetes Ergebnis"
concepts = ["activity-series"]
requires = ["activity-series"]
apparatus = ["beaker"]
[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium NTG Jgst. 9, LB Donator-Akzeptor-Konzept — Redoxreaktionen"
ages = { min = 14.0, max = 15.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium NTG Jgst. 9 (ISB) — the non-reaction as the series’ negative prediction"

[[reaction.curriculum]]
system = "england-gcse-combined-science"
stage = "GCSE Combined Science: Trilogy (AQA 8464), 4.4.1 Reactivity of metals"
ages = { min = 14.0, max = 16.0 }
source = "AQA GCSE Combined Science: Trilogy specification (8464), Section 4.4.1 — predicting no reaction from the reactivity series is required content"

[reaction.setup]
script = """
add v1 water 100mL
add v1 CuSO4 0.01mol
add v1 Ag 0.02mol
"""

[reaction.expect]
events = ["dissolved:CuSO4", "inert:Ag"]
ph = { min = 4.4, max = 4.7 }

[reaction.expect.predict]
question = "The silver tree showed copper metal trading itself for silver ions. Now reverse the cast: silver metal into copper sulfate. What happens?"
question_de = "Der Silberbaum zeigte, wie Kupfermetall sich gegen Silber-Ionen eintauscht. Jetzt vertausche die Rollen: Silbermetall in Kupfersulfat. Was passiert?"
options = [
  "The mirror image — copper plates onto the silver",
  "Nothing at all, ever: the trade only runs downhill",
  "It works, but slower, because silver is heavier",
]
answer = 1
misconception = "If A displaces B, learners often expect B to displace A in the right mood — reactions as reversible courtesies. The series is an order, not a mood: electrons run from the lower metal to the higher ion and never back up under these conditions. Silver sits above copper, so silver metal facing Cu²⁺ has nothing to gain, and the bench reports the nothing as a verdict with a reason, not as an empty transcript."
misconception_de = "Verdrängt A das B, erwarten Lernende oft, dass B unter passenden Umständen auch A verdrängt — Reaktionen als umkehrbare Gefälligkeiten. Die Spannungsreihe ist eine Ordnung, keine Stimmung: Elektronen fließen vom niedrigeren Metall zum höheren Ion und laufen unter diesen Bedingungen nie zurück. Silber steht über Kupfer, also hat Silbermetall gegenüber Cu²⁺ nichts zu gewinnen, und das Labor meldet dieses Nichts als begründetes Urteil, nicht als leeres Protokoll."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Displacement as a symmetric swap: if copper trades for silver, silver must trade for copper — direction is not part of the rule yet."
reveals_de = "Verdrängung als symmetrischer Tausch: Wenn Kupfer sich gegen Silber eintauscht, muss auch Silber sich gegen Kupfer eintauschen — die Richtung ist in dieser Vorstellung noch kein Teil der Regel."
next = "Put both experiments side by side (`the-silver-tree` and this beaker): same pair of metals, opposite castings, and only one direction moves. The order IS the chemistry — E° +0.80 V does not hand electrons to +0.34 V."
next_de = "Stelle beide Experimente nebeneinander (`the-silver-tree` und dieses Becherglas): dasselbe Metallpaar, entgegengesetzte Besetzung, und nur eine Richtung bewegt sich. Die Ordnung IST die Chemie — E° +0,80 V reicht keine Elektronen an +0,34 V weiter."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Rate reached for where thermodynamics is the barrier: 'slower' keeps the reaction possible, just lazy — the idea that a reaction can be flatly unavailable is missing."
reveals_de = "Man greift zur Geschwindigkeit, wo die Thermodynamik die Barriere ist: 'langsamer' hält die Reaktion für möglich, nur träge — der Gedanke, dass eine Reaktion schlicht nicht verfügbar sein kann, fehlt."
next = "Wait as long as you like: this is not `why-the-shelf-is-not-on-fire`, where the reaction is downhill and blocked by a barrier. Here there is no downhill — the electron would have to move against the potential difference, and no amount of patience pays that bill. Slow and never are different physics, and this beaker is the second kind."
next_de = "Warte, so lange du willst: Dies ist nicht `why-the-shelf-is-not-on-fire`, wo die Reaktion bergab läuft und nur von einer Barriere blockiert wird. Hier gibt es kein Bergab — das Elektron müsste sich gegen die Potenzialdifferenz bewegen, und keine noch so große Geduld begleicht diese Rechnung. Langsam und nie sind unterschiedliche Physik, und dieses Becherglas ist die zweite Sorte."

[reaction.registers]
lv1 = "Last time, copper gave and silver took. Swap them around — silver metal into blue copper water — and nothing happens. Not slowly: not at all. The trade only ever runs one way down the ladder."
lv1_de = "Letztes Mal gab Kupfer, und Silber nahm. Vertausche die Rollen — Silbermetall in blaues Kupferwasser — und es passiert nichts. Nicht langsam: überhaupt nicht. Der Tausch läuft immer nur in eine Richtung die Leiter hinab."
lv2 = "Ag (E° +0.80 V) above Cu²⁺/Cu (+0.34 V): the cell potential for silver reducing copper is negative, so no reaction — the beaker keeps its blue, its copper stays dissolved, and the silver is reported inert with the potentials in the message."
lv2_de = "Ag (E° +0,80 V) steht über Cu²⁺/Cu (+0,34 V): Das Zellpotenzial dafür, dass Silber Kupfer reduziert, ist negativ, also keine Reaktion — das Becherglas behält sein Blau, sein Kupfer bleibt gelöst, und das Silber wird als inert gemeldet, mit den Potenzialen in der Meldung."
lv3 = "The pair of entries is the lesson: `the-silver-tree` and this beaker differ only in which side starts as metal, and the series decides both outcomes from one ordering. The inert verdict is an Event carrying its reason (E° +0.800 V against +0.342 V), which is what lets this codex claim `inert:Ag` and have the lint verify a nothing — a negative result checkable by machine, in the tradition of `a-spark-that-changes-nothing`."
lv3_de = "Das Eintragspaar ist die Lektion: `the-silver-tree` und dieses Becherglas unterscheiden sich nur darin, welche Seite als Metall beginnt, und die Spannungsreihe entscheidet beide Ausgänge aus ein und derselben Ordnung. Das Urteil 'inert' ist ein Event, das seinen Grund mit sich trägt (E° +0,800 V gegenüber +0,342 V) — genau das erlaubt diesem Codex, `inert:Ag` zu behaupten und den Lint ein Nichts überprüfen zu lassen: ein negatives Ergebnis, maschinell nachprüfbar, in der Tradition von `a-spark-that-changes-nothing`."

