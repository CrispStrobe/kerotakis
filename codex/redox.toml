# The Kerotakis codex — redox: electrons changing hands, counted.
#
# These entries ride the coupled electron balance (P3e): an oxidant and a
# reductant in one beaker genuinely react, the stoichiometry falls out of
# free-energy minimisation rather than being encoded, and pe/Eh are
# surfaced when a couple the user put there defines them. Boundaries,
# stated because this lab states them: past the equivalence point the
# coupling stands down (the excess would owe electrons to the solvent,
# which is not modelled) — so no entry here claims an endpoint
# observation; chloride is not oxidisable on this bench (a curated rate
# claim); and sulfuric acid's dilution heat is not curated, so no entry
# uses it as a warming demonstration.
#
# Licence: the codex is CC BY-SA 4.0, separately from the AGPL code.

[[reaction]]
id = "permanganate-counts-in-fives"
spine = ["redox-reaktionen"]
equation = "MnO₄⁻ + 5 Fe²⁺ + 8 H⁺ → Mn²⁺ + 5 Fe³⁺ + 4 H₂O"
concepts = ["redox-reactions", "electron-transfer"]
requires = ["oxidation", "acids"]
apparatus = ["beaker", "burette"]
calculations = ["moles-from-mass", "electron-bookkeeping"]

[reaction.setup]
script = """
add v1 water 100mL
add v1 H2SO4 0.005mol
add v1 FeSO4 0.005mol
add v1 KMnO4 0.0005mol
"""

[reaction.expect]
events = ["dissolved:FeSO4", "dissolved:KMnO4"]
ph = { min = 1.6, max = 1.7 }

[reaction.expect.predict]
question = "Half a millimole of potassium permanganate goes into a beaker holding five millimoles of iron(II) in dilute sulfuric acid. How much of the iron ends up as iron(III)?"
options = [
  "0.0005 mol — one permanganate oxidises one iron",
  "0.0025 mol — each permanganate takes exactly five",
  "All 0.005 mol — permanganate is the strongest oxidiser in the school cupboard",
]
answer = 1
misconception = "Two miscounts, same root: reactions imagined particle-to-particle. The exchange rate is set by electrons, not by formula units — each manganese falls from +7 to +2 and accepts five, each iron climbs one step and gives one. And strength is not appetite: how far an oxidiser can pull electrons says nothing about how many it can hold."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Reactions pair off formula unit to formula unit — one particle, one victim. The electron ledger underneath has no line in the picture."
next = "Count electrons instead of particles: manganese falls from +7 to +2, five gained; each iron climbs from +2 to +3, one given. `inspect` shows the beaker did that arithmetic — 0.0025 mol oxidised, exactly five per permanganate."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Strength read as appetite: a strong oxidiser 'takes everything', as if potency multiplied capacity."
next = "Strength says how far downhill the electrons fall, not how many the oxidant can catch: 0.0005 mol of Mn(VII) has room for exactly 0.0025 mol of them. `inspect` the rest of the iron — still Fe(II), waiting for more oxidant, which is what makes titrating it possible at all."

[reaction.registers]
lv1 = "The purple vanishes the moment it lands — the beaker drinks the colour. And it drinks by strict counts: every measure of purple uses up exactly five measures of the dissolved iron. Never four, never six."
lv2 = "MnO₄⁻ + 5 Fe²⁺ + 8 H⁺ → Mn²⁺ + 5 Fe³⁺ + 4 H₂O. Manganese gains five electrons, each iron gives one, so 0.0005 mol of permanganate oxidises exactly 0.0025 mol of iron — and the bench reads: Fe: 50% Fe(III), 50% Fe(II)."
lv3 = "The 5:1 is not encoded anywhere. The engine holds one electron balance across the coupled elements and minimises free energy; the ratio falls out, to four figures — 0.002500 mol of each iron state in the inventory. Two further things the careful reader should see: the pH rose from 1.42 to 1.65 because the reaction consumed eight protons per permanganate — the acid is a reagent, not scenery — and the bench names what it declines to model: the fresh Fe(III) is supersaturated against Hematite and Goethite, phases wateq4f.dat knows but this registry cannot yet name, so they are reported rather than silently precipitated."

[reaction.provenance]
source = "Standard curriculum permanganometry; coupled electron balance, speciation and log K data from PHREEQC wateq4f.dat (USGS). Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "PHREEQC via Kerotakis L2, coupled electron balance (P3e)"

[[reaction]]
id = "half-oxidised-iron-reads-its-own-potential"
spine = ["redox-reaktionen", "die-elektrochemie"]
summary = "At half-oxidation, Eh reads the Fe(III)/Fe(II) couple's own formal potential — +0.674 V here, below the tabulated 0.771 V, because sulfate binds Fe(III) harder than Fe(II)"
concepts = ["formal-potential", "electron-transfer"]
requires = ["redox-reactions"]
apparatus = ["beaker", "burette"]
calculations = ["nernst-at-the-midpoint"]

[reaction.setup]
script = """
add v1 water 100mL
add v1 H2SO4 0.005mol
add v1 FeSO4 0.005mol
add v1 KMnO4 0.0005mol
"""

[reaction.expect]
events = ["dissolved:KMnO4"]
ph = { min = 1.6, max = 1.7 }

[reaction.expect.predict]
question = "Stop the permanganate titration exactly half-way: half the iron is Fe(II), half is Fe(III). A voltmeter against a standard hydrogen electrode reads…"
options = [
  "+0.77 V — the tabulated E° of Fe³⁺/Fe²⁺",
  "About +0.67 V — noticeably below the table",
  "+1.51 V — permanganate's own E°, since permanganate did the oxidising",
]
answer = 1
misconception = "The tabulated 0.771 V describes bare aquo-ions at unit activity, and this beaker holds neither: sulfate binds Fe(III) far more strongly than Fe(II), pulling the free-Fe(III) activity down and the potential with it. What the meter reads is the formal potential in this medium — the number analysts actually use. And 1.51 V confuses the agent with the state: the permanganate is spent, and a couple with one member missing has no potential to impose."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "The table is the meter: E° as the couple's fixed reading, medium irrelevant — the redox twin of reading pKa as the pH of any acid bottle."
next = "This lab has taught the conditional-constant lesson twice already with protons — `half-neutralised-vinegar` and `phosphate-buffer` — and this is it carried to electrons. Look at the lv3 speciation: most Fe(III) sits bound as FeSO₄⁺ and Fe(SO₄)₂⁻ while Fe(II) swims nearly free; the imbalance is the missing 0.1 V."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "The potential belongs to the strongest actor: permanganate did the oxidising, so its number must be the answer — even after the permanganate is gone."
next = "`inspect` the beaker: the permanganate is spent to the last nanomole, and a couple with only one member present has nothing to say to an electrode. The meter listens to the couple with both members swimming — Fe(III)/Fe(II), sitting at 50/50."

[reaction.registers]
lv1 = "Stop half-way and the beaker holds a perfect balance: half the iron changed, half not. A meter dipped in now reads the iron's own number — the mark it always shows when it is exactly half-way through changing."
lv2 = "At [Fe³⁺] = [Fe²⁺] the log term of the Nernst equation vanishes and Eh = E°′ — exactly as a half-neutralised weak acid reads its own pKa. The bench reports pe 11.40, which is Eh = +0.674 V."
lv3 = "The table says 0.771 V; this meter says 0.674 V, and both are right about different solutions. The tabulated E° assumes bare aquo-ions at unit activity. Here the computed speciation shows Fe(III) mostly bound as FeSO₄⁺ and Fe(SO₄)₂⁻ while Fe(II) is barely complexed, so the free-Fe(III) activity — the thing the electrode responds to — is depressed, and the potential falls with it. Analytical chemistry calls the result the formal potential and quotes about 0.68 V for this couple in sulfuric media; the bench arrived at it from the database's complexation constants rather than being told. It is the phosphate buffer's lesson — the constant is conditional on the medium — carried from protons to electrons."

[reaction.provenance]
source = "Standard curriculum electrochemistry; E° (Fe³⁺/Fe²⁺) = 0.771 V and the ≈0.68 V formal potential in sulfuric media are standard reference values; speciation and complexation from PHREEQC wateq4f.dat (USGS). Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "PHREEQC via Kerotakis L2, coupled electron balance (P3e); Eh from the computed pe"

[[reaction]]
id = "the-oxidant-is-spent-to-the-last-electron"
spine = ["redox-reaktionen"]
equation = "MnO₄⁻ + 5 Fe²⁺ + 8 H⁺ → Mn²⁺ + 5 Fe³⁺ + 4 H₂O"
concepts = ["redox-reactions", "equivalence-point"]
requires = ["redox-reactions"]
apparatus = ["beaker", "burette", "ph-meter"]
calculations = ["electron-bookkeeping", "titration-stoichiometry"]

[reaction.setup]
script = """
add v1 water 100mL
add v1 H2SO4 0.005mol
add v1 FeSO4 0.005mol
add v1 KMnO4 0.001mol
"""

[reaction.expect]
events = ["dissolved:KMnO4"]
ph = { min = 2.0, max = 2.2 }

[reaction.expect.predict]
question = "Now the full 0.001 mol of permanganate — exactly one fifth of the iron's amount — has gone in. What is in the beaker?"
options = [
  "Some of everything — reactions reach equilibrium, so both sides always remain",
  "Purple: an oxidiser this strong always ends up in excess",
  "Iron(III) and manganese(II), complete to the limits of arithmetic — and less acid than before",
]
answer = 2
misconception = "'Equilibrium means leftovers' is the weak-acid lesson over-applied: when the couples sit this far apart, the equilibrium residue is real but lands nine orders of magnitude below the starting amounts — equilibrium and completion are the same statement here. The quieter surprise is the acid: eight protons per permanganate went into the water product, 0.008 of the 0.010 mol in the beaker, and the pH climbed from 1.4 to 2.1 to prove it."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Equilibrium as universal residue: every reaction leaves some of everything, the way the vinegar beaker kept most of its acid intact."
next = "Look at the residue the equilibrium actually leaves (lv3): Fe(II) at 7.1 × 10⁻⁸ mol/kgw — nine orders below where it started. The couples sit far enough apart that 'complete' and 'at equilibrium' are the same sentence, which is exactly what makes this reaction usable for analysis."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "Strength as inexhaustibility: the strong reagent always wins, so it must be the one left standing."
next = "Strength is a potential, not a stock: 0.001 mol of permanganate holds room for exactly 0.005 mol of electrons, and the iron supplied exactly that. One drop more and this bench stands down — `explain` says why: the excess would have to take electrons from the solvent itself, which is not modelled — so the first permanent purple of a real burette's endpoint is chemistry this bench states rather than shows."

[reaction.registers]
lv1 = "The last of the purple disappears like all the rest. The beaker has changed every bit of its iron — and it used up most of its sourness doing it."
lv2 = "0.001 mol of MnO₄⁻ × 5 = 0.005 mol of electron-room: exactly what 0.005 mol of Fe(II) can give. The bench reads: all Fe as Fe(III); all Mn as Mn(II). And 8 × 0.001 = 0.008 mol of the beaker's 0.010 mol of protons went with it — the pH climbed from 1.42 to 2.12."
lv3 = "The equilibrium leftover of Fe(II) is 7.1 × 10⁻⁸ mol/kgw — the 'some of everything' answer is real and nine orders of magnitude too small to matter. Past this point the coupling stands down rather than guess: an oxidant in excess of the reductants would owe its remaining electrons to the solvent, which this bench does not model, so an over-titrated beaker shows its reagents uncoupled and `explain` states the unpaid balance in electron-equivalents. The real burette's endpoint — the first drop that stays purple — is therefore named here as chemistry the engine declines to compute, in this lab's tradition of saying so."

[reaction.provenance]
source = "Standard curriculum permanganometry; coupled electron balance and speciation from PHREEQC wateq4f.dat (USGS). Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "PHREEQC via Kerotakis L2, coupled electron balance (P3e)"

# ------------------------------------------------------- the series itself

[[reaction]]
id = "the-series-decides-who-plates"
spine = ["die-spannungsreihe-der-metalle"]
equation = "Zn + Cu²⁺ → Zn²⁺ + Cu"
concepts = ["activity-series", "displacement-reactions"]
requires = ["redox-reactions"]
apparatus = ["beaker", "thermometer"]
calculations = ["electron-bookkeeping"]

[reaction.setup]
script = """
add v1 water 100mL
add v1 CuSO4 0.05mol
add v1 Zn 0.05mol
"""

[reaction.expect]
events = ["dissolved:CuSO4", "plated:Cu", "consumed:Zn"]
ph = { min = 4.9, max = 5.2 }
temperature_c = { min = 58.5, max = 61.5 }

[reaction.expect.predict]
question = "A strip of zinc goes into blue copper sulfate solution. What happens?"
options = [
  "Nothing — a metal and a dissolved salt have no business with each other without an acid",
  "Copper metal grows on the zinc, the blue fades, and the beaker gets noticeably hot",
  "The zinc dissolves, but the copper stays dissolved too — they just swap places on paper",
]
answer = 1
misconception = "The first answer reserves reactivity for acids; the third concedes the equation but not the matter. Displacement is electrons changing owner for real: zinc sits below copper in the series, so it hands its electrons over, dissolves as Zn²⁺, and the copper ions take the electrons and come out of solution as actual metal on the zinc's surface — with 218.7 kJ/mol to show for it."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Reactivity needs an acid: metals answer to sourness, and a mere salt solution has nothing to attack with."
next = "The attacker is not the acid's proton but any ion below the metal in the series. Watch the beaker: no acid anywhere, and the zinc is consumed while copper plates out — then run `metals-below-hydrogen-fizz`, where the proton takes its turn as just another rung."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "The reaction happens in the equation only — ions swap labels, but nothing in the beaker moves; chemistry as bookkeeping rather than matter."
next = "Check every observable at once: the blue is gone (the Cu²⁺ that carried it is now metal), the thermometer jumped from 33.7 to 59.9 °C, and `inspect` shows solid copper in the inventory where solid zinc used to be. Paper swaps do not release 218.7 kJ/mol."

[reaction.registers]
lv1 = "The grey strip goes into the blue water. Slowly the strip grows a brown-pink fur of real copper, the blue fades away, and the beaker gets properly hot. The zinc traded places with the copper — and the trade throws off heat."
lv2 = "Zn + Cu²⁺ → Zn²⁺ + Cu. Zinc sits below copper in the activity series (E° −0.76 V against +0.34 V), so zinc is oxidised and copper reduced: 0.0500 mol plates out, the solution's blue goes with its Cu²⁺, and the beaker climbs from 33.7 to 59.9 °C — ΔH ≈ −218.7 kJ per mole displaced."
lv3 = "The extent is decided by bisection on the Nernst cell potential over the activities PHREEQC reports, and the heat by the difference of the ions' formation enthalpies, balanced as enthalpy — nothing lists 'zinc displaces copper' anywhere. The same order answers the selective case: offer a zinc strip both Ag⁺ and Cu²⁺ at once and all the silver plates before any copper does, which the engine's own tests assert. Boundaries, stated: the series speaks of thermodynamics at the electrode, not of rates — passivation, overpotentials and oxidising acids are outside it, and the bench says so where they bite."

[reaction.provenance]
source = "Standard curriculum displacement chemistry; E° values from the CRC Handbook (Vanýsek), ion formation enthalpies from NBS/Wagman 1982; extent and heat computed, cross-checked against wateq4f's own metal phases to < 1 mV. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "Kerotakis displacement layer (Nernst over PHREEQC activities, enthalpy-balanced) via Kerotakis L2"

[[reaction]]
id = "metals-below-hydrogen-fizz"
spine = ["die-spannungsreihe-der-metalle"]
equation = "Mg + 2 H⁺ → Mg²⁺ + H₂"
concepts = ["activity-series", "hydrogen-as-a-rung"]
requires = ["activity-series", "acids"]
apparatus = ["beaker", "ph-meter"]
calculations = ["electron-bookkeeping"]

[reaction.setup]
script = """
add v1 water 100mL
add v1 HCl 0.1mol
add v1 Mg 0.02mol
new
add v2 water 100mL
add v2 HCl 0.1mol
add v2 Cu 0.02mol
"""

[reaction.expect]
events = ["gas_evolved:H2", "consumed:Mg", "inert:Cu"]
ph = { min = 0.1, max = 0.4 }

[reaction.expect.predict]
question = "Two strips into two beakers of the same hydrochloric acid: magnesium in one, copper in the other. What happens?"
options = [
  "Both fizz — acid attacks metal, that is what acid does",
  "Neither fizzes — solid metal is too tough for a liquid",
  "Only the magnesium fizzes; the copper sits in acid indefinitely, untouched",
]
answer = 2
misconception = "Both wrong answers treat 'metal' as one substance with one behaviour towards acid. The series is the correction: hydrogen has its own rung (E° = 0 by definition), and only metals below it can push electrons onto protons. Magnesium is far below and fizzes hydrogen; copper is above, so in this acid it has nothing to gain and does exactly nothing — which the bench states as a result, not an absence."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Acid attacks metal, universally — the fizz is a property of the acid, and any metal will do as the victim."
next = "Run both beakers side by side: the acid is identical, the outcomes are not. The deciding rung is hydrogen's own place in the series — the acid can only oxidise metals that sit below it, and copper does not."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "Solids outrank liquids: a lump of metal is imagined as simply too substantial for a watery acid to touch."
next = "Watch the magnesium vessel: 0.0200 mol of hydrogen leaves as gas and the metal is consumed entirely. Toughness is not a chemical category — position in the series is, and the same 'watery acid' that ignores copper eats magnesium completely."

[reaction.registers]
lv1 = "Same sour liquid, two different metals. The silvery magnesium fizzes furiously and disappears. The copper just sits there, day after day, completely unbothered. Metals take turns by rank — and the acid can only touch the ones below a certain line."
lv2 = "Mg + 2 H⁺ → Mg²⁺ + H₂↑ (E° Mg²⁺/Mg = −2.37 V, well below hydrogen's 0.00 V): 0.0200 mol of H₂ evolves and the pH climbs from −0.04 to 0.23. Copper (E° +0.34 V, above hydrogen) is reported inert: nothing to gain, nothing happens."
lv3 = "Two boundaries earn their sentence here. Non-oxidising acids only: nitric acid dissolves copper by a different oxidant (the nitrate), so 'copper resists acid' is a claim about HCl and its kin, and the series as computed here says nothing about HNO₃. And kinetics: thermodynamically even plain water should attack magnesium — drop it in salt water and the bench declines with a stated rate gap rather than either dissolving it or calling it stable. The inert verdict, meanwhile, is an Event, not a silence — the negative result is first-class, in this lab's tradition."

[reaction.provenance]
source = "Standard curriculum reactivity of metals with acids; E° values from the CRC Handbook (Vanýsek); H⁺/H₂ = 0 V by definition of the standard hydrogen electrode. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "Kerotakis displacement layer (Nernst over PHREEQC activities) via Kerotakis L2"

[[reaction]]
id = "the-silver-tree"
spine = ["die-spannungsreihe-der-metalle"]
equation = "Cu + 2 Ag⁺ → Cu²⁺ + 2 Ag"
concepts = ["activity-series", "displacement-reactions"]
requires = ["activity-series"]
apparatus = ["beaker"]
calculations = ["electron-bookkeeping"]

[reaction.setup]
script = """
add v1 water 100mL
add v1 AgNO3 0.02mol
add v1 Cu 0.05mol
"""

[reaction.expect]
events = ["dissolved:AgNO3", "plated:Ag", "consumed:Cu"]
ph = { min = 4.0, max = 4.4 }

[reaction.expect.predict]
question = "A copper wire stands in a colourless silver nitrate solution. What do you see over the next hour?"
options = [
  "Nothing — silver is a noble metal, and noble metals do not react",
  "Silver crystals grow on the wire while the solution turns blue",
  "The wire dissolves completely and both metals end up in solution",
]
answer = 1
misconception = "'Noble' describes the metal, not the ion — metallic silver resists attack, but a silver ion is silver that has already lost its electron and wants one back, and copper below it in the series is willing to pay. Two silvers plate per copper dissolved (one electron each against copper's two), and the arriving Cu²⁺ brings the blue: the colour change is the electron transfer made visible."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Nobility as a blanket property: silver is unreactive, so anything labelled silver — metal or ion — must stay as it is."
next = "Separate the metal from its ion: `silver-does-not-stoop` shows metallic silver genuinely refusing copper sulfate, while this beaker shows the silver ION taking electrons eagerly. The nobility belongs to the filled state, not the name — an Ag⁺ is a silver that has already been robbed."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Displacement as mutual dissolution — reactions mix everything into solution; that one metal must leave solution for the other to enter is not in the picture."
next = "Count the electrons: they have to go somewhere, and the only taker is Ag⁺, which becomes solid metal by accepting them — 0.0200 mol of silver plated for 0.0100 mol of copper dissolved, on the balance and in the inventory. Electrons conserved is why displacement is a swap, never a merger."

[reaction.registers]
lv1 = "The copper wire grows glittering needles of real silver, like frost — and as the tree grows, the water around it slowly turns blue. The wire is trading itself for silver, one electron at a time."
lv2 = "Cu + 2 Ag⁺ → Cu²⁺ + 2 Ag: copper (E° +0.34 V) sits below silver (+0.80 V), so copper dissolves and silver plates — 0.0200 mol of Ag for 0.0100 mol of Cu, two-for-one by electron count. The blue is the arriving Cu²⁺; the pH drifts from 6.46 to 4.19 as the new copper ion hydrolyses (`copper-sulfate-is-blue-and-acidic` is that story on its own)."
lv3 = "The stoichiometry is not written anywhere: one electron per silver against two per copper falls out of the same electron bookkeeping as permanganate's five (`permanganate-counts-in-fives`), and the colour is computed from the curated Cu²⁺ absorptivity, not asserted. The heat is small and real — 23.9 to 27.4 °C from the ions' formation enthalpies. This experiment is the one Faraday's silver coulometer industrialised: the two-for-one is an electron count you can weigh."

[reaction.provenance]
source = "Standard curriculum displacement (the silver tree); E° values from the CRC Handbook (Vanýsek), formation enthalpies NBS/Wagman 1982. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "Kerotakis displacement layer (Nernst over PHREEQC activities, enthalpy-balanced) via Kerotakis L2"

[[reaction]]
id = "silver-does-not-stoop"
spine = ["die-spannungsreihe-der-metalle"]
summary = "The series is an order: metallic silver in copper sulfate does nothing, and the nothing is a computed result"
concepts = ["activity-series"]
requires = ["activity-series"]
apparatus = ["beaker"]

[reaction.setup]
script = """
add v1 water 100mL
add v1 CuSO4 0.01mol
add v1 Ag 0.02mol
"""

[reaction.expect]
events = ["dissolved:CuSO4", "inert:Ag"]
ph = { min = 4.4, max = 4.7 }

[reaction.expect.predict]
question = "The silver tree showed copper metal trading itself for silver ions. Now reverse the cast: silver metal into copper sulfate. What happens?"
options = [
  "The mirror image — copper plates onto the silver",
  "Nothing at all, ever: the trade only runs downhill",
  "It works, but slower, because silver is heavier",
]
answer = 1
misconception = "If A displaces B, learners often expect B to displace A in the right mood — reactions as reversible courtesies. The series is an order, not a mood: electrons run from the lower metal to the higher ion and never back up under these conditions. Silver sits above copper, so silver metal facing Cu²⁺ has nothing to gain, and the bench reports the nothing as a verdict with a reason, not as an empty transcript."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Displacement as a symmetric swap: if copper trades for silver, silver must trade for copper — direction is not part of the rule yet."
next = "Put both experiments side by side (`the-silver-tree` and this beaker): same pair of metals, opposite castings, and only one direction moves. The order IS the chemistry — E° +0.80 V does not hand electrons to +0.34 V."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Rate reached for where thermodynamics is the barrier: 'slower' keeps the reaction possible, just lazy — the idea that a reaction can be flatly unavailable is missing."
next = "Wait as long as you like: this is not `why-the-shelf-is-not-on-fire`, where the reaction is downhill and blocked by a barrier. Here there is no downhill — the electron would have to move against the potential difference, and no amount of patience pays that bill. Slow and never are different physics, and this beaker is the second kind."

[reaction.registers]
lv1 = "Last time, copper gave and silver took. Swap them around — silver metal into blue copper water — and nothing happens. Not slowly: not at all. The trade only ever runs one way down the ladder."
lv2 = "Ag (E° +0.80 V) above Cu²⁺/Cu (+0.34 V): the cell potential for silver reducing copper is negative, so no reaction — the beaker keeps its blue, its copper stays dissolved, and the silver is reported inert with the potentials in the message."
lv3 = "The pair of entries is the lesson: `the-silver-tree` and this beaker differ only in which side starts as metal, and the series decides both outcomes from one ordering. The inert verdict is an Event carrying its reason (E° +0.800 V against +0.342 V), which is what lets this codex claim `inert:Ag` and have the lint verify a nothing — a negative result checkable by machine, in the tradition of `a-spark-that-changes-nothing`."

[reaction.provenance]
source = "Standard curriculum activity series (direction of displacement); E° values from the CRC Handbook (Vanýsek). Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "Kerotakis displacement layer (Nernst over PHREEQC activities) via Kerotakis L2"

[[reaction]]
id = "zinc-guards-iron"
spine = ["korrosion-und-korrosionsschutz"]
equation = "Zn + Fe²⁺ → Zn²⁺ + Fe"
concepts = ["activity-series", "sacrificial-protection"]
requires = ["activity-series"]
apparatus = ["beaker"]
calculations = ["electron-bookkeeping"]

[reaction.setup]
script = """
add v1 water 100mL
add v1 FeSO4 0.02mol
add v1 Zn 0.01mol
"""

[reaction.expect]
events = ["dissolved:FeSO4", "plated:Fe", "consumed:Zn"]
ph = { min = 4.0, max = 4.4 }

[reaction.expect.predict]
question = "A lump of zinc sits in iron(II) sulfate solution. What happens — and why do steel ship hulls carry bolted-on zinc blocks?"
options = [
  "Nothing; zinc and iron are too similar to bother each other",
  "Iron metal plates out while the zinc dissolves — zinc gives its electrons first, which is exactly the sacrifice the hull block makes",
  "The zinc rusts instead of the iron, because rust prefers the more reactive metal",
