[[reaction]]
id = "lead-stands-in-its-own-acid"
spine = ["akkumulatoren"]
summary = "Lead sits below hydrogen in the series, yet a car battery's plates stand in acid for years — the +0.13 V driving force cannot pay hydrogen's ~0.88 V overpotential on lead, and that unpaid bill is the battery's existence"
summary_de = "Blei steht in der Spannungsreihe unter Wasserstoff, und doch stehen die Platten einer Autobatterie jahrelang in Säure — die Triebkraft von +0,13 V kann die ~0,88 V Überspannung des Wasserstoffs auf Blei nicht begleichen, und genau diese unbeglichene Rechnung ist die Existenzgrundlage der Batterie"
concepts = ["accumulators", "activity-series"]
requires = ["activity-series"]
apparatus = ["beaker"]
[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 12, LB Redoxchemie — Akkumulatoren"
ages = { min = 17.0, max = 18.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Oberstufe (ISB) — the lead-acid accumulator and the role of kinetic barriers"

[reaction.setup]
script = """
add v1 water 100mL
add v1 HCl 0.1mol
add v1 Pb 0.02mol
new
add v2 water 100mL
add v2 Pb(NO3)2 0.01mol
add v2 Zn 0.02mol
"""

[reaction.expect]
events = ["inert:Pb", "plated:Pb", "consumed:Zn"]
ph = { min = -0.15, max = 0.05 }

[reaction.expect.predict]
question = "A car battery is lead plates standing in strong acid, for years. Lead sits below hydrogen in the activity series, so the acid should dissolve it. Why doesn't it?"
question_de = "Eine Autobatterie besteht aus Bleiplatten, die jahrelang in starker Säure stehen. Blei steht in der Spannungsreihe unter Wasserstoff, also müsste die Säure es auflösen. Warum tut sie das nicht?"
options = [
  "The series is simply wrong about lead",
  "Kinetics: hydrogen formation on lead costs about 0.88 V of overpotential, far more than the +0.13 V the acid offers — blocked, not absent",
  "The plates get a protective factory coating that keeps the acid off",
]
answer = 1
misconception = "When an observation contradicts a rule, the tempting moves are to discard the rule or to invent a protector. Neither is needed: the series is an equilibrium statement and it is right — lead in acid is downhill. It is also barely downhill (+0.13 V), and the reaction's necessary first product, hydrogen gas on a lead surface, carries an activation toll of ~0.88 V. The bill exceeds the budget, so the reaction is blocked on any human timescale. The battery exists inside that gap."
misconception_de = "Widerspricht eine Beobachtung einer Regel, liegt es nahe, entweder die Regel zu verwerfen oder einen Beschützer zu erfinden. Keines von beidem ist nötig: Die Spannungsreihe ist eine Gleichgewichtsaussage, und sie hat recht — Blei in Säure liegt bergab. Es liegt aber nur knapp bergab (+0,13 V), und das notwendige erste Produkt der Reaktion, Wasserstoffgas auf einer Bleioberfläche, verlangt einen Aktivierungszoll von ~0,88 V. Die Rechnung übersteigt das Budget, also ist die Reaktion auf jeder menschlichen Zeitskala blockiert. Die Batterie existiert genau in dieser Lücke."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Rules are right or wrong, never bounded: one contradicting observation and the series is discarded, rather than asked what it actually claims."
reveals_de = "Regeln sind richtig oder falsch, nie begrenzt gültig: Eine widersprechende Beobachtung, und die Spannungsreihe wird verworfen, statt zu fragen, was sie eigentlich behauptet."
next = "Test the series where no kinetic gate applies: v2 — lead plates out of its own ions onto zinc, 0.0100 mol, exactly the direction the ordering demands. The series is right about where equilibrium lies; it never claimed to be a clock, and this beaker pair is the difference."
next_de = "Prüfe die Spannungsreihe dort, wo keine kinetische Sperre greift: v2 — Blei scheidet sich aus seinen eigenen Ionen auf Zink ab, 0,0100 mol, genau in der Richtung, die die Ordnung verlangt. Die Spannungsreihe hat recht damit, wo das Gleichgewicht liegt; sie hat nie behauptet, eine Uhr zu sein, und dieses Becherglaspaar ist der Unterschied."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Inertness needs an agent: 'nothing happens' must be caused by a thing — a coating, an additive — rather than by a barrier in the reaction's own mechanism."
reveals_de = "Trägheit braucht einen Verursacher: 'Nichts passiert' muss durch etwas verursacht sein — eine Beschichtung, einen Zusatzstoff — statt durch eine Barriere im Mechanismus der Reaktion selbst."
next = "No coating is modelled and none is invoked: the barrier is the surface chemistry of forming H₂ on lead itself, and the bench states the arithmetic — +0.13 V offered, ~0.88 V demanded. A century and a half of lead-acid batteries stands on that gap, not on a factory step."
next_de = "Es wird keine Beschichtung modelliert und keine herangezogen: Die Barriere ist die Oberflächenchemie der H₂-Bildung auf Blei selbst, und das Labor nennt die Rechnung — +0,13 V angeboten, ~0,88 V verlangt. Anderthalb Jahrhunderte Blei-Säure-Batterien stehen auf dieser Lücke, nicht auf einem Fertigungsschritt."

[reaction.registers]
lv1 = "A car battery is metal standing in strong acid — for years on end. The acid would love to eat the lead, but making gas bubbles on lead is so hard that nothing happens at all. The battery exists because of that nothing."
lv1_de = "Eine Autobatterie ist Metall, das jahrelang in starker Säure steht. Die Säure würde das Blei liebend gern auffressen, aber Gasblasen auf Blei zu bilden ist so schwer, dass überhaupt nichts passiert. Die Batterie existiert genau wegen dieses Nichts."
lv2 = "v1: lead in acid is reported inert — driving force +0.13 V against ~0.88 V of hydrogen overpotential on lead; no gas, no dissolution, pH unmoved. v2: the same series still works when kinetics allows it — Zn below Pb, so 0.0100 mol of lead plates onto the dissolving zinc."
lv2_de = "v1: Blei in Säure wird als inert gemeldet — Triebkraft +0,13 V gegenüber ~0,88 V Wasserstoff-Überspannung auf Blei; kein Gas, keine Auflösung, pH-Wert unverändert. v2: Dieselbe Spannungsreihe funktioniert weiterhin, wenn die Kinetik es zulässt — Zn steht unter Pb, sodass 0,0100 mol Blei sich auf dem sich auflösenden Zink abscheiden."
lv3 = "The comparison with zinc is the design lesson: zinc's grace is 0.03 V (`charging-fights-the-series` slips that leash with molar acid); lead's is ~0.75 V — the widest safe margin of any cheap metal below hydrogen, which is why lead was THE accumulator metal for a hundred and sixty years. Honesty: the overpotential is a curated kinetic constant with 'timescale of a lesson' as its stated scope, and the verdict here rests on it alone — real lead in sulfuric acid additionally grows a lead-sulfate film this bench does not model, so the real battery is even better protected than this beaker."
lv3_de = "Der Vergleich mit Zink ist die eigentliche Konstruktionslehre: Zinks Gnadenfrist beträgt 0,03 V (`charging-fights-the-series` lässt diese Leine mit molarer Säure reißen); Bleis Gnadenfrist beträgt ~0,75 V — der größte sichere Spielraum jedes billigen Metalls unter Wasserstoff, weshalb Blei hundertsechzig Jahre lang DAS Akkumulatormetall war. Ehrlichkeit: Die Überspannung ist eine kuratierte kinetische Konstante mit 'Zeitskala einer Unterrichtsstunde' als angegebenem Geltungsbereich, und das Urteil hier stützt sich allein darauf — echtes Blei in Schwefelsäure bildet zusätzlich einen Bleisulfat-Film, den dieses Labor nicht modelliert, sodass die echte Batterie sogar besser geschützt ist als dieses Becherglas."

