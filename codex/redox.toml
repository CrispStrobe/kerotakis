# ------------------------------------------------------- the series itself

[[reaction]]
id = "the-series-decides-who-plates"
spine = ["die-spannungsreihe-der-metalle"]
equation = "Zn + Cu²⁺ → Zn²⁺ + Cu"
concepts = ["activity-series", "displacement-reactions"]
requires = ["redox-reactions"]
apparatus = ["beaker", "thermometer"]
calculations = ["electron-bookkeeping"]
[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium NTG Jgst. 9, LB Donator-Akzeptor-Konzept — Redoxreaktionen"
ages = { min = 14.0, max = 15.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium NTG Jgst. 9 (ISB) — displacement of copper by zinc is a standard demonstration of the activity series"

[[reaction.curriculum]]
system = "england-gcse-combined-science"
stage = "GCSE Combined Science: Trilogy (AQA 8464), 4.4.1 Reactivity of metals"
ages = { min = 14.0, max = 16.0 }
source = "AQA GCSE Combined Science: Trilogy specification (8464), Section 4.4.1 — displacement reactions demonstrating the reactivity series are required content"

[reaction.setup]
script = """
add v1 water 100mL
add v1 CuSO4 0.05mol
add v1 Zn 0.05mol
"""

[reaction.expect]
events = ["dissolved:CuSO4", "plated:Cu", "consumed:Zn"]
ph = { min = 4.9, max = 5.2 }
temperature_c = { min = 58.5, max = 61.5 }

[reaction.expect.predict]
question = "A strip of zinc goes into blue copper sulfate solution. What happens?"
question_de = "Ein Streifen Zink kommt in blaue Kupfersulfatlösung. Was passiert?"
options = [
  "Nothing — a metal and a dissolved salt have no business with each other without an acid",
  "Copper metal grows on the zinc, the blue fades, and the beaker gets noticeably hot",
  "The zinc dissolves, but the copper stays dissolved too — they just swap places on paper",
]
answer = 1
misconception = "The first answer reserves reactivity for acids; the third concedes the equation but not the matter. Displacement is electrons changing owner for real: zinc sits below copper in the series, so it hands its electrons over, dissolves as Zn²⁺, and the copper ions take the electrons and come out of solution as actual metal on the zinc's surface — with 218.7 kJ/mol to show for it."
misconception_de = "Die erste Antwort reserviert Reaktivität für Säuren; die dritte akzeptiert die Gleichung, aber nicht die Materie. Verdrängung ist echter Elektronenwechsel: Zink steht in der Spannungsreihe unter Kupfer, gibt daher seine Elektronen ab, löst sich als Zn²⁺ auf, und die Kupfer-Ionen nehmen die Elektronen auf und treten als tatsächliches Metall auf der Zinkoberfläche aus der Lösung — mit 218,7 kJ/mol als Beleg dafür."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Reactivity needs an acid: metals answer to sourness, and a mere salt solution has nothing to attack with."
reveals_de = "Reaktivität braucht eine Säure: Metalle reagieren auf Säure, und eine bloße Salzlösung hat nichts, womit sie angreifen könnte."
next = "The attacker is not the acid's proton but any ion below the metal in the series. Watch the beaker: no acid anywhere, and the zinc is consumed while copper plates out — then run `metals-below-hydrogen-fizz`, where the proton takes its turn as just another rung."
next_de = "Der Angreifer ist nicht das Proton der Säure, sondern jedes Ion, das in der Spannungsreihe unter dem Metall steht. Beobachte das Becherglas: nirgends Säure, und trotzdem wird das Zink verbraucht, während Kupfer sich abscheidet — führe dann `metals-below-hydrogen-fizz` aus, wo das Proton an die Reihe kommt, ganz als nur eine weitere Sprosse."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "The reaction happens in the equation only — ions swap labels, but nothing in the beaker moves; chemistry as bookkeeping rather than matter."
reveals_de = "Die Reaktion findet nur in der Gleichung statt — Ionen tauschen ihre Etiketten, aber im Becherglas bewegt sich nichts; Chemie als Buchhaltung statt als Materie."
next = "Check every observable at once: the blue is gone (the Cu²⁺ that carried it is now metal), the thermometer jumped from 33.7 to 59.9 °C, and `inspect` shows solid copper in the inventory where solid zinc used to be. Paper swaps do not release 218.7 kJ/mol."
next_de = "Prüfe alle Beobachtungsgrößen zugleich: Das Blau ist verschwunden (das Cu²⁺, das es trug, ist jetzt Metall), das Thermometer sprang von 33,7 auf 59,9 °C, und `inspect` zeigt festes Kupfer im Inventar, wo zuvor festes Zink stand. Ein bloßer Tausch auf dem Papier setzt keine 218,7 kJ/mol frei."

[reaction.registers]
lv1 = "The grey strip goes into the blue water. Slowly the strip grows a brown-pink fur of real copper, the blue fades away, and the beaker gets properly hot. The zinc traded places with the copper — and the trade throws off heat."
lv1_de = "Der graue Streifen kommt in das blaue Wasser. Langsam wächst auf dem Streifen ein braun-rosa Pelz aus echtem Kupfer, das Blau verblasst, und das Becherglas wird richtig heiß. Das Zink hat mit dem Kupfer den Platz getauscht — und der Tausch setzt Wärme frei."
lv2 = "Zn + Cu²⁺ → Zn²⁺ + Cu. Zinc sits below copper in the activity series (E° −0.76 V against +0.34 V), so zinc is oxidised and copper reduced: 0.0500 mol plates out, the solution's blue goes with its Cu²⁺, and the beaker climbs from 33.7 to 59.9 °C — ΔH ≈ −218.7 kJ per mole displaced."
lv2_de = "Zn + Cu²⁺ → Zn²⁺ + Cu. Zink steht in der Spannungsreihe unter Kupfer (E° −0,76 V gegenüber +0,34 V), daher wird Zink oxidiert und Kupfer reduziert: 0,0500 mol scheiden sich ab, das Blau der Lösung verschwindet mit ihrem Cu²⁺, und das Becherglas steigt von 33,7 auf 59,9 °C — ΔH ≈ −218,7 kJ pro Mol verdrängtem Metall."
lv3 = "The extent is decided by bisection on the Nernst cell potential over the activities PHREEQC reports, and the heat by the difference of the ions' formation enthalpies, balanced as enthalpy — nothing lists 'zinc displaces copper' anywhere. The same order answers the selective case: offer a zinc strip both Ag⁺ and Cu²⁺ at once and all the silver plates before any copper does, which the engine's own tests assert. Boundaries, stated: the series speaks of thermodynamics at the electrode, not of rates — passivation, overpotentials and oxidising acids are outside it, and the bench says so where they bite."
lv3_de = "Das Ausmaß wird durch Bisektion über das Nernst-Zellpotenzial anhand der von PHREEQC gemeldeten Aktivitäten entschieden, die Wärme über die Differenz der Bildungsenthalpien der Ionen, als Enthalpiebilanz — nirgendwo steht 'Zink verdrängt Kupfer' geschrieben. Dieselbe Ordnung beantwortet auch den selektiven Fall: Bietet man einem Zinkstreifen gleichzeitig Ag⁺ und Cu²⁺ an, scheidet sich alles Silber ab, bevor auch nur ein Rest Kupfer folgt — was die eigenen Tests der Engine bestätigen. Grenzen, klar benannt: Die Spannungsreihe spricht über Thermodynamik an der Elektrode, nicht über Geschwindigkeiten — Passivierung, Überspannungen und oxidierende Säuren liegen außerhalb; das Labor sagt das, wo es zum Tragen kommt."

[reaction.provenance]
source = "Standard curriculum displacement chemistry; E° values from the CRC Handbook (Vanýsek), ion formation enthalpies from NBS/Wagman 1982; extent and heat computed, cross-checked against wateq4f's own metal phases to < 1 mV. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "Kerotakis displacement layer (Nernst over PHREEQC activities, enthalpy-balanced) via Kerotakis L2"

[[reaction]]
id = "metals-below-hydrogen-fizz"
spine = ["die-spannungsreihe-der-metalle"]
equation = "Mg + 2 H⁺ → Mg²⁺ + H₂"
concepts = ["activity-series", "hydrogen-as-a-rung"]
requires = ["activity-series", "acids"]
apparatus = ["beaker", "ph-meter"]
calculations = ["electron-bookkeeping"]
[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium NTG Jgst. 9, LB Donator-Akzeptor-Konzept — Redoxreaktionen"
ages = { min = 14.0, max = 15.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium NTG Jgst. 9 (ISB) — hydrogen as a rung in the activity series; metals above and below it react differently with acids"

[[reaction.curriculum]]
system = "england-gcse-combined-science"
stage = "GCSE Combined Science: Trilogy (AQA 8464), 4.4.1 Reactivity of metals"
ages = { min = 14.0, max = 16.0 }
source = "AQA GCSE Combined Science: Trilogy specification (8464), Section 4.4.1 — reactions of metals with dilute acids are required content"

[reaction.setup]
script = """
add v1 water 100mL
add v1 HCl 0.1mol
add v1 Mg 0.02mol
new
add v2 water 100mL
add v2 HCl 0.1mol
add v2 Cu 0.02mol
"""

[reaction.expect]
events = ["gas_evolved:H2", "consumed:Mg", "inert:Cu"]
ph = { min = 0.1, max = 0.4 }

[reaction.expect.predict]
question = "Two strips into two beakers of the same hydrochloric acid: magnesium in one, copper in the other. What happens?"
question_de = "Zwei Streifen in zwei Bechergläsern mit derselben Salzsäure: Magnesium im einen, Kupfer im anderen. Was passiert?"
options = [
  "Both fizz — acid attacks metal, that is what acid does",
  "Neither fizzes — solid metal is too tough for a liquid",
  "Only the magnesium fizzes; the copper sits in acid indefinitely, untouched",
]
answer = 2
misconception = "Both wrong answers treat 'metal' as one substance with one behaviour towards acid. The series is the correction: hydrogen has its own rung (E° = 0 by definition), and only metals below it can push electrons onto protons. Magnesium is far below and fizzes hydrogen; copper is above, so in this acid it has nothing to gain and does exactly nothing — which the bench states as a result, not an absence."
misconception_de = "Beide falschen Antworten behandeln 'Metall' als einen einzigen Stoff mit einem einzigen Verhalten gegenüber Säure. Die Spannungsreihe korrigiert das: Wasserstoff hat seine eigene Sprosse (E° = 0 per Definition), und nur Metalle darunter können Elektronen auf Protonen übertragen. Magnesium liegt weit darunter und sprudelt Wasserstoff; Kupfer liegt darüber, hat in dieser Säure also nichts zu gewinnen und tut genau nichts — was das Labor als Ergebnis meldet, nicht als Fehlanzeige."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Acid attacks metal, universally — the fizz is a property of the acid, and any metal will do as the victim."
reveals_de = "Säure greift Metall an, ganz allgemein — das Sprudeln gilt als Eigenschaft der Säure, und als Opfer taugt jedes beliebige Metall."
next = "Run both beakers side by side: the acid is identical, the outcomes are not. The deciding rung is hydrogen's own place in the series — the acid can only oxidise metals that sit below it, and copper does not."
next_de = "Lass beide Bechergläser nebeneinander laufen: Die Säure ist identisch, die Ergebnisse sind es nicht. Die entscheidende Sprosse ist der Platz des Wasserstoffs selbst in der Spannungsreihe — die Säure kann nur Metalle oxidieren, die darunter stehen, und Kupfer tut das nicht."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "Solids outrank liquids: a lump of metal is imagined as simply too substantial for a watery acid to touch."
reveals_de = "Feststoffe stehen über Flüssigkeiten: Ein Klumpen Metall wird als schlicht zu massiv vorgestellt, als dass eine wässrige Säure ihm etwas anhaben könnte."
next = "Watch the magnesium vessel: 0.0200 mol of hydrogen leaves as gas and the metal is consumed entirely. Toughness is not a chemical category — position in the series is, and the same 'watery acid' that ignores copper eats magnesium completely."
next_de = "Beobachte das Magnesium-Gefäß: 0,0200 mol Wasserstoff entweichen als Gas, und das Metall wird vollständig verbraucht. Massivität ist keine chemische Kategorie — die Position in der Spannungsreihe schon, und dieselbe 'wässrige Säure', die Kupfer ignoriert, frisst Magnesium vollständig auf."

[reaction.registers]
lv1 = "Same sour liquid, two different metals. The silvery magnesium fizzes furiously and disappears. The copper just sits there, day after day, completely unbothered. Metals take turns by rank — and the acid can only touch the ones below a certain line."
lv1_de = "Dieselbe saure Flüssigkeit, zwei verschiedene Metalle. Das silbrige Magnesium sprudelt heftig und verschwindet. Das Kupfer liegt einfach da, Tag für Tag, völlig unbeeindruckt. Metalle kommen der Reihe nach an die Reihe — und die Säure kann nur die unterhalb einer bestimmten Linie berühren."
lv2 = "Mg + 2 H⁺ → Mg²⁺ + H₂↑ (E° Mg²⁺/Mg = −2.37 V, well below hydrogen's 0.00 V): 0.0200 mol of H₂ evolves and the pH climbs from −0.04 to 0.23. Copper (E° +0.34 V, above hydrogen) is reported inert: nothing to gain, nothing happens."
lv2_de = "Mg + 2 H⁺ → Mg²⁺ + H₂↑ (E° Mg²⁺/Mg = −2,37 V, weit unter dem Wert 0,00 V des Wasserstoffs): 0,0200 mol H₂ entstehen, und der pH-Wert steigt von −0,04 auf 0,23. Kupfer (E° +0,34 V, über Wasserstoff) wird als inert gemeldet: nichts zu gewinnen, nichts passiert."
lv3 = "Two boundaries earn their sentence here. Non-oxidising acids only: nitric acid dissolves copper by a different oxidant (the nitrate), so 'copper resists acid' is a claim about HCl and its kin, and the series as computed here says nothing about HNO₃. And kinetics: thermodynamically even plain water should attack magnesium — drop it in salt water and the bench declines with a stated rate gap rather than either dissolving it or calling it stable. The inert verdict, meanwhile, is an Event, not a silence — the negative result is first-class, in this lab's tradition."
lv3_de = "Zwei Grenzen verdienen hier ihren Satz. Nur nicht oxidierende Säuren: Salpetersäure löst Kupfer über ein anderes Oxidationsmittel (das Nitrat), sodass 'Kupfer widersteht Säure' eine Aussage über HCl und seinesgleichen ist, und die hier berechnete Spannungsreihe nichts über HNO₃ aussagt. Und Kinetik: Thermodynamisch müsste sogar reines Wasser Magnesium angreifen — wirf es in Salzwasser, und das Labor lehnt mit einer benannten Geschwindigkeitslücke ab, statt es entweder aufzulösen oder für stabil zu erklären. Das Urteil 'inert' wiederum ist ein Event, kein Schweigen — das negative Ergebnis ist erstklassig, ganz in der Tradition dieses Labors."

[reaction.provenance]
source = "Standard curriculum reactivity of metals with acids; E° values from the CRC Handbook (Vanýsek); H⁺/H₂ = 0 V by definition of the standard hydrogen electrode. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "Kerotakis displacement layer (Nernst over PHREEQC activities) via Kerotakis L2"

[[reaction]]
id = "the-silver-tree"
spine = ["die-spannungsreihe-der-metalle"]
equation = "Cu + 2 Ag⁺ → Cu²⁺ + 2 Ag"
concepts = ["activity-series", "displacement-reactions"]
requires = ["activity-series"]
apparatus = ["beaker"]
calculations = ["electron-bookkeeping"]
[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium NTG Jgst. 9, LB Donator-Akzeptor-Konzept — Redoxreaktionen"
ages = { min = 14.0, max = 15.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium NTG Jgst. 9 (ISB) — the silver tree is a classic displacement demonstration"

[[reaction.curriculum]]
system = "england-gcse-combined-science"
stage = "GCSE Combined Science: Trilogy (AQA 8464), 4.4.1 Reactivity of metals"
ages = { min = 14.0, max = 16.0 }
source = "AQA GCSE Combined Science: Trilogy specification (8464), Section 4.4.1 — displacement reactions of metals with metal-salt solutions"

[reaction.setup]
script = """
add v1 water 100mL
add v1 AgNO3 0.02mol
add v1 Cu 0.05mol
"""

[reaction.expect]
events = ["dissolved:AgNO3", "plated:Ag", "consumed:Cu"]
ph = { min = 4.0, max = 4.4 }

[reaction.expect.predict]
question = "A copper wire stands in a colourless silver nitrate solution. What do you see over the next hour?"
question_de = "Ein Kupferdraht steht in einer farblosen Silbernitratlösung. Was beobachtest du in der nächsten Stunde?"
options = [
  "Nothing — silver is a noble metal, and noble metals do not react",
  "Silver crystals grow on the wire while the solution turns blue",
  "The wire dissolves completely and both metals end up in solution",
]
answer = 1
misconception = "'Noble' describes the metal, not the ion — metallic silver resists attack, but a silver ion is silver that has already lost its electron and wants one back, and copper below it in the series is willing to pay. Two silvers plate per copper dissolved (one electron each against copper's two), and the arriving Cu²⁺ brings the blue: the colour change is the electron transfer made visible."
misconception_de = "'Edel' beschreibt das Metall, nicht das Ion — metallisches Silber widersteht dem Angriff, aber ein Silber-Ion ist Silber, das sein Elektron bereits verloren hat und eines zurückwill, und das darunterstehende Kupfer in der Spannungsreihe ist bereit zu zahlen. Pro gelöstem Kupfer scheiden sich zwei Silber ab (je ein Elektron gegen Kupfers zwei), und das ankommende Cu²⁺ bringt das Blau mit: Der Farbwechsel macht den Elektronentransfer sichtbar."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Nobility as a blanket property: silver is unreactive, so anything labelled silver — metal or ion — must stay as it is."
reveals_de = "Edelheit als pauschale Eigenschaft: Silber ist reaktionsträge, also muss alles, was 'Silber' heißt — Metall oder Ion — so bleiben, wie es ist."
next = "Separate the metal from its ion: `silver-does-not-stoop` shows metallic silver genuinely refusing copper sulfate, while this beaker shows the silver ION taking electrons eagerly. The nobility belongs to the filled state, not the name — an Ag⁺ is a silver that has already been robbed."
next_de = "Trenne das Metall von seinem Ion: `silver-does-not-stoop` zeigt metallisches Silber, das Kupfersulfat tatsächlich verweigert, während dieses Becherglas das Silber-ION zeigt, das begierig Elektronen aufnimmt. Die Edelheit gehört zum aufgefüllten Zustand, nicht zum Namen — ein Ag⁺ ist ein Silber, dem bereits etwas geraubt wurde."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Displacement as mutual dissolution — reactions mix everything into solution; that one metal must leave solution for the other to enter is not in the picture."
reveals_de = "Verdrängung als gegenseitiges Auflösen — Reaktionen mischen alles in die Lösung; dass ein Metall die Lösung verlassen muss, damit das andere hineingelangt, kommt in dieser Vorstellung nicht vor."
next = "Count the electrons: they have to go somewhere, and the only taker is Ag⁺, which becomes solid metal by accepting them — 0.0200 mol of silver plated for 0.0100 mol of copper dissolved, on the balance and in the inventory. Electrons conserved is why displacement is a swap, never a merger."
next_de = "Zähle die Elektronen: Sie müssen irgendwohin, und der einzige Abnehmer ist Ag⁺, das durch ihre Aufnahme zu festem Metall wird — 0,0200 mol Silber scheiden sich ab für 0,0100 mol gelöstes Kupfer, in der Bilanz wie im Inventar. Erhaltene Elektronen sind der Grund, warum Verdrängung ein Tausch ist, nie eine Vermischung."

[reaction.registers]
lv1 = "The copper wire grows glittering needles of real silver, like frost — and as the tree grows, the water around it slowly turns blue. The wire is trading itself for silver, one electron at a time."
lv1_de = "Auf dem Kupferdraht wachsen glitzernde Nadeln aus echtem Silber, wie Frost — und während der Baum wächst, färbt sich das Wasser um ihn herum langsam blau. Der Draht tauscht sich selbst gegen Silber ein, ein Elektron nach dem anderen."
lv2 = "Cu + 2 Ag⁺ → Cu²⁺ + 2 Ag: copper (E° +0.34 V) sits below silver (+0.80 V), so copper dissolves and silver plates — 0.0200 mol of Ag for 0.0100 mol of Cu, two-for-one by electron count. The blue is the arriving Cu²⁺; the pH drifts from 6.46 to 4.19 as the new copper ion hydrolyses (`copper-sulfate-is-blue-and-acidic` is that story on its own)."
lv2_de = "Cu + 2 Ag⁺ → Cu²⁺ + 2 Ag: Kupfer (E° +0,34 V) steht unter Silber (+0,80 V), also löst sich Kupfer, und Silber scheidet sich ab — 0,0200 mol Ag für 0,0100 mol Cu, zwei zu eins nach Elektronenzahl. Das Blau ist das ankommende Cu²⁺; der pH-Wert driftet von 6,46 auf 4,19, während das neue Kupfer-Ion hydrolysiert (`copper-sulfate-is-blue-and-acidic` erzählt diese Geschichte für sich)."
lv3 = "The stoichiometry is not written anywhere: one electron per silver against two per copper falls out of the same electron bookkeeping as permanganate's five (`permanganate-counts-in-fives`), and the colour is computed from the curated Cu²⁺ absorptivity, not asserted. The heat is small and real — 23.9 to 27.4 °C from the ions' formation enthalpies. This experiment is the one Faraday's silver coulometer industrialised: the two-for-one is an electron count you can weigh."
lv3_de = "Die Stöchiometrie steht nirgendwo geschrieben: Ein Elektron pro Silber gegen zwei pro Kupfer fällt aus derselben Elektronenbuchhaltung heraus wie die Fünf beim Permanganat (`permanganate-counts-in-fives`), und die Farbe wird aus der kuratierten Absorptivität von Cu²⁺ berechnet, nicht behauptet. Die Wärme ist klein und real — 23,9 bis 27,4 °C aus den Bildungsenthalpien der Ionen. Dieses Experiment ist genau jenes, das Faradays Silber-Coulometer zur Industriereife brachte: Das Verhältnis zwei zu eins ist eine Elektronenzählung, die man wiegen kann."

