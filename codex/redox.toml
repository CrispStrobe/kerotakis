[[reaction]]
id = "only-the-two-is-chemistry"
spine = ["elektrolyse"]
summary = "Cu²⁺ + 2 e⁻ → Cu — a half-reaction, with the electrons supplied by the wire"
summary_de = "Cu²⁺ + 2 e⁻ → Cu — eine Halbreaktion, deren Elektronen der Draht liefert"
concepts = ["electrolysis", "faraday-law"]
requires = ["electron-transfer"]
apparatus = ["beaker", "power-supply"]
calculations = ["faraday"]
[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 12, LB Redoxchemie — Elektrolyse"
ages = { min = 17.0, max = 18.0 }
