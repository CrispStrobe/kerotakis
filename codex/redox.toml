[[reaction]]
id = "the-daniell-cell-offers-its-voltage"
spine = ["die-elektrochemie", "batterien"]
summary = "Two half-cells and a salt bridge: the Daniell cell reads 1.104 V open-circuit — the distance between two rungs of the series, offered before any current flows"
summary_de = "Zwei Halbzellen und eine Salzbrücke: Die Daniell-Zelle zeigt im Leerlauf 1,104 V — der Abstand zwischen zwei Sprossen der Spannungsreihe, angeboten, bevor überhaupt Strom fließt"
concepts = ["galvanic-cells", "activity-series"]
requires = ["activity-series"]
apparatus = ["beaker", "voltmeter"]
calculations = ["cell-potential"]
[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 12, LB Redoxchemie — Galvanische Zellen"
ages = { min = 17.0, max = 18.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Oberstufe (ISB) — the Daniell cell is named content of the electrochemistry Lernbereich"

[reaction.setup]
script = """
add v1 water 100mL
add v1 ZnSO4 0.01mol
add v1 Zn 0.05mol
new
add v2 water 100mL
add v2 CuSO4 0.01mol
add v2 Cu 0.05mol
cell v1 v2
"""

[reaction.expect]
events = ["cell_voltage"]
ph = { min = 5.35, max = 5.65 }

[reaction.expect.predict]
question = "Zinc stands in zinc sulfate, copper in copper sulfate, a salt bridge between them and a voltmeter across the metals. What does the meter read?"
question_de = "Zink steht in Zinksulfat, Kupfer in Kupfersulfat, dazwischen eine Salzbrücke und über den Metallen ein Voltmeter. Was zeigt das Messgerät an?"
options = [
  "0 V — the metals never touch, so no chemistry connects them",
  "About 1.1 V — the distance between the two metals' rungs on the series",
  "About 0.4 V — the average of the two electrode potentials",
]
answer = 1
misconception = "A voltage is a *difference*, not an average and not a contact: each metal sits at its own electrode potential against its own ions, and the meter reads the gap — E°(Cu²⁺/Cu) − E°(Zn²⁺/Zn) = 0.34 − (−0.76) ≈ 1.10 V. The displacement reaction and the battery are the same chemistry: put the metals in one beaker and the electrons jump directly as heat; separate the half-cells and the same electrons must take the wire, where they can be made to work."
misconception_de = "Eine Spannung ist eine *Differenz*, kein Mittelwert und kein Kontakt: Jedes Metall sitzt bei seinem eigenen Elektrodenpotenzial gegenüber seinen eigenen Ionen, und das Messgerät liest den Abstand ab — E°(Cu²⁺/Cu) − E°(Zn²⁺/Zn) = 0,34 − (−0,76) ≈ 1,10 V. Die Verdrängungsreaktion und die Batterie sind dieselbe Chemie: Gibt man die Metalle in ein Becherglas, springen die Elektronen direkt als Wärme über; trennt man die Halbzellen, müssen dieselben Elektronen den Draht nehmen, wo man sie zur Arbeit zwingen kann."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Reaction requires contact: the metals never meet, so nothing can happen — the circuit as a whole is not yet the unit of chemistry."
reveals_de = "Reaktion erfordert Kontakt: Die Metalle berühren sich nie, also kann nichts passieren — der Stromkreis als Ganzes ist in dieser Vorstellung noch nicht die Einheit der Chemie."
next = "Follow one electron's options: it leaves the zinc either directly onto a Cu²⁺ at the metal's surface (`the-series-decides-who-plates`, which turned the gap into 218.7 kJ/mol of heat) or through the wire to the copper electrode, doing the same chemistry at a distance. The salt bridge closes the loop of charge; the wire is where the trade becomes measurable."
next_de = "Verfolge die Optionen eines einzelnen Elektrons: Es verlässt das Zink entweder direkt zu einem Cu²⁺ an der Metalloberfläche (`the-series-decides-who-plates`, wo der Abstand zu 218,7 kJ/mol Wärme wurde) oder über den Draht zur Kupferelektrode, wo dieselbe Chemie auf Distanz stattfindet. Die Salzbrücke schließt den Ladungskreis; der Draht ist dort, wo der Tausch messbar wird."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Potentials are averaged rather than subtracted — two numbers on a chart combine the way marks on a test do."
reveals_de = "Potenziale werden gemittelt statt subtrahiert — zwei Zahlen aus einer Tabelle werden so kombiniert, wie man Noten aus einer Prüfung zusammenrechnet."
next = "Check the sign convention against the beaker: the meter reads which way electrons *want* to flow, and a want is a difference. The bench prints the arithmetic with the verdict: E° +0.342 minus −0.762 gives the 1.104 V it reports, electrons offered from v1 to v2."
next_de = "Prüfe die Vorzeichenkonvention am Becherglas: Das Messgerät zeigt an, in welche Richtung Elektronen fließen *wollen*, und ein Wollen ist eine Differenz. Das Labor druckt die Rechnung mit dem Ergebnis aus: E° +0,342 minus −0,762 ergibt die gemeldeten 1,104 V, Elektronen angeboten von v1 an v2."

[reaction.registers]
lv1 = "Two jars, two metals, a paper bridge of salt water, and a meter between them: it reads a real voltage — a battery made of nothing but the two metals' different appetites for electrons."
lv1_de = "Zwei Gefäße, zwei Metalle, eine Papierbrücke aus Salzwasser, und ein Messgerät dazwischen: Es zeigt eine echte Spannung an — eine Batterie, gemacht aus nichts als dem unterschiedlichen Appetit der beiden Metalle auf Elektronen."
lv2 = "Zn | Zn²⁺ ‖ Cu²⁺ | Cu: E = E°(cathode) − E°(anode) = 0.34 − (−0.76) ≈ 1.10 V, and the bench reads 1.104 V open-circuit. This is Daniell's cell of 1836 — the displacement reaction of `the-series-decides-who-plates` with the two halves separated, so the electrons take the wire."
lv2_de = "Zn | Zn²⁺ ‖ Cu²⁺ | Cu: E = E°(Kathode) − E°(Anode) = 0,34 − (−0,76) ≈ 1,10 V, und das Labor liest im Leerlauf 1,104 V ab. Das ist Daniells Zelle von 1836 — die Verdrängungsreaktion aus `the-series-decides-who-plates`, nur mit getrennten Hälften, sodass die Elektronen den Draht nehmen."
lv3 = "Open-circuit, and the bench says so: this is the voltage the cell *offers*, not what it delivers under load — current would drop it by internal resistance and polarisation, neither modelled here, and the report states as much. The 1.104 V is Nernst over the activities PHREEQC computes for each side (E° alone gives 1.1037; the two 0.01 mol/kgw solutions nearly cancel each other's corrections). Both half-cells sit within half a degree of 25 °C at these amounts — at 0.1 mol the dissolution heat would put the two electrodes at different temperatures, which is why this entry uses the dilute version."
lv3_de = "Leerlauf, und das Labor sagt das auch: Dies ist die Spannung, die die Zelle *anbietet*, nicht die, die sie unter Last liefert — Strom würde sie durch Innenwiderstand und Polarisation absenken, keines von beidem hier modelliert, und der Bericht hält genau das fest. Die 1,104 V sind Nernst über die von PHREEQC für jede Seite berechneten Aktivitäten (E° allein ergibt 1,1037; die beiden 0,01-mol/kgw-Lösungen heben ihre Korrekturen fast gegenseitig auf). Beide Halbzellen liegen bei diesen Mengen innerhalb eines halben Grades von 25 °C — bei 0,1 mol würde die Lösungswärme die beiden Elektroden auf unterschiedliche Temperaturen bringen, weshalb dieser Eintrag die verdünnte Fassung verwendet."

