ages = { min = 17.0, max = 18.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Oberstufe (ISB) — concentration cells as the limiting case of Nernst"

[reaction.setup]
script = """
add v1 water 100mL
add v1 CuSO4 0.001mol
add v1 Cu 0.05mol
new
add v2 water 100mL
add v2 CuSO4 0.01mol
add v2 Cu 0.05mol
cell v1 v2
"""

[reaction.expect]
events = ["cell_voltage"]
ph = { min = 4.75, max = 5.0 }

[reaction.expect.predict]
question = "Same metal both sides, same salt both sides — copper in copper sulfate twice, only the concentration differing tenfold. The voltmeter reads…"
question_de = "Dasselbe Metall auf beiden Seiten, dasselbe Salz auf beiden Seiten — zweimal Kupfer in Kupfersulfat, nur die Konzentration unterscheidet sich zehnfach. Das Voltmeter zeigt…"
options = [
  "0 V — identical electrodes cannot disagree about anything",
  "About 18 mV, with the dilute side as the negative pole",
  "About 1.1 V — two beakers and a bridge make a Daniell cell whatever is in them",
]
answer = 1
misconception = "The standard potentials cancel identically — E° = 0.000, and the bench prints it — yet a real voltage remains, because the Nernst term reads the imbalance itself: the dilute side dissolves copper to gain ions and the strong side plates copper to shed them, the cell literally running on the urge to even out. A battery needs a difference, and a difference in concentration is a difference."
misconception_de = "Die Standardpotenziale heben sich exakt auf — E° = 0,000, und das Labor druckt genau das aus — trotzdem bleibt eine echte Spannung, weil der Nernst-Term das Ungleichgewicht selbst abliest: Die verdünnte Seite löst Kupfer auf, um Ionen zu gewinnen, und die starke Seite scheidet Kupfer ab, um sie loszuwerden — die Zelle läuft buchstäblich auf dem Drang zum Ausgleich. Eine Batterie braucht einen Unterschied, und ein Konzentrationsunterschied ist ein Unterschied."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Potential belongs to the substance: identical metals, identical potentials, zero forever — concentration has no seat at the electrode."
reveals_de = "Potenzial gehört zum Stoff: identische Metalle, identische Potenziale, für immer null — Konzentration hat in dieser Vorstellung keinen Platz an der Elektrode."
next = "Read the bench's own arithmetic: E° = 0.000 exactly, E = 0.018 V anyway. The whole reading is the log term — cover the E° column of the table with your thumb and this cell works exactly the same, which no cell built on 'the metals differ' can say."
next_de = "Lies die eigene Rechnung des Labors: E° = 0,000 exakt, E = 0,018 V trotzdem. Die gesamte Anzeige ist der Logarithmusterm — halte den Daumen über die E°-Spalte der Tabelle, und diese Zelle funktioniert genau gleich weiter, was keine Zelle behaupten kann, die auf 'die Metalle unterscheiden sich' aufbaut."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Any two beakers wired up make 'the battery from the book' — the apparatus is the cause, and 1.1 V is what apparatus of this shape produces."
reveals_de = "Zwei beliebige verkabelte Bechergläser ergeben 'die Batterie aus dem Buch' — der Aufbau gilt als Ursache, und 1,1 V ist das, was ein Aufbau dieser Form eben produziert."
next = "The 1.104 V belonged to a specific pair of rungs, not to the glassware (`the-daniell-cell-offers-its-voltage`). Same glassware, same bridge, copper both sides: sixty times less voltage. The series sets the big number; here the series contributes nothing and the leftover is pure Nernst."
next_de = "Die 1,104 V gehörten zu einem bestimmten Sprossenpaar, nicht zum Glasgerät (`the-daniell-cell-offers-its-voltage`). Gleiches Glasgerät, gleiche Brücke, Kupfer auf beiden Seiten: sechzigmal weniger Spannung. Die Spannungsreihe liefert die große Zahl; hier trägt die Spannungsreihe nichts bei, und was übrig bleibt, ist reiner Nernst."

[reaction.registers]
lv1 = "Two jars of the same blue water — one strong, one weak — copper in both, bridge between. The meter still reads something! The strong side wants to give copper away, the weak side wants more: wanting-to-even-out is enough to make electricity."
lv1_de = "Zwei Gefäße mit demselben blauen Wasser — eines stark, eines schwach — in beiden Kupfer, dazwischen eine Brücke. Und das Messgerät zeigt trotzdem etwas an! Die starke Seite will Kupfer abgeben, die schwache Seite will mehr davon: Der Wunsch nach Ausgleich allein reicht schon, um Strom zu machen."
lv2 = "Cu | Cu²⁺(0.001) ‖ Cu²⁺(0.01) | Cu: E° cancels to 0.000 and E = (0.0592/2)·log(a₂/a₁) — the bench reads 0.018 V with the dilute side as anode. A concentration cell is the Nernst equation with everything else subtracted out."
lv2_de = "Cu | Cu²⁺(0,001) ‖ Cu²⁺(0,01) | Cu: E° hebt sich zu 0,000 auf, und E = (0,0592/2)·log(a₂/a₁) — das Labor liest 0,018 V ab, mit der verdünnten Seite als Anode. Eine Konzentrationszelle ist die Nernst-Gleichung, bei der alles andere herausgekürzt wurde."
lv3 = "The cleanest 'the number is the activities' witness this bench can stage: no table value survives into the answer, so the 18.4 mV is entirely the computed activity ratio (which is why it is not the ideal 29.6/2-per-decade value either — the same pairing correction as `dilution-buys-less-than-the-slide-rule-says`). The direction is the second lesson: the *dilute* side is the anode, dissolving its own electrode to catch up — matter moving to erase a gradient, read out in volts. Nerve cells and pH electrodes run on this identical principle."
lv3_de = "Der reinste Zeuge, den dieses Labor für 'die Zahl sind die Aktivitäten' aufbieten kann: Kein Tabellenwert überlebt bis in die Antwort, sodass die 18,4 mV vollständig das berechnete Aktivitätsverhältnis sind (weshalb es auch nicht der ideale Wert von 29,6/2 pro Dekade ist — dieselbe Paarungskorrektur wie bei `dilution-buys-less-than-the-slide-rule-says`). Die Richtung ist die zweite Lektion: Die *verdünnte* Seite ist die Anode, sie löst ihre eigene Elektrode auf, um aufzuholen — Materie, die sich bewegt, um ein Gefälle auszugleichen, ausgelesen in Volt. Nervenzellen und pH-Elektroden arbeiten nach genau demselben Prinzip."

[reaction.provenance]
source = "Standard curriculum concentration cells; E° cancellation is exact by construction; activities from PHREEQC wateq4f.dat (USGS). Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
