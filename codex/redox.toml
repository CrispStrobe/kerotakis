[[reaction]]
id = "dilution-buys-less-than-the-slide-rule-says"
spine = ["die-elektrochemie"]
summary = "Tenfold dilution of the copper side costs 18.2 mV, not the Nernst slide-rule's 29.6 — the equation is exact over activities, and the concentrations are not the activities"
summary_de = "Zehnfache Verdünnung der Kupferseite kostet 18,2 mV, nicht die 29,6 mV des Nernst-Rechenschiebers — die Gleichung ist exakt über Aktivitäten, und die Konzentrationen sind nicht die Aktivitäten"
concepts = ["nernst-over-activities", "galvanic-cells"]
requires = ["galvanic-cells", "formal-potential"]
apparatus = ["beaker", "voltmeter"]
calculations = ["cell-potential"]
[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 12, LB Redoxchemie — Nernst-Gleichung"
ages = { min = 17.0, max = 18.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Oberstufe (ISB) — the Nernst equation and its activity dependence"

[reaction.setup]
script = """
add v1 water 100mL
add v1 ZnSO4 0.01mol
add v1 Zn 0.05mol
new
add v2 water 100mL
add v2 CuSO4 0.01mol
add v2 Cu 0.05mol
cell v1 v2
new
add v3 water 100mL
add v3 CuSO4 0.001mol
add v3 Cu 0.05mol
cell v1 v3
"""

[reaction.expect]
events = ["cell_voltage"]
ph = { min = 5.35, max = 5.65 }

[reaction.expect.predict]
question = "The textbook exercise: dilute the copper side of a Daniell cell tenfold, and E falls by 0.0592/2 volts per decade — 29.6 mV. The bench dilutes and reads the meter. By how much did the voltage actually fall?"
question_de = "Die Lehrbuchaufgabe: Verdünne die Kupferseite einer Daniell-Zelle zehnfach, und E fällt um 0,0592/2 Volt pro Dekade — 29,6 mV. Das Labor verdünnt und liest das Messgerät ab. Um wie viel fiel die Spannung tatsächlich?"
options = [
  "Exactly 29.6 mV — the Nernst equation is an equation",
  "18.2 mV — noticeably less, because the free copper activity fell by a factor nearer 4 than 10",
  "Nothing — dilution changes how much copper there is, not what copper is",
]
answer = 1
misconception = "The Nernst equation IS exact — over activities. The slide-rule version quietly substitutes concentrations, which assumes the activity corrections cancel between the two solutions. They do not: in the stronger solution much of the copper is paired with sulfate, so tenfold less total copper is only about fourfold less *free* Cu²⁺, and the logarithm sees the four. The second witness clinches it: a copper–silver cell reads 0.445 V at 0.01 mol but 0.483 V at 0.1 — the deviation changes sign with concentration, so no 'always a bit less' patch-rule survives."
misconception_de = "Die Nernst-Gleichung IST exakt — über Aktivitäten. Die Rechenschieber-Version setzt still Konzentrationen ein, was voraussetzt, dass sich die Aktivitätskorrekturen zwischen beiden Lösungen aufheben. Das tun sie nicht: In der stärkeren Lösung ist ein großer Teil des Kupfers mit Sulfat gepaart, sodass zehnfach weniger Gesamtkupfer nur etwa vierfach weniger *freies* Cu²⁺ bedeutet, und der Logarithmus sieht die Vier. Der zweite Zeuge macht es endgültig: Eine Kupfer-Silber-Zelle zeigt 0,445 V bei 0,01 mol, aber 0,483 V bei 0,1 — die Abweichung wechselt mit der Konzentration das Vorzeichen, sodass keine 'immer ein bisschen weniger'-Faustregel überlebt."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "The equation as printed is the physics: concentrations go into the log because that is where the book put them — the activity footnote never made it into working memory."
reveals_de = "Die gedruckte Gleichung gilt als die Physik: Konzentrationen gehen in den Logarithmus ein, weil das Buch sie dort hingesetzt hat — die Fußnote zur Aktivität hat es nie ins Arbeitsgedächtnis geschafft."
next = "This lab has taught the same lesson three times with different meters: `ph-is-not-quite-minus-log-c` (the pH electrode), `half-oxidised-iron-reads-its-own-potential` (the redox electrode), and now the whole cell. Look at v2's lv3 speciation: the CuSO₄ ion pair holds a third of the copper, and the pinned engine test asserts the drop is less than ideal rather than any particular number — the deviation is the chemistry."
next_de = "Dieses Labor hat dieselbe Lektion bereits dreimal mit verschiedenen Messgeräten vermittelt: `ph-is-not-quite-minus-log-c` (die pH-Elektrode), `half-oxidised-iron-reads-its-own-potential` (die Redoxelektrode), und jetzt die ganze Zelle. Sieh dir die lv3-Speziation von v2 an: Das Ionenpaar CuSO₄ hält ein Drittel des Kupfers, und der fixierte Engine-Test behauptet, dass der Abfall geringer ist als ideal, nicht irgendeine bestimmte Zahl — die Abweichung selbst ist die Chemie."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Voltage as identity: what a metal 'is' sets its potential, and amount is bookkeeping — the log term has no physical meaning attached."
reveals_de = "Spannung als Identität: Was ein Metall 'ist', legt sein Potenzial fest, und die Menge ist bloße Buchhaltung — der Logarithmusterm hat keine physikalische Bedeutung."
next = "Run the strongest counterexample first (`a-battery-from-nothing-but-imbalance`): two identical copper electrodes, nothing different but the concentration, and a real 18 mV appears. If amount didn't move potentials, that cell would read zero forever."
next_de = "Führe zuerst das stärkste Gegenbeispiel aus (`a-battery-from-nothing-but-imbalance`): zwei identische Kupferelektroden, nichts unterschiedlich außer der Konzentration, und trotzdem erscheinen echte 18 mV. Würde die Menge Potenziale nicht bewegen, würde diese Zelle für immer null anzeigen."

[reaction.registers]
lv1 = "Water down one side of the battery and its push gets weaker — but less weak than the rule of thumb promised. The beaker knows something the slide rule doesn't: how much of the copper is really free."
lv1_de = "Verdünnst du eine Seite der Batterie, wird ihr Schub schwächer — aber weniger schwach, als die Faustregel versprochen hat. Das Becherglas weiß etwas, das der Rechenschieber nicht weiß: wie viel vom Kupfer wirklich frei ist."
lv2 = "E = E° − (0.0592/2)·log(a(Zn²⁺)/a(Cu²⁺)). Tenfold less total copper should cost 29.6 mV if concentration were activity; the bench reads 1.104 → 1.086 V, a drop of 18.2 mV, because sulfate pairing means the free-Cu²⁺ ratio between the two solutions is nearer 4 than 10."
lv2_de = "E = E° − (0,0592/2)·log(a(Zn²⁺)/a(Cu²⁺)). Zehnfach weniger Gesamtkupfer sollte 29,6 mV kosten, wäre Konzentration gleich Aktivität; das Labor liest 1,104 → 1,086 V, ein Abfall von 18,2 mV, weil die Sulfat-Paarung bedeutet, dass das Verhältnis des freien Cu²⁺ zwischen beiden Lösungen näher bei 4 als bei 10 liegt."
lv3 = "The fails_at of the concentration-form Nernst, written as chemistry: in molar-strength sulfate media the ion pair CuSO₄(aq) carries a large share of the copper, and the share *changes with dilution*, so no fixed correction rescues the concentration form. The engine's regression test deliberately asserts an inequality (drop < ideal) rather than 18.2 mV, because the honest claim is the mechanism, not this scenario's number. The copper–silver pair supplies the sign-flip witness (0.445 V at 0.01 mol, 0.483 V at 0.1, against E° 0.458): at low concentration the n=1 silver term dominates the deficit, at high concentration the sulfate-starved copper term overpowers it."
lv3_de = "Das fails_at der konzentrationsbasierten Nernst-Form, als Chemie ausgedrückt: In molar starken Sulfatmedien trägt das Ionenpaar CuSO₄(aq) einen großen Anteil des Kupfers, und dieser Anteil *ändert sich mit der Verdünnung*, sodass keine feste Korrektur die Konzentrationsform rettet. Der Regressionstest der Engine behauptet bewusst eine Ungleichung (Abfall < ideal) statt 18,2 mV, weil die ehrliche Aussage der Mechanismus ist, nicht die Zahl dieses Szenarios. Das Kupfer-Silber-Paar liefert den Vorzeichenwechsel-Zeugen (0,445 V bei 0,01 mol, 0,483 V bei 0,1, gegenüber E° 0,458): Bei niedriger Konzentration dominiert der n=1-Silberterm das Defizit, bei hoher Konzentration überwiegt der sulfatarme Kupferterm."

