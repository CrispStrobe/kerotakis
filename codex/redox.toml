[[reaction.curriculum]]
system = "england-gcse-combined-science"
stage = "GCSE Combined Science: Trilogy (AQA 8464), 4.4.3 Electrolysis"
ages = { min = 14.0, max = 16.0 }
source = "AQA GCSE Combined Science: Trilogy specification (8464), Section 4.4.3 — electrolysis of aqueous solutions and the relationship between charge and mass deposited"

[reaction.setup]
script = """
add v1 water 100mL
add v1 CuSO4 0.05mol
add v1 Cu 0.01mol
electrolyse v1 0.5A 1930s
"""

[reaction.expect]
events = ["electrolysed:Cu", "gas_evolved:O2"]
ph = { min = 1.75, max = 1.95 }

[reaction.expect.predict]
question = "Half an ampere runs for 1930 seconds through copper sulfate — 965 coulombs, almost exactly a hundredth of a faraday. How much copper lands on the cathode?"
question_de = "Ein halbes Ampere fließt 1930 Sekunden lang durch Kupfersulfat — 965 Coulomb, fast genau ein Hundertstel Faraday. Wie viel Kupfer landet an der Kathode?"
options = [
  "0.0100 mol — one mole of electrons deposits one mole of metal",
  "0.0050 mol — every copper ion demands two electrons",
  "No saying without the voltage — volts are what drive electroplating",
]
answer = 1
misconception = "The chain is Q = It, n(e⁻) = Q/F, n(metal) = n(e⁻)/z, m = nM — and three of those four steps are pure arithmetic. The divisor z is the single piece of chemistry in it: Cu²⁺ takes two electrons, so a hundredth of a faraday buys half a hundredth of copper. Voltage decides whether the deposition runs at all; the charge decides how much, to four figures."
misconception_de = "Die Kette lautet Q = It, n(e⁻) = Q/F, n(Metall) = n(e⁻)/z, m = nM — und drei dieser vier Schritte sind reine Arithmetik. Der Divisor z ist das einzige Stück Chemie darin: Cu²⁺ nimmt zwei Elektronen auf, also erkauft ein Hundertstel Faraday ein halbes Hundertstel Kupfer. Die Spannung entscheidet, ob die Abscheidung überhaupt läuft; die Ladung entscheidet, wie viel — auf vier Stellen genau."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Electrons and atoms pair one-to-one — the ion's charge, the only chemical input in the whole calculation, is the step that got skipped."
reveals_de = "Elektronen und Atome werden eins zu eins gepaart — die Ladung des Ions, der einzige chemische Beitrag in der ganzen Rechnung, ist der Schritt, der übersprungen wurde."
next = "Run the zinc twin: the same 965 C into zinc sulfate deposits the same 0.0050 mol — 0.327 g against copper's 0.318, differing only by molar mass — because both ions are 2+. Then imagine silver: the same charge would deposit 0.0100 mol, since Ag⁺ takes one. The electron count sets the moles; the ion's charge is the exchange rate."
next_de = "Führe das Zinkzwilling-Experiment aus: Dieselben 965 C in Zinksulfat scheiden dieselben 0,0050 mol ab — 0,327 g gegenüber Kupfers 0,318, nur durch die Molmasse unterschieden — weil beide Ionen 2+ sind. Stell dir dann Silber vor: Dieselbe Ladung würde 0,0100 mol abscheiden, da Ag⁺ nur eines aufnimmt. Die Elektronenzahl legt die Molmenge fest; die Ladung des Ions ist der Umtauschkurs."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Voltage as the quantity dial: more volts, more metal — the roles of the two electrical quantities are merged into 'electricity'."
reveals_de = "Spannung als Mengenregler: mehr Volt, mehr Metall — die Rollen der beiden elektrischen Größen verschmelzen in dieser Vorstellung zu 'Elektrizität'."
next = "Separate them the way the meter does: voltage is the pressure that decides whether Cu²⁺ + 2e⁻ → Cu runs; charge is the count of electrons that actually crossed, and every single one is accounted for in the deposit. Faraday weighed exactly this in 1833 — the balance as an electron counter."
next_de = "Trenne sie so, wie es das Messgerät tut: Spannung ist der Druck, der entscheidet, ob Cu²⁺ + 2e⁻ → Cu abläuft; Ladung ist die Anzahl der Elektronen, die tatsächlich hinübergewandert sind, und jedes einzelne davon findet sich in der Abscheidung wieder. Genau das wog Faraday 1833 — die Waage als Elektronenzähler."

[reaction.registers]
lv1 = "Wire a battery to the blue bath and copper grows on the wire — and it grows by strict bookkeeping: run the current twice as long, get exactly twice the copper. Electricity is countable stuff, and the metal counts it for you."
lv1_de = "Schließt du eine Batterie an das blaue Bad an, wächst Kupfer auf dem Draht — und es wächst nach strenger Buchhaltung: Lässt du den Strom doppelt so lange fließen, bekommst du genau doppelt so viel Kupfer. Elektrizität ist zählbares Zeug, und das Metall zählt es für dich."
lv2 = "Q = 0.5 A × 1930 s = 965 C → n(e⁻) = Q/F = 0.0100 mol → n(Cu) = 0.0050 mol → m = 0.318 g. Dose it: 120 C gives 0.040 g, 3600 C gives 1.185 g — mass tracks charge through the whole series."
lv2_de = "Q = 0,5 A × 1930 s = 965 C → n(e⁻) = Q/F = 0,0100 mol → n(Cu) = 0,0050 mol → m = 0,318 g. Dosiere es: 120 C ergeben 0,040 g, 3600 C ergeben 1,185 g — die Masse folgt der Ladung über die ganze Reihe hinweg."
lv3 = "Only the 2 is chemistry: the bench reads the divisor off the couple the vessel holds rather than being told, and the rest is arithmetic a learner can check by hand — which is the entry's point. Boundaries, stated by the bench where they bite: charge beyond what the solution's copper can absorb stops at the supply with the note that a real cell would electrolyse the water instead; and brine is refused outright, because chlorine chemistry is not modelled — the chlor-alkali cell, the most famous industrial electrolysis of all, is a named gap rather than a wrong answer."
lv3_de = "Nur die 2 ist Chemie: Das Labor liest den Divisor aus dem Redoxpaar ab, das das Gefäß enthält, statt ihn gesagt zu bekommen, und der Rest ist Arithmetik, die eine lernende Person von Hand nachprüfen kann — genau das ist der Punkt dieses Eintrags. Grenzen, vom Labor benannt, wo sie zum Tragen kommen: Ladung über das hinaus, was das Kupfer der Lösung aufnehmen kann, stoppt an der Quelle, mit dem Hinweis, dass eine echte Zelle stattdessen das Wasser elektrolysieren würde; und Sole wird rundweg abgelehnt, weil Chlorchemie nicht modelliert wird — die Chlor-Alkali-Elektrolyse, die berühmteste industrielle Elektrolyse überhaupt, ist eine benannte Lücke, keine falsche Antwort."

[reaction.provenance]
source = "Standard curriculum electrolysis (Faraday's laws, 1833); F = 96485 C/mol (CODATA). Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "Kerotakis electrolysis operator (charge → electrons → moles via the vessel's own couple) over PHREEQC via Kerotakis L2"

[[reaction]]
id = "the-plating-bath-turns-acid"
spine = ["elektrolyse"]
summary = "2 H₂O → O₂ + 4 H⁺ + 4 e⁻ — the inert anode pays the charge bill in protons"
summary_de = "2 H₂O → O₂ + 4 H⁺ + 4 e⁻ — die inerte Anode begleicht die Ladungsrechnung in Protonen"
concepts = ["electrolysis", "charge-conservation"]
requires = ["electrolysis"]
apparatus = ["beaker", "power-supply", "ph-meter"]
calculations = ["faraday"]
[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 12, LB Redoxchemie — Elektrolyse"
ages = { min = 17.0, max = 18.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Oberstufe (ISB) — anode reactions during electrolysis with inert electrodes"

[[reaction.curriculum]]
system = "england-gcse-combined-science"
stage = "GCSE Combined Science: Trilogy (AQA 8464), 4.4.3 Electrolysis"
ages = { min = 14.0, max = 16.0 }
source = "AQA GCSE Combined Science: Trilogy specification (8464), Section 4.4.3 — electrolysis of aqueous solutions, reactions at electrodes"

[reaction.setup]
script = """
add v1 water 100mL
add v1 CuSO4 0.05mol
add v1 Cu 0.01mol
electrolyse v1 0.5A 1930s
"""

[reaction.expect]
events = ["gas_evolved:O2", "electrolysed:Cu"]
ph = { min = 1.75, max = 1.95 }

[reaction.expect.predict]
question = "You electroplate 0.318 g of copper out of the blue bath. What happens to the bath's pH?"
question_de = "Du scheidest 0,318 g Kupfer aus dem blauen Bad ab. Was passiert mit dem pH-Wert des Bades?"
options = [
  "Nothing — plating moves metal, and metal is not acid",
  "It crashes, from 4.3 to 1.8: every Cu²⁺ removed left its charge behind, and the anode pays the bill in protons",
  "It rises — taking the metal out 'frees up' the solution",
]
answer = 1
misconception = "Charge conservation runs the show: every Cu²⁺ that leaves the solution as metal takes two positive charges out of the water, and the solution cannot simply go negative. At the inert anode the books are balanced by oxidising water itself — 2 H₂O → O₂ + 4 H⁺ + 4 e⁻ — so oxygen bubbles away and acid accumulates, one proton per electron. Nobody expects electroplating to acidify the bath, and it falls straight out of the ledger."
misconception_de = "Ladungserhaltung führt hier Regie: Jedes Cu²⁺, das die Lösung als Metall verlässt, nimmt zwei positive Ladungen aus dem Wasser mit, und die Lösung kann nicht einfach negativ werden. An der inerten Anode wird die Bilanz durch die Oxidation des Wassers selbst ausgeglichen — 2 H₂O → O₂ + 4 H⁺ + 4 e⁻ —, sodass Sauerstoff entweicht und sich Säure ansammelt, ein Proton pro Elektron. Niemand erwartet, dass Galvanisieren das Bad ansäuert, und doch fällt es direkt aus der Bilanz heraus."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "The cathode is the whole story: metal moves there, so that is where the chemistry is — the anode is just the other wire."
reveals_de = "Die Kathode ist die ganze Geschichte: Dort bewegt sich Metall, also ist dort die Chemie — die Anode ist nur der andere Draht."
next = "Follow the electrons the cathode consumed back to their source: they came out of water molecules at the anode, and each departure left a proton. The bench books it exactly — 0.0025 mol of O₂ leaves the open vessel, the water inventory drops from 5.5342 to 5.5292 mol, and the pH lands at 1.84. A circuit has two ends, and both of them do chemistry."
next_de = "Verfolge die von der Kathode verbrauchten Elektronen zurück zu ihrer Quelle: Sie stammten aus Wassermolekülen an der Anode, und jeder Abgang hinterließ ein Proton. Das Labor bucht das genau — 0,0025 mol O₂ verlassen das offene Gefäß, das Wasserinventar sinkt von 5,5342 auf 5,5292 mol, und der pH-Wert landet bei 1,84. Ein Stromkreis hat zwei Enden, und an beiden findet Chemie statt."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Solutes as burden: removing anything 'frees' the solution and moves it toward pure water's 7 — dissolved copper and acidity filed as the same kind of impurity."
reveals_de = "Gelöste Stoffe als Last: Entfernt man irgendetwas, 'befreit' das die Lösung angeblich und bewegt sie in Richtung der 7 des reinen Wassers — gelöstes Kupfer und Säure werden hier als dieselbe Art von Verunreinigung eingeordnet."
next = "Check what was actually removed and what was created: the copper left, but its counter-charge did not — sulfate stays, and new H⁺ arrived to face it. The bath ends as dilute sulfuric acid, which is why industrial plating shops monitor and dose their baths instead of trusting them to self-purify."
next_de = "Prüfe, was tatsächlich entfernt und was neu erzeugt wurde: Das Kupfer verließ die Lösung, seine Gegenladung aber nicht — Sulfat bleibt, und neues H⁺ kam hinzu, um ihm gegenüberzustehen. Das Bad endet als verdünnte Schwefelsäure, weshalb industrielle Galvanikbetriebe ihre Bäder überwachen und dosieren, statt ihnen eine Selbstreinigung zuzutrauen."

[reaction.registers]
lv1 = "Plate the copper out and the bath turns sour — sharp enough to sting. The bubbles at the other wire are the clue: the water itself is being taken apart to pay for the copper you removed."
lv1_de = "Scheidest du das Kupfer ab, wird das Bad sauer — scharf genug, um zu brennen. Die Blasen am anderen Draht sind der Hinweis: Das Wasser selbst wird auseinandergenommen, um das entnommene Kupfer zu bezahlen."
lv2 = "Cathode: Cu²⁺ + 2e⁻ → Cu. Anode (inert): 2 H₂O → O₂↑ + 4 H⁺ + 4 e⁻. Per 0.0100 mol of electrons: 0.0050 mol copper deposited, 0.0025 mol oxygen out, 0.0100 mol H⁺ made — pH 4.27 → 1.84."
lv2_de = "Kathode: Cu²⁺ + 2e⁻ → Cu. Anode (inert): 2 H₂O → O₂↑ + 4 H⁺ + 4 e⁻. Pro 0,0100 mol Elektronen: 0,0050 mol Kupfer abgeschieden, 0,0025 mol Sauerstoff entwichen, 0,0100 mol H⁺ gebildet — pH 4,27 → 1,84."
lv3 = "Which anode is the load-bearing choice, and the bench names its own: the *inert* anode (the school's carbon rods), where water is oxidised and acid accumulates. A *copper* anode dissolves to replace exactly what plates out — Cu²⁺ constant, no acid, no oxygen — and that different cell is electrorefining, which this bench does not model. Same cathode, opposite bath chemistry, decided entirely at the electrode you were not watching."
lv3_de = "Welche Anode zum Einsatz kommt, ist die tragende Wahl, und das Labor benennt seine eigene: die *inerte* Anode (die Kohlestäbe aus dem Schulversuch), an der Wasser oxidiert wird und sich Säure ansammelt. Eine *Kupfer*-Anode löst sich auf und ersetzt genau das, was sich abscheidet — Cu²⁺ bleibt konstant, keine Säure, kein Sauerstoff — und diese andere Zelle ist die Elektroraffination, die dieses Labor nicht modelliert. Gleiche Kathode, entgegengesetzte Badchemie, entschieden ganz an der Elektrode, die du nicht im Blick hattest."

[reaction.provenance]
source = "Standard curriculum electrolysis with inert electrodes; anode water oxidation stoichiometry is textbook; charge bookkeeping computed. Diagnoses: Editorial judgement (Kerotakis), drafted with model assistance (Claude, 2026-08-20)"
computed_by = "Kerotakis electrolysis operator (inert anode; charge-conserving) over PHREEQC via Kerotakis L2"

# ------------------------------------------------------------ accumulators

[[reaction]]
id = "charging-fights-the-series"
spine = ["akkumulatoren"]
summary = "Charging drives the cell backwards and the deposit survives on a kinetic leash — hydrogen formation on zinc costs ~0.72 V of overpotential, and gassing is what happens when the leash slips"
summary_de = "Laden treibt die Zelle rückwärts, und die Abscheidung überlebt an einer kinetischen Leine — Wasserstoffbildung auf Zink kostet ~0,72 V Überspannung, und Gasbildung ist das, was passiert, wenn die Leine reißt"
concepts = ["accumulators", "electrolysis"]
requires = ["galvanic-cells", "electrolysis"]
apparatus = ["beaker", "voltmeter", "power-supply"]
calculations = ["faraday", "cell-potential"]
[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 12, LB Redoxchemie — Akkumulatoren"
ages = { min = 17.0, max = 18.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Oberstufe (ISB) — accumulators as reversible electrochemical cells"

[reaction.setup]
script = """
add v1 water 100mL
add v1 ZnSO4 0.01mol
add v1 Zn 0.05mol
new
add v2 water 100mL
add v2 CuSO4 0.01mol
add v2 Cu 0.05mol
cell v1 v2
electrolyse v1 0.5A 386s
add v1 HCl 0.05mol
"""

[reaction.expect]
events = ["cell_voltage", "electrolysed:Zn", "inert:Zn", "consumed:Zn", "gas_evolved:H2"]
ph = { min = 4.75, max = 5.0 }

[reaction.expect.predict]
question = "The Daniell cell offers 1.104 V, spending zinc as it discharges. What is 'charging' — the thing that makes an accumulator rechargeable?"
question_de = "Die Daniell-Zelle bietet 1,104 V und verbraucht beim Entladen Zink. Was ist 'Laden' — das, was einen Akkumulator wiederaufladbar macht?"
options = [
  "Refilling it with electricity, which it stores the way a tank stores fuel",
  "Using an outside current to run the cell's own reaction backwards, rebuilding the metal that discharging consumed",
  "Replacing the used-up chemicals with fresh ones",
]
answer = 1
misconception = "A battery stores no electricity — it stores a chemical reaction held ready to run. Discharging lets the reaction run downhill through the wire; charging is an outside supply forcing the same reaction uphill, re-depositing the anode metal electron by electron (193 C here rebuilds 0.0010 mol of zinc, by the same Faraday arithmetic as any electrolysis). The tank picture fails at exactly the point that matters: what is stored is a chemical arrangement, not a substance called electricity."
misconception_de = "Eine Batterie speichert keine Elektrizität — sie speichert eine chemische Reaktion, startbereit gehalten. Beim Entladen läuft die Reaktion bergab durch den Draht; Laden ist eine äußere Quelle, die dieselbe Reaktion bergauf zwingt und das Anodenmetall Elektron für Elektron wieder aufbaut (193 C bauen hier 0,0010 mol Zink wieder auf, nach derselben Faraday-Arithmetik wie jede Elektrolyse). Das Tank-Bild versagt genau an dem Punkt, der zählt: Gespeichert wird eine chemische Anordnung, kein Stoff namens Elektrizität."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Electricity as a stored fluid: charge goes in, sloshes about, comes back out — the oldest model of electricity, and inside a battery it is wrong in a way that matters."
reveals_de = "Elektrizität als gespeicherte Flüssigkeit: Ladung geht hinein, schwappt herum, kommt wieder heraus — das älteste Modell der Elektrizität, und innerhalb einer Batterie ist es auf eine Weise falsch, die zählt."
next = "Weigh the electrodes across a cycle instead of imagining the tank: discharging thins the zinc, charging thickens it back — matter moves, which no stored-fluid picture predicts. The bench shows the rebuild directly: 193 coulombs in, 0.065 g of zinc back on the metal."
next_de = "Wiege die Elektroden über einen Zyklus hinweg, statt dir den Tank vorzustellen: Entladen macht das Zink dünner, Laden lässt es wieder dicker werden — Materie bewegt sich, was kein Bild einer gespeicherten Flüssigkeit vorhersagt. Das Labor zeigt den Wiederaufbau direkt: 193 Coulomb hinein, 0,065 g Zink zurück auf dem Metall."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Rechargeable and disposable batteries differ by service regime: someone, somewhere, swaps the chemicals — regeneration by current is not in the picture."
reveals_de = "Wiederaufladbare und Einwegbatterien unterscheiden sich hier nur im Wartungsregime: Irgendjemand, irgendwo, tauscht die Chemikalien aus — Regeneration durch Strom kommt in dieser Vorstellung nicht vor."
next = "Nothing enters the cell but electrons: the 'fresh chemicals' are the old ones, pushed back up the hill they ran down. That is the whole distinction from a primary cell — an accumulator's chemistry is reversible in place, which is also why its electrodes must survive being rebuilt a thousand times."
next_de = "Nichts gelangt in die Zelle außer Elektronen: Die 'frischen Chemikalien' sind die alten, zurückgeschoben den Hügel hinauf, den sie hinabgelaufen sind. Das ist der ganze Unterschied zu einer Primärzelle — die Chemie eines Akkumulators ist an Ort und Stelle umkehrbar, weshalb seine Elektroden auch tausendfachen Wiederaufbau überstehen müssen."

[reaction.registers]
lv1 = "Push the current backwards and fresh zinc grows onto the metal — and it stays there, even though the sour bath would love to eat it, because making hydrogen bubbles on zinc is hard work. That hardness is the battery's bodyguard. Overwhelm it with too much acid and the bodyguard loses: fizz, and your stored charge leaves as gas."
lv1_de = "Schiebst du den Strom rückwärts, wächst frisches Zink auf dem Metall — und es bleibt dort, obwohl das saure Bad es liebend gern auffressen würde, weil das Bilden von Wasserstoffblasen auf Zink harte Arbeit ist. Diese Härte ist der Leibwächter der Batterie. Überwältigst du ihn mit zu viel Säure, verliert der Leibwächter: Sprudeln, und deine gespeicherte Ladung entweicht als Gas."
lv2 = "Discharge: Zn + Cu²⁺ → Zn²⁺ + Cu, offering 1.104 V. Charge: an external supply drives Zn²⁺ + 2e⁻ → Zn against the series — 193 C = 0.0020 mol of electrons rebuilds 0.0010 mol (0.0654 g) of zinc while the inert anode acidifies the bath to pH 2.13. And the deposit holds: dissolving it would need hydrogen to form on zinc, and that costs ~0.72 V of overpotential against a driving force of only +0.69 V. Pour in strong acid and the barrier is cleared: Zn + 2 H⁺ → Zn²⁺ + H₂, 0.026 mol of gas, the charge undone."
lv2_de = "Entladen: Zn + Cu²⁺ → Zn²⁺ + Cu, bietet 1,104 V. Laden: Eine äußere Quelle treibt Zn²⁺ + 2e⁻ → Zn gegen die Spannungsreihe — 193 C = 0,0020 mol Elektronen bauen 0,0010 mol (0,0654 g) Zink wieder auf, während die inerte Anode das Bad auf pH 2,13 ansäuert. Und die Abscheidung hält: Ihre Auflösung würde erfordern, dass sich Wasserstoff auf Zink bildet, und das kostet ~0,72 V Überspannung gegenüber einer Triebkraft von nur +0,69 V. Gibt man starke Säure hinzu, ist die Barriere überwunden: Zn + 2 H⁺ → Zn²⁺ + H₂, 0,026 mol Gas, die Ladung rückgängig gemacht."
lv3 = "The bench's own verdict is the entry's thesis, verbatim: 'zinc should dissolve in this acid by the series (driving force +0.69 V), but hydrogen has to form on zinc, and on that surface it costs an overpotential of about 0.72 V. Kinetically blocked on the timescale of a lesson, not thermodynamically inert — the difference between a bench and a battery.' That 0.03 V of grace is why rechargeable cells exist — on zinc here, on lead in every car battery — and gassing on overcharge is precisely the leash slipping, staged in this script's final act with molar acid. Honesty, three ways: the overdriven margin clears by only 0.07 V because the bath's own sulfate and chloride speciation holds a(H⁺) below one (at a true pH 0 it would be 0.04 V), and a rate that close to its barrier is not computed — the bench says 'it reacts, slowly' and claims no more; the overpotential itself is a curated kinetic constant, not a computed one; and the cell and electrolysis remain uncoupled — nothing here computes discharge under load, internal resistance or capacity, so 'a cell run backwards' is a statement about half-reactions, not runtime."
lv3_de = "Das eigene Urteil des Labors ist die These dieses Eintrags, wörtlich: 'Zink sollte sich nach der Spannungsreihe in dieser Säure lösen (Triebkraft +0,69 V), aber Wasserstoff muss sich auf Zink bilden, und auf dieser Oberfläche kostet das eine Überspannung von etwa 0,72 V. Kinetisch blockiert auf der Zeitskala einer Unterrichtsstunde, nicht thermodynamisch inert — der Unterschied zwischen einem Labor und einer Batterie.' Diese 0,03 V Gnadenfrist sind der Grund, warum wiederaufladbare Zellen existieren — hier auf Zink, auf Blei in jeder Autobatterie — und Gasbildung bei Überladung ist genau das Reißen dieser Leine, im letzten Akt dieses Skripts mit molarer Säure inszeniert. Ehrlichkeit, in drei Punkten: Der übersteuerte Spielraum reicht nur um 0,07 V, weil die eigene Sulfat- und Chlorid-Speziation des Bades a(H⁺) unter eins hält (bei einem echten pH 0 wären es 0,04 V), und eine Geschwindigkeit so nahe an ihrer Barriere wird nicht berechnet — das Labor sagt 'es reagiert, langsam' und behauptet nicht mehr; die Überspannung selbst ist eine kuratierte kinetische Konstante, keine berechnete; und Zelle und Elektrolyse bleiben entkoppelt — nichts hier berechnet Entladung unter Last, Innenwiderstand oder Kapazität, sodass 'eine rückwärts laufende Zelle' eine Aussage über Halbreaktionen ist, keine über Laufzeitverhalten."

