[reaction.expect.predict]
question = "A lump of zinc sits in iron(II) sulfate solution. What happens — and why do steel ship hulls carry bolted-on zinc blocks?"
question_de = "Ein Klumpen Zink liegt in Eisen(II)-sulfat-Lösung. Was passiert — und warum tragen Stahlschiffsrümpfe angeschraubte Zinkblöcke?"
options = [
  "Nothing; zinc and iron are too similar to bother each other",
  "Iron metal plates out while the zinc dissolves — zinc gives its electrons first, which is exactly the sacrifice the hull block makes",
  "The zinc rusts instead of the iron, because rust prefers the more reactive metal",
]
answer = 1
misconception = "The third answer has the right instinct dressed in the wrong mechanism: nothing 'prefers' — zinc simply sits below iron in the series, so wherever electrons are demanded, zinc pays before iron does. In this beaker that means dissolved iron is pushed back to metal at zinc's expense; on a hull it means the corrosion current drains the replaceable block instead of the irreplaceable plate. Same ordering, same sacrifice."
misconception_de = "Die dritte Antwort hat den richtigen Instinkt, aber im falschen Mechanismus verpackt: Nichts 'bevorzugt' irgendetwas — Zink steht in der Spannungsreihe einfach unter Eisen, sodass Zink überall dort zahlt, wo Elektronen verlangt werden, bevor Eisen es tut. In diesem Becherglas heißt das: gelöstes Eisen wird auf Kosten des Zinks zu Metall zurückgedrängt; an einem Rumpf heißt es, dass der Korrosionsstrom den ersetzbaren Block statt der unersetzlichen Platte entleert. Dieselbe Ordnung, dasselbe Opfer."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Similar metals, no chemistry: reactivity differences are imagined to need drama — acid against metal, not grey against grey."
reveals_de = "Ähnliche Metalle, keine Chemie: Man stellt sich vor, Reaktivitätsunterschiede bräuchten Drama — Säure gegen Metall, nicht Grau gegen Grau."
next = "The gap only has to be nonzero: −0.76 V against −0.45 V is enough for every last iron ion here. `inspect` afterwards: 0.0100 mol of iron plated out, the zinc gone into solution — a third of a volt, fully spent."
next_de = "Der Abstand muss nur ungleich null sein: −0,76 V gegenüber −0,45 V reicht hier für jedes letzte Eisen-Ion. `inspect` danach: 0,0100 mol Eisen abgeschieden, das Zink vollständig in Lösung gegangen — ein Drittel Volt, ganz aufgebraucht."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Rust as an agent with preferences, hopping to the more reactive metal — protection imagined as decoy behaviour rather than as electron bookkeeping."
reveals_de = "Rost als Akteur mit Vorlieben, der zum reaktiveren Metall überspringt — Schutz vorgestellt als Ablenkungsverhalten statt als Elektronenbuchhaltung."
next = "Replace 'prefers' with a direction: electrons flow from the lower metal up to whatever is being reduced. The zinc block corrodes *because* it is the electron source of least resistance — no preference, just the same ordering that made iron plate out in this beaker."
next_de = "Ersetze 'bevorzugt' durch eine Richtung: Elektronen fließen vom niedrigeren Metall hinauf zu allem, was reduziert wird. Der Zinkblock korrodiert *weil* er die Elektronenquelle des geringsten Widerstands ist — keine Vorliebe, nur dieselbe Ordnung, die in diesem Becherglas dafür sorgte, dass Eisen abgeschieden wurde."

[reaction.registers]
lv1 = "The zinc lump slowly gives itself away, and grey iron fur grows where it stood. On a ship it is the same trick: bolt on a lump of zinc and the sea eats the lump instead of the hull — a bodyguard that takes the hit on purpose."
lv1_de = "Der Zinkklumpen gibt sich langsam selbst preis, und dort, wo er lag, wächst grauer Eisenpelz. Bei einem Schiff ist es derselbe Trick: Man schraubt einen Klumpen Zink an, und das Meer frisst den Klumpen statt den Rumpf — ein Leibwächter, der den Treffer absichtlich abbekommt."
lv2 = "Zn + Fe²⁺ → Zn²⁺ + Fe (E° −0.76 V below −0.45 V): 0.0100 mol of iron plates onto the dissolving zinc. Sacrificial protection is this reaction run as a maintenance plan — the zinc is cheaper to replace than the steel it guards."
lv2_de = "Zn + Fe²⁺ → Zn²⁺ + Fe (E° −0,76 V unter −0,45 V): 0,0100 mol Eisen scheiden sich auf dem sich auflösenden Zink ab. Der Opferschutz ist diese Reaktion, betrieben als Wartungsplan — das Zink ist billiger zu ersetzen als der Stahl, den es bewacht."
lv3 = "This is P3e's 'why zinc protects iron', answered by computation rather than assertion: the direction falls out of the same Nernst comparison as every other pairing in the series. Honesty notes: real hull protection is an electrochemical cell with oxygen at the cathode, richer than this single beaker; and the fresh iron chemistry here sits near known engine boundaries (a supersaturation this registry cannot name may be reported), so this entry pins amounts and pH, not potentials."
lv3_de = "Dies ist P3es 'Warum Zink Eisen schützt', beantwortet durch Berechnung statt Behauptung: Die Richtung fällt aus demselben Nernst-Vergleich heraus wie bei jedem anderen Paar in der Spannungsreihe. Ehrlichkeitshinweise: Echter Rumpfschutz ist eine elektrochemische Zelle mit Sauerstoff an der Kathode, reichhaltiger als dieses einzelne Becherglas; und die frische Eisenchemie hier liegt nahe bekannter Grenzen der Engine (eine Übersättigung, die diese Datenbank nicht benennen kann, kann gemeldet werden), weshalb dieser Eintrag Mengen und pH-Wert festlegt, nicht Potenziale."

