source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "alkene-und-alkine"
label_de = "Alkene und Alkine"
broader = "die-kohlenwasserstoffe-als-grundstoffe-in-der-organischen-chemie"
oeh = "d64bb6c9-2831-4b2f-83b0-235f19e967be"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "alkohol-im-alltag"
label_de = "Alkohol im Alltag"
definition_de = "Alkohole werden im Alltag vielfältig eingesetzt. Ethanol oder alkoholische Getränke sind alltäglich, aber auch ein Suchtmittel. Gleichzeitig wird es als Treibstoff verwendet und ist Ausgangspunkt für vielfältige Synthesen."
broader = "alkohole-kohlenwasserstoffe-mit-einer-oh-gruppe"
oeh = "1b259726-e33b-4261-bb13-1f9273690cd0"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "alkohole-kohlenwasserstoffe-mit-einer-oh-gruppe"
label_de = "Alkohole - Kohlenwasserstoffe mit einer OH-Gruppe"
definition_de = "Alkohole sind eine Gruppe organischer Verbindungen, bei denen an einem Kohlenstoffatom mindestens ein Wasserstoffatom durch eine OH-Gruppe (Hydroxylgruppe) ersetzt ist. Diese funktionelle Gruppe beeinflusst die Eigenschaften der Alkohole sehr stark."
oeh = "e922a40a-2dd2-432a-ab8e-a6783cd6e8f2"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "amine-organische-verwandte-des-ammoniaks"
label_de = "Amine - Organische Verwandte des Ammoniaks"
definition_de = "Amine sind organische Verbindungen, die als Verwandte des Ammoniaks angesehen werden können, da ein bis drei der Wasserstoffatome des Ammoniaks durch Kohlenwasserstoffreste ersetzt sind. Es gibt eine Vielzahl verschiedener Amine, die sich unter anderem in ihrer Struktur (Ring- oder Kettenstruktur) und in der Anzahl der im Molekül vorhandenen Stickstoffatome unterscheiden. Aufgrund dieser Vielfalt ist auch die Bandbreite der Stoffeigenschaften von Aminen sehr groß."
oeh = "c27947c9-a739-435f-aa0e-0973822f95f9"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "analytische-verfahren"
label_de = "Analytische Verfahren"
definition_de = "Analytische Verfahren spielen sowohl in der praktischen Anwendung der Chemie als auch in der Forschung eine zentrale Rolle. Sie können einerseits durch qualitative Nachweisreaktionen helfen zu klären, welche Stoffe in einer bestimmten Probe vorhanden sind. Andererseits können Chemiker:innen durch quantitative analytische Verfahren wie die Massenspektrometrie, spektroskopische sowie chromatographische Verfahren Aussagen über die Konzentration eines Analyten in einer Probe machen."
broader = "fachmethoden-und-reflexion"
oeh = "4384893e-1e13-4c9d-970b-29e69cc2a87c"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "anfangsunterricht"
label_de = "Anfangsunterricht"
definition_de = "Zu Beginn des Chemieunterrichts geht es in der Regel um die Klärung des Stoffbegriffs sowie um die Eigenschaften chemischer Reaktionen. Denn diese sind mit der Zerstörung von Ausgangsstoffen und der Bildung neuer Stoffe sowie mit einem Energieumsatz verbunden.  Der Anfangsunterricht versucht, diese Grundlagen zu vermitteln."
broader = "chemie"
oeh = "a79a644c-ecfc-4b65-8cf2-bb9b0c13dac4"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "aromaten-ringe-mit-delokalisierten-elektronensystemen"
label_de = "Aromaten - Ringe mit delokalisierten Elektronensystemen"
definition_de = "Aromaten sind eine Stoffklasse organischer Verbindungen, die mindestens ein Ringsystem mit alternierenden - konjugierten - Doppelbindungen enthalten. Der bekannteste und zugleich einer der einfachsten Vertreter dieser Stoffklasse ist das Benzol. Aromatische Verbindungen verhalten sich oft anders, als ihre Strukturformel auf den ersten Blick vermuten lässt: Sie zeigen eben nicht die für Moleküle mit Doppelbindungen typischen Reaktionen, da ihr Doppelbindungssystem durch Mesomerie stabilisiert ist."
oeh = "7c95b151-1db4-4e55-b958-80082eba8209"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "atommodell-nach-dalton"
label_de = "Atommodell nach Dalton"
definition_de = "Das einfachste Atommodell geht davon aus, dass jeder Stoff aus kleinsten Teilchen besteht, die wiederum aus kugelförmigen, nicht weiter teilbaren Bausteinen zusammengesetzt sind: Atome. Diese Atome werden bei chemischen Reaktionen umgruppiert und neu zusammengesetzt, sind aber unzerstörbar. Mit Hilfe dieses Atommodells lassen sich Phänomene wie die Erhaltung der Masse bei chemischen Reaktionen erklären."
broader = "atommodelle-in-der-chemie"
oeh = "6d7530c5-64b2-4e55-8729-192a62ed247d"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "atommodelle-in-der-chemie"
label_de = "Atommodelle in der Chemie"
definition_de = "In der Chemie werden viele verschiedene Atommodelle verwendet. Jedes dieser Modelle hat seine Vor- und Nachteile. Der Chemieunterricht folgt bei der Einführung der Atommodelle oft der historischen Entwicklung: vom Atommodell von Dalton über das Kern-Hülle-Modell von Rutherford und das Schalenmodell von Bohr bis hin zu quantenmechanisch begründeten Modellen wie dem Orbitalmodell und dem daraus abgeleiteten Kugelwolkenmodell. Wenn du Materialien zu einzelnen Atommodellen suchst, bist du hier richtig. Materialien zum Periodensystem der Elemente findest du hingegen in der Rubrik “Anorganische Chemie”."
oeh = "63daf3d9-b673-4da0-b1ba-0fad4a58d335"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "aufstellen-von-reaktionsgleichungen"
label_de = "Aufstellen von Reaktionsgleichungen"
definition_de = "Chemische Reaktionen können mit Hilfe von Reaktionsgleichungen genau beschrieben werden. Durch geeignete Abbildungen wird dies verständlicher. Das Aufstellen und Ausgleichen von Reaktionsgleichungen erfordert jedoch Übung. Übungsmöglichkeiten finden sich hier."
broader = "die-symbolschreibweise"
oeh = "8fa1c129-f547-40d0-aa91-1e4467313fd1"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "auftrieb"
label_de = "Auftrieb"
definition_de = "Der Auftrieb ist eine Folge der unterschiedlichen Dichte zweier Stoffe. Die Menge des verdrängten Stoffes entscheidet darüber, ob z.B. ein Heißluftballon aufsteigt oder ein U-Boot sinkt. Zu dieser Schnittstelle zwischen Chemie und Physik findest du hier vielfältige Materialien."
oeh = "33fbde72-e8c9-4e7b-b8bf-f9d3ac58f439"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "batterien"
label_de = "Batterien"
definition_de = "Es gibt zahlreiche Batterietypen, die im Alltag eingesetzt werden. Allen gemeinsam ist, dass in zwei voneinander getrennten, aber elektrisch verbundenen Halbzellen eine RedOx-Reaktion abläuft. Die einzelnen Batterietypen unterscheiden sich durch den genauen Aufbau der Halbzellen - und wie die elektrische Verbindung der beiden Halbzellen realisiert wird. Einfache Batterien kann man mit wenigen Materialien zu Hause selbst bauen, kommerzielle Batterien sind oft deutlich komplexer aufgebaut."
broader = "die-elektrochemie"
oeh = "5e93c0a3-4ce6-411b-b7f7-27567dee0a74"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "benennung-der-alkohole"
label_de = "Benennung der Alkohole"
definition_de = "Wie alle Moleküle können auch Alkohole mit systematischen Namen bezeichnet werden. Die Benennung der Alkohole basiert auf der homologen Reihe der Alkane, wobei zusätzlich die Position der Hydroxygruppe(n) angegeben wird."
broader = "alkohole-kohlenwasserstoffe-mit-einer-oh-gruppe"
oeh = "c40449ef-f229-4ab3-acda-65a29b16c532"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "benennung-der-kohlenwasserstoffe"
label_de = "Benennung der Kohlenwasserstoffe"
definition_de = "Die Benennung der Kohlenwasserstoffe beruht auf den festgelegten Namen der homologen Reihe der Alkane. Die Benennung, auch Nomenklatur genannt, ist für die gesamte organische Chemie von zentraler Bedeutung, da nur so sinnvoll von organischen Verbindungen gesprochen werden kann und Edukte, Produkte und Übergangszustände organisch-chemischer Reaktionen eindeutig benannt werden können."
broader = "die-kohlenwasserstoffe-als-grundstoffe-in-der-organischen-chemie"
oeh = "dd91eca3-13b6-4568-83a4-188d9a9af37a"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "benennung-und-systematik-von-kohlenhydraten"
label_de = "Benennung und Systematik von Kohlenhydraten"
oeh = "2a3aa769-3d25-4b76-b286-7e2d1668a0cf"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "benzol-der-einfachste-aromat"
label_de = "Benzol - der einfachste Aromat"
definition_de = "Benzol ist die einfachste aromatische Verbindung, die aus einem Ring mit 6 Kohlenstoffatomen und abwechselnden Doppelbindungen besteht. Benzol reagiert mit anderen Chemikalien ganz anders, als man aufgrund seiner Struktur intuitiv erwarten würde."
broader = "aromaten-ringe-mit-delokalisierten-elektronensystemen"
oeh = "3f2bf544-ac66-47a4-a724-5e60d84f5b26"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "berechnungen-zur-dichte"
label_de = "Berechnungen zur Dichte"
definition_de = "Mit Hilfe der Dichte lassen sich Volumenangaben in Massenangaben umrechnen und umgekehrt. Solche Umrechnungen sind besonders wichtig, wenn Gase oder Flüssigkeiten an einer Reaktion beteiligt sind. Die Dichte kann aber auch als Stoffeigenschaft aufgefasst werden, die es z. B. in der Pharmazie ermöglicht, zu prüfen, ob sich in einem Behälter tatsächlich der Stoff befindet, der darin enthalten sein soll."
oeh = "1369c836-91d9-4551-9c94-a0b6bc80b195"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "betrachtung-von-wichtigen-legierungen"
label_de = "Betrachtung von wichtigen Legierungen"
broader = "metalle-und-die-gewinnung-aus-erzen"
oeh = "e0eefd37-cb11-449b-b7a4-c4f02104c5be"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "bewertungskompetenz"
label_de = "Bewertungskompetenz"
definition_de = "Die Bewertungskompetenz beschreibt die Fähigkeit, sowohl persönliche Entscheidungen auf der Grundlage naturwissenschaftlichen Fachwissens zu treffen als auch - im Sinne der innerfachlichen Bewertung - chemische Sachverhalte im Hinblick auf ihre fachliche Richtigkeit zu beurteilen."
broader = "fachdidaktik"
oeh = "13ebcbab-e428-417c-ba94-16cfc18ee932"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "bindung-struktur"
label_de = "Bindung & Struktur"
definition_de = "Chemische Bindungen bestimmen die beobachtbaren Eigenschaften der Materie. Es besteht also ein enger Zusammenhang zwischen den beobachtbaren Eigenschaften der Materie und den chemischen Bindungen und Strukturen auf Teilchenebene. Dies gilt sowohl für intramolekulare Bindungen wie die kovalente Bindung und die Ionenbindung als auch für intermolekulare Bindungen wie die Van-der-Waals-Kräfte und die Dipol-Dipol-Wechselwirkung."
broader = "chemie"
oeh = "9777f8ad-25d2-4c7a-ae7c-31a56aca85f0"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "bindungstypen"
label_de = "Bindungstypen"
definition_de = "Atome können sich zu größeren Einheiten verbinden, z. B. zu ionischen und metallischen Festkörpern oder zu Molekülen. Aus der Art der Bindung lässt sich meist recht genau erklären, warum ein Stoff bestimmte Eigenschaften hat. Dabei lassen sich die Grundtypen der chemischen Bindung unterscheiden: die Atombindung, die Ionenbindung, die Metallbindung und die koordinative Bindung. Metallbindung und die koordinative Bindung oder Komplexbindung."
broader = "bindung-struktur"
oeh = "ce676ca8-0810-4348-adf8-14e2f9ad64f8"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "braende-brandbekaempfung"
label_de = "Brände & Brandbekämpfung"
definition_de = "Verbrennungen sind Reaktionen mit Sauerstoff. Sie sind oft die ersten Reaktionen, die im Chemieunterricht näher betrachtet werden. Sie lassen sich gut beobachten und bieten die Möglichkeit, etwas Neues zu lernen."
broader = "die-chemische-reaktion"
oeh = "9b7299f9-31f5-477d-b10e-18a465295bdd"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "carbonsaeuren-organische-saeuren"
label_de = "Carbonsäuren - Organische Säuren"
definition_de = "Säuren sind Moleküle, die Protonen an andere Moleküle abgeben können. Insbesondere organische Säuren sind Moleküle, die neben einem Kohlenwasserstoffrest mindestens eine spezielle Gruppe, die Carboxylgruppe, enthalten. Von dieser Carboxylgruppe werden bei Säure-Base-Reaktionen Protonen abgespalten. Das Besondere an diesen sogenannten Carbonsäuren ist ihre vergleichsweise geringe Säurestärke: Die meisten Carbonsäuren sind eher schwache Säuren - und spielen in unserem Alltag in Lebensmitteln, in der chemischen Industrie und als pH-Puffer eine herausragende Rolle."
oeh = "b6d46beb-314d-459d-bba3-9727660c81af"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "chemie"
label_de = "Chemie"
definition_de = "Bild-Quelle und -Lizenz: Bild von deepakrit auf Pixabay"
oeh = "4940d5da-9b21-4ec0-8824-d16e0409e629"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "chemie-auf-dem-bau"
label_de = "Chemie auf dem Bau"
definition_de = "Viele Bauhilfsmittel sind chemischer Natur. Von Beton über Klebstoffe bis hin zu Imprägniermitteln für Oberflächen reicht die Palette. Chemie am Bau hat aber auch eine weitergehende Bedeutung: Die Betonherstellung ist eine der größten Quellen für Kohlendioxid - und damit im Hinblick auf den Klimawandel von kaum zu unterschätzender Bedeutung."
broader = "chemie-und-umwelt"
oeh = "d4b4195c-3fa2-4802-9282-78010a877c6e"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "chemie-in-der-landwirtschaft"
label_de = "Chemie in der Landwirtschaft"
definition_de = "Der erste Chemiker, der sich mit der Bedeutung seines Faches für die Landwirtschaft beschäftigte, war Justus von Liebig. Er gilt als einer der bekanntesten und erfolgreichsten Chemiker seines Jahrhunderts und als Begründer der Agrikulturchemie. Und das Thema ist nach wie vor aktuell. Vom Dünger bis zum Pflanzenschutzmittel."
broader = "chemie-und-umwelt"
oeh = "9b9b8d66-6419-4a6a-8d9a-47810408a05d"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "chemie-und-umwelt"
label_de = "Chemie und Umwelt"
definition_de = "Chemie ist allgegenwärtig: Biologische Prozesse basieren ebenso auf chemischen Reaktionen wie Körperpflegeprodukte, Reinigungsmittel und industrielle Produktionsprozesse. Mit anderen Worten: Chemie ist überall in der Umwelt. Gleichzeitig bergen die Prozesse der chemischen Industrie vielfältige Gefahren für die Umwelt."
broader = "chemie"
oeh = "0f98878d-4bf8-4ed5-933b-c0ad0d36263e"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "chemikalien-im-alltag"
label_de = "Chemikalien im Alltag"
definition_de = "Chemikalien begegnen dir im Alltag überall. Deshalb ist es wichtig, dass du weißt, wie du mit ihnen umgehen sollst. Dazu findest du hier Arbeitsblätter und Fotos von Alltagschemikalien."
broader = "sicherheit-in-den-chemie-raeumen"
oeh = "55805ec6-d566-4f1e-a442-7f7ae318a65b"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "chemische-industrie-bedeutung-und-probleme"
label_de = "Chemische Industrie - Bedeutung und Probleme"
definition_de = "Die chemische Industrie ist ein Industriezweig von großer wirtschaftlicher Bedeutung. Während dies in den betroffenen Regionen oft Wohlstand bedeutet, besteht gleichzeitig immer die Gefahr, dass ein Unfall große Probleme verursacht. Die chemische Industrie löst eine Vielzahl von Problemen und entwickelt innovative Lösungen. Gleichzeitig stellen ihre Prozesse oft eine Gefahr für Mensch und Umwelt dar."
broader = "chemie-und-umwelt"
oeh = "cf092e10-09a1-48ec-9a2b-0f8db74075e7"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "chemisches-gleichgewicht"
label_de = "Chemisches Gleichgewicht"
definition_de = "Viele chemische Reaktionen laufen nicht vollständig ab: Auch nach der Reaktion sind noch Edukte im Reaktionsgemisch vorhanden. Die Ursache für dieses Phänomen findet man, wenn man die mikroskopischen Vorgänge betrachtet. Denn viele Reaktionen sind leicht umkehrbar, Hin- und Rückreaktion laufen gleichzeitig ab. Dadurch stellt sich ein dynamisches Gleichgewicht ein. Die Lage dieses Gleichgewichts kann mathematisch mit Hilfe des Massenwirkungsgesetzes beschrieben werden."
broader = "kinetik"
oeh = "c622ba4c-301b-4bd0-9374-a0cced699640"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "chemisches-rechnen"
label_de = "Chemisches Rechnen"
definition_de = "Die Stöchiometrie ermöglicht es, mit Hilfe von Reaktionsgleichungen Aussagen über die Mengen aller an einer chemischen Reaktion beteiligten Stoffe zu machen. Diese Berechnungen sind wichtig, um Experimente zu planen oder in der chemischen Industrie die Ausbeute bestimmter Produktionsprozesse zu erhöhen."
broader = "fachmethoden-und-reflexion"
oeh = "436337e4-e651-48dc-aad4-6e76d34809bc"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "chromatographie"
label_de = "Chromatographie"
definition_de = "Chromatographische Verfahren wie die klassische Papierchromatographie, die Säurenchromatographie oder die Gaschromatographie dienen der Auftrennung komplexer Stoffgemische. Dabei können teilweise Reinstoffe gewonnen oder zumindest die Bestandteile eines komplexen Stoffgemisches identifiziert und mengenmäßig bestimmt werden."
oeh = "8ae5943e-dea0-447a-83b3-81b3a320752d"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "cycloalkane"
label_de = "Cycloalkane"
definition_de = "Einige Alkane bilden ringförmige Strukturen, wie z.B. Cyclohexan. Diese Cycloalkane haben sehr ähnliche Eigenschaften wie die entsprechenden Alkane, aber ihre räumliche Struktur ist sehr unterschiedlich."
broader = "die-kohlenwasserstoffe-als-grundstoffe-in-der-organischen-chemie"
oeh = "ce2710a3-a264-4926-a137-b910cb7d924c"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "das-orbitalmodell"
label_de = "Das Orbitalmodell"
definition_de = "Das Orbitalmodell ist die bisher genaueste Beschreibung der Aufenthaltsorte und Energien der Elektronen im Atom und beruht auf Berechnungen mit Hilfe der quantenmechanischen Schrödingergleichung. Das Orbitalmodell ist notwendig, um vor allem in der gymnasialen Oberstufe relevante Phänomene wie Mesomerie, Aromatizität oder die genaue Struktur von Mehrfachbindungen zu erklären."
broader = "atommodelle-in-der-chemie"
oeh = "eb7e165b-31ee-4d0f-8077-eadf73251019"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "das-periodensystem"
label_de = "Das Periodensystem"
definition_de = "Das Periodensystem der Elemente fasst das Wissen der Chemiker über die Vielfalt der bekannten Elemente zusammen. Es ist eine geordnete Liste aller chemischen Elemente, die nach aufsteigender Kernladung (Ordnungszahl) geordnet sind. Die Elemente sind bestimmten Gruppen (Spalten) und Perioden (Zeilen) zugeordnet. Zwischen den Elementen einer Gruppe lassen sich charakteristische, gemeinsame Eigenschaften finden, die zusammen als Haupt- oder Nebengruppe bezeichnet werden können. Auch innerhalb der Perioden lassen sich mit Hilfe des Atommodells Trends hinsichtlich der beobachtbaren Eigenschaften ableiten."
oeh = "c0b6ce90-44c3-46dc-ae3e-2741d78d9294"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "das-teilchenmodell"
label_de = "Das Teilchenmodell"
definition_de = "In der Chemie nähert man sich Vorgängen auf atomarer Ebene häufig zunächst durch die Betrachtung eines einfachen Teilchenmodells. Dieses kann verwendet werden, um die Funktionsweise von Trennverfahren, Aggregatzuständen und Phänomenen wie der Volumenkontraktion beim Mischen zweier Flüssigkeiten zu erklären."
broader = "atommodelle-in-der-chemie"
oeh = "f75eec46-f7a9-44b3-ad2a-1fee76a3b1a3"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "der-energiebegriff"
label_de = "Der Energiebegriff"
definition_de = "Ein Energieumsatz ist ein typisches Merkmal einer chemischen Reaktion. In der Chemie spielt daher die Betrachtung der chemischen Energie von Stoffen eine wichtige Rolle. Meist wird die chemische Energie bereits im Einführungsunterricht behandelt, so dass dort auch entsprechende Materialien zu finden sind. Es gibt aber auch viele vertiefende Aspekte, die oft erst in der Oberstufe behandelt werden."
broader = "energie-kinetik"
oeh = "31cd5ed4-4452-46c8-a031-95d01f291b6b"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "der-ph-wert-als-eigenschaften-von-loesungen"
label_de = "Der pH-Wert als Eigenschaften von Lösungen"
definition_de = "Der pH-Wert dient als Maß für die Stärke einer sauren oder alkalischen Lösung. Er wird vereinfacht als Messwert mit Hilfe von Indikatoren bestimmt, kann aber auch berechnet und mit speziellen Messgeräten, den pH-Metern, sehr genau bestimmt werden. Mathematisch wird der pH-Wert durch die Konzentration der Hydroniumionen definiert."
broader = "saeuren-und-basen"
oeh = "e61e9c39-4a20-42fb-a786-2c3bd001ed29"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "der-satz-von-avogadro"
label_de = "Der Satz von Avogadro"
definition_de = "Der Satz von Avogadro besagt, dass alle Gase bei gleicher Temperatur und gleichem Druck in gleichen Volumina die gleiche Teilchenzahl besitzen. Mit Hilfe des Satzes von Avogadro können viele Phänomene im Zusammenhang mit Gasen und Gasreaktionen erklärt werden. Außerdem kann mit Hilfe des Satzes von Avogadro auf einfache Weise die molare Masse von Gasen bestimmt werden."
broader = "chemisches-rechnen"
oeh = "3e9877db-44ab-45fc-92a7-a703f1bdf7dc"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "der-satz-von-hess"
label_de = "Der Satz  von Hess"
definition_de = "Der Satz von Hess wurde entwickelt, bevor das Prinzip der Energieerhaltung in der Wissenschaft vollständig verstanden wurde. In der Chemie hat er bis heute eine grundlegende Bedeutung: Er ermöglicht die rechnerische Bestimmung von Reaktionsenthalpien auch für solche Prozesse, die experimentell nicht direkt messbar sind."
broader = "energie-kinetik"
oeh = "a084979c-d3c3-4aad-be15-3d4676ddeb62"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "destillation"
label_de = "Destillation"
definition_de = "Bei der Destillation werden Stoffe aufgrund ihrer unterschiedlichen Siedepunkte voneinander getrennt. Technisch wichtige Beispiele sind die Destillation von Alkohol und die fraktionierte Destillation von Erdöl."
oeh = "e8b08560-fd99-4fe7-b61e-203a716e7fe5"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "die-atombindung"
label_de = "Die Atombindung"
definition_de = "Aus energetischen Gründen streben die meisten Atome eine voll besetzte äußere Elektronenhülle an. Eine Möglichkeit, diesen auch als Edelgaskonfiguration bezeichneten Zustand zu erreichen, besteht darin, Elektronen zwischen zwei Atomen aufzuteilen. Diese Atome sind dann durch eine Atombindung verbunden, die oft auch als kovalente Bindung oder Elektronenpaarbindung bezeichnet wird. Natürlich ist es auch möglich, dass sich Atome mehrere Elektronen teilen. Auf diese Weise entstehen Doppel- und Dreifachbindungen."
broader = "bindungstypen"
oeh = "4821b916-5622-4e99-907f-ba424ea19168"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "die-autoprotolyse-als-eigenschaft-von-wasser"
label_de = "Die Autoprotolyse als Eigenschaft von Wasser"
definition_de = "Selbst destilliertes Wasser, das keine gelösten Ionen enthält, leitet elektrischen Strom. Der Grund dafür ist die Autoprotolyse: Wasser ist ein sogenannter Ampholyt und kann sowohl als Säure als auch als Base reagieren. So kommt es vor, dass Wassermoleküle Hydronium- und Hydroxidionen bilden. Diese im Wasser immer vorhandenen Ionen sind für die elektrische Leitfähigkeit verantwortlich."
broader = "saeuren-und-basen"
oeh = "a3b49414-8436-48f2-ae7d-009de9a4f3af"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "die-chemische-reaktion"
label_de = "Die chemische Reaktion"
broader = "anfangsunterricht"
oeh = "c6e28216-77f9-4e56-8f05-c85ee2a6991f"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "die-dipol-dipol-kraefte"
label_de = "Die Dipol-Dipol-Kräfte"
definition_de = "Viele Moleküle weisen ein permanentes Ladungsungleichgewicht auf. Sie bilden so genannte Dipole. Die zwischen solchen Dipolmolekülen wirkenden Kräfte werden als Dipol-Dipol-Kräfte (auch Dipol-Dipol-Wechselwirkungen) bezeichnet. Die ungleiche Verteilung der Bindungselektronen ist auf die unterschiedlichen Elektronegativitäten der an der Bindung beteiligten Atome zurückzuführen, die zu polarisierten Bindungen führen. Vorhandene Dipole beeinflussen die Siede- und Schmelztemperatur sowie die Löslichkeit."
broader = "zwischenmolekulare-kraefte"
oeh = "94ceb24f-7085-415e-8abb-73ae1bb5bb46"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "die-eigenschaften-der-metalle"
label_de = "Die Eigenschaften der Metalle"
definition_de = "Metalle sind eine Klasse von Stoffen, die sehr ähnliche Eigenschaften wie elektrische Leitfähigkeit oder metallischen Glanz und gute Wärmeleitfähigkeit haben. Nur wenige sind magnetisch, wie z.B. Eisen. Metalle reagieren mit Nichtmetallatomen wie Sauerstoff zu Salzen. All diese Eigenschaften lassen sich durch den molekularen Aufbau der Metalle erklären: Sie bilden ein Metallgitter, in dem die Atomrümpfe ortsfest sind und die Valenzelektronen als Elektronengas beschrieben werden können."
broader = "metalle-und-die-gewinnung-aus-erzen"
oeh = "bb8bc391-f159-4810-a24a-a4f0fba87269"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "die-eigenschaften-von-salzen"
label_de = "Die Eigenschaften von Salzen"
definition_de = "Die Eigenschaften von Salzen beruhen auf ihrem Aufbau aus geladenen Teilchen, den Ionen. Dabei spielt die starke Anziehung zwischen unterschiedlich geladenen Teilchen eine entscheidende Rolle. Insbesondere die Sprödigkeit der Salze, der hohe Schmelzpunkt, die Leitfähigkeit in wässriger Lösung und in der Schmelze sowie die Form der Salzkristalle lassen sich durch die Kenntnis der Struktur der Ionenbindung erklären."
broader = "salze"
oeh = "4102898c-a751-4e0b-8079-21244839d713"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "die-elektrochemie"
label_de = "Die Elektrochemie"
definition_de = "Wie funktionieren Batterien in Taschenlampen und Akkus in Smartphones? Wie gewinnt man Kupfer aus Kupfererzen? Und warum rostet ein Fahrrad? Diese auf den ersten Blick so unterschiedlichen Prozesse haben auf den zweiten Blick vieles gemeinsam: Bei all diesen Vorgängen werden im Zuge chemischer Reaktionen Elektronen übertragen. Mit diesen Elektronenübertragungsprozessen beschäftigt sich die Elektrochemie."
broader = "chemie"
oeh = "71e38f98-b123-4f31-8609-f9736168daf0"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "die-halbmetalle"
label_de = "Die Halbmetalle"
definition_de = "Halbmetalle lassen sich chemisch nicht eindeutig den Metallen oder Nichtmetallen zuordnen. In einigen Reaktionen verhalten sie sich wie Metalle, in anderen wie Nichtmetalle. Viele Halbmetalle sind auch Halbleiter, die sich durch eine besondere elektrische Leitfähigkeit auszeichnen. Eines der bekanntesten Beispiele für Halbmetalle ist das Element Silizium."
broader = "metalle-und-die-gewinnung-aus-erzen"
oeh = "0e752c8b-f126-48f6-b105-53ed2037201e"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "die-historische-entwicklung-des-periodensystems"
label_de = "Die Historische Entwicklung des Periodensystems"
definition_de = "Ausgehend von ähnlichen Reaktionen verschiedener Elemente entwickelten verschiedene Wissenschaftler, darunter Mendelejew und Meyer, Vorschläge für eine Ordnung der Elemente in einer gemeinsamen Tabelle. Erst die Idee, die Elemente grob nach zunehmender Masse zu ordnen und Elemente mit ähnlichen Eigenschaften untereinander zu notieren, ebnete den Weg zum Periodensystem der Elemente, wie wir es heute kennen - und das weitgehend ohne Kenntnis des zugrunde liegenden Atombaus, wie wir sie heute haben."
broader = "das-periodensystem"
oeh = "8b3bc77e-07fa-4bbe-add1-ae449c3679ee"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "die-ionenbindung"
label_de = "Die Ionenbindung"
definition_de = "Um eine voll besetzte äußere Schale zu erhalten, können Atome Elektronen abgeben oder aufnehmen. Da sich gleichzeitig die Anzahl der Protonen im Kern nicht ändert, entstehen durch die Aufnahme und Abgabe von Elektronen geladene Teilchen - Ionen. Negativ geladene Anionen und positiv geladene Kationen sind durch elektrostatische Anziehungskräfte sehr fest miteinander verbunden."
broader = "bindungstypen"
oeh = "88d2f312-db86-492c-bfb4-1b72d55b7d81"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "die-kohlenwasserstoffe-als-grundstoffe-in-der-organischen-chemie"
label_de = "Die Kohlenwasserstoffe als Grundstoffe in der Organischen Chemie"
definition_de = "Kohlenwasserstoffe sind eine Stoffgruppe chemischer Verbindungen, die nur aus Kohlenstoff und Wasserstoff bestehen. Sie umfassen neben den Alkanen auch die Alkene, Alkine und Aromaten. Viele Prinzipien der OC lassen sich auf Eigenschaften der Kohlenwasserstoffe zurückführen."
oeh = "c97a8c29-75b5-46a2-a328-e2754eca928f"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "die-komplexbindung"
label_de = "Die Komplexbindung"
definition_de = "Komplexbindungen sind den Atombindungen ähnlich. Sie entstehen jedoch nicht dadurch, dass sich zwei Teilchen Elektronen teilen. Vielmehr gibt ein Teilchen die beiden benötigten Bindungselektronen ab. So entstehen Komplexe, die aus einem Zentralatom und daran gebundenen Teilchen, den Liganden, bestehen. Komplexe sind oft farbig."
broader = "bindungstypen"
oeh = "035c1ccd-e6ad-4080-b04b-fd6ce9671db0"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "die-leichtmetalle"
label_de = "Die Leichtmetalle"
definition_de = "Leichtmetalle zeichnen sich durch eine besonders geringe Dichte aus. Sie werden häufig als Werkstoffe eingesetzt, um im Vergleich zu Stahl Gewicht einzusparen. Die bekanntesten Leichtmetalle sind Magnesium und Aluminium. Neben ihrem geringen Gewicht zeichnen sie sich durch eine hohe Korrosionsbeständigkeit aus und sind relativ fest, so dass Bauteile wie z.B. Reifenfelgen aus ihnen hergestellt werden."
broader = "metalle-und-die-gewinnung-aus-erzen"
oeh = "6533ced9-1e1d-4143-9685-b4be560537c4"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "die-metallbindung"
label_de = "Die Metallbindung"
definition_de = "Die Bindungsverhältnisse in Metallen weisen einige Besonderheiten auf, die sie von anderen Stoffen unterscheiden. Im Gegensatz zu Salzen oder Molekülverbindungen sind die Valenzelektronen in Metallen gasförmig über den gesamten Festkörper verteilt, während die Atomrümpfe fest an einem Ort sitzen. Chemiker sprechen in diesem Fall von einem Elektronengas. Dieses Modell erklärt, warum Metalle elektrisch leitfähig sind."
broader = "bindungstypen"
oeh = "e41b1252-784d-4115-b7fd-8a3a6745ddcb"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "die-nebengruppenelemente"
label_de = "Die Nebengruppenelemente"
definition_de = "Während die Hauptgruppenelemente des Periodensystems sehr unterschiedliche chemische und physikalische Eigenschaften aufweisen, sind sich die Nebengruppenelemente in diesen Eigenschaften relativ ähnlich. Alle sind Metalle mit vielen Außenelektronen, die positive Ionen mit vielen radioaktiven Isotopen bilden. Einige der Nebengruppenelemente sind selten, aber von großer technischer Bedeutung."
broader = "das-periodensystem"
oeh = "d2cbbdb9-baaa-4a89-bd10-56e8857b2af0"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "die-ozon-problematik"
label_de = "Die Ozon-Problematik"
definition_de = "Ozon O₃ ist in der Atmosphäre lebenswichtig, da es die für den Menschen schädliche UV-Strahlung aus dem Sonnenlicht filtert. Gleichzeitig stellt Ozon auf der Erde eine Bedrohung dar. Die Vorgänge bei der Bildung von Ozon sind sehr komplex und erfordern ein hohes Maß an chemischem Fachwissen. Gleichzeitig ist das Verbot von FCKW in Kühlgeräten ein Meilenstein der internationalen Klimapolitik."
broader = "luft-und-luftverschmutzung"
oeh = "0ad84269-1e62-45b0-8cf4-c7e65ec44945"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "die-reaktionsgeschwindigkeit"
label_de = "Die Reaktionsgeschwindigkeit"
definition_de = "In der Natur gibt es schnellere und langsamere chemische Reaktionen. Mit Hilfe verschiedener Methoden kann die Reaktionsgeschwindigkeit auch quantitativ bestimmt werden. Die Geschwindigkeit einer bestimmten chemischen Reaktion hängt von sehr vielen Faktoren ab: Temperatur, Zersetzungsgrad, Konzentration und Druck sind die wichtigsten."
broader = "kinetik"
oeh = "8a0ffddf-b0ee-4bc3-b323-203bd58a4f48"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "die-spannungsreihe-der-metalle"
label_de = "Die Spannungsreihe der Metalle"
definition_de = "Verschiedene Metalle reagieren unterschiedlich stark mit Sauerstoff - und es zeigt sich, dass Halbzellen aus verschiedenen Metallen auch unterschiedliche elektrische Spannungen liefern. Eine systematische Analyse ergibt die elektrochemische Spannungsreihe: Mit ihrer Hilfe lässt sich vorhersagen, ob und in welche Richtung elektrochemische Reaktionen stattfinden und welche Spannung eine beliebige Batterie haben wird."
broader = "die-elektrochemie"
oeh = "c4f3cd1a-33db-4c74-9d76-43c53b7d716e"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "die-stoffmenge-und-das-mol"
label_de = "Die Stoffmenge und das Mol"
definition_de = "Bei chemischen Reaktionen hat man es meist mit unvorstellbar großen Mengen von Atomen und Molekülen zu tun. Um diese Zahlen überschaubarer zu machen, verwenden Chemiker in der Regel die Stoffmenge als Rechengröße. Die Einheit der Stoffmenge ist das “Mol”, was im Lateinischen so viel wie “großer Haufen” bedeutet. Wie das “Dutzend” ist das Mol eine Abkürzung für eine bestimmte Teilchenzahl."
broader = "chemisches-rechnen"
oeh = "bf47dbfd-5094-4d20-a2b8-dba6c6d192f8"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "die-symbolschreibweise"
label_de = "Die Symbolschreibweise"
definition_de = "Formeln sind typisch für die Chemie. Mit ihrer Hilfe beschreiben Chemiker den Aufbau der kleinsten Stoffteilchen und auch chemische Reaktionen. In diesem Abschnitt finden Sie Materialien zur Einführung in das Thema und einfache Übungen."
broader = "fachmethoden-und-reflexion"
oeh = "aa4d67c5-3701-400d-bd00-a749b76cf234"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "die-wasserstoffbruecken"
label_de = "Die Wasserstoffbrücken"
definition_de = "Wasserstoffbrücken können als besonders starke Dipol-Dipol-Kräfte zwischen einem stark positiv polarisierten H-Atom und einem freien Elektronenpaar eines anderen Atoms aufgefasst werden. Sie sind die Grundlage des Lebens, das auf der Erde nur durch die relativ hohe Siedetemperatur des Wassers möglich ist."
broader = "zwischenmolekulare-kraefte"
oeh = "62a3ab0f-0df6-4eaa-adde-f61a2273fa40"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "dieselmotoren-und-stickoxide"
label_de = "Dieselmotoren und Stickoxide"
definition_de = "Dieselmotoren verbrennen Dieselkraftstoff und wandeln dabei die im Dieselkraftstoff gespeicherte chemische Energie in Wärmeenergie und schließlich in Bewegungsenergie um. Bei dieser Verbrennung entstehen neben Kohlendioxid und Wasser weitere Verbindungen. Besonders problematisch sind dabei die verschiedenen Stickoxide. Hier findest du Materialien zur Behandlung der Stickoxidproblematik im Unterricht."
broader = "chemie-und-umwelt"
oeh = "a875da6e-895a-4f1d-8df7-955d58664e7b"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "eigenschaften-der-alkohole"
label_de = "Eigenschaften der Alkohole"
definition_de = "Die Eigenschaften der Alkohole werden durch die Hydroxylgruppe bestimmt, deren Einfluss mit zunehmender Länge des Kohlenwasserstoffrestes abnimmt. Die Stoffeigenschaften der kurzkettigen Alkohole unterscheiden sich deutlich von denen der Alkane, während die Stoffeigenschaften der sehr langkettigen Alkohole denen der entsprechenden Alkane ähneln."
broader = "alkohole-kohlenwasserstoffe-mit-einer-oh-gruppe"
oeh = "4d625afc-8508-49fd-9371-2ebf24497906"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "eigenschaften-der-kohlenwasserstoffe"
label_de = "Eigenschaften der  Kohlenwasserstoffe"
definition_de = "Kohlenwasserstoffe sind im Allgemeinen relativ reaktionsträge, vor allem weil sie keine Dipole sind. Eine längere Kohlenstoffkette und Mehrfachbindungen erhöhen die Reaktivität. Auch Eigenschaften wie Siedepunkt und Löslichkeit sind auf die Molekülstruktur zurückzuführen."
broader = "die-kohlenwasserstoffe-als-grundstoffe-in-der-organischen-chemie"
oeh = "4be51a6c-de31-41c3-9318-bb3a8229ca5d"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "eigenschaften-von-aromaten"
label_de = "Eigenschaften von Aromaten"
broader = "aromaten-ringe-mit-delokalisierten-elektronensystemen"
oeh = "dd6b6075-cdf9-47a0-adc4-e33bd3a0bd9a"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "eigenschaften-von-saeuren-und-basen"
label_de = "Eigenschaften von Säuren und Basen"
definition_de = "Säuren sind nicht elektrisch leitend, wohl aber ihre wässrigen Lösungen. Dasselbe gilt für Basen. Diese Eigenschaften lassen sich auf den molekularen Aufbau von Säuren und Basen zurückführen: Säuren sind Protonendonatoren und geben Protonen an Basen ab, die Protonenakzeptoren sind. Eine weitere wichtige gemeinsame Eigenschaft aller Säuren ist ihre Reaktivität mit unedlen Metallen. Mit diesen reagieren sie in einer RedOx-Reaktion zu Salzen und Wasserstoff."
broader = "saeuren-und-basen"
oeh = "395864a0-732d-434e-b6d1-c6a865bfb651"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "eindampfen"
label_de = "Eindampfen"
definition_de = "Durch Eindampfen einer wässrigen Lösung wird das Lösungsmittel entfernt. Zurück bleibt der gelöste Stoff."
oeh = "78315e28-0e1f-4644-834d-e514d00d2cc8"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "eiweisse-die-bausteine-des-lebens"
label_de = "Eiweiße - die Bausteine des Lebens"
definition_de = "Eiweiße, auch Proteine genannt, sind biologische Makromoleküle, die aus Aminosäuren aufgebaut sind. Sie stellen die Grundbausteine der Zellen dar. Proteine werden in der Regel in tierischen und pflanzlichen Zellen hergestellt, wobei die mRNA als Bauplan dient, die wiederum eine Art Abschrift der DNA im Zellkern darstellt. Proteine werden praktisch überall im Körper gebraucht: Neben Strukturproteinen zum Beispiel auch als Enzyme."
oeh = "17911f2d-0d53-4d23-9c43-d5948aa4fff4"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "elektrolyse"
label_de = "Elektrolyse"
definition_de = "Die Elektrolyse ist eine chemische Reaktion, bei der mit Hilfe von elektrischem Strom eine Redoxreaktion erzwungen wird. Viele wichtige technische Prozesse basieren auf der Elektrolyse: Die Chlor-Alkali-Elektrolyse dient der Herstellung der Grundchemikalien Chlor und Natronlauge, Werkstücke werden elektrolytisch veredelt und - nicht zuletzt - Wasserstoff wird durch Elektrolyse aus Wasser gewonnen."
broader = "die-elektrochemie"
oeh = "f101598c-ea14-4983-b685-74a75f87ba88"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "eliminierungsreaktionen"
label_de = "Eliminierungsreaktionen"
definition_de = "Eine Eliminierungsreaktion ist eine chemische Reaktion, bei der zwei Atome oder Atomgruppen aus einem Molekül entfernt werden. Meist werden dabei Mehrfachbindungen gebildet. Ein typisches Beispiel ist die Eliminierung an substituierten Alkanen wie Halogenalkanen oder Alkoholen. Eliminierungen konkurrieren häufig mit anderen Reaktionsmechanismen wie Substitutionsreaktionen."
broader = "reaktionsmechanismen-auf-der-spur-der-reaktionswege"
oeh = "e383a5e7-de42-4ded-86f9-4f04daf2642f"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "energie-kinetik"
label_de = "Energie & Kinetik"
definition_de = "Sowohl die Physik als auch die Chemie beschäftigen sich mit der Thermodynamik. Sie beschreibt den Zustand und die Veränderungen von Stoffsystemen unter Berücksichtigung der Energie und anderer Zustandsgrößen. Durch entsprechende Berechnungen lassen sich die Energieumsätze bei chemischen Reaktionen ermitteln und damit Vorhersagen über den Ablauf chemischer Reaktionen treffen. Grundlagen wie endotherme und exotherme Reaktionen werden häufig bereits im Einführungsunterricht behandelt. Entsprechende Materialien finden sich auch dort."
broader = "chemie"
oeh = "3dd93c5a-13e8-4e0b-931d-7cd78ebc7f70"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "entropie-und-enthalpie"
label_de = "Entropie und Enthalpie"
definition_de = "Entropie und Enthalpie sind thermodynamische Größen, die eine Aussage darüber erlauben, ob eine chemische Reaktion freiwillig oder unfreiwillig abläuft. Die Enthalpie ist die Energie, die bei konstantem Umgebungsdruck mit der Umgebung ausgetauscht wird, während die Entropie ein Maß für die Unordnung eines Systems ist. Beide Größen werden häufig in der Gibbs-Helmholtz-Gleichung zur freien Enthalpie zusammengefasst."
broader = "energie-kinetik"
oeh = "20163f83-7c85-4b36-96b7-e244b83db23d"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "erdoel-und-erdgas-entstehung-gewinnung-verarbeitung"
label_de = "Erdöl und Erdgas - Entstehung, Gewinnung, Verarbeitung"
definition_de = "Erdöl ist die wichtigste Quelle für Kohlenwasserstoffe, die wiederum als Basischemikalien für die chemische Industrie von unschätzbarer Bedeutung sind. Erdöl ist jedoch ein fossiler Energieträger, der zwar eine große Vielfalt an chemischen Produkten liefert, aber auch ökologische Probleme mit sich bringt. Zudem sind die Erdölreserven endlich. Erdöl entsteht durch langwierige Umwandlungsprozesse organischer Substanzen."
broader = "die-kohlenwasserstoffe-als-grundstoffe-in-der-organischen-chemie"
oeh = "801fb982-04dd-4890-b8bf-38592429d8d0"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "erkenntnisgewinnung"
label_de = "Erkenntnisgewinnung"
definition_de = "Der Forschungsprozess in der Naturwissenschaft Chemie verläuft nicht immer linear. Dennoch haben sich in der Geschichte der Chemie einige zentrale Aspekte der Erkenntnisgewinnung herauskristallisiert, wie z.B. der Theoriebezug oder die Kontrolle von Variablen im Experiment."
broader = "fachdidaktik"
oeh = "21dd427b-a224-4b77-8bf3-3797b24ed83a"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "erzabbau"
label_de = "Erzabbau"
definition_de = "Der Abbau von Erzen zur Metallgewinnung hat eine lange Tradition. Sie werden meist in Bergwerken und Tagebauen abgebaut, finden sich aber zum Teil auch auf frisch gepflügten Feldern. Aus den Erzen werden dann die elementaren Metalle gewonnen."
broader = "metalle-und-die-gewinnung-aus-erzen"
oeh = "013cf7f0-1069-49dc-8d91-295064386e86"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "ester-reaktionsprodukte-aus-saeuren-und-alkoholen"
label_de = "Ester - Reaktionsprodukte aus Säuren und Alkoholen"
definition_de = "Ester sind Verbindungen, die durch Reaktion einer Säure mit einem Alkohol entstehen. Es gibt viele Ester, die eine praktische Anwendung haben. Zum Beispiel als Lösungsmittel oder als Aromastoff in Lebensmitteln. Auch Fette gehören zur Stoffklasse der Ester: Sie entstehen aus der Reaktion des dreiwertigen Alkohols Glycerin mit sogenannten Fettsäuren.  Historisch bedeutsam ist auch die Spaltung eines Esters, die Verseifung."
oeh = "fded46e6-d5ca-4dc0-9702-7f9cdf16b498"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "ether-isomere-der-alkohole"
label_de = "Ether - Isomere der Alkohole"
oeh = "831f60fe-9826-4719-b29e-51672188c50f"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "experimentelle-bestimmung-der-dichte"
label_de = "Experimentelle Bestimmung der Dichte"
definition_de = "Die Dichte von Gasen, Flüssigkeiten und Feststoffen kann experimentell bestimmt werden. Solche Versuche eignen sich oft als Schülerexperimente. Hier findest du Materialien mit entsprechenden Versuchen."
oeh = "df6c3156-7a2b-4798-a474-1dab79a5973f"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "explosivstoffe"
label_de = "Explosivstoffe"
definition_de = "Chemie ist, wenn es knallt und stinkt ... so denken viele Schülerinnen und Schüler. Das stimmt natürlich nicht ganz, aber es steckt eine Menge dahinter. Hier findest du Informationen über typische Explosivstoffe, ihre Herstellung und ihre Wirkung."
broader = "chemie-und-umwelt"
oeh = "c7ae5c04-389d-4ef1-9e62-e4fa67202c57"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "fachdidaktik"
label_de = "Fachdidaktik"
definition_de = "Die Fachdidaktik ist die Wissenschaft vom Lehren und Lernen im Fach Chemie. Im Rahmen der fachdidaktischen Forschung wurden und werden vielfältige Materialien für den Chemieunterricht entwickelt. Die Materialien reichen von Gamification-Ansätzen über Materialien zur Förderung der Bewertungskompetenz bis hin zur Förderung der Kommunikationsfähigkeit."
broader = "chemie"
oeh = "6a5c3d6a-b633-458b-b0b7-fdbccdfe7dec"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "fachmethoden-und-reflexion"
label_de = "Fachmethoden und Reflexion"
definition_de = "Neben reinem Fachwissen hat die Chemie viel zu bieten: Spannende Geschichten aus der Geschichte der Chemie, die zum Nachdenken anregen. Anknüpfungspunkte für alltägliche und fachliche Entscheidungen ebenso wie typische Arbeits- und Denkmuster. Und genau um solche Methoden und Denkanstöße geht es in dieser Sammlung!"
broader = "chemie"
oeh = "9f8724da-b043-40e5-9802-cd7a306d8fd7"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "fachportale"
label_de = "Fachportale"
definition_de = "Zahlreiche Internetseiten bieten umfassende Informationen zu allen Bereichen der Chemie. Solche Portale bieten oft auch eine große Auswahl an geeigneten Unterrichtsmaterialien. Eine redaktionelle Auswahl solcher Portale findet sich hier!"
broader = "chemie"
oeh = "294be80a-487a-4a74-b6ad-08d32401a1fb"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "farbstoffe"
label_de = "Farbstoffe"
definition_de = "Viele Farbstoffe enthalten aromatische Ringsysteme mit großen Doppelbindungssystemen (delokalisierte Elektronen). Diese delokalisierten Elektronensysteme sind für die Absorption bestimmter Wellenlängen des Lichts - und damit für die charakteristische Farbe des jeweiligen Farbstoffs - verantwortlich."
oeh = "dc9823f8-08c2-4dc7-8f78-3a12a71f0344"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "fette-und-oele-ester-langkettiger-carbonsaeuren"
label_de = "Fette und Öle - Ester langkettiger Carbonsäuren"
definition_de = "Fette und natürliche Öle sind ähnlich aufgebaut. Vom Grundprinzip her sind sie Ester langkettiger organischer Säuren. Biologisch gehören sie zu den Grundnährstoffen als Energiespeicher, sind aber auch Lösungs- und Baustoff im Körper."
oeh = "d3354fb0-f36d-4c41-ab5e-3023c8dfdd9d"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "filtration"
label_de = "Filtration"
definition_de = "Die Filtration dient der Abtrennung von Feststoffen aus wässrigen Lösungsmitteln. Das Prinzip der Filtration beruht auf der unterschiedlichen Größe der Partikel und den darauf abgestimmten Poren im Filter."
oeh = "31936972-8ef7-4dc0-89ce-f461bd158b95"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "formeln-mit-symbolschreibweise"
label_de = "Formeln mit Symbolschreibweise"
definition_de = "Verbindungen und der Aufbau von Molekülen lassen sich am besten mit Hilfe der Symbolschreibweise beschreiben. Hier finden Sie Übungen zur Schreibweise und Benennung von Verbindungen und Elementen."
broader = "die-symbolschreibweise"
oeh = "d3e122c9-dc74-428b-851f-ae0bae1db3ea"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "gamification"
label_de = "Gamification"
definition_de = "Spiele können ein strukturierendes Element des Unterrichts sein. Die Bandbreite entsprechender pädagogischer Ansätze ist groß und reicht von kleinen Spielen über Rätsel bis hin zu Escape Rooms."
broader = "spiele-und-spektakulaeres"
oeh = "0037fb7e-56eb-4a12-be6b-80b0d97e6529"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "gefahr-durch-metalle-und-schwermetalle"
label_de = "Gefahr durch Metalle und Schwermetalle"
definition_de = "Viele Schwermetalle - also Metalle mit hoher Dichte - sind für Menschen oder Tiere, aber auch für viele Pflanzen giftig. Als Ionen im Wasser gelöst, stellen sie ein unsichtbares Problem dar. Beispiele für gefährliche Schwermetalle sind Blei und Cadmium."
broader = "chemie-und-umwelt"
oeh = "bda001ae-0922-498b-b687-552f384f312c"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "geschichte-der-chemie"
label_de = "Geschichte der Chemie"
definition_de = "Die Geschichte der Chemie steckt voller wunderbarer Geschichten, schrulliger genauso wie genialer Wissenschaftler:innen, spannender gesellschaftlicher Bezüge und tödlicher Erfindungen. Gleichzeitig bietet ein Blick in die Geschichte eine Fülle von Lernmöglichkeiten, die auch einen anderen Blick auf die heutige Chemie ermöglichen."
broader = "fachmethoden-und-reflexion"
oeh = "84ad6e6b-0a77-454d-be08-43d80f6b9a70"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "gewinnung-und-abbau-von-salzen"
label_de = "Gewinnung und Abbau von Salzen"
definition_de = "Der weitaus größte Teil der industriell genutzten Salze wird durch bergmännischen Abbau gewonnen. Aber auch aus Meerwasser oder aus Salzlagerstätten in Trockengebieten kann Salz gewonnen werden. Die Entstehung der bergmännisch zugänglichen Salzlagerstätten geht häufig auf urzeitliche Meere zurück, die ihre Wasserreserven durch Verdunstung verloren haben."
broader = "salze"
oeh = "2387b434-c3f8-428c-9187-894f9651b664"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "ghs-piktogramme-und-gefahrensymbole"
label_de = "GHS-Piktogramme und Gefahrensymbole"
broader = "sicherheit-in-den-chemie-raeumen"
oeh = "400abe18-2e1b-48ae-9a7b-f1ab6aa42728"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "herstellung-von-eisen-und-seine-anwendung"
label_de = "Herstellung von Eisen und seine Anwendung"
definition_de = "Eisen ist eines der wichtigsten Gebrauchsmetalle. Es wird in großem Maßstab im Hochofenverfahren gewonnen. Dieses Verfahren wurde über Jahrzehnte und Jahrhunderte immer weiter verbessert und ist heute eine wichtige Grundlage der Großindustrie. Gleichzeitig ist es sehr energieintensiv und verursacht erhebliche Mengen an Treibhausgasen."
broader = "metalle-und-die-gewinnung-aus-erzen"
oeh = "bc7711d9-1381-426c-8d87-6a6ba3d014e6"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "herstellung-von-kupfer-und-seine-anwendung"
label_de = "Herstellung von Kupfer und seine Anwendung"
definition_de = "Kupfer ist ein relativ weiches und gut verformbares Metall. Als guter Wärme- und Stromleiter ist es vielseitig einsetzbar. Die Erfindung der Kupferherstellung hatte einen großen Einfluss auf die Entwicklung der Menschheit und war sogar für einen Epochenumbruch verantwortlich: Die Bronzezeit löste die Steinzeit ab."
broader = "metalle-und-die-gewinnung-aus-erzen"
oeh = "54ab3216-d165-4ff7-b97c-c7c0e32f52d9"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "herstellung-von-sauren-und-alkalischen-loesungen"
label_de = "Herstellung von sauren und alkalischen Lösungen"
definition_de = "Saure Lösungen werden durch Einbringen von Säuren in Wasser hergestellt. Das Gleiche gilt für Laugen: Sie sind wässrige Lösungen von Basen in Wasser. Säuren und Basen selbst können durch eine Vielzahl von chemischen Reaktionen hergestellt werden."
broader = "saeuren-und-basen"
oeh = "ef241076-d889-4725-8c0e-badd5cf869bf"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "historische-entwicklung"
label_de = "Historische Entwicklung"
definition_de = "Bereits in der griechischen Antike entwickelten Philosophen erste Vorstellungen über den Aufbau der Materie und diskutierten erste Atommodelle. Zu Beginn der Moderne wurden diese Überlegungen von vielen Wissenschaftler:innen aufgegriffen, experimentell untersucht und erweitert. Wenn du Materialien suchst, die einen Überblick über die Entwicklung des Atombegriffs geben, bist du hier richtig."
broader = "atommodelle-in-der-chemie"
oeh = "aa70b690-e7fc-4792-9688-eeb8b2dffa2b"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "isomerie-in-der-organischen-chemie"
label_de = "Isomerie in der organischen Chemie"
definition_de = "In der organischen Chemie stößt man immer wieder auf Verbindungen, die zwar die gleiche Summenformel haben, deren Stoffeigenschaften sich aber zum Teil dramatisch unterscheiden. Dieser auf den ersten Blick merkwürdige Sachverhalt lässt sich durch einen Blick auf die Molekülstruktur der Stoffe klären: Bei den sogenannten Isomeren sind die Atome unterschiedlich miteinander verknüpft, die Bindungsverhältnisse unterscheiden sich voneinander."
oeh = "d40efc8d-6d21-41e5-a24c-2d3da67fd9d9"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "isotope-nuklide"
label_de = "Isotope / Nuklide"
definition_de = "Isotope sind Atome eines Elements, die die gleiche Anzahl von Protonen, aber eine unterschiedliche Anzahl von Neutronen besitzen. In der Chemie werden Isotope vor allem zur Aufklärung von Reaktionsmechanismen verwendet: Dazu werden radioaktive Isotope eines Elements gezielt in eine Verbindung eingebracht und im Verlauf einer chemischen Reaktion verfolgt. Da alle Isotope eines Elements chemisch weitgehend identisch reagieren, lassen sich auf diese Weise begründete Hypothesen über den zugrunde liegenden Mechanismus aufstellen."
broader = "kernchemie"
oeh = "37d68f14-9332-4be2-8b4d-2555f8ef9269"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "kalorimetrie"
label_de = "Kalorimetrie"
definition_de = "Oft ist es nicht einfach, chemische Reaktionen energetisch genauer zu untersuchen. Zu diesem Zweck nutzen Chemiker*innen verschiedene Formen von Kalorimetern, mit denen du über die kalorimetrische Grundgleichung den Energieumsatz einer chemischen Reaktion genauer untersuchen kannst."
broader = "energie-kinetik"
oeh = "3a64f914-5035-4ecd-9abb-9124b44968f7"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "katalyse"
label_de = "Katalyse"
definition_de = "In der Chemie ist ein Katalysator ein Stoff, der die Reaktionsgeschwindigkeit erhöht, indem er die Aktivierungsenergie herabsetzt. Dies spielt in vielen technischen Prozessen eine wichtige Rolle, um eine Reaktion überhaupt zu ermöglichen. Die Suche nach neuen Katalysatoren ist ein wichtiger Forschungszweig in der Verfahrenstechnik. Die genaue Funktionsweise von Katalysatoren ist im Detail oft komplex."
broader = "energie-kinetik"
oeh = "b26be4c4-1563-4a05-b909-322b3d6dae15"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "kern-huelle-modell-nach-rutherford"
label_de = "Kern-Hülle-Modell nach Rutherford"
definition_de = "Rutherford untersuchte den inneren Aufbau der Atome mit einem berühmten Experiment: dem Streuexperiment. Dabei bestrahlte er eine dünne Goldfolie mit Alphastrahlen und stellte fest, dass der größte Teil eines Atoms leer sein muss: Fast die gesamte Masse und positive Ladung eines Atoms ist in einem massiven Kern konzentriert, die Elektronen befinden sich um diesen Kern herum in der Atomhülle. Insbesondere kernchemische Prozesse lassen sich mit diesem “Kern-Hülle-Modell” des Atoms sehr gut beschreiben."
broader = "atommodelle-in-der-chemie"
oeh = "23532975-3b46-43dd-bc0b-a5543f04de78"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "kernchemie"
label_de = "Kernchemie"
oeh = "502ab680-af31-4c76-8b74-b493e8d918fb"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "kernmodelle"
label_de = "Kernmodelle"
definition_de = "Atomkerne können durch verschiedene Modelle beschrieben werden. Grundlegend für die Entdeckung des Atomkerns war zunächst das Rutherfordsche Experiment, das zu einem einfachen Kern-Hülle-Modell führte. Für die meisten Anwendungen in der Schulphysik hat sich das Tropfenmodell bewährt. Nach diesem Modell bestehen Atomkerne aus Protonen und Neutronen. Die Elektronen in der Atomhülle sind für kernphysikalische Vorgänge in der Regel nicht relevant. Neben diesem eher einfachen Kernmodell kann der Atomkern auch quantenphysikalisch beschrieben werden, zum Beispiel mit Hilfe eines linearen Potentialtopfmodells."
broader = "kernchemie"
oeh = "ef0e8907-474e-4bd9-9350-17f69675ec5c"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "kernreaktionen"
label_de = "Kernreaktionen"
definition_de = "Neben dem radioaktiven Zerfall gibt es noch andere Kernreaktionen, wie z.B. die Kernfusion in Sternen oder den künstlich herbeigeführten Kernzerfall durch Beschuss mit Kernteilchen. Diese letztgenannten Kernreaktionen spielen jedoch in der Chemie eine eher untergeordnete Rolle."
broader = "kernchemie"
oeh = "383d860f-4078-4457-820a-64d27ffc26a7"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "kinetik"
label_de = "Kinetik"
definition_de = "Chemische Reaktionen laufen sehr unterschiedlich ab: Manche sind unvorstellbar schnell, andere fast unmerklich langsam. Viele Reaktionen liegen zwischen diesen Extremen. Die Kinetik beschäftigt sich mit der Beschreibung der Geschwindigkeit chemischer Reaktionen und ihres Ablaufs. Sie beschäftigt sich auch mit chemischen Gleichgewichten."
broader = "energie-kinetik"
oeh = "2745ffb4-7c40-4a44-bf28-c9cc2f45b10d"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "klimawandel"
label_de = "Klimawandel"
definition_de = "Der Klimawandel ist ein multidisziplinäres Problem: Chemische, physikalische und geographische Kenntnisse sind für das Verständnis des Problems ebenso wichtig wie biologische und politische Kenntnisse. Aus chemischer Sicht können vor allem Aussagen zur Wirkungsweise von Treibhausgasen und zur Atmosphärenchemie in die Diskussion eingebracht werden."
broader = "chemie-und-umwelt"
oeh = "1ac45a81-6b24-4f44-a7b6-89b4cc430b3d"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "kommunikation"
label_de = "Kommunikation"
definition_de = "Chemie muss kommuniziert werden! Gegenüber Mitschüler:innen, Eltern, Freunden, anderen Wissenschaftler:innen - und in vielen weiteren Situationen. Die Kommunikation erfolgt dabei oft schriftlich in Fachtexten. Aber auch Vorträge, Poster und Erklärvideos werden in der Wissenschaft eingesetzt. Die Fähigkeit, chemische Sachverhalte adressatengerecht zu kommunizieren, wird daher auch als Kommunikationskompetenz bezeichnet."
broader = "fachdidaktik"
oeh = "e1fbe47b-740c-405a-8907-e5c9fad98229"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "kondensationsreaktionen"
label_de = "Kondensationsreaktionen"
definition_de = "Eine Kondensationsreaktion ist eine Reaktion, bei der sich zwei Moleküle unter Abspaltung eines kleinen Moleküls (häufig Wasser) miteinander verbinden. Kondensationen spielen eine wichtige Rolle bei vielen Polymerisationsprozessen, aber auch Veresterungen oder die Bildung von Proteinen können als Kondensationen angesehen werden."
broader = "reaktionsmechanismen-auf-der-spur-der-reaktionswege"
oeh = "e86f4d85-320b-4117-a0e4-bfd31080a53d"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "konzentrationsberechnungen"
label_de = "Konzentrationsberechnungen"
definition_de = "Viele chemische Reaktionen laufen in einem Lösungsmittel ab, in dem die eigentlich reagierenden Teilchen gelöst sind. Um solche Reaktionen genauer zu untersuchen, ist es oft notwendig, genauer zu bestimmen, “wie viel” eines bestimmten Stoffes eingesetzt wurde. Dazu muss die Konzentration des Stoffes berechnet werden."
broader = "chemisches-rechnen"
oeh = "6a41dc66-efce-4664-9515-96ab0b5a268a"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "korrosion-und-korrosionsschutz"
label_de = "Korrosion und Korrosionsschutz"
definition_de = "Metalle neigen dazu, mit dem Sauerstoff der Luft zu reagieren - sie rosten. Dieser Prozess wird meist durch Wasser beschleunigt - und kann durch viele Tricks wie Beschichtungen, Veredelungen oder das Anbringen von Opferanoden verhindert werden. Das Phänomen der Reaktion mit Sauerstoff wird in der Chemie auch als Korrosion bezeichnet, den Schutz vor Korrosion nennen Chemiker dementsprechend Korrosionsschutz."
broader = "die-elektrochemie"
oeh = "a744e16d-9b76-43d8-afc3-4401039e23eb"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "kosmetik"
label_de = "Kosmetik"
definition_de = "Kosmetika enthalten eine Vielzahl chemischer Stoffe. Ihre Eigenschaften beruhen auf den Eigenschaften der in ihnen verwendeten Stoffe, die mit den Methoden der Chemie sowohl synthetisiert als auch analysiert werden können."
broader = "chemie-und-umwelt"
oeh = "5593daf9-f638-4fd2-9771-4a0110ed1a1b"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "kugelwolkenmodell-nach-kimball"
label_de = "Kugelwolkenmodell nach Kimball"
definition_de = "Das Kugelwolkenmodell nach Kimball ist eine Erweiterung des Schalenmodells und gleichzeitig eine Vereinfachung des Orbitalmodells. Es macht Aussagen über die räumliche Verteilung der Elektronen in der Atomhülle. Sie befinden sich in so genannten Kugelwolken, die sich mit den Kugelwolken anderer Atome überlappen können. Auf diese Weise kann das Kugelwolkenmodell Phänomene wie Bindungswinkel in Molekülen und das Zustandekommen von Elektronenpaarbindungen gut erklären."
broader = "atommodelle-in-der-chemie"
oeh = "c05aee97-fddf-41a3-acc7-cacc1e4a7e3f"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "kunststoffe-aus-nachwachsenden-rohstoffen-biologisch-abbaubar"
label_de = "Kunststoffe aus nachwachsenden Rohstoffen/biologisch abbaubar"
definition_de = "Inzwischen gibt es nicht nur Kunststoffe aus Erdölprodukten, sondern auch aus nachwachsenden Rohstoffen wie Mais. Aber nicht alle Kunststoffe aus nachwachsenden Rohstoffen sind auch biologisch abbaubar! Dies ist bei der Entsorgung zu beachten!"
broader = "kunststoffe-langkettige-organische-molekuele"
oeh = "856e2e75-8571-4120-a285-28ec8bef6ad3"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "kunststoffe-langkettige-organische-molekuele"
label_de = "Kunststoffe - langkettige (organische) Moleküle"
definition_de = "Kohlenstoffatome können sehr große Moleküle, so genannte Polymere, bilden. Solche Makromoleküle kommen natürlicherweise zum Beispiel in Pflanzen vor. Im Alltag sind vor allem synthetisch hergestellte Polymere - die Kunststoffe - von Bedeutung. Diese Kunststoffe haben sehr unterschiedliche Eigenschaften und können nach diesen Eigenschaften in Thermoplaste, Elastomere und Duroplaste eingeteilt werden. Eine weitere Einteilung der verschiedenen Kunststoffe erfolgt nach dem zugrundeliegenden Mechanismus ihrer Herstellung: Polyaddukte, Polymere und Polykondensate."
oeh = "5828c294-98bb-45fc-9784-ce22c6368a27"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "laborgeraete"
label_de = "Laborgeräte"
definition_de = "Die Namen der Geräte und ihre Handhabung müssen gelernt werden. In diesem Abschnitt finden Sie Abbildungen von Laborgeräten, Arbeitsblätter, Anleitungen für den Gebrauch und spezielle Laborverfahren."
broader = "laborpraxis"
oeh = "2fbc1287-b67e-43d0-a3e5-370b22dc3c8c"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "laborpraxis"
label_de = "Laborpraxis"
definition_de = "Laborarbeit ist eine Art Handwerk. Dieses Handwerk erlernst du Schritt für Schritt - vom Beginn des Chemieunterrichts in der Schule an. Zum Handwerk gehört es, grundlegende Labortechniken zu erlernen und immer wieder zu üben. Dazu gehören das Kennenlernen der Laborgeräte, das Wiegen und Messen und der richtige Umgang mit dem Gasbrenner."
broader = "fachmethoden-und-reflexion"
oeh = "4874dbbf-dc28-4adf-9bbb-3617ea21c309"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "lebensmittelchemie"
label_de = "Lebensmittelchemie"
definition_de = "Lebensmittel bestehen - wie alle anderen Stoffe auch - aus chemischen Substanzen. Bei ihrer Zubereitung laufen vielfältige chemische Reaktionen ab, die häufig zum Verständnis und zur Veranschaulichung chemischer Konzepte genutzt werden können. Kochen ist also angewandte Chemie!"
broader = "chemie-und-umwelt"
oeh = "0532acaf-6da3-401f-8802-4996f980c5b7"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "luft-und-luftverschmutzung"
label_de = "Luft und Luftverschmutzung"
definition_de = "Ein Sonderfall der Umweltverschmutzung ist die Verunreinigung der Luft durch Abgase. Abgase sind beispielsweise für den Treibhauseffekt, den sauren Regen oder den Abbau der Ozonschicht verantwortlich. Diese vielfältigen Wirkungen sind meist auf chemische Prozesse zurückzuführen."
broader = "chemie-und-umwelt"
oeh = "a71b1f9f-0505-4202-ad7c-d5488ed70cf2"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "massenerhaltung"
label_de = "Massenerhaltung"
definition_de = "Bei chemischen Reaktionen bleibt die Masse der beteiligten Stoffe erhalten - wenn tatsächlich alle Stoffe berücksichtigt werden. Besonders schwierig ist es oft, auch alle an der Reaktion beteiligten gasförmigen Stoffe zu erfassen."
broader = "die-chemische-reaktion"
oeh = "52c86ca6-0969-4f33-ae83-74d3d086638b"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "mesomerie-in-der-organischen-chemie"
label_de = "Mesomerie in der Organischen Chemie"
definition_de = "Manche Moleküle lassen sich nicht durch eine einzige Strukturformel beschreiben. Vielmehr sind oft mehrere denkbare Strukturformeln erforderlich, um die beobachtbaren Eigenschaften des Moleküls genauer zu beschreiben. Diesen Umstand, dass Moleküle durch mehrere gleichwertige Resonanzformeln dargestellt werden müssen, bezeichnen Chemiker als Mesomerie. Sie führt häufig zu einer Stabilisierung des Moleküls. Die Ursache verrät das quantenmechanische Orbitalmodell: Häufig sind Bindungselektronen über mehrere Atome in einem ausgedehnten Molekülorbital delokalisiert."
oeh = "40184133-8215-444a-931f-48e4521ecc14"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "metalle-und-die-gewinnung-aus-erzen"
label_de = "Metalle und die Gewinnung aus Erzen"
definition_de = "Metalle kommen in der Natur selten in elementarer Form vor und müssen daher aus Salzen und Erzen gewonnen werden. Dazu werden seit Jahrhunderten verschiedene chemische Reaktionen genutzt. Am Beispiel der Metallgewinnung lassen sich gemeinsame Merkmale der dabei eingesetzten Reaktionen ableiten: Es handelt sich um RedOx-Reaktionen, bei denen Metalle aus ihren Oxiden gewonnen werden. Metalle lassen sich nach ihrer Reaktivität mit Luft und anderen Stoffen in edle und unedle Metalle unterscheiden."
broader = "anfangsunterricht"
oeh = "5e70f939-765d-47cd-ab24-ea5621baec14"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "metallgewinnung"
label_de = "Metallgewinnung"
definition_de = "Bei der Gewinnung von Metallen aus Rohstoffen muss das Edukt in der Regel reduziert werden. Als Reduktionsmittel werden häufig Kohle, Koks oder Torf verwendet. Viele Verfahren zur Metallgewinnung sind bereits seit Jahrtausenden bekannt und bilden eine der Grundlagen für die Entwicklung der menschlichen Zivilisation."
broader = "metalle-und-die-gewinnung-aus-erzen"
oeh = "a0a508ed-2068-45d9-8ec1-e6586d148045"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "muellvermeidung-und-verarbeitung"
label_de = "Müllvermeidung und -verarbeitung"
definition_de = "Müll verursacht viele Probleme: Plastik in den Meeren und Schadstoffemissionen bei der Müllverbrennung sind nur einige davon. Die Abbauprodukte, die bei der Zersetzung von Abfällen entstehen, sind oft gefährlich für die Umwelt. Andererseits bieten chemische Prozesse viele Chancen, Abfälle als Rohstoffquelle zu erschließen."
broader = "chemie-und-umwelt"
oeh = "18c4c066-cc9e-45fe-931a-266e56b1473b"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "nachwachsende-rohstoffe"
label_de = "Nachwachsende Rohstoffe"
definition_de = "Nachwachsende Rohstoffe können ein wichtiger Baustein der Energiewende sein und bieten Potenziale, chemische Grundstoffe alternativ zu fossilen Quellen zu gewinnen. Hier findest du Unterrichtsmaterialien zu chemischen Prozessen mit nachwachsenden Rohstoffen."
broader = "chemie-und-umwelt"
oeh = "0d45becf-29cf-477f-a91b-b29dc5fb18fb"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "namensreaktionen"
label_de = "Namensreaktionen"
definition_de = "Namensreaktionen sind wichtige Reaktionsmechanismen in der organischen Chemie, die einen eigenen Namen haben, oft nach ihrem Entdecker. In der Schule spielen sie meist eine untergeordnete Rolle, im Studium ist die Kenntnis wichtiger Namensreaktionen jedoch oft wichtig. Die meisten Namensreaktionen lassen sich im Prinzip auf die anderen Grundmechanismen der organischen Chemie zurückführen: Addition, Substitution und Eliminierung."
broader = "reaktionsmechanismen-auf-der-spur-der-reaktionswege"
oeh = "20730859-395a-42c5-be5a-0a540b43150a"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "nanostrukturen"
label_de = "Nanostrukturen"
definition_de = "Die Welt der ganz kleinen Teilchen - die Welt der Nanochemie - ist voller spannender Phänomene. Wusstest du, dass Goldpartikel in dieser Größenordnung plötzlich alles andere als Gold sind? Oder dass Nanosilber vor Fußgeruch schützen kann? Die Nanochemie liefert Antworten - und verursacht mit einigen ihrer Produkte ernsthafte Umweltprobleme."
broader = "bindung-struktur"
oeh = "3dba29cd-2e3b-4df8-bdac-03cd5def8442"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "natur-der-naturwissenschaft-nature-of-science"
label_de = "Natur der Naturwissenschaft / Nature of Science"
broader = "fachmethoden-und-reflexion"
oeh = "f2268b39-7f5b-4f98-9a77-298e2f54ee80"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "neutralisationsreaktionen"
label_de = "Neutralisationsreaktionen"
definition_de = "Werden saure und alkalische Lösungen zusammengebracht, so heben sich die saure und die alkalische Wirkung gegenseitig auf und es entsteht eine Lösung verschiedener Salze. Der pH-Wert nähert sich dabei dem Neutralpunkt bei pH = 7. Auf Teilchenebene hebt sich bei diesen Reaktionen die Wirkung der Hydronium- und Hydroxidionen auf - sie reagieren zu Wassermolekülen. So entsteht zum Beispiel aus Salzsäure und Natronlauge eine Kochsalzlösung."
broader = "saeuren-und-basen"
oeh = "190e487b-b71d-4e87-a499-f1e1f8c96378"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "oxidation-von-alkoholen"
label_de = "Oxidation von Alkoholen"
definition_de = "Alkohole enthalten eine Hydroxylgruppe. Aufgrund der Polarität dieser funktionellen Gruppe finden hier am ehesten Reaktionen statt. In vielen Fällen handelt es sich um RedOx-Reaktionen, bei denen der Alkohol zu einem Aldehyd oder Keton oxidiert wird."
broader = "reaktionsmechanismen-auf-der-spur-der-reaktionswege"
oeh = "5326c9dc-5dcc-4bd6-9333-be0f0a219899"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "ph-wert-berechnungen"
label_de = "pH-Wert-Berechnungen"
definition_de = "Mit Hilfe des Massenwirkungsgesetzes und der Säure-Base-Theorie nach Brönstedt können die pH-Werte wässriger Lösungen von Säuren, Basen und Salzen berechnet werden. Für diese Berechnungen werden verschiedene Formeln verwendet, deren Anwendung geübt werden sollte."
broader = "saeuren-und-basen"
oeh = "2ed5e61a-3f75-4d02-a4b9-0c4f3dd8be32"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "phenole-aromatische-alkohole"
label_de = "Phenole - aromatische Alkohole"
definition_de = "Phenole sind Aromaten mit mindestens einer OH-Gruppe als Substituent. Sie haben teilweise andere chemische Eigenschaften als die Alkohole mit nichtaromatischen Kohlenstoffgruppen."
broader = "aromaten-ringe-mit-delokalisierten-elektronensystemen"
oeh = "b10ef2fa-0d79-4c19-8972-379a32a62a80"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "photochemie"
label_de = "Photochemie"
definition_de = "Photochemie ist der Prozess der Wechselwirkung zwischen Lichtenergie und Materie. Beispielsweise löst jeder Sonnenaufgang in der Natur eine unvorstellbare Anzahl photochemischer Reaktionen aus. Ohne sie, die Photosynthese, wäre das Leben auf der Erde nicht denkbar. Auch in der aktuellen Forschung spielen Photoprozesse eine herausragende Rolle, sei es im Zusammenhang mit Solarzellen, der Wasserphotolyse oder photoaktiven molekularen Schaltern. Dies dokumentiert die Relevanz von Phänomenen, an denen Licht beteiligt ist. In dieser Sammlung finden sich zahlreiche schultaugliche Experimente und Materialien zu diesem innovativen Thema für den Chemieunterricht."
broader = "energie-kinetik"
oeh = "5dc1f7fe-6866-4b12-94e1-619de0049931"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "polare-atombindung"
label_de = "Polare Atombindung"
definition_de = "Viele atomare Bindungen sind polar. Die Polarität innerhalb eines Moleküls kann durch die Differenz der Elektronegativitäten der beteiligten Atome bestimmt werden. Die Bestimmung der Polarität von Molekülen hat vielfältige Auswirkungen auf die Eigenschaften dieser Moleküle: Löslichkeit, Siedepunkt und viele andere Stoffeigenschaften hängen davon ab."
broader = "bindungstypen"
oeh = "dff1f83c-97c4-46fd-aee0-d55370f4c164"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "polymerisationsreaktionen"
label_de = "Polymerisationsreaktionen"
definition_de = "Unter Polymerisation versteht man im Allgemeinen Synthesereaktionen, bei denen Monomere in Polymere umgewandelt werden. Dabei entstehen oft aus mehreren relativ kleinen Molekülen sehr große Moleküle."
broader = "reaktionsmechanismen-auf-der-spur-der-reaktionswege"
oeh = "226cbad6-cacc-40ef-b486-98b136fb0a3d"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "pse-und-atombau"
label_de = "PSE und Atombau"
definition_de = "Der Aufbau des Periodensystems hängt eng mit dem Aufbau der Atome zusammen. Alle Atome einer Hauptgruppe besitzen die gleiche Anzahl von Valenzelektronen, während bei den Atomen innerhalb einer Periode das gleiche Energieniveau sukzessive mehr mit Elektronen besetzt wird. Gleichzeitig nimmt im Periodensystem von links nach rechts die Zahl der Protonen im Atomkern und damit auch die Zahl der Elektronen in der Atomhülle zu."
broader = "das-periodensystem"
oeh = "16821ab5-2563-45d8-967a-964731c3f49b"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "puffersysteme"
label_de = "Puffersysteme"
definition_de = "Puffer sind spezielle Mischungen von Säuren und ihren Salzen, die pH-Wert-Änderungen abschwächen können. Biologisch ist das zum Beispiel überlebenswichtig! Aber auch in der Industrie ist dies von kaum zu unterschätzender Bedeutung, da viele chemische Reaktionen nur bei ganz bestimmten pH-Werten wie gewünscht ablaufen, die durch Puffer gezielt eingestellt werden können."
broader = "saeuren-und-basen"
oeh = "8e5d25b2-4390-4d72-addf-78856f9c3ecf"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "qualitative-nachweisverfahren"
label_de = "Qualitative Nachweisverfahren"
definition_de = "Welches Gas ist bei einer chemischen Reaktion entstanden? Enthält eine Probe wirklich Stärke? Ist das gefundene Gas wirklich Kohlendioxid? Alle Fragen nach der An- oder Abwesenheit einer bestimmten chemischen Verbindung lassen sich mit Hilfe so genannter Nachweisreaktionen - auch qualitative Nachweisverfahren genannt - beantworten. Dabei unterscheidet man chemische Verfahren wie die Knallgasprobe oder die Kalkwasserprobe von physikalischen Verfahren wie der IR-Spektroskopie."
broader = "analytische-verfahren"
oeh = "4d3897ae-3446-46a2-be91-3d42c699cbba"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "quantitative-analyseverfahren"
label_de = "Quantitative Analyseverfahren"
definition_de = "In vielen Zusammenhängen ist es wichtig, die Menge eines bestimmten Stoffes in einer Probe genau zu bestimmen: Ist der Flusslauf gesund - oder enthält er zu viel giftiges Blei? Wie hoch ist die Salzkonzentration in einer Probe? Kann ein Produkt bedenkenlos verkauft werden - oder überschreiten Schadstoffe festgelegte Grenzwerte? Zur Klärung derartiger Fragestellungen nutzen Chemiker:innen physikalisch-quantitative Analysemethoden wie die Gaschromatographie, die Massenspektroskopie oder die Atomabsorptionsspektroskopie genauso wie klassische nasschemische Verfahren wie die Gravimetrie."
broader = "analytische-verfahren"
oeh = "feecf9d0-ee9e-4b7a-81c6-2c40b3852155"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "radioaktivitaet-und-zerfallsarten"
label_de = "Radioaktivität und Zerfallsarten"
definition_de = "Radioaktivität ist ein allgegenwärtiges Phänomen. Für die radioaktive Strahlung, die bei Zerfallsprozessen von Atomkernen entsteht, besitzt der Mensch jedoch kein spezielles Sinnesorgan. Man merkt also nicht, dass um einen herum radioaktive Zerfallsprozesse ablaufen. Mit speziellen Messgeräten kann dieser Nulleffekt jedoch sichtbar gemacht und quantifiziert werden."
broader = "kernchemie"
oeh = "992a5085-7607-415d-b66b-e38feeba04e8"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "reaktionen-von-saeuren-und-basen"
label_de = "Reaktionen von Säuren und Basen"
definition_de = "Sehr typisch und häufig sind die Reaktionen von Säuren mit Basen. Neben der sogenannten Neutralisation von sauren und alkalischen Lösungen ist vor allem die Reaktion von Säuren mit unedlen Metallen zu Salzen und Wasserstoff sowie mit Carbonaten zu Kohlendioxid zu nennen."
broader = "saeuren-und-basen"
oeh = "a1b690be-1681-4d37-acfb-70de358e2adf"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "reaktionsmechanismen-auf-der-spur-der-reaktionswege"
label_de = "Reaktionsmechanismen - Auf der Spur der Reaktionswege"
definition_de = "Reaktionsmechanismen sind ein wichtiges Werkzeug der organischen Chemie - und gleichzeitig ein wichtiger Forschungsgegenstand. Der Mechanismus einer chemischen Reaktion gibt Auskunft über den genauen Ablauf der Reaktionsschritte. Reaktionsmechanismen sind daher ein wichtiges Hilfsmittel, um chemische Reaktionen zu verstehen, zu kontrollieren und zu optimieren. Zwischen Reaktionsmechanismus und Stoffklasse besteht eine gewisse Korrespondenz: Bestimmte Stoffklassen reagieren meist bevorzugt nach einem typischen Reaktionsmechanismus."
oeh = "392f83ef-4052-423c-b42d-315b691df6f2"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "redox-reaktionen"
label_de = "RedOx-Reaktionen"
definition_de = "RedOx-Reaktionen können einerseits als Reaktionen betrachtet werden, bei denen Sauerstoffatome ausgetauscht werden. Bei genauerer Betrachtung können RedOx-Reaktionen aber auch als Reaktionen beschrieben werden, bei denen Elektronen von einem Teilchen auf ein anderes übertragen werden: Sie bestehen aus einer Elektronenabgabe (Oxidation) und einer Elektronenaufnahme (Reduktion). Dieser Formalismus kann sowohl zur genaueren Beschreibung von Batterien, Akkumulatoren und Korrosion in der anorganischen Chemie als auch zur Beschreibung bestimmter Reaktionen in der organischen Chemie verwendet werden. Eine wichtige Technik ist die Bestimmung der Oxidationszahl, die nicht nur in der Elektrochemie von Bedeutung ist."
broader = "die-elektrochemie"
oeh = "2a729306-135b-4625-8001-7f3454addfd0"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "regenerative-energien"
label_de = "Regenerative Energien"
definition_de = "Erneuerbare Energien sind die Zukunft der Energiegewinnung. Sie nutzen natürliche, weitgehend unerschöpfliche Energiequellen wie Sonne, Wind oder - über die Geothermie - die Zerfallswärme radioaktiver Nuklide im Erdmantel. Bei der Energieerzeugung selbst entstehen keine Schadstoffe wie Kohlendioxid."
broader = "chemie-und-umwelt"
oeh = "542ad088-4e96-4249-952a-453ff61ee435"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "saeure-base-titration-ein-analytisches-verfahren"
label_de = "Säure-Base-Titration - Ein analytisches Verfahren"
definition_de = "Die Konzentration von Säuren und Basen kann im Labor durch Titration bestimmt werden. Klassische Titrationen werden bis zum Farbumschlag eines Indikators durchgeführt. Andere Möglichkeiten sind die kontinuierliche Messung des pH-Wertes der titrierten Lösung oder die Messung der Leitfähigkeit. Ziel ist es immer, den sogenannten Äquivalenzpunkt zu finden, an dem die Menge an Hydronium- und Hydroxidionen genau gleich ist."
broader = "saeuren-und-basen"
oeh = "6394a486-9d3e-456d-b2d7-3e14ef47908a"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "saeure-basen-konzepte"
label_de = "Säure-Basen-Konzepte"
definition_de = "Zu den Begriffen Säure und Base haben sich in der Chemie verschiedene Konzepte entwickelt, die auf unterschiedlichen Definitionen beruhen. Sie reichen von phänomenologischen Definitionen über den Geschmack von Lösungen bis hin zu Definitionen auf Teilchenebene, die viele Phänomene und Stoffe umfassen. Die wohl einflussreichste Definition stammt von Brönstedt: In diesem Konzept werden Säuren als Protonendonatoren und Basen als Protonenakzeptoren aufgefasst."
broader = "saeuren-und-basen"
oeh = "c1a2fc50-b3eb-4ef2-a173-78678c160c04"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "saeuren-und-basen"
label_de = "Säuren und Basen"
definition_de = "Säuren und Basen kommen in vielen Bereichen des täglichen Lebens vor. Säuren sind oft sauer, Basen eher seifig. Die Gemeinsamkeit aller Säuren und Basen hat historisch immer wieder zu genaueren und umfassenderen Definitionen des Säure-Base-Begriffs geführt. Heute gehen Chemiker meist vom Brönstedt'schen Konzept aus: Basen sind Protonenakzeptoren, Säuren Protonendonatoren. Nach diesem Konzept bilden Säuren in Wasser saure Lösungen. Basen bilden in Wasser alkalische Lösungen oder Laugen."
broader = "chemie"
oeh = "9f082eef-2f86-4007-bbf0-45690cec45a4"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "salzbildung"
label_de = "Salzbildung"
definition_de = "Die meisten Salze können durch Reaktion von Säuren und Basen/Laugen hergestellt werden: Salzsäure und Natronlauge neutralisieren sich z.B. und es entsteht u.a. normales Kochsalz - Natriumchlorid. Auch die Reaktion von Metallen und Nichtmetallen miteinander ist möglich: Natrium reagiert zum Beispiel heftig mit Chlorgas zu Natriumchlorid. Dabei werden im Sinne einer Redoxreaktion Elektronen der beteiligten Reaktionspartner ausgetauscht."
broader = "salze"
oeh = "75c27f92-8694-4f1c-a078-a441b94c4aef"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "salze"
label_de = "Salze"
broader = "bindung-struktur"
oeh = "a3f828d4-1eaa-46c6-9179-5ec68aa73194"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "schalenmodell-nach-bohr"
label_de = "Schalenmodell nach Bohr"
definition_de = "Es gibt chemische und physikalische Phänomene, die mit einem einfachen Kern-Hülle-Modell nicht erklärt werden können. Dazu gehören z.B. die Farbe bestimmter Stoffe oder die experimentell festgestellten Tendenzen in der Ionisierungsenergie verschiedener Atome. Das Bohrsche Atommodell geht davon aus, dass sich die Elektronen auf festen Energieniveaus in der Atomhülle befinden und erklärt damit die oben genannten Phänomene. Es ist eines der ersten quantenmechanischen Atommodelle."
broader = "atommodelle-in-der-chemie"
oeh = "41570c2d-02e4-4436-a1cb-bff4101b0d54"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "sicherheit-in-den-chemie-raeumen"
label_de = "Sicherheit in den Chemie-Räumen"
broader = "fachmethoden-und-reflexion"
oeh = "c2681cb6-356c-4888-8e61-1e7edfe65d85"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "sicherheitsregeln-in-chemieraeumen"
label_de = "Sicherheitsregeln in Chemieräumen"
definition_de = "In Laboratorien wird mit Stoffen und Geräten gearbeitet, die nicht ungefährlich sind. Um Verletzungen und Unfälle zu vermeiden, gibt es viele Regeln. Welche allgemeinen Sicherheitsmaßnahmen sind im Labor und in den Chemieräumen zu beachten?"
broader = "sicherheit-in-den-chemie-raeumen"
oeh = "53f5e7d3-448f-40e3-8b30-4798b444196f"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "spektakulaere-experimente"
label_de = "Spektakuläre Experimente"
definition_de = "Viele chemische Reaktionen sehen spektakulär aus. Nicht umsonst heißt es oft scherzhaft: Chemie ist, wenn es knallt und stinkt. Neben akustischen und olfaktorischen Reizen sind viele chemische Reaktionen mit schönen optischen Effekten und überraschenden Wendungen verbunden."
broader = "spiele-und-spektakulaeres"
oeh = "1016c591-b35f-4dd7-896b-315ccdaaeb94"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "spektroskopieverfahren"
label_de = "Spektroskopieverfahren"
definition_de = "Spektroskopische Verfahren wie die IR-Spektroskopie oder die Flammenatomabsorptionsspektroskopie beruhen auf der Wechselwirkung von Materie mit Strahlung. Aus der Art und Stärke dieser Wechselwirkung lassen sich sowohl Rückschlüsse auf die Art des untersuchten Stoffes ziehen als auch Aussagen über die in einer Probe vorhandene Menge machen. Spektroskopische Verfahren können daher sowohl als qualitative Nachweisverfahren als auch zur quantitativen Gehaltsbestimmung eingesetzt werden."
broader = "analytische-verfahren"
oeh = "69a6dd03-a0ae-4149-944c-6d418145e5b2"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "spiele-und-spektakulaeres"
label_de = "Spiele und Spektakuläres"
definition_de = "Spiele im Chemieunterricht können ganz unterschiedliche Facetten haben: Einfache Spiele dienen der Festigung bereits gelernter Fachinhalte, andere Spiele strukturieren die gesamte Unterrichtsstunde und wieder andere dienen der Einübung von Argumentationsstrukturen. Das Spektrum reicht von einfachen Brettspielen über Rätsel bis hin zu komplexen Escape Rooms. Lassen Sie sich von unserer redaktionellen Auswahl inspirieren - und spielen Sie selbst!"
broader = "fachdidaktik"
oeh = "277cdde9-112b-46fc-9e16-292e1146bc17"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "standardpotential-und-nernst-sche-gleichung"
label_de = "Standardpotential und Nernst'sche Gleichung"
definition_de = "Das Standardpotential eines Redoxpaares ist die elektrische Spannung zwischen einer Normalwasserstoffelektrode und einer Halbzelle des Redoxpaares. Diese Werte bilden die Grundlage für alle elektrochemischen Aussagen."
broader = "die-elektrochemie"
oeh = "5e3526e1-f943-49e6-8408-e496738665ad"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "stoffe-und-stoffeigenschaften"
label_de = "Stoffe und Stoffeigenschaften"
broader = "anfangsunterricht"
oeh = "3d589846-67e0-45d1-869c-7b94d0538e0a"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "stoffvernichtung-und-stoffneubildung"
label_de = "Stoffvernichtung und Stoffneubildung"
definition_de = "Chemische Reaktionen sind Vorgänge, bei denen neue Stoffe entstehen und andere Stoffe zerstört werden. Dies erkennt man daran, dass die neuen Stoffe auch neue, von den Ausgangsstoffen abweichende Stoffeigenschaften besitzen. Dabei ist darauf zu achten, dass eine Veränderung nicht mit einer Änderung des Aggregatzustandes verwechselt wird."
broader = "die-chemische-reaktion"
oeh = "3c52e959-fc3e-463e-89a7-377ffe7d17d7"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "struktur-und-eigenschaften-von-kunststoffen"
label_de = "Struktur und Eigenschaften von Kunststoffen"
definition_de = "Die Kenntnis des Einflusses der Molekülstruktur auf die Eigenschaften von Polymeren ist die Voraussetzung für die gezielte Herstellung neuer Polymere mit gewünschten Eigenschaften. Insbesondere die aus der Molekülstruktur resultierenden thermischen Eigenschaften bestimmen, wie Kunststoffe verarbeitet werden können."
broader = "kunststoffe-langkettige-organische-molekuele"
oeh = "c638b760-80cd-468e-9f4c-019f0e7d7763"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "strukturformeln"
label_de = "Strukturformeln"
definition_de = "Die Fischer-Projektion und die Haworth-Projektion sind Methoden zur Darstellung der räumlichen Struktur einer chemischen Verbindung. Diese Projektionsformen helfen, die dreidimensionale Struktur einer Verbindung zu veranschaulichen."
oeh = "2a40c581-5645-49e7-8d75-044e2ebf077d"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "substitutionsreaktionen"
label_de = "Substitutionsreaktionen"
definition_de = "Eine Substitutionsreaktion ist eine chemische Reaktion, bei der Atome oder Atomgruppen in einem Molekül durch ein anderes Atom oder eine andere Atomgruppe ersetzt werden. Sie treten in der organischen Chemie bei einer Vielzahl von Stoffklassen und in verschiedenen Varianten auf: Von der nukleophilen Substitution an Halogenalkanen bis zur elektrophilen Substitution an aromatischen Verbindungen."
broader = "reaktionsmechanismen-auf-der-spur-der-reaktionswege"
oeh = "74caf11c-cf69-4626-8877-1b55cc935f9e"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "tenside-seife-und-waschmittel"
label_de = "Tenside, Seife und Waschmittel"
definition_de = "Wahrscheinlich hast du sie heute auch schon benutzt: Seife. Chemisch gesehen sind Seifen Natrium- und Kaliumsalze von Fettsäuren. Sie bestehen aus Molekülen mit einem polaren und einem unpolaren Teil. Diese Grundstruktur von Seifen findet man auch in anderen Verbindungen. Diese werden allgemein als Tenside bezeichnet. Tenside werden nicht nur zum Waschen, sondern auch für viele andere technische Anwendungen eingesetzt."
oeh = "117e5c0c-7a7e-453d-91a5-1b657d30a265"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "umgang-mit-dem-gasbrenner"
label_de = "Umgang mit dem Gasbrenner"
definition_de = "Der Gasbrenner ist ein wichtiges Arbeitsgerät im Chemielabor und im Chemieunterricht. Doch der Umgang mit dem Brenner will gelernt sein. Hier findest du Materialien dazu."
broader = "laborpraxis"
oeh = "ee18dcda-6d0c-4659-b8e5-4b5e47d8ebef"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "umlagerungen"
label_de = "Umlagerungen"
definition_de = "Umlagerungen sind Reaktionen, bei denen die Atome oder Molekülteile einer Verbindung erhalten bleiben, aber neu angeordnet werden. In der Regel werden bei solchen Reaktionen Teile eines Moleküls abgespalten und an anderer Stelle wieder angelagert."
broader = "reaktionsmechanismen-auf-der-spur-der-reaktionswege"
oeh = "7926aa60-05ba-4b8d-8d61-e4e76bdb604c"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "verfahren-zur-verarbeitung-von-kunststoffen"
label_de = "Verfahren zur Verarbeitung von Kunststoffen"
definition_de = "Die meisten Verfahren zur Verarbeitung von Kunststoffen basieren auf der Erwärmung und Verformung des Materials. Welche Verfahren für einen bestimmten Kunststoff in Frage kommen, hängt stark von seiner molekularen Struktur ab."
broader = "kunststoffe-langkettige-organische-molekuele"
oeh = "65553d51-9f6f-48d4-a257-7b34f528603f"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "verschiedene-kunststoffe"
label_de = "Verschiedene Kunststoffe"
definition_de = "Die Vielfalt der Kunststoffe ist unüberschaubar. Es gibt jedoch einige Kunststoffe, die im Alltag sehr häufig verwendet werden und eine große wirtschaftliche Bedeutung haben. Dazu gehören zum Beispiel PET für die Herstellung von Getränkeflaschen, Polystyrol für Verpackungen aller Art oder PE für Folien und viele andere Anwendungen. Andere Kunststoffe werden eher in speziellen Situationen eingesetzt."
broader = "kunststoffe-langkettige-organische-molekuele"
oeh = "91d3b8f5-1e72-4ccf-b05d-6327364c73a1"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "verschmutzung-von-natur-und-umwelt"
label_de = "Verschmutzung von Natur und Umwelt"
definition_de = "Der Mensch wirkt in vielfältiger Weise auf die Umwelt ein. Dabei wird die Umwelt häufig durch Schadstoffe belastet. Diese Schadstoffe lösen in der Natur eine Vielzahl chemischer Prozesse aus, die die natürlichen Abläufe in der Umwelt beeinflussen. So werden chemische Verunreinigungen zu einer Gefahr für Mensch und Natur."
broader = "chemie-und-umwelt"
oeh = "1194cf9f-19d5-41d6-ac43-7a08890fcbde"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "verwendung-von-saeuren-und-basen"
label_de = "Verwendung von Säuren und Basen"
definition_de = "Säuren und Basen zeigen ganz charakteristische Reaktionen, die auch in der Industrie und im Alltag genutzt werden: Das Entkalken von Kaffeemaschinen wäre ebenso undenkbar wie die Neutralisation von Säuren durch Basen in der Industrie oder das Ätzen von Leiterplatten für Computer. Viele weitere Prozesse sind ohne Säuren und Laugen undenkbar."
broader = "saeuren-und-basen"
oeh = "da05d816-bc80-4d64-b201-f61dd017a21c"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "vorkommen-und-gewinnung-von-kohlenhydraten"
label_de = "Vorkommen und Gewinnung von Kohlenhydraten"
definition_de = "Die meisten Kohlenhydrate kommen in der Natur vor. Das bekannteste Beispiel ist wohl der normale Haushaltszucker, der z. B. aus Zuckerrüben gewonnen wird. Auch viele andere Pflanzen enthalten weitere Zucker, meist in Form von Polysacchariden. Einige Zucker lassen sich jedoch nur synthetisch im Labor herstellen."
oeh = "c24dc4e1-2f47-41b0-8630-9671621f0fae"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "wasser-trinkwasser-und-mehr"
label_de = "Wasser - Trinkwasser und mehr"
definition_de = "Wasser ist das wichtigste Grundnahrungsmittel - und eine der häufigsten chemischen Verbindungen auf der Erde. Wasser ist Teil vieler natürlicher Stoffkreisläufe - und oft nicht direkt zum Trinken geeignet. Die Gewinnung und Aufbereitung von verschmutztem Wasser ist das Problem der Zukunft."
broader = "chemie-und-umwelt"
oeh = "d7fc9b61-f244-4a16-849a-814e47f5849a"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "weitere-stoffeigenschaften"
label_de = "Weitere Stoffeigenschaften"
definition_de = "Stoffe haben viele Eigenschaften, die geprüft werden können. Sie alle ermöglichen es, verschiedene Stoffe voneinander zu unterscheiden und gegebenenfalls voneinander zu trennen. Hier findest du vielfältige Materialien zu Stoffeigenschaften, die im Chemieportal von WirLernenOnline keine eigene Sammlung haben!"
broader = "stoffe-und-stoffeigenschaften"
oeh = "1da1e9c9-173c-403e-948f-4b39d973d43d"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "weitere-trennverfahren"
label_de = "Weitere Trennverfahren"
definition_de = "Die Trennung von Stoffen ist eine häufige Aufgabe in der Chemie. Meist werden dazu unterschiedliche Stoffeigenschaften der zu trennenden Stoffe ausgenutzt. Dazu gibt es eine Vielzahl von Verfahren."
oeh = "a5b20ba8-b865-43f3-83c9-2fcd6e39b50c"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "wiegen-und-messen"
label_de = "Wiegen und Messen"
definition_de = "Das Abmessen bestimmter Volumina von Flüssigkeiten und das Abwiegen von Feststoffen sind typische Teilschritte beim Experimentieren. Bilder und Anleitungen stehen hier zur Verfügung."
broader = "laborpraxis"
