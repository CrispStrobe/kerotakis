[[concept]]
id = "1-hauptgruppe-alkalimetalle"
label_de = "1. Hauptgruppe: Alkalimetalle"
definition_de = "Die Alkalimetalle bilden die erste Hauptgruppe des Periodensystems. Alle Alkalimetalle reagieren heftig mit Wasser und bilden sehr leicht einfach positiv geladene Kationen. Alle Alkalimetalle besitzen genau ein Valenzelektron."
oeh = "30d0546b-32da-4fd2-94bf-45f7a2481285"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "2-hauptgruppe-erdalkalimetalle"
label_de = "2. Hauptgruppe: Erdalkalimetalle"
definition_de = "Die Elemente der zweiten Hauptgruppe werden auch als Erdalkalimetalle bezeichnet. Sie begegnen uns im Alltag als Spurenelemente und in Form von Mineralien. In ihren chemischen Eigenschaften weisen sie viele Ähnlichkeiten mit den Alkalimetallen der ersten Hauptgruppe auf."
oeh = "9de20424-9fe8-4c7e-ab06-68302801a061"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "3-hauptgruppe-borgruppe"
label_de = "3. Hauptgruppe: Borgruppe"
definition_de = "Die Borgruppe - oder dritte Hauptgruppe - des Periodensystems der Elemente enthält einige technisch wichtige Elemente: Bor wird zur Dotierung von Halbleitern benötigt, Aluminium ist ein technisch wichtiger Werkstoff. Gallium und Indium werden in der Halbleiterindustrie verwendet. Alle Elemente der dritten Hauptgruppe besitzen drei Valenzelektronen."
oeh = "d4ae9fc5-6de3-46fb-8b29-28832b04201c"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "4-hauptgruppe-kohlenstoffgruppe"
label_de = "4. Hauptgruppe: Kohlenstoffgruppe"
definition_de = "Kohlenstoff ist eines der vielseitigsten Elemente der Chemie. Dieser kann mit seinen vier Valenzelektronen vier Bindungen zu anderen Atomen eingehen. Aber auch die anderen Elemente dieser Hauptgruppe sind zum Teil von großer technischer Bedeutung, so bildet beispielsweise Silizium die Grundlage der Halbleiterindustrie."
oeh = "a192d77f-7704-47b8-ad51-887e44e4c12b"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "5-hauptgruppe-stickstoffgruppe"
label_de = "5. Hauptgruppe: Stickstoffgruppe"
definition_de = "Stickstoff ist eines der häufigsten Elemente der Erde. Hauptgruppe, die sich letztlich auf das Vorhandensein von fünf Valenzelektronen zurückführen lassen."
oeh = "b72bcd71-4d04-4268-9b44-308a06eb45c5"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "6-hauptgruppe-chalkogene"
label_de = "6. Hauptgruppe: Chalkogene"
definition_de = "Die Chalkogene - oder Erze - bilden die sechste Hauptgruppe des Periodensystems. Sie kommen häufig in Erzen vor, zum Beispiel in Form von Sulfiden und Oxiden. Gleichzeitig hat insbesondere das Element Sauerstoff eine herausragende Bedeutung für das Leben auf der Erde."
oeh = "474c08c3-9ae1-4fc2-adce-a3bde871a00f"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "7-hauptgruppe-halogene"
label_de = "7. Hauptgruppe: Halogene"
definition_de = "Die Halogene bilden die siebte Hauptgruppe. Alle elementaren Halogene sind sehr reaktionsfreudig, weshalb sie in der Natur meist als einfach negativ geladene Ionen vorkommen. Alle Halogene haben wichtige biochemische Funktionen als Bestandteile wichtiger Salze."
oeh = "78fc1989-5e5a-427a-ba02-feba313e5554"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "8-hauptgruppe-edelgase"
label_de = "8. Hauptgruppe: Edelgase"
oeh = "c7d86a5b-277a-403b-b2e1-322fc0b53d6f"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "abituraufgaben"
label_de = "Abituraufgaben"
definition_de = "Das Abitur steht häufig am Ende der schulischen Laufbahn im Fach Chemie. Die Vorbereitung auf diese Abschlussprüfung ist jedoch nicht immer einfach. Hilfreich ist es, sich gezielt alte Klausuren anzusehen, die in großer Zahl im Internet zu finden sind."
broader = "fachmethoden-und-reflexion"
oeh = "40bed1e2-5495-41d4-953a-22dd84a1c031"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "additionsreaktionen"
label_de = "Additionsreaktionen"
definition_de = "Bei einer Additionsreaktion lagern sich Atome oder Moleküle an Doppel- oder Dreifachbindungen an und bilden Einfachbindungen aus. Dadurch entsteht aus zwei Molekülen ein neues Molekül. Die Addition kann nach verschiedenen Mechanismen ablaufen. Am bekanntesten ist die elektrophile Addition an Doppel- und Dreifachbindungen - die typische Reaktion der Alkene und Alkine."
broader = "reaktionsmechanismen-auf-der-spur-der-reaktionswege"
oeh = "b4c79ddf-0209-4a2f-8f53-6fc7baeb39e1"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "aggregatzustaende"
label_de = "Aggregatzustände"
broader = "stoffe-und-stoffeigenschaften"
oeh = "ee4c1732-562c-47d1-aae3-a6039d3457c0"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "akkumulatoren"
label_de = "Akkumulatoren"
definition_de = "Akkumulatoren - oft kurz Akkus genannt - sind Batterien, die wieder aufgeladen werden können. Ein klassisches Beispiel ist die Starterbatterie im Auto, der Bleiakku. Für Elektroautos werden sie immer wichtiger. Denn auch aus dem Alltag sind sie nicht mehr wegzudenken: Elektromobilität, Smartphones und kabellose Geräte für Garten, Freizeit und Hobby sind ohne immer leistungsfähigere Akkus kaum denkbar."
broader = "die-elektrochemie"
oeh = "b5feeefd-408d-487c-96a7-dedc19598d57"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

[[concept]]
id = "aldehyde-und-ketone-oxidationsprodukte-von-alkoholen"
label_de = "Aldehyde und Ketone - Oxidationsprodukte von Alkoholen"
definition_de = "Aldehyde und Ketone sind Oxidationsprodukte primärer und sekundärer Alkohole. Charakteristisch für Aldehyde und Ketone ist die Carbonylgruppe, die aus einem doppelt an ein Kohlenstoffatom gebundenen Sauerstoffatom besteht. Aldehyde und Ketone haben ein breites technisches und industrielles Anwendungsspektrum, z. B. als Reinigungsmittel wie Aceton in Nagellack, als Duft- und Aromastoffe und als Ausgangsstoffe für vielfältige chemische Synthesen."
oeh = "868f4e1a-d732-4a4b-9397-c441e3d1c1ec"
source = "oehTopics (openeduhub / WirLernenOnline), CC0 1.0"

