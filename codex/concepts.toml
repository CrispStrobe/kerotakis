[[concept]]
id = "zwischenmolekulare-kraefte"
label_de = "Zwischenmolekulare Kräfte"
definition_de = "Auch zwischen den einzelnen Molekülen wirken Kräfte. Sie sorgen dafür, dass sich die einzelnen Moleküle nicht einfach voneinander trennen können. Diese zwischenmolekularen Kräfte sind für eine Vielzahl alltäglicher Phänomene wichtig: Proteine falten sich nur aufgrund zwischenmolekularer Wechselwirkungen richtig und erfüllen ihre Funktion im Körper, Wasser würde ohne Wasserstoffbrücken schon bei -70°C sieden und Eis auf einem zugefrorenen See nicht schwimmen, sondern sinken."
broader = "bindung-struktur"
oeh = "66925fc0-0c09-493b-b526-cae9b94575de"
