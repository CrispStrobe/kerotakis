[reaction.expect.predict]
question = "The equation is S₂O₃²⁻ + 2 H⁺ → S + SO₂ + H₂O. The beaker starts with 5.0 mmol of thiosulfate and 2.0 mmol of acid. After ten minutes, 4.67 mmol of thiosulfate has reacted. What has the pH done?"
question_de = "Die Gleichung lautet S₂O₃²⁻ + 2 H⁺ → S + SO₂ + H₂O. Das Becherglas startet mit 5,0 mmol Thiosulfat und 2,0 mmol Säure. Nach zehn Minuten haben 4,67 mmol Thiosulfat reagiert. Was hat der pH-Wert getan?"
options = [
  "Risen sharply — the protons were the limiting reagent and ran out after 1 mmol of thiosulfate",
  "Risen a little, as protons were consumed",
  "Not moved at all — this rate law reads the acid from the pH and never consumes it, which is a stated approximation and here it is being stretched past where it holds",
  "Fallen, because sulfur dioxide dissolves to make an acid",
]
options_de = [
    "Stark gestiegen — die Protonen waren das begrenzende Edukt und gingen nach 1 mmol Thiosulfat aus",
    "Ein wenig gestiegen, da Protonen verbraucht wurden",
    "Überhaupt nicht bewegt — dieses Geschwindigkeitsgesetz liest die Säure aus dem pH-Wert ab und verbraucht sie nie, was eine erklärte Näherung ist, die hier über ihre Gültigkeitsgrenze hinaus strapaziert wird",
    "Gefallen, weil sich Schwefeldioxid unter Bildung einer Säure löst",
]
answer = 2
misconception = "There is no misconception on offer here — all four options are chemically sensible, and the first is what a real beaker would do. The question exists to make a modelling decision visible. The rate law treats [H⁺] as an influence read from the solution rather than as a reactant with an inventory, because the practical is designed to run with acid in large excess and the vessel has no proton portion to draw down. Over the twenty to sixty seconds the practical actually uses, that is a good approximation. Over ten minutes with only 2 mmol of acid it is not, and the entry says so rather than letting the reader discover it as a surprise."
misconception_de = "Hier wird kein Missverständnis angeboten — alle vier Optionen sind chemisch sinnvoll, und die erste ist das, was ein echtes Becherglas tun würde. Die Frage dient dazu, eine Modellierungsentscheidung sichtbar zu machen. Das Geschwindigkeitsgesetz behandelt [H⁺] als einen aus der Lösung abgelesenen Einfluss, nicht als Reaktanten mit eigenem Inventar, weil das Experiment für einen großen Säureüberschuss ausgelegt ist und das Gefäß keine Protonenmenge besitzt, die abgebaut werden könnte. Über die zwanzig bis sechzig Sekunden, die das Experiment tatsächlich nutzt, ist das eine gute Näherung. Über zehn Minuten mit nur 2 mmol Säure ist sie es nicht, und der Eintrag sagt das offen, statt es die Leserin oder den Leser als Überraschung entdecken zu lassen."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "The right chemistry for a real beaker, and the right stoichiometry — offered as a prediction about this model."
reveals_de = "Die richtige Chemie für ein echtes Becherglas und die richtige Stöchiometrie — angeboten als Vorhersage über dieses Modell."
next = "Nothing to unlearn. Note instead which prediction the engine cannot honour and why: there is no proton portion in the vessel to draw down, so the limiting-reagent argument has nothing to act on here even though it is correct."
next_de = "Hier ist nichts zu verlernen. Stattdessen wird notiert, welche Vorhersage der Motor nicht einlösen kann und warum: Es gibt im Gefäß keine Protonenmenge, die sich abbauen ließe, sodass das Argument des limitierenden Reagenz hier korrekt, aber wirkungslos ist."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "Protons are consumed, but a solution buffers itself, so the pH drifts rather than jumps."
reveals_de = "Protonen würden verbraucht, aber eine Lösung puffere sich selbst, sodass der pH-Wert eher driftet als springt."
next = "Check whether anything in this beaker could buffer: hydrochloric acid is fully dissociated and thiosulfate is invisible to the aqueous solver. Then read the pH — not drifted, not moved at all, twelve digits unchanged."
next_de = "Es wird geprüft, ob irgendetwas in diesem Becherglas puffern könnte: Salzsäure ist vollständig dissoziiert, und Thiosulfat ist für den wässrigen Solver unsichtbar. Dann wird der pH-Wert abgelesen — nicht gedriftet, überhaupt nicht bewegt, zwölf Stellen unverändert."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "Sulfur dioxide is an acid gas, so dissolving it should acidify the beaker further."
reveals_de = "Schwefeldioxid sei ein saures Gas, sein Lösen müsse das Becherglas also weiter ansäuern."
next = "Chemically reasonable and also not modelled: the SO₂ is deposited straight into the gas phase and never enters the aqueous solver, so it cannot form sulfurous acid here. Two separate absences produce the same flat line, and it is worth being able to name both."
next_de = "Chemisch vernünftig und ebenfalls nicht modelliert: Das SO₂ wird direkt in die Gasphase abgelagert und gelangt nie in den wässrigen Solver, kann hier also keine schweflige Säure bilden. Zwei getrennte Lücken erzeugen dieselbe flache Linie, und es lohnt sich, beide benennen zu können."

[reaction.registers]
lv1 = "Left for ten minutes, the beaker turns thick and yellow: almost all the thiosulfate has become sulfur. The acid meter reads exactly what it read at the start. In a real beaker it would not — the acid is meant to be used up too, and here it never is. This is a corner the model was not built for, and it is better to know where those corners are than to find one by accident."
lv1_de = "Zehn Minuten sich selbst überlassen, wird das Becherglas dickflüssig und gelb: Fast das gesamte Thiosulfat ist zu Schwefel geworden. Das Säuremessgerät zeigt genau denselben Wert wie am Anfang. In einem echten Becherglas wäre das nicht so — die Säure sollte eigentlich auch verbraucht werden, und hier geschieht das nie. Das ist eine Ecke, für die das Modell nicht gebaut wurde, und es ist besser, diese Ecken zu kennen, als zufällig darüber zu stolpern."
lv2 = "In 600 s the bench reports 4.6727 × 10⁻³ mol of reaction, 93.5% of the 4.9965 × 10⁻³ mol of thiosulfate present, and pH 1.74858175066 before and after — the same twelve digits. By the stated equation that much reaction would need 9.345 × 10⁻³ mol of protons, and the beaker was charged with 2.0 × 10⁻³ mol. A real beaker would have run out of acid after about 1 mmol of thiosulfate and stalled."
lv2_de = "Nach 600 s meldet das Labor 4,6727 × 10⁻³ mol Umsatz, 93,5 % der vorhandenen 4,9965 × 10⁻³ mol Thiosulfat, und pH 1,74858175066 davor wie danach — dieselben zwölf Stellen. Nach der angegebenen Gleichung würde ein solcher Umsatz 9,345 × 10⁻³ mol Protonen benötigen, und das Becherglas wurde mit 2,0 × 10⁻³ mol befüllt. Ein echtes Becherglas wäre nach etwa 1 mmol umgesetztem Thiosulfat die Säure ausgegangen, und die Reaktion wäre ins Stocken geraten."
lv3 = "The approximation is deliberate and documented: `orders` carries `(PROTON, 1.0)` while `reactants` does not, so the proton enters the rate through `10^(−pH)` and is never withdrawn. The reason it cannot simply be fixed by adding H⁺ to `reactants` is structural — the proton is not a vessel portion at all; it lives in PHREEQC's charge balance, and there is nothing there for the integrator to decrement. Doing this properly means the rate engine handing a consumed proton amount back to the aqueous solver as an alkalinity change between substeps, which is a coupling neither solver currently has. Until then the honest guidance is that thiosulfate results are trustworthy while the acid is in genuine excess — for these amounts, up to roughly the first fifth of the thiosulfate, which comfortably covers the disappearing-cross timings and does not cover this ten-minute run."
lv3_de = "Die Näherung ist bewusst gewählt und dokumentiert: `orders` enthält `(PROTON, 1.0)`, während `reactants` das nicht tut, sodass das Proton über `10^(−pH)` in die Geschwindigkeit eingeht und niemals entnommen wird. Der Grund, warum sich das nicht einfach durch Hinzufügen von H⁺ zu `reactants` beheben lässt, ist struktureller Natur — das Proton ist überhaupt keine Gefäßmenge; es lebt in PHREEQCs Ladungsbilanz, wo es für den Integrator nichts zu verringern gibt. Das richtig zu lösen würde bedeuten, dass der Kinetikmotor eine verbrauchte Protonenmenge zwischen den Teilschritten als Änderung der Alkalinität an den wässrigen Solver zurückgibt — eine Kopplung, die derzeit keiner der beiden Solver besitzt. Bis dahin gilt als ehrliche Richtschnur: Thiosulfat-Ergebnisse sind vertrauenswürdig, solange die Säure in echtem Überschuss vorliegt — für diese Mengen also bis zu ungefähr dem ersten Fünftel des Thiosulfats, was die Zeiten des verschwindenden Kreuzes bequem abdeckt, aber diesen Zehn-Minuten-Lauf nicht."

[reaction.provenance]
source = "Editorial judgement (Kerotakis): the excess-acid approximation and its boundary are ours, stated in `kinetics.rs` and stretched deliberately here so that the boundary can be seen. The stoichiometry S₂O₃²⁻ + 2 H⁺ → S + SO₂ + H₂O is standard."
computed_by = "kerotakis-core kinetics; pH from PHREEQC via Kerotakis L2"

