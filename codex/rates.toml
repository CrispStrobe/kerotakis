# The Kerotakis codex — rates.
#
# Every solver below the rate engine answers *where does this settle?*.
# These entries are about the question a school lab actually spends its
# afternoon on: how fast, and what changes it. The engine is P3k
# (`kerotakis-core/src/kinetics.rs`): curated rate laws, orders taken from
# the literature rather than read off the stoichiometry, k from Arrhenius,
# catalysis as a lower activation energy, and a bench clock that `wait`
# advances for every vessel at once.
#
# Every number in this file was produced by running the engine and reading
# its output — the entry's own setup script wherever possible, and where a
# claim needs a different clock or a different amount (a ten-millisecond
# wait, a five-gram charge), the variant is named in the register that uses
# it. Where a number is arithmetic performed on the engine's output rather
# than printed by it, the entry says so. Where a judgement is ours, it says
# `Editorial judgement (Kerotakis)`.
#
# Three approximations run through the whole file and are stated rather than
# hidden, each with an entry of its own:
#   · the thiosulfate rate law reads acid from the computed pH and never
#     consumes it (`the-acid-is-never-used-up`);
#   · thiosulfate is in no PHREEQC database we ship, so it dissolves but
#     contributes nothing to pH or ionic strength (`a-salt-with-no-database`);
#   · the pre-exponential factors are calibrated against the observable, not
#     measured, so absolute times are ours and ratios are the chemistry
#     (`the-cross-disappears`).
#
# Licence: the codex is CC BY-SA 4.0, separately from the AGPL code.

# ==================================================== order and concentration

[[reaction]]
id = "doubling-the-thiosulfate-doubles-the-rate"
spine = ["die-reaktionsgeschwindigkeit"]
equation = "S₂O₃²⁻ + 2 H⁺ → S↓ + SO₂ + H₂O"
concepts = ["reaction-rate", "reaction-order"]
requires = ["concentration"]
calculations = ["rate-from-extent"]
models = ["collision-theory"]
apparatus = ["beaker", "measuring-cylinder", "stopwatch", "balance"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 11/12, Reaktionsgeschwindigkeit und Katalyse"
ages = { min = 16.0, max = 18.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Oberstufe (ISB)"

[reaction.setup]
script = """
add v1 water 100mL
add v1 Na2S2O3 0.79g
add v1 HCl 0.002mol
new
add v2 water 100mL
add v2 Na2S2O3 1.58g
add v2 HCl 0.002mol
wait 10s
"""

[reaction.expect]
events = ["reacted:thiosulfate-acid", "not_yet_modelled"]
absent = ["solver_failed"]
ph = { min = 1.70, max = 1.80 }

[reaction.expect.predict]
question = "Two beakers, the same acid, the same ten seconds. One holds 0.05 mol/L thiosulfate, the other 0.10 mol/L. The first deposits 0.000223 mol of sulfur. What does the second deposit?"
question_de = "Zwei Bechergläser, dieselbe Säure, dieselben zehn Sekunden. Das eine enthält 0,05 mol/L Thiosulfat, das andere 0,10 mol/L. Im ersten scheiden sich 0,000223 mol Schwefel ab. Was scheidet sich im zweiten ab?"
options = [
  "0.000223 mol — the same, because it is the same reaction",
  "0.000446 mol — twice as much",
  "0.000891 mol — four times as much, because rate goes with concentration squared",
  "Somewhere between, because the stronger one runs out sooner",
]
options_de = [
    "0,000223 mol — dasselbe, weil es dieselbe Reaktion ist",
    "0,000446 mol — doppelt so viel",
    "0,000891 mol — viermal so viel, weil die Geschwindigkeit mit dem Quadrat der Konzentration geht",
    "Irgendwo dazwischen, weil das stärkere früher ausgeht",
]
answer = 1
misconception = "The last option is the interesting wrong answer, and a lot of learners reach for it: they know depletion slows a reaction down and expect the stronger solution to be handicapped by it. It is not, and the reason is worth having — for a first-order reaction the *fraction* consumed in ten seconds is the same in both beakers, so the amounts stay in the ratio they started in at every instant. The squared option is order confused with coefficient: the equation has a 2 in front of H⁺ and none in front of thiosulfate, and neither number is the order."
misconception_de = "Die letzte Option ist die interessante falsche Antwort, nach der viele Lernende greifen: Sie wissen, dass eine abnehmende Konzentration eine Reaktion verlangsamt, und erwarten deshalb, dass die stärkere Lösung dadurch benachteiligt wird. Das ist nicht der Fall, und der Grund lohnt sich: Bei einer Reaktion erster Ordnung ist der in zehn Sekunden umgesetzte *Anteil* in beiden Bechergläsern gleich, sodass die Mengen zu jedem Zeitpunkt im ursprünglichen Verhältnis zueinander bleiben. Die quadrierte Option verwechselt Reaktionsordnung mit Koeffizient: In der Gleichung steht eine 2 vor H⁺ und keine vor Thiosulfat, und keine der beiden Zahlen ist die Ordnung."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "A reaction has one speed, the way a substance has one melting point — concentration changes how much there is, not how fast it goes."
reveals_de = "Eine Reaktion hat eine feste Geschwindigkeit, so wie ein Stoff einen festen Schmelzpunkt hat — die Konzentration ändert, wie viel vorhanden ist, nicht, wie schnell es abläuft."
next = "Run the same pair with a `wait 5s` and then another `wait 5s`. If speed were a property of the reaction the two beakers would track each other; they separate on the first interval and stay separated."
next_de = "Dasselbe Paar wird mit `wait 5s` und danach noch einmal `wait 5s` laufen gelassen. Wäre die Geschwindigkeit eine Eigenschaft der Reaktion, würden die beiden Bechergläser gleichauf bleiben; sie laufen aber schon im ersten Intervall auseinander und bleiben es."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "The order is read off the equation: there is a 2 in front of H⁺, so something must be squared."
reveals_de = "Die Ordnung wird an der Gleichung abgelesen: Vor H⁺ steht eine 2, also muss irgendetwas quadriert werden."
next = "Open the same experiment on the acid instead (`the-acid-term-is-an-activity`): the species with the coefficient 2 is the one that turns out to be first order, which is hard to explain if orders came from coefficients."
next_de = "Dasselbe Experiment wird stattdessen für die Säure geöffnet (`the-acid-term-is-an-activity`): Ausgerechnet die Spezies mit dem Koeffizienten 2 erweist sich als erster Ordnung — schwer zu erklären, wenn Ordnungen aus Koeffizienten stammen würden."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "Depletion is imagined as a penalty the faster beaker pays, so the strong solution should fall behind its own head start."
reveals_de = "Der Konzentrationsrückgang wird sich als Strafe vorgestellt, die das schnellere Becherglas zahlt, sodass die starke Lösung hinter ihren eigenen Vorsprung zurückfallen müsste."
next = "Compare the sulfur in the two beakers at 24 s, 49 s and 113 s in `the-cross-disappears`: the ratio is exactly 2 at every reading, because both beakers lose the same fraction, not the same amount."
next_de = "Der Schwefel in den beiden Bechergläsern wird bei 24 s, 49 s und 113 s in `the-cross-disappears` verglichen: Das Verhältnis ist bei jeder Messung exakt 2, weil beide Bechergläser denselben Anteil verlieren, nicht dieselbe Menge."

[reaction.registers]
lv1 = "Two beakers of the same clear liquid, one twice as strong as the other, and one clock for both. After ten seconds the strong one has made exactly twice as much yellow cloudiness as the weak one. Not a bit more — twice. Crowd the pieces together twice as tightly and they meet twice as often."
lv1_de = "Zwei Bechergläser mit derselben klaren Flüssigkeit, das eine doppelt so stark wie das andere, und eine Uhr für beide. Nach zehn Sekunden hat das starke genau doppelt so viel gelbe Trübung erzeugt wie das schwache. Nicht ein bisschen mehr — doppelt so viel. Drängt man die Teilchen doppelt so eng zusammen, treffen sie doppelt so oft aufeinander."
lv2 = "Rate = k·[S₂O₃²⁻]·[H⁺]. Both beakers hold the same acid (pH 1.7486), so the only difference is the thiosulfate: 0.05 mol/L against 0.10 mol/L. In ten seconds the bench reports 2.2275 × 10⁻⁴ mol of reaction in the first and 4.4551 × 10⁻⁴ mol in the second — a ratio of 2.000. First order in thiosulfate, measured rather than assumed."
lv2_de = "Geschwindigkeit = k·[S₂O₃²⁻]·[H⁺]. Beide Bechergläser enthalten dieselbe Säure (pH 1,7486), der einzige Unterschied ist also das Thiosulfat: 0,05 mol/L gegen 0,10 mol/L. In zehn Sekunden meldet das Labor 2,2275 × 10⁻⁴ mol Umsatz im ersten und 4,4551 × 10⁻⁴ mol im zweiten — ein Verhältnis von 2,000. Erste Ordnung bezüglich Thiosulfat, gemessen statt angenommen."
lv3 = "The exactness is worth pausing on, because it is a stronger statement than the practical usually makes. Initial rates are proportional to concentration for any first-order reaction by definition; here the *integrated* amounts are also in the ratio 2.000 after ten seconds, and that holds because the integrated first-order solution is c₀(1 − e^(−k′t)) with k′ = k[H⁺] identical in both vessels. So the c₀ factors straight out and the proportionality survives depletion. The order is curated data, not inferred: `kinetics.rs` keeps `orders` separate from `reactants` precisely so that the coefficient 2 on H⁺ cannot leak into the rate law, and neither order here matches a coefficient."
lv3_de = "Die Exaktheit lohnt einen Moment Aufmerksamkeit, denn sie ist eine stärkere Aussage, als das Experiment normalerweise liefert. Anfangsgeschwindigkeiten sind bei jeder Reaktion erster Ordnung per Definition proportional zur Konzentration; hier stehen aber auch die *integrierten* Mengen nach zehn Sekunden im Verhältnis 2,000, und das gilt, weil die integrierte Lösung erster Ordnung c₀(1 − e^(−k′t)) lautet, mit k′ = k[H⁺] identisch in beiden Gefäßen. Der Faktor c₀ kürzt sich damit heraus, und die Proportionalität übersteht den Konzentrationsrückgang. Die Ordnung ist kuratierte Angabe, nicht Schlussfolgerung: `kinetics.rs` hält `orders` bewusst getrennt von `reactants`, damit der Koeffizient 2 vor H⁺ nicht ins Geschwindigkeitsgesetz durchsickern kann, und keine der beiden Ordnungen hier entspricht einem Koeffizienten."

[reaction.provenance]
source = "Orders (1,1) for the thiosulfate–acid clock reaction are the standard result of the disappearing-cross practical (school practical literature). Editorial judgement (Kerotakis): the choice to demonstrate the order by comparing integrated extents over a shared ten seconds, rather than by tangent-fitting an initial rate, is ours — it is what the bench can show honestly."
computed_by = "kerotakis-core kinetics (midpoint integration of the curated rate law); pH from PHREEQC via Kerotakis L2"

[[reaction]]
id = "the-acid-term-is-an-activity"
spine = ["die-reaktionsgeschwindigkeit"]
summary = "Double the hydrochloric acid and the rate rises by 1.94, not 2.00 — the rate law reads the activity the solver computed, not the amount you weighed"
summary_de = "Verdoppelt man die Salzsäure, steigt die Geschwindigkeit um das 1,94-Fache statt um das 2,00-Fache — das Geschwindigkeitsgesetz liest die vom Solver berechnete Aktivität, nicht die eingewogene Menge"
concepts = ["activity-in-a-rate-law"]
requires = ["reaction-order", "activity", "ph"]
calculations = ["rate-from-extent", "ph-from-concentration"]
models = ["collision-theory"]
apparatus = ["beaker", "pipette", "ph-meter", "stopwatch"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 11/12, Reaktionsgeschwindigkeit und Katalyse"
ages = { min = 16.0, max = 18.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Oberstufe (ISB)"

[[reaction.curriculum]]
system = "nrw-kernlehrplan-g9"
stage = "Sek II Q-Phase, IF3 Gleichgewichtsreaktionen — Reaktionskinetik"
ages = { min = 17.0, max = 19.0 }
source = "Kernlehrplan Chemie Gymnasium G9 NRW, Heft 3415 (RdErl. 23.06.2019)"

[reaction.setup]
script = """
add v1 water 100mL
add v1 Na2S2O3 0.79g
add v1 HCl 0.002mol
new
add v2 water 100mL
add v2 Na2S2O3 0.79g
add v2 HCl 0.004mol
new
add v3 water 100mL
add v3 Na2S2O3 0.79g
add v3 HCl 0.001mol
wait 1s
"""

[reaction.expect]
events = ["reacted:thiosulfate-acid"]
absent = ["solver_failed"]
ph = { min = 1.70, max = 1.80 }

[reaction.expect.predict]
question = "Three beakers, identical except for the acid: 0.001, 0.002 and 0.004 mol of HCl in 100 mL. The reaction is known to be first order in H⁺. Doubling the acid from 0.002 to 0.004 mol should multiply the rate by exactly two. The bench says 1.94. Who is wrong?"
question_de = "Drei Bechergläser, identisch bis auf die Säure: 0,001, 0,002 und 0,004 mol HCl in 100 mL. Die Reaktion ist bekanntlich erster Ordnung bezüglich H⁺. Verdoppelst du die Säure von 0,002 auf 0,004 mol, sollte sich die Geschwindigkeit genau verdoppeln. Das Labor zeigt 1,94. Wer irrt sich?"
options = [
  "The bench — a first-order term must double when you double the concentration",
  "Nobody. The rate law is first order in the *activity* of H⁺, and doubling the amount raises the activity by only 1.94",
  "The chemistry — the order in H⁺ must really be a bit less than one",
  "It is rounding error in the integrator",
]
options_de = [
    "Das Labor — ein Term erster Ordnung muss sich verdoppeln, wenn man die Konzentration verdoppelt",
    "Niemand. Das Geschwindigkeitsgesetz ist erster Ordnung bezüglich der *Aktivität* von H⁺, und eine Verdopplung der Menge erhöht die Aktivität nur um das 1,94-Fache",
    "Die Chemie — die Ordnung bezüglich H⁺ muss in Wirklichkeit etwas kleiner als eins sein",
    "Das ist ein Rundungsfehler im Integrator",
]
answer = 1
misconception = "The third option is the trap that catches good students: a measured exponent slightly below one looks like evidence for a fractional order, and fractional orders are real. Here it is not one. The order in the model is exactly 1.000, and the shortfall comes from somewhere else entirely — the ionic strength doubled with the acid, the activity coefficient fell from 0.889 to 0.863, and the rate law reads activity. Mistaking a solution non-ideality for a mechanistic order is a live error in real kinetics work, not a schoolroom one."
misconception_de = "Die dritte Option ist die Falle, in die gute Lernende tappen: Ein gemessener Exponent knapp unter eins wirkt wie ein Beleg für eine gebrochene Ordnung, und gebrochene Ordnungen gibt es tatsächlich. Hier ist es aber keine. Die Ordnung im Modell ist exakt 1,000, und die Abweichung kommt von ganz woanders her — die Ionenstärke hat sich mit der Säure verdoppelt, der Aktivitätskoeffizient ist von 0,889 auf 0,863 gefallen, und das Geschwindigkeitsgesetz liest die Aktivität. Eine Nichtidealität der Lösung mit einer mechanistischen Ordnung zu verwechseln ist ein realer Fehler in der praktischen Kinetik, kein Schulbuchfehler."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "First order means the printed concentration doubles the rate — the number on the bottle is the number in the equation."
reveals_de = "Erste Ordnung bedeutet, dass die aufgedruckte Konzentration die Geschwindigkeit verdoppelt — die Zahl auf der Flasche ist die Zahl in der Gleichung."
next = "Read the three ionic strengths (0.01003, 0.02006, 0.04012 mol/kgw) beside the three pH values. The pH steps are 0.2895 and 0.2878, not the 0.3010 that a factor of two in concentration would give."
next_de = "Die drei Ionenstärken (0,01003, 0,02006, 0,04012 mol/kgw) werden neben den drei pH-Werten abgelesen. Die pH-Schritte betragen 0,2895 und 0,2878, nicht die 0,3010, die ein Konzentrationsfaktor von zwei ergeben würde."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "A measured exponent below one is evidence about the mechanism, so the order must really be about 0.95."
reveals_de = "Ein gemessener Exponent unter eins gilt als Beleg über den Mechanismus, also müsse die wahre Ordnung etwa 0,95 betragen."
next = "Repeat with the thiosulfate instead of the acid, where no ionic-strength change is involved: that ratio comes out at 2.000. An order that appears only when the ionic strength moves is not an order."
next_de = "Dasselbe wird mit dem Thiosulfat statt der Säure wiederholt, wo keine Änderung der Ionenstärke im Spiel ist: Dort ergibt sich ein Verhältnis von exakt 2,000. Eine Ordnung, die nur auftritt, wenn sich die Ionenstärke ändert, ist keine Ordnung."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "A discrepancy in the third significant figure must be numerical noise rather than chemistry."
reveals_de = "Eine Abweichung in der dritten signifikanten Stelle müsse numerisches Rauschen sein und keine Chemie."
next = "Check the size: the integrator agrees with the closed-form first-order solution to better than 0.1%, and this discrepancy is 3%. Errors have magnitudes, and comparing them is the habit worth building."
next_de = "Die Größenordnung wird geprüft: Der Integrator stimmt mit der geschlossenen Lösung erster Ordnung auf besser als 0,1 % überein, diese Abweichung beträgt aber 3 %. Fehler haben Größenordnungen, und sie zu vergleichen ist die Gewohnheit, die es sich anzueignen lohnt."

[reaction.registers]
lv1 = "Put in twice as much acid and the reaction does not quite get twice as fast — it gets 1.94 times as fast. The missing bit is not a mistake. Ions in a crowded solution get in each other's way, so twice as many of them do not push twice as hard."
lv1_de = "Gibt man doppelt so viel Säure hinein, wird die Reaktion nicht ganz doppelt so schnell — sie wird 1,94-mal so schnell. Das fehlende Stückchen ist kein Fehler. In einer dicht gedrängten Lösung kommen sich die Ionen gegenseitig in die Quere, sodass doppelt so viele nicht doppelt so stark drücken."
lv2 = "The bench computes pH 2.0381, 1.7486 and 1.4608 for 0.001, 0.002 and 0.004 mol of HCl in 100 mL, and the rate law uses 10^(−pH). In one second the three vessels react by 1.1686 × 10⁻⁵, 2.2735 × 10⁻⁵ and 4.4010 × 10⁻⁵ mol. Halving the acid gives ×0.514 and doubling it gives ×1.936 — first order, but in the activity rather than in the amount weighed out."
lv2_de = "Das Labor berechnet pH 2,0381, 1,7486 und 1,4608 für 0,001, 0,002 und 0,004 mol HCl in 100 mL, und das Geschwindigkeitsgesetz verwendet 10^(−pH). In einer Sekunde setzen die drei Gefäße 1,1686 × 10⁻⁵, 2,2735 × 10⁻⁵ und 4,4010 × 10⁻⁵ mol um. Halbieren der Säure ergibt ×0,514, Verdoppeln ergibt ×1,936 — erste Ordnung, aber bezüglich der Aktivität, nicht der eingewogenen Menge."
lv3 = "PHREEQC's pH is −log₁₀(a_H⁺), so `term_concentration` returning 10^(−pH) hands the rate law an activity, deliberately: adding HCl to water leaves chloride in the vessel inventory and puts the proton into the charge balance, where it has no inventory amount to read. The ionic strengths are 0.01003, 0.02006 and 0.04012 mol/kgw, giving activity coefficients 0.913, 0.889 and 0.863 under the WATEQ Debye–Hückel extension; 0.034609/0.017838 = 1.940 is the activity ratio, and the measured 1.936 falls just short of it because the faster vessel has already consumed slightly more thiosulfate within the second. This is the same γ that shows up in `ph-is-not-quite-minus-log-c`, met again where it changes a rate instead of a reading."
lv3_de = "PHREEQCs pH ist −log₁₀(a_H⁺), sodass `term_concentration` mit der Rückgabe 10^(−pH) dem Geschwindigkeitsgesetz bewusst eine Aktivität übergibt: Gibt man HCl zu Wasser, bleibt Chlorid im Gefäßinventar, während das Proton in die Ladungsbilanz eingeht, wo es keinen Inventarwert zum Ablesen gibt. Die Ionenstärken betragen 0,01003, 0,02006 und 0,04012 mol/kgw, was unter der WATEQ-Debye-Hückel-Erweiterung Aktivitätskoeffizienten von 0,913, 0,889 und 0,863 ergibt; 0,034609/0,017838 = 1,940 ist das Aktivitätsverhältnis, und die gemessenen 1,936 bleiben knapp darunter, weil das schnellere Gefäß innerhalb der Sekunde bereits etwas mehr Thiosulfat verbraucht hat. Das ist dasselbe γ, das in `ph-is-not-quite-minus-log-c` auftaucht — hier verändert es eine Geschwindigkeit statt einer Messanzeige."

[reaction.provenance]
source = "Standard curriculum kinetics for the order in H⁺; activity coefficients from PHREEQC wateq4f.dat (USGS) under the WATEQ Debye–Hückel extension. Editorial judgement (Kerotakis): reading the acid term as an activity rather than a nominal concentration is an engine design decision, documented in `kinetics.rs`, and this entry exists to make that decision visible rather than to hide it behind a round number."
computed_by = "kerotakis-core kinetics; pH and ionic strength from PHREEQC via Kerotakis L2"

[[reaction]]
id = "the-cross-disappears"
spine = ["die-reaktionsgeschwindigkeit"]
equation = "S₂O₃²⁻ + 2 H⁺ → S↓ + SO₂ + H₂O"
concepts = ["rate-from-a-fixed-observable"]
requires = ["reaction-rate", "reaction-order"]
calculations = ["rate-from-extent", "initial-rate"]
models = ["collision-theory"]
apparatus = ["beaker", "stopwatch", "paper-cross", "measuring-cylinder"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 11/12, Reaktionsgeschwindigkeit und Katalyse"
ages = { min = 16.0, max = 18.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Oberstufe (ISB)"

[reaction.setup]
script = """
add v1 water 100mL
add v1 Na2S2O3 0.79g
add v1 HCl 0.002mol
new
add v2 water 100mL
add v2 Na2S2O3 1.58g
add v2 HCl 0.002mol
new
add v3 water 100mL
add v3 Na2S2O3 0.395g
add v3 HCl 0.002mol
wait 24s
look v1
look v2
look v3
wait 25s
look v1
look v2
look v3
wait 64s
look v1
look v2
look v3
"""

[reaction.expect]
events = ["reacted:thiosulfate-acid", "observed"]
absent = ["solver_failed"]
ph = { min = 1.70, max = 1.80 }

[reaction.expect.predict]
question = "Three beakers at 0.025, 0.05 and 0.10 mol/L thiosulfate. You time how long each takes to hide a pencil cross under the beaker. The 0.10 mol/L beaker takes 24 s. The reaction is first order. How long does the 0.025 mol/L beaker take?"
question_de = "Drei Bechergläser mit 0,025, 0,05 und 0,10 mol/L Thiosulfat. Du stoppst, wie lange jedes braucht, um ein Bleistiftkreuz unter dem Becherglas zu verdecken. Das 0,10-mol/L-Becherglas braucht 24 s. Die Reaktion ist erster Ordnung. Wie lange braucht das 0,025-mol/L-Becherglas?"
options = [
  "48 s — twice as long, twice as long again would be silly",
  "96 s — four times the time for a quarter of the concentration",
  "113 s — longer than four times, because a fixed amount of sulfur is a much bigger bite out of a weak solution",
  "It never gets there — there is not enough thiosulfate",
]
options_de = [
    "48 s — doppelt so lange, noch einmal doppelt so lange wäre albern",
    "96 s — die vierfache Zeit für ein Viertel der Konzentration",
    "113 s — länger als das Vierfache, weil eine feste Schwefelmenge einer schwachen Lösung einen viel größeren Brocken abverlangt",
    "Es kommt nie so weit — es ist nicht genug Thiosulfat vorhanden",
]
answer = 2
misconception = "Both of the first two options assume the time to a fixed observable is exactly inversely proportional to concentration. It nearly is, and the practical is built on that assumption — but only while the sulfur you are waiting for is a small fraction of what you started with. Hiding the cross costs 0.01 mol/L of sulfur: a tenth of the strong beaker and two fifths of the weak one, which is why the weak one falls further behind than the simple ratio predicts. The last option is worth taking seriously and rejecting on the arithmetic: 0.025 mol/L is enough, with room to spare."
misconception_de = "Die ersten beiden Optionen gehen beide davon aus, dass die Zeit bis zu einem festen Beobachtungspunkt exakt umgekehrt proportional zur Konzentration ist. Das stimmt fast, und das Experiment beruht auf dieser Annahme — aber nur solange der abgewartete Schwefel ein kleiner Anteil der Ausgangsmenge ist. Das Verdecken des Kreuzes kostet 0,01 mol/L Schwefel: ein Zehntel beim starken Becherglas und zwei Fünftel beim schwachen, weshalb das schwache stärker zurückfällt, als das einfache Verhältnis vorhersagt. Die letzte Option verdient es, ernst genommen und mit der Rechnung widerlegt zu werden: 0,025 mol/L reicht, mit Reserve."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Quarter the concentration, double the time — the relationship between concentration and time is being applied once instead of twice."
reveals_de = "Konzentration geviertelt, Zeit verdoppelt — der Zusammenhang zwischen Konzentration und Zeit wird einmal statt zweimal angewendet."
next = "Lay the three times out as a table with the three concentrations. 24, 49, 113 against 0.10, 0.05, 0.025: each halving of concentration costs rather more than a doubling of time, and the table makes that visible without any algebra."
next_de = "Die drei Zeiten werden als Tabelle neben die drei Konzentrationen gelegt. 24, 49, 113 gegen 0,10, 0,05, 0,025: Jede Halbierung der Konzentration kostet eher mehr als eine Verdopplung der Zeit, und die Tabelle macht das ohne jede Algebra sichtbar."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "Time is exactly inversely proportional to concentration, always — 1/t *is* the rate rather than standing in for it."
reveals_de = "Die Zeit sei immer exakt umgekehrt proportional zur Konzentration — 1/t *ist* die Geschwindigkeit, statt nur ein Ersatz dafür zu sein."
next = "Ask how much of each beaker's thiosulfate has been used at the moment the cross vanishes: 10%, 20%, 40%. The method assumes the answer is 'hardly any', and in the weakest beaker it is not."
next_de = "Es wird gefragt, wie viel Thiosulfat in jedem Becherglas verbraucht ist, wenn das Kreuz verschwindet: 10 %, 20 %, 40 %. Die Methode setzt voraus, dass die Antwort 'kaum etwas' lautet, und im schwächsten Becherglas stimmt das nicht mehr."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "Sulfur has to be at 0.01 mol/L, so a 0.025 mol/L solution is nearly out of material and may never make it."
reveals_de = "Der Schwefel müsse 0,01 mol/L erreichen, sodass einer 0,025-mol/L-Lösung fast das Material ausgeht und sie es vielleicht nie schafft."
next = "Do the stoichiometry before the kinetics: 1 mol of thiosulfate gives 1 mol of sulfur, so 0.025 mol/L can reach 0.01 mol/L with 60% to spare. Checking whether a reaction *can* finish before asking how fast is a habit worth having."
next_de = "Die Stöchiometrie wird vor der Kinetik geprüft: 1 mol Thiosulfat ergibt 1 mol Schwefel, sodass 0,025 mol/L die 0,01 mol/L mit 60 % Reserve erreichen kann. Zu prüfen, ob eine Reaktion überhaupt *fertig werden kann*, bevor man nach dem Wie-schnell fragt, ist eine Gewohnheit, die sich lohnt."

[reaction.registers]
lv1 = "Draw a cross on paper, stand the beaker on it, and start the clock when the acid goes in. The liquid slowly turns milky with sulfur until the cross vanishes. Strong solution: 24 seconds. Half as strong: 49. A quarter as strong: 113. Fainter mixture, longer wait — and the clock is the measuring instrument, which is the whole trick of the experiment."
lv1_de = "Man zeichnet ein Kreuz auf Papier, stellt das Becherglas darauf und startet die Uhr, sobald die Säure hineinkommt. Die Flüssigkeit wird langsam milchig vom Schwefel, bis das Kreuz verschwindet. Starke Lösung: 24 Sekunden. Halb so stark: 49. Ein Viertel so stark: 113. Blassere Mischung, längeres Warten — und die Uhr ist das Messinstrument, das ist der ganze Trick des Experiments."
lv2 = "Taking 0.01 mol/L of suspended sulfur as the point where the cross is hidden, the bench reaches it at 24 s (0.10 mol/L), 49 s (0.05 mol/L) and 113 s (0.025 mol/L). 1/t is the usual stand-in for the rate: 0.0417, 0.0204 and 0.0088 s⁻¹, close to halving each time but not exactly — the successive time ratios are 2.04 and 2.31, not 2.00 and 2.00. At the moment each beaker is read it has used 10%, 20% and 40% of its thiosulfate, and the most dilute one is no longer anywhere near its initial rate."
lv2_de = "Nimmt man 0,01 mol/L suspendierten Schwefel als den Punkt, an dem das Kreuz verdeckt ist, erreicht das Labor diesen bei 24 s (0,10 mol/L), 49 s (0,05 mol/L) und 113 s (0,025 mol/L). 1/t ist der übliche Ersatz für die Geschwindigkeit: 0,0417, 0,0204 und 0,0088 s⁻¹, jeweils nahe an einer Halbierung, aber nicht genau — die aufeinanderfolgenden Zeitverhältnisse sind 2,04 und 2,31, nicht 2,00 und 2,00. Zum Zeitpunkt der jeweiligen Ablesung hat jedes Becherglas 10 %, 20 % beziehungsweise 40 % seines Thiosulfats verbraucht, und das am stärksten verdünnte ist längst nicht mehr in der Nähe seiner Anfangsgeschwindigkeit."
lv3 = "The absolute times belong to us and the ratios belong to the chemistry — that distinction is the honest content of this entry. The pre-exponential A = 2.2 × 10⁸ in `kinetics.rs` is calibrated so that 0.05 mol/L at pH 1.7 and 25 °C hides the cross in about forty seconds, which is the range the practical is designed around; it is not a measured Arrhenius A, and the file says so. Everything derived from *comparing* vessels — the order, the temperature ratios, the catalyst factors — is independent of A and survives any recalibration. The exact integrated form is t = −ln(1 − 0.01/c₀)/(k[H⁺]), which with the engine's own k[H⁺] = 4.561 × 10⁻³ s⁻¹ puts the crossings at 23.1, 48.9 and 112.0 s and the ratios at 2.12 and 2.29; reading the beaker once a second rounds those to 24, 49 and 113 and distorts the first ratio to 2.04. Nearly a second of quantisation is worth noticing, because a real practical reads its stopwatch to about the same precision. The 0.01 mol/L threshold is also ours — it is the criterion the engine's own regression test uses — and it is not the same thing as the renderer's vocabulary: `appearance` calls a beaker 'cloudy' from a cloudiness of 0.15, which is 0.0075 mol/L of sulfur and arrives about thirteen seconds earlier in the 0.05 mol/L beaker. Each beaker is therefore already being described as 'cloudy' by the time it reaches the criterion, and the two thresholds should not be read as one."
lv3_de = "Die absoluten Zeiten stammen von uns, die Verhältnisse von der Chemie — diese Unterscheidung ist der ehrliche Kern dieses Eintrags. Der präexponentielle Faktor A = 2,2 × 10⁸ in `kinetics.rs` ist so kalibriert, dass 0,05 mol/L bei pH 1,7 und 25 °C das Kreuz in rund vierzig Sekunden verdeckt, was dem Bereich entspricht, für den das Experiment ausgelegt ist; es ist kein gemessenes Arrhenius-A, und die Datei sagt das auch so. Alles, was aus dem *Vergleich* von Gefäßen abgeleitet wird — die Ordnung, die Temperaturverhältnisse, die Katalysatorfaktoren —, ist unabhängig von A und übersteht jede Neukalibrierung. Die exakte integrierte Form lautet t = −ln(1 − 0,01/c₀)/(k[H⁺]), was mit dem motoreigenen k[H⁺] = 4,561 × 10⁻³ s⁻¹ die Kreuzungszeitpunkte bei 23,1, 48,9 und 112,0 s ansetzt und die Verhältnisse bei 2,12 und 2,29; liest man das Becherglas nur einmal pro Sekunde ab, rundet das auf 24, 49 und 113 und verzerrt das erste Verhältnis auf 2,04. Fast eine Sekunde Quantisierung ist bemerkenswert, denn ein echtes Experiment liest die Stoppuhr mit ungefähr derselben Genauigkeit ab. Auch die Schwelle von 0,01 mol/L stammt von uns — sie ist das Kriterium, das der motoreigene Regressionstest verwendet — und sie ist nicht dasselbe wie das Vokabular des Renderers: `appearance` nennt ein Becherglas ab einer Trübung von 0,15 'trüb', was 0,0075 mol/L Schwefel entspricht und im 0,05-mol/L-Becherglas rund dreizehn Sekunden früher eintritt. Jedes Becherglas wird also bereits als 'trüb' beschrieben, bevor es das Kriterium erreicht, und die beiden Schwellen sollten nicht als ein und dieselbe gelesen werden."

[reaction.provenance]
source = "The disappearing-cross practical is standard school chemistry; Ea ≈ 51 kJ/mol and orders (1,1) are its usual reported results (commonly 45–60 kJ/mol). Editorial judgement (Kerotakis): the pre-exponential is fixed by matching the observable rather than measured, and '0.01 mol/L of sulfur hides the cross' is our operational definition of the endpoint, chosen to match the engine's own regression test rather than taken from a source."
computed_by = "kerotakis-core kinetics; appearance from kerotakis-core::appearance (cloudiness = suspended solid per litre against an opacity scale)"

# ============================================================== temperature

[[reaction]]
id = "the-ten-degree-rule-and-where-it-frays"
spine = ["die-reaktionsgeschwindigkeit"]
summary = "25 → 35 → 45 → 55 °C multiplies the ten-second yield by 1.90, then 1.80, then 1.69 — the rule of thumb is a rule about one activation energy at one temperature"
summary_de = "25 → 35 → 45 → 55 °C vervielfacht die Zehn-Sekunden-Ausbeute um 1,90, dann 1,80, dann 1,69 — die Faustregel ist eine Regel über eine bestimmte Aktivierungsenergie bei einer bestimmten Temperatur"
concepts = ["temperature-and-rate", "arrhenius-equation"]
requires = ["reaction-rate"]
calculations = ["rate-from-extent", "arrhenius-ratio"]
models = ["collision-theory", "activation-energy"]
apparatus = ["beaker", "water-bath", "thermometer", "stopwatch"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 11/12, Reaktionsgeschwindigkeit und Katalyse"
ages = { min = 16.0, max = 18.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Oberstufe (ISB)"

[reaction.setup]
script = """
add v1 water 100mL @ 25C
add v1 Na2S2O3 0.79g @ 25C
add v1 HCl 0.002mol @ 25C
new
add v2 water 100mL @ 35C
add v2 Na2S2O3 0.79g @ 35C
add v2 HCl 0.002mol @ 35C
new
add v3 water 100mL @ 45C
add v3 Na2S2O3 0.79g @ 45C
add v3 HCl 0.002mol @ 45C
new
add v4 water 100mL @ 55C
add v4 Na2S2O3 0.79g @ 55C
add v4 HCl 0.002mol @ 55C
wait 10s
"""

[reaction.expect]
events = ["reacted:thiosulfate-acid", "temperature_changed"]
absent = ["solver_failed"]
ph = { min = 1.70, max = 1.80 }
temperature_c = { min = 24.5, max = 25.5 }

[reaction.expect.predict]
question = "Four beakers of the same mixture at 25, 35, 45 and 55 °C. 'The rate doubles every ten degrees.' If the 25 °C beaker deposits 0.000223 mol of sulfur in ten seconds, what does the 55 °C beaker deposit?"
question_de = "Vier Bechergläser mit derselben Mischung bei 25, 35, 45 und 55 °C. 'Die Geschwindigkeit verdoppelt sich alle zehn Grad.' Wenn das 25-°C-Becherglas in zehn Sekunden 0,000223 mol Schwefel abscheidet, wie viel scheidet das 55-°C-Becherglas ab?"
options = [
  "0.00178 mol — eight times, three doublings",
  "0.00128 mol — a bit less than eight times, because each ten-degree step is worth slightly less than the last",
  "0.000669 mol — three times, one doubling per ten degrees added up",
  "0.00223 mol — ten times, because the temperature went up by thirty degrees",
]
options_de = [
    "0,00178 mol — achtmal so viel, drei Verdopplungen",
    "0,00128 mol — etwas weniger als das Achtfache, weil jeder Zehn-Grad-Schritt etwas weniger bringt als der vorherige",
    "0,000669 mol — dreimal so viel, eine Verdopplung pro zehn Grad addiert",
    "0,00223 mol — zehnmal so viel, weil die Temperatur um dreißig Grad gestiegen ist",
]
answer = 1
misconception = "The third option is the commonest arithmetic slip in this topic: doublings multiply, they do not add. The first is the right arithmetic applied to a rule that is only approximately true, and it is the more instructive error — it treats 'doubles every ten degrees' as a law. It is not a law; it is what an activation energy near 50 kJ/mol happens to give near room temperature, and the factor shrinks steadily as the beaker gets hotter because the Arrhenius exponent depends on 1/T, not on T."
misconception_de = "Die dritte Option ist der häufigste Rechenfehler bei diesem Thema: Verdopplungen multiplizieren sich, sie addieren sich nicht. Die erste Option wendet die richtige Rechnung auf eine nur näherungsweise gültige Regel an, und das ist der lehrreichere Fehler — sie behandelt 'verdoppelt sich alle zehn Grad' als Naturgesetz. Das ist es nicht; es ist das, was eine Aktivierungsenergie nahe 50 kJ/mol nahe Raumtemperatur zufällig ergibt, und der Faktor schrumpft mit steigender Temperatur stetig weiter, weil der Arrhenius-Exponent von 1/T abhängt, nicht von T."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "'Doubles every ten degrees' is a law of nature, so three steps give exactly eight times."
reveals_de = "'Verdoppelt sich alle zehn Grad' sei ein Naturgesetz, also ergäben drei Schritte genau das Achtfache."
next = "Compute the three step factors from the bench's own numbers — 1.90, 1.80, 1.69 — and ask what would have to be true of Arrhenius for them all to be 2. The answer is that Ea would have to grow with temperature."
next_de = "Die drei Schrittfaktoren werden aus den eigenen Zahlen des Labors berechnet — 1,90, 1,80, 1,69 — und es wird gefragt, was für Arrhenius gelten müsste, damit sie alle gleich 2 wären. Die Antwort: Ea müsste mit der Temperatur wachsen."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Three ten-degree steps means three doublings added together, so three times faster."
reveals_de = "Drei Zehn-Grad-Schritte bedeuten drei addierte Verdopplungen, also dreimal so schnell."
next = "Do it on paper with a simpler case first: two doublings of £10 is £40, not £30. Then ask which operation 'per ten degrees' describes."
next_de = "Zunächst wird ein einfacheres Beispiel auf Papier durchgerechnet: Zwei Verdopplungen von 10 € ergeben 40 €, nicht 30 €. Dann wird gefragt, welche Rechenoperation 'pro zehn Grad' eigentlich beschreibt."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "Rate scales with temperature itself, so thirty degrees on top of twenty-five is roughly ten times as much heat and ten times the rate."
reveals_de = "Die Geschwindigkeit skaliere mit der Temperatur selbst, sodass dreißig Grad zusätzlich zu fünfundzwanzig ungefähr zehnmal so viel Wärme und die zehnfache Geschwindigkeit bedeuten."
next = "Try the same reasoning in kelvin: 298 K to 328 K is a 10% rise, which would predict almost no change. A rule that gives two different answers in two temperature scales is not describing a proportionality."
next_de = "Dieselbe Überlegung wird in Kelvin durchgespielt: 298 K auf 328 K ist ein Anstieg von 10 %, was fast keine Veränderung vorhersagen würde. Eine Regel, die in zwei Temperaturskalen zwei verschiedene Antworten liefert, beschreibt keine Proportionalität."

[reaction.registers]
lv1 = "Same mixture, four temperatures, one clock. In ten seconds the cold beaker makes a faint haze and the hot one is properly cloudy — roughly twice as much sulfur for every ten degrees you go up. Roughly. Each ten degrees buys a little less than the last one did, so 'it doubles' is a handy rule rather than a promise."
lv1_de = "Dieselbe Mischung, vier Temperaturen, eine Uhr. In zehn Sekunden bildet das kalte Becherglas einen leichten Schleier, das heiße wird richtig trüb — ungefähr doppelt so viel Schwefel für je zehn Grad mehr. Ungefähr. Jede weitere Zehn-Grad-Stufe bringt etwas weniger als die vorige, deshalb ist 'es verdoppelt sich' eine praktische Faustregel und kein Versprechen."
lv2 = "In ten seconds the bench reports 2.2275 × 10⁻⁴, 4.2430 × 10⁻⁴, 7.6234 × 10⁻⁴ and 1.2847 × 10⁻³ mol of reaction at 25, 35, 45 and 55 °C. The step factors are 1.90, 1.80 and 1.69. Nobody applied a rule: k = A·e^(−Ea/RT) with Ea = 51 kJ/mol was evaluated at each temperature, and the near-doubling came out."
lv2_de = "In zehn Sekunden meldet das Labor 2,2275 × 10⁻⁴, 4,2430 × 10⁻⁴, 7,6234 × 10⁻⁴ und 1,2847 × 10⁻³ mol Umsatz bei 25, 35, 45 und 55 °C. Die Schrittfaktoren betragen 1,90, 1,80 und 1,69. Niemand hat dabei eine Regel angewendet: k = A·e^(−Ea/RT) mit Ea = 51 kJ/mol wurde bei jeder Temperatur ausgewertet, und die Beinahe-Verdopplung ergab sich von selbst."
lv3 = "Two separate reasons keep these below two, and they should not be confused. First, the Arrhenius ratio itself: k(308)/k(298) = e^(Ea/R · (1/298.15 − 1/308.15)) = 1.95 for Ea = 51 kJ/mol, and the same construction gives 1.87 and 1.80 for the higher steps, because the exponent goes as 1/T. Second, depletion: over ten seconds the hotter vessels have already eaten into their thiosulfate, which is why the measured 1.90/1.80/1.69 sit below those. Shortening the clock to one second, where almost nothing has been consumed, the bench gives 1.94/1.86/1.78 — within a percent of the pure rate-constant ratios. The 'rule' is therefore a statement about an activation energy near 50 kJ/mol at around 300 K, and the practical's real lesson is that it decays in a way you can predict."
lv3_de = "Zwei getrennte Gründe halten diese Werte unter zwei, und sie sollten nicht verwechselt werden. Erstens das Arrhenius-Verhältnis selbst: k(308)/k(298) = e^(Ea/R · (1/298,15 − 1/308,15)) = 1,95 für Ea = 51 kJ/mol, und dieselbe Rechnung ergibt 1,87 und 1,80 für die höheren Schritte, weil der Exponent wie 1/T verläuft. Zweitens der Konzentrationsrückgang: In zehn Sekunden haben die heißeren Gefäße bereits an ihrem Thiosulfat gezehrt, weshalb die gemessenen 1,90/1,80/1,69 darunter liegen. Verkürzt man die Uhr auf eine Sekunde, in der fast nichts verbraucht wurde, liefert das Labor 1,94/1,86/1,78 — innerhalb eines Prozents der reinen Geschwindigkeitskonstanten-Verhältnisse. Die 'Regel' ist somit eine Aussage über eine Aktivierungsenergie nahe 50 kJ/mol bei rund 300 K, und die eigentliche Lehre des Experiments ist, dass sie auf vorhersagbare Weise nachlässt."

[reaction.provenance]
source = "Arrhenius, Zeitschrift für physikalische Chemie, 1889, for the temperature dependence; Ea ≈ 51 kJ/mol for the thiosulfate–acid clock reaction per school practical literature (commonly reported 45–60 kJ/mol). Editorial judgement (Kerotakis): the four-temperature ladder and the decision to report the fraying of the rule rather than the rule alone are ours."
computed_by = "kerotakis-core kinetics (Arrhenius k evaluated per vessel, midpoint integration); pH from PHREEQC via Kerotakis L2"

