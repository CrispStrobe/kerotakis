[reaction.expect.predict]
question = "Sodium thiosulfate is a salt of a weak acid, so a solution of it should be slightly alkaline. What does this bench report for 0.79 g of it in 100 mL of pure water?"
options = [
  "About pH 8.5, as the chemistry requires",
  "pH 7.00 — it treats the salt as neutral",
  "Nothing at all: no solver can speciate thiosulfate, so no solution is characterised and the pH meter reads nothing",
  "It refuses to add the salt",
]
answer = 2
misconception = "The second option is what most software would do and is the failure this bench is built to avoid: a plausible number with nothing behind it. Thiosulfate is absent from every PHREEQC database we ship, so there is no equilibrium constant to compute a pH from. The bench therefore says so, and the salt sits in the vessel without a solution around it. The first option is the right chemistry — S₂O₃²⁻ is the conjugate base of a weak acid and a real solution is mildly alkaline — which makes the gap a real one rather than a technicality."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "The software knows the chemistry, so it will give the chemically correct answer."
next = "Ask where such an answer would come from. A pH needs an equilibrium constant, and no shipped database carries one for thiosulfate. Software knows what its data knows."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "Where a program has nothing to say it defaults to the neutral, unremarkable value."
next = "This is the answer to watch for in any tool: a plausible number with nothing behind it, indistinguishable from a computed one. Compare with the same bench's `when-the-lab-says-it-does-not-know` — the design commitment is to say nothing rather than to say 7."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "A model that cannot handle something should refuse to proceed."
next = "Notice what would be lost: the salt would be unusable, and its rate chemistry — which the engine models perfectly well — would go with it. The useful move is to accept the substance and name precisely which downstream numbers it invalidates."

[reaction.registers]
lv1 = "Some things this lab knows how to think about, and some it does not. It can hold this salt, dissolve it and let it react — but if you ask what it does to the acidity, it tells you plainly that it has no way to work that out. That is a better answer than a confident number nobody checked."
lv2 = "The acid beaker reads pH 1.74858175066. The beaker with thiosulfate *and* the same acid reads pH 1.74858175066 — identical to twelve figures, because the thiosulfate contributes nothing to the charge balance or the ionic strength (0.02006 mol/kgw in both). The third beaker, thiosulfate in pure water, has no characterised solution at all: the salt stays in the vessel as a solid and the pH meter reports that it has nothing to read."
lv3 = "The species registry marks sodium thiosulfate `dissolves_without_speciation`, and the bench raises `NotYetModeled` every time it is added, naming exactly what is affected: the pH and the ionic strength are for everything else in the beaker. This is not cosmetic — it was earned by two bugs that only a rate model could have exposed. Before the fix, one species without a derived role made `partition` return `None`, so adding thiosulfate silently withdrew the pH of the acid sitting beside it; and because the aqueous rebuild replaces a vessel's contents with the computed state, the unrecognised species was then destroyed rather than ignored. What remains is a vessel where two solvers coexist over the same liquid with different vocabularies, and the rate engine draws its acid term from the one that does know about protons. Worth naming the real chemistry that is missing: S₂O₃²⁻ has pKa₂ ≈ 1.6, so at pH 1.75 a real solution is roughly half protonated, and the reacting species is arguably HS₂O₃⁻ rather than the free anion."

[reaction.provenance]
source = "Editorial judgement (Kerotakis): the decision to let an unspeciated salt dissolve while reporting what that costs, rather than refusing it or inventing a pH, is ours and is recorded in PLAN.md (P3k, 'Honest gaps'). The absence of thiosulfate from wateq4f.dat, minteq.v4.dat and pitzer.dat is a property of the shipped PHREEQC databases (USGS). The pKa₂ ≈ 1.6 quoted at lv3 is a standard reference value and is not computed by this engine."
computed_by = "PHREEQC via Kerotakis L2 for the two pH readings; the gap notice comes from the bench's honesty pass"

[[reaction]]
id = "the-acid-is-never-used-up"
spine = ["natur-der-naturwissenschaft-nature-of-science"]
summary = "Ten minutes consumes 4.6727 × 10⁻³ mol of thiosulfate — which would need 9.35 mmol of protons — while the beaker holds 2 mmol and the pH never moves off 1.74858175066"
concepts = ["excess-reagent-approximation"]
requires = ["reaction-order", "excess-reagent"]
calculations = ["stoichiometric-ratio", "rate-from-extent"]
models = ["model-boundaries", "collision-theory"]
apparatus = ["beaker", "ph-meter", "stopwatch"]

[reaction.setup]
script = """
add v1 water 100mL
add v1 Na2S2O3 0.79g
add v1 HCl 0.002mol
measure v1 ph
wait 10min
measure v1 ph
look v1
"""

[reaction.expect]
events = ["reacted:thiosulfate-acid", "measured", "observed"]
absent = ["solver_failed"]
ph = { min = 1.70, max = 1.80 }

[reaction.expect.predict]
question = "The equation is S₂O₃²⁻ + 2 H⁺ → S + SO₂ + H₂O. The beaker starts with 5.0 mmol of thiosulfate and 2.0 mmol of acid. After ten minutes, 4.67 mmol of thiosulfate has reacted. What has the pH done?"
options = [
  "Risen sharply — the protons were the limiting reagent and ran out after 1 mmol of thiosulfate",
  "Risen a little, as protons were consumed",
  "Not moved at all — this rate law reads the acid from the pH and never consumes it, which is a stated approximation and here it is being stretched past where it holds",
  "Fallen, because sulfur dioxide dissolves to make an acid",
]
answer = 2
misconception = "There is no misconception on offer here — all four options are chemically sensible, and the first is what a real beaker would do. The question exists to make a modelling decision visible. The rate law treats [H⁺] as an influence read from the solution rather than as a reactant with an inventory, because the practical is designed to run with acid in large excess and the vessel has no proton portion to draw down. Over the twenty to sixty seconds the practical actually uses, that is a good approximation. Over ten minutes with only 2 mmol of acid it is not, and the entry says so rather than letting the reader discover it as a surprise."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "The right chemistry for a real beaker, and the right stoichiometry — offered as a prediction about this model."
next = "Nothing to unlearn. Note instead which prediction the engine cannot honour and why: there is no proton portion in the vessel to draw down, so the limiting-reagent argument has nothing to act on here even though it is correct."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "Protons are consumed, but a solution buffers itself, so the pH drifts rather than jumps."
next = "Check whether anything in this beaker could buffer: hydrochloric acid is fully dissociated and thiosulfate is invisible to the aqueous solver. Then read the pH — not drifted, not moved at all, twelve digits unchanged."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "Sulfur dioxide is an acid gas, so dissolving it should acidify the beaker further."
next = "Chemically reasonable and also not modelled: the SO₂ is deposited straight into the gas phase and never enters the aqueous solver, so it cannot form sulfurous acid here. Two separate absences produce the same flat line, and it is worth being able to name both."

[reaction.registers]
lv1 = "Left for ten minutes, the beaker turns thick and yellow: almost all the thiosulfate has become sulfur. The acid meter reads exactly what it read at the start. In a real beaker it would not — the acid is meant to be used up too, and here it never is. This is a corner the model was not built for, and it is better to know where those corners are than to find one by accident."
lv2 = "In 600 s the bench reports 4.6727 × 10⁻³ mol of reaction, 93.5% of the 4.9965 × 10⁻³ mol of thiosulfate present, and pH 1.74858175066 before and after — the same twelve digits. By the stated equation that much reaction would need 9.345 × 10⁻³ mol of protons, and the beaker was charged with 2.0 × 10⁻³ mol. A real beaker would have run out of acid after about 1 mmol of thiosulfate and stalled."
lv3 = "The approximation is deliberate and documented: `orders` carries `(PROTON, 1.0)` while `reactants` does not, so the proton enters the rate through `10^(−pH)` and is never withdrawn. The reason it cannot simply be fixed by adding H⁺ to `reactants` is structural — the proton is not a vessel portion at all; it lives in PHREEQC's charge balance, and there is nothing there for the integrator to decrement. Doing this properly means the rate engine handing a consumed proton amount back to the aqueous solver as an alkalinity change between substeps, which is a coupling neither solver currently has. Until then the honest guidance is that thiosulfate results are trustworthy while the acid is in genuine excess — for these amounts, up to roughly the first fifth of the thiosulfate, which comfortably covers the disappearing-cross timings and does not cover this ten-minute run."

[reaction.provenance]
source = "Editorial judgement (Kerotakis): the excess-acid approximation and its boundary are ours, stated in `kinetics.rs` and stretched deliberately here so that the boundary can be seen. The stoichiometry S₂O₃²⁻ + 2 H⁺ → S + SO₂ + H₂O is standard."
computed_by = "kerotakis-core kinetics; pH from PHREEQC via Kerotakis L2"

[[reaction]]
id = "the-oxygen-is-counted-but-never-seen"
spine = ["natur-der-naturwissenschaft-nature-of-science"]
summary = "0.05 mol of oxygen — about 1.2 L — is in the flask; you can see it bubbling and you cannot measure it."
concepts = ["unrendered-observable"]
requires = ["catalysis", "model-boundary"]
calculations = ["moles-from-mass"]
models = ["model-boundaries"]
apparatus = ["conical-flask", "gas-syringe"]

[reaction.setup]
script = """
add v1 water 100mL
add v1 H2O2 0.1mol
add v1 catalase 0.001g
wait 1s
look v1
"""

[reaction.expect]
events = ["reacted:peroxide-decomposition", "observed"]
absent = ["gas_evolved:O2", "solver_failed"]

[reaction.expect.predict]
question = "Catalase destroys 0.1 mol of peroxide, releasing 0.05 mol of oxygen — roughly 1.2 litres, the demonstration's whole point. The bench reports bubbles rising. What can you do with that gas?"
options = [
  "Read its volume off the gas syringe, which is how the rate is measured",
  "See it, and nothing else — no volume is measurable here, and no gas-evolution event fires",
  "Nothing: bubbles are only a picture, so the oxygen is not really counted",
  "Collect and weigh it, since the balance tracks everything in the vessel",
]
answer = 1
misconception = "This one is not about chemistry, and pretending otherwise would be the dishonest move. The engine's bookkeeping is right — 0.05 mol of O₂ is exactly half the peroxide, and it is there in the vessel and now visible as bubbles. What is still missing is downstream: there is no gas syringe, no volume reading, and the rate engine deposits products into a phase without raising the `gas_evolved` event the aqueous and thermal solvers raise. So the practical's actual measurement — millilitres against seconds — cannot be taken. A simulation has a model layer and a presentation layer and they fail independently, which is worth knowing about any simulation you are handed."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Whatever a real practical measures, the simulation must measure too — if the chemistry is right, the instruments must be there."
next = "Separate the two. Read the vessel's inventory (0.05 mol of O₂, correct to the last digit), then ask what instrument would give you a number from it. Apparatus is a modelling decision, and this bench has not made it yet."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "A picture is decoration, so anything you can only see is not really in the model."
next = "The opposite of the first mistake, and just as wrong. Ask the vessel what it holds: the oxygen is there to the last digit, and the bubbles are drawn *from* that number rather than instead of it."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "Any change in the flask should show up as a change in what you see, and oxygen is faintly blue in bulk."
next = "True of liquid oxygen at −183 °C and irrelevant here. The bench computes colour from curated absorption spectra, and oxygen gas at 1 atm has none worth the name — so this is the rare case where 'no colour change' is the right answer for the right reason."

[reaction.registers]
lv1 = "The flask is full of oxygen — enough to fill a large drinks bottle — and you can see it bubbling up through the liquid. What you cannot do is measure it. In a real lab you would push the gas into a syringe and read off how many millilitres arrive each ten seconds, and that reading *is* the experiment. This lab has not been given a gas syringe yet. Knowing which part of an answer is the calculation and which part is the equipment is a useful habit to have about any simulation."
lv2 = "The vessel holds 5.0000 × 10⁻² mol of O₂ in the gas phase after one second, which is 1.6 g and, as an ideal gas at 25 °C and 1 atm, about 1.22 L. `look` now reports bubbles rising through the liquid. What it cannot report is a volume: there is no gas-collection apparatus, and no `gas_evolved` event either, because the rate engine deposits its products into a phase while only the aqueous and thermal solvers raise gas-evolution events. The quantity is exact and the measurement is missing."
lv3 = "`appearance::observe` builds three things — a transmitted colour from Beer–Lambert over curated ε(λ), a cloudiness from suspended solid per litre, and a deposit — and then sets `bubbling: false` as a literal, with the struct field documented as 'whether anything is visibly not-liquid-not-settled'. So the field exists, the data to fill it exists in the vessel's gas-phase portions, and the connection between them has not been made. This is a renderer gap rather than a modelling one, which puts it in a different category from the rest of this file: it is cheap to close, it costs no chemistry, and it currently makes the single most visual practical in school kinetics invisible. Stated here so that nobody builds a lesson around watching a flask fizz until it is."

[reaction.provenance]
source = "Editorial judgement (Kerotakis): this entry is a claim about the current renderer, not about chemistry. The molar volume used to convert 0.05 mol to 1.22 L is ideal-gas arithmetic at 298.15 K and 101325 Pa, performed here rather than by the engine."
computed_by = "kerotakis-core kinetics for the oxygen; kerotakis-core::appearance for the description"

# ================================================ thermodynamics and kinetics

[[reaction]]
id = "same-destination-different-journey"
spine = ["kinetik"]
equation = "2 H₂O₂ → 2 H₂O + O₂↑"
concepts = ["kinetic-versus-thermodynamic-outcome"]
requires = ["catalysis", "thermodynamic-versus-kinetic"]
calculations = ["rate-from-extent"]
models = ["activation-energy", "collision-theory"]
apparatus = ["conical-flask", "gas-syringe", "stopwatch"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 11/12, Reaktionsgeschwindigkeit und Katalyse"
ages = { min = 16.0, max = 18.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Oberstufe (ISB)"

[reaction.setup]
script = """
add v1 water 100mL
add v1 H2O2 0.1mol
new
add v2 water 100mL
add v2 H2O2 0.1mol
add v2 catalase 0.001g
wait 1s
look v1
look v2
wait 120h
look v1
look v2
"""

[reaction.expect]
events = ["reacted:peroxide-decomposition", "observed"]
absent = ["solver_failed"]

[reaction.expect.predict]
question = "Two flasks of peroxide, one with catalase. After one second the catalysed flask is finished and the other has lost 0.2%. Two hours later, what is in them?"
options = [
  "The catalysed flask holds more oxygen — the catalyst made more reaction happen",
  "The same thing: 0.05 mol of oxygen in each. The catalyst changed when, not whether or how much",
  "The plain flask still holds most of its peroxide — without a catalyst the reaction does not go",
  "The catalysed flask has started to reverse, since the catalyst works both ways",
]
answer = 1
misconception = "The first option is the most common thing learners believe about catalysts and it is a claim about *yield*, which is the one thing a catalyst cannot touch. A catalyst lowers the barrier equally in both directions, so it moves the system towards equilibrium faster and moves equilibrium not at all. The third option is the mirror error — treating a barrier as a prohibition. The barrier here is 75 kJ/mol, which is enough to make one second look like nothing happening and not nearly enough to survive five days."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "A catalyst increases the yield — more reaction happens because the catalyst helped it happen."
next = "Count the oxygen in both flasks at the end: 0.0500 mol in the catalysed one, 0.0485 mol in the plain one and still climbing toward the same figure. Then ask what a catalyst could possibly change about a mass balance."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Without a catalyst the reaction does not occur — the barrier is a prohibition rather than a delay."
next = "Look at the plain flask at 1 s and at five days: 0.1000 mol left, then 0.0030 mol. The same barrier that makes one second look like nothing lets five days very nearly finish the job. \u201cToo slow to see\u201d and \u201cdoes not happen\u201d are different states, and only one of them is settled by thermodynamics."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "A catalyst drives a reaction, so with nothing left to drive it should push the other way."
next = "A catalyst lowers the barrier equally in both directions, so it accelerates the approach to equilibrium and cannot shift it. This decomposition's equilibrium lies essentially all the way over — there is nothing to come back to."

[reaction.registers]
lv1 = "Two flasks, and only one has the enzyme. After a second the enzyme's flask is finished and the other looks untouched. Come back in five days and the slow one has very nearly caught up: both are turning into water and oxygen, and both end in the same place. The enzyme did not decide what would happen. It decided how long you would have to wait — one second against the better part of a week."
lv2 = "After 1 s: 0.1000 mol of peroxide still in the plain flask — the reaction has run 4 × 10⁻⁷ mol, which the bench will not even report — against effectively zero in the catalysed one, which already holds its full 0.0500 mol of oxygen. Five days later the plain flask has reached 0.0485 mol of oxygen with 0.0030 mol of peroxide still to go. Same destination; one of them took a second and the other is still arriving."
lv3 = "This is the distinction `thermodynamische-vs-kinetische-kontrolle` is built on, met from the kinetics side rather than the equilibrium side, and the engine embodies both halves in different places. On the thermodynamic side it withholds tenorite below 340 K and stands the thermal solver down below 500 K — curated stand-ins for rates it could not compute. Here the rate is computed, so the same idea appears as an interval rather than as a threshold: nothing is suppressed, and 'it has not happened yet' is a state the vessel can be in and then leave. The pre-exponential is calibrated so that undisturbed peroxide has a half-life near a day: long enough that nothing happens while you watch, which is the point, and still far shorter than real stabilised 3% peroxide in a brown bottle, which keeps for months. So the *shape* of the argument is right and the shelf-life is not a measurement."

[reaction.provenance]
source = "Standard curriculum treatment of catalysis and of kinetic versus thermodynamic control. Editorial judgement (Kerotakis): the five-day comparison is our design, and so is the pre-exponential behind it — chosen so undisturbed peroxide has a half-life near a day, which reads as clearly-nothing on a lesson timescale. Real stabilised 3% peroxide keeps for months, so the shape of the argument is right and the shelf-life is not a measurement."
computed_by = "kerotakis-core kinetics"
