source = "AQA GCSE Chemistry (8462) specification, examined from 2018"

[reaction.setup]
script = """
add v1 water 100mL @ 25C
add v1 Na2S2O3 0.79g @ 25C
add v1 HCl 0.002mol @ 25C
new
add v2 water 100mL @ 35C
add v2 Na2S2O3 0.79g @ 35C
add v2 HCl 0.002mol @ 35C
wait 20s
look v1
look v2
wait 20s
look v1
look v2
"""

[reaction.expect]
events = ["reacted:thiosulfate-acid", "observed", "temperature_changed"]
absent = ["solver_failed"]
ph = { min = 1.70, max = 1.80 }
temperature_c = { min = 24.5, max = 25.5 }

[reaction.expect.predict]
question = "You want to know whether temperature changes the rate. You have one stopwatch. What is the flaw in timing the cold beaker first and then the hot one?"
question_de = "Du willst wissen, ob die Temperatur die Geschwindigkeit verändert. Du hast eine Stoppuhr. Was ist der Fehler daran, erst das kalte und dann das heiße Becherglas zu stoppen?"
options = [
  "No flaw — the stopwatch does not care which beaker it is timing",
  "The hot beaker cools while it waits its turn, so the two are not really at the temperatures you wrote down",
  "You cannot see both crosses vanish at once",
  "There is no flaw, but it is slower to do it that way",
]
options_de = [
    "Kein Fehler — der Stoppuhr ist es egal, welches Becherglas sie stoppt",
    "Das heiße Becherglas kühlt ab, während es auf seine Reihe wartet, sodass die beiden nicht wirklich bei den notierten Temperaturen sind",
    "Man kann nicht beide Kreuze gleichzeitig verschwinden sehen",
    "Es gibt keinen Fehler, aber es dauert so länger",
]
answer = 1
misconception = "The first and last options treat 'fair test' as a rule about *which variables you change* and stop there. It is also a rule about when things happen. A virtual bench makes the point unusually sharply, because it had to be built in: `wait` advances every vessel on the bench, so the two beakers cannot drift apart in time, cannot be started at different moments and cannot sit around waiting their turn. A real bench gives you none of that for free, which is exactly why the habit has to be taught."
misconception_de = "Die erste und die letzte Option behandeln 'faires Experiment' als Regel darüber, *welche Variablen man ändert*, und hören dort auf. Es ist aber auch eine Regel darüber, wann Dinge geschehen. Ein virtuelles Labor macht diesen Punkt ungewöhnlich deutlich, weil er eigens eingebaut werden musste: `wait` lässt jedes Gefäß im Labor gleichzeitig fortschreiten, sodass die beiden Bechergläser zeitlich nicht auseinanderdriften können, nicht zu unterschiedlichen Zeitpunkten gestartet werden können und nicht auf ihre Reihe warten müssen. Ein echtes Labor schenkt einem davon nichts — genau deshalb muss diese Gewohnheit gelehrt werden."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "A fair test is a rule about which variables you change; once the variables are right, the procedure is free."
reveals_de = "Ein faires Experiment sei eine Regel darüber, welche Variablen man ändert; sobald die Variablen stimmen, sei der Ablauf frei wählbar."
next = "List everything that differs between 'timed first' and 'timed second' — the beaker's temperature, how long the acid has been in, the room. A controlled comparison controls the procedure as well as the ingredients."
next_de = "Es wird aufgelistet, was sich zwischen 'zuerst gestoppt' und 'als zweites gestoppt' alles unterscheidet — die Temperatur des Becherglases, wie lange die Säure schon zugegeben ist, der Raum. Ein kontrollierter Vergleich kontrolliert den Ablauf ebenso wie die Zutaten."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "The problem is the observer: one pair of eyes cannot watch two beakers."
reveals_de = "Das Problem sei der Beobachter: Ein Augenpaar könne nicht zwei Bechergläser gleichzeitig beobachten."
next = "A real constraint, and a soluble one — two crosses side by side, or a video. Ask instead what happens to the beaker that is not being watched, which is the part no amount of attention fixes."
next_de = "Eine reale und lösbare Einschränkung — zwei Kreuze nebeneinander oder ein Video. Stattdessen wird gefragt, was mit dem Becherglas passiert, das gerade nicht beobachtet wird — das ist der Teil, den keine noch so große Aufmerksamkeit beheben kann."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "Sequential timing is merely inefficient, not invalid."
reveals_de = "Nacheinander zu stoppen sei lediglich ineffizient, nicht ungültig."
next = "Estimate the size of the error. A beaker sitting for a minute between runs loses a degree or two, and this reaction changes rate by 1.9 per ten degrees — so a couple of degrees is several percent, comparable with the effect being measured."
next_de = "Die Größe des Fehlers wird abgeschätzt. Ein Becherglas, das eine Minute lang zwischen den Durchläufen steht, verliert ein bis zwei Grad, und diese Reaktion ändert ihre Geschwindigkeit um das 1,9-Fache pro zehn Grad — ein paar Grad sind also mehrere Prozent, vergleichbar mit dem zu messenden Effekt."

[reaction.registers]
lv1 = "Two beakers, the same amounts of everything, one warm and one not. Start them together, watch them together, stop them together. After twenty seconds the cold one is faintly hazy and the warm one is properly cloudy — and because nothing else was different, the warmth is the only thing that can have caused it. Change two things at once and you have a nice-looking experiment that proves nothing."
lv1_de = "Zwei Bechergläser, von allem dieselbe Menge, das eine warm und das andere nicht. Man startet sie gemeinsam, beobachtet sie gemeinsam, stoppt sie gemeinsam. Nach zwanzig Sekunden ist das kalte leicht trübe, das warme richtig trüb — und weil sonst nichts anders war, kann nur die Wärme das verursacht haben. Ändert man zwei Dinge gleichzeitig, hat man ein hübsch aussehendes Experiment, das nichts beweist."
lv2 = "Same 0.05 mol/L thiosulfate, same 0.002 mol of HCl, same 100 mL, 25 °C against 35 °C. One `wait 20s` advances both vessels: 4.3557 × 10⁻⁴ mol of reaction in the cold beaker against 8.1256 × 10⁻⁴ in the warm one, a factor of 1.87. The second twenty seconds gives 3.9760 × 10⁻⁴ and 6.8042 × 10⁻⁴ — both beakers slowing as their thiosulfate runs down, the warm one faster because it has less left."
lv2_de = "Dasselbe 0,05 mol/L Thiosulfat, dieselben 0,002 mol HCl, dieselben 100 mL, 25 °C gegen 35 °C. Ein `wait 20s` lässt beide Gefäße gleichzeitig fortschreiten: 4,3557 × 10⁻⁴ mol Umsatz im kalten Becherglas gegen 8,1256 × 10⁻⁴ im warmen, ein Faktor von 1,87. Die zweiten zwanzig Sekunden ergeben 3,9760 × 10⁻⁴ und 6,8042 × 10⁻⁴ — beide Bechergläser werden langsamer, während ihr Thiosulfat zur Neige geht, das warme schneller, weil ihm weniger übrig bleibt."
lv3 = "Time is a state dimension on this bench, and it is shared rather than per-vessel: `Operator::Wait` iterates every vessel and advances each one's clock and chemistry by the same interval, and the bench then re-settles every vessel's fast equilibria around what is left. That ordering — kinetics first, then speciation — is operator splitting, and it is the right way round because equilibrium is the faster process. The design cost of the alternative is worth naming: had `wait` taken a vessel argument, every rate comparison in this file would have been a comparison of two separately-run experiments, and the fair test would have been a convention the user had to keep rather than a property the engine guarantees. What the simulation cannot supply is the difficulty: identical starting temperatures, zero heat loss and perfect timing are free here and are most of the work at a real bench."
lv3_de = "Zeit ist auf diesem Labor eine Zustandsdimension, und sie wird geteilt statt pro Gefäß geführt: `Operator::Wait` durchläuft jedes Gefäß und lässt dessen Uhr und Chemie um dasselbe Intervall fortschreiten, und das Labor stellt danach die schnellen Gleichgewichte jedes Gefäßes neu um das ein, was übrig ist. Diese Reihenfolge — erst Kinetik, dann Speziation — ist Operatorsplitting, und sie ist richtig herum, weil das Gleichgewicht der schnellere Prozess ist. Die Entwurfskosten der Alternative sind es wert, genannt zu werden: Hätte `wait` ein Gefäßargument entgegengenommen, wäre jeder Geschwindigkeitsvergleich in dieser Datei ein Vergleich zweier getrennt durchgeführter Experimente gewesen, und das faire Experiment wäre eine Konvention gewesen, die der Nutzer selbst hätte einhalten müssen, statt eine Eigenschaft, die der Motor garantiert. Was die Simulation nicht liefern kann, ist die Schwierigkeit: identische Ausgangstemperaturen, kein Wärmeverlust und perfektes Timing gibt es hier gratis, und genau das macht bei einem echten Labor den größten Teil der Arbeit aus."

[reaction.provenance]
source = "Editorial judgement (Kerotakis): the shared-clock design and the argument that it is what makes a fair test structural rather than conventional are ours, recorded in PLAN.md (P3k) and `kinetics.rs`. The controlled-comparison principle itself is standard scientific method."
computed_by = "kerotakis-core kinetics; bench clock via Operator::Wait"

# ============================================== where the model stops, plainly

[[reaction]]
id = "a-salt-with-no-database"
spine = ["natur-der-naturwissenschaft-nature-of-science"]
summary = "Sodium thiosulfate dissolves and reacts, and contributes exactly nothing to the pH: 1.74858175066 with it and 1.74858175066 without"
summary_de = "Natriumthiosulfat löst sich auf und reagiert und trägt exakt nichts zum pH-Wert bei: 1,74858175066 mit ihm und 1,74858175066 ohne ihn"
concepts = ["species-without-a-database"]
requires = ["stated-ignorance", "ph"]
calculations = ["ph-from-concentration"]
models = ["model-boundaries"]
apparatus = ["beaker", "ph-meter", "spatula"]

