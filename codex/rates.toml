misconception = "'Used up' is the default assumption about anything that takes part in a reaction, and it is reinforced by the fact that a catalyst has to be added at all. The first and third options are both versions of it. What makes the demonstration convincing is repetition: one charge proves nothing, three identical charges destroyed at identical speed by the same speck of enzyme is hard to explain any other way. The last option is a real effect in a real flask — this decomposition is exothermic — and the bench does not model it, which the entry says rather than letting the option quietly pass as wrong for the wrong reason."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Anything you add to a reaction is a reagent, and reagents get used up."
next = "Add the third charge and watch it go at the same speed. Then ask what the catalase would have to be doing to survive being 'used up' twice."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "A catalyst is partly consumed — spent in proportion to how much reaction it has driven, like a fuel."
next = "Compare the numbers: 4.17 × 10⁻⁹ mol of catalase against 0.1 mol of peroxide per charge, twenty-four million peroxide molecules per enzyme molecule. Anything consumed in proportion would have run out in the first microsecond."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "The flask is warming from an exothermic reaction, so the second charge should be faster."
next = "Right physics, absent from this model. Check the thermometer: the bench holds the flask at 25.0 °C throughout, because no reaction enthalpy is wired into the rate engine. Worth knowing which of your correct predictions this lab cannot confirm."

[reaction.registers]
lv1 = "A speck of liver enzyme, too small to see properly, and a flask of peroxide. One second and the peroxide is gone. Add more peroxide: gone again, just as fast. Add more: gone again. The speck is still there and still working. It is not an ingredient — it is a doorway that the reaction goes through and leaves behind."
lv2 = "0.001 g of catalase is 4.16666667 × 10⁻⁹ mol at M ≈ 240 kDa. Each of the three 0.1 mol charges is destroyed in one second, 5.0000 × 10⁻² mol of reaction apiece, and the bench's inventory reports the same 4.16666667 × 10⁻⁹ mol of catalase after the third as before the first — identical to every digit it prints. Oxygen accumulates to 0.15 mol, three times the yield of one charge, as it must."
lv3 = "The catalyst remains outside the stoichiometric mass update, so it cannot be consumed accidentally, but its amount is no longer ignored. At each substep the engine compares the uncatalysed path with each available catalyst path after applying that catalyst's activity. Catalase activity scales with effective enzyme-site concentration and includes a Michaelis–Menten substrate-saturation correction. Reaction heat feeds back into temperature and therefore into the next Arrhenius step. Remaining biological limits are denaturation, inhibition and product-specific yeast activity."

[reaction.provenance]
source = "Standard curriculum treatment of catalysis; catalase molar mass ~240 kDa via the Kerotakis species registry. Ogura & Yamazaki, J. Biochem. 1983 (PMID 6630165), report Kₘ = 1.29–1.39 M and first-order peroxide behaviour below 0.1 M. Editorial judgement (Kerotakis): the effective yeast activity reference and three-charge protocol are teaching calibrations; brand, hydration, inhibition and denaturation remain explicit uncertainties."
computed_by = "kerotakis-core kinetics (catalysts are excluded from the mass update by construction)"

