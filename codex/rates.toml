[reaction.setup]
script = """
add v1 water 100mL @ 25C
add v1 H2O2 0.1mol @ 25C
new
add v2 water 100mL @ 35C
add v2 H2O2 0.1mol @ 35C
new
add v3 water 100mL @ 45C
add v3 H2O2 0.1mol @ 45C
wait 30min
"""

[reaction.expect]
events = ["reacted:peroxide-decomposition", "temperature_changed"]
absent = ["solver_failed"]
temperature_c = { min = 24.5, max = 25.5 }

[reaction.expect.predict]
question = "The thiosulfate clock speeds up by 1.90 per ten degrees. Hydrogen peroxide decomposing on its own has a much steeper barrier — 75 kJ/mol against 51. Warm it by ten degrees. What happens to its rate?"
question_de = "Die Thiosulfat-Uhr wird um das 1,90-Fache pro zehn Grad schneller. Wasserstoffperoxid, das von selbst zerfällt, hat eine viel höhere Barriere — 75 kJ/mol gegen 51. Du erwärmst es um zehn Grad. Was passiert mit seiner Geschwindigkeit?"
options = [
  "It also roughly doubles — the ten-degree rule applies to reactions, not to barriers",
  "It rises by about 2.6 — a steeper barrier is more sensitive to temperature",
  "It rises by less than two — a harder reaction is harder to speed up",
  "Nothing measurable — the barrier is too high for ten degrees to matter",
]
options_de = [
    "Sie verdoppelt sich ebenfalls ungefähr — die Zehn-Grad-Regel gilt für Reaktionen, nicht für Barrieren",
    "Sie steigt um etwa das 2,6-Fache — eine steilere Barriere ist empfindlicher gegenüber Temperatur",
    "Sie steigt um weniger als das Doppelte — eine schwerere Reaktion lässt sich schwerer beschleunigen",
    "Nichts Messbares — die Barriere ist zu hoch, als dass zehn Grad etwas ausmachten",
]
answer = 1
misconception = "The third option is the intuitive one and it has the physics backwards. A high barrier does not make a reaction sluggish to warm; it makes it *more* responsive, because the fraction of collisions clearing the barrier is an exponential in Ea/RT and a bigger Ea steepens that exponential. The first option is the rule of thumb mistaken for a law of nature. Both are cured by the same observation: the temperature sensitivity is a property of the barrier, and that is the only thing that changed between these two experiments."
misconception_de = "Die dritte Option ist die intuitive, und sie hat die Physik genau falsch herum. Eine hohe Barriere macht eine Reaktion nicht träge gegenüber Erwärmung; sie macht sie *empfindlicher*, weil der Anteil der Zusammenstöße, die die Barriere überwinden, exponentiell in Ea/RT ist und ein größeres Ea diese Exponentialfunktion steiler macht. Die erste Option verwechselt die Faustregel mit einem Naturgesetz. Beide werden durch dieselbe Beobachtung geheilt: Die Temperaturempfindlichkeit ist eine Eigenschaft der Barriere, und das ist das Einzige, was sich zwischen diesen beiden Experimenten geändert hat."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "The ten-degree rule is a property of temperature, so it applies to every reaction alike."
reveals_de = "Die Zehn-Grad-Regel sei eine Eigenschaft der Temperatur, gelte also für jede Reaktion gleichermaßen."
next = "Put the two experiments side by side: same integrator, same clock, same ten degrees, factors of 1.90 and 2.62. The only thing that differs between them is Ea, so Ea is what the factor depends on."
next_de = "Die beiden Experimente werden nebeneinandergestellt: derselbe Integrator, dieselbe Uhr, dieselben zehn Grad, Faktoren von 1,90 und 2,62. Das Einzige, was sich zwischen ihnen unterscheidet, ist Ea — also hängt der Faktor von Ea ab."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "A high barrier means a stubborn reaction, and stubborn things respond less to being pushed."
reveals_de = "Eine hohe Barriere bedeute eine störrische Reaktion, und Störrisches reagiere weniger auf einen Anstoß."
next = "Look at where Ea sits in the equation — inside the exponent, divided by RT. Try Ea = 150 kJ/mol in the same arithmetic: the ten-degree factor is over 6. Sensitivity and speed are different questions, and this is the cleanest place to separate them."
next_de = "Es wird betrachtet, wo Ea in der Gleichung steht — im Exponenten, geteilt durch RT. Setzt man Ea = 150 kJ/mol in dieselbe Rechnung ein, liegt der Zehn-Grad-Faktor über 6. Empfindlichkeit und Geschwindigkeit sind unterschiedliche Fragen, und hier lassen sie sich am saubersten trennen."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "A barrier of 75 kJ/mol is a wall, so ten degrees of thermal energy cannot matter."
reveals_de = "Eine Barriere von 75 kJ/mol sei eine Wand, sodass zehn Grad thermischer Energie nichts ausmachen könnten."
next = "Compare 75 kJ/mol against RT at 298 K, which is 2.5 kJ/mol. The barrier is thirty times the average thermal energy and the reaction still runs — because it is the tail of the distribution that reacts, not the average."
next_de = "75 kJ/mol werden mit RT bei 298 K verglichen, das sind 2,5 kJ/mol. Die Barriere ist das Dreißigfache der mittleren thermischen Energie, und die Reaktion läuft trotzdem — weil es der Ausläufer der Verteilung ist, der reagiert, nicht der Durchschnitt."

[reaction.registers]
lv1 = "The same ten degrees does not buy the same speed-up for every reaction. For the sulfur clock it was about double. For peroxide breaking down on its own it is about two and a half times — because peroxide's reaction is harder to start, and anything hard to start is more grateful for the extra warmth."
lv1_de = "Dieselben zehn Grad bringen nicht bei jeder Reaktion denselben Geschwindigkeitsgewinn. Bei der Schwefel-Uhr waren es etwa das Doppelte. Beim Peroxid, das von selbst zerfällt, sind es etwa das Zweieinhalbfache — weil die Peroxid-Reaktion schwerer in Gang zu bringen ist, und alles, was schwer in Gang zu bringen ist, ist der zusätzlichen Wärme dankbarer."
lv2 = "Three beakers of 0.1 mol of peroxide at 25, 35 and 45 °C, left for thirty minutes. The extents are 0.0007, 0.0019 and 0.0047 mol — factors of about 2.7 and 2.5 for each ten degrees, against 1.90 for the thiosulfate clock. The only thing that differs is the activation energy: 75 kJ/mol here against 51 there. Note also that thirty minutes is needed to see anything at all, where the clock reaction was over in under a minute — a steeper barrier means both a slower reaction and a more temperature-sensitive one, and those are separate consequences of the same number."
lv2_de = "Drei Bechergläser mit 0,1 mol Peroxid bei 25, 35 und 45 °C, dreißig Minuten stehen gelassen. Die Umsätze betragen 0,0007, 0,0019 und 0,0047 mol — Faktoren von rund 2,7 und 2,5 pro zehn Grad, gegenüber 1,90 bei der Thiosulfat-Uhr. Das Einzige, was sich unterscheidet, ist die Aktivierungsenergie: hier 75 kJ/mol gegen dort 51. Bemerkenswert ist auch, dass dreißig Minuten nötig sind, um überhaupt etwas zu sehen, während die Uhr-Reaktion in weniger als einer Minute vorbei war — eine steilere Barriere bedeutet sowohl eine langsamere als auch eine temperaturempfindlichere Reaktion, und das sind zwei getrennte Folgen derselben Zahl."
lv3 = "The ratio is exp[(Ea/R)(1/T₁ − 1/T₂)], so for Ea = 75 kJ/mol the pure Arrhenius factors across these steps are 2.67 and 2.51. The measured extents give 2.71 and 2.47: the first sits a hair high on rounding, the second a little low because the hottest beaker has begun to run out of peroxide and an extent over thirty minutes is no longer a clean proxy for an initial rate. That gap is the reason initial-rate methods exist, and it is visible here rather than described. The ten-degree rule corresponds to Ea ≈ 50 kJ/mol at room temperature, which is why the thiosulfate clock obeys it and this does not — the rule is a coincidence of one barrier height, not a law."
lv3_de = "Das Verhältnis ist exp[(Ea/R)(1/T₁ − 1/T₂)], sodass für Ea = 75 kJ/mol die reinen Arrhenius-Faktoren über diese Schritte 2,67 und 2,51 betragen. Die gemessenen Umsätze ergeben 2,71 und 2,47: Der erste liegt durch Rundung ein Haar zu hoch, der zweite etwas zu niedrig, weil dem heißesten Becherglas bereits das Peroxid auszugehen beginnt und ein Umsatz über dreißig Minuten kein sauberer Ersatz für eine Anfangsgeschwindigkeit mehr ist. Diese Lücke ist der Grund, warum es Anfangsgeschwindigkeits-Methoden gibt, und sie ist hier sichtbar statt nur beschrieben. Die Zehn-Grad-Regel entspricht Ea ≈ 50 kJ/mol bei Raumtemperatur, weshalb die Thiosulfat-Uhr ihr gehorcht und dies nicht — die Regel ist der Zufall einer einzelnen Barrierenhöhe, kein Gesetz."

[reaction.provenance]
source = "Uncatalysed hydrogen peroxide decomposition Ea ≈ 75 kJ/mol (standard physical chemistry texts); Arrhenius, 1889. Editorial judgement (Kerotakis): the side-by-side comparison of two curated activation energies as a way of showing the ten-degree rule's domain is ours; the pre-exponential for peroxide is calibrated rather than measured, so only the ratios here are load-bearing."
computed_by = "kerotakis-core kinetics"

