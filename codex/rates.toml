[reaction.expect.predict]
question = "Ten times as much manganese dioxide in the second flask, and the third gets a vigorous stir. After one second, how do the three compare?"
question_de = "Der zweite Kolben enthält zehnmal so viel Mangandioxid, der dritte wird kräftig gerührt. Wie schneiden die drei nach einer Sekunde im Vergleich ab?"
options = [
  "The flask with more catalyst is faster; stirring helps a little too",
  "All three are identical, because a catalyst is not consumed and therefore its amount cannot matter",
  "All three are identical in this engine — and in a real flask they would not be, because surface area and mixing are real variables this model does not contain",
  "The stirred flask is slower, because stirring cools it",
]
options_de = [
    "Der Kolben mit mehr Katalysator ist schneller; Rühren hilft auch ein wenig",
    "Alle drei sind identisch, weil ein Katalysator nicht verbraucht wird und seine Menge deshalb keine Rolle spielen kann",
    "In dieser Engine sind alle drei identisch — in einem echten Kolben wären sie es nicht, weil Oberfläche und Durchmischung reale Variablen sind, die dieses Modell nicht enthält",
    "Der gerührte Kolben ist langsamer, weil Rühren ihn abkühlt",
]
answer = 2
misconception = "The second option is the dangerous one, and it is dangerous precisely because it reasons correctly from a true premise to a false conclusion: a catalyst really is not consumed, and it really does not appear in the stoichiometry, so it is tempting to conclude its amount is irrelevant. It is not irrelevant. Heterogeneous catalysis happens on a surface, so ten times the powder is roughly ten times the surface and roughly ten times the rate, and grinding it finer does the same again. The first option is the chemistry a school course teaches and the right expectation for a real bench. Our engine gives neither — it gives the second answer for the second reason, and the point of this entry is that you should know that before you trust it."
misconception_de = "Die zweite Option ist die gefährliche, und sie ist gefährlich, weil sie von einer wahren Prämisse korrekt auf eine falsche Schlussfolgerung schließt: Ein Katalysator wird tatsächlich nicht verbraucht, und er erscheint tatsächlich nicht in der Stöchiometrie, sodass es naheliegt zu schließen, seine Menge sei bedeutungslos. Das ist sie nicht. Heterogene Katalyse findet an einer Oberfläche statt, sodass zehnmal so viel Pulver ungefähr zehnmal so viel Oberfläche und ungefähr die zehnfache Geschwindigkeit bedeutet, und feineres Mahlen bewirkt dasselbe noch einmal. Die erste Option ist die Chemie, die ein Schulkurs lehrt, und die richtige Erwartung für ein echtes Labor. Unser Motor liefert keines von beidem — er liefert die zweite Antwort aus dem zweiten Grund, und der Sinn dieses Eintrags ist, das zu wissen, bevor man ihm vertraut."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "The right chemistry for a real bench, offered as a prediction about this one."
reveals_de = "Die richtige Chemie für ein echtes Labor, angeboten als Vorhersage über dieses hier."
next = "Nothing to unlearn — check instead which of your correct expectations the engine can honour. Concentration and temperature it computes; surface area and mixing it does not represent at all, and `stir` says so out loud."
next_de = "Hier ist nichts zu verlernen — stattdessen wird geprüft, welche der richtigen Erwartungen der Motor tatsächlich einlösen kann. Konzentration und Temperatur berechnet er; Oberfläche und Durchmischung bildet er überhaupt nicht ab, und `stir` sagt das auch deutlich."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "A catalyst is not consumed and does not appear in the stoichiometry, therefore how much of it there is cannot matter."
reveals_de = "Ein Katalysator werde nicht verbraucht und erscheine nicht in der Stöchiometrie, daher könne seine Menge keine Rolle spielen."
next = "Reason about where the reaction physically happens. On a solid catalyst it happens on the surface, so ten times the powder is ten times the surface; grinding it finer does the same again without adding any mass. 'Not consumed' and 'amount irrelevant' are different claims, and only the first is true."
next_de = "Es wird überlegt, wo die Reaktion physisch stattfindet. Bei einem festen Katalysator geschieht das an der Oberfläche, sodass zehnmal so viel Pulver zehnmal so viel Oberfläche bedeutet; feineres Mahlen bewirkt dasselbe noch einmal, ohne zusätzliche Masse. 'Nicht verbraucht' und 'Menge spielt keine Rolle' sind unterschiedliche Aussagen, und nur die erste stimmt."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "Stirring is a mechanical input, so it must change the energy of the flask."
reveals_de = "Rühren sei ein mechanischer Eingriff, müsse also die Energie des Kolbens verändern."
next = "Watch the thermometer through the stir: 25.0 °C before and after. Then separate the two ideas — stirring in a real flask helps by moving material to the surface, not by changing the temperature."
next_de = "Das Thermometer wird während des Rührens beobachtet: 25,0 °C davor und danach. Dann werden die beiden Vorstellungen getrennt — Rühren hilft in einem echten Kolben, indem es Material zur Oberfläche transportiert, nicht indem es die Temperatur verändert."

[reaction.registers]
lv1 = "Two flasks, one with a pinch of black powder and one with ten pinches, and a third that you stir hard. In this lab all three fizz at exactly the same speed. On a real bench they would not: more powder means more surface for the peroxide to meet, and stirring keeps fresh liquid arriving at that surface. This lab does not know about surfaces, and it says so rather than letting you think you have proved something."
lv1_de = "Zwei Kolben, der eine mit einer Prise schwarzem Pulver, der andere mit zehn Prisen, und ein dritter, den du kräftig rührst. In diesem Labor sprudeln alle drei mit exakt derselben Geschwindigkeit. In einem echten Labor wäre das nicht so: Mehr Pulver bedeutet mehr Oberfläche, auf die das Peroxid trifft, und Rühren sorgt dafür, dass ständig frische Flüssigkeit an diese Oberfläche gelangt. Dieses Labor weiß nichts von Oberflächen, und es sagt das offen, statt dich glauben zu lassen, du hättest etwas bewiesen."
lv2 = "Rate = k·[H₂O₂] with k set by whichever catalyst is present, and *present* is the only thing the model asks. 0.1 g and 1 g of MnO₂ both give 3.849 × 10⁻⁴ mol of reaction in one second, digit for digit, and stirring changes nothing — `stir` returns a notice saying so rather than an effect. In a real flask ten times the catalyst is roughly ten times the surface and roughly ten times the rate, and grinding it finer raises it again."
lv2_de = "Geschwindigkeit = k·[H₂O₂], wobei k von dem jeweils vorhandenen Katalysator bestimmt wird, und *vorhanden* ist alles, wonach das Modell fragt. 0,1 g und 1 g MnO₂ ergeben beide 3,849 × 10⁻⁴ mol Umsatz in einer Sekunde, Ziffer für Ziffer, und Rühren ändert nichts — `stir` liefert einen entsprechenden Hinweis statt eines Effekts. In einem echten Kolben bedeutet zehnmal so viel Katalysator ungefähr zehnmal so viel Oberfläche und ungefähr die zehnfache Geschwindigkeit, und feineres Mahlen steigert sie noch einmal."
lv3 = "The gap has a definite shape, which is what makes it worth stating rather than apologising for. `effective_activation_energy` tests `moles_of(catalyst) > 0` and then substitutes a barrier — a boolean, not a quantity — so catalyst loading is structurally invisible; there is no particle-size, surface-area or mass-transport term anywhere in `kinetics.rs`. Modelling it properly means a Langmuir–Hinshelwood surface treatment with a site density and a diffusion coefficient, which is a different engine, not a coefficient. Until then the honest reading of these three flasks is that they demonstrate the *absence* of a model. One caution for anyone extending the script: keep the manganese dioxide below about 4 g in 100 mL. At 4 g the bench leaves it as a solid with 4.6 × 10⁻¹² mol of Mn²⁺ in solution, as an insoluble oxide should; at 5 g the aqueous solver dissolves the entire charge, reporting 5.75 × 10⁻² mol of Mn²⁺ and pH 13.55. That discontinuity is a solver artefact, not chemistry, and it is flagged here because the rate results happen to survive it — the catalyst check only asks whether any MnO₂ is left."
lv3_de = "Die Lücke hat eine klar umrissene Form, weshalb es sich lohnt, sie zu benennen statt sich dafür zu entschuldigen. `effective_activation_energy` prüft `moles_of(catalyst) > 0` und setzt dann eine Barriere ein — ein Wahrheitswert, keine Größe —, sodass die Katalysatormenge strukturell unsichtbar bleibt; nirgendwo in `kinetics.rs` gibt es einen Term für Partikelgröße, Oberfläche oder Stofftransport. Das richtig zu modellieren würde eine Langmuir-Hinshelwood-Oberflächenbehandlung mit einer Platzdichte und einem Diffusionskoeffizienten bedeuten — ein anderer Motor, kein Koeffizient. Bis dahin ist die ehrliche Lesart dieser drei Kolben, dass sie das *Fehlen* eines Modells demonstrieren. Eine Warnung für alle, die das Skript erweitern: Das Mangandioxid sollte unter etwa 4 g in 100 mL bleiben. Bei 4 g belässt das Labor es als Feststoff mit 4,6 × 10⁻¹² mol Mn²⁺ in Lösung, wie es sich für ein unlösliches Oxid gehört; bei 5 g löst der wässrige Solver die gesamte Portion auf und meldet 5,75 × 10⁻² mol Mn²⁺ und pH 13,55. Dieser Sprung ist ein Artefakt des Solvers, keine Chemie, und wird hier vermerkt, weil die Geschwindigkeitsergebnisse ihn zufällig überstehen — die Katalysatorprüfung fragt nur, ob noch MnO₂ übrig ist."

[reaction.provenance]
source = "Editorial judgement (Kerotakis): this is a statement about our engine's boundary, not about chemistry. Real heterogeneous catalysis depends strongly on catalyst surface area and on mass transport, per any standard treatment of catalysis; nothing in the shipped rate model represents either, and `stir` is explicitly a no-op that reports itself as one."
computed_by = "kerotakis-core kinetics; the `stir` notice comes from the bench's honesty pass"

# ==================================================== the shape of a rate law

[[reaction]]
id = "first-order-means-a-constant-half-life"
spine = ["die-reaktionsgeschwindigkeit"]
equation = "2 H₂O₂ → 2 H₂O + O₂↑"
concepts = ["half-life", "first-order-kinetics"]
requires = ["reaction-order"]
calculations = ["half-life", "rate-from-extent"]
models = ["activation-energy"]
apparatus = ["conical-flask", "gas-syringe", "stopwatch"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 11/12, Reaktionsgeschwindigkeit und Katalyse"
ages = { min = 16.0, max = 18.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Oberstufe (ISB)"

[[reaction.curriculum]]
system = "nrw-kernlehrplan-g9"
stage = "Sek II Q-Phase, IF3 Gleichgewichtsreaktionen — Reaktionskinetik"
ages = { min = 17.0, max = 19.0 }
