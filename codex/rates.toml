[reaction.setup]
script = """
add v1 water 100mL
add v1 H2O2 0.1mol
new
add v2 water 100mL
add v2 H2O2 0.1mol
add v2 MnO2 0.5g
new
add v3 water 100mL
add v3 H2O2 0.1mol
add v3 catalase 0.001g
wait 1s
"""

[reaction.expect]
events = ["reacted:peroxide-decomposition"]
absent = ["solver_failed"]

[reaction.expect.predict]
question = "Three flasks of 1 mol/L hydrogen peroxide. One is left alone, one gets half a gram of manganese dioxide, one gets a milligram of catalase from liver. After one second, how much peroxide is left in each?"
question_de = "Drei Kolben mit 1 mol/L Wasserstoffperoxid. Einer bleibt unangetastet, einer bekommt ein halbes Gramm Mangandioxid, einer bekommt ein Milligramm Katalase aus der Leber. Wie viel Peroxid ist nach einer Sekunde in jedem übrig?"
options = [
  "Roughly the same in all three — one second is not long enough for anything",
  "99.8%, 11%, and none at all",
  "99.8%, 50%, and 25% — each catalyst roughly halves what is left",
  "None in any of them — a catalyst makes the reaction happen, and it was going to happen anyway",
]
options_de = [
    "In allen drei etwa gleich viel — eine Sekunde reicht für nichts",
    "99,8 %, 11 % und gar nichts",
    "99,8 %, 50 % und 25 % — jeder Katalysator halbiert etwa das Verbliebene",
    "In keinem von ihnen — ein Katalysator lässt die Reaktion ablaufen, und sie wäre ohnehin abgelaufen",
]
answer = 1
misconception = "The third option treats catalysts as things that come in ordinary sizes, a few times better than nothing. The whole point of the pairing is that they do not: the enzyme is not a bit better than the mineral, it is about a million times better, because the two differ by 35 kJ/mol in the exponent and the exponent is where speed lives. The last option is the older confusion — that a catalyst decides *whether* a reaction happens. It does not. All three flasks end up as water and oxygen; the catalyst only decides when."
misconception_de = "Die dritte Option behandelt Katalysatoren, als kämen sie in gewöhnlichen Größenordnungen daher, ein paar Mal besser als nichts. Der ganze Sinn dieser Gegenüberstellung ist gerade, dass das nicht stimmt: Das Enzym ist nicht ein bisschen besser als das Mineral, es ist etwa eine Million Mal besser, weil sich die beiden um 35 kJ/mol im Exponenten unterscheiden — und im Exponenten steckt die Geschwindigkeit. Die letzte Option ist die ältere Verwechslung: dass ein Katalysator entscheidet, *ob* eine Reaktion abläuft. Das tut er nicht. Alle drei Kolben enden als Wasser und Sauerstoff; der Katalysator entscheidet nur, wann."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "One second is too short for chemistry — reactions happen on the timescale of a lesson."
reveals_de = "Eine Sekunde sei zu kurz für Chemie — Reaktionen liefen auf der Zeitskala einer Unterrichtsstunde ab."
next = "Ask what sets the timescale. The catalysed flask finishes inside ten milliseconds; nothing about a second is short or long until an activation energy says so."
next_de = "Es wird gefragt, was die Zeitskala festlegt. Der katalysierte Kolben ist innerhalb von zehn Millisekunden fertig; eine Sekunde ist weder kurz noch lang, solange nicht eine Aktivierungsenergie das entscheidet."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Catalysts are graded like everything else in a school lab: better, much better, a few times better."
reveals_de = "Katalysatoren würden abgestuft wie alles andere im Schullabor: besser, viel besser, ein paar Mal besser."
next = "Put the barriers on a diagram: 75, 58, 23 kJ/mol, and the speed-up is exponential in the difference. Between the mineral and the enzyme lies a factor of a million, which is not a difference of degree that anyone's intuition delivers unaided."
next_de = "Die Barrieren werden in einem Diagramm eingetragen: 75, 58, 23 kJ/mol, und der Geschwindigkeitsgewinn ist exponentiell in der Differenz. Zwischen Mineral und Enzym liegt ein Faktor von einer Million — ein Größenunterschied, den die Intuition allein niemandem liefert."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "A catalyst is what makes the reaction go; without one it would not happen at all."
reveals_de = "Ein Katalysator sei das, was die Reaktion überhaupt in Gang bringt; ohne ihn passiere gar nichts."
next = "Leave the plain flask alone for five days (`same-destination-different-journey`). It arrives at the same place, 0.0485 mol of oxygen and still climbing toward 0.0500. The catalyst decided when, not whether."
next_de = "Der unbehandelte Kolben wird fünf Tage sich selbst überlassen (`same-destination-different-journey`). Er kommt am selben Ziel an, 0,0485 mol Sauerstoff und immer noch steigend Richtung 0,0500. Der Katalysator hat entschieden, wann, nicht ob."

[reaction.registers]
lv1 = "Three flasks of the same peroxide. Leave one alone and after a second it has barely changed. Drop in a spatula of black powder and nine tenths of it has already gone. Drop in a speck of liver enzyme — a thousandth of a gram — and it is over before you have put the bottle down. Same liquid, same room, same second."
lv1_de = "Drei Kolben mit demselben Peroxid. Lässt man einen unangetastet, hat er sich nach einer Sekunde kaum verändert. Gibt man einen Spatel schwarzes Pulver hinein, ist schon neun Zehntel davon verschwunden. Gibt man ein Krümelchen Leberenzym hinein — ein Tausendstel Gramm —, ist alles vorbei, bevor du die Flasche abgestellt hast. Dieselbe Flüssigkeit, derselbe Raum, dieselbe Sekunde."
lv2 = "Activation energies of 75, 58 and 23 kJ/mol for none, manganese dioxide and catalase. After one second the plain flask has done nothing the bench will even report — 4 × 10⁻⁷ mol of reaction, below the observable floor — while manganese dioxide has done 4 × 10⁻⁴ mol and catalase has finished, 5.0000 × 10⁻² mol, every molecule of peroxide gone. The peroxide left reads 0.1000, 0.0992 and 0.0000 mol. Same reaction, same temperature, same thermodynamics; three barriers."
lv2_de = "Aktivierungsenergien von 75, 58 und 23 kJ/mol für keinen Katalysator, Mangandioxid und Katalase. Nach einer Sekunde hat der unbehandelte Kolben nichts getan, was das Labor überhaupt meldet — 4 × 10⁻⁷ mol Umsatz, unterhalb der Beobachtungsgrenze —, während Mangandioxid 4 × 10⁻⁴ mol erreicht hat und Katalase fertig ist: 5,0000 × 10⁻² mol, jedes Molekül Peroxid verschwunden. Das verbliebene Peroxid liest sich als 0,1000, 0,0992 und 0,0000 mol. Dieselbe Reaktion, dieselbe Temperatur, dieselbe Thermodynamik; drei Barrieren."
lv3 = "The speed-ups are exponential in the difference between barriers and depend on nothing else, which is why they are the durable numbers here while the absolute times are not. exp[(75 − 58) kJ·mol⁻¹ / RT] = 951 at 298.15 K, and exp[(58 − 23)/RT] = 1.36 × 10⁶ — so the mineral is about a thousand times better than nothing and the enzyme about a million times better than the mineral. Read the rates rather than the extents to see it: once a catalysed vessel saturates within the interval, its extent is bounded by the peroxide and no longer reports a rate at all. The pre-exponential is calibrated rather than measured, so the seconds are indicative; the ratios are not, because A cancels."
lv3_de = "Die Geschwindigkeitsgewinne sind exponentiell in der Differenz zwischen den Barrieren und hängen von sonst nichts ab — deshalb sind sie hier die belastbaren Zahlen, während es die absoluten Zeiten nicht sind. exp[(75 − 58) kJ·mol⁻¹ / RT] = 951 bei 298,15 K, und exp[(58 − 23)/RT] = 1,36 × 10⁶ — das Mineral ist also etwa tausendmal besser als nichts, und das Enzym etwa eine Million Mal besser als das Mineral. Um das zu sehen, liest man besser die Geschwindigkeiten als die Umsätze: Sobald ein katalysiertes Gefäß innerhalb des Intervalls sättigt, ist sein Umsatz durch das Peroxid begrenzt und meldet gar keine Geschwindigkeit mehr. Der präexponentielle Faktor ist kalibriert, nicht gemessen, sodass die Sekundenwerte nur richtungsweisend sind; die Verhältnisse dagegen nicht, weil sich A heraushebt."

[reaction.provenance]
source = "Ea ≈ 58 kJ/mol for manganese dioxide and ≈ 23 kJ/mol for catalase on hydrogen peroxide (standard physical chemistry texts); uncatalysed ≈ 75 kJ/mol. Editorial judgement (Kerotakis): modelling catalysis as a substituted activation energy rather than a rate multiplier is an engine decision recorded in `kinetics.rs`; the exponential speed-up factors quoted at lv3 are arithmetic performed on those curated barriers, not separately measured values."
computed_by = "kerotakis-core kinetics"

