lv1 = "Three flasks stir for the same second: one with a pinch of black powder, one with ten pinches, and one spinning ten times faster. More powder fizzes faster because it offers more surface. Faster stirring helps too by keeping particles and fresh peroxide in contact, but its benefit levels off."
lv2 = "The MnO₂ path multiplies its Arrhenius rate by exposed area relative to a declared reference. Nominal spherical area is A = 6V/d, so catalyst mass raises area and grinding to one tenth the diameter raises it tenfold. Suspension and stir-bar tip speed add a finite external-transfer correction; the `Stirred` and catalyst `Ground` events therefore report rate coupling as active."
lv3 = "This is a progressive heterogeneous-catalysis model, not a Langmuir–Hinshelwood or pore-diffusion solver. Material lots carry particle diameter and suspended fraction. Their geometric areas are summed, weighted by contact, then multiplied by 1 + g·u/(u₁/₂+u), where u is computed bar-tip speed and g bounds the maximum mixing gain. It supports causal comparisons of mass, grinding and stirring while explicitly leaving BET pore area, adsorption, agglomeration and diffusion coefficients unresolved."

