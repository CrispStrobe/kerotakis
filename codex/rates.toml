[reaction.setup]
script = """
add v1 water 100mL
add v1 catalase 0.001g
add v1 H2O2 0.1mol
wait 1s
add v1 H2O2 0.1mol
wait 1s
add v1 H2O2 0.1mol
wait 1s
"""

[reaction.expect]
events = ["reacted:peroxide-decomposition", "added:catalase"]
absent = ["consumed:catalase", "solver_failed"]

[reaction.expect.predict]
question = "A milligram of catalase destroys 0.1 mol of hydrogen peroxide in one second. You add a second 0.1 mol charge to the same flask. What happens?"
question_de = "Ein Milligramm Katalase zerstört 0,1 mol Wasserstoffperoxid in einer Sekunde. Du gibst eine zweite 0,1-mol-Portion in denselben Kolben. Was passiert?"
options = [
  "Nothing — the catalase was used up destroying the first charge",
  "It goes just as fast — the catalase is untouched and the second charge takes the same one second",
  "It goes half as fast — half the catalase has been spent",
  "It goes faster — the flask is now warmed up",
]
options_de = [
    "Nichts — die Katalase wurde beim Zerstören der ersten Portion verbraucht",
    "Es geht genauso schnell — die Katalase ist unverändert, und die zweite Portion braucht dieselbe eine Sekunde",
    "Es geht halb so schnell — die Hälfte der Katalase ist verbraucht",
    "Es geht schneller — der Kolben ist jetzt erwärmt",
]
answer = 1
misconception = "'Used up' is the default assumption about anything that takes part in a reaction, and it is reinforced by the fact that a catalyst has to be added at all. The first and third options are both versions of it. What makes the demonstration convincing is repetition: one charge proves nothing, three identical charges destroyed at identical speed by the same speck of enzyme is hard to explain any other way. The last option is a real effect in a real flask — this decomposition is exothermic — and the bench does not model it, which the entry says rather than letting the option quietly pass as wrong for the wrong reason."
misconception_de = "'Verbraucht' ist die Standardannahme für alles, was an einer Reaktion teilnimmt, und sie wird dadurch verstärkt, dass ein Katalysator überhaupt erst zugegeben werden muss. Die erste und die dritte Option sind beide Spielarten davon. Was die Demonstration überzeugend macht, ist die Wiederholung: Eine einzelne Portion beweist nichts, drei identische, mit identischer Geschwindigkeit von demselben Enzymkrümelchen zerstörte Portionen lassen sich kaum anders erklären. Die letzte Option ist ein realer Effekt in einem realen Kolben — diese Zersetzung ist exotherm —, und das Labor modelliert ihn nicht, was der Eintrag auch so benennt, statt die Option stillschweigend aus dem falschen Grund als falsch durchgehen zu lassen."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Anything you add to a reaction is a reagent, and reagents get used up."
reveals_de = "Alles, was man einer Reaktion zugibt, sei ein Reagenz, und Reagenzien würden verbraucht."
next = "Add the third charge and watch it go at the same speed. Then ask what the catalase would have to be doing to survive being 'used up' twice."
next_de = "Die dritte Portion wird zugegeben und mit derselben Geschwindigkeit beobachtet. Dann wird gefragt, was die Katalase tun müsste, um zweimal 'verbraucht' zu überleben."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "A catalyst is partly consumed — spent in proportion to how much reaction it has driven, like a fuel."
reveals_de = "Ein Katalysator werde teilweise verbraucht — proportional zu der Reaktion, die er angetrieben hat, wie ein Treibstoff."
next = "Compare the numbers: 4.17 × 10⁻⁹ mol of catalase against 0.1 mol of peroxide per charge, twenty-four million peroxide molecules per enzyme molecule. Anything consumed in proportion would have run out in the first microsecond."
next_de = "Die Zahlen werden verglichen: 4,17 × 10⁻⁹ mol Katalase gegen 0,1 mol Peroxid pro Portion, vierundzwanzig Millionen Peroxidmoleküle pro Enzymmolekül. Alles, was proportional verbraucht würde, wäre schon in der ersten Mikrosekunde aufgebraucht gewesen."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "The flask is warming from an exothermic reaction, so the second charge should be faster."
reveals_de = "Der Kolben erwärme sich durch die exotherme Reaktion, sodass die zweite Portion schneller ablaufen müsste."
next = "Right physics, absent from this model. Check the thermometer: the bench holds the flask at 25.0 °C throughout, because no reaction enthalpy is wired into the rate engine. Worth knowing which of your correct predictions this lab cannot confirm."
next_de = "Physikalisch richtig, aber in diesem Modell nicht vorhanden. Das Thermometer wird geprüft: Das Labor hält den Kolben durchgehend bei 25,0 °C, weil keine Reaktionsenthalpie in den Geschwindigkeitsmotor eingebaut ist. Es lohnt sich zu wissen, welche der eigenen richtigen Vorhersagen dieses Labor nicht bestätigen kann."

[reaction.registers]
lv1 = "A speck of liver enzyme, too small to see properly, and a flask of peroxide. One second and the peroxide is gone. Add more peroxide: gone again, just as fast. Add more: gone again. The speck is still there and still working. It is not an ingredient — it is a doorway that the reaction goes through and leaves behind."
lv1_de = "Ein Krümelchen Leberenzym, eigentlich zu klein, um es richtig zu sehen, und ein Kolben mit Peroxid. Eine Sekunde, und das Peroxid ist verschwunden. Man gibt mehr Peroxid dazu: wieder verschwunden, genauso schnell. Noch mehr dazu: wieder verschwunden. Das Krümelchen ist immer noch da und arbeitet weiter. Es ist keine Zutat — es ist eine Tür, durch die die Reaktion hindurchgeht und die sie danach unverändert zurücklässt."
lv2 = "0.001 g of catalase is 4.16666667 × 10⁻⁹ mol at M ≈ 240 kDa. Each of the three 0.1 mol charges is destroyed in one second, 5.0000 × 10⁻² mol of reaction apiece, and the bench's inventory reports the same 4.16666667 × 10⁻⁹ mol of catalase after the third as before the first — identical to every digit it prints. Oxygen accumulates to 0.15 mol, three times the yield of one charge, as it must."
lv2_de = "0,001 g Katalase entsprechen bei M ≈ 240 kDa 4,16666667 × 10⁻⁹ mol. Jede der drei 0,1-mol-Portionen wird in einer Sekunde zerstört, je 5,0000 × 10⁻² mol Umsatz, und das Inventar des Labors meldet nach der dritten Portion dieselben 4,16666667 × 10⁻⁹ mol Katalase wie vor der ersten — bis auf die letzte Ziffer identisch. Der Sauerstoff sammelt sich auf 0,15 mol an, das Dreifache der Ausbeute einer einzelnen Portion, wie es sein muss."
lv3 = "The mechanism of the claim is worth seeing, because it is structural rather than numerical. `KineticReaction` keeps `catalysts` outside `reactants` and `products`; the integrator withdraws and deposits only what those two lists name, so a catalyst is never a term in the mass update and cannot drift. What it does instead is chosen fresh at every substep by `effective_activation_energy`, which scans the vessel for the best catalyst present and substitutes its barrier. Two honest gaps sit beside this. The bench does not model the heat of the decomposition, so a real flask that grows warm and accelerates is not what you see here. And a real enzyme is not indestructible: catalase denatures with heat, is inhibited, and turns over at a finite maximum rate that no barrier substitution can express — a Michaelis–Menten saturation this engine has no term for."
lv3_de = "Der Mechanismus hinter dieser Aussage lohnt einen Blick, denn er ist struktureller, nicht numerischer Natur. `KineticReaction` hält `catalysts` außerhalb von `reactants` und `products`; der Integrator entnimmt und liefert nur das, was diese beiden Listen benennen, sodass ein Katalysator niemals ein Term in der Massenbilanz ist und nicht abdriften kann. Was er stattdessen tut, wird bei jedem Teilschritt neu von `effective_activation_energy` bestimmt, die das Gefäß nach dem besten vorhandenen Katalysator durchsucht und dessen Barriere einsetzt. Zwei ehrliche Lücken stehen daneben. Das Labor modelliert die Wärme der Zersetzung nicht, sodass ein realer Kolben, der warm wird und dadurch schneller reagiert, hier nicht zu sehen ist. Und ein reales Enzym ist nicht unzerstörbar: Katalase denaturiert unter Hitze, kann gehemmt werden und arbeitet mit einer endlichen Maximalgeschwindigkeit um, die keine Barrieresubstitution ausdrücken kann — eine Michaelis-Menten-Sättigung, für die dieser Motor keinen Term besitzt."

[reaction.provenance]
source = "Standard curriculum treatment of catalysis; catalase molar mass ~240 kDa (bovine liver catalase, standard reference) via the Kerotakis species registry. Editorial judgement (Kerotakis): the three-charge protocol is our design, chosen because a single charge cannot distinguish an unconsumed catalyst from a generously supplied reagent. The absence of a reaction enthalpy and of enzyme saturation are stated gaps in the current engine, not claims about chemistry."
computed_by = "kerotakis-core kinetics (catalysts are excluded from the mass update by construction)"

