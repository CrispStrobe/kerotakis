[reaction.setup]
script = """
add v1 water 100mL
add v1 H2O2 0.1mol
add v1 MnO2 0.5g
wait 90s
wait 90s
wait 90s
wait 60min
"""

[reaction.expect]
events = ["reacted:peroxide-decomposition"]
absent = ["solver_failed"]

[reaction.expect.predict]
question = "0.1 mol of hydrogen peroxide over manganese dioxide at 25 °C. The first ninety seconds destroy 0.0501 mol — just over half. How much does the second ninety seconds destroy?"
question_de = "0,1 mol Wasserstoffperoxid über Mangandioxid bei 25 °C. Die ersten neunzig Sekunden zerstören 0,0501 mol — knapp über die Hälfte. Wie viel zerstören die zweiten neunzig Sekunden?"
options = [
  "0.0499 mol — the rest of it, at the same steady pace",
  "0.0250 mol — half of what is left, because the rate falls with the concentration",
  "0.0501 mol again — the reaction has a fixed speed until it runs out",
  "Nothing — it is finished",
]
options_de = [
    "0,0499 mol — der Rest, im selben gleichmäßigen Tempo",
    "0,0250 mol — die Hälfte des Verbliebenen, weil die Geschwindigkeit mit der Konzentration sinkt",
    "Wieder 0,0501 mol — die Reaktion hat eine feste Geschwindigkeit, bis sie ausgeht",
    "Nichts — sie ist beendet",
]
answer = 1
misconception = "The first and third options are the same misconception in two costumes: that a reaction has a speed the way a car has a speed, so a fixed time destroys a fixed amount. That is what zero order looks like, and it is rare. First order means the rate is proportional to what is left, so each equal interval removes an equal *fraction* — which is why the half-life is a constant and why the reaction has a long, thin tail rather than an end."
misconception_de = "Die erste und die dritte Option sind dasselbe Missverständnis in zwei Verkleidungen: dass eine Reaktion eine Geschwindigkeit hat wie ein Auto eine Geschwindigkeit hat, sodass eine feste Zeit eine feste Menge zerstört. So sieht nullte Ordnung aus, und die ist selten. Erste Ordnung bedeutet, dass die Geschwindigkeit proportional zur verbliebenen Menge ist, sodass jedes gleich lange Intervall einen gleichen *Anteil* entfernt — deshalb ist die Halbwertszeit konstant, und deshalb hat die Reaktion einen langen, dünnen Ausläufer statt eines Endes."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "The reaction has a speed in mol per minute, so it finishes the job in the next interval."
reveals_de = "Die Reaktion habe eine Geschwindigkeit in mol pro Minute, sodass sie im nächsten Intervall fertig werde."
next = "Add a fourth interval and a fifth. A fixed amount per interval would have hit zero and stopped; the bench is still removing measurable peroxide an hour later."
next_de = "Es wird ein viertes und ein fünftes Intervall hinzugefügt. Eine feste Menge pro Intervall wäre bei null angekommen und hätte aufgehört; das Labor entfernt eine Stunde später immer noch messbares Peroxid."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "The rate is fixed until the reagent is exhausted, at which point it stops — the zero-order picture, applied by default."
reveals_de = "Die Geschwindigkeit sei fest, bis das Reagenz erschöpft ist und die Reaktion dann stoppt — das Bild nullter Ordnung, standardmäßig angewendet."
next = "Plot the three amounts consumed: 0.0502, 0.0250, 0.0125. Equal amounts would be a straight line down to zero; equal fractions are a curve with a tail, and the difference is visible in three points."
next_de = "Die drei verbrauchten Mengen werden aufgetragen: 0,0502, 0,0250, 0,0125. Gleiche Mengen wären eine Gerade bis auf null; gleiche Anteile sind eine Kurve mit Ausläufer, und der Unterschied ist schon in drei Punkten sichtbar."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "Just over half went in the first interval, so the reaction is essentially over."
reveals_de = "Knapp über die Hälfte sei im ersten Intervall verschwunden, die Reaktion sei also im Wesentlichen vorbei."
next = "Read the remaining amount rather than the amount consumed: 0.0498 mol is still there, half of what you started with. 'Most of the change happened' and 'most of the material is gone' are different statements."
next_de = "Statt der verbrauchten Menge wird die verbliebene Menge abgelesen: 0,0498 mol sind noch da, die Hälfte der Ausgangsmenge. 'Der größte Teil der Veränderung ist geschehen' und 'der größte Teil des Materials ist weg' sind unterschiedliche Aussagen."

[reaction.registers]
lv1 = "Peroxide left alone slowly falls apart into water and oxygen. Five minutes takes away half of it. The next five minutes takes away half of what is left, not half of what you started with — so a quarter. Then an eighth. It never quite gets to nothing, which is why old peroxide is weak rather than empty."
lv1_de = "Sich selbst überlassenes Peroxid zerfällt langsam in Wasser und Sauerstoff. Fünf Minuten nehmen die Hälfte davon weg. Die nächsten fünf Minuten nehmen die Hälfte von dem weg, was übrig ist, nicht die Hälfte der Ausgangsmenge — also ein Viertel. Dann ein Achtel. Es kommt nie ganz bei null an, weshalb altes Peroxid schwach ist statt leer."
lv2 = "Successive ninety-second intervals consume 0.0501, 0.0250 and 0.0125 mol of peroxide, leaving 0.0499, 0.0249 and 0.0124 mol of the original 0.1 mol. Each interval leaves 49.9% of what it was given — the same fraction every time, which is what first order means. The half-life is therefore a constant, here about 90 s, and an hour later nothing measurable is left. The manganese dioxide is there to make the experiment finish inside a lesson: without it the half-life is about a day, which is the whole reason a catalyst is worth having."
lv2_de = "Aufeinanderfolgende Neunzig-Sekunden-Intervalle verbrauchen 0,0501, 0,0250 und 0,0125 mol Peroxid und lassen 0,0499, 0,0249 und 0,0124 mol der ursprünglichen 0,1 mol übrig. Jedes Intervall lässt 49,9 % dessen übrig, was es bekommen hat — jedes Mal derselbe Anteil, das bedeutet erste Ordnung. Die Halbwertszeit ist deshalb konstant, hier etwa 90 s, und eine Stunde später ist nichts Messbares mehr übrig. Das Mangandioxid sorgt dafür, dass das Experiment innerhalb einer Unterrichtsstunde fertig wird: Ohne es liegt die Halbwertszeit bei etwa einem Tag — genau deshalb lohnt sich ein Katalysator."
lv3 = "The constancy is the check, not the story. d[H₂O₂]/dt = −2k[H₂O₂] because the rate law is first order while the stoichiometric coefficient is 2, so [H₂O₂](t) = c₀·e^(−2kt) and t½ = ln2/(2k) — note the factor of two, which is exactly where order and coefficient are separate quantities and get conflated. Over manganese dioxide the barrier is 58 kJ/mol, giving k = 3.86 × 10⁻³ s⁻¹ at 298.15 K and t½ = 89.7 s, so a 90 s interval is a shade more than one half-life and leaves 49.9% rather than exactly 50% — recovered from the barrier rather than fitted to the observation. Note what the catalyst does *not* change: the fraction is still constant, because lowering the activation energy scales k without touching the order. This closed form is also the integrator's oracle — `kinetics.rs` checks its adaptive midpoint solver against e^(−2kt) rather than against another numerical method, which is how a 0.7% drift in the original explicit-Euler version was caught."
lv3_de = "Die Konstanz ist die Prüfung, nicht die eigentliche Geschichte. d[H₂O₂]/dt = −2k[H₂O₂], weil das Geschwindigkeitsgesetz erster Ordnung ist, während der stöchiometrische Koeffizient 2 beträgt, also [H₂O₂](t) = c₀·e^(−2kt) und t½ = ln2/(2k) — man beachte den Faktor zwei, genau dort, wo Ordnung und Koeffizient getrennte Größen sind und leicht verwechselt werden. Über Mangandioxid beträgt die Barriere 58 kJ/mol, was k = 3,86 × 10⁻³ s⁻¹ bei 298,15 K und t½ = 89,7 s ergibt, sodass ein 90-s-Intervall etwas mehr als eine Halbwertszeit ist und 49,9 % statt genau 50 % übrig lässt — aus der Barriere gewonnen, nicht an die Beobachtung angepasst. Bemerkenswert ist, was der Katalysator *nicht* verändert: Der Anteil bleibt konstant, weil das Senken der Aktivierungsenergie k skaliert, ohne die Ordnung anzutasten. Diese geschlossene Form dient dem Integrator auch als Referenz — `kinetics.rs` prüft seinen adaptiven Mittelpunkt-Solver gegen e^(−2kt) statt gegen ein anderes numerisches Verfahren, wodurch eine 0,7-prozentige Drift in der ursprünglichen expliziten Euler-Version entdeckt wurde."

[reaction.provenance]
source = "First-order kinetics per any standard physical chemistry text; the closed-form half-life is arithmetic on the curated rate constant. Editorial judgement (Kerotakis): the absolute half-life follows from a calibrated pre-exponential and is not a measured property of real hydrogen peroxide over real manganese dioxide — the constancy of the fraction is the claim here, not the number of seconds. The catalyst is present so the experiment fits in a lesson, and its amount changes nothing in this engine because surface area is not modelled."
computed_by = "kerotakis-core kinetics (midpoint integration, checked against the analytic first-order solution)"

# ===================================================== the experiment itself

[[reaction]]
id = "two-beakers-and-one-clock"
spine = ["erkenntnisgewinnung"]
summary = "Identical mixtures at 25 °C and 35 °C; one `wait 20s` advances both, and only the temperature differs — 4.3557 × 10⁻⁴ mol against 8.1256 × 10⁻⁴ mol"
summary_de = "Identische Mischungen bei 25 °C und 35 °C; ein `wait 20s` lässt beide gleichzeitig fortschreiten, und nur die Temperatur unterscheidet sich — 4,3557 × 10⁻⁴ mol gegen 8,1256 × 10⁻⁴ mol"
concepts = ["shared-clock"]
requires = ["fair-test", "temperature-and-rate"]
calculations = ["rate-from-extent"]
models = ["collision-theory"]
apparatus = ["beaker", "thermometer", "stopwatch", "water-bath"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 11/12, Reaktionsgeschwindigkeit und Katalyse"
ages = { min = 16.0, max = 18.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Oberstufe (ISB)"

[[reaction.curriculum]]
