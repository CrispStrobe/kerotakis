stage = "4.6 The rate and extent of chemical change"
ages = { min = 14.0, max = 16.0 }
source = "AQA GCSE Chemistry (8462) specification, examined from 2018"

[reaction.setup]
script = """
add v1 water 100mL
add v1 H2O2 0.1mol
add v1 catalase 0.001g
wait 1s
look v1
"""

[reaction.expect]
events = ["reacted:peroxide-decomposition", "observed"]
absent = ["gas_evolved:O2", "solver_failed"]

[reaction.expect.predict]
question = "Catalase destroys 0.1 mol of peroxide, releasing 0.05 mol of oxygen — roughly 1.2 litres, the demonstration's whole point. The bench reports bubbles rising. What can you do with that gas?"
question_de = "Katalase zerstört 0,1 mol Peroxid und setzt dabei 0,05 mol Sauerstoff frei — rund 1,2 Liter, der ganze Sinn der Demonstration. Das Labor meldet aufsteigende Bläschen. Was kannst du mit diesem Gas anfangen?"
options = [
  "Read its volume off the gas syringe, which is how the rate is measured",
  "See it, and nothing else — no volume is measurable here, and no gas-evolution event fires",
  "Nothing: bubbles are only a picture, so the oxygen is not really counted",
  "Collect and weigh it, since the balance tracks everything in the vessel",
]
options_de = [
    "Sein Volumen an der Gasspritze ablesen, so wird die Geschwindigkeit gemessen",
    "Es sehen, und sonst nichts — hier ist kein Volumen messbar, und kein Gasentwicklungs-Ereignis wird ausgelöst",
    "Nichts: Bläschen sind nur ein Bild, der Sauerstoff wird also nicht wirklich gezählt",
    "Es sammeln und wiegen, da die Waage alles im Gefäß erfasst",
]
answer = 1
misconception = "This one is not about chemistry, and pretending otherwise would be the dishonest move. The engine's bookkeeping is right — 0.05 mol of O₂ is exactly half the peroxide, and it is there in the vessel and now visible as bubbles. What is still missing is downstream: there is no gas syringe, no volume reading, and the rate engine deposits products into a phase without raising the `gas_evolved` event the aqueous and thermal solvers raise. So the practical's actual measurement — millilitres against seconds — cannot be taken. A simulation has a model layer and a presentation layer and they fail independently, which is worth knowing about any simulation you are handed."
misconception_de = "Hier geht es nicht um Chemie, und etwas anderes zu behaupten wäre der unehrliche Weg. Die Buchführung des Motors stimmt — 0,05 mol O₂ ist genau die Hälfte des Peroxids, es ist im Gefäß vorhanden und nun als Bläschen sichtbar. Was noch fehlt, liegt weiter unten in der Kette: Es gibt keine Gasspritze, keine Volumenanzeige, und der Kinetikmotor lagert Produkte in eine Phase ein, ohne das `gas_evolved`-Ereignis auszulösen, das die wässrigen und thermischen Solver auslösen. Die eigentliche Messung des Experiments — Milliliter gegen Sekunden — lässt sich deshalb nicht vornehmen. Eine Simulation besitzt eine Modellschicht und eine Darstellungsschicht, und diese können unabhängig voneinander versagen — das lohnt sich bei jeder Simulation zu wissen, die man in die Hand bekommt."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Whatever a real practical measures, the simulation must measure too — if the chemistry is right, the instruments must be there."
reveals_de = "Was ein echtes Experiment misst, müsse auch die Simulation messen — sei die Chemie richtig, müssten auch die Instrumente vorhanden sein."
next = "Separate the two. Read the vessel's inventory (0.05 mol of O₂, correct to the last digit), then ask what instrument would give you a number from it. Apparatus is a modelling decision, and this bench has not made it yet."
next_de = "Die beiden Ebenen werden getrennt. Das Inventar des Gefäßes wird abgelesen (0,05 mol O₂, korrekt bis zur letzten Ziffer), dann wird gefragt, welches Instrument daraus eine Zahl liefern würde. Apparatur ist eine Modellierungsentscheidung, und dieses Labor hat sie noch nicht getroffen."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "A picture is decoration, so anything you can only see is not really in the model."
reveals_de = "Ein Bild sei bloß Dekoration, alles, was man nur sehen kann, sei also nicht wirklich im Modell enthalten."
next = "The opposite of the first mistake, and just as wrong. Ask the vessel what it holds: the oxygen is there to the last digit, and the bubbles are drawn *from* that number rather than instead of it."
next_de = "Das Gegenteil des ersten Fehlers, und ebenso falsch. Man fragt das Gefäß, was es enthält: Der Sauerstoff ist bis zur letzten Ziffer vorhanden, und die Bläschen werden *aus* dieser Zahl gezeichnet, nicht anstelle von ihr."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "Any change in the flask should show up as a change in what you see, and oxygen is faintly blue in bulk."
reveals_de = "Jede Veränderung im Kolben müsse sich in dem zeigen, was man sieht, und Sauerstoff sei in großer Menge schwach bläulich."
next = "True of liquid oxygen at −183 °C and irrelevant here. The bench computes colour from curated absorption spectra, and oxygen gas at 1 atm has none worth the name — so this is the rare case where 'no colour change' is the right answer for the right reason."
next_de = "Zutreffend für flüssigen Sauerstoff bei −183 °C, aber hier belanglos. Das Labor berechnet Farbe aus kuratierten Absorptionsspektren, und Sauerstoffgas bei 1 atm hat kein nennenswertes — dies ist also der seltene Fall, in dem 'keine Farbänderung' die richtige Antwort aus dem richtigen Grund ist."

[reaction.registers]
lv1 = "The flask is full of oxygen — enough to fill a large drinks bottle — and you can see it bubbling up through the liquid. What you cannot do is measure it. In a real lab you would push the gas into a syringe and read off how many millilitres arrive each ten seconds, and that reading *is* the experiment. This lab has not been given a gas syringe yet. Knowing which part of an answer is the calculation and which part is the equipment is a useful habit to have about any simulation."
lv1_de = "Der Kolben ist voller Sauerstoff — genug, um eine große Getränkeflasche zu füllen —, und du siehst ihn durch die Flüssigkeit aufsteigen. Was du nicht kannst, ist ihn zu messen. In einem echten Labor würdest du das Gas in eine Spritze drücken und ablesen, wie viele Milliliter alle zehn Sekunden ankommen, und genau diese Ablesung *ist* das Experiment. Dieses Labor hat noch keine Gasspritze bekommen. Zu wissen, welcher Teil einer Antwort die Berechnung ist und welcher die Ausrüstung, ist eine nützliche Gewohnheit im Umgang mit jeder Simulation."
lv2 = "The vessel holds 5.0000 × 10⁻² mol of O₂ in the gas phase after one second, which is 1.6 g and, as an ideal gas at 25 °C and 1 atm, about 1.22 L. `look` now reports bubbles rising through the liquid. What it cannot report is a volume: there is no gas-collection apparatus, and no `gas_evolved` event either, because the rate engine deposits its products into a phase while only the aqueous and thermal solvers raise gas-evolution events. The quantity is exact and the measurement is missing."
lv2_de = "Das Gefäß enthält nach einer Sekunde 5,0000 × 10⁻² mol O₂ in der Gasphase, das sind 1,6 g und, als ideales Gas bei 25 °C und 1 atm, etwa 1,22 L. `look` meldet nun Bläschen, die durch die Flüssigkeit aufsteigen. Was es nicht melden kann, ist ein Volumen: Es gibt keine Gasauffangvorrichtung und auch kein `gas_evolved`-Ereignis, weil der Kinetikmotor seine Produkte in eine Phase einlagert, während nur die wässrigen und thermischen Solver Gasentwicklungsereignisse auslösen. Die Menge ist exakt, und die Messung fehlt."
lv3 = "`appearance::observe` builds three things — a transmitted colour from Beer–Lambert over curated ε(λ), a cloudiness from suspended solid per litre, and a deposit — and then sets `bubbling: false` as a literal, with the struct field documented as 'whether anything is visibly not-liquid-not-settled'. So the field exists, the data to fill it exists in the vessel's gas-phase portions, and the connection between them has not been made. This is a renderer gap rather than a modelling one, which puts it in a different category from the rest of this file: it is cheap to close, it costs no chemistry, and it currently makes the single most visual practical in school kinetics invisible. Stated here so that nobody builds a lesson around watching a flask fizz until it is."
lv3_de = "`appearance::observe` erzeugt drei Dinge — eine transmittierte Farbe nach Beer-Lambert über kuratierte ε(λ), eine Trübung aus suspendiertem Feststoff pro Liter und einen Bodensatz — und setzt dann `bubbling: false` als festen Wert, wobei das Struct-Feld dokumentiert ist als 'ob irgendetwas sichtbar nicht-flüssig-nicht-abgesetzt ist'. Das Feld existiert also, die Daten, um es zu füllen, existieren in den Gasphasen-Anteilen des Gefäßes, und die Verbindung zwischen beidem wurde noch nicht hergestellt. Das ist eine Lücke im Renderer, keine im Modell, was sie in eine andere Kategorie stellt als den Rest dieser Datei: Sie ist billig zu schließen, kostet keine Chemie, und macht derzeit das visuell eindrucksvollste Experiment der Schulkinetik unsichtbar. Hier festgehalten, damit niemand eine Unterrichtsstunde darauf aufbaut, einen sprudelnden Kolben zu beobachten, bevor das behoben ist."

[reaction.provenance]
source = "Editorial judgement (Kerotakis): this entry is a claim about the current renderer, not about chemistry. The molar volume used to convert 0.05 mol to 1.22 L is ideal-gas arithmetic at 298.15 K and 101325 Pa, performed here rather than by the engine."
computed_by = "kerotakis-core kinetics for the oxygen; kerotakis-core::appearance for the description"

# ================================================ thermodynamics and kinetics

[[reaction]]
id = "same-destination-different-journey"
spine = ["kinetik"]
equation = "2 H₂O₂ → 2 H₂O + O₂↑"
concepts = ["kinetic-versus-thermodynamic-outcome"]
requires = ["catalysis", "thermodynamic-versus-kinetic"]
calculations = ["rate-from-extent"]
models = ["activation-energy", "collision-theory"]
apparatus = ["conical-flask", "gas-syringe", "stopwatch"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 11/12, Reaktionsgeschwindigkeit und Katalyse"
ages = { min = 16.0, max = 18.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Oberstufe (ISB)"

[reaction.setup]
script = """
add v1 water 100mL
add v1 H2O2 0.1mol
new
add v2 water 100mL
add v2 H2O2 0.1mol
add v2 catalase 0.001g
wait 1s
look v1
look v2
wait 120h
look v1
look v2
"""

[reaction.expect]
events = ["reacted:peroxide-decomposition", "observed"]
absent = ["solver_failed"]

[reaction.expect.predict]
question = "Two flasks of peroxide, one with catalase. After one second the catalysed flask is finished and the other has lost 0.2%. Two hours later, what is in them?"
question_de = "Zwei Kolben mit Peroxid, einer mit Katalase. Nach einer Sekunde ist der katalysierte Kolben fertig, der andere hat 0,2 % verloren. Was ist zwei Stunden später in ihnen enthalten?"
options = [
  "The catalysed flask holds more oxygen — the catalyst made more reaction happen",
  "The same thing: 0.05 mol of oxygen in each. The catalyst changed when, not whether or how much",
  "The plain flask still holds most of its peroxide — without a catalyst the reaction does not go",
  "The catalysed flask has started to reverse, since the catalyst works both ways",
]
options_de = [
    "Der katalysierte Kolben enthält mehr Sauerstoff — der Katalysator hat mehr Reaktion bewirkt",
    "Dasselbe: 0,05 mol Sauerstoff in jedem. Der Katalysator hat verändert, wann, nicht ob oder wie viel",
    "Der unbehandelte Kolben enthält noch die meiste Menge seines Peroxids — ohne Katalysator läuft die Reaktion nicht",
    "Der katalysierte Kolben hat begonnen, sich umzukehren, da der Katalysator in beide Richtungen wirkt",
]
answer = 1
misconception = "The first option is the most common thing learners believe about catalysts and it is a claim about *yield*, which is the one thing a catalyst cannot touch. A catalyst lowers the barrier equally in both directions, so it moves the system towards equilibrium faster and moves equilibrium not at all. The third option is the mirror error — treating a barrier as a prohibition. The barrier here is 75 kJ/mol, which is enough to make one second look like nothing happening and not nearly enough to survive five days."
misconception_de = "Die erste Option ist das, was Lernende am häufigsten über Katalysatoren glauben, und sie ist eine Aussage über die *Ausbeute* — das Einzige, was ein Katalysator nicht anrühren kann. Ein Katalysator senkt die Barriere in beide Richtungen gleichermaßen, er bringt das System also schneller zum Gleichgewicht, verschiebt das Gleichgewicht aber überhaupt nicht. Die dritte Option ist der gespiegelte Fehler — eine Barriere als Verbot zu behandeln. Die Barriere beträgt hier 75 kJ/mol, genug, damit eine Sekunde wie nichts Geschehenes aussieht, aber bei Weitem nicht genug, um fünf Tage zu überstehen."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "A catalyst increases the yield — more reaction happens because the catalyst helped it happen."
reveals_de = "Ein Katalysator erhöhe die Ausbeute — mehr Reaktion finde statt, weil der Katalysator dabei geholfen habe."
next = "Count the oxygen in both flasks at the end: 0.0500 mol in the catalysed one, 0.0485 mol in the plain one and still climbing toward the same figure. Then ask what a catalyst could possibly change about a mass balance."
next_de = "Der Sauerstoff in beiden Kolben wird am Ende gezählt: 0,0500 mol im katalysierten, 0,0485 mol im unbehandelten und weiter auf denselben Wert zusteigend. Dann wird gefragt, was ein Katalysator überhaupt an einer Massenbilanz ändern könnte."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Without a catalyst the reaction does not occur — the barrier is a prohibition rather than a delay."
reveals_de = "Ohne Katalysator finde die Reaktion nicht statt — die Barriere sei ein Verbot, keine Verzögerung."
next = "Look at the plain flask at 1 s and at five days: 0.1000 mol left, then 0.0030 mol. The same barrier that makes one second look like nothing lets five days very nearly finish the job. \u201cToo slow to see\u201d and \u201cdoes not happen\u201d are different states, and only one of them is settled by thermodynamics."
next_de = "Der unbehandelte Kolben wird bei 1 s und bei fünf Tagen betrachtet: 0,1000 mol übrig, dann 0,0030 mol. Dieselbe Barriere, die eine Sekunde wie nichts aussehen lässt, lässt fünf Tage die Sache fast vollständig zu Ende bringen. „Zu langsam, um es zu sehen“ und „passiert nicht“ sind unterschiedliche Zustände, und nur einer von beiden wird von der Thermodynamik entschieden."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "A catalyst drives a reaction, so with nothing left to drive it should push the other way."
reveals_de = "Ein Katalysator treibe eine Reaktion an, sodass er, wenn nichts mehr anzutreiben sei, in die andere Richtung schieben müsste."
next = "A catalyst lowers the barrier equally in both directions, so it accelerates the approach to equilibrium and cannot shift it. This decomposition's equilibrium lies essentially all the way over — there is nothing to come back to."
next_de = "Ein Katalysator senkt die Barriere in beide Richtungen gleichermaßen, er beschleunigt also die Annäherung an das Gleichgewicht und kann es nicht verschieben. Das Gleichgewicht dieser Zersetzung liegt im Wesentlichen ganz auf der einen Seite — es gibt nichts, wohin man zurückkehren könnte."

[reaction.registers]
lv1 = "Two flasks, and only one has the enzyme. After a second the enzyme's flask is finished and the other looks untouched. Come back in five days and the slow one has very nearly caught up: both are turning into water and oxygen, and both end in the same place. The enzyme did not decide what would happen. It decided how long you would have to wait — one second against the better part of a week."
lv1_de = "Zwei Kolben, und nur einer enthält das Enzym. Nach einer Sekunde ist der Kolben mit dem Enzym fertig, der andere sieht unberührt aus. Schaut man nach fünf Tagen wieder vorbei, hat der langsame fast aufgeholt: Beide werden zu Wasser und Sauerstoff, und beide enden am selben Ort. Das Enzym hat nicht entschieden, was passiert. Es hat entschieden, wie lange man warten muss — eine Sekunde gegen fast eine ganze Woche."
lv2 = "After 1 s: 0.1000 mol of peroxide still in the plain flask — the reaction has run 4 × 10⁻⁷ mol, which the bench will not even report — against effectively zero in the catalysed one, which already holds its full 0.0500 mol of oxygen. Five days later the plain flask has reached 0.0485 mol of oxygen with 0.0030 mol of peroxide still to go. Same destination; one of them took a second and the other is still arriving."
lv2_de = "Nach 1 s: 0,1000 mol Peroxid immer noch im unbehandelten Kolben — die Reaktion ist um 4 × 10⁻⁷ mol vorangeschritten, was das Labor nicht einmal meldet — gegenüber praktisch null im katalysierten, der schon seine vollen 0,0500 mol Sauerstoff enthält. Fünf Tage später hat der unbehandelte Kolben 0,0485 mol Sauerstoff erreicht, mit noch 0,0030 mol Peroxid übrig. Dasselbe Ziel; der eine brauchte eine Sekunde, der andere kommt immer noch an."
lv3 = "This is the distinction `thermodynamische-vs-kinetische-kontrolle` is built on, met from the kinetics side rather than the equilibrium side, and the engine embodies both halves in different places. On the thermodynamic side it withholds tenorite below 340 K and stands the thermal solver down below 500 K — curated stand-ins for rates it could not compute. Here the rate is computed, so the same idea appears as an interval rather than as a threshold: nothing is suppressed, and 'it has not happened yet' is a state the vessel can be in and then leave. The pre-exponential is calibrated so that undisturbed peroxide has a half-life near a day: long enough that nothing happens while you watch, which is the point, and still far shorter than real stabilised 3% peroxide in a brown bottle, which keeps for months. So the *shape* of the argument is right and the shelf-life is not a measurement."
lv3_de = "Das ist die Unterscheidung, auf der `thermodynamische-vs-kinetische-kontrolle` aufbaut, hier von der Seite der Kinetik statt der des Gleichgewichts betrachtet, und der Motor verkörpert beide Hälften an unterschiedlichen Stellen. Auf der thermodynamischen Seite hält er Tenorit unterhalb von 340 K zurück und stellt den thermischen Solver unterhalb von 500 K ab — kuratierte Platzhalter für Geschwindigkeiten, die er nicht berechnen konnte. Hier wird die Geschwindigkeit berechnet, sodass dieselbe Idee als Intervall statt als Schwelle erscheint: Nichts wird unterdrückt, und 'es ist noch nicht passiert' ist ein Zustand, in dem das Gefäß sein und den es dann verlassen kann. Der präexponentielle Faktor ist so kalibriert, dass ungestörtes Peroxid eine Halbwertszeit von rund einem Tag hat: lang genug, dass beim Zuschauen nichts passiert — das ist der Sinn —, und immer noch weit kürzer als echtes stabilisiertes 3-prozentiges Peroxid in einer braunen Flasche, das sich monatelang hält. Die *Form* des Arguments stimmt also, aber die Haltbarkeit ist keine Messung."

[reaction.provenance]
source = "Standard curriculum treatment of catalysis and of kinetic versus thermodynamic control. Editorial judgement (Kerotakis): the five-day comparison is our design, and so is the pre-exponential behind it — chosen so undisturbed peroxide has a half-life near a day, which reads as clearly-nothing on a lesson timescale. Real stabilised 3% peroxide keeps for months, so the shape of the argument is right and the shelf-life is not a measurement."
