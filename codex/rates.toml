summary_de = "0,001 g Katalase zerstört drei aufeinanderfolgende 0,1-mol-Portionen Peroxid, jede innerhalb einer Sekunde, und liegt am Ende immer noch bei 4,16666667 × 10⁻⁹ mol"
concepts = ["catalyst-not-consumed"]
