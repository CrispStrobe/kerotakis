[[reaction]]
id = "a-steeper-barrier-breaks-the-rule-of-thumb"
spine = ["die-reaktionsgeschwindigkeit"]
equation = "2 H₂O₂ → 2 H₂O + O₂↑"
concepts = ["activation-energy"]
requires = ["arrhenius-equation"]
calculations = ["arrhenius-ratio"]
models = ["activation-energy", "collision-theory"]
apparatus = ["conical-flask", "water-bath", "thermometer", "stopwatch"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 11/12, Reaktionsgeschwindigkeit und Katalyse"
ages = { min = 16.0, max = 18.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Oberstufe (ISB)"

[[reaction.curriculum]]
system = "england-gcse-combined-science"
stage = "4.6 The rate and extent of chemical change"
ages = { min = 14.0, max = 16.0 }
source = "AQA GCSE Chemistry (8462) specification, examined from 2018"

[reaction.setup]
script = """
add v1 water 100mL @ 25C
add v1 H2O2 0.1mol @ 25C
new
add v2 water 100mL @ 35C
add v2 H2O2 0.1mol @ 35C
new
add v3 water 100mL @ 45C
add v3 H2O2 0.1mol @ 45C
wait 30min
"""

[reaction.expect]
events = ["reacted:peroxide-decomposition", "temperature_changed"]
absent = ["solver_failed"]
temperature_c = { min = 24.5, max = 25.5 }

[reaction.expect.predict]
question = "The thiosulfate clock speeds up by 1.90 per ten degrees. Hydrogen peroxide decomposing on its own has a much steeper barrier — 75 kJ/mol against 51. Warm it by ten degrees. What happens to its rate?"
options = [
  "It also roughly doubles — the ten-degree rule applies to reactions, not to barriers",
  "It rises by about 2.6 — a steeper barrier is more sensitive to temperature",
  "It rises by less than two — a harder reaction is harder to speed up",
  "Nothing measurable — the barrier is too high for ten degrees to matter",
]
answer = 1
misconception = "The third option is the intuitive one and it has the physics backwards. A high barrier does not make a reaction sluggish to warm; it makes it *more* responsive, because the fraction of collisions clearing the barrier is an exponential in Ea/RT and a bigger Ea steepens that exponential. The first option is the rule of thumb mistaken for a law of nature. Both are cured by the same observation: the temperature sensitivity is a property of the barrier, and that is the only thing that changed between these two experiments."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "The ten-degree rule is a property of temperature, so it applies to every reaction alike."
next = "Put the two experiments side by side: same integrator, same clock, same ten degrees, factors of 1.90 and 2.62. The only thing that differs between them is Ea, so Ea is what the factor depends on."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "A high barrier means a stubborn reaction, and stubborn things respond less to being pushed."
next = "Look at where Ea sits in the equation — inside the exponent, divided by RT. Try Ea = 150 kJ/mol in the same arithmetic: the ten-degree factor is over 6. Sensitivity and speed are different questions, and this is the cleanest place to separate them."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "A barrier of 75 kJ/mol is a wall, so ten degrees of thermal energy cannot matter."
next = "Compare 75 kJ/mol against RT at 298 K, which is 2.5 kJ/mol. The barrier is thirty times the average thermal energy and the reaction still runs — because it is the tail of the distribution that reacts, not the average."

[reaction.registers]
lv1 = "The same ten degrees does not buy the same speed-up for every reaction. For the sulfur clock it was about double. For peroxide breaking down on its own it is about two and a half times — because peroxide's reaction is harder to start, and anything hard to start is more grateful for the extra warmth."
lv2 = "Three beakers of 0.1 mol of peroxide at 25, 35 and 45 °C, left for thirty minutes. The extents are 0.0007, 0.0019 and 0.0047 mol — factors of about 2.7 and 2.5 for each ten degrees, against 1.90 for the thiosulfate clock. The only thing that differs is the activation energy: 75 kJ/mol here against 51 there. Note also that thirty minutes is needed to see anything at all, where the clock reaction was over in under a minute — a steeper barrier means both a slower reaction and a more temperature-sensitive one, and those are separate consequences of the same number."
lv3 = "The ratio is exp[(Ea/R)(1/T₁ − 1/T₂)], so for Ea = 75 kJ/mol the pure Arrhenius factors across these steps are 2.67 and 2.51. The measured extents give 2.71 and 2.47: the first sits a hair high on rounding, the second a little low because the hottest beaker has begun to run out of peroxide and an extent over thirty minutes is no longer a clean proxy for an initial rate. That gap is the reason initial-rate methods exist, and it is visible here rather than described. The ten-degree rule corresponds to Ea ≈ 50 kJ/mol at room temperature, which is why the thiosulfate clock obeys it and this does not — the rule is a coincidence of one barrier height, not a law."

[reaction.provenance]
source = "Uncatalysed hydrogen peroxide decomposition Ea ≈ 75 kJ/mol (standard physical chemistry texts); Arrhenius, 1889. Editorial judgement (Kerotakis): the side-by-side comparison of two curated activation energies as a way of showing the ten-degree rule's domain is ours; the pre-exponential for peroxide is calibrated rather than measured, so only the ratios here are load-bearing."
computed_by = "kerotakis-core kinetics"

# ================================================================= catalysis

[[reaction]]
id = "three-beakers-of-peroxide"
spine = ["katalyse"]
equation = "2 H₂O₂ → 2 H₂O + O₂↑"
concepts = ["catalysis"]
requires = ["activation-energy"]
calculations = ["rate-from-extent"]
models = ["activation-energy", "collision-theory"]
apparatus = ["conical-flask", "gas-syringe", "spatula", "stopwatch"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 11/12, Reaktionsgeschwindigkeit und Katalyse"
ages = { min = 16.0, max = 18.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Oberstufe (ISB)"

[[reaction.curriculum]]
system = "england-national-curriculum"
stage = "KS3 Chemistry, Chemical reactions — what catalysts do"
ages = { min = 11.0, max = 14.0 }
source = "Department for Education, National curriculum in England: science programmes of study, KS3 Chemistry (DfE-00182-2013, updated 2014)"

[reaction.setup]
script = """
add v1 water 100mL
add v1 H2O2 0.1mol
new
add v2 water 100mL
add v2 H2O2 0.1mol
add v2 MnO2 0.5g
new
add v3 water 100mL
add v3 H2O2 0.1mol
add v3 catalase 0.001g
wait 1s
"""

[reaction.expect]
events = ["reacted:peroxide-decomposition"]
absent = ["solver_failed"]

[reaction.expect.predict]
question = "Three flasks of 1 mol/L hydrogen peroxide. One is left alone, one gets half a gram of manganese dioxide, one gets a milligram of catalase from liver. After one second, how much peroxide is left in each?"
options = [
  "Roughly the same in all three — one second is not long enough for anything",
  "99.8%, 11%, and none at all",
  "99.8%, 50%, and 25% — each catalyst roughly halves what is left",
  "None in any of them — a catalyst makes the reaction happen, and it was going to happen anyway",
]
answer = 1
misconception = "The third option treats catalysts as things that come in ordinary sizes, a few times better than nothing. The whole point of the pairing is that they do not: the enzyme is not a bit better than the mineral, it is about a million times better, because the two differ by 35 kJ/mol in the exponent and the exponent is where speed lives. The last option is the older confusion — that a catalyst decides *whether* a reaction happens. It does not. All three flasks end up as water and oxygen; the catalyst only decides when."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "One second is too short for chemistry — reactions happen on the timescale of a lesson."
next = "Ask what sets the timescale. The catalysed flask finishes inside ten milliseconds; nothing about a second is short or long until an activation energy says so."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Catalysts are graded like everything else in a school lab: better, much better, a few times better."
next = "Put the barriers on a diagram: 75, 58, 23 kJ/mol, and the speed-up is exponential in the difference. Between the mineral and the enzyme lies a factor of a million, which is not a difference of degree that anyone's intuition delivers unaided."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "A catalyst is what makes the reaction go; without one it would not happen at all."
next = "Leave the plain flask alone for five days (`same-destination-different-journey`). It arrives at the same place, 0.0485 mol of oxygen and still climbing toward 0.0500. The catalyst decided when, not whether."

[reaction.registers]
lv1 = "Three flasks of the same peroxide. Leave one alone and after a second it has barely changed. Drop in a spatula of black powder and nine tenths of it has already gone. Drop in a speck of liver enzyme — a thousandth of a gram — and it is over before you have put the bottle down. Same liquid, same room, same second."
lv2 = "Activation energies of 75, 58 and 23 kJ/mol for none, manganese dioxide and catalase. After one second the plain flask has done nothing the bench will even report — 4 × 10⁻⁷ mol of reaction, below the observable floor — while manganese dioxide has done 4 × 10⁻⁴ mol and catalase has finished, 5.0000 × 10⁻² mol, every molecule of peroxide gone. The peroxide left reads 0.1000, 0.0992 and 0.0000 mol. Same reaction, same temperature, same thermodynamics; three barriers."
lv3 = "The speed-ups are exponential in the difference between barriers and depend on nothing else, which is why they are the durable numbers here while the absolute times are not. exp[(75 − 58) kJ·mol⁻¹ / RT] = 951 at 298.15 K, and exp[(58 − 23)/RT] = 1.36 × 10⁶ — so the mineral is about a thousand times better than nothing and the enzyme about a million times better than the mineral. Read the rates rather than the extents to see it: once a catalysed vessel saturates within the interval, its extent is bounded by the peroxide and no longer reports a rate at all. The pre-exponential is calibrated rather than measured, so the seconds are indicative; the ratios are not, because A cancels."

[reaction.provenance]
source = "Ea ≈ 58 kJ/mol for manganese dioxide and ≈ 23 kJ/mol for catalase on hydrogen peroxide (standard physical chemistry texts); uncatalysed ≈ 75 kJ/mol. Editorial judgement (Kerotakis): modelling catalysis as a substituted activation energy rather than a rate multiplier is an engine decision recorded in `kinetics.rs`; the exponential speed-up factors quoted at lv3 are arithmetic performed on those curated barriers, not separately measured values."
computed_by = "kerotakis-core kinetics"

