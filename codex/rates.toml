[reaction.setup]
script = """
add v1 water 100mL
add v1 Na2S2O3 0.79g
add v1 HCl 0.002mol
new
add v2 water 100mL
add v2 HCl 0.002mol
new
add v3 water 100mL
add v3 Na2S2O3 0.79g
measure v3 ph
"""

[reaction.expect]
events = ["not_yet_modelled", "added:Na2S2O3"]
absent = ["solver_failed", "dissolved:Na2S2O3"]
ph = { min = 1.70, max = 1.80 }

[reaction.expect.predict]
question = "Sodium thiosulfate is a salt of a weak acid, so a solution of it should be slightly alkaline. What does this bench report for 0.79 g of it in 100 mL of pure water?"
question_de = "Natriumthiosulfat ist das Salz einer schwachen Säure, eine Lösung davon sollte also leicht alkalisch sein. Was meldet dieses Labor für 0,79 g davon in 100 mL reinem Wasser?"
options = [
  "About pH 8.5, as the chemistry requires",
  "pH 7.00 — it treats the salt as neutral",
  "Nothing at all: no solver can speciate thiosulfate, so no solution is characterised and the pH meter reads nothing",
  "It refuses to add the salt",
]
options_de = [
    "Etwa pH 8,5, wie es die Chemie verlangt",
    "pH 7,00 — es behandelt das Salz als neutral",
    "Überhaupt nichts: Kein Solver kann Thiosulfat speziieren, also wird keine Lösung charakterisiert, und das pH-Meter zeigt nichts an",
    "Es weigert sich, das Salz zuzugeben",
]
answer = 2
misconception = "The second option is what most software would do and is the failure this bench is built to avoid: a plausible number with nothing behind it. Thiosulfate is absent from every PHREEQC database we ship, so there is no equilibrium constant to compute a pH from. The bench therefore says so, and the salt sits in the vessel without a solution around it. The first option is the right chemistry — S₂O₃²⁻ is the conjugate base of a weak acid and a real solution is mildly alkaline — which makes the gap a real one rather than a technicality."
misconception_de = "Die zweite Option ist das, was die meiste Software tun würde, und genau dieses Versagen soll dieses Labor vermeiden: eine plausible Zahl ohne jede Grundlage. Thiosulfat fehlt in jeder PHREEQC-Datenbank, die wir ausliefern, es gibt also keine Gleichgewichtskonstante, aus der sich ein pH-Wert berechnen ließe. Das Labor sagt das deshalb offen, und das Salz liegt im Gefäß, ohne dass eine Lösung um es herum charakterisiert wird. Die erste Option ist die richtige Chemie — S₂O₃²⁻ ist die konjugierte Base einer schwachen Säure, und eine echte Lösung ist leicht alkalisch —, was die Lücke real macht und nicht bloß zu einer Formsache."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "The software knows the chemistry, so it will give the chemically correct answer."
reveals_de = "Die Software kenne die Chemie und liefere deshalb die chemisch korrekte Antwort."
next = "Ask where such an answer would come from. A pH needs an equilibrium constant, and no shipped database carries one for thiosulfate. Software knows what its data knows."
next_de = "Es wird gefragt, woher eine solche Antwort überhaupt kommen sollte. Ein pH-Wert braucht eine Gleichgewichtskonstante, und keine ausgelieferte Datenbank führt eine für Thiosulfat. Software weiß nur, was ihre Daten wissen."

[[reaction.expect.predict.diagnosis]]
option = 1
reveals = "Where a program has nothing to say it defaults to the neutral, unremarkable value."
reveals_de = "Wo ein Programm nichts zu sagen habe, falle es auf den neutralen, unauffälligen Wert zurück."
next = "This is the answer to watch for in any tool: a plausible number with nothing behind it, indistinguishable from a computed one. Compare with the same bench's `when-the-lab-says-it-does-not-know` — the design commitment is to say nothing rather than to say 7."
next_de = "Genau davor sollte man sich bei jedem Werkzeug hüten: eine plausible Zahl ohne jede Grundlage, nicht zu unterscheiden von einer tatsächlich berechneten. Zum Vergleich der Eintrag `when-the-lab-says-it-does-not-know` desselben Labors — die Entwurfsentscheidung lautet, lieber nichts zu sagen als 7 zu sagen."

[[reaction.expect.predict.diagnosis]]
option = 3
reveals = "A model that cannot handle something should refuse to proceed."
reveals_de = "Ein Modell, das etwas nicht abbilden kann, sollte die Ausführung verweigern."
next = "Notice what would be lost: the salt would be unusable, and its rate chemistry — which the engine models perfectly well — would go with it. The useful move is to accept the substance and name precisely which downstream numbers it invalidates."
next_de = "Es wird bemerkt, was dabei verloren ginge: Das Salz wäre unbrauchbar, und seine Kinetik — die der Motor durchaus gut modelliert — ginge mit verloren. Der nützlichere Weg ist, den Stoff zu akzeptieren und genau zu benennen, welche nachgelagerten Werte er ungültig macht."

[reaction.registers]
lv1 = "Some things this lab knows how to think about, and some it does not. It can hold this salt, dissolve it and let it react — but if you ask what it does to the acidity, it tells you plainly that it has no way to work that out. That is a better answer than a confident number nobody checked."
lv1_de = "Manches weiß dieses Labor zu bedenken, manches nicht. Es kann dieses Salz aufnehmen, es auflösen und reagieren lassen — aber fragst du, was es mit der Säure macht, sagt es dir offen, dass es das nicht herausfinden kann. Das ist eine bessere Antwort als eine selbstsichere Zahl, die niemand überprüft hat."
lv2 = "The acid beaker reads pH 1.74858175066. The beaker with thiosulfate *and* the same acid reads pH 1.74858175066 — identical to twelve figures, because the thiosulfate contributes nothing to the charge balance or the ionic strength (0.02006 mol/kgw in both). The third beaker, thiosulfate in pure water, has no characterised solution at all: the salt stays in the vessel as a solid and the pH meter reports that it has nothing to read."
lv2_de = "Das Säure-Becherglas zeigt pH 1,74858175066. Das Becherglas mit Thiosulfat *und* derselben Säure zeigt pH 1,74858175066 — identisch bis zur zwölften Stelle, weil das Thiosulfat weder zur Ladungsbilanz noch zur Ionenstärke etwas beiträgt (0,02006 mol/kgw in beiden). Das dritte Becherglas, Thiosulfat in reinem Wasser, hat überhaupt keine charakterisierte Lösung: Das Salz bleibt als Feststoff im Gefäß, und das pH-Messgerät meldet, dass es nichts abzulesen gibt."
lv3 = "The species registry marks sodium thiosulfate `dissolves_without_speciation`, and the bench raises `NotYetModeled` every time it is added, naming exactly what is affected: the pH and the ionic strength are for everything else in the beaker. This is not cosmetic — it was earned by two bugs that only a rate model could have exposed. Before the fix, one species without a derived role made `partition` return `None`, so adding thiosulfate silently withdrew the pH of the acid sitting beside it; and because the aqueous rebuild replaces a vessel's contents with the computed state, the unrecognised species was then destroyed rather than ignored. What remains is a vessel where two solvers coexist over the same liquid with different vocabularies, and the rate engine draws its acid term from the one that does know about protons. Worth naming the real chemistry that is missing: S₂O₃²⁻ has pKa₂ ≈ 1.6, so at pH 1.75 a real solution is roughly half protonated, and the reacting species is arguably HS₂O₃⁻ rather than the free anion."
lv3_de = "Das Spezies-Register markiert Natriumthiosulfat als `dissolves_without_speciation`, und das Labor löst bei jeder Zugabe `NotYetModeled` aus und benennt dabei genau, was betroffen ist: pH-Wert und Ionenstärke gelten für alles andere im Becherglas. Das ist keine Kosmetik — es wurde durch zwei Fehler erkauft, die nur ein Kinetikmodell hätte aufdecken können. Vor der Behebung führte eine Spezies ohne abgeleitete Rolle dazu, dass `partition` `None` zurückgab, sodass die Zugabe von Thiosulfat stillschweigend den pH-Wert der danebenliegenden Säure entzog; und weil der wässrige Neuaufbau den Inhalt eines Gefäßes durch den berechneten Zustand ersetzt, wurde die nicht erkannte Spezies anschließend zerstört statt ignoriert. Was bleibt, ist ein Gefäß, in dem zwei Solver über derselben Flüssigkeit mit unterschiedlichem Vokabular koexistieren, und der Kinetikmotor bezieht seinen Säureterm von demjenigen, der etwas von Protonen versteht. Es lohnt sich, die fehlende reale Chemie zu benennen: S₂O₃²⁻ hat pKa₂ ≈ 1,6, sodass bei pH 1,75 eine echte Lösung ungefähr zur Hälfte protoniert wäre, und die reagierende Spezies wäre eher HS₂O₃⁻ als das freie Anion."

[reaction.provenance]
source = "Editorial judgement (Kerotakis): the decision to let an unspeciated salt dissolve while reporting what that costs, rather than refusing it or inventing a pH, is ours and is recorded in PLAN.md (P3k, 'Honest gaps'). The absence of thiosulfate from wateq4f.dat, minteq.v4.dat and pitzer.dat is a property of the shipped PHREEQC databases (USGS). The pKa₂ ≈ 1.6 quoted at lv3 is a standard reference value and is not computed by this engine."
computed_by = "PHREEQC via Kerotakis L2 for the two pH readings; the gap notice comes from the bench's honesty pass"

