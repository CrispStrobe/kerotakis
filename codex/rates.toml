# The Kerotakis codex — rates.
#
# Every solver below the rate engine answers *where does this settle?*.
# These entries are about the question a school lab actually spends its
# afternoon on: how fast, and what changes it. The engine is P3k
# (`kerotakis-core/src/kinetics.rs`): curated rate laws, orders taken from
# the literature rather than read off the stoichiometry, k from Arrhenius,
# catalysis as a lower activation energy, and a bench clock that `wait`
# advances for every vessel at once.
#
# Every number in this file was produced by running the engine and reading
# its output — the entry's own setup script wherever possible, and where a
# claim needs a different clock or a different amount (a ten-millisecond
# wait, a five-gram charge), the variant is named in the register that uses
# it. Where a number is arithmetic performed on the engine's output rather
# than printed by it, the entry says so. Where a judgement is ours, it says
# `Editorial judgement (Kerotakis)`.
#
# Three approximations run through the whole file and are stated rather than
# hidden, each with an entry of its own:
#   · the thiosulfate rate law reads acid from the computed pH and never
#     consumes it (`the-acid-is-never-used-up`);
#   · thiosulfate is in no PHREEQC database we ship, so it dissolves but
#     contributes nothing to pH or ionic strength (`a-salt-with-no-database`);
#   · the pre-exponential factors are calibrated against the observable, not
#     measured, so absolute times are ours and ratios are the chemistry
#     (`the-cross-disappears`).
#
# Licence: Kerotakis-authored codex text is CC BY 4.0, separately from the
# AGPL code. Third-party facts and data retain the terms named per entry.

# ==================================================== order and concentration

[[reaction]]
id = "doubling-the-thiosulfate-doubles-the-rate"
summary = "Doubling thiosulfate doubles the initial rate, not necessarily the later accumulated sulfur"
spine = ["die-reaktionsgeschwindigkeit"]
equation = "S₂O₃²⁻ + 2 H⁺ → S↓ + SO₂ + H₂O"
concepts = ["reaction-rate", "reaction-order"]
requires = ["concentration"]
calculations = ["rate-from-extent"]
models = ["collision-theory"]
apparatus = ["beaker", "measuring-cylinder", "stopwatch", "balance"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium Jgst. 11/12, Reaktionsgeschwindigkeit und Katalyse"
ages = { min = 16.0, max = 18.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium Oberstufe (ISB)"

[reaction.setup]
script = """
add v1 water 100mL
add v1 Na2S2O3 0.79g
add v1 HCl 0.002mol
new
add v2 water 100mL
add v2 Na2S2O3 1.58g
add v2 HCl 0.002mol
wait 10s
"""

[reaction.expect]
events = ["reacted:thiosulfate-acid", "not_yet_modelled"]
absent = ["solver_failed"]
ph = { min = 1.82, max = 1.88 }

[reaction.expect.predict]
question = "Before either mixture reacts, doubling thiosulfate at the same proton activity changes the initial rate by what factor?"
options = ["No change","A factor of two under the stated first-order rate law","Always a factor of four"]
answer = 1
misconception = "Initial rate and finite-time yield are different quantities. During ten seconds, both acid and thiosulfate are consumed; the faster mixture loses its acid faster."

[[reaction.expect.predict.diagnosis]]
option = 0
reveals = "Concentration is treated as an amount that cannot influence encounters."
next = "Compare the initial rate-law inputs before interpreting the sulfur after ten seconds."

[[reaction.expect.predict.diagnosis]]
option = 2
reveals = "Reaction order is inferred from an unrelated stoichiometric coefficient."
next = "The curated thiosulfate order is one; the coefficient two on consumed protons does not change it."

[reaction.registers]
lv1 = "The stronger solution starts making sulfur faster. Later, a comparison also depends on how much acid remains."
lv2 = "Initially r = k c(thiosulfate) a(H+), so doubling c doubles r. A finite-time extent integrates a changing rate: two acid equivalents are consumed for every mole of sulfur formed."
lv3 = "The existing calibrated rate coefficients are unchanged. The network now consumes represented strong-acid equivalents and updates proton activity during each interval with a locally frozen activity coefficient. Uncoupled weak-acid replenishment is explicitly withheld, and thiosulfate itself still lacks aqueous speciation data."

[reaction.provenance]
source = "Existing Kerotakis calibrated thiosulfate rate parameters and PHREEQC aqueous data; original stoichiometric and model-boundary review, model-assisted editorial revision 2026-09-06. No new empirical constant imported."
computed_by = "Kerotakis bounded reaction-network integration with represented acid consumption; native aqueous equilibrium after each interval"

