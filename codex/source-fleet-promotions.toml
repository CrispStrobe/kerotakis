[[reaction.expect.assertions]]
kind = "equal"
tolerance = 1e-9

[[reaction.expect.assertions.samples]]
step = "final"
metric = "moles:ethyl_acetate"
vessel = "v1"

[[reaction.expect.assertions.samples]]
step = "final"
metric = "moles:ethyl_acetate"
vessel = "v2"

[[reaction.expect.assertions]]
kind = "equal"
tolerance = 1e-9

[[reaction.expect.assertions.samples]]
step = "final"
metric = "moles:CH3COOH"
vessel = "v1"

[[reaction.expect.assertions.samples]]
step = "final"
metric = "moles:CH3COOH"
vessel = "v2"

[reaction.expect.predict]
question = "Two vessels contain identical final feed amounts, but the second receives them in reverse order. Which reaches a different computed esterification equilibrium?"
options = ["The first, because the earliest reagent determines the reaction direction", "Neither: the equilibrium request uses the current inventory, not the feed history"]
answer = 1
misconception = "An equilibrium state is treated as a procedural memory of the order in which an identical inventory was assembled."

[[reaction.expect.predict.diagnosis]]
option = 0
