# The Kerotakis codex — models.
#
# School chemistry overfeeds facts and underteaches the models that make
# facts predictable. These entries are the models, treated as content
# rather than as background.
#
# The load-bearing field is `fails_at`. A model presented without its
# boundary is presented as truth, which is false, and is why the next
# model feels like an arbitrary replacement rather than an answer to a
# problem the learner can already feel.
#
# `power` says what a model *buys* — what it lets you predict or order —
# not what it says. `embodied_by` says where our engine implements it,
# and is left out where it does not.
#
# Licence: Kerotakis-authored codex text is CC BY 4.0, separately from the
# AGPL code. Third-party facts and data retain the terms named per entry.

# ============================================================ matter and particles

[[model]]
id = "teilchenmodell"
name = "Particle model (Teilchenmodell)"
power = "Lets you predict that matter is conserved when it appears to vanish — the sugar that dissolves, the puddle that dries — and to order the three states as one substance in three arrangements rather than as three substances. It is the first model that makes an invisible cause explain a visible effect."
explains = [
  "dissolving without any loss of mass",
  "the three states of matter and every change between them",
  "diffusion: why a smell crosses a room with nobody carrying it",
  "why gases can be compressed and liquids and solids cannot",
  "thermal expansion",
  "why a solution is clear rather than cloudy",
]
fails_at = [
  "Cannot say WHY sodium and chlorine react, only that they do — the particles have no parts to rearrange.",
  "Has no answer to why one substance is a metal and another a gas: every particle is the same featureless sphere.",
  "Cannot explain why oil and water refuse to mix, because it gives particles no way to attract each other differently.",
  "Taken literally it invites the classic error of attributing macroscopic properties to single particles — a hot particle that expands, a copper particle that is orange — and of filling the space between particles with air.",
]
superseded_by = "dalton-atommodell"
embodied_by = "kerotakis-core's vessel inventory. A vessel is nothing but a list of (species, moles, phase); dissolving salt moves an amount from the solid phase to the aqueous one and the ledger is unchanged. The particle model's central claim is enforced as a data structure and checked by a 256-case conservation property test."

[model.registers]
lv1 = "Everything is built from pieces far too small to see, and they never stop jiggling. In a solid they are packed tight and can only wobble; in a liquid they slide past each other; in a gas they fly apart with nothing but empty space between them. When sugar disappears into tea it has not gone anywhere — the pieces have slipped into the gaps between the water pieces, which is why the tea still tastes sweet and still weighs exactly the same."
lv2 = "Matter consists of discrete particles (Teilchen) in constant motion, separated by empty space. Temperature measures their mean kinetic energy, and the states of matter differ in how much of that energy is available against the forces holding the particles together. Melting, boiling, dissolving and diffusion are all rearrangements of the same particles, so none of them changes the mass."
lv3 = "The kinetic particle model — the school ancestor of kinetic gas theory. It is purely mechanical: particles have mass, volume and velocity and nothing else, which is precisely why it yields Boyle's and Gay-Lussac's laws and not one chemical fact. In Johnstone's terms it is the first submicroscopic model a learner meets, and it is not spontaneously acquired: continuous-matter intuitions persist for years, learners fill the inter-particle space with air, and they transfer macroscopic properties onto individual particles."

[model.provenance]
source = "Standard curriculum; documented misconceptions from Novick & Nussbaum, Junior high school pupils' understanding of the particulate nature of matter: an interview study, Science Education, 1978, and Andersson, Pupils' conceptions of matter and its transformations (age 12-16), Studies in Science Education, 1990"

[[model]]
id = "dalton-atommodell"
name = "Dalton's atomic model (Atommodell nach Dalton)"
power = "Turns stuff into countable, indestructible units with a fixed mass per element, which is what makes a chemical formula and a balanced equation possible at all. With Dalton you can predict the mass ratio in which two elements combine before you run the experiment."
explains = [
  "conservation of mass in a reaction",
  "the law of constant proportions: every sample of water has the same composition",
  "the law of multiple proportions: CO and CO2 but never CO1.5",
  "the difference between element, compound and mixture",
  "why a chemical equation must balance",
]
fails_at = [
  "The atom is a solid indivisible sphere, so there is nothing that can be transferred: ions, charge, electrolysis and electricity are all outside the model.",
  "All atoms of an element are identical is simply false — isotopes exist, and are the reason chlorine's relative atomic mass is 35.45 rather than a whole number.",
  "Says nothing about why elements fall into families, so the periodic table has to be memorised rather than derived.",
  "Atoms that cannot be divided cannot decay, so radioactivity has no place in it.",
]
superseded_by = "kern-huelle-modell"
requires = ["teilchenmodell"]
embodied_by = "The Gibbs minimiser (kerotakis-cea). Its constraint is one Lagrange multiplier per element, so every state it finds conserves atoms exactly — methane burns to CO2 and water with elements conserved to 1e-6. Dalton's claim is not an assumption inside the solver; it is the constraint the solver optimises under."

[model.registers]
lv1 = "Every substance is built from a small number of kinds of building block called atoms, and each kind has its own weight. Atoms are never made and never destroyed — a reaction only takes them apart and puts them together differently, like rebuilding a Lego model from the same bricks. That is why nothing ever weighs less afterwards."
lv2 = "Elements consist of atoms; all atoms of one element share a mass; compounds contain atoms in fixed whole-number ratios; a reaction rearranges atoms without creating or destroying any. From this follow conservation of mass, the law of constant proportions and the law of multiple proportions — carbon and oxygen give CO and CO2, never anything between."
lv3 = "Dalton (1808) is the first model here that is quantitative and predictive rather than descriptive, and the law of multiple proportions is its genuine prediction, made ahead of the evidence. It also carried an instructive error: the rule of greatest simplicity assigned water the formula HO, which put the whole atomic-mass table wrong until Avogadro's hypothesis and Cannizzaro's intervention at Karlsruhe separated atom from molecule. That fifty-year gap is the clearest available case of a model right in its structure and wrong in a parameter."

[model.provenance]
source = "Dalton, A New System of Chemical Philosophy (1808); Avogadro (1811); Cannizzaro, Sunto di un corso di filosofia chimica (1858), circulated at the Karlsruhe Congress in 1860"

[[model]]
id = "kern-huelle-modell"
name = "Nuclear model (Kern-Hülle-Modell, Rutherford)"
power = "Splits the atom into two parts with different jobs: a tiny heavy nucleus that fixes identity and mass, and an outer electron region that does all the chemistry. That single split is what makes ions, charge, radioactivity and the distinction between a chemical and a nuclear change explainable at all."
explains = [
  "the alpha-scattering experiment: most particles pass, a few bounce back",
  "that an atom is almost entirely empty space",
  "ions as atoms that have lost or gained electrons",
  "electrolysis and electrical conduction in solutions",
  "isotopes: same nuclear charge, different mass",
  "why no chemical reaction ever changes which element you have",
]
fails_at = [
  "A classical orbiting electron radiates and would spiral into the nucleus in about 10^-11 s. The model predicts that no atom can exist, which is the sharpest failure in the whole progression.",
  "The shell has no structure, so it cannot say why the noble gases are inert or why sodium loses exactly one electron.",
  "It predicts a continuous emission spectrum; glowing hydrogen actually gives a handful of sharp lines.",
]
superseded_by = "schalenmodell"
requires = ["dalton-atommodell"]
embodied_by = "The species registry is keyed by composition and charge, and the aqueous solver works entirely in ions — Na+ and Cl- are separate entries with separate thermodynamics. Nothing anywhere in the engine changes a nucleus: a chemistry solver is by construction a model of the shell alone."

[model.registers]
lv1 = "Fire tiny bullets at a sheet of gold foil and almost all of them go straight through as if nothing were there — but about one in ten thousand bounces straight back. So an atom must be mostly empty space with something very small, very heavy and positively charged right in the middle: the nucleus. Everything else is a cloud of light, negative electrons around it. Rub a balloon on your hair and you are stealing some of them."
lv2 = "Rutherford (1911), from Geiger and Marsden's alpha scattering: an atom has a nucleus of protons and neutrons carrying essentially all the mass in roughly a hundred-thousandth of the diameter, surrounded by Z electrons. The nucleus fixes which element it is; only the shell takes part in chemistry. Removing or adding shell electrons gives ions, and ions are the raw material of all salt chemistry."
lv3 = "This is where chemistry and physics separate cleanly: nuclear charge Z is identity, the electron shell is chemistry. It is also the model whose failure is quantitative and unambiguous — an accelerated charge radiating by the Larmor formula collapses the atom in about 10^-11 s — which is why the next step had to be a postulate against classical mechanics rather than a refinement of it. Presented with that failure named, Bohr's stationary states stop looking arbitrary."

[model.provenance]
source = "Rutherford, The scattering of alpha and beta particles by matter and the structure of the atom, Philosophical Magazine, 1911; Geiger & Marsden, 1909. The classical-collapse lifetime is the standard textbook estimate from the Larmor radiation formula"

[[model]]
id = "schalenmodell"
name = "Shell model (Schalenmodell, Bohr)"
power = "Puts electrons in numbered shells of fixed capacity, and that one move makes the periodic table derivable instead of memorised: group number is the count of outer electrons, period number is the shell being filled, and the octet rule then tells you which ion an element forms before you have ever seen it react."
explains = [
  "the line spectrum of hydrogen, quantitatively",
  "why the noble gases are unreactive",
  "the ion charges of the main groups, and hence salt formulae",
  "why sodium and potassium behave alike",
  "ionisation energy rising across a period and jumping between shells",
  "flame colours as electrons falling back between shells",
]
fails_at = [
  "Predicts the wrong spectrum for anything bigger than hydrogen. Helium, with two electrons, already has no solution and the model's numbers are simply wrong.",
  "Cannot explain why the 4s shell fills before 3d, which is why the transition metals refuse to fit the tidy shell story.",
  "Electrons run on circles, so molecules have no shape: it cannot say why water is bent at 104.5 degrees or methane tetrahedral.",
  "No fine structure, and no account of lines splitting in a magnetic field.",
  "It is a hybrid — classical orbits with a quantum rule bolted on — and nothing inside the model justifies the rule.",
]
superseded_by = "kugelwolkenmodell"
requires = ["kern-huelle-modell"]
embodied_by = "Only as curated data, and that is worth saying out loud. The lab's flame test shows sodium's yellow from a colour table, not from a computed transition — the very prediction Bohr is famous for is one this engine asserts rather than calculates."

[model.registers]
lv1 = "Electrons are not just anywhere. They live in layers around the nucleus, like the rings of an onion, and each layer has room for only so many. An atom is content when its outside layer is full, and that is the whole secret of chemistry: atoms give away, take, or share electrons until everyone's outer layer is full. Heat an atom and an electron jumps up a layer, then falls back and gives out light of one exact colour — which is why salt turns a flame yellow."
lv2 = "Bohr (1913): electrons occupy shells K, L, M, N with capacities 2, 8, 18, 32 (that is 2n squared). Energy is emitted or absorbed only when an electron changes shell, and E = hf gives hydrogen's sharp lines. The number of electrons in the outermost shell is the valence, and the octet rule — the drive to a noble-gas configuration — then predicts Na+ and Cl-."
lv3 = "Bohr quantises angular momentum by postulate and reproduces the Rydberg formula exactly for one-electron systems, E = -13.6 eV / n squared. That success is confined to H, He+ and Li2+; helium fails outright, because a postulate about single orbits has nowhere to put electron-electron repulsion. Sommerfeld's elliptical orbits patched the fine structure without curing the disease. The model survives in school because valence-shell counting is genuinely useful, but the planetary image it plants is documented to persist into university, and this engine's registers should never draw an atom as a solar system."

[model.provenance]
source = "Bohr, On the constitution of atoms and molecules, Philosophical Magazine, 1913; persistence of the planetary-orbit image documented in the conceptual-change literature, e.g. Taber, Building the structural concepts of chemistry, Chemistry Education Research and Practice, 2001"

[[model]]
id = "kugelwolkenmodell"
name = "Charge-cloud model (Kugelwolkenmodell, Kimball)"
power = "Gives molecules a shape. Once the outer electrons are four repelling clouds rather than dots on a circle, the tetrahedron falls out, and a learner can predict from the formula alone that methane is tetrahedral, ammonia pyramidal and water bent — and that each lone pair squeezes the angle further."
explains = [
  "the tetrahedral carbon atom, and hence the whole shape of organic chemistry",
  "bond angles of 109.5, 107 and 104.5 degrees in methane, ammonia and water",
  "why water is a dipole and carbon dioxide is not, despite both having polar bonds",
  "the difference between bonding pairs and lone pairs",
  "single, double and triple bonds as one, two or three shared clouds",
]
fails_at = [
  "Every cloud is the same size and shape, so there is no s and no p, no subshells, and no way to say why an atom's outer electrons differ in energy at all.",
  "The photoelectron spectrum of methane shows two different valence ionisation energies, not four identical ones: the four equivalent bonds the model draws are not what the experiment sees.",
  "Transition metals break it. d electrons do not fit a four-cloud picture, and neither does an octahedral complex with six ligands.",
  "It cannot describe delocalisation: benzene comes out as two alternating structures, neither of which exists, and metals and conjugated dyes are outside it entirely.",
  "It is a geometry model with no spectroscopy and no energies in it — no ionisation energies, no colour, no bond strengths.",
]
superseded_by = "orbitalmodell"
requires = ["schalenmodell"]

[model.registers]
lv1 = "Electrons go around in pairs, and each pair sits in its own little round cloud. The clouds push each other away, so they spread out as far as they can get. Four clouds around a carbon atom end up pointing at the four corners of a pyramid shape — and that really is the shape of methane. Water has two clouds doing the bonding and two just sitting there taking up room, which is why water is bent instead of straight."
lv2 = "Kimball's charge clouds (Kugelwolken): each electron pair occupies a spherical cloud, clouds repel, and they take the arrangement of maximum separation — two linear, three trigonal planar, four tetrahedral. Lone pairs need more room than bonding pairs, so the H-O-H angle is 104.5 degrees rather than 109.5. A double bond is two clouds shared between the same pair of atoms."
lv3 = "The German school Kugelwolkenmodell descends from G. E. Kimball's charge-cloud picture and is, in modern terms, a localised sp3 electron-pair model with the mathematics removed; it is a close cousin of VSEPR (the Elektronenpaar-Abstoßungsmodell) and of Linnett's double-quartet. Its value is real — correct main-group geometry from a rule a fourteen-year-old can apply — and its cost is that it presents localised pairs as physical objects, which makes delocalisation, photoelectron spectra and metallic bonding all look anomalous instead of expected."

[model.provenance]
source = "Standard German curriculum (Kugelwolkenmodell); the underlying charge-cloud picture is G. E. Kimball's, and its close relative VSEPR is Gillespie & Nyholm, Quarterly Reviews of the Chemical Society, 1957. Editorial judgement (Kerotakis): placing the Kugelwolkenmodell between Bohr and the orbital model follows German didactic practice rather than the historical order, since Kimball's work postdates Schrödinger's"

[[model]]
id = "orbitalmodell"
name = "Orbital model (Orbitalmodell)"
power = "Replaces where the electron is with how likely it is to be there, and in doing so becomes the first model of the atom that is calculated rather than postulated. It gives the aufbau order and hence the shape of the periodic table including the d and f blocks; it gives molecular orbitals and hence bond order, magnetism and colour; and it is the only model in this progression whose error can be systematically reduced instead of patched."
explains = [
  "the aufbau principle, Pauli exclusion and Hund's rule",
  "the s, p, d and f block structure of the periodic table",
  "why 4s fills before 3d",
  "why liquid oxygen sticks to a magnet: two unpaired electrons in pi-star orbitals",
  "delocalisation, aromaticity and the colour of dyes",
  "HOMO and LUMO, and hence where a molecule is attacked",
]
fails_at = [
  "There are no orbitals in a many-electron atom. An orbital is a one-electron function; the true wavefunction of even helium is not a product of them, so the 2p orbital of oxygen is an approximation being spoken of as an object.",
  "The Schrödinger equation has an exact solution for one electron only. Everything past hydrogen is an approximation whose accuracy has to be argued for rather than assumed.",
  "A single-determinant orbital picture cannot even break the bond in H2 correctly at long distance, which is the simplest case of the static correlation that defeats it across transition-metal and excited-state chemistry.",
  "As usually taught it is non-relativistic, so it gets gold's colour and mercury's liquidity wrong.",
  "It is not a model a learner can compute with: the predictions come out of software, so it buys explanation rather than hand calculation.",
]
requires = ["schalenmodell", "kugelwolkenmodell"]
embodied_by = "Nothing at runtime, deliberately. PLAN.md confines quantum chemistry to build time (L4'): orbital shapes would ship as precomputed meshes, never as a live calculation, and the honest runtime ceiling is a qualitative Hückel tier. No orbital is computed anywhere in the shipped engine, because thermodynamics does not need one."

[model.registers]
lv1 = "Nobody can say exactly where an electron is — only where it is likely to be. So instead of a ring, picture a fuzzy cloud around the nucleus, thicker where the electron spends more of its time. Different clouds have different shapes: some are balls, some look like two balloons tied together. The shapes are the reason atoms join up pointing in particular directions instead of just anywhere."
lv2 = "Electrons occupy orbitals — solutions of the Schrödinger equation labelled n, l and m — and the square of the wavefunction gives the probability density. Orbitals fill by the aufbau principle, the Pauli exclusion principle and Hund's rule, which reproduces the periodic table block by block. When atoms combine, atomic orbitals overlap into bonding and antibonding molecular orbitals; bond order is half the difference between them, and O2's two unpaired antibonding electrons are why liquid oxygen is paramagnetic."
lv3 = "The orbital model is the one-electron (Hartree-Fock) approximation to the many-body problem: orbitals are basis functions of an approximation, not physical containers. What distinguishes it in kind from every earlier model here is that it comes with a theory of its own error and can be improved systematically — post-Hartree-Fock, density functional theory, multireference methods. The pedagogical hazard is the mirror image of Bohr's: learners who successfully abandon orbits often reify orbitals instead and treat them as places. This is also where school chemistry's models end and computational chemistry begins, which is why Kerotakis draws its line here."

[model.provenance]
source = "Schrödinger, Annalen der Physik, 1926; aufbau, Pauli and Hund per standard quantum chemistry (e.g. Atkins & Friedman, Molecular Quantum Mechanics). Learner reification of orbitals documented by Taber, Learning quanta: barriers to stimulating transitions in student understanding of orbital ideas, Science Education, 2005"

[[model]]
id = "periodensystem"
name = "The periodic law (Periodensystem der Elemente)"
power = "Compresses the properties of a hundred-odd elements into two coordinates. Group and period alone let you predict an element's ion charge, its formula with oxygen and chlorine, whether it is a metal, roughly how reactive it is and roughly how large its atoms are — for elements you have never met. Mendeleev's gaps show it is genuinely predictive rather than a filing system."
explains = [
  "why the alkali metals, the halogens and the noble gases each behave as a family",
  "trends in atomic radius, ionisation energy and electronegativity",
  "valency, and hence the formula of an unfamiliar oxide or chloride",
  "Mendeleev's prediction of eka-silicon, found as germanium in 1886",
]
fails_at = [
  "Ordering by atomic mass — Mendeleev's own criterion — puts tellurium after iodine and argon after potassium, both wrong. The law only became exact when Moseley replaced mass with nuclear charge in 1913.",
  "The trends are trends, not laws: aluminium's ionisation energy is below magnesium's and oxygen's below nitrogen's, and only the orbital model explains the exceptions.",
  "It orders without explaining. Nothing in the table says why a period ends where it does; the shell model supplies that, and the d and f blocks need orbitals.",
  "Hydrogen has no home in it, and the lanthanides and actinides are printed underneath because they will not fit the page.",
]
requires = ["schalenmodell"]

[model.registers]
lv1 = "Line the elements up in the right order and the same kinds of behaviour keep coming round again, like the days of the week. Everything in the first column is a soft metal that fizzes in water; everything in the last column does nothing at all. Once you know which column something is in, you can say a great deal about it before you ever open the jar."
lv2 = "Elements ordered by atomic number fall into 18 groups and 7 periods. The group number gives the number of valence electrons and hence the usual ion charge — group 1 gives +1, group 17 gives -1 — and the period number gives the shell being filled. Atomic radius falls left to right and grows down a group; ionisation energy and electronegativity do the opposite. Mendeleev (1869) left gaps and predicted the density and melting point of the missing eka-silicon; germanium turned up in 1886 and matched."
lv3 = "Periodicity is a consequence, not an axiom: it follows from the aufbau filling of shells and subshells, and the period lengths 2, 8, 8, 18, 18, 32 are the 2n-squared degeneracies sliced by the filling order. Mendeleev's ordering by mass was empirically right and theoretically wrong; Moseley's 1913 X-ray work established that the true ordinal is nuclear charge, which fixed the tellurium-iodine inversion and fixed how many elements were still missing. Take the table as the archetype of this codex's thesis: a model whose whole value lies in ordering rather than in any fact it contains."

[model.provenance]
source = "Mendeleev, 1869 (Journal of the Russian Chemical Society; German abstract in Zeitschrift für Chemie); Moseley, The high-frequency spectra of the elements, Philosophical Magazine, 1913. Editorial judgement (Kerotakis): treating the periodic law as a model in its own right, rather than as a table of facts to be consulted, is our framing"

# ======================================================================== bonding

[[model]]
id = "ionenbindung"
name = "Ionic bonding (Ionenbindung)"
power = "Predicts from the periodic table alone which pairs of elements form a salt and what its formula will be — and, because the model is a three-dimensional lattice of alternating charges rather than a pair of partners, it predicts the whole property profile at once: hard, brittle, high-melting, insulating as a solid and conducting once molten or dissolved."
explains = [
  "electron transfer from metal to nonmetal, and the ions that result",
  "the formula of a salt from the ion charges: NaCl, MgCl2, Al2O3",
  "why salts melt high and are hard",
  "why a struck salt crystal cleaves cleanly instead of denting",
  "why solid salt does not conduct but molten or dissolved salt does",
  "dissociation into mobile ions on dissolving",
]
fails_at = [
  "There is no fully ionic bond. Even NaCl has measurable covalent character, and by AlCl3 the salt has stopped being one: it sublimes at 180 degrees as covalent Al2Cl6 molecules.",
  "Complete transfer implies a dissolved salt is a gas of independent ions, and the engine's own answer disagrees — ion pairs and neutral complexes such as AgCl(aq) are really there.",
  "It cannot give a number. The lattice energy comes from a Born-Haber cycle, which is thermodynamics, not the transfer picture.",
  "It says nothing about which salts dissolve. Sodium chloride and silver chloride are both ionic; one goes in by the spoonful and the other does not.",
]
superseded_by = "elektronegativitaet-kontinuum"
requires = ["schalenmodell", "periodensystem"]
embodied_by = "The aqueous solver works in ions throughout — a dissolved salt enters the calculation as element totals and comes back as a distribution of species. It also demonstrates the model's boundary rather than describing it: the neutral AgCl(aq) complex appears in the computed speciation, so the fully-separated-ions picture is visibly incomplete on screen."

[model.registers]
lv1 = "A metal atom has one or two electrons it barely holds on to. A nonmetal atom badly wants one more. So the metal simply hands them over. Now one is positive and the other negative, and opposite charges pull — but not just in pairs: millions of them stack into a rigid grid, plus, minus, plus, minus, in all directions. That grid is a salt crystal. Hit it and it does not dent, it splits, because sliding the grid by one step puts plus next to plus and it flies apart."
lv2 = "A metal transfers valence electrons to a nonmetal; both reach a noble-gas configuration and become ions. Electrostatic attraction in every direction builds an ion lattice (Ionengitter), not molecules — NaCl is a formula unit, not a particle. The lattice explains the properties: strong non-directional forces give high melting points, displacement along a lattice plane puts like charges together and the crystal cleaves, and charge can only flow once the ions are free to move."
lv3 = "The ionic bond is the limiting case of a bond with maximal charge separation; its energy is dominated by the Madelung sum with a Born repulsion term, and Born-Haber cycles show that lattice energies calculated on a purely ionic model agree well for alkali halides and progressively worse as polarisability rises — Fajans's rules summarise the drift. In solution the picture must be relaxed further: PHREEQC returns ion pairs and neutral complexes, so the fully dissociated ideal is a dilute-solution approximation, and its activity corrections are exactly what the codex surfaces at lv3."

[model.provenance]
source = "Standard curriculum; Born-Haber cycle and Madelung treatment per standard inorganic chemistry; Fajans's rules for the covalent drift. Speciation and ion pairing computed by Kerotakis L2 (PHREEQC, USGS databases)"

[[model]]
id = "elektronenpaarbindung"
name = "Covalent bonding (Atombindung / Elektronenpaarbindung, Lewis)"
power = "Lets you draw a molecule you have never seen from its formula alone: count the valence electrons, share them into pairs until every atom has a noble-gas configuration, and read off the number of bonds and the lone pairs. Almost all of organic chemistry is downstream of that one piece of bookkeeping."
explains = [
  "H2, Cl2, HCl, H2O, CH4, NH3 and every simple molecule",
  "single, double and triple bonds, and why they get shorter and stronger in that order",
  "why nonmetals with nonmetals give molecules rather than lattices",
  "why molecular substances melt low and do not conduct",
  "formal charge, and how to choose between competing structures",
]
fails_at = [
  "Lewis structures make O2 a tidy double bond with every electron paired, and therefore predict it to be non-magnetic. Liquid oxygen sticks to a magnet: it has two unpaired electrons, and only molecular-orbital theory gets this right.",
  "Benzene needs two structures that both do not exist plus a rule that reality lies in between; the model has no way to draw one delocalised system.",
  "The octet rule is broken by BF3, PCl5, SF6 and every free radical. A rule with that many exceptions is a heuristic.",
  "There are no energies in it: it cannot say whether a bond is strong, or whether a reaction will release heat.",
]
superseded_by = "elektronegativitaet-kontinuum"
requires = ["schalenmodell"]

[model.registers]
lv1 = "Two atoms that both want more electrons cannot both take, so they share instead. Each puts in one electron and the pair sits between them, holding them together like two children gripping the same rope. Share two pairs or three and the grip is stronger and shorter. Substances built this way come as separate little molecules with hardly anything holding one molecule to the next, which is why they melt so easily and never carry electricity."
lv2 = "Nonmetal atoms reach a noble-gas configuration by sharing electron pairs. Shared pairs are bonding pairs, unshared ones are lone pairs, and Lewis notation makes the count explicit: eight valence electrons per atom, two for hydrogen. Bond order rises and bond length falls from C-C to C=C to C-triple-bond-C. The strong attraction is inside the molecule, so melting and boiling — which only separate molecules from each other — happen at low temperatures."
lv3 = "Lewis (1916) predates quantum mechanics and remains the most used model in chemistry, because electron-pair bookkeeping is an extraordinarily good approximation for main-group compounds. Its real status is that of a localised-bond approximation to the molecular-orbital description, valid wherever that description happens to be localisable; where it is not — O2's triplet ground state, benzene, hypervalency, radicals, metals — the failures are systematic, not incidental. Note also that the d-orbital account of SF6 taught in school books is disfavoured in the modern computational literature in favour of ionic-covalent resonance with little d participation."

[model.provenance]
source = "Lewis, The atom and the molecule, Journal of the American Chemical Society, 1916; Langmuir (1919) for the octet terminology; the case against d-orbital hypervalency from the natural-bond-orbital literature (Reed & Weinhold; Magnusson)"

[[model]]
id = "metallbindung"
name = "Metallic bonding (Metallbindung, Elektronengasmodell)"
power = "Explains a metal's entire property profile from one picture — fixed positive cores in a sea of mobile electrons. Electrical and thermal conduction, lustre, and above all malleability: a lattice held together by a shared electron sea can be deformed without breaking, which is exactly what an ionic lattice cannot do."
explains = [
  "electrical conduction in a solid metal",
  "thermal conduction",
  "malleability and ductility, against the brittleness of salts",
  "metallic lustre",
  "alloys as one metal lattice with another metal's atoms mixed in",
  "why metals form cations and never anions",
]
fails_at = [
  "It predicts every metal to conduct, and has no way to describe a semiconductor or an insulator — silicon sits between the two and the electron sea cannot say why. That needs band theory.",
  "Nothing in the sea sets a bond strength, so it cannot explain why mercury is liquid at room temperature while tungsten melts at 3400 degrees.",
  "It gets colour wrong by omission: copper and gold are not silver-grey, and the reason is relativistic band structure.",
  "Superconductivity, magnetism and the way resistance changes with temperature are all outside it.",
]
superseded_by = "elektronegativitaet-kontinuum"
requires = ["schalenmodell"]
embodied_by = "Only at its edges, which is itself informative. The engine treats a metal as a pure condensed phase with NASA-9 thermodynamic data and, in solution, as a cation — a magnesium ribbon is an inventory item with a heat capacity until it burns. Nothing in Kerotakis models the metallic state itself — and since 2026-08-20 the bench announces this boundary in the beaker at the moment it matters (a metal dropped into a salt solution says that displacement is not modelled), rather than only documenting it here where the learner most likely to be misled would never look."

[model.registers]
lv1 = "In a metal the atoms let go of their outermost electrons, which then wander freely through the whole lump — a kind of electric glue that is everywhere at once. Because the glue is not between fixed partners, you can hammer the metal flat and it holds together instead of shattering. And because the loose electrons can travel, they carry electricity and heat from one end to the other."
lv2 = "Metal atoms release their valence electrons into a delocalised electron gas (Elektronengas); the resulting cations (Atomrümpfe) sit in a close-packed lattice bound by their attraction to that gas. Mobile electrons carry current and heat. The bond is non-directional, so layers of cations can slide past one another without ever bringing like charges together — metals deform where ionic solids cleave."
lv3 = "This is Drude's free-electron gas (1900), corrected by Sommerfeld with Fermi-Dirac statistics — without which the model predicts an electronic heat capacity roughly a hundred times too large. Even corrected it cannot produce a band gap: the metal / semiconductor / insulator distinction requires the periodic lattice potential, Bloch's theorem and band structure. School chemistry stops at the sea because band theory belongs to solid-state physics, and naming that boundary is what stops the electron sea being mistaken for the last word."

[model.provenance]
source = "Standard curriculum (Elektronengasmodell); Drude, Annalen der Physik, 1900; Sommerfeld's Fermi-Dirac correction (1928); band theory from Bloch, Zeitschrift für Physik, 1929"

[[model]]
id = "elektronegativitaet-kontinuum"
name = "Electronegativity and the bond triangle (Elektronegativität, Bindungsdreieck)"
power = "Replaces three separate bond types with one continuous map. Two numbers — the difference in electronegativity and its average — place any binary compound inside a triangle whose corners are ionic, covalent and metallic, so the question stops being which type is it and becomes how far towards each corner. On the way it predicts bond polarity, hence molecular dipoles, hence solubility and where a molecule gets attacked."
explains = [
  "polar covalent bonds and partial charges",
  "why HCl is polar and Cl2 is not",
  "why CO2 has polar bonds and no dipole while water has both",
  "the gradient from NaCl through AlCl3 to SiCl4",
  "why the metals sit bottom-left and the nonmetals top-right of the periodic table",
  "the reactive site of a carbonyl group",
]
fails_at = [
  "Electronegativity cannot be measured. Pauling, Mulliken and Allred-Rochow define it differently and give different numbers, and the difference-above-1.7-is-ionic rule is a convention: HF has a difference of 1.9 and is a covalent gas.",
  "It is a property of an atom in a molecule, not of a free atom. The same element pulls harder in a higher oxidation state, and sp carbon pulls harder than sp3 carbon.",
  "The triangle classifies binary main-group compounds. It says little about coordination compounds and nothing at all about bond strength or reaction rate.",
]
requires = ["ionenbindung", "elektronenpaarbindung", "metallbindung", "periodensystem"]
embodied_by = "Nothing, and that is a fair reflection of the chemistry. No electronegativity value and no bond-type classification enters any Kerotakis solver, because thermodynamics never needs the ionic-covalent distinction: the free energy of a species does not know what kind of bond it has."

[model.registers]
lv1 = "In a shared pair of electrons, one atom nearly always pulls harder than the other. Pull about equally and the sharing is fair. Pull a little harder and that end goes slightly negative while the other goes slightly positive, which is why water sticks to itself so well. Pull hard enough and you do not share at all — you take, and you have made a salt. So sharing and taking are not two different things. They are the two ends of one scale, with everything real somewhere in between."
lv2 = "Electronegativity (chi) measures an atom's pull on a bonding pair. It rises towards the top right of the periodic table: F 4.0, O 3.5, Cl 3.0, H 2.1, Na 0.9 on the Pauling scale. A difference near zero gives a nonpolar covalent bond; a moderate difference gives a polar covalent bond with partial charges; a large difference gives an ionic bond. Plot the difference against the average and you get the bond triangle (Bindungsdreieck), with metallic bonding in the low-electronegativity corner: one diagram holding all three bonding models at once."
lv3 = "Pauling defined chi thermochemically in 1932 from the excess energy of heteronuclear bonds; Mulliken from the mean of ionisation energy and electron affinity; Allen from free-atom configuration energies. The van Arkel-Ketelaar triangle plots the difference against the mean and was made quantitative by Sproul, Jensen and Allen in the 1990s. Treat every boundary drawn on it as convention. The value of the picture is that a learner who met ionic, covalent and metallic bonding as three separate stories can now see one two-parameter family in which every real bond has all three characters in some proportion."

[model.provenance]
source = "Pauling, The nature of the chemical bond, Journal of the American Chemical Society, 1932; van Arkel (1941) and Ketelaar (1947) for the triangle; quantitative versions from Sproul, Jensen and Allen in the 1990s. Editorial judgement (Kerotakis): treating the triangle as the model that supersedes the three separate bonding models, rather than as an optional extra at the end of the topic, is our ordering choice — made because the three-boxes account is the one learners most reliably over-apply"

[[model]]
id = "zwischenmolekulare-kraefte"
name = "Intermolecular forces (Zwischenmolekulare Kräfte)"
power = "Separates how strong the bond inside a molecule is from how strongly molecules stick to each other, and that separation is what makes boiling points, solubility and like-dissolves-like predictable. From a structural formula alone a learner can rank substances by boiling point and say whether one will dissolve in water."
explains = [
  "boiling points rising along the alkanes, and alcohols boiling far above alkanes of the same size",
  "water's anomalously high boiling point, and why ice floats",
  "why oil and water do not mix",
  "surface tension, and why water beads on a waxed car",
  "why molecular substances melt low although their internal bonds are strong",
  "base pairing in DNA and the folding of proteins, later on",
]
fails_at = [
  "It ranks rather than calculates, and the ranking inverts: iodine is nonpolar and sublimes at 114 degrees, while polar HCl boils at minus 85. Dispersion forces in a large molecule beat dipole forces in a small one, and the hierarchy of adjectives cannot tell you when.",
  "The name hydrogen bond invites the classic exam error of explaining boiling by breaking O-H bonds inside the molecule. Boiling separates molecules; every one of them leaves whole.",
  "It cannot handle the hydrophobic effect, which is mainly entropic: oil and water separate less because oil attracts oil than because of what water has to do around it.",
  "Quantitative prediction of boiling points and miscibility needs an activity model or an equation of state, not a list of force names.",
]
requires = ["elektronenpaarbindung", "elektronegativitaet-kontinuum"]
embodied_by = "Only its consequences, and the engine says where it stops. Hydrated ions, neutral complexes and water's own activity are all in the aqueous results, but nothing computes an intermolecular force: asked to evaporate a mixture, the bench refuses honestly and reports that co-evaporation needs vapour-liquid equilibrium, which is PLAN.md's unbuilt L3 layer."

[model.registers]
lv1 = "Inside a molecule the atoms are held together very tightly. But molecules also stick to each other, much more weakly, like magnets that are only mildly interested. Boiling water does not tear water molecules apart — it only pulls them away from each other, and every molecule leaves in one piece. Molecules that stick to each other more strongly need more heat before they will let go. And things dissolve in things they stick to: sugar in water, grease in petrol, never grease in water."
lv2 = "Between molecules act, in rising strength for molecules of comparable size: London dispersion forces (always present, growing with size and surface), dipole-dipole forces (in polar molecules), and hydrogen bonds (hydrogen bound to N, O or F, meeting a lone pair). Boiling overcomes these and not the covalent bonds, which is why water boils at 100 degrees and H2S at minus 60, and why hydrogen bonds holding an open hexagonal lattice make ice less dense than water. Gleiches löst sich in Gleichem is the same idea applied to mixing."
lv3 = "Collectively the van der Waals forces: London dispersion is an instantaneous-multipole correlation effect scaling as r to the minus sixth and growing with polarisability; Keesom and Debye terms cover dipole-dipole and dipole-induced-dipole; hydrogen bonding is partly electrostatic and partly charge transfer and is not merely a strong dipole interaction. Two cautions worth teaching: dispersion is not the weak one — it is what makes iodine a solid and HCl a gas — and the hydrophobic effect is an entropic phenomenon in the water rather than an attraction between the solutes. Quantitatively this is the domain of activity models and equations of state such as UNIFAC and PC-SAFT."

[model.provenance]
source = "Standard curriculum; van der Waals (1873); London, Zeitschrift für Physik, 1930; the entropic account of the hydrophobic effect per Kauzmann and Tanford. The misconception that boiling breaks covalent bonds is documented in the bonding-misconceptions literature (e.g. Taber; Barker & Millar)"

# ======================================================================= reaction

[[model]]
id = "massenerhaltung"
name = "Conservation of mass (Gesetz von der Erhaltung der Masse)"
power = "Turns a reaction into an accounting problem. Once nothing can be lost, an unknown mass can be calculated instead of measured, an equation has to balance, and any experiment that seems to gain or lose mass becomes a question — where did it go? — rather than a result. It is the first law in chemistry that lets a learner predict a number."
explains = [
  "why a chemical equation must balance",
  "why a candle burning in a sealed jar keeps its mass",
  "why iron gains mass as it rusts and magnesium gains mass as it burns",
  "why an open beaker of fizzing vinegar loses mass",
  "the basis of every stoichiometric calculation",
]
fails_at = [
  "It holds only in a closed system. In an open beaker it appears to be false, and that appearance is the most productive confusion in school chemistry, because the gas that left is invisible.",
  "It is not exactly true. Mass and energy are equivalent, so an exothermic reaction really does lose mass — about 30 nanograms per tonne of coal burnt. Unmeasurable in chemistry, decisive in nuclear physics.",
  "It says nothing about whether a reaction happens, how fast, or in which direction — only about the bookkeeping if it does.",
]
requires = ["dalton-atommodell"]
embodied_by = "Enforced rather than assumed. kerotakis-core's conservation test runs 256 randomised operator sequences and asserts that per-species mass balances to 1e-9 and that the bench's enthalpy tracks the heat budget; the Gibbs minimiser conserves elements exactly in a separate test. Charge is delegated rather than checked here: the aqueous input line ends in `pH 7 charge`, so PHREEQC balances the solution's charge and the codex says so instead of quietly implying we did it. The open-system case is modelled too — an open beaker of vinegar and baking soda fizzes most of its carbonate away and the balance shows the mass leaving."

[model.registers]
lv1 = "Whatever you start with you still have, even when it looks as though it has gone. Burn a candle inside a sealed jar and weigh the jar: exactly the same as before. Do it in the open and it seems to get lighter, but only because the new stuff floated off as invisible gas. Nothing in chemistry ever really disappears — it only moves, or changes its clothes."
lv2 = "In a closed system the total mass before a reaction equals the total mass after (Lavoisier, 1789), because atoms are rearranged and never created or destroyed. That is exactly what a balanced equation asserts: the same count of each element on both sides. Apparent violations are open systems — magnesium burning gains the mass of oxygen taken from the air, and limestone in acid loses the mass of the carbon dioxide that escapes."
lv3 = "Lavoisier's law was an experimental claim made possible by the sealed vessel and the analytical balance, and what it displaced was not a fact but a bookkeeping: phlogiston. Strictly the conserved quantity is mass-energy, and the mass defect of a chemical reaction is about one part in ten billion, which is why chemistry could be built as though mass were separately conserved. In this engine mass balance is a property test rather than a doctrine, and the balance reading less after a fizz is a computed observation rather than a lesson-writer's promise."

[model.provenance]
source = "Lavoisier, Traité élémentaire de chimie (1789); mass-energy equivalence from Einstein (1905). Open-system mass loss computed by Kerotakis L2 (PHREEQC, escaping CO2 phase); conservation enforced by the proptest suite in kerotakis-core"
computed_by = "kerotakis-core conservation property tests; kerotakis-cea element balance"

[[model]]
id = "donator-akzeptor"
name = "The donor-acceptor concept (Donator-Akzeptor-Prinzip)"
power = "Collapses two apparently unrelated halves of the syllabus into one idea: a proton transfer and an electron transfer are the same kind of event. Both come as a pair of half-reactions, both define conjugate pairs, and both are ordered by a strength table read the same way — so a learner who has the concept can use a redox series exactly as they use a pKa table, and predict the direction of either from one rule."
explains = [
  "acids and bases as proton donors and acceptors",
  "oxidation and reduction as electron donation and acceptance",
  "conjugate pairs in both families: HA/A- and Ox/Red",
  "why oxidation never happens without reduction",
  "half-equations, and why the electrons must cancel",
  "why the electrochemical series and the acid-strength table are the same kind of object",
]
fails_at = [
  "The analogy is not an identity. A hydrated proton is a real species with a concentration a meter can read; there is no corresponding free electron in solution, so the electron activity is a bookkeeping construct rather than something you can measure directly.",
  "It gives direction, never rate. Hydrogen and oxygen sit together indefinitely although the electron transfer is overwhelmingly favourable, and the concept has nowhere to put that fact.",
  "Real waters are usually in redox disequilibrium: different couples in the same sample imply different potentials, so a single number for the whole solution is a fiction.",
  "It does not reach Lewis acid-base chemistry, where a pair is donated and no proton moves at all.",
]
requires = ["ionenbindung", "elektronenpaarbindung"]
embodied_by = "Half of it, and the missing half is exactly the interesting one. The aqueous solver computes proton chemistry directly — pH from charge balance, weak-acid speciation, buffers — but no electron activity or redox potential reaches a result today, so the engine currently embodies the proton wing of a concept whose whole claim is that both wings are one thing. That gap is stated here rather than papered over."

[model.registers]
lv1 = "An enormous number of reactions are one thing handing something over to another. Sometimes what gets handed over is a proton, a tiny positive scrap of an atom: that is an acid giving to a base. Sometimes it is an electron: that is what rusting, burning and batteries are. Either way there is always a giver and a taker, and you can never have one without the other — nobody hands something over to nobody."
lv2 = "Two families of reaction, one pattern. Acid-base: a proton donor and a proton acceptor, forming conjugate pairs HA/A- and B/BH+. Redox: an electron donor (the reducing agent) and an electron acceptor (the oxidising agent), again in conjugate pairs Red/Ox. Both are written as two half-reactions that must add up with nothing left over, and in both the direction is read off a table of strengths — pKa for protons, standard potential for electrons."
lv3 = "The Donator-Akzeptor-Konzept is the German curriculum's explicit unification and it is a structural insight rather than a mnemonic: both families are transfer equilibria described by an intensity variable — pH for protons, pe or Eh for electrons — and a capacity variable, the buffer intensity or the poise. Its limits are equally structural. The electron activity is formal, and natural systems are frequently in redox disequilibrium, so different couples in one water sample imply different potentials, a discrepancy documented in the groundwater literature. Lewis generalises the pattern one step further, to electron pairs, at which point complex formation joins the same family."

[model.provenance]
source = "Standard German curriculum (Donator-Akzeptor-Prinzip); Brønsted and Lowry (1923) for the proton case; the pe formalism per Stumm & Morgan, Aquatic Chemistry. Redox disequilibrium in natural waters documented by Lindberg & Runnells, Science, 1984"

[[model]]
id = "stossmodell"
name = "Collision theory (Stoßmodell / Stoßtheorie)"
power = "Explains rate, which is the dimension every equilibrium model is blind to. It makes concentration, temperature, surface area and catalysis one mechanism — how many collisions, how hard, how well aimed — so a learner can predict which of two experiments fizzes faster and say why, instead of memorising four separate rules."
explains = [
  "why a reaction speeds up at higher concentration or pressure",
  "why it roughly doubles in rate for every ten degrees",
  "why powder reacts faster than a lump, and why flour dust can explode",
  "why stirring helps a heterogeneous reaction",
  "what a catalyst does",
  "why a thermodynamically favourable reaction can simply not happen",
]
fails_at = [
  "Its numbers are wrong. Hard-sphere collision frequency overestimates the rate of anything more complex than an atom reaction, often by orders of magnitude, and has to be rescued by an empirical steric factor the model itself cannot predict.",
  "Molecules are not spheres and a collision is not instantaneous: there is no place in the model for orientation, vibration or a reaction path.",
  "It cannot describe a reaction that slows as it is heated, or one that proceeds by tunnelling instead of over the barrier.",
  "It suggests the rate law can be read off the equation. Real reaction orders are experimental facts about the mechanism and are frequently fractional.",
]
superseded_by = "energieprofil"
requires = ["teilchenmodell", "massenerhaltung"]
embodied_by = "The curated kinetics engine computes each of this model's four school-level claims. Concentration enters through reaction order; temperature through the Arrhenius exponent; a catalyst supplies a lower-barrier pathway whose activity depends on its amount; and heterogeneous catalyst mass, particle diameter, suspension and stir-bar tip speed enter through nominal exposed area and a bounded external-transfer correction. Thus grinding MnO₂ finer or stirring it changes the peroxide rate without changing stoichiometry. Orders remain curated experimental facts rather than mechanism-derived, and the surface treatment deliberately omits adsorption, pore/BET area and diffusion. The thermal solver's 500 K stand-down is still a placeholder for kinetics it does not have."

[model.registers]
lv1 = "Nothing can react unless the pieces actually bump into each other — and a gentle bump is not enough. It has to be a hard bump, and pointing the right way. So anything that makes bumps more frequent or harder speeds the reaction up: more crowded, hotter, or ground into powder so there is more surface to bump into. That is why a lump of flour just sits there and a cloud of flour dust can blow up a mill."
lv2 = "Particles react only when they collide, and only if the collision carries at least the activation energy and brings the right parts together. Rate therefore rises with concentration and pressure (more collisions per second), with temperature (a far larger fraction of collisions clears the activation energy, because of the tail of the Maxwell-Boltzmann distribution) and with surface area. A catalyst opens a route with a lower activation energy, so more of the same collisions succeed."
lv3 = "Simple collision theory gives a rate constant of the form Z times a steric factor times exp(-Ea/RT), where Z is the hard-sphere collision frequency and the exponential is the Maxwell-Boltzmann fraction above the barrier. It is semi-quantitative at best: for anything beyond atom-atom reactions the steric factor can be a hundred-thousandth and is not predicted by the theory, which is precisely the gap transition-state theory closes by replacing it with an entropy of activation. Worth saying explicitly: the rate doubles every ten degrees rule corresponds to an activation energy near 50 kJ/mol at room temperature and is a rule of thumb, not a law."

[model.provenance]
source = "Standard curriculum kinetics; Trautz (1916) and W. C. M. Lewis (1918) for collision theory; Arrhenius, Zeitschrift für physikalische Chemie, 1889, for the temperature dependence"

[[model]]
id = "energieprofil"
name = "Energy profiles and activation (Energiediagramm, Aktivierungsenergie)"
power = "Puts thermodynamics and kinetics on one picture and keeps them apart: the height of the hill decides how fast, the difference between the two ends decides how far and whether heat comes out. That distinction — exothermic does not mean fast, and a catalyst changes the rate but not the position — is one learners otherwise conflate for years."
explains = [
  "exothermic and endothermic reactions as two shapes of the same diagram",
  "why a fire needs a match although burning releases energy",
  "what a catalyst does, and why it changes neither the products nor the heat released",
  "the activated complex at the top of the barrier",
  "why the reverse reaction has a different activation energy",
  "enzyme action, later on",
]
fails_at = [
  "The reaction coordinate is a one-dimensional cartoon of a many-dimensional energy surface. Real reactions branch, pass several saddle points, and sometimes have no barrier at all.",
  "It draws the barrier as if height were the whole story of rate, but the tightness of the transition state matters as much: a well-ordered transition state is slow even over a low barrier.",
  "It cannot produce a barrier height. Activation energies are measured, or computed by quantum chemistry — the diagram summarises a result, it does not predict one.",
  "With energy on the axis it quietly implies that the heat released decides whether a reaction goes, which is false. Only the free-energy change does.",
]
requires = ["stossmodell", "enthalpie"]
embodied_by = "The two ends only. Kerotakis computes both endpoints exactly — the vessel's energy balance gives the heat released, and the Gibbs minimiser gives the products — and computes nothing in between. Barriers are PLAN.md's build-time L4-prime work (xtb, CREST, precomputed datasets) and are never a runtime calculation, so this diagram's middle is honestly empty."

[model.registers]
lv1 = "Draw the reaction as a hill. You start on one side and finish on the other. How high the hill is tells you how hard it is to get going, which is why a fire needs a match even though burning gives out heat. Where you finish tells you whether heat comes out — you ended lower down — or has to be put in. A catalyst digs a tunnel through the hill: same start, same finish, far easier journey."
lv2 = "Plot energy against the reaction coordinate: reactants at one level, products at another, and a maximum between them, the activated complex or Übergangszustand. The climb from reactants to that maximum is the activation energy; the difference between reactants and products is the enthalpy change, negative when heat is released. The reverse reaction has to climb the activation energy plus that difference. A catalyst lowers the barrier for both directions equally, so it speeds the approach to equilibrium without moving where equilibrium lies."
lv3 = "The diagram is a slice through a potential-energy surface along the minimum-energy path, and the maximum is a first-order saddle point with exactly one imaginary vibrational frequency — which is what a computational verification actually tests, together with an intrinsic-reaction-coordinate check. Transition-state theory writes the rate constant in terms of the free energy of activation, which is why the entropy of activation belongs on this picture even though the picture has no axis for it, and why school diagrams labelled energy should be read as free energy whenever they are used to argue about rate."

[model.provenance]
source = "Standard curriculum; Eyring, Journal of Chemical Physics, 1935, and Evans & Polanyi, Transactions of the Faraday Society, 1935, for transition-state theory"

[[model]]
id = "chemisches-gleichgewicht"
name = "Chemical equilibrium (Chemisches Gleichgewicht)"
power = "Replaces reactions go to completion with reactions go to a position, and gives that position a number. With an equilibrium constant a learner can predict how far a reaction gets, calculate what is left over, and grasp that a reaction can be running fast in both directions while nothing appears to change. Weak acids, buffers, solubility products and industrial yield then stop being four topics and become one."
explains = [
  "reversible reactions, and why they stop short",
  "that equilibrium is dynamic: labelled atoms keep swapping sides after the amounts stop changing",
  "why a weak acid only partly dissociates",
  "solubility limits and the solubility product",
  "how a buffer works",
  "why an industrial process never reaches its paper yield",
]
fails_at = [
  "It says nothing about how long. A reaction with an enormous equilibrium constant that takes a geological age is described perfectly by the model and completely misunderstood by the learner who thinks it goes.",
  "Concentration is the wrong variable outside dilute solution: the constant is constant in activities, and in brine that correction is a factor rather than a percentage. Kerotakis can show this rather than assert it — asked the same brine question, three databases return three different amounts of undissolved salt, each labelled with the activity model that produced it.",
  "The equilibrium constant is not constant when the temperature changes, which makes it the one constant in school chemistry that misleads by its own name.",
  "Many real systems are not at equilibrium and stay that way. Living things most of all.",
]
requires = ["stossmodell", "konzentration"]
embodied_by = "Directly, and in an unusual way: the engine never simulates a reaction proceeding. PHREEQC solves for the equilibrium distribution of every species at once, so the codex's weak-acid pH of 2.88 and its buffer behaviour emerge from the database's own equilibria instead of from a formula we applied — and the constants themselves are never printed, only their consequences. The Gibbs minimiser does the same job for gases and condensed phases by minimising the total free energy under element constraints."

[model.registers]
lv1 = "Some reactions never finish. They run forwards and backwards at the same time, and after a while both directions go at exactly the same speed — so the amounts stop changing even though nothing has stopped. It looks like the end, but it is more like a busy escalator with as many people walking up as down. How far a reaction gets before that happens is different for every reaction."
lv2 = "A reversible reaction reaches a dynamic equilibrium: forward and reverse rates become equal, so concentrations become constant — constant, not equal. The law of mass action gives an equilibrium constant K as the ratio of product to reactant concentrations, each raised to its coefficient, fixed at a given temperature. K much greater than one means products dominate; much less than one means reactants do. Special cases carry their own names: Ka for weak acids, Kw for water, Ksp for sparingly soluble salts."
lv3 = "Thermodynamically K is not an empirical summary but a consequence — the standard free-energy change in another currency — and its temperature dependence follows the van 't Hoff equation. Written properly K is a ratio of activities, and in Kerotakis that stops being a footnote: the engine computes activities alongside molalities, so the conditional pKa2 of phosphate reads about 6.65 at an ionic strength near 0.25 where the textbook table says 7.2. The textbook constant and the pH meter genuinely disagree, and the model says which is which. Equilibrium is also a canonical threshold concept — transformative, integrative, irreversible and demonstrably troublesome — with the two persistent misconceptions being that the rates stop and that the concentrations become equal."

[model.provenance]
source = "Guldberg & Waage (1864) for the law of mass action; van 't Hoff (1884). Equilibrium misconceptions documented by Hackling & Garnett, European Journal of Science Education, 1985. Editorial judgement (Kerotakis): naming equilibrium a threshold concept in the Meyer-Land sense, and therefore expecting it to be troublesome rather than treating difficulty as failure, is our framing, informed by Meyer & Land (2003)"
computed_by = "Kerotakis L2 (PHREEQC) for the aqueous numbers; kerotakis-cea for gas and condensed phases"

[[model]]
id = "le-chatelier"
name = "Le Chatelier's principle (Prinzip vom kleinsten Zwang)"
power = "Gives a direction of change with no calculation at all. Change a concentration, a pressure or a temperature and the principle tells you which way the yield moves — enough to explain the Haber process, why a fizzy drink goes flat, and why an industrial plant runs at conditions that look like a compromise, because they are one."
explains = [
  "shifting the position by adding or removing a substance",
  "pressure changing the position when the two sides have different gas mole numbers",
  "heating favouring the endothermic direction",
  "why a catalyst shifts nothing",
  "the common-ion effect",
  "the conditions chosen for the Haber-Bosch process",
]
fails_at = [
  "It is a heuristic and it can be led into a wrong answer. Add more nitrogen to an equilibrated ammonia synthesis at constant temperature and pressure, once nitrogen is already in excess, and the mole fraction of ammonia falls — the system opposes the change and the yield still goes down.",
  "Adding an inert gas at constant volume changes nothing, although increasing the pressure sounds as though it should. The principle's own words mislead unless you already know the answer.",
  "It gives a direction and never a magnitude, and the shift is often negligible.",
  "The word Zwang invites teleology. Learners describe the system as wanting to oppose the change, a misconception the phrasing itself plants.",
]
superseded_by = "gibbs-energie"
requires = ["chemisches-gleichgewicht"]
embodied_by = "Never applied — always checked. The bench discards a vessel's characterisation the moment anything touches it and re-solves the whole equilibrium, so a shift is something the learner causes and the solver discovers: add a common ion, let CO2 escape from an open vessel, or warm the beaker, and the new position is computed from scratch. Le Chatelier is then a prediction to be tested against that result rather than a rule the engine obeys."

[model.registers]
lv1 = "Disturb a reaction that has settled down and it shuffles to undo part of what you did. Take something away and it makes more of it. Squeeze a gas mixture and it moves to whichever side takes up less room. Heat it and it moves the way that soaks heat up. It never undoes your change completely — it only pushes back a bit."
lv2 = "Prinzip vom kleinsten Zwang: a system at equilibrium subjected to a constraint responds so as to reduce that constraint. More reactant shifts the position towards products; higher pressure shifts it towards the side with fewer gas molecules; higher temperature favours the endothermic direction. A catalyst changes neither the position nor K. Haber-Bosch is the classic compromise — high pressure helps the yield, low temperature would help it too but destroys the rate, so the plant runs hot with a catalyst, against the principle's advice."
lv3 = "The rigorous statement is thermodynamic: at constant temperature and pressure a system moves so as to lower its Gibbs energy, and the direction after any perturbation follows from comparing the reaction quotient with the equilibrium constant. The qualitative form has genuine counterexamples — adding a reactant already in excess can lower the product mole fraction at constant pressure, and adding an inert gas at constant volume does nothing — which is why it is best treated as a heuristic with a stated domain. Teaching it together with its counterexample is the point: it is the smallest clear case of a rule that works right up until you can say when it does not."

[model.provenance]
source = "Le Chatelier (1884) and Braun (1887); the reaction-quotient formulation and the counterexamples are standard in the physical-chemistry education literature (recurring subject of Journal of Chemical Education articles on the principle's limitations). Editorial judgement (Kerotakis): presenting the principle together with its counterexample rather than as a rule is our choice"

# =================================================================== quantitative

[[model]]
id = "stoffmenge"
name = "Amount of substance - the mole (Stoffmenge, das Mol)"
power = "Lets you turn a mass you can weigh into a number of particles you cannot see, which is what makes any quantitative prediction possible at all. Without it a balanced equation is a sentence about atoms and a balance is a device for measuring grams, and the two never meet."
explains = [
  "converting between mass and number of particles",
  "why equations balance in moles and not in grams",
  "molar mass, and why it is numerically the relative atomic mass",
  "the molar volume of a gas",
  "concentration, limiting reagent, yield and titration, all of which are built on it",
]
fails_at = [
  "It is not a model of anything physical. It is a unit — a chosen counting number — which is exactly why it is hard: there is nothing to picture, and a mole of something has no size, colour or feel.",
  "Nothing in the concept records which particles you counted. A mole of water is that many molecules but three times as many atoms, and a mole of oxygen is ambiguous until somebody says O or O2. This is the single commonest source of factor-of-two errors.",
  "The molar volume of 22.4 litres holds for an ideal gas at zero degrees and standard pressure only. Treating it as a property of gases is a routine mistake.",
  "It hides a change of definition. Since 2019 the mole is defined by fixing Avogadro's number, not by twelve grams of carbon-12, so molar mass is now a measured quantity with an uncertainty rather than an exact one.",
]
requires = ["dalton-atommodell", "massenerhaltung"]
embodied_by = "The bench's native unit. Every vessel holds moles: writing `add v1 NaCl 2g` converts through the registry's molar mass at the door, and everything downstream — the solvers, the balance, the conservation tests — works in amount of substance. The learner's first hard conversion is the engine's boundary condition, and the atomic weights it uses carry their own provenance (IUPAC/CIAAW 2021)."

[model.registers]
lv1 = "Atoms are far too small to count one at a time, so chemists count them by weighing — the way you buy rice by the kilo instead of grain by grain, or eggs by the dozen instead of one by one. A mole is just a very large dozen: it is how many pieces you get in a certain weight of a substance, and it is the same number of pieces for every substance. That is the whole trick. Weigh grams, know how many pieces."
lv2 = "The mole is the SI unit of amount of substance: one mole contains 6.02214076 times ten to the twenty-third specified entities. The molar mass in grams per mole is numerically the relative atomic or molecular mass, so dividing a mass by a molar mass converts something weighable into something countable. The coefficients in an equation are ratios of moles, which is why 24 g of magnesium needs 16 g of oxygen rather than an equal mass."
lv3 = "Since the 2019 SI revision the mole is defined by fixing the Avogadro constant exactly, which decoupled it from the kilogram and from carbon-12; the molar mass of carbon-12 is now 12 g/mol only within a small measured uncertainty. Pedagogically it is the textbook threshold concept: transformative, since nothing quantitative is possible before it and everything is after; integrative, since it binds formula, equation, mass and volume; irreversible; and troublesome, in that learners reliably execute the arithmetic while holding no coherent idea of what a mole is, treating it variously as a mass, a volume or a number of grams. The countermeasure this codex uses is to make the calculation load-bearing: the number you derive is the number the beaker will show."

[model.provenance]
source = "SI Brochure, 9th edition (BIPM, 2019); atomic weights from IUPAC/CIAAW 2021 as recorded in the Kerotakis species registry. Learner difficulties with the mole documented by Novick & Menis, Journal of Chemical Education, 1976, and Staver & Lumpe, Journal of Research in Science Teaching, 1995. Editorial judgement (Kerotakis): treating the mole as a threshold concept in the Meyer-Land sense — and so expecting difficulty rather than reading it as failure — is our framing, informed by Meyer & Land (2003)"

[[model]]
id = "stoechiometrie"
name = "Stoichiometry (Stöchiometrie)"
power = "Makes an equation predictive in grams. Given what you put in, it tells you how much you can get out, which reagent runs out first, and how good your experiment was — before you do it. This is the point where chemistry becomes an engineering discipline rather than a description."
explains = [
  "mole ratios read straight off the coefficients",
  "limiting and excess reagent",
  "theoretical yield, actual yield and percentage yield",
  "atom economy",
  "titration calculations",
  "empirical formula from combustion analysis",
]
fails_at = [
  "It assumes the equation you wrote is the reaction that happened. Side reactions, incomplete conversion and impurities are invisible to it, which is why the yield is never 100 per cent and the arithmetic never warns you.",
  "It assumes the reaction runs to completion, so the theoretical yield of an equilibrium process is not merely unachieved but unachievable.",
  "It is arithmetic, not chemistry. It will happily compute the yield of a reaction that does not occur.",
]
requires = ["stoffmenge"]
embodied_by = "Not applied — checked. The solvers compute a final composition from thermodynamics, so the stoichiometric answer is what the learner predicts and the engine then confirms or contradicts. Burning a magnesium ribbon leaves more oxide than the ribbon weighed, and the extra mass came from air that nobody weighed in — a result that is computed here rather than told."

[model.registers]
lv1 = "A recipe says two eggs and 100 g of flour make eight pancakes. Chemistry works the same way: the equation is the recipe, so once you have it you can work out exactly how much you need and exactly how much you will get. And if you only have one egg it does not matter how much flour is in the cupboard — you get four pancakes. Whatever runs out first decides everything."
lv2 = "The coefficients of a balanced equation are mole ratios, so the amount of any substance follows from the amount of any other. The limiting reagent is the one with the smallest amount divided by its coefficient; everything else is in excess. Percentage yield is the actual divided by the theoretical yield; atom economy is the mass of the desired product as a fraction of the total mass of products. They are two different questions about the same reaction, and a reaction can score well on one and badly on the other."
lv3 = "Stoichiometry is linear algebra over the element-composition matrix: balancing an equation is finding a null-space vector, and the number of independent reactions in a mixture is that matrix's rank deficiency. The educational risk here is documented rather than hypothetical — proportional-reasoning algorithms can be executed correctly by learners who cannot say what a limiting reagent is, so success on the calculation is weak evidence of understanding. Predict-observe-explain is this codex's countermeasure: commit to the number first, then let the solver settle it."

[model.provenance]
source = "Standard curriculum. The gap between algorithmic success and conceptual understanding in stoichiometry documented by Nurrenbern & Pickering, Journal of Chemical Education, 1987, and Sawrey, Journal of Chemical Education, 1990; predict-observe-explain from White & Gunstone, Probing Understanding (1992)"

[[model]]
id = "konzentration"
name = "Concentration (Konzentration)"
power = "Makes how much independent of how much you took. Concentration is intensive, so it can be compared between a test tube and a lake, carried through a dilution, and put straight into an equilibrium expression or a rate law. It is also what turns a titration from a colour change into a measurement."
explains = [
  "amount concentration as amount divided by volume",
  "dilution, and why the amount of solute does not change",
  "titration, and how an unknown concentration is obtained from a known one",
  "pH as a concentration on a logarithmic scale",
  "why a drop of bleach and a bottle of it are different hazards",
]
fails_at = [
  "Molar concentration depends on temperature, because the volume does. Molality does not, which is why thermodynamic work — and every number this engine computes — is per kilogram of water rather than per litre of solution, and why the two are not interchangeable once a solution is concentrated.",
  "Concentration is not what an equilibrium responds to. Activity is. In dilute solution they nearly coincide; at an ionic strength of 0.1 mol/kgw the activity coefficient of the silver ion is already about 0.78, and in brine the correction is a factor, not a percentage.",
  "It says nothing about which species are present. 0.1 mol/L phosphoric acid is a recipe, not a description: the solution actually holds four phosphate species in a pH-dependent mixture.",
  "Volumes do not add exactly, so a dilution calculation is an approximation — mixing 50 mL of ethanol with 50 mL of water gives about 96 mL.",
]
requires = ["stoffmenge"]
embodied_by = "The engine works in molality per kilogram of water and reports each species' activity beside its molality, so the difference between the two is visible rather than asserted — the activity coefficient is a ratio the learner can read off. Which activity model produced it is stated with the answer, together with its range: the WATEQ Debye-Hückel extension to about I = 1 mol/kgw, the Davies equation to about 0.5, the Pitzer ion-interaction model beyond."

[model.registers]
lv1 = "It is not enough to know what is in the water — you need to know how crowded it is. One spoon of sugar in a cup is sweet; the same spoon in a bathtub is nothing at all. Concentration is that crowding, and it decides whether something tastes strong, whether it works, and whether it is dangerous."
lv2 = "Amount concentration is amount of substance divided by volume of solution, in mol/L. Adding solvent does not change the amount of solute, which gives the dilution relation: the product of concentration and volume is the same before and after. Titration uses this directly — at the equivalence point the amounts of acid and base are equal, so the unknown concentration follows from the standard's concentration and the two volumes."
lv3 = "Distinguish three quantities that school chemistry runs together: concentration (per litre of solution, temperature-dependent), molality (per kilogram of solvent, temperature-independent, the thermodynamic choice) and activity, which is what equilibrium constants and electrode potentials actually contain. The activity coefficient comes from a model with a stated validity range, and Kerotakis surfaces both the number and the model — put the same brine question to three databases and they disagree about how much salt stays undissolved, each answer labelled with the activity model behind it. That disagreement is not a defect to be hidden; it is a model boundary made visible by driving the model past it."

[model.provenance]
source = "Standard curriculum; activity models and their validity ranges declared by the PHREEQC databases themselves (USGS, public domain), read out of the database files rather than assumed"
licence = "PHREEQC databases: USGS User Rights Notice (public-domain-like, attribution)"
computed_by = "Kerotakis L2 (PHREEQC via IPhreeqc)"

# ============================================================ acids and bases

[[model]]
id = "arrhenius"
name = "Arrhenius acid-base model (Arrhenius-Definition)"
power = "The first definition that makes acid a statement about composition rather than about taste. It predicts that every acid neutralises every base to give a salt and water, explains why acid and alkali solutions conduct, and reduces hundreds of neutralisations to a single ionic equation."
explains = [
  "acids as substances that give H+ in water, bases as substances that give OH-",
  "neutralisation as one reaction: H+ plus OH- gives water",
  "why acid and alkali solutions conduct electricity",
  "salt formation as what is left over",
  "the pH scale in water",
  "why a strong acid conducts better than a weak one at the same concentration",
]
fails_at = [
  "It cannot explain why ammonia is a base. There is no hydroxide anywhere in NH3, and its solution is alkaline anyway. That single fact is what forced the next model.",
  "It is confined to water. Hydrogen chloride dissolved in benzene, or acid-base chemistry in liquid ammonia, is invisible to it.",
  "The bare proton it invokes does not exist in solution; at minimum it is hydrated as H3O+.",
  "It defines an acid by what the substance contains rather than by what happens in the reaction, so it cannot say that a species acts as an acid in one reaction and a base in another.",
]
superseded_by = "broensted-lowry"
requires = ["ionenbindung", "konzentration"]
embodied_by = "Faithfully, and that is a limitation worth showing. PHREEQC's model is aqueous, so all of the engine's acid-base chemistry lives inside Arrhenius's domain even where the codex speaks Brønsted's language. An acid in a non-aqueous solvent is not merely unimplemented here; it is outside what the solver can express."

[model.registers]
lv1 = "Some liquids taste sour and fizz on metals; others feel slippery and soapy. The sour ones put a special positive scrap into the water, and the soapy ones put in a scrap that cancels it exactly. Mix the right amounts and both disappear, leaving salty water. That is what neutral means — and in a lab you never taste anything to find out."
lv2 = "Arrhenius (1887): an acid dissociates in water to give H+, a base to give OH-. Hydrochloric acid gives H+ and Cl-; sodium hydroxide gives Na+ and OH-. Every neutralisation is then the same reaction, H+ plus OH- to water, with the remaining ions making up a salt. Acid strength is the extent of that dissociation, which is why hydrochloric acid conducts far better than acetic acid at equal concentration."
lv3 = "Arrhenius's theory of electrolytic dissociation was radical enough in 1887 to nearly cost him his doctorate and won him the Nobel Prize in 1903; its strength was quantitative, since conductivity data and colligative anomalies both fell out of the same idea. Its boundary is structural rather than accidental: by defining acidity as a property of a substance dissolved in water, it has no way to describe a proton transfer, which is why ammonia's basicity has no explanation inside it and why what follows is a change of subject rather than an extension."

[model.provenance]
source = "Arrhenius, Zeitschrift für physikalische Chemie, 1887 (Nobel Prize in Chemistry, 1903)"

[[model]]
id = "broensted-lowry"
name = "Brønsted-Lowry model (Brønsted-Lowry, Protonenübergang)"
power = "Redefines acid and base as roles in a reaction rather than properties of substances, and with that one move explains ammonia, buffers, why salt solutions can be acidic or basic, water's ability to act as both, and acid-base chemistry outside water entirely. It also makes acid strength comparative and tabulated: conjugate pairs order themselves, and the transfer runs from the stronger acid to the stronger base."
explains = [
  "ammonia as a base with no hydroxide in it",
  "conjugate acid-base pairs",
  "amphoteric species such as water and hydrogencarbonate",
  "why sodium acetate solution is basic and ammonium chloride solution acidic",
  "buffers, and why they resist added acid",
  "the shape of a titration curve",
]
fails_at = [
  "There has to be a proton. It has nothing to say about boron trifluoride meeting ammonia, about metal-ion catalysis, or about why aluminium chloride is called an acid at all.",
  "Its strength scale is bound to the solvent. In water every acid stronger than H3O+ looks equally strong, so hydrochloric, hydrobromic and perchloric acid cannot be told apart in water at all.",
  "It gives position and direction but no rate, and proton transfers are not always fast — carbon acids can be extremely slow.",
  "A pKa is not a constant of nature. It shifts with ionic strength, which is why a textbook table and a real pH meter disagree.",
]
superseded_by = "lewis-saeure-base"
requires = ["arrhenius", "chemisches-gleichgewicht", "donator-akzeptor"]
embodied_by = "This is the model the aqueous solver actually runs on. PHREEQC's databases are built from proton-transfer equilibria with their own log K values, so the codex's weak-acid pH, its buffer and its titration curve are Brønsted equilibria being solved rather than formulae being applied — including the parts that embarrass the textbook, such as phosphate's conditional pKa2 reading about 6.65 at working ionic strength instead of 7.2."

[model.registers]
lv1 = "Forget sour and soapy. An acid is anything that hands over a proton — one tiny positive particle — and a base is anything that takes one. So being an acid is not something a substance is, it is something it does, and with a different partner the same substance can do the opposite. Water does both: it gives protons to ammonia and takes them from vinegar."
lv2 = "Brønsted and Lowry (1923): an acid is a proton donor, a base a proton acceptor, and every acid-base reaction is a proton transfer between two conjugate pairs. Ammonia plus water gives ammonium plus hydroxide, with no hydroxide needed in the ammonia. Water is amphoteric. Ka, and its negative logarithm pKa, measures how far the transfer to water goes, so the direction of any proton transfer can be read straight off a pKa table: from the stronger acid to the stronger base."
lv3 = "This is the German curriculum's Protonenübergang and, with redox, the standard instance of the donor-acceptor pattern. Its structural advance is that acidity becomes a property of a couple rather than of a compound, which is what lets conjugate pairs, buffers and the levelling effect all be stated in one language. Two refinements belong at this level: the proton in water is not free, and the hydronium formulation is itself a simplification of Eigen and Zundel structures; and tabulated Ka values are thermodynamic constants at infinite dilution that must be converted to conditional constants at real ionic strength before they will match an instrument."

[model.provenance]
source = "Brønsted, Recueil des Travaux Chimiques des Pays-Bas, 1923, and Lowry, 1923, independently; conditional constants and ionic-strength corrections per Stumm & Morgan, Aquatic Chemistry"
computed_by = "Kerotakis L2 (PHREEQC, minteq.v4 for the phosphate case)"

[[model]]
id = "lewis-saeure-base"
name = "Lewis acid-base model (Lewis-Säure-Base-Konzept)"
power = "Generalises acidity from gives a proton to accepts an electron pair, which brings metal ions, boron trifluoride, catalysis, complex formation and much of organic mechanism under one heading. It also joins the acid-base story to the donor-acceptor story and to curly arrows: a nucleophile is a Lewis base and an electrophile a Lewis acid."
explains = [
  "the adduct of boron trifluoride and ammonia, an acid-base reaction with no proton in it",
  "why solutions of aluminium and iron(III) salts are acidic",
  "complex formation between a metal ion and its ligands",
  "Friedel-Crafts catalysis",
  "nucleophile and electrophile as one idea rather than two vocabularies",
  "the proton as a special case: an acceptor with no electrons of its own",
]
fails_at = [
  "There is no single strength scale. Lewis acid strength depends on which base you measure it against, which is why the hard-and-soft classification had to be invented and why it stays qualitative.",
  "It is so general that it stops discriminating: under this definition nearly every reaction is an acid-base reaction, which is true and rarely useful.",
  "It gives nothing quantitative for aqueous acidity, so the proton chemistry a school course actually needs still runs on Brønsted.",
]
requires = ["broensted-lowry", "elektronenpaarbindung", "kugelwolkenmodell"]
embodied_by = "Partly, and by the back door. The databases carry metal-complexation equilibria — the neutral AgCl(aq) complex and the hydrolysis of metal aquo ions are Lewis acid-base chemistry — but the solver has no notion of a Lewis acid. It has log K values for complexes. The concept explains the numbers; it does not produce them."

[model.registers]
lv1 = "The deepest version of acid has nothing to do with protons at all. Some atoms have a spare pair of electrons to offer and some have an empty space that would fit one. Put them together and the pair moves in, making a bond out of one partner's electrons alone. A proton is simply the smallest thing there is with an empty space — so the older rules were a special case of this one all along."
lv2 = "Lewis (1923): an acid accepts an electron pair, a base donates one, and the result is a coordinate or dative bond. Boron trifluoride plus ammonia is an acid-base reaction with no proton anywhere. H+ fits the definition as the limiting case. It also explains why solutions of Al3+ and Fe3+ are acidic — the metal ion is a Lewis acid polarising its water ligands until one of them releases a proton — and why complex formation, catalysis and nucleophilic attack are all the same kind of event."
lv3 = "Lewis subsumes Brønsted, which subsumes Arrhenius; Usanovich's broader definition subsumes Lewis in turn and is not used, because it dissolves the distinction entirely. The practical weakness is the absence of a universal scale: Lewis acidity is base-dependent, addressed empirically by Pearson's hard-and-soft principle and by Drago-Wayland parameters rather than by one number. This is also the clearest case in the curriculum of a model succession that is a generalisation rather than a correction — Arrhenius is not wrong within water, it is a special case — and that difference is worth naming aloud, because learners otherwise infer that each earlier model was simply mistaken."

[model.provenance]
source = "Lewis, Valence and the Structure of Atoms and Molecules (1923); Pearson, Hard and soft acids and bases, Journal of the American Chemical Society, 1963. Editorial judgement (Kerotakis): flagging Arrhenius to Brønsted to Lewis as generalisation rather than correction is our emphasis, chosen because the progression is otherwise read as three successive refutations"

# ================================================================ thermodynamics

[[model]]
id = "enthalpie"
name = "Enthalpy (Enthalpie, Reaktionsenthalpie)"
power = "Puts a number on it got hot. Energy becomes a bookkeeping quantity like mass: tabulated per substance, additive along any route, and therefore predictable for reactions nobody has ever measured. It also says why making bonds releases energy and breaking them costs it, so a reaction's heat can be estimated from a table."
explains = [
  "exothermic and endothermic reactions",
  "why some things warm the beaker on dissolving and others chill it",
  "calorimetry, and how a heat of reaction is measured",
  "Hess's law: the same heat by any route",
  "standard formation enthalpies, and reaction enthalpies computed from them",
  "the energy content of fuels and of food",
]
fails_at = [
  "It does not predict whether a reaction happens, although it feels as though it should. Ammonium nitrate dissolving is strongly endothermic and happens by itself; ice above zero absorbs heat and melts anyway. Systems tend towards lower energy is the most common false generalisation in school chemistry.",
  "Bond-enthalpy estimates are averages taken across many different molecules, so they can be tens of kilojoules per mole out, and they apply to gases rather than to liquids or solids.",
  "It is defined at constant pressure and says nothing about how the energy is distributed, or about its own temperature dependence, until heat capacities are brought in.",
]
superseded_by = "gibbs-energie"
requires = ["massenerhaltung", "stoffmenge"]
embodied_by = "Directly, and with its own stated limits. Each vessel carries an energy balance: enthalpy is tracked as the sum of amount times heat capacity above 298.15 K, mixing solves for a common temperature rather than assuming one, and curated dissolution enthalpies move the thermometer — calcium chloride is a hot pack, potassium chloride a cold one. Two honest gaps: heat capacities are treated as temperature-independent in the aqueous path, and curated reactions carry no reaction enthalpy yet, so no heat effect is applied where none is known. The thermal solver is separate and better founded — NASA-9 polynomials give H(T) per species, and an adiabatic vessel is solved enthalpy-conserving rather than by dividing a reaction enthalpy by a heat capacity."

[model.registers]
lv1 = "Reactions do not only change what things are, they change how hot things are. Some give heat out, so the beaker warms up: burning, and the packs you snap to warm your hands. Some take heat in, so the beaker goes cold enough to freeze a puddle to the bench — that is what a cold pack is. Pulling things apart always costs energy and joining them up always gives energy back, and whichever is bigger decides whether it warms or cools."
lv2 = "The enthalpy change is the heat exchanged at constant pressure: negative when heat is released, positive when it is absorbed. It is a state function, so Hess's law lets it be added along any route, and standard formation enthalpies let any reaction's value be found as products minus reactants. Estimated from bonds, it is the energy of the bonds broken minus the energy of the bonds formed."
lv3 = "Enthalpy is internal energy plus pressure times volume, and its change equals the heat at constant pressure for a closed system doing only expansion work. Hess's law is a consequence of its being a state function, and the whole tabulated apparatus of thermochemistry rests on that one property. Its temperature dependence follows from the difference in heat capacities, which is exactly what the NASA-9 polynomial form encodes: seven coefficients per temperature interval yielding heat capacity, enthalpy and entropy for a species. The decisive teaching point here is negative — enthalpy is not the criterion for spontaneity, and treating it as one is a persistent documented misconception that the next two models exist to correct."

[model.provenance]
source = "Standard thermodynamics; Hess's law (1840). The misconception that exothermicity determines spontaneity documented by Boo, Journal of Research in Science Teaching, 1998, and Sözbilir & Bennett, Journal of Chemical Education, 2007"
licence = "NASA CEA thermo.inp: Apache-2.0"
computed_by = "kerotakis-core's vessel energy balance; kerotakis-cea for H(T) from NASA-9 coefficients"

[[model]]
id = "entropie"
name = "Entropy (Entropie)"
power = "Supplies the second reason things happen. Once you can count how many ways a state can be arranged, you can predict that gases mix and never unmix, that some solids dissolve even though it costs energy, and that heat flows one way only — none of which enthalpy can give you. It turns why does anything happen by itself into a question with an answer."
explains = [
  "why mixing is irreversible: milk never comes back out of the coffee",
  "why a salt can dissolve while making the beaker cold",
  "why a gas expands into a vacuum with no push",
  "why heat flows from hot to cold and never back",
  "why a reaction that makes a gas has a strongly positive entropy change",
  "why a perfect crystal is the low-entropy case",
]
fails_at = [
  "Entropy is disorder is the metaphor that does most of the damage. Disorder is undefined, and the cases that matter look like the metaphor's opposite: oil separating from water and a supercooled liquid freezing both look tidier and are both entropy-driven overall.",
  "The system's entropy alone predicts nothing. Water freezing lowers it and is spontaneous below zero, because the surroundings gain more than the system loses — and counting the surroundings is exactly the step learners skip.",
  "It is statistical, so it is a near-certainty rather than a law: small systems fluctuate the wrong way, and the second law is a statement about overwhelming probability.",
  "It gives no rate at all. Diamond turning into graphite raises the entropy of the universe and takes geological time.",
]
requires = ["teilchenmodell", "enthalpie"]
embodied_by = "Computed and deliberately not displayed. NASA-9 coefficients give an entropy for every species at every temperature, and it drives the Gibbs minimiser — but no result field in Kerotakis carries an entropy, so what a learner sees is the consequence rather than the quantity. The consequence is real enough: at 3000 K the combustion products visibly break up into CO, OH and H, which is entropy outbidding bond energy, computed rather than asserted."

[model.registers]
lv1 = "There are far more ways for things to end up mixed than tidy, so mixing happens by itself and unmixing never does. Stir milk into coffee and it will not come back out however long you keep stirring. Heat spreads out for the same reason: there are more ways to share the jiggling around than to keep it all in one corner. This is why things happen on their own even when no energy is released."
lv2 = "Entropy counts the microscopic arrangements a state can be made of. It rises when gases form, when solids dissolve, and whenever anything mixes. The second law says the entropy of the universe never decreases in a spontaneous process, which means the system's change plus the surroundings' change must be positive. That is how an endothermic dissolution can still happen by itself: the system gains more entropy than the surroundings lose in giving up the heat."
lv3 = "Boltzmann's statistical definition and Clausius's thermodynamic one are the two faces of the same quantity, and the third law fixes the zero — which is why absolute entropies are tabulated where enthalpies must be referred to formation. Teach it as the spreading of energy over accessible states rather than as disorder: the disorder metaphor is criticised in the chemistry-education literature precisely because it mispredicts the interesting cases, from protein folding to hydrophobic aggregation to crystallisation. The system-only shortcut everyone actually uses is the Gibbs energy, which is the total entropy change wearing different clothes."

[model.provenance]
source = "Clausius (1865); Boltzmann (1877). The case against teaching entropy as disorder is made by Lambert, Journal of Chemical Education, 2002; student difficulties documented by Sözbilir & Bennett, Journal of Chemical Education, 2007"
licence = "NASA CEA thermo.inp: Apache-2.0"
computed_by = "kerotakis-cea (S(T) from NASA-9 coefficients, used internally by the Gibbs minimiser)"

[[model]]
id = "gibbs-energie"
name = "Gibbs free energy (Gibbs-Energie, freie Enthalpie)"
power = "The single criterion for whether a reaction can happen at all. It folds enthalpy and entropy into one number whose sign answers the question every earlier model dodged, tells you the temperature at which the answer flips, and — through its relation to the equilibrium constant — makes does it go and how far does it go the same calculation. It is the top of the school chemistry model hierarchy."
explains = [
  "why some reactions are spontaneous and others are not",
  "why endothermic reactions can happen by themselves",
  "why limestone decomposes in a kiln and not in a beaker",
  "why some reactions reverse on heating",
  "the link between the free-energy change and the equilibrium constant",
  "cell voltages, and why a battery has the voltage it has",
]
fails_at = [
  "Spontaneous means possible, not actual. Diamond, petrol in air and a stick of dynamite are all thermodynamically doomed and are all sitting still. The free energy says nothing about rate, and every kinetics model exists in the gap it leaves.",
  "It is the criterion at constant temperature and pressure only. At constant volume the right quantity is the Helmholtz energy, and far from equilibrium neither applies.",
  "The standard free-energy change tells you where equilibrium lies, not which way your actual mixture will move. That needs the reaction quotient compared with the constant, and the two are confused constantly.",
  "Tabulated values assume ideal behaviour: in real solutions activity coefficients matter, and in melts and solid solutions the mixing terms defeat simple tables.",
]
requires = ["enthalpie", "entropie", "chemisches-gleichgewicht"]
embodied_by = "This is the engine's floor. kerotakis-cea minimises the mixture's total Gibbs energy directly — the Gordon and McBride formulation, one Lagrange multiplier per element, a damped Newton iteration on the logarithms of the amounts, condensed phases admitted or dropped by comparing chemical potentials — so is this possible is not looked up anywhere. It is the answer to an optimisation. Chalk is stable at 800 K and fully calcined by 1400 K with the decomposition temperature computed, and methane in air reaches an adiabatic flame temperature near 2225 K, found by bisecting on enthalpy, because that is where the free energy is lowest."

[model.registers]
lv1 = "Whether something happens by itself is a contest between two things: does it give out heat, and does it end up more spread about. If both say yes it happens. If both say no it never does. If they disagree, the temperature is the referee — which is why water freezes by itself when it is cold and not when it is warm, and why chalk turns to quicklime only once the kiln is hot enough. But can happen is not will happen soon: a diamond ought to turn into pencil lead, and does not, because nothing pushes it over the hill."
lv2 = "The Gibbs energy change is the enthalpy change minus the temperature times the entropy change. Negative means the reaction is spontaneous as written, positive means the reverse is, zero means equilibrium. Because the entropy term is multiplied by temperature, a reaction that absorbs heat but increases entropy becomes spontaneous above a switch-over temperature — the enthalpy change divided by the entropy change — which is exactly why limestone decomposes in a kiln and not in a beaker. At equilibrium the standard free-energy change is fixed by the equilibrium constant, so free energy and K are one statement in two notations."
lv3 = "The Gibbs energy is enthalpy minus temperature times entropy, and at constant temperature and pressure a spontaneous change lowers it — which is the second law rewritten in variables belonging to the system alone. Equilibrium is then the minimum of G subject to element-balance constraints, and that is a computable statement rather than a rhetorical one: it is literally what a Gibbs minimiser does, and what PHREEQC's mass-action formulation is equivalent to. Two boundaries this codex insists on. Spontaneity is not rate, which is why the thermal solver stands down below 500 K instead of oxidising every metal on the bench. And the standard state is a choice, so the standard free-energy change and the actual one answer different questions."

[model.provenance]
source = "Gibbs, On the equilibrium of heterogeneous substances, Transactions of the Connecticut Academy, 1876-78; minimiser formulation from Gordon & McBride, NASA RP-1311; thermodynamic data from NASA CEA thermo.inp"
licence = "NASA CEA data: Apache-2.0; NASA RP-1311: US Government work"
computed_by = "kerotakis-cea (Gibbs minimisation over NASA-9 polynomials)"

[[model]]
id = "thermodynamische-vs-kinetische-kontrolle"
name = "Thermodynamic versus kinetic control"
power = "Separates two questions that beginners hear as one: which product is the most stable, and which product you actually get. Once they come apart, a whole class of otherwise baffling observations becomes predictable — why the blue precipitate is not the black one, why diamond does not turn into graphite on the shelf, why the shelf itself is not on fire. It also tells you what to do about it: if the barrier is what stands in the way, heat it, and the stable product appears."
explains = [
  "why adding lye to copper sulfate gives pale blue Cu(OH)2 and not black CuO, even though CuO is the more stable solid",
  "why warming that suspension turns it black — the classic demonstration",
  "why diamond, graphite and every metastable mineral persist indefinitely",
  "why a Gibbs-minimising calculation can be right about the destination and wrong about the beaker",
  "Ostwald's rule of stages: the phase that appears first is often the least stable one available, because it nucleates fastest",
  "why magnesium ribbon sits in air until you light it",
]
fails_at = [
  "It says which product is kinetically preferred only after you already know the barriers. On its own it predicts nothing quantitative — it is a frame for two other models, not a third model that replaces them.",
  "It gives no timescale. \"Metastable\" covers both a precipitate that converts in a minute of warming and a diamond that outlasts the solar system, and nothing in the idea distinguishes them.",
  "Nucleation, not just the activation barrier, decides which solid appears first, and surface energy and supersaturation belong to a theory this framing does not contain.",
  "Applied carelessly it becomes unfalsifiable: any disagreement between calculation and observation can be waved away as kinetics. It is only worth anything when the barrier is named and the conditions that overcome it are stated.",
]
requires = ["stossmodell", "gibbs-energie", "energieprofil"]
embodied_by = "Directly, and with the seam visible. The aqueous engine minimises free energy, so left alone it returns tenorite (CuO) — more stable than Cu(OH)2 by 1.03 log units in minteq.v4. A beaker gives the blue hydroxide. The registry therefore carries `forms_only_above_k` on copper(II) oxide: below 340 K the phase is withheld from the solver, above it the engine is free to find it, and `heat v1 20kJ` really does turn the blue solid black at 77 C. The threshold is curated and says so — a stated stand-in for a rate we do not model, not a measurement. The same admission appears twice more in the engine: the thermal solver stands down below 500 K rather than oxidising every metal on the bench, and the aqueous solver now reports when a solution is supersaturated against a phase it is holding back, so the kinetic claim is visible rather than silent."

[model.registers]
lv1 = "Chemistry has a favourite answer and a fast answer, and they are not always the same one. Mix the blue copper liquid with drain cleaner and you get a pale blue jelly. That jelly is not what the chemistry would settle on if it had forever — the black powder is — but the jelly forms quickly and then just sits there, because turning into the black powder is hard work. Warm it up and it turns black in front of you. Most of the world is like this: your chair is not the most stable thing its atoms could be, it is just stuck."
lv2 = "Two different questions: which product has the lowest free energy (thermodynamic control) and which product forms fastest (kinetic control). At low temperature the fastest-forming product wins and can persist indefinitely, because the barrier to rearranging into the stable one is far larger than the available thermal energy. Raise the temperature and the barrier becomes surmountable, so the stable product takes over. Cu(OH)2 versus CuO is the school case; Ostwald's rule of stages generalises it, saying that a crystallising system tends to pass through the least stable form first because that is the one that nucleates most easily."
lv3 = "The distinction is between a state function and a rate. Equilibrium thermodynamics fixes the destination and is silent on the path, so a free-energy minimisation is answering a question the beaker may not be asking. Where barriers greatly exceed RT the observed composition is set by the relative heights of transition states, and Curtin-Hammett conditions describe when product ratios follow those barriers rather than the reactant populations. For precipitation the controlling quantity is nucleation: classical nucleation theory makes the critical radius depend on interfacial energy over supersaturation, so the phase with the lowest interfacial energy against the solution can nucleate first even when it is not the most stable bulk phase — Ostwald's rule made quantitative. The important epistemic point for a computational lab: any engine that minimises G is structurally incapable of discovering this, and must be told. That is why our kinetic thresholds are data with provenance rather than solver internals, and why the lab reports the phases it is deliberately withholding."

[model.provenance]
source = "Ostwald, Zeitschrift für physikalische Chemie, 1897, for the rule of stages; standard treatments of kinetic versus thermodynamic control; Curtin-Hammett per standard physical organic chemistry; classical nucleation theory per standard treatments. log_k values for Cu(OH)2 (8.674) and Tenorite (7.644) from minteq.v4.dat (USGS/MINTEQA2). Editorial judgement (Kerotakis): the 340 K threshold at which we let tenorite form is a stated stand-in for a rate we do not model — every source we have describes the blue-to-black conversion qualitatively, so the number is chosen to match the demonstration rather than measured"
computed_by = "kerotakis-phreeqc (phase suppression via species::forms_only_above_k; saturation indices read back from the PHREEQC report)"
