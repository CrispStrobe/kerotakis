# The Kerotakis codex — inorganic aqueous and thermal chemistry.
#
# Every entry is replayed through the real solvers by `kero codex lint`:
# the setup script runs, and the claimed observations must actually occur.
# An entry that stops being true fails the build.
#
# Licence: Kerotakis-authored codex text is CC BY 4.0, separately from the
# AGPL code. Third-party facts and data retain the terms named per entry.

# ---------------------------------------------------------------- dissolving

[[reaction]]
id = "salt-dissolves"
progress = "starter"
spine = ["die-eigenschaften-von-salzen"]
equation = "NaCl(s) → Na⁺(aq) + Cl⁻(aq)"
concepts = ["dissolving", "solutions", "ions"]

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium NTG Jgst. 8, LB2 Stoffe und ihre Eigenschaften (23 Std.)"
ages = { min = 13.0, max = 14.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium NTG Jgst. 8 (ISB)"

[[reaction.curriculum]]
system = "england-national-curriculum"
stage = "KS3 Chemistry, Pure and impure substances — dissolving"
ages = { min = 11.0, max = 14.0 }
source = "Department for Education, National curriculum in England: science programmes of study, KS3 Chemistry (DfE-00182-2013, updated 2014)"

[reaction.setup]
script = """
add v1 water 100mL
add v1 NaCl 2g
"""

[reaction.expect]
events = ["dissolved:NaCl"]
ph = { min = 6.5, max = 7.5 }

[reaction.registers]
lv1 = "The salt disappears into the water. It hasn't gone away — taste it and it's still there, hiding as tiny pieces too small to see."
lv2 = "Sodium chloride dissolves, separating into hydrated Na⁺ and Cl⁻ ions. The solution stays neutral because neither ion reacts with water."
lv3 = "Congruent dissolution to fully dissociated Na⁺/Cl⁻; pH unaffected as neither ion hydrolyses appreciably. Activity coefficients follow the WATEQ Debye–Hückel extension at this ionic strength."

[reaction.provenance]
source = "Standard curriculum chemistry; solubility and speciation from PHREEQC wateq4f.dat (USGS)"
computed_by = "PHREEQC via Kerotakis L2"

[[reaction]]
id = "salt-saturates"
progress = "starter"
equation = "NaCl(s) ⇌ Na⁺(aq) + Cl⁻(aq)  (saturated at ≈6.1 mol/kgw)"
concepts = ["solubility-limit", "saturation", "equilibrium"]
requires = ["dissolving"]

[[reaction.curriculum]]
system = "nrw-kernlehrplan-g9"
stage = "Sek I, Zweite Stufe (Jg. 9/10), IF6 Salze und Ionen"
ages = { min = 14.0, max = 16.0 }
source = "Kernlehrplan Chemie Gymnasium G9 NRW, Heft 3415 (RdErl. 23.06.2019)"

[[reaction.curriculum]]
system = "bayern-lehrplanplus"
stage = "Gymnasium NTG Jgst. 8, LB2 Stoffe und ihre Eigenschaften (23 Std.)"
ages = { min = 13.0, max = 14.0 }
source = "LehrplanPLUS Bayern, Fachlehrplan Chemie Gymnasium NTG Jgst. 8 (ISB)"

[[reaction.curriculum]]
system = "england-national-curriculum"
stage = "KS3 Chemistry, Pure and impure substances — solubility and saturation"
ages = { min = 11.0, max = 14.0 }
source = "Department for Education, National curriculum in England: science programmes of study, KS3 Chemistry (DfE-00182-2013, updated 2014)"

[reaction.setup]
script = """
add v1 water 1000mL
add v1 NaCl 468g
"""

[reaction.expect]
events = ["dissolved:NaCl"]

[reaction.registers]
lv1 = "Keep stirring salt into the water and at some point it stops disappearing — the water is full. The rest just sits at the bottom."
lv2 = "Above the solubility limit (≈6.1 mol per kg of water at 25 °C) the solution is saturated: dissolved and solid salt sit in equilibrium, and any extra stays solid."
lv3 = "Halite saturation. Note the datasets disagree in this regime — Pitzer's ion-interaction model gives ≈6.13 mol/kgw against wateq4f's 6.50 and minteq.v4's 3.7, which is why concentrated problems route to Pitzer. `explain` shows all three."

[reaction.provenance]
source = "Solubility of NaCl, standard reference value ≈ 6.1 mol/kgw at 25 °C"
computed_by = "PHREEQC (pitzer.dat) via Kerotakis L2"

# ------------------------------------------------------------- precipitation

[[reaction]]
id = "silver-chloride-precipitation"
progress = "starter"
equation = "AgNO₃(aq) + NaCl(aq) → AgCl(s)↓ + NaNO₃(aq)"
concepts = ["precipitation", "insoluble-salts", "ionic-equations"]
requires = ["dissolving"]

[[reaction.curriculum]]
system = "nrw-kernlehrplan-g9"
stage = "Sek I, Zweite Stufe (Jg. 9/10), IF6 Salze und Ionen"
ages = { min = 14.0, max = 16.0 }
source = "Kernlehrplan Chemie Gymnasium G9 NRW, Heft 3415 (RdErl. 23.06.2019, Amtsblatt 07-08/19)"

[reaction.setup]
script = """
add v1 water 100mL
add v1 NaCl 0.58g
add v1 AgNO3 1.70g
"""

[reaction.expect]
events = ["precipitated:AgCl"]
absent = ["hazard_warning"]

[reaction.registers]
lv1 = "Two clear liquids — and the moment they meet, the water turns cloudy white! A brand-new solid has appeared out of nowhere."
lv2 = "Ag⁺ + Cl⁻ → AgCl↓. Silver chloride is insoluble (Ksp ≈ 1.8 × 10⁻¹⁰), so it drops out of solution while the sodium and nitrate ions stay dissolved as spectators."
lv3 = "Cerargyrite precipitation to SI = 0. Residual dissolved silver is not free Ag⁺ alone: the AgCl(aq) neutral complex is present at ≈3 × 10⁻⁷ m, which is why the apparent solubility exceeds the naive √Ksp."

[reaction.provenance]
source = "Standard curriculum precipitation reaction; Ksp and speciation from PHREEQC wateq4f.dat (USGS)"
computed_by = "PHREEQC via Kerotakis L2"

