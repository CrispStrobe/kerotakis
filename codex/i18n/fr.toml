"one-substance-two-phases-through-a-filter.summary" = "L'équilibre répartit la silice entre deux phases ; la filtration sépare ces phases, pas le nom de la substance"
"one-substance-two-phases-through-a-filter.expect.predict.question" = "Une partie d'une même dose de silice est solide et une autre dissoute avant filtration. Où va la silice ?"
"one-substance-two-phases-through-a-filter.expect.predict.options" = ["Toute la silice reste sur le papier, car les filtres reconnaissent la substance", "La silice solide reste sur le papier tandis que la silice dissoute suit l'eau jusqu'au récipient de réception"]
"one-substance-two-phases-through-a-filter.expect.predict.misconception" = "Une méthode de séparation est traitée comme sélectionnant une identité chimique plutôt qu'une phase physique."
"one-substance-two-phases-through-a-filter.expect.predict.diagnosis.0.reveals" = "Les portions dissoute et solide de la même substance se seraient vu attribuer le même comportement de filtre."
"one-substance-two-phases-through-a-filter.expect.predict.diagnosis.0.next" = "Examine les deux récipients après filtration et compare leurs inventaires de SiO2 sans perdre de vue le bilan de silicium de tout le banc."
"one-substance-two-phases-through-a-filter.registers.lv1" = "Le papier capture les grains solides, mais il ne peut pas capturer la silice qui a rejoint l'eau. Une même substance peut prendre deux chemins parce qu'elle occupe deux phases."
"one-substance-two-phases-through-a-filter.registers.lv2" = "L'équilibre aqueux dissout une plus petite partie de la dose de silice avant filtration. Le filtre retient le solide restant dans v1 et transfère la silice aqueuse avec l'eau vers v2 ; leur quantité combinée de SiO2 est conservée."
"one-substance-two-phases-through-a-filter.registers.lv3" = "C'est un test de registre de phase, pas une règle de solubilité tout-ou-rien. Une affirmation sémantique conserve le SiO2 total à travers l'opération, et une autre exige que l'inventaire de solide retenu dépasse l'inventaire dissous dans le filtrat. L'équilibre thermodynamique omet la vitesse de dissolution, la distribution de taille des grains et l'adsorption, tandis que le filtre idéal omet les pores, l'entraînement et les pertes."
