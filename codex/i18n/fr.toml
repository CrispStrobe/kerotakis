"endpoint-is-not-a-full-drop.summary" = "Un pas d'essai grossier encadre le point final ; un pas partiel calculé l'atteint"
"endpoint-is-not-a-full-drop.expect.predict.question" = "L'acide nécessite environ 23 mL de solution titrante. Le calcul automatique essaie des pas de 7 mL. Doit-il s'arrêter à 28 mL ?"
"endpoint-is-not-a-full-drop.expect.predict.options" = ["Oui : le pas d'essai détermine la précision du point final", "Non : il peut affiner l'encadrement et n'appliquer qu'une partie du dernier pas"]
"endpoint-is-not-a-full-drop.expect.predict.misconception" = "Un intervalle d'essai n'est pas une goutte physique minimale. Le solveur numérique peut recalculer un ajout plus petit à partir du même état antérieur à l'ajout."
"endpoint-is-not-a-full-drop.expect.predict.diagnosis.0.reveals" = "Un paramètre de recherche est pris pour une dose physique indivisible."
"endpoint-is-not-a-full-drop.expect.predict.diagnosis.0.next" = "Compare les pH finaux et les volumes délivrés pour des incréments d'essai de 7 mL et de 1 mL ; distingue ensuite cette précision numérique de l'incertitude de l'instrument."
"endpoint-is-not-a-full-drop.registers.lv1" = "Les deux burettes virtuelles peuvent s'arrêter à la même cible, même si l'une cherche par pas plus grands. Elles n'ont pas besoin de verser la totalité de la dernière dose d'essai."
"endpoint-is-not-a-full-drop.registers.lv2" = "Pour la réaction 1:1, V = n/c = 0,0023 mol / (0,1 mol/L) = 0,023 L. Compare cette estimation du volume équivalent au volume calculé ; le pH 7 est la cible choisie, pas une définition universelle du point d'équivalence à toute température."
"endpoint-is-not-a-full-drop.registers.lv3" = "Chaque essai inclut l'eau porteuse, le changement de température et la résolution du système aqueux. Une fois la cible encadrée, l'algorithme restaure l'état antérieur à l'ajout pour chaque raffinement et n'applique qu'une seule dose partielle acceptée. Cela valide la résolution numérique du point final, pas l'étalonnage d'une burette réelle ni l'erreur d'indicateur."
"equilibrium-can-run-backward.summary" = "Un calcul d'équilibre peut former ou consommer de l'ester, selon le mélange initial"
"equilibrium-can-run-backward.expect.predict.question" = "Le second récipient part avec de l'ester et de l'eau, et non de l'acide et de l'alcool. Que peut faire le même calcul d'équilibre ?"
"equilibrium-can-run-backward.expect.predict.options" = ["Rien : une commande de réaction ne consomme que les réactifs nommés dans son intitulé", "Consommer une partie de l'ester et de l'eau pour former de l'acide et de l'alcool"]
"equilibrium-can-run-backward.expect.predict.misconception" = "Le nom d'une réaction n'est pas une instruction à sens unique. Le signe de l'avancement calculé dépend du quotient de réaction initial."
"equilibrium-can-run-backward.expect.predict.diagnosis.0.reveals" = "Le sens direct tel qu'il est écrit est confondu avec une restriction imposée à l'équilibre."
"equilibrium-can-run-backward.expect.predict.diagnosis.0.next" = "Examine les deux inventaires finaux. Change la quantité initiale d'ester ou d'eau et demande-toi quelle direction rapprocherait le quotient de l'équilibre."
"equilibrium-can-run-backward.registers.lv1" = "Un mélange virtuel forme de l'ester ; l'autre en consomme une partie. L'équilibre peut être atteint depuis les deux côtés."
"equilibrium-can-run-backward.registers.lv2" = "Pour acide + alcool ⇌ ester + eau, le modèle de mélange idéal utilisé donne Q = n(ester)n(eau)/(n(acide)n(alcool)) et K = 4. L'avancement borné peut être positif ou négatif ; aucun des deux mélanges de départ n'est tenu de réagir jusqu'à son terme."
"equilibrium-can-run-backward.registers.lv3" = "La commande explicite résout la loi d'action de masse pour l'inventaire courant. Ce n'est pas une simulation cinétique, et elle ne prédit pas la vitesse à laquelle un mélange non catalysé évolue. La dissociation aqueuse et le partage entre phases peuvent modifier les quantités moléculaires affichées ensuite ; le test isolé d'action de masse vérifie donc l'opérateur d'équilibre avant que ces autres mécanismes n'interviennent."

#
# Un fichier par langue, afin que deux traducteurs ne modifient jamais le
# même fichier et que la source anglaise n'ait pas à porter une copie
# par langue. Les clés sont `<entry-id>.<chemin vers le champ anglais>` ;
# les indices de tableau sont des segments.
#
# Une clé sans équivalent dans le catalogue est une erreur, pas une clé
# de réserve : cela signifie que l'anglais a changé et que cette
# traduction décrit quelque chose qui n'existe plus.

"strong-base.expect.predict.question" = "Un millième de mole d'hydroxyde de sodium est versé dans un litre d'eau. Qu'affichera le pH-mètre ?"
"strong-base.expect.predict.options" = ["3", "7 — l'hydroxyde n'est pas un acide, le pH ne peut donc pas bouger", "11"]
"strong-base.expect.predict.misconception" = "Répondre 3 est l'erreur en miroir : l'exposant est correct, mais pas le sens. Une base élève le pH au-dessus de 7 exactement autant que l'acide correspondant l'abaisse en dessous. Répondre 7 traite le pH comme une échelle réservée aux acides, alors que c'est une échelle de l'activité des ions hydrogène, que l'hydroxyde déplace en consommant H⁺."
"strong-base.expect.predict.diagnosis.0.reveals" = "Le calcul est juste, le sens ne l'est pas : 0,001 mol donne l'exposant 3, et chaque exposant est lu comme une acidité — comme si dissoudre quoi que ce soit faisait toujours baisser le pH."
"strong-base.expect.predict.diagnosis.0.next" = "Fais d'abord l'expérience miroir : 0,001 mol de HCl dans le même litre (`strong-acid`) affiche pH 3,0 sur ce banc. Remplace l'acide par du NaOH, et le même exposant retombe à la même distance de 7 — de l'autre côté."
"strong-base.expect.predict.diagnosis.1.reveals" = "Le pH est considéré comme une propriété que possèdent les acides et que les autres substances n'ont pas, si bien qu'une base ne pourrait pas faire bouger l'appareil — plutôt qu'une échelle de l'activité des ions hydrogène, que l'hydroxyde déplace en consommant H⁺."
"strong-base.expect.predict.diagnosis.1.next" = "Mesure d'abord l'eau pure (7,0), puis ajoute l'hydroxyde par dixièmes avec une lecture après chacun : l'appareil grimpe dès le premier ajout — ce qu'une échelle que seuls les acides pourraient toucher serait incapable de faire."
"strong-base.registers.lv1" = "Ce liquide est l'opposé d'un acide. Il donne une sensation glissante — c'est ta propre peau qui se dissout très légèrement — et il fait virer un indicateur au chou rouge vers le vert. Ne le touche jamais."
"strong-base.registers.lv2" = "L'hydroxyde de sodium est une base forte : il se dissocie complètement, si bien que 0,001 mol dans un litre donne [OH⁻] = 10⁻³, un pOH de 3, et un pH de 14 − 3 = 11."
"strong-base.registers.lv3" = "Le moteur n'applique pas pH = 14 − pOH ; il résout le bilan de charge avec Kw à la température propre de la solution et rapporte 10,99, un peu en dessous de 11 parce que le coefficient d'activité de OH⁻ à I = 10⁻³ vaut ≈0,965."
"lye-warms-the-beaker.expect.predict.question" = "Quatre grammes de déboucheur (hydroxyde de sodium) sont versés dans 100 mL d'eau froide. Que fait le thermomètre ?"
"lye-warms-the-beaker.expect.predict.options" = ["Il monte d'environ 10 °C", "Rien — dissoudre n'est pas une réaction chimique, aucune chaleur n'est donc en jeu", "Il baisse, car il faut de l'énergie pour désagréger le solide"]
"lye-warms-the-beaker.expect.predict.misconception" = "Les deux réponses fausses viennent de la même image : dissoudre comme un simple démontage. Briser le réseau cristallin coûte bien de l'énergie — mais l'hydratation des ions en rend davantage, et pour NaOH elle en rend 44,5 kJ par mole. Le fait qu'une solution se réchauffe ou se refroidisse dépend du bilan entre ces deux effets, ce qui explique pourquoi le chlorure de potassium refroidit et pourquoi celui-ci chauffe."
"lye-warms-the-beaker.expect.predict.diagnosis.0.reveals" = "La chaleur est réservée aux « vraies » réactions chimiques, et la dissolution est classée comme un simple mélange — la comptabilité énergétique ne s'ouvre que lorsque de nouvelles substances sont officiellement formées."
"lye-warms-the-beaker.expect.predict.diagnosis.0.next" = "Observe le thermomètre dès la première pastille : la hausse commence avant qu'on puisse parler d'un quelconque produit. Fais ensuite tourner `cold-pack` à côté — le chlorure de potassium fait bouger le même thermomètre dans l'autre sens, ce qui montre que la dissolution elle-même transporte la chaleur, dans les deux sens."
"lye-warms-the-beaker.expect.predict.diagnosis.1.reveals" = "La moitié seulement de l'histoire énergétique : désagréger le réseau coûte, et le compte s'arrête là — donc toute dissolution devrait refroidir. La moitié qui rapporte, la liaison de l'eau aux ions libérés, manque au tableau."
"lye-warms-the-beaker.expect.predict.diagnosis.1.next" = "La comparaison qui isole la moitié manquante est `cold-pack` face à ce becher : KCl refroidit vraiment l'eau, NaOH la réchauffe. Une seule histoire de rupture de réseau ne peut pas produire deux signes différents ; un second terme doit forcément intervenir."
"lye-warms-the-beaker.registers.lv1" = "Le bocal devient si chaud qu'il est inconfortable à tenir — et pourtant rien ne brûlait, rien n'a été chauffé. La chaleur est sortie de la poudre à mesure qu'elle disparaissait."
"lye-warms-the-beaker.registers.lv2" = "0,1 mol de NaOH dans 100 mL libère environ 4,5 kJ. Avec seulement ~100 g d'eau à chauffer, cela donne une hausse d'environ 10 °C, et la solution résultante à 1 mol/L affiche pH ≈ 13,5 — et non les 14,0 promis par le simple calcul."
"lye-warms-the-beaker.registers.lv3" = "Le récipient est adiabatique, si bien que la totalité des −44,5 kJ/mol apparaît sous forme de chaleur sensible. Le pH vaut 13,51 et non 14,0, et *deux* corrections distinctes y mènent. D'abord, à I ≈ 1 mol/kgw le coefficient d'activité de OH⁻ est tombé à ≈0,68, et le moteur rapporte une activité, pas une concentration. Ensuite, le becher s'est lui-même réchauffé à 35,7 °C, et K_w dépend fortement de la température — pK_w passe de 14,00 à 25 °C à environ 13,7 ici — si bien que le point neutre lui-même s'est déplacé sous la mesure. La solution est résolue à la température qu'elle a réellement atteinte, et non à celle de départ, ce qui explique que ce nombre soit inférieur à la valeur de manuel 13,8 : cette dernière maintient silencieusement le becher à 25 °C tout en prétendant qu'il a chauffé."
"neutralisation.expect.predict.question" = "Un litre d'acide à pH 2 reçoit exactement la quantité d'hydroxyde de sodium nécessaire pour l'équilibrer. Que reste-t-il dans le becher ensuite ?"
"neutralisation.expect.predict.options" = ["Rien — l'acide et la base se sont détruits mutuellement", "De l'eau salée : des ions sodium et chlorure dans l'eau, à pH 7", "Un acide plus faible, autour de pH 5"]
"neutralisation.expect.predict.misconception" = "« Ils s'annulent » est l'erreur de neutralisation la plus courante, et elle viole silencieusement la conservation de la matière. Rien n'est détruit : H⁺ et OH⁻ se combinent en eau, et les ions sodium et chlorure sont toujours là, intacts, en tant qu'ions spectateurs. Pose le becher sur une balance — il est plus lourd qu'avant, pas vide."
"neutralisation.expect.predict.diagnosis.0.reveals" = "La neutralisation vue comme une destruction mutuelle — « ils s'annulent » pris au pied de la lettre, si bien que la matière elle-même aurait disparu. La conservation de la matière a été silencieusement suspendue au profit d'une chimie qui paraît plus spectaculaire."
"neutralisation.expect.predict.diagnosis.0.next" = "Pose-le sur la balance : `measure v1 balance` avant et après l'ajout de la base. Le becher est plus lourd, exactement du poids ajouté — et l'évaporer (`crystallising-salt-from-brine`) permet de récupérer le sel solide qui aurait soi-disant été détruit."
"neutralisation.expect.predict.diagnosis.1.reveals" = "La neutralisation vue comme une dilution : la base ne fait que diluer l'acide, si bien que le pH monte partiellement puis se stabilise. Le point stœchiométrique — où le dernier H⁺ rencontre le dernier OH⁻ — n'a aucun statut particulier dans cette image."
"neutralisation.expect.predict.diagnosis.1.next" = "Ajoute la base en dix portions, avec une lecture de pH entre chacune. Une simple dilution monterait régulièrement et se stabiliserait en dessous de 7 ; la courbe réelle progresse lentement, puis bondit de quatre unités au moment où les deux réserves s'épuisent ensemble (`past-the-equivalence-point` se trouve de l'autre côté de ce saut)."
"neutralisation.registers.lv1" = "Mélange le liquide acide et le liquide glissant dans exactement les bonnes proportions, et tu obtiens… de l'eau salée. Les deux substances dangereuses se sont transformées en quelque chose que tu pourrais (en principe) boire."
"neutralisation.registers.lv2" = "H⁺ + OH⁻ → H₂O. Des quantités égales d'un acide fort et d'une base forte ne laissent que les ions spectateurs Na⁺ et Cl⁻, si bien que la solution est du chlorure de sodium à 0,01 mol/L, à pH 7."
"neutralisation.registers.lv3" = "Le moteur rapporte 7,00 et suit explicitement les ions spectateurs : 0,01 mol chacun de Na⁺ et Cl⁻ restent dans l'inventaire, [H⁺] = [OH⁻] = 1,10 × 10⁻⁷ mol/kgw avec γ ≈ 0,90. La réaction n'est jamais inscrite dans le moteur — elle résulte de la minimisation de l'énergie libre de la solution."
"past-the-equivalence-point.summary" = "HCl + 1,1 NaOH → NaCl + H₂O + 0,1 NaOH (excès)"
"past-the-equivalence-point.expect.predict.question" = "Tu as neutralisé l'acide exactement, puis tu ajoutes 10 % de base en trop. Que devient le pH ?"
"past-the-equivalence-point.expect.predict.options" = ["Il grimpe lentement jusqu'à environ 7,5", "Il bondit jusqu'à environ 11", "Il ne peut pas dépasser 7, car l'acide est déjà épuisé"]
"past-the-equivalence-point.expect.predict.misconception" = "S'attendre à une montée douce revient à traiter l'échelle de pH comme linéaire, alors qu'elle est logarithmique. Près du point d'équivalence, il ne reste presque rien pour absorber l'hydroxyde ajouté, si bien qu'un excès de 10 % déplace le pH de près de quatre unités — c'est précisément ce qui permet à un indicateur de marquer un point final, et ce qui fait qu'une goutte de trop ruine une titration."
"past-the-equivalence-point.expect.predict.diagnosis.0.reveals" = "L'axe du pH est lu de façon linéaire : dix pour cent de base en plus devrait produire un déplacement de dix pour cent. Le fait que l'échelle soit logarithmique — et qu'il ne reste plus rien pour absorber l'excès — n'a pas encore été compris."
"past-the-equivalence-point.expect.predict.diagnosis.0.next" = "Laisse le banc compter ce qu'il reste : 0,001 mol d'hydroxyde non compensé dans un litre. Ce becher existe déjà dans ce codex — `strong-base` — et il affiche 11, pas 7,5."
"past-the-equivalence-point.expect.predict.diagnosis.1.reveals" = "Le pH s'arrête à 7 parce qu'il serait une propriété propre à l'acide : une fois l'acide épuisé, il n'y aurait plus rien à mesurer, et l'effet de la base en excès sur l'eau elle-même resterait invisible."
"past-the-equivalence-point.expect.predict.diagnosis.1.next" = "Retire l'acide de l'histoire : de l'eau pure additionnée des mêmes 0,001 mol de NaOH (`strong-base`) affiche 11 sur ce banc. La titration en excès n'est que ce becher, plus des ions spectateurs."
"past-the-equivalence-point.registers.lv1" = "Une goutte de trop, et la couleur dépasse largement la teinte voulue. Juste au point d'équilibre, le liquide est sur le fil du rasoir : le moindre ajout le fait basculer très loin."
"past-the-equivalence-point.registers.lv2" = "Après le point d'équivalence, la base en excès fixe directement le pH : 0,001 mol de NaOH restant dans un litre donne pOH 3, pH ≈ 11. La courbe de titration est presque verticale ici — c'est cette pente raide qui rend le point final détectable."
"past-the-equivalence-point.registers.lv3" = "La valeur calculée est 10,95, et non 11,00 : l'hydroxyde en excès se trouve dans un milieu ionique à 0,011 mol/kgw, et son activité est inférieure à sa concentration. La pente est une propriété du bilan de charge près du point où les réserves de l'acide fort et de la base forte s'épuisent simultanément, pas une courbe ajustée pour l'enseignement."
"phosphoric-acid-three-protons.expect.predict.question" = "L'acide phosphorique possède trois hydrogènes acides. Une solution à 0,1 mol/L se comporte donc comme…"
"phosphoric-acid-three-protons.expect.predict.options" = ["0,3 mol/L d'un acide fort — pH environ 0,5, puisque les trois protons se libèrent", "0,1 mol/L d'un acide faible — pH environ 1,6, car pour l'essentiel seul le premier proton se libère", "0,1 mol/L d'un acide fort — pH exactement 1,0"]
"phosphoric-acid-three-protons.expect.predict.misconception" = "Compter les protons sur la formule et multiplier est l'erreur classique des acides polyprotiques. Les trois ionisations sont séparées chacune d'environ cinq puissances de dix ; libérer le second proton revient à arracher une charge positive d'un ion déjà négatif, ce qui est bien plus difficile. À pH 1,6, la deuxième étape a à peine commencé — le moteur trouve HPO₄²⁻ à 3 × 10⁻⁴ mol/kgw contre H₂PO₄⁻ à 10⁻¹."
"phosphoric-acid-three-protons.expect.predict.diagnosis.0.reveals" = "Les protons sont comptés sur la formule et multipliés : trois hydrogènes écrits signifieraient trois protons libérés, comme si l'ionisation était une propriété de la formule et non un équilibre qui devient plus difficile à chaque charge déjà retirée."
"phosphoric-acid-three-protons.expect.predict.diagnosis.0.next" = "Regarde l'échelle elle-même au niveau lv3 : à pH 1,64, le deuxième échelon retient 3 × 10⁻⁴ mol/kgw contre 10⁻¹ sur le premier — mille contre un. Les trois échelons sont bien réels ; la solution se tient simplement sur le premier."
"phosphoric-acid-three-protons.expect.predict.diagnosis.1.reveals" = "Un proton est concédé, mais concédé entièrement : « acide » impliquerait toujours une dissociation complète, si bien que 0,1 mol/L devrait donner exactement 1,0. Le fait que la plupart des molécules de H₃PO₄ retiennent leur premier proton à tout instant manque dans ce tableau."
"phosphoric-acid-three-protons.expect.predict.diagnosis.1.next" = "Fais tourner l'acide pour lequel cette réponse serait presque juste : 0,1 mol de HCl dans le même litre affiche 1,08 sur ce banc, ce becher-ci 1,64. L'écart entre ces deux nombres correspond à la fraction d'acide phosphorique qui n'a jamais lâché son proton."
"phosphoric-acid-three-protons.registers.lv1" = "C'est le goût acide du cola. Il contient trois parties acides, mais une seule se libère facilement — les deux autres s'accrochent fermement."
"phosphoric-acid-three-protons.registers.lv2" = "Seule la première ionisation compte à cette concentration (pKa₁ ≈ 2,15 contre pKa₂ ≈ 7,2 et pKa₃ ≈ 12,3), si bien que la solution se comporte comme un acide faible unique et atteint un pH proche de 1,6."
"phosphoric-acid-three-protons.registers.lv3" = "Le moteur résout les trois équilibres simultanément plutôt que d'en choisir un seul. La répartition obtenue à pH 1,64 est H₂PO₄⁻ 9,9 × 10⁻², H₃PO₄ 4,3 × 10⁻⁴, HPO₄²⁻ 3,4 × 10⁻⁴, PO₄³⁻ en dessous de 10⁻⁹ — l'échelle est bien réelle, elle se tient simplement presque entièrement sur son premier échelon."
"phosphate-buffer.summary" = "Tampon H₂PO₄⁻/HPO₄²⁻ (1,5 équivalent de base par H₃PO₄)"
"phosphate-buffer.expect.predict.question" = "À mi-chemin entre le premier et le deuxième point d'équivalence de l'acide phosphorique, la règle du manuel donne pH = pKa₂ ≈ 7,2. Le moteur calcule 6,64. D'où vient l'écart ?"
"phosphate-buffer.expect.predict.options" = ["Le moteur se trompe — l'équation de Henderson-Hasselbalch est exacte", "Les deux espèces phosphatées portent des charges différentes, si bien que les effets de force ionique ne s'annulent pas et que le pH mesuré se situe en dessous du pKa tabulé", "La base a été ajoutée trop vite"]
"phosphate-buffer.expect.predict.misconception" = "L'équation de Henderson-Hasselbalch est traitée comme une loi plutôt que comme une approximation qui suppose que l'activité égale la concentration. Ici, le rapport concerne un ion 1− et un ion 2− dont les coefficients d'activité valent 0,76 et 0,32 — ils ne s'annulent pas, et le pH de demi-neutralisation tombe environ une demi-unité en dessous de pKa₂. C'est pourquoi les recettes de tampon réelles sont vérifiées au pH-mètre, et non simplement calculées puis considérées comme acquises."
"phosphate-buffer.expect.predict.diagnosis.0.reveals" = "L'équation de Henderson-Hasselbalch est considérée comme exacte — une équation qui figure dans tous les manuels doit être une loi, donc un pH-mètre qui la contredit doit être défectueux."
"phosphate-buffer.expect.predict.diagnosis.0.next" = "Calcule la correction que la « loi » a fait disparaître : log(0,32/0,76) ≈ −0,38, et elle provient directement des deux coefficients d'activité que l'équation suppose égaux à un. Compare ensuite avec `half-neutralised-vinegar`, où la paire porte des charges 0 et 1− et où la même règle fonctionne presque — l'erreur croît avec les charges, ce qu'une loi exacte ne devrait jamais faire."
"phosphate-buffer.expect.predict.diagnosis.1.reveals" = "Une mesure qui s'écarte de la valeur attendue est imputée à la technique — l'équilibre est imaginé comme quelque chose qu'une main pressée pourrait devancer, si bien que le nombre se stabiliserait à 7,2 avec plus de soin."
"phosphate-buffer.expect.predict.diagnosis.1.next" = "Agite, `wait`, et mesure à nouveau : la lecture ne dérive pas vers 7,2, car rien n'est hors équilibre. L'écart réside dans l'hypothèse de l'équation, pas dans les mains — ce qui en fait de la chimie, et non de la maladresse."
"phosphate-buffer.registers.lv1" = "Ce mélange reste obstinément proche du pH de ton propre sang. Ajoute-lui de l'acide ou de la base, et il bouge à peine — le même tour que le tampon au vinaigre, réalisé avec une autre paire de partenaires."
"phosphate-buffer.registers.lv2" = "Ajouter 1,5 mol de base par mole de H₃PO₄ convertit la moitié du dihydrogénophosphate en hydrogénophosphate. Cette paire 1:1 est le tampon du sang, de l'intérieur des cellules et de la plupart des manipulations de biologie, agissant autour de pKa₂."
"phosphate-buffer.registers.lv3" = "pH calculé 6,64, contre un pKa₂ naïf de 7,2. La spéciation du moteur montre pourquoi : H₂PO₄⁻ 5,0 × 10⁻², HPO₄²⁻ 3,4 × 10⁻², et NaHPO₄⁻ 1,7 × 10⁻² — une paire d'ions qui retient un tiers de l'espèce divalente hors jeu. Les tampons à charges asymétriques sont l'endroit où le raccourci de l'activité constante échoue en premier."
"half-neutralised-vinegar.expect.predict.question" = "Tu titres du vinaigre et tu t'arrêtes exactement à mi-chemin. Que te révèle la mesure du pH ?"
"half-neutralised-vinegar.expect.predict.options" = ["La moitié du pH de départ — environ 1,4", "Le pKa de l'acide, car l'acide et sa base conjuguée sont maintenant présents en quantités égales", "Rien d'utile ; seul le point final porte une information"]
"half-neutralised-vinegar.expect.predict.misconception" = "Diviser le pH par deux traite un logarithme comme une grandeur linéaire. Le point de demi-équivalence est l'endroit le plus riche en information de toute la courbe d'un acide faible : quand [HA] = [A⁻], le terme logarithmique du rapport s'annule, et l'appareil affiche directement le pKa propre de l'acide. C'est ainsi que l'on mesurait les valeurs de pKa avant l'ère informatique."
"half-neutralised-vinegar.expect.predict.diagnosis.0.reveals" = "Le pH est divisé comme une longueur : la moitié de l'acide neutralisée, la moitié du nombre restant. Le fait que chaque unité représente un facteur dix — de sorte que diviser le pH par deux reviendrait à *élever au carré* l'acidité — n'entre pas dans ce raisonnement."
"half-neutralised-vinegar.expect.predict.diagnosis.0.next" = "Fais d'abord tourner `dilution-by-ten` : un facteur dix complet ne vaut qu'une seule unité de pH. Passer de 2,9 à 1,4 exigerait que l'activité des ions hydrogène soit multipliée par trente, alors même que l'acide est en train d'être consommé."
"half-neutralised-vinegar.expect.predict.diagnosis.1.reveals" = "Une titration est vue comme une course vers le saut : la courbe qui y mène n'est que décoration, et seul le point final porte un nombre digne d'être noté."
"half-neutralised-vinegar.expect.predict.diagnosis.1.next" = "Lis l'appareil exactement ici, à mi-chemin : il indique le pKa propre de l'acide — la constante qui identifie *quel* acide c'est, le seul nombre que le point final seul ne pourra jamais te donner. Le point final te dit combien ; le plateau te dit quoi."
"half-neutralised-vinegar.registers.lv1" = "Arrête-toi à mi-chemin de la neutralisation du vinaigre, et le liquide se stabilise à pH 4,7 — et il y restera obstinément. À moitié fait est l'endroit le plus obstiné de tous."
"half-neutralised-vinegar.registers.lv2" = "Avec des quantités égales de CH₃COOH et de CH₃COO⁻ en présence, pH = pKa = 4,76. C'est un tampon à sa capacité maximale, et c'est la méthode de laboratoire standard pour mesurer le pKa d'un acide inconnu."
"half-neutralised-vinegar.registers.lv3" = "Le moteur rapporte 4,66, environ un dixième d'unité en dessous du pKa thermodynamique. À I = 0,049 mol/kgw, le coefficient d'activité de l'ion acétate est de 0,82, tandis que celui de l'acide neutre est de 1,00 ; le rapport des activités n'est donc pas le rapport des concentrations, et l'appareil affiche cette différence."
"weak-acid-endpoint-is-alkaline.expect.predict.question" = "Tu neutralises du vinaigre avec exactement la quantité correspondante d'hydroxyde de sodium. Quel est le pH au point final ?"
"weak-acid-endpoint-is-alkaline.expect.predict.options" = ["7 — c'est ce que signifie neutre", "Environ 8,8 — la solution est alcaline", "Environ 5 — il subsiste toujours un peu d'acide"]
"weak-acid-endpoint-is-alkaline.expect.predict.misconception" = "« Neutralisé signifie pH 7 » n'est vrai que lorsque les deux partenaires sont forts. Ici l'acide est faible, si bien que sa base conjuguée est assez forte pour compter : l'acétate reprend des protons à l'eau et laisse de l'hydroxyde derrière lui. C'est précisément pourquoi la phénolphtaléine (virage ≈ 8,2–10) est le bon indicateur pour cette titration et l'hélianthine le mauvais choix — un choix qui paraît arbitraire tant qu'on ignore que le point final n'est pas à 7."
"weak-acid-endpoint-is-alkaline.expect.predict.diagnosis.0.reveals" = "« Neutralisé » et « neutre » sont le même mot, donc ce serait le même état — une règle apprise là où elle est vraie (`neutralisation`, fort contre fort) et transposée là où elle ne l'est pas."
"weak-acid-endpoint-is-alkaline.expect.predict.diagnosis.0.next" = "Fais tourner les deux titrations côte à côte : HCl contre NaOH atterrit bien à 7,00 (`neutralisation`) ; celle-ci atterrit à 8,8. Même procédure, mêmes quantités « exactement équivalentes » — la différence est arrivée avec la base conjuguée."
"weak-acid-endpoint-is-alkaline.expect.predict.diagnosis.1.reveals" = "Dans ce tableau, les réactions ne s'achèvent jamais tout à fait, donc un peu d'acide devrait subsister et garder la solution acide — l'équilibre vu comme une incomplétude universelle, attribuée à la mauvaise espèce."
"weak-acid-endpoint-is-alkaline.expect.predict.diagnosis.1.next" = "Demande la spéciation au point final (lv3) : l'acteur qui subsiste est l'acétate, pas l'acide acétique, et il pousse le pH *vers le haut* en arrachant des protons à l'eau. Le reliquat attendu existe bel et bien — mais c'est de l'hydroxyde."
"weak-acid-endpoint-is-alkaline.registers.lv1" = "L'acide est exactement épuisé — et le liquide n'est pas neutre. Il est au contraire savonneux et alcalin. Ce qui reste derrière n'est pas anodin."
"weak-acid-endpoint-is-alkaline.registers.lv2" = "Le produit est de l'acétate de sodium à 0,1 mol/L. L'acétate est la base conjuguée d'un acide faible, il s'hydrolyse donc : CH₃COO⁻ + H₂O ⇌ CH₃COOH + OH⁻, ce qui donne pH ≈ 8,8 au point d'équivalence."
"weak-acid-endpoint-is-alkaline.registers.lv3" = "Calculé 8,76. La spéciation montre directement le mécanisme : OH⁻ et l'acide acétique non dissocié sont tous deux à 7,5 × 10⁻⁶ mol/kgw, produits en quantités exactement égales par l'hydrolyse, contre 9,7 × 10⁻² d'acétate libre. Point d'équivalence et point neutre sont deux notions différentes qui ne coïncident que par hasard pour les paires fort/fort."
"buffer-capacity-exceeded.summary" = "CH₃COOH/CH₃COO⁻ + HCl en excès → tampon détruit"
"buffer-capacity-exceeded.expect.predict.question" = "Un tampon maintient pH 4,6 quand tu ajoutes 0,01 mol d'acide fort. Tu ajoutes maintenant 0,15 mol d'un coup — plus que la réserve du tampon. Que se passe-t-il ?"
"buffer-capacity-exceeded.expect.predict.options" = ["Il se maintient vers 4,6 ; c'est ce que fait un tampon", "Il glisse un peu, vers 3,5", "Il s'effondre à environ 1,4 — une fois la réserve épuisée, le tampon n'est plus que de l'eau salée"]
"buffer-capacity-exceeded.expect.predict.misconception" = "Traiter le pouvoir tampon comme une propriété du liquide plutôt que comme un stock qui s'épuise. La réserve ici est de 0,1 mol d'acétate ; 0,15 mol de protons la consomme entièrement, et 0,05 mol reste sous forme d'acide fort libre. Un tampon ne résiste pas au changement de pH — il *paie* pour lui résister, sur un compte fini."
"buffer-capacity-exceeded.expect.predict.diagnosis.0.reveals" = "Le pouvoir tampon est vu comme une identité, pas comme un budget : ce liquide « est un tampon » de la même façon que l'acier est dur, donc il tiendrait face à tout ce qu'on y verse."
"buffer-capacity-exceeded.expect.predict.diagnosis.0.next" = "Fractionne l'attaque : ajoute 0,05 mol, puis encore 0,05, puis les derniers 0,05, en mesurant entre chaque ajout. L'appareil bouge à peine, puis un peu plus, puis s'effondre brutalement en plein ajout — une identité ne peut pas s'épuiser à mi-parcours, un compte, si."
"buffer-capacity-exceeded.expect.predict.diagnosis.1.reveals" = "Le compte est bien là, mais pas le découvert : le pouvoir tampon se dégraderait proportionnellement à la charge, si bien qu'un dépassement de moitié de la réserve devrait coûter environ une demi-unité."
"buffer-capacity-exceeded.expect.predict.diagnosis.1.next" = "Fais la soustraction que fait le becher : 0,15 mol entrant, 0,1 mol d'acétate pour payer, 0,05 mol restant comme acide fort libre dans le litre. Une fois le compte à zéro, rien entre 4,6 et le pH propre de cet acide n'est stable — il ne reste plus aucune espèce pour tenir le terrain intermédiaire."
"buffer-capacity-exceeded.registers.lv1" = "Le liquide obstiné cesse de l'être. Pousse assez fort, et il cède d'un coup — comme un sac de courses qui tient, qui tient, puis qui se déchire."
"buffer-capacity-exceeded.registers.lv2" = "Le tampon contient une réserve de 0,1 mol d'acétate. 0,15 mol de HCl la convertit entièrement en acide acétique et laisse 0,05 mol d'acide fort libre dans le litre, donnant pH ≈ 1,4."
"buffer-capacity-exceeded.registers.lv3" = "Calculé 1,42. L'inventaire du moteur contient désormais 0,2 mol d'acétate total et 0,15 mol de chlorure contre seulement 0,1 mol de sodium ; le bilan de charge n'a nulle part où aller sinon vers du H⁺ libre. La capacité tampon β = 2,303·C·(rapport de fractions) est finie par construction, et cet essai se situe bien au-delà."
"dilution-by-ten.summary" = "c₁V₁ = c₂V₂ : 0,01 mol/L × 0,1 L → 0,001 mol/L × 1 L"
"dilution-by-ten.expect.predict.question" = "Un acide à pH 2 est dilué avec neuf fois son propre volume d'eau. Quel est le nouveau pH ?"
"dilution-by-ten.expect.predict.options" = ["4", "1", "3"]
"dilution-by-ten.expect.predict.misconception" = "Répondre 4 vient de l'idée que « dix fois plus faible » signifierait « multiplier le pH par dix » ou « ajouter l'équivalent de dix » ; répondre 1 confond dilution et concentration. Comme le pH est le −log₁₀ de l'activité des ions hydrogène, diviser la concentration par dix ajoute exactement une unité au pH. Un volume 99 fois plus grand en ajouterait deux."
"dilution-by-ten.expect.predict.diagnosis.0.reveals" = "La base de l'échelle manque : un facteur dix est imaginé comme valant deux unités ou plus, comme si le pH comptait des « degrés de faiblesse » plutôt que des puissances de dix."
"dilution-by-ten.expect.predict.diagnosis.0.next" = "Continue sur le banc : une nouvelle décuplation d'eau donne 4, une autre donne 5 — une unité par facteur dix, à chaque fois. Passer de 2 à 4 coûte un facteur cent, et l'appareil en montrera chaque étape."
"dilution-by-ten.expect.predict.diagnosis.1.reveals" = "Dans ce tableau, l'échelle fonctionne à l'envers : acide plus faible, nombre plus bas. Ce n'est pas le calcul mais le sens qui n'est pas encore assimilé."
"dilution-by-ten.expect.predict.diagnosis.1.next" = "Mesure les deux bechers côte à côte, puis continue à diluer : les lectures montent progressivement vers 7 et ne le dépassent jamais. Si plus bas signifiait plus faible, l'eau pure afficherait le nombre le plus bas de tous."
"dilution-by-ten.registers.lv1" = "Prends un peu d'acide et verses-y neuf verres d'eau. C'est toujours de l'acide — juste plus faible. Rien n'a été retiré ; il a simplement été plus dilué."
"dilution-by-ten.registers.lv2" = "La quantité de HCl ne change jamais : 0,001 mol, d'abord dans 0,1 L (0,01 mol/L, pH 2) puis dans 1 L (0,001 mol/L, pH 3). c₁V₁ = c₂V₂, et chaque facteur dix en concentration correspond à une unité de pH."
"dilution-by-ten.registers.lv3" = "Calculé 2,04 → 3,01. Le léger écart par rapport aux chiffres ronds est dû au coefficient d'activité : 0,90 à I = 0,01, 0,965 à I = 0,001. La dilution rapproche le résultat de la limite de la solution idéale, ce qui explique pourquoi la valeur la plus diluée est la plus proche des deux de sa valeur de manuel."
"washing-soda-is-alkaline.expect.predict.question" = "La soude de lessive (carbonate de sodium) est un sel, formé d'un métal et d'un résidu d'acide. Quel pH sa solution a-t-elle ?"
"washing-soda-is-alkaline.expect.predict.options" = ["7 — les sels sont neutres, c'est bien ce que veut dire « sel neutre »", "Environ 11 — fortement alcalin", "Environ 3 — c'est de la soude, et son nom rappelle celui du soda, qui est acide"]
"washing-soda-is-alkaline.expect.predict.misconception" = "« Les solutions salines sont neutres » est une règle apprise avec le chlorure de sodium, puis surgénéralisée. Elle ne tient que si les deux ions parents sont indifférents à l'eau. Le carbonate est la base conjuguée d'un acide très faible ; il arrache donc des protons à l'eau et laisse de l'hydroxyde derrière lui — c'est précisément pourquoi la soude de lessive dissout les graisses, et pourquoi elle brûle la peau."
"washing-soda-is-alkaline.expect.predict.diagnosis.0.reveals" = "Dans ce tableau, c'est le mot « sel » qui porterait l'information de pH : la catégorie répondrait à la question, donc tout sel afficherait 7 comme le chlorure de sodium."
"washing-soda-is-alkaline.expect.predict.diagnosis.0.next" = "Fais tourner la paire miroir : ce becher affiche 11 et `copper-sulfate-is-blue-and-acidic` affiche 3,9. Deux sels, deux directions opposées — le mot « sel » ne peut donc pas être ce qui décide. Ce sont les ions parents qui décident, chacun pour soi."
"washing-soda-is-alkaline.expect.predict.diagnosis.1.reveals" = "C'est le nom qui fait la chimie ici : « soude » évoque « soda », classé avec les boissons gazeuses, et les boissons gazeuses sont acides, donc la soude devrait l'être aussi."
"washing-soda-is-alkaline.expect.predict.diagnosis.1.next" = "Plonge l'appareil : 11. Fais ensuite tourner `baking-soda-vents-carbon-dioxide` — l'autre soude de cuisine, le bicarbonate, est basique lui aussi. L'acidité de la boisson gazeuse n'a jamais été celle du soda lui-même ; c'était l'acide carbonique et l'acide phosphorique dissous à ses côtés."
"washing-soda-is-alkaline.registers.lv1" = "La soude de lessive se dissout, et l'eau devient aussi alcaline qu'un produit d'entretien — parce que c'est exactement ce que c'est. C'est un sel qui n'a rien de neutre."
"washing-soda-is-alkaline.registers.lv2" = "Na₂CO₃ se dissout en 2 Na⁺ et CO₃²⁻. Le carbonate s'hydrolyse (CO₃²⁻ + H₂O ⇌ HCO₃⁻ + OH⁻, Kb ≈ 2 × 10⁻⁴), si bien qu'une solution à 0,05 mol/L atteint pH ≈ 11,2."
"washing-soda-is-alkaline.registers.lv3" = "Calculé 11,19. La spéciation n'est pas un simple tableau à deux espèces : CO₃²⁻ 3,1 × 10⁻², NaCO₃⁻ 1,7 × 10⁻² — un tiers du carbonate est immobilisé dans une paire d'ions avec le sodium —, avec OH⁻ et HCO₃⁻ chacun à 2 × 10⁻³, produits stœchiométriquement par l'hydrolyse."
"baking-soda-vents-carbon-dioxide.expect.predict.question" = "Du bicarbonate de soude est mélangé à de l'eau. Aucun acide n'est ajouté. Que se passe-t-il ?"
"baking-soda-vents-carbon-dioxide.expect.predict.options" = ["Rien d'autre qu'une dissolution ; il faut un acide pour obtenir le moindre gaz", "Il se dissout et dégage quand même lentement du dioxyde de carbone, pour finir autour de pH 9,7", "Il se dissout et la solution finit à pH 8,3, la valeur de manuel pour l'hydrogénocarbonate"]
"baking-soda-vents-carbon-dioxide.expect.predict.misconception" = "Deux idées sont corrigées à la fois. D'abord, le dégagement gazeux n'est pas le privilège exclusif des acides — l'hydrogénocarbonate se dismute de lui-même, et un becher ouvert continue d'évacuer le produit. Ensuite, le chiffre familier « l'hydrogénocarbonate est à pH 8,3 » est une valeur de *système fermé* ; un becher sur un banc est ouvert, il dégaze jusqu'à s'équilibrer avec la pression de CO₂ propre de l'atmosphère, et il atterrit bien au-dessus de 8,3."
"baking-soda-vents-carbon-dioxide.expect.predict.diagnosis.0.reveals" = "Le dégagement gazeux serait la signature d'un acide, donc sans acide rien ne pourrait s'échapper — le pétillement classé comme un type de réaction à part, plutôt que comme n'importe quel équilibre possédant un produit volatil et un couvercle ouvert."
"baking-soda-vents-carbon-dioxide.expect.predict.diagnosis.0.next" = "Laisse le becher sur la balance et `wait` : la masse dérive vers le bas sans qu'aucun acide ne se trouve dans le récipient. L'acide de l'expérience effervescente achète de la vitesse et de la violence, pas une autorisation."
"baking-soda-vents-carbon-dioxide.expect.predict.diagnosis.1.reveals" = "Une constante mémorisée prime sur le dispositif réel : 8,3 est le chiffre de l'hydrogénocarbonate, donc 8,3 est la réponse, quoi que fasse le becher."
"baking-soda-vents-carbon-dioxide.expect.predict.diagnosis.1.next" = "Demande-toi ce que suppose 8,3 : un système scellé qui conserve son CO₂. Ce becher est ouvert et dégaze jusqu'à s'équilibrer avec l'atmosphère, et le pH monte à mesure que le gaz s'échappe. Le chiffre célèbre n'est pas faux — il répond à un autre dispositif, et ce codex le conserve précisément pour qu'un dispositif ouvert le contredise."
"baking-soda-vents-carbon-dioxide.registers.lv1" = "Du bicarbonate de soude dans de l'eau pure, sans le moindre vinaigre à l'horizon : laisse-le reposer un moment, et il pétille quand même, très doucement. Les bulles s'échappent dans la pièce et ne reviennent jamais."
"baking-soda-vents-carbon-dioxide.registers.lv2" = "0,1 mol de NaHCO₃ par litre donne une solution sursaturée par rapport au dioxyde de carbone de l'air. Environ 30 % du carbonate s'échappe sous forme de CO₂, le reste se déplace vers CO₃²⁻, et le pH se stabilise autour de 9,7."
"baking-soda-vents-carbon-dioxide.registers.lv3" = "C'est l'entrée qui s'écarte le plus d'un manuel, et cet écart est la leçon. Le pH classique de 8,3 pour NaHCO₃ suppose un système scellé. Le moteur équilibre le récipient avec le CO₂ atmosphérique à log p = −3,408, dégaze 0,030 mol, et calcule 9,71. Aucun des deux chiffres n'est faux ; ils répondent à des questions différentes, et un seul d'entre eux décrit un becher posé sur un banc."
"sodium-acetate-hydrolysis.registers.lv1" = "Le sel du vinaigre se dissout, réchauffe légèrement le bocal, et laisse une eau savonneuse plutôt qu'acide. L'acide est devenu son propre contraire."
"sodium-acetate-hydrolysis.registers.lv2" = "L'acétate de sodium est le sel d'un acide faible et d'une base forte, si bien que sa solution est alcaline : 1 mol/L affiche pH ≈ 9,2. La dissolution est exothermique (−17,3 kJ/mol), ce qui réchauffe 100 mL d'eau d'environ 4 °C."
"sodium-acetate-hydrolysis.registers.lv3" = "pH calculé 9,16 à 29,2 °C et I = 0,77 mol/kgw. À cette concentration, 23 % de l'acétate est présent sous forme de la paire d'ions neutre Na(acétate) plutôt que sous forme d'acétate libre — l'hydrolyse dispose donc de moins de base que ne le suggère l'étiquette, ce qui explique en partie pourquoi le pH est inférieur à l'estimation pour une solution idéale."
"copper-sulfate-is-blue-and-acidic.expect.predict.question" = "Le sulfate de cuivre se dissout en donnant un magnifique bleu. Qu'affiche le pH-mètre ?"
"copper-sulfate-is-blue-and-acidic.expect.predict.options" = ["7 — c'est le sel d'un acide fort et d'un métal, donc neutre", "Environ 3,9 — la solution est nettement acide", "Environ 9 — les ions métalliques sont basiques"]
"copper-sulfate-is-blue-and-acidic.expect.predict.misconception" = "La réponse séduisante traite « métal » comme automatiquement basique et « sel » comme automatiquement neutre. Un petit cation doublement chargé tire assez fort sur les molécules d'eau qui lui sont liées pour en desserrer les protons : [Cu(H₂O)₆]²⁺ ⇌ [Cu(H₂O)₅OH]⁺ + H⁺. La solution de sulfate de cuivre(II) est assez acide pour avoir un goût piquant, et c'est une propriété générale des petits cations fortement chargés, pas une particularité du cuivre."
"copper-sulfate-is-blue-and-acidic.expect.predict.diagnosis.0.reveals" = "Deux règles de catégorie empilées : les sels seraient neutres, et celui-ci proviendrait d'un acide fort et d'un métal, donc doublement neutre — les ions eux-mêmes n'ont jamais été consultés."
"copper-sulfate-is-blue-and-acidic.expect.predict.diagnosis.0.next" = "Fais tourner le miroir : `washing-soda-is-alkaline` est aussi « un sel d'un métal et d'un résidu d'acide », et affiche 11 là où celui-ci affiche 3,9. Des catégories qui donnent des réponses opposées à la même règle ne sont pas ce qui décide réellement."
"copper-sulfate-is-blue-and-acidic.expect.predict.diagnosis.1.reveals" = "« Métal » signifierait basique — une règle vraie pour les oxydes et hydroxydes métalliques à l'état solide, transposée telle quelle au cation dissous."
"copper-sulfate-is-blue-and-acidic.expect.predict.diagnosis.1.next" = "Compare les cations au niveau lv3 : le sodium — gros, simplement chargé — laisse l'eau tranquille, tandis que [Cu(H₂O)₆]²⁺ desserre visiblement les protons de sa propre eau liée. Ce sont la taille et la charge qui décident, pas l'appartenance aux métaux ; le bord gauche du tableau périodique n'est pas une prédiction de pH."
"copper-sulfate-is-blue-and-acidic.registers.lv1" = "Des cristaux blanchâtres sont versés, et l'eau devient d'un bleu profond dont on ne peut détacher les yeux. Le bocal devient aussi légèrement chaud. Et — étonnamment — l'eau est devenue acide."
"copper-sulfate-is-blue-and-acidic.registers.lv2" = "0,05 mol de CuSO₄ dans 500 mL donne une solution bleue à 0,1 mol/L. La dissolution est exothermique (−73,1 kJ/mol), réchauffant le becher d'environ 1,8 °C. L'hydrolyse du cuivre et une trace de précipitation de sulfate de cuivre basique laissent la solution à environ pH 3,9."
"copper-sulfate-is-blue-and-acidic.registers.lv3" = "pH calculé 3,86. La couleur est mise en scène — les transitions d–d ne sont pas quelque chose qu'une base de données thermodynamique peut fournir honnêtement — mais l'acidité, elle, est calculée. Le registre étendu des phases solides admet désormais la trace de sulfate de cuivre basique que favorise l'équilibre, et sa formation libère des protons supplémentaires ; c'est pourquoi la valeur est plus basse que le résultat antérieur, purement aqueux."
"descaling-with-acid.expect.predict.question" = "Un gramme de craie repose dans l'eau, se dissolvant à peine. Tu verses de l'acide chlorhydrique. Que devient la craie ?"
"descaling-with-acid.expect.predict.options" = ["Rien — insoluble est insoluble", "Elle se dissout entièrement en effervescence ; l'acide détruit le carbonate et le gaz s'échappe", "Elle se dissout lentement mais le solide reste ; un acide ne peut pas dissoudre un solide"]
"descaling-with-acid.expect.predict.misconception" = "« Insoluble » se lit comme une propriété absolue d'une substance, alors que c'est un énoncé sur un équilibre particulier. La craie est insoluble *dans l'eau*. L'acide ne la dissout pas — il retire l'un de ses ions de l'équilibre en transformant le carbonate en dioxyde de carbone qui s'échappe, et le solide suit. Le Chatelier, appliqué à un solide, c'est ainsi que fonctionnent les détartrants et les grottes."
"descaling-with-acid.expect.predict.diagnosis.0.reveals" = "« Insoluble » serait une propriété absolue, comme être fait de pierre : aucun liquide ne pourrait déplacer ce que l'eau ne peut pas déplacer."
"descaling-with-acid.expect.predict.diagnosis.0.next" = "Commence par `chalk-in-water` : même l'eau pure en déplace 0,24 %, l'absolu n'a donc jamais été absolu. L'acide retire ensuite le carbonate de l'équilibre sous forme de gaz qui s'échappe, et le solide suit ses propres ions — observe le gramme entier disparaître en effervescence sur ce banc."
"descaling-with-acid.expect.predict.diagnosis.1.reveals" = "Dans ce tableau, les solides peuvent céder des ions mais ne disparaissent jamais — la dissolution grignoterait un élément permanent, donc le tas devrait survivre quoi que fasse le liquide."
"descaling-with-acid.expect.predict.diagnosis.1.next" = "Pèse le récipient avant et après (`measure v1 balance`) : la masse du CO₂ a quitté le récipient par le haut ouvert, et faire passer le résultat au travers d'un papier filtre ne retient rien, car il ne reste aucun solide à retenir."
"descaling-with-acid.registers.lv1" = "La craie qui refusait de se dissoudre dans l'eau disparaît en quelques secondes dans un sifflement dès que l'acide est versé. C'est ainsi que fonctionne un détartrant, et c'est ainsi que les grottes sont sculptées dans le calcaire."
"descaling-with-acid.registers.lv2" = "CaCO₃ + 2 HCl → CaCl₂ + H₂O + CO₂↑. 0,01 mol de craie nécessite 0,02 mol d'acide ; les 0,03 mol utilisées laissent 0,01 mol en réserve, si bien que la solution finale est fortement acide, à pH ≈ 1,4."
"descaling-with-acid.registers.lv3" = "Le moteur dissout 0,00997 des 0,00999 mol présentes et dégage 0,00999 mol de CO₂ — l'indice de saturation de la calcite a été poussé loin dans le négatif par le retrait du carbonate, si bien que la phase à quantité limitée s'épuise au lieu d'atteindre l'équilibre. Le CO₂ dissous résiduel (1,3 × 10⁻⁵ mol/kgw) est fixé par la loi de Henry vis-à-vis de la pièce, et non par la réaction."
"chalk-in-water.expect.predict.question" = "Un gramme de craie est mélangé à 200 mL d'eau et laissé au repos. Quelle quantité se dissout ?"
"chalk-in-water.expect.predict.options" = ["Absolument rien — la craie est insoluble", "Environ un quart de pour cent — une quantité minuscule mais bien réelle, qui rend l'eau alcaline", "La totalité, si on attend assez longtemps"]
"chalk-in-water.expect.predict.misconception" = "« Insoluble » est enseigné comme zéro et n'est jamais zéro. Le moteur dissout ici 0,24 % de la craie — 2,4 × 10⁻⁵ mol —, et cette trace suffit à faire monter le pH à près de 10, parce que le carbonate est une base. Chaque sel « insoluble » possède un produit de solubilité, et le traiter comme zéro fait ressembler toute l'analyse qualitative à de la magie plutôt qu'à du calcul."
"chalk-in-water.expect.predict.diagnosis.0.reveals" = "« Insoluble » signifierait zéro, une catégorie plutôt qu'une grandeur — donc l'eau au-dessus de la craie ne serait que de l'eau."
"chalk-in-water.expect.predict.diagnosis.0.next" = "Plonge l'appareil dans cette « eau toute simple » : il affiche presque 10. Zéro dissous ne peut pas déplacer un pH-mètre de trois unités ; les 2,4 × 10⁻⁵ mol réellement dissoutes, si, parce que le carbonate est une base. L'appareil est l'instrument qui capte ce que l'œil classe comme rien."
"chalk-in-water.expect.predict.diagnosis.1.reveals" = "La dissolution vue comme une question de patience : la solubilité serait une vitesse, donc tout finirait par se dissoudre, avec assez d'agitation et de temps. La saturation — un plafond d'équilibre — n'entre pas dans ce tableau."
"chalk-in-water.expect.predict.diagnosis.1.next" = "`wait` aussi longtemps que tu veux : la quantité dissoute s'arrête au même plafond et le tas reste. Fais ensuite tourner `crystallising-salt-from-brine` — déplacer la limite exige de changer l'*eau*, pas d'attendre plus longtemps, car ce plafond est un équilibre, pas une file d'attente."
"chalk-in-water.registers.lv1" = "La craie reste simplement là. On dirait que rien ne s'est passé — mais trempe une bandelette de pH, et l'eau est devenue alcaline. Une infime quantité s'est bien dissoute, trop peu pour se voir."
"chalk-in-water.registers.lv2" = "Le carbonate de calcium est peu soluble : 2,4 × 10⁻⁵ mol se dissout dans 200 mL, soit environ 0,24 % de la quantité ajoutée. Le carbonate dissous s'hydrolyse, si bien que l'eau atteint pH ≈ 9,9."
"chalk-in-water.registers.lv3" = "Calculé comme un problème d'indice de saturation, et non à partir d'une solubilité mémorisée : la phase de calcite est à quantité limitée et se dissout jusqu'à SI = 0. Le pH de 9,91 est l'hydrolyse carbonatée de cette trace, ce qui explique pourquoi les cours d'eau durs qui coulent sur du calcaire sont alcalins tout en restant presque limpides."
"silver-chloride-solubility-product.registers.lv1" = "La poudre blanche apparue quand l'argent a rencontré le sel ne se redissoudra pas dans l'eau. Presque rien d'elle — mais pas tout à fait rien."
"silver-chloride-solubility-product.registers.lv2" = "1,4 × 10⁻⁵ mol d'AgCl se dissout par litre. C'est la racine carrée de K_sp : [Ag⁺] = [Cl⁻] = √(1,8 × 10⁻¹⁰) ≈ 1,3 × 10⁻⁵ mol/L."
"silver-chloride-solubility-product.registers.lv3" = "La solubilité mesurée dépasse légèrement √K_sp parce que l'argent dissous n'est pas uniquement du Ag⁺ libre : le complexe neutre AgCl(aq) est également présent. C'est le même effet qui rend l'argent résiduel de l'entrée de précipitation vedette plus élevé que ne le prédit un calcul naïf, et c'est le germe de la surprise de l'entrée suivante."
"common-ion-effect.expect.predict.question" = "Le chlorure d'argent se dissout légèrement dans l'eau pure. Mets-le plutôt dans une eau salée à 0,01 mol/L. En dissout-il plus ou moins ?"
"common-ion-effect.expect.predict.options" = ["Plus — il y a déjà des substances dissoutes, donc l'eau serait « meilleure pour dissoudre »", "Moins — le chlorure déjà présent repousse l'équilibre vers le solide", "Autant — la solubilité d'une substance est un nombre fixe"]
"common-ion-effect.expect.predict.misconception" = "La troisième option est l'erreur la plus profonde : la solubilité est traitée comme une propriété du solide seul, comme son point de fusion. C'est une propriété du *système*. Ici, le chlorure ajouté est l'un des produits, donc, par Le Chatelier, la dissolution est repoussée en arrière — le moteur ne trouve aucune dissolution mesurable, là où l'eau pure en dissolvait 1,4 × 10⁻⁵ mol. C'est pourquoi l'analyse gravimétrique lave un précipité avec une solution saline diluée plutôt qu'avec de l'eau pure."
"common-ion-effect.expect.predict.diagnosis.0.reveals" = "Dissoudre serait une compétence que possède l'eau, et l'eau salée serait de l'eau « échauffée » pour sa tâche — ce qui est déjà dissous rendrait le solvant plus fort, quel qu'il soit."
"common-ion-effect.expect.predict.diagnosis.0.next" = "Fais l'échange d'ion spectateur : essaie le même AgCl dans du nitrate de sodium à 0,01 mol/L — autant de « substance » dissoute, mais aucun ion partagé, et la suppression disparaît. Il n'a jamais été question de la charge de l'eau, mais de l'ion que cette charge partage avec le solide."
"common-ion-effect.expect.predict.diagnosis.1.reveals" = "La solubilité serait une constante propre au solide, comme son point de fusion — une substance, un nombre, quoi qu'il nage autour."
"common-ion-effect.expect.predict.diagnosis.1.next" = "Fais tourner la trilogie : l'eau pure dissout 1,4 × 10⁻⁵ mol, cette eau salée ne dissout rien de mesurable, et `chloride-complexes-redissolve-silver` en dissout dix fois *plus* que l'eau pure. Un solide, trois eaux, trois réponses — une propriété du solide seul ne peut pas expliquer cela."
"common-ion-effect.registers.lv1" = "La même poudre blanche, dans une eau qui contient déjà un peu de sel, se dissout encore moins qu'avant — si peu que le laboratoire n'en enregistre aucune trace."
"common-ion-effect.registers.lv2" = "Ajouter 0,01 mol/L de Cl⁻ augmente le côté chlorure de AgCl ⇌ Ag⁺ + Cl⁻, si bien que l'équilibre se déplace vers la gauche. L'argent dissous chute à peu près du facteur dont le chlorure a augmenté, en dessous du seuil observable du moteur."
"common-ion-effect.registers.lv3" = "La suppression est calculée à partir du produit d'activité ionique comparé à K_sp, elle n'est pas simplement affirmée. Il vaut la peine d'énoncer dès maintenant la limite : cette suppression monotone ne tient que tant que le chlorure reste bas. Pousse-le à 1 mol/L, et la tendance s'inverse — voir `chloride-complexes-redissolve-silver`."
"chloride-complexes-redissolve-silver.expect.predict.question" = "L'effet d'ion commun dit qu'un excès de chlorure supprime la solubilité du chlorure d'argent. Alors, dans une saumure à 1 mol/L — cent fois plus de chlorure —, quelle quantité d'AgCl se dissout ?"
"chloride-complexes-redissolve-silver.expect.predict.options" = ["Cent fois moins que dans l'eau salée, pratiquement rien", "Environ dix fois PLUS que dans l'eau pure", "Exactement autant que dans l'eau salée à 0,01 mol/L"]
"chloride-complexes-redissolve-silver.expect.predict.misconception" = "C'est l'entrée où une règle correcte se fait prendre en flagrant délit d'échec, et c'est bien là le propos. Le Chatelier, appliqué à AgCl ⇌ Ag⁺ + Cl⁻, prédit une suppression, et c'est exact à faible teneur en chlorure. Mais cette équation n'est pas toute la chimie : à forte teneur en chlorure, une seconde réaction s'ouvre, AgCl(s) + Cl⁻ → AgCl₂⁻, et elle consomme le solide. Le moteur dissout ici 1,5 × 10⁻⁴ mol contre 1,4 × 10⁻⁵ mol dans l'eau pure. Une règle sans son domaine de validité est un piège, et voici ce piège."
"chloride-complexes-redissolve-silver.expect.predict.diagnosis.0.reveals" = "La règle tout juste apprise, extrapolée sans domaine de validité : plus de suppresseur, plus de suppression, linéairement pour toujours — une équation prise pour toute la chimie."
"chloride-complexes-redissolve-silver.expect.predict.diagnosis.0.next" = "Parcours l'échelle sur le banc : 0,01, 0,1, puis 1 mol/L de chlorure. La solubilité chute, atteint un plancher, puis remonte au-delà de l'eau pure quand AgCl₂⁻ entre en jeu. Une règle monotone ne peut pas dessiner un U — une seconde réaction, si."
"chloride-complexes-redissolve-silver.expect.predict.diagnosis.1.reveals" = "La dernière correction est devenue le nouvel absolu : une fois supprimée, toujours supprimée. Le même geste que « la solubilité est un nombre fixe », une leçon plus tard — une règle adoptée sans se demander où elle s'applique."
"chloride-complexes-redissolve-silver.expect.predict.diagnosis.1.next" = "Cette entrée et `common-ion-effect` existent en paire précisément pour cela : la première enseigne la règle, la seconde enseigne sa limite. La mesure à retenir est le demi-tour en U — et l'habitude à retenir est de toujours demander où chaque règle s'arrête."
"chloride-complexes-redissolve-silver.registers.lv1" = "Étrange : ajouter beaucoup plus de sel fait mieux dissoudre la poudre blanche obstinée, pas moins bien. Un peu de sel la retenait ; beaucoup de sel l'aide à partir."
"chloride-complexes-redissolve-silver.registers.lv2" = "Au-delà d'environ 0,1 mol/L de chlorure, la complexation prend le relais de l'effet d'ion commun : AgCl(s) + Cl⁻ ⇌ AgCl₂⁻ (et AgCl₃²⁻ au-delà). La solubilité passe par un minimum puis remonte — la classique courbe de solubilité en forme de U."
"chloride-complexes-redissolve-silver.registers.lv3" = "Calculé : 1,47 × 10⁻⁴ mol se dissout à I = 1,00 mol/kgw, soit environ dix fois la valeur en eau pure et incomparablement plus que dans NaCl à 0,01 mol/L. Rien ici n'est scénarisé ; les chlorocomplexes figurent dans wateq4f.dat, et le minimiseur les trouve. Deux modèles — le simple K_sp et la spéciation complète — donnent des prédictions opposées, et c'est l'expérience qui tranche. Montre cela à un apprenant avant de lui dire qu'une quelconque règle de solubilité est une loi."
"gypsum-carries-water-in-its-crystals.expect.predict.question" = "Le gypse a pour formule CaSO₄·2H₂O. Quand 5 g s'en dissolvent, le volume de liquide dans le becher AUGMENTE de plus que le volume propre des cristaux. Pourquoi ?"
"gypsum-carries-water-in-its-crystals.expect.predict.options" = ["Les cristaux retenaient de l'eau en leur sein, qui rejoint la solution lorsqu'ils se dissolvent", "Dissoudre produit toujours du liquide, n'importe quel solide ferait donc cela", "C'est une erreur d'arrondi dans la simulation"]
"gypsum-carries-water-in-its-crystals.expect.predict.misconception" = "L'eau de formule se lit comme une décoration dans la formule — un point et quelques molécules d'eau qui sûrement ne comptent pas. Elles comptent : 172 g de gypse représentent 36 g d'eau, soit 21 % de la masse. Cette eau se trouve dans le réseau cristallin en proportion fixe, et elle est libérée à la dissolution. Le plâtre de Paris est exactement cette eau chassée puis réadmise, et c'est pourquoi le plâtre prend."
"gypsum-carries-water-in-its-crystals.expect.predict.diagnosis.0.reveals" = "Dissoudre vu comme une liquéfaction : les solides « se transformeraient en liquide » en se dissolvant, donc n'importe quel solide en train de se dissoudre ferait monter le niveau — l'eau spécifique de ce cristal ne jouerait aucun rôle."
"gypsum-carries-water-in-its-crystals.expect.predict.diagnosis.0.next" = "Fais le calcul que la formule invite à faire : 21 % de ces 5 g représentent environ un gramme d'eau réelle, et la hausse de niveau correspond à ce gramme — pas aux 5 g. Un solide sans eau de formule n'a pas ce gramme à donner."
"gypsum-carries-water-in-its-crystals.expect.predict.diagnosis.1.reveals" = "Quand la simulation surprend, c'est la simulation qui serait fausse — le nombre est classé comme du bruit plutôt que traité comme une affirmation vérifiable."
"gypsum-carries-water-in-its-crystals.expect.predict.diagnosis.1.next" = "Évalue l'ampleur de l'affirmation avant de l'écarter : un gramme d'eau est de plusieurs ordres de grandeur au-dessus de tout plancher d'arrondi, et `explain` montre que le bilan s'équilibre exactement quand les 2 H₂O du cristal sont comptés comme de l'eau. L'habitude que cette entrée récompense est d'auditer un nombre surprenant, pas de le rejeter d'un revers de main."
"gypsum-carries-water-in-its-crystals.registers.lv1" = "Le gypse est la poudre dont sont faits les plâtres. Il a de l'eau cachée à l'intérieur des cristaux — de l'eau réelle, enfermée dans la structure — et quand les cristaux se dissolvent, cette eau est libérée."
"gypsum-carries-water-in-its-crystals.registers.lv2" = "5 g de gypse représentent 0,029 mol ; seuls 0,0156 mol se dissolvent avant que la solution ne soit saturée, si bien qu'environ 46 % reste solide. Chaque mole qui se dissout libère 2 mol d'eau de cristallisation dans le solvant, ce qui fait croître de façon mesurable l'inventaire liquide du récipient."
"gypsum-carries-water-in-its-crystals.registers.lv3" = "Les eaux d'hydrate ne sont pas mises en scène : le moteur les déduit en confrontant la formule du solide du registre à la phase CaSO₄:2H₂O de la base de données, et déplace 2 mol de H₂O entre cristal et solvant par mole réagie. pH calculé 7,07 à I = 0,042 mol/kgw, avec un tiers du calcium dissous présent sous forme de la paire d'ions neutre CaSO₄(aq) — ce qui explique pourquoi la solubilité apparente du gypse dépasse une estimation par K_sp à ions libres."
"heating-dissolves-more-salt.expect.predict.question" = "Un litre d'eau est saturé de sel — un tas de cristaux non dissous repose au fond. Tu le chauffes de 19 °C à 43 °C. Que devient le tas ?"
"heating-dissolves-more-salt.expect.predict.options" = ["Il disparaît entièrement ; l'eau chaude dissout beaucoup plus de tout", "Il rétrécit légèrement — environ 0,1 mol de plus se dissout", "Il grossit ; le chauffage chasse les solides hors de la solution"]
"heating-dissolves-more-salt.expect.predict.misconception" = "Le sucre et le nitrate de potassium enseignent que le chauffage dissout dramatiquement plus, et cette leçon se généralise. Le sel est le contre-exemple que contient chaque cuisine : sa solubilité n'augmente que de quelques pour cent entre l'eau froide et l'ébullition. Que la chaleur aide ou non dépend du signe de l'enthalpie de dissolution, et pour NaCl cette enthalpie est presque nulle (+3,9 kJ/mol) — la température n'a donc presque rien sur quoi agir."
"heating-dissolves-more-salt.expect.predict.diagnosis.0.reveals" = "« L'eau chaude dissout plus » comme levier universel : la chaleur est imaginée agir sur la dissolution en elle-même, plutôt que par l'intermédiaire de l'enthalpie de dissolution propre à chaque substance."
"heating-dissolves-more-salt.expect.predict.diagnosis.0.next" = "Mesure le tas aux deux températures sur ce banc : 24 degrés rapportent environ 0,1 mol face à un plafond de six. Demande-toi ensuite sur quoi la chaleur peut agir — pour NaCl, l'enthalpie de dissolution est de +3,9 kJ/mol, presque rien, et le levier bouge presque rien."
"heating-dissolves-more-salt.expect.predict.diagnosis.1.reveals" = "La règle venue des gaz, transplantée : la limonade tiède s'évente, donc la chaleur chasserait ce qui est dissous — solides compris."
"heating-dissolves-more-salt.expect.predict.diagnosis.1.next" = "La règle transplantée est réellement juste là d'où elle vient : les gaz quittent bel et bien l'eau chaude, car leur dissolution libère de la chaleur. Que le chauffage aide ou nuise suit dans les deux cas le signe de cette enthalpie — pour NaCl, elle est à peine positive, si bien que le tas rétrécit légèrement au lieu de grossir."
"heating-dissolves-more-salt.registers.lv1" = "L'eau salée a déjà du sel qui repose au fond et refuse de se dissoudre. Chauffe-la, et seule une toute petite quantité supplémentaire disparaît. L'eau chaude n'a rien de magique."
"heating-dissolves-more-salt.registers.lv2" = "La saturation passe d'environ 6,11 à 6,21 mol/kgw entre 19 °C et 43 °C — soit environ 1,7 %. Compare avec le nitrate de potassium, qui plus que double sur le même intervalle : la différence, c'est l'enthalpie de dissolution, et celle de NaCl est presque nulle."
"heating-dissolves-more-salt.registers.lv3" = "La température comme la nouvelle saturation sont calculées, non tabulées : les 100 kJ sont répartis sur la capacité thermique du récipient pour donner 43,05 °C, et la phase d'halite est rééquilibrée à cette température, dissolvant encore 0,1025 mol. Remarque que la température avait aussi chuté de 5,6 °C lors de la dissolution initiale — cet essai est à la fois une poche de froid et une expérience de solubilité."
"any-chloride-precipitates-silver.expect.predict.question" = "Le test à l'argent utilisait du chlorure de sodium. Cette fois, c'est du chlorure de potassium. Que se passe-t-il ?"
"any-chloride-precipitates-silver.expect.predict.options" = ["Rien — la réaction se produisait spécifiquement entre le nitrate d'argent et le chlorure de sodium", "Le même précipité blanc, dans la même quantité", "Un précipité différent — le chlorure de potassium est un composé différent"]
"any-chloride-precipitates-silver.expect.predict.misconception" = "Les réactions sont mémorisées comme composé-plus-composé, si bien qu'échanger le cation semble changer la réaction. En solution, il n'y a pas de composés — il y a des ions. La seule chose qui se produit est Ag⁺ + Cl⁻ → AgCl↓ ; le potassium et le nitrate ne participent jamais et pourraient encore être remplacés sans rien changer. C'est ce que *signifie* une équation ionique nette, et c'est pourquoi le test à l'argent détecte le chlorure, et non le chlorure de sodium."
"any-chloride-precipitates-silver.expect.predict.diagnosis.0.reveals" = "La réaction est une phrase mémorisée — « nitrate d'argent plus chlorure de sodium » — donc changer un seul mot briserait le charme, et la nouvelle paire n'aurait pas de phrase."
"any-chloride-precipitates-silver.expect.predict.diagnosis.0.next" = "Fais tourner les deux sur ce banc et regarde `particles` : le même précipité dans la même quantité, avec le potassium flottant exactement là où flottait le sodium, symbole pour symbole. La phrase qui survit à l'échange est l'équation ionique nette, et elle n'a jamais mentionné le sodium."
"any-chloride-precipitates-silver.expect.predict.diagnosis.1.reveals" = "Le solide hériterait de son identité des flacons de réactifs : un composé de départ différent, un précipité différent — le produit vu comme un mélange de ses parents plutôt que comme un nouvel appariement d'ions."
"any-chloride-precipitates-silver.expect.predict.diagnosis.1.next" = "Filtre les deux expériences et place les solides côte à côte : même couleur, même masse par mole de chlorure, même comportement à la lumière. Rien du potassium ne se trouve dans l'entonnoir, car les seuls ions qui se sont rencontrés sont Ag⁺ et Cl⁻ — le cation reste dans le ballon dans les deux cas."
"any-chloride-precipitates-silver.registers.lv1" = "Sel différent, même résultat : l'eau devient d'un blanc laiteux dès que les deux sont mélangés. La partie importante n'a jamais été l'ingrédient entier — c'était un seul de ses morceaux."
"any-chloride-precipitates-silver.registers.lv2" = "Ag⁺ + Cl⁻ → AgCl↓. K⁺ et NO₃⁻ sont des ions spectateurs et restent dissous. 0,01 mol de chaque réactif donne 0,01 mol de précipité, exactement comme avec le chlorure de sodium."
"any-chloride-precipitates-silver.registers.lv3" = "Le moteur ne voit jamais le « chlorure de potassium » comme un réactif — il comptabilise le solide en totaux élémentaires et laisse le minimiseur trouver l'assemblage stable, qui est de la cérargyrite plus une solution K-NO₃. L'argent dissous résiduel est de 2,2 × 10⁻⁶ mol/kgw sous forme de Ag⁺ plus 3,3 × 10⁻⁷ sous forme d'AgCl(aq) : le test est sensible, pas absolu."
"acetates-stay-dissolved.summary" = "Ca²⁺ + 2 CH₃COO⁻ → aucun précipité (tous les acétates sont solubles)"
"acetates-stay-dissolved.expect.predict.question" = "Deux solutions salines limpides sont versées ensemble — chlorure de calcium et acétate de sodium. Que vois-tu ?"
"acetates-stay-dissolved.expect.predict.options" = ["Un précipité blanc ; mélanger deux solutions salines crée un nouveau solide", "Rien de visible — cela reste limpide, car tout produit possible est soluble", "Un dégagement gazeux, car l'acétate provient d'un acide"]
"acetates-stay-dissolved.expect.predict.misconception" = "Après quelques démonstrations de précipitation, « mélange deux solutions salines et quelque chose en ressort » devient la règle attendue. La plupart des mélanges ne font absolument rien. Un précipité n'apparaît que si un appariement cation-anion se trouve être insoluble ; ici, l'acétate de calcium et le chlorure de sodium sont tous deux librement solubles, si bien que les quatre ions poursuivent simplement leur chemin. Apprendre quand rien ne se passe est ce qui rend les règles de solubilité prédictives plutôt que décoratives."
"acetates-stay-dissolved.expect.predict.diagnosis.0.reveals" = "La démonstration est devenue la règle : mélanger des solutions salines limpides serait ce qu'on fait pour obtenir un solide, donc un solide devrait apparaître — les exemples de la leçon étaient tous des réussites, et les échecs n'ont jamais été montrés."
"acetates-stay-dissolved.expect.predict.diagnosis.0.next" = "Prédis avant de verser, à partir de la table : les deux nouveaux appariements sont l'acétate de calcium et le chlorure de sodium, tous deux librement solubles, donc la prédiction est « rien ». Fais-le tourner et `inspect` : les quatre ions sont toujours dans l'inventaire. Une règle mérite le nom de prédictive sur les échecs, pas sur les réussites."
"acetates-stay-dissolved.expect.predict.diagnosis.1.reveals" = "L'origine confondue avec le comportement : l'acétate « provient d'un acide », donc il devrait se comporter comme tel — et le pétillement est la signature de l'acide."
"acetates-stay-dissolved.expect.predict.diagnosis.1.next" = "Demande-toi ce qu'exige physiquement un pétillement : un produit volatil. Liste tous les appariements que ces quatre ions peuvent former — aucun n'est un gaz. L'ion qui provient *d'*un acide est la base conjuguée de cet acide, ce qui explique pourquoi le mélange, s'il penche quelque part, penche dans l'autre sens."
"acetates-stay-dissolved.registers.lv1" = "Deux liquides limpides, versés ensemble — et cela reste limpide. Parfois, mélanger des produits chimiques ne fait rien de visible. C'est aussi une réponse."
"acetates-stay-dissolved.registers.lv2" = "L'acétate de calcium et le chlorure de sodium sont tous deux solubles, si bien qu'aucune double décomposition ne se produit. Les quatre ions (Ca²⁺, Cl⁻, Na⁺, CH₃COO⁻) coexistent. Le pH de 8,6 provient de l'hydrolyse de l'acétate, pas d'une quelconque réaction entre les deux sels."
"acetates-stay-dissolved.registers.lv3" = "L'absence de précipité est calculée, non supposée : le minimiseur se voit proposer toute phase candidate dont la formule correspond à un solide du registre, et n'en trouve aucune sursaturée. Une affirmation `absent` est vérifiée par le lint exactement comme une affirmation positive — ce qui empêche cette entrée de devenir silencieusement fausse si l'ensemble des phases s'agrandit."
"softening-with-washing-soda.expect.predict.question" = "L'eau dure est une eau qui transporte du calcium dissous. On y ajoute de la soude de lessive pour l'adoucir. Où va le calcium ?"
"softening-with-washing-soda.expect.predict.options" = ["Il est détruit par la soude", "Il précipite hors de l'eau sous forme de craie solide, qu'on peut filtrer ou qui reste dans la machine", "Il reste dissous mais se trouve d'une manière ou d'une autre « désactivé »"]
"softening-with-washing-soda.expect.predict.misconception" = "Adoucir donne l'impression de retirer une propriété, si bien que les apprenants imaginent le calcium neutralisé sur place. Rien n'est détruit et rien n'est désactivé : le calcium est déplacé de la solution vers un solide. 99,8 % de celui-ci, ici. Ce solide est la boue grise de la machine à laver — adoucir échange une dureté dissoute contre un précipité qu'on peut séparer."
"softening-with-washing-soda.expect.predict.diagnosis.0.reveals" = "La matière disparaîtrait lorsqu'on la traite : la soude « détruirait » le calcium comme l'acide et la base se « détruisaient » mutuellement — la conservation de la matière suspendue partout où un problème est résolu."
"softening-with-washing-soda.expect.predict.diagnosis.0.next" = "Filtre et pèse (`filtering-a-precipitate` est le bon geste) : le calcium se trouve dans l'entonnoir sous forme de craie, à 99,8 %, et le bilan s'équilibre au milligramme près. Une destruction laisserait l'entonnoir vide et les comptes en déficit."
"softening-with-washing-soda.expect.predict.diagnosis.1.reveals" = "Une chimie de l'interrupteur : le calcium resterait où il était, mais sa propriété de dureté serait simplement désactivée — les propriétés vues comme des drapeaux sur une substance plutôt que comme des conséquences de sa localisation."
"softening-with-washing-soda.expect.predict.diagnosis.1.next" = "`inspect` la solution après l'adoucissement : le calcium dissous a réellement disparu de l'inventaire, et un solide est apparu dans la même étape, mole pour mole. Une désactivation sur place le montrerait toujours dissous — le banc n'a nulle part où cacher un drapeau."
"softening-with-washing-soda.registers.lv1" = "L'eau dure ne mousse pas. Ajoute de la soude de lessive en remuant, et l'eau devient trouble — la dureté s'est transformée en une poudre blanche que tu peux filtrer, et maintenant le savon fonctionne."
"softening-with-washing-soda.registers.lv2" = "Na₂CO₃ + CaCl₂ → CaCO₃↓ + 2 NaCl. 0,05 mol de chacun retire 0,0495 mol de calcium sous forme de carbonate solide, laissant 0,0001 mol dissous — une élimination de 99,8 %, avec le chlorure de sodium restant en solution."
"softening-with-washing-soda.registers.lv3" = "Calculé comme un problème de saturation : la calcite précipite jusqu'à SI = 0, et le résidu est fixé par K_sp et le carbonate restant, donnant [Ca²⁺] = 1,0 × 10⁻⁴ mol/kgw à pH 10,13. C'est exactement cet échange de dureté contre du sodium qui explique pourquoi l'eau adoucie n'est pas recommandée à la consommation dans un régime pauvre en sodium."
"permanent-hardness-makes-gypsum.registers.lv1" = "Deux liquides limpides se rencontrent et un solide blanc se forme — et celui-ci est du plâtre. La même substance dans laquelle on immobilise un bras cassé, fabriquée dans un becher à partir de deux choses qui ressemblaient à de l'eau."
"permanent-hardness-makes-gypsum.registers.lv2" = "Le calcium du chlorure rencontre le sulfate du sel d'Epsom et précipite du gypse, CaSO₄·2H₂O. 0,064 des 0,1 mol de calcium en ressort ; le magnésium reste dissous, car le sulfate de magnésium est soluble."
"permanent-hardness-makes-gypsum.registers.lv3" = "La dureté temporaire (hydrogénocarbonate) est éliminée par ébullition ; la dureté permanente (sulfate) ne l'est pas — et cette entrée montre que la distinction porte sur l'anion présent, pas sur le degré de dureté de l'eau. Le moteur retire aussi 2 mol d'eau par mole de gypse au solvant, si bien que l'eau libre du récipient diminue de façon mesurable : de 55,34 mol à 55,21 mol."
"filtering-a-precipitate.summary" = "AgCl(s) retenu sur le papier ; Na⁺, NO₃⁻ passent au travers"
"filtering-a-precipitate.expect.predict.question" = "Un mélange trouble de chlorure d'argent est versé à travers un papier filtre. Que trouve-t-on dans l'entonnoir, et que trouve-t-on dans le ballon en dessous ?"
"filtering-a-precipitate.expect.predict.options" = ["Du chlorure d'argent solide dans l'entonnoir ; une solution limpide d'ions sodium et nitrate dans le ballon", "Tout dans le ballon — le papier filtre n'arrête que les gros amas, et ce qui est dissous est petit", "Du solide dans l'entonnoir ; de l'eau pure dans le ballon, puisque le filtre retire les produits chimiques"]
"filtering-a-precipitate.expect.predict.misconception" = "La troisième option est la plus courante : la filtration est imaginée comme une purification. Le papier filtre sépare par phase, pas par propreté — tout ce qui est dissous passe directement au travers. Le filtrat ici n'est pas de l'eau ; c'est une solution de nitrate de sodium, et elle contient encore 8 × 10⁻⁴ mol/kgw d'argent dissous. Pour récupérer la partie dissoute, il faut évaporer, pas filtrer."
"filtering-a-precipitate.expect.predict.diagnosis.0.reveals" = "Le précipité est classé comme « dans le liquide », donc il irait où va le liquide — la différence entre solide en suspension et ions dissous ne serait qu'une différence de taille, et tout ce qui est chimique est petit."
"filtering-a-precipitate.expect.predict.diagnosis.0.next" = "Verse et `inspect` les deux récipients : la portion d'AgCl ne se trouve dans aucune des deux solutions — elle est restée solide, et le papier retient des phases, pas des tailles. Le trouble qui ne passerait pas est le même trouble qui se dépose si on attend simplement."
"filtering-a-precipitate.expect.predict.diagnosis.1.reveals" = "La filtration vue comme une purification : le papier retirerait « les produits chimiques », donc ce qui goutte serait propre — une séparation imaginée par propreté plutôt que par phase."
"filtering-a-precipitate.expect.predict.diagnosis.1.next" = "Évapore le filtrat (`crystallising-salt-from-brine` est le bon geste) : des cristaux de nitrate de sodium apparaissent à partir de « l'eau pure », et la lecture lv3 montre toujours 8 × 10⁻⁴ mol/kgw d'argent dissous qu'aucun papier ne peut retenir. Ce que la filtration retire, c'est une phase ; ce que la pureté exige, c'est une autre opération."
"filtering-a-precipitate.registers.lv1" = "Verse le mélange trouble à travers le cône de papier. Le solide blanc reste dans le papier, et ce qui goutte est parfaitement clair — mais ce n'est pas de l'eau pure, et ce n'est pas sûr à boire."
"filtering-a-precipitate.registers.lv2" = "La filtration sépare par phase : 0,0099 mol d'AgCl solide est retenu (1,4 g), tandis que toute la phase aqueuse — eau, Na⁺, NO₃⁻ et la trace d'argent dissous — passe dans v2. Peser le résidu séché est la méthode pour quantifier une précipitation."
"filtering-a-precipitate.registers.lv3" = "Le moteur rééquilibre les deux récipients après le transfert, ce pourquoi le filtrat est caractérisé séparément : pH 7,23, I = 0,10 mol/kgw, avec Ag⁺ à 8,1 × 10⁻⁴ mol/kgw. Le récipient de résidu ne contient que du solide et aucune solution du tout, si bien qu'un pH-mètre qu'on y plonge n'affiche rien — le laboratoire le dit honnêtement plutôt que d'inventer un chiffre."
"crystallising-salt-from-brine.summary" = "Na⁺ + Cl⁻ → NaCl(s), à mesure que l'eau s'échappe"
"crystallising-salt-from-brine.expect.predict.question" = "117 g de sel se dissolvent complètement dans un litre d'eau. Tu fais bouillir quatre cinquièmes de l'eau. Que reste-t-il dans la cuve ?"
"crystallising-salt-from-brine.expect.predict.options" = ["Rien d'autre qu'une eau très salée ; elle s'est dissoute une fois, donc elle reste dissoute", "Les 117 g redevenus des cristaux, puisque l'eau a presque entièrement disparu", "Environ 46 g de cristaux, le reste étant toujours dissous dans l'eau restante"]
"crystallising-salt-from-brine.expect.predict.misconception" = "La première réponse oublie que la solubilité s'exprime par unité de *solvant*, et non comme une porte à sens unique : retire l'eau, et le sel n'a plus où rester. La seconde va trop loin — 200 mL d'eau peuvent encore contenir 1,22 mol de sel, donc seul l'excès cristallise. Déterminer quelle fraction revient est toute la chimie des marais salants, et c'est une soustraction : ce que tu as mis, moins ce que l'eau restante peut encore contenir."
"crystallising-salt-from-brine.expect.predict.diagnosis.0.reveals" = "Dissoudre serait une porte à sens unique : une fois qu'un solide est « devenu liquide », il le resterait, quelle que soit la quantité de liquide qui s'échappe — la solubilité vue comme un événement dans le passé du sel plutôt que comme un rapport au présent de l'eau."
"crystallising-salt-from-brine.expect.predict.diagnosis.0.next" = "Observe le banc rapporter le moment du retour : les cristaux apparaissent exactement quand le plafond de l'eau qui rétrécit croise la charge, pas avant. Le sel n'a jamais changé ; c'est son quota par gramme d'eau qui a changé."
"crystallising-salt-from-brine.expect.predict.diagnosis.1.reveals" = "Le bon mécanisme, poussé trop loin : moins d'eau signifierait des cristaux, donc presque plus d'eau signifierait tous les cristaux — la propre capacité de charge de l'eau restante disparaît du calcul."
"crystallising-salt-from-brine.expect.predict.diagnosis.1.next" = "Fais la soustraction du marais salant : les 200 mL restants tiennent encore 1,22 mol, soit environ 71 g. 117 g au départ, 71 g toujours en suspension, 46 g dans la cuve — la réponse est un bilan, et la balance du banc le confirme."
"crystallising-salt-from-brine.registers.lv1" = "De l'eau salée, réduite par ébullition. À mesure que l'eau s'échappe, des cristaux blancs apparaissent au fond — le plus vieux tour de la mer, et le principe de fonctionnement de chaque marais salant du monde."
"crystallising-salt-from-brine.registers.lv2" = "2,00 mol de NaCl se dissolvent dans 1 L. Retirer 80 % de l'eau laisse 200 mL, qui ne peuvent contenir que 1,22 mol à saturation, si bien que 0,78 mol (environ 46 g) cristallise."
"crystallising-salt-from-brine.registers.lv3" = "La solution restante se situe à I = 6,12 mol/kgw, bien en dehors du domaine de Debye-Hückel — ce problème est renvoyé au modèle d'interaction ionique de Pitzer, et `explain` montrera que wateq4f et minteq.v4 donnent des réponses sensiblement différentes pour le même becher. Remarque aussi γ(Na⁺) = 1,65 ici : un coefficient d'activité supérieur à un est normal dans une saumure concentrée et n'est pas une erreur."
"permanganate-is-visible-when-almost-absent.expect.predict.question" = "Seize milligrammes de permanganate de potassium — un grain — sont versés dans un litre d'eau plein. Que vois-tu ?"
"permanganate-is-visible-when-almost-absent.expect.predict.options" = ["De l'eau limpide ; seize milligrammes dans un litre, c'est bien trop peu pour se voir", "Une eau nettement, indiscutablement violette", "Un violet à peine perceptible, seulement en regardant sur toute la longueur du becher"]
"permanganate-is-visible-when-almost-absent.expect.predict.misconception" = "Quantité et visibilité sont confondues, si bien qu'« une masse infime » est censée signifier « une couleur pâle ». La visibilité dépend du coefficient d'absorption molaire, et celui du permanganate est énorme — environ 2400 L mol⁻¹ cm⁻¹. À 10⁻⁴ mol/L, la solution est franchement violette. Le sulfate de cuivre à la même concentration serait invisible. Le même raisonnement explique pourquoi une goutte de colorant alimentaire teinte tout un bain et une cuillère de sucre non."
"permanganate-is-visible-when-almost-absent.expect.predict.diagnosis.0.reveals" = "La visibilité est lue directement sur la masse : des milligrammes dans un litre s'arrondissent à rien, donc l'œil ne devrait rien voir — comme si chaque substance portait la même couleur faible par gramme."
"permanganate-is-visible-when-almost-absent.expect.predict.diagnosis.0.next" = "`look v1` : le banc calcule la couleur à partir du spectre d'absorption plutôt que de l'affirmer, et la réponse est franchement violette. Dissous ensuite les mêmes quelques milligrammes de sulfate de cuivre — invisible. La masse était identique ; le coefficient d'absorption molaire ne l'était pas, et c'est toute l'histoire."
"permanganate-is-visible-when-almost-absent.expect.predict.diagnosis.1.reveals" = "Couleur concédée, mais à l'échelle du grain : une quantité minuscule ne peut faire que des choses minuscules, donc la teinte devrait avoir besoin de toute la profondeur du becher pour s'accumuler."
"permanganate-is-visible-when-almost-absent.expect.predict.diagnosis.1.next" = "La comparaison propre à cette entrée est le juge de paix : le sulfate de cuivre, à la *même concentration*, ne montre rien sur quelque profondeur que ce soit, tandis que le permanganate est incontestable sur un centimètre. Si la quantité déterminait la visibilité, ils se vaudraient ; ε ≈ 2400 contre quelques unités, voilà ce qui les distingue réellement."
"permanganate-is-visible-when-almost-absent.registers.lv1" = "Un grain de poudre violette, plus petit qu'un grain de riz, colore tout un litre d'eau en violet. Certaines couleurs sont étonnamment puissantes."
"permanganate-is-visible-when-almost-absent.registers.lv2" = "0,016 g représente 1,0 × 10⁻⁴ mol. Dans 1 L, cela fait 10⁻⁴ mol/L, et avec un coefficient d'absorption molaire proche de 2400, l'absorbance à travers un becher normal avoisine 0,2 — nettement visible. La solution reste neutre à pH 7,00 : ni K⁺ ni MnO₄⁻ ne réagit avec l'eau."
"permanganate-is-visible-when-almost-absent.registers.lv3" = "Deux types d'affirmation différents cohabitent dans un même becher, et le laboratoire les distingue. Le pH 7,00 et la spéciation sont calculés. La couleur est mise en scène — le registre porte le sRGB du permanganate et une force colorante de 12 000, parce qu'un véritable spectre d–d et de transfert de charge n'est pas quelque chose qu'une base de données thermodynamique ou un calcul sommaire peut fournir honnêtement. La provenance indique qui est quoi."
"ethanol-and-water-mix.summary" = "C₂H₅OH(l) + H₂O(l) → une seule phase liquide (entièrement miscibles)"
"ethanol-and-water-mix.expect.predict.question" = "100 mL d'eau et 50 mL d'éthanol sont versés dans une même éprouvette. Que lit-on sur le niveau ?"
"ethanol-and-water-mix.expect.predict.options" = ["150 mL — les volumes s'additionnent", "Un peu moins de 150 mL, car les deux types de molécules s'imbriquent plus étroitement que chacune seule", "Deux couches, comme l'huile et l'eau"]
"ethanol-and-water-mix.expect.predict.misconception" = "Le volume est traité comme une grandeur conservée, à l'image de la masse. Il ne l'est pas : la masse s'additionne exactement, le volume non, car le volume est un énoncé sur l'empilement. La petite queue hydrophobe de l'éthanol se glisse dans les interstices du réseau de liaisons hydrogène de l'eau, et le mélange réel avoisine 145 mL. Kerotakis rapporte 150,0 mL — le moteur suppose des volumes additifs, et c'est une limitation déclarée, pas une affirmation sur le monde réel."
"ethanol-and-water-mix.expect.predict.diagnosis.0.reveals" = "Le volume se conserverait comme la masse : ce qui entre est ce qui se lit sur l'éprouvette, parce que la « quantité de matière » serait une seule grandeur et non deux. Sur ce point, le banc lui-même tient compagnie à l'apprenant — il rapporte 150,0, une limitation déclarée."
"ethanol-and-water-mix.expect.predict.diagnosis.0.next" = "Sépare les deux grandeurs : `measure v1 balance` s'additionne exactement, à chaque fois ; une véritable éprouvette graduée ne le fait pas (≈145 mL). C'est l'entrée rare où le contrôle honnête est la cuisine, pas la simulation — le moteur suppose des volumes additifs et le dit, ce qui constitue en soi la leçon sur la confiance à accorder aux limitations déclarées."
"ethanol-and-water-mix.expect.predict.diagnosis.1.reveals" = "L'alcool est classé avec l'huile : organique, donc censé se séparer en flottant — la miscibilité lue comme un attribut binaire de la famille du composé plutôt que de ce que ses molécules peuvent offrir à l'eau."
"ethanol-and-water-mix.expect.predict.diagnosis.1.next" = "Verse-le dans n'importe quelle proportion : jamais d'interface. L'extrémité OH de l'éthanol forme des liaisons hydrogène avec le réseau de l'eau tandis que sa courte queue se niche dans les interstices ; l'huile n'a pas de OH à offrir et obtient la couche que cet apprenant attendait. La famille était le mauvais critère de tri — le groupe fonctionnel est le bon."
"ethanol-and-water-mix.registers.lv1" = "L'alcool et l'eau se mélangent en un seul liquide limpide — pas de couches, pas de ligne, pas de trouble. Rien à l'œil ne permet de deviner qu'il y a deux choses là-dedans."
"ethanol-and-water-mix.registers.lv2" = "L'éthanol et l'eau sont miscibles en toute proportion : le groupe OH forme des liaisons hydrogène avec l'eau, tandis que le petit groupe éthyle n'est pas assez volumineux pour forcer une séparation. À l'inverse, les longues chaînes hydrocarbonées de l'huile ne peuvent pas payer le coût entropique de la perturbation du réseau de l'eau."
"ethanol-and-water-mix.registers.lv3" = "La limite honnête : le banc additionne les volumes des composants purs (150,0 mL) là où le volume d'excès réel du mélange est d'environ −3,5 %, ce qui donne ≈145 mL. C'est le volume de mélange, une grandeur thermodynamique réelle que le modèle actuel ne porte pas. `evaporate` énonce ouvertement une lacune apparentée — séparer l'éthanol de l'eau exige un équilibre liquide-vapeur, qui relève de L3 et n'est pas câblé, si bien que ce récipient ne peut pas être distillé."
"bleach-and-acid.expect.predict.question" = "L'eau de Javel et le détartrant sont tous deux des produits d'entretien ordinaires. Que se passe-t-il s'ils sont utilisés dans la même cuvette de toilettes ?"
"bleach-and-acid.expect.predict.options" = ["Pas grand-chose — ce sont tous deux des nettoyants, donc ils s'entraident", "Du chlore gazeux est libéré, en quantités qui envoient des gens à l'hôpital chaque année", "Ils se neutralisent l'un l'autre et cessent d'agir"]
"bleach-and-acid.expect.predict.misconception" = "« Ce sont tous deux des produits d'entretien » se lit comme « ils sont dans le même camp », et la troisième option montre la version presque juste : quelque chose est bel et bien neutralisé, mais le produit est un gaz toxique plutôt qu'un résultat inoffensif et raté. L'eau de Javel domestique est de l'hypochlorite en milieu alcalin ; les détartrants sont des acides. L'acide protone l'hypochlorite et chasse du Cl₂ — le gaz utilisé comme arme en 1915."
"bleach-and-acid.expect.predict.diagnosis.0.reveals" = "Les produits sont triés par usage, pas par chimie : deux choses vendues pour nettoyer seraient coéquipières, donc les combiner ne pourrait que nettoyer plus fort."
"bleach-and-acid.expect.predict.diagnosis.0.next" = "Fais-le tourner ici, où la seule victime est un chiffre : l'avertissement nomme le chlore *avant même* que la chimie ne se déroule, et la balance observe alors un gaz s'échapper qu'aucune des deux bouteilles ne contenait. L'étiquette sur le devant dit à quoi ça sert ; la chimie répond aux ingrédients inscrits au dos."
"bleach-and-acid.expect.predict.diagnosis.1.reveals" = "La moitié acide-base est réellement perçue — l'alcali rencontre l'acide, donc ils se neutralisent — mais la neutralisation est supposée finir sans danger, et l'identité du produit n'est jamais vérifiée."
"bleach-and-acid.expect.predict.diagnosis.1.next" = "Termine l'équation au lieu de t'arrêter à « neutraliser » : protoner l'hypochlorite donne du chlore gazeux, pas de l'eau salée. L'habitude que cette entrée cherche à construire est de lire une réaction jusqu'à ses produits — `neutralisation` mérite sa fin inoffensive parce qu'elle produit de l'eau ; ce n'est pas le cas ici."
"bleach-and-acid.registers.lv1" = "Ne mélange jamais l'eau de Javel avec quoi que ce soit d'autre. Jamais. Dans le laboratoire, c'est une image sur un écran ; dans une salle de bains, c'est une ambulance. Le laboratoire te montrera ce qui se passe et ne te laissera pas le sentir."
"bleach-and-acid.registers.lv2" = "NaOCl + 2 HCl → Cl₂↑ + NaCl + H₂O. 0,1 mol d'hypochlorite avec 0,2 mol d'acide libère 0,1 mol de chlore — environ 2,4 L à température ambiante, dans une pièce où tu te tiens. Ce qui reste dans le becher n'est que de l'eau salée, pH 6,96."
"bleach-and-acid.registers.lv3" = "Le danger est de niveau L0 : le filtre de groupes réactifs évalue l'état prospectif du récipient *avant* que l'ajout ne soit appliqué, et avertit dès l'appariement lui-même, indépendamment du fait qu'un solveur modélise ou non la chimie. La libération de gaz est ensuite une stœchiométrie mise en scène, et la saumure restante est calculée. Une sécurité qui dépend de l'opinion d'un solveur est une sécurité qui échoue quand le solveur n'en a pas."
"neutral-is-a-moving-target.expect.predict.question" = "Un becher d'eau (presque) pure affichait pH 7,00 à 25 °C. Tu le réchauffes à 50 °C et mesures à nouveau. L'appareil indique 6,63. Que s'est-il passé ?"
"neutral-is-a-moving-target.expect.predict.options" = ["Rien n'a pu se passer — l'eau pure est neutre, et neutre veut dire 7", "L'eau est toujours exactement neutre ; c'est le point neutre lui-même qui s'est déplacé", "La chaleur a rendu l'eau légèrement acide"]
"neutral-is-a-moving-target.expect.predict.misconception" = "Les deux réponses fausses traitent « pH 7 = neutre » comme une définition, alors que c'est la valeur à 25 °C d'un équilibre dépendant de la température. L'eau se scinde d'elle-même — H₂O ⇌ H⁺ + OH⁻ —, et le chauffage pousse cette scission plus loin, si bien que [H⁺] et [OH⁻] montent ensemble. Neutre signifie qu'ils sont égaux, et à 50 °C ils sont égaux à pH 6,63. Acide exigerait un excès de H⁺ sur OH⁻, et rien n'en a fourni un."
"neutral-is-a-moving-target.expect.predict.diagnosis.0.reveals" = "pH 7 pris pour la définition de neutre plutôt que pour la lecture à une seule température — donc un appareil qui indique autre chose pour de l'eau pure serait forcément faux."
"neutral-is-a-moving-target.expect.predict.diagnosis.0.next" = "Fais confiance à l'appareil et fais varier la température dans les deux sens : 6,63 à 50 °C, 7,00 à 25 °C, 7,47 près de 0 °C — la lecture bouge alors que rien n'est ajouté ni retiré. Une définition ne peut pas faire cela ; une constante d'équilibre dépendant de la température, si."
"neutral-is-a-moving-target.expect.predict.diagnosis.1.reveals" = "Acide signifierait « en dessous de 7 », comme un absolu — la véritable définition de la neutralité, H⁺ et OH⁻ égaux, n'entre pas dans ce tableau."
"neutral-is-a-moving-target.expect.predict.diagnosis.1.next" = "Demande-toi d'où viendrait un excès de H⁺ : chauffer de l'eau produit davantage de H⁺ et davantage de OH⁻ en nombre exactement égal, car chaque scission d'une molécule d'eau fournit un de chaque. À 50 °C, cette égalité se situe à 6,63 ; l'eau est aussi neutre qu'elle l'a jamais été."
"neutral-is-a-moving-target.registers.lv1" = "L'eau chaude reste simplement de l'eau — rien d'acide en elle. Mais l'idée que se fait l'appareil du « milieu de l'échelle » se déplace quand l'eau se réchauffe. Le milieu n'est à 7 que dans un becher à température ambiante."
"neutral-is-a-moving-target.registers.lv2" = "L'eau se scinde un peu d'elle-même : H₂O ⇌ H⁺ + OH⁻, avec K_w = 10⁻¹⁴ à 25 °C. La scission est endothermique, donc le chauffage la pousse plus loin : K_w augmente, [H⁺] et [OH⁻] montent ensemble, et le pH chute à 6,63 tandis que le pOH chute à l'unisson. Le point neutre est là où ils sont égaux — et ce n'est plus 7."
"neutral-is-a-moving-target.registers.lv3" = "La pincée de sel est un échafaudage, présenté comme tel : ce banc refuse de caractériser l'eau pure — pas de soluté, pas de résolution, et l'appareil n'affiche honnêtement rien — donc 0,01 mol/kgw de NaCl lui donne une solution où se tenir sans toucher à l'autoprotolyse (les deux ions lui sont spectateurs). K_w provient de la base de données à la température propre du récipient : le moteur lit 7,00 à 25 °C, 6,63 à 50 °C et 7,47 près de 0 °C — les valeurs classiques des tables, calculées plutôt que citées. « pH 7 = neutre » est un fait à 25 °C, généralement enseigné comme une définition ; le pH 13,51 de l'entrée sur la lessive de soude est cette même leçon vue depuis l'autre bout de l'échelle."
"bicarbonate-plays-both-sides.expect.predict.question" = "Le bicarbonate de soude pétille furieusement quand de l'acide y est versé. Verse plutôt de la lessive de soude concentrée sur cette même solution de bicarbonate. Que se passe-t-il ?"
"bicarbonate-plays-both-sides.expect.predict.options" = ["Il pétille à nouveau — pétiller, c'est ce que fait le bicarbonate", "Absolument rien — le bicarbonate répond aux acides, et la lessive de soude n'en est pas un", "Pas de gaz cette fois : le bicarbonate cède son propre proton et devient du carbonate"]
"bicarbonate-plays-both-sides.expect.predict.misconception" = "Les deux réponses fausses traitent acide et base comme des badges qu'une substance porterait, plutôt que comme des rôles dans une transaction. Le bicarbonate est amphiprotique : face à un acide, il accepte un proton (et l'acide carbonique résultant part sous forme de CO₂ — le pétillement) ; face à une base, il cède son propre proton et devient carbonate, silencieusement. Toute l'idée de Brønsted est qu'acide et base désignent les deux bouts d'un même transfert de proton — et ce becher en est l'expérience."
"bicarbonate-plays-both-sides.expect.predict.diagnosis.0.reveals" = "Le pétillement comme geste signature de la substance — le bicarbonate « contiendrait » le gaz comme un ballon, et toute provocation le libérerait."
"bicarbonate-plays-both-sides.expect.predict.diagnosis.0.next" = "Demande-toi de quoi est fait le gaz : le CO₂ ne se forme que lorsque le bicarbonate *reçoit* un proton. La lessive de soude n'en offre aucun. Observe le flux d'événements — l'étape avec la lessive ne dégage rien — et la spéciation lv3 montre le carbone toujours présent dans le becher, désormais sous forme de carbonate."
"bicarbonate-plays-both-sides.expect.predict.diagnosis.1.reveals" = "Acide et base vus comme des identités fixes : le bicarbonate serait « une base », et une base n'aurait rien à faire avec une autre — donc rien ne pourrait se passer."
"bicarbonate-plays-both-sides.expect.predict.diagnosis.1.next" = "Quelque chose s'est bien passé ; c'était juste silencieux. La spéciation lv3 montre le bicarbonate disparu et le carbonate à sa place : un proton a quitté l'ion HCO₃⁻ lui-même. Une substance, deux rôles selon le partenaire — le passage d'Arrhenius à Brønsted dans `models.toml` est ce becher écrit comme théorie."
"bicarbonate-plays-both-sides.registers.lv1" = "Face à ce qui est acide, le bicarbonate riposte à coups de bulles. Face à ce qui est glissant, il fait quelque chose de plus sournois : il cède un tout petit morceau de lui-même, sans la moindre bulle. La même poudre joue sur les deux tableaux, selon qui elle rencontre."
"bicarbonate-plays-both-sides.registers.lv2" = "Comportement amphiprotique : HCO₃⁻ + H⁺ → H₂O + CO₂↑ (rôle de base — le pétillement), mais HCO₃⁻ + OH⁻ → CO₃²⁻ + H₂O (rôle d'acide — pas de gaz). Le becher acide finit près de pH 5,6, tout son carbone étant parti sous forme de gaz ; le becher à la lessive de soude conserve son carbone sous forme de carbonate."
"bicarbonate-plays-both-sides.registers.lv3" = "La comptabilité, honnêtement : une solution ouverte de bicarbonate à 0,1 mol/kgw dégaze d'elle-même environ 0,003 mol de CO₂ à la dissolution (son propre équilibre carbonaté vis-à-vis de l'atmosphère — `baking-soda-vents-carbon-dioxide`), si bien que 0,003 mol de la lessive de soude ne trouve aucun partenaire bicarbonate, et le pH final du second becher porte cet excès d'hydroxyde. Le pH 5,6 du becher acide n'est pas de l'acide restant : c'est une solution de chlorure de sodium équilibrée avec le CO₂ atmosphérique — la même chimie qui rend la pluie propre légèrement acide. Le point brønstedien se trouve dans la spéciation : le même ion apparaît comme accepteur de proton dans un récipient et comme donneur de proton dans l'autre, ce qu'aucune étiquette fixe acide/base ne peut dire."
"the-antacid-runs-on-arithmetic.expect.predict.question" = "L'acide gastrique est à peu près de l'acide chlorhydrique à 0,1 mol/L — ce becher-là affiche pH 1,1. On y verse un gramme de bicarbonate de soude, à peu près ce que contient un comprimé contre les brûlures d'estomac. Que dit l'appareil quand le pétillement s'arrête ?"
"the-antacid-runs-on-arithmetic.expect.predict.options" = ["Toujours environ 1 — une poudre de cuisine ne peut rien contre un acide fort", "Environ 9, avec un rot de dioxyde de carbone au passage", "14 — le bicarbonate est une base, et une base envoie l'échelle au sommet"]
"the-antacid-runs-on-arithmetic.expect.predict.misconception" = "Les deux réponses fausses confondent CE QU'EST une substance avec la QUANTITÉ qu'il y en a. « Fort » décrit à quel point un acide cède complètement ses protons, pas combien il en possède : 0,01 mol de protons rencontre 0,012 mol d'accepteurs de protons et s'épuise tout simplement. Et une base ne téléporte pas l'échelle jusqu'à 14 — le bicarbonate restant est une base faible et douce qui se stabilise vers 9, précisément pourquoi les comprimés sont des carbonates et non de la lessive de soude."
"the-antacid-runs-on-arithmetic.expect.predict.diagnosis.0.reveals" = "« Acide fort » vu comme invincible — la force lue comme une puissance sur n'importe quel adversaire, plutôt que comme la complétude de sa propre dissociation."
"the-antacid-runs-on-arithmetic.expect.predict.diagnosis.0.next" = "Compte au lieu de classer : 0,01 mol de protons contre 0,012 mol de bicarbonate. La force a décidé comment les protons ont été offerts (tous à la fois, entièrement dissociés) ; le décompte décide qui s'épuise, et c'est l'acide. Le pétillement, ce sont ses protons qui quittent le becher sous forme de gaz."
"the-antacid-runs-on-arithmetic.expect.predict.diagnosis.1.reveals" = "Les bases vues comme des inverseurs d'échelle : ajouter « une base » enverrait le pH au sommet de l'échelle, sans que la force ni la quantité propres de la base n'y jouent le moindre rôle."
"the-antacid-runs-on-arithmetic.expect.predict.diagnosis.1.next" = "Regarde ce qui reste réellement : du bicarbonate en excès, un accepteur de protons faible qui stabilise le becher vers pH 9 — pour la lessive de soude, qui atteint vraiment le sommet de l'échelle, fais tourner `strong-base`. La muqueuse de ton estomac est la raison pour laquelle un atterrissage en douceur est l'objectif de conception : un antiacide qui dépasserait jusqu'à 14 serait une brûlure pire que l'acide qu'il devait soigner."
"the-antacid-runs-on-arithmetic.registers.lv1" = "De l'acide gastrique simulé : assez acide pour piquer. On y verse la poudre blanche — elle pétille fort, et quand les bulles s'arrêtent, la piqûre a disparu. Le rot, c'est l'acide lui-même qui s'échappe sous forme de gaz."
"the-antacid-runs-on-arithmetic.registers.lv2" = "HCO₃⁻ + H⁺ → H₂O + CO₂↑. Un gramme de NaHCO₃ représente 0,0119 mol face à 0,0100 mol d'acide, si bien que l'acide est le réactif limitant : le pH grimpe de 1,1 à environ 9,2, la balance perd ~0,45 g de CO₂, et les ~0,002 mol de bicarbonate non consommé sont ce qui rend la fin douce."
"the-antacid-runs-on-arithmetic.registers.lv3" = "Le comprimé est dosé pour survivre à l'acide qu'il anticipe — `buffer-capacity-exceeded` joué à l'envers : là-bas, l'attaque survivait à la réserve ; ici, la réserve survit à l'attaque, par conception et par calcul. Honnêteté sur le modèle : un becher n'est pas un estomac — un estomac continue de sécréter de l'acide et de réguler son volume, si bien que le soulagement réel est un combat continu plutôt que cette titration en un seul coup ; et le point final du becher à pH 9,2 est un équilibre carbonaté en récipient ouvert, dégazant du CO₂ jusqu'à s'équilibrer avec l'atmosphère. Ce que le calcul transmet bel et bien jusqu'au rayon de la pharmacie : la dose agit par moles, pas par magie, ce qui explique que la boîte indique des grammes."
"the-indicator-is-chosen-for-the-jump.summary" = "La phénolphtaléine vire au point final de cette titration (pH 8,6) ; l'hélianthine a déjà viré bien avant, en plein dans le tampon — l'indicateur est choisi pour se situer sur le saut, pas pour son apparence"
"the-indicator-is-chosen-for-the-jump.expect.predict.question" = "Le point d'équivalence de cette titration du vinaigre se situe à pH 8,6, pas à 7. Quel indicateur le marque — la phénolphtaléine (virage 8,2–10) ou l'hélianthine (virage 3,1–4,4) ?"
"the-indicator-is-chosen-for-the-jump.expect.predict.options" = ["N'importe lequel — un indicateur est un signal de couleur, et n'importe quel signal de couleur convient", "La phénolphtaléine : son virage se situe sur le point final. L'hélianthine vire bien avant, en pleine zone tampon", "L'hélianthine — l'orange se voit plus facilement sur du blanc que le rose pâle"]
"the-indicator-is-chosen-for-the-jump.expect.predict.misconception" = "Un indicateur n'est pas une cloche qui sonne à « c'est fini » — c'est un acide faible qui change de forme à son propre pKa, où qu'il se trouve. Le choix est un problème d'alignement : la fenêtre de transition de l'indicateur doit se situer sur le saut de pH de la titration. La fenêtre de la phénolphtaléine chevauche les 8,6 de ce point final ; celle de l'hélianthine a été franchie bien plus tôt, vers pH 4, dans la lente montée tampon, où son changement de couleur ne marque rien d'un quelconque intérêt analytique."
"the-indicator-is-chosen-for-the-jump.expect.predict.diagnosis.0.reveals" = "Tous les indicateurs seraient des signaux interchangeables : la chimie du colorant ne jouerait aucun rôle, donc tout changement de couleur signifierait « arrête »."
"the-indicator-is-chosen-for-the-jump.expect.predict.diagnosis.0.next" = "Fais tourner le ballon à moitié titré (v2) : l'hélianthine affiche déjà orange à pH 4,69, alors que la moitié de la base n'est pas encore consommée. Un analyste s'arrêtant à ce signal rapporterait la moitié de la concentration réelle — le mauvais indicateur ne gêne pas simplement, il répond à une autre question."
"the-indicator-is-chosen-for-the-jump.expect.predict.diagnosis.1.reveals" = "L'indicateur serait choisi pour sa visibilité — une décision esthétique sur les couleurs, l'axe du pH étant totalement absent du choix."
"the-indicator-is-chosen-for-the-jump.expect.predict.diagnosis.1.next" = "La visibilité est réelle mais secondaire : la question à laquelle répond un indicateur est OÙ il vire, pas avec quelle élégance. `weak-acid-endpoint-is-alkaline` a calculé ce point final à environ 8,8 plutôt qu'à 7 — ce chiffre est toute la raison pour laquelle la phénolphtaléine est le choix standard pour les titrations d'acides faibles, et il ne paraissait arbitraire que tant que le point final n'avait pas été calculé."
"the-indicator-is-chosen-for-the-jump.registers.lv1" = "Deux colorants magiques. L'un reste invisible jusqu'au moment précis où l'acide est épuisé — puis le ballon rosit. L'autre a changé de couleur il y a longtemps, alors qu'il restait encore beaucoup d'acide. Un seul des deux te dit vraiment quand t'arrêter."
"the-indicator-is-chosen-for-the-jump.registers.lv2" = "Un indicateur est un acide faible dont les formes sont diversement colorées ; il vire près de son propre pKa. La phénolphtaléine (transition ≈8,2–10) chevauche le point d'équivalence de cette titration — le banc lit pH 8,62 et rend le ballon rose. L'hélianthine (≈3,1–4,4) a achevé son changement en pleine zone tampon : v2, seulement à moitié titré, affiche déjà orange à pH 4,69."
"the-indicator-is-chosen-for-the-jump.registers.lv3" = "Les couleurs sont calculées, pas mises en scène selon le pH : chaque indicateur porte deux spectres mesurés (forme acide et forme basique), le moteur répartit les formes selon le rapport de Henderson-Hasselbalch au pH résolu, et Beer-Lambert appliqué à l'observateur CIE rend le mélange — le rose à 8,62 et l'orange à 4,69 sont le même calcul qui rend le permanganate violet. Une honnêteté sur le dosage : le banc dose une substance pure, si bien que les quantités en micromoles ici jouent le rôle des « deux gouttes de solution indicatrice » du vrai laboratoire — des doses de colorant pur mesurées à la goutte seraient une surdose centuplée et satureraient chaque teinte jusqu'au noir."
"the-in-between-colour-is-a-mixture.summary" = "Le bleu de bromothymol est vert près du point neutre — non pas une troisième couleur du colorant, mais le mélange calculé de ses formes jaune et bleue dans le rapport résolu"
"the-in-between-colour-is-a-mixture.expect.predict.question" = "Le bleu de bromothymol est jaune en milieu acide et bleu en milieu basique. Près de pH 7, quelle est la couleur de la solution ?"
"the-in-between-colour-is-a-mixture.expect.predict.options" = ["Jaune ou bleu, selon vers quoi il a basculé — un indicateur est un interrupteur", "Vert — les deux formes sont présentes en même temps, et leurs couleurs se mélangent", "Incolore — à mi-chemin, les deux couleurs s'annulent"]
"the-in-between-colour-is-a-mixture.expect.predict.misconception" = "Un indicateur n'est pas un interrupteur mais un équilibre : à un pH proche de son pKa, environ la moitié des molécules se trouvent dans chaque forme, simultanément. La moitié du colorant absorbant comme la forme jaune plus la moitié absorbant comme la forme bleue laisse passer du vert — de la même façon que le mélange de peintures, parce que les absorbances s'additionnent. L'annulation est le comportement de *lumières* opposées ; les colorants absorbants ne font toujours que soustraire davantage."
"the-in-between-colour-is-a-mixture.expect.predict.diagnosis.0.reveals" = "L'indicateur vu comme un interrupteur binaire : chaque molécule — ou le becher entier — serait dans exactement un état, et « plage de virage » signifierait seulement l'incertitude sur lequel."
"the-in-between-colour-is-a-mixture.expect.predict.diagnosis.0.next" = "Fais passer le becher par les trois couleurs du script de cette entrée : jaune en milieu acide, bleu-vert près du neutre, bleu en milieu basique. Un interrupteur n'a pas de milieu stable ; une population à l'équilibre, si, et le vert EST l'énoncé de cette population — tu vois le rapport."
"the-in-between-colour-is-a-mixture.expect.predict.diagnosis.1.reveals" = "Les couleurs vues comme des opposés qui s'annulent : jaune plus bleu égalerait rien, comme le positif et le négatif."
"the-in-between-colour-is-a-mixture.expect.predict.diagnosis.1.next" = "Distingue les lumières des colorants : des LUMIÈRES complémentaires peuvent s'annuler en blanc, mais un colorant agit par absorption, et deux absorbeurs dans un même becher absorbent l'union — le rouge est pris par une forme, l'orangé-rouge par l'autre, laissant passer le vert. Les absorbances s'additionnent ; elles ne se soustraient jamais. Le moteur de couleur du banc additionne littéralement les deux spectres avant de restituer l'image."
"the-in-between-colour-is-a-mixture.registers.lv1" = "Ce colorant est jaune dans l'eau acide et bleu dans l'eau savonneuse. Dans l'eau pure, il est vert — parce qu'il est à moitié sous forme jaune et à moitié sous forme bleue en même temps, et ton œil les additionne."
"the-in-between-colour-is-a-mixture.registers.lv2" = "L'équilibre de l'indicateur HInd ⇌ H⁺ + Ind⁻ se situe à son pKa proche de 7 : en milieu acide, le HInd jaune domine, en milieu basique, l'Ind⁻ bleu, et près du neutre les deux sont peuplés — le banc affiche jaune, puis bleu-vert, puis bleu, tandis que ce script fait osciller le même becher sur toute l'échelle."
"the-in-between-colour-is-a-mixture.registers.lv3" = "Le vert n'existe nulle part comme couleur mise en scène dans les données : le moteur garde un spectre mesuré par forme, peuple les formes selon le rapport calculé au pH résolu, additionne les absorbances, et intègre sur l'observateur CIE 1931. La couleur intermédiaire est donc une *prédiction* que le mélange fonctionne — la même affirmation d'additivité que le README fait pour la teinte du permanganate dépendante de la concentration, ici vérifiable à l'œil à chaque pH intermédiaire. Honnêteté sur le point final : le script stationne le becher à pH 11,63 (entièrement bleu) afin que l'affirmation de pH soit vérifiable ; la lecture bleu-vert survient en milieu de script, à l'arrêt presque neutre."
"salt-dissolves.registers.lv1" = "Le sel disparaît dans l'eau. Il n'est pas parti pour autant — goûte, et tu le sens encore : il se cache en minuscules morceaux trop petits pour être vus."
"salt-dissolves.registers.lv2" = "Le chlorure de sodium se dissout, se séparant en ions Na⁺ et Cl⁻ hydratés. La solution reste neutre, car aucun des deux ions ne réagit avec l'eau."
"salt-dissolves.registers.lv3" = "Dissolution congruente en Na⁺/Cl⁻ entièrement dissociés ; le pH n'est pas affecté, car aucun des deux ions ne s'hydrolyse de façon appréciable. Les coefficients d'activité suivent l'extension de Debye-Hückel de WATEQ à cette force ionique."
"salt-saturates.registers.lv1" = "Continue à ajouter du sel dans l'eau en remuant, et à un moment il cesse de disparaître — l'eau est pleine. Le reste reste simplement au fond."
"salt-saturates.registers.lv2" = "Au-delà de la limite de solubilité (≈6,1 mol par kg d'eau à 25 °C), la solution est saturée : le sel dissous et le sel solide sont en équilibre, et tout excédent reste solide."
"salt-saturates.registers.lv3" = "Saturation en halite. Remarque que les jeux de données divergent dans ce régime — le modèle d'interaction ionique de Pitzer donne ≈6,13 mol/kgw contre 6,50 pour wateq4f et 3,7 pour minteq.v4, ce qui explique pourquoi les problèmes concentrés sont dirigés vers Pitzer. `explain` montre les trois."
"silver-chloride-precipitation.registers.lv1" = "Deux liquides limpides — et au moment où ils se rencontrent, l'eau devient trouble et blanche ! Un tout nouveau solide est apparu comme sorti de nulle part."
"silver-chloride-precipitation.registers.lv2" = "Ag⁺ + Cl⁻ → AgCl↓. Le chlorure d'argent est insoluble (Ksp ≈ 1,8 × 10⁻¹⁰), il précipite donc hors de la solution, tandis que les ions sodium et nitrate restent dissous comme spectateurs."
"silver-chloride-precipitation.registers.lv3" = "Précipitation de cérargyrite jusqu'à SI = 0. L'argent dissous résiduel n'est pas uniquement du Ag⁺ libre : le complexe neutre AgCl(aq) est présent à ≈3 × 10⁻⁷ m, ce qui explique pourquoi la solubilité apparente dépasse le √Ksp naïf."
"strong-acid.registers.lv1" = "Ce liquide est un acide. Les acides ont un goût acide — c'est pourquoi les citrons et le vinaigre sont acides — mais on ne goûte jamais un produit chimique dans un laboratoire."
"strong-acid.registers.lv2" = "L'acide chlorhydrique est un acide fort : il se dissocie complètement, si bien que 0,001 mol dans un litre donne [H⁺] = 10⁻³ et pH 3."
"strong-acid.registers.lv3" = "Dissociation complète ; le pH provient du bilan de charge plutôt que d'une activité supposée égale à un. À I ≈ 10⁻³, le coefficient d'activité vaut ≈0,96, si bien que le pH se situe légèrement au-dessus du logarithme de la concentration."
"weak-acid.registers.lv1" = "C'est l'acide du vinaigre. Il est acide aussi, mais bien plus doux que l'acide fort — la plus grande partie reste entière au lieu de se scinder."
"weak-acid.registers.lv2" = "L'acide acétique est faible : seule une petite fraction se dissocie. 0,1 mol/L donne pH ≈ 2,9, et non le 1,0 qu'un acide fort de même concentration donnerait."
"weak-acid.registers.lv3" = "Dissociation partielle régie par l'équilibre propre de la base de données H⁺ + Acétate⁻ ⇌ HAc (pKa ≈ 4,76) ; le pH découle de cet équilibre, pas d'un degré de dissociation supposé."
"buffer.summary" = "Tampon CH₃COOH/CH₃COO⁻"
"buffer.registers.lv1" = "Ajoute de l'acide à ce liquide et — presque rien ne se passe. Il est obstiné. Ton sang fait le même tour, c'est pourquoi boire une limonade ne te fait pas de mal."
"buffer.registers.lv2" = "Un acide faible et son sel en quantités équimolaires tamponnent près du pKa (4,76). Ajouter 0,01 mol d'acide fort déplace le pH de moins de 0,1, là où le même acide dans l'eau pure l'amènerait à pH 2."
"buffer.registers.lv3" = "Le comportement de Henderson-Hasselbalch émerge ici de la spéciation plutôt que d'être appliqué : le réservoir de base conjuguée absorbe les protons ajoutés, et le déplacement suit le rapport logarithmique."
"vinegar-and-baking-soda.registers.lv1" = "Ça pétille ! Des bulles partout. Mets-le sur la balance avant et après : le bocal s'allège, parce que les bulles se sont envolées en emportant un peu de poids avec elles."
"vinegar-and-baking-soda.registers.lv2" = "L'acide protone le bicarbonate, libérant du dioxyde de carbone. Dans un récipient ouvert, le gaz s'échappe, si bien que le système perd de la masse — la masse est conservée globalement, mais pas à l'intérieur du becher."
"vinegar-and-baking-soda.registers.lv3" = "La spéciation du carbonate se déplace avec le pH jusqu'à ce que la solution soit sursaturée par rapport à la pCO₂ atmosphérique (log p = −3,408), et l'excès s'exsolve. Environ 77 % du carbonate s'échappe ; la loi de Henry maintient le reste dissous."
"hot-pack.registers.lv1" = "Touche le becher — il s'est réchauffé tout seul ! Certaines substances dégagent de la chaleur en se dissolvant. C'est ainsi que fonctionne une chaufferette."
"hot-pack.registers.lv2" = "La dissolution du chlorure de calcium est fortement exothermique (ΔH ≈ −82,8 kJ/mol) : 0,1 mol dans 100 mL d'eau élève la température d'environ 20 °C."
"hot-pack.registers.lv3" = "L'enthalpie de réseau est plus que remboursée par les enthalpies d'hydratation de Ca²⁺ et Cl⁻. Le récipient est adiabatique ici, si bien que toute l'énergie libérée apparaît sous forme de chaleur sensible dans la solution."
"cold-pack.registers.lv1" = "Celui-ci refroidit au contraire ! La dissolution peut aussi bien absorber de la chaleur que la libérer — c'est le principe d'une poche de froid."
"cold-pack.registers.lv2" = "La dissolution du chlorure de potassium est endothermique (ΔH ≈ +17,2 kJ/mol) : la solution puise de la chaleur en elle-même et refroidit de quelques degrés."
"cold-pack.registers.lv3" = "Dissolution endothermique : l'enthalpie de réseau dépasse la somme des enthalpies d'hydratation, et dans un récipient adiabatique, le déficit est prélevé sur la chaleur sensible de la solution."
"limescale.registers.lv1" = "L'eau devient trouble et une croûte blanche se forme. C'est ce qui entartre une bouilloire dans une région où l'eau est dure."
"limescale.registers.lv2" = "Les ions calcium rencontrant du carbonate précipitent du carbonate de calcium — le tartre. L'eau dure est une eau qui transporte du calcium et du magnésium dissous."
"limescale.registers.lv3" = "Précipitation de calcite ; le polymorphe est choisi par stabilité (le log K de la calcite est inférieur à celui de l'aragonite), et la spéciation du carbonate dépend du pH tout du long."
"calcination.registers.lv1" = "Chauffe de la craie jusqu'à ce qu'elle rougeoie, et elle se transforme en quelque chose de nouveau — la chaux vive. C'est ainsi que l'on fabrique ciment et mortier depuis des milliers d'années."
"calcination.registers.lv2" = "Décomposition thermique : au-delà d'environ 900 °C, le carbonate de calcium se décompose en oxyde de calcium et dioxyde de carbone, et le gaz s'échappe."
"calcination.registers.lv3" = "La température de décomposition est calculée, non supposée : elle correspond au point où la pression de CO₂ à l'équilibre au-dessus du carbonate atteint la pression partielle ambiante. Minimisation de Gibbs sur les polynômes NASA-9, avec l'atmosphère du récipient incluse dans le problème."
"burning-magnesium.registers.lv1" = "Il s'enflamme avec une lumière si vive qu'elle fait mal aux yeux, et laisse derrière lui une poudre blanche. Pèse-le ensuite : il est devenu PLUS LOURD. Le poids supplémentaire est venu de l'air."
"burning-magnesium.registers.lv2" = "Le magnésium brûle dans l'oxygène pour former de l'oxyde de magnésium, libérant 601 kJ par mole. La masse augmente parce que l'oxygène de l'air fait désormais partie du produit — une démonstration classique que brûler est une combinaison, pas une destruction."
"burning-magnesium.registers.lv3" = "Combustion adiabatique résolue en conservant l'enthalpie, avec l'atmosphère incluse dans le bilan élémentaire, ce qui donne une température de flamme proche de 3000 K. L'oxygène est puisé dans le réservoir plutôt que dans l'inventaire, ce qui explique que le récipient gagne de la masse."
"flame-test-sodium.summary" = "Na⁺ → Na* → Na + hν (589 nm)"
"flame-test-sodium.registers.lv1" = "Le sel ne brûle pas — mais tiens-le dans une flamme, et la flamme devient jaune vif ! Chaque métal a sa propre couleur, ce qui permet de les distinguer."
"flame-test-sodium.registers.lv2" = "Le sodium ne se consume pas ; le chauffage excite son électron externe, qui émet à 589 nm en retombant. Les tests à la flamme identifient les métaux grâce à ces couleurs caractéristiques."
"flame-test-sodium.registers.lv3" = "Émission atomique, pas combustion : le doublet de la raie D à 589,0/589,6 nm. C'est de la spectroscopie, donc des données mises en scène — les bases de données thermodynamiques n'ont rien à en dire, et le laboratoire ne prétend pas le contraire."
"teilchenmodell.registers.lv1" = "Tout est construit à partir de morceaux bien trop petits pour être vus, et ils ne cessent jamais de s'agiter. Dans un solide, ils sont serrés les uns contre les autres et ne peuvent que vibrer sur place ; dans un liquide, ils glissent les uns sur les autres ; dans un gaz, ils volent séparément, avec rien d'autre que du vide entre eux. Quand le sucre disparaît dans le thé, il n'est allé nulle part — les morceaux se sont glissés dans les interstices entre les morceaux d'eau, c'est pourquoi le thé a toujours un goût sucré et pèse exactement le même poids."
"teilchenmodell.registers.lv2" = "La matière est constituée de particules discrètes (Teilchen) en mouvement constant, séparées par du vide. La température mesure leur énergie cinétique moyenne, et les états de la matière diffèrent selon la part de cette énergie disponible face aux forces qui retiennent les particules ensemble. Fusion, ébullition, dissolution et diffusion ne sont que des réarrangements des mêmes particules, si bien qu'aucun d'entre eux ne change la masse."
"teilchenmodell.registers.lv3" = "Le modèle cinétique des particules — l'ancêtre scolaire de la théorie cinétique des gaz. Il est purement mécanique : les particules ont une masse, un volume et une vitesse, et rien d'autre, ce qui explique précisément pourquoi il fournit les lois de Boyle et de Gay-Lussac et pas un seul fait chimique. Dans les termes de Johnstone, c'est le premier modèle submicroscopique que rencontre un apprenant, et il ne s'acquiert pas spontanément : les intuitions de matière continue persistent pendant des années, les apprenants remplissent l'espace interparticulaire d'air, et ils transfèrent des propriétés macroscopiques à des particules individuelles."
"dalton-atommodell.registers.lv1" = "Chaque substance est construite à partir d'un petit nombre de types de briques appelées atomes, et chaque type a son propre poids. Les atomes ne sont jamais créés ni détruits — une réaction ne fait que les démonter et les réassembler autrement, comme reconstruire un modèle Lego avec les mêmes briques. C'est pourquoi rien ne pèse jamais moins lourd après coup."
"dalton-atommodell.registers.lv2" = "Les éléments sont constitués d'atomes ; tous les atomes d'un même élément partagent une même masse ; les composés contiennent des atomes dans des rapports entiers fixes ; une réaction réarrange les atomes sans en créer ni en détruire aucun. Il en découle la conservation de la masse, la loi des proportions constantes et la loi des proportions multiples — carbone et oxygène donnent CO et CO2, jamais rien entre les deux."
"dalton-atommodell.registers.lv3" = "Dalton (1808) est ici le premier modèle quantitatif et prédictif plutôt que descriptif, et la loi des proportions multiples en est la véritable prédiction, formulée avant même les preuves. Il portait aussi une erreur instructive : la règle de la plus grande simplicité attribuait à l'eau la formule HO, ce qui faussait toute la table des masses atomiques jusqu'à ce que l'hypothèse d'Avogadro et l'intervention de Cannizzaro au congrès de Karlsruhe séparent l'atome de la molécule. Cet écart de cinquante ans est le cas le plus clair disponible d'un modèle juste dans sa structure et faux dans un paramètre."
"kern-huelle-modell.registers.lv1" = "Tire de minuscules balles sur une feuille d'or, et presque toutes la traversent tout droit comme s'il n'y avait rien — mais environ une sur dix mille rebondit droit en arrière. Un atome doit donc être en majeure partie du vide, avec quelque chose de très petit, très lourd et chargé positivement en plein milieu : le noyau. Tout le reste est un nuage d'électrons légers et négatifs autour de lui. Frotte un ballon sur tes cheveux, et tu leur en voles quelques-uns."
"kern-huelle-modell.registers.lv2" = "Rutherford (1911), à partir de la diffusion des particules alpha de Geiger et Marsden : un atome possède un noyau de protons et de neutrons portant pratiquement toute la masse, sur environ un cent-millième du diamètre, entouré de Z électrons. Le noyau fixe de quel élément il s'agit ; seule la couche externe participe à la chimie. Retirer ou ajouter des électrons de la couche externe donne des ions, et les ions sont la matière première de toute la chimie du sel."
"kern-huelle-modell.registers.lv3" = "C'est ici que chimie et physique se séparent nettement : la charge nucléaire Z est l'identité, la couche électronique est la chimie. C'est aussi le modèle dont l'échec est quantitatif et sans ambiguïté — une charge accélérée rayonnant selon la formule de Larmor ferait s'effondrer l'atome en environ 10⁻¹¹ s — ce qui explique pourquoi l'étape suivante devait être un postulat contre la mécanique classique plutôt qu'un raffinement de celle-ci. Une fois cet échec nommé, les états stationnaires de Bohr cessent de paraître arbitraires."
"schalenmodell.registers.lv1" = "Les électrons ne sont pas n'importe où. Ils vivent en couches autour du noyau, comme les anneaux d'un oignon, et chaque couche n'a de la place que pour un certain nombre. Un atome est satisfait quand sa couche externe est pleine, et c'est là tout le secret de la chimie : les atomes cèdent, prennent ou partagent des électrons jusqu'à ce que la couche externe de chacun soit pleine. Chauffe un atome, et un électron saute d'une couche, puis retombe et émet une lumière d'une seule couleur exacte — c'est pourquoi le sel colore une flamme en jaune."
"schalenmodell.registers.lv2" = "Bohr (1913) : les électrons occupent les couches K, L, M, N avec des capacités de 2, 8, 18, 32 (c'est-à-dire 2n²). L'énergie n'est émise ou absorbée que lorsqu'un électron change de couche, et E = hf donne les raies nettes de l'hydrogène. Le nombre d'électrons de la couche la plus externe est la valence, et la règle de l'octet — la tendance vers une configuration de gaz noble — prédit alors Na+ et Cl-."
"schalenmodell.registers.lv3" = "Bohr quantifie le moment cinétique par postulat et reproduit exactement la formule de Rydberg pour les systèmes à un électron, E = -13,6 eV / n². Ce succès se limite à H, He+ et Li2+ ; l'hélium échoue d'emblée, car un postulat sur des orbites uniques n'a nulle part où placer la répulsion électron-électron. Les orbites elliptiques de Sommerfeld ont réparé la structure fine sans guérir la maladie elle-même. Le modèle survit à l'école parce que le comptage de la couche de valence est réellement utile, mais l'image planétaire qu'il implante persiste, documentée, jusqu'à l'université, et les registres de ce moteur ne devraient jamais dessiner un atome comme un système solaire."
"kugelwolkenmodell.registers.lv1" = "Les électrons se déplacent par paires, et chaque paire se tient dans son propre petit nuage rond. Les nuages se repoussent mutuellement, donc ils s'écartent autant que possible. Quatre nuages autour d'un atome de carbone finissent par pointer vers les quatre coins d'une forme pyramidale — et c'est bien la forme du méthane. L'eau a deux nuages qui font la liaison et deux qui restent là à occuper de la place, c'est pourquoi l'eau est coudée plutôt que droite."
"kugelwolkenmodell.registers.lv2" = "Les nuages de charge de Kimball (Kugelwolken) : chaque paire d'électrons occupe un nuage sphérique, les nuages se repoussent, et ils adoptent la disposition de séparation maximale — deux linéaire, trois trigonale plane, quatre tétraédrique. Les doublets non liants ont besoin de plus de place que les doublets liants, c'est pourquoi l'angle H-O-H est de 104,5 degrés plutôt que 109,5. Une double liaison, ce sont deux nuages partagés entre la même paire d'atomes."
"kugelwolkenmodell.registers.lv3" = "Le Kugelwolkenmodell de l'école allemande descend de l'image des nuages de charge de G. E. Kimball et est, en termes modernes, un modèle localisé de paires d'électrons sp3 débarrassé des mathématiques ; c'est un proche cousin du VSEPR (le modèle de répulsion des paires d'électrons) et du double quartet de Linnett. Sa valeur est réelle — une géométrie correcte des groupes principaux à partir d'une règle qu'un élève de quatorze ans peut appliquer —, et son coût est qu'il présente les paires localisées comme des objets physiques, ce qui fait paraître anormales, plutôt qu'attendues, la délocalisation, les spectres photoélectroniques et la liaison métallique."
"orbitalmodell.registers.lv1" = "Personne ne peut dire exactement où se trouve un électron — seulement où il a des chances de se trouver. Alors, au lieu d'un anneau, imagine un nuage flou autour du noyau, plus épais là où l'électron passe le plus de temps. Différents nuages ont des formes différentes : certains sont des boules, d'autres ressemblent à deux ballons attachés ensemble. Ces formes sont la raison pour laquelle les atomes se lient en pointant dans des directions précises plutôt que n'importe comment."
"orbitalmodell.registers.lv2" = "Les électrons occupent des orbitales — solutions de l'équation de Schrödinger désignées par n, l et m — et le carré de la fonction d'onde donne la densité de probabilité. Les orbitales se remplissent selon le principe de construction (Aufbau), le principe d'exclusion de Pauli et la règle de Hund, ce qui reproduit le tableau périodique bloc par bloc. Quand des atomes se combinent, les orbitales atomiques se superposent en orbitales moléculaires liantes et antiliantes ; l'ordre de liaison est la moitié de leur différence, et les deux électrons antiliants non appariés de O2 expliquent pourquoi l'oxygène liquide est paramagnétique."
"orbitalmodell.registers.lv3" = "Le modèle orbitalaire est l'approximation à un électron (Hartree-Fock) du problème à plusieurs corps : les orbitales sont des fonctions de base d'une approximation, pas des contenants physiques. Ce qui le distingue en nature de tout modèle antérieur ici, c'est qu'il vient avec une théorie de sa propre erreur et peut être amélioré systématiquement — post-Hartree-Fock, théorie de la fonctionnelle de la densité, méthodes multiréférence. Le danger pédagogique est l'image miroir de celui de Bohr : les apprenants qui abandonnent avec succès les orbites réifient souvent les orbitales à la place et les traitent comme des lieux. C'est aussi là que s'arrêtent les modèles de la chimie scolaire et que commence la chimie computationnelle, ce pourquoi Kerotakis trace ici sa limite."
"periodensystem.registers.lv1" = "Aligne les éléments dans le bon ordre, et les mêmes types de comportement reviennent sans cesse, comme les jours de la semaine. Tout ce qui se trouve dans la première colonne est un métal mou qui pétille dans l'eau ; tout ce qui se trouve dans la dernière colonne ne fait absolument rien. Une fois que tu sais dans quelle colonne se trouve une chose, tu peux en dire beaucoup avant même d'ouvrir le bocal."
"periodensystem.registers.lv2" = "Les éléments ordonnés par numéro atomique se répartissent en 18 groupes et 7 périodes. Le numéro de groupe donne le nombre d'électrons de valence et donc la charge ionique habituelle — le groupe 1 donne +1, le groupe 17 donne -1 — et le numéro de période donne la couche en cours de remplissage. Le rayon atomique diminue de gauche à droite et croît en descendant dans un groupe ; l'énergie d'ionisation et l'électronégativité font l'inverse. Mendeleïev (1869) a laissé des cases vides et prédit la densité et le point de fusion de l'éka-silicium manquant ; le germanium est apparu en 1886 et correspondait."
"periodensystem.registers.lv3" = "La périodicité est une conséquence, pas un axiome : elle découle du remplissage par aufbau des couches et sous-couches, et les longueurs de période 2, 8, 8, 18, 18, 32 sont les dégénérescences en 2n², découpées selon l'ordre de remplissage. Le classement de Mendeleïev par masse était empiriquement juste et théoriquement faux ; les travaux aux rayons X de Moseley en 1913 ont établi que le véritable ordinal est la charge nucléaire, ce qui a corrigé l'inversion tellure-iode et fixé le nombre d'éléments encore manquants. Prends le tableau comme l'archétype de la thèse de ce codex : un modèle dont toute la valeur réside dans l'ordre plutôt que dans un quelconque fait qu'il contiendrait."
"ionenbindung.registers.lv1" = "Un atome de métal a un ou deux électrons qu'il retient à peine. Un atome de non-métal en veut désespérément un de plus. Alors le métal les cède simplement. Maintenant l'un est positif et l'autre négatif, et les charges opposées s'attirent — mais pas seulement par paires : des millions d'entre eux s'empilent en un réseau rigide, plus, moins, plus, moins, dans toutes les directions. Ce réseau est un cristal de sel. Frappe-le, et il ne se bosselle pas, il se fend, car décaler le réseau d'un cran met un plus à côté d'un plus, et tout vole en éclats."
"ionenbindung.registers.lv2" = "Un métal transfère des électrons de valence à un non-métal ; les deux atteignent une configuration de gaz noble et deviennent des ions. L'attraction électrostatique dans toutes les directions construit un réseau ionique (Ionengitter), pas des molécules — NaCl est une unité formulaire, pas une particule. Le réseau explique les propriétés : des forces fortes et non directionnelles donnent des points de fusion élevés, un déplacement le long d'un plan du réseau rapproche des charges identiques et le cristal se clive, et la charge ne peut circuler qu'une fois les ions libres de se déplacer."
"ionenbindung.registers.lv3" = "La liaison ionique est le cas limite d'une liaison à séparation de charge maximale ; son énergie est dominée par la somme de Madelung avec un terme de répulsion de Born, et les cycles de Born-Haber montrent que les énergies de réseau calculées sur un modèle purement ionique concordent bien pour les halogénures alcalins et de plus en plus mal à mesure que la polarisabilité augmente — les règles de Fajans résument cette dérive. En solution, l'image doit être encore assouplie : PHREEQC renvoie des paires d'ions et des complexes neutres, si bien que l'idéal d'une dissociation complète n'est qu'une approximation pour solution diluée, et ce sont exactement ces corrections d'activité que le codex fait apparaître au niveau lv3."
"elektronenpaarbindung.registers.lv1" = "Deux atomes qui veulent tous deux davantage d'électrons ne peuvent pas tous deux en prendre, alors ils partagent à la place. Chacun apporte un électron, et la paire se tient entre eux, les maintenant ensemble comme deux enfants agrippant la même corde. Partage deux paires ou trois, et la prise est plus forte et plus courte. Les substances construites ainsi se présentent comme de petites molécules séparées, avec presque rien pour relier une molécule à la suivante, ce qui explique qu'elles fondent si facilement et ne conduisent jamais l'électricité."
"elektronenpaarbindung.registers.lv2" = "Les atomes non métalliques atteignent une configuration de gaz noble en partageant des paires d'électrons. Les paires partagées sont des paires liantes, les paires non partagées sont des doublets non liants, et la notation de Lewis rend le décompte explicite : huit électrons de valence par atome, deux pour l'hydrogène. L'ordre de liaison augmente et la longueur de liaison diminue de C-C à C=C jusqu'à la triple liaison C-C. La forte attraction se situe à l'intérieur de la molécule, c'est pourquoi la fusion et l'ébullition — qui ne font que séparer les molécules les unes des autres — se produisent à basse température."
"elektronenpaarbindung.registers.lv3" = "Lewis (1916) précède la mécanique quantique et reste le modèle le plus utilisé en chimie, parce que la comptabilité des paires d'électrons est une approximation extraordinairement bonne pour les composés des groupes principaux. Son statut réel est celui d'une approximation de liaison localisée à la description en orbitales moléculaires, valable partout où cette description se trouve être localisable ; là où elle ne l'est pas — l'état fondamental triplet de O2, le benzène, l'hypervalence, les radicaux, les métaux — les échecs sont systématiques, non accidentels. Remarque aussi que la description par orbitales d de SF6 enseignée dans les manuels scolaires est aujourd'hui délaissée dans la littérature computationnelle moderne au profit d'une résonance ionique-covalente avec peu de participation d."
"metallbindung.registers.lv1" = "Dans un métal, les atomes lâchent leurs électrons les plus externes, qui errent alors librement dans tout le morceau — une sorte de colle électrique présente partout à la fois. Comme cette colle ne se situe pas entre des partenaires fixes, tu peux marteler le métal à plat, et il reste solidaire au lieu de se briser. Et comme les électrons libres peuvent se déplacer, ils transportent l'électricité et la chaleur d'un bout à l'autre."
"metallbindung.registers.lv2" = "Les atomes métalliques libèrent leurs électrons de valence dans un gaz d'électrons délocalisé (Elektronengas) ; les cations résultants (Atomrümpfe) se logent dans un réseau compact, maintenus ensemble par leur attraction envers ce gaz. Les électrons mobiles transportent le courant et la chaleur. La liaison est non directionnelle, si bien que des couches de cations peuvent glisser les unes sur les autres sans jamais rapprocher des charges identiques — les métaux se déforment là où les solides ioniques se clivent."
"metallbindung.registers.lv3" = "C'est le gaz d'électrons libres de Drude (1900), corrigé par Sommerfeld avec la statistique de Fermi-Dirac — sans laquelle le modèle prédit une capacité thermique électronique environ cent fois trop grande. Même corrigé, il ne peut produire de bande interdite : la distinction métal / semi-conducteur / isolant exige le potentiel périodique du réseau, le théorème de Bloch et la structure de bandes. La chimie scolaire s'arrête à la mer d'électrons parce que la théorie des bandes relève de la physique du solide, et nommer cette limite empêche que la mer d'électrons ne soit prise pour le dernier mot."
"elektronegativitaet-kontinuum.registers.lv1" = "Dans une paire d'électrons partagée, presque toujours un atome tire plus fort que l'autre. Tirent-ils à peu près également, et le partage est équitable. Tire-t-il un peu plus fort, et cette extrémité devient légèrement négative tandis que l'autre devient légèrement positive, ce qui explique pourquoi l'eau adhère si bien à elle-même. Tire-t-il assez fort, et il n'y a plus de partage du tout — il prend, et tu as fabriqué un sel. Partager et prendre ne sont donc pas deux choses différentes. Ce sont les deux bouts d'une même échelle, et tout ce qui est réel se situe quelque part entre les deux."
"elektronegativitaet-kontinuum.registers.lv2" = "L'électronégativité (chi) mesure la force avec laquelle un atome attire une paire liante. Elle croît vers le coin supérieur droit du tableau périodique : F 4,0, O 3,5, Cl 3,0, H 2,1, Na 0,9 sur l'échelle de Pauling. Une différence proche de zéro donne une liaison covalente non polaire ; une différence modérée donne une liaison covalente polaire avec des charges partielles ; une grande différence donne une liaison ionique. Trace la différence en fonction de la moyenne, et tu obtiens le triangle de liaison (Bindungsdreieck), avec la liaison métallique dans le coin de faible électronégativité : un seul diagramme qui contient les trois modèles de liaison à la fois."
"elektronegativitaet-kontinuum.registers.lv3" = "Pauling a défini chi thermochimiquement en 1932 à partir de l'énergie excédentaire des liaisons hétéronucléaires ; Mulliken, à partir de la moyenne de l'énergie d'ionisation et de l'affinité électronique ; Allen, à partir des énergies de configuration de l'atome libre. Le triangle de van Arkel-Ketelaar trace la différence en fonction de la moyenne et a été rendu quantitatif par Sproul, Jensen et Allen dans les années 1990. Traite chaque frontière tracée dessus comme une convention. La valeur de cette image est qu'un apprenant qui a rencontré la liaison ionique, covalente et métallique comme trois histoires séparées peut désormais voir une seule famille à deux paramètres, dans laquelle chaque liaison réelle possède les trois caractères dans une certaine proportion."
"zwischenmolekulare-kraefte.registers.lv1" = "À l'intérieur d'une molécule, les atomes se tiennent très fermement. Mais les molécules adhèrent aussi les unes aux autres, bien plus faiblement, comme des aimants qui ne s'intéressent que modérément l'un à l'autre. Faire bouillir de l'eau ne déchire pas les molécules d'eau — cela ne fait que les écarter les unes des autres, et chaque molécule s'en va intacte. Les molécules qui adhèrent plus fortement entre elles ont besoin de plus de chaleur avant de lâcher prise. Et les choses se dissolvent dans ce à quoi elles adhèrent : le sucre dans l'eau, la graisse dans l'essence, jamais la graisse dans l'eau."
"zwischenmolekulare-kraefte.registers.lv2" = "Entre les molécules agissent, par force croissante pour des molécules de taille comparable : les forces de dispersion de London (toujours présentes, croissant avec la taille et la surface), les forces dipôle-dipôle (dans les molécules polaires), et les liaisons hydrogène (hydrogène lié à N, O ou F, rencontrant un doublet non liant). L'ébullition surmonte celles-ci et non les liaisons covalentes, ce qui explique que l'eau bout à 100 degrés et H2S à moins 60, et pourquoi les liaisons hydrogène qui maintiennent un réseau hexagonal ouvert rendent la glace moins dense que l'eau. Qui se ressemble s'assemble (Gleiches löst sich in Gleichem) est la même idée appliquée au mélange."
"zwischenmolekulare-kraefte.registers.lv3" = "Collectivement, les forces de van der Waals : la dispersion de London est un effet de corrélation de multipôles instantanés variant en r à la puissance moins six et croissant avec la polarisabilité ; les termes de Keesom et de Debye couvrent les interactions dipôle-dipôle et dipôle-dipôle induit ; la liaison hydrogène est en partie électrostatique et en partie un transfert de charge, et n'est pas simplement une forte interaction dipolaire. Deux mises en garde qui valent la peine d'être enseignées : la dispersion n'est pas la force faible — c'est elle qui fait de l'iode un solide et de HCl un gaz — et l'effet hydrophobe est un phénomène entropique dans l'eau plutôt qu'une attraction entre les solutés. Quantitativement, c'est le domaine des modèles d'activité et des équations d'état comme UNIFAC et PC-SAFT."
"massenerhaltung.registers.lv1" = "Ce avec quoi tu commences, tu l'as toujours, même quand cela semble avoir disparu. Brûle une bougie dans un bocal scellé et pèse le bocal : exactement le même poids qu'avant. Fais-le à l'air libre, et il semble s'alléger, mais seulement parce que la nouvelle matière s'est envolée sous forme de gaz invisible. Rien ne disparaît jamais vraiment en chimie — cela ne fait que se déplacer, ou changer d'habit."
"massenerhaltung.registers.lv2" = "Dans un système fermé, la masse totale avant une réaction égale la masse totale après (Lavoisier, 1789), car les atomes sont réarrangés et jamais créés ni détruits. C'est exactement ce qu'affirme une équation équilibrée : le même nombre de chaque élément des deux côtés. Les violations apparentes sont des systèmes ouverts — le magnésium qui brûle gagne la masse de l'oxygène prélevé dans l'air, et le calcaire dans l'acide perd la masse du dioxyde de carbone qui s'échappe."
"massenerhaltung.registers.lv3" = "La loi de Lavoisier était une affirmation expérimentale rendue possible par le récipient scellé et la balance analytique, et ce qu'elle a évincé n'était pas un fait mais une comptabilité : le phlogistique. Rigoureusement, la grandeur conservée est la masse-énergie, et le défaut de masse d'une réaction chimique est d'environ une part sur dix milliards, ce qui explique que la chimie ait pu être bâtie comme si la masse était conservée séparément. Dans ce moteur, le bilan de masse est un test de propriété plutôt qu'une doctrine, et le fait que la balance affiche moins après un pétillement est une observation calculée, non la promesse d'un auteur de manuel."
"donator-akzeptor.registers.lv1" = "Un nombre immense de réactions consistent en une chose qui en cède une autre à une seconde. Parfois, ce qui est cédé est un proton, un minuscule fragment positif d'atome : c'est un acide qui donne à une base. Parfois, c'est un électron : c'est ce que sont la rouille, la combustion et les piles. Dans les deux cas, il y a toujours un donneur et un preneur, et on ne peut jamais avoir l'un sans l'autre — personne ne cède rien à personne."
"donator-akzeptor.registers.lv2" = "Deux familles de réactions, un seul motif. Acide-base : un donneur de protons et un accepteur de protons, formant des paires conjuguées HA/A- et B/BH+. Redox : un donneur d'électrons (le réducteur) et un accepteur d'électrons (l'oxydant), à nouveau en paires conjuguées Red/Ox. Les deux s'écrivent comme deux demi-réactions qui doivent s'additionner sans rien laisser de côté, et dans les deux cas le sens se lit sur une table de forces — le pKa pour les protons, le potentiel standard pour les électrons."
"donator-akzeptor.registers.lv3" = "Le concept donneur-accepteur (Donator-Akzeptor-Konzept) est l'unification explicite du programme allemand, et c'est un éclairage structurel plutôt qu'un simple moyen mnémotechnique : les deux familles sont des équilibres de transfert décrits par une variable d'intensité — le pH pour les protons, le pe ou Eh pour les électrons — et une variable de capacité, l'intensité tampon ou le pouvoir tampon redox. Ses limites sont tout aussi structurelles. L'activité électronique est formelle, et les systèmes naturels sont fréquemment en déséquilibre redox, si bien que différents couples dans un même échantillon d'eau impliquent des potentiels différents, un écart documenté dans la littérature sur les eaux souterraines. Lewis généralise le motif un cran plus loin, aux paires d'électrons, moment où la formation de complexes rejoint la même famille."
"stossmodell.registers.lv1" = "Rien ne peut réagir à moins que les morceaux ne se heurtent réellement — et un choc doux ne suffit pas. Il faut un choc dur, et orienté dans le bon sens. Donc tout ce qui rend les chocs plus fréquents ou plus durs accélère la réaction : plus de monde, plus chaud, ou réduit en poudre pour offrir plus de surface aux chocs. C'est pourquoi un bloc de farine reste simplement là, tandis qu'un nuage de poussière de farine peut faire exploser un moulin."
"stossmodell.registers.lv2" = "Les particules ne réagissent que lorsqu'elles entrent en collision, et seulement si la collision apporte au moins l'énergie d'activation et rapproche les bonnes parties. La vitesse augmente donc avec la concentration et la pression (plus de collisions par seconde), avec la température (une fraction bien plus grande des collisions franchit l'énergie d'activation, à cause de la queue de la distribution de Maxwell-Boltzmann) et avec la surface. Un catalyseur ouvre une voie avec une énergie d'activation plus basse, si bien que davantage des mêmes collisions réussissent."
"stossmodell.registers.lv3" = "La théorie simple des collisions donne une constante de vitesse de la forme Z fois un facteur stérique fois exp(-Ea/RT), où Z est la fréquence de collision des sphères dures et l'exponentielle est la fraction de Maxwell-Boltzmann au-dessus de la barrière. Elle n'est au mieux que semi-quantitative : pour tout ce qui dépasse les réactions atome-atome, le facteur stérique peut valoir un cent-millième et n'est pas prédit par la théorie — c'est précisément la lacune que la théorie de l'état de transition comble en le remplaçant par une entropie d'activation. Il vaut la peine de le dire explicitement : la règle « la vitesse double tous les dix degrés » correspond à une énergie d'activation proche de 50 kJ/mol à température ambiante, et c'est une règle empirique, pas une loi."
"energieprofil.registers.lv1" = "Dessine la réaction comme une colline. Tu pars d'un côté et arrives de l'autre. La hauteur de la colline te dit à quel point il est difficile de démarrer, ce qui explique pourquoi un feu a besoin d'une allumette même si brûler dégage de la chaleur. Là où tu arrives te dit si de la chaleur en sort — tu as fini plus bas — ou doit être fournie. Un catalyseur creuse un tunnel à travers la colline : même départ, même arrivée, un trajet bien plus facile."
"energieprofil.registers.lv2" = "Trace l'énergie en fonction de la coordonnée de réaction : les réactifs à un niveau, les produits à un autre, et un maximum entre les deux, le complexe activé ou état de transition (Übergangszustand). La montée des réactifs jusqu'à ce maximum est l'énergie d'activation ; la différence entre réactifs et produits est la variation d'enthalpie, négative quand de la chaleur est libérée. La réaction inverse doit gravir l'énergie d'activation plus cette différence. Un catalyseur abaisse la barrière également dans les deux sens, il accélère donc l'approche de l'équilibre sans déplacer sa position."
"energieprofil.registers.lv3" = "Le diagramme est une coupe à travers une surface d'énergie potentielle le long du chemin d'énergie minimale, et le maximum est un point-selle de premier ordre avec exactement une fréquence de vibration imaginaire — ce qu'une vérification computationnelle teste réellement, avec une vérification de la coordonnée de réaction intrinsèque. La théorie de l'état de transition exprime la constante de vitesse en fonction de l'énergie libre d'activation, ce qui explique pourquoi l'entropie d'activation appartient à cette image même si celle-ci n'a pas d'axe pour elle, et pourquoi les diagrammes scolaires étiquetés « énergie » devraient être lus comme de l'énergie libre dès qu'on les utilise pour argumenter sur la vitesse."
"chemisches-gleichgewicht.registers.lv1" = "Certaines réactions ne se terminent jamais. Elles avancent et reculent en même temps, et après un moment les deux directions vont exactement à la même vitesse — si bien que les quantités cessent de changer alors que rien ne s'est arrêté. Cela ressemble à une fin, mais c'est plutôt comme un escalator animé, avec autant de gens qui montent que qui descendent. Jusqu'où va une réaction avant que cela n'arrive diffère pour chaque réaction."
"chemisches-gleichgewicht.registers.lv2" = "Une réaction réversible atteint un équilibre dynamique : les vitesses directe et inverse deviennent égales, si bien que les concentrations deviennent constantes — constantes, non égales. La loi d'action de masse donne une constante d'équilibre K comme le rapport des concentrations en produits sur celles en réactifs, chacune élevée à son coefficient, fixé à une température donnée. K bien plus grand que un signifie que les produits dominent ; bien plus petit que un signifie que les réactifs dominent. Des cas particuliers portent leurs propres noms : Ka pour les acides faibles, Kw pour l'eau, Ksp pour les sels peu solubles."
"chemisches-gleichgewicht.registers.lv3" = "Thermodynamiquement, K n'est pas un résumé empirique mais une conséquence — la variation d'énergie libre standard exprimée dans une autre monnaie — et sa dépendance à la température suit l'équation de van 't Hoff. Correctement écrit, K est un rapport d'activités, et chez Kerotakis cela cesse d'être une note de bas de page : le moteur calcule les activités aux côtés des molalités, si bien que le pKa2 conditionnel du phosphate affiche environ 6,65 à une force ionique proche de 0,25, là où la table du manuel dit 7,2. La constante du manuel et le pH-mètre sont réellement en désaccord, et le modèle dit lequel est lequel. L'équilibre est aussi un concept-seuil canonique — transformateur, intégrateur, irréversible et démontrablement difficile —, les deux idées fausses persistantes étant que les vitesses s'arrêteraient et que les concentrations deviendraient égales."
"le-chatelier.registers.lv1" = "Perturbe une réaction qui s'est installée, et elle se réarrange pour défaire une partie de ce que tu as fait. Retire quelque chose, et elle en refabrique. Comprime un mélange gazeux, et il se déplace vers le côté qui occupe le moins de place. Chauffe-le, et il se déplace dans le sens qui absorbe la chaleur. Il ne défait jamais complètement ton changement — il ne fait que repousser un peu."
"le-chatelier.registers.lv2" = "Principe de moindre contrainte (Prinzip vom kleinsten Zwang) : un système à l'équilibre soumis à une contrainte réagit de façon à réduire cette contrainte. Plus de réactif déplace la position vers les produits ; une pression plus élevée la déplace vers le côté comptant le moins de molécules gazeuses ; une température plus élevée favorise le sens endothermique. Un catalyseur ne change ni la position ni K. Le procédé Haber-Bosch est le compromis classique — une haute pression aide le rendement, une basse température l'aiderait aussi mais détruit la vitesse, si bien que l'installation fonctionne chaude avec un catalyseur, à l'encontre du conseil du principe."
"le-chatelier.registers.lv3" = "L'énoncé rigoureux est thermodynamique : à température et pression constantes, un système se déplace de façon à abaisser son énergie de Gibbs, et le sens après toute perturbation découle de la comparaison entre le quotient de réaction et la constante d'équilibre. La forme qualitative a de véritables contre-exemples — ajouter un réactif déjà en excès peut abaisser la fraction molaire du produit à pression constante, et ajouter un gaz inerte à volume constant ne fait rien du tout — ce pourquoi il vaut mieux la traiter comme une heuristique avec un domaine de validité déclaré. L'enseigner avec son contre-exemple est précisément le but : c'est le plus petit cas clair d'une règle qui fonctionne jusqu'au moment où l'on peut dire quand elle ne fonctionne plus."
"stoffmenge.registers.lv1" = "Les atomes sont bien trop petits pour être comptés un par un, alors les chimistes les comptent en les pesant — comme tu achètes le riz au kilo plutôt que grain par grain, ou les œufs à la douzaine plutôt qu'un par un. Une mole est simplement une très grande douzaine : elle indique combien de morceaux tu obtiens dans un certain poids d'une substance, et c'est le même nombre de morceaux pour chaque substance. C'est tout le truc. Pèse des grammes, connais le nombre de morceaux."
"stoffmenge.registers.lv2" = "La mole est l'unité SI de quantité de matière : une mole contient 6,02214076 fois dix puissance vingt-trois entités spécifiées. La masse molaire, en grammes par mole, est numériquement égale à la masse atomique ou moléculaire relative, si bien que diviser une masse par une masse molaire convertit quelque chose de pesable en quelque chose de comptable. Les coefficients d'une équation sont des rapports de moles, ce qui explique que 24 g de magnésium nécessitent 16 g d'oxygène, et non une masse égale."
"stoffmenge.registers.lv3" = "Depuis la révision du SI de 2019, la mole est définie en fixant exactement la constante d'Avogadro, ce qui l'a découplée du kilogramme et du carbone 12 ; la masse molaire du carbone 12 n'est désormais égale à 12 g/mol qu'à une petite incertitude mesurée près. Sur le plan pédagogique, c'est le concept-seuil par excellence des manuels : transformateur, puisque rien de quantitatif n'est possible avant lui et tout l'est après ; intégrateur, puisqu'il relie formule, équation, masse et volume ; irréversible ; et difficile, en ce que les apprenants exécutent de façon fiable le calcul tout en n'ayant aucune idée cohérente de ce qu'est une mole, la traitant tantôt comme une masse, tantôt comme un volume, tantôt comme un nombre de grammes. La contre-mesure qu'utilise ce codex est de rendre le calcul porteur de conséquences : le nombre que tu déduis est le nombre que le becher affichera."
"stoechiometrie.registers.lv1" = "Une recette dit que deux œufs et 100 g de farine font huit crêpes. La chimie fonctionne de la même façon : l'équation est la recette, donc une fois que tu l'as, tu peux calculer exactement de combien tu as besoin et exactement combien tu obtiendras. Et si tu n'as qu'un seul œuf, peu importe la quantité de farine dans le placard — tu obtiens quatre crêpes. Ce qui s'épuise en premier décide de tout."
"stoechiometrie.registers.lv2" = "Les coefficients d'une équation équilibrée sont des rapports de moles, si bien que la quantité de n'importe quelle substance découle de la quantité de n'importe quelle autre. Le réactif limitant est celui dont la quantité, divisée par son coefficient, est la plus petite ; tout le reste est en excès. Le rendement en pourcentage est le rendement réel divisé par le rendement théorique ; l'économie d'atomes est la masse du produit désiré rapportée à la masse totale des produits. Ce sont deux questions différentes sur la même réaction, et une réaction peut bien réussir à l'une et mal à l'autre."
"stoechiometrie.registers.lv3" = "La stœchiométrie est de l'algèbre linéaire sur la matrice de composition élémentaire : équilibrer une équation, c'est trouver un vecteur du noyau, et le nombre de réactions indépendantes dans un mélange est le défaut de rang de cette matrice. Le risque pédagogique ici est documenté et non hypothétique — des algorithmes de raisonnement proportionnel peuvent être exécutés correctement par des apprenants incapables de dire ce qu'est un réactif limitant, si bien que la réussite du calcul est une preuve faible de compréhension. Predict-Observe-Explain est la contre-mesure de ce codex : s'engager d'abord sur le nombre, puis laisser le solveur trancher."
"konzentration.registers.lv1" = "Il ne suffit pas de savoir ce qu'il y a dans l'eau — il faut savoir à quel point c'est dense. Une cuillère de sucre dans une tasse est sucrée ; la même cuillère dans une baignoire n'est rien du tout. La concentration est exactement cette densité, et elle décide si quelque chose a un goût fort, si ça fonctionne, et si c'est dangereux."
"konzentration.registers.lv2" = "La concentration en quantité de matière est la quantité de substance divisée par le volume de solution, en mol/L. Ajouter du solvant ne change pas la quantité de soluté, ce qui donne la relation de dilution : le produit de la concentration et du volume est le même avant et après. La titration l'utilise directement — au point d'équivalence, les quantités d'acide et de base sont égales, si bien que la concentration inconnue découle de la concentration de l'étalon et des deux volumes."
"konzentration.registers.lv3" = "Distingue trois grandeurs que la chimie scolaire confond : la concentration (par litre de solution, dépendante de la température), la molalité (par kilogramme de solvant, indépendante de la température, le choix thermodynamique) et l'activité, qui est ce que contiennent réellement les constantes d'équilibre et les potentiels d'électrode. Le coefficient d'activité provient d'un modèle avec un domaine de validité déclaré, et Kerotakis rend visibles à la fois le nombre et le modèle — pose la même question sur une saumure à trois bases de données, et elles ne s'accordent pas sur la quantité de sel qui reste non dissoute, chaque réponse étant étiquetée avec le modèle d'activité qui la sous-tend. Ce désaccord n'est pas un défaut à cacher ; c'est une limite de modèle rendue visible en poussant le modèle au-delà."
"arrhenius.registers.lv1" = "Certains liquides ont un goût acide et pétillent sur les métaux ; d'autres donnent une sensation glissante et savonneuse. Les acides introduisent dans l'eau un fragment positif particulier, et les savonneux introduisent un fragment qui l'annule exactement. Mélange les bonnes quantités, et les deux disparaissent, laissant de l'eau salée. C'est ce que signifie neutre — et dans un laboratoire, tu ne goûtes jamais rien pour le découvrir."
"arrhenius.registers.lv2" = "Arrhenius (1887) : un acide se dissocie dans l'eau pour donner H+, une base pour donner OH-. L'acide chlorhydrique donne H+ et Cl- ; l'hydroxyde de sodium donne Na+ et OH-. Chaque neutralisation est alors la même réaction, H+ plus OH- donnant de l'eau, les ions restants formant un sel. La force d'un acide est l'étendue de cette dissociation, ce qui explique pourquoi l'acide chlorhydrique conduit bien mieux que l'acide acétique à concentration égale."
"arrhenius.registers.lv3" = "La théorie de la dissociation électrolytique d'Arrhenius était assez radicale en 1887 pour lui coûter presque son doctorat, et lui a valu le prix Nobel en 1903 ; sa force était quantitative, puisque les données de conductivité et les anomalies colligatives découlaient toutes deux de la même idée. Sa limite est structurelle plutôt qu'accidentelle : en définissant l'acidité comme une propriété d'une substance dissoute dans l'eau, elle n'a aucun moyen de décrire un transfert de proton, ce qui explique que la basicité de l'ammoniac n'y trouve aucune explication et que ce qui suit est un changement de sujet plutôt qu'une extension."
"broensted-lowry.registers.lv1" = "Oublie l'acide et le savonneux. Un acide est tout ce qui cède un proton — une minuscule particule positive — et une base est tout ce qui en prend un. Être un acide n'est donc pas ce qu'une substance est, c'est ce qu'elle fait, et avec un partenaire différent, la même substance peut faire l'inverse. L'eau fait les deux : elle donne des protons à l'ammoniac et en prend au vinaigre."
"broensted-lowry.registers.lv2" = "Brønsted et Lowry (1923) : un acide est un donneur de protons, une base un accepteur de protons, et chaque réaction acide-base est un transfert de proton entre deux paires conjuguées. L'ammoniac plus l'eau donne l'ammonium plus l'hydroxyde, sans qu'il faille d'hydroxyde dans l'ammoniac. L'eau est amphotère. Ka, et son logarithme négatif pKa, mesure jusqu'où va le transfert vers l'eau, si bien que le sens de tout transfert de proton peut se lire directement sur une table de pKa : de l'acide le plus fort vers la base la plus forte."
"broensted-lowry.registers.lv3" = "C'est le transfert de proton (Protonenübergang) du programme allemand et, avec le redox, l'exemple type du motif donneur-accepteur. Son avancée structurelle est que l'acidité devient une propriété d'un couple plutôt que d'un composé, ce qui permet d'exprimer dans un seul langage les paires conjuguées, les tampons et l'effet de nivellement. Deux raffinements appartiennent à ce niveau : le proton dans l'eau n'est pas libre, et la formulation par l'hydronium est elle-même une simplification des structures d'Eigen et de Zundel ; et les valeurs tabulées de Ka sont des constantes thermodynamiques à dilution infinie qui doivent être converties en constantes conditionnelles à la force ionique réelle avant de correspondre à un instrument."
"lewis-saeure-base.registers.lv1" = "La version la plus profonde d'acide n'a rien à voir avec les protons. Certains atomes ont une paire d'électrons de trop à offrir, et d'autres ont un espace vide qui en accueillerait une. Rapproche-les, et la paire s'y installe, formant une liaison à partir des seuls électrons d'un partenaire. Un proton est simplement la plus petite chose qui existe avec un espace vide — les règles plus anciennes étaient donc depuis toujours un cas particulier de celle-ci."
"lewis-saeure-base.registers.lv2" = "Lewis (1923) : un acide accepte une paire d'électrons, une base en cède une, et le résultat est une liaison de coordination ou dative. Le trifluorure de bore plus l'ammoniac est une réaction acide-base sans aucun proton. H+ correspond à la définition comme cas limite. Elle explique aussi pourquoi les solutions d'Al3+ et de Fe3+ sont acides — l'ion métallique est un acide de Lewis qui polarise ses ligands aquo jusqu'à ce que l'un d'eux libère un proton — et pourquoi la formation de complexes, la catalyse et l'attaque nucléophile sont toutes le même type d'événement."
"lewis-saeure-base.registers.lv3" = "Lewis subsume Brønsted, qui subsume Arrhenius ; la définition plus large d'Usanovich subsume à son tour Lewis et n'est pas utilisée, car elle dissout entièrement la distinction. La faiblesse pratique est l'absence d'une échelle universelle : l'acidité de Lewis dépend de la base, ce que traitent empiriquement le principe dur-mou de Pearson (HSAB) et les paramètres de Drago-Wayland plutôt qu'un nombre unique. C'est aussi le cas le plus clair du programme d'une succession de modèles qui est une généralisation plutôt qu'une correction — Arrhenius n'est pas faux à l'intérieur de l'eau, c'est un cas particulier — et cette différence mérite d'être nommée à voix haute, car sinon les apprenants en déduisent que chaque modèle antérieur était simplement erroné."
"enthalpie.registers.lv1" = "Les réactions ne changent pas seulement ce que sont les choses, elles changent aussi à quel point les choses sont chaudes. Certaines dégagent de la chaleur, si bien que le becher se réchauffe : la combustion, et les poches qu'on active pour se réchauffer les mains. D'autres absorbent de la chaleur, si bien que le becher devient assez froid pour figer une flaque sur la paillasse — c'est ce qu'est une poche de froid. Séparer les choses coûte toujours de l'énergie, et les réunir en rend toujours — et celui des deux effets qui est le plus grand décide si ça réchauffe ou refroidit."
"enthalpie.registers.lv2" = "La variation d'enthalpie est la chaleur échangée à pression constante : négative quand de la chaleur est libérée, positive quand elle est absorbée. C'est une fonction d'état, si bien que la loi de Hess permet de l'additionner le long de n'importe quel chemin, et les enthalpies standard de formation permettent de trouver la valeur de n'importe quelle réaction comme produits moins réactifs. Estimée à partir des liaisons, c'est l'énergie des liaisons rompues moins l'énergie des liaisons formées."
"enthalpie.registers.lv3" = "L'enthalpie est l'énergie interne plus la pression fois le volume, et sa variation égale la chaleur à pression constante pour un système fermé ne réalisant que du travail d'expansion. La loi de Hess est une conséquence du fait qu'elle est une fonction d'état, et tout l'appareil tabulé de la thermochimie repose sur cette seule propriété. Sa dépendance à la température découle de la différence des capacités thermiques, ce qu'encode exactement la forme polynomiale NASA-9 : sept coefficients par intervalle de température fournissant la capacité thermique, l'enthalpie et l'entropie d'une espèce. Le point pédagogique décisif ici est négatif — l'enthalpie n'est pas le critère de spontanéité, et la traiter comme tel est une idée fausse persistante et documentée, que les deux modèles suivants existent pour corriger."
"entropie.registers.lv1" = "Il y a bien plus de façons pour les choses de finir mélangées que rangées, donc le mélange se produit tout seul et le démélange, jamais. Verse du lait dans du café, et il n'en ressortira pas, quelle que soit la durée pendant laquelle tu continues à remuer. La chaleur se répand pour la même raison : il y a plus de façons de partager l'agitation que de la garder tout entière dans un coin. C'est pourquoi les choses se produisent d'elles-mêmes, même quand aucune énergie n'est libérée."
"entropie.registers.lv2" = "L'entropie compte les arrangements microscopiques dont un état peut être constitué. Elle augmente quand des gaz se forment, quand des solides se dissolvent, et chaque fois que quelque chose se mélange. Le second principe dit que l'entropie de l'univers ne diminue jamais dans un processus spontané, ce qui signifie que la variation du système plus la variation du milieu extérieur doit être positive. C'est ainsi qu'une dissolution endothermique peut quand même se produire d'elle-même : le système gagne plus d'entropie que le milieu extérieur n'en perd en cédant la chaleur."
"entropie.registers.lv3" = "La définition statistique de Boltzmann et la définition thermodynamique de Clausius sont les deux faces d'une même grandeur, et le troisième principe fixe le zéro — ce qui explique que les entropies absolues soient tabulées là où les enthalpies doivent être rapportées à la formation. Enseigne-la comme la dispersion de l'énergie sur les états accessibles plutôt que comme le désordre : la métaphore du désordre est critiquée dans la littérature de didactique de la chimie précisément parce qu'elle prédit mal les cas intéressants, du repliement des protéines à l'agrégation hydrophobe en passant par la cristallisation. Le raccourci ne portant que sur le système, que tout le monde utilise en réalité, est l'énergie de Gibbs, qui n'est que la variation d'entropie totale sous un autre habit."
"gibbs-energie.registers.lv1" = "Le fait qu'une chose se produise d'elle-même est une compétition entre deux effets : dégage-t-elle de la chaleur, et finit-elle plus dispersée. Si les deux disent oui, cela se produit. Si les deux disent non, cela ne se produit jamais. S'ils sont en désaccord, la température est l'arbitre — c'est pourquoi l'eau gèle d'elle-même quand il fait froid et non quand il fait chaud, et pourquoi la craie ne devient chaux vive qu'une fois le four assez chaud. Mais pouvoir se produire ne signifie pas se produire bientôt : un diamant devrait se transformer en mine de crayon, et ne le fait pas, parce que rien ne le pousse par-dessus la colline."
"gibbs-energie.registers.lv2" = "La variation d'énergie de Gibbs est la variation d'enthalpie moins la température fois la variation d'entropie. Négative signifie que la réaction est spontanée telle qu'écrite, positive signifie que c'est l'inverse, zéro signifie l'équilibre. Parce que le terme d'entropie est multiplié par la température, une réaction qui absorbe de la chaleur mais augmente l'entropie devient spontanée au-dessus d'une température de basculement — la variation d'enthalpie divisée par la variation d'entropie — ce qui explique précisément pourquoi le calcaire se décompose dans un four et non dans un becher. À l'équilibre, la variation d'énergie libre standard est fixée par la constante d'équilibre, si bien que l'énergie libre et K ne sont qu'un seul énoncé en deux notations."
"gibbs-energie.registers.lv3" = "L'énergie de Gibbs est l'enthalpie moins la température fois l'entropie, et à température et pression constantes, un changement spontané l'abaisse — ce qui n'est que le second principe réécrit dans des variables appartenant au seul système. L'équilibre est alors le minimum de G sous contraintes de bilan élémentaire, et c'est un énoncé calculable plutôt que rhétorique : c'est littéralement ce que fait un minimiseur de Gibbs, et ce à quoi équivaut la formulation d'action de masse de PHREEQC. Deux limites sur lesquelles ce codex insiste. La spontanéité n'est pas une vitesse, ce qui explique pourquoi le solveur thermique se désactive en dessous de 500 K plutôt que d'oxyder tous les métaux du banc. Et l'état standard est un choix, si bien que la variation d'énergie libre standard et la variation réelle répondent à des questions différentes."
"thermodynamische-vs-kinetische-kontrolle.registers.lv1" = "La chimie a une réponse favorite et une réponse rapide, et ce n'est pas toujours la même. Mélange le liquide bleu au cuivre avec du déboucheur, et tu obtiens une gelée bleu pâle. Cette gelée n'est pas ce sur quoi la chimie se stabiliserait si elle avait l'éternité devant elle — ce serait la poudre noire — mais la gelée se forme rapidement puis reste simplement là, car se transformer en poudre noire est un travail difficile. Chauffe-la, et elle noircit sous tes yeux. La majeure partie du monde est ainsi : ta chaise n'est pas ce que ses atomes pourraient être de plus stable, elle est juste coincée là."
"thermodynamische-vs-kinetische-kontrolle.registers.lv2" = "Deux questions différentes : quel produit a l'énergie libre la plus basse (contrôle thermodynamique) et quel produit se forme le plus vite (contrôle cinétique). À basse température, le produit qui se forme le plus vite l'emporte et peut persister indéfiniment, car la barrière pour se réarranger vers le produit stable est bien plus grande que l'énergie thermique disponible. Élève la température, et la barrière devient franchissable, si bien que le produit stable prend le dessus. Cu(OH)2 contre CuO est le cas scolaire ; la règle des étapes d'Ostwald la généralise, en disant qu'un système en cristallisation tend à passer d'abord par la forme la moins stable, car c'est celle qui germe le plus facilement."
"thermodynamische-vs-kinetische-kontrolle.registers.lv3" = "La distinction se situe entre une fonction d'état et une vitesse. La thermodynamique de l'équilibre fixe la destination et reste muette sur le chemin, si bien qu'une minimisation d'énergie libre répond à une question que le becher ne pose peut-être pas. Là où les barrières dépassent largement RT, la composition observée est fixée par les hauteurs relatives des états de transition, et les conditions de Curtin-Hammett décrivent quand les rapports de produits suivent ces barrières plutôt que les populations de réactifs. Pour la précipitation, la grandeur qui contrôle est la nucléation : la théorie classique de la nucléation fait dépendre le rayon critique de l'énergie interfaciale divisée par la sursaturation, si bien que la phase ayant l'énergie interfaciale la plus basse vis-à-vis de la solution peut germer en premier, même si elle n'est pas la phase massique la plus stable — la règle d'Ostwald rendue quantitative. Le point épistémique important pour un laboratoire computationnel : tout moteur qui minimise G est structurellement incapable de découvrir cela, et doit en être informé. C'est pourquoi nos seuils cinétiques sont des données avec une provenance plutôt que des rouages internes du solveur, et pourquoi le laboratoire signale les phases qu'il retient délibérément."
"moles-from-mass.summary" = "n = m / M · 5,844 g de NaCl ÷ 58,443 g/mol = 0,1000 mol"
"moles-from-mass.expect.predict.question" = "Tu pèses 5,844 g de sel de table. Le banc demande combien de moles cela représente. La masse molaire du chlorure de sodium est 58,443 g/mol. Que rapporte le moteur à la pesée ?"
"moles-from-mass.expect.predict.options" = ["5,844 mol — le nombre que tu as pesé", "0,1000 mol", "58,443 mol — la masse molaire", "Cela dépend de la quantité d'eau dans laquelle tu le verses"]
"moles-from-mass.expect.predict.misconception" = "La dernière option est la plus courante : les apprenants s'attendent à ce que la quantité de matière change quand la solution est diluée. Ce n'est pas le cas — n est une propriété de l'échantillon pesé, et seule la concentration dépend du volume. La première est l'erreur plus brute consistant à traiter les grammes comme s'ils étaient des moles."
"moles-from-mass.expect.predict.diagnosis.0.reveals" = "Grammes et moles sont vus comme deux noms pour une même « quantité », convertibles par simple renommage — la balance a affiché 5,844, donc c'est 5,844, dans quelque unité que la question demande."
"moles-from-mass.expect.predict.diagnosis.0.next" = "Pèse plutôt 58,443 g et redemande : exactement une mole. Une mole est un décompte, tarifé en grammes par la masse molaire — la balance lit le tarif, jamais le décompte."
"moles-from-mass.expect.predict.diagnosis.1.reveals" = "La masse molaire est lue comme la réponse : le nombre le plus grand, le plus officiel en apparence sur la page, devrait être la grandeur demandée, et le sens de la division se perd."
"moles-from-mass.expect.predict.diagnosis.1.next" = "Vérifie la plausibilité de l'ordre de grandeur avant de diviser dans un sens ou l'autre : 58 mol de sel représenteraient trois kilos et demi, et la balance tient six grammes. Quand le sens d'une formule est incertain, l'ordre de grandeur absurde trahit l'erreur."
"moles-from-mass.expect.predict.diagnosis.2.reveals" = "Quantité de matière et concentration sont soudées : diluer donnerait « moins de sel », donc n devrait rétrécir avec l'eau dans laquelle il se trouve."
"moles-from-mass.expect.predict.diagnosis.2.next" = "Fais tourner `concentration-is-a-ratio` : les mêmes 5,844 g dans 100 mL et dans 200 mL, et les deux récipients affichent 0,1000 mol à `inspect`. Seul le mol par litre a bougé — le décompte que tu as pesé n'est pas négociable par l'eau."
"moles-from-mass.registers.lv1" = "Peser te dit à quel point une chose est lourde. Compter te dit combien de morceaux il y a. La chimie a besoin du décompte, car les réactions apparient des morceaux entre eux — et la balance est le moyen d'atteindre ce décompte, puisque chaque substance a un poids fixe par morceau."
"moles-from-mass.registers.lv2" = "n = m / M. 5,844 g ÷ 58,443 g/mol = 0,1000 mol, et le banc confirme 0,1000 mol à la pesée. Dans 1,000 L, cela fait une solution à 0,1 mol/L ; la masse totale sur la balance, 1002,84 g, est le litre d'eau plus le sel, car rien n'a disparu."
"moles-from-mass.registers.lv3" = "Le registre porte M = 58,443 g/mol tiré des masses atomiques IUPAC/CIAAW de 2021, si bien que la conversion est exacte à la précision propre des données plutôt qu'à un 58,5 arrondi. Les 0,1000 mol entrent ensuite dans PHREEQC comme une contrainte de total élémentaire, et le pH de 6,98 plutôt que 7,00 est la correction de force ionique sur l'autoprotolyse propre de l'eau, non un artefact."
"concentration-is-a-ratio.summary" = "c = n / V · 0,1000 mol dans 0,100 L = 1,00 mol/L ; les mêmes 0,1000 mol dans 0,200 L = 0,50 mol/L"
"concentration-is-a-ratio.expect.predict.question" = "Les mêmes 5,844 g de sel sont versés dans 100 mL dans un becher et dans 200 mL dans un autre. Quel becher contient le plus de chlorure de sodium ?"
"concentration-is-a-ratio.expect.predict.options" = ["Le becher à 100 mL — il est plus concentré", "Le becher à 200 mL — il y a plus de liquide", "Aucun des deux : les deux contiennent 0,1000 mol ; seule la concentration diffère"]
"concentration-is-a-ratio.expect.predict.misconception" = "Concentration et quantité de matière sont soudées ensemble. Une tasse de thé fort ne contient pas plus de thé qu'un seau de thé faible. Le moteur sépare explicitement les deux : les deux récipients rapportent 0,1000 mol de chlorure, et les forces ioniques diffèrent exactement d'un facteur deux."
"concentration-is-a-ratio.expect.predict.diagnosis.0.reveals" = "« Plus concentré » est lu comme « contenant plus » — l'intensité confondue avec la quantité, la tasse de thé fort semblant contenir plus de thé que le seau faible."
"concentration-is-a-ratio.expect.predict.diagnosis.0.next" = "Évapore les deux à sec : des cristaux identiques, 5,84 g chacun, de retour sur la même balance. Deux solutions qui diffèrent en tout ce que la langue remarquerait redonnent le même sel — parce que le sel n'a jamais différé."
"concentration-is-a-ratio.expect.predict.diagnosis.1.reveals" = "Le soluté serait à l'échelle de la solution : plus de liquide devrait contenir plus de substance, comme si l'eau fabriquait du sel pour se remplir elle-même."
"concentration-is-a-ratio.expect.predict.diagnosis.1.next" = "Suis la trace écrite du sel : il n'est entré qu'une fois, sur la balance, avant même qu'on choisisse l'eau. `measure` les deux récipients — ils diffèrent exactement de la masse de l'eau supplémentaire, et de rien d'autre."
"concentration-is-a-ratio.registers.lv1" = "Deux bechers, la même cuillerée de sel, des quantités d'eau différentes. Le plus petit a un goût plus salé — mais il ne contient pas plus de sel. « Combien » et « à quel point c'est fort » sont deux questions différentes, et les confondre est l'une des erreurs les plus faciles à commettre."
"concentration-is-a-ratio.registers.lv2" = "c = n / V. 0,1000 mol dans 0,100 L donne 1,00 mol/L ; dans 0,200 L, cela donne 0,50 mol/L. Le banc rapporte la force ionique des deux solutions à 1,0030 m et 0,5015 m — exactement le rapport de moitié, car pour un sel 1:1 comme NaCl, la force ionique égale la molalité."
"concentration-is-a-ratio.registers.lv3" = "Force ionique I = ½ Σ cᵢ zᵢ², qui se réduit à la concentration elle-même pour un électrolyte 1:1 ; cette identité explique pourquoi les deux nombres ressemblent aux concentrations. Le petit excès au-dessus de 1,0000 (1,0030 m) est la molalité contre la molarité : le litre de solution n'est pas un litre d'eau, et PHREEQC travaille de bout en bout en mol par kilogramme d'eau."
"dilution-moves-ph-by-one.summary" = "c₁V₁ = c₂V₂ · 0,001 mol dans 0,100 L → pH 2,04 ; le même acide dans 1,000 L → pH 3,01"
"dilution-moves-ph-by-one.expect.predict.question" = "Un acide affiche pH 2,04. Tu ajoutes encore neuf fois plus d'eau, si bien que le volume est maintenant dix fois plus grand qu'avant. Qu'affiche l'appareil maintenant ?"
"dilution-moves-ph-by-one.expect.predict.options" = ["pH 3,0 — une dilution par dix coûte une unité de pH", "pH 7,0 — l'eau est neutre, donc diluer le rend neutre", "pH 20,4 — dix fois le pH", "pH 2,04 — l'acide est toujours là"]
"dilution-moves-ph-by-one.expect.predict.misconception" = "Deux erreurs sont courantes, et toutes deux concernent le logarithme. « Dix fois le volume, dix fois le pH » traite le pH comme s'il était la concentration ; et « diluer neutralise » oublie qu'aucune quantité d'eau n'atteint pH 7 — on s'en approche sans jamais y arriver, parce que l'acide est toujours entièrement présent."
"dilution-moves-ph-by-one.expect.predict.diagnosis.0.reveals" = "Mélanger ferait la moyenne des étiquettes : l'eau « est » à pH 7, donc suffisamment d'eau tirerait le mélange vers 7, comme une peinture blanche éclaircit du rouge — la neutralité vue comme un ingrédient plutôt que comme une absence."
"dilution-moves-ph-by-one.expect.predict.diagnosis.0.next" = "Continue à diluer, par dix à chaque fois, et lis l'appareil à chaque tour : 3, puis 4, puis 5 — une unité par décade, se rapprochant lentement de 7 sans jamais y arriver, parce que chaque proton entré est toujours là."
"dilution-moves-ph-by-one.expect.predict.diagnosis.1.reveals" = "Le pH serait proportionnel à « combien » : le logarithme est absent, donc dix fois le volume multiplierait la lecture par dix."
"dilution-moves-ph-by-one.expect.predict.diagnosis.1.next" = "Remarque ce que 20,4 signifierait même : l'échelle compte des puissances de dix de l'activité des ions hydrogène, ce qui explique que tout l'univers de l'eau tienne entre environ 0 et 14. Un changement par dix la déplace exactement d'une unité — jusqu'à 3,0, comme l'affiche l'appareil."
"dilution-moves-ph-by-one.expect.predict.diagnosis.2.reveals" = "Le pH voyagerait avec l'acide comme une couleur : tant que l'acide existe, son étiquette persiste — le degré d'encombrement ne jouerait aucun rôle dans la lecture."
"dilution-moves-ph-by-one.expect.predict.diagnosis.2.next" = "Fais-le tourner et retiens les deux faits à la fois : `inspect` montre la même quantité de moles d'acide, et pourtant l'appareil bouge. Le pH appartient à la solution, pas à la substance — il évalue à quel point les protons sont serrés, pas s'ils existent."
"dilution-moves-ph-by-one.registers.lv1" = "Ajoute de l'eau à un acide, et il s'affaiblit — mais il ne se transforme jamais en eau. L'acide que tu y as mis est toujours là ; il a simplement plus de place. Sur l'appareil, le chiffre grimpe, et il grimpe d'un cran pour chaque décuplement du volume d'eau, pas de dix."
"dilution-moves-ph-by-one.registers.lv2" = "c₁V₁ = c₂V₂. 0,001 mol dans 100 mL donne 0,01 mol/L ; l'appareil affiche pH 2,04. Porte le volume à 1,000 L, et la concentration devient 0,001 mol/L — l'appareil affiche pH 3,01. Une unité de pH par facteur dix, parce que le pH est un logarithme."
"dilution-moves-ph-by-one.registers.lv3" = "La quantité de moles de H⁺ est exactement conservée à travers la dilution ; ce qui change, c'est l'activité, et avec elle le pH mesuré. Remarque que la lecture est 2,04 plutôt que 2,00 et 3,01 plutôt que 3,00 : à I ≈ 0,01 m, le coefficient d'activité vaut ≈0,90, et PHREEQC rapporte le pH comme −log a(H⁺), non −log c(H⁺). Les manuels supposent γ = 1 et perdent silencieusement ce centième."
"stoichiometric-ratio-from-the-equation.expect.predict.question" = "Brûle complètement 2,40 g de ruban de magnésium. L'équation équilibrée est 2 Mg + O₂ → 2 MgO. M(Mg) = 24,305, M(MgO) = 40,304 g/mol. Quelle masse de poudre blanche reste-t-il ?"
"stoichiometric-ratio-from-the-equation.expect.predict.options" = ["2,40 g — la masse est conservée", "3,98 g", "1,44 g — une partie brûle et disparaît", "4,80 g — un oxygène par magnésium double la masse"]
"stoichiometric-ratio-from-the-equation.expect.predict.misconception" = "La première option est une mauvaise application de la conservation de la masse : la masse se conserve dans l'univers, pas dans un creuset ouvert qui puise de l'oxygène dans la pièce. La dernière vient d'une lecture de « 2 Mg + O₂ » comme si chaque magnésium prenait un O₂ entier plutôt que la moitié d'un."
"stoichiometric-ratio-from-the-equation.expect.predict.diagnosis.0.reveals" = "La conservation est appliquée au creuset plutôt qu'au système : ce que la balance a vu au départ serait tout ce qui existe, et le réactif invisible puisé dans la pièce n'a aucune ligne dans le grand livre."
"stoichiometric-ratio-from-the-equation.expect.predict.diagnosis.0.next" = "`burning-makes-it-heavier` met en scène exactement cette confrontation sur une balance : la cendre pèse plus lourd que le ruban, exactement de la masse de l'oxygène. La conservation tient — pour le ruban plus l'air, pas pour le creuset seul."
"stoichiometric-ratio-from-the-equation.expect.predict.diagnosis.1.reveals" = "Brûler serait une perte : le feu consumerait, donc il en resterait moins — le prototype du feu de camp, bûche devenant cendre, transposé à un métal."
"stoichiometric-ratio-from-the-equation.expect.predict.diagnosis.1.next" = "Pèse-le : 3,98 g à partir de 2,40. Le feu de camp ne mentait pas — sa perte est partie sous forme de gaz. Le produit du magnésium est un solide, donc l'oxygène qu'il a pris reste sur la balance (`burning-makes-it-lighter` met en scène le prototype lui-même, pour contraste)."
"stoichiometric-ratio-from-the-equation.expect.predict.diagnosis.2.reveals" = "Les coefficients sont lus par paires : « 2 Mg + O₂ » comme si chaque magnésium prenait un O₂ entier, le rapport 2:1 s'effondrant en 1:1."
"stoichiometric-ratio-from-the-equation.expect.predict.diagnosis.2.next" = "Compte les atomes à travers l'équation : deux magnésiums se partagent un O₂ — un atome d'oxygène chacun, 16 g par mole de métal, pas 32. Les masses molaires de l'énoncé contiennent déjà la réponse : 2,40 g × 40,304/24,305 = 3,98 g."
"stoichiometric-ratio-from-the-equation.registers.lv1" = "Pèse le ruban : 2,40 g. Brûle-le. Pèse la cendre : 3,98 g. Recommence avec deux fois plus de ruban, et tu obtiens deux fois plus de cendre — la relation entre ce avec quoi tu commences et ce avec quoi tu finis est fixe, et si tu la connais pour un morceau, tu la connais pour chacun."
"stoichiometric-ratio-from-the-equation.registers.lv2" = "0,0987 mol de Mg (2,40 g ÷ 24,305 g/mol) donne 0,0987 mol de MgO selon le rapport 2:2 de l'équation, soit 3,98 g (× 40,304 g/mol). Le banc rapporte exactement 0,0987 mol de MgO et une lecture de balance de 3,98 g. L'équation n'est pas une décoration — c'est le facteur de conversion."
"stoichiometric-ratio-from-the-equation.registers.lv3" = "Le rapport molaire 1:1 survit parce que le minimiseur de Gibbs conserve exactement le budget élémentaire du magnésium ; l'oxygène est puisé dans le réservoir atmosphérique plutôt que dans l'inventaire du récipient, ce qui fait apparaître sur la balance le rapport massique 40,304/24,305 = 1,658. Aux 3042 K auxquels la résolution se stabilise, le Mg et le MgO gazeux sont thermodynamiquement accessibles ; ils n'apparaissent pas dans les produits parce que l'oxyde condensé domine à 1 bar."
"limiting-reagent.expect.predict.question" = "Becher 1 : 0,0100 mol de chlorure et 0,0200 mol d'argent. Becher 2 : 0,0200 mol de chlorure et 0,0100 mol d'argent. Lequel forme le plus de chlorure d'argent ?"
"limiting-reagent.expect.predict.options" = ["Le becher 1 — il contient plus d'argent, et l'argent est la partie lourde", "Le becher 2 — il contient plus de chlorure", "Aucun des deux : les deux forment 0,0100 mol, fixé par l'ion qui s'épuise en premier"]
"limiting-reagent.expect.predict.misconception" = "Les apprenants additionnent systématiquement les réactifs plutôt que de les apparier. La réaction se fait un argent pour un chlorure : le partenaire en pénurie décide de la réponse, et l'excédent reste simplement là. Les deux bechers contiennent au total 0,0300 mol de réactif et donnent tous deux exactement 0,0100 mol de précipité."
"limiting-reagent.expect.predict.diagnosis.0.reveals" = "Le rendement suivrait le réactif « important » : l'argent est la partie lourde, coûteuse, qui donne son nom, donc plus d'argent signifierait plus de chlorure d'argent — l'appariement n'entre pas dans le tableau."
"limiting-reagent.expect.predict.diagnosis.0.next" = "Fais tourner les deux et filtre : deux gâteaux identiques de 0,0100 mol. Puis `inspect` ce qui reste dissous — le becher 1 conserve toujours son argent excédentaire, qui ne fait rien. L'importance n'est pas une grandeur stœchiométrique."
"limiting-reagent.expect.predict.diagnosis.1.reveals" = "Le miroir de la même erreur : plus de l'un ou l'autre ingrédient signifierait plus de produit — les quantités s'additionneraient, au lieu de s'apparier."
"limiting-reagent.expect.predict.diagnosis.1.next" = "Apparie-les comme des partenaires de danse : chaque AgCl a besoin d'exactement un ion de chaque sorte, donc la file la plus courte termine la danse — à 0,0100 mol dans les deux salles. Le fait que les totaux soient égaux (0,0300 mol chacun) est le piège que tend la question."
"limiting-reagent.registers.lv1" = "Deux bechers reçoivent la même quantité totale de produit chimique, simplement répartie différemment — l'un a de l'argent en excès, l'autre du sel en excès. Les deux se troublent, et les deux produisent exactement la même quantité de solide blanc. Ce qui s'épuise en premier arrête la réaction ; les restes ne font rien d'autre que rester dissous."
"limiting-reagent.registers.lv2" = "Ag⁺ + Cl⁻ → AgCl↓ est une réaction 1:1. Becher 1 : 0,0100 mol de Cl⁻ est limitant face à 0,0200 mol de Ag⁺. Becher 2 : 0,0100 mol de Ag⁺ est limitant face à 0,0200 mol de Cl⁻. Le banc rapporte 0,0100 mol d'AgCl dans les deux cas. Calcule la quantité de moles de chacun, prends la plus petite, et tu as prédit la réponse avant même de l'exécuter."
"limiting-reagent.registers.lv3" = "Le solveur n'applique pas une règle de réactif limitant — il minimise l'énergie libre sous contrainte des bilans élémentaires, et la stœchiométrie 1:1 découle de la contrainte d'action de masse sur Ksp(AgCl) ≈ 1,8 × 10⁻¹⁰. Les deux bechers diffèrent par ce qui reste dissous : un excès de Ag⁺ supprime le chlorure résiduel et vice versa, l'effet d'ion commun, et le pH final diffère légèrement (6,90 contre 7,07) parce que le nitrate et le chlorure n'affectent pas le bilan protonique de façon identique."
"theoretical-yield-and-what-a-real-lab-loses.summary" = "0,0100 mol AgCl × 143,32 g/mol = 1,43 g théorique ; le filtre récupère 1,43 g"
"theoretical-yield-and-what-a-real-lab-loses.expect.predict.question" = "0,0100 mol de chaque réactif, filtré et séché. Le rendement théorique est de 1,43 g. Une classe de trente élèves fait cette expérience et rapporte des rendements entre 71 % et 96 %. Où est passé le chlorure d'argent manquant ?"
"theoretical-yield-and-what-a-real-lab-loses.expect.predict.options" = ["La réaction ne s'est pas terminée — un peu d'argent est resté sous forme de Ag⁺", "Surtout sur le papier filtre, la paroi du becher et l'eau de rinçage", "Il s'est décomposé en séchant"]
"theoretical-yield-and-what-a-real-lab-loses.expect.predict.misconception" = "Un rendement inférieur à 100 % est lu comme un énoncé sur la chimie, donc les apprenants partent à la recherche d'une réaction incomplète. Ici, il s'agit presque entièrement d'une perte mécanique. Le moteur le rend visible en rapportant 1,43 g — le rendement théorique complet — car il ne modélise que la chimie et rien d'autre : pas de papier filtre, pas d'éclaboussures, pas de raclage. L'argent dissous résiduel est réel mais infime, environ 10⁻⁶ mol."
"theoretical-yield-and-what-a-real-lab-loses.expect.predict.diagnosis.0.reveals" = "Tout déficit est imputé à la chimie : un rendement inférieur à 100 % signifierait que la réaction s'est arrêtée trop tôt, parce que l'appareillage est invisible dans le compte."
"theoretical-yield-and-what-a-real-lab-loses.expect.predict.diagnosis.0.next" = "Compare les deux mondes : ce banc modélise la chimie sans papier filtre, sans parois de becher, sans éclaboussures — et rapporte les 1,43 g complets, l'argent véritablement non réagi se situant près de 10⁻⁶ mol, un millième de ce que la classe a perdu. Les grammes manquants sont sur l'équipement, ce pourquoi un travail gravimétrique soigné pèse aussi le papier filtre."
"theoretical-yield-and-what-a-real-lab-loses.expect.predict.diagnosis.1.reveals" = "Une réaction est inventée pour combler un trou de comptabilité : de la masse manque, donc un processus plausible que personne n'a observé — une décomposition au séchage — en porte le blâme."
"theoretical-yield-and-what-a-real-lab-loses.expect.predict.diagnosis.1.next" = "Regarde le profil des pertes avant d'accuser la chimie : trente élèves se répartissent entre 71 % et 96 %. Une décomposition à une température de séchage partagée prendrait une part similaire chez tout le monde ; les pertes de manipulation se dispersent exactement ainsi. La dispersion est l'empreinte digitale."
"theoretical-yield-and-what-a-real-lab-loses.registers.lv1" = "Filtre le mélange trouble, et une pâte blanche reste sur le papier. Sèche-la et pèse-la. Le nombre que tu obtiens n'est presque jamais le nombre calculé — et dans un vrai laboratoire, cet écart provient surtout de résidus collés au verre, pas d'une chimie qui aurait mal tourné."
"theoretical-yield-and-what-a-real-lab-loses.registers.lv2" = "Le réactif limitant donne 0,0100 mol d'AgCl, ce qui, à 143,32 g/mol, représente un rendement théorique de 1,43 g. Le banc filtre et pèse 1,43 g dans v1, et le filtrat v2 pèse 499,35 g. Le rendement en pourcentage = réel ÷ théorique × 100 ; ici il est essentiellement de 100 %, si bien que tout déficit dans une expérience réelle est une perte, non une réaction incomplète."
"theoretical-yield-and-what-a-real-lab-loses.registers.lv3" = "Le filtrat contient toujours de l'argent et du chlorure au niveau qu'exige Ksp — la vue `inspect` montre les deux à la quatrième décimale — si bien que la précipitation « complète » n'est complète qu'à l'intérieur du produit de solubilité, environ 1,3 × 10⁻⁵ mol/L de chacun dans l'eau pure. Ce résidu est une perte réelle et calculable, et c'est la raison pour laquelle l'analyse gravimétrique se lave à l'acide nitrique dilué plutôt qu'à l'eau. Ce que le moteur ne peut pas modéliser, c'est le papier, et il ne prétend pas le pouvoir."
"the-carbon-came-from-the-baking-soda.expect.predict.question" = "4,2 g de bicarbonate de soude (0,0500 mol) réagissent en pétillant avec un grand excès de vinaigre — quatre fois plus d'acide que nécessaire. Quelle quantité de CO₂ se dégage ?"
"the-carbon-came-from-the-baking-soda.expect.predict.options" = ["Plus qu'avec la quantité exacte, car plus d'acide signifie plus de réaction", "0,0500 mol — chaque atome de carbone du gaz provient du bicarbonate", "0,2000 mol — un par molécule d'acide"]
"the-carbon-came-from-the-baking-soda.expect.predict.misconception" = "Verser plus d'acide donne l'impression que cela devrait produire plus de pétillement, et cela paraît effectivement plus violent. Mais le carbone du dioxyde de carbone ne peut provenir que du carbonate, et il y a 0,0500 mol d'atomes de carbone dans le becher. L'acide en excès change la vitesse et le pH final ; il ne peut pas changer le budget élémentaire."
"the-carbon-came-from-the-baking-soda.expect.predict.diagnosis.0.reveals" = "Les réactifs seraient un robinet : plus on en met, plus il en sort — et la violence supplémentaire du pétillement dû à l'excès d'acide est lue comme un rendement supplémentaire plutôt que comme une vitesse supplémentaire."
"the-carbon-came-from-the-baking-soda.expect.predict.diagnosis.0.next" = "Observe la balance plutôt que la mousse : double l'acide, puis quadruple-le — la masse perdue sous forme de gaz est la même à chaque fois, parce que le nombre de carbones n'a jamais changé. La violence est une vitesse ; le rendement est un budget."
"the-carbon-came-from-the-baking-soda.expect.predict.diagnosis.1.reveals" = "Le gaz est crédité à l'acide : le dioxyde de carbone vu comme quelque chose que fabrique le vinaigre, un par molécule, plutôt que comme quelque chose libéré par le carbonate."
"the-carbon-came-from-the-baking-soda.expect.predict.diagnosis.1.next" = "Suis les atomes : les propres carbones du vinaigre restent dans le becher sous forme d'acétate — `inspect` les montre toujours dissous après le pétillement — et la quantité de CO₂ correspond exactement aux 0,0500 mol du bicarbonate. Le gaz porte le carbone du carbonate, et seulement celui-là."
"the-carbon-came-from-the-baking-soda.registers.lv1" = "Le bicarbonate de soude plus le vinaigre pétillent. Utilise quatre fois plus de vinaigre, et cela pétille plus fort et plus vite — mais exactement la même quantité de gaz se dégage au final. Chaque bulle est faite d'atomes qui se trouvaient dans la poudre ; une fois qu'ils sont tous partis, il n'y a plus rien à donner."
"the-carbon-came-from-the-baking-soda.registers.lv2" = "0,0500 mol de NaHCO₃ porte 0,0500 mol de carbone. Le banc libère 0,0183 mol par la seule dissolution (la solution dégaze vers la pCO₂ atmosphérique) et encore 0,0317 mol lors de l'acidification — exactement 0,0500 mol. Fais-le tourner avec 0,0599 mol d'acide au lieu de 0,1998, et tu obtiens les mêmes 0,0500 mol ; seul le pH final diffère, 5,30 contre 4,13."
"the-carbon-came-from-the-baking-soda.registers.lv3" = "Le carbone inorganique total dissous est fixé par l'ajout ; ce que fait l'acide, c'est déplacer la spéciation du carbonate jusqu'à ce que la solution soit sursaturée par rapport à log p(CO₂) = −3,408, et l'excès s'exsolve. La répartition entre les deux étapes n'est donc pas un fait stœchiométrique mais un fait relevant de la loi de Henry, et elle se déplace si l'atmosphère se déplace. La somme, elle, ne bouge pas : les budgets élémentaires sont la contrainte la plus dure de la résolution."
"mass-in-an-open-vessel.summary" = "252,66 g + 3,60 g d'acide = 256,26 g attendus ; la balance affiche 254,84 g. Les 1,4 g correspondent à 0,0317 mol de CO₂."
"mass-in-an-open-vessel.expect.predict.question" = "Le becher affiche 252,66 g. Tu ajoutes 3,60 g de vinaigre, et cela pétille. Qu'affiche la balance quand le pétillement s'arrête ?"
"mass-in-an-open-vessel.expect.predict.options" = ["256,26 g — la masse est toujours conservée", "254,84 g — environ 1,4 g de moins que prévu", "252,66 g — l'acide est consommé"]
"mass-in-an-open-vessel.expect.predict.misconception" = "« La masse est conservée » est enseigné comme une loi, puis appliqué à un récipient plutôt qu'à un système. Ce sont les atomes qui sont conservés ; ils ne sont simplement plus tous dans le becher. Bouche le ballon, et la lecture devient effectivement 256,26 g — c'est pourquoi la version en récipient fermé de cette expérience est celle dont Lavoisier avait besoin."
"mass-in-an-open-vessel.expect.predict.diagnosis.0.reveals" = "Le becher serait l'univers : la loi dit conservée, la balance tient le becher, donc la lecture devrait s'équilibrer — la possibilité que de la masse s'échappe par le haut ouvert n'entre pas dans le compte."
"mass-in-an-open-vessel.expect.predict.diagnosis.0.next" = "Bouche-le : le ballon fermé affiche exactement 256,26 g, et la loi est confirmée dès que la frontière est tracée honnêtement. Les récipients scellés de Lavoisier existaient précisément pour cette raison — la loi n'était démontrable qu'avec le couvercle en place."
"mass-in-an-open-vessel.expect.predict.diagnosis.1.reveals" = "« Consommé » signifierait « disparu » : les réactifs épuisés s'évanouiraient, donc le vinaigre ajouté ne devrait laisser absolument aucune trace sur la balance."
"mass-in-an-open-vessel.expect.predict.diagnosis.1.next" = "Vérifie les atomes du vinaigre : l'acétate et l'eau qu'il est devenu sont toujours dans le becher, pesant ce qu'ils pèsent ; seuls les 1,4 g du CO₂ sont partis. Ajouter 3,60 g et lire +2,18 g est une soustraction avec une histoire — pas une disparition."
"mass-in-an-open-vessel.registers.lv1" = "Pose le becher sur la balance et note le chiffre. Ajoute le vinaigre. Observe le chiffre baisser à mesure que ça pétille. Rien n'a été détruit — les bulles ont quitté le becher en emportant leur poids avec elles, et si tu avais mis un couvercle, le chiffre n'aurait pas du tout bougé."
"mass-in-an-open-vessel.registers.lv2" = "252,66 g + 3,60 g = 256,26 g si rien ne s'échappe. La balance affiche 254,84 g, donc 1,42 g a disparu. Le banc rapporte 0,0317 mol de CO₂ dégagé ; 0,0317 × 44,009 g/mol = 1,40 g. La masse manquante, c'est le gaz, dans les limites de la comptabilité."
"mass-in-an-open-vessel.registers.lv3" = "La comptabilité élémentaire du moteur est exacte ; la masse du récipient n'est pas conservée parce que la phase gazeuse est modélisée comme s'échappant vers le réservoir, exactement comme le fait un becher ouvert. Le petit résidu entre les 1,42 g mesurés et les 1,40 g de CO₂ correspond à de l'eau qui s'échappe avec lui et à l'arrondi sur les moles rapportées — cela vaut la peine de le dire plutôt que de le lisser, car dans une expérience réelle le même écart est réel et a la même cause."
"ph-is-not-quite-minus-log-c.summary" = "HCl à 0,100 mol/L : −log c = 1,00, et l'appareil affiche 1,08"
"ph-is-not-quite-minus-log-c.expect.predict.question" = "0,100 mol d'acide chlorhydrique dans un litre d'eau. La formule du manuel pH = −log[H⁺] donne 1,00. Qu'affiche l'appareil ?"
"ph-is-not-quite-minus-log-c.expect.predict.options" = ["Exactement 1,00", "1,08 — un peu au-dessus, parce que l'appareil répond à l'activité, pas à la concentration", "0,92 — un peu en dessous"]
"ph-is-not-quite-minus-log-c.expect.predict.misconception" = "pH = −log c est enseigné comme une définition, alors que c'est une approximation qui tient quand les ions sont éloignés les uns des autres. À 0,1 mol/L, ce n'est pas le cas : chaque proton est entouré d'un nuage de contre-ions qui l'écrante, et l'électrode ressent la version écrantée. L'écart est faible ici et croît avec la concentration — c'est précisément pourquoi lv3 existe."
"ph-is-not-quite-minus-log-c.expect.predict.diagnosis.0.reveals" = "La formule serait la définition, donc l'appareil devrait lui obéir — un appareil en désaccord serait défectueux, et « l'activité » n'a aucune place dans ce tableau."
"ph-is-not-quite-minus-log-c.expect.predict.diagnosis.0.next" = "Dilue et observe l'écart se refermer : à 0,001 mol/L (`strong-acid`), formule et appareil s'accordent à la deuxième décimale ; à 0,1, ils divergent de 0,08. L'erreur d'une définition ne rétrécit pas avec la dilution — celle d'une approximation, si, et ce comportement est le diagnostic."
"ph-is-not-quite-minus-log-c.expect.predict.diagnosis.1.reveals" = "Une correction est attendue, mais son sens est deviné — l'encombrement est imaginé concentrer l'effet de l'acide plutôt que l'amortir, si bien que les corrections tombent à pile ou face."
"ph-is-not-quite-minus-log-c.expect.predict.diagnosis.1.next" = "Laisse la physique fixer le signe : chaque proton traîne un nuage de contre-ions qui l'écrante, si bien que l'électrode ressent toujours *moins* que le décompte dans des solutions comme celle-ci — la lecture se situe au-dessus du chiffre naïf, jamais en dessous. Une correction dont tu peux déduire le signe, c'est de la chimie ; une que tu devines, c'est de la décoration."
"ph-is-not-quite-minus-log-c.registers.lv1" = "Un pH-mètre ne compte pas les particules d'acide. Il répond à la force avec laquelle l'acide pousse, et dans une solution encombrée, les particules se gênent mutuellement, si bien que la poussée est légèrement plus faible que ne le suggère le décompte. L'appareil te dit ce que fait la solution, et c'est le chiffre qui compte."
"ph-is-not-quite-minus-log-c.registers.lv2" = "0,100 mol dans 1,000 L donne 0,100 mol/L. Une dissociation complète donne [H⁺] = 0,100, donc −log[H⁺] = 1,00. L'appareil affiche 1,08. La formule a raison sur le décompte et légèrement tort sur la lecture, et la différence n'est pas une erreur expérimentale — elle est reproductible."
"ph-is-not-quite-minus-log-c.registers.lv3" = "Le pH est défini comme −log a(H⁺), et a = γc. À I = 0,1 m, l'extension de Debye-Hückel de WATEQ donne γ(H⁺) ≈ 0,83, donc pH = −log(0,83 × 0,100) = 1,08 — exactement ce que calcule et rapporte PHREEQC. Compare le même acide à 0,001 mol/L, où γ ≈ 0,96 et la correction n'est que d'un centième : l'approximation n'est pas fausse, elle a un domaine de validité, et c'est ici que l'apprenant peut observer où il expire."
"a-weak-acid-breaks-the-naive-sum.summary" = "0,100 mol/L : HCl → pH 1,08 ; CH₃COOH → pH 2,88"
"a-weak-acid-breaks-the-naive-sum.expect.predict.question" = "Les deux bechers reçoivent 0,100 mol d'acide dans un litre. L'un est de l'acide chlorhydrique, l'autre l'acide acétique du vinaigre. L'acide chlorhydrique affiche pH 1,08. Que montre l'acide acétique ?"
"a-weak-acid-breaks-the-naive-sum.expect.predict.options" = ["1,08 aussi — même concentration, même pH", "2,88 — environ 60 fois moins de protons libres", "4,76 — le pKa", "7,00 — le vinaigre est un aliment, donc il doit être neutre"]
"a-weak-acid-breaks-the-naive-sum.expect.predict.misconception" = "L'habitude pH = −log c, tout juste apprise, est appliquée à l'acide acétique et produit 1,00 — la première option. Elle échoue parce que la formule suppose silencieusement que l'acide est entièrement dissocié. Choisir le pKa est l'erreur suivante sur ce chemin : le pH n'égale le pKa que dans un tampon, où l'acide et sa base conjuguée sont en quantités égales, et ce becher ne contient presque pas d'acétate."
"a-weak-acid-breaks-the-naive-sum.expect.predict.diagnosis.0.reveals" = "pH = −log c avec c la concentration de l'étiquette : l'hypothèse cachée de la formule — que chaque molécule s'est dissociée — n'a jamais fait surface, si bien que tous les acides d'une même concentration devraient sembler identiques."
"a-weak-acid-breaks-the-naive-sum.expect.predict.diagnosis.0.next" = "`inspect` le becher d'acide acétique au niveau lv3 : presque la totalité des 0,100 mol est encore du CH₃COOH intact, retenant son proton. L'appareil ne tarife que les protons libres, et il y en a environ soixante fois moins que ce que promettait l'étiquette."
"a-weak-acid-breaks-the-naive-sum.expect.predict.diagnosis.1.reveals" = "Le pKa serait le pH de l'acide — le seul chiffre qu'on retient à propos du vinaigre, déployé partout où le vinaigre apparaît, la condition de tampon qui y était pourtant attachée s'étant perdue en chemin."
"a-weak-acid-breaks-the-naive-sum.expect.predict.diagnosis.1.next" = "Rends la condition vraie, et le chiffre devient juste : `half-neutralised-vinegar` neutralise la moitié, [HA] égale [A⁻], et l'appareil affiche exactement le pKa. Ce becher ne contient presque pas d'acétate, si bien que l'égalité requise échoue de loin."
"a-weak-acid-breaks-the-naive-sum.expect.predict.diagnosis.2.reveals" = "Comestible signifierait doux signifierait pH 7 : la catégorie « aliment » répondrait à une question de chimie, sécurité et neutralité fusionnées en une seule échelle."
"a-weak-acid-breaks-the-naive-sum.expect.predict.diagnosis.2.next" = "Mesure ce que tu manges déjà : ce becher précis est du vinaigre à 2,88, et tu en arroses tes frites. Le caractère comestible est un fait sur la dose et la biologie ; l'appareil mesure quelque chose de totalement différent, et les deux échelles ne se ressemblent que jusqu'à ce qu'on en lise une."
"a-weak-acid-breaks-the-naive-sum.registers.lv1" = "Même quantité d'acide, même quantité d'eau, deux lectures d'appareil très différentes. L'acide fort livre toute son acidité d'un coup ; le faible en retient la majeure partie et n'en laisse échapper qu'un peu. C'est pourquoi le vinaigre est sûr à manger et l'acide chlorhydrique de même force ne l'est pas."
"a-weak-acid-breaks-the-naive-sum.registers.lv2" = "Le calcul naïf, pH = −log(0,100) = 1,00, est juste pour HCl (à la correction d'activité près — 1,08) et gravement faux pour l'acide acétique, où l'appareil affiche 2,88. L'acide acétique ne se dissocie que partiellement : pH ≈ ½(pKa − log c) = ½(4,76 + 1,00) = 2,88. Il faut connaître le Ka avant de pouvoir calculer le pH, et c'est toute la différence entre un acide fort et un acide faible."
"a-weak-acid-breaks-the-naive-sum.registers.lv3" = "PHREEQC n'applique pas non plus la formule des acides faibles ; il résout l'équation d'action de masse H⁺ + CH₃COO⁻ ⇌ CH₃COOH (pKa ≈ 4,76 tiré de minteq.v4.dat) simultanément avec le bilan de charge et de masse, et le pH en découle. L'accord avec le raccourci ½(pKa − log c) à 2,88 est une vérification des hypothèses de ce raccourci — que la dissociation est faible et que les propres protons de l'eau sont négligeables —, hypothèses qui tiennent toutes deux ici et échouent toutes deux à 10⁻⁵ mol/L."
"hot-pack-arithmetic.summary" = "ΔT = q / (n·Cp) · 8,28 kJ ÷ (5,5343 mol × 75,3 J·mol⁻¹·K⁻¹) = 19,9 K"
"hot-pack-arithmetic.expect.predict.question" = "0,1000 mol de chlorure de calcium (ΔH_dis = −82,8 kJ/mol) se dissout dans 100 mL d'eau. La capacité thermique molaire de l'eau est de 75,3 J·mol⁻¹·K⁻¹, et 100 mL représentent 5,53 mol. Jusqu'à quelle température monte-t-on, en partant de 25,0 °C ?"
"hot-pack-arithmetic.expect.predict.options" = ["Environ 27 °C — quelques degrés", "Environ 45 °C", "Environ 108 °C — cela bouillirait", "Cela reste à 25 °C ; dissoudre est un changement physique, pas chimique"]
"hot-pack-arithmetic.expect.predict.misconception" = "La dernière option est la plus profonde : dissoudre est classé sous « changement physique », et on suppose que les changements physiques n'impliquent pas d'énergie. Briser un réseau ionique et hydrater les ions sont tous deux de grands termes énergétiques, et leur différence est ce que lit le thermomètre. La réponse 108 °C vient d'une division par la masse en grammes tout en utilisant une capacité thermique molaire."
"hot-pack-arithmetic.expect.predict.diagnosis.0.reveals" = "L'énergie est concédée mais évaluée au feeling : les kilojoules paraissent petits, donc les degrés devraient être peu nombreux — la division qui trancherait n'est jamais réellement faite."
"hot-pack-arithmetic.expect.predict.diagnosis.0.next" = "Fais la division que l'énoncé te tend : 8,28 kJ sur 5,53 mol × 75,3 J·mol⁻¹·K⁻¹ donne 416 J/K, donc +19,9 K. S'engager sur le calcul avant que le thermomètre ne tranche, c'est tout l'exercice."
"hot-pack-arithmetic.expect.predict.diagnosis.1.reveals" = "Les unités se sont croisées en cours de formule : des grammes se sont retrouvés sous une capacité thermique molaire, et le grand nombre résultant a paru être de la chimie en train de se produire plutôt qu'une erreur."
"hot-pack-arithmetic.expect.predict.diagnosis.1.next" = "Fais suivre les unités jusqu'au bout : J ÷ (mol × J·mol⁻¹·K⁻¹) laisse des kelvins ; des grammes sous une capacité molaire laissent un non-sens déguisé en température. Les unités ne sont pas une décoration — elles sont le contrôle qui rattrape cela avant que l'eau n'échoue de façon voyante à bouillir."
"hot-pack-arithmetic.expect.predict.diagnosis.2.reveals" = "La taxonomie ferait de la physique : « changement physique » serait une catégorie sans énergie, donc classer l'événement répondrait à la question du thermomètre."
"hot-pack-arithmetic.expect.predict.diagnosis.2.next" = "Les catégories ne contiennent pas l'énergie — le réseau et les couches d'hydratation, si. Fais tourner `cold-from-baking-soda` à côté de celui-ci : le même « changement physique », avec le signe opposé. Une taxonomie qui prédit zéro ne peut pas prédire à la fois +20 K et −4 K ; un bilan énergétique le peut."
"hot-pack-arithmetic.registers.lv1" = "Le gobelet devient vraiment chaud — trop chaud pour le tenir confortablement — et rien n'a brûlé, rien n'a été branché. Désagréger un cristal et envelopper d'eau ses morceaux libère plus d'énergie que cela n'en coûte, et le surplus n'a nulle part où aller sinon dans l'eau."
"hot-pack-arithmetic.registers.lv2" = "q = n × ΔH_dis = 0,1000 mol × 82,8 kJ/mol = 8,28 kJ libérés. L'eau représente 100 mL, 5,5343 mol, à 75,3 J·mol⁻¹·K⁻¹, donc ΔT = 8280 J ÷ 416,7 J/K = 19,9 K. Depuis 25,0 °C, cela prédit 44,9 °C, et le thermomètre indique 44,87 °C. Le calcul n'est pas un exercice — c'est la mesure."
"hot-pack-arithmetic.registers.lv3" = "La chaleur va uniquement dans l'eau : les Ca²⁺ et Cl⁻ dissous ne portent aucune capacité thermique modélisée, puisque les capacités thermiques molaires partielles des ions aqueux sont faibles et souvent négatives, et ne sont pas prises en charge à ce stade. C'est une approximation de signe connu, et c'est pourquoi les 44,87 °C calculés se situent légèrement au-dessus d'un traitement calorimétrique complet. Le récipient est adiabatique, si bien que rien n'est perdu vers un gobelet ou vers la pièce — l'expérience réelle indique toujours moins, et l'écart est la constante du calorimètre."
"cold-from-baking-soda.expect.predict.question" = "Environ 0,1000 mol de bicarbonate de soude est versée dans 100 mL d'eau à 25,0 °C, dans un récipient ouvert. La dissolution absorbe de la chaleur, et la spéciation du carbonate libère du CO₂. Que doit inclure le calcul thermique ?"
"cold-from-baking-soda.expect.predict.options" = ["Un réchauffement — dissoudre libère toujours de l'énergie", "Un refroidissement issu du bilan énergétique combiné de la dissolution, de la spéciation et de la perte de gaz", "Aucun changement — c'est l'eau qui maintient la température"]
"cold-from-baking-soda.expect.predict.misconception" = "Venant juste de voir le chlorure de calcium réchauffer un gobelet, les apprenants généralisent : dissoudre réchauffe les choses. Le signe de ΔH_dis est une propriété de la substance, pas de la dissolution. Le bicarbonate de soude, le chlorure de potassium et le nitrate d'ammonium vont tous dans l'autre sens, et une poche de froid instantanée est exactement cette expérience."
"cold-from-baking-soda.expect.predict.diagnosis.0.reveals" = "Le résultat de la dernière expérience, promu au rang de loi : dissoudre réchauffe les choses, parce que l'exemple mémorable le faisait."
"cold-from-baking-soda.expect.predict.diagnosis.0.next" = "Fais tourner `hot-pack-arithmetic` et ce becher-ci l'un après l'autre : le signe voyage avec la substance, pas avec l'opération. ΔH_dis vaut ici +16,7 kJ/mol, et le thermomètre obéit au signe, pas à l'habitude."
"cold-from-baking-soda.expect.predict.diagnosis.1.reveals" = "L'eau vue comme une ancre thermique : un grand liquide stable qu'une cuillerée de poudre ne pourrait pas déplacer — la capacité thermique confondue avec l'immunité."
"cold-from-baking-soda.expect.predict.diagnosis.1.next" = "La capacité thermique est un prix, pas un veto : retirer 1,67 kJ à environ 416 J/K d'eau coûterait environ 4 K rien que par la dissolution. La conversion du carbonate en récipient ouvert y contribue aussi. Une plus grande capacité réduit une variation de température ; elle ne l'interdit pas."
"cold-from-baking-soda.registers.lv1" = "Même gobelet, même eau, poudre différente — et celle-ci refroidit au lieu de réchauffer. Ce n'est ni un tour ni une façon différente de remuer ; certaines substances doivent emprunter de l'énergie à l'eau pour se désagréger, et l'eau reste plus froide pour l'avoir prêtée."
"cold-from-baking-soda.registers.lv2" = "L'estimation ne portant que sur la dissolution est q ≈ 0,1000 mol × 16,7 kJ/mol = 1,67 kJ absorbés, soit environ 4 K de refroidissement pour 100 mL d'eau. Ce n'est pas la prédiction complète pour ce becher ouvert : le résultat calculé est d'environ 18,4 °C, car la spéciation du carbonate et le transfert de CO₂ entrent aussi dans le bilan énergétique."
"cold-from-baking-soda.registers.lv3" = "Le solveur aqueux ordinaire tarife le changement complet de l'inventaire chimique et de l'échange gazeux. Environ 0,0416 mol de CO₂ quitte cet apport à mesure que le bicarbonate se redistribue vers le carbonate sous la frontière atmosphérique ouverte. Cette conversion n'est pas thermiquement indépendante de la dissolution. Le résultat suppose un équilibre gazeux immédiat et un récipient adiabatique ; il ne prédit ni un temps de transfert gazeux ni les fuites de chaleur d'un vrai gobelet."
"two-vessels-one-variable.summary" = "Mêmes 0,1000 mol de CaCl₂ ; 100 mL → 44,87 °C, 200 mL → 34,93 °C"
"two-vessels-one-variable.expect.predict.question" = "Les mêmes 0,1000 mol de chlorure de calcium sont versées dans 100 mL dans un gobelet et dans 200 mL dans un autre. Le premier atteint 44,87 °C. Que atteint le second ?"
"two-vessels-one-variable.expect.predict.options" = ["44,87 °C — la même énergie a été libérée", "34,93 °C — la même énergie, répartie sur deux fois plus d'eau", "89,7 °C — deux fois plus d'eau, deux fois plus de chauffage"]
"two-vessels-one-variable.expect.predict.misconception" = "La première option confond énergie et température — ce ne sont pas la même grandeur, et cette paire de gobelets est le moyen le moins coûteux de ressentir la différence. Exactement les mêmes 8,28 kJ sont libérés dans les deux ; le thermomètre lit l'énergie par unité de matière à réchauffer, donc doubler l'eau divise par deux la hausse."
"two-vessels-one-variable.expect.predict.diagnosis.0.reveals" = "Énergie et température seraient une seule grandeur : « la chaleur » est ce que lit le thermomètre, donc le même sel devrait donner la même lecture partout."
"two-vessels-one-variable.expect.predict.diagnosis.0.next" = "Retiens les deux chiffres à la fois : 8,28 kJ libérés dans chaque gobelet — identiques — et +19,9 K dans l'un contre +9,9 K dans l'autre. Le thermomètre lit l'énergie par quantité de matière à réchauffer ; cette paire de gobelets est l'instrument le moins coûteux capable de distinguer ces deux grandeurs."
"two-vessels-one-variable.expect.predict.diagnosis.1.reveals" = "Plus d'eau serait lu comme plus de réaction : le solvant serait promu au rang de réactif, donc le doubler devrait doubler la chaleur."
"two-vessels-one-variable.expect.predict.diagnosis.1.next" = "`inspect` les deux gobelets : 0,1000 mol dissoute identique, énergie libérée identique. L'eau ne fait que diviser la chaleur — si elle alimentait la réaction, le sel devrait d'une façon ou d'une autre savoir combien d'eau le regardait se dissoudre."
"two-vessels-one-variable.registers.lv1" = "Change une seule chose et rien d'autre. Deux gobelets, la même poudre, la même température de départ — seule la quantité d'eau diffère. Alors, quoi que fassent différemment les thermomètres, tu sais ce qui l'a causé. Change deux choses à la fois, et tu n'as rien appris, quelle que soit la précision de tes mesures."
"two-vessels-one-variable.registers.lv2" = "q = 8,28 kJ identique dans les deux gobelets. ΔT = q/(n·Cp) : 8280 ÷ 416,7 = 19,9 K dans 100 mL, et 8280 ÷ 833,5 = 9,9 K dans 200 mL. Le banc donne, à partir de 25,0 °C, 44,87 °C et 34,93 °C — 19,87 K et 9,93 K. Le rapport de moitié est exact, car seul le dénominateur a changé."
"two-vessels-one-variable.registers.lv3" = "C'est la comparaison contrôlée sous sa forme la plus pure, et il vaut la peine de remarquer ce que le moteur maintient constant gratuitement, ce qu'un vrai banc ne fait pas : température de départ identique, perte de chaleur identique (nulle), pureté identique, agitation identique. Un test équitable simulé est trivialement équitable, et c'est précisément pourquoi *l'habitude* doit être enseignée ici, tandis que *la difficulté* doit être rencontrée sur un vrai banc. Le laboratoire virtuel peut enseigner la logique du contrôle ; il ne peut pas en enseigner la discipline."
"two-paths-one-temperature.expect.predict.question" = "Les pastilles d'hydroxyde de sodium peuvent aller directement dans l'acide — une étape violente — ou se dissoudre d'abord dans l'eau puis rencontrer l'acide, deux étapes plus douces. Quel chemin finit le plus chaud ?"
"two-paths-one-temperature.expect.predict.options" = ["Le chemin en une étape — tout faire d'un coup libère l'énergie ensemble", "Le chemin en deux étapes — deux chaleurs séparées s'additionnent pour donner plus", "Aucun des deux : les deux bechers finissent exactement à la même température"]
"two-paths-one-temperature.expect.predict.misconception" = "L'enthalpie est une fonction d'état : la chaleur libérée entre le même départ et la même arrivée ne dépend pas du chemin emprunté entre eux. C'est la loi de Hess, et les deux réponses fausses imaginent que le chemin compte — dans des directions opposées. Le drame diffère (un saut contre deux montées) ; la destination ne le peut pas."
"two-paths-one-temperature.expect.predict.diagnosis.0.reveals" = "L'intensité confondue avec le total : une étape spectaculaire « libérerait plus » que deux douces, comme si l'énergie récompensait le fait de tout faire d'un coup."
"two-paths-one-temperature.expect.predict.diagnosis.0.next" = "Observe les deux thermomètres : 49,20 °C et 49,20 °C. Les trajets diffèrent — un becher bondit en une seule étape violente, l'autre monte deux fois, s'arrêtant à 35,7 °C sous forme de lessive de soude à pH 13,51 — mais la destination est fixée par les deux points terminaux, non par le chemin tracé entre eux."
"two-paths-one-temperature.expect.predict.diagnosis.1.reveals" = "Les chaleurs comptées par événement plutôt que par changement d'état : deux réchauffements devraient sûrement s'additionner à plus qu'un seul."
"two-paths-one-temperature.expect.predict.diagnosis.1.next" = "Additionne les deux chaleurs du second chemin : la chaleur de la dissolution plus celle du mélange, et la somme correspond exactement à la libération en une étape. L'énergie se comptabilise entre états, et les deux chemins relient les deux mêmes états — que les parties s'additionnent au tout est tout le contenu de la loi."
"two-paths-one-temperature.registers.lv1" = "Directement dans l'acide, ou dissoudre d'abord et mélanger ensuite — prends l'une ou l'autre route. Le thermomètre termine sur la même marque dans les deux cas. La chaleur se moque du chemin que tu as pris ; seuls comptent où tu as commencé et où tu as fini."
"two-paths-one-temperature.registers.lv2" = "Loi de Hess : l'enthalpie est une fonction d'état, donc les mêmes réactifs atteignant le même becher final libèrent la même chaleur totale, en n'importe quel nombre d'étapes. Les deux chemins affichent 49,20 °C — les −44,5 kJ/mol de la dissolution et les ≈−56 kJ/mol de la neutralisation sont tous deux versés, dans un ordre différent, dans la même somme — et le bilan énergétique du banc conserve l'enthalpie à travers chaque état intermédiaire, si bien que l'accord est exact et non approximatif."
"two-paths-one-temperature.registers.lv3" = "La loi comme l'ordre de grandeur sont calculés, et l'enthalpie de neutralisation est lue plutôt que mise en scène : H⁺ + OH⁻ → H₂O est l'inverse de la réaction qui définit OH⁻ dans chaque base de données livrée, si bien que son ΔH provient des fichiers de données eux-mêmes — wateq4f indique −55,91 kJ/mol, minteq.v4 −55,81, pitzer −56,36, un désaccord d'un demi-kJ entre jeux de données exactement du type que `explain` existe pour montrer. (Les −57,3 kJ/mol que citent les tables scolaires sont la valeur calorimétrique fort-fort avec les effets de dilution inclus — une mesure différente.) Deux limites, énoncées : ceci ne compte que l'étape de formation de l'eau, si bien que la neutralisation d'un acide faible afficherait ici environ 2 kJ/mol de trop en exothermicité, son enthalpie de dissociation étant intégrée dans le chiffre d'un vrai calorimètre mais pas dans celui-ci ; et le pH final de 8,91 est l'excès de 8 × 10⁻⁶ mol de base (quatre grammes de NaOH font 0,100008 mol) lu aux 49,2 °C que le becher a réellement atteints — K_w s'est déplacé avec la température, ce qui fait entrer `neutral-is-a-moving-target` sans y être invité. L'exactitude de cet accord entre les deux chemins a coûté cher : l'enthalpie a cessé d'être une fonction d'état de trois façons distinctes dans ce moteur avant de le rester (PLAN.md en garde la chronique), et cette entrée n'est devenue rédigeable que lorsque la dernière de ces erreurs a été corrigée."
"chalk-below-the-kiln.summary" = "CaCO₃(s) + chaleur → CaCO₃(s) · 134 °C, c'est chaud, et rien ne se passe"
"chalk-below-the-kiln.expect.predict.question" = "10 g de craie dans un creuset. Ajoute 1 kJ de chaleur — de quoi la porter à 134 °C, plus chaud que de l'eau bouillante. Que sort-il ?"
"chalk-below-the-kiln.expect.predict.options" = ["De la chaux vive et du dioxyde de carbone — elle s'est décomposée", "De la craie chaude. Rien d'autre. La balance affiche toujours 10,00 g", "Une partie se décompose ; le reste non"]
"chalk-below-the-kiln.expect.predict.misconception" = "« Chauffer provoque une décomposition » devient une règle sans seuil attaché, si bien qu'on s'attend à ce que tout chauffage produise quelque chose. La décomposition a une température, et en dessous, la réaction ne se déroule pas lentement — elle ne se déroule pas du tout. Cette entrée existe comme le résultat nul qui donne son sens à la suivante."
"chalk-below-the-kiln.expect.predict.diagnosis.0.reveals" = "Chauffer provoquerait une décomposition, sans seuil : 134 °C, c'est impressionnant de chaud selon les critères de la cuisine, donc de la chimie devrait être en train de se produire."
"chalk-below-the-kiln.expect.predict.diagnosis.0.next" = "Pousse-la par étapes et pèse entre chacune : plus chaud, plus chaud, toujours 10,00 g — puis au-delà du seuil dans `chalk-in-the-kiln`, où tout se produit d'un coup. La paire d'entrées est la leçon : les seuils ne sont pas des approches graduelles du drame."
"chalk-below-the-kiln.expect.predict.diagnosis.1.reveals" = "Les réactions vues comme des variateurs d'intensité : chaque température achèterait une fraction de l'effet, donc une chaleur partielle devrait donner une décomposition partielle."
"chalk-below-the-kiln.expect.predict.diagnosis.1.next" = "Lis la balance jusqu'à son dernier chiffre : 10,00 g, pas 9,9-quelque chose. En dessous de la température où la pression de CO₂ au-dessus du carbonate atteint celle de la pièce, le gaz ne peut absolument pas s'échapper — l'équilibre est une porte, et de ce côté du seuil, elle est fermée, pas entrouverte."
"chalk-below-the-kiln.registers.lv1" = "De la craie dans un creuset au-dessus d'une flamme, assez chaude pour te brûler gravement, et une fois refroidie, c'est toujours de la craie. Même poudre blanche, même poids sur la balance. Chauffer n'est pas un ingrédient magique : il faut assez de chaleur, et « assez » est un nombre précis pour chaque substance."
"chalk-below-the-kiln.registers.lv2" = "1 kJ appliqué à 0,0999 mol de CaCO₃ n'est pas simplement ce kilojoule divisé par une seule capacité thermique. Celle de la calcite augmente avec la température — 83,8 J·mol⁻¹·K⁻¹ à 25 °C, et 91,4 en moyenne sur la montée elle-même — si bien que le même kilojoule n'achète que 109 K et non les 122 que promet la valeur à température ambiante : 25 °C → 134,5 °C, et le banc confirme 134,47 °C. Aucun CO₂ ne se dégage, aucun CaO n'apparaît, et la balance affiche toujours 10,00 g. Le carbonate de calcium a besoin d'environ 900 °C avant que la décomposition ne se produise."
"chalk-below-the-kiln.registers.lv3" = "La pression partielle d'équilibre du CO₂ au-dessus de la calcite à 420 K est d'environ 10⁻¹⁵ bar — bien en dessous des 10⁻³,⁴ bar ambiants —, si bien que la force motrice thermodynamique pointe dans l'autre sens et que le carbonate est la phase stable. Le minimiseur de Gibbs n'est pas désactivé ici ; il est exécuté et renvoie « inchangé », ce qui est un résultat calculé et non une hypothèse. Un apprenant peut augmenter la chaleur et trouver lui-même le point de croisement."
"chalk-in-the-kiln.expect.predict.question" = "Les mêmes 10 g de craie, mais huit fois plus de chaleur — au-delà de 1000 °C. Le creuset s'allège. Où, dans ce programme, est écrite la température à laquelle la craie se décompose ?"
"chalk-in-the-kiln.expect.predict.options" = ["Dans une table de températures de décomposition que le moteur consulte", "Nulle part — elle est calculée, à partir du point où la pression de CO₂ au-dessus du carbonate atteint la pression de la pièce", "Elle est codée en dur à 900 °C"]
"chalk-in-the-kiln.expect.predict.misconception" = "On suppose qu'un simulateur est une table de correspondance avec de l'animation par-dessus, si bien que tout chiffre qu'il produit serait censé avoir été tapé par quelqu'un. Ce n'est pas le cas ici : la même résolution qui dit que 134 °C ne change rien dit que 1000 °C change tout, et aucune des deux réponses n'a été écrite à l'avance. C'est la différence entre un modèle et un enregistrement."
"chalk-in-the-kiln.expect.predict.diagnosis.0.reveals" = "La simulation vue comme un enregistrement : les nombres viendraient de tables que quelqu'un a tapées, donc quelque part dans ce programme, une table de températures de décomposition serait consultée."
"chalk-in-the-kiln.expect.predict.diagnosis.0.next" = "`explain` le récipient : la provenance nomme des polynômes thermodynamiques NASA et une minimisation de Gibbs — aucune table de décomposition n'existe à consulter. La même résolution qui refusait à 134 °C calcine à 1000 °C, sans avoir rien consulté entre les deux."
"chalk-in-the-kiln.expect.predict.diagnosis.1.reveals" = "La forme plus aiguë de la même idée : une constante précise, codée en dur — quelqu'un aurait écrit 900 dans le code source, comme l'impriment les manuels."
"chalk-in-the-kiln.expect.predict.diagnosis.1.next" = "Demande de quoi dépend le seuil, et un nombre codé en dur s'effondre : c'est la température où la pression d'équilibre du CO₂ au-dessus du solide croise la pression de la pièce, ce qui explique que la réponse appartienne aux *conditions* et non à la craie seule. `explain` montre les données dont elle est issue ; le code source n'a pas de 900 à trouver."
"chalk-in-the-kiln.registers.lv1" = "Maintenant la craie change vraiment. Elle rougeoie, puis devient mate, et ce qui reste est une poudre blanche différente, bien plus légère — et si tu y verses de l'eau, elle siffle et chauffe. C'est ainsi que la chaux pour le mortier est fabriquée depuis quatre mille ans, et la seule chose dont tu avais besoin était un feu assez chaud."
"chalk-in-the-kiln.registers.lv2" = "8 kJ appliqués à 0,0999 mol de craie à 81,9 J·mol⁻¹·K⁻¹ la portent à environ 1000 °C, au-delà du point de décomposition — et la décomposition coûte alors plus que ce que la dose avait laissé, si bien que le creuset redescend en dessous, la réaction étant partiellement accomplie. CaCO₃ → CaO + CO₂ : le dioxyde de carbone s'échappe, et la balance chute de 10,00 g vers la masse de la seule chaux vive. Chaque mole de craie qui se décompose cède 44,009 g de gaz et conserve 56,077 g d'oxyde — une perte de 44 %."
"chalk-in-the-kiln.registers.lv3" = "Le seuil n'est pas tabulé. Le minimiseur reçoit le budget élémentaire du récipient ainsi que sa part de l'atmosphère, et on lui demande la composition d'énergie de Gibbs la plus basse à la température où se stabilise le bilan enthalpique ; la calcite l'emporte en dessous du croisement, et la chaux plus le gaz au-dessus. Le bilan élémentaire est ici une contrainte dure, non une aspiration : le solveur refuse de renvoyer une composition dont les atomes ne correspondent pas, à une partie sur un milliard près, à ceux qui sont entrés, et il préfère signaler un échec de convergence plutôt qu'une composition qui créerait de la matière. Ce contrôle est la raison pour laquelle cette entrée peut citer des quantités : une version antérieure du minimiseur testait la convergence sur la taille de son propre pas de correction plutôt que sur le résidu, et renvoyait silencieusement le double du dioxyde de carbone avec lequel elle avait commencé."
"burning-makes-it-heavier.expect.predict.question" = "Pèse un ruban de magnésium : 1,20 g. Brûle-le complètement et pèse la cendre blanche. Engage-toi sur un chiffre avant de regarder."
"burning-makes-it-heavier.expect.predict.options" = ["Moins de 1,20 g — brûler consomme les choses", "Exactement 1,20 g — la masse est conservée", "1,99 g — plus que le point de départ", "Rien à peser — tout est parti en fumée"]
"burning-makes-it-heavier.expect.predict.misconception" = "C'est le grand classique, et la plupart des gens se trompent. Chaque feu que quiconque a observé laisse moins qu'il n'a commencé — une bûche devient une poignée de cendres — si bien que « brûler détruit la matière » s'apprend du monde avant d'être désappris en classe. La cendre est plus légère parce que le carbone est parti sous forme de gaz. L'oxyde de magnésium est un solide et reste dans le creuset, si bien que l'oxygène qu'il a pris à l'air se trouve lui aussi sur la balance. Brûler est une combinaison, pas une destruction ; la bûche est le cas trompeur."
"burning-makes-it-heavier.expect.predict.diagnosis.0.reveals" = "Le feu consumerait — appris à chaque feu de camp avant toute salle de classe : brûler dépenserait de la matière, et la cendre en serait le reste."
"burning-makes-it-heavier.expect.predict.diagnosis.0.next" = "Brûle-le ici et pèse : 1,99 g à partir de 1,20. Le feu de camp ne mentait pas — sa masse perdue est partie sous forme de gaz. Le produit de ce feu-ci est un solide, si bien que l'oxygène pris reste à peser ; `burning-makes-it-lighter` met en scène, pour comparaison, le cas du feu de camp lui-même."
"burning-makes-it-heavier.expect.predict.diagnosis.1.reveals" = "La conservation appliquée au seul ruban : l'air n'aurait aucune ligne dans les comptes, donc ce qui a été pesé devrait être ce qui reste."
"burning-makes-it-heavier.expect.predict.diagnosis.1.next" = "Redessine la frontière autour du ruban *plus l'air*, et les comptes s'équilibrent parfaitement : les 0,79 g supplémentaires sont de l'oxygène qui l'a franchie. La loi n'a jamais été en danger — elle était simplement appliquée à une frontière trop étroite."
"burning-makes-it-heavier.expect.predict.diagnosis.2.reveals" = "La forme la plus forte de la leçon du feu de camp : brûler serait une annihilation, et « partir en fumée » signifierait que la matière cesse véritablement d'exister."
"burning-makes-it-heavier.expect.predict.diagnosis.2.next" = "Place une balance sous chaque feu de ce codex : quelque chose reste toujours, ou part toujours *sous forme de quelque chose* — un gaz avec une masse, une cendre avec une masse. `mass-in-an-open-vessel` capture la masse qui s'échappe en plein vol ; aucun registre dans ce laboratoire ne boucle jamais à zéro."
"burning-makes-it-heavier.registers.lv1" = "Il brûle avec une lumière blanche si intense qu'elle fait mal aux yeux, et laisse une poudre plus blanche que ne l'était le ruban. Repose-le sur la balance : il est plus lourd. Quelque chose est sorti de l'air pour le rejoindre — l'air n'est pas rien, et c'est l'une des rares expériences où l'on peut peser ce fait."
"burning-makes-it-heavier.registers.lv2" = "0,0494 mol de Mg (1,20 g ÷ 24,305) devient 0,0494 mol de MgO, soit 1,99 g. Le gain de 0,79 g correspond à 0,0247 mol de O₂ à 31,998 g/mol, prélevé dans l'atmosphère. La masse est conservée sur l'ensemble du système ; le creuset n'est pas le système entier, et la comptabilité manquante, c'est l'air."
"burning-makes-it-heavier.registers.lv3" = "L'oxygène est puisé dans un réservoir plutôt que dans l'inventaire du récipient, ce qui explique la hausse de masse du récipient — un choix de modélisation délibéré correspondant à un creuset ouvert. La résolution adiabatique se stabilise à 3042 K avec l'oxyde condensé dominant ; à cette température, MgO(g) et le Mg atomique sont thermodynamiquement présents dans les données NASA mais négligeables à 1 bar, si bien que la quasi-totalité du métal est récupérée sous forme de solide pesable."
"burning-makes-it-lighter.expect.predict.question" = "1,20 g de charbon de bois, brûlé complètement dans le même creuset qui a alourdi le magnésium. Que montre la balance ensuite ?"
"burning-makes-it-lighter.expect.predict.options" = ["1,20 g — la masse est conservée", "Plus de 1,20 g, comme avec le magnésium", "Pratiquement rien — le creuset est vide"]
"burning-makes-it-lighter.expect.predict.misconception" = "Venant juste d'apprendre que brûler ajoute de la masse, les apprenants surcorrigent et s'attendent à ce que tout feu en gagne. Les deux feux gagnent de l'oxygène ; la différence tient entièrement à si l'oxyde est un solide ou un gaz. L'oxyde de magnésium reste ; le dioxyde de carbone s'échappe. Rien n'a changé quant à la conservation entre les deux expériences — seule la phase du produit a changé."
"burning-makes-it-lighter.expect.predict.diagnosis.0.reveals" = "La conservation est de nouveau bridée au creuset, cette fois de l'autre côté : les gaz ne compteraient pas comme de la masse qui s'échappe, donc la lecture devrait tenir."
"burning-makes-it-lighter.expect.predict.diagnosis.0.next" = "Scelle-le et brûle — le geste de Lavoisier : fermé, la lecture tient exactement ; ouvert, le CO₂ emporte sa masse par le haut. La même loi dans les deux cas, la frontière tracée honnêtement une fois pour toutes."
"burning-makes-it-lighter.expect.predict.diagnosis.1.reveals" = "La leçon précédente a surcorrigé vers une nouvelle règle : brûler ajouterait de l'oxygène, l'oxygène a une masse, donc toute cendre devrait être plus lourde — la phase du produit n'a pas encore de place dans la règle."
"burning-makes-it-lighter.expect.predict.diagnosis.1.next" = "Accorde la prémisse, puis demande-toi où *se trouve* l'oxyde : MgO reste dans le creuset ; CO₂ est dans la pièce. Les deux feux ont gagné de l'oxygène — pèse plutôt le gaz qui s'échappe (`mass-in-an-open-vessel`), et le gain du carbone réapparaît, en suspension dans l'air."
"burning-makes-it-lighter.registers.lv1" = "Le charbon de bois rougeoie orange, puis il ne reste plus rien à peser. Il a fait la même chose que le magnésium — il s'est combiné à l'air — mais ce qu'il a produit était invisible et s'est envolé. C'est pourquoi les feux de joie ressemblent à une destruction, et pourquoi les gens ont cru pendant des siècles que brûler détruisait les choses."
"burning-makes-it-lighter.registers.lv2" = "0,0999 mol de C (1,20 g ÷ 12,011) devient 0,0999 mol de CO₂ — 4,40 g de gaz, entièrement disparus du creuset, qui affiche 0,00 g. Le système a gagné 3,20 g d'oxygène, et le récipient a perdu 1,20 g de carbone ; les deux expériences diffèrent par la phase du produit et par rien d'autre."
"burning-makes-it-lighter.registers.lv3" = "La flamme adiabatique se stabilise à 2216 °C contre 2769 °C pour le magnésium, et l'écart ne tient pas à quelle réaction serait « plus forte » — le ΔH du carbone par mole de O₂ est comparable — mais à où va l'énergie : le produit ici est un gaz qui l'emporte dans ses modes de translation et de vibration, tandis que la magnésie est une phase condensée avec bien moins de capacité d'absorption. La température de flamme est un bilan enthalpique, pas un classement de combustibles."
"flame-temperature-is-a-balance-not-a-property.summary" = "2 Mg + O₂ → 2 MgO de 228 °C → 2177 °C ; la même réaction de 927 °C → 2769 °C"
"flame-temperature-is-a-balance-not-a-property.expect.predict.question" = "Deux rubans de magnésium identiques de 1,2 g brûlent dans un air identique. L'un est à peine tiède quand il s'enflamme (228 °C) ; l'autre rougeoie déjà (927 °C). Les deux flammes atteignent-elles la même température ?"
"flame-temperature-is-a-balance-not-a-property.expect.predict.options" = ["Oui — la température de flamme est une propriété du magnésium", "Non : 2177 °C et 2769 °C. La chaleur que tu as fournie en premier est toujours dans les produits", "Non — la plus chaude brûle plus vite et finit donc plus froide"]
"flame-temperature-is-a-balance-not-a-property.expect.predict.misconception" = "La « température de flamme adiabatique du magnésium » est mémorisée comme une constante, comme un point de fusion. Ce n'est pas une propriété du combustible ; c'est la réponse à un bilan enthalpique, et l'enthalpie des réactifs est l'une des données d'entrée. Préchauffe les réactifs, et tu obtiens une flamme plus chaude — c'est exactement pourquoi les fours industriels préchauffent leur air."
"flame-temperature-is-a-balance-not-a-property.expect.predict.diagnosis.0.reveals" = "La température de flamme vue comme une constante propre à la substance, classée à côté du point de fusion : un combustible, un chiffre, quel que soit l'état dans lequel il a commencé."
"flame-temperature-is-a-balance-not-a-property.expect.predict.diagnosis.0.next" = "Change seulement l'enthalpie de départ et lis la réponse : 700 degrés de préchauffage en plus, environ 600 degrés de flamme en plus. Une constante ne peut pas répondre à la façon dont tu as commencé ; un bilan le doit — et les fours préchauffent leur air parce que les ingénieurs facturent selon ce bilan."
"flame-temperature-is-a-balance-not-a-property.expect.predict.diagnosis.1.reveals" = "La vitesse dépenserait la chaleur : un départ plus chaud brûle plus vite, et plus vite signifierait d'une certaine façon que l'énergie est consommée plus tôt et finit plus froide — la vitesse mêlée au budget énergétique."
"flame-temperature-is-a-balance-not-a-property.expect.predict.diagnosis.1.next" = "Adiabatique signifie que le registre conserve tout, quelle que soit l'allure : même combustible, même oxygène, plus d'enthalpie de départ — plus d'enthalpie finale, un point c'est tout. La vitesse décide de la rapidité avec laquelle les produits atteignent leur température, jamais de quelle est cette température."
"flame-temperature-is-a-balance-not-a-property.registers.lv1" = "Deux rubans identiques, tous deux brûlés, tous deux d'un éclat aveuglant — et une flamme est de six cents degrés plus chaude que l'autre. La seule différence était la chaleur du métal au moment où il s'est enflammé. La chaleur que tu as fournie à l'avance ne disparaît pas quand le feu commence ; elle est toujours là, ajoutée par-dessus."
"flame-temperature-is-a-balance-not-a-property.registers.lv2" = "Adiabatique signifie qu'aucune chaleur ne s'échappe, si bien que l'enthalpie des produits égale celle des réactifs. En partant de 228 °C, la résolution atterrit à 2176,97 °C ; en partant de 926,9 °C — la température d'inflammation qu'utilise le banc —, elle atterrit à 2768,67 °C. Même ΔH de réaction, −601 kJ/mol ; enthalpie de départ différente, réponse différente."
"flame-temperature-is-a-balance-not-a-property.registers.lv3" = "Le solveur procède par bissection sur la température jusqu'à ce que l'enthalpie des produits corresponde à celle des réactifs, en évaluant les deux à partir des polynômes NASA-9 plutôt qu'en supposant une capacité thermique constante — ce qui compte, car Cp augmente sensiblement sur deux mille kelvins. La part atmosphérique du récipient entre aussi dans le bilan, et elle est le puits de chaleur dominant : un gramme de magnésium réchauffe bien davantage l'air qui l'entoure que le grain d'oxyde minuscule qu'il laisse derrière lui."
"why-the-shelf-is-not-on-fire.summary" = "Mg + ½O₂ → MgO est favorable à toute température ; à 224 °C, le ruban reste simplement là"
"why-the-shelf-is-not-on-fire.expect.predict.question" = "Le magnésium et l'oxygène libèrent 601 kJ par mole — la thermodynamique dit que le métal ne devrait pas exister du tout dans l'air. Deux rubans sont chauffés : l'un à 224,3 °C, l'autre à 228,4 °C. Que se passe-t-il ?"
"why-the-shelf-is-not-on-fire.expect.predict.options" = ["Les deux brûlent — la réaction est favorable aux deux températures", "Aucun ne brûle — 228 °C est loin d'être assez chaud", "Seul le second brûle. Quatre degrés font la différence entre rien et tout", "Le premier brûle lentement, le second rapidement"]
"why-the-shelf-is-not-on-fire.expect.predict.misconception" = "« La réaction libère de l'énergie, donc elle se produit » est la confusion la plus répandue en chimie, et la dernière option en est la forme plus douce — la croyance qu'une vitesse défavorable signifierait une réaction lente plutôt qu'une absence de réaction. L'équilibre dit où un système finirait ; il ne dit rien sur sa capacité à y parvenir. Un ruban de magnésium dans un tiroir est thermodynamiquement désespéré de devenir de l'oxyde, et y restera pourtant un siècle, parce qu'une pellicule d'oxyde lui barre la route."
"why-the-shelf-is-not-on-fire.expect.predict.diagnosis.0.reveals" = "La thermodynamique vue comme condition suffisante : de l'énergie libérée signifierait que cela se produit — la barrière entre ici et l'état final favorable n'aurait aucune place dans ce tableau."
"why-the-shelf-is-not-on-fire.expect.predict.diagnosis.0.next" = "L'expérience des quatre degrés rend la barrière visible : 224,3 °C, rien ; 228,4 °C, tout. La favorabilité n'a pas changé d'un seul joule entre ces deux lectures — l'accès, lui, a changé."
"why-the-shelf-is-not-on-fire.expect.predict.diagnosis.1.reveals" = "L'inflammation vue comme un extrême par définition : quelques centaines de degrés paraissent trop modestes pour qu'un métal s'enflamme, donc le seuil est imaginé quelque part de lointain et de spectaculaire."
"why-the-shelf-is-not-on-fire.expect.predict.diagnosis.1.next" = "Fais-le tourner : 228 °C dépasse le seuil de ce ruban, et à partir de là il grimpe à plus de 2000. Les seuils se situent là où le bilan les place, pas là où le suggère le sens du spectaculaire — c'est pourquoi cette entrée te demande de t'engager d'abord sur un chiffre."
"why-the-shelf-is-not-on-fire.expect.predict.diagnosis.2.reveals" = "La vitesse vue comme un cadran qui n'affiche jamais zéro : tout se produirait à une vitesse ou une autre, donc « défavorable » ne pourrait signifier que lent — « ne se produit pas » ne serait pas une réponse disponible."
"why-the-shelf-is-not-on-fire.expect.predict.diagnosis.2.next" = "Observe le ruban plus froid aussi longtemps que tu veux : pas de combustion lente, pas de gain de masse rampant sur la balance — rien. Le ruban resté un siècle dans un tiroir est la version longue du même essai ; la pellicule d'oxyde ne ralentit pas la réaction, elle lui barre la route."
"why-the-shelf-is-not-on-fire.registers.lv1" = "Deux rubans identiques. Chauffe l'un à 224 °C, et ce n'est qu'un ruban chaud. Chauffe l'autre quatre degrés de plus, et il éclate en un feu de deux mille degrés. Rien n'a changé ni dans le métal ni dans l'air — il existe une ligne, et tout dépend du côté où tu te trouves."
"why-the-shelf-is-not-on-fire.registers.lv2" = "L'équilibre dit que le magnésium dans l'air devrait être de l'oxyde de magnésium à toute température : ΔH = −601 kJ/mol, et ΔG est négatif de bout en bout. Ce n'est pas le cas, parce qu'une couche d'oxyde cohérente empêche l'oxygène d'atteindre le métal. Le banc code cela avec un seuil explicite à 500 K (226,85 °C) : en dessous, le solveur thermique se désactive et laisse les solides tranquilles, et 224,30 °C laisse 1,20 g de métal tandis que 228,40 °C donne 1,99 g d'oxyde."
"why-the-shelf-is-not-on-fire.registers.lv3" = "Ce seuil est un palliatif assumé, pas un modèle cinétique. Le moteur calcule l'équilibre, et l'équilibre oxyderait instantanément chaque métal du banc ; un traitement réel nécessiterait des énergies d'activation, une vitesse d'Arrhenius et un modèle de diffusion pour la couche passivante, ce qui relève de L5 et n'est pas câblé. Le geste honnête est de faire de cette frontière une constante nommée qu'un apprenant peut lire — KINETIC_THRESHOLD_K —, plutôt que de laisser l'équilibre mentir silencieusement sur le monde. Ne lis pas 226,85 °C comme la température d'inflammation du magnésium ; lis-le comme le moteur disant « c'est ici que vit la cinétique, et je ne la modélise pas »."
"a-spark-that-changes-nothing.summary" = "KCl + étincelle → KCl (flamme lilas, 5,00 g entrant, 5,00 g sortant)"
"a-spark-that-changes-nothing.expect.predict.question" = "Approche une flamme de 5,00 g de chlorure de potassium. La flamme devient lilas. Qu'affiche la balance ensuite, et quelle est la température du sel ?"
"a-spark-that-changes-nothing.expect.predict.options" = ["Plus léger, et chaud — une partie a brûlé pour produire la couleur", "5,00 g et 25 °C. Rien n'a brûlé ; la couleur est de la lumière, pas du feu", "Plus lourd — il s'est combiné à l'oxygène comme le magnésium"]
"a-spark-that-changes-nothing.expect.predict.misconception" = "Une flamme colorée ressemble à une combustion, donc le sel est présumé être le combustible. Ce n'est pas le cas : la flamme excite l'électron externe du potassium, et la couleur est ce que cet électron émet en retombant. Rien n'est consommé, et un test à la flamme sur un milligramme continuera aussi longtemps que tu le maintiens dedans. C'est aussi l'entrée qui montre à quoi ressemble un résultat négatif — trois choses qui ne se sont pas produites, chacune vérifiée."
"a-spark-that-changes-nothing.expect.predict.diagnosis.0.reveals" = "La couleur serait le reçu de la combustion : si ça brille, quelque chose serait consommé — la lumière sans combustible n'entrerait pas dans ce tableau."
"a-spark-that-changes-nothing.expect.predict.diagnosis.0.next" = "Pèse-le et prends sa température ensuite : 5,00 g, 25 °C — un résultat négatif où chaque négation est vérifiée. Le lilas est un électron qui retombe sur son étagère, pas de la matière qui s'échappe ; un milligramme colorerait la flamme aussi longtemps que tu voudrais l'y maintenir."
"a-spark-that-changes-nothing.expect.predict.diagnosis.1.reveals" = "Le modèle du magnésium, appliqué par analogie à tout solide dans une flamme : chose métallique plus feu égale oxyde plus gain de masse."
"a-spark-that-changes-nothing.expect.predict.diagnosis.1.next" = "Demande-toi ce qui devrait changer pour que le modèle s'applique : les ions du chlorure de potassium sont déjà dans leurs états stables, sans rien à offrir à l'oxygène. Le test à la flamme fonctionne *parce que* rien ne réagit — c'est précisément ce qui lui permet d'identifier un élément sans détruire l'échantillon."
"a-spark-that-changes-nothing.registers.lv1" = "Tiens le sel dans une flamme, et la flamme devient lilas — une couleur totalement différente de celle du même brûleur un instant plus tôt. Pèse le sel : inchangé. Touche-le une fois sorti de la flamme : froid. Tu as identifié le métal sans en consommer la moindre partie, ce pourquoi ce test a près de deux cents ans et reste utilisé."
"a-spark-that-changes-nothing.registers.lv2" = "Le banc rapporte un test à la flamme et rien d'autre : pas d'inflammation, pas de consommation, pas de gaz. 5,00 g entrant, 5,00 g sortant, 25,00 °C avant et après. Le potassium donne du lilas, le sodium du jaune, le calcium un rouge orangé — la couleur identifie le cation, et l'anion est invisible au test."
"a-spark-that-changes-nothing.registers.lv3" = "Deux choses distinctes sont affirmées, et elles proviennent de sources différentes. Que rien ne brûle est calculé : le minimiseur de Gibbs ne trouve aucun chemin exothermique, et le banc restitue le récipient exactement à l'identique. Que la flamme soit lilas est de la spectroscopie mise en scène — le doublet du potassium à 766,5/769,9 nm plus les raies violettes — car les bases de données thermodynamiques ne contiennent aucune donnée de transition électronique, et le laboratoire n'en invente aucune. À noter aussi : la composition d'équilibre contient des traces de Cl₂ au niveau du nanomole, et le banc refuse de les annoncer, car une trace n'est pas une observation."
"weigh-before-and-after.summary" = "5,844 g de NaCl + 100 mL d'eau = 105,54 g ; l'eau évaporée, il reste 5,84 g"
"weigh-before-and-after.expect.predict.question" = "Dissous 5,844 g de sel dans 100 mL d'eau — la cuve affiche 105,54 g. Fais bouillir l'eau jusqu'à ce qu'elle s'évapore. Qu'affiche la cuve maintenant ?"
"weigh-before-and-after.expect.predict.options" = ["0 g — tout s'est évaporé", "5,84 g — le sel reste", "105,54 g — la masse est conservée", "Moins de 5,84 g — un peu de sel part avec la vapeur"]
"weigh-before-and-after.expect.predict.misconception" = "Les jeunes apprenants pensent souvent que dissoudre détruit le sel, donc rien ne devrait rester ; les plus âgés, ayant appris la conservation, l'appliquent à la cuve et attendent les 105,54 g en entier. La mesure qui tranche est la paire — avant et après, sur la même balance —, ce pourquoi on note le premier chiffre avant de commencer plutôt qu'après avoir vu le second."
"weigh-before-and-after.expect.predict.diagnosis.0.reveals" = "Dissoudre aurait détruit le sel, donc bouillir ne ferait qu'achever la disparition — ce qui a disparu de la vue aurait disparu de l'existence."
"weigh-before-and-after.expect.predict.diagnosis.0.next" = "Fais-le bouillir et regarde dans la cuve : 5,84 g de cristaux, la masse qui est entrée, de retour sur la même balance. `particles` montre où se trouvait le sel tout ce temps — hors de vue n'a jamais été hors du registre."
"weigh-before-and-after.expect.predict.diagnosis.1.reveals" = "La conservation clouée à la cuve : la lecture serait le système, donc les 105,54 g en entier devraient survivre à l'ébullition."
"weigh-before-and-after.expect.predict.diagnosis.1.next" = "Pèse ce qui est parti : 99,7 g d'eau sont maintenant de la vapeur dans la pièce, emportant leur masse avec eux. La paire avant/après sur une balance est précisément l'instrument pour prendre en défaut une frontière mal tracée — c'est pourquoi le premier chiffre est noté en premier."
"weigh-before-and-after.expect.predict.diagnosis.2.reveals" = "L'évaporation vue comme un porteur général : tout ce qui est dans le liquide voyagerait avec la vapeur, saumure comprise."
"weigh-before-and-after.expect.predict.diagnosis.2.next" = "Vérifie ce que la vapeur peut porter : à ces températures, les ions du sel n'ont aucune voie vers le gaz, ce qui explique que faire évaporer l'eau de mer soit précisément la façon dont on *fabrique* le sel — et pourquoi le tartre de la bouilloire reste obstinément en place au lieu de s'évaporer."
"weigh-before-and-after.registers.lv1" = "Le sel a disparu dans l'eau, et tu ne peux plus le voir. Fais bouillir l'eau pour l'évaporer, et le voilà de retour, la même quantité qu'au départ. Il n'a jamais disparu — et la façon dont tu le sais, plutôt que de le croire, c'est que tu as noté le poids au préalable et peux comparer."
"weigh-before-and-after.registers.lv2" = "105,54 g avant, 5,84 g après : 99,70 g sont partis sous forme de vapeur d'eau, ce qui correspond aux 100 mL d'eau à 0,997 g/mL. Le sel récupéré, 5,84 g, correspond aux 5,844 g introduits — une récupération de 99,9 %. La quantité de matière est conservée à travers la dissolution et l'évaporation ; seule l'eau est allée quelque part."
"weigh-before-and-after.registers.lv3" = "Rien de tout cela n'est trivial dans le moteur : le solveur aqueux maintenait 0,1000 mol de Na⁺ et 0,1000 mol de Cl⁻ en solution, et l'évaporation à sec doit les restituer sous forme de NaCl solide sans en perdre une seule mole. Une limite utile à essayer ensuite : évapore en deux étapes plutôt qu'une, et le banc émet « pas encore modélisé » — du sel solide en contact avec le dernier film de liquide est un régime qu'aucun solveur câblé ne possède. Le chemin en une seule étape est net ; le chemin en deux étapes est honnête sur le fait de ne pas l'être."
"the-salt-comes-back-the-ribbon-does-not.summary" = "Dissoudre s'inverse quand l'eau s'en va ; brûler ne s'inverse à aucune température — la différence est de savoir si une nouvelle substance s'est formée"
"the-salt-comes-back-the-ribbon-does-not.expect.predict.question" = "Deux choses ont disparu sur ce banc : du sel a disparu dans l'eau, et un ruban de magnésium a disparu dans la flamme. Lequel des deux peux-tu défaire ?"
"the-salt-comes-back-the-ribbon-does-not.expect.predict.options" = ["Les deux — la chimie peut toujours être inversée si l'on est assez habile", "Aucun des deux — une fois qu'une substance a disparu, elle a disparu", "Seulement le sel : fais bouillir l'eau pour l'évaporer, et les cristaux reviennent ; aucune quantité de chauffage ou de refroidissement ne défait la combustion du ruban"]
"the-salt-comes-back-the-ribbon-does-not.expect.predict.misconception" = "Les deux disparitions sont le même événement pour l'œil et des événements opposés en dessous. Le sel est toujours du chlorure de sodium, caché sous forme d'ions — retire l'eau, et il doit revenir. Les atomes du ruban sont eux aussi tous encore là, mais dans une nouvelle compagnie : l'oxyde de magnésium est une nouvelle substance, et la température ne peut pas dissoudre une liaison chimique que la chaleur elle-même favorise. Distinguer ces deux disparitions est la définition même d'une réaction chimique."
"the-salt-comes-back-the-ribbon-does-not.expect.predict.diagnosis.0.reveals" = "La réversibilité vue comme de l'ingéniosité plutôt que comme une propriété de ce qui s'est passé — dissoudre et réagir classés comme le même type de disparition, à défaire avec le même type d'astuce."
"the-salt-comes-back-the-ribbon-does-not.expect.predict.diagnosis.0.next" = "Essaie les deux sur ce banc : évapore la saumure, et les cristaux reviennent, le registre de masse intact. Chauffe la cendre, refroidis-la, attends près d'elle — elle reste de l'oxyde de magnésium. La défaire exige un nouveau partenaire chimique et énormément d'énergie (l'industrie le fait par électrolyse du sel fondu), pas une application plus astucieuse de la chaleur."
"the-salt-comes-back-the-ribbon-does-not.expect.predict.diagnosis.1.reveals" = "La dissolution vue comme une destruction — le réflexe par défaut du jeune apprenant : le sel serait parti comme l'est le ruban, et parti signifierait parti."
"the-salt-comes-back-the-ribbon-does-not.expect.predict.diagnosis.1.next" = "La balance n'a jamais été d'accord : la saumure pèse le sel tout du long (`weigh-before-and-after`), et l'évaporation le rend sous forme de cristaux que tu peux compter en grammes. Les deux disparitions diffèrent par ce qui reste — la même substance cachée, ou une nouvelle substance formée — et cette différence est tout le contenu des mots « réaction chimique »."
"the-salt-comes-back-the-ribbon-does-not.registers.lv1" = "Le sel s'est caché dans l'eau — fais bouillir l'eau pour l'évaporer, et le voilà de retour, blanc et aux arêtes vives. Le ruban ne s'est pas caché : il *est devenu* quelque chose de nouveau, et aucune quantité de refroidissement ne le ramène. C'est la différence entre mélanger quelque chose et le changer vraiment."
"the-salt-comes-back-the-ribbon-does-not.registers.lv2" = "Dissoudre est un changement physique : NaCl(s) → Na⁺(aq) + Cl⁻(aq), inversé en retirant le solvant — évapore 95 % de l'eau, et 0,069 mol de cristaux reviennent, le reste étant toujours dissous dans les 5 mL restants. Brûler est un changement chimique : 2 Mg + O₂ → 2 MgO, une nouvelle substance aux propriétés nouvelles, qu'aucune température n'inverse."
"the-salt-comes-back-the-ribbon-does-not.registers.lv3" = "Les deux moitiés sont calculées, et toutes deux portent leurs petites lignes en bas de page. La saumure évaporée à 95 % contient 0,0692 mol de sel solide à côté de 0,031 mol encore en solution — la solubilité reste un rapport à l'eau restante jusqu'au dernier millilitre, ce qui est la soustraction de `crystallising-salt-from-brine` poussée presque jusqu'à son terme. Le côté de la cendre : le solveur thermique répond « oxyde de magnésium » à toute température que ce banc peut atteindre, parce que l'oxyde est énergétiquement en aval du métal partout — l'inverser n'est pas une question de température mais d'électrons, ce pourquoi l'industrie électrolyse le chlorure fondu plutôt que de chauffer l'oxyde. Une limite nommée explicitement : évaporer jusqu'à siccité *totale* laisse actuellement la dernière trace d'ions étiquetée aqueuse sans eau où être aqueuse — un état pour lequel le registre n'a pas encore d'histoire —, ce pourquoi cette entrée s'arrête à 95 %."
"a-nanomole-is-not-a-cloud.summary" = "1,5 µmol Ag⁺ + 1,5 µmol Cl⁻ dans 100 mL : du chlorure d'argent se forme, et aucune précipitation n'est signalée"
"a-nanomole-is-not-a-cloud.expect.predict.question" = "Deux bechers, tous deux au-dessus du produit de solubilité, si bien que du chlorure d'argent se forme dans les deux. Dans le premier, la quantité formée est de 0,16 µmol ; dans le second, 1,7 µmol. Que rapporte le banc ?"
"a-nanomole-is-not-a-cloud.expect.predict.options" = ["Un précipité dans les deux — la chimie est la même", "Un précipité dans aucun des deux — les deux sont bien trop dilués pour être vus", "Un précipité dans le second seulement : le premier est en dessous du seuil d'observation de 1 µmol"]
"a-nanomole-is-not-a-cloud.expect.predict.misconception" = "L'hypothèse non formulée est que, quoi que fasse la chimie, l'expérience le montre. Chaque instrument a un plancher, et en dessous, un changement réel ne produit aucun signal — ce n'est pas l'instrument qui ment, c'est l'instrument qui a une spécification. Confondre « je ne l'ai pas détecté » avec « cela ne s'est pas produit » est ainsi qu'un résultat négatif est surinterprété, et la solution est de connaître ta limite de détection avant de mesurer."
"a-nanomole-is-not-a-cloud.expect.predict.diagnosis.0.reveals" = "L'expérience montrerait tout ce que fait la chimie — les instruments vus comme des fenêtres transparentes, sans plancher propre."
"a-nanomole-is-not-a-cloud.expect.predict.diagnosis.0.next" = "Lis la spécification que ce banc publie sur lui-même : le seuil d'observation est d'un micromole. Les 0,16 µmol du premier becher sont réels, dans le registre, et en dessous du seuil — « non affiché » et « non présent » sont des énoncés différents, et un instrument honnête dit lequel des deux il veut dire."
"a-nanomole-is-not-a-cloud.expect.predict.diagnosis.1.reveals" = "Le bon instinct, non calibré : les limites de détection existent, mais elles se situeraient là où la prudence les imagine — et les deux quantités « semblent » invisibles."
"a-nanomole-is-not-a-cloud.expect.predict.diagnosis.1.next" = "Le seuil est un nombre, pas une humeur : 1 µmol ici. 1,7 se situe au-dessus et est rapporté ; 0,16 se situe en dessous et est nommé plutôt que montré. Connaître la limite *avant* de lancer l'expérience, c'est ce qui transforme « rien vu » en information plutôt qu'en haussement d'épaules."
"a-nanomole-is-not-a-cloud.registers.lv1" = "Deux bechers avec des pincées de produit chimique presque immesurablement petites. Quelque chose se produit vraiment dans les deux. Un seul des deux te montre quelque chose. Chaque appareil de mesure a la plus petite chose qu'il puisse remarquer, et en dessous, il ne dit absolument rien — ce qui n'est pas la même chose que s'il n'y avait rien."
"a-nanomole-is-not-a-cloud.registers.lv2" = "Les deux mélanges dépassent Ksp(AgCl) ≈ 1,8 × 10⁻¹⁰, donc du solide se forme dans les deux. Dans v1, seuls environ 0,16 µmol peuvent se former, en dessous du seuil d'observation du banc de 1 µmol, et aucun événement de précipitation n'est émis ; dans v2, environ 1,7 µmol se forme et l'événement se déclenche. `inspect` de v1 montre pourtant du chlorure d'argent dans son inventaire — la comptabilité est exacte, et seul le signalement est plafonné."
"a-nanomole-is-not-a-cloud.registers.lv3" = "Le seuil est OBSERVABLE_MOLES = 10⁻⁶ mol, appliqué uniformément à la précipitation, à la dissolution et au dégagement gazeux. C'est un substitut délibéré à une spécification d'instrument : un vrai turbidimètre, un vrai nez et une vraie balance ont tous des limites, et une simulation qui annoncerait chaque nanomole entraînerait un apprenant à attendre une sensibilité qu'aucun banc ne possède. Le chiffre est un choix de modélisation, pas une constante mesurée, et il vaut la peine de dire explicitement qu'un néphélomètre verrait AgCl bien en dessous, tandis qu'un œil ne le verrait pas bien au-dessus."
"when-the-lab-says-it-does-not-know.summary" = "gypse(s) + propanone(l) → non modélisé"
"when-the-lab-says-it-does-not-know.expect.predict.question" = "Du gypse est mélangé à de l'acétone au lieu d'eau. Que devrait faire un programme de chimie ?"
"when-the-lab-says-it-does-not-know.expect.predict.options" = ["Le dissoudre — il s'est dissous dans l'eau, donc il se dissout", "Dire « pas encore modélisé » : aucun solveur câblé ne couvre ce sel dans un solvant non aqueux", "Planter avec une erreur", "Laisser silencieusement le sel au fond, comme si c'était la réponse calculée"]
"when-the-lab-says-it-does-not-know.expect.predict.misconception" = "On attend d'un logiciel qu'il réponde. L'échec tentant est la dernière option — ne rien faire silencieusement et laisser le silence être lu comme un résultat, ce qui est indiscernable de « c'est insoluble » et se trouve être à peu près juste ici, pour une raison entièrement erronée. Un modèle qui ne peut pas te dire où il s'arrête ne t'a rien dit nulle part à quoi tu puisses te fier."
"when-the-lab-says-it-does-not-know.expect.predict.diagnosis.0.reveals" = "La solubilité appartiendrait au sel seul : il se dissout, un point c'est tout — le solvant serait un décor interchangeable plutôt que la moitié de toute dissolution."
"when-the-lab-says-it-does-not-know.expect.predict.diagnosis.0.next" = "Nomme ce que le solveur sait réellement : le comportement de l'eau, tiré d'une base de données thermodynamiques sur l'eau. Le gypse dans l'acétone est en fait pratiquement insoluble — mais le banc refuse même cette affirmation sans une ligne mise en scène qui le sache, et c'est la différence entre avoir raison et avoir de la chance."
"when-the-lab-says-it-does-not-know.expect.predict.diagnosis.1.reveals" = "Le logiciel n'aurait que deux états, réponse ou erreur : un « je ne sais pas » explicite ne ferait pas partie du vocabulaire, donc la seule alternative à répondre serait de planter."
"when-the-lab-says-it-does-not-know.expect.predict.diagnosis.1.next" = "Fais-le tourner : `not_yet_modelled` arrive comme un résultat à part entière, avec sa provenance, et la CI fait échouer toute leçon qui se tait au lieu de le dire. Le troisième état est toute la prémisse de ce programme — un modèle capable de nommer sa propre limite."
"when-the-lab-says-it-does-not-know.expect.predict.diagnosis.2.reveals" = "La plus subtile : le silence lu comme une réponse. Un programme qui ne fait rien aurait « dit » que le sel est insoluble — et avoir à peu près raison masque qu'absolument rien n'a été calculé."
"when-the-lab-says-it-does-not-know.expect.predict.diagnosis.2.next" = "Ce défaut exact figure dans l'histoire même du projet : « rien ne s'est enflammé » signifiait autrefois « aucun solveur engagé », rapporté comme si c'était un fait sur l'éthanol. La règle que cela a imposée — partout où le moteur refuse de modéliser quelque chose, il le dit — figure dans PLAN.md, et cette entrée est cette règle sous forme pédagogique."
"when-the-lab-says-it-does-not-know.registers.lv1" = "Demande au laboratoire quelque chose qu'il ne sait pas, et il te dit qu'il ne le sait pas. Il ne devine pas, et il ne prétend pas que le silence était une réponse. Connaître la limite de ce que l'on sait fait partie de savoir quoi que ce soit — et une personne capable de dire « je n'ai pas de méthode pour cela » est plus utile que celle qui a toujours un chiffre sous la main."
"when-the-lab-says-it-does-not-know.registers.lv2" = "Les bases de données du moteur aqueux sont paramétrées pour l'eau : les modèles d'activité, les produits de solubilité et la spéciation reposent tous sur des états standard aqueux. L'acétone est un liquide que le banc peut contenir et verser, et pour certains solutés dans certains solvants organiques, une ligne de manuel mise en scène répond désormais (la quasi-insolubilité de NaCl dans l'éthanol, la forte solubilité de CaCl2 dans l'acétone, par exemple) — mais pour ce sel dans ce solvant, aucune ligne n'existe encore, si bien que le passage d'honnêteté émet « pas encore modélisé » plutôt qu'un chiffre. La balance fonctionne toujours — l'acétone plus le sel —, car la comptabilité de masse n'est pas ce qui est en doute."
"when-the-lab-says-it-does-not-know.registers.lv3" = "L'événement est `NotYetModeled`, déclenché par le passage d'honnêteté lorsqu'un solide coexiste avec un liquide et qu'aucun solveur — ni aucun verdict mis en scène — ne couvre la paire. Il diffère structurellement de `SolverFailed`, qui signifie qu'un solveur câblé a essayé et n'a pas convergé. Cette entrée démontrait à l'origine l'écart avec NaCl dans l'éthanol, puis est passée à CuSO4 dans l'éthanol — les deux sont désormais couverts par l'échelon de solubilité organique mis en scène (CAP-23) avec des données de manuel. À mesure que la couverture s'étend, la démonstration se déplace vers la paire suivante non couverte ; les limites du modèle bougent, et un banc honnête déplace ses exemples avec elles. Ce paragraphe est la trace que cela s'est produit."
"a-steeper-barrier-breaks-the-rule-of-thumb.expect.predict.question" = "L'horloge au thiosulfate accélère d'un facteur 1,90 tous les dix degrés. Le peroxyde d'hydrogène qui se décompose de lui-même a une barrière bien plus élevée — 75 kJ/mol contre 51. Réchauffe-le de dix degrés. Que devient sa vitesse ?"
"a-steeper-barrier-breaks-the-rule-of-thumb.expect.predict.options" = ["Elle double aussi à peu près — la règle des dix degrés s'applique aux réactions, pas aux barrières", "Elle augmente d'un facteur environ 2,6 — une barrière plus raide est plus sensible à la température", "Elle augmente de moins du double — une réaction plus difficile est plus difficile à accélérer", "Rien de mesurable — la barrière est trop haute pour que dix degrés comptent"]
"a-steeper-barrier-breaks-the-rule-of-thumb.expect.predict.misconception" = "La troisième option est l'intuitive, et elle a la physique complètement à l'envers. Une barrière élevée ne rend pas une réaction paresseuse à se réchauffer ; elle la rend *plus* réactive, parce que la fraction des collisions franchissant la barrière est une exponentielle en Ea/RT, et qu'un Ea plus grand rend cette exponentielle plus raide. La première option confond la règle empirique avec une loi de la nature. Les deux sont guéries par la même observation : la sensibilité à la température est une propriété de la barrière, et c'est la seule chose qui a changé entre ces deux expériences."
"a-steeper-barrier-breaks-the-rule-of-thumb.expect.predict.diagnosis.0.reveals" = "La règle des dix degrés serait une propriété de la température, donc elle s'appliquerait à chaque réaction indifféremment."
"a-steeper-barrier-breaks-the-rule-of-thumb.expect.predict.diagnosis.0.next" = "Place les deux expériences côte à côte : même intégrateur, même horloge, mêmes dix degrés, facteurs de 1,90 et 2,62. La seule chose qui diffère entre elles est Ea, donc c'est de Ea que dépend le facteur."
"a-steeper-barrier-breaks-the-rule-of-thumb.expect.predict.diagnosis.1.reveals" = "Une barrière élevée signifierait une réaction obstinée, et les choses obstinées répondraient moins à une poussée."
"a-steeper-barrier-breaks-the-rule-of-thumb.expect.predict.diagnosis.1.next" = "Regarde où se situe Ea dans l'équation — à l'intérieur de l'exposant, divisé par RT. Essaie Ea = 150 kJ/mol dans le même calcul : le facteur pour dix degrés dépasse 6. Sensibilité et vitesse sont des questions différentes, et c'est ici l'endroit le plus net pour les séparer."
"a-steeper-barrier-breaks-the-rule-of-thumb.expect.predict.diagnosis.2.reveals" = "Une barrière de 75 kJ/mol serait un mur, si bien que dix degrés d'énergie thermique ne pourraient rien changer."
"a-steeper-barrier-breaks-the-rule-of-thumb.expect.predict.diagnosis.2.next" = "Compare 75 kJ/mol à RT à 298 K, soit 2,5 kJ/mol. La barrière fait trente fois l'énergie thermique moyenne, et la réaction se déroule quand même — parce que c'est la queue de la distribution qui réagit, pas la moyenne."
"a-steeper-barrier-breaks-the-rule-of-thumb.registers.lv1" = "Les mêmes dix degrés n'apportent pas la même accélération à chaque réaction. Pour l'horloge au soufre, c'était environ le double. Pour le peroxyde qui se décompose tout seul, c'est environ deux fois et demie — parce que la réaction du peroxyde est plus difficile à amorcer, et que tout ce qui est difficile à amorcer est plus reconnaissant de la chaleur supplémentaire."
"a-steeper-barrier-breaks-the-rule-of-thumb.registers.lv2" = "Trois bechers de 0,1 mol de peroxyde à 25, 35 et 45 °C, laissés trente minutes. Les avancements sont de 0,0007, 0,0019 et 0,0047 mol — des facteurs d'environ 2,7 et 2,5 par tranche de dix degrés, contre 1,90 pour l'horloge au thiosulfate. La seule chose qui diffère est l'énergie d'activation : 75 kJ/mol ici contre 51 là-bas. Remarque aussi qu'il faut trente minutes pour voir quoi que ce soit, alors que la réaction-horloge était terminée en moins d'une minute — une barrière plus raide signifie à la fois une réaction plus lente et une réaction plus sensible à la température, et ce sont deux conséquences distinctes du même nombre."
"a-steeper-barrier-breaks-the-rule-of-thumb.registers.lv3" = "Le rapport est exp[(Ea/R)(1/T₁ − 1/T₂)], donc pour Ea = 75 kJ/mol, les facteurs d'Arrhenius purs sur ces étapes sont de 2,67 et 2,51. Les avancements mesurés donnent 2,71 et 2,47 : le premier est légèrement haut à cause de l'arrondi, le second un peu bas parce que le becher le plus chaud commence à manquer de peroxyde, et un avancement sur trente minutes n'est plus un substitut net pour une vitesse initiale. Cet écart est la raison d'être des méthodes de vitesse initiale, et il est visible ici plutôt que simplement décrit. La règle des dix degrés correspond à Ea ≈ 50 kJ/mol à température ambiante, ce qui explique pourquoi l'horloge au thiosulfate lui obéit et pas celle-ci — la règle est la coïncidence d'une seule hauteur de barrière, pas une loi."
"three-beakers-of-peroxide.expect.predict.question" = "Trois flacons de peroxyde d'hydrogène à 1 mol/L. L'un reste seul, l'un reçoit un demi-gramme de dioxyde de manganèse, l'un reçoit un milligramme de catalase de foie. Après une seconde, combien de peroxyde reste-t-il dans chacun ?"
"three-beakers-of-peroxide.expect.predict.options" = ["À peu près la même chose dans les trois — une seconde ne suffit à rien", "99,8 %, 11 %, et plus rien du tout", "99,8 %, 50 % et 25 % — chaque catalyseur diviserait à peu près par deux ce qui reste", "Rien dans aucun des trois — un catalyseur ferait se produire la réaction, et elle allait se produire de toute façon"]
"three-beakers-of-peroxide.expect.predict.misconception" = "La troisième option traite les catalyseurs comme des choses venant en tailles ordinaires, quelques fois meilleures que rien. Tout l'intérêt de cette comparaison est que ce n'est pas le cas : l'enzyme n'est pas un peu meilleure que le minéral, elle est environ un million de fois meilleure, parce que les deux diffèrent de 35 kJ/mol dans l'exposant, et c'est dans l'exposant que réside la vitesse. La dernière option est la confusion plus ancienne — qu'un catalyseur déciderait *si* une réaction se produit. Ce n'est pas le cas. Les trois flacons finissent en eau et en oxygène ; le catalyseur ne décide que du quand."
"three-beakers-of-peroxide.expect.predict.diagnosis.0.reveals" = "Une seconde serait trop courte pour la chimie — les réactions se dérouleraient à l'échelle de temps d'une leçon."
"three-beakers-of-peroxide.expect.predict.diagnosis.0.next" = "Demande-toi ce qui fixe l'échelle de temps. Le flacon catalysé termine en moins de dix millisecondes ; une seconde n'est ni courte ni longue tant qu'une énergie d'activation ne le décide pas."
"three-beakers-of-peroxide.expect.predict.diagnosis.1.reveals" = "Les catalyseurs seraient classés comme tout le reste dans un laboratoire scolaire : meilleur, bien meilleur, quelques fois meilleur."
"three-beakers-of-peroxide.expect.predict.diagnosis.1.next" = "Place les barrières sur un diagramme : 75, 58, 23 kJ/mol, et l'accélération est exponentielle dans la différence. Entre le minéral et l'enzyme se trouve un facteur d'un million, ce qui n'est pas une différence de degré que l'intuition livre toute seule à qui que ce soit."
"three-beakers-of-peroxide.expect.predict.diagnosis.2.reveals" = "Un catalyseur serait ce qui fait que la réaction se produit ; sans lui, elle ne se produirait pas du tout."
"three-beakers-of-peroxide.expect.predict.diagnosis.2.next" = "Laisse le flacon simple tranquille pendant cinq jours (`same-destination-different-journey`). Il arrive au même endroit, 0,0485 mol d'oxygène et continuant de grimper vers 0,0500. Le catalyseur a décidé du quand, pas du si."
"three-beakers-of-peroxide.registers.lv1" = "Trois flacons du même peroxyde. Laisse-en un seul tranquille, et après une seconde, il a à peine changé. Ajoute une spatule de poudre noire, et neuf dixièmes sont déjà partis. Ajoute un grain d'enzyme de foie — un millième de gramme — et c'est terminé avant même que tu aies reposé le flacon. Même liquide, même pièce, même seconde."
"three-beakers-of-peroxide.registers.lv2" = "Énergies d'activation de 75, 58 et 23 kJ/mol pour aucun catalyseur, le dioxyde de manganèse et la catalase. Après une seconde, le flacon simple n'a rien fait que le banc rapporte même — 4 × 10⁻⁷ mol de réaction, en dessous du seuil observable — tandis que le dioxyde de manganèse a atteint 4 × 10⁻⁴ mol et la catalase a terminé : 5,0000 × 10⁻² mol, chaque molécule de peroxyde disparue. Le peroxyde restant se lit 0,1000, 0,0992 et 0,0000 mol. Même réaction, même température, même thermodynamique ; trois barrières."
"three-beakers-of-peroxide.registers.lv3" = "Les accélérations sont exponentielles dans la différence entre les barrières et ne dépendent de rien d'autre, ce pourquoi elles sont les chiffres durables ici, contrairement aux temps absolus. exp[(75 − 58) kJ·mol⁻¹ / RT] = 951 à 298,15 K, et exp[(58 − 23)/RT] = 1,36 × 10⁶ — le minéral est donc environ mille fois meilleur que rien, et l'enzyme environ un million de fois meilleure que le minéral. Pour le voir, il vaut mieux lire les vitesses que les avancements : dès qu'un récipient catalysé sature dans l'intervalle, son avancement est borné par le peroxyde et ne rapporte plus aucune vitesse. Le facteur préexponentiel est calibré plutôt que mesuré, si bien que les secondes sont indicatives ; les rapports, eux, ne le sont pas, car A s'annule."
"a-catalyst-comes-out-as-it-went-in.summary" = "0,001 g de catalase détruit trois portions successives de 0,1 mol de peroxyde, chacune en une seconde, et se retrouve à 4,16666667 × 10⁻⁹ mol à la fin"
"a-catalyst-comes-out-as-it-went-in.expect.predict.question" = "Un milligramme de catalase détruit 0,1 mol de peroxyde d'hydrogène en une seconde. Tu ajoutes une seconde portion de 0,1 mol dans le même flacon. Que se passe-t-il ?"
"a-catalyst-comes-out-as-it-went-in.expect.predict.options" = ["Rien — la catalase a été épuisée en détruisant la première portion", "Cela se passe tout aussi vite — la catalase est intacte, et la seconde portion prend la même seconde", "Cela va deux fois moins vite — la moitié de la catalase a été consommée", "Cela va plus vite — le flacon est maintenant réchauffé"]
"a-catalyst-comes-out-as-it-went-in.expect.predict.misconception" = "« Épuisé » est l'hypothèse par défaut pour tout ce qui participe à une réaction, et elle est renforcée par le fait qu'un catalyseur doit bien être ajouté en premier lieu. Les première et troisième options en sont toutes deux des versions. Ce qui rend la démonstration convaincante, c'est la répétition : une seule portion ne prouve rien, mais trois portions identiques détruites à vitesse identique par le même grain d'enzyme sont difficiles à expliquer autrement. La dernière option est un effet réel dans un vrai flacon — cette décomposition est exothermique — et le banc ne le modélise pas, ce que l'entrée énonce plutôt que de laisser cette option passer silencieusement pour fausse, pour la mauvaise raison."
"a-catalyst-comes-out-as-it-went-in.expect.predict.diagnosis.0.reveals" = "Tout ce qu'on ajoute à une réaction serait un réactif, et les réactifs seraient consommés."
"a-catalyst-comes-out-as-it-went-in.expect.predict.diagnosis.0.next" = "Ajoute la troisième portion et observe-la se dérouler à la même vitesse. Demande-toi ensuite ce que la catalase devrait faire pour survivre à être « épuisée » deux fois."
"a-catalyst-comes-out-as-it-went-in.expect.predict.diagnosis.1.reveals" = "Un catalyseur serait partiellement consommé — dépensé proportionnellement à la quantité de réaction qu'il a entraînée, comme un carburant."
"a-catalyst-comes-out-as-it-went-in.expect.predict.diagnosis.1.next" = "Compare les chiffres : 4,17 × 10⁻⁹ mol de catalase contre 0,1 mol de peroxyde par portion, soit vingt-quatre millions de molécules de peroxyde par molécule d'enzyme. Tout ce qui serait consommé proportionnellement aurait été épuisé dès la première microseconde."
"a-catalyst-comes-out-as-it-went-in.expect.predict.diagnosis.2.reveals" = "Le flacon se réchaufferait à cause d'une réaction exothermique, donc la seconde portion devrait être plus rapide."
"a-catalyst-comes-out-as-it-went-in.expect.predict.diagnosis.2.next" = "Physique juste, absente de ce modèle. Vérifie le thermomètre : le banc maintient le flacon à 25,0 °C tout du long, car aucune enthalpie de réaction n'est câblée dans le moteur de vitesse. Il vaut la peine de savoir laquelle de tes prédictions correctes ce laboratoire ne peut pas confirmer."
"a-catalyst-comes-out-as-it-went-in.registers.lv1" = "Un grain d'enzyme de foie, trop petit pour être vraiment vu, et un flacon de peroxyde. Une seconde, et le peroxyde a disparu. Ajoute plus de peroxyde : disparu à nouveau, tout aussi vite. Ajoute-en encore : disparu à nouveau. Le grain est toujours là et continue de travailler. Ce n'est pas un ingrédient — c'est une porte que traverse la réaction et qu'elle laisse intacte derrière elle."
"a-catalyst-comes-out-as-it-went-in.registers.lv2" = "0,001 g de catalase représente 4,16666667 × 10⁻⁹ mol à M ≈ 240 kDa. Chacune des trois portions de 0,1 mol est détruite en une seconde, 5,0000 × 10⁻² mol de réaction à chaque fois, et l'inventaire du banc rapporte, après la troisième, les mêmes 4,16666667 × 10⁻⁹ mol de catalase qu'avant la première — identiques jusqu'au dernier chiffre affiché. L'oxygène s'accumule jusqu'à 0,15 mol, trois fois le rendement d'une seule portion, comme il se doit."
"a-catalyst-comes-out-as-it-went-in.registers.lv3" = "Le mécanisme derrière cette affirmation mérite un regard, car il est de nature structurelle, non numérique. `KineticReaction` garde `catalysts` en dehors de `reactants` et `products` ; l'intégrateur ne prélève et ne restitue que ce que nomment ces deux listes, si bien qu'un catalyseur n'est jamais un terme du bilan de masse et ne peut pas dériver. Ce qu'il fait à la place est redéterminé à chaque sous-étape par `effective_activation_energy`, qui parcourt le récipient à la recherche du meilleur catalyseur disponible et utilise sa barrière. Deux lacunes honnêtes se tiennent à côté. Le laboratoire ne modélise pas la chaleur de la décomposition, si bien qu'un vrai flacon qui se réchaufferait et réagirait donc plus vite n'est pas visible ici. Et une vraie enzyme n'est pas indestructible : la catalase se dénature sous la chaleur, peut être inhibée, et travaille avec une vitesse maximale finie qu'aucune substitution de barrière ne peut exprimer — une saturation de Michaelis-Menten pour laquelle ce moteur n'a pas de terme."
"first-order-means-a-constant-half-life.expect.predict.question" = "0,1 mol de peroxyde d'hydrogène sur du dioxyde de manganèse à 25 °C. Les quatre-vingt-dix premières secondes détruisent 0,0501 mol — un peu plus de la moitié. Combien les quatre-vingt-dix secondes suivantes détruisent-elles ?"
"first-order-means-a-constant-half-life.expect.predict.options" = ["0,0499 mol — le reste, au même rythme régulier", "0,0250 mol — la moitié de ce qui reste, parce que la vitesse chute avec la concentration", "0,0501 mol à nouveau — la réaction a une vitesse fixe jusqu'à épuisement", "Rien — c'est terminé"]
"first-order-means-a-constant-half-life.expect.predict.misconception" = "Les première et troisième options sont la même erreur sous deux déguisements : qu'une réaction aurait une vitesse comme une voiture a une vitesse, si bien qu'un temps fixe détruirait une quantité fixe. C'est à quoi ressemble l'ordre zéro, et c'est rare. L'ordre un signifie que la vitesse est proportionnelle à ce qui reste, si bien que chaque intervalle égal retire une *fraction* égale — c'est pourquoi la demi-vie est constante et pourquoi la réaction a une longue traîne fine plutôt qu'une fin."
"first-order-means-a-constant-half-life.expect.predict.diagnosis.0.reveals" = "La réaction aurait une vitesse en mol par minute, si bien qu'elle terminerait le travail à l'intervalle suivant."
"first-order-means-a-constant-half-life.expect.predict.diagnosis.0.next" = "Ajoute un quatrième intervalle, puis un cinquième. Une quantité fixe par intervalle aurait atteint zéro et se serait arrêtée ; le banc retire encore du peroxyde mesurable une heure plus tard."
"first-order-means-a-constant-half-life.expect.predict.diagnosis.1.reveals" = "La vitesse serait fixe jusqu'à épuisement du réactif, moment où elle s'arrêterait — l'image de l'ordre zéro, appliquée par défaut."
"first-order-means-a-constant-half-life.expect.predict.diagnosis.1.next" = "Trace les trois quantités consommées : 0,0502, 0,0250, 0,0125. Des quantités égales formeraient une droite descendant jusqu'à zéro ; des fractions égales forment une courbe avec une traîne, et la différence est visible sur trois points."
"first-order-means-a-constant-half-life.expect.predict.diagnosis.2.reveals" = "Un peu plus de la moitié est partie au premier intervalle, donc la réaction serait essentiellement terminée."
"first-order-means-a-constant-half-life.expect.predict.diagnosis.2.next" = "Lis la quantité restante plutôt que la quantité consommée : 0,0498 mol est toujours là, la moitié de ce avec quoi tu as commencé. « La majeure partie du changement s'est produite » et « la majeure partie de la matière a disparu » sont des énoncés différents."
"first-order-means-a-constant-half-life.registers.lv1" = "Le peroxyde laissé seul se décompose lentement en eau et en oxygène. Cinq minutes en emportent la moitié. Les cinq minutes suivantes emportent la moitié de ce qui reste, pas la moitié de la quantité de départ — donc un quart. Puis un huitième. Il n'arrive jamais tout à fait à rien, ce pourquoi un vieux peroxyde est faible plutôt que vide."
"first-order-means-a-constant-half-life.registers.lv2" = "Des intervalles successifs de quatre-vingt-dix secondes consomment 0,0501, 0,0250 et 0,0125 mol de peroxyde, laissant 0,0499, 0,0249 et 0,0124 mol des 0,1 mol de départ. Chaque intervalle laisse 49,9 % de ce qu'il a reçu — la même fraction à chaque fois, ce que signifie l'ordre un. La demi-vie est donc une constante, ici d'environ 90 s, et une heure plus tard, il ne reste rien de mesurable. Le dioxyde de manganèse sert à faire finir l'expérience dans le temps d'une leçon : sans lui, la demi-vie est d'environ un jour — c'est bien pour cela qu'un catalyseur vaut la peine."
"first-order-means-a-constant-half-life.registers.lv3" = "La constance est le contrôle, pas l'histoire elle-même. d[H₂O₂]/dt = −2k[H₂O₂], parce que la loi de vitesse est d'ordre un tandis que le coefficient stœchiométrique est 2, donc [H₂O₂](t) = c₀·e^(−2kt) et t½ = ln2/(2k) — remarque le facteur deux, exactement là où ordre et coefficient sont des grandeurs distinctes que l'on confond facilement. Sur le dioxyde de manganèse, la barrière est de 58 kJ/mol, donnant k = 3,86 × 10⁻³ s⁻¹ à 298,15 K et t½ = 89,7 s, si bien qu'un intervalle de 90 s représente un peu plus d'une demi-vie et laisse 49,9 % plutôt qu'exactement 50 % — obtenu à partir de la barrière plutôt qu'ajusté sur l'observation. Remarque ce que le catalyseur ne change *pas* : la fraction reste constante, parce qu'abaisser l'énergie d'activation met k à l'échelle sans toucher à l'ordre. Cette forme fermée sert aussi d'oracle à l'intégrateur — `kinetics.rs` vérifie son solveur adaptatif du point milieu contre e^(−2kt) plutôt que contre une autre méthode numérique, ce qui a permis de détecter une dérive de 0,7 % dans la version originale à Euler explicite."
"the-oxygen-is-counted-but-never-seen.summary" = "0,05 mol d'oxygène — environ 1,2 L — se trouve dans le flacon ; tu le vois pétiller et tu ne peux pas le mesurer."
"the-oxygen-is-counted-but-never-seen.expect.predict.question" = "La catalase détruit 0,1 mol de peroxyde, libérant 0,05 mol d'oxygène — environ 1,2 litre, tout l'intérêt de la démonstration. Le banc rapporte des bulles qui montent. Que peux-tu faire de ce gaz ?"
"the-oxygen-is-counted-but-never-seen.expect.predict.options" = ["Lire son volume sur la seringue à gaz, c'est ainsi que se mesure la vitesse", "Le voir, et rien d'autre — aucun volume n'est mesurable ici, et aucun événement de dégagement gazeux ne se déclenche", "Rien : les bulles ne sont qu'une image, l'oxygène n'est donc pas vraiment compté", "Le recueillir et le peser, puisque la balance suit tout dans le récipient"]
"the-oxygen-is-counted-but-never-seen.expect.predict.misconception" = "Celle-ci ne concerne pas la chimie, et prétendre le contraire serait le geste malhonnête. La comptabilité du moteur est juste — 0,05 mol de O₂ représente exactement la moitié du peroxyde, elle est là dans le récipient et désormais visible sous forme de bulles. Ce qui manque encore se situe en aval : il n'y a pas de seringue à gaz, pas de lecture de volume, et le moteur de vitesse dépose les produits dans une phase sans déclencher l'événement `gas_evolved` que déclenchent les solveurs aqueux et thermique. La mesure réelle de la manipulation — millilitres contre secondes — ne peut donc pas être effectuée. Une simulation possède une couche modèle et une couche de présentation, et elles peuvent échouer indépendamment l'une de l'autre — cela vaut la peine de le savoir pour toute simulation qu'on te confie."
"the-oxygen-is-counted-but-never-seen.expect.predict.diagnosis.0.reveals" = "Tout ce que mesure une manipulation réelle, la simulation devrait aussi le mesurer — si la chimie est juste, les instruments devraient être là."
"the-oxygen-is-counted-but-never-seen.expect.predict.diagnosis.0.next" = "Sépare les deux niveaux. Lis l'inventaire du récipient (0,05 mol de O₂, correct jusqu'au dernier chiffre), puis demande-toi quel instrument t'en donnerait un chiffre. L'appareillage est une décision de modélisation, et ce banc ne l'a pas encore prise."
"the-oxygen-is-counted-but-never-seen.expect.predict.diagnosis.1.reveals" = "Une image serait de la décoration, donc tout ce qu'on ne peut que voir ne serait pas vraiment dans le modèle."
"the-oxygen-is-counted-but-never-seen.expect.predict.diagnosis.1.next" = "L'inverse de la première erreur, et tout aussi faux. Demande au récipient ce qu'il contient : l'oxygène y est jusqu'au dernier chiffre, et les bulles sont dessinées *à partir de* ce chiffre plutôt qu'à sa place."
"the-oxygen-is-counted-but-never-seen.expect.predict.diagnosis.2.reveals" = "Tout changement dans le flacon devrait se traduire par un changement de ce qu'on voit, et l'oxygène serait faiblement bleuté en masse."
"the-oxygen-is-counted-but-never-seen.expect.predict.diagnosis.2.next" = "Vrai pour l'oxygène liquide à −183 °C, sans rapport ici. Le banc calcule la couleur à partir de spectres d'absorption mis en scène, et le gaz oxygène à 1 atm n'en possède aucun digne de ce nom — c'est donc le cas rare où « pas de changement de couleur » est la bonne réponse, pour la bonne raison."
"the-oxygen-is-counted-but-never-seen.registers.lv1" = "Le flacon est plein d'oxygène — assez pour remplir une grande bouteille de boisson — et tu le vois pétiller à travers le liquide. Ce que tu ne peux pas faire, c'est le mesurer. Dans un vrai laboratoire, tu pousserais le gaz dans une seringue et lirais combien de millilitres arrivent toutes les dix secondes, et cette lecture *est* l'expérience. Ce laboratoire n'a pas encore reçu de seringue à gaz. Savoir quelle partie d'une réponse relève du calcul et quelle partie relève de l'équipement est une habitude utile à avoir face à toute simulation."
"the-oxygen-is-counted-but-never-seen.registers.lv2" = "Le récipient contient 5,0000 × 10⁻² mol de O₂ en phase gazeuse après une seconde, soit 1,6 g et, comme gaz idéal à 25 °C et 1 atm, environ 1,22 L. `look` rapporte désormais des bulles montant à travers le liquide. Ce qu'il ne peut pas rapporter, c'est un volume : il n'y a pas d'appareil de collecte de gaz, ni d'événement `gas_evolved`, parce que le moteur de vitesse dépose ses produits dans une phase alors que seuls les solveurs aqueux et thermique déclenchent des événements de dégagement gazeux. La quantité est exacte, et la mesure manque."
"the-oxygen-is-counted-but-never-seen.registers.lv3" = "`appearance::observe` construit trois choses — une couleur transmise selon Beer-Lambert sur des ε(λ) mis en scène, une turbidité issue du solide en suspension par litre, et un dépôt — puis fixe `bubbling: false` comme une valeur littérale, le champ de la structure étant documenté comme « si quelque chose est visiblement non-liquide-non-déposé ». Le champ existe donc, les données pour le remplir existent dans les portions en phase gazeuse du récipient, et le lien entre les deux n'a pas été établi. C'est une lacune du moteur de rendu plutôt que du modèle, ce qui la place dans une catégorie différente du reste de ce fichier : elle est bon marché à combler, ne coûte aucune chimie, et rend actuellement invisible la manipulation la plus visuelle de toute la cinétique scolaire. Consigné ici afin que personne ne bâtisse une leçon sur l'observation d'un flacon qui pétille avant que ce ne soit corrigé."
"same-destination-different-journey.expect.predict.question" = "Deux flacons de peroxyde, l'un avec de la catalase. Après une seconde, le flacon catalysé est terminé et l'autre a perdu 0,2 %. Deux heures plus tard, que contiennent-ils ?"
"same-destination-different-journey.expect.predict.options" = ["Le flacon catalysé contient plus d'oxygène — le catalyseur a fait se produire plus de réaction", "La même chose : 0,05 mol d'oxygène dans chacun. Le catalyseur a changé le quand, pas le si ni le combien", "Le flacon simple contient toujours la majeure partie de son peroxyde — sans catalyseur, la réaction ne se déroule pas", "Le flacon catalysé a commencé à s'inverser, puisque le catalyseur agit dans les deux sens"]
"same-destination-different-journey.expect.predict.misconception" = "La première option est la croyance la plus courante des apprenants sur les catalyseurs, et c'est une affirmation sur le *rendement*, précisément la seule chose qu'un catalyseur ne peut pas toucher. Un catalyseur abaisse la barrière également dans les deux sens, il rapproche donc le système de l'équilibre plus vite et ne déplace pas du tout cet équilibre. La troisième option est l'erreur en miroir — traiter une barrière comme une interdiction. La barrière ici est de 75 kJ/mol, suffisante pour qu'une seconde ait l'air de rien du tout, et loin d'être suffisante pour survivre à cinq jours."
"same-destination-different-journey.expect.predict.diagnosis.0.reveals" = "Un catalyseur augmenterait le rendement — davantage de réaction se produirait parce que le catalyseur l'aurait aidée à se produire."
"same-destination-different-journey.expect.predict.diagnosis.0.next" = "Compte l'oxygène dans les deux flacons à la fin : 0,0500 mol dans le catalysé, 0,0485 mol dans le simple et continuant de grimper vers le même chiffre. Demande-toi ensuite ce qu'un catalyseur pourrait bien changer à un bilan de masse."
"same-destination-different-journey.expect.predict.diagnosis.1.reveals" = "Sans catalyseur, la réaction ne se produirait pas — la barrière serait une interdiction plutôt qu'un délai."
"same-destination-different-journey.expect.predict.diagnosis.1.next" = "Regarde le flacon simple à 1 s et à cinq jours : 0,1000 mol restant, puis 0,0030 mol. La même barrière qui fait qu'une seconde a l'air de rien laisse cinq jours presque achever le travail. « Trop lent pour être vu » et « ne se produit pas » sont des états différents, et un seul des deux est tranché par la thermodynamique."
"same-destination-different-journey.expect.predict.diagnosis.2.reveals" = "Un catalyseur entraînerait une réaction, donc quand il n'y aurait plus rien à entraîner, il devrait pousser dans l'autre sens."
"same-destination-different-journey.expect.predict.diagnosis.2.next" = "Un catalyseur abaisse la barrière également dans les deux sens, il accélère donc l'approche de l'équilibre et ne peut pas le déplacer. L'équilibre de cette décomposition se situe pour l'essentiel tout d'un côté — il n'y a rien vers quoi revenir."
"same-destination-different-journey.registers.lv1" = "Deux flacons, et seul l'un contient l'enzyme. Après une seconde, le flacon de l'enzyme est terminé, et l'autre semble intact. Reviens dans cinq jours, et le lent a presque rattrapé son retard : les deux se transforment en eau et en oxygène, et les deux finissent au même endroit. L'enzyme n'a pas décidé de ce qui se passerait. Elle a décidé combien de temps il faudrait attendre — une seconde contre presque une semaine entière."
"same-destination-different-journey.registers.lv2" = "Après 1 s : 0,1000 mol de peroxyde toujours dans le flacon simple — la réaction a avancé de 4 × 10⁻⁷ mol, ce que le banc ne rapportera même pas — contre pratiquement zéro dans le flacon catalysé, qui contient déjà ses pleins 0,0500 mol d'oxygène. Cinq jours plus tard, le flacon simple a atteint 0,0485 mol d'oxygène, avec encore 0,0030 mol de peroxyde à parcourir. Même destination ; l'un a mis une seconde, l'autre est toujours en train d'arriver."
"same-destination-different-journey.registers.lv3" = "C'est la distinction sur laquelle repose `thermodynamische-vs-kinetische-kontrolle`, abordée ici du côté de la cinétique plutôt que de l'équilibre, et le moteur incarne les deux moitiés en des endroits différents. Du côté thermodynamique, il retient la ténorite en dessous de 340 K et désactive le solveur thermique en dessous de 500 K — des substituts mis en scène pour des vitesses qu'il ne pouvait pas calculer. Ici, la vitesse est calculée, si bien que la même idée apparaît comme un intervalle plutôt que comme un seuil : rien n'est supprimé, et « cela ne s'est pas encore produit » est un état dans lequel le récipient peut se trouver puis quitter. Le facteur préexponentiel est calibré de sorte qu'un peroxyde non perturbé ait une demi-vie proche d'un jour : assez long pour que rien ne se passe pendant que tu regardes, ce qui est le but, et pourtant bien plus court que le vrai peroxyde stabilisé à 3 % dans une bouteille brune, qui se conserve des mois. La *forme* de l'argument est donc juste, et la durée de conservation n'est pas une mesure."
"permanganate-counts-in-fives.expect.predict.question" = "Un demi-millimole de permanganate de potassium est versé dans un becher contenant cinq millimoles de fer(II) en milieu sulfurique dilué. Quelle quantité de fer se retrouve sous forme de fer(III) ?"
"permanganate-counts-in-fives.expect.predict.options" = ["0,0005 mol — un permanganate oxyde un fer", "0,0025 mol — chaque permanganate en prend exactement cinq", "Les 0,005 mol en entier — le permanganate est l'oxydant le plus puissant du placard de chimie"]
"permanganate-counts-in-fives.expect.predict.misconception" = "Deux erreurs de comptage, une seule racine : les réactions sont imaginées particule à particule. Or le taux d'échange est fixé par les électrons, pas par les unités formulaires — chaque manganèse tombe de +7 à +2 et accepte cinq électrons, chaque fer monte d'un cran et en cède un. Et la force n'est pas un appétit : à quel point un oxydant peut tirer des électrons ne dit rien sur combien il peut en retenir."
"permanganate-counts-in-fives.expect.predict.diagnosis.0.reveals" = "Les réactions s'apparieraient unité formulaire contre unité formulaire — une particule, une victime. Le registre électronique sous-jacent n'aurait aucune ligne dans ce tableau."
"permanganate-counts-in-fives.expect.predict.diagnosis.0.next" = "Compte les électrons plutôt que les particules : le manganèse tombe de +7 à +2, cinq gagnés ; chaque fer monte de +2 à +3, un cédé. `inspect` montre que le becher a fait ce calcul — 0,0025 mol oxydée, exactement cinq par permanganate."
"permanganate-counts-in-fives.expect.predict.diagnosis.1.reveals" = "La force lue comme un appétit : un oxydant fort « prendrait tout », comme si la puissance multipliait la capacité."
"permanganate-counts-in-fives.expect.predict.diagnosis.1.next" = "La force dit à quel point les électrons chutent, pas combien l'oxydant peut en attraper : 0,0005 mol de Mn(VII) a de la place pour exactement 0,0025 mol d'entre eux. `inspect` le reste du fer — toujours Fe(II), en attente de plus d'oxydant, ce qui rend d'ailleurs possible la titration elle-même."
"permanganate-counts-in-fives.registers.lv1" = "Le violet disparaît au moment même où il arrive — le becher boit la couleur. Et il boit selon un décompte strict : chaque mesure de violet consomme exactement cinq mesures du fer dissous. Jamais quatre, jamais six."
"permanganate-counts-in-fives.registers.lv2" = "MnO₄⁻ + 5 Fe²⁺ + 8 H⁺ → Mn²⁺ + 5 Fe³⁺ + 4 H₂O. Le manganèse gagne cinq électrons, chaque fer en cède un, si bien que 0,0005 mol de permanganate oxyde exactement 0,0025 mol de fer — et le banc lit : Fe : 50 % Fe(III), 50 % Fe(II)."
"permanganate-counts-in-fives.registers.lv3" = "Le rapport 5:1 n'est codé nulle part. Le moteur maintient un unique bilan électronique à travers les éléments couplés et minimise l'énergie libre ; le rapport en découle, à quatre chiffres près — 0,002500 mol de chaque état du fer dans l'inventaire. Deux autres choses que le lecteur attentif devrait remarquer : le pH est monté de 1,42 à 1,65, parce que la réaction a consommé huit protons par permanganate — l'acide est un réactif, pas un décor — et le banc nomme ce qu'il refuse de modéliser : le Fe(III) frais est sursaturé par rapport à l'hématite et à la goethite, des phases que connaît wateq4f.dat mais que ce registre ne peut pas encore nommer, si bien qu'elles sont signalées plutôt que silencieusement précipitées."
"half-oxidised-iron-reads-its-own-potential.summary" = "À demi-oxydation, Eh affiche le propre potentiel formel du couple Fe(III)/Fe(II) — +0,674 V ici, en dessous des 0,771 V tabulés, parce que le sulfate lie le Fe(III) plus fortement que le Fe(II)"
"half-oxidised-iron-reads-its-own-potential.expect.predict.question" = "Arrête la titration au permanganate exactement à mi-chemin : la moitié du fer est du Fe(II), la moitié du Fe(III). Un voltmètre contre une électrode standard à hydrogène affiche…"
"half-oxidised-iron-reads-its-own-potential.expect.predict.options" = ["+0,77 V — le E° tabulé de Fe³⁺/Fe²⁺", "Environ +0,67 V — nettement en dessous de la table", "+1,51 V — le propre E° du permanganate, puisque c'est lui qui a fait l'oxydation"]
"half-oxidised-iron-reads-its-own-potential.expect.predict.misconception" = "Les 0,771 V tabulés décrivent des ions aquo nus à activité unitaire, et ce becher n'a ni l'un ni l'autre : le sulfate lie le Fe(III) bien plus fortement que le Fe(II), tirant vers le bas l'activité du Fe(III) libre et le potentiel avec elle. Ce que lit l'appareil, c'est le potentiel formel dans ce milieu — le chiffre que les analystes utilisent réellement. Et 1,51 V confond l'agent avec l'état : le permanganate est épuisé, et un couple dont un seul membre est présent n'a aucun potentiel à imposer."
"half-oxidised-iron-reads-its-own-potential.expect.predict.diagnosis.0.reveals" = "La table serait l'appareil : E° comme la lecture fixe du couple, le milieu étant sans importance — le jumeau redox de lire le pKa comme le pH de n'importe quel flacon d'acide."
"half-oxidised-iron-reads-its-own-potential.expect.predict.diagnosis.0.next" = "Ce laboratoire a déjà enseigné deux fois la leçon de la constante conditionnelle avec des protons — `half-neutralised-vinegar` et `phosphate-buffer` — et la voici transposée aux électrons. Regarde la spéciation lv3 : la majeure partie du Fe(III) se trouve liée sous forme de FeSO₄⁺ et Fe(SO₄)₂⁻ tandis que le Fe(II) nage presque libre ; ce déséquilibre est le 0,1 V manquant."
"half-oxidised-iron-reads-its-own-potential.expect.predict.diagnosis.1.reveals" = "Le potentiel appartiendrait à l'acteur le plus fort : le permanganate a fait l'oxydation, donc son chiffre devrait être la réponse — même une fois le permanganate disparu."
"half-oxidised-iron-reads-its-own-potential.expect.predict.diagnosis.1.next" = "`inspect` le becher : le permanganate est épuisé jusqu'au dernier nanomole, et un couple dont un seul membre est présent n'a rien à dire à une électrode. L'appareil écoute le couple dont les deux membres nagent encore — Fe(III)/Fe(II), à 50/50."
"half-oxidised-iron-reads-its-own-potential.registers.lv1" = "Arrête-toi à mi-chemin, et le becher tient un équilibre parfait : la moitié du fer a changé, la moitié non. Un appareil plongé maintenant affiche le chiffre propre du fer — la marque qu'il affiche toujours quand il est exactement à mi-chemin de son changement."
"half-oxidised-iron-reads-its-own-potential.registers.lv2" = "À [Fe³⁺] = [Fe²⁺], le terme logarithmique de l'équation de Nernst s'annule, et Eh = E°′ — exactement comme un acide faible à demi neutralisé affiche son propre pKa. Le banc rapporte pe 11,40, soit Eh = +0,674 V."
"half-oxidised-iron-reads-its-own-potential.registers.lv3" = "La table dit 0,771 V ; cet appareil dit 0,674 V, et les deux ont raison — à propos de solutions différentes. Le E° tabulé suppose des ions aquo nus à activité unitaire. Ici, la spéciation calculée montre que le Fe(III) est majoritairement lié sous forme de FeSO₄⁺ et Fe(SO₄)₂⁻ tandis que le Fe(II) est à peine complexé, si bien que l'activité du Fe(III) libre — ce à quoi répond réellement l'électrode — est abaissée, et le potentiel chute avec elle. La chimie analytique appelle ce résultat le potentiel formel et cite environ 0,68 V pour ce couple en milieu sulfurique ; le banc y est parvenu à partir des constantes de complexation de la base de données, sans qu'on le lui dise. C'est la leçon du tampon phosphate — la constante est conditionnelle au milieu — transposée des protons aux électrons."
"the-oxidant-is-spent-to-the-last-electron.expect.predict.question" = "Maintenant, la totalité des 0,001 mol de permanganate — exactement un cinquième de la quantité de fer — a été ajoutée. Que contient le becher ?"
"the-oxidant-is-spent-to-the-last-electron.expect.predict.options" = ["Un peu de tout — les réactions atteignent l'équilibre, donc les deux côtés subsistent toujours", "Violet : un oxydant aussi fort finit toujours en excès", "Fer(III) et manganèse(II), complets jusqu'aux limites de l'arithmétique — et moins d'acide qu'avant"]
"the-oxidant-is-spent-to-the-last-electron.expect.predict.misconception" = "« L'équilibre signifie des restes » est la leçon de l'acide faible sur-appliquée : quand les couples sont si éloignés l'un de l'autre, le résidu à l'équilibre est réel mais tombe neuf ordres de grandeur en dessous des quantités de départ — équilibre et complétude sont ici le même énoncé. La surprise plus discrète est l'acide : huit protons par permanganate sont entrés dans le produit eau, 0,008 des 0,010 mol du becher, et le pH est monté de 1,4 à 2,1 pour le prouver."
"the-oxidant-is-spent-to-the-last-electron.expect.predict.diagnosis.0.reveals" = "L'équilibre vu comme un résidu universel : chaque réaction laisserait un peu de tout, comme le becher au vinaigre a conservé la majeure partie de son acide intacte."
"the-oxidant-is-spent-to-the-last-electron.expect.predict.diagnosis.0.next" = "Regarde le résidu que l'équilibre laisse réellement (lv3) : Fe(II) à 7,1 × 10⁻⁸ mol/kgw — neuf ordres de grandeur en dessous de son point de départ. Les couples sont assez éloignés pour que « complet » et « à l'équilibre » soient la même phrase — c'est précisément ce qui rend cette réaction utilisable en analyse."
"the-oxidant-is-spent-to-the-last-electron.expect.predict.diagnosis.1.reveals" = "La force vue comme une inépuisabilité : le réactif fort gagnerait toujours, donc ce devrait être celui qui reste debout à la fin."
"the-oxidant-is-spent-to-the-last-electron.expect.predict.diagnosis.1.next" = "La force est un potentiel, pas un stock : 0,001 mol de permanganate a de la place pour exactement 0,005 mol d'électrons, et le fer en a fourni exactement autant. Une goutte de plus, et ce banc se retire — `explain` dit pourquoi : l'excès devrait prendre des électrons au solvant lui-même, ce qui n'est pas modélisé — c'est pourquoi le premier violet permanent au point final d'une vraie burette est de la chimie que ce banc énonce plutôt qu'il ne la montre."
"the-oxidant-is-spent-to-the-last-electron.registers.lv1" = "Le dernier reste de violet disparaît comme tous les précédents. Le becher a transformé chaque parcelle de son fer — et il a consommé la majeure partie de son acidité pour y parvenir."
"the-oxidant-is-spent-to-the-last-electron.registers.lv2" = "0,001 mol de MnO₄⁻ × 5 = 0,005 mol de place pour des électrons : exactement ce que peuvent céder 0,005 mol de Fe(II). Le banc lit : tout le Fe en Fe(III) ; tout le Mn en Mn(II). Et 8 × 0,001 = 0,008 mol des 0,010 mol de protons du becher sont partis avec — le pH est monté de 1,42 à 2,12."
"the-oxidant-is-spent-to-the-last-electron.registers.lv3" = "Le reste à l'équilibre de Fe(II) est de 7,1 × 10⁻⁸ mol/kgw — la réponse « un peu de tout » est réelle et neuf ordres de grandeur trop petite pour compter. Au-delà de ce point, le couplage se désactive plutôt que de deviner : un oxydant en excès par rapport aux réducteurs devrait ses électrons restants au solvant, ce que ce banc ne modélise pas, si bien qu'un becher surtitré montre ses réactifs découplés, et `explain` énonce le solde impayé en équivalents-électrons. Le point final d'une vraie burette — la première goutte qui reste violette — est donc nommé ici comme de la chimie que le moteur refuse de calculer, dans la tradition de ce laboratoire qui le dit ouvertement."
"the-series-decides-who-plates.expect.predict.question" = "Une bande de zinc est plongée dans une solution bleue de sulfate de cuivre. Que se passe-t-il ?"
"the-series-decides-who-plates.expect.predict.options" = ["Rien — un métal et un sel dissous n'ont rien à faire ensemble sans un acide", "Du cuivre métallique croît sur le zinc, le bleu s'estompe, et le becher devient nettement chaud", "Le zinc se dissout, mais le cuivre reste dissous aussi — ils échangent simplement leurs places sur le papier"]
"the-series-decides-who-plates.expect.predict.misconception" = "La première réponse réserve la réactivité aux acides ; la troisième accorde l'équation mais pas la matière. Le déplacement est un véritable changement de propriétaire des électrons : le zinc se situe sous le cuivre dans la série, il cède donc ses électrons, se dissout en Zn²⁺, et les ions cuivre prennent les électrons et sortent de la solution sous forme de métal réel à la surface du zinc — avec 218,7 kJ/mol à la clé."
"the-series-decides-who-plates.expect.predict.diagnosis.0.reveals" = "La réactivité exigerait un acide : les métaux répondraient à l'acidité, et une simple solution saline n'aurait rien avec quoi attaquer."
"the-series-decides-who-plates.expect.predict.diagnosis.0.next" = "L'attaquant n'est pas le proton de l'acide mais tout ion situé sous le métal dans la série. Observe le becher : aucun acide nulle part, et pourtant le zinc est consommé tandis que le cuivre se dépose — fais ensuite tourner `metals-below-hydrogen-fizz`, où le proton prend son tour comme un simple échelon parmi d'autres."
"the-series-decides-who-plates.expect.predict.diagnosis.1.reveals" = "La réaction se produirait uniquement dans l'équation — les ions échangeraient leurs étiquettes, mais rien ne bougerait dans le becher ; la chimie vue comme une comptabilité plutôt que comme de la matière."
"the-series-decides-who-plates.expect.predict.diagnosis.1.next" = "Vérifie toutes les observables à la fois : le bleu a disparu (le Cu²⁺ qui le portait est maintenant du métal), le thermomètre a bondi de 33,7 à 59,9 °C, et `inspect` montre du cuivre solide dans l'inventaire là où se trouvait du zinc solide. Un échange sur le papier ne libère pas 218,7 kJ/mol."
"the-series-decides-who-plates.registers.lv1" = "La bande grise est plongée dans l'eau bleue. Lentement, la bande se couvre d'une fourrure brun-rosé de cuivre véritable, le bleu s'efface, et le becher devient franchement chaud. Le zinc a échangé sa place avec le cuivre — et l'échange dégage de la chaleur."
"the-series-decides-who-plates.registers.lv2" = "Zn + Cu²⁺ → Zn²⁺ + Cu. Le zinc se situe sous le cuivre dans la série d'activité (E° −0,76 V contre +0,34 V), le zinc est donc oxydé et le cuivre réduit : 0,0500 mol se dépose, le bleu de la solution disparaît avec son Cu²⁺, et le becher monte de 33,7 à 59,9 °C — ΔH ≈ −218,7 kJ par mole de métal déplacé."
"the-series-decides-who-plates.registers.lv3" = "L'avancement est décidé par bissection sur le potentiel de pile de Nernst calculé sur les activités que rapporte PHREEQC, et la chaleur par la différence des enthalpies de formation des ions, équilibrée sous forme d'enthalpie — rien n'écrit nulle part « le zinc déplace le cuivre ». Le même ordre répond au cas sélectif : présente à une bande de zinc à la fois Ag⁺ et Cu²⁺, et tout l'argent se dépose avant que la moindre trace de cuivre ne suive — ce que confirment les propres tests du moteur. Limites, énoncées : la série ne parle que de thermodynamique à l'électrode, pas de vitesses — la passivation, les surtensions et les acides oxydants lui échappent, et le banc le dit là où cela compte."
"metals-below-hydrogen-fizz.expect.predict.question" = "Deux bandes dans deux bechers de la même solution d'acide chlorhydrique : du magnésium dans l'un, du cuivre dans l'autre. Que se passe-t-il ?"
"metals-below-hydrogen-fizz.expect.predict.options" = ["Les deux pétillent — l'acide attaque le métal, c'est ce que fait un acide", "Aucun ne pétille — un métal solide est trop résistant pour un liquide", "Seul le magnésium pétille ; le cuivre reste indéfiniment dans l'acide, intact"]
"metals-below-hydrogen-fizz.expect.predict.misconception" = "Les deux réponses fausses traitent « métal » comme une seule substance ayant un seul comportement face à l'acide. La série d'activité est le correctif : l'hydrogène a son propre échelon (E° = 0 par définition), et seuls les métaux situés en dessous peuvent pousser des électrons vers les protons. Le magnésium est bien en dessous et pétille de l'hydrogène ; le cuivre est au-dessus, donc dans cet acide il n'a rien à gagner et ne fait exactement rien — ce que le banc énonce comme un résultat, non comme une absence."
"metals-below-hydrogen-fizz.expect.predict.diagnosis.0.reveals" = "L'acide attaquerait le métal, universellement — le pétillement serait une propriété de l'acide, et n'importe quel métal ferait l'affaire comme victime."
"metals-below-hydrogen-fizz.expect.predict.diagnosis.0.next" = "Fais tourner les deux bechers côte à côte : l'acide est identique, les résultats ne le sont pas. L'échelon décisif est la place propre de l'hydrogène dans la série — l'acide ne peut oxyder que les métaux situés en dessous, et le cuivre n'en fait pas partie."
"metals-below-hydrogen-fizz.expect.predict.diagnosis.1.reveals" = "Les solides surclasseraient les liquides : un bloc de métal serait imaginé comme simplement trop massif pour qu'un acide aqueux puisse le toucher."
"metals-below-hydrogen-fizz.expect.predict.diagnosis.1.next" = "Observe le récipient de magnésium : 0,0200 mol d'hydrogène s'échappe sous forme de gaz, et le métal est entièrement consommé. La robustesse n'est pas une catégorie chimique — la position dans la série, si, et le même « acide aqueux » qui ignore le cuivre dévore entièrement le magnésium."
"metals-below-hydrogen-fizz.registers.lv1" = "Même liquide acide, deux métaux différents. Le magnésium argenté pétille furieusement et disparaît. Le cuivre reste simplement là, jour après jour, parfaitement indifférent. Les métaux passent à leur tour selon leur rang — et l'acide ne peut toucher que ceux qui se trouvent en dessous d'une certaine ligne."
"metals-below-hydrogen-fizz.registers.lv2" = "Mg + 2 H⁺ → Mg²⁺ + H₂↑ (E° Mg²⁺/Mg = −2,37 V, bien en dessous des 0,00 V de l'hydrogène) : 0,0200 mol de H₂ se dégage, et le pH grimpe de −0,04 à 0,23. Le cuivre (E° +0,34 V, au-dessus de l'hydrogène) est rapporté inerte : rien à gagner, rien ne se passe."
"metals-below-hydrogen-fizz.registers.lv3" = "Deux limites méritent ici leur peine. Acides non oxydants seulement : l'acide nitrique dissout le cuivre par un autre oxydant (le nitrate), si bien que « le cuivre résiste à l'acide » est une affirmation sur HCl et ses semblables, et la série telle que calculée ici ne dit rien sur HNO₃. Et la cinétique : thermodynamiquement, même l'eau pure devrait attaquer le magnésium — plonge-le dans l'eau salée, et le banc se retire avec un écart de vitesse énoncé plutôt que de le dissoudre ou de le déclarer stable. Le verdict « inerte », quant à lui, est un événement, pas un silence — le résultat négatif est de première classe, dans la tradition de ce laboratoire."
"the-silver-tree.expect.predict.question" = "Un fil de cuivre se tient dans une solution incolore de nitrate d'argent. Qu'observes-tu au cours de l'heure suivante ?"
"the-silver-tree.expect.predict.options" = ["Rien — l'argent est un métal noble, et les métaux nobles ne réagissent pas", "Des cristaux d'argent croissent sur le fil tandis que la solution devient bleue", "Le fil se dissout entièrement, et les deux métaux finissent en solution"]
"the-silver-tree.expect.predict.misconception" = "« Noble » décrit le métal, pas l'ion — l'argent métallique résiste à l'attaque, mais un ion argent est de l'argent qui a déjà perdu son électron et en veut un de retour, et le cuivre, situé en dessous dans la série, est prêt à payer. Deux argents se déposent par cuivre dissous (un électron chacun contre deux pour le cuivre), et le Cu²⁺ qui arrive apporte le bleu : le changement de couleur rend visible le transfert d'électrons."
"the-silver-tree.expect.predict.diagnosis.0.reveals" = "La noblesse vue comme une propriété générale : l'argent serait non réactif, donc tout ce qui porte le nom « argent » — métal ou ion — devrait rester tel quel."
"the-silver-tree.expect.predict.diagnosis.0.next" = "Sépare le métal de son ion : `silver-does-not-stoop` montre l'argent métallique refusant vraiment le sulfate de cuivre, tandis que ce becher montre l'ion argent ACCEPTANT avidement des électrons. La noblesse appartient à l'état rempli, pas au nom — un Ag⁺ est un argent qui a déjà été dépouillé."
"the-silver-tree.expect.predict.diagnosis.1.reveals" = "Le déplacement vu comme une dissolution mutuelle — les réactions mélangeraient tout en solution ; le fait qu'un métal doive quitter la solution pour que l'autre y entre n'entre pas dans ce tableau."
"the-silver-tree.expect.predict.diagnosis.1.next" = "Compte les électrons : ils doivent bien aller quelque part, et le seul preneur est Ag⁺, qui devient métal solide en les acceptant — 0,0200 mol d'argent déposé pour 0,0100 mol de cuivre dissous, sur la balance comme dans l'inventaire. Des électrons conservés, voilà pourquoi le déplacement est un échange, jamais une fusion."
"the-silver-tree.registers.lv1" = "Le fil de cuivre fait croître des aiguilles scintillantes d'argent véritable, comme du givre — et à mesure que l'arbre grandit, l'eau qui l'entoure devient lentement bleue. Le fil s'échange contre de l'argent, un électron à la fois."
"the-silver-tree.registers.lv2" = "Cu + 2 Ag⁺ → Cu²⁺ + 2 Ag : le cuivre (E° +0,34 V) se situe sous l'argent (+0,80 V), le cuivre se dissout donc et l'argent se dépose — 0,0200 mol d'Ag pour 0,0100 mol de Cu, deux pour un selon le compte des électrons. Le bleu est le Cu²⁺ qui arrive ; le pH dérive de 6,46 à 4,19 à mesure que le nouvel ion cuivre s'hydrolyse (`copper-sulfate-is-blue-and-acidic` raconte cette histoire à elle seule)."
"the-silver-tree.registers.lv3" = "La stœchiométrie n'est écrite nulle part : un électron par argent contre deux par cuivre découle de la même comptabilité électronique que les cinq du permanganate (`permanganate-counts-in-fives`), et la couleur est calculée à partir de l'absorptivité mise en scène de Cu²⁺, non affirmée. La chaleur est faible et réelle — de 23,9 à 27,4 °C à partir des enthalpies de formation des ions. Cette expérience est celle que le coulomètre à argent de Faraday a industrialisée : le rapport deux pour un est un compte d'électrons que l'on peut peser."
"silver-does-not-stoop.summary" = "La série est un ordre : l'argent métallique dans du sulfate de cuivre ne fait rien, et ce rien est un résultat calculé"
"silver-does-not-stoop.expect.predict.question" = "L'arbre d'argent montrait le cuivre métallique s'échangeant contre des ions argent. Inverse maintenant la distribution des rôles : de l'argent métallique dans du sulfate de cuivre. Que se passe-t-il ?"
"silver-does-not-stoop.expect.predict.options" = ["L'image miroir — le cuivre se dépose sur l'argent", "Absolument rien, jamais : l'échange ne descend que dans un sens", "Cela fonctionne, mais plus lentement, car l'argent est plus lourd"]
"silver-does-not-stoop.expect.predict.misconception" = "Si A déplace B, les apprenants s'attendent souvent à ce que B déplace A dans les bonnes conditions — les réactions vues comme des courtoisies réversibles. La série est un ordre, pas une humeur : les électrons vont du métal le plus bas vers l'ion le plus haut et ne remontent jamais dans ces conditions. L'argent se situe au-dessus du cuivre, donc l'argent métallique face à Cu²⁺ n'a rien à gagner, et le banc rapporte ce rien comme un verdict motivé, pas comme un compte-rendu vide."
"silver-does-not-stoop.expect.predict.diagnosis.0.reveals" = "Le déplacement vu comme un échange symétrique : si le cuivre s'échange contre l'argent, l'argent devrait aussi s'échanger contre le cuivre — la direction ne ferait pas encore partie de la règle."
"silver-does-not-stoop.expect.predict.diagnosis.0.next" = "Place les deux expériences côte à côte (`the-silver-tree` et ce becher) : même paire de métaux, distributions opposées, et une seule direction bouge. L'ordre EST la chimie — E° +0,80 V ne cède pas d'électrons à +0,34 V."
"silver-does-not-stoop.expect.predict.diagnosis.1.reveals" = "On se rabat sur la vitesse là où c'est la thermodynamique qui fait barrière : « plus lent » garderait la réaction possible, juste paresseuse — l'idée qu'une réaction puisse être tout simplement indisponible manque."
"silver-does-not-stoop.expect.predict.diagnosis.1.next" = "Attends aussi longtemps que tu veux : ce n'est pas `why-the-shelf-is-not-on-fire`, où la réaction descend et n'est bloquée que par une barrière. Ici, il n'y a pas de pente descendante — l'électron devrait se déplacer contre la différence de potentiel, et aucune patience ne règle cette facture. Lent et jamais sont deux physiques différentes, et ce becher est de la seconde sorte."
"silver-does-not-stoop.registers.lv1" = "La dernière fois, le cuivre donnait et l'argent prenait. Inverse les rôles — de l'argent métallique dans l'eau bleue au cuivre — et rien ne se passe. Pas lentement : pas du tout. L'échange ne descend jamais que dans un seul sens de l'échelle."
"silver-does-not-stoop.registers.lv2" = "Ag (E° +0,80 V) au-dessus de Cu²⁺/Cu (+0,34 V) : le potentiel de pile pour que l'argent réduise le cuivre est négatif, donc aucune réaction — le becher garde son bleu, son cuivre reste dissous, et l'argent est rapporté inerte, avec les potentiels dans le message."
"silver-does-not-stoop.registers.lv3" = "La paire d'entrées est la leçon : `the-silver-tree` et ce becher ne diffèrent que par le côté qui commence sous forme métallique, et la série décide des deux issues à partir d'un seul et même classement. Le verdict « inerte » est un événement qui porte sa raison avec lui (E° +0,800 V contre +0,342 V) — c'est précisément ce qui permet à ce codex d'affirmer `inert:Ag` et de faire vérifier un rien par le lint : un résultat négatif contrôlable par machine, dans la tradition de `a-spark-that-changes-nothing`."
"zinc-guards-iron.expect.predict.question" = "Un morceau de zinc repose dans une solution de sulfate de fer(II). Que se passe-t-il — et pourquoi les coques de navires en acier portent-elles des blocs de zinc boulonnés ?"
"zinc-guards-iron.expect.predict.options" = ["Rien ; le zinc et le fer sont trop semblables pour se déranger l'un l'autre", "Du fer métallique se dépose tandis que le zinc se dissout — le zinc cède ses électrons en premier, exactement le sacrifice que fait le bloc de coque", "Le zinc rouille à la place du fer, parce que la rouille préfère le métal le plus réactif"]
"zinc-guards-iron.expect.predict.misconception" = "La troisième réponse a le bon instinct mais dans le mauvais mécanisme : rien ne « préfère » quoi que ce soit — le zinc se situe simplement sous le fer dans la série, si bien que partout où des électrons sont demandés, le zinc paie avant le fer. Dans ce becher, cela signifie que le fer dissous est repoussé vers l'état métallique aux dépens du zinc ; sur une coque, cela signifie que le courant de corrosion draine le bloc remplaçable plutôt que la plaque irremplaçable. Même classement, même sacrifice."
"zinc-guards-iron.expect.predict.diagnosis.0.reveals" = "Des métaux semblables, aucune chimie : on imaginerait que les différences de réactivité ont besoin de drame — un acide contre un métal, pas du gris contre du gris."
"zinc-guards-iron.expect.predict.diagnosis.0.next" = "L'écart doit seulement être non nul : −0,76 V contre −0,45 V suffit pour chaque dernier ion fer ici. `inspect` ensuite : 0,0100 mol de fer déposé, le zinc entièrement passé en solution — un tiers de volt, entièrement dépensé."
"zinc-guards-iron.expect.predict.diagnosis.1.reveals" = "La rouille vue comme un agent doté de préférences, sautant vers le métal le plus réactif — la protection imaginée comme un comportement de leurre plutôt que comme une comptabilité d'électrons."
"zinc-guards-iron.expect.predict.diagnosis.1.next" = "Remplace « préfère » par une direction : les électrons circulent du métal le plus bas vers tout ce qui est réduit. Le bloc de zinc se corrode *parce qu'*il est la source d'électrons offrant le moins de résistance — aucune préférence, seulement le même classement qui a fait se déposer le fer dans ce becher."
"zinc-guards-iron.registers.lv1" = "Le morceau de zinc se sacrifie lentement, et une fourrure grise de fer croît là où il se trouvait. Sur un navire, c'est le même tour : boulonne un morceau de zinc, et la mer dévore ce morceau au lieu de la coque — un garde du corps qui prend le coup exprès."
"zinc-guards-iron.registers.lv2" = "Zn + Fe²⁺ → Zn²⁺ + Fe (E° −0,76 V en dessous de −0,45 V) : 0,0100 mol de fer se dépose sur le zinc qui se dissout. La protection sacrificielle est cette même réaction, exploitée comme un plan de maintenance — le zinc coûte moins cher à remplacer que l'acier qu'il protège."
"zinc-guards-iron.registers.lv3" = "C'est le « pourquoi le zinc protège le fer » de P3e, répondu par le calcul plutôt que par l'affirmation : la direction découle de la même comparaison de Nernst que toute autre paire de la série. Notes d'honnêteté : la vraie protection d'une coque est une pile électrochimique avec de l'oxygène à la cathode, plus riche que ce simple becher ; et la chimie du fer frais ici se situe près de limites connues du moteur (une sursaturation que ce registre ne peut pas nommer peut être signalée), c'est pourquoi cette entrée fixe des quantités et un pH, pas des potentiels."
"the-daniell-cell-offers-its-voltage.summary" = "Deux demi-piles et un pont salin : la pile Daniell affiche 1,104 V à vide — la distance entre deux échelons de la série, offerte avant même qu'aucun courant ne circule"
"the-daniell-cell-offers-its-voltage.expect.predict.question" = "Du zinc se tient dans du sulfate de zinc, du cuivre dans du sulfate de cuivre, un pont salin entre les deux et un voltmètre sur les métaux. Qu'affiche l'appareil ?"
"the-daniell-cell-offers-its-voltage.expect.predict.options" = ["0 V — les métaux ne se touchent jamais, donc aucune chimie ne les relie", "Environ 1,1 V — la distance entre les échelons des deux métaux dans la série", "Environ 0,4 V — la moyenne des deux potentiels d'électrode"]
"the-daniell-cell-offers-its-voltage.expect.predict.misconception" = "Une tension est une *différence*, pas une moyenne et pas un contact : chaque métal se situe à son propre potentiel d'électrode face à ses propres ions, et l'appareil lit l'écart — E°(Cu²⁺/Cu) − E°(Zn²⁺/Zn) = 0,34 − (−0,76) ≈ 1,10 V. La réaction de déplacement et la pile sont la même chimie : mets les métaux dans un seul becher, et les électrons sautent directement sous forme de chaleur ; sépare les demi-piles, et les mêmes électrons doivent emprunter le fil, où on peut les faire travailler."
"the-daniell-cell-offers-its-voltage.expect.predict.diagnosis.0.reveals" = "La réaction exigerait un contact : les métaux ne se rencontrent jamais, donc rien ne pourrait se produire — le circuit dans son ensemble ne serait pas encore l'unité de la chimie."
"the-daniell-cell-offers-its-voltage.expect.predict.diagnosis.0.next" = "Suis les options d'un seul électron : il quitte le zinc soit directement vers un Cu²⁺ à la surface du métal (`the-series-decides-who-plates`, qui a transformé l'écart en 218,7 kJ/mol de chaleur), soit à travers le fil jusqu'à l'électrode de cuivre, faisant la même chimie à distance. Le pont salin ferme la boucle de charge ; le fil est l'endroit où l'échange devient mesurable."
"the-daniell-cell-offers-its-voltage.expect.predict.diagnosis.1.reveals" = "Les potentiels seraient moyennés plutôt que soustraits — deux chiffres sur un tableau se combineraient comme des notes d'examen."
"the-daniell-cell-offers-its-voltage.expect.predict.diagnosis.1.next" = "Vérifie la convention de signe sur le becher : l'appareil indique dans quel sens les électrons *veulent* circuler, et un vouloir est une différence. Le banc imprime le calcul avec le verdict : E° +0,342 moins −0,762 donne les 1,104 V qu'il rapporte, électrons offerts de v1 vers v2."
"the-daniell-cell-offers-its-voltage.registers.lv1" = "Deux bocaux, deux métaux, un pont de papier d'eau salée, et un appareil entre les deux : il affiche une tension réelle — une pile faite de rien d'autre que de l'appétit différent des deux métaux pour les électrons."
"the-daniell-cell-offers-its-voltage.registers.lv2" = "Zn | Zn²⁺ ‖ Cu²⁺ | Cu : E = E°(cathode) − E°(anode) = 0,34 − (−0,76) ≈ 1,10 V, et le banc lit 1,104 V à vide. C'est la pile de Daniell de 1836 — la réaction de déplacement de `the-series-decides-who-plates`, avec les deux moitiés séparées, si bien que les électrons empruntent le fil."
"the-daniell-cell-offers-its-voltage.registers.lv3" = "À vide, et le banc le dit : c'est la tension que la pile *offre*, pas ce qu'elle délivre sous charge — le courant l'abaisserait par résistance interne et polarisation, ni l'une ni l'autre modélisées ici, et le rapport le mentionne. Les 1,104 V sont du Nernst calculé sur les activités que PHREEQC calcule pour chaque côté (E° seul donne 1,1037 ; les deux solutions à 0,01 mol/kgw annulent presque mutuellement leurs corrections). Les deux demi-piles se situent à moins d'un demi-degré de 25 °C avec ces quantités — à 0,1 mol, la chaleur de dissolution porterait les deux électrodes à des températures différentes, c'est pourquoi cette entrée utilise la version diluée."
"dilution-buys-less-than-the-slide-rule-says.summary" = "Une dilution par dix du côté cuivre coûte 18,2 mV, et non les 29,6 du calcul à la règle de Nernst — l'équation est exacte sur les activités, et les concentrations ne sont pas les activités"
"dilution-buys-less-than-the-slide-rule-says.expect.predict.question" = "L'exercice de manuel : dilue par dix le côté cuivre d'une pile Daniell, et E chute de 0,0592/2 volt par décade — 29,6 mV. Le banc dilue et lit l'appareil. De combien la tension a-t-elle réellement chuté ?"
"dilution-buys-less-than-the-slide-rule-says.expect.predict.options" = ["Exactement 29,6 mV — l'équation de Nernst est une équation", "18,2 mV — nettement moins, parce que l'activité du cuivre libre a chuté d'un facteur plus proche de 4 que de 10", "Rien — la dilution change combien il y a de cuivre, pas ce qu'est le cuivre"]
"dilution-buys-less-than-the-slide-rule-says.expect.predict.misconception" = "L'équation de Nernst EST exacte — sur les activités. La version à la règle de calcul substitue silencieusement les concentrations, ce qui suppose que les corrections d'activité s'annulent entre les deux solutions. Ce n'est pas le cas : dans la solution la plus concentrée, une grande partie du cuivre est appariée au sulfate, si bien que dix fois moins de cuivre total ne représente qu'environ quatre fois moins de Cu²⁺ *libre*, et le logarithme voit ce quatre. Le second témoin l'établit définitivement : une pile cuivre-argent affiche 0,445 V à 0,01 mol mais 0,483 V à 0,1 — l'écart change de signe avec la concentration, si bien qu'aucune règle empirique du type « toujours un peu moins » ne survit."
"dilution-buys-less-than-the-slide-rule-says.expect.predict.diagnosis.0.reveals" = "L'équation telle qu'imprimée serait la physique : les concentrations entreraient dans le logarithme parce que c'est là que le livre les a placées — la note de bas de page sur l'activité n'aurait jamais atteint la mémoire de travail."
"dilution-buys-less-than-the-slide-rule-says.expect.predict.diagnosis.0.next" = "Ce laboratoire a déjà enseigné la même leçon trois fois avec des appareils différents : `ph-is-not-quite-minus-log-c` (l'électrode de pH), `half-oxidised-iron-reads-its-own-potential` (l'électrode redox), et maintenant la pile entière. Regarde la spéciation lv3 de v2 : la paire d'ions CuSO₄ retient un tiers du cuivre, et le test figé du moteur affirme que la chute est inférieure à l'idéal plutôt que n'importe quel chiffre particulier — l'écart lui-même est la chimie."
"dilution-buys-less-than-the-slide-rule-says.expect.predict.diagnosis.1.reveals" = "La tension vue comme une identité : ce qu'« est » un métal fixerait son potentiel, et la quantité ne serait que de la comptabilité — le terme logarithmique n'aurait aucune signification physique attachée."
"dilution-buys-less-than-the-slide-rule-says.expect.predict.diagnosis.1.next" = "Fais tourner d'abord le contre-exemple le plus fort (`a-battery-from-nothing-but-imbalance`) : deux électrodes de cuivre identiques, rien de différent sinon la concentration, et 18 mV bien réels apparaissent. Si la quantité ne déplaçait pas les potentiels, cette pile afficherait zéro pour toujours."
"dilution-buys-less-than-the-slide-rule-says.registers.lv1" = "Dilue un côté de la pile, et sa poussée s'affaiblit — mais moins que ce que promettait la règle empirique. Le becher sait quelque chose que la règle de calcul ignore : combien de cuivre est vraiment libre."
"dilution-buys-less-than-the-slide-rule-says.registers.lv2" = "E = E° − (0,0592/2)·log(a(Zn²⁺)/a(Cu²⁺)). Dix fois moins de cuivre total devrait coûter 29,6 mV si la concentration était l'activité ; le banc lit 1,104 → 1,086 V, une chute de 18,2 mV, parce que l'appariement au sulfate signifie que le rapport de Cu²⁺ libre entre les deux solutions est plus proche de 4 que de 10."
"dilution-buys-less-than-the-slide-rule-says.registers.lv3" = "Le point d'échec (fails_at) de la forme concentration du Nernst, exprimé en chimie : dans des milieux sulfatés de force molaire, la paire d'ions CuSO₄(aq) porte une grande part du cuivre, et cette part *change avec la dilution*, si bien qu'aucune correction fixe ne sauve la forme concentration. Le test de régression du moteur affirme délibérément une inégalité (chute < idéale) plutôt que 18,2 mV, parce que l'affirmation honnête est le mécanisme, pas le chiffre de ce scénario. La paire cuivre-argent fournit le témoin du changement de signe (0,445 V à 0,01 mol, 0,483 V à 0,1, contre E° 0,458) : à faible concentration, le terme d'argent n=1 domine le déficit ; à forte concentration, le terme de cuivre appauvri en sulfate l'emporte."
"a-battery-from-nothing-but-imbalance.summary" = "Une pile de concentration : électrodes de cuivre identiques, solutions dix fois différentes — E° s'annule à 0,000, et l'appareil affiche quand même 18 mV, le terme de Nernst seul"
"a-battery-from-nothing-but-imbalance.expect.predict.question" = "Même métal des deux côtés, même sel des deux côtés — du cuivre dans du sulfate de cuivre deux fois, seule la concentration diffère d'un facteur dix. Le voltmètre affiche…"
"a-battery-from-nothing-but-imbalance.expect.predict.options" = ["0 V — des électrodes identiques ne peuvent être en désaccord sur rien", "Environ 18 mV, le côté dilué étant le pôle négatif", "Environ 1,1 V — deux bechers et un pont font une pile Daniell, quoi qu'il y ait dedans"]
"a-battery-from-nothing-but-imbalance.expect.predict.misconception" = "Les potentiels standard s'annulent exactement — E° = 0,000, et le banc l'imprime tel quel — pourtant une tension réelle subsiste, parce que le terme de Nernst lit le déséquilibre lui-même : le côté dilué dissout du cuivre pour gagner des ions, et le côté fort dépose du cuivre pour s'en débarrasser — la pile fonctionne littéralement sur l'envie de s'équilibrer. Une pile a besoin d'une différence, et une différence de concentration en est une."
"a-battery-from-nothing-but-imbalance.expect.predict.diagnosis.0.reveals" = "Le potentiel appartiendrait à la substance : des métaux identiques, des potentiels identiques, zéro pour toujours — la concentration n'aurait aucune place à l'électrode."
"a-battery-from-nothing-but-imbalance.expect.predict.diagnosis.0.next" = "Lis le propre calcul du banc : E° = 0,000 exactement, E = 0,018 V quand même. Toute la lecture est le terme logarithmique — couvre du pouce la colonne E° du tableau, et cette pile fonctionne exactement pareil, ce qu'aucune pile bâtie sur « les métaux diffèrent » ne peut prétendre."
"a-battery-from-nothing-but-imbalance.expect.predict.diagnosis.1.reveals" = "Deux bechers quelconques câblés ensemble feraient « la pile du manuel » — l'appareillage serait la cause, et 1,1 V serait ce que produit un montage de cette forme."
"a-battery-from-nothing-but-imbalance.expect.predict.diagnosis.1.next" = "Les 1,104 V appartenaient à une paire précise d'échelons, pas à la verrerie (`the-daniell-cell-offers-its-voltage`). Même verrerie, même pont, du cuivre des deux côtés : soixante fois moins de tension. La série fournit le grand chiffre ; ici, elle ne contribue en rien, et ce qui reste est du Nernst pur."
"a-battery-from-nothing-but-imbalance.registers.lv1" = "Deux bocaux de la même eau bleue — l'un fort, l'un faible — du cuivre dans les deux, un pont entre eux. Et l'appareil affiche quand même quelque chose ! Le côté fort veut céder du cuivre, le côté faible en veut davantage : le seul désir de s'équilibrer suffit à faire de l'électricité."
"a-battery-from-nothing-but-imbalance.registers.lv2" = "Cu | Cu²⁺(0,001) ‖ Cu²⁺(0,01) | Cu : E° s'annule à 0,000, et E = (0,0592/2)·log(a₂/a₁) — le banc lit 0,018 V, le côté dilué étant l'anode. Une pile de concentration est l'équation de Nernst avec tout le reste soustrait."
"a-battery-from-nothing-but-imbalance.registers.lv3" = "Le témoin le plus pur que ce banc puisse mettre en scène pour « le chiffre, ce sont les activités » : aucune valeur de table ne survit dans la réponse, si bien que les 18,4 mV sont entièrement le rapport d'activité calculé (ce qui explique aussi qu'il ne s'agisse pas non plus de la valeur idéale de 29,6/2 par décade — la même correction d'appariement que dans `dilution-buys-less-than-the-slide-rule-says`). La direction est la seconde leçon : le côté *dilué* est l'anode, dissolvant sa propre électrode pour rattraper son retard — de la matière qui se déplace pour effacer un gradient, lue en volts. Les cellules nerveuses et les électrodes de pH fonctionnent sur exactement ce même principe."
"only-the-two-is-chemistry.summary" = "Cu²⁺ + 2 e⁻ → Cu — une demi-réaction, dont les électrons sont fournis par le fil"
"only-the-two-is-chemistry.expect.predict.question" = "Un demi-ampère circule pendant 1930 secondes à travers du sulfate de cuivre — 965 coulombs, presque exactement un centième de faraday. Quelle quantité de cuivre se dépose sur la cathode ?"
"only-the-two-is-chemistry.expect.predict.options" = ["0,0100 mol — une mole d'électrons dépose une mole de métal", "0,0050 mol — chaque ion cuivre exige deux électrons", "Impossible à dire sans la tension — ce sont les volts qui entraînent la galvanoplastie"]
"only-the-two-is-chemistry.expect.predict.misconception" = "La chaîne est Q = It, n(e⁻) = Q/F, n(métal) = n(e⁻)/z, m = nM — et trois de ces quatre étapes sont de l'arithmétique pure. Le diviseur z est le seul morceau de chimie là-dedans : Cu²⁺ prend deux électrons, donc un centième de faraday achète un demi-centième de cuivre. La tension décide si le dépôt se produit ou non ; la charge décide combien, à quatre chiffres près."
"only-the-two-is-chemistry.expect.predict.diagnosis.0.reveals" = "Les électrons et les atomes s'apparieraient un pour un — la charge de l'ion, le seul apport chimique de tout le calcul, serait l'étape sautée."
"only-the-two-is-chemistry.expect.predict.diagnosis.0.next" = "Fais tourner le jumeau au zinc : les mêmes 965 C dans du sulfate de zinc déposent les mêmes 0,0050 mol — 0,327 g contre les 0,318 du cuivre, ne différant que par la masse molaire — parce que les deux ions sont 2+. Imagine ensuite de l'argent : la même charge déposerait 0,0100 mol, puisque Ag⁺ n'en prend qu'un. Le compte d'électrons fixe le nombre de moles ; la charge de l'ion est le taux d'échange."
"only-the-two-is-chemistry.expect.predict.diagnosis.1.reveals" = "La tension vue comme le cadran de quantité : plus de volts, plus de métal — les rôles des deux grandeurs électriques fusionnent en une seule « électricité »."
"only-the-two-is-chemistry.expect.predict.diagnosis.1.next" = "Sépare-les comme le fait l'appareil : la tension est la pression qui décide si Cu²⁺ + 2e⁻ → Cu se déroule ; la charge est le décompte des électrons qui ont effectivement traversé, et chacun d'eux se retrouve dans le dépôt. Faraday a pesé exactement cela en 1833 — la balance comme compteur d'électrons."
"only-the-two-is-chemistry.registers.lv1" = "Branche une pile au bain bleu, et du cuivre croît sur le fil — et il croît selon une comptabilité stricte : fais circuler le courant deux fois plus longtemps, obtiens exactement deux fois plus de cuivre. L'électricité est une chose comptable, et le métal la compte pour toi."
"only-the-two-is-chemistry.registers.lv2" = "Q = 0,5 A × 1930 s = 965 C → n(e⁻) = Q/F = 0,0100 mol → n(Cu) = 0,0050 mol → m = 0,318 g. Dose-le : 120 C donnent 0,040 g, 3600 C donnent 1,185 g — la masse suit la charge tout au long de la série."
"only-the-two-is-chemistry.registers.lv3" = "Seul le 2 est de la chimie : le banc lit le diviseur sur le couple que contient le récipient plutôt que de se le voir communiqué, et le reste est de l'arithmétique qu'un apprenant peut vérifier à la main — c'est le propos de cette entrée. Limites, énoncées par le banc là où elles comptent. Ce que la loi de Faraday ne donne PAS, c'est le rendement en courant : la loi convertit exactement la charge en moles et reste muette sur la façon dont la charge a été répartie, si bien qu'une masse imprimée seule affirmerait que chaque électron a fait le même travail. Une perte est calculée : la charge au-delà de ce que le cuivre de la solution peut absorber va vers l'hydrogène, 2 H₂O + 2 e⁻ → H₂ + 2 OH⁻, si bien que le dépôt cesse de croître alors que le courant continue de circuler, et le rendement rapporté chute en dessous de 1 exactement de cette fraction. Le reste est déclaré plutôt que modélisé : l'hydrogène coproduit à une électrode en activité nécessiterait des densités de courant d'échange et une surface d'électrode que ce banc n'a pas, si bien qu'un rendement de 1 est une borne supérieure, et l'erreur a un signe connu — une électrode réelle pèse la masse indiquée ou moins, jamais plus."
"the-plating-bath-turns-acid.summary" = "2 H₂O → O₂ + 4 H⁺ + 4 e⁻ — l'anode inerte règle la facture de charge en protons"
"the-plating-bath-turns-acid.expect.predict.question" = "Tu galvanises 0,318 g de cuivre hors du bain bleu. Que devient le pH du bain ?"
"the-plating-bath-turns-acid.expect.predict.options" = ["Rien — la galvanoplastie déplace du métal, et le métal n'est pas un acide", "Il s'effondre, de 4,3 à 1,8 : chaque Cu²⁺ retiré a laissé sa charge derrière lui, et l'anode règle la facture en protons", "Il monte — retirer le métal « libère » la solution"]
"the-plating-bath-turns-acid.expect.predict.misconception" = "La conservation de la charge mène le jeu : chaque Cu²⁺ qui quitte la solution sous forme de métal en retire deux charges positives de l'eau, et la solution ne peut pas simplement devenir négative. À l'anode inerte, les comptes sont équilibrés en oxydant l'eau elle-même — 2 H₂O → O₂ + 4 H⁺ + 4 e⁻ —, si bien que l'oxygène s'échappe en bulles et que l'acide s'accumule, un proton par électron. Personne ne s'attend à ce que la galvanoplastie acidifie le bain, et pourtant cela découle directement du registre."
"the-plating-bath-turns-acid.expect.predict.diagnosis.0.reveals" = "La cathode serait toute l'histoire : le métal s'y déplace, donc c'est là que se trouverait la chimie — l'anode ne serait que l'autre fil."
"the-plating-bath-turns-acid.expect.predict.diagnosis.0.next" = "Retrace les électrons consommés par la cathode jusqu'à leur source : ils sont sortis de molécules d'eau à l'anode, et chaque départ a laissé un proton. Le banc le comptabilise exactement — 0,0025 mol de O₂ quitte le récipient ouvert, l'inventaire d'eau chute de 5,5342 à 5,5292 mol, et le pH atterrit à 1,84. Un circuit a deux extrémités, et la chimie se produit aux deux."
"the-plating-bath-turns-acid.expect.predict.diagnosis.1.reveals" = "Les solutés vus comme un fardeau : retirer quoi que ce soit « libérerait » la solution et la rapprocherait des 7 de l'eau pure — le cuivre dissous et l'acidité classés ici comme le même type d'impureté."
"the-plating-bath-turns-acid.expect.predict.diagnosis.1.next" = "Vérifie ce qui a réellement été retiré et ce qui a été créé : le cuivre est parti, mais pas sa charge opposée — le sulfate reste, et du nouveau H⁺ est arrivé pour lui faire face. Le bain finit comme de l'acide sulfurique dilué, ce pourquoi les ateliers de galvanoplastie industriels surveillent et dosent leurs bains au lieu de leur faire confiance pour s'autopurifier."
"the-plating-bath-turns-acid.registers.lv1" = "Dépose le cuivre, et le bain devient acide — assez piquant pour brûler. Les bulles à l'autre fil sont l'indice : l'eau elle-même est démontée pour payer le cuivre que tu as retiré."
"the-plating-bath-turns-acid.registers.lv2" = "Cathode : Cu²⁺ + 2e⁻ → Cu. Anode (inerte) : 2 H₂O → O₂↑ + 4 H⁺ + 4 e⁻. Par 0,0100 mol d'électrons : 0,0050 mol de cuivre déposé, 0,0025 mol d'oxygène sorti, 0,0100 mol de H⁺ formé — pH 4,27 → 1,84."
"the-plating-bath-turns-acid.registers.lv3" = "Le choix de l'anode est celui qui porte tout le poids, et le banc nomme le sien : l'anode *inerte* (les tiges de carbone du laboratoire scolaire), où l'eau est oxydée et l'acide s'accumule. Une anode de *cuivre* se dissout pour remplacer exactement ce qui se dépose — Cu²⁺ constant, pas d'acide, pas d'oxygène — et cette pile différente est l'électroraffinage, que ce banc ne modélise pas. Même cathode, chimie de bain opposée, décidée entièrement à l'électrode que tu ne surveillais pas."
"charging-fights-the-series.summary" = "Charger entraîne la pile à l'envers, et le dépôt survit au bout d'une laisse cinétique — la formation d'hydrogène sur le zinc coûte ~0,72 V de surtension, et le dégagement gazeux est ce qui se produit quand la laisse lâche"
"charging-fights-the-series.expect.predict.question" = "La pile Daniell offre 1,104 V, consommant du zinc en se déchargeant. Qu'est-ce que « charger » — ce qui rend un accumulateur rechargeable ?"
"charging-fights-the-series.expect.predict.options" = ["Le remplir à nouveau d'électricité, qu'il stockerait comme un réservoir stocke du carburant", "Utiliser un courant extérieur pour faire tourner à l'envers la propre réaction de la pile, reconstruisant le métal que la décharge a consommé", "Remplacer les produits chimiques épuisés par des neufs"]
"charging-fights-the-series.expect.predict.misconception" = "Une pile ne stocke pas d'électricité — elle stocke une réaction chimique maintenue prête à se dérouler. La décharge laisse la réaction descendre à travers le fil ; charger est un apport extérieur qui force la même réaction à remonter la pente, reconstruisant le métal de l'anode électron par électron (193 C reconstruisent ici 0,0010 mol de zinc, selon la même arithmétique de Faraday que toute électrolyse). L'image du réservoir échoue précisément au point qui compte : ce qui est stocké est un arrangement chimique, pas une substance appelée électricité."
"charging-fights-the-series.expect.predict.diagnosis.0.reveals" = "L'électricité vue comme un fluide stocké : la charge entrerait, clapoterait, ressortirait — le plus vieux modèle de l'électricité, et à l'intérieur d'une pile, il est faux d'une manière qui compte."
"charging-fights-the-series.expect.predict.diagnosis.0.next" = "Pèse les électrodes sur tout un cycle plutôt que d'imaginer le réservoir : la décharge amincit le zinc, la charge l'épaissit à nouveau — de la matière se déplace, ce qu'aucune image de fluide stocké ne prédit. Le banc montre la reconstitution directement : 193 coulombs entrés, 0,065 g de zinc de retour sur le métal."
"charging-fights-the-series.expect.predict.diagnosis.1.reveals" = "Les piles rechargeables et jetables ne différeraient que par leur régime d'entretien : quelqu'un, quelque part, remplacerait les produits chimiques — la régénération par le courant n'entrerait pas dans ce tableau."
"charging-fights-the-series.expect.predict.diagnosis.1.next" = "Rien n'entre dans la pile sinon des électrons : les « produits chimiques frais » sont les anciens, repoussés en haut de la pente qu'ils ont descendue. C'est là toute la distinction avec une pile primaire — la chimie d'un accumulateur est réversible sur place, ce pourquoi ses électrodes doivent aussi survivre à être reconstruites mille fois."
"charging-fights-the-series.registers.lv1" = "Pousse le courant à l'envers, et du zinc frais croît sur le métal — et il y reste, même si le bain acide adorerait le dévorer, parce que fabriquer des bulles d'hydrogène sur le zinc est un travail difficile. Cette difficulté est le garde du corps de la pile. Submerge-le de trop d'acide, et le garde du corps perd : ça pétille, et ta charge stockée s'échappe sous forme de gaz."
"charging-fights-the-series.registers.lv2" = "Décharge : Zn + Cu²⁺ → Zn²⁺ + Cu, offrant 1,104 V. Charge : une source extérieure force Zn²⁺ + 2e⁻ → Zn à l'encontre de la série — 193 C = 0,0020 mol d'électrons reconstruisent 0,0010 mol (0,0654 g) de zinc, tandis que l'anode inerte acidifie le bain jusqu'à pH 2,13. Et le dépôt tient : le dissoudre exigerait la formation d'hydrogène sur le zinc, ce qui coûte ~0,72 V de surtension contre une force motrice de seulement +0,69 V. Verse de l'acide fort, et la barrière est franchie : Zn + 2 H⁺ → Zn²⁺ + H₂, 0,026 mol de gaz, la charge défaite."
"charging-fights-the-series.registers.lv3" = "Le propre verdict du banc est la thèse de cette entrée, mot pour mot : « le zinc devrait se dissoudre dans cet acide selon la série (force motrice +0,69 V), mais l'hydrogène doit se former sur le zinc, et sur cette surface cela coûte une surtension d'environ 0,72 V. Bloqué cinétiquement à l'échelle de temps d'une leçon, non inerte thermodynamiquement — la différence entre un banc et une pile. » Ces 0,03 V de grâce sont la raison d'être des piles rechargeables — ici sur le zinc, sur le plomb dans chaque batterie de voiture — et le dégagement gazeux en surcharge est précisément la laisse qui lâche, mis en scène dans l'acte final de ce script avec de l'acide molaire. Honnêteté, en trois points : la marge en excès ne franchit que 0,07 V, parce que la propre spéciation en sulfate et chlorure du bain maintient a(H⁺) en dessous de un (à un vrai pH 0, ce serait 0,04 V), et une vitesse aussi proche de sa barrière n'est pas calculée — le banc dit « ça réagit, lentement » et n'affirme rien de plus ; la surtension elle-même est une constante cinétique mise en scène, non calculée ; et la pile et l'électrolyse restent découplées — rien ici ne calcule la décharge sous charge, la résistance interne ou la capacité, si bien que « une pile inversée » est un énoncé sur des demi-réactions, pas sur un comportement en fonctionnement."
"lead-stands-in-its-own-acid.summary" = "Le plomb se situe sous l'hydrogène dans la série, et pourtant les plaques d'une batterie de voiture tiennent des années dans l'acide — la force motrice de +0,13 V ne peut régler la surtension d'hydrogène d'environ 0,88 V sur le plomb, et cette facture impayée est la raison d'être de la batterie"
"lead-stands-in-its-own-acid.expect.predict.question" = "Une batterie de voiture est faite de plaques de plomb qui se tiennent des années dans un acide fort. Le plomb se situe sous l'hydrogène dans la série d'activité, donc l'acide devrait le dissoudre. Pourquoi ne le fait-il pas ?"
"lead-stands-in-its-own-acid.expect.predict.options" = ["La série se tromperait simplement à propos du plomb", "Cinétique : la formation d'hydrogène sur le plomb coûte environ 0,88 V de surtension, bien plus que les +0,13 V qu'offre l'acide — bloquée, pas absente", "Les plaques recevraient un revêtement de protection en usine qui tiendrait l'acide à distance"]
"lead-stands-in-its-own-acid.expect.predict.misconception" = "Quand une observation contredit une règle, les gestes tentants sont de rejeter la règle ou d'inventer un protecteur. Aucun des deux n'est nécessaire : la série est un énoncé d'équilibre, et elle a raison — le plomb dans l'acide est en aval. Mais c'est à peine en aval (+0,13 V), et le premier produit nécessaire de la réaction, le gaz hydrogène sur une surface de plomb, porte un péage d'activation d'environ 0,88 V. La facture dépasse le budget, la réaction est donc bloquée sur toute échelle de temps humaine. La batterie existe précisément dans cet écart."
"lead-stands-in-its-own-acid.expect.predict.diagnosis.0.reveals" = "Les règles seraient justes ou fausses, jamais bornées : une seule observation contradictoire, et la série serait rejetée, plutôt que de se demander ce qu'elle affirme réellement."
"lead-stands-in-its-own-acid.expect.predict.diagnosis.0.next" = "Teste la série là où aucune barrière cinétique ne s'applique : v2 — le plomb se dépose à partir de ses propres ions sur le zinc, 0,0100 mol, exactement dans le sens qu'exige le classement. La série a raison sur l'emplacement de l'équilibre ; elle n'a jamais prétendu être une horloge, et cette paire de bechers en fait la différence."
"lead-stands-in-its-own-acid.expect.predict.diagnosis.1.reveals" = "L'inertie exigerait un agent : « rien ne se passe » devrait être causé par quelque chose — un revêtement, un additif — plutôt que par une barrière propre au mécanisme de la réaction."
"lead-stands-in-its-own-acid.expect.predict.diagnosis.1.next" = "Aucun revêtement n'est modélisé, et aucun n'est invoqué : la barrière est la chimie de surface de la formation de H₂ sur le plomb lui-même, et le banc énonce le calcul — +0,13 V offerts, ~0,88 V exigés. Un siècle et demi de batteries au plomb-acide repose sur cet écart, pas sur une étape d'usine."
"lead-stands-in-its-own-acid.registers.lv1" = "Une batterie de voiture est du métal qui se tient dans un acide fort — pendant des années d'affilée. L'acide adorerait dévorer le plomb, mais former des bulles de gaz sur le plomb est si difficile que rien ne se passe du tout. La batterie existe grâce à ce rien."
"lead-stands-in-its-own-acid.registers.lv2" = "v1 : le plomb dans l'acide est rapporté inerte — force motrice +0,13 V contre ~0,88 V de surtension d'hydrogène sur le plomb ; pas de gaz, pas de dissolution, pH inchangé. v2 : la même série fonctionne toujours quand la cinétique le permet — Zn sous Pb, si bien que 0,0100 mol de plomb se dépose sur le zinc qui se dissout."
"lead-stands-in-its-own-acid.registers.lv3" = "La comparaison avec le zinc est la leçon de conception : la grâce du zinc est de 0,03 V (`charging-fights-the-series` fait lâcher cette laisse avec de l'acide molaire) ; celle du plomb est d'environ 0,75 V — la plus large marge de sécurité de tout métal bon marché situé sous l'hydrogène, ce pourquoi le plomb a été LE métal des accumulateurs pendant cent soixante ans. Honnêteté : la surtension est une constante cinétique mise en scène dont la portée déclarée est « l'échelle de temps d'une leçon », et le verdict ici repose sur elle seule — le vrai plomb dans l'acide sulfurique développe en plus un film de sulfate de plomb que ce banc ne modélise pas, si bien que la vraie batterie est encore mieux protégée que ce becher."
"salt-holds-the-water-liquid.summary" = "Les particules dissoutes abaissent le point de congélation : sous le même refroidissement, l'eau salée commence à geler près de −3,5 °C et forme moins de glace que l'eau pure"
"salt-holds-the-water-liquid.expect.predict.question" = "Deux bechers identiques perdent la même chaleur côte à côte : l'un contient de l'eau pure, l'autre a une grosse cuillère de sel dissoute dedans. Qu'est-ce qui diffère ?"
"salt-holds-the-water-liquid.expect.predict.options" = ["Les deux, à 0 °C — geler à zéro, c'est ce que fait l'eau", "Le salé en premier — l'eau salée est plus épaisse, et plus épais est plus proche du solide", "Le pur commence à 0 °C ; la saumure commence près de −3,5 °C et fabrique donc moins de glace pour le même refroidissement"]
"salt-holds-the-water-liquid.expect.predict.misconception" = "La première réponse fait du point de congélation une propriété fixe du solvant, le sel dissous n'étant qu'une cargaison qui ne change rien. C'est en fait une propriété de la solution : les ions gênent l'eau qui tente de s'organiser en un réseau de glace, si bien que la saumure doit être plus froide avant que geler ne devienne avantageux. La même énergie retirée forme donc moins de glace dans la saumure. La réponse « plus épais » confond viscosité et solidité : la façon dont un liquide s'écoule et le fait que ses molécules puissent s'organiser en un cristal sont des questions différentes, aux réponses ici opposées."
"salt-holds-the-water-liquid.expect.predict.diagnosis.0.reveals" = "Le point de congélation appartiendrait au solvant seul, un point c'est tout — ce qui est dissous ne serait qu'une cargaison, embarquée sans voix au chapitre."
"salt-holds-the-water-liquid.expect.predict.diagnosis.0.next" = "Compte les voix de la cargaison : environ 1,86 °C de résistance par mole de particules dissoutes par kilogramme d'eau en solution diluée, et le sel se scinde largement en deux ions — 0,1 mol de NaCl dans 100 g d'eau fait environ 2 mol/kg de particules. Le banc lit le nombre réel de particules à partir de la spéciation résolue, et l'activité du solvant avec elle, si bien que cette saumure commence à geler près de −3,5 °C là où la règle empirique seule dirait −3,7, et continue de descendre jusqu'à environ −3,7 à mesure que la glace qui se forme laisse le reste plus salé. C'est pourquoi le sel de déneigement est dosé en degrés."
"salt-holds-the-water-liquid.expect.predict.diagnosis.1.reveals" = "L'épaisseur vue comme une proximité avec le solide : un liquide plus lourd, plus salé, semblerait déjà à moitié gelé, donc il devrait finir de geler en premier."
"salt-holds-the-water-liquid.expect.predict.diagnosis.1.next" = "Sépare les deux idées : l'écoulement concerne la façon dont les molécules glissent les unes sur les autres ; le gel concerne leur capacité à s'organiser en un réseau. Les ions dissous gênent ce réseau, donc plus de sel signifie que le becher résiste plus longtemps, pas moins — plus tu le sales, plus il doit faire froid avant que la glace ne devienne avantageuse."
"salt-holds-the-water-liquid.registers.lv1" = "L'eau pure commence à geler à zéro. L'eau salée résiste jusqu'à environ trois degrés et demi en dessous de zéro, et devient encore un peu plus froide en gelant, si bien que le même refroidissement y produit moins de glace — le sel gêne la formation de la glace. C'est le secret derrière le salage des routes verglacées."
"salt-holds-the-water-liquid.registers.lv2" = "Abaissement du point de congélation. 0,1 mol de NaCl dans 100 g d'eau représente 1,0 mol/kg de sel mais environ 2,0 mol/kg de particules dissoutes. La formule imprimée dans un manuel, ΔT ≈ 1,86 K·kg/mol × molalité, est la limite diluée et donnerait 3,7 K ; ce que calcule le banc est la relation dont cette formule est la limite, avec l'activité propre du solvant incluse, et un thermomètre dans une vraie saumure confirme la réponse plus petite. À mesure que de la glace pure se forme, le sel reste dans le liquide résiduel ; le banc résout à nouveau cette saumure plus concentrée et son liquidus plus bas."
"salt-holds-the-water-liquid.registers.lv3" = "Deux choses sont calculées plutôt que consultées, et ce sont des choses différentes. Le nombre de particules provient de la spéciation résolue — le même recensement que tire `particles` — plutôt que d'un facteur de van 't Hoff entier. L'activité du SOLVANT provient de l'espèce eau de cette même spéciation, et le point de congélation est 1/T_f = 1/T_f° − (R/ΔH_fus)·ln a_w, la relation dont ΔT = K_f·m est la limite diluée ; le jeu de données d'interaction ionique vers lequel cette concentration est dirigée rapporte un coefficient osmotique proche de 0,94 pour cette saumure, et c'est là toute la différence entre les 3,7 K du manuel et les 3,4 K mesurés. Seule autant d'eau gèle que les 15 kJ retirés peuvent couvrir, chaleur latente comprise, et l'inventaire garde l'eau liquide et la glace pure côte à côte. Chaque transfert de glace invalide les anciennes molalités, si bien que PHREEQC respécie le compartiment liquide devenu plus petit, et le passage de phase converge vers une température/un liquidus communs. En dessous de la limite de modèle déclarée de 252 K, il faudrait des sels solides et un diagramme de phase eutectique propre au soluté ; le banc s'arrête plutôt que d'extrapoler."

# Consommation finie de l'acide : révisée en même temps que le réseau
# cinétique, 2026-09-06.

"doubling-the-thiosulfate-doubles-the-rate.summary" = "Doubler le thiosulfate double la vitesse initiale, pas nécessairement le soufre accumulé plus tard"
"doubling-the-thiosulfate-doubles-the-rate.expect.predict.question" = "Avant que l'un ou l'autre mélange ne réagisse, doubler le thiosulfate à activité protonique égale change la vitesse initiale de quel facteur ?"
"doubling-the-thiosulfate-doubles-the-rate.expect.predict.options" = ["Aucun changement", "Un facteur deux selon la loi de vitesse d'ordre un énoncée", "Toujours un facteur quatre"]
"doubling-the-thiosulfate-doubles-the-rate.expect.predict.misconception" = "La vitesse initiale et le rendement à temps fini sont des grandeurs différentes. Pendant dix secondes, l'acide et le thiosulfate sont tous deux consommés ; le mélange le plus rapide perd son acide plus vite."
"doubling-the-thiosulfate-doubles-the-rate.expect.predict.diagnosis.0.reveals" = "La concentration serait traitée comme une quantité incapable d'influencer les rencontres."
"doubling-the-thiosulfate-doubles-the-rate.expect.predict.diagnosis.0.next" = "Compare d'abord les entrées de la loi de vitesse initiale avant d'interpréter le soufre après dix secondes."
"doubling-the-thiosulfate-doubles-the-rate.expect.predict.diagnosis.1.reveals" = "L'ordre de réaction serait déduit d'un coefficient stœchiométrique sans rapport."
"doubling-the-thiosulfate-doubles-the-rate.expect.predict.diagnosis.1.next" = "L'ordre mis en scène pour le thiosulfate est un ; le coefficient deux sur les protons consommés ne le change pas."
"doubling-the-thiosulfate-doubles-the-rate.registers.lv1" = "La solution la plus concentrée commence à produire du soufre plus vite. Plus tard, une comparaison dépend aussi de la quantité d'acide qu'il reste."
"doubling-the-thiosulfate-doubles-the-rate.registers.lv2" = "Initialement r = k c(thiosulfate) a(H+), donc doubler c double r. Un avancement à temps fini intègre une vitesse changeante : deux équivalents d'acide sont consommés pour chaque mole de soufre formée."
"doubling-the-thiosulfate-doubles-the-rate.registers.lv3" = "Les coefficients de vitesse calibrés existants restent inchangés. Le réseau consomme désormais des équivalents d'acide fort représentés et met à jour l'activité protonique à chaque intervalle avec un coefficient d'activité localement figé. Le réapprovisionnement découplé par un acide faible est explicitement omis, et le thiosulfate lui-même manque encore de données de spéciation aqueuse."
"the-acid-term-is-an-activity.summary" = "Une vitesse dépendant du proton utilise l'activité, tandis que la stœchiométrie consomme des équivalents d'acide"
"the-acid-term-is-an-activity.expect.predict.question" = "Pourquoi doubler la quantité initiale de HCl ne double-t-il pas exactement une vitesse initiale dépendant de l'activité ?"
"the-acid-term-is-an-activity.expect.predict.options" = ["La loi d'ordre un devrait être fausse", "Le coefficient d'activité peut changer avec la force ionique", "Le solveur aurait le droit d'inventer des ordres de réaction"]
"the-acid-term-is-an-activity.expect.predict.misconception" = "L'ordre un par rapport à l'activité n'est pas identique à l'ordre un par rapport à une concentration de flacon non corrigée."
"the-acid-term-is-an-activity.expect.predict.diagnosis.0.reveals" = "Activité et concentration seraient traitées comme identiques dans toutes les conditions."
"the-acid-term-is-an-activity.expect.predict.diagnosis.0.next" = "Compare 10^(-pH) avant d'attendre ; c'est cette activité qui entre dans la vitesse initiale."
"the-acid-term-is-an-activity.expect.predict.diagnosis.1.reveals" = "Les données du modèle seraient confondues avec des grandeurs déduites par le solveur."
"the-acid-term-is-an-activity.expect.predict.diagnosis.1.next" = "L'ordre est fourni ; la solution native fournit l'activité initiale, et la stœchiométrie limite ce qui peut réagir."
"the-acid-term-is-an-activity.registers.lv1" = "Deux fois plus d'acide ne signifie pas toujours deux fois plus de poussée chimique. Les autres ions de la solution influencent cette poussée."
"the-acid-term-is-an-activity.registers.lv2" = "Le terme protonique initial est a(H+) = 10^(-pH), pas simplement la molarité nominale. Compare ce rapport d'activité initial séparément des quantités de soufre après une seconde, quand l'acide et le thiosulfate ont déjà été consommés."
"the-acid-term-is-an-activity.registers.lv3" = "Le pH initial natif détermine l'activité. Pendant un intervalle cinétique découplé à acide fort, le coefficient est maintenu localement fixe tandis que l'inventaire d'acide représenté diminue. Cette approximation n'est pas une résolution complète de la force ionique évolutive ou d'un acide tamponné ; le rééquilibrage aqueux suit l'intervalle."
"the-cross-disappears.summary" = "Avant de chronométrer un seuil de trouble, vérifier si le réactif limitant le permet"
"the-cross-disappears.expect.predict.question" = "Chaque becher contient 2 mmol d'acide fort, et former 1 mmol de soufre consomme 2 mmol d'acide. Attendre plus longtemps peut-il garantir l'ancien point final de 1 mmol de soufre ?"
"the-cross-disappears.expect.predict.options" = ["Oui, car il y a un excès de thiosulfate", "Oui, car toute réaction d'ordre un se termine en un temps fixe", "Non : l'inventaire d'acide fixe la capacité, et son épuisement ralentit la vitesse"]
"the-cross-disappears.expect.predict.misconception" = "Un seuil observable n'a de sens que si tous les réactifs nécessaires peuvent l'atteindre. Une comparaison de vitesse à temps fini ne doit pas supposer silencieusement un réservoir d'acide infini."
"the-cross-disappears.expect.predict.diagnosis.0.reveals" = "Seul le réactif visuellement intéressant serait compté."
"the-cross-disappears.expect.predict.diagnosis.0.next" = "Compte d'abord les deux équivalents d'acide consommés par soufre avant de comparer les concentrations de thiosulfate."
"the-cross-disappears.expect.predict.diagnosis.1.reveals" = "Une loi de vitesse serait comprise comme un temps d'achèvement fixe."
"the-cross-disappears.expect.predict.diagnosis.1.next" = "Examine l'acide restant après chaque attente ; un inventaire de réactif changeant change la vitesse."
"the-cross-disappears.registers.lv1" = "Un mélange plus concentré peut se troubler plus tôt, mais attendre ne fournit pas d'acide manquant. Compte les réactifs avant d'utiliser une marque qui disparaît comme un chronomètre."
"the-cross-disappears.registers.lv2" = "Au maximum 1 mmol de soufre peut se former à partir de 2 mmol d'acide représenté, selon cette stœchiométrie. L'épuisement réduit la vitesse à mesure que cette limite est approchée. Les anciens temps de passage à acide constant ne sont pas valables pour cet inventaire d'acide fini."
"the-cross-disappears.registers.lv3" = "Les instantanés à 24, 49 et 113 secondes sont des temps d'observation, non des temps de passage affirmés. Les seuils de trouble optique sont des conventions pédagogiques, pas des lois de diffusion universelles mesurées pour le soufre. Le coefficient cinétique absolu reste calibré ; la consommation finie d'acide est désormais explicite."
"the-ten-degree-rule-and-where-it-frays.summary" = "La température change la constante de vitesse ; les rendements à temps fini reflètent aussi l'épuisement"
"the-ten-degree-rule-and-where-it-frays.expect.predict.question" = "Une hausse de température de dix degrés garantit-elle exactement deux fois plus de soufre après une attente fixe ?"
"the-ten-degree-rule-and-where-it-frays.expect.predict.options" = ["Oui, à toute température et tout taux de conversion", "Non : Arrhenius change la constante de vitesse, tandis que l'épuisement affecte aussi le rendement intégré", "Non : la température n'entre jamais dans une loi de vitesse"]
"the-ten-degree-rule-and-where-it-frays.expect.predict.misconception" = "Une règle empirique pour une constante de vitesse n'est pas une règle universelle pour une quantité de produit accumulée."
"the-ten-degree-rule-and-where-it-frays.expect.predict.diagnosis.0.reveals" = "Constante de vitesse et rendement à temps fini seraient identifiés l'un à l'autre."
"the-ten-degree-rule-and-where-it-frays.expect.predict.diagnosis.0.next" = "Compare les facteurs d'Arrhenius initiaux, puis examine combien d'acide reste dans chaque récipient plus chaud."
"the-ten-degree-rule-and-where-it-frays.expect.predict.diagnosis.1.reveals" = "Le modèle cinétique serait lu comme portant uniquement sur les concentrations."
"the-ten-degree-rule-and-where-it-frays.expect.predict.diagnosis.1.next" = "L'exponentielle d'Arrhenius contient la température absolue et l'énergie d'activation fournie."
"the-ten-degree-rule-and-where-it-frays.registers.lv1" = "Les mélanges chauds commencent à réagir plus vite dans ce modèle. Ils épuisent aussi leur acide plus vite, si bien que les quantités finales de soufre n'ont pas à suivre une simple règle de doublement."
"the-ten-degree-rule-and-where-it-frays.registers.lv2" = "Compare k(T2)/k(T1) = exp[(Ea/R)(1/T1 − 1/T2)] séparément du rapport de soufre à temps fini. Même à énergie d'activation fixe, le rapport d'Arrhenius dépend des deux températures absolues ; le rapport de rendement dépend en plus de l'épuisement."
"the-ten-degree-rule-and-where-it-frays.registers.lv3" = "Les paramètres de vitesse existants sont calibrés près de la température ambiante ; les vitesses extrapolées sont des prédictions du modèle, non une série de températures validée indépendamment. L'étape cinétique utilise des coefficients d'activité protonique localement figés et conserve l'inventaire d'acide représenté."
"two-beakers-and-one-clock.summary" = "Une attente fait avancer chaque récipient préparé ; les témoins expérimentaux partagent le temps écoulé"
"two-beakers-and-one-clock.expect.predict.question" = "Quand le banc partagé attend dix secondes, quels récipients préparés avancent ?"
"two-beakers-and-one-clock.expect.predict.options" = ["Seul le dernier récipient examiné", "Chaque récipient sur l'horloge partagée", "Seul le récipient le plus concentré"]
"two-beakers-and-one-clock.expect.predict.misconception" = "Observer un récipient ne lui donne pas une horloge chimique séparée."
"two-beakers-and-one-clock.expect.predict.diagnosis.0.reveals" = "La sélection dans l'interface serait prise à tort pour une frontière temporelle physique."
"two-beakers-and-one-clock.expect.predict.diagnosis.0.next" = "Examine les deux récipients avant et après la même attente et compare leur temps écoulé."
"two-beakers-and-one-clock.expect.predict.diagnosis.1.reveals" = "Une vitesse plus rapide serait confondue avec une permission pour le temps de s'écouler."
"two-beakers-and-one-clock.expect.predict.diagnosis.1.next" = "Les deux inventaires évoluent sur le même intervalle, chacun à sa propre vitesse dépendant de sa concentration."
"two-beakers-and-one-clock.registers.lv1" = "Les bechers partagent une horloge, pas une vitesse de réaction. L'un peut changer davantage pendant la même attente."
"two-beakers-and-one-clock.registers.lv2" = "Une comparaison équitable utilise le même intervalle écoulé et enregistre les concentrations initiales de chaque récipient. Les vitesses ultérieures dépendent du thiosulfate et de l'acide restants de chaque récipient, si bien que les rapports de soufre à temps fini n'ont pas à rester exactement constants."
"two-beakers-and-one-clock.registers.lv3" = "L'attente fait avancer chaque récipient indépendamment sur la même durée. Le solveur utilise un réseau stœchiométrique commun, mais chaque récipient possède son propre état et ses propres réactifs limitants ; la sélection et l'observation ne fournissent ni ne consomment de temps de réaction."
"a-salt-with-no-database.summary" = "Le refus était l'erreur. llnl.dat est fourni ici et définit l'ion, donc le sel se spécie : 7,0249045339 seul, et le témoin acide passe de 1,7485817507 à 1,8837734312"
"a-salt-with-no-database.expect.predict.question" = "Un outil rapporte n'avoir aucune donnée de spéciation pour un sel que tu as ajouté. Quelle est la vérification permettant de savoir si cette affirmation est vraie ?"
"a-salt-with-no-database.expect.predict.options" = ["L'accepter : un outil qui refuse de répondre est honnête, et c'est bien là l'essentiel", "Comparer avec une valeur de manuel et accepter le refus si les deux ne concordent pas", "Chercher, par son nom, l'espèce dans les données que l'outil fournit réellement, et lire ce qu'elles disent", "Ajouter plus de ce sel et voir si le refus change"]
"a-salt-with-no-database.expect.predict.misconception" = "Un refus est une affirmation sur le monde. Il t'arrive comme un fait, il peut être faux exactement comme un nombre calculé peut l'être, et contrairement à un nombre calculé, personne ne le re-dérive jamais. Ce banc a dit pendant des mois que le thiosulfate de sodium ne figurait dans aucune base de données PHREEQC qu'il fournissait. `vendor/iphreeqc/database/llnl.dat` est fourni dans ce dépôt ; la ligne 229 porte `S(+2)  S2O3-2  0  S` et la ligne 4585 `H+ + S2O3-2 = HS2O3-`. La vérification qui l'aurait détecté est un `grep` dans un répertoire, et refuser de répondre n'est honnête que tant que la raison de ce refus reste vraie."
"a-salt-with-no-database.expect.predict.diagnosis.0.reveals" = "Une lacune énoncée serait traitée comme auto-vérifiante, parce qu'un outil n'aurait rien à gagner à en inventer une."
"a-salt-with-no-database.expect.predict.diagnosis.0.next" = "Il n'a rien à y gagner et peut quand même se tromper. Une lacune est l'affirmation que des données n'existent pas, et cette affirmation devient obsolète dès que les données sont livrées ou que le câblage les atteint. Ce qui manquait ici n'a jamais été des données : l'élément était dans le fichier, et aucun chemin de code ne l'a demandé."
"a-salt-with-no-database.expect.predict.diagnosis.1.reveals" = "Le manuel serait érigé en arbitre de si l'outil possède des données."
"a-salt-with-no-database.expect.predict.diagnosis.1.next" = "Deux questions distinctes. La règle du manuel pour ce sel dit qu'une solution en serait alcaline, et la réponse calculée est 7,0249045339 — le manuel et l'outil sont donc en désaccord, et l'outil a raison : l'acide thiosulfurique n'est pas un acide faible, pKa2 environ 1,0, donc son anion s'hydrolyse à peine. Un désaccord avec une règle empirique ne prouve rien sur ce que contiennent les données d'un programme."
"a-salt-with-no-database.expect.predict.diagnosis.2.reveals" = "Le refus serait interprété comme un effet de seuil que davantage de matière pourrait franchir."
"a-salt-with-no-database.expect.predict.diagnosis.2.next" = "Une constante d'équilibre manquante manque à toute concentration. Ce qui CHANGE bel et bien avec la quantité, c'est précisément ce qui vaut la peine d'être mesuré : ce sel déplace le témoin acide de 1,7485817507 à 1,8837734312 et sa force ionique de 0,02006018054 à 0,16490617732 — et c'est exactement ainsi qu'on distingue un nombre calculé d'une valeur par défaut."
"a-salt-with-no-database.registers.lv1" = "Ce banc disait autrefois ne pas pouvoir déterminer ce que ce sel fait à l'acidité, et c'était une meilleure réponse qu'un chiffre assuré que personne n'aurait vérifié — jusqu'à ce que quelqu'un le vérifie, et trouve les données dans l'un des propres fichiers du laboratoire. Dire qu'on ne sait pas est honnête. Retourner vérifier si c'est toujours le cas est l'autre moitié de cette même honnêteté."
"a-salt-with-no-database.registers.lv2" = "Trois bechers. L'acide seul affiche 1,7485817507. Le même acide avec le sel dedans affiche 1,8837734312, parce qu'à cette acidité une partie de l'anion retient un proton, et sa force ionique passe de 0,02006018054 à 0,16490617732. Le sel seul affiche 7,0249045339 — pas la valeur alcaline que prédit la règle de manuel pour le sel d'un acide faible, car l'acide thiosulfurique n'est pas faible, et pas non plus les 7,00 qu'imprimerait un programme sans rien à dire."
"a-salt-with-no-database.registers.lv3" = "Cette entrée garde le nom de l'erreur. Ce qu'elle enseignait auparavant était que le thiosulfate n'avait de tranche d'équilibre aqueux dans aucun jeu de données fourni ; `vendor/iphreeqc/database/llnl.dat` est fourni ici et porte `S(+2)  S2O3-2  0  S` à la ligne 229 et `H+ + S2O3-2 = HS2O3-  log_k 1.0139` à la ligne 4585. `databases::minteq_v4()` emprunte cette constante comme pseudo-élément `Thiosulfate`, délibérément PAS comme l'état redox S(+2) du soufre : les jeux de données utilisés ne définissent que S(-2) et S(6), couplés via pe, et le pe d'un becher ouvert est fixé près de 19,6 par l'oxygène atmosphérique, si bien qu'en tant que véritable degré d'oxydation, le flacon se serait oxydé en sulfate avant même l'arrivée de l'acide. Le nombre emprunté règle le comportement acido-basique et rien d'autre — la chimie réductrice et la vitesse de décomposition restent mises en scène. La loi de vitesse a été reclée sur `S2O3-2` dans le même changement, car un becher résolu contient cela et non `Na2S2O3`, et son préfacteur calibré a été réajusté de 2,2e8 à 3,0e8 pour maintenir l'observable des quarante secondes face à la nouvelle activité protonique."
"the-acid-is-never-used-up.summary" = "L'acide fini est consommé : une ancienne approximation à réservoir fixe est désormais un test de réactif limitant"
"the-acid-is-never-used-up.expect.predict.question" = "Avec 5 mmol de thiosulfate et 2 mmol d'acide fort représenté, quelle quantité de soufre cette réaction consommatrice de protons peut-elle former sans nouvelle source d'acide ?"
"the-acid-is-never-used-up.expect.predict.options" = ["Au maximum 1 mmol, car chaque soufre exige deux équivalents d'acide", "Les 5 mmol en entier, car le pH est un apport d'acide permanent", "Plus de soufre à chaque minute supplémentaire, sans limite d'inventaire"]
"the-acid-is-never-used-up.expect.predict.misconception" = "Une activité mesurée affecte la vitesse ; ce n'est pas un inventaire de réactif inépuisable."
"the-acid-is-never-used-up.expect.predict.diagnosis.0.reveals" = "Une valeur de pH mise en cache serait traitée comme un réservoir de matière."
"the-acid-is-never-used-up.expect.predict.diagnosis.0.next" = "Compte les équivalents H+ consommés dans la réaction équilibrée et compare-les aux 2 mmol initiaux."
"the-acid-is-never-used-up.expect.predict.diagnosis.1.reveals" = "Le temps d'intégration aurait le droit de l'emporter sur la conservation."
"the-acid-is-never-used-up.expect.predict.diagnosis.1.next" = "Une attente plus longue ne change l'avancement que dans les limites du réactif ; examine ensemble l'acide et le soufre restants."
"the-acid-is-never-used-up.registers.lv1" = "L'acide est désormais consommé à mesure que la réaction avance. Attendre ne peut pas en verser davantage."
"the-acid-is-never-used-up.registers.lv2" = "L'étape cinétique équilibrée consomme deux équivalents H+ représentés par soufre, si bien que les 2 mmol d'acide initiaux limitent son avancement à 1 mmol. L'échange gazeux et la spéciation aqueuse ultérieurs déterminent le pH affiché ; la seule limite stœchiométrique ne le prédit pas."
"the-acid-is-never-used-up.registers.lv3" = "L'identifiant historique du catalogue est conservé pour les liens, mais l'ancienne approximation à acide constant n'est plus le comportement implémenté. Le réseau borné dépense l'inventaire d'acide et modifie localement son activité ; des tests indépendants de conservation et de vitesse intégrée couvrent l'échelle, le rapport d'acide et le partage temporel. Le couplage manquant avec les acides faibles reste une limite explicite."
"liquid-nitrogen-freezes-ethanol.summary" = "Dans un récipient virtuel ouvert, l'azote liquide bout tandis que l'éthanol gèle ; les deux changements de phase partagent un seul bilan de chaleur latente"
"liquid-nitrogen-freezes-ethanol.registers.lv1" = "L'azote liquide bout en emportant de la chaleur. L'éthanol gèle, et le bain froid reste près de −196 °C tant qu'il reste de l'azote liquide. C'est une expérience virtuelle : le véritable azote liquide exige une supervision formée, une protection du visage et des yeux, des gants cryogéniques, une forte ventilation, et un récipient ouvert."
"liquid-nitrogen-freezes-ethanol.registers.lv2" = "Le récipient ouvert couple deux changements de phase : refroidir et geler 10 mL d'éthanol fournit l'énergie qui vaporise une partie des 100 mL d'azote liquide. Le diazote traverse la frontière ouverte. Ne jamais sceller un cryogène ; le dégagement gazeux peut créer une pression dangereuse, et dans une pièce mal ventilée il déplace l'air respirable."
"liquid-nitrogen-freezes-ethanol.registers.lv3" = "Le moteur conserve l'énergie en faisant alimenter le refroidissement sensible de l'éthanol plus son ΔHfus vers le ΔHvap de l'azote, et conserve la masse en émettant GasEvolved:N2 à la frontière ouverte. Il suppose un équilibrage adiabatique instantané et omet le transfert limité par l'effet Leidenfrost, le choc thermique du verre, la morphologie de la neige carbonique d'éthanol, les fuites thermiques de la pièce et la concentration en oxygène de la pièce. L'avertissement de sécurité est une métadonnée de manipulation, pas une chimie de mélange réactif."
"charcoal-holds-the-dye.summary" = "Le charbon actif retient la majeure partie d'un colorant dissous à sa surface ; la filtration retient cette part liée tandis que le reste passe"
"charcoal-holds-the-dye.expect.predict.question" = "Un gramme de charbon actif rencontre 327 mg d'hélianthine dissoute avant que le mélange ne soit filtré. Que devrait contenir le filtrat ?"
"charcoal-holds-the-dye.expect.predict.options" = ["De l'eau pure — le charbon est un purificateur universel et retire toute substance dissoute", "Moins de colorant, mais encore un peu : le charbon a une capacité de surface finie, et seule la part non liée passe le filtre", "Les 327 mg de colorant en entier — le papier filtre retient le charbon, donc tout ce qu'il retenait doit être repressé dans l'eau"]
"charcoal-holds-the-dye.expect.predict.misconception" = "L'adsorption est facilement confondue avec la destruction ou la purification parfaite. Le colorant est conservé : ce seul équilibre de surface mis en scène le répartit entre le charbon et l'eau. Le papier filtre sépare ensuite les phases, retenant le charbon et son colorant lié tandis que la part encore dissoute suit l'eau. Une capacité de surface finie fait de « la majeure partie » et « tout » des réponses chimiquement différentes."
"charcoal-holds-the-dye.expect.predict.diagnosis.0.reveals" = "La poudre noire serait traitée comme un puits universel : si la couleur s'estompe, tout contaminant aurait disparu et l'eau serait sûre."
"charcoal-holds-the-dye.expect.predict.diagnosis.0.next" = "Examine les deux récipients après filtration. Le charbon retenu porte du colorant, mais v2 rapporte toujours de l'hélianthine dissoute. Filtration plus une isotherme d'adsorption n'est pas un certificat d'eau potable, et ce banc ne fait aucune affirmation sur les microbes, les toxines, le goût, ou tout second soluté."
"charcoal-holds-the-dye.expect.predict.diagnosis.1.reveals" = "La filtration serait imaginée inverser l'adsorption, comme si retenir le solide forçait sa cargaison de surface à traverser le papier."
"charcoal-holds-the-dye.expect.predict.diagnosis.1.next" = "Suis la matière plutôt que la couleur : le colorant lié appartient au registre du solide retenu ; le colorant libre appartient au registre du liquide. Filtrer déplace la phase liquide et laisse la phase solide derrière, si bien que chaque part va là où va sa phase."
"charcoal-holds-the-dye.registers.lv1" = "Le charbon noir attrape la majeure partie du colorant orange et le retient fermement quand l'eau traverse le papier. L'eau en dessous est moins colorée, mais pas propre : un peu de colorant est encore dissous, car un gramme de charbon n'offre qu'une surface limitée."
"charcoal-holds-the-dye.registers.lv2" = "Un équilibre de Langmuir répartit 0,001 mol (327 mg) d'hélianthine entre 1 g de charbon actif et 100 mL d'eau. La capacité de monocouche mise en scène de 200 mg/g est inférieure à la dose, si bien que l'adsorption est substantielle mais incomplète ; la filtration retient le charbon et sa part adsorbée, tandis que le colorant dissous restant entre dans v2."
"charcoal-holds-the-dye.registers.lv3" = "Le récipient porte les moles adsorbées comme de la matière conservée appartenant au sorbant, séparée de l'inventaire dissous. L'unique isotherme installée a qmax = 200 mg/g et K = 0,05 L/mg, deux estimations couramment tabulées dans une filière de provenance encore en attente de révision. C'est une projection d'équilibre instantané, pas une cinétique d'absorption : `wait` ne change rien. La qualité du charbon, la distribution de taille des pores, l'activation, la surface spécifique, la dépendance au pH et l'adsorption compétitive sont absentes, si bien que ce résultat ne vaut que pour l'hélianthine sur la ligne nominale de charbon actif."
"chains-slide-networks-do-not.summary" = "À la même température de 150 °C, un thermoplastique de polyéthylène ramollit de façon réversible tandis qu'un thermodurcissable réticulé reste rigide"
"chains-slide-networks-do-not.expect.predict.question" = "Deux objets en plastique de deux grammes sont chauffés à environ 150 °C. L'un est du polyéthylène thermoplastique ; l'autre est une résine thermodurcissable durcie. Qu'est-ce qui diffère ?"
"chains-slide-networks-do-not.expect.predict.options" = ["Les deux fondent de la même façon — le plastique est un seul type de substance une fois assez chaud", "Le thermodurcissable ramollit en premier, car ses réticulations conduisent la chaleur entre les chaînes", "Le thermoplastique ramollit à mesure que ses chaînes séparées glissent ; le thermodurcissable réticulé reste rigide car il n'a pas de point de fusion"]
"chains-slide-networks-do-not.expect.predict.misconception" = "« Plastique » nomme une classe d'usage, pas une seule architecture moléculaire. Un thermoplastique contient des chaînes séparées maintenues par des attractions que la chaleur peut surmonter. Durcir un thermodurcissable relie les chaînes de façon covalente en un réseau, supprimant le mouvement de glissement qui rend possible la fusion et le remodelage. L'absence de point de fusion est la réponse, pas une donnée manquante."
"chains-slide-networks-do-not.expect.predict.diagnosis.0.reveals" = "Tous les plastiques seraient traités comme une seule matière, dont la seule différence significative serait la chaleur nécessaire pour fondre."
"chains-slide-networks-do-not.expect.predict.diagnosis.0.next" = "Compare les deux verdicts du moteur à la même température. Le thermoplastique rapporte un état ramolli réversible ; le thermodurcissable rapporte explicitement aucun point de ramollissement. Chauffe davantage, et le réseau se décompose plutôt que de franchir un seuil de fusion caché et plus élevé."
"chains-slide-networks-do-not.expect.predict.diagnosis.1.reveals" = "La réticulation serait entendue comme un meilleur transport de chaleur plutôt que comme une contrainte topologique empêchant des chaînes entières de glisser."
"chains-slide-networks-do-not.expect.predict.diagnosis.1.next" = "Demande-toi ce qui doit bouger pour qu'un objet soit remodelé. La chaleur n'a pas besoin de circuler différemment : des chaînes séparées doivent passer les unes devant les autres. Les réticulations attachent ces chaînes en un seul réseau, si bien que le mouvement requis n'existe plus."
"chains-slide-networks-do-not.registers.lv1" = "Chauffe les deux pièces également. Le thermoplastique s'assouplit et pourrait être pressé dans une nouvelle forme ; la résine durcie reste dure. Ses chaînes sont liées ensemble en un seul filet, il ne reste donc plus de chaînes libres capables de glisser."
"chains-slide-networks-do-not.registers.lv2" = "À environ 150 °C, la feuille pédagogique de polyéthylène dépasse sa fusion cristalline mise en scène de 130 °C et rapporte Ramolli, réversible au refroidissement. Le thermodurcissable durci rapporte Rigide : son réseau réticulé de façon covalente n'a pas de point de ramollissement. Au-delà de son seuil de décomposition distinct de 300 °C, il se carbonise au lieu de fondre."
"chains-slide-networks-do-not.registers.lv3" = "Des lignes de réponse thermique propres au matériau fournissent la capacité thermique des objets non résolus et associent la température actuelle à seulement trois états : rigide, ramolli ou carbonisé. Les seuils sont mis en scène, non prédits, et restent dans une filière de provenance en attente de révision. La ligne thermoplastique ne vaut que pour le HDPE moulé ; le PS amorphe, le PVC et l'acrylique ramollissent à des transitions vitreuses que ce modèle ne représente pas. Aucune viscosité, débit, degré de durcissement, géométrie de moulage ou changement de forme n'est calculé. La carbonisation n'est qu'un état persistant et une narration : aucune cendre ou produit volatil inventé n'entre dans le registre."

