"sugar-syrup-by-density.summary" = "25,0 g de sucre dans 100 mL d'eau → balance 124,70 g → 20,05 % m/m → ρ = 1,0813 g/mL"
"sugar-syrup-by-density.expect.predict.question" = "Tu mélanges 25,0 g de sucre à 100 mL d'eau jusqu'à ce qu'il disparaisse. La balance affiche 124,70 g, donc le sirop est à 20,05 % de sucre en masse. Que lirait un aréomètre pour sa densité ?"
"sugar-syrup-by-density.expect.predict.options" = ["0,998 g/mL — le sucre s'est dissous, et dissoudre ne change pas la densité de l'eau", "1,081 g/mL", "1,59 g/mL — la densité des cristaux de sucre, ce qui a été versé"]
"sugar-syrup-by-density.expect.predict.misconception" = "La première réponse traite dissoudre comme disparaître : si tu ne vois pas le sucre, il aurait cessé de contribuer à la masse de tout millilitre que tu prélèves. La balance dit le contraire — 124,70 g se trouvent désormais là où il y avait 99,70 g d'eau. La dernière réponse prend la densité propre du cristal, 1,59 g/mL, et la transfère à la solution ; mais une solution n'est pas un bloc de sucre, c'est du sucre dispersé dans l'eau, et sa densité doit se situer entre les deux composants. La densité est la propriété d'un mélange que l'on peut lire en quelques secondes sur un instrument flottant — c'est précisément pourquoi les raffineries de sucre, les brasseurs et les vignerons mesurent la concentration par ce biais."
"sugar-syrup-by-density.expect.predict.diagnosis.0.reveals" = "Dissous signifierait parti : le sucre aurait été absorbé dans l'identité de l'eau et n'apparaîtrait plus dans aucune propriété globale, si bien que le liquide serait simplement redevenu de l'eau."
"sugar-syrup-by-density.expect.predict.diagnosis.0.next" = "Pèse-le. La balance du banc affiche 124,70 g là où 100 mL d'eau seule affichent 99,70 g, et chacun de ces 25 grammes supplémentaires est toujours dans le becher. Fais ensuite tourner `kero properties sucrose-water-density w=0.2005` : 1,081 g/mL, nettement au-dessus des 0,998 de l'eau. Dissoudre cache une substance à tes yeux, jamais à la balance."
"sugar-syrup-by-density.expect.predict.diagnosis.1.reveals" = "La densité propre du soluté serait transférée telle quelle à la solution — 1,59 g/mL de sucre auraient été ajoutés, donc ce serait maintenant 1,59 g/mL."
"sugar-syrup-by-density.expect.predict.diagnosis.1.next" = "Encadre la valeur avant de calculer : le sirop est une part de sucre pour quatre parts d'eau en masse, sa densité doit donc se situer bien plus près des 0,998 de l'eau que des 1,59 du sucre cristallin. `kero properties sucrose-water-density` la place à 1,081. La densité d'un mélange est un compromis pondéré entre ses composants, jamais une copie du plus lourd."
"sugar-syrup-by-density.registers.lv1" = "Le sucre qui s'est dissous n'est allé nulle part — la balance le prouve, affichant 124,70 g là où l'eau seule affichait 99,70 g. Et comme le sucre est toujours là, le sirop est plus lourd pour sa taille que l'eau pure : 1,081 gramme dans chaque millilitre contre 0,998 pour l'eau. C'est pourquoi un flotteur à sirop s'enfonce plus bas dans un sirop faible que dans un sirop fort, et pourquoi tu peux déterminer la douceur d'une boisson sans la goûter."
"sugar-syrup-by-density.registers.lv2" = "D'abord la fraction massique : 25,0 g de saccharose dans 99,70 g d'eau font 25,0 / 124,70 = 20,05 % m/m, et la balance du banc confirme les 124,70 g. En injectant cette fraction dans la corrélation de densité, on obtient ρ = 1,0813 g/mL à 20 °C. Lu dans l'autre sens — ce qui correspond à l'usage réel de l'instrument —, une lecture d'aréomètre de 1,0810 désigne un sirop à 20 %, la densité mesure donc la concentration. Le sirop occupe ainsi 124,70 g ÷ 1,0813 g/mL = 115,3 mL, sensiblement plus que les 100 mL d'eau dont il est parti."
"sugar-syrup-by-density.registers.lv3" = "La donnée publiée est l'inverse de ce dont le banc a besoin : la table NBS 114 (Bates 1942) donne les °Brix À PARTIR de la densité relative apparente sous forme d'une cubique, donc `sucrose_water_density_g_ml` l'inverse par bissection plutôt que de réajuster un second polynôme — la dérivée de la cubique a un discriminant négatif, elle est donc strictement croissante et la bissection converge jusqu'au bit près, laissant les coefficients publiés comme seules données du fichier. La densité découle ensuite de ρ = d·ρ_eau(20 °C), la référence eau provenant de la corrélation de Tanaka que le reste du banc utilise déjà. Deux limites méritent d'être nommées. La corrélation refuse au-delà de 40 % m/m, car c'est là que s'arrête la table NBS 114, et une cubique extrapolée n'est pas une table. Et l'`inspect` propre du récipient rapporte toujours 100,0 mL de liquide, pas 115,3 : le modèle de volume liquide du banc additionne le volume du solvant et n'ajoute pas encore un volume molaire partiel de soluté, si bien que les 115,3 mL ici proviennent de la masse ÷ la densité, pas du récipient. Cet écart est la raison honnête pour laquelle cette leçon lit la balance et la corrélation plutôt que le volume du récipient."
"warm-water-climbs-less.summary" = "100 mL d'eau + 15 kJ : 25,00 °C → 60,99 °C, et σ chute de 71,97 à 66,07 mN/m en même temps"
"warm-water-climbs-less.expect.predict.question" = "Deux tubes de verre étroits identiques se tiennent dans l'eau, l'un à 25 °C et l'autre chauffé à 61 °C. Dans quel tube l'eau monte-t-elle le plus haut, et pourquoi ?"
"warm-water-climbs-less.expect.predict.options" = ["Le chaud — chauffer dilate l'eau, et de l'eau qui se dilate pousse plus loin dans le tube", "Aucun des deux — la hauteur de montée est fixée uniquement par le calibre du tube", "Le froid — la tension superficielle chute de 71,97 à 66,07 mN/m à mesure que l'eau se réchauffe, et la colonne qu'elle peut soutenir chute avec elle"]
"warm-water-climbs-less.expect.predict.misconception" = "La première réponse invoque la dilatation thermique, réelle mais infime, et qui pousse d'ailleurs dans le mauvais sens : l'eau plus chaude est moins dense, et une densité plus basse permettrait à elle seule à une colonne de se tenir PLUS HAUT, pas plus bas. Ce qui décide vraiment, c'est la traction de la surface, et elle s'affaiblit avec la chaleur — le même relâchement des liaisons hydrogène qui finit par faire bouillir le liquide. La seconde réponse prend le calibre du tube pour toute l'histoire. Le calibre compte — le diviser par deux double la montée — mais c'est un facteur dans un rapport, et la tension superficielle propre du liquide en est un autre."
"warm-water-climbs-less.expect.predict.diagnosis.0.reveals" = "La chaleur serait lue comme un « plus » à usage général : plus chaud signifierait plus grand, plus énergique, plus de poussée, donc un liquide plus chaud devrait monter plus haut."
"warm-water-climbs-less.expect.predict.diagnosis.0.next" = "Suis les deux effets séparément. Réchauffer l'eau de 25 °C à 61 °C abaisse sa densité de bien moins de 2 %, ce qui à soi seul élèverait légèrement la colonne. Cela abaisse la tension superficielle de 8,2 %, de 71,97 à 66,07 mN/m — et c'est la tension superficielle qui soulève. L'effet le plus grand l'emporte, et la colonne baisse. La chaleur relâche précisément les attractions qui maintenaient l'eau en haut."
"warm-water-climbs-less.expect.predict.diagnosis.1.reveals" = "La montée capillaire serait classée comme une propriété du tube plutôt que de la paire — verre et liquide —, donc le même tube devrait toujours donner la même montée."
"warm-water-climbs-less.expect.predict.diagnosis.1.next" = "Change seulement le liquide et regarde-le bouger : h = 2σcosθ/(ρgr) porte la tension superficielle du liquide au numérateur et sa densité au dénominateur, le tube contribuant r et l'angle de mouillage θ. Fais tourner `kero properties capillary-rise r=0.5 T=298.15` puis `r=0.25` : 29,44 mm et 58,89 mm, le calibre est donc bien réel. Fixe ensuite le calibre et fais varier la température, et le chiffre bouge à nouveau."
"warm-water-climbs-less.registers.lv1" = "L'eau grimpe toute seule dans un tube étroit, et elle montera d'environ 29 mm dans un tube d'un demi-millimètre de large. Chauffe l'eau, et elle ne monte plus aussi haut. Chauffer secoue les molécules d'eau les unes hors des autres, et c'est précisément cette attraction entre elles — la peau qui permet à un insecte de se tenir sur un étang — qui hissait la colonne dans le tube au départ."
"warm-water-climbs-less.registers.lv2" = "Le banc injecte 15 kJ dans 100 mL d'eau, et le thermomètre passe de 25,00 °C à 60,99 °C. Sur cette hausse, la tension superficielle chute de 71,97 à 66,07 mN/m, une baisse de 8,2 %. La loi de Jurin, h = 2σcosθ/(ρgr), dit que la montée suit σ directement : dans un tube de verre propre de 0,5 mm de calibre à 25 °C, la colonne se tient à 29,44 mm, et diviser le calibre par deux à 0,25 mm la double à 58,89 mm, car r se trouve au dénominateur."
"warm-water-climbs-less.registers.lv3" = "Aucun des deux chiffres n'est tabulé comme une montée. σ(T) est évalué à partir de la publication IAPWS R1-76, σ = B·τ^μ·(1 + b·τ) avec τ = 1 − T/T_c, et la hauteur est ensuite CALCULÉE à partir de cela, de la densité de l'eau de Tanaka et de la gravité standard de la CGPM — ce qui est tout le sens du critère d'acceptation de cette expérience : des valeurs mises en scène et sourcées, et la montée capillaire dérivée d'elles, non tabulée à côté. La limite du modèle est instructive. La publication IAPWS va bien jusqu'à 100 °C, mais la corrélation de densité de Tanaka s'arrête à 40 °C, donc `capillary_rise_mm` refuse aux 60,99 °C que ce script même atteint — une grandeur calculée n'est valide qu'à hauteur de son entrée la plus étroite, et le banc le dit plutôt que d'extrapoler. C'est pourquoi la leçon cite la tension superficielle à 61 °C mais prend ses hauteurs capillaires à 25 °C."
"catalyst-area-and-stirring-change-the-rate.summary" = "La charge de MnO₂, la taille des particules, la suspension et la vitesse d'agitation alimentent désormais un modèle explicite de surface exposée et de transfert de masse borné"
"catalyst-area-and-stirring-change-the-rate.expect.predict.question" = "Dix fois plus de dioxyde de manganèse dans le second flacon, tandis que le troisième agite dix fois plus vite. Après la même seconde, comment les trois se comparent-ils ?"
"catalyst-area-and-stirring-change-the-rate.expect.predict.options" = ["Le flacon avec plus de catalyseur est plus rapide ; l'agitation aide aussi un peu", "Les trois sont identiques, car un catalyseur n'est pas consommé et sa quantité ne peut donc pas compter", "Seule l'identité du catalyseur compte ; sa quantité et la vitesse d'agitation ne peuvent entrer dans aucune loi de vitesse", "Le flacon agité est plus lent, car l'agitation le refroidit"]
"catalyst-area-and-stirring-change-the-rate.expect.predict.misconception" = "Un catalyseur est conservé, mais cela ne rend pas sa quantité sans importance. Pour un catalyseur solide, plus de surface exposée fournit plus de sites de réaction simultanés. Agiter maintient les particules en suspension et renouvelle le liquide à leur surface. Kerotakis prend désormais en compte les quatre variables d'état, tout en bornant délibérément la correction de mélange, car il s'agit d'une corrélation pédagogique et non d'une simulation de transport à l'échelle des pores."
"catalyst-area-and-stirring-change-the-rate.expect.predict.diagnosis.0.reveals" = "Un catalyseur ne serait pas consommé et n'apparaîtrait pas dans la stœchiométrie, donc sa quantité ne pourrait pas compter."
"catalyst-area-and-stirring-change-the-rate.expect.predict.diagnosis.0.next" = "Raisonne sur l'endroit où la réaction se produit physiquement. Sur un catalyseur solide, cela se produit à la surface, donc dix fois plus de poudre représente dix fois plus de surface ; la broyer plus finement fait la même chose à nouveau sans ajouter de masse. « Non consommé » et « quantité sans importance » sont des affirmations différentes, et seule la première est vraie."
"catalyst-area-and-stirring-change-the-rate.expect.predict.diagnosis.1.reveals" = "L'identité du catalyseur est comprise, mais son activité est encore traitée comme un interrupteur booléen."
"catalyst-area-and-stirring-change-the-rate.expect.predict.diagnosis.1.next" = "Compare d'abord les deux flacons agités à vitesse égale. Leur seule différence est la masse de MnO₂, et la vitesse suit la surface exposée nominale."
"catalyst-area-and-stirring-change-the-rate.expect.predict.diagnosis.2.reveals" = "L'agitation serait un apport mécanique, donc elle devrait changer l'énergie du flacon."
"catalyst-area-and-stirring-change-the-rate.expect.predict.diagnosis.2.next" = "Observe le thermomètre pendant l'agitation : 25,0 °C avant et après. Sépare ensuite les deux idées — dans un vrai flacon, agiter aide en amenant la matière à la surface, pas en changeant la température."
"catalyst-area-and-stirring-change-the-rate.registers.lv1" = "Trois flacons agitent pendant la même seconde : l'un avec une pincée de poudre noire, l'un avec dix pincées, et l'un tournant dix fois plus vite. Plus de poudre pétille plus vite, car elle offre plus de surface. Une agitation plus rapide aide aussi en maintenant les particules et le peroxyde frais en contact, mais son bénéfice plafonne."
"catalyst-area-and-stirring-change-the-rate.registers.lv2" = "Le chemin du MnO₂ multiplie sa vitesse d'Arrhenius par la surface exposée relative à une référence déclarée. La surface sphérique nominale est A = 6V/d, donc la masse de catalyseur augmente la surface, et broyer jusqu'à un dixième du diamètre la multiplie par dix. La suspension et la vitesse de pointe du barreau agitateur ajoutent une correction finie de transfert externe ; les événements `Stirred` et `Ground` du catalyseur rapportent donc le couplage de vitesse comme actif."
"catalyst-area-and-stirring-change-the-rate.registers.lv3" = "C'est un modèle progressif de catalyse hétérogène, pas un solveur de Langmuir-Hinshelwood ou de diffusion en pore. Les lots de matière portent un diamètre de particule et une fraction en suspension. Leurs surfaces géométriques sont additionnées, pondérées par le contact, puis multipliées par 1 + g·u/(u₁/₂+u), où u est la vitesse de pointe calculée du barreau et g borne le gain maximal de mélange. Il permet des comparaisons causales de masse, de broyage et d'agitation tout en laissant explicitement non résolus la surface BET des pores, l'adsorption, l'agglomération et les coefficients de diffusion."
"teilchenmodell.name" = "Modèle particulaire (Teilchenmodell)"
"teilchenmodell.power" = "Permet de prédire que la matière est conservée lorsqu'elle semble disparaître — le sucre qui se dissout, la flaque qui sèche — et de classer les trois états comme une seule substance sous trois arrangements plutôt que comme trois substances. C'est le premier modèle où une cause invisible explique un effet visible."
"teilchenmodell.explains" = ["dissoudre sans aucune perte de masse", "les trois états de la matière et chaque transition entre eux", "la diffusion : pourquoi une odeur traverse une pièce sans que personne ne la porte", "pourquoi les gaz peuvent être comprimés et les liquides et solides non", "la dilatation thermique", "pourquoi une solution est limpide plutôt que trouble"]
"teilchenmodell.fails_at" = ["Ne peut pas dire POURQUOI le sodium et le chlore réagissent, seulement qu'ils le font — les particules n'ont aucune partie à réarranger.", "N'a pas de réponse à pourquoi une substance est un métal et une autre un gaz : chaque particule est la même sphère sans caractéristiques.", "Ne peut pas expliquer pourquoi l'huile et l'eau refusent de se mélanger, car il ne donne aux particules aucun moyen de s'attirer différemment entre elles.", "Pris au pied de la lettre, il invite à l'erreur classique consistant à attribuer des propriétés macroscopiques à des particules isolées — une particule chaude qui se dilate, une particule de cuivre qui est orange — et à remplir d'air l'espace entre les particules."]
"dalton-atommodell.name" = "Modèle atomique de Dalton (Atommodell nach Dalton)"
"dalton-atommodell.power" = "Transforme la matière en unités comptables et indestructibles, de masse fixe par élément, ce qui est précisément ce qui rend possible une formule chimique et une équation équilibrée. Avec Dalton, on peut prédire le rapport de masse dans lequel deux éléments se combinent avant même de faire l'expérience."
"dalton-atommodell.explains" = ["la conservation de la masse dans une réaction", "la loi des proportions constantes : chaque échantillon d'eau a la même composition", "la loi des proportions multiples : CO et CO2 mais jamais CO1,5", "la différence entre élément, composé et mélange", "pourquoi une équation chimique doit être équilibrée"]
"dalton-atommodell.fails_at" = ["L'atome est une sphère solide et indivisible, donc rien ne peut être transféré : les ions, la charge, l'électrolyse et l'électricité sont tous en dehors du modèle.", "« Tous les atomes d'un élément sont identiques » est tout simplement faux — les isotopes existent, et sont la raison pour laquelle la masse atomique relative du chlore est 35,45 plutôt qu'un nombre entier.", "Ne dit rien sur pourquoi les éléments se répartissent en familles, si bien que le tableau périodique doit être mémorisé plutôt que dérivé.", "Des atomes qui ne peuvent pas être divisés ne peuvent pas non plus se désintégrer ; la radioactivité n'y a aucune place."]
"kern-huelle-modell.name" = "Modèle noyau-couche (Kern-Hülle-Modell, Rutherford)"
"kern-huelle-modell.power" = "Scinde l'atome en deux parties aux rôles différents : un minuscule noyau lourd qui fixe l'identité et la masse, et une région électronique externe qui fait toute la chimie. C'est cette seule scission qui rend explicables les ions, la charge, la radioactivité et la distinction entre changement chimique et changement nucléaire."
"kern-huelle-modell.explains" = ["l'expérience de diffusion alpha : la plupart des particules passent, quelques-unes rebondissent", "qu'un atome est presque entièrement du vide", "les ions comme des atomes ayant perdu ou gagné des électrons", "l'électrolyse et la conduction électrique dans les solutions", "les isotopes : même charge nucléaire, masse différente", "pourquoi aucune réaction chimique ne change jamais quel élément on a devant soi"]
"kern-huelle-modell.fails_at" = ["Un électron en orbite classique rayonnerait et s'effondrerait en spirale dans le noyau en environ 10⁻¹¹ s. Le modèle prédit qu'aucun atome ne peut exister, ce qui est l'échec le plus net de toute la progression.", "La couche n'a aucune structure, elle ne peut donc pas dire pourquoi les gaz nobles sont inertes ni pourquoi le sodium perd exactement un électron.", "Il prédit un spectre d'émission continu ; l'hydrogène incandescent donne en réalité une poignée de raies nettes."]
"schalenmodell.name" = "Modèle en couches (Schalenmodell, Bohr)"
"schalenmodell.power" = "Place les électrons dans des couches numérotées de capacité fixe, et ce seul geste rend le tableau périodique déductible plutôt que mémorisé : le numéro de groupe est le nombre d'électrons externes, le numéro de période est la couche en cours de remplissage, et la règle de l'octet indique alors quel ion forme un élément avant même de l'avoir vu réagir."
"schalenmodell.explains" = ["le spectre de raies de l'hydrogène, quantitativement", "pourquoi les gaz nobles sont non réactifs", "les charges ioniques des groupes principaux, et donc les formules des sels", "pourquoi le sodium et le potassium se comportent de façon semblable", "l'énergie d'ionisation qui augmente au sein d'une période et bondit entre les couches", "les couleurs de flamme comme des électrons retombant entre les couches"]
"schalenmodell.fails_at" = ["Prédit le mauvais spectre pour tout ce qui est plus gros que l'hydrogène. L'hélium, avec ses deux électrons, n'a déjà plus de solution, et les chiffres du modèle sont tout simplement faux.", "Ne peut pas expliquer pourquoi la couche 4s se remplit avant la 3d, ce qui explique pourquoi les métaux de transition refusent de s'insérer dans la propre histoire des couches.", "Les électrons circulent sur des cercles, donc les molécules n'ont pas de forme : il ne peut pas dire pourquoi l'eau est coudée à 104,5 degrés ou le méthane tétraédrique.", "Aucune structure fine, et aucune explication du dédoublement des raies dans un champ magnétique.", "C'est un hybride — des orbites classiques avec une règle quantique boulonnée dessus — et rien à l'intérieur du modèle ne justifie cette règle."]
"kugelwolkenmodell.name" = "Modèle des nuages de charge (Kugelwolkenmodell, Kimball)"
"kugelwolkenmodell.power" = "Donne une forme aux molécules. Une fois que les électrons externes sont quatre nuages qui se repoussent plutôt que des points sur un cercle, le tétraèdre en découle, et un apprenant peut prédire à partir de la seule formule que le méthane est tétraédrique, l'ammoniac pyramidal et l'eau coudée — et que chaque doublet non liant resserre encore l'angle."
"kugelwolkenmodell.explains" = ["l'atome de carbone tétraédrique, et donc toute la forme de la chimie organique", "des angles de liaison de 109,5, 107 et 104,5 degrés dans le méthane, l'ammoniac et l'eau", "pourquoi l'eau est un dipôle et le dioxyde de carbone non, bien que les deux aient des liaisons polaires", "la différence entre paires liantes et doublets non liants", "les liaisons simples, doubles et triples comme un, deux ou trois nuages partagés"]
"kugelwolkenmodell.fails_at" = ["Chaque nuage a la même taille et la même forme, il n'y a donc ni s ni p, pas de sous-couches, et aucun moyen de dire pourquoi les électrons externes d'un atome diffèrent en énergie.", "Le spectre photoélectronique du méthane montre deux énergies d'ionisation de valence différentes, pas quatre identiques : les quatre liaisons équivalentes que dessine le modèle ne sont pas ce que voit l'expérience.", "Les métaux de transition le brisent. Les électrons d ne s'insèrent pas dans une image à quatre nuages, ni un complexe octaédrique à six ligands.", "Il ne peut pas décrire la délocalisation : le benzène en ressort comme deux structures alternantes, dont aucune n'existe, et les métaux et colorants conjugués lui échappent entièrement.", "C'est un modèle de géométrie sans spectroscopie et sans énergies — pas d'énergies d'ionisation, pas de couleur, pas de forces de liaison."]
"orbitalmodell.name" = "Modèle orbitalaire (Orbitalmodell)"
"orbitalmodell.power" = "Remplace où se trouve l'électron par la probabilité qu'il s'y trouve, et devient ainsi le premier modèle de l'atome calculé plutôt que postulé. Il donne l'ordre d'aufbau et donc la forme du tableau périodique, blocs d et f compris ; il donne les orbitales moléculaires et donc l'ordre de liaison, le magnétisme et la couleur ; et c'est le seul modèle de cette progression dont l'erreur peut être systématiquement réduite plutôt que rafistolée."
"orbitalmodell.explains" = ["le principe d'aufbau, l'exclusion de Pauli et la règle de Hund", "la structure en blocs s, p, d et f du tableau périodique", "pourquoi 4s se remplit avant 3d", "pourquoi l'oxygène liquide colle à un aimant : deux électrons non appariés dans des orbitales pi-étoile", "la délocalisation, l'aromaticité et la couleur des colorants", "la HOMO et la LUMO, et donc où une molécule est attaquée"]
"orbitalmodell.fails_at" = ["Il n'y a pas d'orbitales dans un atome à plusieurs électrons. Une orbitale est une fonction à un seul électron ; la vraie fonction d'onde de l'hélium lui-même n'est pas un produit de telles fonctions, si bien que l'orbitale 2p de l'oxygène est une approximation dont on parle comme d'un objet.", "L'équation de Schrödinger n'a une solution exacte que pour un seul électron. Tout ce qui va au-delà de l'hydrogène est une approximation dont la précision doit être justifiée plutôt que supposée.", "Une image orbitalaire à déterminant unique ne peut même pas rompre correctement la liaison de H2 à grande distance, ce qui est le cas le plus simple de la corrélation statique qui la met en échec dans toute la chimie des métaux de transition et des états excités.", "Tel qu'il est généralement enseigné, il est non relativiste, il se trompe donc sur la couleur de l'or et la liquidité du mercure.", "Ce n'est pas un modèle avec lequel un apprenant peut calculer : les prédictions sortent d'un logiciel, il achète donc de l'explication plutôt qu'un calcul à la main."]
"periodensystem.name" = "La loi périodique (Periodensystem der Elemente)"
"periodensystem.power" = "Comprime les propriétés d'une centaine d'éléments en deux coordonnées. Le groupe et la période seuls permettent de prédire la charge ionique d'un élément, sa formule avec l'oxygène et le chlore, s'il s'agit d'un métal, à peu près sa réactivité et à peu près la taille de ses atomes — pour des éléments jamais rencontrés. Les lacunes de Mendeleïev montrent qu'il est réellement prédictif et non un simple système de classement."
"periodensystem.explains" = ["pourquoi les métaux alcalins, les halogènes et les gaz nobles se comportent chacun comme une famille", "les tendances du rayon atomique, de l'énergie d'ionisation et de l'électronégativité", "la valence, et donc la formule d'un oxyde ou d'un chlorure inconnu", "la prédiction par Mendeleïev de l'éka-silicium, retrouvé sous forme de germanium en 1886"]
"periodensystem.fails_at" = ["Classer par masse atomique — le propre critère de Mendeleïev — place le tellure après l'iode et l'argon après le potassium, tous deux à tort. La loi n'est devenue exacte que lorsque Moseley a remplacé la masse par la charge nucléaire en 1913.", "Les tendances sont des tendances, pas des lois : l'énergie d'ionisation de l'aluminium est inférieure à celle du magnésium, et celle de l'oxygène inférieure à celle de l'azote, et seul le modèle orbitalaire explique ces exceptions.", "Il classe sans expliquer. Rien dans le tableau ne dit pourquoi une période se termine là où elle se termine ; c'est le modèle en couches qui le fournit, et les blocs d et f ont besoin des orbitales.", "L'hydrogène n'y a pas de place fixe, et les lanthanides et actinides sont imprimés en dessous parce qu'ils ne tiennent pas sur la page."]
"ionenbindung.name" = "Liaison ionique (Ionenbindung)"
"ionenbindung.power" = "Prédit, à partir du seul tableau périodique, quelles paires d'éléments forment un sel et quelle sera sa formule — et, parce que le modèle est un réseau tridimensionnel de charges alternées plutôt qu'une paire de partenaires, il prédit tout le profil de propriétés à la fois : dur, cassant, à haut point de fusion, isolant à l'état solide et conducteur une fois fondu ou dissous."
"ionenbindung.explains" = ["le transfert d'électrons du métal vers le non-métal, et les ions qui en résultent", "la formule d'un sel à partir des charges ioniques : NaCl, MgCl2, Al2O3", "pourquoi les sels fondent à haute température et sont durs", "pourquoi un cristal de sel frappé se clive proprement au lieu de se bosseler", "pourquoi le sel solide ne conduit pas mais le sel fondu ou dissous, si", "la dissociation en ions mobiles lors de la dissolution"]
"ionenbindung.fails_at" = ["Il n'existe pas de liaison entièrement ionique. Même NaCl a un caractère covalent mesurable, et avec AlCl3 le sel a cessé d'en être un : il se sublime à 180 degrés sous forme de molécules covalentes Al2Cl6.", "Un transfert complet impliquerait qu'un sel dissous est un gaz d'ions indépendants, et la propre réponse du moteur le contredit — des paires d'ions et des complexes neutres comme AgCl(aq) existent réellement.", "Il ne peut donner aucun chiffre. L'énergie de réseau provient d'un cycle de Born-Haber, ce qui relève de la thermodynamique, pas de l'image du transfert.", "Il ne dit rien sur quels sels se dissolvent. Le chlorure de sodium et le chlorure d'argent sont tous deux ioniques ; l'un se dissout à la cuillère et l'autre non."]
"elektronenpaarbindung.name" = "Liaison covalente (Atombindung / Elektronenpaarbindung, Lewis)"
"elektronenpaarbindung.power" = "Permet de dessiner une molécule jamais vue à partir de sa seule formule : compter les électrons de valence, les répartir en paires jusqu'à ce que chaque atome ait une configuration de gaz noble, et lire le nombre de liaisons et de doublets non liants. Presque toute la chimie organique découle de cette seule comptabilité."
"elektronenpaarbindung.explains" = ["H2, Cl2, HCl, H2O, CH4, NH3 et toute molécule simple", "les liaisons simples, doubles et triples, et pourquoi elles deviennent plus courtes et plus fortes dans cet ordre", "pourquoi des non-métaux avec des non-métaux donnent des molécules plutôt que des réseaux", "pourquoi les substances moléculaires fondent bas et ne conduisent pas", "la charge formelle, et comment choisir entre des structures concurrentes"]
"elektronenpaarbindung.fails_at" = ["Les structures de Lewis font de O2 une double liaison bien nette avec tous les électrons appariés, et prédisent donc qu'il ne serait pas magnétique. L'oxygène liquide colle à un aimant : il a deux électrons non appariés, et seule la théorie des orbitales moléculaires le rend correctement.", "Le benzène nécessite deux structures qui n'existent ni l'une ni l'autre, plus une règle disant que la réalité se situerait entre les deux ; le modèle n'a aucun moyen de dessiner un système délocalisé unique.", "La règle de l'octet est brisée par BF3, PCl5, SF6 et tout radical libre. Une règle avec autant d'exceptions est une heuristique.", "Il n'y a aucune énergie dedans : il ne peut pas dire si une liaison est forte, ni si une réaction libérera de la chaleur."]
"metallbindung.name" = "Liaison métallique (Metallbindung, Elektronengasmodell)"
"metallbindung.power" = "Explique tout le profil de propriétés d'un métal à partir d'une seule image — des cœurs positifs fixes dans une mer d'électrons mobiles. Conduction électrique et thermique, éclat, et surtout malléabilité : un réseau maintenu par une mer d'électrons partagée peut être déformé sans se briser, ce qu'un réseau ionique ne peut précisément pas faire."
"metallbindung.explains" = ["la conduction électrique dans un métal solide", "la conduction thermique", "la malléabilité et la ductilité, face à la fragilité des sels", "l'éclat métallique", "les alliages comme un réseau métallique dans lequel se mêlent les atomes d'un autre métal", "pourquoi les métaux forment des cations et jamais des anions"]
"metallbindung.fails_at" = ["Il prédit que chaque métal conduit, et n'a aucun moyen de décrire un semi-conducteur ou un isolant — le silicium se situe entre les deux, et la mer d'électrons ne peut pas dire pourquoi. Cela nécessite la théorie des bandes.", "Rien dans la mer ne fixe une force de liaison, il ne peut donc pas expliquer pourquoi le mercure est liquide à température ambiante tandis que le tungstène fond à 3400 degrés.", "Il se trompe sur la couleur par omission : le cuivre et l'or ne sont pas gris argenté, et la raison en est la structure de bandes relativiste.", "La supraconductivité, le magnétisme et la façon dont la résistance change avec la température sont tous en dehors de sa portée."]
"elektronegativitaet-kontinuum.name" = "L'électronégativité et le triangle de liaison (Elektronegativität, Bindungsdreieck)"
"elektronegativitaet-kontinuum.power" = "Remplace trois types de liaison distincts par une seule carte continue. Deux chiffres — la différence d'électronégativité et sa moyenne — placent tout composé binaire à l'intérieur d'un triangle dont les coins sont ionique, covalent et métallique, si bien que la question cesse d'être quel type est-ce pour devenir jusqu'où vers chaque coin. Au passage, il prédit la polarité de liaison, donc les dipôles moléculaires, donc la solubilité et l'endroit où une molécule est attaquée."
"elektronegativitaet-kontinuum.explains" = ["les liaisons covalentes polaires et les charges partielles", "pourquoi HCl est polaire et Cl2 ne l'est pas", "pourquoi CO2 a des liaisons polaires et aucun dipôle, tandis que l'eau a les deux", "le gradient de NaCl à SiCl4 en passant par AlCl3", "pourquoi les métaux se situent en bas à gauche et les non-métaux en haut à droite du tableau périodique", "le site réactif d'un groupe carbonyle"]
"elektronegativitaet-kontinuum.fails_at" = ["L'électronégativité ne peut pas être mesurée. Pauling, Mulliken et Allred-Rochow la définissent différemment et donnent des chiffres différents, et la règle « différence supérieure à 1,7 = ionique » est une convention : HF a une différence de 1,9 et est un gaz covalent.", "C'est une propriété d'un atome dans une molécule, pas d'un atome libre. Le même élément tire plus fort dans un degré d'oxydation plus élevé, et le carbone sp tire plus fort que le carbone sp3.", "Le triangle classe les composés binaires des groupes principaux. Il dit peu de choses sur les composés de coordination et absolument rien sur la force de liaison ou la vitesse de réaction."]
"zwischenmolekulare-kraefte.name" = "Forces intermoléculaires (Zwischenmolekulare Kräfte)"
"zwischenmolekulare-kraefte.power" = "Sépare la force de la liaison à l'intérieur d'une molécule de la force avec laquelle les molécules adhèrent entre elles, et c'est cette séparation qui rend prévisibles les points d'ébullition, la solubilité et le principe « qui se ressemble s'assemble ». À partir de la seule formule développée, un apprenant peut classer des substances par point d'ébullition et dire si l'une se dissoudra dans l'eau."
"zwischenmolekulare-kraefte.explains" = ["les points d'ébullition qui augmentent le long des alcanes, et les alcools qui bouillent bien au-dessus d'alcanes de même taille", "le point d'ébullition anormalement élevé de l'eau, et pourquoi la glace flotte", "pourquoi l'huile et l'eau ne se mélangent pas", "la tension superficielle, et pourquoi l'eau perle sur une voiture cirée", "pourquoi les substances moléculaires fondent bas bien que leurs liaisons internes soient fortes", "plus tard, l'appariement des bases dans l'ADN et le repliement des protéines"]
"zwischenmolekulare-kraefte.fails_at" = ["Il classe plutôt qu'il ne calcule, et le classement s'inverse : l'iode est non polaire et se sublime à 114 degrés, tandis que le HCl polaire bout à moins 85. Les forces de dispersion dans une grosse molécule battent les forces dipolaires dans une petite, et la hiérarchie des adjectifs ne peut pas dire quand.", "Le nom liaison hydrogène invite à l'erreur classique d'examen consistant à expliquer l'ébullition par la rupture des liaisons O-H à l'intérieur de la molécule. L'ébullition sépare les molécules ; chacune d'elles part intacte.", "Il ne peut pas gérer l'effet hydrophobe, principalement entropique : l'huile et l'eau se séparent moins parce que l'huile attire l'huile qu'à cause de ce que l'eau doit faire autour.", "La prédiction quantitative des points d'ébullition et de la miscibilité nécessite un modèle d'activité ou une équation d'état, pas une liste de noms de forces."]
"massenerhaltung.name" = "Conservation de la masse (Gesetz von der Erhaltung der Masse)"
"massenerhaltung.power" = "Transforme une réaction en un problème de comptabilité. Une fois que rien ne peut être perdu, une masse inconnue peut être calculée plutôt que mesurée, une équation doit s'équilibrer, et toute expérience qui semble gagner ou perdre de la masse devient une question — où est-elle allée ? — plutôt qu'un résultat. C'est la première loi de la chimie qui permet à un apprenant de prédire un chiffre."
"massenerhaltung.explains" = ["pourquoi une équation chimique doit être équilibrée", "pourquoi une bougie brûlant dans un bocal scellé conserve sa masse", "pourquoi le fer gagne de la masse en rouillant et le magnésium en brûlant", "pourquoi un becher ouvert de vinaigre pétillant perd de la masse", "la base de tout calcul stœchiométrique"]
"massenerhaltung.fails_at" = ["Elle ne tient que dans un système fermé. Dans un becher ouvert, elle paraît fausse, et cette apparence est la confusion la plus productive de la chimie scolaire, car le gaz qui s'est échappé est invisible.", "Elle n'est pas exactement vraie. Masse et énergie sont équivalentes, donc une réaction exothermique perd bel et bien de la masse — environ 30 nanogrammes par tonne de charbon brûlé. Immensurable en chimie, décisif en physique nucléaire.", "Elle ne dit rien sur si une réaction se produit, à quelle vitesse, ni dans quel sens — seulement sur la comptabilité si elle se produit."]
"donator-akzeptor.name" = "Le concept donneur-accepteur (Donator-Akzeptor-Prinzip)"
"donator-akzeptor.power" = "Réunit en une seule idée deux moitiés apparemment sans rapport du programme : un transfert de proton et un transfert d'électron sont le même type d'événement. Les deux se présentent comme une paire de demi-réactions, les deux définissent des paires conjuguées, et les deux sont classés par une table de force lue de la même façon — si bien qu'un apprenant qui possède ce concept peut utiliser une série redox exactement comme il utilise une table de pKa, et prédire le sens de l'un ou l'autre à partir d'une seule règle."
"donator-akzeptor.explains" = ["les acides et les bases comme donneurs et accepteurs de protons", "l'oxydation et la réduction comme don et acceptation d'électrons", "les paires conjuguées dans les deux familles : HA/A- et Ox/Red", "pourquoi l'oxydation ne se produit jamais sans réduction", "les demi-équations, et pourquoi les électrons doivent s'annuler", "pourquoi la série électrochimique et la table de force des acides sont le même type d'objet"]
"donator-akzeptor.fails_at" = ["L'analogie n'est pas une identité. Un proton hydraté est une espèce réelle dont un appareil peut lire la concentration ; il n'existe pas d'électron libre correspondant en solution, si bien que l'activité électronique est une construction comptable plutôt que quelque chose de directement mesurable.", "Il donne un sens, jamais une vitesse. L'hydrogène et l'oxygène cohabitent indéfiniment bien que le transfert d'électrons soit massivement favorable, et le concept n'a nulle part où placer ce fait.", "Les eaux réelles sont généralement en déséquilibre redox : différents couples dans le même échantillon impliquent des potentiels différents, si bien qu'un seul chiffre pour toute la solution est une fiction.", "Il n'atteint pas la chimie acide-base de Lewis, où une paire est donnée sans qu'aucun proton ne bouge du tout."]
"stossmodell.name" = "La théorie des collisions (Stoßmodell / Stoßtheorie)"
"stossmodell.power" = "Explique la vitesse, la dimension face à laquelle tout modèle d'équilibre reste aveugle. Elle fait de la concentration, de la température, de la surface et de la catalyse un seul mécanisme — combien de collisions, à quelle dureté, avec quelle précision de visée — si bien qu'un apprenant peut prédire laquelle de deux expériences pétille le plus vite et dire pourquoi, au lieu de mémoriser quatre règles séparées."
"stossmodell.explains" = ["pourquoi une réaction accélère à concentration ou pression plus élevée", "pourquoi elle double approximativement de vitesse tous les dix degrés", "pourquoi la poudre réagit plus vite qu'un bloc, et pourquoi la poussière de farine peut exploser", "pourquoi agiter aide une réaction hétérogène", "ce que fait un catalyseur", "pourquoi une réaction thermodynamiquement favorable peut simplement ne pas se produire"]
"stossmodell.fails_at" = ["Ses chiffres sont faux. La fréquence de collision des sphères dures surestime la vitesse de tout ce qui est plus complexe qu'une réaction atomique, souvent de plusieurs ordres de grandeur, et doit être rachetée par un facteur stérique empirique que le modèle lui-même ne peut pas prédire.", "Les molécules ne sont pas des sphères, et une collision n'est pas instantanée : il n'y a aucune place dans le modèle pour l'orientation, la vibration ou un chemin réactionnel.", "Il ne peut pas décrire une réaction qui ralentit quand on la chauffe, ni une qui se déroule par effet tunnel plutôt qu'au-dessus de la barrière.", "Il suggère que la loi de vitesse se lit sur l'équation. Les ordres de réaction réels sont des faits expérimentaux sur le mécanisme et sont fréquemment fractionnaires."]
"energieprofil.name" = "Profils énergétiques et activation (Energiediagramm, Aktivierungsenergie)"
"energieprofil.power" = "Place la thermodynamique et la cinétique sur une seule image tout en les gardant distinctes : la hauteur de la colline décide de la vitesse, la différence entre les deux extrémités décide de l'ampleur et si de la chaleur sort. Cette distinction — exothermique ne signifie pas rapide, et un catalyseur change la vitesse mais pas la position — est celle que les apprenants confondent autrement pendant des années."
"energieprofil.explains" = ["les réactions exothermiques et endothermiques comme deux formes du même diagramme", "pourquoi un feu a besoin d'une allumette bien que brûler libère de l'énergie", "ce que fait un catalyseur, et pourquoi il ne change ni les produits ni la chaleur libérée", "le complexe activé au sommet de la barrière", "pourquoi la réaction inverse a une énergie d'activation différente", "plus tard, l'action des enzymes"]
"energieprofil.fails_at" = ["La coordonnée de réaction est une caricature à une dimension d'une surface d'énergie à de nombreuses dimensions. Les réactions réelles se ramifient, passent par plusieurs points-selles, et parfois n'ont aucune barrière du tout.", "Il dessine la barrière comme si sa hauteur était toute l'histoire de la vitesse, mais l'étroitesse de l'état de transition compte tout autant : un état de transition bien ordonné est lent même au-dessus d'une barrière basse.", "Il ne peut pas produire une hauteur de barrière. Les énergies d'activation sont mesurées, ou calculées par la chimie quantique — le diagramme résume un résultat, il n'en prédit aucun.", "Avec l'énergie sur l'axe, il suggère silencieusement que la chaleur libérée déciderait si une réaction se produit, ce qui est faux. Seule la variation d'énergie libre le fait."]
"chemisches-gleichgewicht.name" = "L'équilibre chimique (Chemisches Gleichgewicht)"
"chemisches-gleichgewicht.power" = "Remplace « les réactions vont jusqu'au bout » par « les réactions vont jusqu'à une position », et donne un chiffre à cette position. Avec une constante d'équilibre, un apprenant peut prédire jusqu'où va une réaction, calculer ce qu'il reste, et saisir qu'une réaction peut se dérouler rapidement dans les deux sens alors que rien ne semble changer. Les acides faibles, les tampons, les produits de solubilité et le rendement industriel cessent alors d'être quatre sujets pour n'en faire qu'un."
"chemisches-gleichgewicht.explains" = ["les réactions réversibles, et pourquoi elles s'arrêtent en chemin", "que l'équilibre est dynamique : des atomes marqués continuent d'échanger de côté après que les quantités ont cessé de changer", "pourquoi un acide faible ne se dissocie que partiellement", "les limites de solubilité et le produit de solubilité", "comment fonctionne un tampon", "pourquoi un procédé industriel n'atteint jamais son rendement sur le papier"]
"chemisches-gleichgewicht.fails_at" = ["Il ne dit rien sur la durée. Une réaction dont la constante d'équilibre est énorme mais qui prend une ère géologique est parfaitement décrite par le modèle et totalement mal comprise par l'apprenant qui en déduit qu'elle se produit.", "La concentration est la mauvaise variable en dehors des solutions diluées : la constante est constante en activités, et dans une saumure cette correction est un facteur plutôt qu'un pourcentage. Kerotakis peut le montrer plutôt que l'affirmer — pose la même question sur une saumure, et trois bases de données renvoient trois quantités différentes de sel non dissous, chacune étiquetée avec le modèle d'activité qui l'a produite.", "La constante d'équilibre n'est pas constante quand la température change, ce qui en fait la seule constante de la chimie scolaire qui trompe par son propre nom.", "Beaucoup de systèmes réels ne sont pas à l'équilibre et le restent. Les êtres vivants, plus que tout."]
"le-chatelier.name" = "Le principe de Le Chatelier (Prinzip vom kleinsten Zwang)"
"le-chatelier.power" = "Donne un sens de changement sans aucun calcul. Change une concentration, une pression ou une température, et le principe dit dans quel sens le rendement se déplace — assez pour expliquer le procédé Haber, pourquoi une boisson gazeuse s'évente, et pourquoi une installation industrielle fonctionne dans des conditions qui ressemblent à un compromis, parce que c'en est un."
"le-chatelier.explains" = ["déplacer la position en ajoutant ou en retirant une substance", "la pression qui déplace la position quand les deux côtés ont des nombres de moles gazeuses différents", "le chauffage qui favorise le sens endothermique", "pourquoi un catalyseur ne déplace rien", "l'effet d'ion commun", "les conditions choisies pour le procédé Haber-Bosch"]
"le-chatelier.fails_at" = ["C'est une heuristique, et elle peut mener à une mauvaise réponse. Ajoute encore de l'azote à une synthèse d'ammoniac à l'équilibre, à température et pression constantes, alors que l'azote est déjà en excès, et la fraction molaire d'ammoniac chute — le système s'oppose au changement, et le rendement baisse quand même.", "Ajouter un gaz inerte à volume constant ne change rien, bien qu'augmenter la pression donne l'impression que cela devrait changer quelque chose. Les mots mêmes du principe induisent en erreur tant qu'on ne connaît pas déjà la réponse.", "Il donne un sens et jamais une ampleur, et le déplacement est souvent négligeable.", "Le mot Zwang (contrainte) invite à la téléologie. Les apprenants décrivent alors le système comme s'il VOULAIT s'opposer au changement — une idée fausse que la formulation elle-même sème."]
"stoffmenge.name" = "Quantité de matière — la mole (Stoffmenge, das Mol)"
"stoffmenge.power" = "Permet de transformer une masse que l'on peut peser en un nombre de particules qu'on ne peut pas voir, ce qui rend possible toute prédiction quantitative. Sans elle, une équation équilibrée est une phrase sur des atomes, et une balance est un appareil pour mesurer des grammes — et les deux ne se rencontrent jamais."
"stoffmenge.explains" = ["convertir entre masse et nombre de particules", "pourquoi les équations s'équilibrent en moles et non en grammes", "la masse molaire, et pourquoi elle est numériquement égale à la masse atomique relative", "le volume molaire d'un gaz", "la concentration, le réactif limitant, le rendement et la titration, tous construits sur elle"]
"stoffmenge.fails_at" = ["Ce n'est le modèle de rien de physique. C'est une unité — un nombre de comptage choisi —, et c'est précisément pourquoi elle est difficile : il n'y a rien à se représenter, et une mole de quelque chose n'a ni taille, ni couleur, ni texture.", "Rien dans le concept n'enregistre quelles particules on a comptées. Une mole d'eau représente ce nombre de molécules mais trois fois plus d'atomes, et une mole d'oxygène reste ambiguë tant que personne ne précise O ou O2. C'est la source la plus courante d'erreurs par un facteur deux.", "Le volume molaire de 22,4 litres ne vaut que pour un gaz idéal à zéro degré et pression normale. Le traiter comme une propriété des gaz est une erreur classique.", "Elle cache un changement de définition. Depuis 2019, la mole est définie en fixant le nombre d'Avogadro, non plus par douze grammes de carbone 12 ; la masse molaire est donc désormais une grandeur mesurée avec une incertitude plutôt qu'une grandeur exacte."]
"stoechiometrie.name" = "Stœchiométrie (Stöchiometrie)"
"stoechiometrie.power" = "Rend une équation prédictive en grammes. À partir de ce qu'on introduit, elle indique combien on peut obtenir, quel réactif s'épuisera en premier, et à quel point l'expérience a été réussie — avant même de la réaliser. C'est le point où la chimie devient une discipline d'ingénierie plutôt qu'une description."
"stoechiometrie.explains" = ["les rapports molaires lus directement sur les coefficients", "le réactif limitant et le réactif en excès", "le rendement théorique, le rendement réel et le rendement en pourcentage", "l'économie d'atomes", "les calculs de titration", "la formule empirique issue de l'analyse par combustion"]
"stoechiometrie.fails_at" = ["Elle suppose que l'équation écrite est la réaction qui s'est réellement produite. Les réactions secondaires, la conversion incomplète et les impuretés lui sont invisibles, ce pourquoi le rendement n'est jamais de 100 % et le calcul ne t'en avertit jamais.", "Elle suppose que la réaction se déroule jusqu'à son terme, si bien que le rendement théorique d'un processus d'équilibre n'est pas simplement non atteint — il est inatteignable.", "C'est du calcul, pas de la chimie. Elle calculera volontiers le rendement d'une réaction qui ne se produit pas."]
"konzentration.name" = "Concentration (Konzentration)"
"konzentration.power" = "Rend le combien indépendant de la quantité prélevée. La concentration est intensive, donc on peut la comparer entre un tube à essai et un lac, la faire traverser une dilution, et l'introduire directement dans une expression d'équilibre ou une loi de vitesse. C'est aussi ce qui transforme une titration d'un changement de couleur en une mesure."
"konzentration.explains" = ["la concentration en quantité de matière comme quantité divisée par volume", "la dilution, et pourquoi la quantité de soluté ne change pas", "la titration, et comment obtenir une concentration inconnue à partir d'une connue", "le pH comme une concentration sur une échelle logarithmique", "pourquoi une goutte d'eau de Javel et une bouteille entière sont des dangers différents"]
"konzentration.fails_at" = ["La concentration molaire dépend de la température, parce que le volume en dépend. La molalité n'en dépend pas, ce pourquoi le travail thermodynamique — et chaque chiffre que calcule ce moteur — s'exprime par kilogramme d'eau plutôt que par litre de solution, et pourquoi les deux ne sont plus interchangeables une fois la solution concentrée.", "La concentration n'est pas ce à quoi répond un équilibre. C'est l'activité. En solution diluée, elles coïncident presque ; à une force ionique de 0,1 mol/kgw, le coefficient d'activité de l'ion argent vaut déjà environ 0,78, et en saumure la correction est un facteur, pas un pourcentage.", "Elle ne dit rien sur quelles espèces sont présentes. De l'acide phosphorique à 0,1 mol/L est une recette, pas une description : la solution contient en réalité quatre espèces phosphatées dans un mélange dépendant du pH.", "Les volumes ne s'additionnent pas exactement, un calcul de dilution est donc une approximation — mélanger 50 mL d'éthanol avec 50 mL d'eau donne environ 96 mL."]
"arrhenius.name" = "Le modèle acide-base d'Arrhenius (Arrhenius-Definition)"
"arrhenius.power" = "La première définition qui fait de l'acide un énoncé sur la composition plutôt que sur le goût. Elle prédit que tout acide neutralise toute base en donnant un sel et de l'eau, explique pourquoi les solutions acides et alcalines conduisent, et réduit des centaines de neutralisations à une seule équation ionique."
"arrhenius.explains" = ["les acides comme des substances qui donnent H+ dans l'eau, les bases comme des substances qui donnent OH-", "la neutralisation comme une seule réaction : H+ plus OH- donne de l'eau", "pourquoi les solutions acides et alcalines conduisent l'électricité", "la formation de sel comme ce qui reste", "l'échelle de pH dans l'eau", "pourquoi un acide fort conduit mieux qu'un faible à la même concentration"]
"arrhenius.fails_at" = ["Il ne peut pas expliquer pourquoi l'ammoniac est une base. Il n'y a aucun hydroxyde nulle part dans NH3, et sa solution est pourtant alcaline. Ce seul fait a forcé l'apparition du modèle suivant.", "Il est confiné à l'eau. Le chlorure d'hydrogène dissous dans le benzène, ou la chimie acide-base dans l'ammoniac liquide, lui est invisible.", "Le proton nu qu'il invoque n'existe pas en solution ; au minimum, il est hydraté sous forme de H3O+.", "Il définit un acide par ce que la substance contient plutôt que par ce qui se passe dans la réaction, il ne peut donc pas dire qu'une espèce agit comme un acide dans une réaction et comme une base dans une autre."]
"broensted-lowry.name" = "Le modèle de Brønsted-Lowry (Brønsted-Lowry, Protonenübergang)"
"broensted-lowry.power" = "Redéfinit acide et base comme des rôles dans une réaction plutôt que comme des propriétés de substances, et par ce seul geste explique l'ammoniac, les tampons, pourquoi des solutions salines peuvent être acides ou basiques, la capacité de l'eau à être les deux, et la chimie acide-base entièrement en dehors de l'eau. Il rend aussi la force des acides comparative et tabulable : les paires conjuguées se classent d'elles-mêmes, et le transfert va de l'acide le plus fort vers la base la plus forte."
"broensted-lowry.explains" = ["l'ammoniac comme une base sans aucun hydroxyde en elle", "les paires acide-base conjuguées", "les espèces amphotères telles que l'eau et l'hydrogénocarbonate", "pourquoi une solution d'acétate de sodium est basique et une solution de chlorure d'ammonium acide", "les tampons, et pourquoi ils résistent à l'acide ajouté", "la forme d'une courbe de titration"]
"broensted-lowry.fails_at" = ["Il faut absolument un proton. Il n'a rien à dire sur la rencontre du trifluorure de bore et de l'ammoniac, sur la catalyse par les ions métalliques, ou sur pourquoi le chlorure d'aluminium est même appelé un acide.", "Son échelle de force est liée au solvant. Dans l'eau, tout acide plus fort que H3O+ paraît également fort, si bien que l'acide chlorhydrique, bromhydrique et perchlorique sont impossibles à distinguer dans l'eau.", "Il donne une position et un sens mais aucune vitesse, et les transferts de protons ne sont pas toujours rapides — les acides carbonés peuvent être extrêmement lents.", "Un pKa n'est pas une constante de la nature. Il se déplace avec la force ionique, ce pourquoi une table de manuel et un vrai pH-mètre sont en désaccord."]
"lewis-saeure-base.name" = "Le modèle acide-base de Lewis (Lewis-Säure-Base-Konzept)"
"lewis-saeure-base.power" = "Généralise l'acidité de « cède un proton » à « accepte une paire d'électrons », ce qui rassemble sous un même titre les ions métalliques, le trifluorure de bore, la catalyse, la formation de complexes et une grande partie de la mécanistique organique. Il relie aussi l'histoire acide-base à l'histoire donneur-accepteur et aux flèches courbes : un nucléophile est une base de Lewis, un électrophile un acide de Lewis."
"lewis-saeure-base.explains" = ["l'adduit du trifluorure de bore et de l'ammoniac, une réaction acide-base sans aucun proton", "pourquoi les solutions de sels d'aluminium et de fer(III) sont acides", "la formation de complexes entre un ion métallique et ses ligands", "la catalyse de Friedel-Crafts", "le nucléophile et l'électrophile comme une seule idée plutôt que deux vocabulaires", "le proton comme cas particulier : un accepteur sans électrons propres"]
"lewis-saeure-base.fails_at" = ["Il n'existe pas d'échelle de force unique. La force d'un acide de Lewis dépend de la base contre laquelle on la mesure, ce pourquoi la classification dur-mou a dû être inventée et pourquoi elle reste qualitative.", "Il est si général qu'il cesse de discriminer : sous cette définition, presque chaque réaction est une réaction acide-base, ce qui est vrai et rarement utile.", "Il ne donne rien de quantitatif pour l'acidité aqueuse, si bien que la chimie des protons dont un cours scolaire a réellement besoin continue de fonctionner sur Brønsted."]
"enthalpie.name" = "L'enthalpie (Enthalpie, Reaktionsenthalpie)"
"enthalpie.power" = "Met un chiffre sur « ça a chauffé ». L'énergie devient une grandeur comptable comme la masse : tabulée par substance, additive le long de n'importe quel chemin, et donc prévisible pour des réactions que personne n'a jamais mesurées. Elle dit aussi pourquoi former des liaisons libère de l'énergie et les briser en coûte, si bien que la chaleur d'une réaction peut être estimée à partir d'une table."
"enthalpie.explains" = ["les réactions exothermiques et endothermiques", "pourquoi certaines substances réchauffent le becher en se dissolvant et d'autres le refroidissent", "la calorimétrie, et comment on mesure une chaleur de réaction", "la loi de Hess : la même chaleur par n'importe quel chemin", "les enthalpies standard de formation, et les enthalpies de réaction qui en sont calculées", "le contenu énergétique des combustibles et des aliments"]
"enthalpie.fails_at" = ["Elle ne prédit pas si une réaction se produit, même si on a l'impression qu'elle le devrait. La dissolution du nitrate d'ammonium est fortement endothermique et se produit d'elle-même ; la glace au-dessus de zéro absorbe de la chaleur et fond quand même. « Les systèmes tendent vers une énergie plus basse » est la fausse généralisation la plus courante de la chimie scolaire.", "Les estimations d'enthalpie de liaison sont des moyennes prises sur de nombreuses molécules différentes, elles peuvent donc être erronées de dizaines de kilojoules par mole, et elles s'appliquent aux gaz plutôt qu'aux liquides ou aux solides.", "Elle est définie à pression constante et ne dit rien sur la façon dont l'énergie est répartie, ni sur sa propre dépendance à la température, tant que les capacités thermiques ne sont pas prises en compte."]
"entropie.name" = "L'entropie (Entropie)"
"entropie.power" = "Fournit la seconde raison pour laquelle les choses se produisent. Une fois qu'on peut compter le nombre de façons dont un état peut être arrangé, on peut prédire que les gaz se mélangent et ne se démélangent jamais, que certains solides se dissolvent même si cela coûte de l'énergie, et que la chaleur ne circule que dans un sens — rien de tout cela que l'enthalpie ne peut donner. Elle transforme « pourquoi quoi que ce soit se produit-il de lui-même » en une question qui a une réponse."
"entropie.explains" = ["pourquoi le mélange est irréversible : le lait ne ressort jamais du café", "pourquoi un sel peut se dissoudre tout en refroidissant le becher", "pourquoi un gaz se détend dans le vide sans aucune poussée", "pourquoi la chaleur circule du chaud vers le froid et jamais en sens inverse", "pourquoi une réaction qui forme un gaz a une variation d'entropie fortement positive", "pourquoi un cristal parfait est le cas de basse entropie"]
"entropie.fails_at" = ["« L'entropie, c'est le désordre » est la métaphore qui cause le plus de dégâts. Le désordre n'est pas défini, et les cas qui comptent ressemblent à l'opposé de la métaphore : l'huile qui se sépare de l'eau et un liquide surfondu qui gèle paraissent tous deux plus ordonnés et sont tous deux globalement entropiquement favorisés.", "L'entropie du système seule ne prédit rien. L'eau qui gèle l'abaisse et se produit spontanément en dessous de zéro, parce que le milieu extérieur gagne plus que le système ne perd — et compter le milieu extérieur est précisément l'étape que sautent les apprenants.", "Elle est statistique, c'est donc une quasi-certitude plutôt qu'une loi : les petits systèmes fluctuent dans le mauvais sens, et le second principe est un énoncé sur une probabilité écrasante.", "Elle ne donne aucune vitesse. Le diamant qui se transforme en graphite augmente l'entropie de l'univers et prend un temps géologique."]
"gibbs-energie.name" = "L'énergie libre de Gibbs (Gibbs-Energie, freie Enthalpie)"
"gibbs-energie.power" = "Le critère unique pour savoir si une réaction peut se produire. Elle replie l'enthalpie et l'entropie en un seul chiffre dont le signe répond à la question que chaque modèle antérieur esquivait, indique la température à laquelle la réponse bascule, et — par son lien avec la constante d'équilibre — fait de « est-ce que ça se produit » et « jusqu'où » le même calcul. C'est le sommet de la hiérarchie des modèles de la chimie scolaire."
"gibbs-energie.explains" = ["pourquoi certaines réactions sont spontanées et d'autres non", "pourquoi les réactions endothermiques peuvent se produire d'elles-mêmes", "pourquoi le calcaire se décompose dans un four et non dans un becher", "pourquoi certaines réactions s'inversent au chauffage", "le lien entre la variation d'énergie libre et la constante d'équilibre", "les tensions de pile, et pourquoi une batterie a exactement la tension qu'elle a"]
"gibbs-energie.fails_at" = ["Spontané signifie possible, pas effectif. Le diamant, l'essence dans l'air et un bâton de dynamite sont tous thermodynamiquement condamnés et restent tous parfaitement immobiles. L'énergie libre ne dit rien sur la vitesse, et tout modèle de cinétique existe dans l'écart qu'elle laisse.", "C'est le critère à température et pression constantes seulement. À volume constant, la grandeur adéquate est l'énergie de Helmholtz, et loin de l'équilibre, aucune des deux ne s'applique.", "La variation d'énergie libre standard indique où se situe l'équilibre, pas dans quel sens ton mélange réel va se déplacer. Cela nécessite de comparer le quotient de réaction à la constante, et les deux sont constamment confondus.", "Les valeurs tabulées supposent un comportement idéal : en solution réelle, les coefficients d'activité comptent, et dans les fontes et solutions solides, les termes de mélange mettent en échec les tables simples."]
"thermodynamische-vs-kinetische-kontrolle.name" = "Contrôle thermodynamique contre contrôle cinétique"
"thermodynamische-vs-kinetische-kontrolle.power" = "Sépare deux questions que les débutants entendent comme une seule : quel produit est le plus stable, et quel produit obtient-on réellement. Une fois séparées, toute une classe d'observations autrement déroutantes devient prévisible — pourquoi le précipité bleu n'est pas le noir, pourquoi le diamant ne se transforme pas en graphite sur l'étagère, pourquoi l'étagère elle-même ne prend pas feu. Cela indique aussi quoi faire à ce sujet : si c'est la barrière qui fait obstacle, chauffe, et le produit stable apparaît."
"thermodynamische-vs-kinetische-kontrolle.explains" = ["pourquoi ajouter de la lessive de soude au sulfate de cuivre donne du Cu(OH)2 bleu pâle et non du CuO noir, bien que CuO soit le solide le plus stable", "pourquoi réchauffer cette suspension la noircit — la démonstration classique", "pourquoi le diamant, le graphite et tout minéral métastable persistent indéfiniment", "pourquoi un calcul minimisant l'énergie de Gibbs peut avoir raison sur la destination et tort sur le becher", "la règle des étapes d'Ostwald : la phase qui apparaît en premier est souvent la moins stable des phases disponibles, car elle germe le plus vite", "pourquoi un ruban de magnésium reste dans l'air jusqu'à ce qu'on l'allume"]
"thermodynamische-vs-kinetische-kontrolle.fails_at" = ["Elle ne dit quel produit est cinétiquement préféré qu'une fois les barrières déjà connues. À elle seule, elle ne prédit rien de quantitatif — c'est un cadre pour deux autres modèles, pas un troisième modèle qui les remplace.", "Elle ne donne aucune échelle de temps. « Métastable » couvre à la fois un précipité qui se convertit en une minute de chauffage et un diamant qui survit au système solaire, et rien dans l'idée ne les distingue.", "C'est la nucléation, pas seulement la barrière d'activation, qui décide quel solide apparaît en premier, et l'énergie de surface et la sursaturation appartiennent à une théorie que ce cadre ne contient pas.", "Appliquée sans précaution, elle devient infalsifiable : tout désaccord entre calcul et observation peut être balayé comme relevant de la cinétique. Elle ne vaut quelque chose que lorsque la barrière est nommée et que les conditions qui la surmontent sont énoncées."]

# Promotions originales de la source-fleet, brouillon français assisté
# par modèle, 2026-09-08.

"the-salt-forgets-its-side.summary" = "La même eau et le même sel aboutissent au même inventaire mélangé, quelle que soit la source qui détenait le sel"
"the-salt-forgets-its-side.expect.predict.question" = "Quatre chemins amènent 400 mL d'eau et 0,002 mol de sel jusqu'à une vorlage. Est-ce important de savoir quelle source détenait le sel en premier ?"
"the-salt-forgets-its-side.expect.predict.options" = ["Oui : la vorlage se souvient de quel côté a fourni le sel", "Non : des inventaires finaux égaux d'eau et de sel donnent le même état mélangé"]
"the-salt-forgets-its-side.expect.predict.misconception" = "Le chemin d'une matière vers un inventaire final bien mélangé est confondu avec une variable d'état supplémentaire."
"the-salt-forgets-its-side.expect.predict.diagnosis.0.reveals" = "Les étiquettes des bechers sources seraient reportées dans l'état final, alors que le modèle combine leurs inventaires complets."
"the-salt-forgets-its-side.expect.predict.diagnosis.0.next" = "Additionne les quantités d'eau, de sodium et de chlorure sur chaque chemin, puis compare les quatre inventaires de la vorlage plutôt que leurs étiquettes de source."
"the-salt-forgets-its-side.registers.lv1" = "Le sel peut commencer dans le becher de gauche, celui de droite, ou les deux. Une fois les mêmes quantités entièrement mélangées, la vorlage ne peut plus distinguer ces chemins."
"the-salt-forgets-its-side.registers.lv2" = "Chaque chemin apporte 400 mL d'eau et 0,002 mol de NaCl à sa vorlage. Les registres de sodium et de chlorure dissous concordent donc même quand le sel a été fractionné ou que seule la moitié de portions sources plus grandes a été utilisée."
"the-salt-forgets-its-side.registers.lv3" = "C'est une indépendance au chemin pour une opération de mélange à l'équilibre complète, pas une affirmation sur un temps de mélange fini, un versement imparfait ou des gradients spatiaux de concentration. La comparaison est appuyée par la relation d'inventaire final indépendante de la série d'essais, tandis que la relecture du catalogue vérifie les événements de mélange typés."
"two-evaporation-paths-one-brine.summary" = "Retirer la même fraction nette d'eau en une ou deux étapes laisse la même saumure diluée"
"two-evaporation-paths-one-brine.expect.predict.question" = "Une cuve perd 40 % de son eau d'un coup. Une autre en perd 20 %, puis 25 % de ce qui reste. Quelle cuve finit avec le plus d'eau ?"
"two-evaporation-paths-one-brine.expect.predict.options" = ["La seconde, car 20 % + 25 % est supérieur à 40 %", "Aucune des deux : les deux conservent 60 % de leur eau de départ"]
"two-evaporation-paths-one-brine.expect.predict.misconception" = "Des pourcentages pris sur des quantités changeantes sont additionnés comme s'ils partageaient le même dénominateur."
"two-evaporation-paths-one-brine.expect.predict.diagnosis.0.reveals" = "Le second pourcentage serait pris sur l'eau de départ plutôt que sur les 80 % restant après la première étape."
"two-evaporation-paths-one-brine.expect.predict.diagnosis.0.next" = "Multiplie les fractions conservées : 0,80 × 0,75 = 0,60, puis compare les inventaires de sel et d'eau des deux cuves."
"two-evaporation-paths-one-brine.registers.lv1" = "Retirer quatre dixièmes de l'eau d'un coup laisse la même saumure que retirer d'abord un cinquième, puis un quart de ce qui reste. Le sel reste dans les deux cuves."
"two-evaporation-paths-one-brine.registers.lv2" = "Le chemin en une étape conserve 1 − 0,40 = 0,60 de l'eau. Le chemin en deux étapes conserve (1 − 0,20)(1 − 0,25) = 0,60, si bien que les deux finissent avec la même eau et l'inventaire de sel initial de 0,030 mol."
"two-evaporation-paths-one-brine.registers.lv3" = "Cette égalité est un contrôle de composition de fractions pour l'opérateur idéal de retrait de solvant du moteur. Elle ne modélise pas la vitesse d'évaporation, la charge thermique, les éclaboussures ou les solutés volatils, et ces cas dilués sont délibérément séparés d'une leçon sur le rendement de cristallisation."
"energy-is-not-a-distillation-fraction.summary" = "Un budget énergétique de distillation paie une charge latente ; ce n'est pas une fraction déguisée de l'alimentation"
"energy-is-not-a-distillation-fraction.expect.predict.question" = "Le même mélange d'alimentation ternaire reçoit soit 1 kJ, soit 2 kJ de charge latente modélisée. Le chiffre 2 est-il donc une coupe de distillation de 2 % ?"
"energy-is-not-a-distillation-fraction.expect.predict.options" = ["Oui : toute entrée de distillation est interprétée comme une fraction de l'alimentation", "Non : énergie et fraction sont des paramètres de contrôle différents, et le budget énergétique détermine combien de charge latente peut être payée"]
"energy-is-not-a-distillation-fraction.expect.predict.misconception" = "Une grandeur en unités d'énergie est traitée comme une fraction sans dimension, parce que les deux paramètres de contrôle peuvent augmenter la matière recueillie."
"energy-is-not-a-distillation-fraction.expect.predict.diagnosis.0.reveals" = "Les unités auraient été abandonnées, masquant la différence entre des kilojoules fournis et une fraction demandée du total des moles."
"energy-is-not-a-distillation-fraction.expect.predict.diagnosis.0.next" = "Compare les unités des commandes et la matière totale dans les deux vorlagen ; oppose ensuite cette paire à une commande de fraction de coupe sans dimension."
"energy-is-not-a-distillation-fraction.registers.lv1" = "Plus d'énergie permet à l'alambic virtuel de transférer plus de liquide, mais un kilojoule n'est pas un pourcentage du ballon. C'est un type d'instruction différent."
"energy-is-not-a-distillation-fraction.registers.lv2" = "Les deux alambics commencent avec 3,12 mol du même mélange et utilisent deux étages. Le second reçoit deux fois le budget de charge latente, si bien que le total calculé dans la vorlage augmente ; ni 1 kJ ni 2 kJ ne désigne une fraction fixe de 3,12 mol."
"energy-is-not-a-distillation-fraction.registers.lv3" = "La forme énergétique de l'opération générique de Rayleigh borne le prélèvement par la somme des charges latentes des composants. Elle omet le chauffage sensible, les pertes de chaleur, le reflux et la circulation du rebouilleur, si bien que la charge rapportée n'est pas une prédiction de la consommation réelle d'utilités ni de l'efficacité de séparation."
"equilibrium-forgets-feed-order.summary" = "Inverser l'ordre d'ajouts d'estérification identiques laisse le même inventaire d'équilibre calculé"
"equilibrium-forgets-feed-order.expect.predict.question" = "Deux récipients contiennent les mêmes quantités finales d'alimentation, mais le second les reçoit dans l'ordre inverse. Lequel atteint un équilibre d'estérification calculé différent ?"
"equilibrium-forgets-feed-order.expect.predict.options" = ["Le premier, parce que le réactif ajouté en premier détermine le sens de la réaction", "Aucun des deux : la commande d'équilibre utilise l'inventaire courant, pas l'historique des ajouts"]
"equilibrium-forgets-feed-order.expect.predict.misconception" = "Un état d'équilibre est traité comme une mémoire procédurale de l'ordre dans lequel un inventaire identique a été assemblé."
"equilibrium-forgets-feed-order.expect.predict.diagnosis.0.reveals" = "La séquence des ajouts serait substituée au quotient de réaction calculé à partir de l'inventaire de départ complet."
"equilibrium-forgets-feed-order.expect.predict.diagnosis.0.next" = "Écris les quatre quantités à côté des deux récipients, vérifie qu'elles correspondent, puis compare leurs inventaires finaux calculés."
"equilibrium-forgets-feed-order.registers.lv1" = "Verser les mêmes quatre substances dans un becher virtuel dans l'ordre inverse ne change pas où se stabilise son équilibre."
"equilibrium-forgets-feed-order.registers.lv2" = "Les deux récipients commencent la commande d'équilibre explicite avec 0,013 mol d'acide, 0,009 mol d'alcool, 0,002 mol d'ester et 0,005 mol d'eau. Des quotients et des bornes de départ égaux donnent donc des inventaires finaux égaux."
"equilibrium-forgets-feed-order.registers.lv3" = "C'est un contrôle de commutativité pour l'assemblage de l'état transmis au solveur d'action de masse pour mélange idéal. Cela ne dit pas que l'ordre réel des ajouts est sans importance quand les ajouts changent la température, les phases, les réactions secondaires ou la cinétique avant que l'équilibre ne soit demandé."
"equilibrium-is-not-a-yield-button.summary" = "Demander deux fois le même équilibre ne fabrique pas un second incrément de rendement"
"equilibrium-is-not-a-yield-button.expect.predict.question" = "Un récipient doit atteindre l'équilibre d'estérification une fois, et son jumeau deux fois. La seconde demande crée-t-elle un incrément supplémentaire d'ester ?"
"equilibrium-is-not-a-yield-button.expect.predict.options" = ["Oui : chaque commande de réaction ajoute un lot supplémentaire de produit", "Non : après la première résolution, le quotient est déjà à l'équilibre, donc la demande répétée est stœchiométriquement sans effet"]
"equilibrium-is-not-a-yield-button.expect.predict.misconception" = "Une demande d'équilibre est confondue avec une étape de conversion fixe qui pourrait être répétée pour pousser le rendement vers l'achèvement."
"equilibrium-is-not-a-yield-button.expect.predict.diagnosis.0.reveals" = "La commande serait lue comme une instruction d'avancer d'un incrément préfixé plutôt que de résoudre un état satisfaisant la loi d'action de masse."
"equilibrium-is-not-a-yield-button.expect.predict.diagnosis.0.next" = "Compare les deux inventaires finaux, puis calcule le quotient de réaction après la première demande et demande-toi quelle force motrice reste."
"equilibrium-is-not-a-yield-button.registers.lv1" = "L'équilibre est une destination, pas un bouton qui ajoute plus de produit à chaque pression. Une fois le mélange virtuel arrivé là, redemander laisse sa matière inchangée."
"equilibrium-is-not-a-yield-button.registers.lv2" = "La première demande ajuste l'inventaire à quatre composants jusqu'à ce que son quotient de réaction corresponde à la constante d'équilibre du modèle. En partant de cet inventaire stabilisé, le second avancement borné est nul, à la tolérance numérique près."
"equilibrium-is-not-a-yield-button.registers.lv3" = "L'idempotence est une propriété de point fixe nécessaire de l'opérateur d'équilibre : solve(solve(état)) = solve(état). Cela ne dit rien sur le temps que prendrait un vrai mélange non catalysé, et la spéciation aqueuse peut encore modifier la répartition moléculaire affichée après la résolution organique isolée."

# Deuxième tranche originale de promotions de la source-fleet,
# 2026-09-08.

"buffer-ph-is-intensive.summary" = "Mettre à l'échelle ensemble l'eau, l'acide faible et la base conjuguée préserve le pH du tampon"
"buffer-ph-is-intensive.expect.predict.question" = "Quatre tampons acétate ont la même composition mais contiennent une, deux, trois ou quatre fois plus de matière. Lequel a le pH le plus élevé ?"
"buffer-ph-is-intensive.expect.predict.options" = ["Le plus grand, parce qu'il contient le plus de base", "Aucun : mettre à l'échelle ensemble l'acide, la base et l'eau préserve leur rapport et leur pH"]
"buffer-ph-is-intensive.expect.predict.misconception" = "La quantité totale de base est confondue avec sa concentration et avec le rapport acide-base qui contrôle le pH du tampon."
"buffer-ph-is-intensive.expect.predict.diagnosis.0.reveals" = "Une quantité extensive serait utilisée comme si elle était une composition intensive."
"buffer-ph-is-intensive.expect.predict.diagnosis.0.next" = "Divise les moles d'acide et d'acétate par la quantité d'eau dans chaque récipient, puis compare les quatre pH."
"buffer-ph-is-intensive.registers.lv1" = "Un tampon plus grand n'est pas une version au goût plus fort de la même recette. Quand toutes les quantités croissent ensemble, son pH reste le même."
"buffer-ph-is-intensive.registers.lv2" = "Les quatre récipients ont le même rapport acide-acétate et les mêmes concentrations. Le pH calculé concorde donc même si leurs quantités totales diffèrent d'un facteur quatre."
"buffer-ph-is-intensive.registers.lv3" = "Le pH est intensif sous une mise à l'échelle extensive à composition, température et modèle d'activité fixes. La capacité tampon, en revanche, est extensive : le récipient le plus grand peut absorber proportionnellement plus d'acide ajouté avant que cette égalité n'échoue."
"neutralisation-forgets-addition-order.summary" = "Acide en premier, base en premier, et ajouts fractionnés atteignent le même pH final pour le même inventaire neutre"
"neutralisation-forgets-addition-order.expect.predict.question" = "Des quantités totales égales d'acide fort et de base forte sont combinées acide-en-premier, base-en-premier, ou en portions fractionnées. Quel chemin a un pH final différent ?"
"neutralisation-forgets-addition-order.expect.predict.options" = ["Au moins un, parce que le premier réactif fixe si l'eau devient acide ou alcaline", "Aucun : après équilibrage, le même inventaire final donne le même pH"]
"neutralisation-forgets-addition-order.expect.predict.misconception" = "Un excès transitoire pendant le versement est confondu avec une partie durable de l'état final équilibré."
"neutralisation-forgets-addition-order.expect.predict.diagnosis.0.reveals" = "L'état intermédiaire dépendant de l'ordre serait reporté dans un calcul qui dépend de l'inventaire final."
"neutralisation-forgets-addition-order.expect.predict.diagnosis.0.next" = "Pour chaque chemin, totalise le HCl et le NaOH délivrés avant de comparer les pH finaux."
"neutralisation-forgets-addition-order.registers.lv1" = "Verser l'acide en premier ou la base en premier change le trajet, mais des quantités finales égales laissent la même eau neutre."
"neutralisation-forgets-addition-order.registers.lv2" = "Chaque chemin apporte 0,001 mol de HCl et 0,001 mol de NaOH à 300 mL d'eau. Fractionner l'une ou l'autre dose ne change pas l'excès final d'ions hydrogène ou hydroxyde."
"neutralisation-forgets-addition-order.registers.lv3" = "Cette affirmation d'indépendance au chemin se limite à l'inventaire final équilibré d'acide fort/base forte. Le pH local transitoire, la libération de chaleur, les éclaboussures et les vitesses de mélange finies peuvent dépendre fortement de l'ordre dans un vrai récipient."
"carbonate-precipitate-forgets-feed-order.summary" = "Inverser ou fractionner des apports égaux de calcium et de carbonate laisse la même quantité de calcite calculée"
"carbonate-precipitate-forgets-feed-order.expect.predict.question" = "Les mêmes quantités totales de calcium et de carbonate sont apportées selon quatre ordres différents. Quel chemin laisse une quantité de calcite calculée différente ?"
"carbonate-precipitate-forgets-feed-order.expect.predict.options" = ["Le chemin qui ajoute le calcium en premier, parce que le premier solide fige l'historique", "Aucun : le calcul d'équilibre des phases utilise le même inventaire élémentaire final"]
"carbonate-precipitate-forgets-feed-order.expect.predict.misconception" = "Le premier précipité visible est supposé déterminer la quantité d'équilibre finale, même quand l'inventaire complet est identique."
"carbonate-precipitate-forgets-feed-order.expect.predict.diagnosis.0.reveals" = "L'historique de nucléation serait substitué au bilan de matière à l'équilibre utilisé par ce modèle."
"carbonate-precipitate-forgets-feed-order.expect.predict.diagnosis.0.next" = "Additionne les apports de calcium et de carbonate dans chaque récipient, puis compare à la fois les événements de précipitation et les inventaires finaux de CaCO3."
"carbonate-precipitate-forgets-feed-order.registers.lv1" = "Le calcium peut arriver en premier, le carbonate peut arriver en premier, ou l'un des deux peut arriver par morceaux. Avec les mêmes quantités finales, les bechers virtuels forment la même craie."
"carbonate-precipitate-forgets-feed-order.registers.lv2" = "Chaque récipient finit avec 0,003 mol d'apport de calcium et 0,003 mol d'apport de carbonate dans 250 mL d'eau. Le solveur renvoie donc des inventaires de calcite finaux égaux."
"carbonate-precipitate-forgets-feed-order.registers.lv3" = "L'affirmation concerne la quantité de phase à l'équilibre, pas l'historique de nucléation ni la forme cristalline. Une précipitation réelle peut conserver des tailles de particules, des polymorphes, des inclusions et des sursaturations dépendant de l'ordre, car ces détails cinétiques sont hors de cette relecture."
"pressure-is-intensive-under-scaling.summary" = "Mettre à l'échelle ensemble la quantité de gaz, le volume scellé et la chaleur préserve la pression calculée"
"pressure-is-intensive-under-scaling.expect.predict.question" = "La quantité de gaz, le volume du récipient et le chauffage sont tous multipliés par le même facteur. Que devient la pression finale ?"
"pressure-is-intensive-under-scaling.expect.predict.options" = ["Elle augmente avec le nombre total de particules de gaz", "Elle reste la même, parce que les particules par volume et l'énergie par particule restent les mêmes"]
"pressure-is-intensive-under-scaling.expect.predict.misconception" = "La pression est traitée comme un total extensif plutôt que comme un état intensif déterminé par la densité et la température."
"pressure-is-intensive-under-scaling.expect.predict.diagnosis.0.reveals" = "Le nombre de particules aurait été augmenté sans tenir compte aussi de l'augmentation proportionnelle du volume disponible."
"pressure-is-intensive-under-scaling.expect.predict.diagnosis.0.next" = "Compare n/V et la chaleur par mole pour les quatre récipients avant de lire leurs pressions."
"pressure-is-intensive-under-scaling.registers.lv1" = "Un échantillon de gaz peut être deux ou quatre fois plus grand sans avoir une pression plus grande, si son récipient et son chauffage croissent du même facteur."
"pressure-is-intensive-under-scaling.registers.lv2" = "Chaque essai maintient n/V et l'énergie par mole fixes. La température et la pression du gaz idéal qui en résultent sont donc égales, tandis que la quantité totale de gaz et le volume changent d'échelle."
"pressure-is-intensive-under-scaling.registers.lv3" = "La pression est intensive sous cette mise à l'échelle proportionnelle parce que p = nRT/V et que l'état thermique est mis à l'échelle de façon cohérente. Cette égalité suppose le gaz idéal du modèle, un volume rigide, une température uniforme et une frontière de récipient inchangée."
"zinc-ions-lower-cell-voltage.summary" = "Augmenter l'activité des ions zinc abaisse la tension à vide calculée de la pile Daniell"
"zinc-ions-lower-cell-voltage.expect.predict.question" = "La demi-pile de cuivre reste fixe tandis que davantage de sulfate de zinc est ajouté à la demi-pile de zinc. Comment la tension à vide change-t-elle ?"
"zinc-ions-lower-cell-voltage.expect.predict.options" = ["Elle augmente, car plus d'ions donnent toujours une pile plus forte", "Elle diminue, car une activité de zinc plus élevée augmente le quotient de réaction"]
"zinc-ions-lower-cell-voltage.expect.predict.misconception" = "La quantité d'électrolyte est traitée comme une source générique de tension sans considérer quel ion figure dans le quotient de réaction de la pile."
"zinc-ions-lower-cell-voltage.expect.predict.diagnosis.0.reveals" = "Conductivité et potentiel de Nernst seraient confondus, et le côté de l'ion zinc dans le quotient aurait été ignoré."
"zinc-ions-lower-cell-voltage.expect.predict.diagnosis.0.next" = "Écris Q = a(Zn2+)/a(Cu2+) et utilise le signe devant ln Q dans l'équation de Nernst."
"zinc-ions-lower-cell-voltage.registers.lv1" = "Ajouter plus d'ions zinc réduit la poussée mesurée de cette pile zinc-cuivre, tandis que le côté cuivre reste le même."
"zinc-ions-lower-cell-voltage.registers.lv2" = "Les quatre piles ne diffèrent que par la quantité de sulfate de zinc. Augmenter l'activité de l'ion zinc augmente le quotient de réaction pour Zn + Cu2+ → Zn2+ + Cu, donc la tension de Nernst diminue."
"zinc-ions-lower-cell-voltage.registers.lv3" = "Le moteur calcule les activités après la spéciation aqueuse, puis évalue la relation de Nernst. La porte sémantique lit le champ de tension de chaque événement exact d'opération de pile et exige que les quatre valeurs diminuent de plus de 0,0001 V ; l'interface graphique marque cette comparaison, disponible uniquement dans l'événement, comme visiblement indisponible plutôt que de la remplacer par un substitut de scène."
"mixing-temperature-does-not-remember-sides.summary" = "Inverser les deux récipients sources laisse la même température de mélange calculée"
"mixing-temperature-does-not-remember-sides.expect.predict.question" = "Les mêmes portions d'eau chaude et froide sont mélangées, mais leur ordre dans la commande est inversé. Quel récipient de destination finit le plus chaud ?"
"mixing-temperature-does-not-remember-sides.expect.predict.options" = ["Celui dont la portion chaude est nommée en premier", "Aucun des deux : la même énergie totale et la même capacité thermique donnent la même température d'équilibre"]
"mixing-temperature-does-not-remember-sides.expect.predict.misconception" = "L'ordre de gauche à droite d'une commande de mélange est confondu avec une source physique d'énergie thermique."
"mixing-temperature-does-not-remember-sides.expect.predict.diagnosis.0.reveals" = "Une étiquette et une position d'opérande seraient traitées comme si elles changeaient le bilan énergétique."
"mixing-temperature-does-not-remember-sides.expect.predict.diagnosis.0.next" = "Calcule la somme de la capacité thermique fois la température de chaque portion dans les deux ordres, puis compare les lectures des récipients de destination."
"mixing-temperature-does-not-remember-sides.registers.lv1" = "Appeler un becher gauche et l'autre droite ne peut pas changer la chaleur finale quand toute leur eau et leur énergie sont mélangées."
"mixing-temperature-does-not-remember-sides.registers.lv2" = "Les deux essais combinent la même portion réchauffée de 0,18 L et la même portion refroidie de 0,27 L. Inverser les opérandes préserve l'énergie thermique totale et la capacité thermique, si bien que les températures des récipients de destination concordent."
"mixing-temperature-does-not-remember-sides.registers.lv3" = "L'opérateur de mélange est commutatif pour ces portions d'eau homogènes, car sa température d'équilibre suit un bilan énergétique symétrique. La perte de chaleur, un temps de mélange fini et des gradients spatiaux pourraient briser l'observation de laboratoire, mais restent hors de ce modèle instantané."
"scaling-mixture-scales-equilibrium.summary" = "Doubler chaque composant double l'inventaire d'équilibre calculé tout en préservant la composition"
"scaling-mixture-scales-equilibrium.expect.predict.question" = "Chaque composant d'un mélange à l'équilibre est doublé avant le même calcul d'équilibre. Que devrait-il arriver aux quantités finales ?"
"scaling-mixture-scales-equilibrium.expect.predict.options" = ["Elles resteraient inchangées, car une constante d'équilibre fixerait des quantités", "Elles doublent, tandis que la composition d'équilibre et le quotient de réaction restent les mêmes"]
"scaling-mixture-scales-equilibrium.expect.predict.misconception" = "La constante d'équilibre est confondue avec un nombre fixe de moles plutôt qu'avec une contrainte sur les activités ou la composition."
"scaling-mixture-scales-equilibrium.expect.predict.diagnosis.0.reveals" = "Une relation d'équilibre intensive serait lue comme un plafond sur un inventaire extensif."
"scaling-mixture-scales-equilibrium.expect.predict.diagnosis.0.next" = "Compare d'abord les fractions molaires et le quotient de réaction, puis compare chaque inventaire molaire final entre les deux échelles."
"scaling-mixture-scales-equilibrium.registers.lv1" = "Rendre toute la recette deux fois plus grande produit deux fois plus de chaque substance finale ; cela ne change pas le point d'équilibre de la recette."
"scaling-mixture-scales-equilibrium.registers.lv2" = "Le second récipient commence avec exactement le double de chaque composant. Son quotient de réaction et sa composition correspondent au premier, si bien que l'équilibre préserve les proportions tandis que les quantités extensives doublent."
"scaling-mixture-scales-equilibrium.registers.lv3" = "C'est l'homogénéité du problème d'équilibre de mélange idéal sous mise à l'échelle extensive. Quatre affirmations sémantiques de rapport exigent que les inventaires d'acide, d'alcool, d'ester et d'eau du second récipient soient le double de ceux du premier, dans des tolérances absolues et relatives déclarées ; l'interface graphique marque les valeurs d'espèces comme indisponibles jusqu'à ce que son contrat de scène puisse les exposer complètement."

# Promotion originale de la septième flotte, brouillon français
