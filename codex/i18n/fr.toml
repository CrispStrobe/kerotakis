"ammonia-between-water-and-air.summary" = "La quantité d'eau et la température déplacent l'ammoniac entre la solution et un ciel gazeux fini"
"ammonia-between-water-and-air.expect.predict.question" = "Chaque ballon scellé reçoit la même quantité d'ammoniac et a le même ciel gazeux. Quels changements déplacent davantage d'ammoniac dans ce ciel gazeux ?"
"ammonia-between-water-and-air.expect.predict.options" = ["De l'eau plus froide et plus d'eau", "De l'eau plus chaude et moins d'eau"]
"ammonia-between-water-and-air.expect.predict.misconception" = "La solubilité du gaz est traitée comme une étiquette fixe de l'ammoniac plutôt que comme un équilibre qui dépend de la quantité de solvant et de la température."
"ammonia-between-water-and-air.expect.predict.diagnosis.0.reveals" = "Le sens de la dissolution du gaz et l'effet d'un réservoir de solvant plus grand ont tous deux été inversés."
"ammonia-between-water-and-air.expect.predict.diagnosis.0.next" = "Compare chaque paire assortie séparément : garde d'abord la quantité d'eau fixe et change la température, puis garde la température fixe et change la quantité d'eau."
"ammonia-between-water-and-air.registers.lv1" = "Le ballon plus chaud et le ballon avec moins d'eau laissent plus d'ammoniac dans le ciel gazeux. Le papier de tournesol humide ne réagit que lorsque cette fraction gazeuse atteint son seuil de détection."
"ammonia-between-water-and-air.registers.lv2" = "Les quatre ballons maintiennent fixes la quantité d'ammoniac et le volume de ciel gazeux tout en changeant un seul paramètre à la fois. L'ordre de pression calculé et les résultats appariés au tournesol montrent qu'une eau plus chaude retient moins d'ammoniac, tandis qu'un inventaire d'eau plus grand en retient davantage."
"ammonia-between-water-and-air.registers.lv3" = "Le banc couple la spéciation aqueuse de l'ammoniac à un partage de Henry à ciel gazeux fini, puis applique un seuil de détection au tournesol humide mis en scène séparément. C'est un modèle d'équilibre et de mesure, pas une prédiction de vitesse d'évaporation ; les corrections d'activité en dehors du domaine aqueux vérifié, les temps de transfert de matière et la réponse d'une vraie bandelette réelle ne sont pas revendiqués."

# Promotions sémantiques appariées source-fleet v2, brouillon français
