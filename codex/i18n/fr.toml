"three-components-one-cut.summary" = "Une coupe de distillation calculée transfère trois constituants sans en créer ni en écarter aucun"
"three-components-one-cut.expect.predict.question" = "Le constituant le plus volatil arrive-t-il seul dans le récipient de tête ?"
"three-components-one-cut.expect.predict.options" = ["Oui : une distillation ne transfère jamais qu'un seul constituant à la fois", "Non : la vapeur est un mélange, et chaque constituant doit être compté dans les deux récipients"]
"three-components-one-cut.expect.predict.misconception" = "L'enrichissement est confondu avec une séparation parfaite ; une vapeur mélangée peut favoriser un constituant sans exclure les autres."
"three-components-one-cut.expect.predict.diagnosis.0.reveals" = "Un ordre de points d'ébullition est pris pour une séquence de prélèvements de constituants purs."
"three-components-one-cut.expect.predict.diagnosis.0.next" = "Additionne, pour chaque constituant, la quantité restante et la quantité recueillie, puis compare la composition du récipient de tête à la composition de départ."
"three-components-one-cut.registers.lv1" = "Le récipient de tête reçoit un mélange, pas seulement le constituant le plus facile à vaporiser ; ce qui a quitté la source doit réapparaître ailleurs."
"three-components-one-cut.registers.lv2" = "Le total de départ est 3 + 0,3 + 0,2 = 3,5 mol, donc une fraction de coupe molaire de 0,2 demande 0,7 mol au total, pas cette fraction de chaque constituant pris séparément ; vérifie chaque constituant séparément entre la source et le récipient de tête."
"three-components-one-cut.registers.lv3" = "Le calcul de Rayleigh générique utilise un mélange idéal de Raoult et une approximation de Clausius-Clapeyron à chaleur latente constante et bornée ; il ne prédit ni les azéotropes non idéaux ni les performances mesurées d'un appareil réel, et la puissance rapportée ne somme que la chaleur latente du condensat prélevé, à l'exclusion de la chaleur sensible et de la circulation du reflux ou du rebouilleur."
"equal-charge-different-clocks.summary" = "À charge délivrée égale, l'électrolyse de l'eau modélisée produit la même quantité malgré des profils de courant différents"
"equal-charge-different-clocks.expect.predict.question" = "Quel profil de courant produit le plus de dihydrogène dans ce modèle d'électrolyse de l'eau ?"
"equal-charge-different-clocks.expect.predict.options" = ["Le courant le plus élevé produit toujours le plus", "Les trois profils produisent la même quantité, car ils délivrent la même charge"]
"equal-charge-different-clocks.expect.predict.misconception" = "Le courant est traité comme une quantité plutôt que comme un débit de charge ; la durée et la somme sur des impulsions séparées sont absentes du raisonnement."
"equal-charge-different-clocks.expect.predict.diagnosis.0.reveals" = "Un réglage instantané est utilisé pour prédire un total sans intégrer sur la durée."
"equal-charge-different-clocks.expect.predict.diagnosis.0.next" = "Multiplie le courant par la durée pour chaque impulsion, additionne les impulsions, puis compare les quantités de produits d'électrode générées plutôt que le seul gaz restant dans les récipients ouverts."
"equal-charge-different-clocks.registers.lv1" = "Un courant plus faible peut rattraper son retard en durant plus longtemps, et fractionner un apport n'efface pas sa première partie."
"equal-charge-different-clocks.registers.lv2" = "Chaque profil délivre Q = It = 12 C ; avec de l'eau en excès, le modèle donne n(H2) = Q/(2F) et n(O2) = Q/(4F), il faut donc comparer la production cumulée aux électrodes plutôt que de considérer le gaz échappé comme une production manquante."
"equal-charge-different-clocks.registers.lv3" = "Ces contrôles testent le modèle idéal charge-produit existant, pas le rendement faradique mesuré, la surtension d'électrode ni la collecte réelle des gaz par l'appareil ; le bilan atomique indépendant compare le contenu final au gaz dégagé vers l'extérieur moins le gaz absorbé, ne comptant le gaz de ciel gazeux retenu que dans le contenu, et n'ajoutant jamais les événements de production comme un réservoir de matière supplémentaire."
"grouping-does-not-change-water-heat.summary" = "Regrouper différemment les trois mêmes portions d'eau préserve leur bilan final de chaleur sensible"
"grouping-does-not-change-water-heat.expect.predict.question" = "Mélanger d'abord la paire la plus chaude change-t-il la température finale, une fois que les trois portions d'eau sont réunies ?"
"grouping-does-not-change-water-heat.expect.predict.options" = ["Oui : le premier mélange fixe une température dont le mélange suivant garde le souvenir", "Non : la même quantité totale d'eau et la même énergie sensible conservée déterminent la température finale"]
"grouping-does-not-change-water-heat.expect.predict.misconception" = "La température intermédiaire est traitée comme conservée, à la place de l'énergie que porte chaque quantité d'eau."
"grouping-does-not-change-water-heat.expect.predict.diagnosis.0.reveals" = "Des températures intermédiaires non pondérées remplacent un bilan énergétique pondéré par les quantités de matière."
"grouping-does-not-change-water-heat.expect.predict.diagnosis.0.next" = "Additionne les apports et les pertes d'énergie, divise par la capacité thermique totale, et compare les thermomètres finaux de v1 et v10."
"grouping-does-not-change-water-heat.registers.lv1" = "Des températures intermédiaires différentes peuvent mener à la même température finale, dès lors que la même eau et la même énergie se retrouvent réunies."
"grouping-does-not-change-water-heat.registers.lv2" = "Chaque branche part de 6 mol d'eau à 25 °C et conserve 300 - 200 + 100 = 200 J ; avec la capacité thermique de l'eau utilisée, 75,3 J/(mol K), la température finale découle de 25 + 200/(6 × 75,3), quel que soit le regroupement."
"grouping-does-not-change-water-heat.registers.lv3" = "Il s'agit d'un contrôle adiabatique de la chaleur sensible de l'eau à capacité thermique constante, sans transition de phase ni mélange réactif ; cela n'affirme ni que des récipients réels ne perdent aucune chaleur, ni que le regroupement préserve la température si de la matière s'échappe ou qu'une chimie différente intervient en chemin."

