"saline-conductivity-is-intensive.summary" = "Mettre à l'échelle ensemble l'eau et le sel préserve la conductivité modélisée"
"saline-conductivity-is-intensive.expect.predict.question" = "Quatre bechers contiennent une, deux, trois et quatre fois plus d'eau salée, mais chaque recette garde le même rapport sel-eau. Lequel a la plus grande conductivité ?"
"saline-conductivity-is-intensive.expect.predict.options" = ["Le plus grand, car il contient le plus de sel au total", "Aucun : une mise à l'échelle proportionnelle maintient égales la concentration en ions et la conductivité modélisée"]
"saline-conductivity-is-intensive.expect.predict.misconception" = "La quantité extensive de sel dissous est confondue avec sa concentration, laquelle contrôle le modèle de conductivité."
"saline-conductivity-is-intensive.expect.predict.diagnosis.0.reveals" = "Le sel supplémentaire aurait été compté sans l'eau proportionnellement supplémentaire qui le contient."
"saline-conductivity-is-intensive.expect.predict.diagnosis.0.next" = "Divise la quantité de sel par le volume d'eau pour chaque becher, puis compare les quatre lectures de conductivité."
"saline-conductivity-is-intensive.registers.lv1" = "Un becher plus grand suivant la même recette d'eau salée conduit comme le plus petit. Il contient plus d'ions, mais aussi proportionnellement plus d'eau."
"saline-conductivity-is-intensive.registers.lv2" = "Les quatre préparations contiennent 0,004 mol de NaCl par litre d'eau. Leurs quantités totales de sel diffèrent d'un facteur quatre, tandis que la concentration modélisée, et donc la conductivité, concordent."
"saline-conductivity-is-intensive.registers.lv3" = "Les quatre scripts exacts de la série d'essais, cas 505–508, forment un contrôle de mise à l'échelle extensive. Une affirmation sémantique d'égalité lit chaque événement mesuré avec les tolérances absolues et relatives figées. La conductivité n'est traitée comme intensive qu'à l'intérieur de ce modèle aqueux ; la dépendance à la température, la géométrie des électrodes, l'étalonnage et la non-linéarité à haute concentration sont hors de cette affirmation. L'interface graphique laisse indisponibles les valeurs présentes uniquement dans l'événement plutôt que de substituer un proxy de scène."
"sugar-is-not-an-electrolyte-control.summary" = "Changer la quantité ou l'identité du sucre neutre dissous laisse inchangé le témoin de conductivité modélisé"
"sugar-is-not-an-electrolyte-control.expect.predict.question" = "Des portions d'eau égales reçoivent du glucose ou du saccharose à deux quantités différentes. Ajouter plus de sucre dissous fait-il monter la conductivité modélisée ?"
"sugar-is-not-an-electrolyte-control.expect.predict.options" = ["Oui : chaque particule dissoute transporte du courant électrique", "Non : ces sucres neutres se dissolvent sans fournir les ions mobiles utilisés par ce modèle de conductivité"]
"sugar-is-not-an-electrolyte-control.expect.predict.misconception" = "Dissoudre est traité comme identique à se dissocier en particules chargées."
"sugar-is-not-an-electrolyte-control.expect.predict.diagnosis.0.reveals" = "Des molécules de sucre neutres auraient été comptées comme porteuses de charge simplement parce qu'elles sont dispersées dans l'eau."
"sugar-is-not-an-electrolyte-control.expect.predict.diagnosis.0.next" = "Note les charges des particules dissoutes, puis compare les témoins au sucre au chlorure de sodium pour le même volume d'eau."
"sugar-is-not-an-electrolyte-control.registers.lv1" = "Le sucre peut disparaître dans l'eau sans devenir une charge électrique. Plus de glucose ou de saccharose ne fait donc pas monter cet appareil virtuel."
"sugar-is-not-an-electrolyte-control.registers.lv2" = "Les quatre témoins changent l'identité et la quantité du sucre tout en gardant l'eau fixe. Le glucose et le saccharose restent des solutés moléculaires neutres, aucun ne fournissant les ions comptés par l'estimateur de conductivité."
"sugar-is-not-an-electrolyte-control.registers.lv3" = "Les cas 681–684 sont une relation de contrôle négatif, non une affirmation universelle que de vraies solutions de sucre auraient une conductance exactement nulle. L'affirmation sémantique compare les quatre valeurs exactes d'événement mesuré dans les tolérances figées. Les impuretés ioniques traces, l'autoprotolyse de l'eau, la réponse d'électrode, la viscosité et la mobilité dépendante de la concentration ne sont pas résolues ici. Comme la Scène v1 n'a aucune charge utile d'événement, l'interface graphique rapporte cette comparaison comme indisponible plutôt que d'inventer une valeur."
"gas-yield-has-two-limiting-reagent-axes.summary" = "Le rendement en dioxyde de carbone augmente avec l'un ou l'autre réactif tant que l'autre reste en excès"
"gas-yield-has-two-limiting-reagent-axes.expect.predict.question" = "Quel changement peut augmenter le rendement en dioxyde de carbone : ajouter plus d'acide à un excès de bicarbonate, ou ajouter plus de bicarbonate à un excès d'acide ?"
"gas-yield-has-two-limiting-reagent-axes.expect.predict.options" = ["Seul plus d'acide le peut, car c'est l'acide qui produit les bulles", "L'un ou l'autre le peut tant qu'il est le réactif limitant ; le partenaire doit rester en excès"]
"gas-yield-has-two-limiting-reagent-axes.expect.predict.misconception" = "La production de gaz est attribuée à un ingrédient nommé plutôt qu'à la rencontre stœchiométrique des deux réactifs."
"gas-yield-has-two-limiting-reagent-axes.expect.predict.diagnosis.0.reveals" = "Le bicarbonate aurait été traité comme un milieu passif, alors même que son carbone devient le dioxyde de carbone."
"gas-yield-has-two-limiting-reagent-axes.expect.predict.diagnosis.0.next" = "Équilibre HCO3− + H+ → CO2 + H2O, puis identifie la quantité limitante le long de chacun des quatre axes de récipients."
"gas-yield-has-two-limiting-reagent-axes.registers.lv1" = "Plus de l'un ou l'autre partenaire peut produire plus de gaz — mais seulement quand l'autre partenaire attend en excès. Chaque molécule de dioxyde de carbone a besoin à la fois de bicarbonate et d'acide."
"gas-yield-has-two-limiting-reagent-axes.registers.lv2" = "Les quatre premiers récipients maintiennent fixe le bicarbonate à 0,004 mol et augmentent l'acide de 0,0005 à 0,003 mol. Les quatre suivants maintiennent fixe l'acide à 0,010 mol et augmentent le bicarbonate de 0,001 à 0,008 mol. La quantité de dioxyde de carbone augmente le long des deux axes contrôlés."
"gas-yield-has-two-limiting-reagent-axes.registers.lv3" = "Ceci combine les cas figés 561–568 sans changer leurs scripts ni leurs attentes. La porte de la série d'essais vérifie la dernière valeur de gas_evolved.moles dans chaque cas indépendant et exige des augmentations successives supérieures à 10⁻⁵ mol sur les deux axes. L'adaptateur sémantique du Codex n'expose délibérément pas les scalaires d'événement gazeux, donc cette carte combinée exige l'événement sans dupliquer l'affirmation numérique. L'évidence établit la monotonie du réactif limitant à l'intérieur de la plage modélisée, pas l'efficacité de collecte, la taille des bulles, la vitesse, la pression ou la récupération complète du gaz. La Scène v1 de l'interface graphique laisse de même la comparaison, disponible uniquement dans l'événement, indisponible."
"longer-waits-advance-peroxide-kinetics.summary" = "Des attentes plus longues font avancer le réseau enregistré de décomposition du peroxyde"
"longer-waits-advance-peroxide-kinetics.expect.predict.question" = "Une attente laisse-t-elle le peroxyde d'hydrogène inchangé quand le réseau enregistré de décomposition du peroxyde est disponible ?"
"longer-waits-advance-peroxide-kinetics.expect.predict.options" = ["Oui : attendre ne change que l'horloge affichée", "Non : le temps écoulé fait avancer le réseau cinétique enregistré tout en conservant les éléments"]
"longer-waits-advance-peroxide-kinetics.expect.predict.misconception" = "L'horloge est traitée comme un simple affichage, même quand le simulateur possède un réseau cinétique explicite pour la matière."
"longer-waits-advance-peroxide-kinetics.expect.predict.diagnosis.0.reveals" = "Le chemin enregistré de décomposition du peroxyde et son évolution temporelle auraient été ignorés."
"longer-waits-advance-peroxide-kinetics.expect.predict.diagnosis.0.next" = "Compare l'inventaire de H2O2 de chaque récipient immédiatement après l'ajout avec son inventaire après le temps modélisé écoulé."
"longer-waits-advance-peroxide-kinetics.registers.lv1" = "Attendre fait avancer cette réaction virtuelle au peroxyde : une partie du H2O2 se décompose, tandis que son hydrogène et son oxygène restent comptabilisés."
"longer-waits-advance-peroxide-kinetics.registers.lv2" = "Chaque récipient commence avec 0,010 mol de H2O2 dans 200 mL d'eau. Le réseau cinétique enregistré tourne à mesure que le temps modélisé avance, si bien que chaque inventaire de peroxyde après attente est inférieur à son propre inventaire après ajout."
"longer-waits-advance-peroxide-kinetics.registers.lv3" = "Les cas figés 657–660 affirment la conservation élémentaire à travers chaque attente, pas une stase moléculaire. Cette relecture du catalogue ajoute quatre diminutions sémantiques de H2O2 et exige l'événement enregistré de décomposition du peroxyde. Les récipients séquentiels partagent une seule horloge, donc aucune comparaison de vitesse entre récipients n'est faite. C'est une observation du contrat du simulateur, pas une nouvelle vitesse empirique du peroxyde. Les inventaires d'espèces restent indisponibles dans la Scène v1 de l'interface graphique plutôt que d'être remplacés par un proxy de scène."

