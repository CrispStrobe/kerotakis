# The catalogue in German.
#
# One file per language, so two translators never edit the same file and
# the English source does not grow a copy per language. Keys are
# `<entry-id>.<path to the English field>`; array indices are segments.
#
# A key with no counterpart in the catalogue is an error, not a spare:
# it means the English moved and this translation is describing
# something that is no longer there.

"strong-base.expect.predict.question" = "Ein Tausendstel Mol Natriumhydroxid kommt in einen Liter Wasser. Was wird das pH-Meter anzeigen?"
"strong-base.expect.predict.options" = ["3", "7 — Hydroxid ist keine Säure, der pH-Wert kann sich also nicht bewegen", "11"]
"strong-base.expect.predict.misconception" = "Die Antwort 3 ist der Spiegelfehler: Der Exponent stimmt, die Richtung nicht. Eine Base hebt den pH-Wert genauso weit über 7 an, wie die entsprechende Säure ihn darunter senkt. Die Antwort 7 behandelt den pH-Wert als eine reine Säureskala, dabei ist er eine Skala der Wasserstoffionen-Aktivität, die Hydroxid verschiebt, indem es H⁺ verbraucht."
"strong-base.expect.predict.diagnosis.0.reveals" = "Die Rechnung ist richtig, die Richtung nicht: 0,001 mol ergibt den Exponenten 3, und jeder Exponent wird als Säurewert gelesen — als würde das Lösen von irgendetwas den pH-Wert stets nach unten bewegen."
"strong-base.expect.predict.diagnosis.0.next" = "Führe zuerst das Spiegelexperiment durch: 0,001 mol HCl im gleichen Liter (`strong-acid`) zeigt an diesem Labor pH 3,0. Tauscht man die Säure gegen NaOH, landet derselbe Exponent im gleichen Abstand von 7 — nur auf der anderen Seite."
"strong-base.expect.predict.diagnosis.1.reveals" = "Der pH-Wert wird als Eigenschaft angesehen, die Säuren besitzen und andere Stoffe nicht — eine Base könnte das Messgerät demnach gar nicht bewegen. Tatsächlich ist er eine Skala der Wasserstoffionen-Aktivität, die Hydroxid verschiebt, indem es H⁺ verbraucht."
"strong-base.expect.predict.diagnosis.1.next" = "Miss zuerst reines Wasser (7,0) und gib dann das Hydroxid in Zehnteln zu, mit einer Messung nach jedem Schritt: Das Messgerät steigt schon bei der ersten Zugabe — etwas, das eine Skala, die nur Säuren berühren können, nicht leisten könnte."
"strong-base.registers.lv1" = "Diese Flüssigkeit ist das Gegenteil einer Säure. Sie fühlt sich seifig an — das ist deine eigene Haut, die sich ganz leicht auflöst — und sie färbt einen Rotkohl-Indikator grün. Niemals berühren."
"strong-base.registers.lv2" = "Natriumhydroxid ist eine starke Base: Es dissoziiert vollständig, sodass 0,001 mol in einem Liter [OH⁻] = 10⁻³, einen pOH-Wert von 3 und einen pH-Wert von 14 − 3 = 11 ergeben."
"strong-base.registers.lv3" = "Die Engine wendet nicht pH = 14 − pOH an; sie löst die Ladungsbilanz mit Kw bei der Eigentemperatur der Lösung und berichtet 10,99 — knapp unter 11, weil der Aktivitätskoeffizient von OH⁻ bei I = 10⁻³ ≈ 0,965 beträgt."
"lye-warms-the-beaker.expect.predict.question" = "Vier Gramm Rohrreiniger (Natriumhydroxid) kommen in 100 mL kaltes Wasser. Was macht das Thermometer?"
"lye-warms-the-beaker.expect.predict.options" = ["Es steigt um etwa 10 °C", "Nichts — Lösen ist keine chemische Reaktion, also ist keine Wärme im Spiel", "Es sinkt, weil der Feststoff auseinandergerissen werden muss"]
"lye-warms-the-beaker.expect.predict.misconception" = "Beide falschen Antworten stammen aus demselben Bild: Lösen als reiner Zerlegungsvorgang. Das Aufbrechen des Gitters kostet zwar Energie — aber die Hydratation der Ionen zahlt mehr davon zurück, bei NaOH sind es 44,5 kJ pro Mol. Ob eine Lösung sich erwärmt oder abkühlt, ist die Bilanz dieser beiden Vorgänge — deshalb wird Kaliumchlorid kalt und dieses hier heiß."
"lye-warms-the-beaker.expect.predict.diagnosis.0.reveals" = "Wärme wird nur 'echten' chemischen Reaktionen zugeschrieben, und Lösen gilt als bloßes Mischen — die Energiebilanz wird erst eröffnet, sobald offiziell neue Stoffe entstehen."
"lye-warms-the-beaker.expect.predict.diagnosis.0.next" = "Beobachte das Thermometer schon beim ersten Pellet: Der Anstieg beginnt, bevor überhaupt von einem Produkt die Rede sein könnte. Führe dann `cold-pack` daneben aus — Kaliumchlorid bewegt dasselbe Thermometer in die andere Richtung, das Lösen selbst trägt also die Wärme, in beide Richtungen."
"lye-warms-the-beaker.expect.predict.diagnosis.1.reveals" = "Nur die halbe Energiegeschichte: Das Auseinanderreißen des Gitters kostet, und dort endet die Rechnung — jedes Lösen müsste also abkühlen. Die zahlende Hälfte, das Binden des Wassers an die freigesetzten Ionen, fehlt."
"lye-warms-the-beaker.expect.predict.diagnosis.1.next" = "Der Vergleich, der die fehlende Hälfte sichtbar macht, ist `cold-pack` gegen dieses Becherglas: KCl kühlt das Wasser tatsächlich, NaOH erwärmt es. Eine einzige Geschichte vom Gitteraufbruch kann nicht zwei verschiedene Vorzeichen erzeugen — ein zweiter Term muss mit einzahlen."
"lye-warms-the-beaker.registers.lv1" = "Das Glas wird so heiß, dass man es kaum noch anfassen mag — dabei hat nichts gebrannt und nichts wurde erhitzt. Die Wärme kam aus dem Pulver, während es verschwand."
"lye-warms-the-beaker.registers.lv2" = "0,1 mol NaOH in 100 mL setzen etwa 4,5 kJ frei. Bei nur rund 100 g zu erwärmendem Wasser ergibt das einen Anstieg von etwa 10 °C, und die entstehende 1-mol/L-Lösung zeigt pH ≈ 13,5 — nicht die 14,0, die die Rechnung verspricht."
"lye-warms-the-beaker.registers.lv3" = "Das Gefäß ist adiabatisch, sodass die gesamten −44,5 kJ/mol als spürbare Wärme erscheinen. Der pH-Wert liegt bei 13,51 statt bei 14,0, und *zwei* getrennte Korrekturen führen dorthin. Erstens ist bei I ≈ 1 mol/kgw der Aktivitätskoeffizient von OH⁻ auf ≈0,68 gefallen, und die Engine berichtet Aktivität, nicht Konzentration. Zweitens hat sich das Becherglas selbst auf 35,7 °C erwärmt, und K_w ist stark temperaturabhängig — pK_w fällt von 14,00 bei 25 °C auf hier etwa 13,7 —, sodass sich der Neutralpunkt selbst unter der Messung verschoben hat. Die Lösung wird bei der Temperatur berechnet, die sie tatsächlich erreicht hat, nicht bei der Ausgangstemperatur — deshalb liegt diese Zahl unter dem Lehrbuchwert 13,8: Die Lehrbuchangabe hält das Becherglas stillschweigend bei 25 °C, während sie behauptet, es sei heiß geworden."
"neutralisation.expect.predict.question" = "Ein Liter Säure mit pH 2 erhält genau die passende Menge Natriumhydroxid. Was befindet sich danach im Becherglas?"
"neutralisation.expect.predict.options" = ["Nichts — die Säure und die Base haben sich gegenseitig zerstört", "Salzwasser: Natrium- und Chlorid-Ionen in Wasser, bei pH 7", "Eine schwächere Säure, bei etwa pH 5"]
"neutralisation.expect.predict.misconception" = "\"Sie heben sich auf\" ist der häufigste Neutralisationsfehler, und er verletzt stillschweigend die Erhaltung der Materie. Nichts wird zerstört: H⁺ und OH⁻ verbinden sich zu Wasser, und die Natrium- und Chloridionen sind unverändert als Zuschauerionen weiterhin vorhanden. Stelle das Becherglas auf eine Waage — es ist schwerer als vorher, nicht leer."
"neutralisation.expect.predict.diagnosis.0.reveals" = "Neutralisation als gegenseitige Zerstörung — 'sie heben sich auf' wörtlich genommen, sodass die Materie selbst verschwunden ist. Die Erhaltung der Materie wurde stillschweigend außer Kraft gesetzt, damit die Chemie dramatischer wirkt."
"neutralisation.expect.predict.diagnosis.0.next" = "Stelle es auf die Waage: `measure v1 balance` vor und nach der Zugabe der Base. Das Becherglas ist genau um das hinzugefügte Gewicht schwerer geworden — und beim Eindampfen (`crystallising-salt-from-brine`) taucht das feste Salz wieder auf, das angeblich zerstört wurde."
"neutralisation.expect.predict.diagnosis.1.reveals" = "Neutralisation als Verdünnung: Die Base verwässert die Säure nur, sodass der pH-Wert ein Stück ansteigt und dann stehen bleibt. Der stöchiometrische Punkt — wo das letzte H⁺ auf das letzte OH⁻ trifft — hat in diesem Bild keine besondere Bedeutung."
"neutralisation.expect.predict.diagnosis.1.next" = "Gib die Base in zehn Portionen zu, mit einer pH-Messung nach jeder. Eine bloße Verdünnung würde gleichmäßig ansteigen und unterhalb von 7 stehen bleiben; die echte Kurve kriecht zunächst und springt dann über vier Einheiten hinweg, genau dort, wo beide Vorräte gleichzeitig zur Neige gehen (`past-the-equivalence-point` liegt auf der anderen Seite dieses Sprungs)."
"neutralisation.registers.lv1" = "Mische die saure Flüssigkeit und die seifige Flüssigkeit in genau der richtigen Menge, und du erhältst … Salzwasser. Beide gefährlichen Stoffe sind zu etwas geworden, das man (im Prinzip) trinken könnte."
"neutralisation.registers.lv2" = "H⁺ + OH⁻ → H₂O. Gleiche Stoffmengen einer starken Säure und einer starken Base lassen nur die Zuschauerionen Na⁺ und Cl⁻ übrig, sodass die Lösung 0,01 mol/L Natriumchlorid bei pH 7 ist."
"neutralisation.registers.lv3" = "Die Engine berichtet 7,00 und führt die Zuschauerionen explizit weiter: Je 0,01 mol Na⁺ und Cl⁻ bleiben im Bestand, [H⁺] = [OH⁻] = 1,10 × 10⁻⁷ mol/kgw bei γ ≈ 0,90. Die Reaktion wird der Engine nie vorgegeben — sie ergibt sich aus der Minimierung der freien Energie der Lösung."
"past-the-equivalence-point.summary" = "HCl + 1.1 NaOH → NaCl + H₂O + 0.1 NaOH (Überschuss)"
"past-the-equivalence-point.expect.predict.question" = "Du hast die Säure genau neutralisiert und gibst dann 10 % zu viel Base hinzu. Was passiert mit dem pH-Wert?"
"past-the-equivalence-point.expect.predict.options" = ["Er kriecht auf etwa 7,5", "Er springt auf etwa 11", "Er kann nicht über 7 steigen, weil die Säure bereits verbraucht ist"]
"past-the-equivalence-point.expect.predict.misconception" = "Ein sanftes Ansteigen zu erwarten behandelt die pH-Skala als linear, dabei ist sie logarithmisch. In der Nähe des Äquivalenzpunkts ist fast nichts mehr übrig, das das zugegebene Hydroxid abpuffern könnte, sodass eine Überdosierung von 10 % den pH-Wert um fast vier Einheiten verschiebt — genau deshalb kann ein Indikator überhaupt einen Endpunkt markieren, und genau deshalb ruiniert ein einziger Tropfen zu viel eine Titration."
"past-the-equivalence-point.expect.predict.diagnosis.0.reveals" = "Die pH-Achse wird linear gelesen: zehn Prozent mehr Base sollten eine zehn Prozent große Verschiebung bringen. Dass die Skala logarithmisch ist — und dass nichts mehr übrig ist, um den Überschuss abzupuffern — ist noch nicht verstanden."
"past-the-equivalence-point.expect.predict.diagnosis.0.next" = "Lass das Labor zählen, was übrig bleibt: 0,001 mol unausgeglichenes Hydroxid in einem Liter. Dieses Becherglas gibt es bereits in diesem Kodex — `strong-base` — und es zeigt 11, nicht 7,5."
"past-the-equivalence-point.expect.predict.diagnosis.1.reveals" = "Der pH-Wert bleibt bei 7 stehen, weil er als Eigenschaft der Säure selbst gilt: Ist die Säure verbraucht, gibt es scheinbar nichts mehr zu messen, und die Wirkung der überschüssigen Base auf das Wasser selbst bleibt unsichtbar."
"past-the-equivalence-point.expect.predict.diagnosis.1.next" = "Streiche die Säure aus der Geschichte: reines Wasser plus dieselben 0,001 mol NaOH (`strong-base`) zeigen an diesem Labor 11. Die übertitrierte Lösung ist genau dieses Becherglas plus Zuschauerionen."
"past-the-equivalence-point.registers.lv1" = "Ein Tropfen zu viel, und die Farbe schießt über den gewünschten Ton hinaus. Genau am Gleichgewichtspunkt steht die Flüssigkeit auf Messers Schneide: Die kleinste Zugabe kippt sie ein ganzes Stück weiter."
"past-the-equivalence-point.registers.lv2" = "Nach dem Äquivalenzpunkt bestimmt die überschüssige Base den pH-Wert direkt: 0,001 mol übrig gebliebenes NaOH in einem Liter ergeben pOH 3, pH ≈ 11. Die Titrationskurve ist hier fast senkrecht — genau diese Steilheit macht den Endpunkt überhaupt erkennbar."
"past-the-equivalence-point.registers.lv3" = "Der berechnete Wert ist 10,95, nicht 11,00: Das überschüssige Hydroxid befindet sich in einem ionischen Medium von 0,011 mol/kgw, und seine Aktivität liegt unter seiner Konzentration. Die Steilheit ist eine Eigenschaft der Ladungsbilanz in der Nähe des Punkts, an dem die Vorräte der starken Säure und der starken Base gleichzeitig erschöpft sind — keine für den Unterricht zurechtgebogene Kurve."
"phosphoric-acid-three-protons.expect.predict.question" = "Phosphorsäure besitzt drei acide Wasserstoffatome. Eine 0,1-mol/L-Lösung verhält sich deshalb wie…"
"phosphoric-acid-three-protons.expect.predict.options" = ["0,3 mol/L einer starken Säure — pH etwa 0,5, da alle drei abgegeben werden", "0,1 mol/L einer schwachen Säure — pH etwa 1,6, weil im Wesentlichen nur das erste Proton abgegeben wird", "0,1 mol/L einer starken Säure — pH genau 1,0"]
"phosphoric-acid-three-protons.expect.predict.misconception" = "Protonen an der Formel abzuzählen und zu multiplizieren ist der klassische Fehler bei mehrprotonigen Säuren. Die drei Ionisierungsstufen liegen jeweils um etwa fünf Zehnerpotenzen auseinander; das zweite Proton abzugeben bedeutet, eine positive Ladung von einem bereits negativen Ion abzuziehen, was weitaus schwerer ist. Bei pH 1,6 hat die zweite Stufe kaum begonnen — die Engine findet HPO₄²⁻ bei 3 × 10⁻⁴ mol/kgw gegenüber H₂PO₄⁻ bei 10⁻¹."
"phosphoric-acid-three-protons.expect.predict.diagnosis.0.reveals" = "Protonen werden an der Formel abgezählt und multipliziert: drei geschriebene Wasserstoffatome bedeuten drei abgegebene, als wäre die Ionisierung eine Eigenschaft der Formel und kein Gleichgewicht, das mit jeder bereits entfernten Ladung schwerer wird."
"phosphoric-acid-three-protons.expect.predict.diagnosis.0.next" = "Sieh dir die Stufenleiter selbst bei lv3 an: Bei pH 1,64 hält die zweite Stufe 3 × 10⁻⁴ mol/kgw gegen 10⁻¹ auf der ersten — eintausend zu eins. Alle drei Stufen sind real; die Lösung steht nur auf der ersten."
"phosphoric-acid-three-protons.expect.predict.diagnosis.1.reveals" = "Ein Proton wird zugestanden, aber vollständig: 'Säure' impliziert immer noch vollständige Dissoziation, also müsste 0,1 mol/L genau 1,0 ergeben. Dass die meisten H₃PO₄-Moleküle ihr erstes Proton in jedem Moment noch festhalten, fehlt in diesem Bild."
"phosphoric-acid-three-protons.expect.predict.diagnosis.1.next" = "Führe die Säure aus, für die diese Antwort fast richtig wäre: 0,1 mol HCl im gleichen Liter zeigt an diesem Labor 1,08, dieses Becherglas 1,64. Die Lücke zwischen diesen beiden Zahlen ist der Anteil der Phosphorsäure, der nie losgelassen hat."
"phosphoric-acid-three-protons.registers.lv1" = "Das ist der säuerliche Geschmack in Cola. Sie hat drei saure Teile, aber nur der erste gibt leicht nach — die anderen beiden halten fest."
"phosphoric-acid-three-protons.registers.lv2" = "Bei dieser Konzentration zählt nur die erste Ionisierungsstufe (pKa₁ ≈ 2,15 gegenüber pKa₂ ≈ 7,2 und pKa₃ ≈ 12,3), sodass sich die Lösung wie eine einzelne schwache Säure verhält und bei etwa pH 1,6 landet."
"phosphoric-acid-three-protons.registers.lv3" = "Die Engine löst alle drei Gleichgewichte gleichzeitig, statt eines auszuwählen. Die resultierende Verteilung bei pH 1,64 ist H₂PO₄⁻ 9,9 × 10⁻², H₃PO₄ 4,3 × 10⁻⁴, HPO₄²⁻ 3,4 × 10⁻⁴, PO₄³⁻ unter 10⁻⁹ — die Stufenleiter ist real, sie steht nur fast vollständig auf ihrer ersten Sprosse."
"phosphate-buffer.summary" = "H₂PO₄⁻/HPO₄²⁻-Puffer (1,5 Äquivalente Base pro H₃PO₄)"
"phosphate-buffer.expect.predict.question" = "Auf halbem Weg zwischen dem ersten und zweiten Äquivalenzpunkt der Phosphorsäure sagt die Lehrbuchregel pH = pKa₂ ≈ 7,2. Die Engine berechnet 6,64. Woher kommt die Lücke?"
"phosphate-buffer.expect.predict.options" = ["Die Engine irrt sich — die Henderson-Hasselbalch-Gleichung ist exakt", "Die beiden Phosphat-Spezies tragen unterschiedliche Ladungen, sodass sich Ionenstärke-Effekte nicht aufheben und der gemessene pH-Wert unter dem tabellierten pKa-Wert liegt", "Die Base wurde zu schnell zugegeben"]
"phosphate-buffer.expect.predict.misconception" = "Henderson-Hasselbalch wird als Gesetz behandelt statt als Näherung, die Aktivität mit Konzentration gleichsetzt. Hier steht das Verhältnis zwischen einem 1−- und einem 2−-Ion, deren Aktivitätskoeffizienten 0,76 und 0,32 betragen — sie heben sich nicht auf, und der pH-Wert bei Halbneutralisation fällt etwa eine halbe Einheit unter pKa₂. Deshalb werden echte Pufferrezepte mit einem Messgerät geprüft und nicht einfach berechnet und geglaubt."
"phosphate-buffer.expect.predict.diagnosis.0.reveals" = "Henderson-Hasselbalch wird als exakt angesehen — eine Gleichung, die in jedem Lehrbuch steht, muss ein Gesetz sein, also muss ein Messgerät, das ihr widerspricht, defekt sein."
"phosphate-buffer.expect.predict.diagnosis.0.next" = "Berechne die Korrektur, die das 'Gesetz' wegdefiniert hat: log(0,32/0,76) ≈ −0,38, und sie ergibt sich direkt aus den beiden Aktivitätskoeffizienten, die die Gleichung gleich eins setzt. Vergleiche dann mit `half-neutralised-vinegar`, wo das Paar 0- und 1−-fach geladen ist und dieselbe Regel fast stimmt — der Fehler wächst mit den Ladungen, was der Fehler eines exakten Gesetzes nicht dürfte."
"phosphate-buffer.expect.predict.diagnosis.1.reveals" = "Eine Messung, die vom erwarteten Wert abweicht, wird der Technik angelastet — Gleichgewicht wird sich als etwas vorgestellt, das eine hastige Hand überholen kann, sodass sich die Zahl bei sorgfältigem Arbeiten auf 7,2 einpendeln würde."
"phosphate-buffer.expect.predict.diagnosis.1.next" = "Rühre, `wait`, und miss erneut: Die Anzeige wandert nicht in Richtung 7,2, denn nichts befindet sich außerhalb des Gleichgewichts. Die Lücke steckt in der Annahme der Gleichung, nicht in den Händen — genau das macht sie zu Chemie und nicht zu Ungeschicklichkeit."
"phosphate-buffer.registers.lv1" = "Diese Mischung bleibt hartnäckig nahe dem pH-Wert deines eigenen Bluts. Gibst du Säure oder Base hinzu, bewegt sie sich kaum — derselbe Trick wie beim Essigpuffer, nur mit einem anderen Partnerpaar."
"phosphate-buffer.registers.lv2" = "Die Zugabe von 1,5 mol Base pro Mol H₃PO₄ wandelt die Hälfte des Dihydrogenphosphats in Hydrogenphosphat um. Dieses 1:1-Paar ist der Puffer des Bluts, des Zellinneren und der meisten biologischen Laborarbeit, arbeitend um pKa₂ herum."
"phosphate-buffer.registers.lv3" = "Berechneter pH-Wert 6,64, gegenüber einem naiven pKa₂ von 7,2. Die Speziation der Engine zeigt warum: H₂PO₄⁻ 5,0 × 10⁻², HPO₄²⁻ 3,4 × 10⁻² und NaHPO₄⁻ 1,7 × 10⁻² — ein Ionenpaar, das ein Drittel der zweifach geladenen Spezies aus dem Spiel nimmt. Ladungsasymmetrische Puffer sind der Ort, an dem die Abkürzung konstanter Aktivität zuerst versagt."
"half-neutralised-vinegar.expect.predict.question" = "Du titrierst Essig und stoppst genau auf halbem Weg. Was verrät dir die pH-Messung?"
"half-neutralised-vinegar.expect.predict.options" = ["Die Hälfte des Anfangs-pH-Werts — etwa 1,4", "Den pKa-Wert der Säure, weil Säure und korrespondierende Base jetzt in gleichen Mengen vorliegen", "Nichts Brauchbares; nur der Endpunkt liefert Information"]
"half-neutralised-vinegar.expect.predict.misconception" = "Den pH-Wert zu halbieren behandelt einen Logarithmus wie eine lineare Größe. Der Halbäquivalenzpunkt ist die informationsreichste Stelle auf der Kurve einer schwachen Säure überhaupt: Bei [HA] = [A⁻] verschwindet der Logarithmus-Term des Verhältnisses, und das Messgerät zeigt direkt den eigenen pKa-Wert der Säure an. So wurden pKa-Werte gemessen, bevor es Computer gab."
"half-neutralised-vinegar.expect.predict.diagnosis.0.reveals" = "Der pH-Wert wird geteilt wie eine Länge: die Hälfte der Säure neutralisiert, die halbe Zahl übrig. Dass jede Einheit einen Faktor zehn bedeutet — sodass eine Halbierung des pH-Werts die Acidität *quadrieren* würde — kommt in diesem Bild nicht vor."
"half-neutralised-vinegar.expect.predict.diagnosis.0.next" = "Führe zuerst `dilution-by-ten` aus: ein voller Faktor zehn bringt genau eine pH-Einheit. Von 2,9 auf 1,4 zu kommen würde bedeuten, dass die Wasserstoffionen-Aktivität um das Dreißigfache steigt, während die Säure gerade verbraucht wird."
"half-neutralised-vinegar.expect.predict.diagnosis.1.reveals" = "Eine Titration wird als ein Wettlauf zum Sprung angesehen: Die Kurve auf dem Weg dorthin ist Dekoration, und nur der Endpunkt liefert eine Zahl, die es wert ist, notiert zu werden."
"half-neutralised-vinegar.expect.predict.diagnosis.1.next" = "Lies das Messgerät genau hier, auf halbem Weg: Es zeigt den eigenen pKa-Wert der Säure — die Konstante, die verrät, *welche* Säure das ist, eine Zahl, die dir der Endpunkt allein nie liefern kann. Der Endpunkt sagt dir, wie viel; das Plateau sagt dir, was."
"half-neutralised-vinegar.registers.lv1" = "Stoppe auf halbem Weg beim Neutralisieren des Essigs, und die Flüssigkeit liegt bei pH 4,7 — und bleibt hartnäckig in dieser Nähe. Halb fertig ist die hartnäckigste Stelle von allen."
"half-neutralised-vinegar.registers.lv2" = "Bei gleichen Mengen von CH₃COOH und CH₃COO⁻ gilt pH = pKa = 4,76. Das ist ein Puffer bei maximaler Kapazität, und es ist die im Labor übliche Methode, um den pKa-Wert einer unbekannten Säure zu bestimmen."
"half-neutralised-vinegar.registers.lv3" = "Die Engine berichtet 4,66, etwa ein Zehntel einer Einheit unter dem thermodynamischen pKa. Bei I = 0,049 mol/kgw beträgt der Aktivitätskoeffizient des Acetat-Ions 0,82, während der der neutralen Säure 1,00 beträgt; das Verhältnis der Aktivitäten entspricht daher nicht dem Verhältnis der Konzentrationen, und das Messgerät zeigt diese Differenz an."
"weak-acid-endpoint-is-alkaline.expect.predict.question" = "Du neutralisierst Essig mit genau der passenden Menge Natriumhydroxid. Wie hoch ist der pH-Wert am Endpunkt?"
"weak-acid-endpoint-is-alkaline.expect.predict.options" = ["7 — das bedeutet neutral", "Etwa 8,8 — die Lösung ist alkalisch", "Etwa 5 — etwas Säure bleibt immer übrig"]
"weak-acid-endpoint-is-alkaline.expect.predict.misconception" = "\"Neutralisiert bedeutet pH 7\" stimmt nur, wenn beide Partner stark sind. Hier ist die Säure schwach, sodass ihre konjugierte Base stark genug ist, um mitzuspielen: Acetat nimmt Protonen vom Wasser zurück und lässt Hydroxid übrig. Genau deshalb ist Phenolphthalein (Farbumschlag ≈ 8,2–10) der richtige Indikator für diese Titration und Methylorange der falsche — eine Wahl, die willkürlich wirkt, bis man weiß, dass der Endpunkt nicht bei 7 liegt."
"weak-acid-endpoint-is-alkaline.expect.predict.diagnosis.0.reveals" = "'Neutralisiert' und 'neutral' sind dasselbe Wort, also müssen sie denselben Zustand bedeuten — eine Regel, die dort gelernt wurde, wo sie stimmt (`neutralisation`, stark gegen stark), und dorthin übertragen, wo sie es nicht tut."
"weak-acid-endpoint-is-alkaline.expect.predict.diagnosis.0.next" = "Führe beide Titrationen nebeneinander aus: HCl gegen NaOH landet tatsächlich bei 7,00 (`neutralisation`); diese hier landet bei 8,8. Gleiches Verfahren, gleiche 'genau passende' Mengen — der Unterschied kam mit der konjugierten Base ins Spiel."
"weak-acid-endpoint-is-alkaline.expect.predict.diagnosis.1.reveals" = "Reaktionen werden in diesem Bild nie ganz fertig, also muss etwas Säure übrig bleiben und die Lösung sauer halten — Gleichgewicht als universelle Unvollständigkeit, der falschen Spezies angeheftet."
"weak-acid-endpoint-is-alkaline.expect.predict.diagnosis.1.next" = "Frag nach der Speziation am Endpunkt (lv3): Der übrig gebliebene Akteur ist Acetat, nicht Essigsäure, und es treibt den pH-Wert *nach oben*, indem es dem Wasser Protonen entzieht. Der Rest, den dieser Lernende erwartet, existiert tatsächlich — aber es ist Hydroxid."
"weak-acid-endpoint-is-alkaline.registers.lv1" = "Die Säure ist genau aufgebraucht — und die Flüssigkeit ist nicht neutral. Sie ist stattdessen seifig-alkalisch. Das, was übrig bleibt, ist nicht harmlos."
"weak-acid-endpoint-is-alkaline.registers.lv2" = "Das Produkt ist 0,1 mol/L Natriumacetat. Acetat ist die konjugierte Base einer schwachen Säure und hydrolysiert daher: CH₃COO⁻ + H₂O ⇌ CH₃COOH + OH⁻, was am Äquivalenzpunkt pH ≈ 8,8 ergibt."
"weak-acid-endpoint-is-alkaline.registers.lv3" = "Berechnet 8,76. Die Speziation zeigt den Mechanismus direkt: OH⁻ und undissoziiertes H(Acetat) liegen beide bei 7,5 × 10⁻⁶ mol/kgw, durch die Hydrolyse in genau gleicher Menge erzeugt, gegenüber 9,7 × 10⁻² freiem Acetat. Äquivalenzpunkt und Neutralpunkt sind unterschiedliche Konzepte, die nur bei stark/stark-Paaren zufällig zusammenfallen."
"buffer-capacity-exceeded.summary" = "CH₃COOH/CH₃COO⁻ + überschüssige HCl → Puffer zerstört"
"buffer-capacity-exceeded.expect.predict.question" = "Ein Puffer hält pH 4,6, wenn du 0,01 mol starke Säure zugibst. Jetzt gibst du 0,15 mol auf einmal zu — mehr als die Reserve des Puffers. Was passiert?"
"buffer-capacity-exceeded.expect.predict.options" = ["Er hält bei etwa 4,6; genau das tut ein Puffer", "Er rutscht ein wenig, auf etwa 3,5", "Er bricht auf etwa 1,4 ein — sobald die Reserve aufgebraucht ist, ist der Puffer nur noch Salzwasser"]
"buffer-capacity-exceeded.expect.predict.misconception" = "Puffern wird als Eigenschaft der Flüssigkeit behandelt statt als Vorrat, der aufgebraucht werden kann. Die Reserve hier beträgt 0,1 mol Acetat; 0,15 mol Protonen verbrauchen sie vollständig, und 0,05 mol bleiben als freie starke Säure übrig. Ein Puffer widersteht der pH-Änderung nicht einfach — er *bezahlt* für diesen Widerstand, aus einem endlichen Konto."
"buffer-capacity-exceeded.expect.predict.diagnosis.0.reveals" = "Puffern wird als Identität angesehen, nicht als Budget: Diese Flüssigkeit ist 'ein Puffer', so wie Stahl hart ist, also hält sie, was auch immer man hineingießt."
"buffer-capacity-exceeded.expect.predict.diagnosis.0.next" = "Teile den Angriff auf: Gib 0,05 mol zu, dann weitere 0,05, dann die letzten 0,05, und miss jeweils dazwischen. Das Messgerät bewegt sich kaum, dann etwas mehr, und stürzt dann mitten in der Zugabe ab — eine Identität kann nicht mittendrin ausgehen, ein Konto aber schon."
"buffer-capacity-exceeded.expect.predict.diagnosis.1.reveals" = "Das Konto wird zwar anerkannt, aber die Überziehung nicht: Das Puffern verschlechtert sich proportional zur Belastung, also sollte ein weiteres halbes Mal über der Reserve etwa eine halbe Einheit kosten."
"buffer-capacity-exceeded.expect.predict.diagnosis.1.next" = "Mach die Subtraktion, die das Becherglas macht: 0,15 mol hinein, 0,1 mol Acetat zum Bezahlen, 0,05 mol bleiben als freie starke Säure im Liter übrig. Sobald das Konto bei null steht, ist nichts zwischen 4,6 und dem eigenen pH-Wert dieser Säure stabil — es gibt keine Spezies mehr, die den mittleren Bereich hält."
"buffer-capacity-exceeded.registers.lv1" = "Die widerspenstige Flüssigkeit hört auf, widerspenstig zu sein. Drückst du stark genug, gibt sie auf einmal nach — wie eine Einkaufstüte, die hält und hält und dann reißt."
"buffer-capacity-exceeded.registers.lv2" = "Der Puffer enthält eine Reserve von 0,1 mol Acetat. 0,15 mol HCl wandeln sie vollständig in Essigsäure um und lassen 0,05 mol starke Säure frei im Liter übrig, was pH ≈ 1,4 ergibt."
"buffer-capacity-exceeded.registers.lv3" = "Berechnet 1,42. Der Bestand der Engine enthält jetzt insgesamt 0,2 mol Acetat und 0,15 mol Chlorid gegenüber nur 0,1 mol Natrium; die Ladungsbilanz kann nirgendwo anders hin als zu freiem H⁺. Die Pufferkapazität β = 2,303·C·(Bruchverhältnis) ist konstruktionsbedingt endlich, und dieser Durchlauf steht jenseits davon."
"dilution-by-ten.summary" = "c₁V₁ = c₂V₂:  0.01 mol/L × 0.1 L → 0.001 mol/L × 1 L"
"dilution-by-ten.expect.predict.question" = "Eine Säure mit pH 2 wird mit dem neunfachen ihres eigenen Volumens an Wasser verdünnt. Wie hoch ist der neue pH-Wert?"
"dilution-by-ten.expect.predict.options" = ["4", "1", "3"]
"dilution-by-ten.expect.predict.misconception" = "Die Antwort 4 entsteht aus dem Gedanken, \"zehnmal schwächer\" bedeute \"den pH-Wert mit zehn multiplizieren\" oder \"zehn dazuzählen\"; die Antwort 1 verwechselt Verdünnung mit Konzentration. Da der pH-Wert −log₁₀ der Wasserstoffionen-Aktivität ist, addiert eine Verdünnung der Konzentration um den Faktor zehn genau eine Einheit zum pH-Wert. Das 99-fache Volumen würde zwei Einheiten addieren."
"dilution-by-ten.expect.predict.diagnosis.0.reveals" = "Die Basis der Skala fehlt: Ein Faktor zehn wird sich als zwei oder mehr Einheiten wert vorgestellt, als würde der pH-Wert 'Grade der Schwäche' zählen statt Zehnerpotenzen."
"dilution-by-ten.expect.predict.diagnosis.0.next" = "Mach im Labor weiter: eine weitere Verzehnfachung des Wassers ergibt 4, eine weitere ergibt 5 — jedes Mal eine Einheit pro Faktor zehn. Von 2 auf 4 zu kommen kostet das Hundertfache, und das Messgerät zeigt jeden einzelnen Schritt davon."
"dilution-by-ten.expect.predict.diagnosis.1.reveals" = "In diesem Bild läuft die Skala rückwärts: schwächere Säure, niedrigere Zahl. Nicht die Rechnung, sondern die Richtung hat sich noch nicht gesetzt."
"dilution-by-ten.expect.predict.diagnosis.1.next" = "Miss die beiden Bechergläser nebeneinander und verdünne dann weiter: Die Messwerte wandern in Richtung 7 und nie darüber hinaus. Würde niedriger schwächer bedeuten, müsste reines Wasser die niedrigste Zahl von allen anzeigen."
"dilution-by-ten.registers.lv1" = "Nimm etwas Säure und gieße neun Gläser Wasser dazu. Es ist immer noch Säure — nur schwächer. Es wurde nichts entfernt; sie wurde nur dünner verteilt."
"dilution-by-ten.registers.lv2" = "Die Stoffmenge an HCl ändert sich nie: 0,001 mol, zunächst in 0,1 L (0,01 mol/L, pH 2) und dann in 1 L (0,001 mol/L, pH 3). c₁V₁ = c₂V₂, und jeder Faktor zehn in der Konzentration entspricht einer pH-Einheit."
"dilution-by-ten.registers.lv3" = "Berechnet 2,04 → 3,01. Die leichte Abweichung von den runden Zahlen ist der Aktivitätskoeffizient: 0,90 bei I = 0,01, 0,965 bei I = 0,001. Verdünnung bewegt das Ergebnis in Richtung der idealen Lösung, weshalb der stärker verdünnte Wert näher am Lehrbuchwert liegt als der andere."
"washing-soda-is-alkaline.expect.predict.question" = "Waschsoda ist ein Salz, hergestellt aus einem Metall und einem Säurerest. Welchen pH-Wert hat ihre Lösung?"
"washing-soda-is-alkaline.expect.predict.options" = ["7 — Salze sind neutral, das bedeutet ja \"neutrales Salz\"", "Etwa 11 — stark alkalisch", "Etwa 3 — es ist eine Soda, und Soda ist sauer"]
"washing-soda-is-alkaline.expect.predict.misconception" = "\"Salzlösungen sind neutral\" ist eine Regel, die von Natriumchlorid gelernt und dann übermäßig angewendet wird. Sie gilt nur, wenn beide Stammionen dem Wasser gegenüber gleichgültig sind. Carbonat ist die konjugierte Base einer sehr schwachen Säure und entzieht daher dem Wasser Protonen, wobei Hydroxid übrig bleibt — genau deshalb löst Waschsoda Fett, und genau deshalb verätzt sie die Haut."
"washing-soda-is-alkaline.expect.predict.diagnosis.0.reveals" = "'Salz' trägt in diesem Bild die pH-Information in sich: Die Kategorie beantwortet die Frage, also zeigt jedes Salz 7 an, so wie Natriumchlorid."
"washing-soda-is-alkaline.expect.predict.diagnosis.0.next" = "Führe das Spiegelpaar durch: Dieses Becherglas zeigt 11 und `copper-sulfate-is-blue-and-acidic` zeigt 3,9. Zwei Salze, zwei entgegengesetzte Richtungen — das Wort 'Salz' kann also nicht das Entscheidende sein. Die Stammionen entscheiden, jeweils für sich."
"washing-soda-is-alkaline.expect.predict.diagnosis.1.reveals" = "Der Name betreibt hier die Chemie: 'Soda' wird mit Brausegetränken assoziiert, und Brausegetränke sind sauer, also müsste Soda sauer sein."
"washing-soda-is-alkaline.expect.predict.diagnosis.1.next" = "Halte das Messgerät hinein: 11. Führe dann `baking-soda-vents-carbon-dioxide` aus — auch die andere Küchen-Soda ist basisch. Die Säure im Brausegetränk war nie die Soda; es waren die Kohlensäure und Phosphorsäure, die daneben gelöst waren."
"washing-soda-is-alkaline.registers.lv1" = "Waschsoda löst sich, und das Wasser wird so alkalisch wie Haushaltsreiniger — weil es genau das ist. Es ist ein Salz, das überhaupt nicht neutral ist."
"washing-soda-is-alkaline.registers.lv2" = "Na₂CO₃ löst sich zu 2 Na⁺ und CO₃²⁻. Carbonat hydrolysiert (CO₃²⁻ + H₂O ⇌ HCO₃⁻ + OH⁻, Kb ≈ 2 × 10⁻⁴), sodass eine 0,05-mol/L-Lösung pH ≈ 11,2 erreicht."
"washing-soda-is-alkaline.registers.lv3" = "Berechnet 11,19. Die Speziation ist kein einfaches Bild aus zwei Spezies: CO₃²⁻ 3,1 × 10⁻², NaCO₃⁻ 1,7 × 10⁻² — ein Drittel des Carbonats ist in einem Natrium-Ionenpaar gebunden —, mit OH⁻ und HCO₃⁻ jeweils bei 2 × 10⁻³, stöchiometrisch durch die Hydrolyse erzeugt."
"baking-soda-vents-carbon-dioxide.expect.predict.question" = "Natron wird in Wasser eingerührt. Es wird keine Säure zugegeben. Was passiert?"
"baking-soda-vents-carbon-dioxide.expect.predict.options" = ["Nichts außer Auflösen; du brauchst eine Säure, um überhaupt Gas zu bekommen", "Es löst sich und gibt trotzdem langsam Kohlendioxid ab, am Ende bei etwa pH 9,7", "Es löst sich, und die Lösung landet bei pH 8,3, dem Lehrbuchwert für Hydrogencarbonat"]
"baking-soda-vents-carbon-dioxide.expect.predict.misconception" = "Zwei Vorstellungen werden hier gleichzeitig korrigiert. Erstens ist Gasentwicklung nicht das ausschließliche Vorrecht von Säuren — Hydrogencarbonat disproportioniert von selbst, und ein offenes Becherglas zieht das Produkt ständig ab. Zweitens ist die vertraute Zahl \"Hydrogencarbonat liegt bei pH 8,3\" ein Wert für ein *geschlossenes* System; ein Becherglas im Labor ist offen, es entgast, bis es dem CO₂-Druck der Atmosphäre entspricht, und landet deutlich über 8,3."
"baking-soda-vents-carbon-dioxide.expect.predict.diagnosis.0.reveals" = "Gasentwicklung gilt als das Markenzeichen einer Säure, also kann ohne Säure nichts entweichen — Sprudeln wird als eigener Reaktionstyp verstanden, nicht als irgendein Gleichgewicht mit einem flüchtigen Produkt und einem offenen Gefäß."
"baking-soda-vents-carbon-dioxide.expect.predict.diagnosis.0.next" = "Lass das Becherglas auf der Waage stehen und `wait`: Die Masse sinkt langsam, obwohl nirgends im Gefäß eine Säure ist. Die Säure im Sprudel-Experiment kauft Geschwindigkeit und Heftigkeit, nicht Erlaubnis."
"baking-soda-vents-carbon-dioxide.expect.predict.diagnosis.1.reveals" = "Eine auswendig gelernte Konstante überstimmt den tatsächlichen Aufbau: 8,3 ist die Zahl des Hydrogencarbonats, also ist 8,3 die Antwort, egal was das Becherglas gerade tut."
"baking-soda-vents-carbon-dioxide.expect.predict.diagnosis.1.next" = "Frag, was 8,3 voraussetzt: ein geschlossenes System, das sein CO₂ behält. Dieses Becherglas ist offen und entgast, bis es der Atmosphäre entspricht, und der pH-Wert steigt, während das Gas entweicht. Die berühmte Zahl ist nicht falsch — sie beantwortet einen anderen Aufbau, und dieser Kodex behält sie genau deshalb, um ihr mit einem offenen Gefäß zu widersprechen."
"baking-soda-vents-carbon-dioxide.registers.lv1" = "Natron in reinem Wasser, ohne Essig weit und breit: Lass es eine Weile stehen, und es sprudelt trotzdem, ganz sanft. Die Bläschen entweichen in den Raum und kommen nie zurück."
"baking-soda-vents-carbon-dioxide.registers.lv2" = "0,1 mol NaHCO₃ pro Liter ergeben eine Lösung, die gegenüber dem Kohlendioxid der Luft übersättigt ist. Etwa 30 % des Carbonats entweichen als CO₂, der Rest verschiebt sich in Richtung CO₃²⁻, und der pH-Wert pendelt sich bei etwa 9,7 ein."
"baking-soda-vents-carbon-dioxide.registers.lv3" = "Dies ist der Eintrag, der am stärksten von einem Lehrbuch abweicht, und genau diese Abweichung ist die Lektion. Der klassische pH-Wert 8,3 für NaHCO₃ setzt ein geschlossenes System voraus. Die Engine gleicht das Gefäß gegen atmosphärisches CO₂ bei log p = −3,408 aus, entgast 0,030 mol und berechnet 9,71. Keine der beiden Zahlen ist falsch; sie beantworten unterschiedliche Fragen, und nur eine davon beschreibt ein Becherglas im Labor."
"sodium-acetate-hydrolysis.registers.lv1" = "Das Salz des Essigs löst sich, erwärmt das Glas leicht und hinterlässt Wasser, das seifig statt sauer ist. Das Saure ist zu seinem Gegenteil geworden."
"sodium-acetate-hydrolysis.registers.lv2" = "Natriumacetat ist das Salz einer schwachen Säure und einer starken Base, daher ist seine Lösung alkalisch: 1 mol/L zeigt pH ≈ 9,2. Das Lösen ist exotherm (−17,3 kJ/mol) und erwärmt 100 mL Wasser um etwa 4 °C."
"sodium-acetate-hydrolysis.registers.lv3" = "Berechneter pH-Wert 9,16 bei 29,2 °C und I = 0,77 mol/kgw. Bei dieser Konzentration liegen 23 % des Acetats als neutrales Ionenpaar Na(Acetat) vor statt als freies Acetat — die Hydrolyse läuft also mit weniger Base ab, als das Etikett vermuten lässt, was mit ein Grund ist, warum der pH-Wert unter der Schätzung für eine ideale Lösung liegt."
"copper-sulfate-is-blue-and-acidic.expect.predict.question" = "Kupfersulfat löst sich zu einem wunderschönen Blau. Was zeigt das pH-Meter an?"
"copper-sulfate-is-blue-and-acidic.expect.predict.options" = ["7 — es ist das Salz einer starken Säure und eines Metalls, also neutral", "Etwa 3,9 — die Lösung ist deutlich sauer", "Etwa 9 — Metall-Ionen sind basisch"]
"copper-sulfate-is-blue-and-acidic.expect.predict.misconception" = "Die verlockende Antwort behandelt \"Metall\" als automatisch basisch und \"Salz\" als automatisch neutral. Ein kleines, zweifach geladenes Kation zieht so stark an den daran gebundenen Wassermolekülen, dass es deren Protonen lockert: [Cu(H₂O)₆]²⁺ ⇌ [Cu(H₂O)₅OH]⁺ + H⁺. Kupfer(II)-sulfat-Lösung ist sauer genug, um scharf zu schmecken, und das ist eine allgemeine Eigenschaft kleiner, hoch geladener Kationen, keine Eigenart des Kupfers."
"copper-sulfate-is-blue-and-acidic.expect.predict.diagnosis.0.reveals" = "Zwei Kategorieregeln übereinandergestapelt: Salze sind neutral, und dieses stammt von einer starken Säure und einem Metall, also doppelt neutral — die Ionen selbst wurden nie befragt."
"copper-sulfate-is-blue-and-acidic.expect.predict.diagnosis.0.next" = "Führe den Spiegel durch: `washing-soda-is-alkaline` ist ebenfalls 'ein Salz aus einem Metall und einem Säurerest' und zeigt 11, wo dieses hier 3,9 zeigt. Kategorien, die derselben Regel entgegengesetzte Antworten geben, sind nicht das, was tatsächlich entscheidet."
"copper-sulfate-is-blue-and-acidic.expect.predict.diagnosis.1.reveals" = "'Metall' bedeutet basisch — eine Regel, die für Metalloxide und -hydroxide als Feststoffe stimmt, unverändert auf das gelöste Kation übertragen."
"copper-sulfate-is-blue-and-acidic.expect.predict.diagnosis.1.next" = "Vergleiche Kationen bei lv3: Natrium — groß, einfach geladen — lässt Wasser in Ruhe, während [Cu(H₂O)₆]²⁺ sichtbar die Protonen seines eigenen gebundenen Wassers lockert. Größe und Ladung entscheiden, nicht die Zugehörigkeit zu den Metallen; der linke Rand des Periodensystems ist keine pH-Vorhersage."
"copper-sulfate-is-blue-and-acidic.registers.lv1" = "Weißliche Kristalle kommen hinein, und das Wasser wird tiefblau — ein Blau, von dem man kaum wegschauen kann. Das Glas wird dabei auch leicht warm. Und — überraschend — das Wasser ist sauer geworden."
"copper-sulfate-is-blue-and-acidic.registers.lv2" = "0,05 mol CuSO₄ in 500 mL ergeben eine 0,1-mol/L blaue Lösung. Das Lösen ist exotherm (−73,1 kJ/mol) und erwärmt das Becherglas um etwa 1,8 °C. Kupferhydrolyse und eine Spur basischen Kupfersulfat-Niederschlags lassen die Lösung bei etwa pH 3,9 zurück."
"copper-sulfate-is-blue-and-acidic.registers.lv3" = "Berechneter pH-Wert 3,86. Die Farbe ist kuratiert — d-d-Übergänge sind nichts, was eine thermodynamische Datenbank ehrlich liefern kann —, aber die Acidität ist berechnet. Das erweiterte Festphasenregister lässt nun die Spur basischen Kupfersulfats zu, die das Gleichgewicht begünstigt; bei ihrer Bildung werden zusätzliche Protonen frei. Deshalb liegt der Wert niedriger als im früheren, nur wässrigen Ergebnis."
"descaling-with-acid.expect.predict.question" = "Ein Gramm Kreide liegt in Wasser und löst sich kaum. Du gießt Salzsäure hinzu. Was passiert mit der Kreide?"
"descaling-with-acid.expect.predict.options" = ["Nichts — unlöslich ist unlöslich", "Sie löst sich vollständig unter Sprudeln auf; die Säure zerstört das Carbonat, und das Gas entweicht", "Sie löst sich langsam, aber der Feststoff bleibt; Säure kann keinen Feststoff auflösen"]
"descaling-with-acid.expect.predict.misconception" = "\"Unlöslich\" liest sich wie eine absolute Eigenschaft eines Stoffes, dabei ist es eine Aussage über ein bestimmtes Gleichgewicht. Kreide ist unlöslich *in Wasser*. Säure löst sie nicht auf — Säure entzieht dem Gleichgewicht eines ihrer Ionen, indem sie Carbonat in entweichendes Kohlendioxid umwandelt, und der Feststoff folgt. Le Chatelier, angewendet auf einen Feststoff, ist genau das, wie Entkalker und wie Höhlen funktionieren."
"descaling-with-acid.expect.predict.diagnosis.0.reveals" = "'Unlöslich' gilt als absolute Eigenschaft, so wie aus Stein zu sein: Keine Flüssigkeit kann bewegen, was Wasser nicht bewegen kann."
"descaling-with-acid.expect.predict.diagnosis.0.next" = "Beginne mit `chalk-in-water`: Sogar reines Wasser bewegt 0,24 % davon, das Absolute war also nie absolut. Die Säure entzieht dem Gleichgewicht dann Carbonat als entweichendes Gas, und der Feststoff folgt seinen eigenen Ionen — beobachte, wie das ganze Gramm an diesem Labor sprudelnd verschwindet."
"descaling-with-acid.expect.predict.diagnosis.1.reveals" = "Feststoffe können Ionen abgeben, aber in diesem Bild nie verschwinden — Lösen knabbert nur an einem dauerhaften Bestandteil, also muss der Haufen überleben, was auch immer die Flüssigkeit tut."
"descaling-with-acid.expect.predict.diagnosis.1.next" = "Wiege das Gefäß vorher und nachher (`measure v1 balance`): Die Masse des CO₂ hat das Gefäß durch die offene Öffnung verlassen, und gießt man das Ergebnis durch Filterpapier, bleibt nichts hängen, weil kein Feststoff mehr übrig ist, den man auffangen könnte."
"descaling-with-acid.registers.lv1" = "Die Kreide, die sich in Wasser nicht auflösen wollte, verschwindet innerhalb von Sekunden zischend, sobald die Säure hinzukommt. So funktioniert ein Entkalker, und so werden Höhlen aus Kalkstein herausgeschnitzt."
"descaling-with-acid.registers.lv2" = "CaCO₃ + 2 HCl → CaCl₂ + H₂O + CO₂↑. 0,01 mol Kreide benötigen 0,02 mol Säure; die eingesetzten 0,03 mol lassen 0,01 mol übrig, sodass die fertige Lösung mit pH ≈ 1,4 stark sauer ist."
"descaling-with-acid.registers.lv3" = "Die Engine löst 0,00997 der vorhandenen 0,00999 mol und entgast 0,00999 mol CO₂ — der Sättigungsindex des Calcits wurde durch den Entzug von Carbonat weit ins Negative getrieben, sodass die mengenbegrenzte Phase ausgeht, statt ein Gleichgewicht zu erreichen. Das verbleibende gelöste CO₂ (1,3 × 10⁻⁵ mol/kgw) wird durch das Henry-Gesetz gegenüber dem Raum festgelegt, nicht durch die Reaktion."
"chalk-in-water.expect.predict.question" = "Ein Gramm Kreide wird in 200 mL Wasser eingerührt und stehen gelassen. Wie viel davon löst sich?"
"chalk-in-water.expect.predict.options" = ["Überhaupt nichts — Kreide ist unlöslich", "Etwa ein Viertelprozent davon — eine winzige, aber reale Menge, und sie macht das Wasser alkalisch", "Alles davon, wenn man nur lange genug wartet"]
"chalk-in-water.expect.predict.misconception" = "\"Unlöslich\" wird als null gelehrt und ist nie null. Die Engine löst hier 0,24 % der Kreide — 2,4 × 10⁻⁵ mol —, und diese Spur reicht aus, um den pH-Wert auf fast 10 zu heben, weil Carbonat eine Base ist. Jedes \"unlösliche\" Salz hat ein Löslichkeitsprodukt, und es als null zu behandeln lässt die gesamte qualitative Analyse wie Magie statt wie Rechnung aussehen."
"chalk-in-water.expect.predict.diagnosis.0.reveals" = "'Unlöslich' bedeutet null, eine Kategorie statt einer Größe — das Wasser über der Kreide ist also einfach nur Wasser."
"chalk-in-water.expect.predict.diagnosis.0.next" = "Halte das Messgerät ins 'nur Wasser': Es zeigt fast 10. Null Gelöstes kann ein pH-Meter nicht um drei Einheiten bewegen; die tatsächlich gelösten 2,4 × 10⁻⁵ mol können es, weil Carbonat eine Base ist. Das Messgerät ist das Instrument, das erfasst, was das Auge als nichts abtut."
"chalk-in-water.expect.predict.diagnosis.1.reveals" = "Lösen als Geduldsspiel: Löslichkeit gilt als Geschwindigkeit, also löst sich alles irgendwann, bei genügend Rühren und Zeit. Sättigung — eine Gleichgewichtsobergrenze — kommt in diesem Bild nicht vor."
"chalk-in-water.expect.predict.diagnosis.1.next" = "`wait` so lange du willst: Die gelöste Menge bleibt bei derselben Obergrenze stehen, und der Haufen bleibt liegen. Führe dann `crystallising-salt-from-brine` aus — die Grenze zu verschieben erfordert, das *Wasser* zu ändern, nicht länger zu warten, denn die Obergrenze ist ein Gleichgewicht, keine Warteschlange."
"chalk-in-water.registers.lv1" = "Die Kreide liegt einfach nur da. Es sieht so aus, als wäre nichts passiert — aber taucht man einen pH-Streifen hinein, hat sich das Wasser alkalisch gefärbt. Ein winziges bisschen hat sich tatsächlich gelöst, zu wenig, um es zu sehen."
"chalk-in-water.registers.lv2" = "Calciumcarbonat ist schwer löslich: 2,4 × 10⁻⁵ mol lösen sich in 200 mL, etwa 0,24 % der zugegebenen Menge. Das gelöste Carbonat hydrolysiert, sodass das Wasser pH ≈ 9,9 erreicht."
"chalk-in-water.registers.lv3" = "Berechnet als Sättigungsindex-Problem, nicht aus einer auswendig gelernten Löslichkeit: Die Calcit-Phase ist mengenbegrenzt und löst sich, bis SI = 0. Der pH-Wert von 9,91 ist die Carbonat-Hydrolyse dieser Spur, weshalb Bäche mit hartem Wasser, die über Kalkstein fließen, alkalisch sind, während sie fast klar bleiben."
"silver-chloride-solubility-product.registers.lv1" = "Das weiße Pulver, das entstand, als Silber auf Salz traf, löst sich in Wasser nicht wieder auf. Fast nichts davon — aber eben nicht ganz nichts."
"silver-chloride-solubility-product.registers.lv2" = "1,4 × 10⁻⁵ mol AgCl lösen sich pro Liter. Das ist die Quadratwurzel aus K_sp: [Ag⁺] = [Cl⁻] = √(1,8 × 10⁻¹⁰) ≈ 1,3 × 10⁻⁵ mol/L."
"silver-chloride-solubility-product.registers.lv3" = "Die gemessene Löslichkeit übersteigt √K_sp leicht, weil gelöstes Silber nicht nur als freies Ag⁺ vorliegt: Der neutrale Komplex AgCl(aq) ist ebenfalls vorhanden. Das ist derselbe Effekt, der das restliche Silber im großen Fällungs-Beispiel höher macht, als eine naive Rechnung vorhersagt, und er ist der Keim für die Überraschung des nächsten Eintrags."
"common-ion-effect.expect.predict.question" = "Silberchlorid löst sich leicht in reinem Wasser. Gibst du es stattdessen in 0,01-mol/L-Salzwasser, löst sich mehr oder weniger davon?"
"common-ion-effect.expect.predict.options" = ["Mehr — es ist schon etwas gelöst, also 'löst das Wasser besser'", "Weniger — das bereits vorhandene Chlorid drängt das Gleichgewicht zurück in Richtung Feststoff", "Gleich viel — die Löslichkeit eines Stoffes ist eine feste Zahl"]
"common-ion-effect.expect.predict.misconception" = "Die dritte Option ist der tiefer liegende Fehler: Löslichkeit wird als Eigenschaft allein des Feststoffs behandelt, wie sein Schmelzpunkt. Sie ist eine Eigenschaft des *Systems*. Hier ist das zugegebene Chlorid eines der Produkte, sodass das Lösen nach Le Chatelier zurückgedrängt wird — die Engine findet überhaupt keine messbare Lösung, wo reines Wasser 1,4 × 10⁻⁵ mol gelöst hatte. Deshalb wäscht die gravimetrische Analyse einen Niederschlag mit verdünnter Salzlösung statt mit reinem Wasser."
"common-ion-effect.expect.predict.diagnosis.0.reveals" = "Lösen gilt als Fähigkeit, die das Wasser besitzt, und salziges Wasser ist Wasser, das für seine Aufgabe 'aufgewärmt' ist — was bereits gelöst ist, macht das Lösungsmittel stärker, egal was es ist."
"common-ion-effect.expect.predict.diagnosis.0.next" = "Tausche das Zuschauerion aus: Versuche dasselbe AgCl in 0,01-mol/L-Natrium*nitrat* — genauso viel 'Zeug' gelöst, aber kein gemeinsames Ion, und die Unterdrückung verschwindet. Es ging nie darum, wie beladen das Wasser ist; es geht darum, welches Ion die Beladung mit dem Feststoff teilt."
"common-ion-effect.expect.predict.diagnosis.1.reveals" = "Löslichkeit gilt als eigene Konstante des Feststoffs, wie sein Schmelzpunkt — ein Stoff, eine Zahl, egal was drumherum schwimmt."
"common-ion-effect.expect.predict.diagnosis.1.next" = "Führe die Trilogie durch: Reines Wasser löst 1,4 × 10⁻⁵ mol, dieses Salzwasser löst nichts Messbares, und `chloride-complexes-redissolve-silver` löst das Zehnfache *mehr* als reines Wasser. Ein Feststoff, drei Wässer, drei Antworten — eine Eigenschaft allein des Feststoffs kann das nicht leisten."
"common-ion-effect.registers.lv1" = "Dasselbe weiße Pulver löst sich in Wasser, das bereits ein wenig Salz enthält, sogar noch weniger als vorher — so wenig, dass das Labor überhaupt nichts verzeichnet."
"common-ion-effect.registers.lv2" = "Die Zugabe von 0,01 mol/L Cl⁻ erhöht die Chloridseite von AgCl ⇌ Ag⁺ + Cl⁻, sodass sich das Gleichgewicht nach links verschiebt. Gelöstes Silber fällt etwa um den Faktor, um den Chlorid gestiegen ist, unter die beobachtbare Schwelle der Engine."
"common-ion-effect.registers.lv3" = "Die Unterdrückung wird aus dem Ionenaktivitätsprodukt gegen K_sp berechnet, nicht behauptet. Es lohnt sich, die Grenze schon jetzt zu nennen: Diese monotone Unterdrückung gilt nur, solange das Chlorid niedrig bleibt. Steigert man es auf 1 mol/L, kehrt sich der Trend um — siehe `chloride-complexes-redissolve-silver`."
"chloride-complexes-redissolve-silver.expect.predict.question" = "Der gemeinsame-Ionen-Effekt besagt, dass zusätzliches Chlorid die Löslichkeit von Silberchlorid unterdrückt. Wie viel AgCl löst sich also in 1-mol/L-Salzlösung — hundertmal mehr Chlorid?"
"chloride-complexes-redissolve-silver.expect.predict.options" = ["Hundertmal weniger als in Salzwasser, praktisch nichts", "Etwa zehnmal MEHR als in reinem Wasser", "Genau gleich viel wie in 0,01-mol/L-Salzwasser"]
"chloride-complexes-redissolve-silver.expect.predict.misconception" = "Das ist der Eintrag, in dem eine korrekte Regel dabei ertappt wird, wie sie versagt, und genau darum geht es. Le Chatelier, angewendet auf AgCl ⇌ Ag⁺ + Cl⁻, sagt Unterdrückung voraus, und das stimmt bei niedrigem Chloridgehalt. Aber diese Gleichung ist nicht die gesamte Chemie: Bei hohem Chloridgehalt öffnet sich eine zweite Reaktion, AgCl(s) + Cl⁻ → AgCl₂⁻, und sie verbraucht den Feststoff. Die Engine löst hier 1,5 × 10⁻⁴ mol gegenüber 1,4 × 10⁻⁵ mol in reinem Wasser. Eine Regel ohne ihren Gültigkeitsbereich ist eine Falle, und das ist die Falle."
"chloride-complexes-redissolve-silver.expect.predict.diagnosis.0.reveals" = "Die gerade gelernte Regel, ohne Gültigkeitsbereich extrapoliert: mehr Unterdrücker, mehr Unterdrückung, linear für immer — eine Gleichung, die für die gesamte Chemie gehalten wird."
"chloride-complexes-redissolve-silver.expect.predict.diagnosis.0.next" = "Gehe die Stufenleiter im Labor durch: 0,01, 0,1, dann 1 mol/L Chlorid. Die Löslichkeit fällt, erreicht einen Tiefpunkt und steigt dann über den Wert von reinem Wasser hinaus, sobald AgCl₂⁻ ins Spiel kommt. Eine monotone Regel kann kein U zeichnen — eine zweite Reaktion schon."
"chloride-complexes-redissolve-silver.expect.predict.diagnosis.1.reveals" = "Die letzte Korrektur ist zum neuen Absolutum geworden: einmal unterdrückt, immer unterdrückt. Derselbe Fehler wie 'Löslichkeit ist eine feste Zahl', nur eine Lektion später — eine Regel übernommen, ohne zu fragen, wo sie gilt."
"chloride-complexes-redissolve-silver.expect.predict.diagnosis.1.next" = "Dieser Eintrag und `common-ion-effect` existieren genau für diesen Zweck als Paar: der erste lehrt die Regel, der zweite lehrt ihre Grenze. Die Messung, an der man festhalten sollte, ist die Kehrtwende — und die Gewohnheit, an der man festhalten sollte, ist, bei jeder Regel zu fragen, wo sie aufhört zu gelten."
"chloride-complexes-redissolve-silver.registers.lv1" = "Merkwürdig: Deutlich mehr Salz zuzugeben lässt das widerspenstige weiße Pulver besser lösen, nicht schlechter. Wenig Salz hielt es zurück; viel Salz hilft ihm, sich zu lösen."
"chloride-complexes-redissolve-silver.registers.lv2" = "Oberhalb von etwa 0,1 mol/L Chlorid übernimmt die Komplexbildung vom gemeinsamen-Ionen-Effekt: AgCl(s) + Cl⁻ ⇌ AgCl₂⁻ (und darüber hinaus AgCl₃²⁻). Die Löslichkeit durchläuft ein Minimum und steigt dann wieder an — die klassische U-förmige Löslichkeitskurve."
"chloride-complexes-redissolve-silver.registers.lv3" = "Berechnet: 1,47 × 10⁻⁴ mol lösen sich bei I = 1,00 mol/kgw, etwa das Zehnfache des Werts in reinem Wasser und unmessbar mehr als in 0,01-mol/L-NaCl. Nichts hier ist vorgeskriptet; die Chlorokomplexe stehen in wateq4f.dat, und der Minimierer findet sie. Zwei Modelle — einfaches K_sp und vollständige Speziation — liefern entgegengesetzte Vorhersagen, und das Experiment entscheidet. Zeig einem Lernenden dies, bevor du ihm erzählst, irgendeine Löslichkeitsregel sei ein Gesetz."
"gypsum-carries-water-in-its-crystals.expect.predict.question" = "Gips hat die Formel CaSO₄·2H₂O. Wenn sich 5 g davon lösen, steigt das Flüssigkeitsvolumen im Becherglas um mehr als das Volumen der Kristalle selbst. Warum?"
"gypsum-carries-water-in-its-crystals.expect.predict.options" = ["Die Kristalle hielten Wasser in sich, und dieses geht beim Lösen in die Lösung über", "Lösen erzeugt immer Flüssigkeit, das würde jeder Feststoff tun", "Das ist ein Rundungsfehler in der Simulation"]
"gypsum-carries-water-in-its-crystals.expect.predict.misconception" = "Kristallwasser liest sich wie Dekoration in der Formel — ein Punkt und ein paar Wassermoleküle, die sicher nicht zählen. Sie zählen: 172 g Gips sind 36 g Wasser, 21 % der Masse. Dieses Wasser sitzt in festem Verhältnis im Kristallgitter und wird beim Lösen freigesetzt. Gips für Verbände ist genau dieses Wasser, das ausgetrieben und dann wieder hineingelassen wird — deshalb erhärtet Gips."
"gypsum-carries-water-in-its-crystals.expect.predict.diagnosis.0.reveals" = "Lösen als Verflüssigung: Feststoffe 'werden flüssig', wenn sie sich lösen, also müsste jeder sich lösende Feststoff den Pegel heben — das spezifische Wasser in diesem Kristall spielt keine Rolle."
"gypsum-carries-water-in-its-crystals.expect.predict.diagnosis.0.next" = "Mach die Rechnung, die die Formel nahelegt: 21 % dieser 5 g sind etwa ein Gramm echtes Wasser, und der Pegelanstieg entspricht diesem Gramm — nicht den 5 g. Ein Feststoff ohne Kristallwasser hat kein solches Gramm zu geben."
"gypsum-carries-water-in-its-crystals.expect.predict.diagnosis.1.reveals" = "Wenn die Simulation überrascht, ist die Simulation falsch — die Zahl wird als Rauschen abgetan statt als überprüfbare Behauptung behandelt."
"gypsum-carries-water-in-its-crystals.expect.predict.diagnosis.1.next" = "Bemiss die Behauptung, bevor du sie verwirfst: Ein Gramm Wasser liegt viele Größenordnungen über jeder Rundungsschwelle, und `explain` zeigt, dass die Bilanz genau dann aufgeht, wenn das 2 H₂O des Kristalls als Wasser gezählt wird. Die Gewohnheit, die dieser Eintrag belohnt, ist eine überraschende Zahl zu prüfen, nicht sie wegzustimmen."
"gypsum-carries-water-in-its-crystals.registers.lv1" = "Gips ist das Pulver, aus dem Gipsverbände gemacht werden. Er hat Wasser im Inneren der Kristalle versteckt — echtes Wasser, eingeschlossen im Muster — und wenn sich die Kristalle lösen, wird dieses Wasser freigesetzt."
"gypsum-carries-water-in-its-crystals.registers.lv2" = "5 g Gips sind 0,029 mol; nur 0,0156 mol lösen sich, bevor die Lösung gesättigt ist, sodass etwa 46 % fest bleiben. Jedes Mol, das sich löst, setzt 2 mol Kristallwasser ins Lösungsmittel frei, sodass der flüssige Bestand des Gefäßes messbar wächst."
"gypsum-carries-water-in-its-crystals.registers.lv3" = "Die Kristallwasser sind nicht kuratiert: Die Engine leitet sie ab, indem sie die Formel des Registry-Feststoffs mit der Datenbankphase CaSO₄:2H₂O abgleicht und pro umgesetztem Mol 2 mol H₂O zwischen Kristall und Lösungsmittel verschiebt. Berechneter pH-Wert 7,07 bei I = 0,042 mol/kgw, wobei ein Drittel des gelösten Calciums als neutrales Ionenpaar CaSO₄(aq) vorliegt — weshalb die scheinbare Löslichkeit von Gips über einer Schätzung mit freien Ionen und K_sp liegt."
"heating-dissolves-more-salt.expect.predict.question" = "Ein Liter Wasser ist mit Salz gesättigt — ein Haufen ungelöster Kristalle liegt am Boden. Du erwärmst ihn von 19 °C auf 43 °C. Was passiert mit dem Haufen?"
"heating-dissolves-more-salt.expect.predict.options" = ["Er verschwindet vollständig; heißes Wasser löst von allem weit mehr", "Er schrumpft leicht — etwa 0,1 mol mehr löst sich", "Er wächst; Erwärmen treibt Feststoffe aus der Lösung"]
"heating-dissolves-more-salt.expect.predict.misconception" = "Zucker und Kaliumnitrat lehren, dass Erwärmen dramatisch mehr löst, und diese Lektion wird verallgemeinert. Salz ist das Gegenbeispiel, das jede Küche enthält: Seine Löslichkeit steigt von kaltem Wasser bis zum Sieden nur um wenige Prozent. Ob Wärme hilft, hängt vom Vorzeichen der Lösungsenthalpie ab, und bei NaCl ist diese Enthalpie fast null (+3,9 kJ/mol) — die Temperatur hat also fast nichts, worauf sie einwirken könnte."
"heating-dissolves-more-salt.expect.predict.diagnosis.0.reveals" = "'Heißes Wasser löst mehr' als universeller Hebel: Wärme wird sich als Wirkung auf das Lösen an sich vorgestellt, statt über die eigene Lösungsenthalpie jedes Stoffes."
"heating-dissolves-more-salt.expect.predict.diagnosis.0.next" = "Miss den Haufen an diesem Labor bei beiden Temperaturen: 24 Grad bringen etwa 0,1 mol gegenüber einer Obergrenze von sechs. Frag dann, worauf die Wärme überhaupt einwirken kann — bei NaCl beträgt die Lösungsenthalpie +3,9 kJ/mol, fast nichts, und der Hebel bewegt fast nichts."
"heating-dissolves-more-salt.expect.predict.diagnosis.1.reveals" = "Die Regel aus der Welt der Gase, verpflanzt: warme Limonade wird schal, also treibt Wärme Gelöstes hinaus — Feststoffe eingeschlossen."
"heating-dissolves-more-salt.expect.predict.diagnosis.1.next" = "Die verpflanzte Regel stimmt tatsächlich dort, woher sie kommt: Gase verlassen warmes Wasser wirklich, weil ihr Lösen Wärme freisetzt. Ob Erwärmen hilft oder schadet, folgt in beiden Fällen dem Vorzeichen dieser Enthalpie — bei NaCl ist es knapp positiv, sodass der Haufen leicht schrumpft statt zu wachsen."
"heating-dissolves-more-salt.registers.lv1" = "Das Salzwasser hat bereits Salz am Boden liegen, das sich nicht lösen will. Erwärmst du es, verschwindet nur sehr wenig mehr. Heißes Wasser ist keine Magie."
"heating-dissolves-more-salt.registers.lv2" = "Die Sättigung steigt zwischen 19 °C und 43 °C von etwa 6,11 auf 6,21 mol/kgw — etwa 1,7 %. Vergleiche Kaliumnitrat, das sich im gleichen Bereich mehr als verdoppelt: Der Unterschied ist die Lösungsenthalpie, und die von NaCl ist fast null."
"heating-dissolves-more-salt.registers.lv3" = "Sowohl die Temperatur als auch die neue Sättigung sind berechnet, nicht tabelliert: Die 100 kJ werden über die Wärmekapazität des Gefäßes verteilt und ergeben 43,05 °C, und die Halit-Phase wird bei dieser Temperatur neu ins Gleichgewicht gebracht, wobei weitere 0,1025 mol gelöst werden. Beachte, dass die Temperatur beim anfänglichen Lösen auch um 5,6 °C gefallen ist — dieser Durchlauf ist gleichzeitig eine Kühlpackung und ein Löslichkeitsexperiment."
"any-chloride-precipitates-silver.expect.predict.question" = "Der Silbertest verwendete Natriumchlorid. Diesmal ist es Kaliumchlorid. Was passiert?"
"any-chloride-precipitates-silver.expect.predict.options" = ["Nichts — die Reaktion fand speziell zwischen Silbernitrat und Natriumchlorid statt", "Derselbe weiße Niederschlag, in derselben Menge", "Ein anderer Niederschlag — Kaliumchlorid ist eine andere Verbindung"]
"any-chloride-precipitates-silver.expect.predict.misconception" = "Reaktionen werden als Verbindung-plus-Verbindung auswendig gelernt, sodass das Austauschen des Kations wie eine andere Reaktion wirkt. In Lösung gibt es keine Verbindungen — es gibt Ionen. Das Einzige, was passiert, ist Ag⁺ + Cl⁻ → AgCl↓; Kalium und Nitrat nehmen nie teil und könnten erneut ausgetauscht werden, ohne dass sich etwas ändert. Das ist es, was eine Netto-Ionengleichung *bedeutet*, und deshalb weist der Silbertest Chlorid nach, nicht Natriumchlorid."
"any-chloride-precipitates-silver.expect.predict.diagnosis.0.reveals" = "Die Reaktion ist ein auswendig gelernter Satz — 'Silbernitrat plus Natriumchlorid' —, sodass das Ändern irgendeines Worts den Zauber bricht und das neue Paar keinen Satz hat."
"any-chloride-precipitates-silver.expect.predict.diagnosis.0.next" = "Führe beide an diesem Labor aus und schau dir `particles` an: derselbe Niederschlag in derselben Menge, mit Kalium genau dort schwebend, wo Natrium schwebte, Symbol für Symbol. Der Satz, der den Austausch übersteht, ist der Netto-Ionensatz, und der erwähnte nie Natrium."
"any-chloride-precipitates-silver.expect.predict.diagnosis.1.reveals" = "Der Feststoff erbt seine Identität von den Reagenzflaschen: unterschiedliche Ausgangsverbindung, unterschiedlicher Niederschlag — das Produkt als Mischung seiner Ausgangsstoffe statt als neue Paarung von Ionen."
"any-chloride-precipitates-silver.expect.predict.diagnosis.1.next" = "Filtriere beide Experimente und stelle die Feststoffe nebeneinander: gleiche Farbe, gleiche Masse pro Mol Chlorid, gleiches Verhalten im Licht. Nichts vom Kalium ist im Trichter, denn die einzigen Ionen, die sich getroffen haben, sind Ag⁺ und Cl⁻ — das Kation bleibt beide Male im Kolben."
"any-chloride-precipitates-silver.registers.lv1" = "Anderes Salz, gleiches Ergebnis: Das Wasser wird milchig weiß in dem Moment, in dem die beiden gemischt werden. Der wichtige Teil war nie die ganze Zutat — es war ein Teil davon."
"any-chloride-precipitates-silver.registers.lv2" = "Ag⁺ + Cl⁻ → AgCl↓. K⁺ und NO₃⁻ sind Zuschauerionen und bleiben gelöst. 0,01 mol jedes Reaktanten ergeben 0,01 mol Niederschlag, genau wie bei Natriumchlorid."
"any-chloride-precipitates-silver.registers.lv3" = "Die Engine sieht 'Kaliumchlorid' nie als Reaktanten — sie verbucht den Feststoff als Elementsummen und lässt den Minimierer die stabile Zusammensetzung finden, das ist Chlorargyrit plus eine K-NO₃-Lösung. Das restliche gelöste Silber beträgt 2,2 × 10⁻⁶ mol/kgw als Ag⁺ plus 3,3 × 10⁻⁷ als AgCl(aq): Der Test ist empfindlich, nicht absolut."
"acetates-stay-dissolved.summary" = "Ca²⁺ + 2 CH₃COO⁻ → kein Niederschlag (alle Acetate sind löslich)"
"acetates-stay-dissolved.expect.predict.question" = "Zwei klare Salzlösungen werden zusammengegossen — Calciumchlorid und Natriumacetat. Was siehst du?"
"acetates-stay-dissolved.expect.predict.options" = ["Ein weißer Niederschlag; das Mischen zweier Salzlösungen ergibt einen neuen Feststoff", "Nichts Sichtbares — sie bleibt klar, weil jedes mögliche Produkt löslich ist", "Sprudeln, weil Acetat von einer Säure stammt"]
"acetates-stay-dissolved.expect.predict.misconception" = "Nach ein paar Fällungsvorführungen wird 'zwei Salzlösungen mischen und etwas fällt aus' zur erwarteten Regel. Die meisten Mischungen tun überhaupt nichts. Ein Niederschlag erscheint nur, wenn zufällig eine Kation-Anion-Paarung unlöslich ist; hier sind Calciumacetat und Natriumchlorid beide frei löslich, sodass alle vier Ionen einfach weiterbestehen. Zu lernen, wann nichts passiert, ist das, was die Löslichkeitsregeln vorhersagend statt dekorativ macht."
"acetates-stay-dissolved.expect.predict.diagnosis.0.reveals" = "Die Vorführung wurde zur Regel: Klare Salzlösungen zu mischen ist das, was man tut, um einen Feststoff herzustellen, also muss ein Feststoff entstehen — die Beispiele der Lektion waren alle Treffer, und die Fehlschläge wurden nie gezeigt."
"acetates-stay-dissolved.expect.predict.diagnosis.0.next" = "Sage voraus, bevor du gießt, anhand der Tabelle: Die beiden neuen Paarungen sind Calciumacetat und Natriumchlorid, beide frei löslich, also lautet die Vorhersage 'nichts'. Führe es aus und `inspect`: Alle vier Ionen sind noch im Bestand. Eine Regel verdient sich den Namen vorhersagend an den Fehlschlägen, nicht an den Treffern."
"acetates-stay-dissolved.expect.predict.diagnosis.1.reveals" = "Herkunft mit Verhalten verwechselt: Acetat 'stammt von einer Säure', also müsste es sich wie eine verhalten — und Sprudeln ist das Markenzeichen der Säure."
"acetates-stay-dissolved.expect.predict.diagnosis.1.next" = "Frag, was Sprudeln physikalisch voraussetzt: ein flüchtiges Produkt. Liste jede Paarung auf, die diese vier Ionen bilden können — keine ist ein Gas. Das Ion, das *von* einer Säure stammt, ist die konjugierte Base dieser Säure, weshalb die Mischung, wenn überhaupt, in die andere Richtung tendiert."
"acetates-stay-dissolved.registers.lv1" = "Zwei klare Flüssigkeiten, zusammengegossen — und es bleibt klar. Manchmal bewirkt das Mischen von Chemikalien nichts Sichtbares. Auch das ist eine Antwort."
"acetates-stay-dissolved.registers.lv2" = "Calciumacetat und Natriumchlorid sind beide löslich, sodass keine doppelte Umsetzung stattfindet. Die vier Ionen (Ca²⁺, Cl⁻, Na⁺, CH₃COO⁻) bestehen nebeneinander. Der pH-Wert von 8,6 stammt aus der Hydrolyse des Acetats, nicht aus irgendeiner Reaktion zwischen den beiden Salzen."
"acetates-stay-dissolved.registers.lv3" = "Das Fehlen eines Niederschlags ist berechnet, nicht angenommen: Dem Minimierer wird jede Kandidatenphase angeboten, deren Formel zu einem Registry-Feststoff passt, und er findet keine übersättigt. Eine `absent`-Behauptung wird von lint genauso geprüft wie eine positive — das verhindert, dass dieser Eintrag stillschweigend falsch wird, sollte die Phasenmenge wachsen."
"softening-with-washing-soda.expect.predict.question" = "Hartes Wasser ist Wasser, das gelöstes Calcium mit sich trägt. Waschsoda wird zugegeben, um es zu enthärten. Wohin geht das Calcium?"
"softening-with-washing-soda.expect.predict.options" = ["Es wird von der Soda zerstört", "Es fällt als feste Kreide aus dem Wasser aus, die abfiltriert werden kann oder in der Maschine zurückbleibt", "Es bleibt gelöst, wird aber irgendwie 'deaktiviert'"]
"softening-with-washing-soda.expect.predict.misconception" = "Enthärten klingt danach, eine Eigenschaft zu entfernen, sodass Lernende sich vorstellen, das Calcium werde an Ort und Stelle neutralisiert. Nichts wird zerstört und nichts wird deaktiviert: Das Calcium wird von der Lösung in einen Feststoff verschoben. Hier sind es 99,8 % davon. Dieser Feststoff ist der graue Schlamm in der Waschmaschine — Enthärten tauscht gelöste Härte gegen einen Niederschlag, den man abtrennen kann."
"softening-with-washing-soda.expect.predict.diagnosis.0.reveals" = "Materie verschwindet bei Behandlung: Die Soda 'zerstört' das Calcium so, wie Säure und Base einander 'zerstörten' — die Erhaltung der Materie wird immer dann außer Kraft gesetzt, wenn ein Problem gelöst wird."
"softening-with-washing-soda.expect.predict.diagnosis.0.next" = "Filtriere und wiege (`filtering-a-precipitate` ist der richtige Schritt): Das Calcium liegt zu 99,8 % als Kreide im Trichter, und die Bilanz stimmt bis aufs Milligramm. Zerstörung würde den Trichter leer und die Bücher unausgeglichen lassen."
"softening-with-washing-soda.expect.predict.diagnosis.1.reveals" = "Chemie per Ausschalter: Das Calcium bleibt, wo es war, aber seine Härte-Eigenschaft wird weggeschaltet — Eigenschaften als Schalter an einem Stoff statt als Folge davon, wo er sich befindet."
"softening-with-washing-soda.expect.predict.diagnosis.1.next" = "`inspect` die Lösung nach dem Enthärten: Das gelöste Calcium ist tatsächlich aus dem Bestand verschwunden, und im selben Schritt erschien ein Feststoff, Mol für Mol. Eine Deaktivierung an Ort und Stelle würde es weiterhin gelöst zeigen — das Labor hat nirgendwo einen Schalter zu verstecken."
"softening-with-washing-soda.registers.lv1" = "Hartes Wasser schäumt nicht. Rühre Waschsoda ein, und das Wasser wird trüb — die Härte hat sich in ein weißes Pulver verwandelt, das du herausfiltern kannst, und jetzt funktioniert die Seife."
"softening-with-washing-soda.registers.lv2" = "Na₂CO₃ + CaCl₂ → CaCO₃↓ + 2 NaCl. Je 0,05 mol entfernen 0,0495 mol Calcium als festes Carbonat und lassen 0,0001 mol gelöst zurück — eine Entfernung von 99,8 %, wobei Natriumchlorid in Lösung zurückbleibt."
"softening-with-washing-soda.registers.lv3" = "Berechnet als Sättigungsproblem: Calcit fällt aus, bis SI = 0, und der Rest wird durch K_sp und das verbleibende Carbonat festgelegt, was [Ca²⁺] = 1,0 × 10⁻⁴ mol/kgw bei pH 10,13 ergibt. Genau dieser Tausch von Härte gegen Natrium ist der Grund, warum enthärtetes Wasser bei natriumarmer Ernährung nicht zum Trinken empfohlen wird."
"permanent-hardness-makes-gypsum.registers.lv1" = "Zwei klare Flüssigkeiten treffen aufeinander, und ein weißer Feststoff wächst heran — und dieser hier ist Gips. Derselbe Stoff, in dem ein gebrochener Arm eingegipst wird, hergestellt in einem Becherglas aus zwei Dingen, die wie Wasser aussahen."
"permanent-hardness-makes-gypsum.registers.lv2" = "Calcium aus dem Chlorid trifft auf Sulfat aus dem Bittersalz und fällt als Gips aus, CaSO₄·2H₂O. 0,064 der 0,1 mol Calcium fallen aus; das Magnesium bleibt gelöst, weil Magnesiumsulfat löslich ist."
"permanent-hardness-makes-gypsum.registers.lv3" = "Temporäre Härte (Hydrogencarbonat) wird durch Kochen entfernt; permanente Härte (Sulfat) nicht — und dieser Eintrag zeigt, warum die Unterscheidung davon abhängt, welches Anion vorliegt, nicht davon, wie hart das Wasser ist. Die Engine bucht außerdem 2 mol Wasser pro Mol Gips aus dem Lösungsmittel ab, sodass das freie Wasser im Gefäß messbar sinkt: von 55,34 mol auf 55,21 mol."
"filtering-a-precipitate.summary" = "AgCl(s) bleibt auf dem Papier zurück;  Na⁺, NO₃⁻ passieren"
"filtering-a-precipitate.expect.predict.question" = "Eine trübe Silberchlorid-Mischung wird durch Filterpapier gegossen. Was ist im Trichter, und was ist im Kolben darunter?"
"filtering-a-precipitate.expect.predict.options" = ["Festes Silberchlorid im Trichter; eine klare Lösung aus Natrium- und Nitrat-Ionen im Kolben", "Alles im Kolben — Filterpapier hält nur große Klumpen zurück, und Gelöstes ist klein", "Feststoff im Trichter; reines Wasser im Kolben, da der Filter die Chemikalien entfernt"]
"filtering-a-precipitate.expect.predict.misconception" = "Die dritte Option ist die häufige: Filtration wird sich als Reinigung vorgestellt. Filterpapier trennt nach Phase, nicht nach Sauberkeit — alles Gelöste geht direkt hindurch. Das Filtrat hier ist kein Wasser; es ist eine Natriumnitrat-Lösung, und sie enthält immer noch 8 × 10⁻⁴ mol/kgw gelöstes Silber. Willst du den gelösten Teil zurückgewinnen, musst du eindampfen, nicht filtrieren."
"filtering-a-precipitate.expect.predict.diagnosis.0.reveals" = "Der Niederschlag wird als 'in der Flüssigkeit' eingeordnet, also geht er dorthin, wohin die Flüssigkeit geht — der Unterschied zwischen suspendiertem Feststoff und gelösten Ionen wird nur als Größenunterschied gesehen, und alles Chemische ist klein."
"filtering-a-precipitate.expect.predict.diagnosis.0.next" = "Gieße und `inspect` beide Gefäße: Der AgCl-Anteil ist in keiner der beiden Lösungen — er blieb ein Feststoff, und das Papier hält Phasen zurück, keine Größen. Die Trübung, die nicht durchgeht, ist dieselbe Trübung, die sich absetzt, wenn du einfach wartest."
"filtering-a-precipitate.expect.predict.diagnosis.1.reveals" = "Filtration als Reinigung: Das Papier nimmt 'die Chemikalien' heraus, also ist das, was durchtropft, sauber — Trennung wird sich als Sauberkeit vorgestellt, nicht als Phase."
"filtering-a-precipitate.expect.predict.diagnosis.1.next" = "Dampfe das Filtrat ein (`crystallising-salt-from-brine` ist der richtige Schritt): Kristalle von Natriumnitrat erscheinen aus dem 'reinen Wasser', und die lv3-Anzeige zeigt immer noch 8 × 10⁻⁴ mol/kgw gelöstes Silber, das kein Papier zurückhalten kann. Was Filtration entfernt, ist eine Phase; was Reinheit braucht, ist ein anderer Vorgang."
"filtering-a-precipitate.registers.lv1" = "Gieße die trübe Mischung durch den Papierkegel. Der weiße Feststoff bleibt im Papier zurück, und was durchtropft, ist völlig klar — aber es ist kein reines Wasser, und es ist nicht sicher zu trinken."
"filtering-a-precipitate.registers.lv2" = "Filtration trennt nach Phase: 0,0099 mol festes AgCl werden zurückgehalten (1,4 g), während die gesamte wässrige Phase — Wasser, Na⁺, NO₃⁻ und die Spur gelöstes Silber — in v2 übergeht. Das Wiegen des getrockneten Rückstands ist die Methode, um eine Fällung zu quantifizieren."
"filtering-a-precipitate.registers.lv3" = "Die Engine bringt beide Gefäße nach der Übertragung neu ins Gleichgewicht, weshalb das Filtrat gesondert charakterisiert wird: pH 7,23, I = 0,10 mol/kgw, mit Ag⁺ bei 8,1 × 10⁻⁴ mol/kgw. Das Rückstandsgefäß enthält nur Feststoff und überhaupt keine Lösung, sodass ein pH-Meter darin nichts anzeigt — das Labor sagt das ehrlich, statt eine Zahl zu erfinden."
"crystallising-salt-from-brine.summary" = "Na⁺ + Cl⁻ → NaCl(s), während Wasser entweicht"
"crystallising-salt-from-brine.expect.predict.question" = "117 g Salz lösen sich vollständig in einem Liter Wasser. Du kochst vier Fünftel des Wassers ab. Was ist in der Schale?"
"crystallising-salt-from-brine.expect.predict.options" = ["Nichts als sehr salziges Wasser; es hat sich einmal gelöst, also bleibt es gelöst", "Alle 117 g wieder als Kristalle, da das Wasser größtenteils weg ist", "Etwa 46 g Kristalle, der Rest bleibt im verbliebenen Wasser gelöst"]
"crystallising-salt-from-brine.expect.predict.misconception" = "Die erste Antwort vergisst, dass Löslichkeit pro Einheit *Lösungsmittel* gilt und keine Einbahnstraße ist: Nimmt man das Wasser weg, hat das Salz keinen Platz mehr zu bleiben. Die zweite schießt übers Ziel hinaus — 200 mL Wasser können immer noch 1,22 mol Salz halten, also kristallisiert nur der Überschuss aus. Herauszufinden, welcher Anteil zurückkommt, ist die gesamte Chemie der Salzgärten, und es ist eine Subtraktion: das, was hineingegeben wurde, minus das, was das verbliebene Wasser noch halten kann."
"crystallising-salt-from-brine.expect.predict.diagnosis.0.reveals" = "Lösen gilt als Einbahnstraße: Sobald ein Feststoff 'flüssig geworden' ist, bleibt er das, egal wie viel von der Flüssigkeit verschwindet — Löslichkeit als Ereignis in der Vergangenheit des Salzes statt als Verhältnis zur Gegenwart des Wassers."
"crystallising-salt-from-brine.expect.predict.diagnosis.0.next" = "Beobachte, wie das Labor den Moment der Rückkehr meldet: Kristalle erscheinen genau dann, wenn die Obergrenze des schrumpfenden Wassers die Beladung unterschreitet, nicht vorher. Das Salz hat sich nie verändert; sein Kontingent pro Gramm Wasser schon."
"crystallising-salt-from-brine.expect.predict.diagnosis.1.reveals" = "Der richtige Mechanismus, übertrieben: weniger Wasser bedeutet Kristalle, also müsste fast kein Wasser alle Kristalle bedeuten — die eigene Tragfähigkeit des verbleibenden Wassers fällt aus der Rechnung heraus."
"crystallising-salt-from-brine.expect.predict.diagnosis.1.next" = "Mach die Salzgarten-Subtraktion: Die verbliebenen 200 mL halten noch 1,22 mol, etwa 71 g. 117 g hinein, 71 g noch schwimmend, 46 g in der Schale — die Antwort ist eine Bilanz, und die Waage des Labors bestätigt sie."
"crystallising-salt-from-brine.registers.lv1" = "Salzwasser, eingekocht. Während das Wasser entweicht, erscheinen weiße Kristalle am Boden — der älteste Trick des Meeres, und so funktioniert jeder Salzgarten der Welt."
"crystallising-salt-from-brine.registers.lv2" = "2,00 mol NaCl lösen sich in 1 L. Werden 80 % des Wassers entfernt, bleiben 200 mL übrig, die bei Sättigung nur 1,22 mol halten können, sodass 0,78 mol (etwa 46 g) auskristallisieren."
"crystallising-salt-from-brine.registers.lv3" = "Die verbleibende Lösung liegt bei I = 6,12 mol/kgw, weit außerhalb des Debye-Hückel-Bereichs — dieses Problem wird an das Pitzer-Ionenwechselwirkungsmodell weitergeleitet, und `explain` zeigt, dass wateq4f und minteq.v4 für dasselbe Becherglas deutlich unterschiedliche Antworten liefern. Beachte auch γ(Na⁺) = 1,65 hier: Ein Aktivitätskoeffizient über eins ist in konzentrierter Sole normal und kein Fehler."
"permanganate-is-visible-when-almost-absent.expect.predict.question" = "Sechzehn Milligramm Kaliumpermanganat — ein winziges Krümelchen — kommen in einen vollen Liter Wasser. Was siehst du?"
"permanganate-is-visible-when-almost-absent.expect.predict.options" = ["Klares Wasser; sechzehn Milligramm auf einen Liter sind viel zu wenig, um es zu sehen", "Wasser, das eindeutig und offensichtlich violett ist", "Ein schwaches Violett, nur wenn du durch die ganze Länge des Becherglases schaust"]
"permanganate-is-visible-when-almost-absent.expect.predict.misconception" = "Menge und Sichtbarkeit werden hier vermengt, sodass 'eine winzige Masse' 'eine schwache Farbe' bedeuten soll. Sichtbarkeit wird durch den molaren Extinktionskoeffizienten bestimmt, und der von Permanganat ist gewaltig — etwa 2400 L mol⁻¹ cm⁻¹. Bei 10⁻⁴ mol/L ist die Lösung unverkennbar violett. Kupfersulfat bei derselben Konzentration wäre unsichtbar. Dieselbe Logik erklärt, warum ein Tropfen Lebensmittelfarbe ein ganzes Badewasser färbt und ein Löffel Zucker nicht."
"permanganate-is-visible-when-almost-absent.expect.predict.diagnosis.0.reveals" = "Sichtbarkeit wird direkt von der Masse abgelesen: Milligramm in einem Liter rundet sich auf nichts, also sollte das Auge nichts sehen — jeder Stoff trägt scheinbar dieselbe, schwache Farbe pro Gramm."
"permanganate-is-visible-when-almost-absent.expect.predict.diagnosis.0.next" = "`look v1`: Das Labor berechnet die Farbe aus dem Absorptionsspektrum, statt sie einfach zu behaupten, und die Antwort lautet unverkennbar violett. Löse dann dieselben wenigen Milligramm Kupfersulfat — unsichtbar. Die Masse war identisch; der molare Extinktionskoeffizient nicht, und das ist die ganze Geschichte."
"permanganate-is-visible-when-almost-absent.expect.predict.diagnosis.1.reveals" = "Farbe wird zugestanden, aber im Maßstab des Krümelchens: Eine winzige Menge kann nur Winziges bewirken, also muss sich der Farbton erst über die gesamte Tiefe des Becherglases aufbauen."
"permanganate-is-visible-when-almost-absent.expect.predict.diagnosis.1.next" = "Der eigene Vergleich dieses Eintrags ist das entscheidende Kriterium: Kupfersulfat bei *derselben Konzentration* zeigt bei keiner Tiefe etwas, während Permanganat schon in einem Zentimeter unverkennbar ist. Würde die Menge die Sichtbarkeit bestimmen, wären sie gleich; ε ≈ 2400 gegenüber wenigen ist das, was sie tatsächlich unterscheidet."
"permanganate-is-visible-when-almost-absent.registers.lv1" = "Ein Krümelchen violettes Pulver, kleiner als ein Reiskorn, färbt einen ganzen Liter Wasser violett. Manche Farben sind erstaunlich stark."
"permanganate-is-visible-when-almost-absent.registers.lv2" = "0,016 g sind 1,0 × 10⁻⁴ mol. In 1 L sind das 10⁻⁴ mol/L, und bei einem molaren Extinktionskoeffizienten nahe 2400 liegt die Extinktion durch ein normales Becherglas bei etwa 0,2 — deutlich sichtbar. Die Lösung bleibt bei pH 7,00 neutral: Weder K⁺ noch MnO₄⁻ reagiert mit Wasser."
"permanganate-is-visible-when-almost-absent.registers.lv3" = "Zwei verschiedene Arten von Behauptung stecken in einem Becherglas, und das Labor hält sie auseinander. Der pH-Wert 7,00 und die Speziation sind berechnet. Die Farbe ist kuratiert — die Registry führt das sRGB von Permanganat und eine Färbestärke von 12.000, weil ein echtes d-d- und Ladungstransfer-Spektrum nichts ist, was eine thermodynamische Datenbank oder eine billige Rechnung ehrlich liefern kann. Die Provenienz sagt, was von beidem was ist."
"ethanol-and-water-mix.summary" = "C₂H₅OH(l) + H₂O(l) → eine flüssige Phase (vollständig mischbar)"
"ethanol-and-water-mix.expect.predict.question" = "100 mL Wasser und 50 mL Ethanol werden in einen Messzylinder gegossen. Was zeigt der Füllstand?"
"ethanol-and-water-mix.expect.predict.options" = ["150 mL — Volumina addieren sich", "Etwas weniger als 150 mL, weil sich die beiden Molekülsorten enger zusammenlagern, als es jede für sich allein tut", "Zwei Schichten, wie Öl und Wasser"]
"ethanol-and-water-mix.expect.predict.misconception" = "Volumen wird als Erhaltungsgröße wie Masse behandelt. Das ist es nicht: Masse addiert sich exakt, Volumen nicht, weil Volumen eine Aussage über die Packung ist. Ethanols kleiner hydrophober Schwanz schlüpft in die Lücken im wasserstoffbrückengebundenen Netzwerk des Wassers, und die reale Mischung ergibt etwa 145 mL. Kerotakis berichtet 150,0 mL — die Engine geht von additiven Volumina aus, und das ist eine erklärte Einschränkung, keine Behauptung über die reale Welt."
"ethanol-and-water-mix.expect.predict.diagnosis.0.reveals" = "Volumen erhält sich so wie Masse: Was hineingeht, ist das, was auf dem Zylinder abzulesen ist, weil 'Menge an Stoff' eine einzige Größe ist und keine zwei. Hier leistet sogar das Labor selbst dem Lernenden Gesellschaft — es berichtet 150,0, eine erklärte Einschränkung."
"ethanol-and-water-mix.expect.predict.diagnosis.0.next" = "Trenne die beiden Größen: `measure v1 balance` addiert sich jedes Mal exakt; ein echter Messzylinder tut das nicht (≈145 mL). Das ist der seltene Eintrag, bei dem die ehrliche Kontrolle die Küche ist, nicht die Simulation — die Engine geht von additiven Volumina aus und sagt das auch, was selbst die Lektion über das Vertrauen in erklärte Einschränkungen ist."
"ethanol-and-water-mix.expect.predict.diagnosis.1.reveals" = "Alkohol wird mit Öl in eine Schublade gesteckt: organisch, also müsse er sich abscheiden — Mischbarkeit wird als binäre Eigenschaft der Stofffamilie gelesen statt davon, was seine Moleküle dem Wasser bieten können."
"ethanol-and-water-mix.expect.predict.diagnosis.1.next" = "Gieße es in beliebigem Verhältnis: nie eine Grenzfläche. Ethanols OH-Ende bildet Wasserstoffbrücken in das Wassernetzwerk, während sich der kurze Schwanz in die Lücken schmiegt; Öl hat kein OH anzubieten und bekommt die Schicht, die dieser Lernende erwartet hat. Die Stofffamilie war das falsche Sortierkriterium — die funktionelle Gruppe ist das richtige."
"ethanol-and-water-mix.registers.lv1" = "Alkohol und Wasser mischen sich zu einer einzigen klaren Flüssigkeit — keine Schichten, keine Trennlinie, keine Trübung. Man kann durch bloßes Hinsehen nicht erkennen, dass überhaupt zwei Dinge darin sind."
"ethanol-and-water-mix.registers.lv2" = "Ethanol und Wasser sind in jedem Verhältnis mischbar: Die OH-Gruppe bildet Wasserstoffbrücken zum Wasser, während die kleine Ethylgruppe nicht groß genug ist, um eine Trennung zu erzwingen. Im Gegensatz dazu können Öls lange Kohlenwasserstoffketten die entropischen Kosten einer Störung des Wassernetzwerks nicht aufbringen."
"ethanol-and-water-mix.registers.lv3" = "Die ehrliche Grenze: Das Labor summiert die Volumina der reinen Komponenten (150,0 mL), wo das reale Exzessvolumen der Mischung bei etwa −3,5 % liegt, was ≈145 mL ergibt. Das ist das Mischungsvolumen, eine echte thermodynamische Größe, die das aktuelle Modell nicht führt. `evaporate` benennt eine verwandte Lücke offen — Ethanol von Wasser zu trennen erfordert ein Dampf-Flüssig-Gleichgewicht, das ist L3 und nicht verdrahtet, sodass dieses Gefäß nicht destilliert werden kann."
"bleach-and-acid.expect.predict.question" = "Bleiche und Entkalker sind beides ganz normale Reinigungsmittel. Was passiert, wenn sie in derselben Toilettenschüssel verwendet werden?"
"bleach-and-acid.expect.predict.options" = ["Nicht viel — beide sind Reinigungsmittel, also unterstützen sie sich gegenseitig", "Chlorgas wird freigesetzt, in Mengen, die jedes Jahr Menschen ins Krankenhaus bringen", "Sie neutralisieren sich gegenseitig und wirken nicht mehr"]
"bleach-and-acid.expect.predict.misconception" = "\"Beide sind Reinigungsmittel\" wird gelesen als \"beide stehen auf derselben Seite\", und die dritte Option zeigt die knapp danebenliegende Version: Es wird tatsächlich etwas neutralisiert, aber das Produkt ist ein Giftgas statt eines harmlosen Nieten-Ergebnisses. Haushaltsbleiche ist Hypochlorit in Lauge; Entkalker sind Säuren. Die Säure protoniert Hypochlorit und treibt Cl₂ aus — das Gas, das 1915 als Waffe eingesetzt wurde."
"bleach-and-acid.expect.predict.diagnosis.0.reveals" = "Produkte werden nach Zweck sortiert, nicht nach Chemie: Zwei Dinge, die zum Putzen verkauft werden, gelten als Mannschaftskollegen, also kann ihre Kombination nur noch stärker reinigen."
"bleach-and-acid.expect.predict.diagnosis.0.next" = "Führe es hier durch, wo das einzige Opfer eine Zahl ist: Die Warnung nennt Chlor bereits *bevor* die Chemie abläuft, und die Waage beobachtet dann, wie ein Gas entweicht, das keine der beiden Flaschen enthielt. Das Etikett auf der Vorderseite sagt, wofür es gedacht ist; die Chemie richtet sich nach den Zutaten auf der Rückseite."
"bleach-and-acid.expect.predict.diagnosis.1.reveals" = "Die Säure-Base-Hälfte wird tatsächlich erkannt — Lauge trifft Säure, also neutralisieren sie sich —, aber es wird angenommen, dass Neutralisation immer harmlos endet, und die Identität des Produkts wird nie geprüft."
"bleach-and-acid.expect.predict.diagnosis.1.next" = "Führe die Gleichung zu Ende, statt bei 'neutralisieren' aufzuhören: Die Protonierung von Hypochlorit ergibt Chlorgas, nicht Salzwasser. Die Gewohnheit, die dieser Eintrag aufbauen soll, ist, eine Reaktion bis zu ihren Produkten zu Ende zu lesen — `neutralisation` verdient sich ihr harmloses Ende dadurch, dass Wasser entsteht; hier ist das nicht der Fall."
"bleach-and-acid.registers.lv1" = "Niemals Bleiche mit irgendetwas anderem mischen. Niemals. Im Labor ist das ein Bild auf einem Bildschirm; in einem Badezimmer ist es ein Krankenwagen. Das Labor zeigt dir, was passiert, und lässt dich nicht daran riechen."
"bleach-and-acid.registers.lv2" = "NaOCl + 2 HCl → Cl₂↑ + NaCl + H₂O. 0,1 mol Hypochlorit mit 0,2 mol Säure setzt 0,1 mol Chlor frei — etwa 2,4 L bei Raumtemperatur, in einem Raum, in dem du stehst. Was im Becherglas bleibt, ist nur Salzwasser, pH 6,96."
"bleach-and-acid.registers.lv3" = "Die Gefahr ist L0: Der Screen für reaktive Gruppen bewertet den voraussichtlichen Gefäßzustand *bevor* die Zugabe angewendet wird und warnt bereits aufgrund der Paarung selbst, unabhängig davon, ob irgendein Solver die Chemie modelliert. Die Gasfreisetzung ist dann kuratierte Stöchiometrie, und die übrig gebliebene Sole ist berechnet. Sicherheit, die davon abhängt, dass ein Solver eine Meinung hat, ist Sicherheit, die versagt, wenn der Solver keine hat."
"neutral-is-a-moving-target.expect.predict.question" = "Ein Becherglas mit (fast) reinem Wasser zeigte bei 25 °C pH 7,00. Du erwärmst es auf 50 °C und misst erneut. Das Messgerät zeigt 6,63. Was ist passiert?"
"neutral-is-a-moving-target.expect.predict.options" = ["Es kann nichts passiert sein — reines Wasser ist neutral, und neutral bedeutet 7", "Das Wasser ist immer noch genau neutral; der Neutralpunkt selbst hat sich verschoben", "Die Wärme hat das Wasser leicht sauer gemacht"]
"neutral-is-a-moving-target.expect.predict.misconception" = "Beide falschen Antworten behandeln 'pH 7 = neutral' als Definition, dabei ist es der 25-°C-Wert eines temperaturabhängigen Gleichgewichts. Wasser spaltet sich selbst — H₂O ⇌ H⁺ + OH⁻ —, und Erwärmen treibt diese Spaltung weiter, sodass [H⁺] und [OH⁻] gemeinsam steigen. Neutral bedeutet, dass sie gleich groß sind, und bei 50 °C sind sie bei pH 6,63 gleich groß. Sauer würde einen Überschuss von H⁺ über OH⁻ erfordern, und nichts hat eines gespendet."
"neutral-is-a-moving-target.expect.predict.diagnosis.0.reveals" = "pH 7 wird als Definition von neutral behandelt statt als eine Messung bei nur einer Temperatur — also muss ein Messgerät, das bei reinem Wasser etwas anderes anzeigt, falsch sein."
"neutral-is-a-moving-target.expect.predict.diagnosis.0.next" = "Vertrau dem Messgerät und ändere die Temperatur in beide Richtungen: 6,63 bei 50 °C, 7,00 bei 25 °C, 7,47 nahe 0 °C — die Anzeige bewegt sich, obwohl nichts zugegeben oder entfernt wird. Eine Definition kann das nicht; eine temperaturabhängige Gleichgewichtskonstante muss es."
"neutral-is-a-moving-target.expect.predict.diagnosis.1.reveals" = "Sauer bedeutet 'unter 7', als absolute Regel — die eigentliche Definition von Neutralität, gleich viel H⁺ und OH⁻, kommt in diesem Bild nicht vor."
"neutral-is-a-moving-target.expect.predict.diagnosis.1.next" = "Frag, woher ein Überschuss an H⁺ hätte kommen sollen: Erwärmen von Wasser erzeugt mehr H⁺ und mehr OH⁻ in genau gleicher Zahl, weil jede Spaltung eines Wassermoleküls jeweils eines von beiden liefert. Bei 50 °C liegt diese Gleichheit bei 6,63; das Wasser ist so neutral wie eh und je."
"neutral-is-a-moving-target.registers.lv1" = "Warmes Wasser ist immer noch einfach Wasser — nichts Saures daran. Aber die Vorstellung des Messgeräts von der 'Mitte der Skala' verschiebt sich, wenn das Wasser wärmer wird. Die Mitte liegt nur bei einem Becherglas mit Raumtemperatur bei 7."
"neutral-is-a-moving-target.registers.lv2" = "Wasser spaltet sich ein kleines bisschen selbst: H₂O ⇌ H⁺ + OH⁻, mit K_w = 10⁻¹⁴ bei 25 °C. Die Spaltung ist endotherm, sodass Erwärmen sie weitertreibt: K_w wächst, [H⁺] und [OH⁻] steigen gemeinsam, und der pH-Wert fällt auf 6,63, während der pOH-Wert im Gleichschritt fällt. Neutral ist dort, wo sie gleich groß sind — und das ist nicht mehr 7."
"neutral-is-a-moving-target.registers.lv3" = "Die Prise Salz ist ein Gerüst, und das wird auch so gesagt: Dieses Labor weigert sich, reines Wasser zu charakterisieren — keine gelösten Stoffe, keine Lösung, und das Messgerät zeigt ehrlich nichts an —, deshalb gibt 0,01 mol/kgw NaCl ihm eine Lösung, in der es stehen kann, ohne die Autoprotolyse zu berühren (beide Ionen sind dafür Zuschauerionen). K_w stammt aus der Datenbank bei der Eigentemperatur des Gefäßes: Die Engine liest 7,00 bei 25 °C, 6,63 bei 50 °C und 7,47 nahe 0 °C — die klassischen Tabellenwerte, berechnet statt zitiert. 'pH 7 = neutral' ist eine Tatsache bei 25 °C, die meist als Definition gelehrt wird; der pH-Wert 13,51 des Laugen-Eintrags ist dieselbe Lektion vom anderen Ende der Skala."
"bicarbonate-plays-both-sides.expect.predict.question" = "Natron sprudelt heftig, wenn Säure daraufgegossen wird. Gieße stattdessen konzentrierte Lauge auf dieselbe Natronlösung. Was passiert?"
"bicarbonate-plays-both-sides.expect.predict.options" = ["Es sprudelt wieder — Sprudeln ist das, was Natron tut", "Überhaupt nichts — Natron reagiert auf Säuren, und Lauge ist keine Säure", "Diesmal kein Gas: Das Hydrogencarbonat gibt sein eigenes Proton ab und wird zu Carbonat"]
"bicarbonate-plays-both-sides.expect.predict.misconception" = "Beide falschen Antworten behandeln Säure und Base als Abzeichen, die ein Stoff trägt, statt als Rollen in einer Transaktion. Hydrogencarbonat ist amphiprotisch: gegenüber einer Säure nimmt es ein Proton auf (und die entstehende Kohlensäure entweicht als CO₂ — das Sprudeln); gegenüber einer Base gibt es sein eigenes Proton ab und wird still zu Carbonat. Brønsteds ganzer Kniff ist, dass Säure und Base die zwei Enden einer einzigen Protonenübergabe benennen — und dieses Becherglas ist genau diese Idee als Experiment."
"bicarbonate-plays-both-sides.expect.predict.diagnosis.0.reveals" = "Das Sprudeln als Markenzeichen des Stoffes — Hydrogencarbonat 'enthält' das Gas so, wie ein Luftballon es tut, und jede Provokation setzt es frei."
"bicarbonate-plays-both-sides.expect.predict.diagnosis.0.next" = "Frag, woraus das Gas besteht: CO₂ entsteht nur, wenn das Hydrogencarbonat ein Proton *erhält*. Lauge bietet keines an. Beobachte den Ereignisstrom — der Laugenschritt setzt nichts frei — und die lv3-Speziation zeigt den Kohlenstoff noch im Becherglas, jetzt als Carbonat."
"bicarbonate-plays-both-sides.expect.predict.diagnosis.1.reveals" = "Säure und Base als feste Identitäten: Hydrogencarbonat ist 'eine Base', und eine Base hat mit einer anderen nichts zu schaffen — also kann nichts passieren."
"bicarbonate-plays-both-sides.expect.predict.diagnosis.1.next" = "Es ist tatsächlich etwas passiert; es war nur still. Die lv3-Speziation zeigt, dass das Hydrogencarbonat verschwunden ist und Carbonat an seiner Stelle steht: Ein Proton hat das HCO₃⁻-Ion selbst verlassen. Ein Stoff, zwei Rollen je nach Partner — der Schritt von Arrhenius zu Brønsted in `models.toml` ist dieses Becherglas, als Theorie niedergeschrieben."
"bicarbonate-plays-both-sides.registers.lv1" = "Gegen Saures wehrt sich Natron mit Bläschen. Gegen das Seifige tut es etwas Heimtückischeres: Es gibt ein winziges Stück von sich selbst ab, ohne ein einziges Bläschen. Dasselbe Pulver spielt beide Seiten, je nachdem, wem es begegnet."
"bicarbonate-plays-both-sides.registers.lv2" = "Amphiprotisches Verhalten: HCO₃⁻ + H⁺ → H₂O + CO₂↑ (Base-Rolle — das Sprudeln), aber HCO₃⁻ + OH⁻ → CO₃²⁻ + H₂O (Säure-Rolle — kein Gas). Das Säure-Becherglas endet bei etwa pH 5,6, wobei aller Kohlenstoff als Gas entwichen ist; das Laugen-Becherglas behält seinen Kohlenstoff als Carbonat."
"bicarbonate-plays-both-sides.registers.lv3" = "Die Buchhaltung, ehrlich: Eine offene 0,1-mol/kgw-Hydrogencarbonat-Lösung entgast beim Lösen von selbst etwa 0,003 mol CO₂ (ihr eigenes Carbonatgleichgewicht gegenüber der Atmosphäre — `baking-soda-vents-carbon-dioxide`), sodass 0,003 mol der Lauge keinen Hydrogencarbonat-Partner finden und der finale pH-Wert des zweiten Becherglases diesen Hydroxidüberschuss trägt. Der pH-Wert 5,6 des Säure-Becherglases ist keine übrig gebliebene Säure: Es ist eine Natriumchlorid-Lösung im Gleichgewicht mit atmosphärischem CO₂ — dieselbe Chemie, die sauberen Regen leicht sauer macht. Der Brønsted-Punkt steckt in der Speziation: Dasselbe Ion tritt in einem Gefäß als Protonenakzeptor und im anderen als Protonendonor auf — etwas, das kein festes Säure/Base-Etikett sagen kann."
"the-antacid-runs-on-arithmetic.expect.predict.question" = "Magensäure ist etwa 0,1-mol/L-Salzsäure — dieses Becherglas davon zeigt pH 1,1. Ein Gramm Natron kommt hinein, etwa das, was eine Sodbrennen-Tablette enthält. Was sagt das Messgerät, wenn das Sprudeln aufhört?"
"the-antacid-runs-on-arithmetic.expect.predict.options" = ["Immer noch etwa 1 — ein Küchenpulver kann einer starken Säure nichts anhaben", "Etwa 9, mit einem Rülpser Kohlendioxid unterwegs", "14 — Natron ist eine Base, und eine Base treibt die Skala nach oben"]
"the-antacid-runs-on-arithmetic.expect.predict.misconception" = "Beide falschen Antworten verwechseln, WAS ein Stoff ist, mit WIE VIEL davon vorhanden ist. 'Stark' beschreibt, wie vollständig eine Säure ihre Protonen abgibt, nicht wie viele sie hat: 0,01 mol Protonen trifft auf 0,012 mol Protonenakzeptoren und geht einfach aus. Und eine Base teleportiert die Skala nicht zu 14 — das übrig gebliebene Hydrogencarbonat ist eine schwache, milde Base, die sich bei etwa 9 einpendelt, genau deshalb sind Tabletten Carbonate und keine Lauge."
"the-antacid-runs-on-arithmetic.expect.predict.diagnosis.0.reveals" = "'Starke Säure' als unbesiegbar — Stärke wird als Macht über jeden Gegner gelesen, statt als Vollständigkeit der eigenen Dissoziation."
"the-antacid-runs-on-arithmetic.expect.predict.diagnosis.0.next" = "Zähle, statt zu bewerten: 0,01 mol Protonen gegen 0,012 mol Hydrogencarbonat. Die Stärke hat entschieden, wie die Protonen angeboten wurden (alle auf einmal, vollständig dissoziiert); das Zählen entscheidet, wer ausgeht, und das ist die Säure. Das Sprudeln sind ihre Protonen, die das Becherglas als Gas verlassen."
"the-antacid-runs-on-arithmetic.expect.predict.diagnosis.1.reveals" = "Basen als Skalenkipper: Die Zugabe von 'einer Base' schickt den pH-Wert an die Spitze der Skala, wobei die eigene Stärke und Menge der Base keine Rolle spielt."
"the-antacid-runs-on-arithmetic.expect.predict.diagnosis.1.next" = "Schau dir an, was tatsächlich übrig bleibt: überschüssiges Hydrogencarbonat, ein schwacher Protonenakzeptor, der das Becherglas bei etwa pH 9 einpendeln lässt — für die Lauge, die wirklich an die Spitze der Skala kommt, führe `strong-base` aus. Deine Magenschleimhaut ist der Grund, warum die sanfte Landung das Entwurfsziel ist: ein Antazidum, das bis 14 überschösse, wäre eine schlimmere Verätzung als die Säure, die es heilen sollte."
"the-antacid-runs-on-arithmetic.registers.lv1" = "Nachgestellte Magensäure: sauer genug, um zu beißen. Das weiße Pulver kommt hinein — es sprudelt heftig, und wenn die Bläschen aufhören, ist das Beißen vorbei. Das Aufstoßen ist die Säure selbst, die als Gas entweicht."
"the-antacid-runs-on-arithmetic.registers.lv2" = "HCO₃⁻ + H⁺ → H₂O + CO₂↑. Ein Gramm NaHCO₃ sind 0,0119 mol gegenüber 0,0100 mol Säure, sodass die Säure der begrenzende Reaktionspartner ist: Der pH-Wert steigt von 1,1 auf etwa 9,2, die Waage verliert ~0,45 g CO₂, und die ~0,002 mol unverbrauchtes Hydrogencarbonat sind es, die das Ende sanft halten."
"the-antacid-runs-on-arithmetic.registers.lv3" = "Die Tablette ist so dosiert, dass sie die erwartete Säure überdauert — `buffer-capacity-exceeded` rückwärts abgespielt: Dort überdauerte der Angriff die Reserve; hier überdauert die Reserve den Angriff, nach Entwurf und nach Rechnung. Ehrlichkeit über das Modell: Ein Becherglas ist kein Magen — ein Magen scheidet weiterhin Säure aus und reguliert das Volumen, sodass die echte Linderung ein andauernder Kampf ist und keine einmalige Titration; und der Endpunkt des Becherglases bei pH 9,2 ist ein Carbonatgleichgewicht im offenen Gefäß, das CO₂ entgast, bis es der Atmosphäre entspricht. Was die Rechnung tatsächlich ins Apothekenregal überträgt: Die Dosis wirkt nach Molzahlen, nicht nach Magie, weshalb die Packung Gramm angibt."
"the-indicator-is-chosen-for-the-jump.summary" = "Phenolphthalein schlägt am Endpunkt dieser Titration um (pH 8,6); Methylorange hat schon viel früher umgeschlagen, mitten im Pufferbereich — der Indikator wird für den Sprung gewählt, nicht für seine Optik"
"the-indicator-is-chosen-for-the-jump.expect.predict.question" = "Der Äquivalenzpunkt dieser Essigtitration liegt bei pH 8,6, nicht bei 7. Welcher Indikator markiert ihn — Phenolphthalein (Umschlag 8,2–10) oder Methylorange (Umschlag 3,1–4,4)?"
"the-indicator-is-chosen-for-the-jump.expect.predict.options" = ["Beide — ein Indikator ist ein Farbsignal, und jedes Farbsignal tut es", "Phenolphthalein: sein Umschlag liegt genau auf dem Endpunkt. Methylorange schlägt viel zu früh um, mitten im Pufferbereich", "Methylorange — Orange ist vor Weiß leichter zu erkennen als Blassrosa"]
"the-indicator-is-chosen-for-the-jump.expect.predict.misconception" = "Ein Indikator ist keine Glocke, die bei 'fertig' läutet — er ist eine schwache Säure, die bei ihrem eigenen pKa-Wert die Form wechselt, wo immer der liegt. Die Wahl ist ein Ausrichtungsproblem: Das Umschlagfenster des Indikators muss auf dem pH-Sprung der Titration liegen. Das Fenster von Phenolphthalein überspannt die 8,6 dieses Endpunkts; das Fenster von Methylorange wurde schon bei pH 4 durchlaufen, im langsamen Pufferanstieg, wo sein Farbwechsel überhaupt nichts von analytischem Interesse markiert."
"the-indicator-is-chosen-for-the-jump.expect.predict.diagnosis.0.reveals" = "Alle Indikatoren gelten als austauschbare Signale: Die Chemie des Farbstoffs spielt keine Rolle, also bedeutet jeder Farbwechsel 'stopp'."
"the-indicator-is-chosen-for-the-jump.expect.predict.diagnosis.0.next" = "Führe den halbtitrierten Kolben aus (v2): Methylorange zeigt bereits bei pH 4,69 Orange, obwohl die Hälfte der Base noch nicht verbraucht ist. Ein Analytiker, der bei diesem Signal stoppt, würde die halbe echte Konzentration melden — der falsche Indikator verursacht nicht nur eine Unannehmlichkeit, er beantwortet eine andere Frage."
"the-indicator-is-chosen-for-the-jump.expect.predict.diagnosis.1.reveals" = "Der Indikator wird nach Sichtbarkeit gewählt — eine ästhetische Entscheidung über Farben, bei der die pH-Achse in der Wahl überhaupt keine Rolle spielt."
"the-indicator-is-chosen-for-the-jump.expect.predict.diagnosis.1.next" = "Sichtbarkeit ist real, aber zweitrangig: Die Frage, die ein Indikator beantwortet, ist WO er umschlägt, nicht wie hübsch. `weak-acid-endpoint-is-alkaline` berechnete diesen Endpunkt bei etwa 8,8 statt bei 7 — diese Zahl ist der ganze Grund, warum Phenolphthalein die Standardwahl für Titrationen schwacher Säuren ist, und sie wirkte nur so lange willkürlich, bis der Endpunkt berechnet war."
"the-indicator-is-chosen-for-the-jump.registers.lv1" = "Zwei magische Farbstoffe. Einer bleibt unsichtbar bis zu dem Moment, in dem das Saure aufgebraucht ist — dann errötet der Kolben rosa. Der andere hat schon vor langer Zeit die Farbe gewechselt, als noch reichlich Saures übrig war. Nur einer von beiden sagt dir, wann du aufhören sollst."
"the-indicator-is-chosen-for-the-jump.registers.lv2" = "Ein Indikator ist eine schwache Säure mit unterschiedlich gefärbten Formen; sie schlägt nahe ihrem eigenen pKa-Wert um. Phenolphthalein (Umschlag ≈8,2–10) überspannt den Äquivalenzpunkt dieser Titration — das Labor liest pH 8,62 und stellt den Kolben rosa dar. Methylorange (≈3,1–4,4) hat seinen Wechsel bereits mitten im Pufferbereich abgeschlossen: v2, nur halbtitriert, zeigt bereits bei pH 4,69 Orange."
"the-indicator-is-chosen-for-the-jump.registers.lv3" = "Die Farben werden berechnet, nicht pro pH-Wert kuratiert: Jeder Indikator führt zwei gemessene Spektren (Säure- und Baseform), die Engine besetzt die Formen nach dem Henderson-Hasselbalch-Verhältnis beim gelösten pH-Wert, und Beer-Lambert über den CIE-Beobachter stellt die Mischung dar — das Rosa bei 8,62 und das Orange bei 4,69 sind dieselbe Rechnung, die Permanganat violett macht. Eine Ehrlichkeit bei der Dosierung: Das Labor dosiert reinen Stoff, sodass die Mikromol-Mengen hier die Rolle der 'zwei Tropfen Indikatorlösung' des echten Labors spielen — tropfenbasierte Dosen des reinen Farbstoffs wären eine hundertfache Überdosis und würden jeden Farbton bis hin zu Schwarz sättigen."
"the-in-between-colour-is-a-mixture.summary" = "Bromthymolblau ist nahe dem neutralen Punkt grün — keine dritte Farbe des Farbstoffs, sondern die berechnete Mischung seiner gelben und blauen Form im gelösten Verhältnis"
"the-in-between-colour-is-a-mixture.expect.predict.question" = "Bromthymolblau ist in Säure gelb und in Base blau. Welche Farbe hat die Lösung nahe pH 7?"
"the-in-between-colour-is-a-mixture.expect.predict.options" = ["Gelb oder blau, je nachdem, worauf es umgeschlagen ist — ein Indikator ist ein Schalter", "Grün — beide Formen sind gleichzeitig vorhanden, und ihre Farben mischen sich", "Farblos — genau in der Mitte heben sich die beiden Farben gegenseitig auf"]
"the-in-between-colour-is-a-mixture.expect.predict.misconception" = "Ein Indikator ist kein Schalter, sondern ein Gleichgewicht: bei einem pH-Wert nahe seinem pKa liegen etwa die Hälfte der Moleküle in jeder Form vor, gleichzeitig. Die Hälfte des Farbstoffs, die wie die gelbe Form absorbiert, plus die Hälfte, die wie die blaue Form absorbiert, lässt Grün durch — genauso, wie Farben beim Mischen wirken, weil sich Absorptionen addieren. Auslöschung ist, wie sich entgegengesetzte *Lichter* verhalten; absorbierende Farbstoffe subtrahieren nur immer mehr."
"the-in-between-colour-is-a-mixture.expect.predict.diagnosis.0.reveals" = "Der Indikator als binärer Schalter: jedes Molekül — oder das ganze Becherglas — befindet sich in genau einem Zustand, und 'Übergangsbereich' bedeutet nur Unsicherheit darüber, in welchem."
"the-in-between-colour-is-a-mixture.expect.predict.diagnosis.0.next" = "Führe das Becherglas im Skript dieses Eintrags durch alle drei Farben: gelb in Säure, blaugrün nahe neutral, blau in Base. Ein Schalter hat keine stabile Mitte; eine Gleichgewichtspopulation schon, und das Grün IST die Aussage über diese Population — du siehst das Verhältnis."
"the-in-between-colour-is-a-mixture.expect.predict.diagnosis.1.reveals" = "Farben als Gegensätze, die sich auslöschen: Gelb plus Blau ergibt nichts, so wie Plus und Minus."
"the-in-between-colour-is-a-mixture.expect.predict.diagnosis.1.next" = "Trenne Lichter von Farbstoffen: Komplementäre LICHTER können sich zu Weiß auslöschen, aber ein Farbstoff wirkt durch Absorption, und zwei Absorber in einem Becherglas absorbieren die Vereinigung — Rot wird von der einen Form aufgenommen, Orangerot von der anderen, sodass Grün durchgelassen wird. Absorptionen addieren sich; sie subtrahieren sich nie. Die Farbmaschine des Labors addiert die beiden Spektren buchstäblich, bevor sie darstellt."
"the-in-between-colour-is-a-mixture.registers.lv1" = "Dieser Farbstoff ist in saurem Wasser gelb und in seifigem Wasser blau. In reinem Wasser ist er grün — weil er gleichzeitig zur Hälfte in der gelben und zur Hälfte in der blauen Form vorliegt, und dein Auge sie addiert."
"the-in-between-colour-is-a-mixture.registers.lv2" = "Das Indikatorgleichgewicht HInd ⇌ H⁺ + Ind⁻ liegt bei seinem pKa nahe 7: in Säure dominiert das gelbe HInd, in Base das blaue Ind⁻, und nahe neutral sind beide besetzt — das Labor stellt gelb, dann blaugrün, dann blau dar, während dieses Skript dasselbe Becherglas über die Skala schwingt."
"the-in-between-colour-is-a-mixture.registers.lv3" = "Das Grün existiert nirgendwo in den Daten als kuratierte Farbe: Die Engine führt ein gemessenes Spektrum pro Form, besetzt die Formen nach dem berechneten Verhältnis beim gelösten pH-Wert, summiert die Absorptionen und integriert über den CIE-1931-Beobachter. Die Zwischenfarbe ist also eine *Vorhersage*, dass Mischen funktioniert — dieselbe Additivitätsbehauptung, die das README für den konzentrationsabhängigen Farbton von Permanganat macht, hier bei jedem pH-Wert dazwischen mit bloßem Auge überprüfbar. Ehrlichkeit beim Endpunkt: Das Skript parkt das Becherglas bei pH 11,63 (vollständig blau), sodass die pH-Behauptung überprüfbar ist; die blaugrüne Messung erfolgt mitten im Skript, an der nahezu neutralen Station."
"salt-dissolves.registers.lv1" = "Das Salz verschwindet im Wasser. Es ist aber nicht weg — probier es, und du schmeckst es immer noch: Es versteckt sich als winzige Teilchen, die zu klein sind, um sie zu sehen."
"salt-dissolves.registers.lv2" = "Natriumchlorid löst sich auf und zerfällt dabei in hydratisierte Na⁺- und Cl⁻-Ionen. Die Lösung bleibt neutral, weil keines der beiden Ionen mit Wasser reagiert."
"salt-dissolves.registers.lv3" = "Kongruente Auflösung zu vollständig dissoziierten Na⁺/Cl⁻-Ionen; der pH-Wert bleibt unbeeinflusst, da keines der Ionen nennenswert hydrolysiert. Die Aktivitätskoeffizienten folgen bei dieser Ionenstärke der WATEQ-Debye-Hückel-Erweiterung."
"salt-saturates.registers.lv1" = "Rührst du immer weiter Salz ins Wasser, hört es irgendwann auf zu verschwinden — das Wasser ist voll. Der Rest bleibt einfach am Boden liegen."
"salt-saturates.registers.lv2" = "Oberhalb der Löslichkeitsgrenze (≈6,1 mol pro kg Wasser bei 25 °C) ist die Lösung gesättigt: gelöstes und festes Salz stehen im Gleichgewicht, und jede zusätzliche Menge bleibt fest."
"salt-saturates.registers.lv3" = "Halit-Sättigung. In diesem Bereich widersprechen sich die Datensätze — Pitzers Ionen-Interaktionsmodell liefert ≈6,13 mol/kgw gegenüber 6,50 bei wateq4f und 3,7 bei minteq.v4, weshalb konzentrierte Probleme über Pitzer gerechnet werden. `explain` zeigt alle drei."
"silver-chloride-precipitation.registers.lv1" = "Zwei klare Flüssigkeiten — und in dem Moment, in dem sie sich treffen, wird das Wasser trüb-weiß! Ein völlig neuer Feststoff ist wie aus dem Nichts entstanden."
"silver-chloride-precipitation.registers.lv2" = "Ag⁺ + Cl⁻ → AgCl↓. Silberchlorid ist unlöslich (Ksp ≈ 1,8 × 10⁻¹⁰) und fällt daher aus der Lösung aus, während Natrium- und Nitrat-Ionen als Zuschauer-Ionen gelöst bleiben."
"silver-chloride-precipitation.registers.lv3" = "Cerargyrit-Fällung bis SI = 0. Das verbleibende gelöste Silber besteht nicht allein aus freiem Ag⁺: Der neutrale Komplex AgCl(aq) liegt mit ≈3 × 10⁻⁷ m vor, weshalb die scheinbare Löslichkeit über dem naiven √Ksp liegt."
"strong-acid.registers.lv1" = "Diese Flüssigkeit ist eine Säure. Säuren schmecken sauer — deshalb sind Zitronen und Essig sauer — aber im Labor probierst du niemals eine Chemikalie."
"strong-acid.registers.lv2" = "Salzsäure ist eine starke Säure: Sie dissoziiert vollständig, sodass 0,001 mol in einem Liter [H⁺] = 10⁻³ und damit pH 3 ergeben."
"strong-acid.registers.lv3" = "Vollständige Dissoziation; der pH-Wert ergibt sich aus der Ladungsbilanz statt aus einer angenommenen Aktivität von eins. Bei I ≈ 10⁻³ liegt der Aktivitätskoeffizient bei ≈0,96, sodass der pH-Wert geringfügig über dem Konzentrationslogarithmus liegt."
"weak-acid.registers.lv1" = "Das ist die Säure im Essig. Sie ist auch sauer, aber viel milder als die starke Säure — der größte Teil bleibt ganz, statt sich aufzuspalten."
"weak-acid.registers.lv2" = "Essigsäure ist schwach: Nur ein kleiner Anteil dissoziiert. 0,1 mol/L ergeben pH ≈ 2,9, statt der pH 1,0, die eine starke Säure gleicher Konzentration liefern würde."
"weak-acid.registers.lv3" = "Teildissoziation, bestimmt durch das datenbankeigene Gleichgewicht H⁺ + Acetat⁻ ⇌ HAc (pKa ≈ 4,76); der pH-Wert folgt aus diesem Gleichgewicht, nicht aus einem angenommenen Dissoziationsgrad."
"buffer.summary" = "CH₃COOH / CH₃COO⁻-Puffer"
"buffer.registers.lv1" = "Gib Säure zu dieser Flüssigkeit — und fast nichts passiert. Sie ist stur. Dein Blut macht denselben Trick, weshalb dir ein Glas Limonade nicht schadet."
"buffer.registers.lv2" = "Eine äquimolare schwache Säure und ihr Salz puffern in der Nähe des pKa-Werts (4,76). Die Zugabe von 0,01 mol starker Säure verschiebt den pH-Wert um weniger als 0,1, während dieselbe Säure in reinem Wasser den pH-Wert auf 2 drücken würde."
"buffer.registers.lv3" = "Henderson-Hasselbalch-Verhalten ergibt sich hier aus der Speziation, statt angewendet zu werden: Das Reservoir der konjugierten Base nimmt zugegebene Protonen auf, und die Verschiebung folgt dem Logarithmus des Konzentrationsverhältnisses."
"vinegar-and-baking-soda.registers.lv1" = "Es sprudelt! Überall Bläschen. Stell das Glas vorher und nachher auf die Waage: Es wird leichter, weil die Bläschen davongeflogen sind und etwas Gewicht mitgenommen haben."
"vinegar-and-baking-soda.registers.lv2" = "Die Säure protoniert das Hydrogencarbonat und setzt dabei Kohlenstoffdioxid frei. In einem offenen Gefäß entweicht das Gas, sodass das System an Masse verliert — insgesamt bleibt die Masse erhalten, aber nicht innerhalb des Bechers."
"vinegar-and-baking-soda.registers.lv3" = "Die Carbonat-Speziation verschiebt sich mit dem pH-Wert, bis die Lösung gegenüber dem atmosphärischen pCO₂ (log p = −3,408) übersättigt ist, und der Überschuss entweicht. Etwa 77 % des Carbonats entweichen; das Henry-Gesetz hält den Rest gelöst."
"hot-pack.registers.lv1" = "Fass das Becherglas an — es ist von ganz allein warm geworden! Manche Stoffe geben beim Auflösen Wärme ab. So funktioniert ein Handwärmer."
"hot-pack.registers.lv2" = "Das Auflösen von Calciumchlorid ist stark exotherm (ΔH ≈ −82,8 kJ/mol): 0,1 mol in 100 mL Wasser erhöhen die Temperatur um etwa 20 °C."
"hot-pack.registers.lv3" = "Die Gitterenthalpie wird durch die Hydratationsenthalpien von Ca²⁺ und Cl⁻ mehr als ausgeglichen. Das Gefäß ist hier adiabatisch, sodass die gesamte freigesetzte Energie als fühlbare Wärme in der Lösung erscheint."
"cold-pack.registers.lv1" = "Dieses hier wird stattdessen kalt! Beim Auflösen kann Wärme genauso aufgenommen wie abgegeben werden — so funktioniert ein Kühlpack."
"cold-pack.registers.lv2" = "Das Auflösen von Kaliumchlorid ist endotherm (ΔH ≈ +17,2 kJ/mol): Die Lösung entzieht sich selbst Wärme und kühlt um einige Grad ab."
"cold-pack.registers.lv3" = "Endotherme Auflösung: Die Gitterenthalpie übersteigt die Summe der Hydratationsenthalpien, und in einem adiabatischen Gefäß wird das Defizit der fühlbaren Wärme der Lösung entnommen."
"limescale.registers.lv1" = "Das Wasser wird trüb, und es bildet sich eine weiße Kruste. So verkalkt ein Wasserkocher in einer Gegend mit hartem Wasser."
"limescale.registers.lv2" = "Treffen Calcium-Ionen auf Carbonat, fällt Calciumcarbonat aus — Kesselstein. Hartes Wasser ist Wasser, das gelöstes Calcium und Magnesium mit sich führt."
"limescale.registers.lv3" = "Calcit-Fällung; die Polymorphie wird durch die Stabilität bestimmt (Calcits log K ist niedriger als das von Aragonit), und die Carbonat-Speziation ist durchgehend pH-abhängig."
"calcination.registers.lv1" = "Erhitzt man Kreide, bis sie glüht, verwandelt sie sich in etwas Neues — Branntkalk. So stellen Menschen seit Tausenden von Jahren Zement und Mörtel her."
"calcination.registers.lv2" = "Thermische Zersetzung: Oberhalb von etwa 900 °C zerfällt Calciumcarbonat in Calciumoxid und Kohlenstoffdioxid, und das Gas entweicht."
"calcination.registers.lv3" = "Die Zersetzungstemperatur wird berechnet, nicht angenommen: Sie liegt dort, wo der Gleichgewichts-CO₂-Druck über dem Carbonat den Umgebungspartialdruck erreicht. Gibbs-Minimierung über NASA-9-Polynome, wobei die Atmosphäre des Gefäßes Teil des Problems ist."
"burning-magnesium.registers.lv1" = "Es entzündet sich mit einem Licht, das so hell ist, dass es beim Hinsehen wehtut, und hinterlässt ein weißes Pulver. Wiege es danach: Es ist SCHWERER geworden. Das zusätzliche Gewicht stammt aus der Luft."
"burning-magnesium.registers.lv2" = "Magnesium verbrennt mit Sauerstoff zu Magnesiumoxid und setzt dabei 601 kJ pro Mol frei. Die Masse nimmt zu, weil Sauerstoff aus der Luft jetzt Teil des Produkts ist — ein klassischer Beleg dafür, dass Verbrennen eine Verbindung ist, keine Zerstörung."
"burning-magnesium.registers.lv3" = "Adiabatische Verbrennung, enthalpieerhaltend gelöst, mit der Atmosphäre in der Elementbilanz, was eine Flammentemperatur nahe 3000 K ergibt. Der Sauerstoff wird dem Reservoir entnommen und nicht dem Inventar, weshalb das Gefäß an Masse gewinnt."
"flame-test-sodium.summary" = "Na⁺ → Na* → Na + hν (589 nm)"
"flame-test-sodium.registers.lv1" = "Salz brennt nicht — aber hältst du es in eine Flamme, wird die Flamme leuchtend gelb! Jedes Metall hat seine eigene Farbe, woran man sie unterscheiden kann."
"flame-test-sodium.registers.lv2" = "Natrium verbrennt nicht; die Erhitzung regt sein äußeres Elektron an, das beim Zurückfallen bei 589 nm emittiert. Flammenproben identifizieren Metalle anhand dieser charakteristischen Farben."
"flame-test-sodium.registers.lv3" = "Atomemission, keine Verbrennung: das D-Linien-Dublett bei 589,0/589,6 nm. Dies ist Spektroskopie und daher kuratierte Daten — die thermodynamischen Datenbanken haben dazu nichts zu sagen, und das Labor gibt auch nicht vor, dass es anders wäre."
"teilchenmodell.registers.lv1" = "Alles besteht aus Teilchen, die viel zu klein sind, um sie zu sehen, und die nie aufhören zu zittern. In einem Feststoff sitzen sie dicht gepackt und können nur wackeln; in einer Flüssigkeit gleiten sie aneinander vorbei; in einem Gas fliegen sie auseinander, dazwischen ist nichts als leerer Raum. Wenn Zucker im Tee verschwindet, ist er nirgendwohin gegangen — die Teilchen sind in die Lücken zwischen den Wasserteilchen gerutscht, weshalb der Tee immer noch süß schmeckt und genau gleich viel wiegt."
"teilchenmodell.registers.lv2" = "Materie besteht aus einzelnen Teilchen in ständiger Bewegung, getrennt durch leeren Raum. Die Temperatur misst ihre mittlere kinetische Energie, und die Aggregatzustände unterscheiden sich darin, wie viel von dieser Energie den Kräften entgegensteht, die die Teilchen zusammenhalten. Schmelzen, Sieden, Lösen und Diffusion sind alles nur Umordnungen derselben Teilchen, sodass sich dabei nie die Masse ändert."
"teilchenmodell.registers.lv3" = "Das kinetische Teilchenmodell — der schulische Vorläufer der kinetischen Gastheorie. Es ist rein mechanisch: Teilchen besitzen Masse, Volumen und Geschwindigkeit und sonst nichts, weshalb es genau die Gesetze von Boyle und Gay-Lussac liefert und keine einzige chemische Tatsache. In Johnstones Terminologie ist es das erste submikroskopische Modell, dem Lernende begegnen, und es wird nicht spontan erworben: Vorstellungen von kontinuierlicher Materie halten sich über Jahre, Lernende füllen den Zwischenraum zwischen den Teilchen mit Luft, und sie übertragen makroskopische Eigenschaften auf einzelne Teilchen."
"dalton-atommodell.registers.lv1" = "Jeder Stoff ist aus einer kleinen Zahl von Bausteinsorten aufgebaut, den Atomen, und jede Sorte hat ihr eigenes Gewicht. Atome werden nie erzeugt und nie vernichtet — eine Reaktion nimmt sie nur auseinander und setzt sie anders wieder zusammen, wie beim Umbauen eines Lego-Modells aus denselben Steinen. Deshalb wiegt danach nie etwas weniger."
"dalton-atommodell.registers.lv2" = "Elemente bestehen aus Atomen; alle Atome eines Elements haben dieselbe Masse; Verbindungen enthalten Atome in festen, ganzzahligen Verhältnissen; eine Reaktion ordnet Atome nur um, ohne welche zu erzeugen oder zu vernichten. Daraus folgen die Erhaltung der Masse, das Gesetz der konstanten Proportionen und das Gesetz der multiplen Proportionen — Kohlenstoff und Sauerstoff ergeben CO und CO2, niemals etwas dazwischen."
"dalton-atommodell.registers.lv3" = "Dalton (1808) ist das erste Modell in dieser Reihe, das quantitativ und vorhersagend statt nur beschreibend ist, und das Gesetz der multiplen Proportionen ist seine echte Vorhersage, gemacht noch bevor die Belege vorlagen. Es enthielt auch einen lehrreichen Irrtum: Die Regel der größten Einfachheit ordnete dem Wasser die Formel HO zu, was die gesamte Atommassentabelle falsch machte, bis Avogadros Hypothese und Cannizzaros Eingreifen beim Kongress von Karlsruhe Atom und Molekül voneinander trennten. Diese fünfzig Jahre Lücke sind der klarste verfügbare Fall eines Modells, das in seiner Struktur richtig und in einem Parameter falsch ist."
"kern-huelle-modell.registers.lv1" = "Schieße winzige Kugeln auf eine Goldfolie, und fast alle fliegen glatt hindurch, als wäre da nichts — aber etwa eine von zehntausend prallt direkt zurück. Also muss ein Atom größtenteils leerer Raum sein, mit etwas sehr Kleinem, sehr Schwerem und positiv Geladenem genau in der Mitte: dem Atomkern. Alles andere ist eine Wolke aus leichten, negativen Elektronen darum herum. Reibst du einen Luftballon an deinen Haaren, stiehlst du dir ein paar davon."
"kern-huelle-modell.registers.lv2" = "Rutherford (1911), aus dem Alphateilchen-Streuversuch von Geiger und Marsden: Ein Atom besitzt einen Kern aus Protonen und Neutronen, der praktisch die gesamte Masse trägt, auf etwa einem Hunderttausendstel des Durchmessers, umgeben von Z Elektronen. Der Kern legt fest, um welches Element es sich handelt; nur die Hülle nimmt an chemischen Reaktionen teil. Entfernt oder fügt man Hüllenelektronen hinzu, entstehen Ionen, und Ionen sind der Ausgangsstoff der gesamten Salzchemie."
"kern-huelle-modell.registers.lv3" = "Hier trennen sich Chemie und Physik sauber: die Kernladung Z ist die Identität, die Elektronenhülle ist die Chemie. Es ist auch das Modell, dessen Scheitern quantitativ und eindeutig ist — eine nach der Larmor-Formel strahlende, beschleunigte Ladung lässt das Atom in etwa 10^-11 s kollabieren —, weshalb der nächste Schritt ein Postulat gegen die klassische Mechanik sein musste und nicht bloß deren Verfeinerung. Wird dieses Scheitern beim Namen genannt, wirken Bohrs stationäre Zustände nicht mehr willkürlich."
"schalenmodell.registers.lv1" = "Elektronen sitzen nicht einfach irgendwo. Sie leben in Schalen um den Kern, wie die Ringe einer Zwiebel, und jede Schale hat nur für eine bestimmte Anzahl Platz. Ein Atom ist zufrieden, wenn seine äußerste Schale voll ist, und das ist das ganze Geheimnis der Chemie: Atome geben Elektronen ab, nehmen sie auf oder teilen sie sich, bis bei allen die äußere Schale voll ist. Erhitzt man ein Atom, springt ein Elektron eine Schale höher, fällt dann wieder zurück und gibt Licht von genau einer Farbe ab — deshalb färbt Salz eine Flamme gelb."
"schalenmodell.registers.lv2" = "Bohr (1913): Elektronen besetzen die Schalen K, L, M, N mit den Kapazitäten 2, 8, 18, 32 (das ist 2n²). Energie wird nur beim Schalenwechsel eines Elektrons abgegeben oder aufgenommen, und E = hf liefert die scharfen Spektrallinien des Wasserstoffs. Die Zahl der Elektronen in der äußersten Schale ist die Wertigkeit, und die Oktettregel — das Streben nach einer Edelgaskonfiguration — sagt dann Na+ und Cl- voraus."
"schalenmodell.registers.lv3" = "Bohr quantisiert den Drehimpuls per Postulat und reproduziert die Rydberg-Formel exakt für Ein-Elektronen-Systeme, E = -13,6 eV / n². Dieser Erfolg beschränkt sich auf H, He+ und Li2+; Helium scheitert von vornherein, weil ein Postulat über einzelne Bahnen keinen Platz für die Elektron-Elektron-Abstoßung hat. Sommerfelds elliptische Bahnen kurierten die Feinstruktur, ohne die eigentliche Krankheit zu heilen. Das Modell überlebt in der Schule, weil das Abzählen der Valenzschale wirklich nützlich ist, aber das planetarische Bild, das es pflanzt, hält sich nachweislich bis in die Universität, und die Register dieser Engine sollten ein Atom niemals als Sonnensystem zeichnen."
"kugelwolkenmodell.registers.lv1" = "Elektronen bewegen sich paarweise, und jedes Paar sitzt in seiner eigenen kleinen runden Wolke. Die Wolken stoßen sich gegenseitig ab, also verteilen sie sich so weit wie möglich. Vier Wolken um ein Kohlenstoffatom zeigen am Ende genau auf die vier Ecken einer Pyramidenform — und das ist tatsächlich die Form von Methan. Wasser hat zwei Wolken, die binden, und zwei, die nur Platz beanspruchen, weshalb Wasser gewinkelt statt gerade ist."
"kugelwolkenmodell.registers.lv2" = "Kimballs Ladungswolken (Kugelwolken): Jedes Elektronenpaar besetzt eine kugelförmige Wolke, die Wolken stoßen sich ab und nehmen die Anordnung mit dem größtmöglichen Abstand ein — zwei linear, drei trigonal-planar, vier tetraedrisch. Freie Elektronenpaare brauchen mehr Platz als bindende, weshalb der H-O-H-Winkel 104,5 Grad beträgt statt 109,5. Eine Doppelbindung besteht aus zwei Wolken, die sich dasselbe Atompaar teilt."
"kugelwolkenmodell.registers.lv3" = "Das schulische Kugelwolkenmodell stammt von G. E. Kimballs Ladungswolken-Bild ab und ist in moderner Sprache ein lokalisiertes sp3-Elektronenpaarmodell ohne die Mathematik; es ist ein naher Verwandter des VSEPR-Modells (des Elektronenpaar-Abstoßungsmodells) und von Linnetts Doppelquartett. Sein Wert ist real — richtige Hauptgruppengeometrie aus einer Regel, die ein Vierzehnjähriger anwenden kann —, und sein Preis ist, dass es lokalisierte Paare als physische Objekte darstellt, wodurch Delokalisierung, Photoelektronenspektren und metallische Bindung allesamt anomal statt erwartbar erscheinen."
"orbitalmodell.registers.lv1" = "Niemand kann genau sagen, wo sich ein Elektron befindet — nur, wo es sich wahrscheinlich befindet. Stell dir also statt eines Rings eine verschwommene Wolke um den Kern vor, dichter dort, wo sich das Elektron häufiger aufhält. Verschiedene Wolken haben verschiedene Formen: manche sind kugelförmig, manche sehen aus wie zwei zusammengebundene Luftballons. Diese Formen sind der Grund, warum Atome sich in bestimmte Richtungen verbinden und nicht einfach irgendwie."
"orbitalmodell.registers.lv2" = "Elektronen besetzen Orbitale — Lösungen der Schrödingergleichung mit den Bezeichnungen n, l und m —, und das Quadrat der Wellenfunktion ergibt die Aufenthaltswahrscheinlichkeit. Orbitale füllen sich nach dem Aufbauprinzip, dem Pauli-Prinzip und der Hundschen Regel, was das Periodensystem Block für Block reproduziert. Verbinden sich Atome, überlappen Atomorbitale zu bindenden und antibindenden Molekülorbitalen; die Bindungsordnung ist die halbe Differenz zwischen ihnen, und die zwei ungepaarten antibindenden Elektronen von O2 sind der Grund, warum flüssiger Sauerstoff paramagnetisch ist."
"orbitalmodell.registers.lv3" = "Das Orbitalmodell ist die Ein-Elektronen-Näherung (Hartree-Fock) an das Vielteilchenproblem: Orbitale sind Basisfunktionen einer Näherung, keine physischen Behälter. Was es grundlegend von jedem früheren Modell hier unterscheidet, ist, dass es eine Theorie seines eigenen Fehlers mitbringt und sich systematisch verbessern lässt — Post-Hartree-Fock, Dichtefunktionaltheorie, Multireferenzmethoden. Die didaktische Gefahr ist das Spiegelbild derjenigen bei Bohr: Lernende, die erfolgreich von Bahnen abrücken, verdinglichen stattdessen oft Orbitale und behandeln sie als Orte. Hier enden auch die Modelle der Schulchemie, und die Computerchemie beginnt, weshalb Kerotakis genau hier seine Grenze zieht."
"periodensystem.registers.lv1" = "Reihst du die Elemente in der richtigen Reihenfolge auf, kehren dieselben Verhaltensweisen immer wieder, wie die Wochentage. Alles in der ersten Spalte ist ein weiches Metall, das im Wasser zischt; alles in der letzten Spalte tut überhaupt nichts. Weißt du erst, in welcher Spalte etwas steht, kannst du eine Menge darüber sagen, bevor du das Glas überhaupt geöffnet hast."
"periodensystem.registers.lv2" = "Nach Ordnungszahl geordnet fallen die Elemente in 18 Gruppen und 7 Perioden. Die Gruppennummer gibt die Zahl der Valenzelektronen und damit die übliche Ionenladung an — Gruppe 1 ergibt +1, Gruppe 17 ergibt -1 —, und die Periodennummer gibt die Schale an, die gerade gefüllt wird. Der Atomradius sinkt von links nach rechts und wächst innerhalb einer Gruppe nach unten; Ionisierungsenergie und Elektronegativität verhalten sich umgekehrt. Mendelejew (1869) ließ Lücken offen und sagte Dichte und Schmelzpunkt des fehlenden Eka-Siliciums voraus; Germanium tauchte 1886 auf und passte."
"periodensystem.registers.lv3" = "Periodizität ist eine Folge, kein Axiom: Sie ergibt sich aus dem Aufbauprinzip beim Füllen von Schalen und Unterschalen, und die Periodenlängen 2, 8, 8, 18, 18, 32 sind die 2n²-Entartungen, geschnitten nach der Füllreihenfolge. Mendelejews Ordnung nach Masse war empirisch richtig und theoretisch falsch; Moseleys Röntgenarbeit von 1913 stellte fest, dass die wahre Ordnungsgröße die Kernladung ist, was die Tellur-Iod-Umkehrung klärte und feststellte, wie viele Elemente noch fehlten. Nimm das Periodensystem als Musterbeispiel der These dieses Kodex: ein Modell, dessen ganzer Wert in der Ordnung liegt und nicht in irgendeiner Tatsache, die es enthält."
"ionenbindung.registers.lv1" = "Ein Metallatom hält ein oder zwei Elektronen nur locker fest. Ein Nichtmetallatom will unbedingt eines mehr. Also gibt das Metall sie einfach ab. Jetzt ist das eine positiv und das andere negativ, und entgegengesetzte Ladungen ziehen sich an — aber nicht nur paarweise: Millionen von ihnen stapeln sich zu einem starren Gitter, plus, minus, plus, minus, in alle Richtungen. Dieses Gitter ist ein Salzkristall. Schlägst du darauf, verbeult er sich nicht, sondern spaltet sich, denn verschiebt man das Gitter um einen Schritt, kommt Plus neben Plus zu liegen, und es fliegt auseinander."
"ionenbindung.registers.lv2" = "Ein Metall überträgt Valenzelektronen an ein Nichtmetall; beide erreichen eine Edelgaskonfiguration und werden zu Ionen. Elektrostatische Anziehung in alle Richtungen baut ein Ionengitter auf, keine Moleküle — NaCl ist eine Formeleinheit, kein Teilchen. Das Gitter erklärt die Eigenschaften: starke, richtungsunabhängige Kräfte ergeben hohe Schmelzpunkte, eine Verschiebung entlang einer Gitterebene bringt gleiche Ladungen zusammen, und der Kristall spaltet; Ladung kann erst fließen, wenn sich die Ionen frei bewegen können."
"ionenbindung.registers.lv3" = "Die Ionenbindung ist der Grenzfall einer Bindung mit maximaler Ladungstrennung; ihre Energie wird von der Madelung-Summe mit einem Born-Abstoßungsterm bestimmt, und Born-Haber-Kreisprozesse zeigen, dass rein ionisch berechnete Gitterenergien bei Alkalihalogeniden gut übereinstimmen und mit steigender Polarisierbarkeit zunehmend schlechter — die Fajans-Regeln fassen diese Drift zusammen. In Lösung muss das Bild weiter gelockert werden: PHREEQC liefert Ionenpaare und neutrale Komplexe, sodass das Ideal vollständig dissoziierter Ionen nur eine Näherung für verdünnte Lösungen ist, und genau diese Aktivitätskorrekturen sind es, die der Kodex auf lv3 sichtbar macht."
"elektronenpaarbindung.registers.lv1" = "Zwei Atome, die beide mehr Elektronen wollen, können nicht beide nehmen, also teilen sie sich stattdessen. Jedes steuert ein Elektron bei, und das Paar sitzt zwischen ihnen und hält sie zusammen, wie zwei Kinder, die dasselbe Seil festhalten. Teilt man zwei oder drei Paare, ist der Griff stärker und kürzer. Auf diese Weise gebaute Stoffe bestehen aus getrennten kleinen Molekülen, zwischen denen kaum etwas zusammenhält, weshalb sie so leicht schmelzen und nie Strom leiten."
"elektronenpaarbindung.registers.lv2" = "Nichtmetallatome erreichen eine Edelgaskonfiguration, indem sie sich Elektronenpaare teilen. Geteilte Paare sind bindende Paare, ungeteilte sind freie Elektronenpaare, und die Lewis-Schreibweise macht die Zählung explizit: acht Valenzelektronen pro Atom, zwei beim Wasserstoff. Die Bindungsordnung steigt und die Bindungslänge sinkt von C-C über C=C bis zur C-Dreifachbindung-C. Die starke Anziehung liegt innerhalb des Moleküls, weshalb Schmelzen und Sieden — die nur Moleküle voneinander trennen — bei niedrigen Temperaturen stattfinden."
"elektronenpaarbindung.registers.lv3" = "Lewis (1916) geht der Quantenmechanik voraus und bleibt das meistgenutzte Modell der Chemie, weil die Buchführung über Elektronenpaare für Hauptgruppenverbindungen eine außergewöhnlich gute Näherung ist. Sein eigentlicher Status ist der einer lokalisierten Bindungsnäherung an die Molekülorbitalbeschreibung, gültig überall dort, wo sich diese Beschreibung lokalisieren lässt; wo das nicht der Fall ist — beim Triplett-Grundzustand von O2, bei Benzol, bei Hypervalenz, bei Radikalen, bei Metallen — sind die Fehler systematisch, nicht zufällig. Zu beachten ist auch, dass die in Schulbüchern gelehrte d-Orbital-Erklärung von SF6 in der modernen rechnerischen Literatur zugunsten einer ionisch-kovalenten Resonanz mit geringer d-Beteiligung abgelehnt wird."
"metallbindung.registers.lv1" = "In einem Metall lassen die Atome ihre äußersten Elektronen los, die dann frei durch das ganze Stück wandern — eine Art elektrischer Klebstoff, der überall zugleich ist. Weil dieser Klebstoff nicht zwischen festen Partnern sitzt, kannst du das Metall flach hämmern, und es hält zusammen, statt zu zersplittern. Und weil die losen Elektronen wandern können, tragen sie Strom und Wärme von einem Ende zum anderen."
"metallbindung.registers.lv2" = "Metallatome geben ihre Valenzelektronen in ein delokalisiertes Elektronengas ab; die entstehenden Kationen (Atomrümpfe) sitzen in einem dicht gepackten Gitter, zusammengehalten durch ihre Anziehung zu diesem Gas. Bewegliche Elektronen tragen Strom und Wärme. Die Bindung ist richtungsunabhängig, sodass Schichten von Kationen aneinander vorbeigleiten können, ohne je gleiche Ladungen zusammenzubringen — Metalle verformen sich, wo Ionenkristalle spalten."
"metallbindung.registers.lv3" = "Dies ist Drudes freies Elektronengas (1900), von Sommerfeld mit der Fermi-Dirac-Statistik korrigiert — ohne die das Modell eine elektronische Wärmekapazität vorhersagt, die etwa hundertmal zu groß ist. Selbst korrigiert kann es keine Bandlücke erzeugen: Die Unterscheidung Metall / Halbleiter / Isolator erfordert das periodische Gitterpotential, das Blochsche Theorem und die Bändertheorie. Die Schulchemie hört beim Elektronensee auf, weil die Bändertheorie zur Festkörperphysik gehört, und diese Grenze zu benennen verhindert, dass der Elektronensee für das letzte Wort gehalten wird."
"elektronegativitaet-kontinuum.registers.lv1" = "In einem geteilten Elektronenpaar zieht fast immer ein Atom stärker als das andere. Ziehen beide etwa gleich stark, ist das Teilen fair. Zieht eines etwas stärker, wird dieses Ende leicht negativ, während das andere leicht positiv wird, weshalb Wasser so gut an sich selbst haftet. Zieht eines stark genug, wird gar nicht mehr geteilt — es wird genommen, und du hast ein Salz gemacht. Teilen und Nehmen sind also nicht zwei verschiedene Dinge. Sie sind die beiden Enden einer Skala, und alles Reale liegt irgendwo dazwischen."
"elektronegativitaet-kontinuum.registers.lv2" = "Die Elektronegativität (chi) misst, wie stark ein Atom an einem bindenden Paar zieht. Sie steigt zum oberen rechten Rand des Periodensystems hin: F 4,0, O 3,5, Cl 3,0, H 2,1, Na 0,9 auf der Pauling-Skala. Eine Differenz nahe null ergibt eine unpolare kovalente Bindung; eine mäßige Differenz ergibt eine polare kovalente Bindung mit Teilladungen; eine große Differenz ergibt eine Ionenbindung. Trägt man die Differenz gegen den Mittelwert auf, erhält man das Bindungsdreieck, mit der metallischen Bindung in der Ecke niedriger Elektronegativität: ein einziges Diagramm, das alle drei Bindungsmodelle zugleich enthält."
"elektronegativitaet-kontinuum.registers.lv3" = "Pauling definierte chi 1932 thermochemisch aus der Überschussenergie heteronuklearer Bindungen; Mulliken aus dem Mittelwert von Ionisierungsenergie und Elektronenaffinität; Allen aus Konfigurationsenergien freier Atome. Das van-Arkel-Ketelaar-Dreieck trägt die Differenz gegen den Mittelwert auf und wurde in den 1990er Jahren von Sproul, Jensen und Allen quantitativ gemacht. Behandle jede darauf gezogene Grenze als Konvention. Der Wert dieses Bildes liegt darin, dass Lernende, die Ionenbindung, kovalente Bindung und metallische Bindung als drei getrennte Geschichten kennengelernt haben, nun eine einzige Familie mit zwei Parametern sehen können, in der jede reale Bindung alle drei Charaktere in einem gewissen Verhältnis besitzt."
"zwischenmolekulare-kraefte.registers.lv1" = "Innerhalb eines Moleküls halten die Atome sehr fest zusammen. Aber Moleküle haften auch aneinander, viel schwächer, wie Magnete, die nur mäßig interessiert sind. Kochendes Wasser reißt Wassermoleküle nicht auseinander — es zieht sie nur voneinander weg, und jedes Molekül verlässt die Flüssigkeit unversehrt. Moleküle, die stärker aneinander haften, brauchen mehr Wärme, bevor sie loslassen. Und Dinge lösen sich in dem, woran sie haften: Zucker in Wasser, Fett in Benzin, nie Fett in Wasser."
"zwischenmolekulare-kraefte.registers.lv2" = "Zwischen Molekülen wirken, in aufsteigender Stärke bei vergleichbar großen Molekülen: Van-der-Waals-Kräfte bzw. London-Dispersionskräfte (immer vorhanden, wachsend mit Größe und Oberfläche), Dipol-Dipol-Kräfte (in polaren Molekülen) und Wasserstoffbrückenbindungen (Wasserstoff gebunden an N, O oder F, trifft auf ein freies Elektronenpaar). Beim Sieden werden diese überwunden, nicht die kovalenten Bindungen, weshalb Wasser bei 100 Grad siedet und H2S bei minus 60, und weshalb Wasserstoffbrücken, die ein offenes sechseckiges Gitter halten, Eis weniger dicht machen als Wasser. Gleiches löst sich in Gleichem ist dieselbe Idee, angewandt auf das Mischen."
"zwischenmolekulare-kraefte.registers.lv3" = "Zusammen die Van-der-Waals-Kräfte: Die London-Dispersion ist ein Korrelationseffekt momentaner Multipole, der mit r hoch minus sechs skaliert und mit der Polarisierbarkeit wächst; Keesom- und Debye-Terme decken Dipol-Dipol- und Dipol-induzierter-Dipol-Wechselwirkungen ab; die Wasserstoffbrückenbindung ist teils elektrostatisch und teils Ladungstransfer und keineswegs nur eine starke Dipolwechselwirkung. Zwei Vorbehalte, die es zu lehren lohnt: Die Dispersion ist nicht die schwache Kraft — sie macht Iod zu einem Feststoff und HCl zu einem Gas —, und der hydrophobe Effekt ist ein entropisches Phänomen im Wasser und keine Anziehung zwischen den gelösten Stoffen. Quantitativ ist dies die Domäne von Aktivitätsmodellen und Zustandsgleichungen wie UNIFAC und PC-SAFT."
"massenerhaltung.registers.lv1" = "Was du am Anfang hast, hast du am Ende immer noch, auch wenn es so aussieht, als wäre es verschwunden. Verbrenne eine Kerze in einem verschlossenen Glas und wiege das Glas: genau dasselbe wie vorher. Machst du es offen, scheint es leichter zu werden, aber nur, weil der neue Stoff als unsichtbares Gas davongeschwebt ist. In der Chemie verschwindet nie wirklich etwas — es bewegt sich nur oder wechselt seine Kleidung."
"massenerhaltung.registers.lv2" = "In einem geschlossenen System ist die Gesamtmasse vor einer Reaktion gleich der Gesamtmasse danach (Lavoisier, 1789), weil Atome nur umgeordnet und nie erzeugt oder vernichtet werden. Genau das behauptet eine ausgeglichene Reaktionsgleichung: dieselbe Anzahl jedes Elements auf beiden Seiten. Scheinbare Verstöße sind offene Systeme — brennendes Magnesium gewinnt die Masse des Sauerstoffs aus der Luft hinzu, und Kalkstein in Säure verliert die Masse des entweichenden Kohlenstoffdioxids."
"massenerhaltung.registers.lv3" = "Lavoisiers Gesetz war eine experimentelle Behauptung, die erst durch das verschlossene Gefäß und die Analysenwaage möglich wurde, und was es verdrängte, war keine Tatsache, sondern eine Buchführung: das Phlogiston. Streng genommen ist die erhaltene Größe Masse-Energie, und der Massendefekt einer chemischen Reaktion liegt bei etwa einem Teil in zehn Milliarden, weshalb die Chemie so aufgebaut werden konnte, als wäre Masse für sich allein erhalten. In dieser Engine ist die Massenbilanz ein Eigenschaftstest und keine Doktrin, und dass die Waage nach einem Aufbrausen weniger anzeigt, ist eine berechnete Beobachtung und kein Versprechen eines Lehrbuchautors."
"donator-akzeptor.registers.lv1" = "Eine riesige Zahl von Reaktionen besteht darin, dass eine Sache einer anderen etwas übergibt. Manchmal ist das, was übergeben wird, ein Proton, ein winziger positiver Atomrest: Das ist eine Säure, die an eine Base gibt. Manchmal ist es ein Elektron: Das ist es, was Rosten, Verbrennen und Batterien sind. So oder so gibt es immer einen Geber und einen Nehmer, und man kann nie das eine ohne das andere haben — niemand übergibt etwas an niemanden."
"donator-akzeptor.registers.lv2" = "Zwei Reaktionsfamilien, ein Muster. Säure-Base: ein Protonendonator und ein Protonenakzeptor, die korrespondierende Paare HA/A- und B/BH+ bilden. Redox: ein Elektronendonator (das Reduktionsmittel) und ein Elektronenakzeptor (das Oxidationsmittel), wiederum in korrespondierenden Paaren Red/Ox. Beide werden als zwei Teilreaktionen geschrieben, die ohne Rest aufgehen müssen, und in beiden liest man die Richtung an einer Stärketabelle ab — pKa für Protonen, Standardpotential für Elektronen."
"donator-akzeptor.registers.lv3" = "Das Donator-Akzeptor-Prinzip ist die ausdrückliche Vereinheitlichung des deutschen Curriculums und eine strukturelle Einsicht, keine Eselsbrücke: Beide Familien sind Übertragungsgleichgewichte, beschrieben durch eine Intensitätsgröße — pH für Protonen, pe oder Eh für Elektronen — und eine Kapazitätsgröße, die Pufferintensität oder das Redoxpuffervermögen. Seine Grenzen sind ebenso strukturell. Die Elektronenaktivität ist formal, und natürliche Systeme befinden sich häufig im Redox-Ungleichgewicht, sodass verschiedene Redoxpaare in derselben Wasserprobe unterschiedliche Potentiale implizieren, eine Diskrepanz, die in der Grundwasserliteratur dokumentiert ist. Lewis verallgemeinert das Muster einen Schritt weiter, auf Elektronenpaare, womit auch die Komplexbildung zu derselben Familie gehört."
"stossmodell.registers.lv1" = "Nichts kann reagieren, ohne dass die Teilchen tatsächlich zusammenstoßen — und ein sanfter Stoß reicht nicht. Es muss ein harter Stoß sein, und aus der richtigen Richtung. Alles, was Stöße häufiger oder härter macht, beschleunigt also die Reaktion: mehr Gedränge, mehr Wärme, oder zu Pulver zermahlen, sodass mehr Oberfläche zum Anstoßen da ist. Deshalb bleibt ein Klumpen Mehl einfach liegen, während eine Mehlstaubwolke eine Mühle in die Luft jagen kann."
"stossmodell.registers.lv2" = "Teilchen reagieren nur, wenn sie zusammenstoßen, und nur, wenn der Stoß mindestens die Aktivierungsenergie mitbringt und die richtigen Teile zusammenbringt. Die Geschwindigkeit steigt daher mit der Konzentration und dem Druck (mehr Stöße pro Sekunde), mit der Temperatur (ein weit größerer Anteil der Stöße überwindet die Aktivierungsenergie, wegen des Ausläufers der Maxwell-Boltzmann-Verteilung) und mit der Oberfläche. Ein Katalysator eröffnet einen Weg mit niedrigerer Aktivierungsenergie, sodass mehr der gleichen Stöße erfolgreich sind."
"stossmodell.registers.lv3" = "Die einfache Stoßtheorie liefert eine Geschwindigkeitskonstante der Form Z mal sterischer Faktor mal exp(-Ea/RT), wobei Z die Stoßfrequenz harter Kugeln ist und der Exponentialterm der Maxwell-Boltzmann-Anteil oberhalb der Barriere. Sie ist bestenfalls halbquantitativ: Bei allem, was über Atom-Atom-Reaktionen hinausgeht, kann der sterische Faktor ein Hunderttausendstel betragen und wird von der Theorie nicht vorhergesagt — genau die Lücke, die die Theorie des Übergangszustands schließt, indem sie ihn durch eine Aktivierungsentropie ersetzt. Es lohnt sich, das ausdrücklich zu sagen: Die Regel Geschwindigkeit verdoppelt sich alle zehn Grad entspricht bei Raumtemperatur einer Aktivierungsenergie von etwa 50 kJ/mol und ist eine Faustregel, kein Gesetz."
"energieprofil.registers.lv1" = "Zeichne die Reaktion als einen Hügel. Du startest auf der einen Seite und kommst auf der anderen an. Wie hoch der Hügel ist, sagt dir, wie schwer es ist, überhaupt loszukommen — deshalb braucht ein Feuer ein Streichholz, obwohl das Verbrennen Wärme abgibt. Wo du ankommst, sagt dir, ob Wärme herauskommt — du bist tiefer gelandet — oder hineingesteckt werden muss. Ein Katalysator gräbt einen Tunnel durch den Hügel: gleicher Start, gleiches Ziel, ein viel leichterer Weg."
"energieprofil.registers.lv2" = "Trage die Energie gegen die Reaktionskoordinate auf: Edukte auf einem Niveau, Produkte auf einem anderen, und dazwischen ein Maximum, der aktivierte Komplex oder Übergangszustand. Der Anstieg von den Edukten zu diesem Maximum ist die Aktivierungsenergie; der Unterschied zwischen Edukten und Produkten ist die Enthalpieänderung, negativ, wenn Wärme freigesetzt wird. Die Rückreaktion muss die Aktivierungsenergie plus diese Differenz erklimmen. Ein Katalysator senkt die Barriere für beide Richtungen gleichermaßen, beschleunigt also die Annäherung an das Gleichgewicht, ohne dessen Lage zu verschieben."
"energieprofil.registers.lv3" = "Das Diagramm ist ein Schnitt durch eine Potentialenergiefläche entlang des Pfads minimaler Energie, und das Maximum ist ein Sattelpunkt erster Ordnung mit genau einer imaginären Schwingungsfrequenz — genau das, was eine rechnerische Überprüfung tatsächlich testet, zusammen mit einer Prüfung der intrinsischen Reaktionskoordinate. Die Theorie des Übergangszustands schreibt die Geschwindigkeitskonstante in Begriffen der freien Aktivierungsenthalpie, weshalb die Aktivierungsentropie in dieses Bild gehört, obwohl das Bild keine Achse dafür hat, und weshalb Schuldiagramme, die mit Energie beschriftet sind, als freie Energie gelesen werden sollten, sobald mit ihnen über die Geschwindigkeit argumentiert wird."
"chemisches-gleichgewicht.registers.lv1" = "Manche Reaktionen werden nie fertig. Sie laufen gleichzeitig vorwärts und rückwärts, und nach einer Weile laufen beide Richtungen genau gleich schnell — sodass sich die Mengen nicht mehr ändern, obwohl nichts aufgehört hat. Es sieht wie das Ende aus, ist aber eher wie eine belebte Rolltreppe, auf der genauso viele Leute hoch- wie runterlaufen. Wie weit eine Reaktion kommt, bevor das passiert, ist bei jeder Reaktion anders."
"chemisches-gleichgewicht.registers.lv2" = "Eine umkehrbare Reaktion erreicht ein dynamisches Gleichgewicht: Hin- und Rückreaktionsgeschwindigkeit werden gleich, sodass die Konzentrationen konstant werden — konstant, nicht gleich. Das Massenwirkungsgesetz liefert eine Gleichgewichtskonstante K als Verhältnis der Produkt- zu den Eduktkonzentrationen, jeweils hoch ihrem Koeffizienten, festgelegt bei einer gegebenen Temperatur. K viel größer als eins bedeutet, die Produkte dominieren; viel kleiner als eins bedeutet, die Edukte dominieren. Sonderfälle tragen eigene Namen: Ka für schwache Säuren, Kw für Wasser, Ksp für schwerlösliche Salze."
"chemisches-gleichgewicht.registers.lv3" = "Thermodynamisch ist K keine empirische Zusammenfassung, sondern eine Folge — die freie Standardreaktionsenthalpie in einer anderen Währung —, und ihre Temperaturabhängigkeit folgt der van-'t-Hoff-Gleichung. Korrekt geschrieben ist K ein Verhältnis von Aktivitäten, und bei Kerotakis hört das auf, eine Fußnote zu sein: Die Engine berechnet Aktivitäten neben Molalitäten, sodass der bedingte pKa2 von Phosphat bei einer Ionenstärke nahe 0,25 etwa 6,65 anzeigt, wo die Lehrbuchtabelle 7,2 sagt. Die Lehrbuchkonstante und das pH-Messgerät sind tatsächlich uneinig, und das Modell sagt, welche Seite welche ist. Gleichgewicht ist zudem ein klassisches Schwellenkonzept — transformativ, integrativ, unumkehrbar und nachweislich schwer verständlich —, wobei die beiden hartnäckigen Fehlvorstellungen sind, dass die Geschwindigkeiten aufhören und dass die Konzentrationen gleich werden."
"le-chatelier.registers.lv1" = "Störst du eine Reaktion, die sich eingependelt hat, verschiebt sie sich, um einen Teil deiner Störung wieder auszugleichen. Nimmst du etwas weg, bildet sie mehr davon nach. Quetschst du ein Gasgemisch zusammen, verschiebt es sich zu der Seite, die weniger Platz braucht. Erhitzt du es, verschiebt es sich in die Richtung, die Wärme aufnimmt. Es macht deine Änderung nie vollständig rückgängig — es drückt nur ein wenig dagegen."
"le-chatelier.registers.lv2" = "Prinzip vom kleinsten Zwang: Ein System im Gleichgewicht, dem ein Zwang auferlegt wird, reagiert so, dass es diesen Zwang verringert. Mehr Edukt verschiebt die Lage in Richtung der Produkte; höherer Druck verschiebt sie zur Seite mit weniger Gasmolekülen; höhere Temperatur begünstigt die endotherme Richtung. Ein Katalysator ändert weder die Lage noch K. Haber-Bosch ist der klassische Kompromiss — hoher Druck hilft der Ausbeute, niedrige Temperatur würde ihr auch helfen, zerstört aber die Geschwindigkeit, sodass die Anlage heiß mit einem Katalysator läuft, entgegen dem Rat des Prinzips."
"le-chatelier.registers.lv3" = "Die strenge Aussage ist thermodynamisch: Bei konstanter Temperatur und konstantem Druck verschiebt sich ein System so, dass seine Gibbs-Energie sinkt, und die Richtung nach jeder Störung folgt aus dem Vergleich des Reaktionsquotienten mit der Gleichgewichtskonstante. Die qualitative Form hat echte Gegenbeispiele — die Zugabe eines bereits im Überschuss vorhandenen Edukts kann bei konstantem Druck den Stoffmengenanteil des Produkts senken, und die Zugabe eines Inertgases bei konstantem Volumen bewirkt gar nichts —, weshalb man sie am besten als Heuristik mit einem angegebenen Gültigkeitsbereich behandelt. Sie zusammen mit ihrem Gegenbeispiel zu lehren, ist der Punkt: Es ist der kleinste klare Fall einer Regel, die so lange funktioniert, bis man sagen kann, wann sie es nicht tut."
"stoffmenge.registers.lv1" = "Atome sind viel zu klein, um sie einzeln zu zählen, also zählen Chemiker sie durch Wiegen — so wie du Reis kiloweise kaufst statt Korn für Korn, oder Eier im Dutzend statt einzeln. Ein Mol ist einfach ein sehr großes Dutzend: Es sagt, wie viele Teilchen du in einem bestimmten Gewicht eines Stoffes bekommst, und diese Zahl ist für jeden Stoff dieselbe. Das ist der ganze Trick. Wiege Gramm, kenne die Anzahl der Teilchen."
"stoffmenge.registers.lv2" = "Das Mol ist die SI-Einheit der Stoffmenge: Ein Mol enthält 6,02214076 mal zehn hoch dreiundzwanzig festgelegte Teilchen. Die molare Masse in Gramm pro Mol ist zahlenmäßig gleich der relativen Atom- oder Molekülmasse, sodass die Division einer Masse durch eine molare Masse etwas Wägbares in etwas Zählbares umwandelt. Die Koeffizienten einer Reaktionsgleichung sind Molverhältnisse, weshalb 24 g Magnesium 16 g Sauerstoff brauchen und nicht dieselbe Masse."
"stoffmenge.registers.lv3" = "Seit der SI-Revision von 2019 wird das Mol durch die exakte Festlegung der Avogadro-Konstante definiert, was es vom Kilogramm und von Kohlenstoff-12 entkoppelte; die molare Masse von Kohlenstoff-12 beträgt jetzt nur noch innerhalb einer kleinen gemessenen Unsicherheit 12 g/mol. Didaktisch ist es das Lehrbuch-Schwellenkonzept schlechthin: transformativ, da vor ihm nichts Quantitatives möglich ist und danach alles; integrativ, da es Formel, Gleichung, Masse und Volumen verbindet; unumkehrbar; und schwer verständlich, da Lernende zuverlässig die Rechnung ausführen, ohne eine kohärente Vorstellung davon zu haben, was ein Mol ist, und es mal als Masse, mal als Volumen, mal als Anzahl von Gramm behandeln. Die Gegenmaßnahme dieses Kodex ist, die Rechnung tragend zu machen: Die Zahl, die du herleitest, ist die Zahl, die das Becherglas zeigen wird."
"stoechiometrie.registers.lv1" = "Ein Rezept sagt: zwei Eier und 100 g Mehl ergeben acht Pfannkuchen. Die Chemie funktioniert genauso: Die Reaktionsgleichung ist das Rezept, also kannst du, sobald du sie hast, genau ausrechnen, wie viel du brauchst und wie viel du bekommst. Und wenn du nur ein Ei hast, ist es egal, wie viel Mehl im Schrank ist — du bekommst vier Pfannkuchen. Was zuerst ausgeht, entscheidet alles."
"stoechiometrie.registers.lv2" = "Die Koeffizienten einer ausgeglichenen Reaktionsgleichung sind Molverhältnisse, sodass sich die Stoffmenge jedes Stoffes aus der Stoffmenge jedes anderen ergibt. Die Minderheitskomponente (der limitierende Reaktionspartner) ist die mit der kleinsten Stoffmenge geteilt durch ihren Koeffizienten; alles andere liegt im Überschuss vor. Die prozentuale Ausbeute ist die tatsächliche geteilt durch die theoretische Ausbeute; die Atomökonomie ist die Masse des gewünschten Produkts als Anteil an der Gesamtmasse aller Produkte. Das sind zwei verschiedene Fragen zu derselben Reaktion, und eine Reaktion kann bei der einen gut und bei der anderen schlecht abschneiden."
"stoechiometrie.registers.lv3" = "Stöchiometrie ist lineare Algebra über der Elementzusammensetzungsmatrix: das Ausgleichen einer Reaktionsgleichung ist das Auffinden eines Vektors im Nullraum, und die Anzahl unabhängiger Reaktionen in einem Gemisch ist der Rangdefekt dieser Matrix. Das didaktische Risiko hier ist dokumentiert, nicht bloß vermutet — Algorithmen des proportionalen Schließens können von Lernenden korrekt ausgeführt werden, die nicht sagen können, was ein limitierender Reaktionspartner ist, sodass Erfolg bei der Rechnung ein schwacher Beleg für Verständnis ist. Predict-Observe-Explain ist die Gegenmaßnahme dieses Kodex: erst auf die Zahl festlegen, dann den Solver entscheiden lassen."
"konzentration.registers.lv1" = "Es reicht nicht zu wissen, was im Wasser ist — du musst wissen, wie dicht gedrängt es ist. Ein Löffel Zucker in einer Tasse ist süß; derselbe Löffel in einer Badewanne ist überhaupt nichts. Konzentration ist genau dieses Gedränge, und sie entscheidet, ob etwas stark schmeckt, ob es wirkt und ob es gefährlich ist."
"konzentration.registers.lv2" = "Die Stoffmengenkonzentration ist Stoffmenge geteilt durch Volumen der Lösung, in mol/L. Lösungsmittel zuzugeben ändert die Stoffmenge des gelösten Stoffes nicht, was die Verdünnungsformel ergibt: Das Produkt aus Konzentration und Volumen ist vorher und nachher gleich. Die Titration nutzt das direkt — am Äquivalenzpunkt sind die Stoffmengen von Säure und Base gleich, sodass sich die unbekannte Konzentration aus der Konzentration der Maßlösung und den beiden Volumina ergibt."
"konzentration.registers.lv3" = "Unterscheide drei Größen, die die Schulchemie zusammenwirft: die Konzentration (pro Liter Lösung, temperaturabhängig), die Molalität (pro Kilogramm Lösungsmittel, temperaturunabhängig, die thermodynamische Wahl) und die Aktivität, die eigentlich in Gleichgewichtskonstanten und Elektrodenpotentialen steht. Der Aktivitätskoeffizient stammt aus einem Modell mit einem angegebenen Gültigkeitsbereich, und Kerotakis macht sowohl die Zahl als auch das Modell sichtbar — stellt man dieselbe Salzlaugenfrage an drei Datenbanken, sind sie sich uneinig, wie viel Salz ungelöst bleibt, jede Antwort mit dem dahinterstehenden Aktivitätsmodell beschriftet. Diese Uneinigkeit ist kein zu verbergender Mangel; sie ist eine Modellgrenze, die sichtbar wird, indem man das Modell über sie hinaustreibt."
"arrhenius.registers.lv1" = "Manche Flüssigkeiten schmecken sauer und zischen auf Metallen; andere fühlen sich glitschig und seifig an. Die sauren geben einen besonderen positiven Rest ins Wasser, und die seifigen geben einen Rest hinzu, der ihn genau aufhebt. Mischst du die richtigen Mengen, verschwinden beide, und übrig bleibt Salzwasser. Das ist es, was neutral bedeutet — und im Labor probierst du nie etwas, um das herauszufinden."
"arrhenius.registers.lv2" = "Arrhenius (1887): Eine Säure dissoziiert in Wasser unter Bildung von H+, eine Base unter Bildung von OH-. Salzsäure ergibt H+ und Cl-; Natronlauge ergibt Na+ und OH-. Jede Neutralisation ist dann dieselbe Reaktion, H+ plus OH- zu Wasser, wobei die übrigen Ionen ein Salz bilden. Die Säurestärke ist das Ausmaß dieser Dissoziation, weshalb Salzsäure bei gleicher Konzentration weit besser leitet als Essigsäure."
"arrhenius.registers.lv3" = "Arrhenius' Theorie der elektrolytischen Dissoziation war 1887 radikal genug, um ihn beinahe seine Doktorwürde zu kosten, und brachte ihm 1903 den Nobelpreis ein; ihre Stärke war quantitativ, da Leitfähigkeitsdaten und kolligative Anomalien beide aus derselben Idee folgten. Ihre Grenze ist strukturell und nicht zufällig: Da sie Acidität als Eigenschaft eines in Wasser gelösten Stoffes definiert, kann sie einen Protonenübergang nicht beschreiben, weshalb die Basizität von Ammoniak in ihr keine Erklärung findet und weshalb das Folgende ein Themenwechsel ist und keine Erweiterung."
"broensted-lowry.registers.lv1" = "Vergiss sauer und seifig. Eine Säure ist alles, was ein Proton — ein winziges positives Teilchen — abgibt, und eine Base ist alles, was eines aufnimmt. Säure zu sein ist also nicht etwas, das ein Stoff ist, sondern etwas, das er tut, und mit einem anderen Partner kann derselbe Stoff das Gegenteil tun. Wasser tut beides: Es gibt Protonen an Ammoniak ab und nimmt sie von Essig auf."
"broensted-lowry.registers.lv2" = "Brønsted und Lowry (1923): Eine Säure ist ein Protonendonator, eine Base ein Protonenakzeptor, und jede Säure-Base-Reaktion ist ein Protonenübergang zwischen zwei korrespondierenden Paaren. Ammoniak plus Wasser ergibt Ammonium plus Hydroxid, ohne dass im Ammoniak Hydroxid nötig wäre. Wasser ist amphoter. Ka und sein negativer Logarithmus pKa messen, wie weit der Übergang zum Wasser geht, sodass sich die Richtung jedes Protonenübergangs direkt aus einer pKa-Tabelle ablesen lässt: von der stärkeren Säure zur stärkeren Base."
"broensted-lowry.registers.lv3" = "Dies ist der Protonenübergang des deutschen Curriculums und, zusammen mit der Redoxreaktion, der Standardfall des Donator-Akzeptor-Musters. Sein struktureller Fortschritt besteht darin, dass Acidität zur Eigenschaft eines Paares statt einer Verbindung wird, was es erlaubt, korrespondierende Paare, Puffer und den nivellierenden Effekt in einer einzigen Sprache auszudrücken. Zwei Verfeinerungen gehören auf dieses Niveau: Das Proton im Wasser ist nicht frei, und die Oxonium-Formulierung selbst ist eine Vereinfachung von Eigen- und Zundel-Strukturen; und tabellierte Ka-Werte sind thermodynamische Konstanten bei unendlicher Verdünnung, die erst in bedingte Konstanten bei realer Ionenstärke umgerechnet werden müssen, bevor sie zu einem Messgerät passen."
"lewis-saeure-base.registers.lv1" = "Die tiefste Version von Säure hat überhaupt nichts mit Protonen zu tun. Manche Atome haben ein übriges Elektronenpaar anzubieten, und manche haben eine leere Stelle, in die eines passen würde. Bringt man sie zusammen, zieht das Paar ein und bildet eine Bindung allein aus den Elektronen eines Partners. Ein Proton ist einfach das kleinste Ding, das es gibt, mit einer leeren Stelle — die älteren Regeln waren also die ganze Zeit ein Spezialfall dieser hier."
"lewis-saeure-base.registers.lv2" = "Lewis (1923): Eine Säure nimmt ein Elektronenpaar auf, eine Base gibt eines ab, und das Ergebnis ist eine koordinative Bindung. Bortrifluorid plus Ammoniak ist eine Säure-Base-Reaktion ganz ohne Proton. H+ passt als Grenzfall in die Definition. Sie erklärt auch, warum Lösungen von Al3+ und Fe3+ sauer sind — das Metallion ist eine Lewis-Säure, die ihre Wasserliganden polarisiert, bis einer von ihnen ein Proton abgibt — und warum Komplexbildung, Katalyse und nukleophiler Angriff alle dieselbe Art von Ereignis sind."
"lewis-saeure-base.registers.lv3" = "Lewis subsumiert Brønsted, das wiederum Arrhenius subsumiert; Usanovichs breitere Definition subsumiert Lewis ihrerseits und wird nicht verwendet, weil sie die Unterscheidung völlig auflöst. Die praktische Schwäche ist das Fehlen einer universellen Skala: Lewis-Acidität ist basenabhängig, empirisch erfasst durch Pearsons HSAB-Prinzip (hart und weich) und durch Drago-Wayland-Parameter statt durch eine einzige Zahl. Dies ist auch der klarste Fall im Curriculum einer Modellabfolge, die eine Verallgemeinerung ist und keine Korrektur — Arrhenius ist innerhalb von Wasser nicht falsch, es ist ein Spezialfall —, und dieser Unterschied verdient es, laut benannt zu werden, weil Lernende sonst schließen, jedes frühere Modell sei schlicht falsch gewesen."
"enthalpie.registers.lv1" = "Reaktionen ändern nicht nur, was Dinge sind, sie ändern auch, wie heiß Dinge sind. Manche geben Wärme ab, sodass das Becherglas wärmer wird: Verbrennen, und die Wärmepacks, die du zum Handwärmen knickst. Manche nehmen Wärme auf, sodass das Becherglas kalt genug wird, um eine Pfütze auf der Labor festzufrieren — das ist, was ein Kältepack ist. Auseinanderziehen kostet immer Energie, und Zusammenfügen gibt immer Energie zurück, und was größer ist, entscheidet, ob es wärmer oder kälter wird."
"enthalpie.registers.lv2" = "Die Reaktionsenthalpie ist die bei konstantem Druck ausgetauschte Wärme: negativ, wenn Wärme freigesetzt wird, positiv, wenn sie aufgenommen wird. Sie ist eine Zustandsgröße, sodass der Hesssche Satz erlaubt, sie über jeden beliebigen Weg zu addieren, und Standardbildungsenthalpien erlauben, den Wert jeder Reaktion als Produkte minus Edukte zu bestimmen. Aus Bindungen geschätzt, ist sie die Energie der gebrochenen Bindungen minus die Energie der gebildeten Bindungen."
"enthalpie.registers.lv3" = "Die Enthalpie ist die innere Energie plus Druck mal Volumen, und ihre Änderung entspricht der bei konstantem Druck ausgetauschten Wärme für ein geschlossenes System, das nur Volumenarbeit verrichtet. Der Hesssche Satz ist eine Folge davon, dass sie eine Zustandsgröße ist, und der ganze tabellierte Apparat der Thermochemie ruht auf genau dieser einen Eigenschaft. Ihre Temperaturabhängigkeit folgt aus der Differenz der Wärmekapazitäten, was genau das ist, was die NASA-9-Polynomform kodiert: sieben Koeffizienten pro Temperaturintervall, die Wärmekapazität, Enthalpie und Entropie einer Spezies liefern. Der entscheidende didaktische Punkt hier ist negativ — Enthalpie ist nicht das Kriterium für Spontaneität, und sie dafür zu halten ist eine hartnäckig dokumentierte Fehlvorstellung, zu deren Korrektur die nächsten beiden Modelle da sind."
"entropie.registers.lv1" = "Es gibt viel mehr Möglichkeiten, gemischt zu enden, als ordentlich zu bleiben, deshalb passiert Mischen von selbst und Entmischen nie. Rührst du Milch in Kaffee, kommt sie nicht wieder heraus, egal wie lange du rührst. Wärme breitet sich aus demselben Grund aus: Es gibt mehr Möglichkeiten, das Zittern zu verteilen, als es alles in einer Ecke zu behalten. Deshalb passieren Dinge von selbst, sogar wenn dabei keine Energie freigesetzt wird."
"entropie.registers.lv2" = "Die Entropie zählt die mikroskopischen Anordnungen, aus denen ein Zustand bestehen kann. Sie steigt, wenn Gase entstehen, wenn Feststoffe sich lösen, und immer, wenn sich etwas mischt. Der zweite Hauptsatz besagt, dass die Entropie des Universums bei einem freiwilligen Vorgang nie abnimmt, was bedeutet, dass die Änderung des Systems plus die Änderung der Umgebung positiv sein muss. So kann ein endothermes Lösen dennoch von selbst ablaufen: Das System gewinnt mehr Entropie, als die Umgebung durch die Abgabe der Wärme verliert."
"entropie.registers.lv3" = "Boltzmanns statistische Definition und Clausius' thermodynamische sind die zwei Gesichter derselben Größe, und der dritte Hauptsatz legt den Nullpunkt fest — weshalb absolute Entropien tabelliert werden, während Enthalpien auf die Bildung bezogen werden müssen. Lehre sie als die Verteilung von Energie über zugängliche Zustände statt als Unordnung: Die Unordnungs-Metapher wird in der chemiedidaktischen Literatur gerade deshalb kritisiert, weil sie die interessanten Fälle falsch vorhersagt, von der Proteinfaltung über die hydrophobe Aggregation bis zur Kristallisation. Die reine Systemabkürzung, die alle tatsächlich benutzen, ist die Gibbs-Energie, die die gesamte Entropieänderung nur in anderer Verkleidung ist."
"gibbs-energie.registers.lv1" = "Ob etwas von selbst passiert, ist ein Wettstreit zwischen zwei Dingen: Gibt es Wärme ab, und wird es am Ende breiter verteilt. Sagen beide Ja, passiert es. Sagen beide Nein, passiert es nie. Sind sie sich uneinig, ist die Temperatur der Schiedsrichter — deshalb friert Wasser von selbst, wenn es kalt ist, und nicht, wenn es warm ist, und deshalb wird Kalkstein erst zu Branntkalk, wenn der Ofen heiß genug ist. Aber kann passieren heißt nicht wird bald passieren: Ein Diamant müsste sich eigentlich in Bleistiftmine verwandeln, tut es aber nicht, weil nichts ihn über den Hügel schiebt."
"gibbs-energie.registers.lv2" = "Die Änderung der Gibbs-Energie ist die Enthalpieänderung minus die Temperatur mal die Entropieänderung. Negativ bedeutet, die Reaktion läuft wie geschrieben freiwillig ab, positiv bedeutet, die Rückreaktion tut es, null bedeutet Gleichgewicht. Weil der Entropieterm mit der Temperatur multipliziert wird, wird eine Reaktion, die Wärme aufnimmt, aber die Entropie erhöht, oberhalb einer Umschlagtemperatur freiwillig — die Enthalpieänderung geteilt durch die Entropieänderung —, weshalb Kalkstein sich genau deshalb im Ofen zersetzt und nicht im Becherglas. Im Gleichgewicht ist die freie Standardreaktionsenthalpie durch die Gleichgewichtskonstante festgelegt, sodass freie Energie und K dieselbe Aussage in zwei Schreibweisen sind."
"gibbs-energie.registers.lv3" = "Die Gibbs-Energie ist die Enthalpie minus Temperatur mal Entropie, und bei konstanter Temperatur und konstantem Druck senkt eine freiwillige Änderung sie — das ist der zweite Hauptsatz, umgeschrieben in Größen, die allein zum System gehören. Gleichgewicht ist dann das Minimum von G unter Elementbilanz-Nebenbedingungen, und das ist eine berechenbare Aussage und keine rhetorische: Genau das tut ein Gibbs-Minimierer, und genau dazu ist PHREEQCs Massenwirkungsformulierung äquivalent. Zwei Grenzen, auf denen dieser Kodex besteht. Spontaneität ist keine Geschwindigkeit, weshalb der Thermik-Solver unterhalb von 500 K aussteigt, statt jedes Metall auf der Labor zu oxidieren. Und der Standardzustand ist eine Wahl, sodass die freie Standardreaktionsenthalpie und die tatsächliche unterschiedliche Fragen beantworten."
"thermodynamische-vs-kinetische-kontrolle.registers.lv1" = "Die Chemie hat eine Lieblingsantwort und eine schnelle Antwort, und sie sind nicht immer dieselbe. Mischst du die blaue Kupferflüssigkeit mit Abflussreiniger, bekommst du eine blassblaue Gallerte. Diese Gallerte ist nicht das, worauf sich die Chemie einigen würde, hätte sie ewig Zeit — das wäre das schwarze Pulver —, aber die Gallerte bildet sich schnell und bleibt dann einfach so liegen, denn sich in das schwarze Pulver zu verwandeln ist harte Arbeit. Erwärmst du sie, wird sie vor deinen Augen schwarz. Der größte Teil der Welt ist so: Dein Stuhl ist nicht das Stabilste, was seine Atome sein könnten, er sitzt nur fest."
"thermodynamische-vs-kinetische-kontrolle.registers.lv2" = "Zwei verschiedene Fragen: Welches Produkt hat die niedrigste freie Energie (thermodynamische Kontrolle), und welches Produkt bildet sich am schnellsten (kinetische Kontrolle). Bei niedriger Temperatur gewinnt das am schnellsten entstehende Produkt und kann unbegrenzt bestehen bleiben, weil die Barriere zur Umlagerung in das stabile Produkt weit größer ist als die verfügbare Wärmeenergie. Erhöht man die Temperatur, wird die Barriere überwindbar, und das stabile Produkt übernimmt. Cu(OH)2 gegen CuO ist der Schulfall; die Ostwaldsche Stufenregel verallgemeinert das und besagt, dass ein kristallisierendes System dazu neigt, zuerst die am wenigsten stabile Form zu durchlaufen, weil diese am leichtesten keimt."
"thermodynamische-vs-kinetische-kontrolle.registers.lv3" = "Die Unterscheidung liegt zwischen einer Zustandsgröße und einer Geschwindigkeit. Die Gleichgewichtsthermodynamik legt das Ziel fest und schweigt zum Weg, sodass eine Minimierung der freien Energie eine Frage beantwortet, die das Becherglas womöglich gar nicht stellt. Übersteigen Barrieren RT bei weitem, wird die beobachtete Zusammensetzung von den relativen Höhen der Übergangszustände bestimmt, und Curtin-Hammett-Bedingungen beschreiben, wann Produktverhältnisse diesen Barrieren folgen statt den Eduktpopulationen. Für die Fällung ist die bestimmende Größe die Keimbildung: Die klassische Keimbildungstheorie macht den kritischen Radius abhängig von der Grenzflächenenergie geteilt durch die Übersättigung, sodass die Phase mit der niedrigsten Grenzflächenenergie gegenüber der Lösung zuerst keimen kann, selbst wenn sie nicht die stabilste Volumenphase ist — die Ostwaldsche Regel quantitativ gemacht. Der wichtige erkenntnistheoretische Punkt für ein rechnendes Labor: Jede Engine, die G minimiert, ist strukturell unfähig, das zu entdecken, und muss es gesagt bekommen. Deshalb sind unsere kinetischen Schwellenwerte Daten mit Herkunftsnachweis statt Solver-Interna, und deshalb meldet das Labor die Phasen, die es absichtlich zurückhält."
"moles-from-mass.summary" = "n = m / M   ·   5,844 g NaCl ÷ 58,443 g/mol = 0,1000 mol"
"moles-from-mass.expect.predict.question" = "Du wiegst 5,844 g Kochsalz ab. Das Labor fragt, wie viele Mol das sind. Die molare Masse von Natriumchlorid beträgt 58,443 g/mol. Was meldet das Labor als Stoffmenge beim Einwiegen?"
"moles-from-mass.expect.predict.options" = ["5,844 mol — die Zahl, die du abgewogen hast", "0,1000 mol", "58,443 mol — die molare Masse", "Das hängt davon ab, in wie viel Wasser du es gibst"]
"moles-from-mass.expect.predict.misconception" = "Die letzte Option ist die häufigste: Lernende erwarten, dass sich die Stoffmenge ändert, wenn die Lösung verdünnt wird. Das tut sie nicht — n ist eine Eigenschaft der eingewogenen Probe, und nur die Konzentration hängt vom Volumen ab. Die erste Option ist der noch grundlegendere Fehler, Gramm wie Mol zu behandeln."
"moles-from-mass.expect.predict.diagnosis.0.reveals" = "Gramm und Mol werden als zwei Namen für dieselbe 'Menge' behandelt, die sich durch bloßes Umbenennen umrechnen lassen — die Waage zeigte 5,844, also sind es 5,844, in welcher Einheit auch immer gefragt ist."
"moles-from-mass.expect.predict.diagnosis.0.next" = "Wiege stattdessen 58,443 g ab und frage erneut: genau ein Mol. Ein Mol ist eine Anzahl, die über die molare Masse in Gramm bepreist wird — die Waage liest den Preis ab, niemals die Anzahl."
"moles-from-mass.expect.predict.diagnosis.1.reveals" = "Die molare Masse wird als Antwort gelesen: Die größte, offiziell wirkende Zahl auf der Seite muss die gesuchte Größe sein, und die Richtung der Division geht dabei verloren."
"moles-from-mass.expect.predict.diagnosis.1.next" = "Prüfe die Größenordnung, bevor du in irgendeine Richtung dividierst: 58 mol Salz wären dreieinhalb Kilogramm, und die Waage hält sechs Gramm. Wenn die Richtung einer Formel unklar ist, verrät die absurde Größenordnung den Fehler."
"moles-from-mass.expect.predict.diagnosis.2.reveals" = "Stoffmenge und Konzentration werden verschweißt: Verdünnt man, gibt es 'weniger Salz', also muss n mit dem Wasser schrumpfen, in dem es sitzt."
"moles-from-mass.expect.predict.diagnosis.2.next" = "Führe `concentration-is-a-ratio` aus: dieselben 5,844 g in 100 mL und in 200 mL, und beide Gefäße zeigen bei `inspect` 0,1000 mol. Nur der Wert in Mol pro Liter hat sich verändert — die abgewogene Anzahl lässt sich nicht durch Wasser verhandeln."
"moles-from-mass.registers.lv1" = "Wiegen sagt dir, wie schwer etwas ist. Zählen sagt dir, wie viele Teilchen es sind. Die Chemie braucht die Anzahl, weil Reaktionen Teilchen einander zuordnen — und die Waage ist der Weg zur Anzahl, denn jeder Stoff hat ein festes Gewicht pro Teilchen."
"moles-from-mass.registers.lv2" = "n = m / M. 5,844 g ÷ 58,443 g/mol = 0,1000 mol, und das Labor bestätigt 0,1000 mol beim Einwiegen. In 1,000 L ergibt das eine Lösung mit 0,1 mol/L; die Gesamtmasse auf der Waage, 1002,84 g, ist der Liter Wasser plus das Salz, denn nichts ist verlorengegangen."
"moles-from-mass.registers.lv3" = "Die Registry führt M = 58,443 g/mol aus den IUPAC/CIAAW-Atomgewichten von 2021, sodass die Umrechnung exakt bis zur Genauigkeit der Daten selbst ist und nicht bis zu einem gerundeten 58,5. Die 0,1000 mol gehen anschließend als Gesamtelement-Randbedingung in PHREEQC ein, und der pH-Wert von 6,98 statt 7,00 ist die Ionenstärke-Korrektur der Eigenprotolyse des Wassers, kein Artefakt."
"concentration-is-a-ratio.summary" = "c = n / V   ·   0,1000 mol in 0,100 L = 1,00 mol/L; dieselben 0,1000 mol in 0,200 L = 0,50 mol/L"
"concentration-is-a-ratio.expect.predict.question" = "Dieselben 5,844 g Salz kommen in ein Becherglas mit 100 mL und in ein anderes mit 200 mL. Welches Becherglas enthält mehr Natriumchlorid?"
"concentration-is-a-ratio.expect.predict.options" = ["Das 100-mL-Becherglas — es ist konzentrierter", "Das 200-mL-Becherglas — dort ist mehr Flüssigkeit", "Keins von beiden: Beide enthalten 0,1000 mol; nur die Konzentration unterscheidet sich"]
"concentration-is-a-ratio.expect.predict.misconception" = "Konzentration und Stoffmenge werden miteinander verschweißt. Eine starke Tasse Tee enthält nicht mehr Tee als ein schwacher Eimer davon. Das Labor trennt die beiden explizit: Beide Gefäße melden 0,1000 mol Chlorid, und die Ionenstärken unterscheiden sich um genau den Faktor zwei."
"concentration-is-a-ratio.expect.predict.diagnosis.0.reveals" = "'Konzentrierter' wird als 'mehr enthaltend' gelesen — Intensität wird mit Menge verwechselt, die starke Tasse Tee scheint mehr Tee zu enthalten als der schwache Eimer."
"concentration-is-a-ratio.expect.predict.diagnosis.0.next" = "Dampfe beide zur Trockne ein: identische Kristalle, je 5,84 g, wieder auf derselben Waage. Zwei Lösungen, die sich in allem unterscheiden, was die Zunge bemerken würde, liefern dasselbe Salz zurück — weil sich das Salz nie unterschieden hat."
"concentration-is-a-ratio.expect.predict.diagnosis.1.reveals" = "Der gelöste Stoff skaliert mit der Lösung: mehr Flüssigkeit muss mehr Stoff enthalten, als würde das Wasser Salz herstellen, um sich selbst zu füllen."
"concentration-is-a-ratio.expect.predict.diagnosis.1.next" = "Verfolge die Papierspur des Salzes: Es kam genau einmal hinzu, auf der Waage, bevor überhaupt Wasser gewählt wurde. `measure` beide Gefäße — sie unterscheiden sich um genau die Masse des zusätzlichen Wassers, und um nichts sonst."
"concentration-is-a-ratio.registers.lv1" = "Zwei Bechergläser, derselbe Löffel Salz, unterschiedliche Mengen Wasser. Das kleinere schmeckt salziger — aber es enthält nicht mehr Salz. 'Wie viel' und 'wie stark' sind zwei verschiedene Fragen, und sie zu verwechseln ist einer der leichtesten Fehler überhaupt."
"concentration-is-a-ratio.registers.lv2" = "c = n / V. 0,1000 mol in 0,100 L ergibt 1,00 mol/L; in 0,200 L ergibt es 0,50 mol/L. Das Labor meldet die Ionenstärke der beiden Lösungen mit 1,0030 m und 0,5015 m — genau die Halbierung, denn bei einem 1:1-Salz wie NaCl entspricht die Ionenstärke der Molalität."
"concentration-is-a-ratio.registers.lv3" = "Ionenstärke I = ½ Σ cᵢ zᵢ², was sich bei einem 1:1-Elektrolyten auf die Konzentration selbst reduziert; diese Identität ist der Grund, warum die beiden Zahlen wie die Konzentrationen aussehen. Der kleine Überschuss über 1,0000 (1,0030 m) ist Molalität gegen Molarität: Der Liter Lösung ist kein Liter Wasser, und PHREEQC rechnet durchgehend in Mol pro Kilogramm Wasser."
"dilution-moves-ph-by-one.summary" = "c₁V₁ = c₂V₂   ·   0,001 mol in 0,100 L → pH-Wert 2,04; dieselbe Säure in 1,000 L → pH-Wert 3,01"
"dilution-moves-ph-by-one.expect.predict.question" = "Eine Säure zeigt pH-Wert 2,04. Du gibst noch einmal die neunfache Menge Wasser dazu, sodass das Volumen jetzt zehnmal so groß ist. Was zeigt das Messgerät jetzt an?"
"dilution-moves-ph-by-one.expect.predict.options" = ["pH 3,0 — eine zehnfache Verdünnung kostet eine pH-Einheit", "pH 7,0 — Wasser ist neutral, also macht Verdünnen es neutral", "pH 20,4 — der zehnfache pH-Wert", "pH 2,04 — die Säure ist ja immer noch drin"]
"dilution-moves-ph-by-one.expect.predict.misconception" = "Zwei Fehler sind verbreitet, und beide betreffen den Logarithmus. 'Zehnmal das Volumen, zehnmal der pH-Wert' behandelt den pH-Wert, als wäre er die Konzentration; und 'Verdünnen neutralisiert' vergisst, dass keine Menge Wasser den pH-Wert 7 erreicht — man nähert sich ihm an und kommt nie dort an, weil die Säure noch vollständig vorhanden ist."
"dilution-moves-ph-by-one.expect.predict.diagnosis.0.reveals" = "Mischen mittelt die Etiketten: Wasser 'ist pH 7', also zieht genug davon die Mischung Richtung 7, so wie weiße Farbe Rot aufhellt — Neutralität als Zutat statt als Abwesenheit."
"dilution-moves-ph-by-one.expect.predict.diagnosis.0.next" = "Verdünne immer weiter, jeweils um den Faktor zehn, und lies das Messgerät bei jeder Runde ab: 3, dann 4, dann 5 — eine Einheit pro Zehnerschritt, langsam Richtung 7 kriechend und nie ankommend, weil jedes Proton, das hineinkam, immer noch dort ist."
"dilution-moves-ph-by-one.expect.predict.diagnosis.1.reveals" = "Der pH-Wert wird als proportional zu 'wie viel' behandelt: Der Logarithmus fehlt, also multipliziert das Zehnfache des Volumens den Messwert mit zehn."
"dilution-moves-ph-by-one.expect.predict.diagnosis.1.next" = "Überlege, was 20,4 überhaupt bedeuten würde: Die Skala zählt Zehnerpotenzen der Wasserstoffionen-Aktivität, weshalb die ganze Welt des Wassers zwischen etwa 0 und 14 liegt. Eine Verzehnfachung verschiebt sie um genau eine Einheit — auf 3,0, wie das Messgerät zeigt."
"dilution-moves-ph-by-one.expect.predict.diagnosis.2.reveals" = "Der pH-Wert reist mit der Säure mit wie eine Farbe: Solange die Säure existiert, bleibt ihr Etikett bestehen — Gedränge spielt beim Messwert keine Rolle."
"dilution-moves-ph-by-one.expect.predict.diagnosis.2.next" = "Führe es aus und halte beide Tatsachen zugleich fest: `inspect` zeigt dieselbe Stoffmenge Säure, und trotzdem bewegt sich das Messgerät. Der pH-Wert gehört zur Lösung, nicht zum Stoff — er bewertet, wie gedrängt die Protonen sind, nicht ob sie existieren."
"dilution-moves-ph-by-one.registers.lv1" = "Gibst du Wasser zu einer Säure, wird sie schwächer — aber sie wird nie zu Wasser. Die Säure, die du hineingegeben hast, ist immer noch da; sie hat nur mehr Platz. Auf dem Messgerät steigt die Zahl, und sie steigt um einen Schritt pro zehnfachem Schwall Wasser, nicht um zehn."
"dilution-moves-ph-by-one.registers.lv2" = "c₁V₁ = c₂V₂. 0,001 mol in 100 mL ergibt 0,01 mol/L; das Messgerät zeigt pH-Wert 2,04. Bringt man das Volumen auf 1,000 L, beträgt die Konzentration 0,001 mol/L — das Messgerät zeigt pH-Wert 3,01. Eine pH-Einheit pro Faktor zehn, weil der pH-Wert ein Logarithmus ist."
"dilution-moves-ph-by-one.registers.lv3" = "Die Stoffmenge an H⁺ bleibt über die Verdünnung hinweg exakt erhalten; was sich ändert, ist die Aktivität, und mit ihr der gemessene pH-Wert. Beachte, dass der Messwert 2,04 statt 2,00 und 3,01 statt 3,00 lautet: Bei I ≈ 0,01 m liegt der Aktivitätskoeffizient bei ≈0,90, und PHREEQC gibt den pH-Wert als −log a(H⁺) an, nicht als −log c(H⁺). Lehrbücher nehmen γ = 1 an und verlieren dabei stillschweigend diese Hundertstel."
"stoichiometric-ratio-from-the-equation.expect.predict.question" = "Verbrenne 2,40 g Magnesiumband vollständig. Die ausgeglichene Reaktionsgleichung lautet 2 Mg + O₂ → 2 MgO. M(Mg) = 24,305, M(MgO) = 40,304 g/mol. Welche Masse weißes Pulver bleibt zurück?"
"stoichiometric-ratio-from-the-equation.expect.predict.options" = ["2,40 g — die Masse bleibt erhalten", "3,98 g", "1,44 g — etwas verbrennt weg", "4,80 g — ein Sauerstoff pro Magnesium verdoppelt es"]
"stoichiometric-ratio-from-the-equation.expect.predict.misconception" = "Die erste Option ist die falsch angewendete Massenerhaltung: Masse bleibt im Universum erhalten, nicht in einem offenen Tiegel, der Sauerstoff aus dem Raum zieht. Die letzte entsteht dadurch, dass '2 Mg + O₂' so gelesen wird, als würde jedes Magnesium ein ganzes O₂ aufnehmen statt eines halben."
"stoichiometric-ratio-from-the-equation.expect.predict.diagnosis.0.reveals" = "Die Erhaltung wird auf den Tiegel angewendet statt auf das System: Was die Waage zu Beginn sah, ist alles, was es gibt, und das unsichtbare Edukt, das aus dem Raum gezogen wird, hat keine Zeile im Buch."
"stoichiometric-ratio-from-the-equation.expect.predict.diagnosis.0.next" = "`burning-makes-it-heavier` inszeniert genau diese Konfrontation auf einer Waage: Die Asche wiegt mehr als das Band, um genau die Masse des Sauerstoffs. Die Erhaltung gilt — für Band plus Luft, nicht für den Tiegel allein."
"stoichiometric-ratio-from-the-equation.expect.predict.diagnosis.1.reveals" = "Verbrennen ist Verlust: Feuer verzehrt, also bleibt weniger übrig — der Lagerfeuer-Prototyp 'Holzscheit wird zu Asche' wird auf ein Metall übertragen."
"stoichiometric-ratio-from-the-equation.expect.predict.diagnosis.1.next" = "Wiege es: 3,98 g aus 2,40. Das Lagerfeuer hat nicht gelogen — sein Verlust verließ es als Gas. Magnesiums Produkt ist ein Feststoff, also bleibt der aufgenommene Sauerstoff auf der Waage (`burning-makes-it-lighter` führt den Prototyp selbst vor, zum Vergleich)."
"stoichiometric-ratio-from-the-equation.expect.predict.diagnosis.2.reveals" = "Die Koeffizienten werden paarweise gelesen: '2 Mg + O₂', als nähme jedes Magnesium ein ganzes O₂ auf, das Verhältnis 2:1 wird zu 1:1 zusammengefasst."
"stoichiometric-ratio-from-the-equation.expect.predict.diagnosis.2.next" = "Zähle die Atome anhand der Gleichung: zwei Magnesiumatome teilen sich ein O₂ — je ein Sauerstoffatom, 16 g pro Mol Metall, nicht 32. Die molaren Massen in der Aufgabe enthalten die Antwort bereits: 2,40 g × 40,304/24,305 = 3,98 g."
"stoichiometric-ratio-from-the-equation.registers.lv1" = "Wiege das Band: 2,40 g. Verbrenne es. Wiege die Asche: 3,98 g. Wiederhole es mit doppelt so viel Band, und du bekommst doppelt so viel Asche — die Beziehung zwischen dem, womit du beginnst, und dem, womit du endest, ist fest, und kennst du sie für ein Stück, kennst du sie für jedes."
"stoichiometric-ratio-from-the-equation.registers.lv2" = "0,0987 mol Mg (2,40 g ÷ 24,305 g/mol) ergeben nach dem Verhältnis 2:2 in der Gleichung 0,0987 mol MgO, das sind 3,98 g (× 40,304 g/mol). Das Labor meldet exakt 0,0987 mol MgO und einen Waagenwert von 3,98 g. Die Reaktionsgleichung ist keine Dekoration — sie ist der Umrechnungsfaktor."
"stoichiometric-ratio-from-the-equation.registers.lv3" = "Das Molverhältnis 1:1 bleibt erhalten, weil der Gibbs-Minimierer das Elementbudget des Magnesiums exakt einhält; Sauerstoff wird aus dem atmosphärischen Reservoir gezogen statt aus dem Inventar des Gefäßes, wodurch das Massenverhältnis 40,304/24,305 = 1,658 auf der Waage erscheint. Bei den 3042 K, auf die sich die Lösung einpendelt, sind gasförmiges Mg und MgO thermodynamisch zugänglich; sie erscheinen nicht in den Produkten, weil das kondensierte Oxid bei 1 bar dominiert."
"limiting-reagent.expect.predict.question" = "Becherglas 1: 0,0100 mol Chlorid und 0,0200 mol Silber. Becherglas 2: 0,0200 mol Chlorid und 0,0100 mol Silber. Welches bildet mehr Silberchlorid?"
"limiting-reagent.expect.predict.options" = ["Becherglas 1 — es enthält mehr Silber, und Silber ist der schwere Teil", "Becherglas 2 — es enthält mehr Chlorid", "Keins von beiden: Beide bilden 0,0100 mol, festgelegt durch das Ion, das zuerst ausgeht"]
"limiting-reagent.expect.predict.misconception" = "Lernende addieren die Edukte zuverlässig, statt sie einander zuzuordnen. Die Reaktion verläuft im Verhältnis eins zu eins zwischen Silber und Chlorid: Der Partner, der knapper ist, entscheidet die Antwort, und der Überschuss sitzt einfach untätig herum. Beide Bechergläser enthalten insgesamt 0,0300 mol Edukt, und beide liefern genau 0,0100 mol Niederschlag."
"limiting-reagent.expect.predict.diagnosis.0.reveals" = "Die Ausbeute folgt dem 'wichtigen' Edukt: Silber ist der schwere, teure, namensgebende Teil, also bedeutet mehr Silber mehr Silberchlorid — die Zuordnung zueinander kommt im Bild nicht vor."
"limiting-reagent.expect.predict.diagnosis.0.next" = "Führe beide aus und filtriere: zwei identische Filterkuchen mit je 0,0100 mol. Prüfe dann mit `inspect`, was gelöst bleibt — Becherglas 1 enthält immer noch sein überschüssiges Silber, das nichts tut. Wichtigkeit ist keine stöchiometrische Größe."
"limiting-reagent.expect.predict.diagnosis.1.reveals" = "Das Spiegelbild desselben Fehlers: mehr von einer der beiden Zutaten bedeutet mehr Produkt — Mengen addieren sich, statt sich zuzuordnen."
"limiting-reagent.expect.predict.diagnosis.1.next" = "Ordne sie wie Tanzpartner einander zu: Jedes AgCl braucht genau ein Ion von jeder Sorte, also beendet die kürzere Schlange den Tanz — bei 0,0100 mol in beiden Räumen. Dass die Summen gleich sind (je 0,0300 mol), ist die Falle, die die Aufgabe stellt."
"limiting-reagent.registers.lv1" = "Zwei Bechergläser erhalten dieselbe Gesamtmenge Chemikalie, nur unterschiedlich aufgeteilt — das eine hat überschüssiges Silber, das andere überschüssiges Salz. Beide trüben sich ein, und beide bilden genau dieselbe Menge weißen Feststoff. Was zuerst ausgeht, stoppt die Reaktion; die Reste tun nichts weiter, als gelöst zu bleiben."
"limiting-reagent.registers.lv2" = "Ag⁺ + Cl⁻ → AgCl↓ ist eine 1:1-Reaktion. Becherglas 1: 0,0100 mol Cl⁻ ist limitierend gegenüber 0,0200 mol Ag⁺. Becherglas 2: 0,0100 mol Ag⁺ ist limitierend gegenüber 0,0200 mol Cl⁻. Das Labor meldet in beiden Fällen 0,0100 mol AgCl. Berechne die Stoffmenge jedes Edukts, nimm die kleinere, und du hast die Antwort vorhergesagt, bevor du sie ausführst."
"limiting-reagent.registers.lv3" = "Der Löser wendet keine Regel für das limitierende Edukt an — er minimiert die freie Energie unter Einhaltung der Elementbilanzen, und die 1:1-Stöchiometrie ergibt sich aus der Massenwirkungs-Randbedingung für Ksp(AgCl) ≈ 1,8 × 10⁻¹⁰. Die beiden Bechergläser unterscheiden sich darin, was gelöst bleibt: überschüssiges Ag⁺ unterdrückt restliches Chlorid und umgekehrt, der gemeinsame-Ionen-Effekt, und der End-pH-Wert unterscheidet sich leicht (6,90 gegenüber 7,07), weil Nitrat und Chlorid die Protonenbilanz nicht identisch beeinflussen."
"theoretical-yield-and-what-a-real-lab-loses.summary" = "0,0100 mol AgCl × 143,32 g/mol = 1,43 g theoretisch; der Filter gewinnt 1,43 g zurück"
"theoretical-yield-and-what-a-real-lab-loses.expect.predict.question" = "0,0100 mol jedes Edukts, filtriert und getrocknet. Die theoretische Ausbeute beträgt 1,43 g. Eine Klasse von dreißig führt dies durch und meldet Ausbeuten zwischen 71 % und 96 %. Wo ist das fehlende Silberchlorid geblieben?"
"theoretical-yield-and-what-a-real-lab-loses.expect.predict.options" = ["Die Reaktion ist nicht vollständig abgelaufen — etwas Silber blieb als Ag⁺ zurück", "Größtenteils auf dem Filterpapier, an der Becherglaswand und im Waschwasser", "Es hat sich beim Trocknen zersetzt"]
"theoretical-yield-and-what-a-real-lab-loses.expect.predict.misconception" = "Eine Ausbeute unter 100 % wird als Aussage über die Chemie gelesen, also suchen Lernende nach einer unvollständigen Reaktion. Hier handelt es sich fast ausschließlich um mechanischen Verlust. Das Labor macht das sichtbar, indem es 1,43 g meldet — die volle theoretische Ausbeute —, denn es modelliert nur die Chemie und sonst nichts: kein Filterpapier, keine Spritzer, kein Abkratzen. Das gelöst verbliebene Silber ist real, aber winzig, etwa 10⁻⁶ mol."
"theoretical-yield-and-what-a-real-lab-loses.expect.predict.diagnosis.0.reveals" = "Jedes Defizit wird der Chemie angelastet: Eine Ausbeute unter 100 % bedeutet, dass die Reaktion vorzeitig endete, weil die Apparatur in der Rechnung unsichtbar ist."
"theoretical-yield-and-what-a-real-lab-loses.expect.predict.diagnosis.0.next" = "Vergleiche die beiden Welten: Dieses Labor modelliert Chemie ohne Filterpapier, ohne Becherglaswände, ohne Spritzer — und meldet die vollen 1,43 g, wobei das tatsächlich unreagierte Silber bei etwa 10⁻⁶ mol liegt, einem Tausendstel dessen, was die Klasse verlor. Die fehlenden Gramm stecken in der Ausrüstung, weshalb bei sorgfältiger gravimetrischer Arbeit auch das Filterpapier gewogen wird."
"theoretical-yield-and-what-a-real-lab-loses.expect.predict.diagnosis.1.reveals" = "Eine Reaktion wird erfunden, um eine Lücke in der Buchführung zu füllen: Masse fehlt, also wird ein plausibel klingender, von niemandem beobachteter Vorgang — Zersetzung beim Trocknen — dafür verantwortlich gemacht."
"theoretical-yield-and-what-a-real-lab-loses.expect.predict.diagnosis.1.next" = "Sieh dir das Verlustmuster an, bevor du der Chemie die Schuld gibst: dreißig Schüler streuen zwischen 71 % und 96 %. Eine Zersetzung bei gemeinsamer Trocknungstemperatur würde bei allen einen ähnlichen Anteil kosten; Handhabungsverluste streuen genau so. Die Streuung ist der Fingerabdruck."
"theoretical-yield-and-what-a-real-lab-loses.registers.lv1" = "Filtriere die trübe Mischung, und eine weiße Paste bleibt auf dem Papier. Trockne sie und wiege sie. Die Zahl, die du bekommst, ist fast nie die berechnete Zahl — und in einem echten Labor liegt diese Lücke meist an Resten, die am Glas kleben, nicht an fehlgeschlagener Chemie."
"theoretical-yield-and-what-a-real-lab-loses.registers.lv2" = "Das limitierende Edukt ergibt 0,0100 mol AgCl, was bei 143,32 g/mol einer theoretischen Ausbeute von 1,43 g entspricht. Das Labor filtriert und wiegt 1,43 g in v1, und das Filtrat v2 wiegt 499,35 g. Prozentuale Ausbeute = tatsächlich ÷ theoretisch × 100; hier liegt sie im Wesentlichen bei 100 %, sodass jedes Defizit in einem echten Experiment Verlust ist, nicht unvollständige Reaktion."
"theoretical-yield-and-what-a-real-lab-loses.registers.lv3" = "Das Filtrat enthält weiterhin Silber und Chlorid in der Höhe, die das Löslichkeitsprodukt vorschreibt — die inspect-Ansicht zeigt beide an der vierten Dezimalstelle —, sodass die 'vollständige' Fällung nur im Rahmen des Löslichkeitsprodukts vollständig ist, etwa 1,3 × 10⁻⁵ mol/L von jedem in reinem Wasser. Dieser Rest ist ein realer, berechenbarer Verlust und der Grund, warum die gravimetrische Analyse mit verdünnter Salpetersäure statt mit Wasser gewaschen wird. Was das Labor nicht modellieren kann, ist das Papier, und es gibt auch nicht vor, es zu können."
"the-carbon-came-from-the-baking-soda.expect.predict.question" = "4,2 g Natron (0,0500 mol) werden mit einem großen Überschuss Essig zur Reaktion gebracht — vier Mal mehr Säure als nötig. Wie viel CO₂ entsteht?"
"the-carbon-came-from-the-baking-soda.expect.predict.options" = ["Mehr als mit der genauen Menge, denn mehr Säure bedeutet mehr Reaktion", "0,0500 mol — jedes Kohlenstoffatom im Gas stammt aus dem Hydrogencarbonat", "0,2000 mol — eins pro Säuremolekül"]
"the-carbon-came-from-the-baking-soda.expect.predict.misconception" = "Mehr Säure hineinzugießen fühlt sich an, als müsse es mehr Aufschäumen geben, und es sieht auch heftiger aus. Aber der Kohlenstoff im Kohlenstoffdioxid kann nur aus dem Carbonat stammen, und es befinden sich 0,0500 mol Kohlenstoffatome im Becherglas. Überschüssige Säure verändert die Geschwindigkeit und den End-pH-Wert; sie kann das Elementbudget nicht verändern."
"the-carbon-came-from-the-baking-soda.expect.predict.diagnosis.0.reveals" = "Edukte werden als Drosselklappe behandelt: mehr rein, mehr raus — und die zusätzliche Heftigkeit des Aufschäumens bei Säureüberschuss wird als zusätzliche Ausbeute gelesen statt als zusätzliche Geschwindigkeit."
"the-carbon-came-from-the-baking-soda.expect.predict.diagnosis.0.next" = "Beobachte die Waage statt des Schaums: Verdopple die Säure, dann vervierfache sie — die als Gas verlorene Masse bleibt jedes Mal gleich, weil sich die Kohlenstoffanzahl nie verändert hat. Heftigkeit ist eine Geschwindigkeit; Ausbeute ist ein Budget."
"the-carbon-came-from-the-baking-soda.expect.predict.diagnosis.1.reveals" = "Das Gas wird der Säure gutgeschrieben: Kohlenstoffdioxid als etwas, das der Essig herstellt, eins pro Molekül, statt als etwas, das aus dem Carbonat freigesetzt wird."
"the-carbon-came-from-the-baking-soda.expect.predict.diagnosis.1.next" = "Verfolge die Atome: Die eigenen Kohlenstoffatome des Essigs bleiben als Acetat im Becherglas — `inspect` zeigt sie nach dem Aufschäumen weiterhin gelöst —, und die CO₂-Menge stimmt exakt mit den 0,0500 mol des Hydrogencarbonats überein. Das Gas trägt den Kohlenstoff des Carbonats, und nur diesen."
"the-carbon-came-from-the-baking-soda.registers.lv1" = "Natron plus Essig schäumt auf. Verwendest du die vierfache Menge Essig, schäumt es stärker und schneller — aber am Ende entsteht genau dieselbe Menge Gas. Jede Blase besteht aus Atomen, die im Pulver saßen; sind sie alle weg, gibt es nichts mehr zu geben."
"the-carbon-came-from-the-baking-soda.registers.lv2" = "0,0500 mol NaHCO₃ tragen 0,0500 mol Kohlenstoff. Das Labor setzt beim bloßen Lösen 0,0183 mol frei (die Lösung entgast Richtung des atmosphärischen pCO₂) und beim Ansäuern weitere 0,0317 mol — genau 0,0500 mol. Führst du es mit 0,0599 mol Säure statt mit 0,1998 durch, erhältst du dieselben 0,0500 mol; nur der End-pH-Wert unterscheidet sich, 5,30 gegenüber 4,13."
"the-carbon-came-from-the-baking-soda.registers.lv3" = "Der gesamte gelöste anorganische Kohlenstoff ist durch die Zugabe festgelegt; was die Säure bewirkt, ist die Carbonat-Speziation so zu verschieben, bis die Lösung gegenüber log p(CO₂) = −3,408 übersättigt ist und der Überschuss entweicht. Die Aufteilung zwischen den beiden Schritten ist also keine stöchiometrische Tatsache, sondern eine des Henry-Gesetzes, und sie verschiebt sich, wenn sich die Atmosphäre verschiebt. Die Summe bewegt sich nicht: Elementbudgets sind die härteste Randbedingung in der Lösung."
"mass-in-an-open-vessel.summary" = "252,66 g + 3,60 g Säure = 256,26 g erwartet; die Waage zeigt 254,84 g. Die 1,4 g entsprechen 0,0317 mol CO₂."
"mass-in-an-open-vessel.expect.predict.question" = "Das Becherglas zeigt 252,66 g. Du gibst 3,60 g Essig dazu, und es schäumt auf. Was zeigt die Waage, wenn das Aufschäumen aufhört?"
"mass-in-an-open-vessel.expect.predict.options" = ["256,26 g — die Masse bleibt immer erhalten", "254,84 g — etwa 1,4 g leichter als erwartet", "252,66 g — die Säure ist verbraucht"]
"mass-in-an-open-vessel.expect.predict.misconception" = "'Masse bleibt erhalten' wird als Gesetz gelehrt und dann auf ein Gefäß angewendet statt auf ein System. Erhalten bleiben die Atome; sie befinden sich nur nicht mehr alle im Becherglas. Verschließt man den Kolben, wird der Messwert tatsächlich zu 256,26 g — weshalb die geschlossene Version dieses Experiments diejenige war, die Lavoisier brauchte."
"mass-in-an-open-vessel.expect.predict.diagnosis.0.reveals" = "Das Becherglas ist das Universum: Das Gesetz sagt erhalten, die Waage hält das Becherglas, also muss der Messwert aufgehen — die Möglichkeit, dass Masse durch die offene Öffnung entweicht, kommt in der Rechnung nicht vor."
"mass-in-an-open-vessel.expect.predict.diagnosis.0.next" = "Verschließe es: Der geschlossene Kolben zeigt exakt 256,26 g, und das Gesetz wird bestätigt, sobald die Grenze ehrlich gezogen wird. Lavoisiers verschlossene Gefäße existierten genau aus diesem Grund — das Gesetz war nur mit Deckel überhaupt beweisbar."
"mass-in-an-open-vessel.expect.predict.diagnosis.1.reveals" = "'Verbraucht' bedeutet 'weg': Aufgebrauchte Edukte verschwinden, also sollte der zugegebene Essig überhaupt keine Spur auf der Waage hinterlassen."
"mass-in-an-open-vessel.expect.predict.diagnosis.1.next" = "Verfolge die Atome des Essigs: Das Acetat und das Wasser, zu denen er wurde, befinden sich noch im Becherglas und wiegen, was sie wiegen; nur die 1,4 g des CO₂ sind verschwunden. Dass man 3,60 g zugibt und +2,18 g abliest, ist eine Subtraktion mit einer Geschichte — kein Verschwinden."
"mass-in-an-open-vessel.registers.lv1" = "Stelle das Becherglas auf die Waage und schreibe die Zahl auf. Gib den Essig dazu. Beobachte, wie die Zahl fällt, während es aufschäumt. Nichts wurde zerstört — die Blasen haben das Becherglas verlassen und ihr Gewicht mitgenommen, und hättest du einen Deckel aufgesetzt, hätte sich die Zahl gar nicht bewegt."
"mass-in-an-open-vessel.registers.lv2" = "252,66 g + 3,60 g = 256,26 g, wenn nichts entweicht. Die Waage zeigt 254,84 g, also fehlen 1,42 g. Das Labor meldet 0,0317 mol freigesetztes CO₂; 0,0317 × 44,009 g/mol = 1,40 g. Die fehlende Masse ist das Gas, im Rahmen der Buchführungsgenauigkeit."
"mass-in-an-open-vessel.registers.lv3" = "Die Elementbuchführung des Labors ist exakt; die Masse des Gefäßes bleibt nicht erhalten, weil die Gasphase so modelliert wird, dass sie ins Reservoir entweicht, genau wie ein offenes Becherglas es tut. Der kleine Restunterschied zwischen den gemessenen 1,42 g und den 1,40 g CO₂ ist Wasser, das mit entweicht, und die Rundung der gemeldeten Stoffmenge — es lohnt sich, das zu benennen statt zu glätten, denn in einem echten Experiment ist dieselbe Abweichung real und hat dieselbe Ursache."
"ph-is-not-quite-minus-log-c.summary" = "0,100 mol/L HCl: −log c = 1,00, und das Messgerät zeigt 1,08"
"ph-is-not-quite-minus-log-c.expect.predict.question" = "0,100 mol Salzsäure in einem Liter Wasser. Die Lehrbuchformel pH = −log[H⁺] ergibt 1,00. Was zeigt das Messgerät?"
"ph-is-not-quite-minus-log-c.expect.predict.options" = ["Genau 1,00", "1,08 — ein wenig darüber, weil das Messgerät auf Aktivität reagiert, nicht auf Konzentration", "0,92 — ein wenig darunter"]
"ph-is-not-quite-minus-log-c.expect.predict.misconception" = "pH = −log c wird als Definition gelehrt, obwohl es eine Näherung ist, die gilt, wenn Ionen weit voneinander entfernt sind. Bei 0,1 mol/L sind sie das nicht: Jedes Proton ist von einer Wolke aus Gegenionen umgeben, die es abschirmt, und die Elektrode spürt die abgeschirmte Version. Der Unterschied ist hier klein und wächst mit der Konzentration — genau deshalb gibt es lv3."
"ph-is-not-quite-minus-log-c.expect.predict.diagnosis.0.reveals" = "Die Formel gilt als Definition, also muss das Messgerät ihr gehorchen — ein abweichendes Messgerät ist defekt, und 'Aktivität' hat keinen Platz im Bild."
"ph-is-not-quite-minus-log-c.expect.predict.diagnosis.0.next" = "Verdünne und beobachte, wie sich der Unterschied schließt: Bei 0,001 mol/L (`strong-acid`) stimmen Formel und Messgerät bis zur zweiten Nachkommastelle überein; bei 0,1 weichen sie um 0,08 voneinander ab. Der Fehler einer Definition schrumpft nicht mit der Verdünnung — der einer Näherung schon, und dieses Verhalten ist die Diagnose."
"ph-is-not-quite-minus-log-c.expect.predict.diagnosis.1.reveals" = "Eine Korrektur wird erwartet, aber ihre Richtung wird geraten — das Gedränge wird sich so vorgestellt, dass es die Wirkung der Säure verstärkt statt dämpft, sodass Korrekturen per Münzwurf landen."
"ph-is-not-quite-minus-log-c.expect.predict.diagnosis.1.next" = "Lass die Physik das Vorzeichen festlegen: Jedes Proton schleppt eine Wolke aus Gegenionen mit sich, die es abschirmt, sodass die Elektrode in Lösungen wie dieser immer *weniger* spürt als die reine Anzahl — der Messwert liegt über der naiven Zahl, nie darunter. Eine Korrektur, deren Vorzeichen du herleiten kannst, ist Chemie; eine, die du rätst, ist Dekoration."
"ph-is-not-quite-minus-log-c.registers.lv1" = "Ein pH-Messgerät zählt keine Säureteilchen. Es reagiert darauf, wie stark die Säure drückt, und in einer gedrängten Lösung kommen sich die Teilchen gegenseitig in die Quere, sodass der Druck etwas schwächer ist, als die Anzahl vermuten lässt. Das Messgerät sagt dir, was die Lösung tut, und das ist die Zahl, auf die es ankommt."
"ph-is-not-quite-minus-log-c.registers.lv2" = "0,100 mol in 1,000 L ergibt 0,100 mol/L. Vollständige Dissoziation liefert [H⁺] = 0,100, also −log[H⁺] = 1,00. Das Messgerät zeigt 1,08. Die Formel hat recht mit der Anzahl und liegt beim Messwert leicht daneben, und der Unterschied ist kein Messfehler — er ist reproduzierbar."
"ph-is-not-quite-minus-log-c.registers.lv3" = "Der pH-Wert ist definiert als −log a(H⁺), und a = γc. Bei I = 0,1 m liefert die WATEQ-Debye-Hückel-Erweiterung γ(H⁺) ≈ 0,83, also pH = −log(0,83 × 0,100) = 1,08 — genau das, was PHREEQC berechnet und meldet. Vergleiche dieselbe Säure bei 0,001 mol/L, wo γ ≈ 0,96 und die Korrektur nur eine Hundertstel beträgt: Die Näherung ist nicht falsch, sie hat einen Gültigkeitsbereich, und hier kann der Lernende beobachten, wie er endet."
"a-weak-acid-breaks-the-naive-sum.summary" = "0,100 mol/L: HCl → pH-Wert 1,08; CH₃COOH → pH-Wert 2,88"
"a-weak-acid-breaks-the-naive-sum.expect.predict.question" = "Beide Bechergläser erhalten 0,100 mol Säure in einem Liter. Das eine ist Salzsäure, das andere die Essigsäure des Essigs. Die Salzsäure zeigt pH-Wert 1,08. Was zeigt die Essigsäure?"
"a-weak-acid-breaks-the-naive-sum.expect.predict.options" = ["Ebenfalls 1,08 — gleiche Konzentration, gleicher pH-Wert", "2,88 — etwa 60-mal weniger freie Protonen", "4,76 — der pKa-Wert", "7,00 — Essig ist ein Lebensmittel, also muss er neutral sein"]
"a-weak-acid-breaks-the-naive-sum.expect.predict.misconception" = "Die frisch gelernte Gewohnheit pH = −log c wird auf die Essigsäure angewendet und ergibt 1,00 — die erste Option. Sie scheitert, weil die Formel stillschweigend annahm, die Säure sei vollständig dissoziiert. Die Wahl des pKa-Werts ist der nächste Fehler auf diesem Weg: Der pH-Wert entspricht dem pKa-Wert nur in einem Puffer, in dem Säure und korrespondierende Base gleich groß sind, und dieses Becherglas enthält fast kein Acetat."
"a-weak-acid-breaks-the-naive-sum.expect.predict.diagnosis.0.reveals" = "pH = −log c mit c als Etikettkonzentration: Die versteckte Annahme der Formel — dass jedes Molekül dissoziiert ist — ist nie ans Licht gekommen, sodass alle Säuren derselben Konzentration gleich erscheinen sollen."
"a-weak-acid-breaks-the-naive-sum.expect.predict.diagnosis.0.next" = "Sieh dir das Essigsäure-Becherglas mit `inspect` auf lv3 an: Fast die gesamten 0,100 mol sind noch intaktes CH₃COOH und halten ihr Proton fest. Das Messgerät bewertet nur die freien Protonen, und davon gibt es etwa sechzigmal weniger, als das Etikett versprach."
"a-weak-acid-breaks-the-naive-sum.expect.predict.diagnosis.1.reveals" = "Der pKa-Wert gilt als der pH-Wert der Säure — die eine Zahl, die man sich über Essig merkt, eingesetzt, wo immer Essig auftaucht, wobei die Pufferbedingung, die eigentlich daran hing, unterwegs verloren ging."
"a-weak-acid-breaks-the-naive-sum.expect.predict.diagnosis.1.next" = "Erfülle die Bedingung, und die Zahl wird richtig: `half-neutralised-vinegar` neutralisiert die Hälfte, [HA] entspricht [A⁻], und das Messgerät zeigt den pKa-Wert exakt an. Dieses Becherglas enthält fast kein Acetat, sodass die dafür nötige Gleichheit himmelweit verfehlt wird."
"a-weak-acid-breaks-the-naive-sum.expect.predict.diagnosis.2.reveals" = "Essbar bedeutet mild bedeutet pH-Wert 7: Die Kategorie 'Lebensmittel' beantwortet eine chemische Frage, wobei Sicherheit und Neutralität zu einer einzigen Skala verschmelzen."
"a-weak-acid-breaks-the-naive-sum.expect.predict.diagnosis.2.next" = "Miss, was du bereits isst: Genau dieses Becherglas ist Essig bei 2,88, und du beträufelst damit Pommes. Essbarkeit ist eine Tatsache über Dosis und Biologie; das Messgerät misst etwas völlig anderes, und die beiden Skalen sehen nur so lange gleich aus, bis man eine von ihnen abliest."
"a-weak-acid-breaks-the-naive-sum.registers.lv1" = "Dieselbe Menge Säure, dieselbe Menge Wasser, zwei sehr unterschiedliche Messwerte. Die starke Säure gibt ihre gesamte Acidität auf einmal ab; die schwache hält das meiste zurück und lässt nur wenig los. Deshalb ist Essig zum Verzehr sicher und Salzsäure derselben Stärke nicht."
"a-weak-acid-breaks-the-naive-sum.registers.lv2" = "Die naive Berechnung, pH = −log(0,100) = 1,00, stimmt für HCl (bis auf die Aktivitätskorrektur — 1,08) und liegt bei Essigsäure deutlich daneben, wo das Messgerät 2,88 zeigt. Essigsäure dissoziiert nur teilweise: pH ≈ ½(pKa − log c) = ½(4,76 + 1,00) = 2,88. Man muss den Ka-Wert kennen, bevor man den pH-Wert berechnen kann, und das ist der ganze Unterschied zwischen einer starken und einer schwachen Säure."
"a-weak-acid-breaks-the-naive-sum.registers.lv3" = "Auch PHREEQC wendet die Formel für schwache Säuren nicht an; es löst die Massenwirkungsgleichung H⁺ + CH₃COO⁻ ⇌ CH₃COOH (pKa ≈ 4,76 aus minteq.v4.dat) gleichzeitig mit Ladungs- und Massenbilanz, und der pH-Wert ergibt sich daraus. Die Übereinstimmung mit der Abkürzung ½(pKa − log c) bei 2,88 ist eine Prüfung der Annahmen dieser Abkürzung — dass die Dissoziation gering ist und die eigenen Protonen des Wassers vernachlässigbar sind —, die beide hier gelten und beide bei 10⁻⁵ mol/L versagen."
"hot-pack-arithmetic.summary" = "ΔT = q / (n·Cp)   ·   8,28 kJ ÷ (5,5343 mol × 75,3 J·mol⁻¹·K⁻¹) = 19,9 K"
"hot-pack-arithmetic.expect.predict.question" = "0,1000 mol Calciumchlorid (ΔH_Lös = −82,8 kJ/mol) löst sich in 100 mL Wasser. Die molare Wärmekapazität von Wasser beträgt 75,3 J·mol⁻¹·K⁻¹, und 100 mL entsprechen 5,53 mol. Wie warm wird es, ausgehend von 25,0 °C?"
"hot-pack-arithmetic.expect.predict.options" = ["Etwa 27 °C — ein paar Grad", "Etwa 45 °C", "Etwa 108 °C — es würde kochen", "Es bleibt bei 25 °C; Lösen ist eine physikalische Veränderung, keine chemische"]
"hot-pack-arithmetic.expect.predict.misconception" = "Die letzte Option ist die tiefgreifende: Lösen wird unter 'physikalische Veränderung' eingeordnet, und von physikalischen Veränderungen wird angenommen, dass sie keine Energie betreffen. Das Aufbrechen eines Ionengitters und die Hydratisierung der Ionen sind beides große Energiebeiträge, und ihre Differenz ist es, was das Thermometer zeigt. Die Antwort 108 °C entsteht dadurch, dass durch die Masse in Gramm geteilt wird, während eine molare Wärmekapazität verwendet wird."
"hot-pack-arithmetic.expect.predict.diagnosis.0.reveals" = "Die Energie wird zwar zugestanden, aber nach Gefühl bemessen: Kilojoule klingen klein, also müssen es wenige Grad sein — die Division, die das klären würde, wird nie tatsächlich durchgeführt."
"hot-pack-arithmetic.expect.predict.diagnosis.0.next" = "Führe die Division durch, die die Aufgabe vorgibt: 8,28 kJ auf 5,53 mol × 75,3 J·mol⁻¹·K⁻¹ ergibt 416 J/K, also +19,9 K. Sich auf die Rechnung festzulegen, bevor das Thermometer entscheidet, ist die ganze Übung."
"hot-pack-arithmetic.expect.predict.diagnosis.1.reveals" = "Einheiten wurden mitten in der Formel vertauscht: Gramm standen unter einer molaren Wärmekapazität, und die daraus resultierende große Zahl fühlte sich an wie geschehende Chemie, nicht wie ein Fehler."
"hot-pack-arithmetic.expect.predict.diagnosis.1.next" = "Führe die Einheiten konsequent mit: J ÷ (mol × J·mol⁻¹·K⁻¹) ergibt Kelvin; Gramm unter einer molaren Kapazität ergibt Unsinn im Gewand einer Temperatur. Einheiten sind keine Dekoration — sie sind die Kontrolle, die das auffängt, bevor das Wasser auffällig nicht kocht."
"hot-pack-arithmetic.expect.predict.diagnosis.2.reveals" = "Taxonomie betreibt Physik: 'Physikalische Veränderung' gilt als energiefreie Kategorie, also beantwortet das Einordnen des Vorgangs die Frage des Thermometers."
"hot-pack-arithmetic.expect.predict.diagnosis.2.next" = "Die Kategorien enthalten nicht die Energie — das Gitter und die Hydrathüllen tun das. Führe `cold-from-baking-soda` neben diesem hier aus: dieselbe 'physikalische Veränderung' mit umgekehrtem Vorzeichen. Eine Taxonomie, die null vorhersagt, kann nicht sowohl +20 K als auch −4 K vorhersagen; eine Energiebilanz sagt beides vorher."
"hot-pack-arithmetic.registers.lv1" = "Der Becher wird wirklich heiß — zu heiß, um ihn bequem zu halten —, und dabei wurde nichts verbrannt und nichts eingesteckt. Einen Kristall auseinanderzureißen und Wasser um die Bruchstücke zu legen setzt mehr Energie frei, als es kostet, und der Überschuss kann nirgendwohin außer ins Wasser."
"hot-pack-arithmetic.registers.lv2" = "q = n × ΔH_Lös = 0,1000 mol × 82,8 kJ/mol = 8,28 kJ freigesetzt. Das Wasser entspricht 100 mL, 5,5343 mol, bei 75,3 J·mol⁻¹·K⁻¹, also ΔT = 8280 J ÷ 416,7 J/K = 19,9 K. Ausgehend von 25,0 °C sagt das 44,9 °C voraus, und das Thermometer zeigt 44,87 °C. Die Berechnung ist keine Übung — sie ist der Messwert."
"hot-pack-arithmetic.registers.lv3" = "Die Wärme geht allein ins Wasser: Das gelöste Ca²⁺ und Cl⁻ tragen keine modellierte Wärmekapazität, da partielle molare Wärmekapazitäten wässriger Ionen klein und oft negativ sind und in diesem Stadium nicht kuratiert werden. Das ist eine Näherung mit bekanntem Vorzeichen, und deshalb liegt das berechnete 44,87 °C geringfügig über einer vollständigen kalorimetrischen Behandlung. Das Gefäß ist adiabatisch, sodass nichts an einen Becher oder an den Raum verloren geht — das reale Experiment zeigt immer weniger an, und die Lücke ist die Kalorimeterkonstante."
"cold-from-baking-soda.expect.predict.question" = "0,1000 mol Natron kommen in 100 mL Wasser bei 25,0 °C. ΔH_Lös = +16,7 kJ/mol. Was zeigt das Thermometer?"
"cold-from-baking-soda.expect.predict.options" = ["Wärmer — Lösen setzt immer Energie frei", "21,0 °C — etwa vier Grad kälter", "Unverändert — das Wasser ist es, was die Temperatur hält"]
"cold-from-baking-soda.expect.predict.misconception" = "Nachdem Lernende gerade gesehen haben, wie Calciumchlorid einen Becher erwärmt, verallgemeinern sie: Lösen erwärmt Dinge. Das Vorzeichen von ΔH_Lös ist eine Eigenschaft des Stoffes, nicht des Lösens. Natron, Kaliumchlorid und Ammoniumnitrat gehen alle den anderen Weg, und eine Sofort-Kühlpackung ist genau dieses Experiment."
"cold-from-baking-soda.expect.predict.diagnosis.0.reveals" = "Das Ergebnis des letzten Experiments wird zum Gesetz erhoben: Lösen erwärmt Dinge, weil das einprägsame Beispiel es tat."
"cold-from-baking-soda.expect.predict.diagnosis.0.next" = "Führe `hot-pack-arithmetic` und dieses Becherglas nacheinander aus: Das Vorzeichen reist mit dem Stoff, nicht mit dem Vorgang. ΔH_Lös beträgt hier +16,7 kJ/mol, und das Thermometer gehorcht dem Vorzeichen, nicht der Gewohnheit."
"cold-from-baking-soda.expect.predict.diagnosis.1.reveals" = "Wasser als thermischer Anker: eine große, stetige Flüssigkeit, die ein Löffel Pulver nicht bewegen kann — Wärmekapazität wird mit Unempfindlichkeit verwechselt."
"cold-from-baking-soda.expect.predict.diagnosis.1.next" = "Wärmekapazität ist ein Preis, kein Veto: 1,67 kJ aus 416 J/K Wasser zu entziehen kostet 4,0 K, und das Thermometer bezahlt sie. Eine große Kapazität macht Änderungen kleiner — `two-vessels-one-variable` bepreist genau das —, aber niemals null."
"cold-from-baking-soda.registers.lv1" = "Derselbe Becher, dasselbe Wasser, ein anderes Pulver — und dieses wird kalt statt heiß. Das ist kein Trick und kein anderes Rühren; manche Stoffe müssen sich Energie vom Wasser leihen, um sich aufzulösen, und das Wasser bleibt kälter zurück, weil es sie verliehen hat."
"cold-from-baking-soda.registers.lv2" = "q = 0,1000 mol × (+16,7 kJ/mol) = +1,67 kJ aufgenommen. ΔT = −1670 J ÷ 416,7 J/K = −4,0 K, also 25,0 °C → 21,0 °C, und das Thermometer zeigt 21,02 °C. Kaliumchlorid mit +17,2 kJ/mol ergibt 20,87 °C im selben Becher — fast dasselbe, weil die Enthalpien fast gleich sind."
"cold-from-baking-soda.registers.lv3" = "Endotherme Lösung bedeutet, dass die Gitterenthalpie die Summe der Hydratationsenthalpien übersteigt; das Defizit wird der fühlbaren Wärme der Lösung in einem adiabatischen Gefäß entnommen. Beachte, dass das Labor außerdem meldet, dass 0,0424 mol CO₂ entweichen: Eine Hydrogencarbonat-Lösung bei pH-Wert 10,07 ist gegenüber dem atmosphärischen pCO₂ übersättigt und entgast. Diese Carbonat-Chemie ist real und unabhängig vom thermischen Effekt, weshalb beide Ereignisse auftreten."
"two-vessels-one-variable.summary" = "Dieselben 0,1000 mol CaCl₂; 100 mL → 44,87 °C, 200 mL → 34,93 °C"
"two-vessels-one-variable.expect.predict.question" = "Dieselben 0,1000 mol Calciumchlorid kommen in einen Becher mit 100 mL und in einen anderen mit 200 mL. Der erste erreicht 44,87 °C. Was erreicht der zweite?"
"two-vessels-one-variable.expect.predict.options" = ["44,87 °C — es wurde dieselbe Energie freigesetzt", "34,93 °C — dieselbe Energie, verteilt auf die doppelte Menge Wasser", "89,7 °C — doppelt so viel Wasser, doppelte Erwärmung"]
"two-vessels-one-variable.expect.predict.misconception" = "Die erste Option verwechselt Energie mit Temperatur — sie sind nicht dieselbe Größe, und dieses Becherpaar ist der billigste Weg, den Unterschied zu spüren. In beiden wird exakt dieselbe Menge, 8,28 kJ, freigesetzt; das Thermometer zeigt die Energie pro Menge des zu erwärmenden Stoffes an, also halbiert die Verdoppelung des Wassers den Anstieg."
"two-vessels-one-variable.expect.predict.diagnosis.0.reveals" = "Energie und Temperatur werden als eine Größe behandelt: 'Die Wärme' ist das, was das Thermometer zeigt, also muss dasselbe Salz überall denselben Messwert ergeben."
"two-vessels-one-variable.expect.predict.diagnosis.0.next" = "Halte beide Zahlen zugleich fest: 8,28 kJ freigesetzt in jedem Becher — identisch — und +19,9 K im einen gegenüber +9,9 K im anderen. Das Thermometer zeigt Energie pro zu erwärmender Stoffmenge an; dieses Becherpaar ist das billigste Instrument, das diese beiden Größen auseinanderhalten kann."
"two-vessels-one-variable.expect.predict.diagnosis.1.reveals" = "Mehr Wasser wird als mehr Reaktion gelesen: Das Lösungsmittel wird zum Edukt befördert, also sollte eine Verdoppelung die Wärme verdoppeln."
"two-vessels-one-variable.expect.predict.diagnosis.1.next" = "Sieh dir beide Becher mit `inspect` an: identische 0,1000 mol gelöst, identische freigesetzte Energie. Das Wasser teilt die Wärme nur auf — würde es die Reaktion speisen, müsste das Salz irgendwie wissen, wie viel Wasser ihm beim Lösen zusah."
"two-vessels-one-variable.registers.lv1" = "Ändere eine Sache und sonst nichts. Zwei Becher, dasselbe Pulver, dieselbe Starttemperatur — nur die Menge Wasser unterscheidet sich. Was auch immer die Thermometer dann unterschiedlich anzeigen, du weißt, was es verursacht hat. Änderst du zwei Dinge gleichzeitig, hast du nichts gelernt, egal wie sorgfältig du gemessen hast."
"two-vessels-one-variable.registers.lv2" = "Identisches q = 8,28 kJ in beiden Bechern. ΔT = q/(n·Cp): 8280 ÷ 416,7 = 19,9 K in 100 mL, und 8280 ÷ 833,5 = 9,9 K in 200 mL. Das Labor liefert ausgehend von 25,0 °C 44,87 °C und 34,93 °C — 19,87 K und 9,93 K. Die Halbierung ist exakt, weil sich nur der Nenner geändert hat."
"two-vessels-one-variable.registers.lv3" = "Das ist der kontrollierte Vergleich in seiner reinsten Form, und es lohnt sich zu bemerken, was das Labor kostenlos konstant hält, was ein echter Labortisch nicht tut: identische Starttemperatur, identischer Wärmeverlust (keiner), identische Reinheit, identisches Rühren. Ein simulierter fairer Test ist trivial fair, und genau deshalb muss die *Gewohnheit* hier gelehrt werden, während die *Schwierigkeit* an einem echten Labortisch begegnet werden muss. Das virtuelle Labor kann die Logik der Kontrolle lehren; die Disziplin dafür kann es nicht lehren."
"two-paths-one-temperature.expect.predict.question" = "Natriumhydroxid-Plätzchen können direkt in die Säure gegeben werden — ein heftiger Schritt — oder sich zunächst in Wasser lösen und erst dann auf die Säure treffen, zwei mildere Schritte. Welcher Weg endet heißer?"
"two-paths-one-temperature.expect.predict.options" = ["Der einstufige Weg — alles auf einmal zu tun setzt die Energie gemeinsam frei", "Der zweistufige Weg — zwei getrennte Wärmemengen addieren sich zu mehr", "Keins von beiden: Beide Bechergläser landen bei genau derselben Temperatur"]
"two-paths-one-temperature.expect.predict.misconception" = "Enthalpie ist eine Zustandsfunktion: Die zwischen demselben Start und demselben Ziel freigesetzte Wärme hängt nicht vom eingeschlagenen Weg ab. Das ist der Satz von Hess, und beide falschen Antworten stellen sich vor, dass der Weg eine Rolle spielt — in entgegengesetzte Richtungen. Die Dramatik unterscheidet sich (ein Sprung gegenüber zwei Anstiegen); das Ziel kann es nicht."
"two-paths-one-temperature.expect.predict.diagnosis.0.reveals" = "Intensität wird mit Gesamtmenge verwechselt: ein dramatischer Schritt 'setzt mehr frei' als zwei milde, als würde Energie dafür belohnen, alles auf einmal zu tun."
"two-paths-one-temperature.expect.predict.diagnosis.0.next" = "Beobachte beide Thermometer: 49,20 °C und 49,20 °C. Die Wege unterscheiden sich — das eine Becherglas springt in einem einzigen heftigen Schritt, das andere steigt zweimal, mit einer Pause bei 35,7 °C als Natronlauge mit pH-Wert 13,51 — aber das Ziel ist durch die beiden Endpunkte festgelegt, nicht durch den zwischen ihnen gezeichneten Weg."
"two-paths-one-temperature.expect.predict.diagnosis.1.reveals" = "Wärmemengen werden pro Ereignis gezählt statt pro Zustandsänderung: zwei Erwärmungen müssen sich sicher zu mehr summieren als eine."
"two-paths-one-temperature.expect.predict.diagnosis.1.next" = "Addiere die beiden Wärmemengen des zweiten Wegs: die Wärme der Lösung plus die des Mischens, und die Summe entspricht exakt der Freisetzung des einstufigen Wegs. Energie wird zwischen Zuständen verbucht, und beide Wege verbinden dieselben zwei Zustände — dass die Teile sich zum Ganzen summieren, ist der gesamte Inhalt des Gesetzes."
"two-paths-one-temperature.registers.lv1" = "Direkt in die Säure oder erst lösen und danach mischen — nimm einen der beiden Wege. Das Thermometer endet in beiden Fällen auf derselben Marke. Der Wärme ist es egal, welchen Weg du genommen hast; nur wo du gestartet und wo du aufgehört hast, zählt."
"two-paths-one-temperature.registers.lv2" = "Der Satz von Hess: Enthalpie ist eine Zustandsfunktion, also setzen dieselben Edukte, die dasselbe Endbecherglas erreichen, dieselbe Gesamtwärme frei, in beliebig vielen Schritten. Beide Wege zeigen 49,20 °C — die −44,5 kJ/mol der Lösung und die ≈−56 kJ/mol der Neutralisation werden beide, in unterschiedlicher Reihenfolge, in dieselbe Summe eingezahlt —, und die Energiebilanz des Labors erhält die Enthalpie über jeden Zwischenzustand hinweg, sodass die Übereinstimmung exakt ist und nicht nur angenähert."
"two-paths-one-temperature.registers.lv3" = "Sowohl das Gesetz als auch die Größenordnung sind berechnet, und die Neutralisationsenthalpie wird abgelesen statt kuratiert: H⁺ + OH⁻ → H₂O ist die Umkehrung der Reaktion, die OH⁻ in jeder mitgelieferten Datenbank definiert, also stammt ihr ΔH aus den Datendateien selbst — wateq4f nennt −55,91 kJ/mol, minteq.v4 −55,81, pitzer −56,36, eine Abweichung von einem halben Kilojoule zwischen Datensätzen, genau von der Art, die `explain` zeigen soll. (Die −57,3 kJ/mol, die Schultabellen nennen, sind der stark-stark-kalorimetrische Wert mit eingeschlossenen Verdünnungseffekten — eine andere Messung.) Zwei Grenzen, ausdrücklich benannt: Dies zählt nur den wasserbildenden Schritt, sodass die Neutralisation einer schwachen Säure hier um etwa 2 kJ/mol zu exotherm ausfiele, da ihre Dissoziationsenthalpie in die Zahl eines echten Kalorimeters einfließt, aber nicht in diese; und der End-pH-Wert von 8,91 ist der Überschuss von 8 × 10⁻⁶ mol Base (vier Gramm NaOH sind 0,100008 mol), abgelesen bei den 49,2 °C, die das Becherglas tatsächlich erreichte — K_w hat sich mit der Temperatur verschoben, was `neutral-is-a-moving-target` unangekündigt hereinbringt. Die Exaktheit der Weg-Übereinstimmung war teuer erkauft: Die Enthalpie hörte in diesem Labor auf drei verschiedene Arten auf, eine Zustandsfunktion zu sein, bevor sie es blieb (PLAN.md führt die Chronik), und dieser Eintrag wurde erst schreibbar, als der letzte dieser Fehler behoben war."
"chalk-below-the-kiln.summary" = "CaCO₃(s) + Wärme → CaCO₃(s)   ·   147 °C sind heiß, und es passiert nichts"
"chalk-below-the-kiln.expect.predict.question" = "10 g Kreide in einem Tiegel. Füge 1 kJ Wärme zu — genug, um sie auf 147 °C zu bringen, heißer als kochendes Wasser. Was kommt heraus?"
"chalk-below-the-kiln.expect.predict.options" = ["Branntkalk und Kohlendioxid — sie hat sich zersetzt", "Heiße Kreide. Sonst nichts. Die Waage zeigt immer noch 10,00 g", "Ein Teil zersetzt sich; der Rest nicht"]
"chalk-below-the-kiln.expect.predict.misconception" = "'Erhitzen verursacht Zersetzung' wird zu einer Regel ohne angehängte Schwelle, sodass von jedem Erhitzen erwartet wird, dass etwas geschieht. Zersetzung hat eine Temperatur, und unterhalb davon läuft die Reaktion nicht langsam ab — sie läuft gar nicht ab. Dieser Eintrag existiert als das Nullergebnis, das dem nächsten seine Bedeutung gibt."
"chalk-below-the-kiln.expect.predict.diagnosis.0.reveals" = "Erhitzen verursacht Zersetzung, ohne Schwelle: 147 °C sind nach Küchenmaßstäben beeindruckend heiß, also muss Chemie im Gange sein."
"chalk-below-the-kiln.expect.predict.diagnosis.0.next" = "Treibe es in Stufen voran und wiege zwischen jeder Stufe: heißer, heißer, immer noch 10,00 g — dann über die Schwelle hinaus in `chalk-in-the-kiln`, wo alles auf einmal geschieht. Das Paar der Einträge ist die Lehre: Schwellen sind keine allmählichen Annäherungen an das Drama."
"chalk-below-the-kiln.expect.predict.diagnosis.1.reveals" = "Reaktionen als Dimmer-Schalter: Jede Temperatur kauft einen Bruchteil des Effekts, also sollte teilweise Wärme teilweise Zersetzung ergeben."
"chalk-below-the-kiln.expect.predict.diagnosis.1.next" = "Lies die Waage bis zur letzten Ziffer ab: 10,00 g, nicht 9,9-irgendwas. Unterhalb der Temperatur, bei der der CO₂-Druck über dem Carbonat den des Raumes erreicht, kann das Gas überhaupt nicht entweichen — das Gleichgewicht ist eine Tür, und auf dieser Seite der Schwelle ist sie verschlossen, nicht angelehnt."
"chalk-below-the-kiln.registers.lv1" = "Kreide in einem Tiegel über einer Flamme, heiß genug, um dich schwer zu verbrennen, und wenn sie abkühlt, ist sie immer noch Kreide. Dasselbe weiße Pulver, dasselbe Gewicht auf der Waage. Erhitzen ist keine Zauberzutat: Es muss genug Wärme sein, und 'genug' ist für jeden Stoff eine bestimmte Zahl."
"chalk-below-the-kiln.registers.lv2" = "1 kJ auf 0,0999 mol CaCO₃ bei 81,9 J·mol⁻¹·K⁻¹ erhöht die Temperatur um 122 K: 25 °C → 147,2 °C, und das Labor bestätigt 147,21 °C. Es entsteht kein CO₂, es erscheint kein CaO, und die Waage zeigt weiterhin 10,00 g. Calciumcarbonat braucht etwa 900 °C, bevor die Zersetzung abläuft."
"chalk-below-the-kiln.registers.lv3" = "Der Gleichgewichts-Partialdruck von CO₂ über Calcit bei 420 K liegt bei etwa 10⁻¹⁵ bar — weit unter den atmosphärischen 10⁻³,⁴ bar —, sodass die thermodynamische Triebkraft in die andere Richtung zeigt und das Carbonat die stabile Phase ist. Der Gibbs-Minimierer ist hier nicht abgeschaltet; er wird ausgeführt und liefert 'unverändert', was ein berechnetes Ergebnis ist und keine Annahme. Ein Lernender kann die Wärme steigern und den Übergang selbst finden."
"chalk-in-the-kiln.expect.predict.question" = "Dieselben 10 g Kreide, aber die achtfache Wärmemenge — über 1000 °C hinaus. Der Tiegel wird leichter. Wo steht die Temperatur, bei der sich Kreide zersetzt, in diesem Programm geschrieben?"
"chalk-in-the-kiln.expect.predict.options" = ["In einer Tabelle mit Zersetzungstemperaturen, die die Engine nachschlägt", "Nirgendwo — sie wird berechnet, ab dem Punkt, an dem der CO₂-Druck über dem Carbonat den Druck im Raum erreicht", "Sie ist fest als 900 °C einprogrammiert"]
"chalk-in-the-kiln.expect.predict.misconception" = "Ein Simulator wird als Nachschlagetabelle mit Animation obendrauf angenommen, sodass jede Zahl, die er liefert, vermutlich von jemandem eingetippt wurde. Diese wurde es nicht: Dieselbe Lösung, die sagt, 147 °C ändere nichts, sagt, 1000 °C ändere alles, und keine der beiden Antworten wurde im Voraus aufgeschrieben. Das ist der Unterschied zwischen einem Modell und einer Aufzeichnung."
"chalk-in-the-kiln.expect.predict.diagnosis.0.reveals" = "Simulation als Aufzeichnung: Zahlen stammen aus Tabellen, die jemand eingetippt hat, also wird irgendwo in diesem Programm eine Tabelle mit Zersetzungstemperaturen konsultiert."
"chalk-in-the-kiln.expect.predict.diagnosis.0.next" = "`explain` das Gefäß: Die Herkunftsangabe nennt NASA-Thermodynamikpolynome und eine Gibbs-Minimierung — es existiert keine Zersetzungstabelle zum Nachschlagen. Dieselbe Lösung, die bei 147 °C verweigerte, brennt bei 1000 °C, ohne dazwischen irgendetwas nachgeschlagen zu haben."
"chalk-in-the-kiln.expect.predict.diagnosis.1.reveals" = "Die schärfere Form derselben Idee: eine bestimmte Konstante, fest einprogrammiert — jemand habe 900 in den Quellcode geschrieben, so wie Lehrbücher es abdrucken."
"chalk-in-the-kiln.expect.predict.diagnosis.1.next" = "Frage, wovon die Schwelle abhängt, und eine fest einprogrammierte Zahl zerfällt: Es ist die Temperatur, bei der der Gleichgewichtsdruck des CO₂ über dem Feststoff den Druck des Raumes kreuzt, weshalb die Antwort zu den *Bedingungen* gehört und nicht allein zur Kreide. `explain` zeigt die Daten, aus denen sie sich ergab; im Quellcode gibt es keine 900 zu finden."
"chalk-in-the-kiln.registers.lv1" = "Jetzt verändert sich die Kreide tatsächlich. Sie glüht, wird dann matt, und was übrig bleibt, ist ein anderes weißes Pulver, das viel weniger wiegt — und tropfst du Wasser darauf, zischt es und wird heiß. So wird seit viertausend Jahren Mörtelkalk hergestellt, und das Einzige, was du dafür brauchtest, war ein ausreichend heißes Feuer."
"chalk-in-the-kiln.registers.lv2" = "8 kJ bringen 0,0999 mol Kreide auf etwa 1000 °C, über den Zersetzungspunkt hinaus. CaCO₃ → CaO + CO₂: Das Kohlenstoffdioxid entweicht, und die Waage fällt von 10,00 g auf die Masse des reinen Branntkalks. Jedes Mol Kreide, das sich zersetzt, gibt 44,009 g Gas ab und behält 56,077 g Oxid — ein Verlust von 44 %."
"chalk-in-the-kiln.registers.lv3" = "Die Schwelle ist nicht tabelliert. Dem Minimierer werden das Elementbudget des Gefäßes sowie sein Anteil an der Atmosphäre übergeben, und er wird nach der Zusammensetzung mit der niedrigsten Gibbs-Energie bei der Temperatur gefragt, auf die sich die Enthalpiebilanz einpendelt; unterhalb des Übergangs gewinnt Calcit, oberhalb Kalk-plus-Gas. Die Elementbilanz ist hier eine harte Randbedingung und kein Anspruch: Der Löser verweigert die Rückgabe einer Zusammensetzung, deren Atome nicht bis auf ein Milliardstel mit den eingesetzten übereinstimmen, und meldet lieber ein Nicht-Konvergieren als eine Zusammensetzung, die Materie erschafft. Diese Kontrolle ist der Grund, warum dieser Eintrag überhaupt Mengen nennen kann — eine frühere Version des Minimierers prüfte die Konvergenz anhand der Größe ihres eigenen Korrekturschritts statt anhand des Residuums und lieferte still und leise die doppelte Menge des Kohlenstoffdioxids, mit dem sie begonnen hatte."
"burning-makes-it-heavier.expect.predict.question" = "Wiege ein Magnesiumband: 1,20 g. Verbrenne es vollständig und wiege die weiße Asche. Lege dich auf eine Zahl fest, bevor du nachsiehst."
"burning-makes-it-heavier.expect.predict.options" = ["Weniger als 1,20 g — Verbrennen verbraucht Dinge", "Genau 1,20 g — die Masse bleibt erhalten", "1,99 g — mehr, als du am Anfang hattest", "Nichts mehr zu wiegen — es ist alles in Rauch aufgegangen"]
"burning-makes-it-heavier.expect.predict.misconception" = "Das ist der Klassiker, und die meisten liegen falsch. Jedes Feuer, das je jemand beobachtet hat, hinterlässt weniger, als es begann — ein Holzscheit wird zu einer Handvoll Asche —, sodass 'Verbrennen zerstört Materie' aus der Welt gelernt wird, bevor es im Klassenzimmer wieder verlernt wird. Die Asche ist leichter, weil der Kohlenstoff als Gas entwich. Magnesiums Oxid ist ein Feststoff und bleibt im Tiegel, sodass auch der aus der Luft aufgenommene Sauerstoff auf der Waage liegt. Verbrennen ist Verbindung, nicht Zerstörung; der Holzscheit ist der irreführende Fall."
"burning-makes-it-heavier.expect.predict.diagnosis.0.reveals" = "Feuer verzehrt — gelernt an jedem Lagerfeuer, bevor es ein Klassenzimmer gab: Verbrennen gibt Materie aus, und Asche ist der Rest."
"burning-makes-it-heavier.expect.predict.diagnosis.0.next" = "Verbrenne es hier und wiege: 1,99 g aus 1,20. Das Lagerfeuer hat nicht gelogen — seine verlorene Masse verließ es als Gas. Das Produkt dieses Feuers ist ein Feststoff, sodass der aufgenommene Sauerstoff zum Wiegen bleibt; `burning-makes-it-lighter` führt zum Vergleich den Fall des Lagerfeuers selbst vor."
"burning-makes-it-heavier.expect.predict.diagnosis.1.reveals" = "Erhaltung wird nur auf das Band angewendet: Die Luft hat keine Zeile in den Büchern, also muss das, was gewogen wurde, auch das sein, was übrig bleibt."
"burning-makes-it-heavier.expect.predict.diagnosis.1.next" = "Zeichne die Grenze neu um Band *plus Luft*, und die Bücher gehen exakt auf: Die zusätzlichen 0,79 g sind Sauerstoff, der die Grenze überquert hat. Das Gesetz war nie in Gefahr — es wurde nur an einer um eine Größe zu kleinen Grenze angewendet."
"burning-makes-it-heavier.expect.predict.diagnosis.2.reveals" = "Die stärkste Form der Lagerfeuer-Lehre: Verbrennen ist Vernichtung, und 'in Rauch aufgehen' bedeutet, dass Materie tatsächlich endet."
"burning-makes-it-heavier.expect.predict.diagnosis.2.next" = "Stelle unter jedes Feuer in diesem Kodex eine Waage: Etwas bleibt immer übrig oder verlässt *als etwas* — ein Gas mit Masse, eine Asche mit Masse. `mass-in-an-open-vessel` fängt die entweichende Masse mitten im Flug ein; kein Konto in diesem Labor bucht je auf null."
"burning-makes-it-heavier.registers.lv1" = "Es brennt mit einem weißen Licht, so grell, dass es beim Hinsehen schmerzt, und hinterlässt ein Pulver, das weißer ist als das Band war. Leg es zurück auf die Waage: Es ist schwerer. Etwas aus der Luft ist hinzugekommen — die Luft ist nicht nichts, und das ist eines der wenigen Experimente, bei denen du diese Tatsache wiegen kannst."
"burning-makes-it-heavier.registers.lv2" = "0,0494 mol Mg (1,20 g ÷ 24,305) werden zu 0,0494 mol MgO, das sind 1,99 g. Der Zuwachs von 0,79 g entspricht 0,0247 mol O₂ bei 31,998 g/mol, aus der Atmosphäre entnommen. Masse bleibt über das gesamte System erhalten; der Tiegel ist nicht das gesamte System, und die fehlende Buchung ist die Luft."
"burning-makes-it-heavier.registers.lv3" = "Der Sauerstoff wird aus einem Reservoir gezogen statt aus dem Inventar des Gefäßes, weshalb die Masse des Gefäßes steigt — eine bewusste Modellierungsentscheidung, die einem offenen Tiegel entspricht. Die adiabatische Lösung pendelt sich bei 3042 K mit dominierendem kondensiertem Oxid ein; bei dieser Temperatur sind MgO(g) und atomares Mg in den NASA-Daten thermodynamisch vorhanden, aber bei 1 bar vernachlässigbar, sodass im Wesentlichen das gesamte Metall als wägbarer Feststoff zurückgewonnen wird."
"burning-makes-it-lighter.expect.predict.question" = "1,20 g Holzkohle, vollständig verbrannt in demselben Tiegel, in dem Magnesium schwerer wurde. Was zeigt die Waage danach?"
"burning-makes-it-lighter.expect.predict.options" = ["1,20 g — die Masse bleibt erhalten", "Mehr als 1,20 g, wie beim Magnesium", "Praktisch nichts — der Tiegel ist leer"]
"burning-makes-it-lighter.expect.predict.misconception" = "Nachdem gerade gelehrt wurde, dass Verbrennen Masse hinzufügt, überkorrigieren Lernende und erwarten, dass jedes Feuer zunimmt. Beide Feuer nehmen Sauerstoff auf; der Unterschied liegt ganz darin, ob das Oxid ein Feststoff oder ein Gas ist. Magnesiumoxid bleibt; Kohlenstoffdioxid entweicht. An der Erhaltung hat sich zwischen den beiden Experimenten nichts geändert — nur die Phase des Produkts."
"burning-makes-it-lighter.expect.predict.diagnosis.0.reveals" = "Die Erhaltung wird wieder auf den Tiegel festgeklammert, diesmal von der anderen Seite: Gase zählen nicht als entweichende Masse, also sollte der Messwert bestehen bleiben."
"burning-makes-it-lighter.expect.predict.diagnosis.0.next" = "Verschließe es und verbrenne — Lavoisiers Schachzug: geschlossen bleibt der Messwert exakt bestehen; offen trägt das CO₂ seine Masse nach oben davon. Dasselbe Gesetz beide Male, die Grenze einmal ehrlich gezogen."
"burning-makes-it-lighter.expect.predict.diagnosis.1.reveals" = "Die vorherige Lehre überkorrigierte zu einer neuen Regel: Verbrennen fügt Sauerstoff hinzu, Sauerstoff hat Masse, also muss jede Asche schwerer sein — die Phase des Produkts hat in der Regel noch keinen Platz."
"burning-makes-it-lighter.expect.predict.diagnosis.1.next" = "Gewähre die Prämisse und frage dann, wo das Oxid *ist*: MgO sitzt im Tiegel; CO₂ ist im Raum. Beide Feuer haben Sauerstoff aufgenommen — wiege stattdessen das entweichende Gas (`mass-in-an-open-vessel`), und der Zuwachs des Kohlenstoffs erscheint wieder, in der Luft."
"burning-makes-it-lighter.registers.lv1" = "Die Holzkohle glüht orange, und dann bleibt nichts mehr zu wiegen übrig. Sie tat dasselbe wie das Magnesium — sie verband sich mit der Luft —, aber was dabei entstand, war unsichtbar und schwebte davon. Deshalb sehen Lagerfeuer wie Zerstörung aus, und deshalb glaubten Menschen jahrhundertelang, dass Verbrennen Dinge zerstört."
"burning-makes-it-lighter.registers.lv2" = "0,0999 mol C (1,20 g ÷ 12,011) werden zu 0,0999 mol CO₂ — 4,40 g Gas, vollständig aus dem Tiegel verschwunden, der 0,00 g zeigt. Das System nahm 3,20 g Sauerstoff auf, und das Gefäß verlor 1,20 g Kohlenstoff; die beiden Experimente unterscheiden sich in der Phase des Produkts und in nichts sonst."
"burning-makes-it-lighter.registers.lv3" = "Die adiabatische Flamme pendelt sich bei 2216 °C ein, gegenüber 2769 °C bei Magnesium, und der Unterschied liegt nicht daran, welche Reaktion 'stärker' ist — Kohlenstoffs ΔH pro Mol O₂ ist vergleichbar —, sondern daran, wohin die Energie geht: Das Produkt hier ist ein Gas, das sie in Translations- und Schwingungsmoden mit sich forträgt, während Magnesiumoxid eine kondensierte Phase mit weit weniger Aufnahmefähigkeit ist. Flammtemperatur ist eine Enthalpiebilanz, keine Rangliste von Brennstoffen."
"flame-temperature-is-a-balance-not-a-property.summary" = "2 Mg + O₂ → 2 MgO von 228 °C → 2177 °C; dieselbe Reaktion von 927 °C → 2769 °C"
"flame-temperature-is-a-balance-not-a-property.expect.predict.question" = "Zwei identische 1,2-g-Magnesiumbänder brennen in identischer Luft. Das eine ist kaum warm, wenn es sich entzündet (228 °C); das andere glüht bereits (927 °C). Erreichen die beiden Flammen dieselbe Temperatur?"
"flame-temperature-is-a-balance-not-a-property.expect.predict.options" = ["Ja — die Flammentemperatur ist eine Eigenschaft von Magnesium", "Nein: 2177 °C und 2769 °C. Die zuerst hineingesteckte Wärme steckt noch in den Produkten", "Nein — das heißere brennt schneller und landet deshalb kühler"]
"flame-temperature-is-a-balance-not-a-property.expect.predict.misconception" = "'Adiabatische Flammtemperatur von Magnesium' wird als Konstante auswendig gelernt, wie ein Schmelzpunkt. Sie ist keine Eigenschaft des Brennstoffs; sie ist die Antwort auf eine Enthalpiebilanz, und die Enthalpie der Edukte ist eine der Eingangsgrößen. Erwärmt man die Edukte vor, erhält man eine heißere Flamme, und genau deshalb erwärmen Industrieöfen ihre Luft vor."
"flame-temperature-is-a-balance-not-a-property.expect.predict.diagnosis.0.reveals" = "Flammtemperatur als Stoffkonstante, eingeordnet neben dem Schmelzpunkt: ein Brennstoff, eine Zahl, unabhängig davon, in welchem Zustand er startete."
"flame-temperature-is-a-balance-not-a-property.expect.predict.diagnosis.0.next" = "Ändere nur die Startenthalpie und lies die Antwort ab: 700 Grad mehr Vorwärmung, rund 600 Grad mehr Flamme. Eine Konstante kann nicht darauf reagieren, wie du begonnen hast; eine Bilanz muss es — und Öfen erwärmen ihre Luft vor, weil Ingenieure nach dieser Bilanz rechnen."
"flame-temperature-is-a-balance-not-a-property.expect.predict.diagnosis.1.reveals" = "Geschwindigkeit verbraucht die Wärme: der heißere Start brennt schneller, und schneller bedeutet irgendwie, dass die Energie früher aufgebraucht ist und kühler endet — Geschwindigkeit wird mit dem Energiebudget vermengt."
"flame-temperature-is-a-balance-not-a-property.expect.predict.diagnosis.1.next" = "Adiabatisch bedeutet, dass das Konto alles behält, egal wie schnell es geht: derselbe Brennstoff, derselbe Sauerstoff, mehr Startenthalpie — mehr Endenthalpie, Punkt. Die Geschwindigkeit entscheidet, wie schnell die Produkte ihre Temperatur erreichen, niemals, welche Temperatur das ist."
"flame-temperature-is-a-balance-not-a-property.registers.lv1" = "Zwei identische Bänder, beide verbrannt, beide blendend hell — und die eine Flamme ist sechshundert Grad heißer als die andere. Der einzige Unterschied war, wie warm das Metall war, als es sich entzündete. Wärme, die du vorher hineingegeben hast, verschwindet nicht, wenn das Feuer beginnt; sie ist immer noch da, obendrauf addiert."
"flame-temperature-is-a-balance-not-a-property.registers.lv2" = "Adiabatisch bedeutet, dass keine Wärme entweicht, sodass die Enthalpie der Produkte der der Edukte entspricht. Beginnt man bei 228 °C, landet die Lösung bei 2176,97 °C; beginnt man bei 926,9 °C — der Zündtemperatur, die das Labor verwendet — landet sie bei 2768,67 °C. Dieselbe Reaktionsenthalpie ΔH, −601 kJ/mol; andere Startenthalpie, andere Antwort."
"flame-temperature-is-a-balance-not-a-property.registers.lv3" = "Der Löser halbiert das Intervall über der Temperatur, bis die Enthalpie der Produkte der der Edukte entspricht, wobei beide anhand der NASA-9-Polynome ausgewertet werden statt eine konstante Wärmekapazität anzunehmen — was wichtig ist, denn Cp steigt über zweitausend Kelvin hinweg erheblich an. Der Luftanteil des Gefäßes steckt ebenfalls in der Bilanz, und er ist die dominierende Wärmesenke: Ein Gramm Magnesium erwärmt die Luft um sich herum weit mehr, als es das winzige Oxidkorn erwärmt, das es hinterlässt."
"why-the-shelf-is-not-on-fire.summary" = "Mg + ½O₂ → MgO ist bei jeder Temperatur begünstigt; bei 224 °C liegt das Band einfach nur da"
"why-the-shelf-is-not-on-fire.expect.predict.question" = "Magnesium und Sauerstoff setzen 601 kJ pro Mol frei — die Thermodynamik sagt, das Metall dürfte in Luft gar nicht existieren. Zwei Bänder werden erhitzt: eines auf 224,3 °C, eines auf 228,4 °C. Was geschieht?"
"why-the-shelf-is-not-on-fire.expect.predict.options" = ["Beide brennen — die Reaktion ist bei beiden Temperaturen begünstigt", "Keines brennt — 228 °C sind bei Weitem nicht heiß genug", "Nur das zweite brennt. Vier Grad sind der Unterschied zwischen nichts und allem", "Das erste brennt langsam, das zweite schnell"]
"why-the-shelf-is-not-on-fire.expect.predict.misconception" = "'Die Reaktion setzt Energie frei, also läuft sie ab' ist die mit Abstand häufigste Vermischung in der Chemie, und die letzte Option ist ihre mildere Form — der Glaube, eine ungünstige Geschwindigkeit bedeute eine langsame Reaktion statt keine Reaktion. Das Gleichgewicht sagt, wo ein System enden würde; es sagt nichts darüber, ob es dorthin gelangen kann. Ein Magnesiumband in einer Schublade ist thermodynamisch verzweifelt darauf aus, zu Oxid zu werden, und wird trotzdem ein Jahrhundert lang dort liegen bleiben, weil eine Oxidhaut im Weg steht."
"why-the-shelf-is-not-on-fire.expect.predict.diagnosis.0.reveals" = "Thermodynamik als hinreichende Bedingung: freigesetzte Energie bedeutet, es geschieht — die Barriere zwischen hier und dem begünstigten Endzustand hat im Bild keinen Platz."
"why-the-shelf-is-not-on-fire.expect.predict.diagnosis.0.next" = "Das Vier-Grad-Experiment macht die Barriere sichtbar: 224,3 °C, nichts; 228,4 °C, alles. Die Begünstigung hat sich zwischen diesen beiden Messwerten nicht um so viel wie ein Joule verändert — der Zugang schon."
"why-the-shelf-is-not-on-fire.expect.predict.diagnosis.1.reveals" = "Zündung als Extremzustand per Definition: ein paar hundert Grad fühlen sich zu zahm an, als dass ein Metall sich entzünden würde, also wird die Schwelle irgendwo weit entfernt und dramatisch vermutet."
"why-the-shelf-is-not-on-fire.expect.predict.diagnosis.1.next" = "Führe es aus: 228 °C liegt über der Schwelle dieses Bandes, und von dort steigt es auf über 2000. Schwellen liegen dort, wo die Bilanz sie hinlegt, nicht dort, wo Dramatik es nahelegt — weshalb dieser Eintrag dich bittet, dich zuerst auf eine Zahl festzulegen."
"why-the-shelf-is-not-on-fire.expect.predict.diagnosis.2.reveals" = "Geschwindigkeit als Regler, der nie null anzeigt: alles geschieht mit irgendeiner Geschwindigkeit, also kann 'ungünstig' nur langsam bedeuten — 'läuft nicht ab' ist keine verfügbare Antwort."
"why-the-shelf-is-not-on-fire.expect.predict.diagnosis.2.next" = "Beobachte das kühlere Band, so lange du willst: kein Schwelen, kein schleichender Massezuwachs auf der Waage — nichts. Das Band, das ein Jahrhundert in einer Schublade liegt, ist die lange Version desselben Vorgangs; die Oxidhaut verlangsamt die Reaktion nicht, sie steht ihr im Weg."
"why-the-shelf-is-not-on-fire.registers.lv1" = "Zwei identische Bänder. Erhitze das eine auf 224 °C, und es ist nur ein heißes Band. Erhitze das andere vier Grad weiter, und es bricht in ein zweitausend Grad heißes Feuer aus. Weder am Metall noch an der Luft hat sich etwas verändert — es gibt eine Linie, und alles hängt davon ab, auf welcher Seite davon du dich befindest."
"why-the-shelf-is-not-on-fire.registers.lv2" = "Das Gleichgewicht sagt, Magnesium in Luft sollte bei jeder Temperatur Magnesiumoxid sein: ΔH = −601 kJ/mol, und ΔG ist durchgehend negativ. Ist es nicht, weil eine geschlossene Oxidschicht den Sauerstoff daran hindert, das Metall zu erreichen. Das Labor kodiert das mit einer expliziten Schwelle bei 500 K (226,85 °C): darunter zieht sich der thermische Löser zurück und lässt Feststoffe unangetastet, und 224,29 °C hinterlassen 1,20 g Metall, während 228,4 °C 1,99 g Oxid ergeben."
"why-the-shelf-is-not-on-fire.registers.lv3" = "Diese Schwelle ist ein eingestandener Behelf, kein kinetisches Modell. Das Labor berechnet das Gleichgewicht, und das Gleichgewicht würde jedes Metall im Labor augenblicklich oxidieren; eine echte Behandlung bräuchte Aktivierungsenergien, eine Arrhenius-Geschwindigkeit und ein Diffusionsmodell für die passivierende Schicht, was ein Anliegen von L5 ist und nicht verdrahtet ist. Der ehrliche Schritt ist, die Grenze zu einer benannten Konstante zu machen, die ein Lernender lesen kann — KINETIC_THRESHOLD_K —, statt das Gleichgewicht still über die Welt lügen zu lassen. Lies 226,85 °C nicht als Zündtemperatur von Magnesium; lies es als die Aussage des Labors 'hier lebt Kinetik, und ich modelliere sie nicht'."
"a-spark-that-changes-nothing.summary" = "KCl + Funke → KCl (lila Flamme, 5,00 g hinein, 5,00 g heraus)"
"a-spark-that-changes-nothing.expect.predict.question" = "Halte 5,00 g Kaliumchlorid in eine Flamme. Die Flamme färbt sich lila. Was zeigt die Waage danach, und welche Temperatur hat das Salz?"
"a-spark-that-changes-nothing.expect.predict.options" = ["Leichter, und heiß — ein Teil ist verbrannt, um die Farbe zu erzeugen", "5,00 g und 25 °C. Nichts ist verbrannt; die Farbe ist Licht, kein Feuer", "Schwerer — es hat sich mit Sauerstoff verbunden, so wie das Magnesium"]
"a-spark-that-changes-nothing.expect.predict.misconception" = "Eine farbige Flamme sieht aus wie Verbrennung, also wird angenommen, das Salz sei der Brennstoff. Das ist es nicht: Die Flamme regt das äußere Elektron des Kaliums an, und die Farbe ist das, was dieses Elektron beim Zurückfallen aussendet. Nichts wird verbraucht, und ein Flammentest an einem Milligramm läuft weiter, solange du es hineinhältst. Dies ist auch der Eintrag, der zeigt, wie ein Nullergebnis aussieht — drei Dinge, die nicht geschehen sind, jedes davon überprüft."
"a-spark-that-changes-nothing.expect.predict.diagnosis.0.reveals" = "Farbe gilt als Quittung der Verbrennung: Wenn es leuchtet, wird etwas verbraucht — Licht ohne Brennstoff kommt im Bild nicht vor."
"a-spark-that-changes-nothing.expect.predict.diagnosis.0.next" = "Wiege es danach und miss die Temperatur: 5,00 g, 25 °C — ein Nullergebnis, bei dem jede Negation geprüft wurde. Das Lila ist ein Elektron, das in sein Regal zurückfällt, keine entweichende Materie; ein Milligramm würde die Flamme so lange färben, wie du es hineinhalten würdest."
"a-spark-that-changes-nothing.expect.predict.diagnosis.1.reveals" = "Die Magnesium-Vorlage, auf jeden Feststoff in einer Flamme angewendet: metallartiges Ding plus Feuer ergibt Oxid plus Massezuwachs."
"a-spark-that-changes-nothing.expect.predict.diagnosis.1.next" = "Frage, was sich ändern müsste, damit die Vorlage passt: Die Ionen des Kaliumchlorids befinden sich bereits in ihren stabilen Zuständen und haben dem Sauerstoff nichts zu bieten. Der Flammentest funktioniert *weil* nichts reagiert — genau das erlaubt es ihm, ein Element zu identifizieren, ohne die Probe zu zerstören."
"a-spark-that-changes-nothing.registers.lv1" = "Halte das Salz in eine Flamme, und die Flamme färbt sich lila — eine völlig andere Farbe als bei demselben Brenner einen Moment zuvor. Wiege das Salz: unverändert. Fasse es an, sobald es aus der Flamme ist: kalt. Du hast das Metall identifiziert, ohne davon auch nur etwas zu verbrauchen, weshalb dieser Test fast zweihundert Jahre alt ist und immer noch verwendet wird."
"a-spark-that-changes-nothing.registers.lv2" = "Das Labor meldet einen Flammentest und sonst nichts: keine Zündung, kein Verbrauch, kein Gas. 5,00 g hinein, 5,00 g heraus, 25,00 °C vorher und nachher. Kalium ergibt Lila, Natrium Gelb, Calcium Orangerot — die Farbe identifiziert das Kation, und das Anion bleibt für den Test unsichtbar."
"a-spark-that-changes-nothing.registers.lv3" = "Hier werden zwei getrennte Dinge behauptet, und sie stammen aus unterschiedlichen Quellen. Dass nichts verbrennt, ist berechnet: Der Gibbs-Minimierer findet keinen exothermen Pfad, und das Labor stellt das Gefäß exakt wieder her. Dass die Flamme lila ist, ist kuratierte Spektroskopie — das Dublett des Kaliums bei 766,5/769,9 nm plus die violetten Linien —, weil die thermodynamischen Datenbanken keine Daten zu elektronischen Übergängen enthalten und das Labor keine erfindet. Bemerkenswert auch: Die Gleichgewichtszusammensetzung enthält Spuren von Cl₂ auf Nanomol-Niveau, und das Labor weigert sich, sie anzukündigen, weil eine Spur keine Beobachtung ist."
"weigh-before-and-after.summary" = "5,844 g NaCl + 100 mL Wasser = 105,54 g; verdampft das Wasser, bleiben 5,84 g übrig"
"weigh-before-and-after.expect.predict.question" = "Löse 5,844 g Salz in 100 mL Wasser — die Schale zeigt 105,54 g. Koche das Wasser weg. Was zeigt die Schale jetzt?"
"weigh-before-and-after.expect.predict.options" = ["0 g — alles ist verdampft", "5,84 g — das Salz bleibt zurück", "105,54 g — die Masse bleibt erhalten", "Weniger als 5,84 g — etwas Salz entweicht mit dem Dampf"]
"weigh-before-and-after.expect.predict.misconception" = "Jüngere Lernende denken oft, Lösen zerstöre das Salz, sodass nichts übrig bleiben sollte; ältere, die die Erhaltung gelernt haben, wenden sie auf die Schale an und erwarten die gesamten 105,54 g. Die Messung, die es klärt, ist das Paar — vorher und nachher, auf derselben Waage —, weshalb man die erste Zahl aufschreibt, bevor man beginnt, statt erst nachdem man die zweite gesehen hat."
"weigh-before-and-after.expect.predict.diagnosis.0.reveals" = "Lösen habe das Salz zerstört, also vollende das Kochen nur das Verschwinden — was aus dem Blick verschwand, sei aus der Existenz verschwunden."
"weigh-before-and-after.expect.predict.diagnosis.0.next" = "Koche es und sieh in die Schale: 5,84 g Kristalle, die Masse, die hineinkam, wieder auf derselben Waage. `particles` zeigt, wo das Salz die ganze Zeit war — aus dem Blick war nie aus dem Konto."
"weigh-before-and-after.expect.predict.diagnosis.1.reveals" = "Die Erhaltung wird an die Schale geheftet: Der Messwert ist das System, also müssen die vollen 105,54 g das Kochen überstehen."
"weigh-before-and-after.expect.predict.diagnosis.1.next" = "Wiege, was entwich: 99,7 g Wasser sind jetzt Dampf im Raum und tragen ihre Masse mit sich. Das Vorher-Nachher-Paar auf einer Waage ist genau das Instrument, um eine falsch gezogene Grenze zu erwischen — weshalb die erste Zahl zuerst aufgeschrieben wird."
"weigh-before-and-after.expect.predict.diagnosis.2.reveals" = "Verdampfen als allgemeiner Träger: Was auch immer in der Flüssigkeit ist, reist mit dem Dampf hinaus, Sole und alles."
"weigh-before-and-after.expect.predict.diagnosis.2.next" = "Prüfe, was der Dampf tragen kann: Bei diesen Temperaturen haben die Ionen des Salzes keinen Weg ins Gas, weshalb das Verdampfen von Meerwasser genau die Art ist, wie Salz *hergestellt* wird — und weshalb sich Kesselstein hartnäckig hält, statt wegzudampfen."
"weigh-before-and-after.registers.lv1" = "Das Salz verschwand im Wasser, und du kannst es nicht mehr sehen. Koche das Wasser weg, und da ist es wieder, dieselbe Menge, mit der du begonnen hast. Es war nie weg — und der Weg, wie du es weißt statt nur glaubst, besteht darin, dass du das Gewicht vorher aufgeschrieben hast und vergleichen kannst."
"weigh-before-and-after.registers.lv2" = "105,54 g vorher, 5,84 g nachher: 99,70 g verließen es als Wasserdampf, was den 100 mL Wasser bei 0,997 g/mL entspricht. Das zurückgewonnene Salz, 5,84 g, entspricht den eingesetzten 5,844 g — eine Wiedergewinnung von 99,9 %. Die Stoffmenge bleibt über das Lösen und das Verdampfen hinweg erhalten; nur das Wasser ist irgendwohin gegangen."
"weigh-before-and-after.registers.lv3" = "Nichts davon ist trivial im Labor: Der wässrige Löser hielt 0,1000 mol Na⁺ und 0,1000 mol Cl⁻ in Lösung, und die Verdampfung zur Trockne muss sie als festes NaCl zurückgeben, ohne ein Mol zu verlieren. Eine sinnvolle Grenze zum Ausprobieren danach: Verdampfe in zwei Schritten statt in einem, und das Labor meldet 'noch nicht modelliert' — festes Salz in Kontakt mit dem letzten Flüssigkeitsfilm ist ein Regime, das kein verdrahteter Löser besitzt. Der einstufige Weg ist sauber; der zweistufige ist ehrlich darüber, es nicht zu sein."
"the-salt-comes-back-the-ribbon-does-not.summary" = "Lösen kehrt sich um, wenn das Wasser entweicht; Verbrennen kehrt sich bei keiner Temperatur um — der Unterschied ist, ob ein neuer Stoff entstanden ist"
"the-salt-comes-back-the-ribbon-does-not.expect.predict.question" = "Zwei Dinge verschwanden auf diesem Labor: Salz verschwand in Wasser, und ein Magnesiumband verschwand in Flammen. Welches der beiden kannst du rückgängig machen?"
"the-salt-comes-back-the-ribbon-does-not.expect.predict.options" = ["Beides — Chemie kann immer rückgängig gemacht werden, wenn man clever genug ist", "Keins von beiden — einmal verschwunden, bleibt ein Stoff verschwunden", "Nur das Salz: Kochst du das Wasser weg, kehren die Kristalle zurück; kein noch so großes Erhitzen oder Abkühlen macht das Verbrennen des Bandes rückgängig"]
"the-salt-comes-back-the-ribbon-does-not.expect.predict.misconception" = "Die beiden Verschwindensvorgänge sind für das Auge dasselbe Ereignis und darunter entgegengesetzte Ereignisse. Das Salz ist immer noch Natriumchlorid, versteckt als Ionen — entfernt man das Wasser, muss es zurückkommen. Auch die Atome des Bandes sind alle noch vorhanden, aber in neuer Gesellschaft: Magnesiumoxid ist ein neuer Stoff, und Temperatur kann keine chemische Bindung auflösen, die Wärme selbst begünstigt. Diese beiden Verschwindensvorgänge auseinanderzuhalten ist die Definition einer chemischen Reaktion."
"the-salt-comes-back-the-ribbon-does-not.expect.predict.diagnosis.0.reveals" = "Umkehrbarkeit als Cleverness statt als Eigenschaft dessen, was geschah — Lösen und Reagieren werden als dieselbe Art von Verschwinden eingeordnet, rückgängig zu machen mit demselben Trick."
"the-salt-comes-back-the-ribbon-does-not.expect.predict.diagnosis.0.next" = "Probiere beides auf diesem Labor aus: Dampfe die Sole ein, und die Kristalle kehren zurück, das Massekonto bleibt intakt. Erhitze die Asche, kühle sie ab, warte an ihr — Magnesiumoxid bleibt sie. Sie rückgängig zu machen braucht einen neuen chemischen Partner und sehr viel Energie (die Industrie macht es durch Elektrolyse des geschmolzenen Salzes), keine klügere Anwendung von Wärme."
"the-salt-comes-back-the-ribbon-does-not.expect.predict.diagnosis.1.reveals" = "Auflösung als Zerstörung — der Standardgedanke jüngerer Lernender: Das Salz sei genauso weg wie das Band, und weg sei weg."
"the-salt-comes-back-the-ribbon-does-not.expect.predict.diagnosis.1.next" = "Die Waage war nie einverstanden: Die Sole wiegt das Salz die ganze Zeit mit (`weigh-before-and-after`), und das Verdampfen gibt es als Kristalle zurück, die du in Gramm zählen kannst. Die beiden Verschwindensvorgänge unterscheiden sich darin, was übrig bleibt — derselbe Stoff, versteckt, oder ein neuer Stoff, entstanden — und dieser Unterschied ist der ganze Inhalt der Worte 'chemische Reaktion'."
"the-salt-comes-back-the-ribbon-does-not.registers.lv1" = "Das Salz versteckte sich im Wasser — koche das Wasser weg, und da ist es wieder, weiß und scharfkantig. Das Band versteckte sich nicht: Es *wurde* etwas Neues, und kein noch so großes Entwärmen bringt es zurück. Das ist der Unterschied zwischen etwas mischen und es wirklich verändern."
"the-salt-comes-back-the-ribbon-does-not.registers.lv2" = "Lösen ist eine physikalische Veränderung: NaCl(s) → Na⁺(aq) + Cl⁻(aq), umkehrbar durch Entfernen des Lösungsmittels — verdampfe 95 % des Wassers, und 0,069 mol Kristalle kehren zurück, der Rest bleibt in den letzten 5 mL gelöst. Verbrennen ist eine chemische Veränderung: 2 Mg + O₂ → 2 MgO, ein neuer Stoff mit neuen Eigenschaften, und keine Temperatur kehrt sie um."
"the-salt-comes-back-the-ribbon-does-not.registers.lv3" = "Beide Hälften sind berechnet, und beide tragen ihr Kleingedrucktes. Die zu 95 % verdampfte Sole enthält 0,0692 mol festes Salz neben 0,031 mol, das noch in Lösung ist — die Löslichkeit bleibt bis zum letzten Milliliter ein Verhältnis zum verbleibenden Wasser, was die Subtraktion von `crystallising-salt-from-brine` fast bis an ihr Ende getrieben ist. Die Asche-Seite: Der thermische Löser antwortet bei jeder Temperatur, die dieses Labor erreichen kann, mit 'Magnesiumoxid', weil das Oxid überall energetisch unterhalb des Metalls liegt — es umzukehren ist keine Temperaturfrage, sondern eine Elektronenfrage, weshalb die Industrie das geschmolzene Chlorid elektrolysiert, statt das Oxid zu erhitzen. Eine Grenze ausdrücklich benannt: Das Verdampfen bis zur *vollständigen* Trockne lässt derzeit die letzte Spur Ionen als wässrig markiert zurück, ohne Wasser, in dem sie wässrig sein könnten — ein Zustand, für den die Registry noch keine Geschichte hat —, weshalb dieser Eintrag bei 95 % stehen bleibt."
"a-nanomole-is-not-a-cloud.summary" = "1,5 µmol Ag⁺ + 1,5 µmol Cl⁻ in 100 mL: Silberchlorid entsteht, und es wird keine Fällung gemeldet"
"a-nanomole-is-not-a-cloud.expect.predict.question" = "Zwei Bechergläser, beide über dem Löslichkeitsprodukt, sodass sich in beiden Silberchlorid bildet. Im ersten beträgt die gebildete Menge 0,16 µmol; im zweiten 1,7 µmol. Was meldet das Labor?"
"a-nanomole-is-not-a-cloud.expect.predict.options" = ["Ein Niederschlag in beiden — die Chemie ist dieselbe", "Ein Niederschlag in keinem — beide sind viel zu verdünnt, um sichtbar zu sein", "Ein Niederschlag nur im zweiten: Das erste liegt unter der Beobachtungsgrenze von 1 µmol"]
"a-nanomole-is-not-a-cloud.expect.predict.misconception" = "Die unausgesprochene Annahme ist, dass das Experiment zeigt, was auch immer die Chemie tut. Jedes Instrument hat eine Untergrenze, und darunter erzeugt eine reale Veränderung kein Signal — das ist nicht das Instrument, das lügt, sondern das Instrument, das eine Spezifikation hat. 'Ich habe es nicht erkannt' mit 'es ist nicht geschehen' zu verwechseln ist, wie ein Nullergebnis überinterpretiert wird, und die Lösung ist, die Nachweisgrenze zu kennen, bevor man misst."
"a-nanomole-is-not-a-cloud.expect.predict.diagnosis.0.reveals" = "Das Experiment zeigt, was auch immer die Chemie tut — Instrumente als durchsichtige Fenster, ohne eigene Untergrenze."
"a-nanomole-is-not-a-cloud.expect.predict.diagnosis.0.next" = "Lies die Spezifikation, die dieses Labor über sich selbst veröffentlicht: Die Beobachtungsgrenze liegt bei einem Mikromol. Die 0,16 µmol des ersten Becherglases sind real, im Konto, und unterhalb der Grenze — 'nicht gezeigt' und 'nicht vorhanden' sind unterschiedliche Aussagen, und ein ehrliches Instrument sagt, welche davon es meint."
"a-nanomole-is-not-a-cloud.expect.predict.diagnosis.1.reveals" = "Der richtige Instinkt, aber unkalibriert: Nachweisgrenzen existieren, aber sie liegen dort, wo die Vorsicht sie sich vorstellt — und beide Mengen 'fühlen sich' unsichtbar an."
"a-nanomole-is-not-a-cloud.expect.predict.diagnosis.1.next" = "Die Grenze ist eine Zahl, keine Stimmung: hier 1 µmol. 1,7 liegt darüber und wird gemeldet; 0,16 liegt darunter und wird benannt statt gezeigt. Die Grenze *vor* dem Lauf zu kennen ist es, was aus 'nichts gesehen' Information macht statt eines Achselzuckens."
"a-nanomole-is-not-a-cloud.registers.lv1" = "Zwei Bechergläser mit fast unmessbar kleinen Prisen Chemikalie. In beiden geschieht wirklich etwas. Nur eines der beiden zeigt dir etwas. Jedes Messgerät hat eine kleinste Sache, die es bemerken kann, und darunter sagt es überhaupt nichts — was nicht dasselbe ist, wie wenn nichts da wäre."
"a-nanomole-is-not-a-cloud.registers.lv2" = "Beide Mischungen überschreiten Ksp(AgCl) ≈ 1,8 × 10⁻¹⁰, sodass sich in beiden Feststoff bildet. In v1 können sich nur etwa 0,16 µmol bilden, unterhalb der Beobachtungsgrenze des Labors von 1 µmol, und es wird kein Fällungs-Ereignis ausgelöst; in v2 bilden sich etwa 1,7 µmol, und das Ereignis feuert. Ein `inspect` von v1 zeigt Silberchlorid weiterhin in seinem Inventar — die Buchführung ist exakt, und nur die Meldung ist begrenzt."
"a-nanomole-is-not-a-cloud.registers.lv3" = "Die Grenze ist OBSERVABLE_MOLES = 10⁻⁶ mol, einheitlich angewendet auf Fällung, Auflösung und Gasentwicklung. Sie ist ein bewusster Ersatz für eine Gerätespezifikation: Ein echter Trübungsmesser, eine echte Nase und eine echte Waage haben alle Grenzen, und eine Simulation, die jedes Nanomol ankündigt, trainiert einen Lernenden darauf, eine Empfindlichkeit zu erwarten, die kein Labor besitzt. Die Zahl ist eine Modellierungsentscheidung, keine gemessene Konstante, und es lohnt sich, ausdrücklich zu sagen, dass ein Nephelometer AgCl weit darunter sehen würde, während ein Auge es weit darüber nicht sehen würde."
"when-the-lab-says-it-does-not-know.summary" = "Gips(s) + Propanon(l) → nicht modelliert"
"when-the-lab-says-it-does-not-know.expect.predict.question" = "Gips wird statt in Wasser in Aceton eingerührt. Was sollte ein Chemieprogramm tun?"
"when-the-lab-says-it-does-not-know.expect.predict.options" = ["Es auflösen — es hat sich in Wasser gelöst, also löst es sich", "'Noch nicht modelliert' melden: Kein eingebundener Solver deckt dieses Salz in einem nicht-wässrigen Lösungsmittel ab", "Mit einem Fehler abstürzen", "Das Salz stillschweigend am Boden liegen lassen, als wäre das die berechnete Antwort"]
"when-the-lab-says-it-does-not-know.expect.predict.misconception" = "Von Software wird erwartet, dass sie antwortet. Der verlockende Fehlschlag ist die letzte Option — still nichts zu tun und Schweigen als Ergebnis lesen zu lassen, was von 'es ist unlöslich' nicht zu unterscheiden ist und hier zufällig ungefähr richtig ist, aus völlig falschem Grund. Ein Modell, das dir nicht sagen kann, wo es aufhört, hat dir nirgendwo etwas gesagt, dem du vertrauen kannst."
"when-the-lab-says-it-does-not-know.expect.predict.diagnosis.0.reveals" = "Löslichkeit gehört allein dem Salz: Es löst sich, Punkt — das Lösungsmittel ist austauschbare Kulisse statt der halbe Beitrag zu jeder Auflösung."
"when-the-lab-says-it-does-not-know.expect.predict.diagnosis.0.next" = "Benenne, was der Löser tatsächlich weiß: das Verhalten von Wasser, aus einer thermodynamischen Datenbank über Wasser. Gips ist in Aceton tatsächlich im Wesentlichen unlöslich — aber das Labor verweigert selbst diese Aussage ohne eine kuratierte Zeile, die es weiß, und das ist der Unterschied zwischen Rechthaben und Glückhaben."
"when-the-lab-says-it-does-not-know.expect.predict.diagnosis.1.reveals" = "Software habe genau zwei Zustände, Antwort oder Fehler: Ein ausdrückliches 'Ich weiß es nicht' gehört nicht zum Vokabular, also sei die einzige Alternative zum Antworten das Abstürzen."
"when-the-lab-says-it-does-not-know.expect.predict.diagnosis.1.next" = "Führe es aus: `not_yet_modelled` erscheint als vollwertiges Ergebnis, mit Herkunftsangabe, und die CI lässt jede Lektion fehlschlagen, die schweigt, statt es zu sagen. Der dritte Zustand ist die gesamte Prämisse dieses Programms — ein Modell, das seinen eigenen Rand benennen kann."
"when-the-lab-says-it-does-not-know.expect.predict.diagnosis.2.reveals" = "Die subtilste: Schweigen wird als Antwort gelesen. Ein Programm, das nichts tut, hat 'gesagt', das Salz sei unlöslich — und ungefähr richtig zu liegen verdeckt, dass überhaupt nichts berechnet wurde."
"when-the-lab-says-it-does-not-know.expect.predict.diagnosis.2.next" = "Genau dieser Fehler steckt in der eigenen Geschichte des Projekts: 'nichts entzündet' bedeutete einst 'kein Löser beteiligt', gemeldet, als wäre es eine Tatsache über Ethanol. Die Regel, die das erzwang — wo auch immer das Labor ablehnt, etwas zu modellieren, sagt es das — steht in PLAN.md, und dieser Eintrag ist diese Regel in Lehrform."
"when-the-lab-says-it-does-not-know.registers.lv1" = "Frage das Labor etwas, das es nicht weiß, und es sagt dir, dass es das nicht weiß. Es rät nicht, und es tut nicht so, als wäre das Schweigen eine Antwort gewesen. Den Rand dessen zu kennen, was man weiß, gehört dazu, überhaupt etwas zu wissen — und eine Person, die sagen kann 'Dafür habe ich keine Methode', ist nützlicher als eine, die immer eine Zahl parat hat."
"when-the-lab-says-it-does-not-know.registers.lv2" = "Die Datenbanken des wässrigen Labors sind für Wasser parametrisiert: Aktivitätsmodelle, Löslichkeitsprodukte und Speziation beruhen alle auf wässrigen Standardzuständen. Aceton ist eine Flüssigkeit, die das Labor halten und eingießen kann, und für manche gelösten Stoffe in manchen organischen Lösungsmitteln antwortet inzwischen eine kuratierte Handbuchzeile (die nahezu-Unlöslichkeit von NaCl in Ethanol, die hohe Löslichkeit von CaCl2 in Aceton, zum Beispiel) — aber für dieses Salz in diesem Lösungsmittel existiert noch keine Zeile, also gibt der Ehrlichkeitsdurchlauf 'noch nicht modelliert' aus statt einer Zahl. Die Waage funktioniert weiterhin — das Aceton plus das Salz —, denn die Massenbuchführung steht nicht in Zweifel."
"when-the-lab-says-it-does-not-know.registers.lv3" = "Das Ereignis ist `NotYetModeled`, ausgelöst vom Ehrlichkeitsdurchlauf, wenn ein Feststoff mit einer Flüssigkeit koexistiert und kein Löser — und kein kuratiertes Urteil — das Paar abdeckt. Es unterscheidet sich strukturell von `SolverFailed`, was bedeutet, dass ein verdrahteter Löser es versucht hat und nicht konvergiert ist. Dieser Eintrag demonstrierte die Lücke ursprünglich mit NaCl in Ethanol, wechselte dann zu CuSO4 in Ethanol — beide werden inzwischen von der kuratierten Stufe organischer Löslichkeit (CAP-23) mit Handbuchdaten abgedeckt. Wächst die Abdeckung, wandert die Demonstration zum nächsten unabgedeckten Paar; Modellgrenzen verschieben sich, und ein ehrliches Labor verschiebt seine Beispiele mit ihnen. Dieser Absatz ist die Aufzeichnung, dass das geschehen ist."
"doubling-the-thiosulfate-doubles-the-rate.expect.predict.question" = "Zwei Bechergläser, dieselbe Säure, dieselben zehn Sekunden. Das eine enthält 0,05 mol/L Thiosulfat, das andere 0,10 mol/L. Im ersten scheiden sich 0,000223 mol Schwefel ab. Was scheidet sich im zweiten ab?"
"doubling-the-thiosulfate-doubles-the-rate.expect.predict.options" = ["0,000223 mol — dasselbe, weil es dieselbe Reaktion ist", "0,000446 mol — doppelt so viel", "0,000891 mol — viermal so viel, weil die Geschwindigkeit mit dem Quadrat der Konzentration geht", "Irgendwo dazwischen, weil das stärkere früher ausgeht"]
"doubling-the-thiosulfate-doubles-the-rate.expect.predict.misconception" = "Die letzte Option ist die interessante falsche Antwort, nach der viele Lernende greifen: Sie wissen, dass eine abnehmende Konzentration eine Reaktion verlangsamt, und erwarten deshalb, dass die stärkere Lösung dadurch benachteiligt wird. Das ist nicht der Fall, und der Grund lohnt sich: Bei einer Reaktion erster Ordnung ist der in zehn Sekunden umgesetzte *Anteil* in beiden Bechergläsern gleich, sodass die Mengen zu jedem Zeitpunkt im ursprünglichen Verhältnis zueinander bleiben. Die quadrierte Option verwechselt Reaktionsordnung mit Koeffizient: In der Gleichung steht eine 2 vor H⁺ und keine vor Thiosulfat, und keine der beiden Zahlen ist die Ordnung."
"doubling-the-thiosulfate-doubles-the-rate.expect.predict.diagnosis.0.reveals" = "Eine Reaktion hat eine feste Geschwindigkeit, so wie ein Stoff einen festen Schmelzpunkt hat — die Konzentration ändert, wie viel vorhanden ist, nicht, wie schnell es abläuft."
"doubling-the-thiosulfate-doubles-the-rate.expect.predict.diagnosis.0.next" = "Dasselbe Paar wird mit `wait 5s` und danach noch einmal `wait 5s` laufen gelassen. Wäre die Geschwindigkeit eine Eigenschaft der Reaktion, würden die beiden Bechergläser gleichauf bleiben; sie laufen aber schon im ersten Intervall auseinander und bleiben es."
"doubling-the-thiosulfate-doubles-the-rate.expect.predict.diagnosis.1.reveals" = "Die Ordnung wird an der Gleichung abgelesen: Vor H⁺ steht eine 2, also muss irgendetwas quadriert werden."
"doubling-the-thiosulfate-doubles-the-rate.expect.predict.diagnosis.1.next" = "Dasselbe Experiment wird stattdessen für die Säure geöffnet (`the-acid-term-is-an-activity`): Ausgerechnet die Spezies mit dem Koeffizienten 2 erweist sich als erster Ordnung — schwer zu erklären, wenn Ordnungen aus Koeffizienten stammen würden."
"doubling-the-thiosulfate-doubles-the-rate.expect.predict.diagnosis.2.reveals" = "Der Konzentrationsrückgang wird sich als Strafe vorgestellt, die das schnellere Becherglas zahlt, sodass die starke Lösung hinter ihren eigenen Vorsprung zurückfallen müsste."
"doubling-the-thiosulfate-doubles-the-rate.expect.predict.diagnosis.2.next" = "Der Schwefel in den beiden Bechergläsern wird bei 24 s, 49 s und 113 s in `the-cross-disappears` verglichen: Das Verhältnis ist bei jeder Messung exakt 2, weil beide Bechergläser denselben Anteil verlieren, nicht dieselbe Menge."
"doubling-the-thiosulfate-doubles-the-rate.registers.lv1" = "Zwei Bechergläser mit derselben klaren Flüssigkeit, das eine doppelt so stark wie das andere, und eine Uhr für beide. Nach zehn Sekunden hat das starke genau doppelt so viel gelbe Trübung erzeugt wie das schwache. Nicht ein bisschen mehr — doppelt so viel. Drängt man die Teilchen doppelt so eng zusammen, treffen sie doppelt so oft aufeinander."
"doubling-the-thiosulfate-doubles-the-rate.registers.lv2" = "Geschwindigkeit = k·[S₂O₃²⁻]·[H⁺]. Beide Bechergläser enthalten dieselbe Säure (pH 1,7486), der einzige Unterschied ist also das Thiosulfat: 0,05 mol/L gegen 0,10 mol/L. In zehn Sekunden meldet das Labor 2,2275 × 10⁻⁴ mol Umsatz im ersten und 4,4551 × 10⁻⁴ mol im zweiten — ein Verhältnis von 2,000. Erste Ordnung bezüglich Thiosulfat, gemessen statt angenommen."
"doubling-the-thiosulfate-doubles-the-rate.registers.lv3" = "Die Exaktheit lohnt einen Moment Aufmerksamkeit, denn sie ist eine stärkere Aussage, als das Experiment normalerweise liefert. Anfangsgeschwindigkeiten sind bei jeder Reaktion erster Ordnung per Definition proportional zur Konzentration; hier stehen aber auch die *integrierten* Mengen nach zehn Sekunden im Verhältnis 2,000, und das gilt, weil die integrierte Lösung erster Ordnung c₀(1 − e^(−k′t)) lautet, mit k′ = k[H⁺] identisch in beiden Gefäßen. Der Faktor c₀ kürzt sich damit heraus, und die Proportionalität übersteht den Konzentrationsrückgang. Die Ordnung ist kuratierte Angabe, nicht Schlussfolgerung: `kinetics.rs` hält `orders` bewusst getrennt von `reactants`, damit der Koeffizient 2 vor H⁺ nicht ins Geschwindigkeitsgesetz durchsickern kann, und keine der beiden Ordnungen hier entspricht einem Koeffizienten."
"the-acid-term-is-an-activity.summary" = "Verdoppelt man die Salzsäure, steigt die Geschwindigkeit um das 1,94-Fache statt um das 2,00-Fache — das Geschwindigkeitsgesetz liest die vom Solver berechnete Aktivität, nicht die eingewogene Menge"
"the-acid-term-is-an-activity.expect.predict.question" = "Drei Bechergläser, identisch bis auf die Säure: 0,001, 0,002 und 0,004 mol HCl in 100 mL. Die Reaktion ist bekanntlich erster Ordnung bezüglich H⁺. Verdoppelst du die Säure von 0,002 auf 0,004 mol, sollte sich die Geschwindigkeit genau verdoppeln. Das Labor zeigt 1,94. Wer irrt sich?"
"the-acid-term-is-an-activity.expect.predict.options" = ["Das Labor — ein Term erster Ordnung muss sich verdoppeln, wenn man die Konzentration verdoppelt", "Niemand. Das Geschwindigkeitsgesetz ist erster Ordnung bezüglich der *Aktivität* von H⁺, und eine Verdopplung der Menge erhöht die Aktivität nur um das 1,94-Fache", "Die Chemie — die Ordnung bezüglich H⁺ muss in Wirklichkeit etwas kleiner als eins sein", "Das ist ein Rundungsfehler im Integrator"]
"the-acid-term-is-an-activity.expect.predict.misconception" = "Die dritte Option ist die Falle, in die gute Lernende tappen: Ein gemessener Exponent knapp unter eins wirkt wie ein Beleg für eine gebrochene Ordnung, und gebrochene Ordnungen gibt es tatsächlich. Hier ist es aber keine. Die Ordnung im Modell ist exakt 1,000, und die Abweichung kommt von ganz woanders her — die Ionenstärke hat sich mit der Säure verdoppelt, der Aktivitätskoeffizient ist von 0,889 auf 0,863 gefallen, und das Geschwindigkeitsgesetz liest die Aktivität. Eine Nichtidealität der Lösung mit einer mechanistischen Ordnung zu verwechseln ist ein realer Fehler in der praktischen Kinetik, kein Schulbuchfehler."
"the-acid-term-is-an-activity.expect.predict.diagnosis.0.reveals" = "Erste Ordnung bedeutet, dass die aufgedruckte Konzentration die Geschwindigkeit verdoppelt — die Zahl auf der Flasche ist die Zahl in der Gleichung."
"the-acid-term-is-an-activity.expect.predict.diagnosis.0.next" = "Die drei Ionenstärken (0,01003, 0,02006, 0,04012 mol/kgw) werden neben den drei pH-Werten abgelesen. Die pH-Schritte betragen 0,2895 und 0,2878, nicht die 0,3010, die ein Konzentrationsfaktor von zwei ergeben würde."
"the-acid-term-is-an-activity.expect.predict.diagnosis.1.reveals" = "Ein gemessener Exponent unter eins gilt als Beleg über den Mechanismus, also müsse die wahre Ordnung etwa 0,95 betragen."
"the-acid-term-is-an-activity.expect.predict.diagnosis.1.next" = "Dasselbe wird mit dem Thiosulfat statt der Säure wiederholt, wo keine Änderung der Ionenstärke im Spiel ist: Dort ergibt sich ein Verhältnis von exakt 2,000. Eine Ordnung, die nur auftritt, wenn sich die Ionenstärke ändert, ist keine Ordnung."
"the-acid-term-is-an-activity.expect.predict.diagnosis.2.reveals" = "Eine Abweichung in der dritten signifikanten Stelle müsse numerisches Rauschen sein und keine Chemie."
"the-acid-term-is-an-activity.expect.predict.diagnosis.2.next" = "Die Größenordnung wird geprüft: Der Integrator stimmt mit der geschlossenen Lösung erster Ordnung auf besser als 0,1 % überein, diese Abweichung beträgt aber 3 %. Fehler haben Größenordnungen, und sie zu vergleichen ist die Gewohnheit, die es sich anzueignen lohnt."
"the-acid-term-is-an-activity.registers.lv1" = "Gibt man doppelt so viel Säure hinein, wird die Reaktion nicht ganz doppelt so schnell — sie wird 1,94-mal so schnell. Das fehlende Stückchen ist kein Fehler. In einer dicht gedrängten Lösung kommen sich die Ionen gegenseitig in die Quere, sodass doppelt so viele nicht doppelt so stark drücken."
"the-acid-term-is-an-activity.registers.lv2" = "Das Labor berechnet pH 2,0381, 1,7486 und 1,4608 für 0,001, 0,002 und 0,004 mol HCl in 100 mL, und das Geschwindigkeitsgesetz verwendet 10^(−pH). In einer Sekunde setzen die drei Gefäße 1,1686 × 10⁻⁵, 2,2735 × 10⁻⁵ und 4,4010 × 10⁻⁵ mol um. Halbieren der Säure ergibt ×0,514, Verdoppeln ergibt ×1,936 — erste Ordnung, aber bezüglich der Aktivität, nicht der eingewogenen Menge."
"the-acid-term-is-an-activity.registers.lv3" = "PHREEQCs pH ist −log₁₀(a_H⁺), sodass `term_concentration` mit der Rückgabe 10^(−pH) dem Geschwindigkeitsgesetz bewusst eine Aktivität übergibt: Gibt man HCl zu Wasser, bleibt Chlorid im Gefäßinventar, während das Proton in die Ladungsbilanz eingeht, wo es keinen Inventarwert zum Ablesen gibt. Die Ionenstärken betragen 0,01003, 0,02006 und 0,04012 mol/kgw, was unter der WATEQ-Debye-Hückel-Erweiterung Aktivitätskoeffizienten von 0,913, 0,889 und 0,863 ergibt; 0,034609/0,017838 = 1,940 ist das Aktivitätsverhältnis, und die gemessenen 1,936 bleiben knapp darunter, weil das schnellere Gefäß innerhalb der Sekunde bereits etwas mehr Thiosulfat verbraucht hat. Das ist dasselbe γ, das in `ph-is-not-quite-minus-log-c` auftaucht — hier verändert es eine Geschwindigkeit statt einer Messanzeige."
"the-cross-disappears.expect.predict.question" = "Drei Bechergläser mit 0,025, 0,05 und 0,10 mol/L Thiosulfat. Du stoppst, wie lange jedes braucht, um ein Bleistiftkreuz unter dem Becherglas zu verdecken. Das 0,10-mol/L-Becherglas braucht 24 s. Die Reaktion ist erster Ordnung. Wie lange braucht das 0,025-mol/L-Becherglas?"
"the-cross-disappears.expect.predict.options" = ["48 s — doppelt so lange, noch einmal doppelt so lange wäre albern", "96 s — die vierfache Zeit für ein Viertel der Konzentration", "113 s — länger als das Vierfache, weil eine feste Schwefelmenge einer schwachen Lösung einen viel größeren Brocken abverlangt", "Es kommt nie so weit — es ist nicht genug Thiosulfat vorhanden"]
"the-cross-disappears.expect.predict.misconception" = "Die ersten beiden Optionen gehen beide davon aus, dass die Zeit bis zu einem festen Beobachtungspunkt exakt umgekehrt proportional zur Konzentration ist. Das stimmt fast, und das Experiment beruht auf dieser Annahme — aber nur solange der abgewartete Schwefel ein kleiner Anteil der Ausgangsmenge ist. Das Verdecken des Kreuzes kostet 0,01 mol/L Schwefel: ein Zehntel beim starken Becherglas und zwei Fünftel beim schwachen, weshalb das schwache stärker zurückfällt, als das einfache Verhältnis vorhersagt. Die letzte Option verdient es, ernst genommen und mit der Rechnung widerlegt zu werden: 0,025 mol/L reicht, mit Reserve."
"the-cross-disappears.expect.predict.diagnosis.0.reveals" = "Konzentration geviertelt, Zeit verdoppelt — der Zusammenhang zwischen Konzentration und Zeit wird einmal statt zweimal angewendet."
"the-cross-disappears.expect.predict.diagnosis.0.next" = "Die drei Zeiten werden als Tabelle neben die drei Konzentrationen gelegt. 24, 49, 113 gegen 0,10, 0,05, 0,025: Jede Halbierung der Konzentration kostet eher mehr als eine Verdopplung der Zeit, und die Tabelle macht das ohne jede Algebra sichtbar."
"the-cross-disappears.expect.predict.diagnosis.1.reveals" = "Die Zeit sei immer exakt umgekehrt proportional zur Konzentration — 1/t *ist* die Geschwindigkeit, statt nur ein Ersatz dafür zu sein."
"the-cross-disappears.expect.predict.diagnosis.1.next" = "Es wird gefragt, wie viel Thiosulfat in jedem Becherglas verbraucht ist, wenn das Kreuz verschwindet: 10 %, 20 %, 40 %. Die Methode setzt voraus, dass die Antwort 'kaum etwas' lautet, und im schwächsten Becherglas stimmt das nicht mehr."
"the-cross-disappears.expect.predict.diagnosis.2.reveals" = "Der Schwefel müsse 0,01 mol/L erreichen, sodass einer 0,025-mol/L-Lösung fast das Material ausgeht und sie es vielleicht nie schafft."
"the-cross-disappears.expect.predict.diagnosis.2.next" = "Die Stöchiometrie wird vor der Kinetik geprüft: 1 mol Thiosulfat ergibt 1 mol Schwefel, sodass 0,025 mol/L die 0,01 mol/L mit 60 % Reserve erreichen kann. Zu prüfen, ob eine Reaktion überhaupt *fertig werden kann*, bevor man nach dem Wie-schnell fragt, ist eine Gewohnheit, die sich lohnt."
"the-cross-disappears.registers.lv1" = "Man zeichnet ein Kreuz auf Papier, stellt das Becherglas darauf und startet die Uhr, sobald die Säure hineinkommt. Die Flüssigkeit wird langsam milchig vom Schwefel, bis das Kreuz verschwindet. Starke Lösung: 24 Sekunden. Halb so stark: 49. Ein Viertel so stark: 113. Blassere Mischung, längeres Warten — und die Uhr ist das Messinstrument, das ist der ganze Trick des Experiments."
"the-cross-disappears.registers.lv2" = "Nimmt man 0,01 mol/L suspendierten Schwefel als den Punkt, an dem das Kreuz verdeckt ist, erreicht das Labor diesen bei 24 s (0,10 mol/L), 49 s (0,05 mol/L) und 113 s (0,025 mol/L). 1/t ist der übliche Ersatz für die Geschwindigkeit: 0,0417, 0,0204 und 0,0088 s⁻¹, jeweils nahe an einer Halbierung, aber nicht genau — die aufeinanderfolgenden Zeitverhältnisse sind 2,04 und 2,31, nicht 2,00 und 2,00. Zum Zeitpunkt der jeweiligen Ablesung hat jedes Becherglas 10 %, 20 % beziehungsweise 40 % seines Thiosulfats verbraucht, und das am stärksten verdünnte ist längst nicht mehr in der Nähe seiner Anfangsgeschwindigkeit."
"the-cross-disappears.registers.lv3" = "Die absoluten Zeiten stammen von uns, die Verhältnisse von der Chemie — diese Unterscheidung ist der ehrliche Kern dieses Eintrags. Der präexponentielle Faktor A = 2,2 × 10⁸ in `kinetics.rs` ist so kalibriert, dass 0,05 mol/L bei pH 1,7 und 25 °C das Kreuz in rund vierzig Sekunden verdeckt, was dem Bereich entspricht, für den das Experiment ausgelegt ist; es ist kein gemessenes Arrhenius-A, und die Datei sagt das auch so. Alles, was aus dem *Vergleich* von Gefäßen abgeleitet wird — die Ordnung, die Temperaturverhältnisse, die Katalysatorfaktoren —, ist unabhängig von A und übersteht jede Neukalibrierung. Die exakte integrierte Form lautet t = −ln(1 − 0,01/c₀)/(k[H⁺]), was mit dem motoreigenen k[H⁺] = 4,561 × 10⁻³ s⁻¹ die Kreuzungszeitpunkte bei 23,1, 48,9 und 112,0 s ansetzt und die Verhältnisse bei 2,12 und 2,29; liest man das Becherglas nur einmal pro Sekunde ab, rundet das auf 24, 49 und 113 und verzerrt das erste Verhältnis auf 2,04. Fast eine Sekunde Quantisierung ist bemerkenswert, denn ein echtes Experiment liest die Stoppuhr mit ungefähr derselben Genauigkeit ab. Auch die Schwelle von 0,01 mol/L stammt von uns — sie ist das Kriterium, das der motoreigene Regressionstest verwendet — und sie ist nicht dasselbe wie das Vokabular des Renderers: `appearance` nennt ein Becherglas ab einer Trübung von 0,15 'trüb', was 0,0075 mol/L Schwefel entspricht und im 0,05-mol/L-Becherglas rund dreizehn Sekunden früher eintritt. Jedes Becherglas wird also bereits als 'trüb' beschrieben, bevor es das Kriterium erreicht, und die beiden Schwellen sollten nicht als ein und dieselbe gelesen werden."
"the-ten-degree-rule-and-where-it-frays.summary" = "25 → 35 → 45 → 55 °C vervielfacht die Zehn-Sekunden-Ausbeute um 1,90, dann 1,80, dann 1,69 — die Faustregel ist eine Regel über eine bestimmte Aktivierungsenergie bei einer bestimmten Temperatur"
"the-ten-degree-rule-and-where-it-frays.expect.predict.question" = "Vier Bechergläser mit derselben Mischung bei 25, 35, 45 und 55 °C. 'Die Geschwindigkeit verdoppelt sich alle zehn Grad.' Wenn das 25-°C-Becherglas in zehn Sekunden 0,000223 mol Schwefel abscheidet, wie viel scheidet das 55-°C-Becherglas ab?"
"the-ten-degree-rule-and-where-it-frays.expect.predict.options" = ["0,00178 mol — achtmal so viel, drei Verdopplungen", "0,00128 mol — etwas weniger als das Achtfache, weil jeder Zehn-Grad-Schritt etwas weniger bringt als der vorherige", "0,000669 mol — dreimal so viel, eine Verdopplung pro zehn Grad addiert", "0,00223 mol — zehnmal so viel, weil die Temperatur um dreißig Grad gestiegen ist"]
"the-ten-degree-rule-and-where-it-frays.expect.predict.misconception" = "Die dritte Option ist der häufigste Rechenfehler bei diesem Thema: Verdopplungen multiplizieren sich, sie addieren sich nicht. Die erste Option wendet die richtige Rechnung auf eine nur näherungsweise gültige Regel an, und das ist der lehrreichere Fehler — sie behandelt 'verdoppelt sich alle zehn Grad' als Naturgesetz. Das ist es nicht; es ist das, was eine Aktivierungsenergie nahe 50 kJ/mol nahe Raumtemperatur zufällig ergibt, und der Faktor schrumpft mit steigender Temperatur stetig weiter, weil der Arrhenius-Exponent von 1/T abhängt, nicht von T."
"the-ten-degree-rule-and-where-it-frays.expect.predict.diagnosis.0.reveals" = "'Verdoppelt sich alle zehn Grad' sei ein Naturgesetz, also ergäben drei Schritte genau das Achtfache."
"the-ten-degree-rule-and-where-it-frays.expect.predict.diagnosis.0.next" = "Die drei Schrittfaktoren werden aus den eigenen Zahlen des Labors berechnet — 1,90, 1,80, 1,69 — und es wird gefragt, was für Arrhenius gelten müsste, damit sie alle gleich 2 wären. Die Antwort: Ea müsste mit der Temperatur wachsen."
"the-ten-degree-rule-and-where-it-frays.expect.predict.diagnosis.1.reveals" = "Drei Zehn-Grad-Schritte bedeuten drei addierte Verdopplungen, also dreimal so schnell."
"the-ten-degree-rule-and-where-it-frays.expect.predict.diagnosis.1.next" = "Zunächst wird ein einfacheres Beispiel auf Papier durchgerechnet: Zwei Verdopplungen von 10 € ergeben 40 €, nicht 30 €. Dann wird gefragt, welche Rechenoperation 'pro zehn Grad' eigentlich beschreibt."
"the-ten-degree-rule-and-where-it-frays.expect.predict.diagnosis.2.reveals" = "Die Geschwindigkeit skaliere mit der Temperatur selbst, sodass dreißig Grad zusätzlich zu fünfundzwanzig ungefähr zehnmal so viel Wärme und die zehnfache Geschwindigkeit bedeuten."
"the-ten-degree-rule-and-where-it-frays.expect.predict.diagnosis.2.next" = "Dieselbe Überlegung wird in Kelvin durchgespielt: 298 K auf 328 K ist ein Anstieg von 10 %, was fast keine Veränderung vorhersagen würde. Eine Regel, die in zwei Temperaturskalen zwei verschiedene Antworten liefert, beschreibt keine Proportionalität."
"the-ten-degree-rule-and-where-it-frays.registers.lv1" = "Dieselbe Mischung, vier Temperaturen, eine Uhr. In zehn Sekunden bildet das kalte Becherglas einen leichten Schleier, das heiße wird richtig trüb — ungefähr doppelt so viel Schwefel für je zehn Grad mehr. Ungefähr. Jede weitere Zehn-Grad-Stufe bringt etwas weniger als die vorige, deshalb ist 'es verdoppelt sich' eine praktische Faustregel und kein Versprechen."
"the-ten-degree-rule-and-where-it-frays.registers.lv2" = "In zehn Sekunden meldet das Labor 2,2275 × 10⁻⁴, 4,2430 × 10⁻⁴, 7,6234 × 10⁻⁴ und 1,2847 × 10⁻³ mol Umsatz bei 25, 35, 45 und 55 °C. Die Schrittfaktoren betragen 1,90, 1,80 und 1,69. Niemand hat dabei eine Regel angewendet: k = A·e^(−Ea/RT) mit Ea = 51 kJ/mol wurde bei jeder Temperatur ausgewertet, und die Beinahe-Verdopplung ergab sich von selbst."
"the-ten-degree-rule-and-where-it-frays.registers.lv3" = "Zwei getrennte Gründe halten diese Werte unter zwei, und sie sollten nicht verwechselt werden. Erstens das Arrhenius-Verhältnis selbst: k(308)/k(298) = e^(Ea/R · (1/298,15 − 1/308,15)) = 1,95 für Ea = 51 kJ/mol, und dieselbe Rechnung ergibt 1,87 und 1,80 für die höheren Schritte, weil der Exponent wie 1/T verläuft. Zweitens der Konzentrationsrückgang: In zehn Sekunden haben die heißeren Gefäße bereits an ihrem Thiosulfat gezehrt, weshalb die gemessenen 1,90/1,80/1,69 darunter liegen. Verkürzt man die Uhr auf eine Sekunde, in der fast nichts verbraucht wurde, liefert das Labor 1,94/1,86/1,78 — innerhalb eines Prozents der reinen Geschwindigkeitskonstanten-Verhältnisse. Die 'Regel' ist somit eine Aussage über eine Aktivierungsenergie nahe 50 kJ/mol bei rund 300 K, und die eigentliche Lehre des Experiments ist, dass sie auf vorhersagbare Weise nachlässt."
"a-steeper-barrier-breaks-the-rule-of-thumb.expect.predict.question" = "Die Thiosulfat-Uhr wird um das 1,90-Fache pro zehn Grad schneller. Wasserstoffperoxid, das von selbst zerfällt, hat eine viel höhere Barriere — 75 kJ/mol gegen 51. Du erwärmst es um zehn Grad. Was passiert mit seiner Geschwindigkeit?"
"a-steeper-barrier-breaks-the-rule-of-thumb.expect.predict.options" = ["Sie verdoppelt sich ebenfalls ungefähr — die Zehn-Grad-Regel gilt für Reaktionen, nicht für Barrieren", "Sie steigt um etwa das 2,6-Fache — eine steilere Barriere ist empfindlicher gegenüber Temperatur", "Sie steigt um weniger als das Doppelte — eine schwerere Reaktion lässt sich schwerer beschleunigen", "Nichts Messbares — die Barriere ist zu hoch, als dass zehn Grad etwas ausmachten"]
"a-steeper-barrier-breaks-the-rule-of-thumb.expect.predict.misconception" = "Die dritte Option ist die intuitive, und sie hat die Physik genau falsch herum. Eine hohe Barriere macht eine Reaktion nicht träge gegenüber Erwärmung; sie macht sie *empfindlicher*, weil der Anteil der Zusammenstöße, die die Barriere überwinden, exponentiell in Ea/RT ist und ein größeres Ea diese Exponentialfunktion steiler macht. Die erste Option verwechselt die Faustregel mit einem Naturgesetz. Beide werden durch dieselbe Beobachtung geheilt: Die Temperaturempfindlichkeit ist eine Eigenschaft der Barriere, und das ist das Einzige, was sich zwischen diesen beiden Experimenten geändert hat."
"a-steeper-barrier-breaks-the-rule-of-thumb.expect.predict.diagnosis.0.reveals" = "Die Zehn-Grad-Regel sei eine Eigenschaft der Temperatur, gelte also für jede Reaktion gleichermaßen."
"a-steeper-barrier-breaks-the-rule-of-thumb.expect.predict.diagnosis.0.next" = "Die beiden Experimente werden nebeneinandergestellt: derselbe Integrator, dieselbe Uhr, dieselben zehn Grad, Faktoren von 1,90 und 2,62. Das Einzige, was sich zwischen ihnen unterscheidet, ist Ea — also hängt der Faktor von Ea ab."
"a-steeper-barrier-breaks-the-rule-of-thumb.expect.predict.diagnosis.1.reveals" = "Eine hohe Barriere bedeute eine störrische Reaktion, und Störrisches reagiere weniger auf einen Anstoß."
"a-steeper-barrier-breaks-the-rule-of-thumb.expect.predict.diagnosis.1.next" = "Es wird betrachtet, wo Ea in der Gleichung steht — im Exponenten, geteilt durch RT. Setzt man Ea = 150 kJ/mol in dieselbe Rechnung ein, liegt der Zehn-Grad-Faktor über 6. Empfindlichkeit und Geschwindigkeit sind unterschiedliche Fragen, und hier lassen sie sich am saubersten trennen."
"a-steeper-barrier-breaks-the-rule-of-thumb.expect.predict.diagnosis.2.reveals" = "Eine Barriere von 75 kJ/mol sei eine Wand, sodass zehn Grad thermischer Energie nichts ausmachen könnten."
"a-steeper-barrier-breaks-the-rule-of-thumb.expect.predict.diagnosis.2.next" = "75 kJ/mol werden mit RT bei 298 K verglichen, das sind 2,5 kJ/mol. Die Barriere ist das Dreißigfache der mittleren thermischen Energie, und die Reaktion läuft trotzdem — weil es der Ausläufer der Verteilung ist, der reagiert, nicht der Durchschnitt."
"a-steeper-barrier-breaks-the-rule-of-thumb.registers.lv1" = "Dieselben zehn Grad bringen nicht bei jeder Reaktion denselben Geschwindigkeitsgewinn. Bei der Schwefel-Uhr waren es etwa das Doppelte. Beim Peroxid, das von selbst zerfällt, sind es etwa das Zweieinhalbfache — weil die Peroxid-Reaktion schwerer in Gang zu bringen ist, und alles, was schwer in Gang zu bringen ist, ist der zusätzlichen Wärme dankbarer."
"a-steeper-barrier-breaks-the-rule-of-thumb.registers.lv2" = "Drei Bechergläser mit 0,1 mol Peroxid bei 25, 35 und 45 °C, dreißig Minuten stehen gelassen. Die Umsätze betragen 0,0007, 0,0019 und 0,0047 mol — Faktoren von rund 2,7 und 2,5 pro zehn Grad, gegenüber 1,90 bei der Thiosulfat-Uhr. Das Einzige, was sich unterscheidet, ist die Aktivierungsenergie: hier 75 kJ/mol gegen dort 51. Bemerkenswert ist auch, dass dreißig Minuten nötig sind, um überhaupt etwas zu sehen, während die Uhr-Reaktion in weniger als einer Minute vorbei war — eine steilere Barriere bedeutet sowohl eine langsamere als auch eine temperaturempfindlichere Reaktion, und das sind zwei getrennte Folgen derselben Zahl."
"a-steeper-barrier-breaks-the-rule-of-thumb.registers.lv3" = "Das Verhältnis ist exp[(Ea/R)(1/T₁ − 1/T₂)], sodass für Ea = 75 kJ/mol die reinen Arrhenius-Faktoren über diese Schritte 2,67 und 2,51 betragen. Die gemessenen Umsätze ergeben 2,71 und 2,47: Der erste liegt durch Rundung ein Haar zu hoch, der zweite etwas zu niedrig, weil dem heißesten Becherglas bereits das Peroxid auszugehen beginnt und ein Umsatz über dreißig Minuten kein sauberer Ersatz für eine Anfangsgeschwindigkeit mehr ist. Diese Lücke ist der Grund, warum es Anfangsgeschwindigkeits-Methoden gibt, und sie ist hier sichtbar statt nur beschrieben. Die Zehn-Grad-Regel entspricht Ea ≈ 50 kJ/mol bei Raumtemperatur, weshalb die Thiosulfat-Uhr ihr gehorcht und dies nicht — die Regel ist der Zufall einer einzelnen Barrierenhöhe, kein Gesetz."
"three-beakers-of-peroxide.expect.predict.question" = "Drei Kolben mit 1 mol/L Wasserstoffperoxid. Einer bleibt unangetastet, einer bekommt ein halbes Gramm Mangandioxid, einer bekommt ein Milligramm Katalase aus der Leber. Wie viel Peroxid ist nach einer Sekunde in jedem übrig?"
"three-beakers-of-peroxide.expect.predict.options" = ["In allen drei etwa gleich viel — eine Sekunde reicht für nichts", "99,8 %, 11 % und gar nichts", "99,8 %, 50 % und 25 % — jeder Katalysator halbiert etwa das Verbliebene", "In keinem von ihnen — ein Katalysator lässt die Reaktion ablaufen, und sie wäre ohnehin abgelaufen"]
"three-beakers-of-peroxide.expect.predict.misconception" = "Die dritte Option behandelt Katalysatoren, als kämen sie in gewöhnlichen Größenordnungen daher, ein paar Mal besser als nichts. Der ganze Sinn dieser Gegenüberstellung ist gerade, dass das nicht stimmt: Das Enzym ist nicht ein bisschen besser als das Mineral, es ist etwa eine Million Mal besser, weil sich die beiden um 35 kJ/mol im Exponenten unterscheiden — und im Exponenten steckt die Geschwindigkeit. Die letzte Option ist die ältere Verwechslung: dass ein Katalysator entscheidet, *ob* eine Reaktion abläuft. Das tut er nicht. Alle drei Kolben enden als Wasser und Sauerstoff; der Katalysator entscheidet nur, wann."
"three-beakers-of-peroxide.expect.predict.diagnosis.0.reveals" = "Eine Sekunde sei zu kurz für Chemie — Reaktionen liefen auf der Zeitskala einer Unterrichtsstunde ab."
"three-beakers-of-peroxide.expect.predict.diagnosis.0.next" = "Es wird gefragt, was die Zeitskala festlegt. Der katalysierte Kolben ist innerhalb von zehn Millisekunden fertig; eine Sekunde ist weder kurz noch lang, solange nicht eine Aktivierungsenergie das entscheidet."
"three-beakers-of-peroxide.expect.predict.diagnosis.1.reveals" = "Katalysatoren würden abgestuft wie alles andere im Schullabor: besser, viel besser, ein paar Mal besser."
"three-beakers-of-peroxide.expect.predict.diagnosis.1.next" = "Die Barrieren werden in einem Diagramm eingetragen: 75, 58, 23 kJ/mol, und der Geschwindigkeitsgewinn ist exponentiell in der Differenz. Zwischen Mineral und Enzym liegt ein Faktor von einer Million — ein Größenunterschied, den die Intuition allein niemandem liefert."
"three-beakers-of-peroxide.expect.predict.diagnosis.2.reveals" = "Ein Katalysator sei das, was die Reaktion überhaupt in Gang bringt; ohne ihn passiere gar nichts."
"three-beakers-of-peroxide.expect.predict.diagnosis.2.next" = "Der unbehandelte Kolben wird fünf Tage sich selbst überlassen (`same-destination-different-journey`). Er kommt am selben Ziel an, 0,0485 mol Sauerstoff und immer noch steigend Richtung 0,0500. Der Katalysator hat entschieden, wann, nicht ob."
"three-beakers-of-peroxide.registers.lv1" = "Drei Kolben mit demselben Peroxid. Lässt man einen unangetastet, hat er sich nach einer Sekunde kaum verändert. Gibt man einen Spatel schwarzes Pulver hinein, ist schon neun Zehntel davon verschwunden. Gibt man ein Krümelchen Leberenzym hinein — ein Tausendstel Gramm —, ist alles vorbei, bevor du die Flasche abgestellt hast. Dieselbe Flüssigkeit, derselbe Raum, dieselbe Sekunde."
"three-beakers-of-peroxide.registers.lv2" = "Aktivierungsenergien von 75, 58 und 23 kJ/mol für keinen Katalysator, Mangandioxid und Katalase. Nach einer Sekunde hat der unbehandelte Kolben nichts getan, was das Labor überhaupt meldet — 4 × 10⁻⁷ mol Umsatz, unterhalb der Beobachtungsgrenze —, während Mangandioxid 4 × 10⁻⁴ mol erreicht hat und Katalase fertig ist: 5,0000 × 10⁻² mol, jedes Molekül Peroxid verschwunden. Das verbliebene Peroxid liest sich als 0,1000, 0,0992 und 0,0000 mol. Dieselbe Reaktion, dieselbe Temperatur, dieselbe Thermodynamik; drei Barrieren."
"three-beakers-of-peroxide.registers.lv3" = "Die Geschwindigkeitsgewinne sind exponentiell in der Differenz zwischen den Barrieren und hängen von sonst nichts ab — deshalb sind sie hier die belastbaren Zahlen, während es die absoluten Zeiten nicht sind. exp[(75 − 58) kJ·mol⁻¹ / RT] = 951 bei 298,15 K, und exp[(58 − 23)/RT] = 1,36 × 10⁶ — das Mineral ist also etwa tausendmal besser als nichts, und das Enzym etwa eine Million Mal besser als das Mineral. Um das zu sehen, liest man besser die Geschwindigkeiten als die Umsätze: Sobald ein katalysiertes Gefäß innerhalb des Intervalls sättigt, ist sein Umsatz durch das Peroxid begrenzt und meldet gar keine Geschwindigkeit mehr. Der präexponentielle Faktor ist kalibriert, nicht gemessen, sodass die Sekundenwerte nur richtungsweisend sind; die Verhältnisse dagegen nicht, weil sich A heraushebt."
"a-catalyst-comes-out-as-it-went-in.summary" = "0,001 g Katalase zerstört drei aufeinanderfolgende 0,1-mol-Portionen Peroxid, jede innerhalb einer Sekunde, und liegt am Ende immer noch bei 4,16666667 × 10⁻⁹ mol"
"a-catalyst-comes-out-as-it-went-in.expect.predict.question" = "Ein Milligramm Katalase zerstört 0,1 mol Wasserstoffperoxid in einer Sekunde. Du gibst eine zweite 0,1-mol-Portion in denselben Kolben. Was passiert?"
"a-catalyst-comes-out-as-it-went-in.expect.predict.options" = ["Nichts — die Katalase wurde beim Zerstören der ersten Portion verbraucht", "Es geht genauso schnell — die Katalase ist unverändert, und die zweite Portion braucht dieselbe eine Sekunde", "Es geht halb so schnell — die Hälfte der Katalase ist verbraucht", "Es geht schneller — der Kolben ist jetzt erwärmt"]
"a-catalyst-comes-out-as-it-went-in.expect.predict.misconception" = "'Verbraucht' ist die Standardannahme für alles, was an einer Reaktion teilnimmt, und sie wird dadurch verstärkt, dass ein Katalysator überhaupt erst zugegeben werden muss. Die erste und die dritte Option sind beide Spielarten davon. Was die Demonstration überzeugend macht, ist die Wiederholung: Eine einzelne Portion beweist nichts, drei identische, mit identischer Geschwindigkeit von demselben Enzymkrümelchen zerstörte Portionen lassen sich kaum anders erklären. Die letzte Option ist ein realer Effekt in einem realen Kolben — diese Zersetzung ist exotherm —, und das Labor modelliert ihn nicht, was der Eintrag auch so benennt, statt die Option stillschweigend aus dem falschen Grund als falsch durchgehen zu lassen."
"a-catalyst-comes-out-as-it-went-in.expect.predict.diagnosis.0.reveals" = "Alles, was man einer Reaktion zugibt, sei ein Reagenz, und Reagenzien würden verbraucht."
"a-catalyst-comes-out-as-it-went-in.expect.predict.diagnosis.0.next" = "Die dritte Portion wird zugegeben und mit derselben Geschwindigkeit beobachtet. Dann wird gefragt, was die Katalase tun müsste, um zweimal 'verbraucht' zu überleben."
"a-catalyst-comes-out-as-it-went-in.expect.predict.diagnosis.1.reveals" = "Ein Katalysator werde teilweise verbraucht — proportional zu der Reaktion, die er angetrieben hat, wie ein Treibstoff."
"a-catalyst-comes-out-as-it-went-in.expect.predict.diagnosis.1.next" = "Die Zahlen werden verglichen: 4,17 × 10⁻⁹ mol Katalase gegen 0,1 mol Peroxid pro Portion, vierundzwanzig Millionen Peroxidmoleküle pro Enzymmolekül. Alles, was proportional verbraucht würde, wäre schon in der ersten Mikrosekunde aufgebraucht gewesen."
"a-catalyst-comes-out-as-it-went-in.expect.predict.diagnosis.2.reveals" = "Der Kolben erwärme sich durch die exotherme Reaktion, sodass die zweite Portion schneller ablaufen müsste."
"a-catalyst-comes-out-as-it-went-in.expect.predict.diagnosis.2.next" = "Physikalisch richtig, aber in diesem Modell nicht vorhanden. Das Thermometer wird geprüft: Das Labor hält den Kolben durchgehend bei 25,0 °C, weil keine Reaktionsenthalpie in den Geschwindigkeitsmotor eingebaut ist. Es lohnt sich zu wissen, welche der eigenen richtigen Vorhersagen dieses Labor nicht bestätigen kann."
"a-catalyst-comes-out-as-it-went-in.registers.lv1" = "Ein Krümelchen Leberenzym, eigentlich zu klein, um es richtig zu sehen, und ein Kolben mit Peroxid. Eine Sekunde, und das Peroxid ist verschwunden. Man gibt mehr Peroxid dazu: wieder verschwunden, genauso schnell. Noch mehr dazu: wieder verschwunden. Das Krümelchen ist immer noch da und arbeitet weiter. Es ist keine Zutat — es ist eine Tür, durch die die Reaktion hindurchgeht und die sie danach unverändert zurücklässt."
"a-catalyst-comes-out-as-it-went-in.registers.lv2" = "0,001 g Katalase entsprechen bei M ≈ 240 kDa 4,16666667 × 10⁻⁹ mol. Jede der drei 0,1-mol-Portionen wird in einer Sekunde zerstört, je 5,0000 × 10⁻² mol Umsatz, und das Inventar des Labors meldet nach der dritten Portion dieselben 4,16666667 × 10⁻⁹ mol Katalase wie vor der ersten — bis auf die letzte Ziffer identisch. Der Sauerstoff sammelt sich auf 0,15 mol an, das Dreifache der Ausbeute einer einzelnen Portion, wie es sein muss."
"a-catalyst-comes-out-as-it-went-in.registers.lv3" = "Der Mechanismus hinter dieser Aussage lohnt einen Blick, denn er ist struktureller, nicht numerischer Natur. `KineticReaction` hält `catalysts` außerhalb von `reactants` und `products`; der Integrator entnimmt und liefert nur das, was diese beiden Listen benennen, sodass ein Katalysator niemals ein Term in der Massenbilanz ist und nicht abdriften kann. Was er stattdessen tut, wird bei jedem Teilschritt neu von `effective_activation_energy` bestimmt, die das Gefäß nach dem besten vorhandenen Katalysator durchsucht und dessen Barriere einsetzt. Zwei ehrliche Lücken stehen daneben. Das Labor modelliert die Wärme der Zersetzung nicht, sodass ein realer Kolben, der warm wird und dadurch schneller reagiert, hier nicht zu sehen ist. Und ein reales Enzym ist nicht unzerstörbar: Katalase denaturiert unter Hitze, kann gehemmt werden und arbeitet mit einer endlichen Maximalgeschwindigkeit um, die keine Barrieresubstitution ausdrücken kann — eine Michaelis-Menten-Sättigung, für die dieser Motor keinen Term besitzt."
"first-order-means-a-constant-half-life.expect.predict.question" = "0,1 mol Wasserstoffperoxid über Mangandioxid bei 25 °C. Die ersten neunzig Sekunden zerstören 0,0501 mol — knapp über die Hälfte. Wie viel zerstören die zweiten neunzig Sekunden?"
"first-order-means-a-constant-half-life.expect.predict.options" = ["0,0499 mol — der Rest, im selben gleichmäßigen Tempo", "0,0250 mol — die Hälfte des Verbliebenen, weil die Geschwindigkeit mit der Konzentration sinkt", "Wieder 0,0501 mol — die Reaktion hat eine feste Geschwindigkeit, bis sie ausgeht", "Nichts — sie ist beendet"]
"first-order-means-a-constant-half-life.expect.predict.misconception" = "Die erste und die dritte Option sind dasselbe Missverständnis in zwei Verkleidungen: dass eine Reaktion eine Geschwindigkeit hat wie ein Auto eine Geschwindigkeit hat, sodass eine feste Zeit eine feste Menge zerstört. So sieht nullte Ordnung aus, und die ist selten. Erste Ordnung bedeutet, dass die Geschwindigkeit proportional zur verbliebenen Menge ist, sodass jedes gleich lange Intervall einen gleichen *Anteil* entfernt — deshalb ist die Halbwertszeit konstant, und deshalb hat die Reaktion einen langen, dünnen Ausläufer statt eines Endes."
"first-order-means-a-constant-half-life.expect.predict.diagnosis.0.reveals" = "Die Reaktion habe eine Geschwindigkeit in mol pro Minute, sodass sie im nächsten Intervall fertig werde."
"first-order-means-a-constant-half-life.expect.predict.diagnosis.0.next" = "Es wird ein viertes und ein fünftes Intervall hinzugefügt. Eine feste Menge pro Intervall wäre bei null angekommen und hätte aufgehört; das Labor entfernt eine Stunde später immer noch messbares Peroxid."
"first-order-means-a-constant-half-life.expect.predict.diagnosis.1.reveals" = "Die Geschwindigkeit sei fest, bis das Reagenz erschöpft ist und die Reaktion dann stoppt — das Bild nullter Ordnung, standardmäßig angewendet."
"first-order-means-a-constant-half-life.expect.predict.diagnosis.1.next" = "Die drei verbrauchten Mengen werden aufgetragen: 0,0502, 0,0250, 0,0125. Gleiche Mengen wären eine Gerade bis auf null; gleiche Anteile sind eine Kurve mit Ausläufer, und der Unterschied ist schon in drei Punkten sichtbar."
"first-order-means-a-constant-half-life.expect.predict.diagnosis.2.reveals" = "Knapp über die Hälfte sei im ersten Intervall verschwunden, die Reaktion sei also im Wesentlichen vorbei."
"first-order-means-a-constant-half-life.expect.predict.diagnosis.2.next" = "Statt der verbrauchten Menge wird die verbliebene Menge abgelesen: 0,0498 mol sind noch da, die Hälfte der Ausgangsmenge. 'Der größte Teil der Veränderung ist geschehen' und 'der größte Teil des Materials ist weg' sind unterschiedliche Aussagen."
"first-order-means-a-constant-half-life.registers.lv1" = "Sich selbst überlassenes Peroxid zerfällt langsam in Wasser und Sauerstoff. Fünf Minuten nehmen die Hälfte davon weg. Die nächsten fünf Minuten nehmen die Hälfte von dem weg, was übrig ist, nicht die Hälfte der Ausgangsmenge — also ein Viertel. Dann ein Achtel. Es kommt nie ganz bei null an, weshalb altes Peroxid schwach ist statt leer."
"first-order-means-a-constant-half-life.registers.lv2" = "Aufeinanderfolgende Neunzig-Sekunden-Intervalle verbrauchen 0,0501, 0,0250 und 0,0125 mol Peroxid und lassen 0,0499, 0,0249 und 0,0124 mol der ursprünglichen 0,1 mol übrig. Jedes Intervall lässt 49,9 % dessen übrig, was es bekommen hat — jedes Mal derselbe Anteil, das bedeutet erste Ordnung. Die Halbwertszeit ist deshalb konstant, hier etwa 90 s, und eine Stunde später ist nichts Messbares mehr übrig. Das Mangandioxid sorgt dafür, dass das Experiment innerhalb einer Unterrichtsstunde fertig wird: Ohne es liegt die Halbwertszeit bei etwa einem Tag — genau deshalb lohnt sich ein Katalysator."
"first-order-means-a-constant-half-life.registers.lv3" = "Die Konstanz ist die Prüfung, nicht die eigentliche Geschichte. d[H₂O₂]/dt = −2k[H₂O₂], weil das Geschwindigkeitsgesetz erster Ordnung ist, während der stöchiometrische Koeffizient 2 beträgt, also [H₂O₂](t) = c₀·e^(−2kt) und t½ = ln2/(2k) — man beachte den Faktor zwei, genau dort, wo Ordnung und Koeffizient getrennte Größen sind und leicht verwechselt werden. Über Mangandioxid beträgt die Barriere 58 kJ/mol, was k = 3,86 × 10⁻³ s⁻¹ bei 298,15 K und t½ = 89,7 s ergibt, sodass ein 90-s-Intervall etwas mehr als eine Halbwertszeit ist und 49,9 % statt genau 50 % übrig lässt — aus der Barriere gewonnen, nicht an die Beobachtung angepasst. Bemerkenswert ist, was der Katalysator *nicht* verändert: Der Anteil bleibt konstant, weil das Senken der Aktivierungsenergie k skaliert, ohne die Ordnung anzutasten. Diese geschlossene Form dient dem Integrator auch als Referenz — `kinetics.rs` prüft seinen adaptiven Mittelpunkt-Solver gegen e^(−2kt) statt gegen ein anderes numerisches Verfahren, wodurch eine 0,7-prozentige Drift in der ursprünglichen expliziten Euler-Version entdeckt wurde."
"two-beakers-and-one-clock.summary" = "Identische Mischungen bei 25 °C und 35 °C; ein `wait 20s` lässt beide gleichzeitig fortschreiten, und nur die Temperatur unterscheidet sich — 4,3557 × 10⁻⁴ mol gegen 8,1256 × 10⁻⁴ mol"
"two-beakers-and-one-clock.expect.predict.question" = "Du willst wissen, ob die Temperatur die Geschwindigkeit verändert. Du hast eine Stoppuhr. Was ist der Fehler daran, erst das kalte und dann das heiße Becherglas zu stoppen?"
"two-beakers-and-one-clock.expect.predict.options" = ["Kein Fehler — der Stoppuhr ist es egal, welches Becherglas sie stoppt", "Das heiße Becherglas kühlt ab, während es auf seine Reihe wartet, sodass die beiden nicht wirklich bei den notierten Temperaturen sind", "Man kann nicht beide Kreuze gleichzeitig verschwinden sehen", "Es gibt keinen Fehler, aber es dauert so länger"]
"two-beakers-and-one-clock.expect.predict.misconception" = "Die erste und die letzte Option behandeln 'faires Experiment' als Regel darüber, *welche Variablen man ändert*, und hören dort auf. Es ist aber auch eine Regel darüber, wann Dinge geschehen. Ein virtuelles Labor macht diesen Punkt ungewöhnlich deutlich, weil er eigens eingebaut werden musste: `wait` lässt jedes Gefäß im Labor gleichzeitig fortschreiten, sodass die beiden Bechergläser zeitlich nicht auseinanderdriften können, nicht zu unterschiedlichen Zeitpunkten gestartet werden können und nicht auf ihre Reihe warten müssen. Ein echtes Labor schenkt einem davon nichts — genau deshalb muss diese Gewohnheit gelehrt werden."
"two-beakers-and-one-clock.expect.predict.diagnosis.0.reveals" = "Ein faires Experiment sei eine Regel darüber, welche Variablen man ändert; sobald die Variablen stimmen, sei der Ablauf frei wählbar."
"two-beakers-and-one-clock.expect.predict.diagnosis.0.next" = "Es wird aufgelistet, was sich zwischen 'zuerst gestoppt' und 'als zweites gestoppt' alles unterscheidet — die Temperatur des Becherglases, wie lange die Säure schon zugegeben ist, der Raum. Ein kontrollierter Vergleich kontrolliert den Ablauf ebenso wie die Zutaten."
"two-beakers-and-one-clock.expect.predict.diagnosis.1.reveals" = "Das Problem sei der Beobachter: Ein Augenpaar könne nicht zwei Bechergläser gleichzeitig beobachten."
"two-beakers-and-one-clock.expect.predict.diagnosis.1.next" = "Eine reale und lösbare Einschränkung — zwei Kreuze nebeneinander oder ein Video. Stattdessen wird gefragt, was mit dem Becherglas passiert, das gerade nicht beobachtet wird — das ist der Teil, den keine noch so große Aufmerksamkeit beheben kann."
"two-beakers-and-one-clock.expect.predict.diagnosis.2.reveals" = "Nacheinander zu stoppen sei lediglich ineffizient, nicht ungültig."
"two-beakers-and-one-clock.expect.predict.diagnosis.2.next" = "Die Größe des Fehlers wird abgeschätzt. Ein Becherglas, das eine Minute lang zwischen den Durchläufen steht, verliert ein bis zwei Grad, und diese Reaktion ändert ihre Geschwindigkeit um das 1,9-Fache pro zehn Grad — ein paar Grad sind also mehrere Prozent, vergleichbar mit dem zu messenden Effekt."
"two-beakers-and-one-clock.registers.lv1" = "Zwei Bechergläser, von allem dieselbe Menge, das eine warm und das andere nicht. Man startet sie gemeinsam, beobachtet sie gemeinsam, stoppt sie gemeinsam. Nach zwanzig Sekunden ist das kalte leicht trübe, das warme richtig trüb — und weil sonst nichts anders war, kann nur die Wärme das verursacht haben. Ändert man zwei Dinge gleichzeitig, hat man ein hübsch aussehendes Experiment, das nichts beweist."
"two-beakers-and-one-clock.registers.lv2" = "Dasselbe 0,05 mol/L Thiosulfat, dieselben 0,002 mol HCl, dieselben 100 mL, 25 °C gegen 35 °C. Ein `wait 20s` lässt beide Gefäße gleichzeitig fortschreiten: 4,3557 × 10⁻⁴ mol Umsatz im kalten Becherglas gegen 8,1256 × 10⁻⁴ im warmen, ein Faktor von 1,87. Die zweiten zwanzig Sekunden ergeben 3,9760 × 10⁻⁴ und 6,8042 × 10⁻⁴ — beide Bechergläser werden langsamer, während ihr Thiosulfat zur Neige geht, das warme schneller, weil ihm weniger übrig bleibt."
"two-beakers-and-one-clock.registers.lv3" = "Zeit ist auf diesem Labor eine Zustandsdimension, und sie wird geteilt statt pro Gefäß geführt: `Operator::Wait` durchläuft jedes Gefäß und lässt dessen Uhr und Chemie um dasselbe Intervall fortschreiten, und das Labor stellt danach die schnellen Gleichgewichte jedes Gefäßes neu um das ein, was übrig ist. Diese Reihenfolge — erst Kinetik, dann Speziation — ist Operatorsplitting, und sie ist richtig herum, weil das Gleichgewicht der schnellere Prozess ist. Die Entwurfskosten der Alternative sind es wert, genannt zu werden: Hätte `wait` ein Gefäßargument entgegengenommen, wäre jeder Geschwindigkeitsvergleich in dieser Datei ein Vergleich zweier getrennt durchgeführter Experimente gewesen, und das faire Experiment wäre eine Konvention gewesen, die der Nutzer selbst hätte einhalten müssen, statt eine Eigenschaft, die der Motor garantiert. Was die Simulation nicht liefern kann, ist die Schwierigkeit: identische Ausgangstemperaturen, kein Wärmeverlust und perfektes Timing gibt es hier gratis, und genau das macht bei einem echten Labor den größten Teil der Arbeit aus."
"a-salt-with-no-database.summary" = "Natriumthiosulfat löst sich auf und reagiert und trägt exakt nichts zum pH-Wert bei: 1,74858175066 mit ihm und 1,74858175066 ohne ihn"
"a-salt-with-no-database.expect.predict.question" = "Natriumthiosulfat ist das Salz einer schwachen Säure, eine Lösung davon sollte also leicht alkalisch sein. Was meldet dieses Labor für 0,79 g davon in 100 mL reinem Wasser?"
"a-salt-with-no-database.expect.predict.options" = ["Etwa pH 8,5, wie es die Chemie verlangt", "pH 7,00 — es behandelt das Salz als neutral", "Überhaupt nichts: Kein Solver kann Thiosulfat speziieren, also wird keine Lösung charakterisiert, und das pH-Meter zeigt nichts an", "Es weigert sich, das Salz zuzugeben"]
"a-salt-with-no-database.expect.predict.misconception" = "Die zweite Option ist das, was die meiste Software tun würde, und genau dieses Versagen soll dieses Labor vermeiden: eine plausible Zahl ohne jede Grundlage. Thiosulfat fehlt in jeder PHREEQC-Datenbank, die wir ausliefern, es gibt also keine Gleichgewichtskonstante, aus der sich ein pH-Wert berechnen ließe. Das Labor sagt das deshalb offen, und das Salz liegt im Gefäß, ohne dass eine Lösung um es herum charakterisiert wird. Die erste Option ist die richtige Chemie — S₂O₃²⁻ ist die konjugierte Base einer schwachen Säure, und eine echte Lösung ist leicht alkalisch —, was die Lücke real macht und nicht bloß zu einer Formsache."
"a-salt-with-no-database.expect.predict.diagnosis.0.reveals" = "Die Software kenne die Chemie und liefere deshalb die chemisch korrekte Antwort."
"a-salt-with-no-database.expect.predict.diagnosis.0.next" = "Es wird gefragt, woher eine solche Antwort überhaupt kommen sollte. Ein pH-Wert braucht eine Gleichgewichtskonstante, und keine ausgelieferte Datenbank führt eine für Thiosulfat. Software weiß nur, was ihre Daten wissen."
"a-salt-with-no-database.expect.predict.diagnosis.1.reveals" = "Wo ein Programm nichts zu sagen habe, falle es auf den neutralen, unauffälligen Wert zurück."
"a-salt-with-no-database.expect.predict.diagnosis.1.next" = "Genau davor sollte man sich bei jedem Werkzeug hüten: eine plausible Zahl ohne jede Grundlage, nicht zu unterscheiden von einer tatsächlich berechneten. Zum Vergleich der Eintrag `when-the-lab-says-it-does-not-know` desselben Labors — die Entwurfsentscheidung lautet, lieber nichts zu sagen als 7 zu sagen."
"a-salt-with-no-database.expect.predict.diagnosis.2.reveals" = "Ein Modell, das etwas nicht abbilden kann, sollte die Ausführung verweigern."
"a-salt-with-no-database.expect.predict.diagnosis.2.next" = "Es wird bemerkt, was dabei verloren ginge: Das Salz wäre unbrauchbar, und seine Kinetik — die der Motor durchaus gut modelliert — ginge mit verloren. Der nützlichere Weg ist, den Stoff zu akzeptieren und genau zu benennen, welche nachgelagerten Werte er ungültig macht."
"a-salt-with-no-database.registers.lv1" = "Manches weiß dieses Labor zu bedenken, manches nicht. Es kann dieses Salz aufnehmen, es auflösen und reagieren lassen — aber fragst du, was es mit der Säure macht, sagt es dir offen, dass es das nicht herausfinden kann. Das ist eine bessere Antwort als eine selbstsichere Zahl, die niemand überprüft hat."
"a-salt-with-no-database.registers.lv2" = "Das Säure-Becherglas zeigt pH 1,74858175066. Das Becherglas mit Thiosulfat *und* derselben Säure zeigt pH 1,74858175066 — identisch bis zur zwölften Stelle, weil das Thiosulfat weder zur Ladungsbilanz noch zur Ionenstärke etwas beiträgt (0,02006 mol/kgw in beiden). Das dritte Becherglas, Thiosulfat in reinem Wasser, hat überhaupt keine charakterisierte Lösung: Das Salz bleibt als Feststoff im Gefäß, und das pH-Messgerät meldet, dass es nichts abzulesen gibt."
"a-salt-with-no-database.registers.lv3" = "Das Spezies-Register markiert Natriumthiosulfat als `dissolves_without_speciation`, und das Labor löst bei jeder Zugabe `NotYetModeled` aus und benennt dabei genau, was betroffen ist: pH-Wert und Ionenstärke gelten für alles andere im Becherglas. Das ist keine Kosmetik — es wurde durch zwei Fehler erkauft, die nur ein Kinetikmodell hätte aufdecken können. Vor der Behebung führte eine Spezies ohne abgeleitete Rolle dazu, dass `partition` `None` zurückgab, sodass die Zugabe von Thiosulfat stillschweigend den pH-Wert der danebenliegenden Säure entzog; und weil der wässrige Neuaufbau den Inhalt eines Gefäßes durch den berechneten Zustand ersetzt, wurde die nicht erkannte Spezies anschließend zerstört statt ignoriert. Was bleibt, ist ein Gefäß, in dem zwei Solver über derselben Flüssigkeit mit unterschiedlichem Vokabular koexistieren, und der Kinetikmotor bezieht seinen Säureterm von demjenigen, der etwas von Protonen versteht. Es lohnt sich, die fehlende reale Chemie zu benennen: S₂O₃²⁻ hat pKa₂ ≈ 1,6, sodass bei pH 1,75 eine echte Lösung ungefähr zur Hälfte protoniert wäre, und die reagierende Spezies wäre eher HS₂O₃⁻ als das freie Anion."
"the-acid-is-never-used-up.summary" = "Zehn Minuten verbrauchen 4,6727 × 10⁻³ mol Thiosulfat — wofür 9,35 mmol Protonen nötig wären — während das Becherglas 2 mmol enthält und der pH-Wert nie von 1,74858175066 abweicht"
"the-acid-is-never-used-up.expect.predict.question" = "Die Gleichung lautet S₂O₃²⁻ + 2 H⁺ → S + SO₂ + H₂O. Das Becherglas startet mit 5,0 mmol Thiosulfat und 2,0 mmol Säure. Nach zehn Minuten haben 4,67 mmol Thiosulfat reagiert. Was hat der pH-Wert getan?"
"the-acid-is-never-used-up.expect.predict.options" = ["Stark gestiegen — die Protonen waren das begrenzende Edukt und gingen nach 1 mmol Thiosulfat aus", "Ein wenig gestiegen, da Protonen verbraucht wurden", "Überhaupt nicht bewegt — dieses Geschwindigkeitsgesetz liest die Säure aus dem pH-Wert ab und verbraucht sie nie, was eine erklärte Näherung ist, die hier über ihre Gültigkeitsgrenze hinaus strapaziert wird", "Gefallen, weil sich Schwefeldioxid unter Bildung einer Säure löst"]
"the-acid-is-never-used-up.expect.predict.misconception" = "Hier wird kein Missverständnis angeboten — alle vier Optionen sind chemisch sinnvoll, und die erste ist das, was ein echtes Becherglas tun würde. Die Frage dient dazu, eine Modellierungsentscheidung sichtbar zu machen. Das Geschwindigkeitsgesetz behandelt [H⁺] als einen aus der Lösung abgelesenen Einfluss, nicht als Reaktanten mit eigenem Inventar, weil das Experiment für einen großen Säureüberschuss ausgelegt ist und das Gefäß keine Protonenmenge besitzt, die abgebaut werden könnte. Über die zwanzig bis sechzig Sekunden, die das Experiment tatsächlich nutzt, ist das eine gute Näherung. Über zehn Minuten mit nur 2 mmol Säure ist sie es nicht, und der Eintrag sagt das offen, statt es die Leserin oder den Leser als Überraschung entdecken zu lassen."
"the-acid-is-never-used-up.expect.predict.diagnosis.0.reveals" = "Die richtige Chemie für ein echtes Becherglas und die richtige Stöchiometrie — angeboten als Vorhersage über dieses Modell."
"the-acid-is-never-used-up.expect.predict.diagnosis.0.next" = "Hier ist nichts zu verlernen. Stattdessen wird notiert, welche Vorhersage der Motor nicht einlösen kann und warum: Es gibt im Gefäß keine Protonenmenge, die sich abbauen ließe, sodass das Argument des limitierenden Reagenz hier korrekt, aber wirkungslos ist."
"the-acid-is-never-used-up.expect.predict.diagnosis.1.reveals" = "Protonen würden verbraucht, aber eine Lösung puffere sich selbst, sodass der pH-Wert eher driftet als springt."
"the-acid-is-never-used-up.expect.predict.diagnosis.1.next" = "Es wird geprüft, ob irgendetwas in diesem Becherglas puffern könnte: Salzsäure ist vollständig dissoziiert, und Thiosulfat ist für den wässrigen Solver unsichtbar. Dann wird der pH-Wert abgelesen — nicht gedriftet, überhaupt nicht bewegt, zwölf Stellen unverändert."
"the-acid-is-never-used-up.expect.predict.diagnosis.2.reveals" = "Schwefeldioxid sei ein saures Gas, sein Lösen müsse das Becherglas also weiter ansäuern."
"the-acid-is-never-used-up.expect.predict.diagnosis.2.next" = "Chemisch vernünftig und ebenfalls nicht modelliert: Das SO₂ wird direkt in die Gasphase abgelagert und gelangt nie in den wässrigen Solver, kann hier also keine schweflige Säure bilden. Zwei getrennte Lücken erzeugen dieselbe flache Linie, und es lohnt sich, beide benennen zu können."
"the-acid-is-never-used-up.registers.lv1" = "Zehn Minuten sich selbst überlassen, wird das Becherglas dickflüssig und gelb: Fast das gesamte Thiosulfat ist zu Schwefel geworden. Das Säuremessgerät zeigt genau denselben Wert wie am Anfang. In einem echten Becherglas wäre das nicht so — die Säure sollte eigentlich auch verbraucht werden, und hier geschieht das nie. Das ist eine Ecke, für die das Modell nicht gebaut wurde, und es ist besser, diese Ecken zu kennen, als zufällig darüber zu stolpern."
"the-acid-is-never-used-up.registers.lv2" = "Nach 600 s meldet das Labor 4,6727 × 10⁻³ mol Umsatz, 93,5 % der vorhandenen 4,9965 × 10⁻³ mol Thiosulfat, und pH 1,74858175066 davor wie danach — dieselben zwölf Stellen. Nach der angegebenen Gleichung würde ein solcher Umsatz 9,345 × 10⁻³ mol Protonen benötigen, und das Becherglas wurde mit 2,0 × 10⁻³ mol befüllt. Ein echtes Becherglas wäre nach etwa 1 mmol umgesetztem Thiosulfat die Säure ausgegangen, und die Reaktion wäre ins Stocken geraten."
"the-acid-is-never-used-up.registers.lv3" = "Die Näherung ist bewusst gewählt und dokumentiert: `orders` enthält `(PROTON, 1.0)`, während `reactants` das nicht tut, sodass das Proton über `10^(−pH)` in die Geschwindigkeit eingeht und niemals entnommen wird. Der Grund, warum sich das nicht einfach durch Hinzufügen von H⁺ zu `reactants` beheben lässt, ist struktureller Natur — das Proton ist überhaupt keine Gefäßmenge; es lebt in PHREEQCs Ladungsbilanz, wo es für den Integrator nichts zu verringern gibt. Das richtig zu lösen würde bedeuten, dass der Kinetikmotor eine verbrauchte Protonenmenge zwischen den Teilschritten als Änderung der Alkalinität an den wässrigen Solver zurückgibt — eine Kopplung, die derzeit keiner der beiden Solver besitzt. Bis dahin gilt als ehrliche Richtschnur: Thiosulfat-Ergebnisse sind vertrauenswürdig, solange die Säure in echtem Überschuss vorliegt — für diese Mengen also bis zu ungefähr dem ersten Fünftel des Thiosulfats, was die Zeiten des verschwindenden Kreuzes bequem abdeckt, aber diesen Zehn-Minuten-Lauf nicht."
"the-oxygen-is-counted-but-never-seen.summary" = "0,05 mol Sauerstoff — etwa 1,2 L — befinden sich im Kolben; man sieht ihn aufsteigen und kann ihn nicht messen."
"the-oxygen-is-counted-but-never-seen.expect.predict.question" = "Katalase zerstört 0,1 mol Peroxid und setzt dabei 0,05 mol Sauerstoff frei — rund 1,2 Liter, der ganze Sinn der Demonstration. Das Labor meldet aufsteigende Bläschen. Was kannst du mit diesem Gas anfangen?"
"the-oxygen-is-counted-but-never-seen.expect.predict.options" = ["Sein Volumen an der Gasspritze ablesen, so wird die Geschwindigkeit gemessen", "Es sehen, und sonst nichts — hier ist kein Volumen messbar, und kein Gasentwicklungs-Ereignis wird ausgelöst", "Nichts: Bläschen sind nur ein Bild, der Sauerstoff wird also nicht wirklich gezählt", "Es sammeln und wiegen, da die Waage alles im Gefäß erfasst"]
"the-oxygen-is-counted-but-never-seen.expect.predict.misconception" = "Hier geht es nicht um Chemie, und etwas anderes zu behaupten wäre der unehrliche Weg. Die Buchführung des Motors stimmt — 0,05 mol O₂ ist genau die Hälfte des Peroxids, es ist im Gefäß vorhanden und nun als Bläschen sichtbar. Was noch fehlt, liegt weiter unten in der Kette: Es gibt keine Gasspritze, keine Volumenanzeige, und der Kinetikmotor lagert Produkte in eine Phase ein, ohne das `gas_evolved`-Ereignis auszulösen, das die wässrigen und thermischen Solver auslösen. Die eigentliche Messung des Experiments — Milliliter gegen Sekunden — lässt sich deshalb nicht vornehmen. Eine Simulation besitzt eine Modellschicht und eine Darstellungsschicht, und diese können unabhängig voneinander versagen — das lohnt sich bei jeder Simulation zu wissen, die man in die Hand bekommt."
"the-oxygen-is-counted-but-never-seen.expect.predict.diagnosis.0.reveals" = "Was ein echtes Experiment misst, müsse auch die Simulation messen — sei die Chemie richtig, müssten auch die Instrumente vorhanden sein."
"the-oxygen-is-counted-but-never-seen.expect.predict.diagnosis.0.next" = "Die beiden Ebenen werden getrennt. Das Inventar des Gefäßes wird abgelesen (0,05 mol O₂, korrekt bis zur letzten Ziffer), dann wird gefragt, welches Instrument daraus eine Zahl liefern würde. Apparatur ist eine Modellierungsentscheidung, und dieses Labor hat sie noch nicht getroffen."
"the-oxygen-is-counted-but-never-seen.expect.predict.diagnosis.1.reveals" = "Ein Bild sei bloß Dekoration, alles, was man nur sehen kann, sei also nicht wirklich im Modell enthalten."
"the-oxygen-is-counted-but-never-seen.expect.predict.diagnosis.1.next" = "Das Gegenteil des ersten Fehlers, und ebenso falsch. Man fragt das Gefäß, was es enthält: Der Sauerstoff ist bis zur letzten Ziffer vorhanden, und die Bläschen werden *aus* dieser Zahl gezeichnet, nicht anstelle von ihr."
"the-oxygen-is-counted-but-never-seen.expect.predict.diagnosis.2.reveals" = "Jede Veränderung im Kolben müsse sich in dem zeigen, was man sieht, und Sauerstoff sei in großer Menge schwach bläulich."
"the-oxygen-is-counted-but-never-seen.expect.predict.diagnosis.2.next" = "Zutreffend für flüssigen Sauerstoff bei −183 °C, aber hier belanglos. Das Labor berechnet Farbe aus kuratierten Absorptionsspektren, und Sauerstoffgas bei 1 atm hat kein nennenswertes — dies ist also der seltene Fall, in dem 'keine Farbänderung' die richtige Antwort aus dem richtigen Grund ist."
"the-oxygen-is-counted-but-never-seen.registers.lv1" = "Der Kolben ist voller Sauerstoff — genug, um eine große Getränkeflasche zu füllen —, und du siehst ihn durch die Flüssigkeit aufsteigen. Was du nicht kannst, ist ihn zu messen. In einem echten Labor würdest du das Gas in eine Spritze drücken und ablesen, wie viele Milliliter alle zehn Sekunden ankommen, und genau diese Ablesung *ist* das Experiment. Dieses Labor hat noch keine Gasspritze bekommen. Zu wissen, welcher Teil einer Antwort die Berechnung ist und welcher die Ausrüstung, ist eine nützliche Gewohnheit im Umgang mit jeder Simulation."
"the-oxygen-is-counted-but-never-seen.registers.lv2" = "Das Gefäß enthält nach einer Sekunde 5,0000 × 10⁻² mol O₂ in der Gasphase, das sind 1,6 g und, als ideales Gas bei 25 °C und 1 atm, etwa 1,22 L. `look` meldet nun Bläschen, die durch die Flüssigkeit aufsteigen. Was es nicht melden kann, ist ein Volumen: Es gibt keine Gasauffangvorrichtung und auch kein `gas_evolved`-Ereignis, weil der Kinetikmotor seine Produkte in eine Phase einlagert, während nur die wässrigen und thermischen Solver Gasentwicklungsereignisse auslösen. Die Menge ist exakt, und die Messung fehlt."
"the-oxygen-is-counted-but-never-seen.registers.lv3" = "`appearance::observe` erzeugt drei Dinge — eine transmittierte Farbe nach Beer-Lambert über kuratierte ε(λ), eine Trübung aus suspendiertem Feststoff pro Liter und einen Bodensatz — und setzt dann `bubbling: false` als festen Wert, wobei das Struct-Feld dokumentiert ist als 'ob irgendetwas sichtbar nicht-flüssig-nicht-abgesetzt ist'. Das Feld existiert also, die Daten, um es zu füllen, existieren in den Gasphasen-Anteilen des Gefäßes, und die Verbindung zwischen beidem wurde noch nicht hergestellt. Das ist eine Lücke im Renderer, keine im Modell, was sie in eine andere Kategorie stellt als den Rest dieser Datei: Sie ist billig zu schließen, kostet keine Chemie, und macht derzeit das visuell eindrucksvollste Experiment der Schulkinetik unsichtbar. Hier festgehalten, damit niemand eine Unterrichtsstunde darauf aufbaut, einen sprudelnden Kolben zu beobachten, bevor das behoben ist."
"same-destination-different-journey.expect.predict.question" = "Zwei Kolben mit Peroxid, einer mit Katalase. Nach einer Sekunde ist der katalysierte Kolben fertig, der andere hat 0,2 % verloren. Was ist zwei Stunden später in ihnen enthalten?"
"same-destination-different-journey.expect.predict.options" = ["Der katalysierte Kolben enthält mehr Sauerstoff — der Katalysator hat mehr Reaktion bewirkt", "Dasselbe: 0,05 mol Sauerstoff in jedem. Der Katalysator hat verändert, wann, nicht ob oder wie viel", "Der unbehandelte Kolben enthält noch die meiste Menge seines Peroxids — ohne Katalysator läuft die Reaktion nicht", "Der katalysierte Kolben hat begonnen, sich umzukehren, da der Katalysator in beide Richtungen wirkt"]
"same-destination-different-journey.expect.predict.misconception" = "Die erste Option ist das, was Lernende am häufigsten über Katalysatoren glauben, und sie ist eine Aussage über die *Ausbeute* — das Einzige, was ein Katalysator nicht anrühren kann. Ein Katalysator senkt die Barriere in beide Richtungen gleichermaßen, er bringt das System also schneller zum Gleichgewicht, verschiebt das Gleichgewicht aber überhaupt nicht. Die dritte Option ist der gespiegelte Fehler — eine Barriere als Verbot zu behandeln. Die Barriere beträgt hier 75 kJ/mol, genug, damit eine Sekunde wie nichts Geschehenes aussieht, aber bei Weitem nicht genug, um fünf Tage zu überstehen."
"same-destination-different-journey.expect.predict.diagnosis.0.reveals" = "Ein Katalysator erhöhe die Ausbeute — mehr Reaktion finde statt, weil der Katalysator dabei geholfen habe."
"same-destination-different-journey.expect.predict.diagnosis.0.next" = "Der Sauerstoff in beiden Kolben wird am Ende gezählt: 0,0500 mol im katalysierten, 0,0485 mol im unbehandelten und weiter auf denselben Wert zusteigend. Dann wird gefragt, was ein Katalysator überhaupt an einer Massenbilanz ändern könnte."
"same-destination-different-journey.expect.predict.diagnosis.1.reveals" = "Ohne Katalysator finde die Reaktion nicht statt — die Barriere sei ein Verbot, keine Verzögerung."
"same-destination-different-journey.expect.predict.diagnosis.1.next" = "Der unbehandelte Kolben wird bei 1 s und bei fünf Tagen betrachtet: 0,1000 mol übrig, dann 0,0030 mol. Dieselbe Barriere, die eine Sekunde wie nichts aussehen lässt, lässt fünf Tage die Sache fast vollständig zu Ende bringen. „Zu langsam, um es zu sehen“ und „passiert nicht“ sind unterschiedliche Zustände, und nur einer von beiden wird von der Thermodynamik entschieden."
"same-destination-different-journey.expect.predict.diagnosis.2.reveals" = "Ein Katalysator treibe eine Reaktion an, sodass er, wenn nichts mehr anzutreiben sei, in die andere Richtung schieben müsste."
"same-destination-different-journey.expect.predict.diagnosis.2.next" = "Ein Katalysator senkt die Barriere in beide Richtungen gleichermaßen, er beschleunigt also die Annäherung an das Gleichgewicht und kann es nicht verschieben. Das Gleichgewicht dieser Zersetzung liegt im Wesentlichen ganz auf der einen Seite — es gibt nichts, wohin man zurückkehren könnte."
"same-destination-different-journey.registers.lv1" = "Zwei Kolben, und nur einer enthält das Enzym. Nach einer Sekunde ist der Kolben mit dem Enzym fertig, der andere sieht unberührt aus. Schaut man nach fünf Tagen wieder vorbei, hat der langsame fast aufgeholt: Beide werden zu Wasser und Sauerstoff, und beide enden am selben Ort. Das Enzym hat nicht entschieden, was passiert. Es hat entschieden, wie lange man warten muss — eine Sekunde gegen fast eine ganze Woche."
"same-destination-different-journey.registers.lv2" = "Nach 1 s: 0,1000 mol Peroxid immer noch im unbehandelten Kolben — die Reaktion ist um 4 × 10⁻⁷ mol vorangeschritten, was das Labor nicht einmal meldet — gegenüber praktisch null im katalysierten, der schon seine vollen 0,0500 mol Sauerstoff enthält. Fünf Tage später hat der unbehandelte Kolben 0,0485 mol Sauerstoff erreicht, mit noch 0,0030 mol Peroxid übrig. Dasselbe Ziel; der eine brauchte eine Sekunde, der andere kommt immer noch an."
"same-destination-different-journey.registers.lv3" = "Das ist die Unterscheidung, auf der `thermodynamische-vs-kinetische-kontrolle` aufbaut, hier von der Seite der Kinetik statt der des Gleichgewichts betrachtet, und der Motor verkörpert beide Hälften an unterschiedlichen Stellen. Auf der thermodynamischen Seite hält er Tenorit unterhalb von 340 K zurück und stellt den thermischen Solver unterhalb von 500 K ab — kuratierte Platzhalter für Geschwindigkeiten, die er nicht berechnen konnte. Hier wird die Geschwindigkeit berechnet, sodass dieselbe Idee als Intervall statt als Schwelle erscheint: Nichts wird unterdrückt, und 'es ist noch nicht passiert' ist ein Zustand, in dem das Gefäß sein und den es dann verlassen kann. Der präexponentielle Faktor ist so kalibriert, dass ungestörtes Peroxid eine Halbwertszeit von rund einem Tag hat: lang genug, dass beim Zuschauen nichts passiert — das ist der Sinn —, und immer noch weit kürzer als echtes stabilisiertes 3-prozentiges Peroxid in einer braunen Flasche, das sich monatelang hält. Die *Form* des Arguments stimmt also, aber die Haltbarkeit ist keine Messung."
"permanganate-counts-in-fives.expect.predict.question" = "Ein halbes Millimol Kaliumpermanganat kommt in ein Becherglas mit fünf Millimol Eisen(II) in verdünnter Schwefelsäure. Wie viel des Eisens wird am Ende zu Eisen(III)?"
"permanganate-counts-in-fives.expect.predict.options" = ["0,0005 mol — ein Permanganat oxidiert ein Eisen", "0,0025 mol — jedes Permanganat nimmt sich genau fünf", "Alle 0,005 mol — Permanganat ist das stärkste Oxidationsmittel im Chemieschrank"]
"permanganate-counts-in-fives.expect.predict.misconception" = "Zwei Fehlzählungen mit derselben Wurzel: Man stellt sich die Reaktion Teilchen-zu-Teilchen vor. Der Umtauschkurs wird aber von Elektronen bestimmt, nicht von Formeleinheiten — jedes Mangan fällt von +7 auf +2 und nimmt fünf Elektronen auf, jedes Eisen steigt eine Stufe und gibt eines ab. Und Stärke ist kein Appetit: Wie weit ein Oxidationsmittel Elektronen an sich ziehen kann, sagt nichts darüber aus, wie viele es aufnehmen kann."
"permanganate-counts-in-fives.expect.predict.diagnosis.0.reveals" = "Reaktionen werden Formeleinheit gegen Formeleinheit gepaart — ein Teilchen, ein Opfer. Die Elektronenbilanz darunter kommt in dieser Vorstellung gar nicht vor."
"permanganate-counts-in-fives.expect.predict.diagnosis.0.next" = "Zähle Elektronen statt Teilchen: Mangan fällt von +7 auf +2, fünf gewonnen; jedes Eisen steigt von +2 auf +3, eines abgegeben. `inspect` zeigt, dass das Becherglas genau diese Rechnung gemacht hat — 0,0025 mol oxidiert, exakt fünf pro Permanganat."
"permanganate-counts-in-fives.expect.predict.diagnosis.1.reveals" = "Stärke als Appetit gelesen: Ein starkes Oxidationsmittel 'nimmt sich alles', als würde Durchschlagskraft die Kapazität vervielfachen."
"permanganate-counts-in-fives.expect.predict.diagnosis.1.next" = "Stärke sagt, wie weit die Elektronen bergab fallen, nicht wie viele das Oxidationsmittel auffangen kann: 0,0005 mol Mn(VII) haben Platz für genau 0,0025 mol davon. `inspect` den Rest des Eisens — noch immer Fe(II), wartet auf weiteres Oxidationsmittel, was die Titration überhaupt erst möglich macht."
"permanganate-counts-in-fives.registers.lv1" = "Das Violett verschwindet in dem Moment, in dem es auftrifft — das Becherglas trinkt die Farbe. Und es trinkt nach strengem Maß: Jedes Maß Violett verbraucht genau fünf Maß des gelösten Eisens. Nie vier, nie sechs."
"permanganate-counts-in-fives.registers.lv2" = "MnO₄⁻ + 5 Fe²⁺ + 8 H⁺ → Mn²⁺ + 5 Fe³⁺ + 4 H₂O. Mangan nimmt fünf Elektronen auf, jedes Eisen gibt eines ab, sodass 0,0005 mol Permanganat genau 0,0025 mol Eisen oxidieren — und das Labor liest ab: Fe: 50 % Fe(III), 50 % Fe(II)."
"permanganate-counts-in-fives.registers.lv3" = "Das Verhältnis 5:1 ist nirgendwo einprogrammiert. Die Engine führt eine einzige Elektronenbilanz über die gekoppelten Elemente und minimiert die freie Energie; das Verhältnis fällt dabei heraus, auf vier Stellen genau — 0,002500 mol jedes Eisenzustands im Inventar. Zwei weitere Dinge sollten dabei auffallen: Der pH-Wert stieg von 1,42 auf 1,65, weil die Reaktion acht Protonen pro Permanganat verbraucht — die Säure ist Reagens, nicht Kulisse — und das Labor benennt, was es nicht modelliert: Das frische Fe(III) ist übersättigt gegenüber Hämatit und Goethit, Phasen, die wateq4f.dat kennt, die diese Datenbank aber noch nicht benennen kann, weshalb sie gemeldet statt stillschweigend ausgefällt werden."
"half-oxidised-iron-reads-its-own-potential.summary" = "Bei halber Oxidation zeigt Eh das eigene Formalpotenzial des Fe(III)/Fe(II)-Paares an — hier +0,674 V, unter dem tabellierten Wert von 0,771 V, weil Sulfat Fe(III) stärker bindet als Fe(II)"
"half-oxidised-iron-reads-its-own-potential.expect.predict.question" = "Du stoppst die Permanganat-Titration genau auf halbem Weg: Die Hälfte des Eisens ist Fe(II), die Hälfte Fe(III). Ein Voltmeter gegen eine Standard-Wasserstoffelektrode zeigt…"
"half-oxidised-iron-reads-its-own-potential.expect.predict.options" = ["+0,77 V — das tabellierte E° von Fe³⁺/Fe²⁺", "Etwa +0,67 V — deutlich unter dem Tabellenwert", "+1,51 V — das eigene E° von Permanganat, da Permanganat die Oxidation durchgeführt hat"]
"half-oxidised-iron-reads-its-own-potential.expect.predict.misconception" = "Der tabellierte Wert von 0,771 V beschreibt nackte Aquo-Ionen bei Aktivität eins, und beides hat dieses Becherglas nicht: Sulfat bindet Fe(III) weit stärker als Fe(II) und zieht damit die Aktivität des freien Fe(III) und mit ihr das Potenzial nach unten. Was das Messgerät zeigt, ist das Formalpotenzial in diesem Medium — die Zahl, mit der Analytiker tatsächlich arbeiten. Und 1,51 V verwechselt den Akteur mit dem Zustand: Das Permanganat ist verbraucht, und ein Redoxpaar mit nur einem verbliebenen Partner hat kein Potenzial, das es aufzwingen könnte."
"half-oxidised-iron-reads-its-own-potential.expect.predict.diagnosis.0.reveals" = "Die Tabelle als Messgerät: E° als feste Anzeige des Redoxpaares, das Medium spielt keine Rolle — der redoxchemische Zwilling dazu, den pKa-Wert als den pH-Wert jeder x-beliebigen Säureflasche zu lesen."
"half-oxidised-iron-reads-its-own-potential.expect.predict.diagnosis.0.next" = "Dieses Labor hat die Lektion von der bedingten Konstante bereits zweimal mit Protonen vermittelt — `half-neutralised-vinegar` und `phosphate-buffer` — und hier wird sie auf Elektronen übertragen. Sieh dir die lv3-Speziation an: Der Großteil des Fe(III) liegt gebunden als FeSO₄⁺ und Fe(SO₄)₂⁻ vor, während Fe(II) fast frei schwimmt; dieses Ungleichgewicht ist das fehlende 0,1 V."
"half-oxidised-iron-reads-its-own-potential.expect.predict.diagnosis.1.reveals" = "Das Potenzial gehört dem stärksten Akteur: Permanganat hat oxidiert, also muss dessen Zahl die Antwort sein — selbst dann noch, wenn das Permanganat längst verbraucht ist."
"half-oxidised-iron-reads-its-own-potential.expect.predict.diagnosis.1.next" = "`inspect` das Becherglas: Das Permanganat ist bis zum letzten Nanomol verbraucht, und ein Redoxpaar mit nur einem anwesenden Partner hat einer Elektrode nichts zu sagen. Das Messgerät hört auf das Paar, dessen beide Partner noch schwimmen — Fe(III)/Fe(II), bei 50/50."
"half-oxidised-iron-reads-its-own-potential.registers.lv1" = "Stoppst du auf halbem Weg, hält das Becherglas eine perfekte Balance: Die Hälfte des Eisens hat sich verändert, die Hälfte nicht. Ein Messgerät, das jetzt eingetaucht wird, zeigt die eigene Zahl des Eisens an — die Marke, die es immer anzeigt, wenn es genau zur Hälfte durch seine Veränderung ist."
"half-oxidised-iron-reads-its-own-potential.registers.lv2" = "Bei [Fe³⁺] = [Fe²⁺] verschwindet der Logarithmusterm der Nernst-Gleichung, und es gilt Eh = E°′ — genau wie eine halb neutralisierte schwache Säure ihren eigenen pKa-Wert anzeigt. Das Labor meldet pe 11,40, was Eh = +0,674 V entspricht."
"half-oxidised-iron-reads-its-own-potential.registers.lv3" = "Die Tabelle sagt 0,771 V; dieses Messgerät sagt 0,674 V, und beide haben recht — nur über verschiedene Lösungen. Das tabellierte E° geht von nackten Aquo-Ionen bei Aktivität eins aus. Hier zeigt die berechnete Speziation, dass Fe(III) größtenteils als FeSO₄⁺ und Fe(SO₄)₂⁻ gebunden vorliegt, während Fe(II) kaum komplexiert ist, sodass die Aktivität des freien Fe(III) — worauf die Elektrode tatsächlich reagiert — gedrückt wird und das Potenzial mit ihr fällt. Die analytische Chemie nennt das Ergebnis Formalpotenzial und gibt für dieses Redoxpaar in schwefelsaurem Milieu etwa 0,68 V an; das Labor gelangte dorthin über die Komplexbildungskonstanten der Datenbank, nicht weil es ihm gesagt wurde. Es ist die Lektion des Phosphatpuffers — die Konstante ist an das Medium gebunden — übertragen von Protonen auf Elektronen."
"the-oxidant-is-spent-to-the-last-electron.expect.predict.question" = "Jetzt ist das volle 0,001 mol Permanganat hinzugekommen — genau ein Fünftel der Eisenmenge. Was befindet sich im Becherglas?"
"the-oxidant-is-spent-to-the-last-electron.expect.predict.options" = ["Von allem etwas — Reaktionen erreichen ein Gleichgewicht, also bleiben immer beide Seiten übrig", "Violett: Ein so starkes Oxidationsmittel bleibt immer im Überschuss", "Eisen(III) und Mangan(II), vollständig bis an die Grenzen der Arithmetik — und weniger Säure als zuvor"]
"the-oxidant-is-spent-to-the-last-electron.expect.predict.misconception" = "'Gleichgewicht heißt, es bleibt etwas übrig' ist die Lektion der schwachen Säure, zu weit angewendet: Wenn die Redoxpaare derart weit auseinanderliegen, ist der Gleichgewichtsrest zwar real, landet aber neun Größenordnungen unter den Ausgangsmengen — Gleichgewicht und Vollständigkeit sind hier dieselbe Aussage. Die leisere Überraschung ist die Säure: Acht Protonen pro Permanganat gingen in das Wasserprodukt ein, 0,008 der 0,010 mol im Becherglas, und der pH-Wert stieg zum Beweis von 1,4 auf 2,1."
"the-oxidant-is-spent-to-the-last-electron.expect.predict.diagnosis.0.reveals" = "Gleichgewicht als universeller Rest: Jede Reaktion lässt von allem etwas übrig, so wie das Essig-Becherglas den Großteil seiner Säure intakt behielt."
"the-oxidant-is-spent-to-the-last-electron.expect.predict.diagnosis.0.next" = "Sieh dir an, welchen Rest das Gleichgewicht tatsächlich lässt (lv3): Fe(II) bei 7,1 × 10⁻⁸ mol/kgw — neun Größenordnungen unter dem Ausgangswert. Die Redoxpaare liegen weit genug auseinander, dass 'vollständig' und 'im Gleichgewicht' hier derselbe Satz sind — genau das macht diese Reaktion für die Analytik brauchbar."
"the-oxidant-is-spent-to-the-last-electron.expect.predict.diagnosis.1.reveals" = "Stärke als Unerschöpflichkeit: Das starke Reagens gewinnt immer, also muss es dasjenige sein, das am Ende übrig bleibt."
"the-oxidant-is-spent-to-the-last-electron.expect.predict.diagnosis.1.next" = "Stärke ist ein Potenzial, kein Vorrat: 0,001 mol Permanganat haben Platz für genau 0,005 mol Elektronen, und das Eisen lieferte exakt diese Menge. Ein Tropfen mehr, und dieses Labor zieht sich zurück — `explain` sagt warum: Der Überschuss müsste Elektronen vom Lösungsmittel selbst nehmen, was nicht modelliert wird — deshalb ist die erste dauerhaft violette Färbung am Endpunkt einer echten Bürettentitration Chemie, die dieses Labor benennt, statt sie zu zeigen."
"the-oxidant-is-spent-to-the-last-electron.registers.lv1" = "Auch der letzte Rest Violett verschwindet wie alle zuvor. Das Becherglas hat jedes Bisschen seines Eisens verändert — und dabei den Großteil seiner Säure verbraucht."
"the-oxidant-is-spent-to-the-last-electron.registers.lv2" = "0,001 mol MnO₄⁻ × 5 = 0,005 mol Elektronen-Platz: genau das, was 0,005 mol Fe(II) abgeben können. Das Labor liest ab: alles Fe als Fe(III); alles Mn als Mn(II). Und 8 × 0,001 = 0,008 mol der 0,010 mol Protonen im Becherglas gingen dabei mit — der pH-Wert stieg von 1,42 auf 2,12."
"the-oxidant-is-spent-to-the-last-electron.registers.lv3" = "Der Gleichgewichtsrest an Fe(II) beträgt 7,1 × 10⁻⁸ mol/kgw — die Antwort 'von allem etwas' ist real, aber neun Größenordnungen zu klein, um von Bedeutung zu sein. Über diesen Punkt hinaus stellt die Kopplung sich ab, statt zu raten: Ein Oxidationsmittel im Überschuss gegenüber den Reduktionsmitteln würde seine verbliebenen Elektronen dem Lösungsmittel schulden, was dieses Labor nicht modelliert, sodass ein übertitriertes Becherglas seine Reagenzien entkoppelt zeigt und `explain` die unbeglichene Bilanz in Elektronenäquivalenten angibt. Der Endpunkt einer echten Bürettentitration — der erste Tropfen, der violett bleibt — wird hier also als Chemie benannt, die die Engine zu berechnen ablehnt — ganz in der Tradition dieses Labors, das so etwas offen ausspricht."
"the-series-decides-who-plates.expect.predict.question" = "Ein Streifen Zink kommt in blaue Kupfersulfatlösung. Was passiert?"
"the-series-decides-who-plates.expect.predict.options" = ["Nichts — ein Metall und ein gelöstes Salz haben ohne eine Säure nichts miteinander zu schaffen", "Kupfermetall wächst auf dem Zink, das Blau verblasst, und das Becherglas wird deutlich warm", "Das Zink löst sich, aber das Kupfer bleibt auch gelöst — sie tauschen nur auf dem Papier die Plätze"]
"the-series-decides-who-plates.expect.predict.misconception" = "Die erste Antwort reserviert Reaktivität für Säuren; die dritte akzeptiert die Gleichung, aber nicht die Materie. Verdrängung ist echter Elektronenwechsel: Zink steht in der Spannungsreihe unter Kupfer, gibt daher seine Elektronen ab, löst sich als Zn²⁺ auf, und die Kupfer-Ionen nehmen die Elektronen auf und treten als tatsächliches Metall auf der Zinkoberfläche aus der Lösung — mit 218,7 kJ/mol als Beleg dafür."
"the-series-decides-who-plates.expect.predict.diagnosis.0.reveals" = "Reaktivität braucht eine Säure: Metalle reagieren auf Säure, und eine bloße Salzlösung hat nichts, womit sie angreifen könnte."
"the-series-decides-who-plates.expect.predict.diagnosis.0.next" = "Der Angreifer ist nicht das Proton der Säure, sondern jedes Ion, das in der Spannungsreihe unter dem Metall steht. Beobachte das Becherglas: nirgends Säure, und trotzdem wird das Zink verbraucht, während Kupfer sich abscheidet — führe dann `metals-below-hydrogen-fizz` aus, wo das Proton an die Reihe kommt, ganz als nur eine weitere Sprosse."
"the-series-decides-who-plates.expect.predict.diagnosis.1.reveals" = "Die Reaktion findet nur in der Gleichung statt — Ionen tauschen ihre Etiketten, aber im Becherglas bewegt sich nichts; Chemie als Buchhaltung statt als Materie."
"the-series-decides-who-plates.expect.predict.diagnosis.1.next" = "Prüfe alle Beobachtungsgrößen zugleich: Das Blau ist verschwunden (das Cu²⁺, das es trug, ist jetzt Metall), das Thermometer sprang von 33,7 auf 59,9 °C, und `inspect` zeigt festes Kupfer im Inventar, wo zuvor festes Zink stand. Ein bloßer Tausch auf dem Papier setzt keine 218,7 kJ/mol frei."
"the-series-decides-who-plates.registers.lv1" = "Der graue Streifen kommt in das blaue Wasser. Langsam wächst auf dem Streifen ein braun-rosa Pelz aus echtem Kupfer, das Blau verblasst, und das Becherglas wird richtig heiß. Das Zink hat mit dem Kupfer den Platz getauscht — und der Tausch setzt Wärme frei."
"the-series-decides-who-plates.registers.lv2" = "Zn + Cu²⁺ → Zn²⁺ + Cu. Zink steht in der Spannungsreihe unter Kupfer (E° −0,76 V gegenüber +0,34 V), daher wird Zink oxidiert und Kupfer reduziert: 0,0500 mol scheiden sich ab, das Blau der Lösung verschwindet mit ihrem Cu²⁺, und das Becherglas steigt von 33,7 auf 59,9 °C — ΔH ≈ −218,7 kJ pro Mol verdrängtem Metall."
"the-series-decides-who-plates.registers.lv3" = "Das Ausmaß wird durch Bisektion über das Nernst-Zellpotenzial anhand der von PHREEQC gemeldeten Aktivitäten entschieden, die Wärme über die Differenz der Bildungsenthalpien der Ionen, als Enthalpiebilanz — nirgendwo steht 'Zink verdrängt Kupfer' geschrieben. Dieselbe Ordnung beantwortet auch den selektiven Fall: Bietet man einem Zinkstreifen gleichzeitig Ag⁺ und Cu²⁺ an, scheidet sich alles Silber ab, bevor auch nur ein Rest Kupfer folgt — was die eigenen Tests der Engine bestätigen. Grenzen, klar benannt: Die Spannungsreihe spricht über Thermodynamik an der Elektrode, nicht über Geschwindigkeiten — Passivierung, Überspannungen und oxidierende Säuren liegen außerhalb; das Labor sagt das, wo es zum Tragen kommt."
"metals-below-hydrogen-fizz.expect.predict.question" = "Zwei Streifen in zwei Bechergläsern mit derselben Salzsäure: Magnesium im einen, Kupfer im anderen. Was passiert?"
"metals-below-hydrogen-fizz.expect.predict.options" = ["Beide sprudeln — Säure greift Metall an, das ist es, was Säure tut", "Keines sprudelt — festes Metall ist zu widerstandsfähig für eine Flüssigkeit", "Nur das Magnesium sprudelt; das Kupfer liegt unbegrenzt unverändert in der Säure"]
"metals-below-hydrogen-fizz.expect.predict.misconception" = "Beide falschen Antworten behandeln 'Metall' als einen einzigen Stoff mit einem einzigen Verhalten gegenüber Säure. Die Spannungsreihe korrigiert das: Wasserstoff hat seine eigene Sprosse (E° = 0 per Definition), und nur Metalle darunter können Elektronen auf Protonen übertragen. Magnesium liegt weit darunter und sprudelt Wasserstoff; Kupfer liegt darüber, hat in dieser Säure also nichts zu gewinnen und tut genau nichts — was das Labor als Ergebnis meldet, nicht als Fehlanzeige."
"metals-below-hydrogen-fizz.expect.predict.diagnosis.0.reveals" = "Säure greift Metall an, ganz allgemein — das Sprudeln gilt als Eigenschaft der Säure, und als Opfer taugt jedes beliebige Metall."
"metals-below-hydrogen-fizz.expect.predict.diagnosis.0.next" = "Lass beide Bechergläser nebeneinander laufen: Die Säure ist identisch, die Ergebnisse sind es nicht. Die entscheidende Sprosse ist der Platz des Wasserstoffs selbst in der Spannungsreihe — die Säure kann nur Metalle oxidieren, die darunter stehen, und Kupfer tut das nicht."
"metals-below-hydrogen-fizz.expect.predict.diagnosis.1.reveals" = "Feststoffe stehen über Flüssigkeiten: Ein Klumpen Metall wird als schlicht zu massiv vorgestellt, als dass eine wässrige Säure ihm etwas anhaben könnte."
"metals-below-hydrogen-fizz.expect.predict.diagnosis.1.next" = "Beobachte das Magnesium-Gefäß: 0,0200 mol Wasserstoff entweichen als Gas, und das Metall wird vollständig verbraucht. Massivität ist keine chemische Kategorie — die Position in der Spannungsreihe schon, und dieselbe 'wässrige Säure', die Kupfer ignoriert, frisst Magnesium vollständig auf."
"metals-below-hydrogen-fizz.registers.lv1" = "Dieselbe saure Flüssigkeit, zwei verschiedene Metalle. Das silbrige Magnesium sprudelt heftig und verschwindet. Das Kupfer liegt einfach da, Tag für Tag, völlig unbeeindruckt. Metalle kommen der Reihe nach an die Reihe — und die Säure kann nur die unterhalb einer bestimmten Linie berühren."
"metals-below-hydrogen-fizz.registers.lv2" = "Mg + 2 H⁺ → Mg²⁺ + H₂↑ (E° Mg²⁺/Mg = −2,37 V, weit unter dem Wert 0,00 V des Wasserstoffs): 0,0200 mol H₂ entstehen, und der pH-Wert steigt von −0,04 auf 0,23. Kupfer (E° +0,34 V, über Wasserstoff) wird als inert gemeldet: nichts zu gewinnen, nichts passiert."
"metals-below-hydrogen-fizz.registers.lv3" = "Zwei Grenzen verdienen hier ihren Satz. Nur nicht oxidierende Säuren: Salpetersäure löst Kupfer über ein anderes Oxidationsmittel (das Nitrat), sodass 'Kupfer widersteht Säure' eine Aussage über HCl und seinesgleichen ist, und die hier berechnete Spannungsreihe nichts über HNO₃ aussagt. Und Kinetik: Thermodynamisch müsste sogar reines Wasser Magnesium angreifen — wirf es in Salzwasser, und das Labor lehnt mit einer benannten Geschwindigkeitslücke ab, statt es entweder aufzulösen oder für stabil zu erklären. Das Urteil 'inert' wiederum ist ein Event, kein Schweigen — das negative Ergebnis ist erstklassig, ganz in der Tradition dieses Labors."
"the-silver-tree.expect.predict.question" = "Ein Kupferdraht steht in einer farblosen Silbernitratlösung. Was beobachtest du in der nächsten Stunde?"
"the-silver-tree.expect.predict.options" = ["Nichts — Silber ist ein Edelmetall, und Edelmetalle reagieren nicht", "Silberkristalle wachsen auf dem Draht, während sich die Lösung blau färbt", "Der Draht löst sich vollständig auf, und beide Metalle landen in Lösung"]
"the-silver-tree.expect.predict.misconception" = "'Edel' beschreibt das Metall, nicht das Ion — metallisches Silber widersteht dem Angriff, aber ein Silber-Ion ist Silber, das sein Elektron bereits verloren hat und eines zurückwill, und das darunterstehende Kupfer in der Spannungsreihe ist bereit zu zahlen. Pro gelöstem Kupfer scheiden sich zwei Silber ab (je ein Elektron gegen Kupfers zwei), und das ankommende Cu²⁺ bringt das Blau mit: Der Farbwechsel macht den Elektronentransfer sichtbar."
"the-silver-tree.expect.predict.diagnosis.0.reveals" = "Edelheit als pauschale Eigenschaft: Silber ist reaktionsträge, also muss alles, was 'Silber' heißt — Metall oder Ion — so bleiben, wie es ist."
"the-silver-tree.expect.predict.diagnosis.0.next" = "Trenne das Metall von seinem Ion: `silver-does-not-stoop` zeigt metallisches Silber, das Kupfersulfat tatsächlich verweigert, während dieses Becherglas das Silber-ION zeigt, das begierig Elektronen aufnimmt. Die Edelheit gehört zum aufgefüllten Zustand, nicht zum Namen — ein Ag⁺ ist ein Silber, dem bereits etwas geraubt wurde."
"the-silver-tree.expect.predict.diagnosis.1.reveals" = "Verdrängung als gegenseitiges Auflösen — Reaktionen mischen alles in die Lösung; dass ein Metall die Lösung verlassen muss, damit das andere hineingelangt, kommt in dieser Vorstellung nicht vor."
"the-silver-tree.expect.predict.diagnosis.1.next" = "Zähle die Elektronen: Sie müssen irgendwohin, und der einzige Abnehmer ist Ag⁺, das durch ihre Aufnahme zu festem Metall wird — 0,0200 mol Silber scheiden sich ab für 0,0100 mol gelöstes Kupfer, in der Bilanz wie im Inventar. Erhaltene Elektronen sind der Grund, warum Verdrängung ein Tausch ist, nie eine Vermischung."
"the-silver-tree.registers.lv1" = "Auf dem Kupferdraht wachsen glitzernde Nadeln aus echtem Silber, wie Frost — und während der Baum wächst, färbt sich das Wasser um ihn herum langsam blau. Der Draht tauscht sich selbst gegen Silber ein, ein Elektron nach dem anderen."
"the-silver-tree.registers.lv2" = "Cu + 2 Ag⁺ → Cu²⁺ + 2 Ag: Kupfer (E° +0,34 V) steht unter Silber (+0,80 V), also löst sich Kupfer, und Silber scheidet sich ab — 0,0200 mol Ag für 0,0100 mol Cu, zwei zu eins nach Elektronenzahl. Das Blau ist das ankommende Cu²⁺; der pH-Wert driftet von 6,46 auf 4,19, während das neue Kupfer-Ion hydrolysiert (`copper-sulfate-is-blue-and-acidic` erzählt diese Geschichte für sich)."
"the-silver-tree.registers.lv3" = "Die Stöchiometrie steht nirgendwo geschrieben: Ein Elektron pro Silber gegen zwei pro Kupfer fällt aus derselben Elektronenbuchhaltung heraus wie die Fünf beim Permanganat (`permanganate-counts-in-fives`), und die Farbe wird aus der kuratierten Absorptivität von Cu²⁺ berechnet, nicht behauptet. Die Wärme ist klein und real — 23,9 bis 27,4 °C aus den Bildungsenthalpien der Ionen. Dieses Experiment ist genau jenes, das Faradays Silber-Coulometer zur Industriereife brachte: Das Verhältnis zwei zu eins ist eine Elektronenzählung, die man wiegen kann."
"silver-does-not-stoop.summary" = "Die Spannungsreihe ist eine Ordnung: Metallisches Silber in Kupfersulfat tut nichts, und dieses Nichts ist ein berechnetes Ergebnis"
"silver-does-not-stoop.expect.predict.question" = "Der Silberbaum zeigte, wie Kupfermetall sich gegen Silber-Ionen eintauscht. Jetzt vertausche die Rollen: Silbermetall in Kupfersulfat. Was passiert?"
"silver-does-not-stoop.expect.predict.options" = ["Das Spiegelbild — Kupfer scheidet sich auf dem Silber ab", "Überhaupt nichts, niemals: Der Tausch läuft nur bergab", "Es funktioniert, aber langsamer, weil Silber schwerer ist"]
"silver-does-not-stoop.expect.predict.misconception" = "Verdrängt A das B, erwarten Lernende oft, dass B unter passenden Umständen auch A verdrängt — Reaktionen als umkehrbare Gefälligkeiten. Die Spannungsreihe ist eine Ordnung, keine Stimmung: Elektronen fließen vom niedrigeren Metall zum höheren Ion und laufen unter diesen Bedingungen nie zurück. Silber steht über Kupfer, also hat Silbermetall gegenüber Cu²⁺ nichts zu gewinnen, und das Labor meldet dieses Nichts als begründetes Urteil, nicht als leeres Protokoll."
"silver-does-not-stoop.expect.predict.diagnosis.0.reveals" = "Verdrängung als symmetrischer Tausch: Wenn Kupfer sich gegen Silber eintauscht, muss auch Silber sich gegen Kupfer eintauschen — die Richtung ist in dieser Vorstellung noch kein Teil der Regel."
"silver-does-not-stoop.expect.predict.diagnosis.0.next" = "Stelle beide Experimente nebeneinander (`the-silver-tree` und dieses Becherglas): dasselbe Metallpaar, entgegengesetzte Besetzung, und nur eine Richtung bewegt sich. Die Ordnung IST die Chemie — E° +0,80 V reicht keine Elektronen an +0,34 V weiter."
"silver-does-not-stoop.expect.predict.diagnosis.1.reveals" = "Man greift zur Geschwindigkeit, wo die Thermodynamik die Barriere ist: 'langsamer' hält die Reaktion für möglich, nur träge — der Gedanke, dass eine Reaktion schlicht nicht verfügbar sein kann, fehlt."
"silver-does-not-stoop.expect.predict.diagnosis.1.next" = "Warte, so lange du willst: Dies ist nicht `why-the-shelf-is-not-on-fire`, wo die Reaktion bergab läuft und nur von einer Barriere blockiert wird. Hier gibt es kein Bergab — das Elektron müsste sich gegen die Potenzialdifferenz bewegen, und keine noch so große Geduld begleicht diese Rechnung. Langsam und nie sind unterschiedliche Physik, und dieses Becherglas ist die zweite Sorte."
"silver-does-not-stoop.registers.lv1" = "Letztes Mal gab Kupfer, und Silber nahm. Vertausche die Rollen — Silbermetall in blaues Kupferwasser — und es passiert nichts. Nicht langsam: überhaupt nicht. Der Tausch läuft immer nur in eine Richtung die Leiter hinab."
"silver-does-not-stoop.registers.lv2" = "Ag (E° +0,80 V) steht über Cu²⁺/Cu (+0,34 V): Das Zellpotenzial dafür, dass Silber Kupfer reduziert, ist negativ, also keine Reaktion — das Becherglas behält sein Blau, sein Kupfer bleibt gelöst, und das Silber wird als inert gemeldet, mit den Potenzialen in der Meldung."
"silver-does-not-stoop.registers.lv3" = "Das Eintragspaar ist die Lektion: `the-silver-tree` und dieses Becherglas unterscheiden sich nur darin, welche Seite als Metall beginnt, und die Spannungsreihe entscheidet beide Ausgänge aus ein und derselben Ordnung. Das Urteil 'inert' ist ein Event, das seinen Grund mit sich trägt (E° +0,800 V gegenüber +0,342 V) — genau das erlaubt diesem Codex, `inert:Ag` zu behaupten und den Lint ein Nichts überprüfen zu lassen: ein negatives Ergebnis, maschinell nachprüfbar, in der Tradition von `a-spark-that-changes-nothing`."
"zinc-guards-iron.expect.predict.question" = "Ein Klumpen Zink liegt in Eisen(II)-sulfat-Lösung. Was passiert — und warum tragen Stahlschiffsrümpfe angeschraubte Zinkblöcke?"
"zinc-guards-iron.expect.predict.options" = ["Nichts; Zink und Eisen sind sich zu ähnlich, um sich gegenseitig zu stören", "Eisenmetall scheidet sich ab, während sich das Zink löst — Zink gibt seine Elektronen zuerst her, genau das Opfer, das der Rumpfblock bringt", "Das Zink rostet anstelle des Eisens, weil Rost das reaktivere Metall bevorzugt"]
"zinc-guards-iron.expect.predict.misconception" = "Die dritte Antwort hat den richtigen Instinkt, aber im falschen Mechanismus verpackt: Nichts 'bevorzugt' irgendetwas — Zink steht in der Spannungsreihe einfach unter Eisen, sodass Zink überall dort zahlt, wo Elektronen verlangt werden, bevor Eisen es tut. In diesem Becherglas heißt das: gelöstes Eisen wird auf Kosten des Zinks zu Metall zurückgedrängt; an einem Rumpf heißt es, dass der Korrosionsstrom den ersetzbaren Block statt der unersetzlichen Platte entleert. Dieselbe Ordnung, dasselbe Opfer."
"zinc-guards-iron.expect.predict.diagnosis.0.reveals" = "Ähnliche Metalle, keine Chemie: Man stellt sich vor, Reaktivitätsunterschiede bräuchten Drama — Säure gegen Metall, nicht Grau gegen Grau."
"zinc-guards-iron.expect.predict.diagnosis.0.next" = "Der Abstand muss nur ungleich null sein: −0,76 V gegenüber −0,45 V reicht hier für jedes letzte Eisen-Ion. `inspect` danach: 0,0100 mol Eisen abgeschieden, das Zink vollständig in Lösung gegangen — ein Drittel Volt, ganz aufgebraucht."
"zinc-guards-iron.expect.predict.diagnosis.1.reveals" = "Rost als Akteur mit Vorlieben, der zum reaktiveren Metall überspringt — Schutz vorgestellt als Ablenkungsverhalten statt als Elektronenbuchhaltung."
"zinc-guards-iron.expect.predict.diagnosis.1.next" = "Ersetze 'bevorzugt' durch eine Richtung: Elektronen fließen vom niedrigeren Metall hinauf zu allem, was reduziert wird. Der Zinkblock korrodiert *weil* er die Elektronenquelle des geringsten Widerstands ist — keine Vorliebe, nur dieselbe Ordnung, die in diesem Becherglas dafür sorgte, dass Eisen abgeschieden wurde."
"zinc-guards-iron.registers.lv1" = "Der Zinkklumpen gibt sich langsam selbst preis, und dort, wo er lag, wächst grauer Eisenpelz. Bei einem Schiff ist es derselbe Trick: Man schraubt einen Klumpen Zink an, und das Meer frisst den Klumpen statt den Rumpf — ein Leibwächter, der den Treffer absichtlich abbekommt."
"zinc-guards-iron.registers.lv2" = "Zn + Fe²⁺ → Zn²⁺ + Fe (E° −0,76 V unter −0,45 V): 0,0100 mol Eisen scheiden sich auf dem sich auflösenden Zink ab. Der Opferschutz ist diese Reaktion, betrieben als Wartungsplan — das Zink ist billiger zu ersetzen als der Stahl, den es bewacht."
"zinc-guards-iron.registers.lv3" = "Dies ist P3es 'Warum Zink Eisen schützt', beantwortet durch Berechnung statt Behauptung: Die Richtung fällt aus demselben Nernst-Vergleich heraus wie bei jedem anderen Paar in der Spannungsreihe. Ehrlichkeitshinweise: Echter Rumpfschutz ist eine elektrochemische Zelle mit Sauerstoff an der Kathode, reichhaltiger als dieses einzelne Becherglas; und die frische Eisenchemie hier liegt nahe bekannter Grenzen der Engine (eine Übersättigung, die diese Datenbank nicht benennen kann, kann gemeldet werden), weshalb dieser Eintrag Mengen und pH-Wert festlegt, nicht Potenziale."
"the-daniell-cell-offers-its-voltage.summary" = "Zwei Halbzellen und eine Salzbrücke: Die Daniell-Zelle zeigt im Leerlauf 1,104 V — der Abstand zwischen zwei Sprossen der Spannungsreihe, angeboten, bevor überhaupt Strom fließt"
"the-daniell-cell-offers-its-voltage.expect.predict.question" = "Zink steht in Zinksulfat, Kupfer in Kupfersulfat, dazwischen eine Salzbrücke und über den Metallen ein Voltmeter. Was zeigt das Messgerät an?"
"the-daniell-cell-offers-its-voltage.expect.predict.options" = ["0 V — die Metalle berühren sich nie, also verbindet sie keine Chemie", "Etwa 1,1 V — der Abstand zwischen den Positionen der beiden Metalle in der Spannungsreihe", "Etwa 0,4 V — der Mittelwert der beiden Elektrodenpotentiale"]
"the-daniell-cell-offers-its-voltage.expect.predict.misconception" = "Eine Spannung ist eine *Differenz*, kein Mittelwert und kein Kontakt: Jedes Metall sitzt bei seinem eigenen Elektrodenpotenzial gegenüber seinen eigenen Ionen, und das Messgerät liest den Abstand ab — E°(Cu²⁺/Cu) − E°(Zn²⁺/Zn) = 0,34 − (−0,76) ≈ 1,10 V. Die Verdrängungsreaktion und die Batterie sind dieselbe Chemie: Gibt man die Metalle in ein Becherglas, springen die Elektronen direkt als Wärme über; trennt man die Halbzellen, müssen dieselben Elektronen den Draht nehmen, wo man sie zur Arbeit zwingen kann."
"the-daniell-cell-offers-its-voltage.expect.predict.diagnosis.0.reveals" = "Reaktion erfordert Kontakt: Die Metalle berühren sich nie, also kann nichts passieren — der Stromkreis als Ganzes ist in dieser Vorstellung noch nicht die Einheit der Chemie."
"the-daniell-cell-offers-its-voltage.expect.predict.diagnosis.0.next" = "Verfolge die Optionen eines einzelnen Elektrons: Es verlässt das Zink entweder direkt zu einem Cu²⁺ an der Metalloberfläche (`the-series-decides-who-plates`, wo der Abstand zu 218,7 kJ/mol Wärme wurde) oder über den Draht zur Kupferelektrode, wo dieselbe Chemie auf Distanz stattfindet. Die Salzbrücke schließt den Ladungskreis; der Draht ist dort, wo der Tausch messbar wird."
"the-daniell-cell-offers-its-voltage.expect.predict.diagnosis.1.reveals" = "Potenziale werden gemittelt statt subtrahiert — zwei Zahlen aus einer Tabelle werden so kombiniert, wie man Noten aus einer Prüfung zusammenrechnet."
"the-daniell-cell-offers-its-voltage.expect.predict.diagnosis.1.next" = "Prüfe die Vorzeichenkonvention am Becherglas: Das Messgerät zeigt an, in welche Richtung Elektronen fließen *wollen*, und ein Wollen ist eine Differenz. Das Labor druckt die Rechnung mit dem Ergebnis aus: E° +0,342 minus −0,762 ergibt die gemeldeten 1,104 V, Elektronen angeboten von v1 an v2."
"the-daniell-cell-offers-its-voltage.registers.lv1" = "Zwei Gefäße, zwei Metalle, eine Papierbrücke aus Salzwasser, und ein Messgerät dazwischen: Es zeigt eine echte Spannung an — eine Batterie, gemacht aus nichts als dem unterschiedlichen Appetit der beiden Metalle auf Elektronen."
"the-daniell-cell-offers-its-voltage.registers.lv2" = "Zn | Zn²⁺ ‖ Cu²⁺ | Cu: E = E°(Kathode) − E°(Anode) = 0,34 − (−0,76) ≈ 1,10 V, und das Labor liest im Leerlauf 1,104 V ab. Das ist Daniells Zelle von 1836 — die Verdrängungsreaktion aus `the-series-decides-who-plates`, nur mit getrennten Hälften, sodass die Elektronen den Draht nehmen."
"the-daniell-cell-offers-its-voltage.registers.lv3" = "Leerlauf, und das Labor sagt das auch: Dies ist die Spannung, die die Zelle *anbietet*, nicht die, die sie unter Last liefert — Strom würde sie durch Innenwiderstand und Polarisation absenken, keines von beidem hier modelliert, und der Bericht hält genau das fest. Die 1,104 V sind Nernst über die von PHREEQC für jede Seite berechneten Aktivitäten (E° allein ergibt 1,1037; die beiden 0,01-mol/kgw-Lösungen heben ihre Korrekturen fast gegenseitig auf). Beide Halbzellen liegen bei diesen Mengen innerhalb eines halben Grades von 25 °C — bei 0,1 mol würde die Lösungswärme die beiden Elektroden auf unterschiedliche Temperaturen bringen, weshalb dieser Eintrag die verdünnte Fassung verwendet."
"dilution-buys-less-than-the-slide-rule-says.summary" = "Zehnfache Verdünnung der Kupferseite kostet 18,2 mV, nicht die 29,6 mV des Nernst-Rechenschiebers — die Gleichung ist exakt über Aktivitäten, und die Konzentrationen sind nicht die Aktivitäten"
"dilution-buys-less-than-the-slide-rule-says.expect.predict.question" = "Die Lehrbuchaufgabe: Verdünne die Kupferseite einer Daniell-Zelle zehnfach, und E fällt um 0,0592/2 Volt pro Dekade — 29,6 mV. Das Labor verdünnt und liest das Messgerät ab. Um wie viel fiel die Spannung tatsächlich?"
"dilution-buys-less-than-the-slide-rule-says.expect.predict.options" = ["Genau 29,6 mV — die Nernst-Gleichung ist eine Gleichung", "18,2 mV — deutlich weniger, weil die freie Kupfer-Aktivität um einen Faktor gefallen ist, der näher bei 4 als bei 10 liegt", "Nichts — Verdünnung ändert, wie viel Kupfer da ist, nicht was Kupfer ist"]
"dilution-buys-less-than-the-slide-rule-says.expect.predict.misconception" = "Die Nernst-Gleichung IST exakt — über Aktivitäten. Die Rechenschieber-Version setzt still Konzentrationen ein, was voraussetzt, dass sich die Aktivitätskorrekturen zwischen beiden Lösungen aufheben. Das tun sie nicht: In der stärkeren Lösung ist ein großer Teil des Kupfers mit Sulfat gepaart, sodass zehnfach weniger Gesamtkupfer nur etwa vierfach weniger *freies* Cu²⁺ bedeutet, und der Logarithmus sieht die Vier. Der zweite Zeuge macht es endgültig: Eine Kupfer-Silber-Zelle zeigt 0,445 V bei 0,01 mol, aber 0,483 V bei 0,1 — die Abweichung wechselt mit der Konzentration das Vorzeichen, sodass keine 'immer ein bisschen weniger'-Faustregel überlebt."
"dilution-buys-less-than-the-slide-rule-says.expect.predict.diagnosis.0.reveals" = "Die gedruckte Gleichung gilt als die Physik: Konzentrationen gehen in den Logarithmus ein, weil das Buch sie dort hingesetzt hat — die Fußnote zur Aktivität hat es nie ins Arbeitsgedächtnis geschafft."
"dilution-buys-less-than-the-slide-rule-says.expect.predict.diagnosis.0.next" = "Dieses Labor hat dieselbe Lektion bereits dreimal mit verschiedenen Messgeräten vermittelt: `ph-is-not-quite-minus-log-c` (die pH-Elektrode), `half-oxidised-iron-reads-its-own-potential` (die Redoxelektrode), und jetzt die ganze Zelle. Sieh dir die lv3-Speziation von v2 an: Das Ionenpaar CuSO₄ hält ein Drittel des Kupfers, und der fixierte Engine-Test behauptet, dass der Abfall geringer ist als ideal, nicht irgendeine bestimmte Zahl — die Abweichung selbst ist die Chemie."
"dilution-buys-less-than-the-slide-rule-says.expect.predict.diagnosis.1.reveals" = "Spannung als Identität: Was ein Metall 'ist', legt sein Potenzial fest, und die Menge ist bloße Buchhaltung — der Logarithmusterm hat keine physikalische Bedeutung."
"dilution-buys-less-than-the-slide-rule-says.expect.predict.diagnosis.1.next" = "Führe zuerst das stärkste Gegenbeispiel aus (`a-battery-from-nothing-but-imbalance`): zwei identische Kupferelektroden, nichts unterschiedlich außer der Konzentration, und trotzdem erscheinen echte 18 mV. Würde die Menge Potenziale nicht bewegen, würde diese Zelle für immer null anzeigen."
"dilution-buys-less-than-the-slide-rule-says.registers.lv1" = "Verdünnst du eine Seite der Batterie, wird ihr Schub schwächer — aber weniger schwach, als die Faustregel versprochen hat. Das Becherglas weiß etwas, das der Rechenschieber nicht weiß: wie viel vom Kupfer wirklich frei ist."
"dilution-buys-less-than-the-slide-rule-says.registers.lv2" = "E = E° − (0,0592/2)·log(a(Zn²⁺)/a(Cu²⁺)). Zehnfach weniger Gesamtkupfer sollte 29,6 mV kosten, wäre Konzentration gleich Aktivität; das Labor liest 1,104 → 1,086 V, ein Abfall von 18,2 mV, weil die Sulfat-Paarung bedeutet, dass das Verhältnis des freien Cu²⁺ zwischen beiden Lösungen näher bei 4 als bei 10 liegt."
"dilution-buys-less-than-the-slide-rule-says.registers.lv3" = "Das fails_at der konzentrationsbasierten Nernst-Form, als Chemie ausgedrückt: In molar starken Sulfatmedien trägt das Ionenpaar CuSO₄(aq) einen großen Anteil des Kupfers, und dieser Anteil *ändert sich mit der Verdünnung*, sodass keine feste Korrektur die Konzentrationsform rettet. Der Regressionstest der Engine behauptet bewusst eine Ungleichung (Abfall < ideal) statt 18,2 mV, weil die ehrliche Aussage der Mechanismus ist, nicht die Zahl dieses Szenarios. Das Kupfer-Silber-Paar liefert den Vorzeichenwechsel-Zeugen (0,445 V bei 0,01 mol, 0,483 V bei 0,1, gegenüber E° 0,458): Bei niedriger Konzentration dominiert der n=1-Silberterm das Defizit, bei hoher Konzentration überwiegt der sulfatarme Kupferterm."
"a-battery-from-nothing-but-imbalance.summary" = "Eine Konzentrationszelle: identische Kupferelektroden, zehnfach unterschiedliche Lösungen — E° hebt sich zu 0,000 auf, und das Messgerät zeigt trotzdem 18 mV, der Nernst-Term ganz allein"
"a-battery-from-nothing-but-imbalance.expect.predict.question" = "Dasselbe Metall auf beiden Seiten, dasselbe Salz auf beiden Seiten — zweimal Kupfer in Kupfersulfat, nur die Konzentration unterscheidet sich zehnfach. Das Voltmeter zeigt…"
"a-battery-from-nothing-but-imbalance.expect.predict.options" = ["0 V — identische Elektroden können sich über nichts uneinig sein", "Etwa 18 mV, wobei die verdünnte Seite den Minuspol bildet", "Etwa 1,1 V — zwei Bechergläser und eine Brücke ergeben eine Daniell-Zelle, egal was drin ist"]
"a-battery-from-nothing-but-imbalance.expect.predict.misconception" = "Die Standardpotenziale heben sich exakt auf — E° = 0,000, und das Labor druckt genau das aus — trotzdem bleibt eine echte Spannung, weil der Nernst-Term das Ungleichgewicht selbst abliest: Die verdünnte Seite löst Kupfer auf, um Ionen zu gewinnen, und die starke Seite scheidet Kupfer ab, um sie loszuwerden — die Zelle läuft buchstäblich auf dem Drang zum Ausgleich. Eine Batterie braucht einen Unterschied, und ein Konzentrationsunterschied ist ein Unterschied."
"a-battery-from-nothing-but-imbalance.expect.predict.diagnosis.0.reveals" = "Potenzial gehört zum Stoff: identische Metalle, identische Potenziale, für immer null — Konzentration hat in dieser Vorstellung keinen Platz an der Elektrode."
"a-battery-from-nothing-but-imbalance.expect.predict.diagnosis.0.next" = "Lies die eigene Rechnung des Labors: E° = 0,000 exakt, E = 0,018 V trotzdem. Die gesamte Anzeige ist der Logarithmusterm — halte den Daumen über die E°-Spalte der Tabelle, und diese Zelle funktioniert genau gleich weiter, was keine Zelle behaupten kann, die auf 'die Metalle unterscheiden sich' aufbaut."
"a-battery-from-nothing-but-imbalance.expect.predict.diagnosis.1.reveals" = "Zwei beliebige verkabelte Bechergläser ergeben 'die Batterie aus dem Buch' — der Aufbau gilt als Ursache, und 1,1 V ist das, was ein Aufbau dieser Form eben produziert."
"a-battery-from-nothing-but-imbalance.expect.predict.diagnosis.1.next" = "Die 1,104 V gehörten zu einem bestimmten Sprossenpaar, nicht zum Glasgerät (`the-daniell-cell-offers-its-voltage`). Gleiches Glasgerät, gleiche Brücke, Kupfer auf beiden Seiten: sechzigmal weniger Spannung. Die Spannungsreihe liefert die große Zahl; hier trägt die Spannungsreihe nichts bei, und was übrig bleibt, ist reiner Nernst."
"a-battery-from-nothing-but-imbalance.registers.lv1" = "Zwei Gefäße mit demselben blauen Wasser — eines stark, eines schwach — in beiden Kupfer, dazwischen eine Brücke. Und das Messgerät zeigt trotzdem etwas an! Die starke Seite will Kupfer abgeben, die schwache Seite will mehr davon: Der Wunsch nach Ausgleich allein reicht schon, um Strom zu machen."
"a-battery-from-nothing-but-imbalance.registers.lv2" = "Cu | Cu²⁺(0,001) ‖ Cu²⁺(0,01) | Cu: E° hebt sich zu 0,000 auf, und E = (0,0592/2)·log(a₂/a₁) — das Labor liest 0,018 V ab, mit der verdünnten Seite als Anode. Eine Konzentrationszelle ist die Nernst-Gleichung, bei der alles andere herausgekürzt wurde."
"a-battery-from-nothing-but-imbalance.registers.lv3" = "Der reinste Zeuge, den dieses Labor für 'die Zahl sind die Aktivitäten' aufbieten kann: Kein Tabellenwert überlebt bis in die Antwort, sodass die 18,4 mV vollständig das berechnete Aktivitätsverhältnis sind (weshalb es auch nicht der ideale Wert von 29,6/2 pro Dekade ist — dieselbe Paarungskorrektur wie bei `dilution-buys-less-than-the-slide-rule-says`). Die Richtung ist die zweite Lektion: Die *verdünnte* Seite ist die Anode, sie löst ihre eigene Elektrode auf, um aufzuholen — Materie, die sich bewegt, um ein Gefälle auszugleichen, ausgelesen in Volt. Nervenzellen und pH-Elektroden arbeiten nach genau demselben Prinzip."
"only-the-two-is-chemistry.summary" = "Cu²⁺ + 2 e⁻ → Cu — eine Halbreaktion, deren Elektronen der Draht liefert"
"only-the-two-is-chemistry.expect.predict.question" = "Ein halbes Ampere fließt 1930 Sekunden lang durch Kupfersulfat — 965 Coulomb, fast genau ein Hundertstel Faraday. Wie viel Kupfer landet an der Kathode?"
"only-the-two-is-chemistry.expect.predict.options" = ["0,0100 mol — ein Mol Elektronen scheidet ein Mol Metall ab", "0,0050 mol — jedes Kupfer-Ion verlangt zwei Elektronen", "Ohne die Spannung lässt sich das nicht sagen — Volt sind es, die die Galvanisierung antreiben"]
"only-the-two-is-chemistry.expect.predict.misconception" = "Die Kette lautet Q = It, n(e⁻) = Q/F, n(Metall) = n(e⁻)/z, m = nM — und drei dieser vier Schritte sind reine Arithmetik. Der Divisor z ist das einzige Stück Chemie darin: Cu²⁺ nimmt zwei Elektronen auf, also erkauft ein Hundertstel Faraday ein halbes Hundertstel Kupfer. Die Spannung entscheidet, ob die Abscheidung überhaupt läuft; die Ladung entscheidet, wie viel — auf vier Stellen genau."
"only-the-two-is-chemistry.expect.predict.diagnosis.0.reveals" = "Elektronen und Atome werden eins zu eins gepaart — die Ladung des Ions, der einzige chemische Beitrag in der ganzen Rechnung, ist der Schritt, der übersprungen wurde."
"only-the-two-is-chemistry.expect.predict.diagnosis.0.next" = "Führe das Zinkzwilling-Experiment aus: Dieselben 965 C in Zinksulfat scheiden dieselben 0,0050 mol ab — 0,327 g gegenüber Kupfers 0,318, nur durch die Molmasse unterschieden — weil beide Ionen 2+ sind. Stell dir dann Silber vor: Dieselbe Ladung würde 0,0100 mol abscheiden, da Ag⁺ nur eines aufnimmt. Die Elektronenzahl legt die Molmenge fest; die Ladung des Ions ist der Umtauschkurs."
"only-the-two-is-chemistry.expect.predict.diagnosis.1.reveals" = "Spannung als Mengenregler: mehr Volt, mehr Metall — die Rollen der beiden elektrischen Größen verschmelzen in dieser Vorstellung zu 'Elektrizität'."
"only-the-two-is-chemistry.expect.predict.diagnosis.1.next" = "Trenne sie so, wie es das Messgerät tut: Spannung ist der Druck, der entscheidet, ob Cu²⁺ + 2e⁻ → Cu abläuft; Ladung ist die Anzahl der Elektronen, die tatsächlich hinübergewandert sind, und jedes einzelne davon findet sich in der Abscheidung wieder. Genau das wog Faraday 1833 — die Waage als Elektronenzähler."
"only-the-two-is-chemistry.registers.lv1" = "Schließt du eine Batterie an das blaue Bad an, wächst Kupfer auf dem Draht — und es wächst nach strenger Buchhaltung: Lässt du den Strom doppelt so lange fließen, bekommst du genau doppelt so viel Kupfer. Elektrizität ist zählbares Zeug, und das Metall zählt es für dich."
"only-the-two-is-chemistry.registers.lv2" = "Q = 0,5 A × 1930 s = 965 C → n(e⁻) = Q/F = 0,0100 mol → n(Cu) = 0,0050 mol → m = 0,318 g. Dosiere es: 120 C ergeben 0,040 g, 3600 C ergeben 1,185 g — die Masse folgt der Ladung über die ganze Reihe hinweg."
"only-the-two-is-chemistry.registers.lv3" = "Nur die 2 ist Chemie: Das Labor liest den Divisor aus dem Redoxpaar ab, das das Gefäß enthält, statt ihn gesagt zu bekommen, und der Rest ist Arithmetik, die eine lernende Person von Hand nachprüfen kann — genau das ist der Punkt dieses Eintrags. Grenzen, vom Labor benannt, wo sie zum Tragen kommen: Ladung über das hinaus, was das Kupfer der Lösung aufnehmen kann, stoppt an der Quelle, mit dem Hinweis, dass eine echte Zelle stattdessen das Wasser elektrolysieren würde; und Sole wird rundweg abgelehnt, weil Chlorchemie nicht modelliert wird — die Chlor-Alkali-Elektrolyse, die berühmteste industrielle Elektrolyse überhaupt, ist eine benannte Lücke, keine falsche Antwort."
"the-plating-bath-turns-acid.summary" = "2 H₂O → O₂ + 4 H⁺ + 4 e⁻ — die inerte Anode begleicht die Ladungsrechnung in Protonen"
"the-plating-bath-turns-acid.expect.predict.question" = "Du scheidest 0,318 g Kupfer aus dem blauen Bad ab. Was passiert mit dem pH-Wert des Bades?"
"the-plating-bath-turns-acid.expect.predict.options" = ["Nichts — Galvanisieren bewegt Metall, und Metall ist keine Säure", "Er bricht ein, von 4,3 auf 1,8: Jedes entfernte Cu²⁺ hat seine Ladung zurückgelassen, und die Anode begleicht die Rechnung mit Protonen", "Er steigt — das Entfernen des Metalls 'befreit' die Lösung"]
"the-plating-bath-turns-acid.expect.predict.misconception" = "Ladungserhaltung führt hier Regie: Jedes Cu²⁺, das die Lösung als Metall verlässt, nimmt zwei positive Ladungen aus dem Wasser mit, und die Lösung kann nicht einfach negativ werden. An der inerten Anode wird die Bilanz durch die Oxidation des Wassers selbst ausgeglichen — 2 H₂O → O₂ + 4 H⁺ + 4 e⁻ —, sodass Sauerstoff entweicht und sich Säure ansammelt, ein Proton pro Elektron. Niemand erwartet, dass Galvanisieren das Bad ansäuert, und doch fällt es direkt aus der Bilanz heraus."
"the-plating-bath-turns-acid.expect.predict.diagnosis.0.reveals" = "Die Kathode ist die ganze Geschichte: Dort bewegt sich Metall, also ist dort die Chemie — die Anode ist nur der andere Draht."
"the-plating-bath-turns-acid.expect.predict.diagnosis.0.next" = "Verfolge die von der Kathode verbrauchten Elektronen zurück zu ihrer Quelle: Sie stammten aus Wassermolekülen an der Anode, und jeder Abgang hinterließ ein Proton. Das Labor bucht das genau — 0,0025 mol O₂ verlassen das offene Gefäß, das Wasserinventar sinkt von 5,5342 auf 5,5292 mol, und der pH-Wert landet bei 1,84. Ein Stromkreis hat zwei Enden, und an beiden findet Chemie statt."
"the-plating-bath-turns-acid.expect.predict.diagnosis.1.reveals" = "Gelöste Stoffe als Last: Entfernt man irgendetwas, 'befreit' das die Lösung angeblich und bewegt sie in Richtung der 7 des reinen Wassers — gelöstes Kupfer und Säure werden hier als dieselbe Art von Verunreinigung eingeordnet."
"the-plating-bath-turns-acid.expect.predict.diagnosis.1.next" = "Prüfe, was tatsächlich entfernt und was neu erzeugt wurde: Das Kupfer verließ die Lösung, seine Gegenladung aber nicht — Sulfat bleibt, und neues H⁺ kam hinzu, um ihm gegenüberzustehen. Das Bad endet als verdünnte Schwefelsäure, weshalb industrielle Galvanikbetriebe ihre Bäder überwachen und dosieren, statt ihnen eine Selbstreinigung zuzutrauen."
"the-plating-bath-turns-acid.registers.lv1" = "Scheidest du das Kupfer ab, wird das Bad sauer — scharf genug, um zu brennen. Die Blasen am anderen Draht sind der Hinweis: Das Wasser selbst wird auseinandergenommen, um das entnommene Kupfer zu bezahlen."
"the-plating-bath-turns-acid.registers.lv2" = "Kathode: Cu²⁺ + 2e⁻ → Cu. Anode (inert): 2 H₂O → O₂↑ + 4 H⁺ + 4 e⁻. Pro 0,0100 mol Elektronen: 0,0050 mol Kupfer abgeschieden, 0,0025 mol Sauerstoff entwichen, 0,0100 mol H⁺ gebildet — pH 4,27 → 1,84."
"the-plating-bath-turns-acid.registers.lv3" = "Welche Anode zum Einsatz kommt, ist die tragende Wahl, und das Labor benennt seine eigene: die *inerte* Anode (die Kohlestäbe aus dem Schulversuch), an der Wasser oxidiert wird und sich Säure ansammelt. Eine *Kupfer*-Anode löst sich auf und ersetzt genau das, was sich abscheidet — Cu²⁺ bleibt konstant, keine Säure, kein Sauerstoff — und diese andere Zelle ist die Elektroraffination, die dieses Labor nicht modelliert. Gleiche Kathode, entgegengesetzte Badchemie, entschieden ganz an der Elektrode, die du nicht im Blick hattest."
"charging-fights-the-series.summary" = "Laden treibt die Zelle rückwärts, und die Abscheidung überlebt an einer kinetischen Leine — Wasserstoffbildung auf Zink kostet ~0,72 V Überspannung, und Gasbildung ist das, was passiert, wenn die Leine reißt"
"charging-fights-the-series.expect.predict.question" = "Die Daniell-Zelle bietet 1,104 V und verbraucht beim Entladen Zink. Was ist 'Laden' — das, was einen Akkumulator wiederaufladbar macht?"
"charging-fights-the-series.expect.predict.options" = ["Es mit Elektrizität wiederauffüllen, die es speichert wie ein Tank Treibstoff", "Mit einem äußeren Strom die eigene Reaktion der Zelle rückwärts laufen lassen, wodurch das beim Entladen verbrauchte Metall wieder aufgebaut wird", "Die verbrauchten Chemikalien durch frische ersetzen"]
"charging-fights-the-series.expect.predict.misconception" = "Eine Batterie speichert keine Elektrizität — sie speichert eine chemische Reaktion, startbereit gehalten. Beim Entladen läuft die Reaktion bergab durch den Draht; Laden ist eine äußere Quelle, die dieselbe Reaktion bergauf zwingt und das Anodenmetall Elektron für Elektron wieder aufbaut (193 C bauen hier 0,0010 mol Zink wieder auf, nach derselben Faraday-Arithmetik wie jede Elektrolyse). Das Tank-Bild versagt genau an dem Punkt, der zählt: Gespeichert wird eine chemische Anordnung, kein Stoff namens Elektrizität."
"charging-fights-the-series.expect.predict.diagnosis.0.reveals" = "Elektrizität als gespeicherte Flüssigkeit: Ladung geht hinein, schwappt herum, kommt wieder heraus — das älteste Modell der Elektrizität, und innerhalb einer Batterie ist es auf eine Weise falsch, die zählt."
"charging-fights-the-series.expect.predict.diagnosis.0.next" = "Wiege die Elektroden über einen Zyklus hinweg, statt dir den Tank vorzustellen: Entladen macht das Zink dünner, Laden lässt es wieder dicker werden — Materie bewegt sich, was kein Bild einer gespeicherten Flüssigkeit vorhersagt. Das Labor zeigt den Wiederaufbau direkt: 193 Coulomb hinein, 0,065 g Zink zurück auf dem Metall."
"charging-fights-the-series.expect.predict.diagnosis.1.reveals" = "Wiederaufladbare und Einwegbatterien unterscheiden sich hier nur im Wartungsregime: Irgendjemand, irgendwo, tauscht die Chemikalien aus — Regeneration durch Strom kommt in dieser Vorstellung nicht vor."
"charging-fights-the-series.expect.predict.diagnosis.1.next" = "Nichts gelangt in die Zelle außer Elektronen: Die 'frischen Chemikalien' sind die alten, zurückgeschoben den Hügel hinauf, den sie hinabgelaufen sind. Das ist der ganze Unterschied zu einer Primärzelle — die Chemie eines Akkumulators ist an Ort und Stelle umkehrbar, weshalb seine Elektroden auch tausendfachen Wiederaufbau überstehen müssen."
"charging-fights-the-series.registers.lv1" = "Schiebst du den Strom rückwärts, wächst frisches Zink auf dem Metall — und es bleibt dort, obwohl das saure Bad es liebend gern auffressen würde, weil das Bilden von Wasserstoffblasen auf Zink harte Arbeit ist. Diese Härte ist der Leibwächter der Batterie. Überwältigst du ihn mit zu viel Säure, verliert der Leibwächter: Sprudeln, und deine gespeicherte Ladung entweicht als Gas."
"charging-fights-the-series.registers.lv2" = "Entladen: Zn + Cu²⁺ → Zn²⁺ + Cu, bietet 1,104 V. Laden: Eine äußere Quelle treibt Zn²⁺ + 2e⁻ → Zn gegen die Spannungsreihe — 193 C = 0,0020 mol Elektronen bauen 0,0010 mol (0,0654 g) Zink wieder auf, während die inerte Anode das Bad auf pH 2,13 ansäuert. Und die Abscheidung hält: Ihre Auflösung würde erfordern, dass sich Wasserstoff auf Zink bildet, und das kostet ~0,72 V Überspannung gegenüber einer Triebkraft von nur +0,69 V. Gibt man starke Säure hinzu, ist die Barriere überwunden: Zn + 2 H⁺ → Zn²⁺ + H₂, 0,026 mol Gas, die Ladung rückgängig gemacht."
"charging-fights-the-series.registers.lv3" = "Das eigene Urteil des Labors ist die These dieses Eintrags, wörtlich: 'Zink sollte sich nach der Spannungsreihe in dieser Säure lösen (Triebkraft +0,69 V), aber Wasserstoff muss sich auf Zink bilden, und auf dieser Oberfläche kostet das eine Überspannung von etwa 0,72 V. Kinetisch blockiert auf der Zeitskala einer Unterrichtsstunde, nicht thermodynamisch inert — der Unterschied zwischen einem Labor und einer Batterie.' Diese 0,03 V Gnadenfrist sind der Grund, warum wiederaufladbare Zellen existieren — hier auf Zink, auf Blei in jeder Autobatterie — und Gasbildung bei Überladung ist genau das Reißen dieser Leine, im letzten Akt dieses Skripts mit molarer Säure inszeniert. Ehrlichkeit, in drei Punkten: Der übersteuerte Spielraum reicht nur um 0,07 V, weil die eigene Sulfat- und Chlorid-Speziation des Bades a(H⁺) unter eins hält (bei einem echten pH 0 wären es 0,04 V), und eine Geschwindigkeit so nahe an ihrer Barriere wird nicht berechnet — das Labor sagt 'es reagiert, langsam' und behauptet nicht mehr; die Überspannung selbst ist eine kuratierte kinetische Konstante, keine berechnete; und Zelle und Elektrolyse bleiben entkoppelt — nichts hier berechnet Entladung unter Last, Innenwiderstand oder Kapazität, sodass 'eine rückwärts laufende Zelle' eine Aussage über Halbreaktionen ist, keine über Laufzeitverhalten."
"lead-stands-in-its-own-acid.summary" = "Blei steht in der Spannungsreihe unter Wasserstoff, und doch stehen die Platten einer Autobatterie jahrelang in Säure — die Triebkraft von +0,13 V kann die ~0,88 V Überspannung des Wasserstoffs auf Blei nicht begleichen, und genau diese unbeglichene Rechnung ist die Existenzgrundlage der Batterie"
"lead-stands-in-its-own-acid.expect.predict.question" = "Eine Autobatterie besteht aus Bleiplatten, die jahrelang in starker Säure stehen. Blei steht in der Spannungsreihe unter Wasserstoff, also müsste die Säure es auflösen. Warum tut sie das nicht?"
"lead-stands-in-its-own-acid.expect.predict.options" = ["Die Spannungsreihe irrt sich einfach bei Blei", "Kinetik: Die Wasserstoffbildung an Blei kostet etwa 0,88 V Überspannung, weit mehr als die +0,13 V, die die Säure bietet — blockiert, nicht ausgeblieben", "Die Platten erhalten eine schützende Werksbeschichtung, die die Säure fernhält"]
"lead-stands-in-its-own-acid.expect.predict.misconception" = "Widerspricht eine Beobachtung einer Regel, liegt es nahe, entweder die Regel zu verwerfen oder einen Beschützer zu erfinden. Keines von beidem ist nötig: Die Spannungsreihe ist eine Gleichgewichtsaussage, und sie hat recht — Blei in Säure liegt bergab. Es liegt aber nur knapp bergab (+0,13 V), und das notwendige erste Produkt der Reaktion, Wasserstoffgas auf einer Bleioberfläche, verlangt einen Aktivierungszoll von ~0,88 V. Die Rechnung übersteigt das Budget, also ist die Reaktion auf jeder menschlichen Zeitskala blockiert. Die Batterie existiert genau in dieser Lücke."
"lead-stands-in-its-own-acid.expect.predict.diagnosis.0.reveals" = "Regeln sind richtig oder falsch, nie begrenzt gültig: Eine widersprechende Beobachtung, und die Spannungsreihe wird verworfen, statt zu fragen, was sie eigentlich behauptet."
"lead-stands-in-its-own-acid.expect.predict.diagnosis.0.next" = "Prüfe die Spannungsreihe dort, wo keine kinetische Sperre greift: v2 — Blei scheidet sich aus seinen eigenen Ionen auf Zink ab, 0,0100 mol, genau in der Richtung, die die Ordnung verlangt. Die Spannungsreihe hat recht damit, wo das Gleichgewicht liegt; sie hat nie behauptet, eine Uhr zu sein, und dieses Becherglaspaar ist der Unterschied."
"lead-stands-in-its-own-acid.expect.predict.diagnosis.1.reveals" = "Trägheit braucht einen Verursacher: 'Nichts passiert' muss durch etwas verursacht sein — eine Beschichtung, einen Zusatzstoff — statt durch eine Barriere im Mechanismus der Reaktion selbst."
"lead-stands-in-its-own-acid.expect.predict.diagnosis.1.next" = "Es wird keine Beschichtung modelliert und keine herangezogen: Die Barriere ist die Oberflächenchemie der H₂-Bildung auf Blei selbst, und das Labor nennt die Rechnung — +0,13 V angeboten, ~0,88 V verlangt. Anderthalb Jahrhunderte Blei-Säure-Batterien stehen auf dieser Lücke, nicht auf einem Fertigungsschritt."
"lead-stands-in-its-own-acid.registers.lv1" = "Eine Autobatterie ist Metall, das jahrelang in starker Säure steht. Die Säure würde das Blei liebend gern auffressen, aber Gasblasen auf Blei zu bilden ist so schwer, dass überhaupt nichts passiert. Die Batterie existiert genau wegen dieses Nichts."
"lead-stands-in-its-own-acid.registers.lv2" = "v1: Blei in Säure wird als inert gemeldet — Triebkraft +0,13 V gegenüber ~0,88 V Wasserstoff-Überspannung auf Blei; kein Gas, keine Auflösung, pH-Wert unverändert. v2: Dieselbe Spannungsreihe funktioniert weiterhin, wenn die Kinetik es zulässt — Zn steht unter Pb, sodass 0,0100 mol Blei sich auf dem sich auflösenden Zink abscheiden."
"lead-stands-in-its-own-acid.registers.lv3" = "Der Vergleich mit Zink ist die eigentliche Konstruktionslehre: Zinks Gnadenfrist beträgt 0,03 V (`charging-fights-the-series` lässt diese Leine mit molarer Säure reißen); Bleis Gnadenfrist beträgt ~0,75 V — der größte sichere Spielraum jedes billigen Metalls unter Wasserstoff, weshalb Blei hundertsechzig Jahre lang DAS Akkumulatormetall war. Ehrlichkeit: Die Überspannung ist eine kuratierte kinetische Konstante mit 'Zeitskala einer Unterrichtsstunde' als angegebenem Geltungsbereich, und das Urteil hier stützt sich allein darauf — echtes Blei in Schwefelsäure bildet zusätzlich einen Bleisulfat-Film, den dieses Labor nicht modelliert, sodass die echte Batterie sogar besser geschützt ist als dieses Becherglas."
"salt-holds-the-water-liquid.summary" = "Gelöste Teilchen senken den Gefrierpunkt: Bei gleicher Abkühlung beginnt Salzwasser erst bei etwa −4 °C zu gefrieren und bildet weniger Eis als reines Wasser"
"salt-holds-the-water-liquid.expect.predict.question" = "Zwei identische Bechergläser verlieren nebeneinander dieselbe Wärmemenge: Das eine enthält reines Wasser, im anderen ist ein großer Löffel Salz gelöst. Welchen Unterschied erwartest du?"
"salt-holds-the-water-liquid.expect.predict.options" = ["Beide, bei 0 °C — bei null zu gefrieren ist das, was Wasser tut", "Das salzige zuerst — Salzwasser ist dickflüssiger, und dickflüssiger ist näher am Festen", "Das reine beginnt bei 0 °C; die Sole beginnt bei etwa −4 °C und bildet deshalb bei derselben Abkühlung weniger Eis"]
"salt-holds-the-water-liquid.expect.predict.misconception" = "Die erste Antwort macht den Gefrierpunkt zu einer festen Eigenschaft des Lösungsmittels, wobei das gelöste Salz nur als Ladung mitfährt, die nichts verändert. Tatsächlich ist der Gefrierpunkt eine Eigenschaft der Lösung: Die Ionen behindern die Wassermoleküle dabei, sich zu einem Eiskristallgitter zu ordnen, sodass die Sole kälter werden muss, bevor sich das Gefrieren lohnt. Dieselbe entzogene Energiemenge bildet in der Sole folglich weniger Eis. Die Antwort 'dickflüssiger' vermengt Viskosität und Festigkeit: Wie flüssig ein Stoff fließt und ob sich seine Moleküle zu einem Kristall verbinden können, sind unterschiedliche Fragen — die hier sogar entgegengesetzte Antworten haben."
"salt-holds-the-water-liquid.expect.predict.diagnosis.0.reveals" = "Der Gefrierpunkt gehört allein dem Lösungsmittel — was darin gelöst ist, fährt nur als Ladung mit, ohne Stimme."
"salt-holds-the-water-liquid.expect.predict.diagnosis.0.next" = "Man zählt die Stimmen der Ladung: etwa 1,86 °C Verzögerung pro Mol gelöster Teilchen pro Kilogramm Wasser, und Salz zerfällt größtenteils in zwei Ionen — 0,1 mol NaCl in 100 g Wasser ergeben also rund 2 mol/kg Teilchen. Die Labor liest die tatsächliche Teilchenzahl aus der gelösten Speziation ab und lässt die Sole erst bei etwa −4 °C zu gefrieren beginnen — deshalb wird Streusalz in Graden dosiert."
"salt-holds-the-water-liquid.expect.predict.diagnosis.1.reveals" = "Dickflüssigkeit als Nähe zum Festen: Eine schwerere, salzigere Flüssigkeit fühlt sich schon halb gefroren an, also müsste sie zuerst fertig gefrieren."
"salt-holds-the-water-liquid.expect.predict.diagnosis.1.next" = "Trenne die beiden Vorstellungen: Fließverhalten betrifft, wie Moleküle aneinander vorbeigleiten; Gefrieren betrifft, ob sie sich zu einem Kristallgitter einrasten können. Die gelösten Ionen behindern das Gitter, sodass mehr Salz bedeutet, dass das Becherglas länger durchhält, nicht kürzer — je salziger die Lösung, desto kälter muss es werden, bevor sich das Gefrieren lohnt."
"salt-holds-the-water-liquid.registers.lv1" = "Das reine Wasser beginnt bei null Grad zu gefrieren. Das Salzwasser hält bis etwa vier Grad unter null durch, deshalb entsteht bei gleicher Abkühlung dort weniger Eis — das Salz steht der Eisbildung im Weg. Das ist das Geheimnis hinter dem Streuen von Salz auf vereisten Straßen."
"salt-holds-the-water-liquid.registers.lv2" = "Gefrierpunktserniedrigung: ΔT ≈ 1,86 K·kg/mol × Molalität der gelösten Teilchen. 0,1 mol NaCl in 100 g Wasser entsprechen 1,0 mol/kg Salz, aber rund 2,0 mol/kg gelösten Teilchen, sodass die Sole etwa 4 K unter reinem Wasser zu gefrieren beginnt. Während reines Eis entsteht, bleibt das Salz in der Restflüssigkeit; die Labor löst diese konzentriertere Sole und ihren niedrigeren Liquidus neu."
"salt-holds-the-water-liquid.registers.lv3" = "Die Erniedrigung wird aus der gelösten Speziation berechnet — derselben Teilchenzählung, die auch `particles` zieht — statt aus einem ganzzahligen van-'t-Hoff-Faktor. Es gefriert nur so viel Wasser, wie die entzogenen 15 kJ decken können, wobei die latente Wärme mitgerechnet wird, und das Inventar führt flüssiges Wasser und reines Eis nebeneinander. Jeder Eistransfer macht die alten Molalitäten ungültig, sodass PHREEQC das kleiner gewordene flüssige Kompartiment neu speziiert und der Phasendurchlauf sich einer gemeinsamen Temperatur/einem gemeinsamen Liquidus annähert. Unterhalb der festgelegten Modellgrenze von 252 K wären Salzfeststoffe und ein stoffspezifisches eutektisches Phasendiagramm erforderlich; die Labor stoppt, statt die verdünnte kolligative Beziehung zu extrapolieren."
