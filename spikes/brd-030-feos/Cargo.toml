[package]
name = "brd030-feos-spike"
version = "0.0.0"
edition = "2021"
publish = false
license = "AGPL-3.0-or-later"

# Its own workspace root on purpose: this spike is deliberately NOT a member
# of the kerotakis workspace, so nothing here can reach production builds,
# lockfiles or dependency audits. BRD-030 is a decision gate, not a delivery.
[workspace]
members = ["wasm-probe-feos", "wasm-probe-base"]

[lib]
name = "brd030_feos_spike"
path = "src/lib.rs"

[[bin]]
name = "brd030-feos-spike"
path = "src/main.rs"

[dependencies]
feos = { version = "0.10.1", default-features = false, features = ["pcsaft"] }
feos-core = "0.10.1"
quantity = "0.14"
nalgebra = "0.35"
serde_json = "1"
kerotakis-thermo = { path = "../../crates/kerotakis-thermo" }

[profile.release]
# Byte-for-byte the kerotakis workspace's release profile, so the compile
# times and artefact sizes in the report are comparable to the ones the
# project already measures (and so `tools/build-web.sh`'s `wasm-opt -Oz`
# pass lands on the same input it would in a real bundle).
lto = "thin"
codegen-units = 1
strip = "debuginfo"
