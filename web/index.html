<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kerotakis — a bench in the browser</title>
<style>
  :root {
    --bg: #14120f; --panel: #1c1a16; --edge: #322e27;
    --ink: #e8e2d6; --dim: #9a9déf; --dim: #948c7d;
    --hot: #d98a4a; --cool: #6fa8c7; --good: #86b06a; --warn: #c9a227;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: .7rem 1rem; border-bottom: 1px solid var(--edge);
    display: flex; gap: 1rem; align-items: baseline; flex-wrap: wrap;
  }
  h1 { font-size: 1rem; margin: 0; font-weight: 600; letter-spacing: .02em; }
  h1 small { color: var(--dim); font-weight: 400; margin-left: .5rem; }
  #status { margin-left: auto; font-size: .8rem; }
  .live { color: var(--good); } .cached { color: var(--warn); }
  main { display: flex; flex: 1; min-height: 0; }
  #transcript {
    flex: 1; overflow-y: auto; padding: 1rem; white-space: pre-wrap;
    word-break: break-word;
  }
  #side {
    width: 22rem; border-left: 1px solid var(--edge); padding: 1rem;
    overflow-y: auto; background: var(--panel); font-size: .85rem;
  }
  #side h2 { font-size: .8rem; color: var(--dim); margin: 1.2rem 0 .4rem; font-weight: 600; }
  #side h2:first-child { margin-top: 0; }
  #side button {
    display: block; width: 100%; text-align: left; margin: .2rem 0;
    background: #26231d; color: var(--ink); border: 1px solid var(--edge);
    padding: .35rem .5rem; border-radius: 4px; cursor: pointer;
    font: inherit; font-size: .8rem;
  }
  #side button:hover { border-color: var(--hot); }
  form { display: flex; border-top: 1px solid var(--edge); }
  #prompt { color: var(--hot); padding: .7rem .3rem .7rem 1rem; }
  input[type=text] {
    flex: 1; background: none; border: 0; color: var(--ink);
    font: inherit; padding: .7rem 1rem .7rem 0; outline: none;
  }
  .echo { color: var(--hot); }
  .err { color: #d2694f; }
  .note { color: var(--dim); }
  .particles { font-size: 1.05rem; line-height: 1.4; }
  a { color: var(--cool); }
</style>
</head>
<body>
<header>
  <h1>Kerotakis <small>a chemistry bench that computes, in your browser</small></h1>
  <span id="status">starting…</span>
</header>
<main>
  <div id="transcript"></div>
  <aside id="side">
    <h2>Try these</h2>
    <button data-run="reset&#10;add v1 water 200mL&#10;add v1 NaCl 0.1mol&#10;add v1 AgNO3 0.01mol&#10;look v1&#10;particles v1">Silver meets salt</button>
    <button data-run="reset&#10;add v1 water 100mL&#10;add v1 CuSO4 0.01mol&#10;add v1 NaOH 0.02mol&#10;look v1&#10;heat v1 20kJ&#10;look v1">Blue gel, then black</button>
    <button data-run="reset&#10;add v1 water 100mL&#10;add v1 Na2S2O3 0.79g&#10;add v1 HCl 0.002mol&#10;new&#10;add v2 water 100mL&#10;add v2 Na2S2O3 0.79g&#10;add v2 HCl 0.002mol&#10;heat v2 8kJ&#10;wait 20s&#10;look v1&#10;look v2">Rates: two beakers, one clock</button>
    <button data-run="reset&#10;add v1 water 100mL&#10;add v1 H2O2 0.1mol&#10;add v1 MnO2 0.5g&#10;wait 90s&#10;look v1">Catalysis</button>
    <button data-run="reset&#10;add v1 water 100mL&#10;cool v1 40kJ&#10;inspect v1">Freeze it</button>
    <button data-run="reset&#10;add v1 water 1cup&#10;add v1 KMnO4 1pinch&#10;look v1">Permanganate</button>
    <h2>Detail</h2>
    <button data-cmd="register lv1">lv1 — what you see</button>
    <button data-cmd="register lv2">lv2 — equations and amounts</button>
    <button data-cmd="register lv3">lv3 — everything</button>
    <h2>Also</h2>
    <button data-cmd="inspect v1">inspect v1</button>
    <button data-cmd="particles v1">particles v1</button>
    <button data-cmd="help">help</button>
    <button data-cmd="reset">reset the bench</button>
    <h2 style="margin-top:1.6rem">Source</h2>
    <p class="note" style="margin:0">
      <a href="https://github.com/CrispStrobe/kerotakis">github.com/CrispStrobe/kerotakis</a><br>
      AGPL-3.0-or-later. Aqueous chemistry by
      <a href="https://www.usgs.gov/software/phreeqc-version-3">PHREEQC</a> (USGS).
    </p>
  </aside>
</main>
<form id="line">
  <span id="prompt">kero&gt;</span>
  <input type="text" id="input" autocomplete="off" autocapitalize="off"
         spellcheck="false" placeholder="add v1 water 100mL" autofocus>
</form>

<script type="module">
import init, { Lab } from "./kerotakis_wasm.js";
import { openLab } from "./kerotakis.mjs";

const out = document.getElementById("transcript");
const statusEl = document.getElementById("status");
const input = document.getElementById("input");

const write = (text, cls) => {
  const div = document.createElement("div");
  if (cls) div.className = cls;
  div.textContent = text;
  out.appendChild(div);
  out.scrollTop = out.scrollHeight;
};

const HELP = `Commands are the same .lab grammar the desktop tool reads.

  add v1 water 100mL        put something in a vessel
  add v1 NaCl 0.1mol        …by moles, grams, mL, or a spoon/pinch/cup
  heat v1 8kJ / cool v1 4kJ
  wait 30s                  let time pass — every vessel advances together
  ignite v1                 hold a flame to it
  stir v1 / filter v1 v2 / decant v1 v2 0.5 / evaporate v1 0.5
  new                       another vessel
  look v1                   what the eye reports
  particles v1              the submicroscopic view, drawn at solved ratios
  inspect v1                the full state
  register lv1|lv2|lv3      how much detail
  species                   what is on the shelf
  reset                     start over`;

let lab;

async function boot() {
  await init();
  // The Emscripten engine is optional: without it the bench answers only
  // from shipped results and says so, which is the honest version rather
  // than a broken one.
  let createIPhreeqc = null;
  try {
    createIPhreeqc = (await import("./iphreeqc.mjs")).default;
  } catch (e) {
    createIPhreeqc = null;
  }
  try {
    lab = await openLab(Lab, {
      createIPhreeqc,
      loadDatabase: async (file) => {
        const r = await fetch(`./db/${file}`);
        if (!r.ok) throw new Error(`${file}: ${r.status}`);
        // The databases are Latin-1: pitzer.dat has degree signs that are
        // not valid UTF-8, and decoding them as UTF-8 corrupts the file.
        const bytes = new Uint8Array(await r.arrayBuffer());
        return new TextDecoder("windows-1252").decode(bytes);
      },
    });
  } catch (e) {
    write(`the aqueous engine did not start: ${e.message}`, "err");
    lab = new Lab();
  }

  if (lab.canSolve()) {
    statusEl.textContent = "● solving live (PHREEQC in wasm)";
    statusEl.className = "live";
  } else {
    statusEl.textContent = "● shipped results only";
    statusEl.className = "cached";
  }

  write("Kerotakis — a virtual chemistry laboratory that computes real chemistry.");
  write(
    lab.canSolve()
      ? "The aqueous engine is running in this tab. Nothing below is a lookup table.\n"
      : "Running without the aqueous engine: anything nobody pre-computed will be reported as a stated miss rather than guessed at.\n",
    "note",
  );
  write("Type a command, or pick one from the right. `help` lists them.\n", "note");

  // A shareable bench: everything after `#run=` is run on load, with `;`
  // between commands. Makes a link to a specific experiment possible, and
  // makes the page testable without a human clicking anything.
  const hash = decodeURIComponent(location.hash.replace(/^#run=/, ""));
  if (hash && location.hash.startsWith("#run=")) {
    for (const line of hash.split(";")) runOne(line);
  }
}

function runOne(line) {
  const trimmed = line.trim();
  if (!trimmed || trimmed.startsWith("#")) return;
  write(`kero> ${trimmed}`, "echo");

  if (trimmed === "help") return write(HELP, "note");
  if (trimmed === "reset") {
    lab.reset();
    return write("  the bench is clean again.", "note");
  }
  if (trimmed === "species") {
    const list = JSON.parse(lab.species());
    return write(list.map((s) => `  ${s.key.padEnd(10)} ${s.name}`).join("\n"));
  }

  const vesselArg = (s) => {
    const m = s.match(/v(\d+)/);
    return m ? Number(m[1]) - 1 : 0;
  };
  try {
    if (trimmed.startsWith("particles") || trimmed.startsWith("zoom")) {
      const doc = JSON.parse(lab.particles(vesselArg(trimmed)));
      return write(doc.rendered || "  (nothing to draw)", "particles");
    }
    if (trimmed.startsWith("inspect")) {
      const state = JSON.parse(lab.state());
      return write(JSON.stringify(state.vessels, null, 1));
    }
    const doc = JSON.parse(lab.runScript(trimmed + "\n"));
    const lines = (doc.steps ?? []).flatMap((s) => s.rendered ?? []);
    if (lines.length) return write(lines.map((l) => "  " + l).join("\n"));
    // `register` is consumed by the script runner and produces no events;
    // reporting that as "nothing happened" made a successful command look
    // like a failed one.
    if (trimmed.startsWith("register ")) {
      return write(`  detail is now ${trimmed.slice(9).trim()}.`, "note");
    }
    write("  (nothing happened)");
  } catch (e) {
    write(`  ${e.message ?? e}`, "err");
  }
}

document.getElementById("line").addEventListener("submit", (e) => {
  e.preventDefault();
  const line = input.value;
  input.value = "";
  runOne(line);
});

document.getElementById("side").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  const script = b.dataset.run ?? b.dataset.cmd;
  if (!script) return;
  for (const line of script.split("\n")) runOne(line);
  input.focus();
});

boot();
</script>
</body>
</html>
