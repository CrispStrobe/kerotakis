# Common stocks. Exactly one of `percent` (w/w) or `molar` (mol/L).
# `common = true` marks the default concentration the shelf offers at
# lv1/lv2 for that solute; the pure compound stays available at lv3. A
# common stock is also its own shelf bottle at lv1/lv2, labelled `name`
# (translated by that English text in the web locales).
[[stock]]
key = "hydrochloric_acid_37_percent"
