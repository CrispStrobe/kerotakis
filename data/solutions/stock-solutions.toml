# Aqueous stock solutions: density tables and the common laboratory stocks.
#
# Densities are g/mL of the SOLUTION at 20 °C against the solute MASS
# FRACTION. The parser interpolates linearly between points and refuses
# outside a table's range; it never extrapolates.
#
# REVIEW STATUS (2026-11-09): every table carries its own `review` line naming
# the public reproduction it was checked against and the precision of that
# check. The CRC section itself is not openly published; rows a reproduction
# could not confirm are listed as unverified, never silently passed.

[[source]]
id = "crc-concentrative-properties"
citation = "Haynes, W. M. (ed.), CRC Handbook of Chemistry and Physics, 97th ed., CRC Press, 2016, Section 5: Concentrative Properties of Aqueous Solutions: Density, Refractive Index, Freezing Point Depression, and Viscosity (density column, 20 °C)"
review = "partially checked 2026-11-09 against open reproductions, per table below; the 4-decimal CRC rows themselves were not available to compare"

[[source]]
id = "crc-water-density"
citation = "Haynes, W. M. (ed.), CRC Handbook of Chemistry and Physics, 97th ed., CRC Press, 2016, Section 6: Properties of Water in the Range 0-100 °C (0.99820 g/mL at 20 °C)"
review = "consistent 2026-11-09 with the widely reproduced IAPWS-95 value 0.998207 g/mL at 20 °C (not re-fetched)"

[[density]]
species = "HCl"
source = "crc-concentrative-properties"
review = "checked 2026-11-09 to 3 decimals: Wikipedia, Hydrochloric acid, Physical properties table (kg/L at 20 °C: 10 % 1.048, 20 % 1.098, 30 % 1.149, 32 % 1.159, 34 % 1.169, 36 % 1.179, 38 % 1.189); tabulated and interpolated values agree. Rows below 10 % and 40 % unverified"
