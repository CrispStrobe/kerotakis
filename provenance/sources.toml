[[source]]
id = "syngas-co-h2-mechanisms"
name = "CO/H2 syngas mechanisms (Davis 2005; Li 2007 / Burke 2012)"
kind = "data"
lane = "oracle-only"
decision = "rejected-runtime-data"
licence = "NOASSERTION"
origin = "https://web.stanford.edu/group/haiwanglab/USC%20Mech%20II/Mechanisms/H2-CO/mech.txt"
terms = "https://web.stanford.edu/group/haiwanglab/USC%20Mech%20II/Mechanisms/H2-CO/mech.txt"
copyright = "Davis, Joshi, Wang, Egolfopoulos; Burke, Chaos, Ju, Dryer, Klippenstein / Princeton University"
retrieved = "2026-08-29"
attribution = "Davis, Joshi, Wang, Egolfopoulos, Proc. Combust. Inst. 30 (2005) 1283-1292, doi:10.1016/j.proci.2004.08.252"
reviewer = "BRD-040 audit"
notes = "Citation request only, no licence. The Davis original host (ignis.usc.edu) is defunct and only a Stanford mirror survives. The Princeton pages now return 403; the circulating Burke file carries an express '(c) ... Princeton University, 2011' with no grant, making it the weakest chain of title in the audited set. A third-party GitHub collection re-licenses several of these as MIT without evident standing; that is not a usable channel."

