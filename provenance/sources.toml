# Scope, twice re-litigated on 2026-08-23 and twice resolved the same way:
# first-party curated constants (the Antoine sets in vle.rs) carry their
# provenance per-value in the code's `source` fields; crates.io
# dependencies (chematic, contour, ...) are governed by deny.toml and
# about.toml; the vendored IUPAC InChI gets its entry when the vendor
# directory holds actual sources with checksums rather than a scaffold.
# Entries for any of these that cannot pass this file's own lint do not
# ship half-finished.
