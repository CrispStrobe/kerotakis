[[source]]
id = "ebi-chebi-identity-slice"
name = "ChEBI identity and ontology slice (release 253)"
kind = "data"
lane = "runtime-data"
decision = "review-required"
licence = "CC-BY-4.0"
origin = "https://ftp.ebi.ac.uk/pub/databases/chebi/archive/rel253/flat_files"
terms = "https://ftp.ebi.ac.uk/pub/databases/chebi/archive/rel253/flat_files/LICENSE"
copyright = "EMBL-EBI and the ChEBI curation team"
retrieved = "2026-08-29"
attribution = "Chemical Entities of Biological Interest (ChEBI), EMBL-EBI; release 253; https://www.ebi.ac.uk/chebi; licensed CC BY 4.0"
paths = ["crates/kerotakis-data/tests/fixtures/quarantine/chebi-v1"]
allowed_outputs = ["quarantine-candidate", "embedded-runtime-database"]
targets = ["native", "web", "ios", "android"]
reviewer = "Kerotakis engineering policy audit (BRD-011)"
notes = """
BRD-011. Pinned to ChEBI release 253 (dated 2026-07-07), taken from the \
immutable per-release archive rather than the rolling current/ directory, so \
the snapshot is reproducible. Only a curated subset of 87 reviewed three-star \
entities is committed, not a ChEBI extract of any size: the tables read are \
compounds, names, chemical_data, structures, relation and relation_type, and \
the committed artifact is a single JSON snapshot whose checksum is pinned \
below and in the adapter's manifest.

DECISION IS review-required, NOT approved. Promotion of any ChEBI field past \
the candidate lane is blocked until the licence discrepancy below is resolved \
by the repository owner or by an upstream clarification from EMBL-EBI. This \
record documents an ingestion path and a pinned fixture; it does not clear \
ChEBI for a shipped pack.

LICENCE DISCREPANCY, flagged for licence review rather than decided in code: \
the README in ChEBI's flat_files directory calls the terms "CC \
Attribution-ShareAlike 4.0 International" and then says "see LICENSE file". \
The LICENSE file beside it is the verbatim text of CC BY 4.0 and contains no \
ShareAlike condition anywhere (the flat_files and ontology copies are \
byte-identical, sha256 e1d6ea57...). The `licence` field above records \
CC-BY-4.0 because that is the licence text ChEBI actually ships, not because \
this record resolves the contradiction — it does not, and it is not ours to \
resolve. Which reading governs decides whether ChEBI may ship at all: \
ROADMAP-Webapp.md's 2026-08-23 decision keeps CC BY-SA material out of store \
builds entirely, so the README's prose name, read literally, would exclude \
ChEBI from the runtime lane. The question goes to the repository owner or to \
an upstream clarification from EMBL-EBI. Until then the decision stays \
review-required. If the answer is ShareAlike, this record and the adapter's \
CHEBI_LICENCE constant are the two places to change, and the quarantine lint \
refuses promotion on its own thereafter.

Nothing from this source is in the runtime registry. The adapter \
(crates/kerotakis-data/src/chebi.rs) stops at BRD-003 quarantine; the \
committed artifact is a pinned test fixture. Per-record CC BY attribution \
travels as an ordinary promotable candidate field so it survives into a \
compiled pack manifest rather than living only in a build script. ChEBI \
ontology roles may seed search tags only — the adapter's role firewall refuses \
any policy that aims them at a safety or reactivity target.
"""

