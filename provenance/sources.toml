# ---------------------------------------------------------------------------
# BRD-040 — Cantera mechanism and API audit (2026-08-29).
#
# These records document a REFUSAL, not an approval. No file named below is in
# the tree; each was inspected outside the repository and rejected for the
# runtime-data lane because its own provenance carries no redistribution grant.
# The full reasoning is in provenance/brd-040-cantera-audit.md. Every entry
# remains usable as an oracle: running a mechanism outside the repository to
# check a Kerotakis answer distributes nothing.
# ---------------------------------------------------------------------------

[[source]]
id = "cantera-code"
name = "Cantera"
kind = "code"
lane = "oracle-only"
decision = "not-required"
licence = "BSD-3-Clause"
origin = "https://github.com/Cantera/cantera"
terms = "https://github.com/Cantera/cantera/blob/main/License.txt"
copyright = "2001-2009 California Institute of Technology; 2009 Sandia Corporation; 2011-2026 Cantera Developers"
retrieved = "2026-08-29"
attribution = "Cantera, BSD-3-Clause"
reviewer = "BRD-040 audit"
notes = "The BSD-3-Clause code would pass the direct-inclusion allowlist, but runtime inclusion is unnecessary: the portable Kerotakis mechanism front end plus diffsol covers every BRD-041 need (see the C-API gap list in provenance/brd-040-cantera-audit.md). Kept as a differential oracle. BRD-042 remains parked."

[[source]]
id = "cantera-shipped-mechanism-data"
name = "Mechanism files distributed with Cantera (gri30.yaml, h2o2.yaml, air.yaml, nDodecane_Reitz.yaml, cantera-example-data)"
kind = "data"
lane = "oracle-only"
decision = "rejected-runtime-data"
licence = "NOASSERTION"
origin = "https://github.com/Cantera/cantera/tree/main/data"
terms = "https://github.com/Cantera/cantera/blob/main/data/README.md"
copyright = "various third-party mechanism authors; not the Cantera project"
retrieved = "2026-08-29"
attribution = "cite the original mechanism paper, per upstream instruction"
reviewer = "BRD-040 audit"
notes = "Cantera's BSD-3-Clause licence covers the software only. The cantera-example-data repository states that the project 'is not the original author of the reaction mechanisms included in this repository and is not claiming to grant a license to them'; data/README.md states that input files are 'provided for illustration purposes only'. There is no licence file in the example-data repository. This record corrects PLAN.md's earlier claim that these files are part of the BSD-3 distribution and freely redistributable."

[[source]]
id = "gri-mech-30"
name = "GRI-Mech 3.0"
kind = "data"
lane = "oracle-only"
decision = "rejected-runtime-data"
licence = "NOASSERTION"
origin = "http://combustion.berkeley.edu/gri-mech/"
terms = "http://combustion.berkeley.edu/gri-mech/version30/files30/readme30.dat"
copyright = "UC Berkeley, Stanford University, UT Austin and SRI International; sponsored by the Gas Research Institute (1999)"
retrieved = "2026-08-29"
attribution = "Smith, Golden, Frenklach et al., GRI-Mech 3.0, http://www.me.berkeley.edu/gri_mech/"
reviewer = "BRD-040 audit"
notes = "No formal licence exists. readme30.dat carries a warranty and liability disclaimer; the overview page adds an informal 'you are welcome to make whatever use you like of this information' sentence scoped to the web documentation. A disclaimer is not a redistribution grant. Cantera's h2o2.yaml is a GRI-Mech 3.0 derivative and inherits this status. The Gas Research Institute merged into GTI Energy in 2000; no successor licence statement was found."

[[source]]
id = "oconaire-hydrogen-2004"
name = "Ó Conaire et al. hydrogen oxidation mechanism (2004)"
kind = "data"
lane = "oracle-only"
decision = "rejected-runtime-data"
licence = "NOASSERTION"
origin = "https://c3.universityofgalway.ie/combustionchemistrycentre/mechanismdownloads/"
terms = "https://www.llnl.gov/disclaimer"
copyright = "NUI Galway Combustion Chemistry Centre and Lawrence Livermore National Laboratory"
retrieved = "2026-08-29"
attribution = "M. Ó Conaire, H.J. Curran, J.M. Simmie, W.J. Pitz, C.K. Westbrook, Int. J. Chem. Kinet. 36 (2004) 603-622, doi:10.1002/kin.20036"
reviewer = "BRD-040 audit"
notes = "Neither host page nor file carries a licence. The LLNL release stamp (UCRL-WEB-208393) is a public-release approval, not a licence; LLNL's disclaimer states that 'Permission to reproduce may be required'. University of Galway's site-wide terms permit personal non-commercial download only."

[[source]]
id = "boivin-reduced-hydrogen"
