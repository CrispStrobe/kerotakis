# Release provenance for external scientific code and data.
#
# This first inventory deliberately covers the vendored scientific runtime
# inputs. Cargo packages, project-owned code/content, lessons, media, and
# generated assets are the next inventory increment (ROADMAP-Webapp.md,
# LIC-004). A record here approves only the named version, paths, outputs, and
# targets; it is not a blanket approval of an upstream project.

schema = 1
policy = "store-permissive-v1"
scope = "Vendored external scientific runtime code and data"

[[source]]
id = "usgs-iphreeqc-code"
name = "Kerotakis IPhreeqc fork"
kind = "code"
lane = "runtime-code"
decision = "approved"
licence = "LicenseRef-USGS-User-Rights-Notice"
origin = "https://github.com/CrispStrobe/iphreeqc"
terms = "vendor/iphreeqc/doc/NOTICE"
copyright = "United States Geological Survey and identified bundled contributors"
