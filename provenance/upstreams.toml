note = "CHECKED 2026-09-15 AND NOT READ: wiley.com returns HTTP 403 to an automated request for the title page and for /en-us/permissions alike, exactly as the CRC publisher page does. No terms were read; this verdict rests on the absence of any granted licence and on the work being a paid commercial textbook (D. Voet and J. G. Voet, Biochemistry, 4th ed., John Wiley and Sons), not on a reading. SAME CLASS AS crc-handbook AND merck-index and judged the same way, because a verdict is a property of the source's terms: making it a property of how often we happen to cite the book would mean this table said different things about one work on different days. THIS ROW ADDS EXACTLY ONE FINDING AND THE CENSUS PREDICTED IT, 59 to 60. It is a true positive rather than the count getting worse because the data got more legible. The `avoid` text carves out 'naming one of these for one value, with author, title, edition and page' as ordinary practice; `legacy/amylase` reads 'Alpha-amylase MW ~55 kDa (typical); Voet & Voet Biochemistry 4th ed.' - no page, and 'typical' by its own word, which is a rounded generality rather than a cited measurement. It is the same shape as the CRC rows that admitted 'the printed edition was not opened for this row'. THE VOCABULARY WAS MISSING A VERDICT AND THIS IS WHERE IT SHOWED; it was added on 2026-09-15 and this row does not move. `avoid` is still a source-level flag, but a `[[citation]]` row can now say what one citation is DOING with the work - `mentioned`, `via` or `claims` - and an attributed `claims` with a `locator` on a work refused for BULK is not a finding. This citation qualifies for none of it: it carries no page, so it is not attribution, and `avoid` plus no locator is a finding under the new rule exactly as under the old one. That is the instrument agreeing with the row's own words rather than the instrument being unable to tell. What HAS changed is that a citation carrying author, title, edition and page would no longer fail identically to this one, which was the defect. The honest reading of this finding is unchanged: the number wants a page or a paper, which it does."


# ------------------- added 2026-09-17, the conductivity source trace ---------
#
# Four rows and one journal spelling, added because the const-table mutation
# pass of 2026-09-16 found that 23 of the 28 λ° values in
# `crates/kerotakis-core/src/conductivity.rs` could each be moved 25 % without
# a single assertion in the tree noticing. The repair the owner asked for was
# not 23 pins but "check the values against sources, and add one test that
# covers the class", so the values were traced and the sources are here.
#
# WHAT WAS READ, ON 2026-09-17, AND WHAT WAS NOT. Read in full: OIML R 56
# (1981), five pages, as the PDF oiml.org serves; USGS Water-Supply Paper 2311
# (1988), whose scanned text extracts cleanly. Read at one remove: the
# Sartorius handbook, through the German Wikipedia article that reproduces its
# table — the handbook itself was not opened, and the citation says so with a
# `via` role below. NOT REACHED AT ALL, and recorded so the gap is a fact
# rather than a silence: Vanýsek's table in the CRC Handbook, which is the
# source the shipped table names and which `crc-handbook` refuses as a
# systematic source; Robinson and Stokes' Electrolyte Solutions; and the
# Jones-Bradshaw and Shedlovsky papers themselves, which are behind the ACS
# paywall that `acs-education` already records as unreachable from here. Seven
# ions — Zn(2+), Fe(2+), Fe(3+), Al(3+), Mn(2+), Pb(2+), MnO4(-) — therefore
# have NO second source in this repository at all, and
# `crates/kerotakis-core/tests/conductivity_sources.rs` lists them by name so
# that resting on one compilation is a maintained fact.

