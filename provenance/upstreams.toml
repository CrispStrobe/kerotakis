note = "Read 2026-09-15: content on the FAO website 'is protected by copyright' but most of it 'may be copied, printed and downloaded for private study, research and teaching purposes, and for use in non-commercial products or services' with attribution, while 'translation and adaptation rights, and for resale and other commercial use rights' require a licence request to licensing@fao.org. Statistical databases are governed separately by FAO's Open Data Licensing Policy, which is not what is cited here. THE SAME SHAPE AS THE ciaaw ROW and judged the same way: a real grant, covering teaching, stopping at commercial use, with the commercial question unasked. It is cited once, in `kerotakis/material-recipes-v1`, for the balanced hexose-to-ethanol-and-carbon-dioxide equation - which is Gay-Lussac's from 1815 and is a fact rather than FAO's expression of one, so the Feist argument that no grant is needed at all is stronger here than anywhere else in this batch. That argument is precisely why the verdict is `decision-required` and not `avoid`: the question is open, not answered against us. The anchoring earns its keep on this row - an unanchored 'FAO' matches the InChIKey suffix UHFFFAOYSA, which appears in dozens of identity citations, and would have cleared them all. AMENDED 2026-09-16, BECAUSE THE WORD 'FERMENTATION' NOW APPEARS IN THAT REGISTRY WITH A RATE ATTACHED TO IT AND THIS ROW MUST NOT BE READ AS COVERING IT. What FAO is cited for is the balanced equation and nothing else. The four fermentation cultures in `kerotakis/material-recipes-v1` each carry a `reference_rate_per_second_per_gram_per_litre`, and NO SOURCE IS CLAIMED FOR ANY OF THEM: their own `lot_assumptions` call them editorial classroom timescales, their recipes are `confidence = surrogate`, and their evidence is `kerotakis/material-recipes-v1` with `method.kind = editorial`. The unit changed that day - the engine's rate stopped reading the grams of culture and started reading their concentration against a declared one-litre reference volume - and the numeric values were carried across UNCHANGED rather than converted, because there is no source unit to convert from. That is recorded here so the next reader does not reconstruct an FAO provenance for a number FAO never supplied. AMENDED AGAIN THE SAME DAY, AND THE PARAGRAPH ABOVE IS NOW HALF TRUE. Two of the four rates were fitted to published fermentations that afternoon and now carry a source of their own - `kerotakis/fermentation-rate-calibration-v1`, resting on Kim, Oh and Imm 2018, Jankowska et al. 2026 and Pagliardini et al. 2013, all under `primary-literature` and all cited by DOI. The other two, acetic and heterolactic, are the lactic fit carried across with no measurement of their own and remain editorial. WHAT DOES NOT CHANGE IS THE THING THIS AMENDMENT WAS WRITTEN FOR: none of it is FAO's. FAO is cited for the balanced hexose-to-ethanol-and-carbon-dioxide equation and for nothing else, and a reader who meets the word 'fermentation' in that registry beside a rate must still not read an FAO provenance into it. The rates' own provenance is now a field, `MaterialRole::FermentationCulture::rate_evidence`, which names its source and says 'derived' for the two that were fitted and 'editorial' for the two that were not."

