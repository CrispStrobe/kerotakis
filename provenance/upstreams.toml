# The two rows below are NOT in PLAN.md's table. They were found by pointing
# the lint at the repository rather than at the table, and between them they
# are cited by more values than every audited row put together. Both are
# commercial reference works that grant no reuse licence, which puts them in
# the same class as the NIST SRD row - but that is an inference from their
# front matter, not a terms page anybody read for this file, so `retrieved` is
# deliberately empty and the PR proposes them rather than asserting them.

