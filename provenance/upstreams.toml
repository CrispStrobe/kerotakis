WOULD SETTLE IT: a copy of the handbook, or - better, because it would replace rather than confirm the route - any compilation that carries these five ions and is not the CRC Handbook. The two that were tried and do not carry them are USGS Water-Supply Paper 2311 and the English Wikipedia's Adamson-sourced table. ANSWERED IN PART ON 2026-09-18, AND NOT IN THIS ROW'S FAVOUR. A compilation that is not the CRC Handbook and DOES carry all five was found - `kreshkov-analiticheskaya-khimiya` below - and it agrees with three of them (silver 61.9, barium 63.6, carbonate 69.3) and disagrees with two: copper(II) 113.2 against the 107.2 this handbook gives, and perchlorate 64.5 against 67.4. So the route to these five is no longer the only one, and the second route contradicts it on two ions out of five. That is recorded rather than acted on: the new source is itself measured, in `crates/kerotakis-core/tests/conductivity_sources.rs` section 2b, to be wrong by several per cent on ions two compilations agree about, so it is not in a position to overturn this row - but it does mean copper(II) and perchlorate are corroborated by ONE source and contradicted by another, which is a weaker position than the rest of CORROBORATED and was not true when this row was written."

