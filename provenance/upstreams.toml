note = "CHECKED 2026-09-15 AND NOT READ. acs.org answers an automated request with an Incapsula filter page - 'Request unsuccessful. Incapsula incident ID' and no body - at the terms URL and at the target middleschoolchemistry.com redirects to. NO TERMS TEXT WAS OBTAINED, so none is quoted and none is inferred, and the date above is the date of the attempt. Recorded that way deliberately: a date claiming a reading that did not happen is the defect this file exists to catch. WHY decision-required AND NOT avoid. The `crc-handbook` verdict rests on the absence of a grant on a page that loaded; nothing loaded here, so there is not even an absence to rest on, and 'we could not read it' is an open question rather than a refusal. And the dependence is not bulk: `kerotakis/material-recipes-v1` names ACS classroom material once, for qualitative teaching facts - that 3% peroxide is the strength used for yeast catalysis, that vegetable oil floats on water and does not dissolve in it, that detergent drives food colouring across whole milk. The owner's 2026-09-14 rule puts the line at bulk dependence, and one qualitative citation is not over it. WHAT WOULD SETTLE IT: a human opening either page in a browser and replacing this note. THE ACS JOURNALS ARE NOT THIS ROW. A Journal of Chemical Education study and an ACS Omega paper are measurements in peer-reviewed journals; they are covered by `primary-literature`, cited by DOI, and bundling them here would have put a CC BY 4.0 paper under an unread terms page - which is what a bare 'ACS' in this list did before it was measured."

