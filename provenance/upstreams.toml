# -------------------------------------------------------------- citations ---
#
# A reviewed judgement about what one refused source is DOING in one citation.
#
# This replaces the `[[excuse]]` list, which could say only one thing: "this
# string names a refused source and claims nothing from it". That is one of
# three relationships a citation can have with a refused work, and having no
# word for the other two is why this file could not state the owner's rule.
#
# ## Fields
#
# surface    `rust` or `registry`
# subject    a registry source id, or a repository-relative path for `rust`
# matching   optional. Narrows the row to value-bound strings CONTAINING this
#            text. A Rust subject is a whole FILE, so without it one judgement
#            covers every string in that file - the limit the phase_route.rs
#            excuse stated against itself and asked to have closed.
# upstreams  every refused upstream this one string names in this role
# role       mentioned | via | claims, below
# locator    where in the work the value is: page, table or entry. Only
#            meaningful on `claims`, and only on a source refused for BULK.
# reason     why this role is the right one, in a sentence
#
# ## Roles
#
# mentioned  The string NAMES the source and claims no value from it - to say
#            the cited source is NOT that one, to say that source is wrong, to
#            say a retired value used to rest on it, or to record a
#            withdrawal. Not a claim, so not a finding. This is the old
#            `[[excuse]]`, renamed to sit beside its siblings.
#
# via        The value is a CLEARED primary's and was read through this
#            refused source's RENDERING of it rather than off the publication.
#            Always a finding. The citation names the right work and the bytes
#            still came through the refused one; what the role buys is naming
#            the debt correctly, because this wants a verification and not a
#            re-sourcing.
#
# claims     The value IS this source's. Ordinary practice under the owner's
#            2026-09-14 rule when it carries a `locator` AND the work is
#            refused for bulk dependence - that is "we should be able to cite
#            any book", and citing a book means author, title, edition and
#            page. A finding otherwise, and there are two otherwises:
#
#            - NO LOCATOR. A work named without a place in it is not a
#              citation; it is a gesture at a library. Three rows below use
#              that deliberately: they declare `claims` with no locator
#              because their own text admits no copy was opened.
#            - THE REFUSAL IS NOT ABOUT BULK. `avoid` carries the 2026-09-14
#              rule and its objection is compilation copyright, which
#              attribution answers. `permission-required` says something else
#              - "refused until a written grant exists" - and a perfect
#              citation does not create a grant. `legacy/liquid_nitrogen`
#              proves it: it cites "NIST Chemistry WebBook SRD 69 nitrogen
#              (CAS 7727-37-9)" with a deep link carrying the record id, a
#              better locator than any CRC citation in this tree, and it is
#              still a transcription out of Standard Reference Data. Setting a
#              locator on such a row is refused by the lint outright.
#
# ## What a role is, and is not
#
# A role is a human judgement recorded in data. The lint checks that it still
# MATCHES a real string and reports it when it does not; it cannot check that
# it is true, exactly as it could not for an excuse. Its whole advantage over
# the prose it replaces is that it is named, counted, printed on every run and
# expires loudly. Every reason below therefore QUOTES the sentence in the
# citation that establishes the role, so a reviewer can check the judgement
# against the text rather than against an assertion about it.


