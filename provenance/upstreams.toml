[[upstream]]
id = "primary-literature"
name = "Primary journal literature (the paper that made the measurement)"
licence = "LicenseRef-Fact-Not-Copyrightable"
terms = "https://www.law.cornell.edu/supremecourt/text/499/340"
retrieved = "2026-09-15"
verdict = "primary"
may_touch = ["property", "thermochemistry", "codex"]
# Per-paper and therefore incomplete by construction: `doi` plus the journal
# spellings actually cited today. A new paper needs a new spelling here.
names = [
  "doi",
  "J. Chem. Soc.",
  "J. Chem. Educ.",
  "ACS Omega",
  "Trends in Food Science & Technology",
  "Z Lebensm Unters Forsch",
  "J Phys Chem B",
  "Reproduction Nutrition Development",
]
in_plan_table = true
note = "A ROUTE, NOT A BODY - the only row in this file that is not an organisation, and the one the owner's 2026-09-14 ruling prefers to both of the others: citing a book for one value is ordinary practice, leaning on a compilation is not, and tracing to the paper that made the measurement beats both. Read 2026-09-15: Feist Publications v. Rural Telephone Service, 499 U.S. 340 (1991) holds that 'no author may copyright his ideas or the facts he narrates', that copyright in a compilation 'extends only to the material contributed by the author of such work, as distinguished from the preexisting material employed in the work', and that it does not reach 'the facts themselves'. That is the entire licence basis, and it is the footing the repository already stands on twice over: `usptolowe` calls reaction facts Feist-uncopyrightable, and `literature/hartley-campbell-iodine-water` says in its own citation that it converts one factual measurement and redistributes no source text or table. WHAT THIS ROW DOES NOT LICENCE: a figure, a table, a paragraph or a fitted correlation lifted whole from a paper. One number, with author, title, journal, volume, year, pages and preferably a DOI beside it. THE NAMES LIST IS THE WEAKNESS AND IT IS STRUCTURAL. An organisation has a canonical spelling to anchor on; a paper has as many as there are journals, so this list carries `doi` and the six journal titles cited today and will be one paper behind from the moment a seventh is added. `ACS Omega` earns its place without a DOI beside it: `kerotakis-thermo/src/pack.rs` cites the same CC BY 4.0 paper `vle.rs` cites by DOI, and without the journal spelling that one string would have been invisible while its twin was legible. The structured `upstreams[]` field the lint's module docs propose is what retires it."

