reason = "A value read at one remove, and this row says through what. THE ROLE IS `claims` AND NOT `via`, AND THAT IS A LIMIT OF THE VOCABULARY RATHER THAN A JUDGEMENT ABOUT THIS CITATION. `via` is defined as a value read through a REFUSED source's rendering of a cleared one, and here it is the other way round: the work behind the value (the handbook) is what has no licence, and the route (a CC BY-SA encyclopaedia article) is clear. The file has no word for that, so the role says the true and smaller thing - the value IS the handbook's - and the route is named in the citation string and in the `de-wikipedia` row instead. Worth fixing in the vocabulary rather than in this row. Five limiting molar conductivities - silver, barium, copper(II), perchlorate and carbonate - are the Sartorius handbook's; what was actually read is the German Wikipedia article that reproduces its table. The citation string says so in its own words rather than leaving it to be inferred: 'as reproduced in de.wikipedia.org/wiki/Molare_Leitfaehigkeit and read there 2026-09-17 - read at one remove'. IT IS A FINDING AND IT SHOULD BE. `claims` with no locator is one by construction - 'a work named without a place in it is not a citation; it is a gesture at a library' - and that is the honest description: the work behind these five values was never opened, so what this wants is a verification rather than a re-sourcing. It is nevertheless the strongest thing available for these five ions, which is why they are corroborated here at all instead of sitting in the same UNCORROBORATED list as Zn(2+), Fe(2+), Fe(3+), Al(3+), Mn(2+), Pb(2+) and MnO4(-). WHAT IT IS NOT: a shipped value. Nothing in the engine or the registry rests on this row - the five numbers appear only as the external side of a test comparison, and the shipped λ° table they are compared against is untouched by this work."

