note = "Read 2026-09-15, twice, because the constants have two homes and only one of them is safe. THE WEBSITE IS SRD. physics.nist.gov/cuu/Constants is NIST STANDARD REFERENCE DATABASE 121, and NIST's own licensing statement says what that means: 'Copyright protection on this compilation of data has been secured by the Secretary of the U.S. Department of Commerce on behalf of the United States ... pursuant to Section 290(e) of Title 15 of the United States Code', with licensing to be obtained at nist.gov/srd. The compilation is therefore in the same class as the NIST WebBook and must not be harvested. THE VALUES THIS REPOSITORY SHIPS ARE NOT IN IT. `kerotakis-core/src/constants.rs` carries N_A, k, h, c and e - every one EXACT BY DEFINITION of the SI since 20 May 2019 - plus R = N_A k and F = N_A e, exact because their factors are, plus the defined standard atmosphere and a chosen 298.15 K reference. Their authority is the BIPM SI Brochure, read the same day at bipm.org/en/publications/si-brochure and published under CC BY 4.0, not a CODATA adjustment of a measured quantity. The crate's own tests assert R = N_A k and F = N_A e, so a reader can check this row rather than take it. CLEARED FOR THAT REASON AND ONLY THAT REASON: a genuinely measured CODATA value - G, the fine-structure constant, an electron mass - would be a transcription out of SRD 121 and wants its own reading before it ships. One consequence worth knowing: `phase_route.rs` hedges with 'as commonly tabulated from NIST/CODATA-class evaluated data. PENDING REVIEW: no positively identified page was opened', and this row makes that string name a cleared source. The lint reports what a string SAYS, never where a number came from; that row still has no origin. ONE NAME, TWO PRODUCTS, AND THE SECOND IS NOT CLEARED HERE. This tree also uses 'CODATA' for the CODATA KEY VALUES FOR THERMODYNAMICS (Cox, Wagman and Medvedev, 1989), which is a different publication with different terms, and those terms have NOT been read. No shipped value rests on it today and both strings that name it say so themselves: `phase_route.rs` names Cox 1989 to explain that it 'does not publish enthalpies of fusion at all', so it could never have been the provenance of the number being corrected, and `curated.rs` names it inside a denial that any single edition was opened. A value that DID rest on the Key Values would need its own row and its own reading, and this clearance must not be read as covering it."

