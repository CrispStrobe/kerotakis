names = ["SciPy"]
in_plan_table = false
note = "PROPOSED HERE. `tools/kinetics-oracle.py` has imported `scipy.integrate.solve_ivp` since it was written and had no row. TERMS READ 2026-09-16 at the URL above, which resolved: BSD 3-Clause, copyright Enthought Inc. 2001-2002 and SciPy Developers 2003, with the usual notice-retention conditions plus a no-endorsement clause. THIS ROW IS DIFFERENT IN KIND FROM EVERY OTHER ONE HERE, and saying so is the point of writing it. This file asks 'may a NUMBER in this repository have come from there?', and SciPy carries no chemical data at all - no constant, no coefficient, no table. The only numbers it can produce are ones it computed from inputs we supplied, which is exactly what `build-oracle` means, so the row exists to make a build-time dependency visible rather than to constrain a data lane. A value claiming SciPy as its SOURCE would be a category error and the lint would be right to flag it."

