in_plan_table = true
note = "PROPOSED, not inherited. A copyrighted commercial reference work (Taylor & Francis/CRC Press) granting no reuse licence. Individual physical constants are facts and uncopyrightable one at a time; a tabulation transcribed wholesale is the compilation the copyright is IN. The repository's own rows say so themselves - many carry 'PENDING REVIEW: the printed edition was not opened for this row', which is an admission that the value came from somewhere else and was attributed here."

