# ------------------------------------ added 2026-09-15, from the census ---
#
# Eight rows the repository has been leaning on with no entry here at all.
# `docs/registry-unattributed-census.md` separated the lint's 105-citation
# blind spot into three populations and found that the instrument was at
# fault more than the data: of 487 numeric records under those citations,
# 228 declare that no claim is being made, 39 are computed or declared
# editorial, ONE HUNDRED NAME A REAL SOURCE THIS TABLE COULD NOT SPELL, and
# 120 name nothing. These rows are that hundred.
#
# Each carries the date its terms were actually read. Two of them could not
# be read - acs.org answers an automated request with a filter page and
# wiley.com with a 403 - and say so in the row instead of carrying a date
# that claims a reading. Three are `decision-required`, for two different
# reasons: `ciaaw` and `fao` because a real grant exists, covers teaching and
# stops at commercial use, with nobody having asked the question that would
# settle it; `acs-education` because its terms could not be read at all, and
# "we could not read it" is an open question rather than a refusal. That
# verdict is reported apart from the headline offence count on purpose,
# because "a count that mixes refused with not yet asked reads stronger than
# it is".

[[upstream]]
id = "ciaaw"
name = "IUPAC/CIAAW standard atomic weights"
licence = "LicenseRef-IUPAC-CIAAW-Educational-Use-Commercial-On-Request"
terms = "https://ciaaw.org/impressum.htm"
retrieved = "2026-09-15"
verdict = "decision-required"
may_touch = []
# NOT a bare "IUPAC", which is ambiguous: eight registry citations use it for
# nomenclature ("IUPAC name hypochlorite") or for the InChI library ("the
# official IUPAC library computes"), and neither names this body. Today that
# costs nothing - every one of those citations ALSO says "IUPAC/CIAAW", so the
# narrow and the wide list both match 152 - so this is a forward guard, not a
# repair. "IUPAC standard atomic weights" is here for `legacy/NaNO3` and
# `legacy/KNO3`, the only two that name the weights without naming CIAAW.
names = ["CIAAW", "IUPAC standard atomic weights", "IUPAC Commission on Isotopic Abundances and Atomic Weights"]
in_plan_table = true
note = "Read 2026-09-15. ciaaw.org's front page carries only 'CIAAW, 2007-2024'; the impressum is the only terms text the Commission publishes, and it says three things in order. A grant: 'The contents of the website are jointly copyrighted by CIAAW and IUPAC and can be freely used for educational purposes.' Its condition: republication or reproduction 'is permitted without the need for formal IUPAC or CIAAW permission on condition that an acknowledgement, with full reference to the source, along with use of the copyright symbol, the name IUPAC or CIAAW, and the year of publication, are prominently visible'. Its limit: 'For commercial use of this content please contact CIAAW Secretariat.' A GRANT EXISTS, which is why this is not the CRC row, AND IT STOPS SHORT OF COMMERCIAL USE, which is why it is not a clearance. DECIDED ON THE MERITS, NOT ON THE COUNT. Three things are open and not one of them has been asked: whether an AGPL bench anyone may redistribute commercially is inside 'educational purposes'; whether the question arises at all, since a standard atomic weight is an evaluated MEASUREMENT and this registry ships compound molar masses COMPUTED by stoichiometry from about twenty element values rather than a copy of any table - the same Feist footing the `usptolowe` row and `literature/hartley-campbell-iodine-water` already stand on; and whether writing to the Secretariat, which is what that last sentence asks for, would settle it in a paragraph. `decision-required` is the verdict for a question not yet asked. SAID IN ADVANCE, BECAUSE IT WILL LOOK LIKE A REGRESSION AND IS NOT: the headline finding count does not move, and the open-question column, which has read zero on every run since this lint landed, now reads 152 on the registry and 0 on Rust. No number got worse. That is the size of a dependence that was previously invisible, and closing it means asking one question or recording the Feist position as the project's own - not re-sourcing 152 citations."

