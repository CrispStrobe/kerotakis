note = "CHECKED 2026-09-15 AND NOT READ: wiley.com returns HTTP 403 to an automated request for the title page and for /en-us/permissions alike, exactly as the CRC publisher page does. No terms were read; this verdict rests on the absence of any granted licence and on the work being a paid commercial textbook (D. Voet and J. G. Voet, Biochemistry, 4th ed., John Wiley and Sons), not on a reading. SAME CLASS AS crc-handbook AND merck-index and judged the same way, because a verdict is a property of the source's terms: making it a property of how often we happen to cite the book would mean this table said different things about one work on different days. THIS ROW ADDS EXACTLY ONE FINDING AND THE CENSUS PREDICTED IT, 59 to 60. It is a true positive rather than the count getting worse because the data got more legible. The `avoid` text carves out 'naming one of these for one value, with author, title, edition and page' as ordinary practice; `legacy/amylase` reads 'Alpha-amylase MW ~55 kDa (typical); Voet & Voet Biochemistry 4th ed.' - no page, and 'typical' by its own word, which is a rounded generality rather than a cited measurement. It is the same shape as the CRC rows that admitted 'the printed edition was not opened for this row'. THE VOCABULARY IS MISSING A VERDICT AND THIS IS WHERE IT SHOWS. The owner's rule permits citing a book once with full attribution and refuses bulk dependence, but `avoid` is a source-level flag and the lint counts every match under it, so this file cannot say 'citable once, refused in bulk'. The structured `upstreams[]` field with a per-quantity `role` would say it. Until then the honest reading of this one finding is that the number wants a page or a paper, which it does."

