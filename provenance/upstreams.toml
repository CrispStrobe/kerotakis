note = "Read 2026-09-15: content on the FAO website 'is protected by copyright' but most of it 'may be copied, printed and downloaded for private study, research and teaching purposes, and for use in non-commercial products or services' with attribution, while 'translation and adaptation rights, and for resale and other commercial use rights' require a licence request to licensing@fao.org. Statistical databases are governed separately by FAO's Open Data Licensing Policy, which is not what is cited here. THE SAME SHAPE AS THE ciaaw ROW and judged the same way: a real grant, covering teaching, stopping at commercial use, with the commercial question unasked. It is cited once, in `kerotakis/material-recipes-v1`, for the balanced hexose-to-ethanol-and-carbon-dioxide equation - which is Gay-Lussac's from 1815 and is a fact rather than FAO's expression of one, so the Feist argument that no grant is needed at all is stronger here than anywhere else in this batch. That argument is precisely why the verdict is `decision-required` and not `avoid`: the question is open, not answered against us. The anchoring earns its keep on this row - an unanchored 'FAO' matches the InChIKey suffix UHFFFAOYSA, which appears in dozens of identity citations, and would have cleared them all."

