note = "Read 2026-09-17: the USGS copyright page states that 'USGS-authored or produced data and information are considered to be in the U.S. Public Domain' and asks for credit rather than permission, with a carve-out for third-party photographs that does not reach a numeric table. WHAT IS USED. Water-Supply Paper 2311, Miller, Bradford and Peters, 'Specific Conductance: Theoretical Considerations and Application to Analytical Quality Control' (1988): table 5 on p. 10, limiting equivalent conductances of sixteen ions, and table 1 on p. 3, the Jones and Bradshaw KCl standards. Both are used ONLY in a build-time test, never as shipped bytes - the shipped λ° table is unchanged by this work and still cites what it always cited. THE PAPER NAMES ITS OWN UPSTREAM and the citation carries it forward: table 5 is 'Data from Harned and Owen (1964, p. 231), except fluoride ion data from Franks (1973, p. 178)', and the header prints the international-to-absolute-ohm factor 0.999505, which the test applies rather than absorbing into its tolerance. That chain is the whole reason this row is `primary` and the CRC row is not: a public-domain report that says which book each number came from is a route to the measurement, not a compilation standing in for one."

