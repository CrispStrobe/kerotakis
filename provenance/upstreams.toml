note = "Read 2026-09-15 at NIST's copyright, fair use and licensing statement. For the Technical Series - which is what NBS Technical Note 270 and the NBS Circulars are - 'works by NIST employees are not subject to copyright protection in the United States' under 17 U.S.C. 105, distributed with a 'non-exclusive, perpetual, paid-up, royalty-free, worldwide right to reprint'. THE LINE IS SRD STATUS, NOT AUTHORSHIP - the distinction PLAN.md drew on 2026-09-13, which unlocked five replacements - and this row sits on the clear side of it. ONE CAVEAT THE CITATIONS DO NOT CARRY. The same tables were reprinted as J. Phys. Chem. Ref. Data 11 (1982) Supplement 2, and JPCRD is the journal of the National Standard Reference Data System, so the Supplement is the SRD presentation of numbers that are public domain in the Technical Note. CITE THE TECHNICAL NOTE, NOT THE SUPPLEMENT. `kerotakis/dissolution-enthalpies-v1` names both in one parenthesis, 'NBS Technical Note 270 / J. Phys. Chem. Ref. Data 11 Suppl. 2', as though they were interchangeable; they are one set of numbers under two covers with two sets of terms. That reading of the Supplement is an inference from the journal's role and NIST's SRD statement, NOT from a terms page for the Supplement itself, and is recorded as an inference. This row also closes a gap in PLAN.md's prose table, whose 'NBS Circulars 461 and 500, J. Res. NBS, NBS Technical Notes' row has been cleared in prose since 2026-09-13 with no machine-readable entry to enforce it."

