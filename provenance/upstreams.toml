in_plan_table = true
note = "A ROUTE, NOT A BODY - the only row in this file that is not an organisation, and the one the owner's 2026-09-14 ruling prefers to both of the others: citing a book for one value is ordinary practice, leaning on a compilation is not, and tracing to the paper that made the measurement beats both. Read 2026-09-15: Feist Publications v. Rural Telephone Service, 499 U.S. 340 (1991) holds that 'no author may copyright his ideas or the facts he narrates', that copyright in a compilation 'extends only to the material contributed by the author of such work, as distinguished from the preexisting material employed in the work', and that it does not reach 'the facts themselves'. That is the entire licence basis, and it is the footing the repository already stands on twice over: `usptolowe` calls reaction facts Feist-uncopyrightable, and `literature/hartley-campbell-iodine-water` says in its own citation that it converts one factual measurement and redistributes no source text or table. WHAT THIS ROW DOES NOT LICENCE: a figure, a table, a paragraph or a fitted correlation lifted whole from a paper. One number, with author, title, journal, volume, year, pages and preferably a DOI beside it. THE NAMES LIST IS THE WEAKNESS AND IT IS STRUCTURAL. An organisation has a canonical spelling to anchor on; a paper has as many as there are journals, so this list carries `doi` and the six journal titles cited today and will be one paper behind from the moment a seventh is added. `ACS Omega` earns its place without a DOI beside it: `kerotakis-thermo/src/pack.rs` cites the same CC BY 4.0 paper `vle.rs` cites by DOI, and without the journal spelling that one string would have been invisible while its twin was legible. The structured `upstreams[]` field the lint's module docs propose is what retires it. AMENDED 2026-09-16 BY THE FERMENTATION-RATE CALIBRATION, which added three papers and a fourth read at one remove. `kerotakis/fermentation-rate-calibration-v1` cites, all by DOI: Kim, Oh and Imm 2018 (Korean Journal for Food Science of Animal Resources 38:273-281, doi:10.5851/kosfa.2018.38.2.273, CC BY-NC); Jankowska et al. 2026 (Foods 15(2):314, doi:10.3390/foods15020314, CC BY 4.0); and Pagliardini et al. 2013 (Microbial Cell Factories 12:29, doi:10.1186/1475-2859-12-29, CC BY 2.0). Three spellings were added above and ONE WAS DELIBERATELY NOT: a bare `Foods` matched on whole words hits `USDA FoodData Central`s `Foundation Foods` and would clear a dozen citations that have nothing to do with this paper - the exact false positive the anchoring note at the top of this file warns about, arriving from the other direction. That paper is legible through `doi`, which is enough, and a journal title short enough to be a common noun is not safe in this list. WHAT WAS READ AND WHAT WAS NOT, recorded because a citation that does not say so invites the reader to assume the first. All three were read in full on 2026-09-16 through the Europe PMC REST `fullTextXML` service, which is the machine-readable route to the same open-access text; the publishers' own sites were tried first and refused - sciencedirect.com and journalofdairyscience.org both answer an automated request with HTTP 403, and pmc.ncbi.nlm.nih.gov answers with a reCAPTCHA page. A FOURTH WORK WAS NOT READ AT ALL AND IS CITED AT ONE REMOVE: Salaun, Mietton and Gaucheron, 'Buffering capacity of dairy products', International Dairy Journal 15(2) (2005) 95-109, doi:10.1016/j.idairyj.2004.06.007, is where milk's buffer split of 40% soluble minerals / 35% caseins / 20% colloidal calcium phosphate / 5% whey proteins comes from, and it is behind Elsevier's 403. What was read is Kim et al. 2018 reporting it and naming it as the source. The calibration's citation says 'as reported by Kim et al. 2018' in those words rather than citing Salaun directly, because citing a paper nobody here opened is the thing this file exists to catch. It is used only for the BOUNDARY statement - that most of milk's buffer is missing from the model - and no shipped number is derived from it."

