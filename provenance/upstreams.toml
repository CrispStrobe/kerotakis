in_plan_table = false
note = "READ 2026-09-17, BOTH THE PUBLICATION AND ITS TERMS PAGE, and they say different amounts. The recommendation itself - OIML R 56, 'Standard solutions reproducing the conductivity of electrolytes', Edition 1981 (E), five pages - is served as a free PDF from oiml.org and was read in full. The publications page carries no licence, no reuse statement and no permissions text: the only relevant sentence on it is the footer, 'Copyright OIML 2021'. So a grant was looked for and not found, which is a different thing from a grant being refused, and the verdict says so. WHAT IS USED AND WHERE. Six numbers: the three primary standards of table 1 (Jones and Bradshaw's 1933 measurements corrected to the absolute ohm per the IUPAC recommendation) and the three secondary standards of table 2 (Shedlovsky, 1932). They appear ONLY in tests - `crates/kerotakis-core/tests/conductivity_sources.rs`, and since 2026-09-18 one of the six also in the `#[cfg(test)]` module at the foot of `crates/kerotakis-core/src/conductivity.rs`, which is a test in a source file and not shipped data - as the external measurements a conductivity model is checked against, and nothing in the shipped engine or registry carries them. THE OPEN QUESTION, stated so the owner can close it: whether an intergovernmental recommendation's reference values - which are metrological conventions, and which every conductivity meter in the world is calibrated to - are ours to print in a test. The owner's 2026-09-14 rule puts the line at bulk dependence and this is two tables of a five-page document, cited with organisation, number, edition and table, which is the shape the rule calls ordinary practice. It is recorded as a question rather than answered here because the verdict is a property of the terms, and the terms were silent. A FINDING THIS ROW SURFACES AND DOES NOT FIX: `conductivity.rs`'s FIT_SOURCE says '1413 microsiemens/cm for the 0.01 mol/kg KCl calibration standard is the IUPAC/OIML reference value'. OIML R 5