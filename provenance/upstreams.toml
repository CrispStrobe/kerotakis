reason = "The second-source search of 2026-09-18, and the same shape as the Sartorius row above with one difference that matters. The five values - lead, iron(III), aluminium, iron(II) and manganese(II) - ARE this textbook's, so `claims` is the true role; and it carries NO LOCATOR ON PURPOSE, because no copy of the book was opened. The citation string says so in its own words rather than leaving it to be inferred: 'as reproduced in the Khimicheskii spravochnik entry at chemical_reference.academic.ru and read there 2026-09-18. READ AT ONE REMOVE: no copy of the book was opened, and the value is the book's, not the website's'. A work named without a place in it is a gesture at a library, so this is one finding and should be. THE DIFFERENCE FROM SARTORIUS: those five ions left UNCORROBORATED on the strength of their row; these five DO NOT. The test file measures this source against the twenty-one ions it shares with values USGS and Sartorius already settle, finds three of them wrong by several per cent, and concludes in a test rather than a comment that a source that loose cannot corroborate at half a per cent. So the row buys a BOUND and not a confirmation - enough to reject a value a quarter wrong, not enough to accept one - and Zn(2+) does not even get that, because this table does not carry zinc either. WHAT IT WAS NOT, AND WHAT ONE ROW OF IT HAS SINCE BECOME. The numbers appear as the external side of a test comparison, and four of the five still do. The fifth does not: 1/3 Al(3+) = 63 here and 63 in `huebschmann-tabellen-zur-chemie` was reported to the owner in docs/MUTATION-SENSITIVITY.md section 8d as the one outright contradiction of a shipped value the search found, and on 2026-09-18 the owner ruled that the shipped lambda-zero(Al 3+) should move to meet it, 183.0 to 189.0. So this citation now also stands behind a shipped number, which is why the upstream note says at length what that does and does not mean - the verdict is unchanged, the role is unchanged, and the value is a decided reading rather than a measured one."

[[citation]]
