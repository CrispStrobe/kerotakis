# The scientific-upstream audit, machine-readable.
#
# This is the `PLAN.md` "Data provenance, verified" table (around line 1545)
# turned into data, as that section promised: "The provenance table above
# moves to machine-readable TOML (per source: licence, terms URL, retrieval
# date, verdict, what it may touch) with a `kero provenance lint` that checks
# every entry". The prose table stays where it is, as commentary; this file is
# what the lint reads.
#
# It is a DIFFERENT question from `provenance/sources.toml`. That manifest asks
# "may these bytes enter a Kerotakis artifact, and what travels with them?" and
# is keyed by vendored path. This file asks "may a NUMBER in this repository
# have come from there?" and is keyed by the name a provenance string uses.
#
# ## Fields
#
# id            stable slug, referenced by `[[citation]]` rows below
# name          the source as the PLAN.md row names it
# licence       SPDX id where one exists, else a LicenseRef- describing the bar
# terms         URL of the terms actually read (NOT a homepage)
# retrieved     ISO date the terms at `terms` were last checked
# verdict       see below
# may_touch     surfaces a value from here may reach; empty for a refused row
# names         the spellings a provenance string uses for this source. Matched
#               case-insensitively but only on WHOLE WORDS at both ends, which
#               is load-bearing: an unanchored "ECHA" matches "mechanism", and
#               that false positive was in the first draft of this lint.
# cite_at_most  how many ATTRIBUTED claims this project has decided it will
#               rest on this work. Zero on every row unless declared, because
#               the rule names no number and inventing one in a lint would be
#               the lint deciding a policy question. Legal only on `avoid` -
#               attribution answers compilation copyright and cannot answer
#               "nobody granted permission". Raising it is a reviewed edit
#               that must say why in `cite_at_most_reason`.
# cite_at_most_reason  required whenever cite_at_most is above zero
# note          the PLAN.md verdict cell, kept verbatim as commentary
# in_plan_table whether PLAN.md's prose table actually carries this row. `false`
#               marks a source the repository USES but never judged - see
#               `crc-handbook` and `merck-index`, which between them are cited
#               by more values than every audited row combined.
#
# ## Verdicts
#
# primary            cleared, and the preferred route for what `may_touch` lists
# supplement         cleared, but too thin to carry a surface on its own
# oracle-only        build-time test fixtures only; never shipped bytes
# avoid              REFUSED AS A SYSTEMATIC SOURCE. Owner, 2026-09-14: "we
#                    should be able to cite any book, only not harvest the
#                    books per systematic scraping, and we should be able to
#                    trace original sources for almost all values, and cite
#                    those." So the line is BULK DEPENDENCE, not attribution.
#                    Naming one of these for one value, with author, title,
#                    edition and page, is ordinary practice. Leaning on it for
#                    many values is not, and tracing to the paper that made the
#                    measurement is better than either. What still stops is a
#                    row that says only that its value "agrees with" such a
#                    source, which offers agreement in place of an origin.
#                    HOW THE LINT COUNTS THIS, since 2026-09-15: a match
#                    under an `avoid` row is read together with its
#                    `[[citation]]` role below. One value, one page, is not a
#                    finding; a claim with no page is; and dependence past
#                    `cite_at_most` is one finding for the whole work, because
#                    the offence is the leaning rather than each lean.
# permission-required refused until a written grant exists; counted with `avoid`
#                    in the headline, but NOT eligible for the attribution
#                    carve-out above: a page cannot cure a permission. See the
#                    `[[citation]]` role documentation for the worked example,
#                    `legacy/liquid_nitrogen`.
# decision-required  a question is open; reported separately, never in the
#                    headline offence count, because a count that mixes
#                    "refused" with "not yet asked" reads stronger than it is.

schema = 1
policy = "scientific-upstream-audit-v1"
checked = "2026-08-18"

