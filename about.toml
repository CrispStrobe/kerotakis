# cargo-about configuration — generates third-party license notices.
# Run: cargo about generate about.hbs > THIRD_PARTY_LICENSES.html
# See: https://embarkstudios.github.io/cargo-about/

accepted = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
]

# Workspace-local crates and prototypes with their own licensing.
ignore-build-dependencies = true
ignore-dev-dependencies = true
