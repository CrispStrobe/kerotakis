[package]
name = "kerotakis-org"
description = "Organic chemistry structure toolkit for Kerotakis — SMILES, InChI, functional groups, and reaction templates"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# CAP-13: enable the native IUPAC InChI library for cross-validation.
# This adds a C build dependency (inchi-sys) — not available on wasm.
native-inchi = ["dep:inchi"]

[dependencies]
kerotakis-core = { path = "../kerotakis-core" }
chematic = { version = "0.18", features = ["smiles", "perception", "chem", "inchi", "smarts", "rxn", "mol"] }
inchi = { version = "0.1", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# BRD-010: the PubChem fixture's identity cross-check is recomputed here,
# because the official IUPAC library lives behind this crate's `native-inchi`
# feature. `kerotakis-data` stays free of the C dependency.
kerotakis-data = { path = "../kerotakis-data" }
