[package]
name = "kerotakis-phreeqc"
description = "IPhreeqc FFI with embedded thermodynamic databases — the L2 aqueous-equilibrium engine of Kerotakis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
links = "IPhreeqc"

[features]
default = ["engine"]
# The native IPhreeqc engine. Without it the crate still parses the
# databases, maps vessels and replays a pre-warmed cache — the shipped-data
# path a wasm client uses when it cannot link a C++ library.
engine = ["dep:cmake"]

[dependencies]
kerotakis-core = { path = "../kerotakis-core" }
thiserror = { workspace = true }
serde = { workspace = true }
postcard = { version = "1", features = ["alloc"] }

[build-dependencies]
cmake = { version = "0.1", optional = true }

[dev-dependencies]
kerotakis-safety = { path = "../kerotakis-safety" }
serde_json = { workspace = true }
