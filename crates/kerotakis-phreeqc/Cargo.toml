[package]
name = "kerotakis-phreeqc"
description = "IPhreeqc FFI with embedded thermodynamic databases — the L2 aqueous-equilibrium engine of Kerotakis"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
links = "IPhreeqc"

[features]
default = ["engine", "my-basic"]
# The native IPhreeqc engine. Without it the crate still parses the
# databases, maps vessels and replays a pre-warmed cache — the shipped-data
# path a wasm client uses when it cannot link a C++ library.
engine = ["dep:cmake"]
# The official MY-BASIC PHREEQC BASIC backend (MIT-licensed). This is the
# default interpreter for all BASIC-backed PHREEQC features.
my-basic = ["engine"]

[dependencies]
kerotakis-core = { path = "../kerotakis-core" }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
postcard = { version = "1", features = ["alloc"] }

[build-dependencies]
cmake = { version = "0.1", optional = true }

[[bin]]
name = "generate-dbindex"
# No engine feature needed — database parsing is pure Rust.
required-features = []

[dev-dependencies]
kerotakis-safety = { path = "../kerotakis-safety" }
