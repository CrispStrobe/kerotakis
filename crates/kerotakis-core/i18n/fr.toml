# The engine's own words, in French.
#
# One file per language. This one was written to find out whether the
# claim in `src/i18n.rs` is true — that adding a language is this file and
# a single line in `CATALOGUES`, with no existing translation touched.
#
# Keys are dotted paths naming WHERE the phrase is said, not what it says,
# so a reworded English source does not orphan its translations. Where a
# key IS an English word (`[glassware] beaker`), the lookup is by value:
# the engine asks the catalogue what it calls a beaker.
#
# The English original stays at the call site in Rust. A missing key here
# is a fallback to that English, never a blank — which is what lets this
# file ship while it is still being written.

[vessel]
