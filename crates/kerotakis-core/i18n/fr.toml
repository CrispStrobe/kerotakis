[scene]
# Three templates for one fact, because German takes a different case for
# water going in and water coming out, and "into" is not a word that can be
# swapped in place. The direction is a property of the sentence.
osmosis-in = "Dans le modèle pédagogique, l'osmose a transporté au total {water} mol ({mass} g) d'eau vers l'intérieur de {material} ; la taille de l'objet, la mécanique de la membrane et l'équilibre final ne sont pas modélisés."
osmosis-out = "Dans le modèle pédagogique, l'osmose a transporté au total {water} mol ({mass} g) d'eau hors de {material} ; la taille de l'objet, la mécanique de la membrane et l'équilibre final ne sont pas modélisés."
osmosis-either = "Dans le modèle pédagogique, l'osmose a transporté au total {water} mol ({mass} g) d'eau vers l'intérieur ou hors de {material} ; la taille de l'objet, la mécanique de la membrane et l'équilibre final ne sont pas modélisés."
