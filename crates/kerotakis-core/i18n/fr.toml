"hydrated.lv3" = "{vessel} : réhydratation — {units} mol {anhydrous} + {water} mol H2O → {units} mol {hydrate}. Déclenchée parce que l'eau libre disponible ne dépasse pas le besoin stœchiométrique du cristal ; avec plus d'eau, la dissolution serait la réponse honnête, et c'est à la machine de calcul aqueuse qu'il revient de la traiter"

# The flame colour is the observation. It went through the table at lv1
# and was composed in English at lv2, so the German line ended
# "entzündet — orange-red flame". German cannot decline these colours
# attributively without inflecting the table, so the noun goes first and
# the colour follows as an apposition.
"ignited.lv2-flame" = " — flamme : {colour}"
