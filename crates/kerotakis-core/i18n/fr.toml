"dehydrated.lv2" = "{vessel} : {hydrate} → {anhydrous} + eau, chassée à {at} °C — {water_g} g d'eau ont quitté le creuset"
"dehydrated.lv3" = "{vessel} : déshydratation à {at} K — {units} mol {hydrate} → {units} mol {anhydrous} + {water} mol H2O ({water_g} g). En une seule étape jusqu'au sel anhydre : les hydrates intermédiaires existent réellement, mais ne sont pas modélisés ici"
