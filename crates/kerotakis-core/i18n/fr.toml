[explain]
# `kero explain` — why this dataset answered this beaker. The CLI's own
# labels live in the ENGINE catalogue rather than a CLI one, so adding
# French stays one core toml and one web json.
#
# The VALUES are not here and never will be, and the reason changed. It
# used to be that two records disagreed about whether the routing should be
# German. The owner settled that on 2026-09-18 — `explain` is a user-facing
# command and answers in the reader's language — and the routing, the
# dataset and the model are all German now. They are not rows in this
# section because they are not the CLI's words: each is a `Phrase` the
# SOLVER composes, and its German lives under `[routing]` and
# `[provenance]` beside every other sentence the engine builds.
"answered-by" = "  {vessel} : répondu par {engine} avec {dataset}"
"model" = "Modèle : "
"routing" = "Voie : "
"uncharacterised" = "  {vessel} : aucun moteur aqueux n'a caractérisé ce récipient"
"no-engine" = "(aucun moteur disponible pour comparer les voies)"
"dataset-sources" = "le jeu de données cite ses propres sources, par ex. :"
"nothing-aqueous" = "(rien d'aqueux à comparer)"
"same-question" = "la même question, posée à chaque jeu de données :"
"solvent-activity" = "activité du solvant : a_w = {activity} d'une seconde spéciation sur {dataset} ({model}), à {molality} mol/kgw de particules et I = {ionic_strength}"

