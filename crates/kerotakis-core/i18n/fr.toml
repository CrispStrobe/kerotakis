# Seven event variants whose learner-facing sentence was still inside a
# bare format!, so no catalogue could reach them and German readers got
# English no matter how complete this file was. Found by
# `every_event_the_engine_can_emit_has_a_german_sentence`, which walks the
# serde variant names of the Event enum rather than a list kept by hand.
# The spill and breakage events, merged the day this gate was written and
# caught by it the same afternoon: five variants, no German at all. Nothing
# else noticed, because an untranslated event renders English and reads as
# a sentence somebody chose to leave alone.
