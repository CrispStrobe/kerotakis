[provenance]
# The dataset half. Two levels: a base clause naming what this lab added
# to the vendored file, wrapped in the clause that is true of all of them.
# The wrapper is written ONCE here for the same reason it is composed once
# in `aqueous.rs` — three flat rows would be three chances to drift.
"dataset.plus-reference-complexes" = "{file}, complété par les complexes à température de référence de l'USBM IC 9429"
"dataset.plus-lactate-and-reference-complexes" = "{file}, complété par le lactate vérifié et les complexes à température de référence de l'USBM IC 9429"
"dataset.with-gas-uptake-slice" = "{file}, avec l'extrait de données vérifié sur l'absorption du gaz HBr selon Sander"
"dataset.vendored-usgs" = "{file}, tel que fourni par l'USGS"

# The model half. The three activity models are composed in
# `kerotakis-phreeqc/src/dbindex.rs`, which is the only place their
# descriptions exist; the other three are composed where the solver that
# applies them is.
"model.ion-interaction" = "modèle d'interaction ionique spécifique {name} (valide à force ionique élevée)"
"model.wateq-debye-huckel" = "extension {name} (fiable jusqu'à environ I = {ionic_strength} mol/kgw)"
"model.davies" = "équation {name} (fiable jusqu'à environ I = {ionic_strength} mol/kgw)"
"model.water-autoionisation" = "autoprotolyse de l'eau en dilution idéale (relation {engine} pour log K à six coefficients)"
"model.curated-complete-combustion" = "combustion complète en CO2 et H2O à chaleur de combustion tabulée, avec une fraction d'oxygène limitante de {fraction} pour une enceinte fermée"
"model.nasa9-polynomials" = "polynômes {name}, gaz parfait + phases condensées pures"
"model.with-feed-tp-fallback" = "{model} ; repli TP sur l'alimentation en combustible liquide à la température de zone d'allumage explicitement indiquée"

[routing]
solvent-relation-only = "aucun acide, aucune base, aucun sel, aucune surface, aucun échangeur, aucun transfert gazeux et aucun soluté aqueux réactif représentés ; la relation du solvant a été évaluée sans appel à IPhreeqc, et tout l'inventaire spectateur est resté conservé"
mix-by-fraction = "MIX : deux solutions dissoutes mélangées proportionnellement"
extended-chemistry = "choisi parce que le problème demande une chimie absente du jeu de données par défaut (ligands organiques, le couple hypochlorite emprunté, ou l'acide phosphorique libre)"
concentrated-ion-interaction = "choisi parce que la solution est concentrée (~{molality} mol/kgw) ; c'est là que le modèle d'interaction ionique est valide"
default-inorganic = "le jeu de données aqueux inorganique par défaut"
activity-model-fallback = "{routing} ; l'entrée porte une charge de soluté peut-être concentrée (~{molality} mol/kgw, sans force ionique mesurée), mais la route de Pitzer ne peut pas représenter toute la chimie demandée. Ce repli sur un autre modèle d'activité n'est pas une prédiction validée pour les mélanges concentrés"
redox-not-coupled = "les éléments rédox ici n'ont pas pu être couplés ; chacun est donc montré dans le degré d'oxydation où il a été ajouté, et ils n'ont pas réagi entre eux — {why}"
slow-couples-held-as-added = "certains éléments conservent ici le degré d'oxydation où ils ont été ajoutés : seuls les couples qui s'équilibrent à l'échelle de temps d'une paillasse échangent des électrons, et les lents — sulfate, nitrate, carbonate — sont maintenus tels qu'ils ont été ajoutés"
with-redox-note = "{routing}. {note}"
second-speciation-for-solvent = "{routing} ; l'activité du solvant ne provient PAS de ce jeu de données — il rapporte le substitut câblé en dur de PHREEQC, 1 - 0.017*Sum(m), au lieu d'un modèle —, mais d'une seconde spéciation de la même solution sur {dataset} ({model}), posée sans phases, gaz ni interfaces, et interrogée uniquement pour a_w"
