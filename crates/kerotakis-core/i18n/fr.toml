# What the bench LOOKS like, composed in `appearance.rs`.
#
# These are not catalogue entries a lesson author writes — they are the
# sentences the engine assembles itself, so a reader of French meets them
# inside an otherwise translated lesson. `every_composed_key_is_translated`
# is the gate: the denominator is the count of key literals in the SOURCE.
[look]
# The space between two whole sentences, and the list grammar, as rows:
# they look like typography until the language is one that punctuates
# differently. French uses the space and the final conjunction, and says
# so here rather than by falling back.
sentence-join = "{first} {second}"
list-separator = ", "
list-final = "{head} et {last}"
clause-separator = ", "
full-stop = "."
empty = "le bécher est vide"
nothing-visible = "il n'y a rien à voir dans le bécher"
liquid = "le liquide est {colour} {clarity}"
clarity-opaque = "et si trouble qu'on ne voit pas au travers"
clarity-cloudy = "et trouble"
clarity-hazy = "et à peine voilé"
clarity-clear = "et limpide"
bubbling = "des bulles de gaz y remontent"
protein-coagulated = "la protéine de {material} s'est dénaturée et a coagulé en un solide blanc opaque"
deposit-in-liquid = "au fond, tu vois {what}"
deposit-dry = "dans le bécher, tu vois {what}"
surface-skin = "une peau de {material} recouvre la surface"
surface-grains = "des grains de {material} flottent à la surface"
floats-on-top = "à la surface, tu vois {what}"
# The colour follows the noun in French, so the row reorders rather than
# translating word for word — the same move the German row makes.
coloured = "{name} ({colour})"
piece-floats = "un morceau de {what} flotte à la surface"
piece-bottom = "un morceau de {what} repose au fond"
piece-here = "un morceau de {what} se trouve dans le bécher"
spectral-gap = "La couleur est incomplète : aucun spectre d'absorption pour {species}."

# Why nothing happened, composed in `displacement.rs` and `solve.rs`.
#
# The refusal's NAME has been translatable since there was a catalogue;
# its REASON was a finished `format!` by the time it reached an event.
# These are the sentences where the engine explains itself, so they are
# exactly the ones a learner has to be able to read.
[inert]
hydrogen-overpotential = "{name} devrait se dissoudre dans cet acide d'après la série (force motrice {driving} V), mais l'hydrogène doit se former sur {name}, et sur cette surface cela coûte une surtension d'environ {eta} V. Bloqué cinétiquement à l'échelle de temps d'un cours, et non inerte thermodynamiquement — c'est toute la différence entre une paillasse et une pile"
couple-spent = "tout le {other} s'est déposé ; il ne reste plus rien à déplacer au {name} restant. Le couple descend toujours la pente (E° {e_self} V pour {name} contre {e_other} V pour {other}) — il n'y a simplement plus d'ions {other}"
couple-spent-trace = "tout le {other} s'est déposé à une trace près ({left} mol d'ion restante, là où la racine de Nernst a placé l'équilibre) ; il ne reste plus rien à déplacer au {name} restant. Le couple descend toujours la pente (E° {e_self} V pour {name} contre {e_other} V pour {other})"
uphill-in-series = "{name} se situe au-dessus de {other} dans la série d'activité (E° {e_self} V contre {e_other} V) : les électrons devraient donc remonter la pente, et le métal le moins réactif ne déplace pas le plus réactif"
above-hydrogen = "{name} se situe au-dessus de l'hydrogène dans la série d'activité (E° {e_self} V contre 0,000 V pour 2H⁺/H₂), un acide dilué ne peut donc pas lui prendre ses électrons. Un acide oxydant comme l'acide nitrique le pourrait, par un autre couple, et cela n'est pas modélisé"
insoluble-in-water = "{name} ne se dissout pas dans l'eau : sa solubilité vérifiée est de {limit} g pour 100 mL, en dessous de tout ce qu'un bécher montrerait. Il est encore là en entier"
insoluble-in-water-trace-in-solution = "{name} se dissout à peine dans l'eau : sa solubilité vérifiée est de {limit} g pour 100 mL, en dessous de tout ce qu'un bécher montrerait. Une trace en est en solution ; le reste est toujours là"

