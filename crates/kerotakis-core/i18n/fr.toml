# The melting/boiling apparatus. Every one of its refusals is the lesson —
# a mixture is told WHY it has no sharp point — so an English refusal in a
# German lab is the worst place for this table to be missing.
"transition-point.lv2" = "{vessel} {what} : {subject} {outcome} à {value} °C (± 0,5), net — une seule substance"
"transition-point.lv3" = "{vessel} {what} : {subject} {outcome} à {value} °C ± 0,5 (net : une seule substance au-dessus du seuil de pureté de {trace} de fraction molaire). Source : {source}. Limite : {boundary}"
"transition-point.empty.lv1" = "Il n'y a rien dans le tube qui puisse fondre."
"transition-point.empty.lv2" = "{vessel} {what} : rien de la phase requise ne se trouve dans le récipient"
"transition-point.mixture.lv1" = "Cela ne fond pas à une seule température — cela devient mou et pâteux sur toute une plage. C'est exactement ce que fait toujours un mélange, et c'est à cela que tu reconnais que cet échantillon n'est pas pur."
"transition-point.mixture.lv2" = "{vessel} {what} : pas de point net — l'échantillon est un mélange ({listed}). Il devient mou et fond sur toute une plage, à partir de moins de {bound} °C"
"transition-point.mixture.lv3" = "{vessel} {what} : refusé — {listed} sont tous au-dessus du seuil de pureté, il n'y a donc aucune transition nette à rapporter. {boundary}"
"transition-point.nodata.lv1" = "Personne n'a encore consigné cela dans le cahier de laboratoire, l'appareil ne peut donc rien te dire à ce sujet."
"transition-point.nodata.lv2" = "{vessel} {what} : l'échantillon est une seule substance ({subject}), mais la base de données ne porte aucun {what} pour elle — aucune valeur n'est inventée"
"transition-point.wet.lv1" = "L'échantillon est encore humide. Sèche-le d'abord — un échantillon humide fond trop bas et de façon imprécise, et la mesure serait un mensonge."
"transition-point.wet.lv2" = "{vessel} {what} : l'échantillon n'est pas isolé — outre {subject}, le récipient contient encore un peu d'une autre phase. Sèche-le ou sépare-le d'abord"
"transition-point.wet.lv3" = "{vessel} {what} : refusé — {subject} est certes la seule substance de la phase voulue, mais de la matière d'une autre phase est présente ; il s'agit donc d'un échantillon humide ou dissous, et non isolé. {boundary}"

# I18N-13. The lv3 evidence lines that were still a bare `format!`.
#
# `I18N.md` used to record the 27 of them as "counted separately on
# purpose" — the working, for a reader who asked for it. That exemption is
# withdrawn: lv3 is a register a reader SELECTS, and a register a reader
# selects is a user-facing surface. The lines below are the rest of that
# surface in German.
#
# They are terse on purpose. lv1 narrates and lv2 summarises; lv3 hands
# over the arithmetic and the boundary of the claim, and German keeps the
# same register rather than smoothing it into prose.
"spill-created.lv3" = "{source} : {percent} % sont passés dans le déversement sur {where}"
"container-broken.lv3" = "{vessel} : récipient brisé à {impulse} N·s ; le contenu a atterri sur {where}"
"collision-withstood.lv3" = "{vessel} : choc de {impulse} N·s encaissé"
"spill-recovered.lv3" = "Déversement sur {where} : {percent} % récupérés dans {to}"
"spill-hazard.lv3" = "Déversement sur {where} ({severity}) : {hazard} ; {real_world}"
"hazard-warning.lv3" = "DANGER [{severity}] (L0) : {hazard} ; {real_world}"
"fermented.lv3" = "{vessel} : la levure a fait fermenter {sucrose} mol de saccharose en {seconds} s → {ethanol} mol d'éthanol + {co2} mol de CO2 ({yeast} g de levure active)"
"hydrolysed.lv3" = "{vessel} : une activité {family} limitée a hydrolysé {mass} g de {substrate} dans {material} ; {percent} % converti. Les produits restent dans la matière conservée, non dissoute : aucun inventaire de produits nommés n'est affirmé."
"surface-spread.lv3" = "{vessel} : {material} — la surface libre au centre est passée de {from} % à {to} %"
"surface-colour-spread.lv3" = "{vessel} : {spots} tache(s) de couleur en surface se sont étendues de {from} % à {to} %"
"surface-colour-mixed.lv3" = "{vessel} : {spots} tache(s) de couleur en surface homogénéisée(s)"
"emulsion-changed.lv3" = "{vessel} : réponse d'émulsion limitée au niveau de la recette {from} → {to} ; {volume} L dispersés ; demi-vie {half_life} s — aucune affirmation sur la CMC, la distribution des gouttelettes ou la CFD"
"curdling-changed.lv3" = "{vessel} : réponse limitée de coagulation acide {from} → {to} ; avancement de la séparation {progress} ; solide de caillé {mass} g à partir de {acid_moles} mol de {acid} ; masse totale conservée, aucune affirmation sur la spéciation de la caséine ou le rendement humide"
"headspace-partitioned.lv3" = "{vessel} : {name} liquide → ciel gazeux, {moles} mol ; fraction gazeuse {fraction}, p = {pa} Pa, H = {henry} mol/(L·atm) — {source}"
"headspace-partitioned.lv3-back" = "{vessel} : {name} ciel gazeux → liquide, {moles} mol ; fraction gazeuse {fraction}, p = {pa} Pa, H = {henry} mol/(L·atm) — {source}"
"material-layers-formed.lv3" = "{vessel} : rôle de couche de matière vérifié — le {upper_material} non dissous est immiscible avec la phase aqueuse et se trouve au-dessus de {lower} ; ce n'est pas un calcul moléculaire d'équilibre liquide-liquide"
"distilled.lv3-modelled" = "{from} → {to} : {contents} ; {at} K → {ended} K ; {stages} plateau(x) théorique(s) ; {energy} kJ de chaleur latente. {model}"
"precipitated.lv3" = "{vessel} : {moles} mol de {name} précipités"
"precipitated.lv3-dry" = "{vessel} : {moles} mol de {name} formés comme produit condensé (récipient sec)"
"below-autoignition.lv3" = "{vessel} : {name} en présence d'oxygène à {at} K, en dessous de sa température d'auto-inflammation de {needs} K ; pas d'étincelle, donc le solveur thermique s'abstient"
"sealed-cell.lv3" = "{vessel} : {material}, décharge vérifiée {reaction} à {volts} V de tension à vide. La réaction est NOMMÉE et non calculée — ses produits n'ont aucune espèce dans ce registre et aucune charge n'est suivie —, le bilan reste donc intact et la masse de l'objet est conservée par construction, non par un calcul sur les produits"
"polymer-heated.lv3-softened" = "{vessel} : {name} à {kelvin} K, au-dessus du point de ramollissement vérifié de {limit} K — glissement des chaînes, réversible ; aucune viscosité ni vitesse d'écoulement n'est affirmée"
"polymer-heated.lv3-charred" = "{vessel} : {name} à {kelvin} K, au-dessus de la température de décomposition vérifiée de {limit} K — irréversible ; les produits de pyrolyse ne sont pas modélisés et le bilan reste intact"
"polymer-heated.lv3-network" = "{vessel} : {name} à {kelvin} K, réticulé — aucun point de ramollissement n'existe à quelque température que ce soit ; le seuil le plus proche est la décomposition à {limit} K"
"polymer-heated.lv3-rigid" = "{vessel} : {name} à {kelvin} K, en dessous du point de ramollissement vérifié de {limit} K"
"corroded.lv3" = "{vessel} : {name} corrodé : {why}"
"corroded.lv3-spared" = "{vessel} : {name} ne corrode pas : {why}"
"adsorbed.lv3" = "{vessel} : {dye} sur {solid}, {held} mol fixées à {loading} mg/g, {left} mol encore dissoutes. Limite : {boundary}"

# I18N-13, second tranche: the lines the LINT could not see either.
#
# `engine-locale-lint.py` found prose by looking for two adjacent English
# words, which is blind to a sentence whose words are all separated by
# holes — "{vessel}: {reaction} released {energy} J" has exactly one
# English word in it and reads as prose to a person. Fifteen more lines
# hid in that gap, one of them at lv2 and one at lv1. The lint now reads
# a `format!`'s TEMPLATE on its own terms, so they are counted; these are
# their German.
"gas-produced.lv3" = "{vessel} : {moles} mol de {species} formés ({rate} mol/s)"
"reaction-heat-released.lv3" = "{vessel} : {reaction} a libéré {energy} J"
"foam-changed.lv3" = "{vessel} : mousse {volume} L, {height} cm de haut, débordement {overflow} L"
"uv-attenuated.lv3" = "{vessel} : {name} laisse passer {fraction} de {nm} nm ({band}) ; {mechanism}"
"magnet-separated.lv3-separated" = "{from} → {to} : attirés magnétiquement : {attracted} ; restés non magnétiques : {remained}"
"magnet-separated.lv3-nothing-remained" = "aucune"
"org-reacted.lv3" = "{vessel} : {name}, {equation}, avancement {extent} mol. Limite : {boundary}"
"smelled.lv2-wafted" = "{vessel} : éventé — {list}"
"dissolved.lv3" = "{vessel} : {moles} mol de {name} dissous"
"inert.lv3" = "{vessel} : {name} inerte : {why}"
"observed.lv3" = "{vessel} : {appearance} (liquide {colour}, trouble {turbidity})"
"no-cell.lv3" = "{a}–{b} : pas de pile : {why}"
"state-changed.lv1-generic" = "Le {name} dans {vessel} {verb}."
"reacted.lv3-catalyst" = " (catalyseur : {c})"
"solver-failed.lv3" = "{vessel} : solveur « {solver} » en échec : {detail}"

# Moved, not invented. `chromatographed.lv3` above carried this clause
# written into its own template, so the `{method}` hole the English grew —
# the one that says whether a K was computed or reviewed — could never
# reach a German reader at all. The German below is that row's own words,
# lifted out of it.
#
# One word IS changed, and deliberately: the row said "γ∞(water)/γ∞(alkane)"
# while `chromatographed.lv3-method-mixed`, which fills the SAME hole when
# a curated K is on the column, says "γ∞(Wasser)/γ∞(Alkan)". Two spellings
# for one formula was invisible while only one of them could ever render;
# now that they are alternatives at one hole, a German reader would see the
# sentence spell its own symbols two ways depending on the dye.
"chromatographed.lv3-method-unifac" = "K = γ∞(eau)/γ∞(alcane) issu du même UNIFAC, selon lequel l'ampoule à décanter répartit aussi"

