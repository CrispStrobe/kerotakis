# GUI: this sentence WAS translated — under `[refusal]`, where nothing
# looks for it. `localize_hazard` tries `hazard.*` then `hazard_vapour.*`
# and stops, so the one Danger-severity rule about a cryogen reached a
# German learner as a German real_world sentence wrapped around an English
# hazard clause. Its two neighbours above are duplicated into both tables
# on purpose; this one had only half that treatment.
"liquid nitrogen is a cryogen and its boil-off displaces breathable air" = "l'azote liquide est un cryogène et son évaporation chasse l'air respirable"

[real_world]
"People are hospitalised every year from mixing these two household cleaners." = "Chaque année, des personnes sont hospitalisées pour avoir mélangé ces deux produits d'entretien ménagers."
"Chlorine gas was used as a chemical weapon; even small amounts damage lungs." = "Le chlore gazeux a été utilisé comme arme chimique ; même de petites quantités endommagent les poumons."
"Bleach and vinegar is one of the commonest household poisonings there is — both are ordinary kitchen bottles, which is exactly why people mix them." = "L'eau de Javel et le vinaigre forment l'une des intoxications domestiques les plus courantes qui soient — ce sont deux bouteilles de cuisine tout à fait ordinaires, et c'est précisément pour cela qu'on les mélange."
"Potassium permanganate and glycerol ignite on contact; similar mixtures cause laboratory fires." = "Le permanganate de potassium et le glycérol s'enflamment à leur contact mutuel ; des mélanges similaires provoquent des incendies de laboratoire."
"Hydrogen and chlorine mixtures can detonate when exposed to light or a spark." = "Les mélanges d'hydrogène et de chlore peuvent détoner sous l'effet de la lumière ou d'une étincelle."
"Permanganate and sulfite solutions react vigorously; at scale, such mixtures can detonate." = "Les solutions de permanganate et de sulfite réagissent vivement ; à grande échelle, de tels mélanges peuvent détoner."
"Any metal above hydrogen in the activity series gives off hydrogen gas in acid; magnesium ribbon in hydrochloric acid is the school version, where the gas pops with a lit splint. The gas is genuinely flammable whichever metal and acid made it." = "Tout métal situé au-dessus de l'hydrogène dans la série d'activité dégage du dihydrogène au contact d'un acide ; le ruban de magnésium dans l'acide chlorhydrique en est la version scolaire, où le gaz détone au contact de l'esquille incandescente. Quels que soient le métal et l'acide qui l'ont produit, ce gaz est réellement inflammable."
"Adding acid to chalk or baking soda foams over if the vessel is too small. CO₂ displaces air in enclosed spaces." = "Verser de l'acide sur de la craie ou du bicarbonate de soude fait déborder la mousse si le récipient est trop petit. Le CO₂ chasse l'air dans les espaces confinés."
"Quicklime (CaO) generates enough heat on contact with water to cause burns; adding caustic soda on top is reckless." = "La chaux vive (CaO) dégage assez de chaleur au contact de l'eau pour causer des brûlures ; y ajouter en plus de la soude caustique est imprudent."
"Quicklime (CaO) in water can reach 100 °C and cause severe burns. Always add the solid to the water slowly, never the reverse." = "La chaux vive (CaO) dans l'eau peut atteindre 100 °C et causer de graves brûlures. Verse toujours le solide lentement dans l'eau, jamais l'inverse."
"flying glass and a pressure wave — a sealed vessel that makes gas or warms up is how real labs get hurt" = "des éclats de verre et une onde de choc — un récipient scellé qui produit du gaz ou qui chauffe, voilà comment on se blesse dans un vrai laboratoire"
"on a real bench this one is never smelled directly — fume hood, waft only, and some not even then" = "sur une vraie paillasse, on ne sent jamais celui-ci directement — sous hotte, en éventant seulement, et pour certains pas même cela"
"on a real bench this needs shielding, dosimetry and a licence; safe only because this lab is virtual" = "sur une vraie paillasse, cela exige un blindage, une dosimétrie et une autorisation ; sans danger uniquement parce que ce laboratoire est virtuel"
"Virtual investigation only. Real liquid nitrogen requires trained supervision, eye and face protection, cryogenic gloves, ventilation, and an open pressure-relief path; never seal it in glass or handle it in an unventilated room." = "Étude virtuelle uniquement. L'azote liquide réel exige une supervision formée, une protection des yeux et du visage, des gants cryogéniques, une ventilation et une voie de décompression ouverte ; ne jamais le sceller dans du verre ni le manipuler dans une pièce non ventilée."

