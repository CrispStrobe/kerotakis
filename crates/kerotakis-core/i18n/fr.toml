# ── Added by the i18n leak sweep ─────────────────────────────────────
#
# Everything below was reachable by the catalogue and had no German, so
# the sentence rendered in English inside an otherwise German journal.
# The two chromatogram lines are not new: they were written under
# `[flame]` by mistake, which made their key `flame.chromatographed.…`
# and left `event.chromatographed.…` unanswered. The orphan check could
# not see it, because `flame.*` is looked up by value and therefore
# exempt from that check — a misfiled key hid inside the exemption.

# An empty chromatogram is a result: the run happened and the detector saw
# nothing, so what went past unseparated is the answer (aq-087).
"chromatographed.lv1-nothing-separated" = "Tout ce qui est dissous dans {vessel} traverse directement la colonne avec l'eau — cette méthode n'en sépare rien ({outside_method})."
"chromatographed.lv2-no-peaks" = "{vessel} : chromatogramme — aucun pic{unseen}"
"chromatographed.lv1-spot" = "{name} à {mm} mm de haut"
"chromatographed.lv2-peak" = "{name} à {seconds} s, Rf {rf} ({area} % de l'aire)"
"chromatographed.lv3-method-mixed" = "K = γ∞(eau)/γ∞(alcane) issu du même UNIFAC, avec lequel l'ampoule à décanter effectue aussi sa répartition — sauf pour {curated}, dont le K est une valeur pédagogique vérifiée : un colorant est un glycoside ou un aromatique sulfoné, et une décomposition UNIFAC de celui-ci serait une invention déguisée en calcul"

"consumed.lv2" = "{vessel} : {moles} {name} consommé(s)"
"dissolved.lv2" = "{vessel} : {moles} {name} dissous"
"precipitated.lv2" = "{vessel} : {moles} {name} précipité ↓"
"precipitated.lv2-dry" = "{vessel} : {moles} {name} restés à l'état solide — pas de liquide dans le récipient, donc pas de précipité"

"curdling-changed.lv2" = "{vessel} : {material} — part de caillé {from} % → {to} % ({mass} g de solide au total en flocons visibles)"
"emulsion-changed.lv2" = "{vessel} : {material} dispersé {from} % → {to} % ({volume} mL ; demi-vie de coalescence {half_life} s)"
"hydrolysed.lv2" = "{vessel} : {family} a hydrolysé {mass} de {substrate} en {seconds} s ({percent} % converti)"
