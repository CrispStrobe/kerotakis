# ── The command grammar, in German ──────────────────────────────────
#
# Everything above translates what the bench SAYS. What follows is the
# other direction: the words a learner may TYPE. The canonical script
# stays English — a lesson, a saved session, the operator log and the
# replay cache all carry English lines — so these are an alias layer read
# at parse time, and the bench echoes back the canonical line it
# understood.
#
# The key is the canonical token; the value is a comma-separated list of
# words in this language that mean it. Adding a language adds these
# sections to that language's file and nothing else: the parser reads
# whatever the active locale's catalogue holds and knows no German.
#
# Three rules, enforced by `script::alias_index` and its tests:
#
#   1. An alias maps to exactly ONE canonical token. A word claimed twice
#      is dropped rather than guessed at.
#   2. English wins. A German word that is already an English token of
#      this grammar is dropped — `magnet` and `voltmeter` are spelt the
#      same in both languages, so the German spelling never registers and
#      never has to.
#   3. One word only. An alias with a space in it can never be one token
#      of a command line, so it is skipped.

[script-verb]
new = "neu, neues"
remove = "entfernen, wegräumen, wegraeumen"
# `entsorgen` used to sit on `remove`, which could not take a full
# vessel — the German word for disposal pointed at the verb that
# refuses to dispose of anything. It belongs here.
discard = "entsorgen, ausleeren, wegwerfen, wegschütten, wegschuetten"
add = "zugeben, hinzufügen, hinzufuegen, dazugeben, zufügen, zufuegen"
stock = "bevorraten, vorrat"
heat = "erhitzen, erwärmen, erwaermen, heizen"
cool = "kühlen, kuehlen, abkühlen, abkuehlen"
wait = "warten, abwarten"
ignite = "entzünden, entzuenden, anzünden, anzuenden, zünden, zuenden"
stir = "rühren, ruehren, umrühren, umruehren"
seal = "verschließen, verschliessen, abdichten"
regulate = "regeln, regulieren"
sweep = "spülen, spuelen, durchspülen, durchspuelen"
open = "öffnen, oeffnen, aufmachen"
filter = "filtern, filtrieren"
evaporate = "verdampfen, eindampfen, abdampfen"
decant = "dekantieren, abgießen, abgiessen"
drain = "ablassen, entleeren"
extract = "extrahieren, ausschütteln, ausschuetteln"
