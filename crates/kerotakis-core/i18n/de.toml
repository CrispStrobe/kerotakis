above-hydrogen = "{name} steht in der Spannungsreihe über Wasserstoff (E° {e_self} V gegen 0,000 V für 2H⁺/H₂), verdünnte Säure kann ihm seine Elektronen also nicht abnehmen. Eine oxidierende Säure wie Salpetersäure könnte es über ein anderes Redoxpaar, und das ist nicht modelliert"
insoluble-in-water = "{name} löst sich nicht in Wasser: die geprüfte Löslichkeit beträgt {limit} g pro 100 mL, das liegt unter allem, was in einem Becherglas zu sehen wäre. Es ist noch vollständig vorhanden"

