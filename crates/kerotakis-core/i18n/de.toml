measure = "messen, bestimmen"
chromatograph = "chromatographieren, chromatografieren"
electrolyse = "elektrolysieren"
cell = "zelle, halbzelle"
grind = "mahlen, zermahlen, zerkleinern"
centrifuge = "zentrifugieren, schleudern"
irradiate = "bestrahlen, belichten"
dilute = "verdünnen, verduennen"
