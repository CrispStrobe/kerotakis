# Warum dieser Weg und nicht ein anderer: `vessel::Provenance.routing`.
#
# Diese Zeile steht neben den Zahlen und sagt, welcher Datensatz geantwortet
# hat und warum. Sie war eine fertige englische Passage, mit `format!` in
# den Solvern zusammengeschweißt — derselbe Defekt, den `[inert]` und
# `[not-modeled]` eine Ereignisreihe weiter hatten. Vier Dateien setzen sie
# zusammen: der wässrige Router wählt den Datensatz, der Elektrodendurchgang
# schachtelt diese Wahl in seinen eigenen Satz, und die beiden
# Verbrennungswege sagen je, warum sie geantwortet haben.
#
# Die Klauseln, die eine andere umschließen, führen `{routing}` als Loch:
# eine Sprache, die die Einschränkung voranstellt, schreibt ihre Vorlage
# einfach anders herum und braucht dafür keine Zeile Rust.
# WHICH dataset answered, and WHICH model it applies.
#
# The fifth and last instance of the family `[inert]`, `[not-modeled]`,
# `[scene]` and `[routing]` are the other four of: a NAME with an English
# sentence welded to it, on a field a reader sees. `kero explain` made it
# plain — "Modell: WATEQ Debye-Hückel extension (reliable to about
# I = 1 mol/kgw)", an English parenthesis inside a German line.
#
# **Every `{name}`, `{file}` and `{engine}` here is a NAME and stays as it
# is in every language.** `wateq4f.dat` is a file, `Pitzer` and `Davies`
# are people, `NASA-9` is a polynomial set and `PHREEQC` is a program.
# They travel in text slots the catalogue never looks up, which is exactly
# why they can be named in these templates without risk.
#
# The `{ionic_strength}` and `{fraction}` holes are NUMBERS and arrive with
# the German decimal comma already in them — I = 0,5 mol/kgw. That is the
# half of this defect a translation of the finished string could never
# have reached.
[provenance]
# The dataset half. Two levels: a base clause naming what this lab added
# to the vendored file, wrapped in the clause that is true of all of them.
# The wrapper is written ONCE here for the same reason it is composed once
# in `aqueous.rs` — three flat rows would be three chances to drift.
"dataset.plus-reference-complexes" = "{file} plus Referenztemperatur-Komplexe aus USBM IC 9429"
"dataset.plus-lactate-and-reference-complexes" = "{file} plus geprüftem Lactat und Referenztemperatur-Komplexen aus USBM IC 9429"
"dataset.with-gas-uptake-slice" = "{file}, mit dem geprüften Datenausschnitt zur HBr-Gasaufnahme nach Sander"
"dataset.vendored-usgs" = "{file}, wie vom USGS mitgeliefert"

# The model half. The three activity models are composed in
# `kerotakis-phreeqc/src/dbindex.rs`, which is the only place their
# descriptions exist; the other three are composed where the solver that
# applies them is.
"model.ion-interaction" = "{name}-Modell der spezifischen Ionenwechselwirkung (gültig bei hoher Ionenstärke)"
"model.wateq-debye-huckel" = "{name}-Erweiterung (verlässlich bis etwa I = {ionic_strength} mol/kgw)"
"model.davies" = "{name}-Gleichung (verlässlich bis etwa I = {ionic_strength} mol/kgw)"
"model.water-autoionisation" = "ideal verdünnte Autoprotolyse des Wassers ({engine}-Beziehung für log K mit sechs Koeffizienten)"
"model.curated-complete-combustion" = "vollständige Verbrennung zu CO2 und H2O bei tabellierter Verbrennungswärme, mit einem begrenzenden Sauerstoffanteil von {fraction} für eine geschlossene Grenze"
"model.nasa9-polynomials" = "{name}-Polynome, ideales Gas + reine kondensierte Phasen"
"model.with-feed-tp-fallback" = "{model}; TP-Rückgriff auf die Zuführung bei der ausdrücklich angegebenen Zündzonentemperatur"

[routing]
solvent-relation-only = "keine dargestellte Säure, Base, kein Salz, keine Oberfläche, kein Austauscher, kein Gasübergang und kein reaktiver wässriger Gelöststoff; die Lösungsmittelbeziehung wurde ohne Aufruf von IPhreeqc ausgewertet, das gesamte Zuschauer-Inventar blieb dabei erhalten"
mix-by-fraction = "MIX: zwei gelöste Lösungen anteilig gemischt"
extended-chemistry = "gewählt, weil das Problem Chemie braucht, die dem voreingestellten Datensatz fehlt (organische Liganden, das entliehene Hypochlorit-Paar oder freie Phosphorsäure)"
concentrated-ion-interaction = "gewählt, weil die Lösung konzentriert ist (~{molality} mol/kgw); dort ist das Ionenwechselwirkungsmodell das gültige"
default-inorganic = "der voreingestellte anorganische wässrige Datensatz"
activity-model-fallback = "{routing}; die Eingabe trägt eine möglicherweise konzentrierte Gelöststofffracht (~{molality} mol/kgw, keine gemessene Ionenstärke), aber die Pitzer-Route kann nicht die gesamte angeforderte Chemie darstellen. Dieser Rückgriff auf ein anderes Aktivitätsmodell ist keine validierte Vorhersage für konzentrierte Mischungen"
redox-not-coupled = "die Redox-Elemente hier ließen sich nicht koppeln; jedes wird deshalb in der Oxidationsstufe gezeigt, in der es zugegeben wurde, und sie haben nicht miteinander reagiert — {why}"
slow-couples-held-as-added = "manche Elemente behalten hier die Oxidationsstufe, in der sie zugegeben wurden: nur die Paare, die sich auf der Zeitskala eines Labortischs einstellen, tauschen Elektronen aus, und die langsamen — Sulfat, Nitrat, Carbonat — werden so gehalten, wie sie zugegeben wurden"
with-redox-note = "{routing}. {note}"
second-speciation-for-solvent = "{routing}; die Aktivität des Lösungsmittels stammt NICHT aus diesem Datensatz — er meldet PHREEQCs fest verdrahteten Platzhalter 1 - 0.017*Sum(m) statt eines Modells —, sondern aus einer zweiten Speziation derselben Lösung auf {dataset} ({model}), gestellt ohne Phasen, Gase oder Grenzflächen und allein nach a_w gefragt"
electrode-potential = "{routing}. Das angegebene Potential ist das der Elektrode {reduced}/{oxidised}, nach Nernst über der berechneten Aktivität ({activity}; E° {e0} V, CRC) — ein Metall in Kontakt mit seinem eigenen Ion setzt das Potential, nicht die Luft über dem Becherglas. Die Speziation selbst wurde beim pe der offenen Luft gelöst."
below-the-hydrogen-line = "Das liegt unterhalb der Wasserstofflinie des Wassers selbst ({line} V bei pH {ph}): {name} steht nicht im Gleichgewicht mit dem Wasser, in dem es steht, und ein echtes Voltmeter läse ein Mischpotential ab, das von Raten gesetzt wird, die dieses Labor nicht modelliert"
curated-fuel-table = "NASA CEA führt für diesen Brennstoff keine Thermochemie, deshalb hat die kuratierte Tabelle geantwortet, statt dass das Gefäß an die Modellgrenze stößt"
cea-feed-tp-fallback = "flüssiger Brennstoff nutzte CEAs eigene Thermochemie für die Zuführung; HP hat nicht eingeschlossen, deshalb wurde die Zusammensetzung bei der ausdrücklich angegebenen Zündzonentemperatur gelöst, und die Reaktionsenergie wird weiterhin gesondert angegeben"
dry-solids-and-gases = "gewählt, weil dieses Gefäß trockene Feststoffe und Gase enthält, die die wässrige Rechenmaschine nicht modelliert"

# Where a spill ended up, by the VARIANT that named it.
#
# `SpillDestination` reached every register as `{:?}` — `Bench { zone:
# "react" }`, Rust's own syntax, inside a German sentence. The zone stays
# verbatim because the bench assigns it as an identifier: translating one
# would rename it.
#
# These are worded as DESIGNATORS and carry no article, the way a platform
# is "Gleis 3". The same row has to serve "ergießt sich auf {where}" and
# "Verschüttung auf {where}" and "Material von {where}"; an article would
# have to choose accusative or dative and would be wrong at the others.
[spill-site]
bench = "Labortisch (Bereich {zone})"
tray = "Tablett {tray}"
floor = "Boden (Bereich {zone})"
waste = "Abfallbehälter"

# Which enzyme did it, looked up by the variant's own name.
#
# Nearly the same word in both languages, which is exactly why it was
# never noticed: a German reader was shown `Lactase` and — at lv1, which
# folded the case — `lactase`, which German does not do to a noun.
[enzyme-family]
Lactase = "Laktase"
Protease = "Protease"
Lipase = "Lipase"
Catalase = "Katalase"
Pepsin = "Pepsin"
Bromelain = "Bromelain"
