"flying glass and a pressure wave — sealed systems on a heat source are how real labs get hurt; safe only because this lab is virtual" = "Glassplitter und eine Druckwelle — verschlossene Systeme auf einer Wärmequelle sind der Grund, warum in echten Laboren Menschen verletzt werden; ungefährlich nur, weil dieses Labor virtuell ist"
