# Moved, not invented. `chromatographed.lv3` above carried this clause
# written into its own template, so the `{method}` hole the English grew —
# the one that says whether a K was computed or reviewed — could never
# reach a German reader at all. The German below is that row's own words,
# lifted out of it.
#
# One word IS changed, and deliberately: the row said "γ∞(water)/γ∞(alkane)"
# while `chromatographed.lv3-method-mixed`, which fills the SAME hole when
# a curated K is on the column, says "γ∞(Wasser)/γ∞(Alkan)". Two spellings
# for one formula was invisible while only one of them could ever render;
# now that they are alternatives at one hole, a German reader would see the
# sentence spell its own symbols two ways depending on the dye.
"chromatographed.lv3-method-unifac" = "K = γ∞(Wasser)/γ∞(Alkan) aus demselben UNIFAC, nach dem auch der Scheidetrichter verteilt"

