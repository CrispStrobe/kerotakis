# The fixed gap reasons used to live here too. Eighteen of them, of which
# THIRTEEN reached a German learner in English while the table reported
# itself complete — it was complete, over the rows it had, which is the
# failure mode every gate in this repo exists for. They are `[not-modeled]`
# rows now, keyed by the PLACE they are said (I18N-10), so rewording the
# English no longer orphans the German; this section keeps the German they
# already had, moved rather than rewritten.
#
# Four more left on the commit that finished I18N-10: the ice and boiling
# verdicts, and the two reached by STRIPPING the species name off the end
# of the English. They are `[not-modeled]` rows now —
# `ice-is-not-a-solution`, `boiling-is-not-settled`,
# `no-dissolution-solver`, `dissolves-unspeciated` — and the suffix parse
# in `localize_refusal`, which survives as a shim for sessions saved
# before I18N-10, fills those same keys. One German row, two paths to it.

# What the bench REFUSED to do, keyed by the place the refusal is written.
#
# Distinct from `[refusal]` above, and the difference is the whole point.
# `[refusal]` is keyed by an English sentence, so it can only ever reach the
# refusals that interpolate nothing. These are keyed by a PLACE — the arm of
# `BenchError` that said no — so the holes are filled after the sentence is
# chosen, and a language that wants the vessel first may put it first.
#
# `{vessel}` is a NAME (v1, v2) and never a number: it keeps its point.
