# Flame-test colours, by their English. The colour IS the result of a
# flame test — leaving it in English under a German sentence loses the
# only word that mattered. `flame_colours_are_translated` walks the
# registry so a new one cannot be added without German.
# What a precipitate or a plating LOOKS like, by its English.
#
# These are `SpeciesData.appearance` and they were dropped into a
# translated sentence verbatim: "Ein white Feststoff erscheint am Boden".
# The colour is what that sentence is FOR, so English there loses the
# observation and keeps only the grammar.
#
# Uninflected on purpose. German adjectives before a noun take an ending
# that depends on the noun, and "weißes kristallines Pulver" cannot take
# one at all — so the two sentences that use these carry the word as an
# apposition in parentheses instead of as an attribute, and one form fits
# every site. `every_appearance_word_has_german` walks the registry.
