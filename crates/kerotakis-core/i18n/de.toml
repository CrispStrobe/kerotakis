test = "prüfen, pruefen, testen, nachweisen"
particles = "teilchen, teilchenansicht"
smell = "riechen, schnuppern"
# The verbs the parser accepts without listing them in `VERBS`, because
# each is a second spelling of a row that is already there.
look = "ansehen, betrachten, anschauen, schauen, hinsehen"
