# The small words that hold a command together.
#
# `above` and `below` are deliberately absent: their German is `über` and
# `unter`, and `über` is already the preposition in `heat v1 40kJ über
# Kerze`. One word, two canonical meanings, is exactly the ambiguity rule
# 1 refuses — so a redox endpoint is written with the symbol every
# language shares, `until pe > 8`.
[script-word]
until = "bis"
into = "in"
from = "von, aus"
to = "nach"
steps = "schritte"
stages = "stufen, böden, boeden"
max = "maximal, höchstens, hoechstens"
persists = "bleibt, standhält, standhaelt"
colour = "farbe, farbumschlag"
on = "auf"
with = "mit"

# What the bench says when a first word is no verb it knows. The English
# original names `help`; this one names the verbs themselves, because a
# learner who has just typed a German word the parser refused has no
# reason to believe an English help screen will answer them.
[script]
# `das Labor` because that is what the interface bundle calls the bench
# (`web/app/src/locales/de.json`, "the bench"); two German words for
# one object is how a translation starts reading like two products.
unknown-verb = "unbekannter Befehl '{word}' — das Labor kennt diese Verben: {verbs}"


# What the SCENE says after the observation (I18N-11).
#
# `appearance.rs` has composed translatable clauses since I18N-7, and
# `scene.rs` then appended its own finished English sentences to them with
# a bare `format!` each. That was not a cosmetic leftover: the web bench
# paints its caption and its accessibility text from the SCENE, not from
# the rendered notebook, so every one of these reached a German reader in
# English while the sentence they were glued to was German.
#
# Each is its own sentence rather than a clause, which is why they live
# beside `[look]` rather than in it — see `SceneVessel::notes`.
[scene]
# Three templates for one fact, because German takes a different case for
# water going in and water coming out, and "into" is not a word that can be
# swapped in place. The direction is a property of the sentence.
osmosis-in = "Osmose hat im Unterrichtsmodell insgesamt {water} mol ({mass} g) Wasser in {material} hinein transportiert; Objektgröße, Membranmechanik und Endgleichgewicht sind nicht modelliert."
osmosis-out = "Osmose hat im Unterrichtsmodell insgesamt {water} mol ({mass} g) Wasser aus {material} heraus transportiert; Objektgröße, Membranmechanik und Endgleichgewicht sind nicht modelliert."
osmosis-either = "Osmose hat im Unterrichtsmodell insgesamt {water} mol ({mass} g) Wasser in {material} hinein oder aus ihm heraus transportiert; Objektgröße, Membranmechanik und Endgleichgewicht sind nicht modelliert."
gel = "Ein durchscheinendes, zusammenhängendes Gel enthält {percent} % des {polymer}-Polymers."
# The two coating sentences take the German `web/app/src/locales/de.json`
# already carries for them, word for word. The web looked them up whole —
# they have no holes, so that worked — and a second, different German for
# the same sentence is how one product starts reading like two.
coating-paint = "Das lackierte Eisen hat einen vollständigen schützenden Lackfilm; Kratzer werden nicht modelliert."
coating-passive-film = "Der Edelstahl hat eine transparente schützende Passivschicht; ihre Dicke ist nicht maßstabsgetreu dargestellt."
corrosion = "{percent} % des erfassten {metal} sind derzeit in seinem modellierten Oxid gebunden. Direkt zugegebenes Oxid ist von hier entstandenem Oxid nicht zu unterscheiden; das ist keine Korrosionsrate, keine Vorgeschichte, keine Schichtdicke und kein Bedeckungsgrad."
swelling = "Das superabsorbierende Netzwerk hält {water} g Wasser fest ({ratio}-mal seine Trockenmasse)."
chemiluminescence = "Das Luminol-System leuchtet blau mit der relativen Intensität {intensity}; die geschätzte Halbwertszeit beträgt hier {half_life} Sekunden."
enzyme-conversion = "Das begrenzte Enzymmodell meldet {percent} % Umsatz von {substrate} in {material}."
food-colour-spread = "Lebensmittelfarbe hat sich in Schlieren über die Milchoberfläche ausgebreitet."
food-colour-resting = "Tropfen Lebensmittelfarbe liegen auf der Milchoberfläche."
adsorption = "{percent} % des erfassten {sorbate} sind an {sorbent} gebunden; {dissolved} mg bleiben gelöst. Das ist eine Gleichgewichtsverteilung, keine Entfernungsrate."
partition = "Im Gleichgewicht sind {lower_percent} % des modellierten {species} in der unteren {lower}-Phase und {upper_percent} % in der oberen {upper}-Phase."
emulsion = "Durch das Rühren sind {percent} % von {material} als trübe Tröpfchen verteilt; der Rest steht weiterhin über dem Wasser."
# The colour goes BESIDE the noun, not in front of it, for the reason
# `look.coloured` gives: a German attributive adjective takes the noun's
# gender and ending, so "{colour}e Schicht" is right for gelb and wrong for
# orange and rosa. That decision belongs in this file, never in the Rust.
material-layer = "{material} bildet eine eigene Schicht ({colour}) über dem Wasser."
vessel-contains = "Im Gefäß ist {material}."
curdling = "Weiche Flocken mit {mass} g modelliertem Feststoff haben sich aus {material} abgeschieden; zurück bleibt trübe Molke."
foam-overflow = "Schaum läuft über den Rand."
foam-standing = "Schaum steht über der Flüssigkeit."

# Looked up by VALUE, the way `[species]` and `[material]` are: the scene
# names the polymer a gel was made from, and the substrate an enzyme acted
# on, and both are short labels from a reviewed table rather than prose.
[polymer]
# PVA is PVA in German. It is here so that a language where it is not can
# say so without a line of Rust.
PVA = "PVA"

[substrate]
"lactose in milk" = "Lactose in Milch"
"gelatine protein" = "Gelatineprotein"
"albumin protein" = "Albuminprotein"
"triglycerides in vegetable oil" = "Triglyceride in Pflanzenöl"
"muscle protein" = "Muskelprotein"


# What the bench has NOT modelled, keyed by the place the refusal is
# written (I18N-10).
#
# Distinct from `[refusal]` above, and for the reason that section's own
# comment gives: `[refusal]` is keyed by an English SENTENCE, so it can
# only ever reach the gaps that interpolate nothing — and most of them
# interpolate a species, a temperature or a list. These are keyed by the
# PLACE, the holes are filled after the sentence is chosen, and the number
# in them arrives with the reader's decimal separator.
#
# A site that has not been converted yet carries `reason: None` and still
# falls back to `[refusal]`; `tools/engine-locale-lint.py` counts how many
# of each there are, with the denominator read out of the Rust.
[not-modeled]
# Tranche two: the gaps with a HOLE in them, which is why `[refusal]`
# could never reach any of these. New German, authored.
cooling-below-absolute-zero = "dieses Gefäß konnte bis zum absoluten Nullpunkt nur {available} kJ abgeben, verlangt wurden {asked} kJ. Hier ist kein Kühlmittel modelliert — nichts legt fest, wie kalt die Umgebung ist — der Rest konnte also schlicht nicht entzogen werden. Die Wärme, die ein Stoff hält, wird über seine eigene Wärmekapazität integriert, wo das Verzeichnis eine führt; unterhalb von etwa 200 K ist aber selbst eine tabellierte Kurve am Ende der Tabelle und wird flach gehalten, diese Untergrenze ist also eine Modellgrenze und keine Messung"
co-evaporation = "die gemeinsame Verdampfung von {liquids} braucht ein Dampf-Flüssigkeits-Gleichgewicht — das ist die Aufgabe von `distil`; entfernt wurde nur das Wasser"
no-bubble-point = "einen Siedebeginn für dieses Gemisch bei {pressure} kPa — außerhalb der angepassten Antoine-Bereiche"
distribution-coefficient-temperature = "der Verteilungskoeffizient von {species} für {upper}/{lower} ist nur bei {reviewed} K geprüft (Toleranz +/- {tolerance} K); dieses Gefäß ist bei {actual} K"
not-an-extracting-solvent = "{solvent} ist bei Raumbedingungen kein flüssiges Extraktionsmittel"
water-distribution-coefficient-temperature = "der Verteilungskoeffizient von {solute} für {solvent}/Wasser ist nur bei {reviewed} K geprüft (Toleranz +/- {tolerance} K); dieses Gefäß ist bei {actual} K"
loading-exceeds-capacity = "die Beladung mit {solute} übersteigt die geprüfte Kapazität von Wasser/{solvent}, die sich aus seiner wässrigen Löslichkeit von {solubility} mol/L bei {temperature} K ergibt; ein dauerhaftes Fest-Flüssig-Organisch-Dreiphasengleichgewicht ist noch nicht modelliert"
no-distribution-coefficient = "kein geprüfter Verteilungskoeffizient {solvent}/Wasser für {solutes}"
any-solute-here = "irgendeinen gelösten Stoff in diesem Gefäß"
extraction-without-coefficient = "die Extraktion hat die unterstützten gelösten Stoffe bewegt, aber es gibt keinen geprüften Verteilungskoeffizienten {solvent}/Wasser für {solutes}"
no-reviewed-density = "die Dichte von {species} — das Verzeichnis führt keine geprüfte Dichte dafür, das Stück hat hier also eine Masse und keine Größe"
no-reviewed-bulk-density = "die Dichte von {material} — das Rezept führt keine geprüfte Schüttdichte"
density-of-a-mixture = "eine einzelne Dichte für dieses Gefäß: es enthält {contents}, und eine Dichte gehört zu einem Stoff und nicht zu einem Gemisch daraus. Wiege sie einzeln"
incomplete-absorbance = "die vollständige Absorption ist nicht verfügbar: für {species} liegt kein Absorptionsspektrum vor"
no-group-decomposition = "die Säule hat keine kuratierte Gruppenzerlegung für {species} — eine echte Säule würde diese trennen, das ist also eine Lücke im Modell und kein Ergebnis"
nothing-to-electrolyse = "hier lässt sich nichts elektrolysieren: {why}"
electrolysis-needs-an-electrolyte = "das Modell der Lösungsmittelelektrolyse braucht einen gelösten Leitelektrolyten; reines Wasser hat eine endliche, aber sehr geringe Leitfähigkeit, und die Spannung, der Elektrodenabstand und die Überspannungen, die für den geforderten Strom nötig wären, sind nicht modelliert"
no-curated-nuclide = "kein kuratiertes Nuklid '{nuclide}' — die Auswahl für den Unterricht: {known}"
no-curated-reaction = "keine kuratierte Reaktion mit dem Namen '{reaction}' — kuratiert: {known}"
non-finite-extent = "{reaction} lieferte eine nicht endliche Reaktionslaufzahl; es wurde kein Umsatz angewendet"
no-capacity-either-direction = "Kein Umsatz für {reaction}: weder die Hin- noch die Rückreaktion stellt Kapazität oberhalb der Nullumsatz-Toleranz von 1e-12 mol bereit"
no-limiting-reactant = "Kein vollständiger Umsatz für {reaction}: ein limitierender Reaktant fehlt, ist verbraucht, oder seine Kapazität liegt innerhalb der Nullumsatz-Toleranz von 1e-12 mol"
partial-freezing-boundary = "die Modellgrenze für teilweises Gefrieren bei {temperature} °C: unterhalb dieses Punktes sind Salzkristallisation und ein stoffspezifisches eutektisches Phasendiagramm nötig, deshalb extrapoliert das Labor keine kolligative Beziehung, deren Lösungsmittelaktivität es nicht mehr einordnen kann"
aqueous-temperature-ceiling = "die Temperaturobergrenze des wässrigen Modells bei {temperature} °C: die Temperaturausdrücke der mitgelieferten thermodynamischen Datenbanken enden dort, deshalb wird diese Lösung als nicht charakterisiert gemeldet statt extrapoliert"
mostly-organic-solvent = "ein Mischlösungsmittel, das überwiegend organisch ist (Wasser macht {percent} % der Flüssigkeit aus): die mitgelieferten Aktivitätsmodelle setzen Wasser als Lösungsmittel voraus, und in dieser dielektrischen Umgebung gelten ihre Gleichgewichtskonstanten nicht, deshalb wird die Ionenspeziation hier als nicht charakterisiert gemeldet"
combustion-no-solver = "ob dieser Inhalt brennt: kein angebundener Löser modelliert die Verbrennung dafür, das Labor kann es also weder bejahen noch verneinen"
heating-an-empty-vessel = "Erwärmen eines leeren Gefäßes (Wärmekapazität des Gefäßes nicht modelliert)"
cooling-an-empty-vessel = "Abkühlen eines leeren Gefäßes (Wärmekapazität des Gefäßes nicht modelliert)"
nothing-to-evaporate = "nichts zu verdampfen — kein Wasser im Gefäß"
distil-without-water-or-ethanol = "Destillation eines Gefäßes ohne flüssiges Wasser oder Ethanol — für andere flüchtige Flüssigkeiten müssen erst die Antoine-Konstanten kuratiert werden"
drain-a-single-phase-liquid = "Ablassen einer einphasigen Flüssigkeit — der Trichter trennt nur, was die Thermodynamik bereits in Schichten aufgeteilt hat"
staged-extraction-needs-fresh-aqueous = "Eine frische stufenweise Extraktion braucht zu Beginn genau eine wässrige Flüssigphase; eine vorhandene organische Schicht muss zuerst abgelassen werden"
extraction-needs-water-and-solvent = "Eine Flüssig-Flüssig-Extraktion braucht eine Wasserphase und ein flüssiges Extraktionsmittel mit bekanntem Molvolumen"
ph-meter-has-no-solution = "das pH-Meter zeigt nichts an — in diesem Gefäß wurde keine wässrige Lösung charakterisiert"
volume-meter-on-an-open-vessel = "das Volumenmessgerät liest den Gasraum eines verschlossenen Gefäßes, und dieses hier ist offen — verschließe es, damit das Gas ein gemessenes Volumen bekommt. Das Volumen der Flüssigkeit selbst steht in der Gefäßzeile."
conductivity-on-a-dry-solid = "das Leitfähigkeitsmessgerät liegt an einem trockenen Feststoff, für den das Verzeichnis keinen elektrischen Widerstand führt — die Messung braucht einen geprüften Wert, keine Schätzung"
conductivity-has-no-solution = "das Leitfähigkeitsmessgerät zeigt nichts an — es wurde keine wässrige Lösung charakterisiert"
density-of-the-dissolved-ions = "den Anteil der gelösten Ionen an dieser Dichte: jedes Ion im Verzeichnis trägt die Dichte von Wasser als strukturellen Vorgabewert statt eines gemessenen, deshalb liest sich eine Salzlösung wie das Wasser, aus dem sie gemacht wurde. Der Wert des Lösungsmittels stimmt, der der gelösten Stoffe fehlt"
density-of-an-empty-vessel = "eine Dichte — das Gefäß ist leer, es gibt nichts, worin das Aräometer schwimmen könnte, und nichts zu wiegen"
spectrophotometer-has-no-solution = "keine wässrige Lösung für das Spektralphotometer"
chromatography-needs-an-aqueous-sample = "die Chromatographie braucht eine wässrige Probe — die mobile Phase der Säule ist Wasser"
chromatography-needs-a-solute = "die Chromatographie braucht etwas Gelöstes zum Aufgeben — dieses Gefäß enthält nur seine mobile Phase"
titration-endpoint-not-refined = "Die pH-Überschreitung wurde eingegrenzt, aber die Endpunktverfeinerung konvergierte nicht auf 0,0001 pH-Einheiten; der nächstgelegene berechnete Zustand wird beibehalten"
titration-needs-an-aqueous-solver = "die Titration braucht einen wässrigen Löser, um nach jeder Zugabe den pH-Wert zu berechnen — es ist keiner angebunden"
kinetic-outcome-needs-a-time-model = "Ein kinetisches Ergebnis erfordert ein zugeordnetes Zeitmodell; ein Umsatz von null weist kein Gleichgewicht nach"
fizz-rate-near-barrier = "wie schnell {name} sprudelt: die Triebkraft übersteigt die Wasserstoff-Überspannung an {name} nur um {margin} V, und eine Geschwindigkeit so dicht an ihrer Barriere berechnet dieses Labor nicht — es reagiert, langsam"
stays-as-the-metal = "{name} bleibt als Metall liegen: nichts Gelöstes steht hier in der Spannungsreihe unter ihm. Seine langsame Reaktion mit dem Wasser selbst — Wasserstoff über Stunden, eine passivierende Hydroxidhaut — ist eine Geschwindigkeit, die dieses Labor nicht modelliert"
no-haloalkane = "kein Halogenalkan-Substrat im Gefäß — die Selektivitätstabelle deckt Bromethan (primär) und tert-Butylbromid (tertiär) ab"
no-nucleophile = "kein erkanntes Nucleophil im Gefäß — die Selektivitätstabelle deckt NaOH (stark) und Wasser (schwach) ab"
# The two classes go in brackets beside the noun rather than in front of
# it: a German adjective declines to the noun it qualifies, and "Methyl"
# does not decline at all. Same decision as `look.coloured`, same reason.
no-selectivity-rule = "keine Selektivitätsregel für Substrat ({substrate}) + Nucleophil ({nucleophile}) bei {temperature} °C — außerhalb der geprüften Tabelle"
no-product-table = "die Selektivität sagt {mechanism} für {substrate} + {nucleophile} voraus, aber es gibt keinen Eintrag in der Produkttabelle — das ist eine Lücke in der Implementierung"
nothing-for-verb = "für {verb} ist nichts da — es braucht {needs} zusammen im Gefäß"
gas-already-gone = "nichts zu prüfen — das Gas ist entwichen, während es entstand; fange es zuerst in einem verschlossenen Gefäß auf und führe dann {test} durch"
boundary-does-not-retain-gas = "die Gefäßgrenze hält kein Gas zurück — verschließe es zuerst und führe dann {test} durch"
no-henry-path-to-headspace = "{test} liest den Gasraum, und dieses Labor kennt keinen Weg aus gelöstem {target} dorthin (kein geprüfter Henry-Koeffizient) — {dissolved} mol liegen in der Flüssigkeit vor, und `smell` meldet sie von dort, aber der Gasraum, den der Test liest, bleibt leer"
finite-acid-inventory = "{reaction} verbraucht einen endlichen Säurevorrat. Innerhalb dieses Integrationsintervalls wird der Aktivitätskoeffizient auf seinem Anfangswert festgehalten, während die Protonenkonzentration abnimmt; das Säure-Base-Gleichgewicht wird zwischen den Intervallen neu gelöst und nicht fortlaufend an dieses Geschwindigkeitsgesetz gekoppelt."
family-declined-at-gate = "{family} v{version} passte, wurde aber an {gate} abgelehnt: {why}. Warten liefert keine fehlende Reaktionsgeschwindigkeit und erfüllt auch kein Bedingungstor"

# ── I18N-10, tranche three: the last twenty-six ────────────────────────
#
# Four of these are MOVED, not written: the ice verdict, the boiling
# verdict and the two the `[refusal]` table used to reach by stripping the
# species name off the end of the English. A second German for a sentence
# that already had one is how one product starts reading like two.

# The solvent-activity range, one key per ROUTE. The two sentences differ
# in what they say, not only in which route they name, so they are two
# rows rather than one with a `{route}` hole doing the work.
activity-range-ion-interaction = "der angegebene Gültigkeitsbereich des Lösungsmittel-Aktivitätsmodells, auf dem dieser Übergang beruht ({route}): der Ionenwechselwirkungs-Datensatz ist bis etwa I = {fitted} mol/kgw angepasst, was diese Lösung bei {ceiling} mol/kgw gelöster Teilchen erreicht — sie liegt bei {molality}"
activity-range-ideal = "der angegebene Gültigkeitsbereich des Lösungsmittel-Aktivitätsmodells, auf dem dieser Übergang beruht ({route}): da kein Aktivitätsmodell diese Lösung abdeckt, rechnet das Labor nach dem Raoultschen Gesetz, und das trägt es nicht über {ceiling} mol/kgw gelöster Teilchen hinaus — diese Lösung liegt bei {molality}"
partial-freezing-cap = "die Modellgrenze für teilweises Gefrieren bei {temperature} °C: weiteres Abkühlen erfordert Salzkristallisation und ein stoffspezifisches eutektisches Phasendiagramm"
# `{boundary}` is one of the three rows above, whole. A subordinate
# clause, not an interpolated fragment: a language that wants it first can
# put it first.
brine-retained-at-boundary = "reines Eis wurde entfernt und die verbleibende Sole behalten, doch weiteres Abkühlen stößt auf {boundary}"
ice-is-not-a-solution = "das Wasser in diesem Gefäß ist Eis, und Eis ist keine Lösung: pH-Wert, Ionenstärke und Speziesverteilung beschreiben allesamt Teilchen, die in einer Flüssigkeit gelöst sind — solange das Lösungsmittel gefroren ist, wird keine dieser Größen angegeben"
boiling-is-not-settled = "das Wasser siedet und entweicht als Dampf, sodass sich das Gelöste im Rest vor Ihren Augen aufkonzentriert: Diese Werkbank meldet den Phasenübergang statt eines festen pH-Werts für eine Zusammensetzung, die sich noch ändert"
stranded-solutes = "das letzte Wasser ist fort, und {names} werden weiterhin als gelöst geführt — ein Zustand, in dem ein Becherglas nicht sein kann. Woraus sie auskristallisieren, lässt sich aus den Ionen allein nicht entscheiden, deshalb rät das Labor die Feststoffe nicht"
unavailable-crystallisation = "die Kristallisation von {salt}: {dissolved} mol sind gelöst, gegen eine Grenze von {capacity} mol bei dieser Temperatur, und {why}"
no-dissolution-solver = "{name} ist mit einer Flüssigkeit in Kontakt; kein angebundener Löser modelliert diese Auflösung oder Reaktion"
dissolves-unspeciated = "{name} löst sich, aber kein angebundener Löser berechnet die Speziesverteilung: Der Stoff trägt hier weder zum pH-Wert noch zur Ionenstärke bei; diese Werte gelten nur für die übrigen Stoffe im Becherglas"
proton-consuming-kinetics = "{reaction}: Protonenverbrauchende Kinetik erfordert ein gekoppeltes Gleichgewicht aus schwacher Säure und Puffer: die gemessene freie Protonenaktivität ist nicht der titrierbare Säurevorrat. Dieser ungekoppelte Geschwindigkeitsschritt wird zurückgehalten, statt den Puffer als festen Säurevorrat zu behandeln"
template-refused = "die Reaktionsvorlage der Familie {family} ließ sich nicht anwenden: {detail}"
unregistered-condensed-species = "nicht verzeichnete kondensierte Spezies {key}"
no-reviewed-still-properties = "die Destillation braucht geprüfte Dampfdruck- und Verdampfungswärme-Werte für {key}; es wurde keine Komponente übertragen"
outside-constant-latent-domain = "die Mehrkomponentendestillation liegt außerhalb des begrenzten Clausius-Clapeyron-Bereichs mit konstanter Verdampfungswärme (innerhalb von 40 K um jeden Normalsiedepunkt, 1–128 ideale Stufen); es wurde keine Komponente übertragen"
titration-pe-never-pinned = "die Bürette lief bis zu ihrer Grenze von {steps} Schritten, ohne pe {target} zu erreichen: an keiner Stelle dieser Titration wurde ein Potential festgelegt. Liegt nur eine Oxidationsstufe eines Redoxpaars im Kolben, hat die Elektronenbilanz keine Wurzel — pe ist dann unbestimmt und nicht etwa niedrig. Gib die andere Hälfte eines Redoxpaars zu oder titriere stattdessen auf eine Farbe"
titration-pe-out-of-reach = "die Bürette lief bis zu ihrer Grenze von {steps} Schritten, ohne pe {target} zu erreichen; das zuletzt in diesem Kolben festgelegte Potential war {last}"
# `{colour}` stands predicatively after "ist noch immer", where a German
# adjective does NOT decline — so the colour word goes in plain here, and
# `look.coloured`'s bracket trick is not needed.
titration-colour-persists = "die Bürette lief bis zu ihrer Grenze von {steps} Schritten, und die Flüssigkeit ist noch immer {colour}: entweder liegt der Endpunkt weiter als {steps} Zugaben entfernt, oder nichts hier führt ein kuratiertes Absorptionsspektrum, das ein Auge lesen könnte. Erhöhe `max` oder titriere stattdessen auf einen pH- oder pe-Wert"
kinetic-law-not-routed = "das Ergebnismodell kinetic_law ({kinetics}) ist noch nicht angebunden — BRD-050 verantwortet die Zulassung eines Geschwindigkeitsgesetzes aus einer Familie"
unequal-stoichiometric-sums = "das Gleichgewichtsmodell braucht gleiche stöchiometrische Summen, damit sich das Volumen herauskürzt; dieser Eintrag hat {in_sum} hinein und {out_sum} heraus"
supersaturated-no-registry-solid = "die Lösung ist gegenüber {phases} übersättigt. Diese Festphasen stehen in {database}.dat, haben aber keinen passenden Feststoff im Verzeichnis dieses Labors; ihre Fällung ist deshalb nicht enthalten. Übersättigung allein entscheidet weder, ob sich ein Niederschlag bildet, noch wie schnell"
supersaturated-below-formation-temperature = "die Lösung ist gegenüber {phases} übersättigt; unterhalb der Bildungstemperatur-Schwelle des Verzeichnisses bei {temperature} °C wird sie bewusst zurückgehalten. Das ist eine kuratierte Metastabilitätsgrenze, keine berechnete Keimbildungs- oder Wachstumsgeschwindigkeit"
supersaturated-solid-not-offered = "die Lösung ist gegenüber {phases} übersättigt. Passende Feststoffe gibt es im Verzeichnis dieses Labors, sie wurden in dieser wässrigen Gleichgewichtsaufgabe aber nicht angeboten; Phasenauswahl, Beschränkungen der Oxidationsstufe oder die Zuständigkeit eines anderen Modells können sie ausschließen. Ihre Bildung und deren Zeitverlauf sagen diese Sättigungsindizes nicht voraus"
saturation-index-is-a-gas = "{phases} sind Sättigungsindizes der Gasphase, bezogen auf die Referenzfugazität der thermodynamischen Datenbank, und keine fehlenden Niederschläge. Lies sie zusammen mit der Gasgrenze und dem Druck dieses Gefäßes; für sich allein sagen diese Indizes weder Blasenbildung noch Gasübergangszeiten voraus"
saturation-index-unclassified = "für {phases} werden Sättigungsindizes gemeldet, es gibt aber keine Phasendefinition im gewählten Diagnoseindex {database}; ihr Phasentyp und der Grund ihres Ausschlusses lassen sich nicht einordnen"
# Two whole sentences, each its own row, joined by `look.sentence-join`.
at-the-reference-temperature = "Die Lösung liegt bei der tabellierten Referenztemperatur."
away-from-the-reference-temperature = "Bei dieser Gefäßtemperatur sind das Näherungen für die Referenztemperatur, keine geprüften temperaturabhängigen Konstanten."
usbm-reference-complexes = "Die Speziesverteilung der Kupfer-Ammin- und Eisen-Thiocyanat-Komplexe verwendet die gemeinfreien kumulativen Konstanten aus USBM IC 9429 bei 25 °C und Ionenstärke null, mit den Aktivitätskorrekturen der gewählten Datenbank. {temperature} Bildungsenthalpien der Komplexe, Geschwindigkeitsgesetze und Komplexspektren liefert dieser Datenausschnitt nicht; Reaktionswärme und Farbe sind daher unvollständig, wo diese Beiträge ins Gewicht fallen."
thiocyanate-slice = "Thiocyanat wird als erhaltener SCN−-Ligand behandelt. Die Protonierung zu HNCS, Ligandenredoxvorgänge und die Bindung an andere Metalle als Fe(III) deckt dieser Ausschnitt nicht ab; insbesondere ist er kein vollständiges Thiocyanat-Modell für starke Säuren. KSCN ist ein wässriges analytisches Äquivalent, kein Modell für die Auflösung des Feststoffs."
hbr-at-the-reference-temperature = "Dieser Zustand liegt bei der Referenztemperatur von 25 °C."
hbr-away-from-the-reference-temperature = "Abseits von 25 °C wird hier eine lokale van-'t-Hoff-Näherung mit konstanter Enthalpie verwendet, keine geprüfte Korrelation über einen weiten Temperaturbereich."
hbr-gas-uptake = "Die HBr-Gasaufnahme verwendet die dissoziative Henry-Konstante aus der CC-BY-Sammlung von Sander, umgerechnet von der Konzentration auf den verdünnt-molalen Standardzustand. Die Reaktionsenthalpie stammt aus deren lokaler Temperatursteigung und einer Korrektur für die Lösungsmitteldichte, nicht aus einer eigenständigen kalorimetrischen Messung. {temperature} Der Gasübergang ist eine Gleichgewichtsgrenze, kein zeitabhängiges Absorptionsmodell."
finite-gas-dose = "{species}, endliche Gasdosis: die Aufnahme ist eine augenblickliche Gleichgewichtsrechnung, keine Stoffübergangsgeschwindigkeit. Nach der Dosis tauscht nur ausdrücklich eingerichtete Atmosphärenspezies mit einem äußeren Reservoir aus; aus der Dosis wird kein neues Reservoir abgeleitet. Wartezeit parametrisiert das Ausgasen nicht"
redox-coupling-stood-down = "diese Elemente haben nicht miteinander reagiert — sie werden in den Oxidationsstufen gezeigt, in denen sie zugegeben wurden, und das ist nicht, was das Becherglas täte: {why}"
unnameable-oxidation-state = "{moles} mol haben sich als {column} eingestellt, eine Oxidationsstufe, für die dieses Labor keinen Namen hat — sie steht nicht im Bestand des Gefäßes, es ist also etwas weniger von diesem Element im Glas, als hineingegeben wurde"
unnameable-product = "die Familie {family} hat eine Struktur erzeugt, die das Verzeichnis nicht benennen kann ({smiles}); die Menge des Benennbaren ist die Grenze, und sie zu erweitern ist eine Aufgabe für das Verzeichnis und kein stilles Weglassen"
dissolved-and-unspeciated = "{name} ist gelöst und ohne Speziesverteilung: {why}"
no-component-mapping = "{name} ist ein ionischer gelöster Stoff ohne Zuordnung zu einer wässrigen Komponente in diesem Labor. Seine Ionenverteilung, Acidität, Leitfähigkeit und Reaktionen sind nicht enthalten; jeder Lösungswert beschreibt nur die abgebildeten Komponenten, nicht die vollständige Mischung."
unspeciated-acidity = "diese Lösung enthält eine Säure, deren Acidität nicht modelliert ist: {why}. Der angezeigte pH-Wert ist der pH-Wert alles Übrigen im Glas, und die wirkliche Lösung ist saurer, als er angibt"
milk-buffer-lower-bound = "diese Milch wurde auf pH {ph} angesäuert, und der Wert ist eine UNTERE SCHRANKE — das wirkliche Becherglas ist milder. {assumption} (die vollständige Annahme des Rezepts steht in `explain material whole_milk`)"

