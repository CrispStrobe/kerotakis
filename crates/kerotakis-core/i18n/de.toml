# The engine's own words, in German.
#
# One file per language. Adding French means adding `fr.toml` beside this
# one and a single line in the registry in src/i18n.rs — no existing
# translation is touched, so two translators never edit the same file.
#
# Keys are dotted paths naming WHERE the phrase is said, not what it says,
# so a reworded English source does not orphan its translations.
#
# The English original stays at the call site in Rust: it is the source
# text, it keeps the line readable without opening this file, and it is
# what shows when a language has no entry for a key. A missing key here is
# therefore a fallback, never a blank.

[vessel]
open = ", zur Atmosphäre offen"
sealed-before = ", verschlossen, "
sealed-after = " mL Gasraum bei "
pressure-controlled-before = ", druckgeregelt, "
swept-before = ", stickstoffgespült bei "
liquid = "Flüssigkeit"
empty = "    (leer)"
redox = "Redox"
speciation = "    Speziation (mol/kgw · Aktivität · γ):"
mixed-crystal = "Mischkristall"
ph = "pH-Wert"

# The glassware. A vessel absent from here keeps its English name rather
# than vanishing — better a word we have than a word we do not.
[glassware]
beaker = "Becherglas"
flask = "Kolben"
"conical flask" = "Erlenmeyerkolben"
"volumetric flask" = "Messkolben"
"round-bottom flask" = "Rundkolben"
"test tube" = "Reagenzglas"
"measuring cylinder" = "Messzylinder"
burette = "Bürette"
pipette = "Pipette"
crucible = "Tiegel"
"evaporating basin" = "Abdampfschale"
calorimeter = "Kalorimeter"
"gas syringe" = "Kolbenprober"
"watch glass" = "Uhrglas"
funnel = "Trichter"
still = "Destille"
cuvette = "Küvette"
column = "Säule"

# The four phases. `{:?}` printed "Liquid" in every language.
[phase]
aqueous = "gelöst"
liquid = "flüssig"
solid = "fest"
gas = "gasförmig"

# Species the engine names. Only what is actually written here is
# translated; anything absent reads in English inside a German line, which
# is better than a formula nobody asked for.
[species]
water = "Wasser"
ethanol = "Ethanol"
"sodium chloride" = "Natriumchlorid"
"silver nitrate" = "Silbernitrat"
"silver chloride" = "Silberchlorid"
"hydrogen peroxide" = "Wasserstoffperoxid"
"sodium hydroxide" = "Natriumhydroxid"
"hydrochloric acid" = "Salzsäure"
"sulfuric acid" = "Schwefelsäure"
"acetic acid" = "Essigsäure"
"sodium acetate" = "Natriumacetat"
"carbon dioxide" = "Kohlenstoffdioxid"
"calcium carbonate" = "Calciumcarbonat"
"calcium hydroxide" = "Calciumhydroxid"
"copper(II) sulfate" = "Kupfer(II)-sulfat"
"sodium carbonate" = "Natriumcarbonat"
"sodium bicarbonate" = "Natriumhydrogencarbonat"
"potassium permanganate" = "Kaliumpermanganat"
sulfur = "Schwefel"
catalase = "Katalase"
"manganese dioxide" = "Mangandioxid"

# The journal — what the learner reads while working.
#
# lv1 and lv2 are different sentences, not different wordings of one, so
# they carry separate keys. Placeholders are named, so a translation may
# put them in any order German wants.
[event]
"vessel-created.lv1" = "Ein frisches Becherglas erscheint auf dem Labortisch: {vessel}."
"vessel-created.lv2" = "{vessel}: neues Gefäß"
"vessel-removed.lv1" = "Das leere Gefäß {vessel} kommt zurück in den Schrank."
"vessel-removed.lv2" = "{vessel}: leeres Gefäß entfernt"
"added.lv1" = "Du gibst {what} in {vessel}."
"added.lv2" = "{vessel}: +{amount} mol {what}"
"added.lv2-total" = "{vessel}: +{amount} mol {what} — jetzt {total} mol im Gefäß"
"dissolved-in-solvent.lv1-none" = "Das {what} bleibt einfach am Boden des {solvent} liegen — es löst sich nicht."
"dissolved-in-solvent.lv1-all" = "Das {what} verschwindet im {solvent}."
"dissolved-in-solvent.lv1-some" = "Ein wenig {what} löst sich im {solvent}; der Rest bleibt am Boden liegen."
"dissolved-in-solvent.lv2" = "{vessel}: {what} in {solvent} — {dissolved} mol gelöst (Handbuchgrenze), {solid} mol als Feststoff verblieben"
"stirred.lv1" = "Der Magnetrührer dreht {vessel} {seconds} Sekunden lang."
"stirred.lv2" = "{vessel}: Magnetrührer {rpm} U/min für {seconds} s — Rührstabspitze {tip} m/s; {resuspended} % wieder aufgewirbelt"
"ground.lv1" = "Du zerreibst das {what} in {vessel} zu feinerem Pulver."
"ground.lv2" = "{vessel}: {what} auf {diameter} µm zerrieben — etwa {area} m² Oberfläche"

