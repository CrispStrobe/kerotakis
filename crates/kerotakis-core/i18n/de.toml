# Cases that English handled by appending a letter or swapping a word.
# German needs whole sentences, so each case is its own key.
"magnet-separated.lv1-one" = "Du hältst einen Magneten über {from} — das {what} springt daran. Du lässt es in {to} fallen."
"magnet-separated.lv1-many" = "Du hältst einen Magneten über {from} — {what} springen daran. Du lässt sie in {to} fallen."
"magnet-separated.lv1-stays-one" = " Das {what} bleibt zurück."
