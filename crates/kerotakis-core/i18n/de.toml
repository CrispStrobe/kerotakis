[inert]
hydrogen-overpotential = "{name} müsste sich nach der Spannungsreihe in dieser Säure lösen (Triebkraft {driving} V), aber der Wasserstoff muss sich auf {name} bilden, und auf dieser Oberfläche kostet das eine Überspannung von etwa {eta} V. Kinetisch gehemmt auf der Zeitskala einer Unterrichtsstunde, nicht thermodynamisch inert — das ist der Unterschied zwischen einem Labortisch und einer Batterie"
couple-spent = "das gesamte {other} ist abgeschieden; das übrige {name} hat nichts mehr zu verdrängen. Das Redoxpaar läuft weiterhin bergab (E° {e_self} V für {name} gegen {e_other} V für {other}) — es sind schlicht keine {other}-Ionen mehr da"
couple-spent-trace = "bis auf eine Spur ist das gesamte {other} abgeschieden ({left} mol Ion übrig, dort hat die Nernst-Wurzel das Gleichgewicht gelegt); das übrige {name} hat nichts mehr zu verdrängen. Das Redoxpaar läuft weiterhin bergab (E° {e_self} V für {name} gegen {e_other} V für {other})"
