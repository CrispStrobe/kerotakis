[package]
name = "kerotakis-core"
description = "Bench and vessel state machine, operators, energy balance and solver router for the Kerotakis virtual laboratory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# OPT-2: alternative allocators (measure before enabling)
mimalloc = ["dep:mimalloc"]
talc-alloc = ["dep:talc"]

[dependencies]
bumpalo = { workspace = true }
mimalloc = { version = "0.1", default-features = false, optional = true }
talc = { version = "4", optional = true }
diffsol = { workspace = true }
kerotakis-thermo = { path = "../kerotakis-thermo" }
lasso = { workspace = true }
num-rational = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
rand_distr = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_yaml_ng = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# A transitive pure-Rust matrix dependency uses `rand` internally. Select the
# browser/Node entropy backend explicitly so the portable solver graph remains
# valid on the web target; native targets do not acquire this dependency.
getrandom = { version = "0.3", features = ["wasm_js"] }

[build-dependencies]
serde_json = { workspace = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
dhat = "0.3"
proptest = "1"
serde_json = { workspace = true }

[[bench]]
name = "solve"
harness = false
