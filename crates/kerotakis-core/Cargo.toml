[package]
name = "kerotakis-core"
description = "Bench and vessel state machine, operators, energy balance and solver router for the Kerotakis virtual laboratory"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
diffsol = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# A transitive pure-Rust matrix dependency uses `rand` internally. Select the
# browser/Node entropy backend explicitly so the portable solver graph remains
# valid on the web target; native targets do not acquire this dependency.
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
proptest = "1"
serde_json = { workspace = true }
