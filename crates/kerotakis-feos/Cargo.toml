[package]
name = "kerotakis-feos"
description = "Optional FeOs (PC-SAFT) adapter for Kerotakis: binary alcohol-water bubble/dew points as a property query, off by default"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# OFF by default: without it the crate carries only the domain contract and
# answers every query with a typed `EngineNotEnabled` refusal, so default,
# wasm and CI builds pull in no FeOs code.
default = []
feos = ["dep:feos", "dep:quantity", "dep:nalgebra", "dep:serde_json"]

[dependencies]
thiserror = { workspace = true }
# FeOs 0.10.1 (MIT OR Apache-2.0), released 2026-07-24, pinned exactly.
# Only the `pcsaft` model feature: no `dft` (ndarray/petgraph), no `rayon`,
# no rusqlite. Cargo.lock is NOT updated locally (no local cargo on this
# host); the hosted build must run `cargo update -p kerotakis-feos` /
# `cargo generate-lockfile` equivalent and commit the lock before merge.
feos = { version = "=0.10.1", default-features = false, features = ["pcsaft"], optional = true }
quantity = { version = "=0.14.0", optional = true }
# Same major as feos 0.10.1 uses; only to hand FeOs a DVector initial guess.
nalgebra = { version = "=0.35.0", optional = true }

serde_json = { workspace = true, optional = true }

[dev-dependencies]
kerotakis-thermo = { path = "../kerotakis-thermo" }
