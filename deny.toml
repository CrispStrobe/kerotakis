# cargo-deny configuration — enforces Kerotakis' direct-inclusion policy.
# Run: cargo deny check
# See: https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
# Exclude workspace-local crates that are still under development
# (sundials-kinetics-rs is a prototype with its own licensing TBD).
exclude = [
    "sundials-sys",
    "sundials",
    "chem_core",
    "symengine-sys",
    "symengine",
    "kerotakis-sundials",
]

[advisories]
ignore = [
    # paste is widely-used, dep of faer/gemm; no viable replacement yet.
    "RUSTSEC-2024-0436",
]

[licenses]
# Kerotakis' direct-inclusion policy: only code with these grants may
# enter the official payload.
# Shipping bar, hardened 2026-08-23 (see PLAN.md).
# No GPL family including LGPL.
allow = [
    # Kerotakis' own code
    "AGPL-3.0-or-later",
    # Shipping bar (PLAN.md, hardened 2026-08-23)
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    # Data licences
    "CC0-1.0",
    # Unicode
    "Unicode-3.0",
    "Unicode-DFS-2016",
    # Vendored C library notices
    "OpenSSL",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
