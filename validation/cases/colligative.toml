[[case]]
id = "nacl-0.1m"
title = "A tenth-molal brine — a level teaspoon of salt in half a litre"
ledger = [
  { species = "water", moles = 55.51 },
  { species = "NaCl", moles = 0.1 },
]
apparatus = "single vessel, no phases, no gas, no interfaces"
boundary = "vessel temperature (near 25 C after the dissolution enthalpy), 101.325 kPa"
expected_model_path = """
Speciation on `wateq4f.dat` (the router leaves a tenth molal inside the
Debye-Hueckel validity domain); solvent activity from a SECOND, lean
speciation on `pitzer.dat`, because PHREEQC does not model a_w on a
Debye-Hueckel database at all — it prints `1 - 0.017*sum(m)`, a hard-coded
constant carrying no information about what is dissolved.
"""
conservation = "sodium, chlorine, hydrogen, oxygen and charge closed by the ordinary bench invariants"
produced_by = "kerotakis-phreeqc::colligative_numbers::a_tenth_molal_brine_is_answered_by_a_model_and_not_by_raoult"
generalises_over = """
1:1 chlorides between roughly 0.05 and 1 mol/kg of counted particles, at
ordinary bench temperature. NOT below 0.05: PHREEQC's four-figure species
table rounds a_w to 1.000 there and the osmotic coefficient computes as zero.
NOT above 1 mol/kg: a different route answers.
"""
known_failure_modes = """
The four-significant-figure species table is the accuracy ceiling of this
route. a_w arrives as 0.9966 rather than 0.996647, and phi = -ln(a_w)/(M_w
sum(m)) turns a 5e-5 rounding in a_w into 0.013 in phi at this dilution —
1.4 %, all of it upward here, worth about 5 mK on the freezing point.
"""

[[case.quantity]]
name = "osmotic_coefficient"
unit = "1"
model_value = 0.945
model_tolerance = 0.03
world_value = 0.9324
world_tolerance = 0.025
condition = "1:1 NaCl(aq), 0.100 mol/kg, 25 C"
source_id = "robinson-stokes-1959-electrolyte-solutions"
source_locator = "Appendix 8.10, NaCl column, m = 0.1"
primary_source_id = "scatchard-hamer-wood-1938-isotonic"
tolerance_reason = """
0.025 is the documented four-figure a_w rounding (0.013 in phi at this
dilution) doubled. It is doubled rather than taken as-is because the rounding
happens to push upward on this engine build and nothing guarantees the
direction on another. SURVIVES THE IMPROVEMENT: taking a_w off the wire at
full precision moves phi to about 0.932, essentially onto the reference.
EXCLUDES THE PREDECESSOR: Raoult's law does not compute an osmotic coefficient
at all, it asserts phi = 1 by construction, and 1.000 is 0.068 away — 2.7
times this band.
"""
independent_of_path = false
independence_note = """
NOT INDEPENDENT, and this row must not be read as a physics check.
`pitzer.dat`'s Na-Cl virial coefficients are fitted to osmotic-coefficient
data (see `appelo-2015-saline-databases`), which is the same class of
measurement as the reference. This row checks that the fit was loaded, routed
and read correctly. That is worth checking — it is exactly what was broken
before 2026-09-13 — but it is not evidence about the physics.
"""
asserted_today = true

[[case.quantity]]
name = "freezing_point_depression"
unit = "K"
model_value = 0.3516
model_tolerance = 0.004
world_value = 0.346
world_tolerance = 0.010
condition = "1:1 NaCl(aq), 0.100 mol/kg, 101.325 kPa"
source_id = "scatchard-prentiss-1933-chloride-freezing"
source_locator = "NaCl series, m = 0.1"
tolerance_reason = """
