# ----------------------------------------------------- the tolerance policy ---

[tolerance_policy]
rule = "argued per quantity and per claimed model, never a flat percentage"
statement = """
A pH, a freezing point and an adiabatic flame temperature do not deserve the
same bar, so no percentage is applied across rows. Each quantity below carries
two bands, generalising the only argued tolerance this repository had before
this file existed (`colligative_numbers.rs`, 2026-09-11):

  `model_tolerance`  — tight, on the bench's OWN figure. A pin. It moves when
                       the engine, the dataset or the relation moves, and it
                       is meant to. It is not a claim about the world.

  `world_tolerance`  — loose, on the published measurement. Set by the rule
                       "wide enough to survive an improvement, narrow enough
                       to exclude the known-wrong predecessor", and every row
                       below names both the improvement and the predecessor so
                       the width can be checked rather than believed.

Three things are spent on a world band and each row itemises which of them
apply: the spread between published values for the same solution, a residual
the repository has already diagnosed and not yet fixed, and — new in this
family — an allowance for a transcription nobody has verified against the
printed source.

INSTRUMENT PRECISION IS NOT THE RIGHT VALUE, although it is the right axis.
`crates/kerotakis-core/src/instrument.rs` declares a thermometer at +/-0.1 C.
Model tolerance is how far the model may sit from reality; instrument
precision is how finely the bench reads. The 2026-09-11 brine error was 0.32 C
against a thermometer declaring 0.1. Setting tolerance at instrument precision
fails nearly every row on day one and the gate gets switched off; setting it
loose enough that everything passes proves nothing.
"""

