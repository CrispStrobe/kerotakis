# Accuracy corpus — the colligative family.
#
# Rows of the form: this script, run on this bench, produces this quantity;
# the published value is X ± t, from source S, and the tolerance t is argued
# for THAT quantity rather than taken off a flat percentage.
#
# This is level five of the verification ladder in ROADMAP-Webapp.md,
# specified there in 2026-08 and never built. It is deliberately the smallest
# thing that could answer the question the owner asked of it: are citations
# affordable at all? One family, six rows, no gate. If the answer had been no,
# it would have cost a day.
#
# THE HEADLINE NUMBER IS `quantities_covered`, NOT ROWS PASSING. A corpus
# reporting forty green rows over two quantities has said almost nothing, and
# rows passing can be gamed by adding easy ones. This family covers TWO
# quantities. That is the number to publish.

schema_version = 1
corpus = "accuracy-v1"
family = "colligative"
created = "2026-09-15"

# The published number, declared so it cannot drift from the rows. The
# structural test in `kerotakis-core/tests/accuracy_corpus.rs` recomputes all
# three from the rows below and fails if a declaration moves without them.
# Adding five easy rows to a quantity already covered moves `anchored_rows`
# and must leave `quantities_covered` exactly where it is. That is the whole
# anti-gaming mechanism, and it is mechanical rather than procedural.
headline_metric = "quantities_covered"
quantities_covered = 2
anchored_rows = 6
open_rows = 1

# --------------------------------------------------------------- the gate ---
# There is none, on purpose.
gate = false
gate_reason = """
Promotion to a continuous-integration gate comes only after the tolerances
below have survived argument by someone other than their author. A gate added
on the day the tolerances were invented would be the third check this month
that read stronger than it was, and the failure mode is specific and known:
the dominant risk in an accuracy corpus is a tolerance chosen to make its own
row pass, which is invisible in the count. `tolerance` and `tolerance_reason`
are separate fields precisely so that widening one shows up in a diff without
the reason moving with it.

Six of these rows are asserted TODAY by
`crates/kerotakis-phreeqc/tests/colligative_numbers.rs`, so they are already
under CI as ordinary tests. What is not gated is the corpus as a measure.
"""

# ------------------------------------------------- what a pass would prove ---
proves = """
For each covered quantity, on each covered script, the bench agrees with an
independently sourced published number to a stated and argued tolerance.
"""

does_not_prove = """
That the model is right anywhere BETWEEN the rows — two quantities at four
molalities is four points on a curve.

That the tolerances are appropriate. They are argued, which is not the same as
correct, and none has yet been argued by anyone but its author.

That the quantities NOT covered are accurate. This family covers two. A high
score here says nothing about pH, about a flame temperature, about a rate
constant, or about the other eight quantities the instrument layer declares a
precision for.

That a learner can reach any of it. Every row here is driven by a test
harness, not by anything a child can do in the app.

That the engine is right for the RIGHT REASON. A fitted constant and a correct
mechanism hit the same number. Three of the six rows say so in
`independent_of_path` below and must not be read as physics checks.

And in particular it does not prove the reference values were transcribed
correctly. See `transcription` on every source: the bibliographic records were
verified, the numbers were not.
"""

