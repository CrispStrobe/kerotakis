# EXP-26: gravimetric determination — precipitate, filter, dry, weigh.
# The AgCl route: silver nitrate + chloride → precipitate → filter →
# balance. The mass on the balance IS the answer.
id = "gravimetric"

[title]
lv1 = "Catch it and weigh it"
lv2 = "Gravimetric analysis: how much chloride?"
lv3 = "Gravimetric determination of chloride as AgCl precipitate"

[goal]
lv1 = "A white powder falls out of your mixture. Catch it on the filter and weigh it — the weight tells you how much was in the solution."
lv2 = "Determine chloride content by precipitation: add AgNO₃ to a chloride solution, filter the AgCl precipitate, and weigh it. The mass reveals the original chloride amount."
lv3 = "Quantitative gravimetric analysis: Ag⁺(aq) + Cl⁻(aq) → AgCl(s). Filter, dry, weigh. From m(AgCl) and M(AgCl) = 143.32 g/mol, recover n(Cl⁻) = n(AgCl). Accept within ±5% of the theoretical yield."

[[nudges]]
id = "precipitate-formed"
when = "precipitated:AgCl"
[nudges.say]
lv1 = "White stuff appeared — that is the silver and salt stuck together. Now separate it from the liquid."
lv2 = "AgCl precipitated — a white curdy solid. Filter it into a clean vessel to isolate it for weighing."
lv3 = "AgCl (Ksp ≈ 1.8×10⁻¹⁰) is quantitatively insoluble at these concentrations. Excess Ag⁺ ensures complete precipitation of Cl⁻. Filter to isolate the precipitate."

[[nudges]]
id = "filtered"
when = "filtered"
[nudges.say]
lv1 = "The white stuff stayed on the paper and the liquid ran through. Now weigh the white stuff."
lv2 = "Filtration separated the AgCl solid from the supernatant. Weigh the filter residue — that mass is your analytical signal."
lv3 = "The filtrate should contain negligible Cl⁻ if Ag⁺ was in excess. Weigh the residue: m(AgCl) = n(Cl⁻) × M(AgCl)."

[[claims]]
id = "precipitated"
matches = "precipitated:AgCl"
[claims.title]
lv1 = "Make the white stuff appear"
lv2 = "Precipitate AgCl"
lv3 = "AgCl precipitation from Ag⁺ + Cl⁻"

[[claims]]
id = "filtered"
matches = "filtered"
[claims.title]
lv1 = "Separate the powder from the liquid"
lv2 = "Filter the precipitate"
lv3 = "Solid–liquid separation by filtration"

[[claims]]
id = "weighed-precipitate"
matches = "measured"
[claims.title]
lv1 = "Weigh what you caught"
lv2 = "Weigh the dried precipitate"
lv3 = "Gravimetric measurement of the isolated AgCl"
