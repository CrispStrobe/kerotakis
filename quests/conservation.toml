# EXP-45: the law of conservation of mass in sealed reactions.
# The ledger IS the engine's thesis — this quest states its soul to a
# learner. Three reaction types, all weighed before and after in a
# sealed vessel. The balance reads the same both times.
id = "conservation"

[title]
lv1 = "Nothing disappears"
lv2 = "Conservation of mass: weigh before, react, weigh after"
lv3 = "Mass conservation across precipitation, gas-evolving, and neutralisation reactions in sealed vessels"

[goal]
lv1 = "Some reactions make new stuff appear — powder, gas, heat. Does the total weight change? Seal the vessel, weigh it, react, weigh again."
lv2 = "Demonstrate conservation of mass in at least two different reaction types: seal the vessel, weigh it, run the reaction, weigh again. The balance should agree."
lv3 = "Mass is conserved across chemical transformations — the ledger's fundamental invariant. Verify by gravimetric comparison (pre- vs post-reaction mass in a sealed system) for at least two of: precipitation, gas evolution, neutralisation. The sealed vessel traps gaseous products that would otherwise appear to lose mass."

[[nudges]]
id = "first-weighing"
when = "measured"
[nudges.say]
lv1 = "You weighed it — remember that number. Now make something happen inside the sealed vessel."
lv2 = "Initial mass recorded. Run a reaction in the sealed vessel, then weigh again — the comparison is the experiment."
lv3 = "Pre-reaction mass established. The seal is essential: open-vessel gas evolution would show apparent mass loss (CO₂ escaping), which is real transport, not a violation."

[[nudges]]
id = "precipitated"
when = "precipitated"
[nudges.say]
lv1 = "New stuff appeared at the bottom — but did the total weight change?"
lv2 = "A precipitate formed — solid that was not there before. Weigh the vessel again to check if mass was created."
lv3 = "Precipitation redistributes mass between phases (dissolved → solid) without creating or destroying it. The balance confirms: Σm(products) = Σm(reactants)."

[[nudges]]
id = "gas-in-sealed"
when = "gas_evolved"
[nudges.say]
lv1 = "Bubbles! But the lid is on, so the gas cannot escape. Does it still weigh the same?"
lv2 = "Gas evolved inside the sealed vessel — it is still there, just in a different form. The balance tells the story."
lv3 = "Gaseous products remain in the headspace. Without the seal, the apparent mass would decrease by the mass of escaped gas — a real transport phenomenon, not a violation of conservation."

[[claims]]
id = "sealed-a-vessel"
matches = "vessel_sealed"
[claims.title]
lv1 = "Put the lid on"
lv2 = "Seal a vessel before the reaction"
lv3 = "Seal the vessel to close the material boundary"

[[claims]]
id = "weighed-before"
matches = "measured"
[claims.title]
lv1 = "Weigh it before"
lv2 = "Record the mass before the reaction"
lv3 = "Pre-reaction gravimetric measurement"

[[claims]]
id = "ran-a-reaction"
matches = "precipitated"
[claims.title]
lv1 = "Make something happen inside"
lv2 = "Run a reaction in the sealed vessel"
lv3 = "At least one chemical transformation in the sealed system"

[[claims]]
id = "weighed-after"
matches = "measured"
[claims.title]
lv1 = "Weigh it after"
lv2 = "Record the mass after the reaction"
lv3 = "Post-reaction gravimetric measurement — compare with pre-reaction"

[[claims]]
id = "ledger-balances"
vessel = "v1"
quantity = "mass_g"
target = 206.06
tolerance = 0.01
[claims.title]
lv1 = "The balance says the same number before and after"
lv2 = "Build the sealed system the goal describes — 200 mL water + 1 g NaCl + 2 g AgNO₃ + 4.2 g NaHCO₃, all of it in before you fit the lid over 250 mL — and the balance reads 206.06 g (± 0.01) both before and after you heat it"
lv3 = "Value claim: mass of v1 within 206.06 ± 0.01 g. Everything enters before the seal (199.4 g water + 1.0 + 2.0 + 4.2 g solids + 0.30 g of trapped room air, minus 0.85 g of CO₂ that fizzes off while the vessel is still open — the bicarbonate meets the silver solution before the lid does), in any order — the four addition orders spread by 1.1×10⁻³ g. Driving the carbonate with heat inside the closed boundary moves the total by 1.0×10⁻⁴ g; opening the vessel afterwards costs 0.52 g of escaped gas, which is transport, not creation"
