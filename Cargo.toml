[workspace]
resolver = "2"

# web/app/src-tauri is the desktop/mobile shell (GUI-030): excluded so the
# workspace never needs the platform webview toolchains; it builds on its
# own against the path dependencies.
exclude = ["sundials-kinetics-rs", "web/app/src-tauri"]
members = [
    "crates/kerotakis-core",
    "crates/kerotakis-cli",
    "crates/kerotakis-phreeqc",
    "crates/kerotakis-safety",
    "crates/kerotakis-cea",
    "crates/kerotakis-stack",
    "crates/kerotakis-wasm",
    "crates/kerotakis-codex",
    "crates/kerotakis-thermo",
    "crates/kerotakis-data",
    "crates/kerotakis-registry-export",
    "crates/kerotakis-org",
    "crates/kerotakis-sundials",
    "crates/kerotakis-scene-physics",
]

# chematic 0.18's umbrella crate remains downloadable, but crates.io no longer
# advertises its 0.18 internal packages in the live index. Keep the audited
# release sources local so fresh and offline builds remain reproducible.
[patch.crates-io]
chematic = { path = "vendor/chematic-0.18/chematic-0.18.0" }
chematic-chem = { path = "vendor/chematic-0.18/chematic-chem-0.18.0" }
chematic-cip = { path = "vendor/chematic-0.18/chematic-cip-0.18.0" }
chematic-core = { path = "vendor/chematic-0.18/chematic-core-0.18.0" }
chematic-fp = { path = "vendor/chematic-0.18/chematic-fp-0.18.0" }
chematic-inchi = { path = "vendor/chematic-0.18/chematic-inchi-0.18.0" }
chematic-iupac = { path = "vendor/chematic-0.18/chematic-iupac-0.18.0" }
chematic-mol = { path = "vendor/chematic-0.18/chematic-mol-0.18.0" }
chematic-perception = { path = "vendor/chematic-0.18/chematic-perception-0.18.0" }
chematic-rxn = { path = "vendor/chematic-0.18/chematic-rxn-0.18.0" }
chematic-smarts = { path = "vendor/chematic-0.18/chematic-smarts-0.18.0" }
chematic-smiles = { path = "vendor/chematic-0.18/chematic-smiles-0.18.0" }

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/CrispStrobe/kerotakis"
authors = ["Christian Ströbele"]

[workspace.dependencies]
diffsol = { version = "=0.16.2", default-features = false, features = ["nalgebra"] }
bumpalo = "=3.20.3"
csv = "1"
lasso = { version = "0.7", features = ["multi-threaded"] }
num-rational = "0.4"
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "=0.10.0"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
