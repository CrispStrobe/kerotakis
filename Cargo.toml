[workspace]
resolver = "2"
exclude = ["sundials-kinetics-rs"]
members = [
    "crates/kerotakis-core",
    "crates/kerotakis-cli",
    "crates/kerotakis-phreeqc",
    "crates/kerotakis-safety",
    "crates/kerotakis-cea",
    "crates/kerotakis-wasm",
    "crates/kerotakis-codex",
    "crates/kerotakis-thermo",
    "crates/kerotakis-data",
    "crates/kerotakis-registry-export",
    "crates/kerotakis-org",
    "crates/kerotakis-sundials",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/CrispStrobe/kerotakis"
authors = ["Christian Ströbele"]

[workspace.dependencies]
diffsol = { version = "=0.16.2", default-features = false, features = ["nalgebra"] }
bumpalo = "=3.20.3"
csv = "1"
lasso = { version = "0.7", features = ["multi-threaded"] }
num-rational = "0.4"
rand = "0.9"
rand_chacha = "0.9"
rand_distr = "0.5"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "=0.10.0"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
