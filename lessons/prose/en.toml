# Lesson prose, English — GENERATED from the `.lab` files.
#
# Do not edit by hand: `python3 tools/lesson-prose-lint.py --write`
# regenerates it, and `--check` fails if it drifts. The `.lab` file is the
# one source of truth for a lesson (GUI-020) and carries this English
# inline, where `kero run` and an untranslated payload both read it.
#
# This file exists for two readers: a translator, who needs the key list
# and the source text without grepping 113 lessons, and the lint, which
# uses it to notice that a sentence was reworded after its German was
# written. A translation lives in `<code>.toml` beside this file — adding
# French is `fr.toml` and no code anywhere.
#
# The labels in use, so a new lesson reads like the 113 already here:
#
#   title      the first comment line — also the picker's blurb
#   intro      the paragraph under it, before the first command
#   part.<x>   a section comment between commands; name the THING it does
#              (`part.displacement`) where there is one to name, and fall
#              back to `part.1`, `part.2` on position where there is not
#   boundary   the closing note about what the model does not claim
#
# Where a zone holds more than one paragraph they are numbered — `intro.1`,
# `intro.2` — never `intro` plus `intro.2`, because a dotted label makes its
# stem a TOML table and the two cannot share one.

["antacid-suspension"]
title = "An antacid suspension: neutralisation stops when the acid runs out"
intro = "Excess sparingly soluble magnesium hydroxide remains. This is chemistry, not medical advice or a dose recommendation."

["apple-browning"]
title = "Stop a cut apple going brown"
intro = "Browning belongs only to the prepared cut_apple identity: an intact generic apple has no declared fresh surface. The response is a bounded oxygen/time observable, not enzyme turnover, taste, texture or food-safety advice."
part.1 = "Air control: a fresh surface browns as the shared clock advances."
part.2 = "Vitamin-C comparison: the same mass, air and time with ascorbate nearby. The model computes inhibition of the visible response; it does not claim permanent preservation."

["baking-powder-or-soda"]
title = "Baking powder or baking soda: water, acid and heat are different triggers"
intro = "The two white powders are not interchangeable. This simulation compares equal portions while changing one condition at a time. Real baking powder contains a mixture of acids whose staged action varies by brand; the named material here is a reviewed teaching surrogate, not a recipe for food."
part.1 = "Baking soda in cold water dissolves. The aqueous equilibrium can release a small amount of CO2 even without a bottle of acid; that is not the same route as heat-driven decomposition."
part.2 = "The named baking-powder surrogate carries bicarbonate and starch. Warming it drives another modeled release of CO2. It does not reproduce the staged acid systems used by particular commercial double-acting powders."
part.3 = "Acid is a different route to the same visible gas. This control uses ordinary 5% vinegar. The bench does not model cake crumb, dough elasticity, oven moisture or whether a baked food has risen."

["balloon-pressure"]
title = "Balloon on a bottle: gas needs somewhere to go"
intro = "A piston lid represents a flexible balloon: it computes pressure and expanding volume, not rubber elasticity, balloon shape or latex failure."

["blue-crystals"]
title = "Growing blue crystals from copper sulfate"
intro = "Blue vitriol is the crystal every school grows: dissolve as much copper sulfate as hot water will take, let it cool, and the water hands most of it back as big blue crystals. The blue is not the copper alone — it is the five waters locked into the crystal with it, which is why the solid has its own name."
part.1 = "Thirty grams into a hundred millilitres is more than cold water can hold, so some of it comes straight back out as chalcanthite. Look at the liquid it leaves: so concentrated that the bench calls it BLACK rather than blue, which is what a strong copper sulfate solution really looks like in a beaker — the colour saturates and you cannot see through it."
part.2 = "Heat it and the water takes the lot."
part.3 = "Then cool it right down. This is the crystal-growing step, and the bench writes the equation for it: the copper, the sulfate and five waters going into one solid. And now the liquid reads BLUE rather than black — not because anything changed colour, but because so much of the copper has left it that you can see through what remains."
boundary.1 = "What this does not model: the crystal. No shape, no faces, no single large specimen grown on a thread over a week — the bench says how much solid comes back and what colour it is, and a crystal-growing competition is judged on everything else."
boundary.2 = "You will also see the bench decline three other copper solids that the database says the liquid is supersaturated against — Langite, Antlerite, Brochantite, the greens of weathered copper. They are named and refused rather than silently skipped, because a solution that would really throw them is not a solution this beaker is describing honestly."

["boiling-curve"]
title = "The heating curve: why a boiling pan stays at 100 °C"
intro = "Heat is not temperature. A vessel on a burner climbs steadily until the water starts to boil, and then it stops climbing — every further joule buys steam instead of degrees. That flat stretch is the latent heat, and it is the reason a pan of boiling water cannot be made hotter by turning the ring up, only emptier."
part.1 = "Below the plateau: 30 kJ into 100 mL is pure sensible heat."
part.2 = "Past it. The next 30 kJ do not move the thermometer; they take water away."
part.3 = "And more of the same energy, same temperature, less water still."
part.4 = "Salt raises the plateau: the same colligative effect that lowers the freezing point of a salted road raises the boiling point of a salted pan."
boundary = "What this does not model: the plateau's leftover heat is spread over the heat capacity the vessel had *before* it boiled dry, so the final temperature of a vessel taken past dryness is under-reported; and the steam leaves an open vessel rather than being followed."

["borax-snowflake"]
title = "A borax snowflake: why some things crystallise on cooling and some do not"
intro = "Borax is the reason this experiment is done with borax. Cold water holds almost none of it; boiling water holds eleven times as much. Dissolve all you can in hot water, let it cool, and the water has to give most of it back — as crystals."
part.1 = "1. Cold water first, so you can see how little it takes. Twenty-five grams goes in and most of it just sits there."
part.2 = "2. Heat it. Now the same water swallows almost all of it."
part.3 = "3. And cool it right down. What the water can no longer hold comes back out — 0.096 mol of it, which is most of what dissolved."
part.4 = "4. The contrast that makes the point, and the bench draws it sharper than the numbers alone do. Sugar's solubility also rises with temperature — 200 to 487 g per 100 mL, a bit over double, against borax's 2.5 to 27.4, eleven times. But watch what the two do on the way down: the borax comes OUT, and the sugar syrup goes SUPERSATURATED and stays dissolved at 1.25 times what the water should hold. That is the same difference a kitchen sees. A borax snowflake grows overnight on its own; rock candy sits there refusing to start until you give it a string to grow on."
boundary.1 = "What this does not model: the crystal. There is no pipe cleaner to grow on, no habit, no six-fold symmetry — the bench says how much solid comes back, not what shape it takes, and a snowflake is entirely about shape."
boundary.2 = "And a stated substitution: handbook solubilities for borax are for the decahydrate, Na2B4O7·10H2O, which is also what really crystallises out of a cooling solution. This registry has only the anhydrous salt, so it stands in for the decahydrate at the decahydrate's solubility, scaled by the mass ratio. The amounts are right; the solid that carries them is a stand-in."

["buffer"]
title = "Buffers: why your blood does not change pH when you drink lemonade"

["cabbage-rainbow"]
title = "The red-cabbage rainbow: one pigment, five colours"
intro = "Cabbage water is not five dyes. It is one pigment that loses protons in steps, and each step absorbs light differently — so its colour is a reading of the pH. The bench computes it the way it computes every other colour: ε(λ) through Beer–Lambert over the CIE observer, not a table of \"turns blue in alkali\"."
part.1 = "Vinegar: the flavylium form, red."
part.2 = "Fizzy water, mildly acidic: the middle form, purple. This is the colour the jar of juice is before anything is done to it."
part.3 = "Baking soda: the first alkaline step."
part.4 = "Washing soda, stronger — and here is the one worth stopping on."
part.5 = "Strong alkali, at the top of the ladder."
part.6 = "No form of this pigment is green. The green appears where a blue form and a yellow form are both present: together they absorb at each end of the visible range and leave a window between them. It is a colour that is in no table in this engine, computed from two that are — which is the whole argument for computing colour instead of storing it."
boundary = "What this does not model: real cabbage juice is mildly acidic and carries its own buffering, so a few drops in unbuffered water would move the pH as well as report it; here the juice only reports. The pigment is a mixture of acylated cyanidin glycosides rather than one compound, and no cultivar, extraction or copigmentation shift is claimed."

["calorimetry"]
title = "Neutralisation enthalpy: how much heat does an acid-base reaction produce?"

["candle-jar"]
title = "The candle and the jar: a flame does not use up ALL the oxygen"
intro = "Everyone is taught that a candle under a jar \"uses up the oxygen\" and goes out. Watch the numbers here: it goes out with roughly three quarters of the oxygen still in the jar. A flame does not need SOME oxygen — it needs air that is RICH in it, about one part in six, and below that it quits with plenty left over."
part.1 = "1. A candle in the open air. Nothing limits it, so it burns away completely — 5 g of wax is about 210 kJ, which is a lot of energy for something you can hold in one hand."
part.2 = "2. The same candle under a jar. `regulate` is the honest boundary for a jar sitting on a bench: the gas cannot leave, but it can push, so nothing bursts. Watch the oxygen line before and after."
part.3 = "Read what just happened. Barely any wax burned, the flame went out, and there is still oxygen in the jar — it fell from 21% of the gas to 16%, and that was enough to stop it. Carbon dioxide and water took the place of the oxygen that went."
part.4 = "3. A fire extinguisher, which is a bottle of carbon dioxide. Nothing is taken away from the candle: the wax is all still there, and so is the oxygen. The carbon dioxide only takes up room, and now the flame cannot start at all."
part.5 = "4. Paper burns too, and it is the same chemistry with a different fuel: cellulose instead of wax. Paper catches at 506 K — which is 451 degrees Fahrenheit, and the novel's title is a real measurement. Note how much less heat the same mass gives than wax does."
boundary = "What this does not model: the wick, the melt pool, the light. A real candle burns wax VAPOUR drawn up a wick, slowly; this bench burns what the air allows all at once and does not model the clock. There is no soot, no smoke, no char and no carbon monoxide — burning here is always complete, straight to carbon dioxide and water. And the 16% limit is one teaching number standing in for something that really depends on the fuel, the wick and the shape of the jar."

["chalk-vinegar"]
title = "Does chalk fizz in vinegar? A two-vessel acid control"
intro = "Use only ordinary 5% food vinegar and calcium-carbonate classroom chalk in a real activity. Wear goggles, protect the table, ask an adult first, and never taste anything that has been placed in lab glassware."
part.control = "Control: a chalk stick in the same volume of plain water barely dissolves and has no finite acid source with which to make a visible burst of carbon dioxide."
part.test = "Test: change water to the named 5% vinegar recipe and keep the chalk dose the same. The balanced reaction consumes finite CaCO3 and acetic acid. Its real CO2 inventory drives the normal bubble effect and leaves through this open beaker; it is not a canned animation."
boundary = "Try a smaller chalk dose or less vinegar in a fresh vessel. The limiting reagent changes the gas amount. Powdering would change the real-world rate, but particle-area kinetics for this reaction remain an explicit future model."

