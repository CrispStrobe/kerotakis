boundary = "Gelatine is already denatured collagen before it reaches the shelf; cooling gelation is a different structural transition and is not claimed here."

["hot-share-temperature"]
title = "Hot fraction sets the resting temperature"
intro = "Four equal source portions isolate one variable: how much hot water enters the final mixture. The thermometer should rise monotonically with that share."
boundary = "These vessels are adiabatic constant-heat-capacity models. Real containers lose heat, and the bench does not predict pouring or cooling rates."

["ink-chromatography"]
title = "Splitting a black felt-tip: the spot that is really three"
intro = "A black ink looks like one colour. Put a dot of it near the bottom of a strip of paper, stand the paper in water, and the water climbing past the dot carries each dye a different distance — because each one divides differently between the water that moves and the water the paper holds. The number that says how far is Rf, and it is the same partition coefficient that decides how long each dye takes on a column."
part.1 = "The dyes on their own, for comparison. Each runs to its own height, and the heights are the same ones the mixture just produced — which is how a strip identifies what is in an unknown ink."
part.2 = "The same numbers, read as a column instead of a strip. One separation, two instruments, one partition coefficient: the dye the column holds longest is the one nearest the pencil line."
boundary = "What this does not model: the Rf values are reviewed teaching numbers rather than measurements, chosen to reproduce which dye runs furthest and roughly how far apart the spots land — a real strip's Rf depends on the solvent, the paper and the temperature, and none of those are claimed here. Dissolved ions travel with the water and are named as outside the method rather than quietly dropped."

["instant-snow"]
title = "Instant snow: where did the water go?"
part.1 = "A matched water-only control stays ordinary liquid."
boundary = "Nothing vanishes: water remains in the conserved ledger. The 100 g/g ceiling is a teaching capacity, not a product specification. Cross-link density, grain size, salt, pH, swelling time, volume and texture are outside this equilibrium mass-uptake model."

["invisible-ink-boundary"]
title = "Invisible ink: drying, browning and burning are different changes"
intro = "This lesson computes only the reviewed lemon-juice mark on paper. Its bounded brown appearance is not a general caramelisation or Maillard mechanism."
part.1 = "Wet control: heat alone cannot reveal a mark while water remains."
part.2 = "Dry the same mark first, then warm it. Browning does not ignite the paper."
part.3 = "Separate virtual burn control. Never ignite real paper for this activity."

["kitchen-hot-and-cold-packs"]
title = "Kitchen hot and cold packs: dissolving can warm or cool"
intro = "Equal water portions receive equal salt masses. The thermometer decides; \"dissolving releases heat\" is not a general rule. These are simulation samples, not food or medical-pack instructions."
part.1 = "Calcium chloride dissolution is exothermic."
part.2 = "Ammonium chloride dissolution is endothermic under the same starting conditions. Do not ingest laboratory ammonium salts."
part.3 = "Ordinary salt provides a household-scale comparison rather than another universal rule."
boundary = "The vessels are adiabatic approximations. A real cup, packet and room absorb heat, and dissolution rate and packet construction are outside this result."

["kitchen-ph"]
title = "A pH map of the kitchen — and what a pH meter cannot always say"
intro = "Five things from a kitchen, one meter. Four of them answer. The fifth is the interesting one, and it is not the bench being lazy."
part.1 = "Lemon juice. Sour, and the sourness is citric acid — which the loaded database defines a citrate for, so the meter can price it."
part.2 = "Apple juice. Also sour, also a fruit acid, also resolved as itself — and the meter cannot price it. Malic acid is in the registry and in the glass; a malate is in no shipped database, so its two protons are not in anybody's speciation. The bench says exactly that instead of returning a number that would look like the others."
boundary = "That is the whole lesson. The difference between v4 and v5 is not the chemistry, the fruit, or how carefully the recipe was written. It is whether somebody, somewhere, has published a thermodynamic model for that particular anion — and when they have not, the honest answer is a sentence rather than a number."

["kitchen-starch-hunt"]
title = "Kitchen starch hunt: flour and dough are not just white powders"
intro = "Lugol solution is brown without starch and blue-black when its iodine meets sufficiently long starch helices. Use separate cups so that each sample sees the same water and indicator dose. Iodine stains: protect eyes, clothes and the work surface, and do not taste any laboratory mixture."
part.1 = "A sugar control. White does not mean starch."
part.2 = "Flour resolves a reviewed starch fraction, so the same computed absorption band appears without a special-case claim about flour."
part.3 = "Plain flour-and-water dough carries the same starch identity."
boundary = "The colour identifies starch; it does not measure how much is present. This bench also does not model cooking, starch gelatinisation or food safety."

["lactase-and-milk"]
title = "Lactase and milk: one enzyme fits one substrate"
intro = "Three equal milk samples share one clock. Only the sample with lactase hydrolyses milk sugar; no enzyme and the wrong enzyme are fair controls."
boundary = "The bench records bounded bond cleavage inside the conserved milk solids. It does not claim sweetness or named glucose and galactose inventories."

["lemon-cell"]
title = "Open-circuit lemon-juice voltage: a voltmeter reading is not useful power"
intro = "Zinc supplies electrons. Copper is an inert surface where hydrogen ions can accept them. The lemon juice carries charge between the two, but its pH alone cannot tell us the current, power or lifetime of a real fruit battery."
part.1 = "The voltmeter draws no current. Because this setup has no measured zinc-ion activity, the bench labels its voltage as a unit-activity teaching estimate."
boundary = "This completes the no-load question: the same state always gives the same bounded voltage estimate. It deliberately does not answer a loaded-battery question. Fruit geometry, electrode area and spacing, polarisation and internal resistance decide the loaded voltage and power. None is inferred from the open-circuit estimate, and the copper is not treated as Cu/Cu2+."

["lemonade-indicator"]
title = "Lemonade that changes colour: an indicator measures the liquid"
intro = "Bromothymol blue uses one computed spectrum in a basic control and lemon acid. The named juice is a surrogate; do not taste laboratory mixtures."

["limewater"]
