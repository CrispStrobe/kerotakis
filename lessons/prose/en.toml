["two-limits-one-carbon-dioxide-ledger"]
title = "Two limits, one carbon-dioxide ledger"
intro.1 = "Hold bicarbonate fixed while acid rises, then hold acid in excess while bicarbonate rises. Which reagent limits the computed carbon dioxide? Intermediate mission. Compare both four-vessel series: a larger dose raises the carbon ledger only until the other reactant becomes limiting."
intro.2 = "Model boundary: these are equilibrium inventory calculations, not a fizz-rate or bubble-volume prediction. The open virtual vessels can release carbon dioxide; foam height, nucleation, gas capture, heat exchange, mixing time and real preparation error are absent. A physical analogue should use small, teacher-prepared dilute portions, eye protection and an open vessel—never seal an acid/carbonate mixture."

["two-roads"]
title = "Two roads, one temperature: Hess's law with a thermometer"

["vitamin-c-detective"]
title = "Vitamin-C detective: the reaction ledger behind a disappearing colour"
intro = "Iodine held in dilute Lugol solution makes starch blue-black. Ascorbic acid reduces iodine and is oxidised to dehydroascorbic acid, so the colour clears. Protect clothes and the table, wear eye protection, and never taste a mixture that has been used as a laboratory sample."
part.1 = "The positive colour control: starch plus the same Lugol dose."
part.2 = "Change one thing: add a known amount of vitamin C before the iodine. The iodine is consumed while vitamin C remains, so the blue-black positive does not appear. At this dose the current broad oxidizer/reducer safety screen may print a warning written for concentrated reagents; it is deliberately conservative and is not a quantitative risk assessment of this dilute cup."
boundary = "The ledger names dehydroascorbic acid even though the current appearance renderer answers the colourless cup with a generic \"nothing visible\" line. That is a presentation boundary, not permission to invent a colour event. This is also not a calibrated food assay: a real juice has an uncertain vitamin concentration and other reducing compounds, so colour alone does not justify a nutrition-label result."

["volcano-foam"]
title = "The volcano: why the soap matters"
intro = "A baking-soda volcano without washing-up liquid is a fizz. With it, the gas is caught in a film as it comes out and the whole thing climbs over the rim. Nothing about the chemistry changes — the same carbon dioxide, the same amount of it. What changes is whether the gas can get away."
part.1 = "1. The control. Soda and vinegar, no soap: it fizzes, the gas leaves, and there is nothing to see afterwards but a flat liquid."
part.2 = "2. The same reaction with washing-up liquid already in the glass. Put the soap in FIRST — it has to be there when the gas arrives, because gas that has already left cannot be caught."
part.3 = "3. And it does not last. Foam drains and the bubbles join up: two minutes against this soap's 180-second half-life takes 1.375 L down to 0.866 L, a bit over a third of it gone. Not \"most of the way back to a liquid\" — that was the guess before the run, and the number is slower than the guess."
boundary = "What this does not model: bubble size, how the film drains, or the difference between a detergent film and a protein one. The half-life is the recipe's own reviewed number and the trapped fraction is a bounded teaching value — this says THAT it foams and roughly how fast it goes, not what the foam is made of."

["warm-the-gas-stop-before-burst"]
title = "Warm the gas, stop before burst"
intro = "Predict the pressure order for equal sealed gas samples given 0 J, 100 J, 200 J and 400 J. The first three remain measurable; the last crosses the vessel boundary. Stop there: a burst is evidence, not an invitation to retry."

["water-electrolysis"]
title = "Splitting conductive water: two gases, in a two-to-one ratio"
intro = "Pure water conducts too poorly for this apparatus and is still refused. A little sodium sulfate carries current without being preferentially discharged: water becomes hydrogen at the cathode and oxygen at the anode."
part.1 = "Keep the cell open: collecting hydrogen and oxygen together would make an ignitable mixture, and gas collection is not needed to compare their amounts."
boundary = "Faraday's law owns the amounts: two electrons per H2 and four per O2, hence twice as much hydrogen. This is an undivided teaching cell with inert electrodes. It does not model electrode overpotential, gas crossover, a membrane, ignition, efficiency or the voltage needed to drive the current."

["water-filter"]
title = "Build a water filter: cloudy is not the same as dissolved"
intro = "This is a reviewed quartz-rich play-sand teaching suspension. Natural dirty water can also contain clay, microbes, dissolved salts and pollutants; clear filtrate is not automatically safe or pure, and this simulation makes no drinking-water claim."
part.1 = "Filter paper retains the solid grains while water enters the receiver."
boundary = "The visible contrast and conserved quartz are computed. Paper pore size, natural grain-size distributions and purification beyond solids are not."

["whole-object-buoyancy"]
title = "Whole objects: why an apple floats and a potato sinks"
intro = "Density belongs to the whole object. Pumice contains dense silica but its air-filled pores lower the stone's bulk density; an apple also carries air spaces. A potato is slightly denser than water. The picture and the words below both use those reviewed whole-object densities."
boundary = "Prediction to discuss: changing only an ingredient density would be the wrong calculation. Shape, pores and trapped air are part of a bulk object. This bounded model does not yet simulate water entering pumice pores, so the pumice does not slowly waterlog and sink."

["yeast-fermentation"]
title = "What wakes yeast up? A sugar-and-yeast fair test"
intro = "Compare three ordinary mixtures on one shared clock. Use comfortably warm, not hot, water in a real experiment; ask an adult before using food, do not taste lab mixtures, and never tightly seal an active fermentation vessel."
part.1 = "Control 1 has water and sugar but no living culture."
part.2 = "Control 2 has water and yeast but no sugar food."
part.3 = "Test 3 changes only the missing ingredient: it has the same water, sugar and yeast doses. The sugar dissolves before the shared clock starts."
part.4 = "Ten minutes pass for every vessel at once. Only v3 has dissolved sugar and a hydrated yeast culture, so only it may emit the computed GasProduced and Fermented events. The CO2 bubbles are matter made by the installed balanced pathway, not an animation timer."
boundary.1 = "Try equal dry-solids fresh yeast, a different temperature or a smaller sugar dose. This is a bounded classroom model, not proof that a real mixture is safe to drink, bake, bottle or seal; growth, oxygen switching, inhibition, flavour compounds and flexible balloons remain explicit future work."
boundary.2 = "HOW FAST, AND HOW MUCH OF THAT IS CLAIMED. On 2026-09-16 the yeast rate was fitted for the first time: the constant is the one that makes a gram of yeast in a litre of this same sugar strength give up 1.5 g of ethanol in the first hour at 30 degC, which is the fastest specific rate published for anaerobic brewer's and baker's yeast (Pagliardini et al. 2013, Microbial Cell Factories 12:29). Before it, ten minutes here took 58.6% of the sugar and made about 1.7 litres of carbon dioxide out of a 100 mL beaker - more gas than the beaker holds. It now takes about 3.7% and makes roughly 105 mL, which is a balloon a class can see."
boundary.3 = "THAT IS AN UPPER BOUND AND NOT A PREDICTION. The cited rate belongs to a laboratory strain growing in a fermenter, not to supermarket yeast in cold sugar water; a gram of dry yeast is counted here as a gram of living cells, which it is not; and this model's yeast never multiplies, never pauses to wake up and is never slowed by the alcohol it makes. One published point is matched. The shape of the curve through it is not claimed, so a longer wait on this bench runs faster than a real one would, and the hydration ramp in front of it is a matter of seconds where a real packet of dried yeast wants ten to fifteen minutes in warm water."
