boundary = "Ideal rigid headspaces only; real pressure work requires rated apparatus."

["protease-and-gelatin"]
title = "Protease and gelatine: a protein-cutting enzyme"
intro = "Equal hydrated gelatine samples compare protease, no enzyme, and lactase."
boundary = "This computes bounded protein hydrolysis. Gel texture and named peptide or amino-acid products remain outside the model, so it does not fake a jelly."

["rates"]
title = "Rates: two beakers, one variable, one clock."
intro = "The disappearing cross. Thiosulfate and acid make sulfur, the sulfur clouds the liquid, and the time it takes to hide a mark under the beaker is the measurement. Nothing here is scripted: both beakers run the same rate law, and the only difference between them is temperature."
part.1 = "Time is shared. `wait` advances the whole bench, which is the only way a fair test means anything."

["repeated-liquid-extraction"]
title = "One solvent budget, several extractions"
intro = "A separatory funnel does not reward one large shake as much as several smaller shakes with fresh solvent. This run gives four equal portions the same TOTAL hexane allowance as the one-stage comparison printed beside it. The engine computes both from phase volumes and K = [I2]hexane/[I2]water; neither percentage is scripted into the lesson."
part.1 = "At lv3 the result also names the coefficient direction, mass balance, saturation guard and provenance. This reviewed iodine model is restricted to 25 °C; other solutes with molecular group decompositions use the shared UNIFAC route, while unsupported pairs are refused explicitly."

["rock-candy"]
title = "Rock candy: why the sugar comes back, and why it waits to be asked"
intro = "Hot water holds far more sugar than cold water does. Dissolve as much as hot water will take, let it cool, and the water is now holding more than it can — but it does not let go until something gives the first crystal somewhere to start. That is why the experiment needs a string, and why the jar can sit clear on a shelf for a day and then turn solid in a minute."
part.1 = "1. Cold water first, so the difference has something to be measured against."
part.2 = "2. The same sugar into hot water. Far more of it goes in."
part.3 = "3. Cool the hot one. Nothing comes out — and the bench says why rather than quietly crystallising it, because a syrup that crystallises on its own is not the experiment."
part.4 = "4. Now give it a seed: one crystal of the same sugar is all it takes."
boundary.1 = "The solution ends at exactly the limit for its temperature, and everything above that is now crystal. That is the yield of the experiment, and nobody had to be told it — it is the difference between two solubilities."
boundary.2 = "What this does not model: the limit is a straight line between reviewed values at 20 °C and 100 °C, so the middle of the range is a few percent low; crystals grow instantly rather than over days, with no size, habit or purity; and nothing here nucleates spontaneously, so a real syrup's unpredictability — the reason one jar sets overnight and the next does not — is outside this model."

["rubbery-bone-boundary"]
title = "Chalk in vinegar: why this is not a rubbery-bone model"
intro = "Acid removes carbonate from chalk. Real bone is a composite: calcium-phosphate mineral reinforces collagen. Acid can leave that collagen scaffold flexible; chalk contains no collagen, so dissolving it cannot predict bone bending."
boundary = "The matched control honestly computes acid–carbonate dissolution and carbon dioxide. It is evidence about chalk only. No bone species, collagen scaffold, mechanical stiffness or bending observable exists in this model."

["rusting"]
title = "Rusting: iron needs air AND water, and salt makes it faster"
intro = "Four nails, four conditions, one clock. Everything here is safe, but the vessels are sealed on purpose: the oxygen a nail can reach is the oxygen trapped over it, and running out of it is half the lesson."
part.1 = "1. Dry. Iron and air, no water at all. Predict before you wait."
part.2 = "2. Water with the air swept out. A nitrogen purge is the bench's version of the boiled water the classroom experiment uses."
part.3 = "3. Plain water, sealed over ordinary room air."
part.4 = "4. The same, in salt water. Chloride is not used up by the reaction and does not appear in its equation — it makes the same reaction faster."
part.5 = "One day passes for all four."
part.6 = "Vessels 1 and 2 are the controls, and each is missing one thing. Read the oxygen line in vessels 3 and 4: the salt one has used almost all of it, and when the oxygen is gone the rusting stops with iron still in the vessel. That is why a sealed tin can does not rust from the inside."
boundary = "What this does not model: iron amount stands in for iron area, so filings and a nail of the same mass rust at the same speed here; the product is the registry's anhydrous iron(III) oxide rather than the hydrated rust of a real nail; and an open vessel does not draw oxygen from the room, which is why every vessel above is sealed over a measured amount of it."

["saline-scaling-preserves-conductivity"]
title = "Same concentration, larger portion: conductivity is intensive"
boundary = "Water and salt scale together, so concentration stays fixed. Real readings also depend on cell constant, calibration, polarisation and temperature."

["salt-from-brine"]
title = "Salt from brine: the oldest chemistry in the world"

["salt-or-sugar-ice"]
title = "Salt or sugar on ice: equal masses are not equal particle counts"
intro = "Salt dissociates; sugar stays molecular. This equilibrium comparison does not model grain size, mixing speed or how quickly a real ice bath melts."

["sealed-gas"]
title = "Gas laws in a sealed vessel"

["sealed-mass-conservation"]
title = "Nothing is lost if nothing escapes: choose the system before weighing"
intro = "Gas stays in the sealed system and leaves the open one. Atoms are conserved in both; the balance differs because the weighed boundary differs."

["silver-and-salt"]
title = "Case file: identify chloride with silver nitrate"

["slime"]
title = "Slime: how much borax is enough?"
intro = "White glue is long chains of poly(vinyl alcohol) drifting past each other, which is why it pours. Borax puts borate bridges between the chains. The bridges keep breaking and re-forming, so the result is neither liquid nor solid: it flows if you wait and tears if you pull. Nothing is used up — the borate is a linker, not a reagent — so the question is not \"does it react\" but \"how much is enough\"."
part.1 = "Too little. The chains are barely joined and it still runs."
part.2 = "The classroom amount. Most of the polymer is now in the network."
part.3 = "And well past it. Beyond saturation more borax buys nothing: every chain that can be bridged already is, which is why over-boraxed slime goes rubbery rather than more slimy."
boundary.1 = "Read the ledger in any of them: the borax is still there, all of it. A crosslinker is not consumed, and that is the difference between this and every other reaction in this lab."
boundary.2 = "What this does not model: the dose response is a bounded teaching curve calibrated to the familiar 50 mL-glue ratio, not measured rheology — no modulus, no relaxation time, no stringiness. Whether a particular glue gels at all depends on its degree of hydrolysis, and poly(vinyl acetate) glues do not gel this way at all. Household borax is the decahydrate, so a little over half of what the box weighs is the salt doing the work."

