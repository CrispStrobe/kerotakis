["spirit-still"]
title = "The spirit still — and the wall at 96 percent"
intro = "Wine is a few percent ethanol. One pass through a still enriches it, a second pass more — and then the climb stops. Near 89 mol percent the vapour has the same composition as the liquid, and boiling harder enriches nothing. That wall is the azeotrope, and here it is computed from activity coefficients, not looked up. The last pass runs through a four-stage column — the fastest legal route to the wall."

["split-heat-same-temperature"]
title = "Split heat pulses reach the same temperature"
boundary = "Adiabatic constant-heat-capacity vessels omit heat loss and container heat."

["starch-iodine-test"]
title = "Which cup contains starch? The Lugol colour test"
intro = "Compare the same dilute iodine/iodide test solution with and without ordinary cornstarch. In a real activity ask an adult first, protect clothes and the table from iodine stains, wear eye protection, and do not taste lab mixtures."
part.1 = "Control: dilute Lugol solution is brown in water. This vessel has the same water and indicator dose as the test vessel but no starch."
part.2 = "Test: first make an identical brown control, then change just one thing by adding cornstarch. Iodide keeps iodine in the aqueous inventory; sufficiently long starch helices contribute the computed broad absorption band, so the visible state becomes blue-black without consuming the starch or KI."
boundary = "Try flour, potato or a sugar control only after their named material recipes exist. Different starch sources and heating can alter the real colour; this lesson deliberately models the reviewed cornstarch surrogate at room temperature rather than treating every white powder as starch."

["sugar-water-density-tower"]
title = "Sugar-water tower: measure the ordering before trying to stack it"
part.1 = "Equal starting water, increasing sugar. The density readings are the computed evidence for which solution belongs at the bottom."
boundary = "The ordering is computed. A real tower also needs a gentle delivery that preserves a vertical concentration gradient. This bench has no slow-pour operation or diffusion state, so it does not draw layers it cannot retain."

["there-and-back"]
title = "There and back again: an ester is made, then unmade."
intro = "Acid and alcohol condense to an ester and water; the same ester, met with hydroxide, hydrolyses back to the alcohol and the acid's salt. Two curated transformations, each proven against an atom-mapped template — and each one runs only when asked, because a beaker of vinegar and spirit does not do this by itself."

