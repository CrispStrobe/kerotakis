["hand-warmer"]
title = "The hand warmer that will not click"
intro.1 = "A reusable hand warmer is a pouch of sodium acetate solution holding far more salt than it should be able to. You bend a little metal disc inside it, crystals race out from the click, and the pouch gets hot — that heat is the solid forming, given back."
intro.2 = "This lesson is here because the bench CANNOT do the click, and the reason is worth more than a demonstration would be."
part.1 = "Make the solution the way the pouch is made: a lot of salt into hot water."
part.2 = "Now cool it right down, past where it should have crystallised. In a real pouch this is the state you carry around in your coat all winter: liquid, cold, and loaded."
part.3 = "And here is the honest part. The bench knows the solution is past its limit — it says how far past — and it tells you it cannot make the solid appear. Not \"nothing happened\": *why* nothing happened."
part.4 = "The reason is not a missing number and not the wrong database. The solid a hand warmer makes is sodium acetate trihydrate, and no PHREEQC database shipped with this project defines any acetate solid at all — not wateq4f, not minteq.v4, not pitzer, not llnl. There is nothing for the aqueous engine to precipitate."
part.5 = "Compare that with borax, one lesson over: same idea, a solution past its limit on cooling, and there the solid exists and comes straight out. The difference between the two rows is not the chemistry a child sees. It is whether anybody has written the phase down."

["hard-water-soap-boundary"]
title = "Hard water and soap: scale is not soap scum"
intro = "The hard-water ions and carbonate scale are modeled. Dish soap is a declared surfactant material, but no fatty-acid soap species exists, so the bench cannot form the curd-like soap scum responsible for poor lather. That absence is the boundary this comparison exposes."
part.1 = "A separate scale-forming control shows the calcium chemistry the engine does own."

["hard-water-soap-scum"]
title = "Why fatty soap makes scum in hard water"
intro = "This uses a declared sodium-stearate-equivalent teaching reagent, not dish detergent and not a claim about any branded soap. Two fatty-carboxylate equivalents bind each calcium or magnesium ion; aggregate mass follows the actually consumed sodium soap and Ca/Mg, with released sodium returned to solution."
part.1 = "Soft-water control: no Ca2+ or Mg2+, so no aggregate is available."
part.2 = "Hard-water test: calcium is the limiting reagent and produces conserved soap-scum aggregate plus released sodium ions."
part.3 = "Magnesium follows the same two-equivalents-per-ion rule."
boundary = "Foam/lather, micelles, chain-length mixtures, builders and carbonate scale are not inferred from this bounded precipitation calculation."

