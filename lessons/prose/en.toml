["electrolysis"]
title = "Electrolysis of copper sulfate: Faraday's law, checked on a balance"
intro = "The point of this one is that you can do it on paper first. Weigh the electrode, run the cell, weigh it again, and the difference is a number you already predicted:"
calc.given = "I = 1.000 A, t = 965 s"
calc.charge = "Q = I·t         = 965 C"
calc.electrons = "n(e-) = Q/F     = 965 / 96485.33 = 0.010002 mol of electrons"
calc.copper = "n(Cu) = n(e-)/2 = 0.005001 mol            <- the 2 is the only chemistry"
calc.mass = "m = n·M         = 0.005001 x 63.546 = 0.3178 g"
aside.element = "Everything but that 2 is arithmetic you could do for any element. The 2 is copper(II): each ion needs two electrons to become an atom. Silver would be 1 and aluminium 3, and the same charge would deposit quite different masses."
aside.assumptions = "Assumptions, because the predicted mass depends on them. Inert electrodes, so the anode oxidises water and the beaker turns acid. And the cell is taken to be fully efficient for copper: no hydrogen is co-evolved at the cathode. That is an upper bound, not a measurement -- a real electrode weighs this much or less, never more. The bench says so at lv3, and it reports a computed efficiency below 1 if the copper runs out before the charge does."

["elephant-toothpaste-catalyst-dose"]
title = "Elephant toothpaste: catalyst dose changes how fast the foam arrives"
intro = "Simulation activity. A real child-facing activity uses only household 3% hydrogen peroxide, adult supervision, fitted goggles and gloves. Potassium iodide demonstrations belong on a supervised school bench; stronger peroxide is virtual exploration here, not a home instruction."
part.1 = "A fair comparison: equal peroxide, soap, vessels and elapsed time. Only the potassium iodide dose changes. The catalyst is retained in both vessels."
part.2 = "One shared clock lets the first-order iodide dependence reach the visible gas/foam model without giving either vessel extra reaction time."
boundary = "Prediction: v2 should make more oxygen, build a taller foam column and spill farther in the same ten seconds. Neither vessel consumes its KI inventory."

["elephant-toothpaste"]
title = "Elephant toothpaste: the soap catches oxygen; it does not make it"
intro = "Simulation activity. For a real child-facing activity, use only household 3% hydrogen peroxide with an adult, fitted goggles and gloves. Stronger peroxide is for virtual exploration here, not a home instruction."
part.1 = "Two equal peroxide portions make this a fair test. The first gets dish soap; the second is the no-soap control."
part.2 = "Dry yeast is a catalase-activity surrogate. The ten-second stir after warm water now advances its bounded hydration ramp before the final shared wait. Very hot water suppresses the enzyme envelope; brand and age still vary, so Kerotakis does not claim one universal yeast rate."
part.3 = "One clock advances both beakers. Oxygen yield and reaction heat come from the same peroxide rate law. Only v1 has a declared foam stabilizer."
part.4 = "Prediction to discuss: both vessels should make the same amount of oxygen from equal peroxide. v1 holds much of it temporarily as foam; v2 bubbles but cannot build persistent foam. Wait again to watch the modeled foam drain."

