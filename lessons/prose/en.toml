["liquid-nitrogen-freezes-ethanol"]
title = "Liquid nitrogen: one phase change pays for another (virtual investigation only)"
intro = "Real liquid nitrogen can cause severe cold burns and displace breathable air. Use only with trained supervision, eye/face protection, cryogenic gloves, strong ventilation, and an open pressure-relief path. Never seal a cryogen."
part.1 = "0.1713 mol and 2.8807 mol correspond to 10 mL ethanol and 100 mL LN2 at the cited liquid densities. Molar additions use the audited phase route."

["longer-waits-advance-peroxide-kinetics"]
title = "Longer waits advance peroxide kinetics"
intro.1 = "Give identical peroxide samples four different waits. What does the registered kinetic network do as modeled time advances? Intermediate mission. Inspect the complete inventory after 30, 60, 120 and 240 seconds: peroxide decomposition advances while hydrogen and oxygen remain accounted for."
intro.2 = "Model boundary: this is a test of the bench's registered peroxide network, not a new empirical rate law. Real decomposition also depends on concentration, temperature, light, impurities, surfaces and catalysts. Use only teacher-prepared dilute peroxide, eye protection and clean compatible apparatus for any physical comparison. Do not ingest it or return used material to its stock container."

["luminol-temperature"]
title = "Luminol light: warm is brighter, cold lasts longer"
intro = "Two matched prepared systems differ only in temperature. This is a luminol classroom demonstration, not commercial glow-stick chemistry."
boundary = "Relative intensity and half-life are an explicitly calibrated, Arrhenius-shaped comparison. Products and photon yield are not computed."

["magic-milk"]
title = "Magic milk: soap sends the colours racing"
intro = "A child-friendly surface-motion activity with whole milk, food colouring and a small amount of dish soap. Food colouring can stain: wear goggles, protect clothes and the table, ask an adult before using food, and never taste anything from a lab vessel."
part.1 = "Place three small colour drops on still milk. Their resolved dye inventory is conserved, but it stays localized at the surface instead of instantly tinting the whole beaker."
part.2 = "Now add dish soap without stirring. The recipe-declared surfactant dose computes the outward spread, emits SurfaceColourSpread and drives the coloured streak animation. The paths are an educational surface observable, not a CFD prediction of one exact real-life pattern."
part.3 = "Make a fair control with equal milk and equal colour doses, but stir the dye into the bulk before adding soap. Stirring emits SurfaceColourMixed and hands the same conserved chromophores to the normal Beer-Lambert mixture model. With no localized drops left, later soap must not invent a rainbow event."
boundary = "Try changing one dye amount or the detergent dose in a fresh vessel. The model conserves colour intensity and order, but does not claim molecular milk composition, universal surface tension or literal streak trajectories."

["measure-twice"]
title = "Measure twice, change nothing"
intro = "Each instrument reads the same unchanged vessel twice. The paired values are a control for the bench's deterministic, non-invasive measurement contract."
boundary = "Calibration error, drift, random noise, sample consumption and probe disturbance are deliberately outside this deterministic instrument model."

["metal-acid-race"]
title = "Which metal reacts first? Same acid, equal metal amounts"
intro = "Magnesium reacts vigorously, zinc more slowly, and copper refuses for an electrochemical reason. The engine computes reaction and heat but not literal wall-clock race times or differences in piece surface area."

["milk-curds"]
title = "Milk, vinegar, curds and whey: how much acid is enough?"
intro = "A child-friendly comparison using ordinary milk and 5% household vinegar. Do not taste anything from a lab vessel; clean the vessels after the activity, and ask an adult before using food for an experiment."
part.1 = "Begin with a deliberately tiny vinegar dose. The milk stays a dispersed white colloid because the installed acid dose has not reached its declared curdling onset."
part.2 = "Make a fair second vessel with the same milk volume and ten times the vinegar. The actual acetic-acid inventory now reaches the bounded response: milk solids join visible soft clumps while the surrounding whey becomes less opaque. This is an educational aggregate model, not a recipe, food-safety check, cheese-yield prediction or claim about every kind of milk."

["naked-egg-osmosis"]
title = "Naked egg: a membrane water-transfer comparison"
intro = "The prepared naked_egg is explicitly an egg-white-composition surrogate behind a semipermeable membrane. It is not a simulated whole egg: shell removal is the separate chalk-and-vinegar route, and yolk, elasticity and final equilibrium size are outside this model."
part.1 = "In plain water the bath has fewer dissolved particles than the declared interior, so water moves into the coherent object."
part.2 = "Sugar raises the bath osmolarity. With the same object and clock, water now moves out. Ordinary decant/filter commands deliberately leave the coherent object behind; there is no invented whole-object pickup command."

["neutral-moves"]
title = "Neutral is a moving target: warm water is still just water"

["neutral-sugars-are-conductivity-controls"]
title = "Neutral sugars are conductivity controls"
boundary = "The sugars remain neutral molecules in this model. Impurities, water autoionisation, probe background, calibration and temperature are omitted."

["never-mix"]
title = "The safety layer: precise about danger, honest about outcomes"
part.1 = "1. Bleach + ammonia → chloramine gas (existing rule)"
part.2 = "2. Strong oxidizer + flammable liquid → fire risk"
part.3 = "3. Strong acid + active metal → hydrogen gas"
part.4 = "4. Strong acid + carbonate → CO₂ spattering"

["oil-water-colour"]
title = "Oil, water and colour: which liquid gets the dye?"
intro = "A safe density-and-mixing activity with water, vegetable oil and food colouring. Do not taste lab materials; protect clothes and surfaces because food colouring stains, and work with an adult."
part.1 = "Colour the water first, then add oil. Predict whether the yellow oil will change colour or form its own layer."
part.2 = "Now reverse the order in a narrow cylinder. Food colouring is an aqueous dropper solution: it does not dye the oil, and its tiny coloured water phase settles below the oil instead."
part.3 = "Return to the first vessel. Dish soap alone does not erase the layer: use the stirrer to supply mechanical mixing and watch tiny oil droplets make the water cloudy while a little undispersed oil remains above it."
part.4 = "Let the vessel rest for one declared coalescence half-life. About half of the dispersed oil joins the upper layer again. This model conserves the generic unresolved oil; it does not yet model falling drops, hand-shaking, individual droplet sizes, viscosity or a lava-lamp tablet."

["one-thing-at-a-time"]
title = "One thing at a time: the column tells a mixture apart."
intro = "Three colourless liquids dissolved in water look like one liquid. The column disagrees: each solute spends its own share of time in the stationary phase, set by the same partition coefficient that runs the separating funnel, and so each arrives alone."
part.detail = "The same injection read closer: retention times, widths, areas — and K itself, the number doing all the work."

["oobleck"]
title = "Oobleck: a liquid you can run across"
intro = "Cornstarch and water is the one experiment on this shelf that is not chemistry. Nothing reacts. What changes is how the mixture answers being pushed: stir it slowly and it pours, stir it fast and the particles cannot get out of each other's way in time, so it resists like a solid. Stop, and it is a liquid again."
part.1 = "The classic mixture: about two parts cornstarch to one part water."
part.2 = "Gently. It flows."
part.3 = "Now fast. The same mixture, the same instant, a different answer."
part.4 = "A thin mixture does neither, however hard it is stirred — the effect needs the particles packed close enough to jam."
part.5 = "Read the ledger in v1: the starch and the water are exactly what went in. Nothing was made and nothing was used up; only the answer to the question \"how hard are you pushing?\" changed."
boundary = "What this does not model: there is no viscosity here, no yield stress and no critical shear rate — only the bounded statement that this mixture is one of the ones that does this, and that this stir was fast enough to notice. Particle size, starch source and how long it has stood all matter in a real bowl and none of them are represented."

["pepper-and-soap"]
title = "Pepper runs from soap: order matters at the water surface"
intro = "A safe observation activity with water, ground pepper and a tiny amount of dish soap. Do not taste lab materials, and wash the dishes afterwards."
part.1 = "First make the familiar pepper-covered water surface."
part.2 = "Set up a control with the same materials in the opposite order. Once soap is already spread across the water there is no new local gradient when pepper arrives, so the model must not invent the sudden darting event."
part.3 = "Now touch the pepper-first surface with dish soap. The recipe-declared dose computes the central clearing; the resulting SurfaceSpread event, retained scene state and animation all come from that one engine transition."
boundary = "Try less soap in a fresh vessel and predict how wide the clearing will be. This is a bounded classroom model, not a molecular surface-tension or CFD calculation, and repeating the effect needs fresh water and pepper."

["permanganate-standardisation"]
title = "Standardising permanganate: the burette tells you its own strength"

