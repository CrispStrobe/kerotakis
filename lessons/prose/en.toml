["copper-patina"]
title = "Cleaning a copper coin, and the green that comes back"
intro = "A tarnished coin goes bright in vinegar. Does the salt matter to the green that appears afterwards? Two matched beakers change one thing, so the colour is evidence rather than a story we told after seeing it."
part.1 = "1. Control: copper oxide and vinegar, but no chloride."
part.2 = "2. Test: the same amounts in a fresh beaker, with salt as the only change."
part.3 = "Compare the ledgers side by side. Chloride is what turns dissolved copper back into a green solid: atacamite, Cu2Cl(OH)3, the mineral that grows on copper fittings near the sea. The control keeps the chloride claim honest."
boundary.1 = "What this shows and what it does not. The blue in the liquid is dissolved copper(II) and it is computed; the green solid is computed too, by the aqueous engine, from a phase the shipped database has always defined. What was missing until now was a species for it in this lab's registry — so the bench could see that the solution was supersaturated and could say so, and could not put anything at the bottom of the beaker."
boundary.2 = "There is still no coin. This is the chemistry of a copper surface without the surface: no tarnish layer to remove, no shine to come back, and no distinction between a coin that has been dipped for a second and one left in overnight. What the bench has is what the liquid does."

["counting-in-fives"]
title = "Permanganate counts in fives: a redox titration, stopped at the endpoint"

["current-time-and-electrolysis-yield"]
title = "Current, time and electrolysis yield"
intro = "Hold time at 75 s and order the product inventories made by 0.05 A, 0.1 A, 0.2 A and 0.4 A. Connect the order to charge Q = I t; current alone is not a yield law when time is allowed to change."

["dancing-raisins"]
title = "Dancing raisins: how much gas does it take to lift one?"
intro = "A raisin is heavier than water, so it sinks. Bubbles stick to its wrinkled skin, and when enough of them have gathered the raisin and its bubbles TOGETHER are lighter than the water — up it goes. At the top the bubbles pop and it comes back down. Nothing reacts in this experiment: the raisin is the same raisin all the way through. What changes is only where it is."
part.1 = "1. The control. A raisin in plain water, with no gas anywhere. It sinks, and it stays there, and the bench says nothing about dancing because there is nothing to dance on."
part.2 = "2. The experiment. Put the raisin in first and pour the fizzy water over it — which is also how you do it in a kitchen. Read the number: the bubbles have to be worth about a third of the raisin's own size."
part.3 = "3. Now make the liquid heavier. Sugar syrup is denser than water, so the raisin is much closer to floating already — and the gas has far less work to do. Same raisin, same bubbles, a third of the lift needed."
boundary = "What this does not model: how long the dancing lasts, how many trips the raisin makes, how big the bubbles are or how many stick. This bench lets a glass of fizzy water go flat in a single step, so there is no clock to put a period on. What it computes is the density of the object, the density of the liquid it is in, and how much attached gas would lift it — and that last number is what the experiment is actually about."

["density-tower-boundary"]
title = "Density tower: what the meter proves, and what mixing removes"
part.1 = "Each source liquid has a computed density. Putting mutually miscible liquids in one cylinder uses the ordinary add operation and therefore mixes them; without a slow-pour operation and vertical diffusion state, a persistent layered tower would be a false visual claim."

["density"]
title = "Density: the measurement that tells things apart when weighing cannot"
intro = "Put five grams of copper, five grams of zinc and five grams of aluminium on a balance and you learn nothing: they all weigh five grams. What separates them is how much ROOM those five grams take up, and that is density — mass divided by volume, a property of the substance itself rather than of the piece you happen to be holding."
part.1 = "1. Three metals, the same mass, three different answers."
part.2 = "The balance says 5 g three times. The density meter says 8.96, 7.14 and 2.70 g/mL — and the aluminium piece is more than three times the size of the copper one. That is why a dealer weighs scrap metal AND checks how big it is."
part.3 = "2. Liquids have densities too, and dissolving something changes them. This is what a density tower is built on: each layer has to be heavier than the one above it or the tower will not stack."
part.4 = "Three liquids, three densities, and they climb with the sugar. Poured very gently, heaviest first, they would sit in layers — but this bench has no slow pour: pour them together here and they mix, which is what would really happen if you poured them quickly. The numbers are the part the tower depends on, and they are right."
part.5 = "3. A density belongs to ONE substance. Two powders in a heap have a mass and a volume, and no density anyone should be told."
boundary = "What this does not model: the volume of a piece is computed from the substance's reviewed density, not measured by displacing water, so this is the density of the material and not of the object — a hollow or bubbled piece would read the same here and float in a real bucket. The solute volumes in the sugar solutions use the additive-volume approximation the rest of the bench uses; a real syrup contracts very slightly on mixing."

