title = "Neutralisationsenthalpie: Wie viel Wärme liefert eine Säure-Base-Reaktion?"

["candle-jar"]
title = "Die Kerze und das Glas: Eine Flamme verbraucht NICHT allen Sauerstoff"
intro = "Jedem wird beigebracht, dass eine Kerze unter einem Glas „den Sauerstoff aufbraucht“ und ausgeht. Sieh dir hier die Zahlen an: Sie geht aus, während noch etwa drei Viertel des Sauerstoffs im Glas sind. Eine Flamme braucht nicht IRGENDWIE Sauerstoff — sie braucht Luft, die REICH daran ist, etwa ein Teil von sechs, und darunter hört sie auf, obwohl reichlich übrig ist."
part.1 = "1. Eine Kerze an der freien Luft. Nichts begrenzt sie, sie brennt also vollständig ab — 5 g Wachs sind etwa 210 kJ, und das ist viel Energie für etwas, das man in einer Hand halten kann."
part.2 = "2. Dieselbe Kerze unter einem Glas. `regulate` ist die ehrliche Grenze für ein Glas, das auf dem Tisch steht: Das Gas kann nicht entweichen, aber drücken, es zerspringt also nichts. Achte vorher und nachher auf die Sauerstoffzeile."
part.3 = "Lies nach, was gerade passiert ist. Kaum Wachs ist verbrannt, die Flamme ist aus, und es ist noch Sauerstoff im Glas — er fiel von 21 % des Gases auf 16 %, und das reichte, um sie zu stoppen. Kohlendioxid und Wasser haben den Platz des verbrauchten Sauerstoffs eingenommen."
part.4 = "3. Ein Feuerlöscher, also eine Flasche Kohlendioxid. Der Kerze wird nichts weggenommen: Das Wachs ist noch da, und der Sauerstoff auch. Das Kohlendioxid nimmt nur Platz weg, und jetzt kann die Flamme gar nicht erst anfangen."
part.5 = "4. Auch Papier brennt, und es ist dieselbe Chemie mit einem anderen Brennstoff: Cellulose statt Wachs. Papier entzündet sich bei 506 K — das sind 451 Grad Fahrenheit, und der Titel des Romans ist ein echter Messwert. Sieh dir an, wie viel weniger Wärme dieselbe Masse liefert als Wachs."
boundary = "Was hier nicht abgebildet wird: der Docht, der geschmolzene See, das Licht. Eine echte Kerze verbrennt langsam WachsDAMPF, der im Docht hochgezogen wird; diese Werkbank verbrennt auf einmal, was die Luft zulässt, und bildet die Uhr nicht ab. Es gibt keinen Ruß, keinen Rauch, keine Verkohlung und kein Kohlenmonoxid — das Verbrennen ist hier immer vollständig, direkt zu Kohlendioxid und Wasser. Und die Grenze von 16 % ist eine einzelne Lehrzahl für etwas, das in Wirklichkeit vom Brennstoff, vom Docht und von der Form des Glases abhängt."

["chalk-vinegar"]
title = "Schäumt Kreide in Essig? Eine Säurekontrolle mit zwei Gefäßen"
intro = "Nimm für einen echten Versuch nur gewöhnlichen 5-prozentigen Speiseessig und Schulkreide aus Calciumcarbonat. Trage eine Schutzbrille, schütze den Tisch, frage vorher eine erwachsene Person, und koste niemals etwas, das in Laborglas gestanden hat."
part.control = "Kontrolle: Ein Kreidestift löst sich in derselben Menge reinem Wasser kaum und hat keine begrenzte Säurequelle, aus der ein sichtbarer Stoß Kohlendioxid entstehen könnte."
part.test = "Test: Ersetze das Wasser durch das benannte Rezept für 5-prozentigen Essig und lass die Kreidemenge gleich. Die ausgeglichene Reaktion verbraucht begrenztes CaCO3 und begrenzte Essigsäure. Ihr wirklicher CO2-Bestand treibt den gewohnten Blaseneffekt und entweicht aus diesem offenen Becherglas; er ist keine abgespielte Animation."
boundary = "Versuche es in einem frischen Gefäß mit weniger Kreide oder weniger Essig. Das begrenzende Reagenz bestimmt die Gasmenge. Mahlen würde die tatsächliche Geschwindigkeit ändern, doch eine Kinetik über die Teilchenoberfläche bleibt für diese Reaktion ausdrücklich ein künftiges Modell."

