["current-time-and-electrolysis-yield"]
title = "Stromstärke, Zeit und Ausbeute der Elektrolyse"
intro = "Halte die Zeit bei 75 s fest und ordne die Produktmengen, die 0,05 A, 0,1 A, 0,2 A und 0,4 A erzeugen. Verbinde diese Reihenfolge mit der Ladung Q = I · t; die Stromstärke allein ist kein Ausbeutegesetz, sobald sich auch die Zeit ändern darf."

["dancing-raisins"]
title = "Tanzende Rosinen: Wie viel Gas braucht es, um eine anzuheben?"
intro = "Eine Rosine ist schwerer als Wasser, sie sinkt also. An ihrer runzligen Haut bleiben Blasen hängen, und wenn genug davon beisammen sind, sind die Rosine und ihre Blasen ZUSAMMEN leichter als das Wasser — nach oben geht es. Oben platzen die Blasen, und sie kommt wieder herunter. In diesem Versuch reagiert nichts: Die Rosine ist die ganze Zeit dieselbe Rosine. Was sich ändert, ist nur, wo sie ist."
part.1 = "1. Die Kontrolle. Eine Rosine in reinem Wasser, ganz ohne Gas. Sie sinkt und bleibt unten, und die Werkbank sagt nichts vom Tanzen, weil es nichts zum Tanzen gibt."
part.2 = "2. Der Versuch. Leg die Rosine zuerst hinein und gieß das Sprudelwasser darüber — so macht man es auch in der Küche. Lies die Zahl ab: Die Blasen müssen etwa ein Drittel der Rosine selbst wert sein."
part.3 = "3. Mach die Flüssigkeit nun schwerer. Zuckersirup ist dichter als Wasser, die Rosine ist dem Schwimmen also schon viel näher — und das Gas hat weit weniger zu tun. Dieselbe Rosine, dieselben Blasen, ein Drittel des nötigen Auftriebs."
boundary = "Was hier nicht abgebildet wird: wie lange das Tanzen dauert, wie viele Fahrten die Rosine macht, wie groß die Blasen sind und wie viele hängen bleiben. Diese Werkbank lässt ein Glas Sprudelwasser in einem einzigen Schritt schal werden, es gibt also keine Uhr, die einen Schlusspunkt setzt. Berechnet werden die Dichte des Körpers, die Dichte der Flüssigkeit, in der er liegt, und wie viel anhaftendes Gas ihn anheben würde — und genau um diese letzte Zahl geht es in dem Versuch."

["density-tower-boundary"]
title = "Dichteturm: was das Messgerät beweist und was das Mischen zunichtemacht"
part.1 = "Jede Ausgangsflüssigkeit hat eine berechnete Dichte. Mischbare Flüssigkeiten in einen Zylinder zu geben benutzt den gewöhnlichen Zugabebefehl und mischt sie deshalb; ohne einen Befehl zum langsamen Überschichten und ohne einen Zustand für die senkrechte Diffusion wäre ein dauerhaft geschichteter Turm eine falsche Behauptung im Bild."

["density"]
title = "Dichte: die Messung, die Dinge unterscheidet, wo Wiegen es nicht kann"
intro = "Leg fünf Gramm Kupfer, fünf Gramm Zink und fünf Gramm Aluminium auf eine Waage, und du lernst nichts: Alle wiegen fünf Gramm. Unterscheiden tut sie, wie viel PLATZ diese fünf Gramm einnehmen, und das ist die Dichte — Masse geteilt durch Volumen, eine Eigenschaft des Stoffes selbst und nicht des Stücks, das du gerade in der Hand hast."
part.1 = "1. Drei Metalle, dieselbe Masse, drei verschiedene Antworten."
part.2 = "Die Waage sagt dreimal 5 g. Das Dichtemessgerät sagt 8,96, 7,14 und 2,70 g/mL — und das Stück Aluminium ist mehr als dreimal so groß wie das aus Kupfer. Deshalb wiegt ein Händler Altmetall UND sieht sich an, wie groß es ist."
part.3 = "2. Auch Flüssigkeiten haben eine Dichte, und etwas darin zu lösen ändert sie. Darauf baut ein Dichteturm auf: Jede Schicht muss schwerer sein als die darüber, sonst hält der Turm nicht."
part.4 = "Drei Flüssigkeiten, drei Dichten, und sie steigen mit dem Zucker. Ganz behutsam übereinandergeschichtet, die schwerste zuerst, lägen sie in Schichten — doch diese Werkbank kann nicht langsam gießen: Gießt man sie hier zusammen, mischen sie sich, und genau das würde auch wirklich geschehen, wenn man schnell gösse. Die Zahlen sind der Teil, auf den der Turm angewiesen ist, und sie stimmen."
part.5 = "3. Eine Dichte gehört EINEM Stoff. Zwei Pulver auf einem Haufen haben eine Masse und ein Volumen, aber keine Dichte, die man jemandem nennen sollte."
boundary = "Was hier nicht abgebildet wird: Das Volumen eines Stücks wird aus der geprüften Dichte des Stoffes berechnet und nicht durch Verdrängung von Wasser gemessen; das ist also die Dichte des Materials und nicht die des Körpers — ein hohles oder aufgeschäumtes Stück läse sich hier gleich und schwämme in einem echten Eimer. Die Volumina der gelösten Stoffe in den Zuckerlösungen nutzen dieselbe Näherung additiver Volumina wie der Rest der Werkbank; ein echter Sirup zieht sich beim Mischen ein klein wenig zusammen."

