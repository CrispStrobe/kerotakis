["chalk-vinegar"]
title = "Schäumt Kreide in Essig? Eine Säurekontrolle mit zwei Gefäßen"
intro = "Nimm für einen echten Versuch nur gewöhnlichen 5-prozentigen Speiseessig und Schulkreide aus Calciumcarbonat. Trage eine Schutzbrille, schütze den Tisch, frage vorher eine erwachsene Person, und koste niemals etwas, das in Laborglas gestanden hat."
part.control = "Kontrolle: Ein Kreidestift löst sich in derselben Menge reinem Wasser kaum und hat keine begrenzte Säurequelle, aus der ein sichtbarer Stoß Kohlendioxid entstehen könnte."
part.test = "Test: Ersetze das Wasser durch das benannte Rezept für 5-prozentigen Essig und lass die Kreidemenge gleich. Die ausgeglichene Reaktion verbraucht begrenztes CaCO3 und begrenzte Essigsäure. Ihr wirklicher CO2-Bestand treibt den gewohnten Blaseneffekt und entweicht aus diesem offenen Becherglas; er ist keine abgespielte Animation."
boundary = "Versuche es in einem frischen Gefäß mit weniger Kreide oder weniger Essig. Das begrenzende Reagenz bestimmt die Gasmenge. Mahlen würde die tatsächliche Geschwindigkeit ändern, doch eine Kinetik über die Teilchenoberfläche bleibt für diese Reaktion ausdrücklich ein künftiges Modell."

