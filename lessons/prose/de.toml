title = "Titration: starke Säure trifft starke Base"

["track-precipitate-and-filtrate-through-drying"]
title = "Verfolge Niederschlag und Filtrat durch das Trocknen"
intro = "Bilde zweimal Bariumsulfat. Filtriere beide Ansätze und trockne dann nur das zweite Filtrat. Bilanziere den BaSO4-Rückstand und die gelösten Zuschauerionen in jedem System aus Quelle und Auffanggefäß, bevor du entscheidest, ob Materie verloren ging."
boundary = "Nur Simulation: lösliche Bariumsalze sind giftig. Eine echte Durchführung verlangt geschulte Aufsicht, Augenschutz, Handschuhe und die Sammlung als Sondermüll."

["transport-column"]
title = "Ein Salzstoß durch eine Wassersäule"
intro.1 = "Drei Zellen mit reinem Wasser. Ein viertes Gefäß enthält Salzwasser — den Zulauf. Drücke den Zulauf durch die Säule und fang auf, was herauskommt. Nach drei Schritten bei einer Courant-Zahl von 0,5 hat sich das Salz gemäß den Binomialkoeffizienten in der Säule verteilt: Die Front zerfließt genau so, wie es die Theorie sagt."
intro.2 = "v1 ist das voreingestellte Becherglas — nimm es als Zelle 1"
part.1 = "Zellen 2 und 3"
part.2 = "der Zulauf: Salzwasser im gleichen Volumen"
part.3 = "ein leeres Auffanggefäß für den Ablauf"
part.4 = "drücke das Salz in drei Schritten hindurch"
part.5 = "sieh nach, was wo gelandet ist"

["two-limits-one-carbon-dioxide-ledger"]
title = "Zwei Grenzen, eine Kohlendioxid-Bilanz"
intro.1 = "Halte das Hydrogencarbonat fest, während die Säure steigt, und halte dann die Säure im Überschuss, während das Hydrogencarbonat steigt. Welches Reagenz begrenzt das berechnete Kohlendioxid? Aufgabe für Fortgeschrittene. Vergleiche beide Vierergruppen: Eine größere Dosis hebt die Kohlenstoffbilanz nur so lange, bis der andere Reaktionspartner zum begrenzenden wird."
intro.2 = "Grenze des Modells: Das sind Bestandsrechnungen im Gleichgewicht und keine Vorhersage über Sprudelgeschwindigkeit oder Blasenvolumen. Die offenen virtuellen Gefäße können Kohlendioxid abgeben; Schaumhöhe, Keimbildung, Gasauffang, Wärmeaustausch, Mischzeit und echte Fehler beim Ansetzen fehlen. Ein Versuch in echt sollte kleine, von einer Lehrkraft angesetzte verdünnte Portionen, Augenschutz und ein offenes Gefäß verwenden — verschließe ein Gemisch aus Säure und Carbonat niemals."

["two-roads"]
title = "Zwei Wege, eine Temperatur: der Satz von Hess mit dem Thermometer"

["vitamin-c-detective"]
title = "Vitamin-C-Detektiv: die Reaktionsbilanz hinter einer verschwindenden Farbe"
intro = "Iod in verdünnter Lugolscher Lösung färbt Stärke blauschwarz. Ascorbinsäure reduziert das Iod und wird dabei zu Dehydroascorbinsäure oxidiert, deshalb klart die Farbe auf. Schütze Kleidung und Tisch, trage Augenschutz und koste niemals ein Gemisch, das als Laborprobe gedient hat."
part.1 = "Die positive Farbkontrolle: Stärke und dieselbe Menge Lugolscher Lösung."
part.2 = "Ändere eine Sache: Gib vor dem Iod eine bekannte Menge Vitamin C dazu. Das Iod wird verbraucht, während Vitamin C übrig bleibt, der blauschwarze Nachweis erscheint also nicht. Bei dieser Dosis kann die derzeitige, grobe Sicherheitsprüfung für Oxidations- und Reduktionsmittel eine Warnung ausgeben, die für konzentrierte Reagenzien geschrieben wurde; sie ist bewusst vorsichtig und keine quantitative Risikobewertung dieses verdünnten Bechers."
boundary = "Die Bilanz benennt die Dehydroascorbinsäure, auch wenn die Beschreibung des Aussehens den farblosen Becher derzeit mit einem allgemeinen „nichts zu sehen“ beantwortet. Das ist eine Grenze der Darstellung und keine Erlaubnis, ein Farbereignis zu erfinden. Es ist außerdem keine kalibrierte Lebensmittelanalyse: Ein echter Saft hat einen unsicheren Vitamingehalt und enthält weitere reduzierende Stoffe, die Farbe allein rechtfertigt also keine Angabe für eine Nährwerttabelle."

["volcano-foam"]
title = "Der Vulkan: warum es auf die Seife ankommt"
intro = "Ein Natronvulkan ohne Spülmittel ist ein Sprudeln. Mit Spülmittel wird das Gas beim Austreten in einem Film eingefangen, und das Ganze steigt über den Rand. An der Chemie ändert sich nichts — dasselbe Kohlendioxid, dieselbe Menge davon. Was sich ändert, ist, ob das Gas entkommen kann."
part.1 = "1. Die Kontrolle. Natron und Essig, keine Seife: Es sprudelt, das Gas geht weg, und hinterher ist nichts zu sehen außer einer flachen Flüssigkeit."
part.2 = "2. Dieselbe Reaktion mit Spülmittel, das schon im Glas ist. Gib die Seife ZUERST hinein — sie muss da sein, wenn das Gas kommt, denn Gas, das schon weg ist, lässt sich nicht mehr einfangen."
part.3 = "3. Und es hält nicht an. Der Schaum läuft ab und die Blasen fließen zusammen: Zwei Minuten gegen die Halbwertszeit von 180 Sekunden dieser Seife bringen 1,375 L auf 0,866 L herunter, also etwas mehr als ein Drittel weg. Nicht „fast wieder zurück zur Flüssigkeit“ — das war die Vermutung vor dem Durchlauf, und die Zahl ist langsamer als die Vermutung."
boundary = "Was hier nicht abgebildet wird: Blasengröße, wie der Film abläuft oder der Unterschied zwischen einem Tensidfilm und einem aus Proteinen. Die Halbwertszeit ist die geprüfte Zahl des Rezepts selbst, und der eingefangene Anteil ist ein begrenzter Lehrwert — das sagt, DASS es schäumt und ungefähr wie schnell es zurückgeht, nicht woraus der Schaum besteht."

["warm-the-gas-stop-before-burst"]
title = "Erwärme das Gas und hör vor dem Bersten auf"
intro = "Sag die Reihenfolge der Drücke für gleiche eingeschlossene Gasproben bei 0 J, 100 J, 200 J und 400 J voraus. Die ersten drei bleiben messbar, die letzte überschreitet die Belastbarkeit des Gefäßes. Hör dort auf: Ein Bersten ist ein Befund und keine Einladung, es noch einmal zu versuchen."

["water-electrolysis"]
title = "Leitfähiges Wasser zerlegen: zwei Gase im Verhältnis zwei zu eins"
intro = "Reines Wasser leitet für diese Apparatur zu schlecht und wird weiterhin abgelehnt. Etwas Natriumsulfat trägt den Strom, ohne selbst bevorzugt entladen zu werden: Aus Wasser wird an der Kathode Wasserstoff und an der Anode Sauerstoff."
part.1 = "Lass die Zelle offen: Wasserstoff und Sauerstoff gemeinsam aufzufangen ergäbe ein zündfähiges Gemisch, und zum Vergleich der Mengen muss man gar kein Gas auffangen."
boundary = "Die Mengen gehören dem Faraday-Gesetz: zwei Elektronen je H2 und vier je O2, also doppelt so viel Wasserstoff. Das ist eine ungeteilte Lehrzelle mit inerten Elektroden. Sie bildet weder Überspannung an den Elektroden noch Gasübertritt, Membran, Zündung, Wirkungsgrad oder die zum Stromfluss nötige Spannung ab."

["water-filter"]
title = "Bau einen Wasserfilter: trüb ist nicht dasselbe wie gelöst"
intro = "Das ist eine geprüfte Lehrsuspension aus quarzreichem Spielsand. Echtes Schmutzwasser kann außerdem Ton, Mikroben, gelöste Salze und Schadstoffe enthalten; ein klares Filtrat ist nicht automatisch sauber oder rein, und diese Simulation behauptet nichts über Trinkwasser."
part.1 = "Das Filterpapier hält die festen Körner zurück, während das Wasser in das Auffanggefäß läuft."
boundary = "Der sichtbare Unterschied und der erhaltene Quarz sind berechnet. Die Porengröße des Papiers, die Korngrößenverteilung in der Natur und eine Reinigung über Feststoffe hinaus sind es nicht."

["whole-object-buoyancy"]
title = "Ganze Körper: warum ein Apfel schwimmt und eine Kartoffel sinkt"
intro = "Die Dichte gehört dem ganzen Körper. Bimsstein enthält dichtes Siliciumdioxid, doch seine luftgefüllten Poren senken die Rohdichte des Steins; auch ein Apfel trägt Lufträume. Eine Kartoffel ist etwas dichter als Wasser. Das Bild und die Zeilen darunter benutzen beide diese geprüften Dichten ganzer Körper."
boundary = "Vorhersage zum Besprechen: Nur die Dichte einer Zutat zu ändern wäre die falsche Rechnung. Form, Poren und eingeschlossene Luft gehören zu einem massiven Körper dazu. Dieses begrenzte Modell simuliert noch nicht, wie Wasser in die Poren des Bimssteins eindringt, deshalb saugt sich der Bimsstein nicht langsam voll und sinkt nicht."

["yeast-fermentation"]
title = "Was weckt Hefe auf? Ein fairer Vergleich mit Zucker und Hefe"
intro = "Vergleiche drei gewöhnliche Ansätze an einer gemeinsamen Uhr. Nimm für einen echten Versuch angenehm warmes, nicht heißes Wasser; frag eine erwachsene Person, bevor du Lebensmittel verwendest, koste keine Laborgemische, und verschließe ein gärendes Gefäß niemals fest."
part.1 = "Kontrolle 1 hat Wasser und Zucker, aber keine lebende Kultur."
part.2 = "Kontrolle 2 hat Wasser und Hefe, aber keinen Zucker als Nahrung."
part.3 = "Versuch 3 ändert nur die fehlende Zutat: Er hat dieselben Mengen Wasser, Zucker und Hefe. Der Zucker löst sich, bevor die gemeinsame Uhr startet."
part.4 = "Für jedes Gefäß vergehen gleichzeitig zehn Minuten. Nur v3 hat gelösten Zucker und eine gequollene Hefekultur, nur dort dürfen also die berechneten Ereignisse GasProduced und Fermented auftreten. Die CO2-Blasen sind Materie, die der hinterlegte ausgeglichene Reaktionsweg erzeugt, und keine Zeitschaltuhr für eine Animation."
boundary.1 = "Probiere frische Hefe mit gleicher Trockenmasse, eine andere Temperatur oder weniger Zucker. Das ist ein begrenztes Unterrichtsmodell und kein Beleg dafür, dass ein echter Ansatz zum Trinken, Backen, Abfüllen oder Verschließen sicher ist; Wachstum, Umschalten auf Sauerstoff, Hemmung, Aromastoffe und dehnbare Luftballons bleiben ausdrücklich künftige Arbeit."
boundary.2 = "WIE SCHNELL, UND WIE VIEL DAVON BEHAUPTET WIRD. Am 16.09.2026 wurde die Hefegeschwindigkeit zum ersten Mal angepasst: Die Konstante ist die, bei der ein Gramm Hefe in einem Liter dieser Zuckerstärke in der ersten Stunde bei 30 °C 1,5 g Ethanol abgibt — die höchste veröffentlichte spezifische Rate für anaerobe Bier- und Backhefe (Pagliardini et al. 2013, Microbial Cell Factories 12:29). Davor verbrauchten zehn Minuten hier 58,6 % des Zuckers und machten aus einem 100-mL-Becherglas etwa 1,7 Liter Kohlendioxid — mehr Gas, als das Glas fasst. Jetzt sind es etwa 3,7 % und ungefähr 105 mL, also ein Luftballon, den eine Klasse sehen kann."
boundary.3 = "DAS IST EINE OBERE SCHRANKE UND KEINE VORHERSAGE. Die zitierte Rate gehört zu einem Laborstamm, der in einem Fermenter wächst, nicht zu Supermarkthefe in kaltem Zuckerwasser; ein Gramm Trockenhefe wird hier als ein Gramm lebender Zellen gezählt, was es nicht ist; und die Hefe dieses Modells vermehrt sich nie, macht nie eine Pause zum Aufwachen und wird nie durch den Alkohol gebremst, den sie erzeugt. Ein veröffentlichter Punkt wird getroffen. Die Form der Kurve durch ihn hindurch wird nicht behauptet, ein längeres Warten läuft auf dieser Werkbank also schneller ab als in Wirklichkeit, und die Quellphase davor ist eine Sache von Sekunden, wo eine echte Packung Trockenhefe zehn bis fünfzehn Minuten in warmem Wasser haben will."
