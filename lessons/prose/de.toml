# Lektionstexte auf Deutsch.
#
# Gegenstück zu `en.toml`: derselbe Schlüssel, dieselbe Stelle in der
# Lektion. Der Schlüssel benennt den ORT, an dem der Text gesagt wird, nicht
# den englischen Satz — eine Umformulierung des Englischen macht die
# Übersetzung also nicht zur Waise.
#
# Von Hand geschrieben, nicht maschinell gefüllt. Eine Lektion, für die noch
# kein gutes Deutsch vorliegt, trägt noch keine Marken im `.lab` und wird von
# `tools/lesson-prose-lint.py` als "noch nicht migriert" gezählt. Ein
# fehlender Schlüssel hier ist ein Fehler, keine Lücke.

["antacid-suspension"]
title = "Eine Antazida-Suspension: Die Neutralisation endet, wenn die Säure verbraucht ist"
intro = "Überschüssiges, schwer lösliches Magnesiumhydroxid bleibt zurück. Das ist Chemie und weder ein medizinischer Rat noch eine Dosierungsempfehlung."

["apple-browning"]
title = "Einen angeschnittenen Apfel am Braunwerden hindern"
intro = "Das Braunwerden gehört allein zur vorbereiteten Identität cut_apple: Ein unversehrter, allgemeiner Apfel hat keine ausgewiesene frische Schnittfläche. Die Antwort ist eine begrenzte Beobachtungsgröße aus Sauerstoff und Zeit, kein Enzymumsatz, keine Aussage über Geschmack, Beschaffenheit oder Lebensmittelsicherheit."
part.1 = "Luftkontrolle: Eine frische Schnittfläche bräunt, während die gemeinsame Uhr weiterläuft."
part.2 = "Vergleich mit Vitamin C: dieselbe Masse, dieselbe Luft, dieselbe Zeit, nur mit Ascorbat daneben. Das Modell berechnet die Hemmung der sichtbaren Reaktion; es behauptet keine dauerhafte Konservierung."

["baking-powder-or-soda"]
title = "Backpulver oder Natron: Wasser, Säure und Hitze sind verschiedene Auslöser"
intro = "Die beiden weißen Pulver sind nicht austauschbar. Diese Simulation vergleicht gleiche Portionen und ändert dabei jeweils nur eine Bedingung. Echtes Backpulver enthält ein Gemisch von Säuren, deren gestaffelte Wirkung von Marke zu Marke verschieden ist; der hier benannte Stoff ist ein geprüfter Lehrersatz und kein Rezept für Lebensmittel."
part.1 = "Natron löst sich in kaltem Wasser. Das Gleichgewicht in der Lösung kann auch ohne eine Flasche Säure etwas CO2 freisetzen; das ist nicht derselbe Weg wie der Zerfall durch Hitze."
part.2 = "Der benannte Backpulverersatz enthält Hydrogencarbonat und Stärke. Beim Erwärmen setzt er auf einem weiteren modellierten Weg CO2 frei. Die gestaffelten Säuresysteme bestimmter handelsüblicher Backpulver bildet er nicht nach."
part.3 = "Säure ist ein anderer Weg zum selben sichtbaren Gas. Diese Kontrolle nutzt gewöhnlichen 5-prozentigen Essig. Die Werkbank bildet weder Krume noch Teigelastizität, weder Ofenfeuchte noch die Frage ab, ob ein Gebäck aufgegangen ist."

["balloon-pressure"]
title = "Luftballon auf der Flasche: Gas braucht einen Platz"
intro = "Ein Kolbendeckel steht hier für einen dehnbaren Luftballon: Er berechnet Druck und wachsendes Volumen, nicht die Elastizität des Gummis, die Form des Ballons oder das Reißen des Latex."

["blue-crystals"]
title = "Blaue Kristalle aus Kupfersulfat züchten"
intro = "Kupfervitriol ist der Kristall, den jede Schule züchtet: Löse so viel Kupfersulfat, wie heißes Wasser aufnimmt, lass es abkühlen, und das Wasser gibt das meiste davon als große blaue Kristalle zurück. Das Blau ist nicht das Kupfer allein — es sind die fünf Wassermoleküle, die mit ihm im Kristall eingeschlossen sind, und deshalb hat der Feststoff einen eigenen Namen."
part.1 = "Dreißig Gramm auf hundert Milliliter sind mehr, als kaltes Wasser halten kann, ein Teil kommt also sofort als Chalkanthit wieder heraus. Sieh dir die Flüssigkeit an, die zurückbleibt: so konzentriert, dass die Werkbank sie SCHWARZ nennt statt blau — und genau so sieht eine starke Kupfersulfatlösung im Becherglas wirklich aus: Die Farbe sättigt, und man kann nicht mehr hindurchsehen."
part.2 = "Erwärme sie, und das Wasser nimmt alles auf."
part.3 = "Und nun kühle sie richtig ab. Das ist der Schritt, in dem die Kristalle wachsen, und die Werkbank schreibt die Gleichung dazu auf: Kupfer, Sulfat und fünf Wasser gehen in einen Feststoff. Und jetzt liest sich die Flüssigkeit BLAU statt schwarz — nicht weil etwas die Farbe gewechselt hätte, sondern weil so viel Kupfer sie verlassen hat, dass man durch den Rest hindurchsehen kann."
boundary.1 = "Was hier nicht abgebildet wird: der Kristall. Keine Form, keine Flächen, kein einzelnes großes Stück, das eine Woche lang an einem Faden wächst — die Werkbank sagt, wie viel Feststoff zurückkommt und welche Farbe er hat, und bei einem Wettbewerb im Kristallzüchten zählt alles andere."
boundary.2 = "Du wirst außerdem sehen, wie die Werkbank drei weitere Kupferfeststoffe ablehnt, gegen die die Lösung laut Datenbank übersättigt ist — Langit, Antlerit, Brochantit, die Grüntöne von verwittertem Kupfer. Sie werden benannt und abgelehnt statt stillschweigend übergangen, denn eine Lösung, die sie wirklich ausfällen würde, ist keine Lösung, die dieses Becherglas ehrlich beschreibt."

["boiling-curve"]
title = "Die Heizkurve: warum ein kochender Topf bei 100 °C bleibt"
intro = "Wärme ist nicht Temperatur. Ein Gefäß auf der Platte wird stetig wärmer, bis das Wasser zu sieden beginnt, und dann steigt die Temperatur nicht weiter — jedes weitere Joule kauft Dampf statt Grad. Dieser flache Abschnitt ist die latente Wärme, und er ist der Grund, warum ein Topf kochenden Wassers durch mehr Hitze nicht heißer wird, sondern nur leerer."
part.1 = "Unterhalb des Plateaus: 30 kJ in 100 mL sind reine fühlbare Wärme."
part.2 = "Darüber hinaus. Die nächsten 30 kJ bewegen das Thermometer nicht; sie tragen Wasser aus."
part.3 = "Und noch einmal dieselbe Energie, dieselbe Temperatur, noch weniger Wasser."
part.4 = "Salz hebt das Plateau: derselbe kolligative Effekt, der den Gefrierpunkt einer gestreuten Straße senkt, hebt den Siedepunkt eines gesalzenen Topfes."
boundary = "Was hier nicht abgebildet wird: Die am Plateau übrige Wärme wird auf die Wärmekapazität verteilt, die das Gefäß *vor* dem Trockenkochen hatte, die Endtemperatur eines trockengekochten Gefäßes wird also zu niedrig angegeben; und der Dampf verlässt ein offenes Gefäß, statt weiterverfolgt zu werden."

["borax-snowflake"]
title = "Eine Boraxschneeflocke: warum manches beim Abkühlen kristallisiert und anderes nicht"
intro = "Borax ist der Grund, warum dieser Versuch mit Borax gemacht wird. Kaltes Wasser nimmt fast nichts davon auf; kochendes Wasser elfmal so viel. Löse so viel du kannst in heißem Wasser, lass es abkühlen, und das Wasser muss das meiste davon wieder hergeben — als Kristalle."
part.1 = "1. Zuerst kaltes Wasser, damit du siehst, wie wenig es aufnimmt. Fünfundzwanzig Gramm kommen hinein, und das meiste liegt einfach da."
part.2 = "2. Erwärme es. Jetzt schluckt dasselbe Wasser fast alles."
part.3 = "3. Und kühle es richtig ab. Was das Wasser nicht mehr halten kann, kommt wieder heraus — 0,096 mol, also das meiste von dem, was sich gelöst hatte."
part.4 = "4. Der Gegensatz, auf den es ankommt, und die Werkbank zeichnet ihn schärfer, als es die Zahlen allein tun. Auch die Löslichkeit von Zucker steigt mit der Temperatur — von 200 auf 487 g je 100 mL, gut das Doppelte, gegen 2,5 auf 27,4 bei Borax, das Elffache. Aber sieh, was die beiden auf dem Weg nach unten tun: Das Borax kommt HERAUS, und der Zuckersirup wird ÜBERSÄTTIGT und bleibt bei dem 1,25-Fachen dessen gelöst, was das Wasser halten sollte. Genau diesen Unterschied erlebt man auch in der Küche. Eine Boraxschneeflocke wächst über Nacht von allein; Kandiszucker liegt da und weigert sich anzufangen, bis man ihm eine Schnur zum Wachsen gibt."
boundary.1 = "Was hier nicht abgebildet wird: der Kristall. Es gibt keinen Pfeifenreiniger zum Anwachsen, keine Tracht, keine sechszählige Symmetrie — die Werkbank sagt, wie viel Feststoff zurückkommt, nicht welche Form er annimmt, und bei einer Schneeflocke geht es ausschließlich um die Form."
boundary.2 = "Und eine offengelegte Ersetzung: Die Löslichkeiten aus dem Tabellenwerk gelten für das Decahydrat Na2B4O7·10H2O, und genau das kristallisiert auch wirklich aus einer abkühlenden Lösung aus. Diese Datenbank kennt nur das wasserfreie Salz, es steht also für das Decahydrat, mit dessen Löslichkeit und über das Massenverhältnis umgerechnet. Die Mengen stimmen; der Feststoff, der sie trägt, ist ein Stellvertreter."

["buffer"]
title = "Puffer: warum dein Blut den pH-Wert nicht ändert, wenn du Limonade trinkst"

["cabbage-rainbow"]
title = "Der Rotkohl-Regenbogen: ein Farbstoff, fünf Farben"
intro = "Rotkohlwasser sind nicht fünf Farbstoffe. Es ist ein einziger Farbstoff, der in Stufen Protonen abgibt, und jede Stufe verschluckt Licht anders — seine Farbe ist also eine Ablesung des pH-Werts. Die Werkbank berechnet sie so wie jede andere Farbe: ε(λ) über Beer-Lambert und den CIE-Normalbeobachter, nicht über eine Tabelle mit „wird im Alkalischen blau“."
part.1 = "Essig: die Flavylium-Form, rot."
part.2 = "Sprudelwasser, leicht sauer: die mittlere Form, violett. Das ist die Farbe, die das Glas Saft hat, bevor irgendetwas mit ihm geschieht."
part.3 = "Natron: die erste alkalische Stufe."
part.4 = "Soda, stärker — und hier lohnt sich das Innehalten."
part.5 = "Starkes Alkali, ganz oben auf der Leiter."
part.6 = "Keine Form dieses Farbstoffs ist grün. Das Grün erscheint dort, wo eine blaue und eine gelbe Form gleichzeitig vorliegen: Zusammen verschlucken sie an beiden Enden des sichtbaren Bereichs Licht und lassen dazwischen ein Fenster offen. Das ist eine Farbe, die in keiner Tabelle dieser Maschine steht, berechnet aus zweien, die darin stehen — und genau das ist das ganze Argument dafür, Farbe zu berechnen statt sie zu speichern."
boundary = "Was hier nicht abgebildet wird: Echter Rotkohlsaft ist leicht sauer und puffert selbst, ein paar Tropfen in ungepuffertes Wasser würden den pH-Wert also verschieben und nicht nur anzeigen; hier zeigt der Saft nur an. Der Farbstoff ist ein Gemisch acylierter Cyanidin-Glykoside und keine einzelne Verbindung, und weder Sorte noch Extraktion noch eine Verschiebung durch Copigmentierung werden behauptet."

