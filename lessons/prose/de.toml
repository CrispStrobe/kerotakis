["copper-patina"]
title = "Eine Kupfermünze reinigen — und das Grün, das zurückkommt"
intro = "Eine angelaufene Münze wird in Essig wieder blank. Kommt es für das Grün, das danach erscheint, auf das Salz an? Zwei gleich angesetzte Bechergläser ändern eine einzige Sache, damit die Farbe ein Beleg ist und keine Geschichte, die wir uns hinterher erzählen."
part.1 = "1. Kontrolle: Kupferoxid und Essig, aber kein Chlorid."
part.2 = "2. Versuch: dieselben Mengen in einem frischen Becherglas, mit Salz als einziger Änderung."
part.3 = "Vergleiche die Bilanzen nebeneinander. Chlorid ist das, was gelöstes Kupfer wieder in einen grünen Feststoff verwandelt: Atacamit, Cu2Cl(OH)3, das Mineral, das an Kupferbeschlägen in Meeresnähe wächst. Die Kontrolle hält die Aussage über das Chlorid ehrlich."
boundary.1 = "Was das zeigt und was nicht. Das Blau in der Flüssigkeit ist gelöstes Kupfer(II) und wird berechnet; auch der grüne Feststoff wird berechnet, von der Maschine für wässrige Lösungen, aus einer Phase, die die mitgelieferte Datenbank seit jeher kennt. Was bis jetzt fehlte, war eine Spezies dafür im Verzeichnis dieses Labors — damit die Werkbank sehen konnte, dass die Lösung übersättigt war, das auch sagen konnte und nichts auf den Boden des Becherglases legen durfte."
boundary.2 = "Eine Münze gibt es weiterhin nicht. Das ist die Chemie einer Kupferoberfläche ohne die Oberfläche: keine Anlaufschicht zum Entfernen, kein Glanz, der zurückkehrt, und kein Unterschied zwischen einer Münze, die eine Sekunde eingetaucht wurde, und einer, die über Nacht darin lag. Was die Werkbank hat, ist das, was die Flüssigkeit tut."

