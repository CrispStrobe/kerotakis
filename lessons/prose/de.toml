["dry-then-wet-fizz"]
title = "Trocken, dann nass: warum Brausepulver und Badebomben auf Wasser warten"
intro = "Citronensäure und Natron können trocken nebeneinanderliegen. Erst Wasser lässt Ionen wandern und startet die Reaktion zwischen Säure und Carbonat. Das ist ein chemischer Vergleich und kein Rezept: Laborgemische werden nicht gekostet."
part.dry = "Trockene Kontrolle: Beide Zutaten sind vorhanden, aber keine Flüssigkeit verbindet sie."
part.wet = "Nasser Vergleich: dieselben Zutaten, diesmal mit Wasser zuerst."
boundary = "Zu echtem Brausepulver gehört der Geschmack, zu einer Badebombe gehören Bindemittel, Duftstoffe, Pressform und Auflösegeschwindigkeit. Nichts davon wird hier abgeleitet. Auch Schaum wird nicht behauptet: Gas schäumt nur, wenn ein modelliertes Tensid vorhanden ist."

