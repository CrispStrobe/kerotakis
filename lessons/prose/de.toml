# Lektionstexte auf Deutsch.
#
# Gegenstück zu `en.toml`: derselbe Schlüssel, dieselbe Stelle in der
# Lektion. Der Schlüssel benennt den ORT, an dem der Text gesagt wird, nicht
# den englischen Satz — eine Umformulierung des Englischen macht die
# Übersetzung also nicht zur Waise.
#
# Von Hand geschrieben, nicht maschinell gefüllt. Eine Lektion, für die noch
# kein gutes Deutsch vorliegt, trägt noch keine Marken im `.lab` und wird von
# `tools/lesson-prose-lint.py` als "noch nicht migriert" gezählt. Ein
# fehlender Schlüssel hier ist ein Fehler, keine Lücke.

