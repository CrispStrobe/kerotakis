# The curiosity corpus, in French.
#
# One file per language, beside the corpus it translates. See `i18n/de.toml`
# for the full explanation of the shape (three key spaces, sorted, folded in by
# `tools/curiosity-prose.py` as `question_fr` / `material_class_fr` / `tag_fr`
# siblings). Task identifiers among the tags (`CAP-5`, `EXP-17`, `BRD-041`) are
# names, not words, and are deliberately absent here.
#
# Wording rule, gated by that same validator: no French here may say enfant,
# gamin, âge or ans — the school-age band renders through the level words the
# explorer already maps, never through a number of years.

