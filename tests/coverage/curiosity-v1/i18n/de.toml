# The curiosity corpus, in German.
#
# One file per language, beside the corpus it translates. Adding French is
# `fr.toml` here and nothing else: no new field in a shard, no new branch in
# a component, no existing translation touched. Two translators working on
# two languages never edit the same file, which is what makes the work
# parallelisable at all.
#
# The corpus itself is a TEST ARTEFACT — `kero coverage curiosity --check`
# joins the baseline to it by `id`, and `CuriosityPrompt` is
# `deny_unknown_fields`, so a German question can never live in a shard.
# It lives here, keyed by the id the shard already owns, and is folded into
# the browser index by `tools/curiosity-prose.py` as a `question_de` sibling.
# A prompt whose translation is absent renders in English; a language that
# does not ship at all changes nothing.
#
# Three tables, because the explorer shows three kinds of authored English
# and they have different key spaces:
#
#   [question]       keyed by prompt id — 500 rows, one per prompt.
#   [material_class] keyed by the English token the shard writes.
#   [tag]            keyed by the English token the shard writes.
#
# The glossaries are keyed by the ENGLISH TOKEN rather than by prompt so
# that "solubility" is translated once and reads the same under every
# question that carries it. Task identifiers (`CAP-5`, `EXP-17`, `BRD-041`)
# appear among the tags and are deliberately absent here: they are names,
# not words, and `tools/curiosity-prose.py` refuses a translation of one.
#
# Wording rule, gated by that same validator: the corpus bands its prompts
# by school age, but a learner is never addressed by age or as a child, so
# no German here may say Kind, Alter or Jahre. The band renders through the
# level words the explorer already maps (`BAND_LABELS`), never through a
# number of years.

schema = 1
locale = "de"

# The learner's own wording, one row per prompt id, sorted as the index is.
# What a curious person would actually type — the question stays a question,
# and keeps the shape the English asked it in.
