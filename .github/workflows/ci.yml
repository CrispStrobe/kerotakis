name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded revision of one pull request must not keep a runner busy while
# its replacement waits behind it. Different PRs and branches keep independent
# groups, and pushes to main are never cancelled: main's per-commit signal is
# the record of what actually shipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  gpu-release-tools:
    name: GPU release tools (deterministic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Test asset, probe, evaluator, and audit tooling
        # Physical WebGPU measurements and the five-host evidence matrix are
        # release-lab gates; CI only verifies their deterministic tooling.
        run: bash tools/test-gpu-release-tools.sh

  viewer-decision-spike:
    name: BRD-080 viewer decision spike
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/brd080
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: spikes/brd080/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Exercise both viewers, every fixture, teardown and offline boundary
        run: npm run test:browser

  theme-contrast:
    name: Theme contrast tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Enforce WCAG AA theme pairs
        run: node tools/test-theme-contrast.mjs

  presentation-authority:
    name: Presentation authority adapters
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/app
    steps:
      # With submodules: aboutNotice.test.ts hashes the USGS notice at its
      # tracked path inside vendor/iphreeqc to prove the credits screen
      # states the licence bytes actually shipped. That is a legal claim,
      # so it is checked rather than skipped when the file is absent —
      # which means the checkout has to contain it.
      - uses: actions/checkout@v6
        with:
          submodules: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - run: npm ci
      # Every vitest file under web/app, not a hand-kept list of them.
      # The list this replaces named 13 of the 93 files that exist, so 80
      # files' worth of assertions were being written and never run — a
      # suite that cannot fail teaches people it is passing. There is no
      # list to forget to extend now: a new .test.ts is in the gate the
      # moment it is committed.
      - name: Every vitest file in the app runs
        run: npx vitest run --reporter=dot

  preflight-gate:
    name: Full preflight gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Fetch SUNDIALS (not vendored; pinned by checksum)
        run: bash tools/fetch-sundials.sh
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: librsvg and Pillow, so the icon check actually runs
        # Both, because the gate needs both and had been silent about
        # each of them: installing librsvg let it run for the first time
        # and it got as far as `No module named 'PIL'`.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          python3 -m pip install --quiet --upgrade Pillow
      - name: Run tools/preflight.sh
        # --no-clippy: the `Test (native)` matrix above already runs the
        # identical clippy command on ubuntu and macOS, so this would be
        # a third full workspace lint for no extra coverage.
        run: bash tools/preflight.sh --no-clippy

  test:
    name: Test (native)
    runs-on: ${{ matrix.os }}
    strategy:
      # The same reason `--no-fail-fast` is passed to cargo below: a macOS-only
      # failure must not hide whatever ubuntu would have said, and vice versa.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch SUNDIALS (not vendored; pinned by checksum)
        run: bash tools/fetch-sundials.sh
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # `--no-fail-fast` because cargo's fail-fast is per test BINARY, not
      # per workspace: without it the first crate whose suite fails ends
      # the job, and every binary after it is never run. A tranche that
      # moved one corpus row and three lesson goldens then costs four CI
      # rounds to discover instead of one, and each round is a full
      # rebuild. It cannot turn a red run green — it only makes a red one
      # say everything it knows in one go.
      - name: Test
        run: cargo test --workspace --no-fail-fast
      - name: Codex — every claim must still compute
        run: cargo run -p kerotakis-cli -- codex lint
      # The curiosity baseline records the route every prompt actually takes.
      # It existed as a manual tool and drifted on four rows unnoticed,
      # because nothing ran it — so it runs here. 500 prompts through the
      # real solver stack costs about 30 seconds, which is cheaper than the
      # step above it, and a drift is a scientific claim someone has to
      # explain rather than a number someone regenerates.
      - name: Curiosity coverage — the recorded route is still the route
        run: cargo run -p kerotakis-cli -- coverage curiosity --check
      # A snapshot test that fails prints a diff, but the whole regenerated
      # file is what someone actually needs to judge whether the new value is
      # right. The suites already write it beside the golden; keep it.
      - name: Preserve regenerated snapshots for review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: snapshot-differences-${{ runner.os }}-${{ github.sha }}
          path: crates/**/tests/golden/*.actual.json
          if-no-files-found: ignore
          retention-days: 30

  my-basic-preview:
    name: MY-BASIC preview (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch SUNDIALS (not vendored; pinned by checksum)
        run: bash tools/fetch-sundials.sh
      - name: Differential and live preview corpus
        # The feature lives on the MY-BASIC branch until its merge; a
        # job that fails on a feature main does not carry teaches
        # people to ignore red. Skip loudly instead.
        run: |
          if grep -q "my-basic-preview" crates/kerotakis-phreeqc/Cargo.toml; then
            cargo test -p kerotakis-phreeqc --features my-basic-preview
          else
            echo "feature my-basic-preview not on main yet — skipping"
          fi

  legacy-basic-oracle:
    name: Legacy BASIC oracle (development only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch SUNDIALS (not vendored; pinned by checksum)
        run: bash tools/fetch-sundials.sh
      - name: Independently verify Stage 6 classifications
        run: |
          if grep -q "legacy-basic-oracle" crates/kerotakis-phreeqc/Cargo.toml; then
            cargo test -p kerotakis-phreeqc --features legacy-basic-oracle \
              --test basic_dialect_oracle \
              --test ex21_observable_parity \
              --test standalone_basic_corpus
          else
            echo "feature legacy-basic-oracle not on main yet — skipping"
          fi

  wasm-core:
    name: Core and data schemas compile to wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Fetch SUNDIALS (not vendored; pinned by checksum)
        run: bash tools/fetch-sundials.sh
      - name: Check core, data and scene physics on wasm
        run: >-
          cargo check -p kerotakis-core -p kerotakis-data
          -p kerotakis-scene-physics --target wasm32-unknown-unknown

  feos-target-contract:
    name: feos adapter (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: wasm32-unknown-unknown
          - os: ubuntu-latest
            target: aarch64-linux-android
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-ios
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/brd-030-feos
      - name: Compile the locked disposable adapter
        run: >-
          cargo check --manifest-path spikes/brd-030-feos/Cargo.toml
          --locked --lib --target ${{ matrix.target }}

  registry-export:
    name: Current registry source export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch SUNDIALS (not vendored; pinned by checksum)
        run: bash tools/fetch-sundials.sh
      - name: Diff every legacy registry field
        run: cargo test -p kerotakis-registry-export
      - name: Generate the reviewable source document
        run: >-
          cargo run -p kerotakis-registry-export --
          "$RUNNER_TEMP/registry-source-v1.json"
      - name: Generated source document is checked in exactly
        run: cmp data/registry/registry-source-v1.json "$RUNNER_TEMP/registry-source-v1.json"

  native-host:
    name: The native host still compiles
    # `kerotakis-app` is deliberately outside the main workspace — its own
    # workspace root — so `cargo check --workspace` has never touched it,
    # and nothing else here builds it either. It drifted: #729 gave
    # `charts_for_events`, `net_ionic_for` and `census.render` a locale,
    # the wasm host was updated, and the native one was not. Five call
    # sites, broken from that merge until an App Store build found them,
    # which is the most expensive place to find a missing argument.
    #
    # macOS because Tauri needs no extra system packages there, and
    # `cargo check` because this is about the call sites, not a bundle.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/app/src-tauri
      - name: Fetch SUNDIALS (not vendored; pinned by checksum)
        run: bash tools/fetch-sundials.sh
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: The shell payload tauri-build looks for
        run: |
          npm --prefix web/app ci --no-audit --no-fund
          bash tools/build-shell-payload.sh
      - name: cargo check
        working-directory: web/app/src-tauri
        run: cargo check --all-targets

  engine-msvc:
    # IPhreeqc's C++ had never been compiled by MSVC anywhere in this repo. The
    # Windows release build was the only thing that tried, and it had been
    # failing earlier — at the shell payload — for long enough that nothing
    # downstream of it had ever run. The first dry run to get past the payload
    # died in three translation units on:
    #
    #   vendor/iphreeqc/src/thread.h(39): fatal error C1083:
    #     Cannot open include file: 'pthread.h'
    #
    # `cargo check` is enough: build scripts run, so the whole C++ library is
    # compiled, without paying for Rust codegen or a bundle. Nothing here needs
    # SUNDIALS, so the checkout is the only setup.
    name: IPhreeqc under MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --no-run -p kerotakis-phreeqc
        # `--no-run` and not `check`, because **check does not link**. This job
        # started life as `cargo check --all-targets`, which compiled all of
        # IPhreeqc happily and could never have caught the failure that came
        # next:
        #
        #   LNK2019: unresolved external symbol __imp__strcmpi
        #            referenced in function _core_type
        #
        # Building the test binaries links them, and `basic_dialect_oracle`
        # exercises the BASIC dialect, so the linker has to pull in my_basic.o
        # and resolve its symbols. Still no bundle and no Rust run, so it stays
        # far cheaper than a release build.
        #
        # Default features include `engine` and `my-basic`, which is what pulls
        # in cmake and the vendored C++. Without them this would compile nothing
        # and pass.
        run: cargo test --no-run -p kerotakis-phreeqc

  payload:
    # The shell payload's four Python steps were only ever run on
    # `ubuntu-latest` (and macOS, in native-host). The release builds them on
    # `ubuntu-22.04` and `windows-latest` too, and v0.1.0 failed on both while
    # CI was green:
    #
    #   ubuntu-22.04    ModuleNotFoundError: No module named 'tomllib'  (py3.10)
    #   windows-latest  UnicodeDecodeError: 'charmap' codec can't decode 0x81
    #
    # So this runs them on exactly those two runners. `--without-codex` drops
    # the single step that needs a compiler, which is what keeps this cheap
    # enough for every pull request: no submodules, no SUNDIALS, no C++.
    name: Shell payload (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v6
      # The same Python the release names. These tools use `tomllib`, so 3.11
      # is the floor, and pinning it here rather than taking the runner's own
      # is the point: ubuntu-22.04 ships 3.10 and its payload build died on
      # exactly that. The guard step below keeps the two pins in step.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Deliberately NOT PYTHONUTF8=1, though — `release.yml` sets it and this
      # job must not, or a script that forgets its encoding passes here and
      # breaks for whoever runs it on Windows without that variable.
      - name: Which interpreter is this, exactly
        shell: bash
        run: python3 -VV
      - name: The Python half of the shell payload
        shell: bash
        run: bash tools/build-shell-payload.sh --without-codex
      - name: The payload is not empty, and the accents survived
        shell: bash
        run: |
          # Every script above exits 0 over an empty input, so an exit code is
          # not evidence. Count the rows, then look for the bytes that broke.
          python3 - <<'EOF'
          import json, pathlib
          root = pathlib.Path("web/app/public/engine")
          rows = json.loads((root / "lessons/index.json").read_text(encoding="utf-8"))
          assert len(rows) > 100, f"only {len(rows)} lessons indexed"
          size = sum(f.stat().st_size for f in root.rglob("*") if f.is_file())
          print(f"{len(rows)} lessons, payload {size:,} bytes")
          prose = json.loads((root / "lessons/prose.json").read_text(encoding="utf-8"))
          text = json.dumps(prose, ensure_ascii=False)
          for accent in ("\u00e9", "\u00fc"):
              assert accent in text, f"no {accent!r} in the translated prose"
          print("accented prose survived the round trip")
          EOF
      - name: Every workflow that reaches a tomllib tool names its Python
        shell: bash
        # The Linux half of v0.1.0 died because release.yml ran this on a
        # runner whose python3 was 3.10. Pinning it fixed that one workflow;
        # this keeps the next one from repeating it, and it follows the
        # indirect chains — appstore.yml reaches the same Python through
        # `tauri build`, and build-web.sh through no payload script at all.
        run: python3 tools/payload-toolchain-lint.py --check --verbose
      - name: npm cannot run a shell script on Windows
        shell: bash
        run: |
          # `"payload": "../../tools/build-shell-payload.sh"` works on every
          # developer machine and fails in the Windows release build, because
          # npm runs scripts through cmd.exe there:
          #
          #   > ../../tools/build-shell-payload.sh
          #   '..' is not recognized as an internal or external command,
          #
          # This is a proxy for the real gate. Actually running `npm run
          # payload` here would compile IPhreeqc's C++ on Windows for a second
          # time in one workflow, which is not worth the minutes; asserting the
          # spelling is.
          python3 - <<'EOF'
          import json, pathlib, sys
          scripts = json.loads(
              pathlib.Path("web/app/package.json").read_text(encoding="utf-8")
          )["scripts"]
          bad = {name: body for name, body in scripts.items()
                 if ".sh" in body and "bash " not in body}
          for name, body in scripts.items():
              if ".sh" in body:
                  print(f"{name}: {body}")
          if bad:
              print("::error::" + ", ".join(bad) + " invoke a .sh directly; npm "
                    "runs scripts through cmd.exe on Windows, which cannot. "
                    "Prefix with `bash `.", file=sys.stderr)
              sys.exit(1)
          print("every npm script naming a .sh runs it through bash")
          EOF
      - name: Nothing that ships may pass --without-codex
        shell: bash
        run: |
          # The flag above skips a step. A skipped step that reports success is
          # the exact shape this whole job exists to catch, so the flag is
          # allowed in CI and nowhere else.
          # web/app/package.json matters most: `build:shell` there is the path
          # tauri's beforeBuildCommand actually takes into this script.
          if grep -rn -- '--without-codex' .github/workflows/release.yml \
               .github/workflows/appstore.yml web/app/src-tauri/tauri.conf.json \
               web/app/package.json; then
            echo "::error::a shipping build would package a payload with no codex"
            exit 1
          fi
          echo "no shipping build passes --without-codex"

  wasm-lab:
    name: The bench in WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.127
      - name: Build the wasm lab
        run: |
          cargo build -p kerotakis-wasm --target wasm32-unknown-unknown --release
          wasm-bindgen --target nodejs --out-dir "$RUNNER_TEMP/kero-wasm" \
            target/wasm32-unknown-unknown/release/kerotakis_wasm.wasm
      - name: Pre-warm the lessons
        run: cargo run -p kerotakis-cli -- prewarm lessons/*.lab -o "$RUNNER_TEMP/lessons.postcard"
      - name: Run the bench in a wasm runtime
        run: node tools/test-wasm-lab.mjs "$RUNNER_TEMP/kero-wasm" "$RUNNER_TEMP/lessons.postcard"
      - name: Protocol conformance against the wasm host
        run: node tools/test-protocol-conformance.mjs "$RUNNER_TEMP/kero-wasm" "$RUNNER_TEMP/lessons.postcard"

  wasm-engine:
    name: IPhreeqc wasm gate
    runs-on: ubuntu-latest
    env:
      IPHREEQC_BASIC_MODE: my-basic
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: mymindstorm/setup-emsdk@v14
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Build IPhreeqc to wasm
        run: ./tools/build-iphreeqc-wasm.sh "$RUNNER_TEMP/iphreeqc-wasm"
      - name: AgCl end-to-end in wasm
        run: node tools/test-iphreeqc-wasm.mjs "$RUNNER_TEMP/iphreeqc-wasm" vendor/iphreeqc/database/wateq4f.dat

  wasm-bridge:
    name: The two wasm halves, together
    runs-on: ubuntu-latest
    env:
      IPHREEQC_BASIC_MODE: my-basic
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: mymindstorm/setup-emsdk@v14
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.127
      - name: Build the bench for the browser
        run: |
          cargo build -p kerotakis-wasm --target wasm32-unknown-unknown --release
          wasm-bindgen --target nodejs --out-dir "$RUNNER_TEMP/kero-wasm" \
            target/wasm32-unknown-unknown/release/kerotakis_wasm.wasm
      - name: Build IPhreeqc for the browser
        run: ./tools/build-iphreeqc-wasm.sh "$RUNNER_TEMP/iphreeqc-wasm"
      # The desktop build's answer to the identical question, so the web can
      # be checked against it rather than merely checked for plausibility.
      - name: Record the desktop answer
        run: |
          printf 'add v1 water 137mL\nadd v1 NaCl 0.037mol\n' > "$RUNNER_TEMP/bridge.lab"
          cargo run -p kerotakis-cli -- run "$RUNNER_TEMP/bridge.lab" --json \
            | python3 tools/extract-solution.py > "$RUNNER_TEMP/expected.json"
          cat "$RUNNER_TEMP/expected.json"
      - name: Solve in the browser and compare
        run: |
          node tools/test-wasm-bridge.mjs "$RUNNER_TEMP/kero-wasm" \
            "$RUNNER_TEMP/iphreeqc-wasm" "$RUNNER_TEMP/expected.json"

  demo:
    name: The demo page, in a real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: mymindstorm/setup-emsdk@v14
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.127
      - name: Build the site
        run: ./tools/build-web.sh "$RUNNER_TEMP/site"
      # Node cannot catch what only a browser does. The first browser run of
      # this page failed on Chrome refusing TextDecoder over a resizable
      # ArrayBuffer, which Node does not reproduce at all.
      - name: Run the page headlessly
        run: node tools/test-web-demo.mjs "$RUNNER_TEMP/site"
      - name: Five lesson scenes match their semantic DOM goldens
        run: node tools/test-gui003-dom.mjs "$RUNNER_TEMP/site"
      # The 2026-08 gap days proved a type gate nothing runs will drift:
      # main accumulated 32 svelte-check errors invisibly because no npm
      # script, and no workflow, ever invoked it. It runs here, inside a
      # required check, and after the site build so the generated exports
      # the components import all exist.
      - name: Types hold (svelte-check)
        working-directory: web/app
        run: npm run check
      # Served from a SUBPATH, because that is how Pages serves it and a
      # root-served manifest hides every relative-URL bug in it. Checks the
      # facts only a browser knows: the worker's scope, where start_url
      # actually resolves, and whether /app/ boots with the network cut.
      - name: The bench is an installable, offline-first PWA
        run: node tools/test-pwa.mjs "$RUNNER_TEMP/site"
      # A coverage count cannot see this. Both t() and tEngine() fall back
      # to English per string, by design, so a key the component asks for
      # under a name nobody translated renders English while every lint
      # reports 100%. Only a browser knows which names it actually asks for.
      - name: The German build renders German
        run: node tools/test-i18n-render.mjs "$RUNNER_TEMP/site"
      - name: The responsive bench meets UX invariants
        run: node tools/test-ux-quality.mjs "$RUNNER_TEMP/site"
      - name: Package the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  publish:
    name: Publish the demo
    needs: demo
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One Pages deployment at a time, queued not cancelled — two racing
    # deployers is exactly the 400 "in progress deployment" failure.
    concurrency:
      group: pages
