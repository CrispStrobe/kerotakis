name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gpu-release-tools:
    name: GPU release tools (deterministic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test asset, probe, evaluator, and audit tooling
        # Physical WebGPU measurements and the five-host evidence matrix are
        # release-lab gates; CI only verifies their deterministic tooling.
        run: bash tools/test-gpu-release-tools.sh

  viewer-decision-spike:
    name: BRD-080 viewer decision spike
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spikes/brd080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: spikes/brd080/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Exercise both viewers, every fixture, teardown and offline boundary
        run: npm run test:browser

  theme-contrast:
    name: Theme contrast tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enforce WCAG AA theme pairs
        run: node tools/test-theme-contrast.mjs

  presentation-authority:
    name: Presentation authority adapters
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - run: npm ci
      - run: >-
          npm test -- src/lib/rigidIntent.test.ts src/lib/fluidScene.test.ts
          src/lib/magnitudes.test.ts src/lib/pour.test.ts

  preflight-gate:
    name: Full preflight gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Fetch SUNDIALS (not vendored; pinned by checksum)
        run: bash tools/fetch-sundials.sh
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Run tools/preflight.sh
        # --no-clippy: the `Test (native)` matrix above already runs the
        # identical clippy command on ubuntu and macOS, so this would be
        # a third full workspace lint for no extra coverage.
        run: bash tools/preflight.sh --no-clippy

  test:
    name: Test (native)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch SUNDIALS (not vendored; pinned by checksum)
        run: bash tools/fetch-sundials.sh
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Codex — every claim must still compute
        run: cargo run -p kerotakis-cli -- codex lint
      # The curiosity baseline records the route every prompt actually takes.
      # It existed as a manual tool and drifted on four rows unnoticed,
      # because nothing ran it — so it runs here. 500 prompts through the
      # real solver stack costs about 30 seconds, which is cheaper than the
      # step above it, and a drift is a scientific claim someone has to
      # explain rather than a number someone regenerates.
      - name: Curiosity coverage — the recorded route is still the route
        run: cargo run -p kerotakis-cli -- coverage curiosity --check

  my-basic-preview:
    name: MY-BASIC preview (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch SUNDIALS (not vendored; pinned by checksum)
        run: bash tools/fetch-sundials.sh
      - name: Differential and live preview corpus
        # The feature lives on the MY-BASIC branch until its merge; a
        # job that fails on a feature main does not carry teaches
        # people to ignore red. Skip loudly instead.
        run: |
          if grep -q "my-basic-preview" crates/kerotakis-phreeqc/Cargo.toml; then
            cargo test -p kerotakis-phreeqc --features my-basic-preview
          else
            echo "feature my-basic-preview not on main yet — skipping"
          fi

  legacy-basic-oracle:
    name: Legacy BASIC oracle (development only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch SUNDIALS (not vendored; pinned by checksum)
        run: bash tools/fetch-sundials.sh
      - name: Independently verify Stage 6 classifications
        run: |
          if grep -q "legacy-basic-oracle" crates/kerotakis-phreeqc/Cargo.toml; then
            cargo test -p kerotakis-phreeqc --features legacy-basic-oracle \
              --test basic_dialect_oracle \
              --test ex21_observable_parity \
              --test standalone_basic_corpus
          else
            echo "feature legacy-basic-oracle not on main yet — skipping"
          fi

  wasm-core:
    name: Core and data schemas compile to wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Fetch SUNDIALS (not vendored; pinned by checksum)
        run: bash tools/fetch-sundials.sh
      - name: Check core, data and scene physics on wasm
        run: >-
          cargo check -p kerotakis-core -p kerotakis-data
          -p kerotakis-scene-physics --target wasm32-unknown-unknown

  feos-target-contract:
    name: feos adapter (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: wasm32-unknown-unknown
          - os: ubuntu-latest
            target: aarch64-linux-android
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-ios
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/brd-030-feos
      - name: Compile the locked disposable adapter
        run: >-
          cargo check --manifest-path spikes/brd-030-feos/Cargo.toml
          --locked --lib --target ${{ matrix.target }}

  registry-export:
    name: Current registry source export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch SUNDIALS (not vendored; pinned by checksum)
        run: bash tools/fetch-sundials.sh
      - name: Diff every legacy registry field
        run: cargo test -p kerotakis-registry-export
      - name: Generate the reviewable source document
        run: >-
          cargo run -p kerotakis-registry-export --
          "$RUNNER_TEMP/registry-source-v1.json"
      - name: Generated source document is checked in exactly
        run: cmp data/registry/registry-source-v1.json "$RUNNER_TEMP/registry-source-v1.json"

  wasm-lab:
    name: The bench in WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.127
      - name: Build the wasm lab
        run: |
          cargo build -p kerotakis-wasm --target wasm32-unknown-unknown --release
          wasm-bindgen --target nodejs --out-dir "$RUNNER_TEMP/kero-wasm" \
            target/wasm32-unknown-unknown/release/kerotakis_wasm.wasm
      - name: Pre-warm the lessons
        run: cargo run -p kerotakis-cli -- prewarm lessons/*.lab -o "$RUNNER_TEMP/lessons.postcard"
      - name: Run the bench in a wasm runtime
        run: node tools/test-wasm-lab.mjs "$RUNNER_TEMP/kero-wasm" "$RUNNER_TEMP/lessons.postcard"
      - name: Protocol conformance against the wasm host
        run: node tools/test-protocol-conformance.mjs "$RUNNER_TEMP/kero-wasm" "$RUNNER_TEMP/lessons.postcard"

  wasm-engine:
    name: IPhreeqc wasm gate
    runs-on: ubuntu-latest
    env:
      IPHREEQC_BASIC_MODE: my-basic
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mymindstorm/setup-emsdk@v14
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build IPhreeqc to wasm
        run: ./tools/build-iphreeqc-wasm.sh "$RUNNER_TEMP/iphreeqc-wasm"
      - name: AgCl end-to-end in wasm
        run: node tools/test-iphreeqc-wasm.mjs "$RUNNER_TEMP/iphreeqc-wasm" vendor/iphreeqc/database/wateq4f.dat

  wasm-bridge:
    name: The two wasm halves, together
    runs-on: ubuntu-latest
    env:
      IPHREEQC_BASIC_MODE: my-basic
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: mymindstorm/setup-emsdk@v14
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.127
      - name: Build the bench for the browser
        run: |
          cargo build -p kerotakis-wasm --target wasm32-unknown-unknown --release
          wasm-bindgen --target nodejs --out-dir "$RUNNER_TEMP/kero-wasm" \
            target/wasm32-unknown-unknown/release/kerotakis_wasm.wasm
      - name: Build IPhreeqc for the browser
        run: ./tools/build-iphreeqc-wasm.sh "$RUNNER_TEMP/iphreeqc-wasm"
      # The desktop build's answer to the identical question, so the web can
      # be checked against it rather than merely checked for plausibility.
      - name: Record the desktop answer
        run: |
          printf 'add v1 water 137mL\nadd v1 NaCl 0.037mol\n' > "$RUNNER_TEMP/bridge.lab"
          cargo run -p kerotakis-cli -- run "$RUNNER_TEMP/bridge.lab" --json \
            | python3 tools/extract-solution.py > "$RUNNER_TEMP/expected.json"
          cat "$RUNNER_TEMP/expected.json"
      - name: Solve in the browser and compare
        run: |
          node tools/test-wasm-bridge.mjs "$RUNNER_TEMP/kero-wasm" \
            "$RUNNER_TEMP/iphreeqc-wasm" "$RUNNER_TEMP/expected.json"

  demo:
    name: The demo page, in a real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: mymindstorm/setup-emsdk@v14
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.127
      - name: Build the site
        run: ./tools/build-web.sh "$RUNNER_TEMP/site"
      # Node cannot catch what only a browser does. The first browser run of
      # this page failed on Chrome refusing TextDecoder over a resizable
      # ArrayBuffer, which Node does not reproduce at all.
      - name: Run the page headlessly
        run: node tools/test-web-demo.mjs "$RUNNER_TEMP/site"
      # The 2026-08 gap days proved a type gate nothing runs will drift:
      # main accumulated 32 svelte-check errors invisibly because no npm
      # script, and no workflow, ever invoked it. It runs here, inside a
      # required check, and after the site build so the generated exports
      # the components import all exist.
      - name: Types hold (svelte-check)
        working-directory: web/app
        run: npm run check
      # Served from a SUBPATH, because that is how Pages serves it and a
      # root-served manifest hides every relative-URL bug in it. Checks the
      # facts only a browser knows: the worker's scope, where start_url
      # actually resolves, and whether /app/ boots with the network cut.
      - name: The bench is an installable, offline-first PWA
        run: node tools/test-pwa.mjs "$RUNNER_TEMP/site"
      # A coverage count cannot see this. Both t() and tEngine() fall back
      # to English per string, by design, so a key the component asks for
      # under a name nobody translated renders English while every lint
      # reports 100%. Only a browser knows which names it actually asks for.
      - name: The German build renders German
        run: node tools/test-i18n-render.mjs "$RUNNER_TEMP/site"
      - name: The responsive bench meets UX invariants
        run: node tools/test-ux-quality.mjs "$RUNNER_TEMP/site"
      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  publish:
    name: Publish the demo
    needs: demo
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One Pages deployment at a time, queued not cancelled — two racing
    # deployers is exactly the 400 "in progress deployment" failure.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
