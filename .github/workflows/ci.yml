name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (native)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  wasm-core:
    name: Core compiles to wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check core on wasm
        run: cargo check -p kerotakis-core --target wasm32-unknown-unknown

  wasm-engine:
    name: IPhreeqc wasm gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: mymindstorm/setup-emsdk@v14
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build IPhreeqc to wasm
        run: ./tools/build-iphreeqc-wasm.sh "$RUNNER_TEMP/iphreeqc-wasm"
      - name: AgCl end-to-end in wasm
        run: node tools/test-iphreeqc-wasm.mjs "$RUNNER_TEMP/iphreeqc-wasm" vendor/iphreeqc/database/wateq4f.dat
