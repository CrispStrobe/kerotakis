name: App Store preparation

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [audit, listing, store, testflight, submit-check, submit]
        default: audit
      platform:
        type: choice
        options: [both, ios, macos]
        default: both

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 -m pip install --quiet --disable-pip-version-check cryptography
      - name: Audit or prepare App Store Connect
        env:
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          ACTION: ${{ inputs.action }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            audit) python3 tools/asc/audit.py ;;
            listing)
              if [ "$PLATFORM" = both ]; then
                python3 tools/asc/listing.py
              else
                python3 tools/asc/listing.py "$PLATFORM"
              fi
              ;;
            store)
              if [ "$PLATFORM" = both ]; then
                python3 tools/asc/store.py ios
                python3 tools/asc/store.py macos
              else
                python3 tools/asc/store.py "$PLATFORM"
              fi
              ;;
            testflight)
              if [ "$PLATFORM" = both ]; then
                python3 tools/asc/testflight.py ios
                python3 tools/asc/testflight.py macos
              else
                python3 tools/asc/testflight.py "$PLATFORM"
              fi
              ;;
            # `submit-check` reads the state and says whether the submission
            # would go through. `submit` is the irreversible one: it puts the
            # app in front of an Apple reviewer, and a rejection is visible on
            # the account, so the two are separate choices rather than a flag
            # someone can leave set by accident.
            submit-check|submit)
              flags=""
              if [ "$ACTION" = submit ]; then flags="--submit"; fi
              if [ "$PLATFORM" = both ]; then
                python3 tools/asc/submit.py ios $flags
                python3 tools/asc/submit.py macos $flags
              else
                python3 tools/asc/submit.py "$PLATFORM" $flags
              fi
              ;;
          esac
