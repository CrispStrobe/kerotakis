name: KNO3 current-main preserved replay
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout dispatched audit revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: audit
          persist-credentials: false
      - name: Checkout exact product source
        uses: actions/checkout@v4
        with:
          ref: d791d3062886e4a06dbc7c9d1635383da3e05359
          path: source
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Build once and preserve experiment 15 observations
        run: python3 -B audit/audits/kno3-current-main-replay-20261015/collect.py --source source --out evidence
      - name: Preserve all available evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kno3-current-main-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30
