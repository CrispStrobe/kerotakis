name: Preserved PR789 naming controls
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authenticate existing CLI artifact and run eight frozen controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B audits/fresh-syntax50-20261013/english-naming-cli/hosted.py
      - name: Preserve all available evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: english-naming-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: naming-evidence/
          if-no-files-found: error
          retention-days: 30
