# Deploy the web payload — console at /, bench app at /app/, one shared
# engine — to GitHub Pages. The same tools/build-web.sh output is what a
# Vercel deploy serves; this workflow is the Pages half (GUI-017).
name: pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "crates/kerotakis-wasm/**"
      - "lessons/**"
      - "tools/build-web.sh"
      - "tools/build-iphreeqc-wasm.sh"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IPHREEQC_BASIC_MODE: my-basic
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: mymindstorm/setup-emsdk@v14
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.127
      - name: Build the payload
        run: bash tools/build-web.sh "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
