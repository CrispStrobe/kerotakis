name: Frozen candidate explanation controls
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  controls:
    name: Seven frozen candidate CLI correctness controls
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: audit
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: d06ffe3a1740728656878c4aea0e9507ca83c808
          path: candidate
          submodules: recursive
          persist-credentials: false
      - name: Collect frozen controls with reviewed release artifact
        run: python3 audit/audits/release-performance-20261013/hosted-controls.py
      - name: Preserve actual streams and first failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: candidate-explanation-controls-${{ github.run_id }}-${{ github.run_attempt }}
          path: hosted-controls-evidence
          if-no-files-found: error
          retention-days: 14
