name: Fifth independent fifty and provisional CLI profiling

on:
  workflow_dispatch:
    inputs:
      campaign:
        type: choice
        default: fifty
        options:
          - fifty
          - syntax-replay
          - sixth-fifty
          - semantic-replay
          - solid-index-comparison
          - delta-inventory

permissions:
  contents: read
  actions: read

concurrency:
  group: fifth-independent-fifty-${{ github.ref }}-${{ inputs.campaign || 'fifty' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'
  RUSTFLAGS: '-C debuginfo=1 -C force-frame-pointers=yes'
  CARGO_PROFILE_RELEASE_STRIP: none

jobs:
  build:
    if: inputs.campaign == 'fifty'
    name: Build pinned main CLI once
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 7bc43e089753483710507133ccc8377591bb3490
          path: source
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
      - name: Fetch repository native prerequisites
        working-directory: source
        run: bash tools/fetch-sundials.sh
      - name: Build and preserve source resolution
        working-directory: source
        shell: bash
        run: |
          mkdir -p ../build-evidence
          git rev-parse HEAD > ../build-evidence/source-commit.txt
          test "$(git rev-parse HEAD)" = 7bc43e089753483710507133ccc8377591bb3490
          git rev-parse HEAD^{tree} > ../build-evidence/source-tree.txt
          git submodule status --recursive > ../build-evidence/submodules.txt
          git status --short > ../build-evidence/status-before.txt
          rustc -Vv > ../build-evidence/rustc.txt
          cargo -V > ../build-evidence/cargo.txt
          printf '%s\n' "$RUSTFLAGS" > ../build-evidence/rustflags.txt
          printf '%s\n' "$CARGO_PROFILE_RELEASE_STRIP" > ../build-evidence/release-strip.txt
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          files=subprocess.check_output(['git','ls-files','-z','--','Cargo.toml','**/Cargo.toml']).decode().split('\0')
          rows={name:hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in files if name}
          pathlib.Path('../build-evidence/manifest-sha256.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
          set +e
          /usr/bin/time -v -o ../build-evidence/build-time.txt cargo build --release -p kerotakis-cli > ../build-evidence/build.log 2>&1
          build_status=$?
          printf '%s\n' "$build_status" > ../build-evidence/build-exit-code.txt
          if [[ -f Cargo.lock ]]; then
            cp Cargo.lock ../build-evidence/Cargo.lock
            sha256sum Cargo.lock > ../build-evidence/generated-lock-sha256.txt
          fi
          if [[ -f target/release/kero ]]; then
            cp target/release/kero ../build-evidence/kero
            sha256sum target/release/kero > ../build-evidence/binary-sha256.txt
          fi
          exit "$build_status"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fifth-main-build-${{ github.run_id }}
          path: build-evidence/
          retention-days: 30
          if-no-files-found: error

  delta-inventory:
    name: Ordered inventory baseline and repair
    if: inputs.campaign == 'delta-inventory'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/workflows
            audits/delta-inventory-contracts-20261008
      - uses: actions/checkout@v6
        with:
          ref: audit/bulk-delta-contracts-20261008
          path: source
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
      - name: Fetch pinned native prerequisites
        run: bash source/tools/fetch-sundials.sh
      - name: Compile and execute both independently frozen control sets
        shell: bash
        run: |
          mkdir -p delta-evidence/harness
          git rev-parse HEAD > delta-evidence/harness/commit.txt
          sha256sum .github/workflows/chemistry-audit.yml audits/delta-inventory-contracts-20261008/paired-run.json > delta-evidence/harness/sha256.txt
          rustc -Vv > delta-evidence/harness/rustc.txt
          cargo -V > delta-evidence/harness/cargo.txt
          for label in baseline repair; do
            pin=$(python3 -c "import json; print(json.load(open('audits/delta-inventory-contracts-20261008/paired-run.json'))['$label'])")
            mkdir -p "delta-evidence/$label"
            git -C source checkout --detach "$pin"
            git -C source rev-parse HEAD > "delta-evidence/$label/source-commit.txt"
            git -C source rev-parse HEAD^{tree} > "delta-evidence/$label/source-tree.txt"
            git -C source status --short > "delta-evidence/$label/status-before.txt"
            git -C source submodule status --recursive > "delta-evidence/$label/submodules.txt"
            sha256sum source/crates/kerotakis-core/tests/delta_inventory_contracts.rs > "delta-evidence/$label/fixture-sha256.txt"
            if [[ "$label" = baseline ]]; then (cd source && cargo generate-lockfile); fi
            cp source/Cargo.lock "delta-evidence/$label/Cargo.lock"
            sha256sum source/Cargo.lock | cut -d' ' -f1 > "delta-evidence/$label/generated-lock-sha256.txt"
            set +e
            (cd source && cargo test --locked -p kerotakis-core --test delta_inventory_contracts) > "delta-evidence/$label/controls.log" 2>&1
            code=$?
            printf '%s
' "$code" > "delta-evidence/$label/controls-exit.txt"
            (cd source && cargo test --locked -p kerotakis-core --lib delta::tests) > "delta-evidence/$label/inherited.log" 2>&1
            inherited_code=$?
            printf '%s
' "$inherited_code" > "delta-evidence/$label/inherited-exit.txt"
            set -e
          done
          python3 - <<'PY'
          import hashlib,json,pathlib,re
          root=pathlib.Path('delta-evidence')
          forecast=json.loads(pathlib.Path('audits/delta-inventory-contracts-20261008/paired-run.json').read_text())
          rows=[]
          for label in ['baseline','repair']:
            p=root/label
            assert (p/'fixture-sha256.txt').read_text().split()[0]==forecast['fixture_sha256']
            assert (p/'generated-lock-sha256.txt').read_text()==(root/'baseline/generated-lock-sha256.txt').read_text()
            text=(p/'controls.log').read_text()
            passed=re.findall(r'^test (\S+) \.\.\. ok$',text,re.M)
            failed=re.findall(r'^test (\S+) \.\.\. FAILED$',text,re.M)
            code=int((p/'controls-exit.txt').read_text())
            assert len(passed)+len(failed)==37, 'Compile/harness failure is not an observed baseline rejection'
            rows.append(dict(label=label,source=(p/'source-commit.txt').read_text().strip(),exit_code=code,passed=passed,failed=failed,controls_sha256=hashlib.sha256((p/'controls.log').read_bytes()).hexdigest(),inherited_exit=int((p/'inherited-exit.txt').read_text())))
          (root/'results.json').write_text(json.dumps(rows,indent=2)+'\n')
          assert rows[0]['exit_code']!=0 and rows[0]['failed']
          assert rows[1]['exit_code']==0 and len(rows[1]['passed'])==37
          assert all(row['inherited_exit']==0 for row in rows)
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: delta-inventory-${{ github.run_id }}
          path: |
            delta-evidence/
            audits/delta-inventory-contracts-20261008/
          retention-days: 30
          if-no-files-found: error

  solid-index-comparison:
    name: Paired solid registry startup comparison
    if: inputs.campaign == 'solid-index-comparison'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/workflows
            audits/startup-solid-index-20261008
            tools/startup-solid-index
            tools/fifth-independent-50
      - uses: actions/checkout@v6
        with:
          ref: audit/startup-solid-index-20261008
          path: source
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
      - name: Install prerequisites
        run: |
          bash source/tools/fetch-sundials.sh
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
      - name: Build and test both exact sources under one resolution
        shell: bash
        run: |
          mkdir -p paired-build/harness
          git rev-parse HEAD > paired-build/harness/commit.txt
          sha256sum tools/startup-solid-index/compare.py audits/startup-solid-index-20261008/comparison.json .github/workflows/chemistry-audit.yml > paired-build/harness/sha256.txt
          rustc -Vv > paired-build/harness/rustc.txt
          cargo -V > paired-build/harness/cargo.txt
          for label in baseline repair; do
            source_pin=$(python3 -c "import json; print(json.load(open('audits/startup-solid-index-20261008/comparison.json'))['$label'])")
            mkdir -p "paired-build/$label"
            git -C source checkout --detach "$source_pin"
            git -C source rev-parse HEAD > "paired-build/$label/source-commit.txt"
            git -C source rev-parse HEAD^{tree} > "paired-build/$label/source-tree.txt"
            git -C source status --short > "paired-build/$label/status-before.txt"
            git -C source submodule status --recursive > "paired-build/$label/submodules.txt"
            if [[ "$label" = baseline ]]; then
              (cd source && cargo generate-lockfile)
            fi
            cp source/Cargo.lock "paired-build/$label/Cargo.lock"
            sha256sum source/Cargo.lock | cut -d' ' -f1 > "paired-build/$label/generated-lock-sha256.txt"
            (cd source && cargo build --locked --release -p kerotakis-cli) > "paired-build/$label/build.log" 2>&1
            cp source/target/release/kero "paired-build/$label/kero"
            sha256sum "paired-build/$label/kero" > "paired-build/$label/binary-sha256.txt"
            (cd source && cargo test --locked -p kerotakis-phreeqc --test solid_registry_matching) > "paired-build/$label/identity-tests.log" 2>&1
            (cd source && cargo test --locked -p kerotakis-phreeqc --lib derived::tests) > "paired-build/$label/derivation-tests.log" 2>&1
          done
      - name: Compare complete outputs and interleaved native samples
        run: python3 tools/startup-solid-index/compare.py --build paired-build --out paired-comparison
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: solid-index-comparison-${{ github.run_id }}
          path: |
            paired-build/
            paired-comparison/
            audits/startup-solid-index-20261008/
            tools/startup-solid-index/
            tools/fifth-independent-50/
          retention-days: 30
          if-no-files-found: error

  sixth-fifty:
    name: Frozen CLI evidence (${{ inputs.campaign }})
    if: inputs.campaign == 'sixth-fifty' || inputs.campaign == 'semantic-replay'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            .github/workflows
            audits/sixth-independent-50-20261008
            tools/sixth-independent-50
            tools/fifth-independent-50
      - uses: actions/download-artifact@v7
        with:
          name: fifth-main-build-37751230970
          run-id: 37751230970
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build-evidence
      - name: Bind new forecast to its preserved executable
        run: |
          git merge-base --is-ancestor f88cbdcd HEAD
          mkdir -p sixth-harness-evidence
          git rev-parse HEAD > sixth-harness-evidence/harness-commit.txt
          sha256sum audits/sixth-independent-50-20261008/forecast.json tools/sixth-independent-50/run.py tools/fifth-independent-50/run.py .github/workflows/chemistry-audit.yml > sixth-harness-evidence/sha256.txt
          test "$(cat build-evidence/source-commit.txt)" = 7bc43e089753483710507133ccc8377591bb3490
          chmod +x build-evidence/kero
      - name: Execute all fifty without adapting expectations
        run: >-
          python3 tools/sixth-independent-50/run.py
          --binary build-evidence/kero
          --forecast audits/sixth-independent-50-20261008/${{ inputs.campaign == 'semantic-replay' && 'semantic-replay.json' || 'forecast.json' }}
          --mode ${{ inputs.campaign }}
          --out sixth-experiments
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ inputs.campaign == 'semantic-replay' && 'sixth-semantic-replay' || 'sixth-fifty' }}-${{ github.run_id }}
          path: |
            sixth-experiments/
            sixth-harness-evidence/
            audits/sixth-independent-50-20261008/
            tools/sixth-independent-50/
            tools/fifth-independent-50/
            build-evidence/source-commit.txt
            build-evidence/binary-sha256.txt
            build-evidence/generated-lock-sha256.txt
          retention-days: 30
          if-no-files-found: error

  syntax-replay:
    name: Replay four syntax-corrected cases on the original executable
    if: inputs.campaign == 'syntax-replay'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/workflows
            audits/fifth-independent-50-20261008
            tools/fifth-independent-50
      - uses: actions/download-artifact@v7
        with:
          name: fifth-main-build-37751230970
          run-id: 37751230970
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build-evidence
      - name: Record immutable replay bindings
        run: |
          mkdir -p replay-evidence
          git rev-parse HEAD > replay-evidence/harness-commit.txt
          sha256sum audits/fifth-independent-50-20261008/forecast.json audits/fifth-independent-50-20261008/syntax-replay.json audits/fifth-independent-50-20261008/syntax-adaptation.json tools/fifth-independent-50/run.py .github/workflows/chemistry-audit.yml > replay-evidence/harness-sha256.txt
          test "$(cat build-evidence/source-commit.txt)" = 7bc43e089753483710507133ccc8377591bb3490
          chmod +x build-evidence/kero
      - name: Run unchanged checks with disclosed identifier corrections
        run: >-
          python3 tools/fifth-independent-50/run.py
          --binary build-evidence/kero
          --forecast audits/fifth-independent-50-20261008/forecast.json
          --out fifth-syntax-replay --mode syntax-replay
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fifth-syntax-replay-${{ github.run_id }}
          path: |
            fifth-syntax-replay/
            replay-evidence/
            audits/fifth-independent-50-20261008/
            tools/fifth-independent-50/
          retention-days: 30
          if-no-files-found: error

  experiments:
    name: Execute all fifty frozen expectations
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            .github/workflows
            audits/fifth-independent-50-20261008
            tools/fifth-independent-50
      - uses: actions/download-artifact@v7
        with:
          name: fifth-main-build-${{ github.run_id }}
          path: build-evidence
      - name: Bind independent forecast and harness
        run: |
          git merge-base --is-ancestor e343fb73d6e7cca957e5d651cb12ba157d1faf0a HEAD
          git diff --exit-code 7bc43e089753483710507133ccc8377591bb3490 HEAD -- crates data Cargo.toml
          mkdir -p harness-evidence
          git rev-parse HEAD > harness-evidence/harness-commit.txt
          sha256sum audits/fifth-independent-50-20261008/forecast.json tools/fifth-independent-50/run.py .github/workflows/chemistry-audit.yml > harness-evidence/sha256.txt
          chmod +x build-evidence/kero
      - name: Record all raw runs and evaluate original expectations
        run: >-
          python3 tools/fifth-independent-50/run.py
          --binary build-evidence/kero
          --forecast audits/fifth-independent-50-20261008/forecast.json
          --out fifth-experiments --mode experiments
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fifth-fifty-${{ github.run_id }}
          path: |
            fifth-experiments/
            harness-evidence/
            audits/fifth-independent-50-20261008/
            tools/fifth-independent-50/
          retention-days: 30
          if-no-files-found: error

  profile:
    name: Native CLI timings and instruction profiles
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/workflows
            audits/fifth-independent-50-20261008
            tools/fifth-independent-50
      - uses: actions/download-artifact@v7
        with:
          name: fifth-main-build-${{ github.run_id }}
          path: build-evidence
      - name: Install instruction profiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
      - name: Record runner and source bindings
        run: |
          mkdir -p profile-evidence
          git rev-parse HEAD > profile-evidence/harness-commit.txt
          sha256sum audits/fifth-independent-50-20261008/forecast.json tools/fifth-independent-50/run.py .github/workflows/chemistry-audit.yml > profile-evidence/harness-sha256.txt
          lscpu > profile-evidence/cpu.txt
          uname -a > profile-evidence/kernel.txt
          valgrind --version > profile-evidence/valgrind.txt
          chmod +x build-evidence/kero
      - name: Measure native processes and profile successful workloads
        run: >-
          python3 tools/fifth-independent-50/run.py
          --binary build-evidence/kero
          --forecast audits/fifth-independent-50-20261008/forecast.json
          --out fifth-profile --mode profile
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: fifth-profile-${{ github.run_id }}
          path: |
            fifth-profile/
            profile-evidence/
            build-evidence/source-commit.txt
            build-evidence/binary-sha256.txt
            build-evidence/generated-lock-sha256.txt
          retention-days: 30
          if-no-files-found: error
