name: Chemistry audit fleets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refusal-preflight-baseline:
    name: Frozen refusal and preflight baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Record revision and toolchain
        run: |
          mkdir -p refusal-preflight-baseline
          git rev-parse HEAD > refusal-preflight-baseline/revision.txt
          git status --short > refusal-preflight-baseline/git-status-before.txt
          git submodule status > refusal-preflight-baseline/submodules.txt
          rustc -Vv > refusal-preflight-baseline/rustc.txt
          cargo -V > refusal-preflight-baseline/cargo.txt
      - name: Execute unchanged-production baseline and preserve every outcome
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, pathlib, re, subprocess, sys, time
          root = pathlib.Path('.')
          out = pathlib.Path('refusal-preflight-baseline')
          command = ['cargo', 'test', '-p', 'kerotakis-core', '--test', 'refusal_preflight_atomicity', '--test', 'refusal_missing_vessel', '--test', 'safety_veto_atomicity', '--no-fail-fast', '-j1', '--', '--test-threads=1']
          sources = [pathlib.Path(p) for p in subprocess.check_output(['git', 'ls-files', '*Cargo.toml'], text=True).splitlines()]
          sources += [pathlib.Path(p) for p in subprocess.check_output(['git', 'ls-files', 'crates/kerotakis-core/src/*.rs'], text=True).splitlines()]
          sources += [pathlib.Path('crates/kerotakis-core/tests/' + name + '.rs') for name in ['refusal_preflight_atomicity', 'refusal_missing_vessel', 'safety_veto_atomicity']]
          sources += [pathlib.Path('audits/refusal-preflight-20261008/' + name) for name in ['freeze.json', 'missing-vessel-freeze.json', 'FORECASTS.md']]
          sources += [pathlib.Path('audits/safety-veto-20261008/' + name) for name in ['freeze.json', 'FORECASTS.md']]
          (out / 'lock-status-before.json').write_text(json.dumps({'exists': pathlib.Path('Cargo.lock').exists(), 'tracked': bool(subprocess.check_output(['git', 'ls-files', 'Cargo.lock'], text=True).strip())}, indent=2) + '\n')
          hashes = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in sources}
          (out / 'source-sha256.json').write_text(json.dumps(hashes, indent=2) + '\n')
          (out / 'command.json').write_text(json.dumps(command, indent=2) + '\n')
          started = time.monotonic()
          with (out / 'tests.log').open('wb') as log:
              result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT)
          log_text = (out / 'tests.log').read_text(errors='replace')
          outcomes = [{'test': name, 'outcome': outcome} for name, outcome in re.findall(r'^test (\S+) \.\.\. (ok|FAILED)$', log_text, re.M)]
          (out / 'outcomes.json').write_text(json.dumps(outcomes, indent=2) + '\n')
          # Cargo.lock is generated by Cargo, not tracked at the source revision.
          lock = pathlib.Path('Cargo.lock')
          lock_hash = None
          if lock.exists():
              data = lock.read_bytes()
              (out / 'Cargo.lock').write_bytes(data)
              lock_hash = hashlib.sha256(data).hexdigest()
          receipt = {'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'command': command, 'exit_code': result.returncode, 'seconds': time.monotonic() - started, 'log_sha256': hashlib.sha256((out / 'tests.log').read_bytes()).hexdigest(), 'generated_lock_sha256': lock_hash, 'test_outcome_count': len(outcomes), 'passed': sum(row['outcome'] == 'ok' for row in outcomes), 'failed': sum(row['outcome'] == 'FAILED' for row in outcomes), 'lock_captured': 'after Cargo execution; no tracked lock assumed', 'diagnostic_only': True, 'expected_contract_count': 50, 'production_parent': 'f6ad9946fdf71ab3273dfb5d46350e569c7f5cb6', 'test_only_revision': '5312bc77'}
          (out / 'diagnostic.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          sys.exit(result.returncode)
          PYTHON
      - name: Preserve successes, failures and generated dependency lock
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: refusal-preflight-baseline-${{ github.sha }}
          path: refusal-preflight-baseline
          if-no-files-found: error
          retention-days: 30
