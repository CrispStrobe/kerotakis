      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@v6
        with:
          path: harness
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          ref: 26cd8fc7d3554ddadaeebeb2750b3a92c4eadf54
          path: source
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
