          rustc -Vv > ../combined-build/rustc.txt
          cargo -V > ../combined-build/cargo.txt
          git -C ../harness rev-parse HEAD > ../combined-build/harness-commit.txt
          sha256sum ../harness/audits/ordinary-delta-state-contracts-20261008/cli-source.json ../harness/audits/main-cli-replay-20261008/forecast.json ../harness/tools/combined-cli-replay.py ../harness/tools/fifth-independent-50/{run,review_profile}.py ../harness/.github/workflows/chemistry-audit.yml > ../combined-build/harness-sha256.txt
