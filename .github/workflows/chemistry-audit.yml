name: Chemistry audit fleets

on:
  pull_request:
    paths:
      - ".github/workflows/chemistry-audit.yml"
      - "tools/chemistry-audit/**"
      - "crates/kerotakis-*/**"
      - "data/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:
    inputs:
      audit:
        description: Audit selection
        type: choice
        default: fleets
        options: [fleets, independent-50, independent-next-50, thermal-contracts, independent-third-50, native-scale-contracts, pure-still-contracts, pure-still-performance]
      validated_run:
        description: Successful independent-50 validation run supplying the executable
        type: string
        default: '37207780340'
      focused_scope:
        description: Focused diagnostic target for pure-still-contracts
        type: choice
        default: thermo
        options: [thermo, transport, receiver, fractional, safety, titration, accounting, recovery, extraction]
      validated_commit:
        description: Exact commit tested by that run
        type: string
        default: 3b46a652c2e4a90078abc8df5412193a22aa4ab0
      baseline_run:
        description: Validated baseline executable for pure-still performance comparison
        type: string
        default: '37107431953'
      baseline_commit:
        description: Exact commit tested by the baseline run
        type: string
        default: 8744d131928dd7416c1d207f22408ba228540570

concurrency:
  group: chemistry-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-cli:
    name: Build audited CLI once
    if: github.event_name != 'workflow_dispatch' || (inputs.audit != 'independent-50' && inputs.audit != 'independent-next-50' && inputs.audit != 'thermal-contracts' && inputs.audit != 'independent-third-50' && inputs.audit != 'native-scale-contracts' && inputs.audit != 'pure-still-contracts' && inputs.audit != 'pure-still-performance')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p kerotakis-cli
      - run: |
          sha256sum target/release/kero > binary-sha256.txt
          git submodule status > submodules.txt
      - uses: actions/upload-artifact@v6
        with:
          name: chemistry-audit-cli-${{ github.sha }}
          path: |
            target/release/kero
            Cargo.lock
            binary-sha256.txt
            submodules.txt
          retention-days: 7

  sixth-fleet:
    name: Frozen fleet 195-218
    if: github.event_name != 'workflow_dispatch' || (inputs.audit != 'independent-50' && inputs.audit != 'independent-next-50' && inputs.audit != 'thermal-contracts' && inputs.audit != 'independent-third-50' && inputs.audit != 'native-scale-contracts' && inputs.audit != 'pure-still-contracts' && inputs.audit != 'pure-still-performance')
    needs: build-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/download-artifact@v7
        with:
          name: chemistry-audit-cli-${{ github.sha }}
      - run: chmod +x target/release/kero
      - name: Prepare the evidence envelope
        run: |
          mkdir -p audit-evidence
          printf '%s\n' "${GITHUB_SHA}" > audit-evidence/revision.txt
      - name: Verify the frozen analyzer rejects missing evidence
        run: python3 tools/chemistry-audit/analyse_sixth.py --self-test
      - name: Record all 24 process-isolated experiments
        run: >-
          python3 tools/chemistry-audit/sixth_batch.py
          --binary target/release/kero
          --out audit-evidence/sixth-195-218
      - name: Bind the frozen contract and harness to the evidence
        run: |
          sha256sum \
            tools/chemistry-audit/sixth_batch.py \
            tools/chemistry-audit/analyse_sixth.py \
            tools/chemistry-audit/SIXTH-BATCH.md \
            > audit-evidence/sixth-195-218/preflight-sha256.txt
      - name: Apply independent laws and matched controls
        run: >-
          python3 tools/chemistry-audit/analyse_sixth.py
          audit-evidence/sixth-195-218
          --out audit-evidence/sixth-195-218/law-checks.json
      - name: Preserve raw successes and failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: chemistry-audit-sixth-${{ github.sha }}
          path: audit-evidence
          if-no-files-found: error
          retention-days: 30

  seventh-fleet:
    name: Frozen fleet 459-488
    if: github.event_name != 'workflow_dispatch' || (inputs.audit != 'independent-50' && inputs.audit != 'independent-next-50' && inputs.audit != 'thermal-contracts' && inputs.audit != 'independent-third-50' && inputs.audit != 'native-scale-contracts' && inputs.audit != 'pure-still-contracts' && inputs.audit != 'pure-still-performance')
    needs: build-cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/download-artifact@v7
        with:
          name: chemistry-audit-cli-${{ github.sha }}
      - run: chmod +x target/release/kero
      - name: Prepare the evidence envelope
        run: |
          mkdir -p audit-evidence
          printf '%s\n' "${GITHUB_SHA}" > audit-evidence/revision.txt
      - name: Verify the analyzer rejects missing evidence
        run: python3 tools/chemistry-audit/analyse_seventh.py --self-test
      - name: Record all 30 process-isolated experiments
        run: >-
          python3 tools/chemistry-audit/seventh_batch.py
          --binary target/release/kero
          --out audit-evidence/seventh-459-488
      - name: Bind the frozen contract and harness to the evidence
        run: |
          sha256sum \
            tools/chemistry-audit/seventh_batch.py \
            tools/chemistry-audit/analyse_seventh.py \
            tools/chemistry-audit/SEVENTH-BATCH.md \
            > audit-evidence/seventh-459-488/preflight-sha256.txt
      - name: Apply independent laws and matched controls
        run: >-
          python3 tools/chemistry-audit/analyse_seventh.py
          audit-evidence/seventh-459-488
          --out audit-evidence/seventh-459-488/law-checks.json
      - name: Preserve raw successes and failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: chemistry-audit-seventh-${{ github.sha }}
          path: audit-evidence
          if-no-files-found: error
          retention-days: 30

  source-fleets:
    name: Source fleet ${{ matrix.family }}
    if: github.event_name != 'workflow_dispatch' || (inputs.audit != 'independent-50' && inputs.audit != 'independent-next-50' && inputs.audit != 'thermal-contracts' && inputs.audit != 'independent-third-50' && inputs.audit != 'native-scale-contracts' && inputs.audit != 'pure-still-contracts' && inputs.audit != 'pure-still-performance')
    needs: build-cli
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        family:
          - acid-base-buffers
          - solubility-precipitation
          - gas-boundaries
          - electrochemistry
          - mixing-transfer
          - filtration-evaporation
          - distillation
          - thermal-phase-paths
          - organic-equilibria
          - observables-negative-controls
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: chemistry-audit-cli-${{ github.sha }}
      - run: chmod +x target/release/kero
      - name: Validate frozen manifests and analyzer mutations
        run: |
          python3 tools/chemistry-audit/source_fleets.py --validate
          python3 tools/chemistry-audit/analyse_source_fleets.py --self-test
          python3 tools/chemistry-audit/generate_source_fleets.py --check
          python3 tools/chemistry-audit/generate_source_manifests_b.py --check
      - name: Record 24 process-isolated experiments
        run: >-
          python3 tools/chemistry-audit/source_fleets.py
          --family '${{ matrix.family }}'
          --binary target/release/kero
          --out 'audit-evidence/${{ matrix.family }}'
      - name: Apply frozen named relations
        run: >-
          python3 tools/chemistry-audit/analyse_source_fleets.py
          'audit-evidence/${{ matrix.family }}'
          --family '${{ matrix.family }}'
          --out 'audit-evidence/${{ matrix.family }}/${{ matrix.family }}-law-checks.json'
      - name: Preserve raw successes and failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: chemistry-audit-${{ matrix.family }}-${{ github.sha }}
          path: audit-evidence
          if-no-files-found: error
          retention-days: 30

  source-fleet-aggregate:
    name: All 240 source-informed cases
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || (inputs.audit != 'independent-50' && inputs.audit != 'independent-next-50' && inputs.audit != 'thermal-contracts' && inputs.audit != 'independent-third-50' && inputs.audit != 'native-scale-contracts' && inputs.audit != 'pure-still-contracts' && inputs.audit != 'pure-still-performance')) }}
    needs: source-fleets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: chemistry-audit-*-${{ github.sha }}
          path: downloaded-evidence
      - run: python3 tools/chemistry-audit/aggregate_source_fleets.py downloaded-evidence

  source-fleets-v2:
    name: Source fleet v2 ${{ matrix.family }}
    if: github.event_name != 'workflow_dispatch' || (inputs.audit != 'independent-50' && inputs.audit != 'independent-next-50' && inputs.audit != 'thermal-contracts' && inputs.audit != 'independent-third-50' && inputs.audit != 'native-scale-contracts' && inputs.audit != 'pure-still-contracts' && inputs.audit != 'pure-still-performance')
    needs: build-cli
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        family:
          - quantitative-solutions
          - polyprotic-carbonate
          - redox-cells
          - gas-production-transfer
          - phase-colligative
          - crystallisation-boundaries
          - separation-trains
          - kinetics-boundaries
          - household-biochemistry
          - materials-transport
          - analytical-observables
          - thermochemical-paths
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: chemistry-audit-cli-${{ github.sha }}
      - run: chmod +x target/release/kero
      - name: Validate frozen v2 manifests and analyzer mutations
        run: |
          python3 tools/chemistry-audit/source_fleets_2.py --validate
          python3 tools/chemistry-audit/analyse_source_fleets_2.py --self-test
          python3 tools/chemistry-audit/generate_source_fleets_2a.py --check
          python3 tools/chemistry-audit/generate_source_fleets_2b.py --check
      - name: Record 24 process-isolated v2 experiments
        run: >-
          python3 tools/chemistry-audit/source_fleets_2.py
          --family '${{ matrix.family }}'
          --binary target/release/kero
          --out 'audit-evidence-v2/${{ matrix.family }}'
      - name: Bind the frozen v2 contract and harness to the evidence
        run: |
          sha256sum \
            tools/chemistry-audit/source_fleets_2.py \
            tools/chemistry-audit/analyse_source_fleets_2.py \
            tools/chemistry-audit/generate_source_fleets_2a.py \
            tools/chemistry-audit/generate_source_fleets_2b.py \
            tools/chemistry-audit/SOURCE-FLEETS-2.md \
            tools/chemistry-audit/source-fleets-2/${{ matrix.family }}.json \
            > 'audit-evidence-v2/${{ matrix.family }}/preflight-sha256.txt'
      - name: Apply frozen v2 named relations
        run: >-
          python3 tools/chemistry-audit/analyse_source_fleets_2.py
          'audit-evidence-v2/${{ matrix.family }}'
          --family '${{ matrix.family }}'
          --out 'audit-evidence-v2/${{ matrix.family }}/${{ matrix.family }}-law-checks.json'
      - name: Preserve raw v2 successes and failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: chemistry-source-v2-${{ matrix.family }}-${{ github.sha }}
          path: audit-evidence-v2
          if-no-files-found: error
          retention-days: 30

  source-fleet-v2-aggregate:
    name: All 288 source-informed v2 cases
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || (inputs.audit != 'independent-50' && inputs.audit != 'independent-next-50' && inputs.audit != 'thermal-contracts' && inputs.audit != 'independent-third-50' && inputs.audit != 'native-scale-contracts' && inputs.audit != 'pure-still-contracts' && inputs.audit != 'pure-still-performance')) }}
    needs: source-fleets-v2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: chemistry-source-v2-*-${{ github.sha }}
          path: downloaded-evidence-v2
      - run: python3 tools/chemistry-audit/aggregate_source_fleets_2.py downloaded-evidence-v2

  source-fleets-v3:
    name: Source fleet v3 ${{ matrix.family }}
    if: github.event_name != 'workflow_dispatch' || (inputs.audit != 'independent-50' && inputs.audit != 'independent-next-50' && inputs.audit != 'thermal-contracts' && inputs.audit != 'independent-third-50' && inputs.audit != 'native-scale-contracts' && inputs.audit != 'pure-still-contracts' && inputs.audit != 'pure-still-performance')
    needs: build-cli
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        family:
          - water-energy
          - aqueous-selectivity
          - ionic-conductivity
          - metal-ligand
          - organic-equilibrium
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: chemistry-audit-cli-${{ github.sha }}
      - run: chmod +x target/release/kero
      - name: Validate frozen v3 manifests and analyzer mutations
        run: |
          python3 tools/chemistry-audit/source_fleets_3.py --validate
          python3 tools/chemistry-audit/analyse_source_fleets_3.py --self-test
          python3 tools/chemistry-audit/generate_source_fleets_3.py --check
      - name: Record 24 process-isolated v3 experiments
        run: >-
          python3 tools/chemistry-audit/source_fleets_3.py
          --family '${{ matrix.family }}'
          --binary target/release/kero
          --out 'audit-evidence-v3/${{ matrix.family }}'
      - name: Bind the frozen v3 contract and harness to the evidence
        run: |
          sha256sum \
            tools/chemistry-audit/source_fleets_3.py \
            tools/chemistry-audit/analyse_source_fleets_3.py \
            tools/chemistry-audit/generate_source_fleets_3.py \
            tools/chemistry-audit/SOURCE-FLEETS-3.md \
            tools/chemistry-audit/source-fleets-3/${{ matrix.family }}.json \
            > 'audit-evidence-v3/${{ matrix.family }}/preflight-sha256.txt'
      - name: Apply frozen v3 named relations
        run: >-
          python3 tools/chemistry-audit/analyse_source_fleets_3.py
          'audit-evidence-v3/${{ matrix.family }}'
          --family '${{ matrix.family }}'
          --out 'audit-evidence-v3/${{ matrix.family }}/${{ matrix.family }}-law-checks.json'
      - name: Preserve raw v3 successes and failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: chemistry-source-v3-${{ matrix.family }}-${{ github.sha }}
          path: audit-evidence-v3
          if-no-files-found: error
          retention-days: 30

  source-fleet-v3-aggregate:
    name: All 120 source-informed v3 cases
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || (inputs.audit != 'independent-50' && inputs.audit != 'independent-next-50' && inputs.audit != 'thermal-contracts' && inputs.audit != 'independent-third-50' && inputs.audit != 'native-scale-contracts' && inputs.audit != 'pure-still-contracts' && inputs.audit != 'pure-still-performance')) }}
    needs: source-fleets-v3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: chemistry-source-v3-*-${{ github.sha }}
          path: downloaded-evidence-v3
      - run: python3 tools/chemistry-audit/aggregate_source_fleets_3.py downloaded-evidence-v3

  independent-50:
    name: Independent 50 and phase ownership
    if: github.event_name == 'workflow_dispatch' && inputs.audit == 'independent-50'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Fetch pinned SUNDIALS
        run: bash tools/fetch-sundials.sh
      - name: Serial native, WASM and frozen CLI checks
        run: >-
          python3 audits/independent-50-20261002/validate_phase_ownership.py
          --out "$RUNNER_TEMP/independent-50"
      - name: Preserve test logs, raw CLI evidence and tested binary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: independent-50-${{ github.sha }}
          path: ${{ runner.temp }}/independent-50
          if-no-files-found: error
          retention-days: 30

  independent-next-50:
    name: Fifty new frozen independent CLI experiments
    if: github.event_name == 'workflow_dispatch' && inputs.audit == 'independent-next-50'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - name: Obtain the previously validated executable
        uses: actions/download-artifact@v7
        with:
          name: independent-50-${{ inputs.validated_commit }}
          run-id: ${{ inputs.validated_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/validated-cli
      - name: Verify executable identity and run the frozen scripts serially
        env:
          VALIDATED_COMMIT: ${{ inputs.validated_commit }}
        run: |
          python3 audits/independent-next-50-20261002/verify_binary.py "$RUNNER_TEMP/validated-cli" "$VALIDATED_COMMIT"
          chmod +x "$RUNNER_TEMP/validated-cli/kero"
          python3 audits/independent-next-50-20261002/run.py --binary "$RUNNER_TEMP/validated-cli/kero" --binary-source-commit "$VALIDATED_COMMIT" --out "$RUNNER_TEMP/next-50"
          python3 audits/independent-next-50-20261002/summarize.py "$RUNNER_TEMP/next-50"
          python3 audits/independent-next-50-20261002/run.py --suite audits/independent-next-50-20261002/followups --binary "$RUNNER_TEMP/validated-cli/kero" --binary-source-commit "$VALIDATED_COMMIT" --out "$RUNNER_TEMP/next-50/followups"
          python3 audits/independent-next-50-20261002/summarize.py "$RUNNER_TEMP/next-50/followups"
          python3 audits/independent-next-50-20261002/run.py --suite audits/independent-next-50-20261002/additional-controls --binary "$RUNNER_TEMP/validated-cli/kero" --binary-source-commit "$VALIDATED_COMMIT" --out "$RUNNER_TEMP/next-50/additional-controls"
          python3 audits/independent-next-50-20261002/summarize.py "$RUNNER_TEMP/next-50/additional-controls"
          python3 audits/independent-next-50-20261002/verify_repairs.py "$RUNNER_TEMP/next-50"
      - name: Preserve every success and refusal
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: independent-next-50-${{ github.sha }}
          path: ${{ runner.temp }}/next-50
          if-no-files-found: error
          retention-days: 30

  thermal-contracts:
    name: Frozen thermal phase and energy controls
    if: github.event_name == 'workflow_dispatch' && inputs.audit == 'thermal-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: independent-50-${{ inputs.validated_commit }}
          run-id: ${{ inputs.validated_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/validated-cli
      - name: Verify source executable and capture every control
        env:
          VALIDATED_COMMIT: ${{ inputs.validated_commit }}
        run: |
          python3 audits/independent-next-50-20261002/verify_binary.py "$RUNNER_TEMP/validated-cli" "$VALIDATED_COMMIT"
          chmod +x "$RUNNER_TEMP/validated-cli/kero"
          python3 audits/independent-next-50-20261002/run.py --suite audits/thermal-contracts-20261003 --binary "$RUNNER_TEMP/validated-cli/kero" --binary-source-commit "$VALIDATED_COMMIT" --out "$RUNNER_TEMP/thermal-controls"
          python3 audits/independent-next-50-20261002/summarize.py "$RUNNER_TEMP/thermal-controls"
          git fetch --no-tags --depth=1 origin "$VALIDATED_COMMIT"
          python3 audits/thermal-contracts-20261003/verify.py "$RUNNER_TEMP/thermal-controls" --validation "$RUNNER_TEMP/validated-cli/validation.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: thermal-contracts-${{ github.sha }}
          path: ${{ runner.temp }}/thermal-controls
          if-no-files-found: error
          retention-days: 30

  independent-third-50:
    name: Third fifty original frozen CLI experiments
    if: github.event_name == 'workflow_dispatch' && inputs.audit == 'independent-third-50'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: independent-50-${{ inputs.validated_commit }}
          run-id: ${{ inputs.validated_run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/validated-cli
      - name: Verify source executable and capture every control
        env:
          VALIDATED_COMMIT: ${{ inputs.validated_commit }}
        run: |
          python3 audits/independent-third-50-20261003/check_b_selftest.py
          python3 audits/independent-next-50-20261002/verify_binary.py "$RUNNER_TEMP/validated-cli" "$VALIDATED_COMMIT"
          chmod +x "$RUNNER_TEMP/validated-cli/kero"
          python3 audits/independent-next-50-20261002/run.py --suite audits/independent-third-50-20261003 --binary "$RUNNER_TEMP/validated-cli/kero" --binary-source-commit "$VALIDATED_COMMIT" --out "$RUNNER_TEMP/third-50"
          python3 audits/independent-next-50-20261002/summarize.py "$RUNNER_TEMP/third-50"
          python3 audits/independent-next-50-20261002/run.py --suite audits/independent-third-50-20261003/followups --binary "$RUNNER_TEMP/validated-cli/kero" --binary-source-commit "$VALIDATED_COMMIT" --out "$RUNNER_TEMP/third-50/followups"
          python3 audits/independent-next-50-20261002/summarize.py "$RUNNER_TEMP/third-50/followups"
          git -c gc.auto=0 fetch --no-tags --depth=1 origin "$VALIDATED_COMMIT"
          if [ -f "$RUNNER_TEMP/validated-cli/fractional-transfer/verification.json" ]; then
            python3 audits/fractional-transfer-contracts-20261004/verify_artifact.py "$RUNNER_TEMP/validated-cli" "$RUNNER_TEMP/third-50/full-integrity.json"
            cp "$RUNNER_TEMP/validated-cli/validation.json" "$RUNNER_TEMP/third-50/full-validation.json"
          fi
          python3 audits/independent-third-50-20261003/verify.py "$RUNNER_TEMP/third-50" --validation "$RUNNER_TEMP/validated-cli/validation.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: independent-third-50-${{ github.sha }}
          path: ${{ runner.temp }}/third-50
          if-no-files-found: error
          retention-days: 30

  native-scale-contracts:
    name: Native microscopic scale contracts
    if: github.event_name == 'workflow_dispatch' && inputs.audit == 'native-scale-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '1'
      KERO_WORKERS: '1'
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch pinned SUNDIALS
        run: bash tools/fetch-sundials.sh
      - name: Serial native input, readback, conservation and cost controls
        run: python3 audits/independent-third-50-20261003/native_scale_probe.py --out "$RUNNER_TEMP/native-scale"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-scale-${{ github.sha }}
          path: ${{ runner.temp }}/native-scale
          retention-days: 30

  pure-still-contracts:
    name: Pure still analytic and phase-cost contracts
    if: github.event_name == 'workflow_dispatch' && inputs.audit == 'pure-still-contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '1'
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Serial analytic, domain, precision and cost controls
        run: python3 audits/pure-still-contracts-20261003/probe.py --scope "${{ inputs.focused_scope || 'thermo' }}" --out "$RUNNER_TEMP/pure-still"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pure-still-${{ github.sha }}
          path: ${{ runner.temp }}/pure-still
          retention-days: 30

  pure-still-performance:
    name: Matched validated pure-still CLI performance
    if: github.event_name == 'workflow_dispatch' && inputs.audit == 'pure-still-performance'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Fetch and verify both validated executables
        run: |
          gh run download '${{ inputs.baseline_run }}' --name 'independent-50-${{ inputs.baseline_commit }}' --dir "$RUNNER_TEMP/baseline"
          gh run download '${{ inputs.validated_run }}' --name 'independent-50-${{ inputs.validated_commit }}' --dir "$RUNNER_TEMP/optimized"
          python3 audits/independent-next-50-20261002/verify_binary.py "$RUNNER_TEMP/baseline" '${{ inputs.baseline_commit }}'
          python3 audits/independent-next-50-20261002/verify_binary.py "$RUNNER_TEMP/optimized" '${{ inputs.validated_commit }}'
          chmod +x "$RUNNER_TEMP/baseline/kero" "$RUNNER_TEMP/optimized/kero"
      - name: Matched alternating timed pure cuts and frozen correctness controls
        run: >-
          python3 audits/pure-still-contracts-20261003/compare.py
          --baseline "$RUNNER_TEMP/baseline"
          --optimized "$RUNNER_TEMP/optimized"
          --out "$RUNNER_TEMP/pure-still-performance"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pure-still-performance-${{ github.sha }}
          path: ${{ runner.temp }}/pure-still-performance
          retention-days: 30
