name: Withdrawal trace source-bound baseline and repair
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    name: Withdrawal trace ${{ matrix.slice }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - slice: baseline
            source: 28ca045541c797745b088a9686ce3f37baf828ce
          - slice: repair
            source: b6306db986d4bc2a683f7b01b03c314a033a686f
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.source }}
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bind exact source and unchanged frozen fixture
        run: |
          mkdir -p withdrawal-evidence
          git rev-parse HEAD > withdrawal-evidence/source-commit.txt
          test "$(git rev-parse HEAD)" = '${{ matrix.source }}'
          git rev-parse HEAD^{tree} > withdrawal-evidence/source-tree.txt
          git status --short > withdrawal-evidence/status-before.txt
          git submodule status --recursive > withdrawal-evidence/submodules.txt
          rustc -Vv > withdrawal-evidence/rustc.txt
          cargo -V > withdrawal-evidence/cargo.txt
          python3 - <<'BIND'
          import hashlib,json,pathlib,subprocess
          fixture=pathlib.Path('crates/kerotakis-core/tests/withdrawal_trace.rs')
          adapted=json.loads(pathlib.Path('audits/withdrawal-trace-20261008/fixture-comparison-adaptation.json').read_text())
          assert hashlib.sha256(fixture.read_bytes()).hexdigest()==adapted['adapted_test_sha256']
          files=subprocess.check_output(['git','ls-files','-z','--','crates/**/src/**','Cargo.toml','**/Cargo.toml']).decode().split('\0')
          hashes={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in files if p}
          pathlib.Path('withdrawal-evidence/production-manifest-sha256.json').write_text(json.dumps(hashes,indent=2)+'\n')
          pathlib.Path('withdrawal-evidence/test-sha256.txt').write_text(adapted['adapted_test_sha256']+'\n')
          BIND
      - name: Execute all frozen test functions and retain failure evidence
        run: |
          python3 - <<'RUN'
          import json,pathlib,platform,resource,subprocess,time,hashlib
          out=pathlib.Path('withdrawal-evidence')
          started=time.perf_counter()
          with (out/'cargo-test.log').open('wb') as log:
              result=subprocess.run(['cargo','test','-p','kerotakis-core','--test','withdrawal_trace','--','--nocapture'],stdout=log,stderr=subprocess.STDOUT)
          (out/'execution.json').write_text(json.dumps(dict(exit_code=result.returncode,elapsed_seconds=time.perf_counter()-started,platform=platform.platform(),child_maxrss=resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss,scope='Cargo compilation and all ten test functions; not an app performance measurement.'),indent=2)+'\n')
          lock=pathlib.Path('Cargo.lock')
          if lock.exists():
              (out/'Cargo.lock').write_bytes(lock.read_bytes())
              (out/'generated-lock-sha256.txt').write_text(hashlib.sha256(lock.read_bytes()).hexdigest()+'\n')
          raise SystemExit(result.returncode)
          RUN
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: withdrawal-trace-${{ matrix.slice }}-${{ github.run_id }}
          path: |
            withdrawal-evidence/
            audits/withdrawal-trace-20261008/
            crates/kerotakis-core/tests/withdrawal_trace.rs
          retention-days: 30
          if-no-files-found: error
