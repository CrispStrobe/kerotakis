name: Chemistry audit fleets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-main-baseline:
    name: Main-based native budget baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Record revision and toolchain
        run: |
          mkdir -p native-main-baseline
          git rev-parse HEAD > native-main-baseline/revision.txt
          git status --short > native-main-baseline/git-status-before.txt
          git submodule status > native-main-baseline/submodules.txt
          rustc -Vv > native-main-baseline/rustc.txt
          cargo -V > native-main-baseline/cargo.txt
      - name: Execute unchanged-production baseline and preserve every outcome
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, pathlib, subprocess, sys, time
          root = pathlib.Path('.')
          out = pathlib.Path('native-main-baseline')
          command = ['cargo', 'test', '-p', 'kerotakis-phreeqc', '--features', 'engine', '--lib', '--test', 'solid_solution', '--no-fail-fast', '-j1', '--', '--test-threads=1']
          sources = [pathlib.Path('Cargo.toml'), pathlib.Path('crates/kerotakis-phreeqc/Cargo.toml'), pathlib.Path('crates/kerotakis-core/Cargo.toml'), pathlib.Path('crates/kerotakis-phreeqc/src/aqueous.rs'), pathlib.Path('crates/kerotakis-core/src/vessel.rs')]
          sources += sorted(pathlib.Path('crates/kerotakis-phreeqc/tests/solid_solution_phase_budget').glob('*.rs'))
          sources += sorted(pathlib.Path('crates/kerotakis-phreeqc/tests/solid_solution_raw_readback').glob('*.rs'))
          sources += [pathlib.Path('crates/kerotakis-phreeqc/tests/solid_solution.rs')]
          hashes = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in sources}
          (out / 'source-sha256.json').write_text(json.dumps(hashes, indent=2) + '\n')
          (out / 'command.json').write_text(json.dumps(command, indent=2) + '\n')
          started = time.monotonic()
          with (out / 'tests.log').open('wb') as log:
              result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT)
          # Cargo.lock is generated by Cargo, not tracked at the source revision.
          lock = pathlib.Path('Cargo.lock')
          lock_hash = None
          if lock.exists():
              data = lock.read_bytes()
              (out / 'Cargo.lock').write_bytes(data)
              lock_hash = hashlib.sha256(data).hexdigest()
          receipt = {'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'command': command, 'exit_code': result.returncode, 'seconds': time.monotonic() - started, 'log_sha256': hashlib.sha256((out / 'tests.log').read_bytes()).hexdigest(), 'generated_lock_sha256': lock_hash, 'lock_captured': 'after Cargo execution; no tracked lock assumed', 'diagnostic_only': True}
          (out / 'diagnostic.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          sys.exit(result.returncode)
          PYTHON
      - name: Preserve successes, failures and generated dependency lock
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-main-baseline-${{ github.sha }}
          path: native-main-baseline
          if-no-files-found: error
          retention-days: 30
