name: Binary still diagnostics expected-failure baseline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binary-still-diagnostics-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    name: Frozen binary still controls on pre-fix source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bind unchanged production source and frozen test bytes
        shell: bash
        run: |
          mkdir -p baseline-evidence
          git rev-parse HEAD > baseline-evidence/revision.txt
          git diff --exit-code 45c44a4a84a521b909d49840f86d183f4d78fe06 HEAD -- crates/kerotakis-core/src
          sha256sum crates/kerotakis-core/src/bench.rs crates/kerotakis-core/tests/still_refusal_diagnostics.rs Cargo.toml .github/workflows/chemistry-audit.yml > baseline-evidence/sha256.txt
          cp crates/kerotakis-core/tests/still_refusal_diagnostics.rs baseline-evidence/
          rustc --version > baseline-evidence/toolchain.txt
          cargo --version >> baseline-evidence/toolchain.txt
      - name: Execute expected-failing behavior baseline
        shell: bash
        run: |
          set +e
          cargo test -p kerotakis-core --test still_refusal_diagnostics -j1 -- --test-threads=1 2>&1 | tee baseline-evidence/test.log
          test_status=${PIPESTATUS[0]}
          printf '%s\n' "$test_status" > baseline-evidence/exit-status.txt
          if [[ -f Cargo.lock ]]; then
            sha256sum Cargo.lock > baseline-evidence/generated-lock-sha256.txt
            cp Cargo.lock baseline-evidence/Cargo.lock
          fi
          exit "$test_status"
      - name: Preserve baseline evidence regardless of result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: binary-still-diagnostics-baseline-${{ github.sha }}
          path: baseline-evidence/
          if-no-files-found: error
