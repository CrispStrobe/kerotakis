name: Chemistry audit fleets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-veto-baseline:
    name: Frozen explicit safety-veto baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Record revision and toolchain
        run: |
          mkdir -p safety-veto-baseline
          git rev-parse HEAD > safety-veto-baseline/revision.txt
          git status --short > safety-veto-baseline/git-status-before.txt
          git submodule status > safety-veto-baseline/submodules.txt
          rustc -Vv > safety-veto-baseline/rustc.txt
          cargo -V > safety-veto-baseline/cargo.txt
      - name: Execute unchanged-production baseline and preserve every outcome
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, pathlib, re, subprocess, sys, time
          root = pathlib.Path('.')
          out = pathlib.Path('safety-veto-baseline')
          command = ['cargo', 'test', '-p', 'kerotakis-core', '--test', 'safety_veto_atomicity', '-j1', '--', '--test-threads=1']
          sources = [pathlib.Path(p) for p in subprocess.check_output(['git', 'ls-files', '*Cargo.toml'], text=True).splitlines()]
          sources += [pathlib.Path('crates/kerotakis-core/src/' + name) for name in ['bench.rs', 'vessel.rs', 'solve.rs', 'ops.rs', 'stock.rs', 'lib.rs']]
          sources += [pathlib.Path('crates/kerotakis-core/tests/safety_veto_atomicity.rs'), pathlib.Path('audits/safety-veto-20261008/freeze.json'), pathlib.Path('audits/safety-veto-20261008/FORECASTS.md')]
          hashes = {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in sources}
          (out / 'source-sha256.json').write_text(json.dumps(hashes, indent=2) + '\n')
          (out / 'command.json').write_text(json.dumps(command, indent=2) + '\n')
          started = time.monotonic()
          with (out / 'tests.log').open('wb') as log:
              result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT)
          log_text = (out / 'tests.log').read_text(errors='replace')
          outcomes = [{'test': name, 'outcome': outcome} for name, outcome in re.findall(r'^test (\S+) \.\.\. (ok|FAILED)$', log_text, re.M)]
          (out / 'outcomes.json').write_text(json.dumps(outcomes, indent=2) + '\n')
          # Cargo.lock is generated by Cargo, not tracked at the source revision.
          lock = pathlib.Path('Cargo.lock')
          lock_hash = None
          if lock.exists():
              data = lock.read_bytes()
              (out / 'Cargo.lock').write_bytes(data)
              lock_hash = hashlib.sha256(data).hexdigest()
          receipt = {'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'command': command, 'exit_code': result.returncode, 'seconds': time.monotonic() - started, 'log_sha256': hashlib.sha256((out / 'tests.log').read_bytes()).hexdigest(), 'generated_lock_sha256': lock_hash, 'test_outcome_count': len(outcomes), 'passed': sum(row['outcome'] == 'ok' for row in outcomes), 'failed': sum(row['outcome'] == 'FAILED' for row in outcomes), 'lock_captured': 'after Cargo execution; no tracked lock assumed', 'diagnostic_only': True}
          (out / 'diagnostic.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          sys.exit(result.returncode)
          PYTHON
      - name: Preserve successes, failures and generated dependency lock
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: safety-veto-baseline-${{ github.sha }}
          path: safety-veto-baseline
          if-no-files-found: error
          retention-days: 30
