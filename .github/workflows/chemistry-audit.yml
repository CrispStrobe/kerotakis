      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/workflows
            audits/historical-transaction-amount-controls-20261008
      - uses: actions/checkout@v6
        with:
          ref: audit/historical-transaction-amount-controls-20261008
          path: source
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
      - name: Fetch pinned native prerequisites
        run: bash source/tools/fetch-sundials.sh
      - name: Compile and execute both independently frozen control sets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delta-evidence/harness
          git rev-parse HEAD > delta-evidence/harness/commit.txt
          sha256sum .github/workflows/chemistry-audit.yml audits/historical-transaction-amount-controls-20261008/paired-run-b83be1e9.json > delta-evidence/harness/sha256.txt
          rustc -Vv > delta-evidence/harness/rustc.txt
          cargo -V > delta-evidence/harness/cargo.txt
          for label in baseline repair; do
            pin=$(python3 -c "import json; print(json.load(open('audits/historical-transaction-amount-controls-20261008/paired-run-b83be1e9.json'))['$label'])")
            mkdir -p "delta-evidence/$label"
            git -C source checkout --detach "$pin"
            git -C source rev-parse HEAD > "delta-evidence/$label/source-commit.txt"
            git -C source rev-parse HEAD^{tree} > "delta-evidence/$label/source-tree.txt"
            git -C source status --short > "delta-evidence/$label/status-before.txt"
            git -C source submodule status --recursive > "delta-evidence/$label/submodules.txt"
            sha256sum source/crates/kerotakis-core/tests/solver_transactions.rs > "delta-evidence/$label/fixture-sha256.txt"
            if [[ "$label" = baseline ]]; then (cd source && cargo generate-lockfile); fi
            cp source/Cargo.lock "delta-evidence/$label/Cargo.lock"
            sha256sum source/Cargo.lock | cut -d' ' -f1 > "delta-evidence/$label/generated-lock-sha256.txt"
            set +e
            (cd source && cargo test --locked -p kerotakis-core --test solver_transactions) > "delta-evidence/$label/controls.log" 2>&1
            code=$?
            printf '%s\n' "$code" > "delta-evidence/$label/controls-exit.txt"
            (cd source && cargo test --locked -p kerotakis-core --lib) > "delta-evidence/$label/inherited.log" 2>&1
            inherited_code=$?
            printf '%s\n' "$inherited_code" > "delta-evidence/$label/inherited-exit.txt"
            set -e
          done
          python3 - <<'PY'
          import hashlib,json,pathlib,re
          root=pathlib.Path('delta-evidence')
          forecast=json.loads(pathlib.Path('audits/historical-transaction-amount-controls-20261008/paired-run-b83be1e9.json').read_text())
          rows=[]
          for label in ['baseline','repair']:
            p=root/label
            assert (p/'fixture-sha256.txt').read_text().split()[0]==forecast['fixture_sha256']
            assert (p/'generated-lock-sha256.txt').read_text()==(root/'baseline/generated-lock-sha256.txt').read_text()
            text=(p/'controls.log').read_text()
            passed=re.findall(r'^test (\S+) \.\.\. ok$',text,re.M)
            failed=re.findall(r'^test (\S+) \.\.\. FAILED$',text,re.M)
            code=int((p/'controls-exit.txt').read_text())
            assert len(passed)+len(failed)==38, 'Compile/harness failure is not an observed baseline rejection'
            rows.append(dict(label=label,source=(p/'source-commit.txt').read_text().strip(),exit_code=code,passed=passed,failed=failed,controls_sha256=hashlib.sha256((p/'controls.log').read_bytes()).hexdigest(),inherited_exit=int((p/'inherited-exit.txt').read_text())))
          (root/'results.json').write_text(json.dumps(rows,indent=2)+'\n')
          assert rows[0]['exit_code']!=0 and rows[0]['failed']
          assert rows[1]['exit_code']==0 and len(rows[1]['passed'])==38
          assert all(row['inherited_exit']==0 for row in rows)
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: transaction-state-repaired-${{ github.run_id }}
          path: |
            delta-evidence/
            audits/historical-transaction-amount-controls-20261008/
          retention-days: 30
          if-no-files-found: error



  refusal-transaction-cli-replay:
    name: Replay unchanged hundred cases on refusal compatibility repair
    if: inputs.campaign == 'refusal-transaction-cli-replay'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      KERO_WORKERS: '1'
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@v6
        with:
          path: harness
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          ref: b83be1e96e430232e76a85eb0e5eb28293c30903
          path: source
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
      - name: Fetch native prerequisites
        working-directory: source
        run: bash tools/fetch-sundials.sh
      - name: Build pinned candidate once and bind resolution
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir ../combined-build
          git rev-parse HEAD > ../combined-build/source-commit.txt
          test "$(git rev-parse HEAD)" = b83be1e96e430232e76a85eb0e5eb28293c30903
          git rev-parse HEAD^{tree} > ../combined-build/source-tree.txt
          git status --short > ../combined-build/status-before.txt
          test ! -s ../combined-build/status-before.txt
          git submodule status --recursive > ../combined-build/submodules.txt
          rustc -Vv > ../combined-build/rustc.txt
          cargo -V > ../combined-build/cargo.txt
          git -C ../harness rev-parse HEAD > ../combined-build/harness-commit.txt
          sha256sum ../harness/audits/historical-transaction-amount-controls-20261008/cli-source-b83be1e9.json ../harness/audits/main-cli-replay-20261008/forecast.json ../harness/tools/combined-cli-replay.py ../harness/tools/fifth-independent-50/{run,review_profile}.py ../harness/.github/workflows/chemistry-audit.yml > ../combined-build/harness-sha256.txt
          printf '%s\n' "$RUSTFLAGS" > ../combined-build/rustflags.txt
          printf '%s\n' "$CARGO_PROFILE_RELEASE_STRIP" > ../combined-build/release-strip.txt
          set +e
          /usr/bin/time -v -o ../combined-build/build-time.txt cargo build --release -p kerotakis-cli > ../combined-build/build.log 2>&1
          build_status=$?
          set -e
          printf '%s\n' "$build_status" > ../combined-build/build-exit-code.txt
          if [[ -f Cargo.lock ]]; then cp Cargo.lock ../combined-build/Cargo.lock; fi
          test "$build_status" = 0
          cp target/release/kero ../combined-build/kero
          python3 - <<'BIND'
          import hashlib,json,pathlib
          out=pathlib.Path('../combined-build')
          manifest=json.loads(pathlib.Path('../harness/audits/historical-transaction-amount-controls-20261008/cli-source-b83be1e9.json').read_text())
          assert (out/'source-tree.txt').read_text().strip()==manifest['source_tree']
          row={key:manifest[key] for key in ['compiled_source','source_tree','source_kind']}
          row['binary_sha256']=hashlib.file_digest((out/'kero').open('rb'),'sha256').hexdigest()
          row['generated_lock_sha256']=hashlib.file_digest((out/'Cargo.lock').open('rb'),'sha256').hexdigest()
          (out/'binding.json').write_text(json.dumps(row,indent=2)+'\n')
          BIND
      - name: Execute unchanged disclosed checks and strict stage controls
        run: python3 harness/tools/combined-cli-replay.py --binary combined-build/kero --build-binding combined-build/binding.json --source-manifest harness/audits/historical-transaction-amount-controls-20261008/cli-source-b83be1e9.json --out combined-cli-replay
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: refusal-transaction-cli-replay-${{ github.run_id }}
          path: |
            combined-build/
            combined-cli-replay/
            harness/audits/historical-transaction-amount-controls-20261008/
            harness/audits/main-cli-replay-20261008/
            harness/tools/combined-cli-replay.py
            harness/tools/fifth-independent-50/
          retention-days: 30
          if-no-files-found: error

  titration-admission-baseline:
    name: Frozen titration admission baseline without production edits
    if: inputs.campaign == 'titration-admission-baseline'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      KERO_WORKERS: '1'
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@v6
        with:
          path: harness
      - uses: actions/checkout@v6
        with:
          ref: b83be1e96e430232e76a85eb0e5eb28293c30903
          path: source
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
      - name: Fetch pinned native prerequisites
        run: bash source/tools/fetch-sundials.sh
      - name: Bind unchanged tracked model source and the separately frozen fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir titration-baseline
          git -C harness rev-parse HEAD > titration-baseline/harness-commit.txt
          git -C source rev-parse HEAD > titration-baseline/source-commit.txt
          git -C source rev-parse HEAD^{tree} > titration-baseline/source-tree.txt
          git -C source status --short > titration-baseline/status-before.txt
          test ! -s titration-baseline/status-before.txt
          git -C source submodule status --recursive > titration-baseline/submodules.txt
          sha256sum harness/.github/workflows/chemistry-audit.yml harness/audits/titration-trial-admission-20261009/{freeze.json,titration_trial_admission_contracts.rs} > titration-baseline/harness-sha256.txt
          rustc -Vv > titration-baseline/rustc.txt
          cargo -V > titration-baseline/cargo.txt
          python3 - <<'BIND'
          import hashlib,json,pathlib
          p=pathlib.Path('titration-baseline')
          freeze=json.loads(pathlib.Path('harness/audits/titration-trial-admission-20261009/freeze.json').read_text())
          assert (p/'source-commit.txt').read_text().strip()==freeze['source_observed']
          assert (p/'source-tree.txt').read_text().strip()==freeze['source_tree']
          fixture=pathlib.Path('harness')/freeze['fixture_path']
          assert hashlib.sha256(fixture.read_bytes()).hexdigest()==freeze['fixture_sha256']
          target=pathlib.Path('source')/freeze['intended_test_target']
          assert not target.exists(), 'Do not overwrite an existing fixture'
          target.write_bytes(fixture.read_bytes())
          (p/'fixture.rs').write_bytes(fixture.read_bytes())
          BIND
          git -C source diff --exit-code > titration-baseline/tracked-diff.txt
          git -C source status --short > titration-baseline/status-with-fixture.txt
          (cd source && cargo generate-lockfile)
          cp source/Cargo.lock titration-baseline/Cargo.lock
          sha256sum titration-baseline/Cargo.lock > titration-baseline/lock-sha256.txt
          set +e
          (cd source && cargo test --locked -p kerotakis-core --test titration_trial_admission_contracts) > titration-baseline/controls.log 2>&1
          printf '%s\n' "$?" > titration-baseline/controls-exit.txt
          (cd source && cargo test --locked -p kerotakis-core --lib) > titration-baseline/inherited.log 2>&1
          printf '%s\n' "$?" > titration-baseline/inherited-exit.txt
          set -e
          python3 - <<'RESULT'
          import hashlib,json,pathlib,re
          p=pathlib.Path('titration-baseline')
          freeze=json.loads(pathlib.Path('harness/audits/titration-trial-admission-20261009/freeze.json').read_text())
          text=(p/'controls.log').read_text()
          outcomes=re.findall(r'^test (\S+) \.\.\. (ok|FAILED)$',text,re.M)
          result={'source':freeze['source_observed'],'fixture_sha256':freeze['fixture_sha256'],'exit_code':int((p/'controls-exit.txt').read_text()),'passed':[n for n,r in outcomes if r=='ok'],'failed':[n for n,r in outcomes if r=='FAILED'],'controls_sha256':hashlib.sha256((p/'controls.log').read_bytes()).hexdigest(),'scope':'Baseline named functions only; failed parameter loops may stop early. Not chemistry or complete integration acceptance.'}
          (p/'results.json').write_text(json.dumps(result,indent=2)+'\n')
          assert len(outcomes)==freeze['expected_test_functions']
          assert {n for n,r in outcomes}==set(freeze['functions'])
          assert int((p/'inherited-exit.txt').read_text())==0
          assert re.search(r'test result: ok\. 604 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;', (p/'inherited.log').read_text())
          RESULT
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: titration-admission-baseline-${{ github.run_id }}
          path: |
            titration-baseline/
            harness/audits/titration-trial-admission-20261009/
          retention-days: 30
          if-no-files-found: error
