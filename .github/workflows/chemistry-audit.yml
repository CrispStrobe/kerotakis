name: Ideal still portions expected-failure baseline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ideal-still-portions-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    name: Frozen ideal portion controls on pre-fix source
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bind unchanged production source and frozen test bytes
        shell: bash
        run: |
          mkdir -p baseline-evidence
          git rev-parse HEAD > baseline-evidence/revision.txt
          git diff --exit-code a1685e9d777d6745b62868bb21b2edeecec78c01 HEAD -- crates/kerotakis-core/src crates/kerotakis-thermo/src
          sha256sum crates/kerotakis-core/src/volatility.rs crates/kerotakis-core/src/bench.rs crates/kerotakis-core/tests/ideal_still_portion_validation.rs crates/kerotakis-thermo/src/batch.rs audits/ideal-still-diagnostics-20261008/original-batch.rs.txt Cargo.toml crates/kerotakis-core/Cargo.toml crates/kerotakis-thermo/Cargo.toml .github/workflows/chemistry-audit.yml > baseline-evidence/sha256.txt
          cp crates/kerotakis-core/tests/ideal_still_portion_validation.rs baseline-evidence/
          rustc --version > baseline-evidence/toolchain.txt
          cargo --version >> baseline-evidence/toolchain.txt
      - name: Execute expected-failing behavior baseline
        shell: bash
        run: |
          set +e
          cargo test -p kerotakis-core --test ideal_still_portion_validation -j1 -- --test-threads=1 2>&1 | tee baseline-evidence/test.log
          test_status=${PIPESTATUS[0]}
          printf '%s\n' "$test_status" > baseline-evidence/exit-status.txt
          if [[ -f Cargo.lock ]]; then
            sha256sum Cargo.lock > baseline-evidence/generated-lock-sha256.txt
            cp Cargo.lock baseline-evidence/Cargo.lock
          fi
          exit "$test_status"
      - name: Preserve baseline evidence regardless of result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ideal-still-portions-baseline-${{ github.sha }}
          path: baseline-evidence/
          if-no-files-found: error
