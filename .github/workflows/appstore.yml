# macOS and iOS to App Store Connect.
#
# The build logic is NOT here. `tools/build-macos-appstore.sh` and
# `tools/build-ios-appstore.sh` do the work, so the same commands that run
# on a laptop run on the runner, and a failure can be reproduced without
# GitHub. This file is the runner's half: secrets into a keychain, and a
# trigger that cannot upload by accident.
#
# `workflow_dispatch` defaults to a dry run — build, sign, verify, upload
# the artifacts to the workflow, and never speak to Apple. Only a `v*` tag
# uploads. The default matters: an upload cannot be undone, and a build
# number cannot be reused.
name: App Store

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and sign, but do not upload to App Store Connect"
        type: boolean
        default: true
      platforms:
        description: "Which to build"
        type: choice
        options: [both, macos, ios]
        default: both

env:
  CARGO_TERM_COLOR: always
  # Read by tools/asc/client.py, so the .p8 never touches the filesystem.
  ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
  ASC_TEAM_ID: ${{ secrets.ASC_TEAM_ID }}

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [macos, ios]
    steps:
      - name: Is this platform selected?
        id: gate
        run: |
          want='${{ github.event.inputs.platforms || 'both' }}'
          if [ "$want" = "both" ] || [ "$want" = "${{ matrix.platform }}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.run == 'true'
        with:
          targets: ${{ matrix.platform == 'ios' && 'aarch64-apple-ios' || 'aarch64-apple-darwin,x86_64-apple-darwin' }}
      - uses: Swatinem/rust-cache@v2
        if: steps.gate.outputs.run == 'true'
        with:
          workspaces: web/app/src-tauri
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/app/package-lock.json

      - name: Install the app's dependencies
        if: steps.gate.outputs.run == 'true'
        working-directory: web/app
        run: npm ci --no-audit --no-fund

      # One keychain, created here, on the search list for the WHOLE job.
      #
      # A tool's own convenience import (tauri-action's APPLE_CERTIFICATE and
      # friends) creates a keychain scoped to one step: it signs the .app and
      # then productbuild, needing the Installer identity in a later step,
      # cannot find it. Worse, two keychains holding an identically-named
      # identity make `codesign -s "<name>"` ambiguous and fail outright —
      # which is also why tools/asc/resolve-identity.py matches on
      # fingerprint against what App Store Connect says is live, never on the
      # name.
      - name: Import the signing certificates
        if: steps.gate.outputs.run == 'true'
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/kerotakis.keychain-db"
          PASSWORD="$(uuidgen)"
          security create-keychain -p "$PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN"
          printf %s "$DIST_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" \
            -P "$DIST_CERT_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/productbuild
          rm -f "$RUNNER_TEMP/dist.p12"
          # Append, never replace: the system roots have to stay reachable.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,productsign: -s -k "$PASSWORD" "$KEYCHAIN"
          security find-identity -v | sed 's/^/   /'

      - name: Build, sign and verify — macOS
        if: steps.gate.outputs.run == 'true' && matrix.platform == 'macos'
        env:
          ASC_PROFILE_BASE64: ${{ secrets.MAC_PROFILE_BASE64 }}
        run: tools/build-macos-appstore.sh --no-upload

      - name: Build, sign and verify — iOS
        if: steps.gate.outputs.run == 'true' && matrix.platform == 'ios'
        env:
          ASC_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: tools/build-ios-appstore.sh --no-upload

      # A .pkg that renders a blank window signs, validates and uploads
      # perfectly. Launching it is the only check that catches that, and it
      # is cheap. macOS only: an .ipa cannot be run on the runner.
      - name: Prove the Mac app is not a blank window
        if: steps.gate.outputs.run == 'true' && matrix.platform == 'macos'
        run: tools/run-macos-local.sh

      - name: Collect the artifact
        if: steps.gate.outputs.run == 'true'
        id: artifact
        run: |
          set -euo pipefail
          mkdir -p out
          TARGET_DIR="$(cargo metadata --format-version 1 --no-deps \
            --manifest-path web/app/src-tauri/Cargo.toml \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["target_directory"])')"
          if [ "${{ matrix.platform }}" = "macos" ]; then
            find "$TARGET_DIR" -name '*.pkg' -exec cp {} out/ \;
          else
            find web/app/src-tauri/gen/apple/build/export -name '*.ipa' -exec cp {} out/ \;
          fi
          ls -lh out
          echo "path=$(ls out/* | head -1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: kerotakis-${{ matrix.platform }}-appstore
          path: out/*
          if-no-files-found: error

      # Only on a tag. upload.py reads every version out of the artifact and
      # parses altool's JSON, because altool exits 0 on a failed upload.
      - name: Upload to App Store Connect
        if: steps.gate.outputs.run == 'true' && startsWith(github.ref, 'refs/tags/v')
        run: python3 tools/asc/upload.py "${{ steps.artifact.outputs.path }}"

  testflight:
    name: TestFlight
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Processing is 15-60 minutes and a build is not assignable to any
      # group until it reports VALID, so this does not chase it. Run
      # tools/asc/testflight.py when it is ready; it is idempotent.
      - name: What to do next
        run: |
          echo "Uploaded. Once App Store Connect reports the build VALID:"
          echo "  python3 tools/asc/testflight.py ios"
          echo "  python3 tools/asc/testflight.py macos"
          echo "Both are idempotent and re-read the submission afterwards,"
          echo "because a 201 from betaAppReviewSubmissions is not proof."
