# Android: APK for sideloading, AAB for Play.
#
# The Android project is generated, not committed — same as iOS. Tauri
# writes `src-tauri/gen/android` from `tauri.conf.json`, and keeping it out
# of the tree means there is one source of truth for the identifier, the
# version and the icons.
#
# The engine is native here too: IPhreeqc's C++ is cross-compiled for each
# ABI by the NDK, which is the part most likely to break first and the
# reason this job is not `continue-on-error`.
#
# Signing is conditional on the secrets existing. Without them the build
# still runs and produces an unsigned APK, so the pipeline is verifiable
# before anyone creates a keystore — but `release: true` refuses to pretend.
name: Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Require signing and produce an AAB for Play"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  ANDROID_NDK_VERSION: "27.1.12297006"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' && (github.event_name == 'push' || github.event_name == 'pull_request') }}

jobs:
  build:
    name: Android
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;${{ env.ANDROID_NDK_VERSION }}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Every ABI Play expects from a native app. armv7 and x86 are
          # cheap to add and expensive to add later: an AAB missing an ABI
          # simply will not install on those devices.
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/app/src-tauri
          key: ndk-${{ env.ANDROID_NDK_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/app/package-lock.json

      # `tauri android build` runs beforeBuildCommand (`npm run build:shell`),
      # whose payload tools import `tomllib` — Python 3.11+. ubuntu-22.04's
      # system python3 is 3.10; v0.1.7's first Android release died on exactly
      # that. tools/payload-toolchain-lint.py now follows the mobile builds too.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the app's dependencies
        working-directory: web/app
        run: npm ci --no-audit --no-fund

      - name: Point the build at the NDK
        run: |
          # pipefail: a failing `ls` leaves NDK empty while the pipe still
          # exits 0, pointing the build at nothing.
          set -o pipefail
          # Pin the NDK this job installs instead of "newest on the image":
          # the runner also preinstalls 27.3 and 30.x and points
          # ANDROID_NDK_ROOT at one of them, and a toolchain file and compiler
          # from different NDKs broke the cached iphreeqc CMake build
          # (run 44940860924). One NDK, named in every variable and the cache key.
          NDK="$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION"
          test -d "$NDK"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$NDK" >> "$GITHUB_ENV"
          echo "   $NDK"

      - name: Generate the Android project
        working-directory: web/app
        run: npx tauri android init --ci

      # Kerotakis asks for nothing: no network, no storage, no camera. Tauri's
      # default manifest is already minimal, and this asserts it stays that
      # way — a permission that creeps in is a Play review question, and
      # `usesCleartextTraffic` in particular is flagged by their security
      # scan.
      - name: The manifest must stay permissionless
        run: |
          MANIFEST=web/app/src-tauri/gen/android/app/src/main/AndroidManifest.xml
          echo "== $MANIFEST"
          cat "$MANIFEST"
          if grep -q 'usesCleartextTraffic="true"' "$MANIFEST"; then
            echo "::error::cleartext traffic is enabled; Play's security review flags this"
            exit 1
          fi
          for perm in CAMERA RECORD_AUDIO ACCESS_FINE_LOCATION READ_EXTERNAL_STORAGE; do
            if grep -q "android.permission.$perm" "$MANIFEST"; then
              echo "::error::the app declares $perm, which it does not use"
              exit 1
            fi
          done

      - name: Signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "${{ github.event.inputs.release }}" = "true" ] \
               || [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
              echo "::error::a release was asked for but ANDROID_KEYSTORE_BASE64 is not set"
              echo "::error::create one with: keytool -genkey -v -keystore kerotakis.jks \\"
              echo "::error::  -keyalg RSA -keysize 2048 -validity 10000 -alias kerotakis"
              exit 1
            fi
            echo "   no keystore secret; building unsigned"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYSTORE="$RUNNER_TEMP/kerotakis.jks"
          printf %s "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          # Gradle reads this file; the path must be absolute because the
          # build runs from the generated project's own directory.
          cat > web/app/src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$KEYSTORE
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          password=$KEY_PASSWORD
          EOF
          # `tauri android init` generates a build.gradle.kts that never reads
          # keystore.properties, so without this the "signed" build ships
          # app-universal-release-unsigned.apk and an unsigned AAB — which is
          # exactly what v0.1.7's first signed dispatch produced. Gradle's
          # Kotlin DSL accepts a second `android {}` block, so appending one
          # does not depend on the generated template's layout.
          GRADLE=web/app/src-tauri/gen/android/app/build.gradle.kts
          test -f "$GRADLE"
          cat >> "$GRADLE" <<'KTS'

          // Added by .github/workflows/android.yml: release signing.
          android {
              signingConfigs {
                  create("release") {
                      val props = java.util.Properties()
                      java.io.FileInputStream(rootProject.file("keystore.properties")).use { props.load(it) }
                      storeFile = file(props.getProperty("storeFile"))
                      storePassword = props.getProperty("storePassword")
                      keyAlias = props.getProperty("keyAlias")
                      keyPassword = props.getProperty("password")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
          }
          KTS
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: web/app
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            npx tauri android build --aab --apk
          else
            npx tauri android build --apk
          fi

      - name: Collect what was built
        run: |
          mkdir -p out
          # pipefail: if `find` fails nothing is copied, and `ls -lh out`
          # prints an empty directory without complaint.
          set -o pipefail
          find web/app/src-tauri/gen/android -name '*.apk' -o -name '*.aab' \
            | grep -v intermediates | while read -r f; do cp "$f" out/; done
          ls -lh out

      # A signed build must be signed by the Kerotakis release key and by
      # nothing else; an `-unsigned` file name or a different certificate is
      # a failure, not a warning. The expected SHA-256 lives in the
      # repository variable ANDROID_RELEASE_CERT_SHA256 (not secret).
      - name: Verify the release signature
        if: steps.signing.outputs.signed == 'true'
        env:
          EXPECTED: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED" ]; then
            echo "::error::ANDROID_RELEASE_CERT_SHA256 is not set"; exit 1
          fi
          want=$(printf %s "$EXPECTED" | tr -d ': ' | tr 'A-F' 'a-f')
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          shopt -s nullglob
          apks=(out/*.apk); aabs=(out/*.aab)
          if [ ${#apks[@]} -eq 0 ] || [ ${#aabs[@]} -eq 0 ]; then
            echo "::error::expected both an APK and an AAB"; exit 1
          fi
          for f in "${apks[@]}" "${aabs[@]}"; do
            case "$f" in *unsigned*) echo "::error::$f is unsigned"; exit 1;; esac
          done
          for f in "${apks[@]}"; do
            "$APKSIGNER" verify --verbose "$f" > /dev/null
            got=$("$APKSIGNER" verify --print-certs "$f" \
                  | sed -n 's/.*certificate SHA-256 digest: //p' | sort -u)
            [ "$got" = "$want" ] || { echo "::error::$f signed by $got"; exit 1; }
            echo "   $f: $got"
          done
          for f in "${aabs[@]}"; do
            jarsigner -verify "$f" > /dev/null
            got=$(keytool -printcert -jarfile "$f" \
                  | sed -n 's/.*SHA256: //p' | tr -d ': ' | tr 'A-F' 'a-f' | sort -u)
            [ "$got" = "$want" ] || { echo "::error::$f signed by $got"; exit 1; }
            echo "   $f: $got"
          done

      - uses: actions/upload-artifact@v6
        with:
          name: kerotakis-android
          path: out/*
          if-no-files-found: error

      # Play upload is deliberately not automated here. It needs a service
      # account with Play Console access, a track decision (internal /
      # closed / production), and a first release that Google requires be
      # made by hand. Wiring it before any of that exists would be a step
      # that looks done and is not.
      - name: What is not automated
        if: steps.signing.outputs.signed == 'true'
        run: |
          echo "Signed artifacts are attached to this run."
          echo "Play upload is manual: the first release of an app must be"
          echo "created in the Play Console by hand, and automating later"
          echo "uploads needs a service-account JSON this repo does not have."
