# The `kero` binary, downloadable.
#
# The workspace does not build on every machine that works on it — the
# aqueous stack pulls in IPhreeqc and SUNDIALS, and a box with a gigabyte
# of RAM free cannot compile it at all. That made one ordinary thing
# impossible: running a script through the CLI to see what it answers.
# The engine could be exercised in a browser, which is the same core but
# not the same host, and a claim about `kero` has to come from `kero`.
#
# Dispatch-only and deliberately not a gate: it builds nothing CI does
# not already build, it just keeps the result.
name: The kero CLI, as a binary

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "cargo profile"
        default: "release"
        type: choice
        options: [release, debug]

jobs:
  build:
    name: Build kero (${{ inputs.profile }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch SUNDIALS (not vendored; pinned by checksum)
        run: bash tools/fetch-sundials.sh
      - name: Build
        run: |
          if [ "${{ inputs.profile }}" = "release" ]; then
            cargo build -p kerotakis-cli --release
            echo "KERO=target/release/kero" >> "$GITHUB_ENV"
          else
            cargo build -p kerotakis-cli
            echo "KERO=target/debug/kero" >> "$GITHUB_ENV"
          fi
      - name: It runs, reads its own registry, and answers in every language
        run: |
          "$KERO" species | head -5
          printf 'add v1 water 100mL\nlook v1\n' > "$RUNNER_TEMP/smoke.lab"
          # Every shipped language, read off the catalogue directory: a
          # binary that cannot answer in one of them is exactly the kind
          # of thing this artifact exists to find.
          for toml in crates/kerotakis-core/i18n/*.toml; do
            code=$(basename "$toml" .toml)
            echo "== $code"
            "$KERO" run "$RUNNER_TEMP/smoke.lab" --lang "$code"
          done
      - uses: actions/upload-artifact@v6
        with:
          name: kero-${{ inputs.profile }}-${{ github.sha }}
          path: ${{ env.KERO }}
          retention-days: 7
          if-no-files-found: error
