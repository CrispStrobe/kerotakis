name: Saved fleet receipt and aggregate closure
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  review:
    name: Inspect raw saved receipts and close remaining aggregates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check resources before source checkout
        run: |
          python3 - <<'PYGATE'
          import os, pathlib, shutil, json
          memory=int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))//1024
          resources=dict(load1=os.getloadavg()[0],available_memory_mib=memory,evidence_disk_free_mib=shutil.disk_usage('.').free//1048576)
          print('PRECHECKOUT_RESOURCES_JSON='+json.dumps(resources),flush=True)
          assert resources['load1']<=3.5 and memory>=3200 and resources['evidence_disk_free_mib']>=8192
          PYGATE
      - uses: actions/checkout@v6
        with:
          path: audit
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: d06ffe3a1740728656878c4aea0e9507ca83c808
          path: candidate-source
          persist-credentials: false
          submodules: false
      - name: Independently inspect saved raw outputs and compare actual aggregates
        run: python3 -B audit/audits/release-performance-20261013/review-hosted-fleet-evidence.py --source candidate-source --audit audit --out hosted-fleet-evidence
      - name: Preserve raw successes, partial checkpoints and failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hosted-fleet-closure-${{ github.run_id }}-${{ github.run_attempt }}
          path: hosted-fleet-evidence
          if-no-files-found: warn
          retention-days: 14
