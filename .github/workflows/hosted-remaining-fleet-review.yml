name: Remaining saved fleet review
on:
  workflow_call:
permissions:
  contents: read
  actions: read
jobs:
  review:
    name: Recompute remaining 390 saved cases without CLI or build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check resources before source checkout
        run: |
          python3 - <<'PYGATE'
          import os, pathlib, shutil
          memory=int(next(x.split()[1] for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:')))//1024
          assert os.getloadavg()[0]<=3.5 and memory>=3200 and shutil.disk_usage('.').free//1048576>=8192
          PYGATE
      - uses: actions/checkout@v6
        with:
          path: audit
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: d06ffe3a1740728656878c4aea0e9507ca83c808
          path: candidate-source
          persist-credentials: false
          submodules: false
      - name: Recompute frozen saved outputs and retain prior acceptance
        run: python3 -B audit/audits/release-performance-20261013/review-remaining-fleets.py --source candidate-source --audit audit --out remaining-fleet-evidence
      - name: Preserve raw successes, partial checkpoints and failures
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: remaining-fleet-saved-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: remaining-fleet-evidence
          if-no-files-found: warn
          retention-days: 14
