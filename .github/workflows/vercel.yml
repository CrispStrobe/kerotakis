# ISOLATED VALIDATION ONLY. Never merge this workflow/ref into main.
name: Vercel (isolated native201 screen)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: new201-native-c446-20261016
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 4a277d66be235647116b797255c6f01ed5072800
          persist-credentials: false
          sparse-checkout: audits/new-experiments-201-20261016
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the pinned accepted production artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/CrispStrobe/kerotakis/actions/artifacts/12033256299/zip > "$RUNNER_TEMP/native.zip"
          python3 - <<'VERIFY'
          import hashlib, os, pathlib, zipfile
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native.zip'
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '14abc84c3b0f4ec6647582c4ed951ec77ef82c7a16b4d4aae29cc6bc6152dc9c'
          with zipfile.ZipFile(p) as archive:
              assert all(not pathlib.PurePosixPath(n).is_absolute() and '..' not in pathlib.PurePosixPath(n).parts for n in archive.namelist())
              archive.extractall(p.parent / 'native')
          VERIFY
      - name: Execute all201 frozen protocols once without rebuilding
        run: |
          python3 audits/new-experiments-201-20261016/hosted_native_screen.py \
            --artifact "$RUNNER_TEMP/native" --out "$RUNNER_TEMP/new201"
      - name: Preserve every first result and binding
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: new201-native-${{ github.run_id }}
          path: ${{ runner.temp }}/new201
          if-no-files-found: error
