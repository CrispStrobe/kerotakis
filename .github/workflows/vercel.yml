# ISOLATED VALIDATION REF ONLY. Never merge this workflow replacement.
name: REST live browser verification (isolated)
on:
  workflow_dispatch:
    inputs:
      target:
        description: Compatibility input; this validation ref never deploys
        type: choice
        options: [preview, production]
        default: preview
permissions:
  contents: read
jobs:
  live-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install the repository-pinned browser version
        run: |
          mkdir -p "$RUNNER_TEMP/rest-browser" "$RUNNER_TEMP/browser-evidence"
          cd "$RUNNER_TEMP/rest-browser"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund --save-exact @playwright/test@1.62.1
          npx playwright install --with-deps chromium
          cp "$GITHUB_WORKSPACE/audits/live-rest-browser-20261018/live-client.mjs" .
      - name: Observe actual clients, live CORS and labelled UI fixtures
        env:
          BROWSER_REPORT_DIR: ${{ runner.temp }}/browser-evidence
        run: node "$RUNNER_TEMP/rest-browser/live-client.mjs"
      - name: Preserve first browser results even after failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: live-rest-browser-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/browser-evidence
            ${{ runner.temp }}/rest-browser/package-lock.json
            audits/live-rest-browser-20261018/release-binding.json
          if-no-files-found: error
          retention-days: 14
