# ISOLATED VALIDATION REF ONLY. NEVER MERGE. No deployment or rebuild exists here.
name: Isolated unchanged F12 endpoint replay
on:
  workflow_dispatch:
    inputs:
      replay:
        description: Exactly one unchanged original F12 process; no deployment
        type: choice
        options: [original-f12-once]
        default: original-f12-once
permissions:
  contents: read
  actions: read
concurrency:
  group: isolated-original-f12-producer-38863384507
  cancel-in-progress: false
jobs:
  isolated-f12-replay:
    name: Authenticate existing CLI and collect unchanged original F12 once
    if: inputs.replay == 'original-f12-once'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/vercel.yml
            audits/reaction-dataset-200-20261015/acid-endpoint-f12-replay-20261016
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify producer archive, executable, lock and source before the one child process
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 audits/reaction-dataset-200-20261015/acid-endpoint-f12-replay-20261016/run.py --out "$RUNNER_TEMP/acid-f12-evidence"
      - name: Preserve authentication, actual lock bytes and first raw outcome
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: isolated-original-f12-replay-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/acid-f12-evidence/
            audits/reaction-dataset-200-20261015/acid-endpoint-f12-replay-20261016/
            .github/workflows/vercel.yml
          retention-days: 30
          if-no-files-found: error
