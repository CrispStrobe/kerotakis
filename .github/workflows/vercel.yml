# The web payload to Vercel, on purpose and never by accident.
#
# Pages is the live deploy and it happens on every merge to main; this is
# the second host, and it has never been wired. `web/vercel.json` has
# always been here — immutable caching for the hashed assets, nosniff for
# everything else — but nothing ever sent Vercel a build.
#
# Dispatch-only, and it uploads a PREBUILT payload: the same
# `tools/build-web.sh` output Pages serves, so the two hosts cannot drift
# into being two different builds. Vercel runs nothing.
name: Vercel

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which deployment"
        type: choice
        options: [preview, production]
        default: preview

jobs:
  deploy:
    name: Deploy the web payload (${{ inputs.target }})
    runs-on: ubuntu-latest
    # Without a token this job cannot do anything, and saying so here is
    # better than a 401 forty lines into a build.
    steps:
      - name: A token has to exist
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::VERCEL_TOKEN is not set. Add it in Settings → Secrets → Actions."
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      # tools/build-web.sh compiles kerotakis-wasm for the browser, so the
      # target has to be installed and wasm-bindgen has to exist. Neither was
      # here, and this workflow had never been run, so nothing said so:
      #
      #   error: the `wasm32-unknown-unknown` target may not be installed
      #
      # The wasm-bindgen CLI version is pinned to the crate version in
      # Cargo.lock, as every other wasm job in ci.yml does — a mismatch between
      # the two fails at bindgen time with a version error, not at build time.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.127
      - name: Fetch SUNDIALS (not vendored; pinned by checksum)
        run: bash tools/fetch-sundials.sh
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      # tools/build-web.sh reaches tools/build-shell-payload.sh, which needs
      # tomllib — Python 3.11 and newer. Pinned rather than inherited so a
      # change of runner image cannot break the deploy.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the same payload Pages serves
        run: bash tools/build-web.sh "$RUNNER_TEMP/site"
      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # pipefail is not optional here. Piping the CLI into `tee` hands the
          # step tee's exit status, and this deploy has already failed once
          # while reporting success:
          #
          #   Error: The "--prebuilt" option was used, but no prebuilt output
          #          found in ".vercel/output".
          #
          # `--prebuilt=false` is what caused that. The flag is boolean, so
          # `=false` still switches it ON, and a deploy that uploads sources
          # never writes .vercel/output. Dropping it is the fix; the default
          # is exactly the non-prebuilt upload this wants.
          set -euo pipefail
          cp web/vercel.json "$RUNNER_TEMP/site/vercel.json"
          npx --yes vercel@latest deploy "$RUNNER_TEMP/site" \
            --yes --token "$VERCEL_TOKEN" \
            ${{ inputs.target == 'production' && '--prod' || '' }} \
            | tee "$RUNNER_TEMP/url.txt"
          # Belt and braces, for the same reason tools/deploy-vercel.sh does
          # it: the CLI has exited 0 while printing "Error:" before now.
          if grep -q '^Error:' "$RUNNER_TEMP/url.txt"; then
            echo "::error::the Vercel CLI reported an error but exited 0"
            exit 1
          fi
          url="$(grep -Eo 'https://[a-z0-9.-]+\.vercel\.app' "$RUNNER_TEMP/url.txt" | tail -1)"
          [ -n "$url" ] || { echo "::error::no deployment URL in the output"; exit 1; }
          echo "### Deployed"  >> "$GITHUB_STEP_SUMMARY"
          echo "\`$url\`"      >> "$GITHUB_STEP_SUMMARY"
